<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zimr — examples (code-pane prototype)</title>
<style>
:root{
  /* two surfaces, one ink */
  --bg:#0a0a0a;          /* the page */
  --panel:#141414;       /* anything set apart: code, callout, device side */
  --panel-2:#1b1b1b;     /* a panel on a panel (figcaption, summary) */
  --fg:#e8e8e8;          /* body text */
  --dim:#9aa0a8;         /* secondary text, captions */
  --faint:#6b7280;       /* labels, line numbers, table headers */
  --rule:#262626;        /* every border in the document */
  --link:#82d8ef;
  /* tokens — the one set, shared by the Zig and WGSL highlighters */
  --tok-comment:#6b7a8c;
  --tok-kw:#c792ea;
  --tok-fn:#82d8ef;
  --tok-str:#9ad08a;
  --tok-num:#f5a35e;
  --tok-type:#6fb6ff;
  --tok-builtin:#e9a23b;
  /* one font: mono, from whatever ships on the device. No download. */
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --maxw:860px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0 auto;padding:2.2rem 1.1rem 6rem;max-width:var(--maxw);
  background:var(--bg);color:var(--fg);
  font-family:var(--mono);font-size:15px;line-height:1.65;
}
h1,h2,h3,h4{font-family:var(--mono);font-weight:700;line-height:1.25;margin:2.2em 0 .7em;}
h1{font-size:1.6rem;margin-top:0;}
h2{font-size:1.25rem;border-bottom:1px solid var(--rule);padding-bottom:.35em;}
h3{font-size:1.05rem;}
h4{font-size:.95rem;color:var(--dim);}
p{margin:0 0 1.1em;}
a{color:var(--link);text-decoration:none;border-bottom:1px solid var(--rule);}
a:hover{border-bottom-color:var(--link);}
strong,b{color:#fff;font-weight:700;}
em,i{color:var(--dim);font-style:italic;}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0;}
small,.dim{color:var(--dim);font-size:.87em;}
.faint{color:var(--faint);}
ul,ol{margin:0 0 1.1em;padding-left:1.5em;}
li{margin:.3em 0;}
blockquote{margin:1.2em 0;padding:.1em 0 .1em 1em;border-left:2px solid var(--rule);color:var(--dim);}
/* code */
pre{
  margin:1.1em 0;padding:14px 16px;background:var(--panel);
  border:1px solid var(--rule);border-radius:3px;
  overflow-x:auto;font-size:13px;line-height:1.6;
}
pre,code,kbd,samp{font-family:var(--mono);}
pre code{background:none;padding:0;border:0;font-size:inherit;color:var(--fg);}
code{background:var(--panel);padding:.1em .35em;border-radius:2px;font-size:.92em;color:#fff;}
.tok-comment{color:var(--tok-comment);font-style:italic;}
.tok-kw{color:var(--tok-kw);}
.tok-fn{color:var(--tok-fn);}
.tok-str{color:var(--tok-str);}
.tok-num{color:var(--tok-num);}
.tok-type{color:var(--tok-type);}
.tok-builtin{color:var(--tok-builtin);}
/* a captioned code block: <figure class="code"><figcaption>… */
figure{margin:1.3em 0;}
figure.code{margin:1.3em 0;}
figure.code figcaption{
  background:var(--panel-2);border:1px solid var(--rule);border-bottom:0;
  border-radius:3px 3px 0 0;padding:6px 12px;font-size:11.5px;color:var(--faint);
  display:flex;justify-content:space-between;gap:1em;
}
figure.code figcaption .lang{color:var(--dim);text-transform:uppercase;letter-spacing:.16em;}
figure.code pre{margin:0;border-radius:0 0 3px 3px;}
/* folds — pure CSS, no JS. The summary text is just the name; the prose
   comes from ::before, which is zimrnum-tutorial's trick and a good one. */
details{border:1px solid var(--rule);border-radius:3px;margin:.5em 0;background:var(--panel);}
details[open]{background:var(--bg);}
summary{
  cursor:pointer;padding:.4em .8em;color:var(--dim);font-size:.9em;
  list-style:none;user-select:none;
}
summary::-webkit-details-marker{display:none;}
summary::before{content:"\\25b8\\00a0";color:var(--faint);}
details[open]>summary::before{content:"\\25be\\00a0";}
summary:hover{color:var(--fg);}
details>pre{margin:0;border:0;border-top:1px solid var(--rule);border-radius:0;}
.src-fold>summary::after{content:" \\2014 source";color:var(--faint);}
/* callouts — one box, a coloured left rule says which kind */
.note,.warn,.good,.bad{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left-width:3px;border-radius:3px;
}
.note{border-left-color:var(--tok-fn);}
.warn{border-left-color:var(--tok-builtin);}
.good{border-left-color:var(--tok-str);}
.bad{border-left-color:#e0555f;}
/* tables */
table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:13px;}
th,td{border:1px solid var(--rule);padding:.45em .7em;text-align:left;vertical-align:top;}
th{color:var(--faint);font-weight:700;background:var(--panel);}
/* the CPU/GPU split: two surfaces, same two colours as everything else */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:1.3em 0;}
.split>*{min-width:0;}
.split-cpu,.split-gpu{border:1px solid var(--rule);border-radius:3px;padding:2px;}
.split-cpu{background:var(--bg);}
.split-gpu{background:var(--panel);}
.split-cpu>pre,.split-gpu>pre{margin:0;border:0;background:none;}
.split h4,.split .lab{
  margin:.2em 0 .4em;padding:4px 10px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--rule);
}
@media(max-width:700px){.split{grid-template-columns:1fr;}}
/* media */
img,svg,canvas,video{max-width:100%;height:auto;}
iframe{max-width:100%;border:1px solid var(--rule);border-radius:3px;background:#000;}
/* a live demo embedded in a page: the full column, 16:9. Without a size the
   frame is the browser default 300x150 and the app boots that small. */
.demo-embed{margin:1.6em 0;}
.demo-embed iframe{display:block;width:100%;aspect-ratio:16/9;}
.demo-embed figcaption{color:var(--dim);font-size:.9em;margin-top:.5em;}
/* Inline marks the pages already use, mapped onto the SAME token colours
   rather than given colours of their own — cheatsheet's signature rows,
   the reference tables, and the two semantic marks that carry teaching
   weight in shader-authoring (`hazard` = the hand-counted integer, and the
   old/new path contrast). One palette, reused. */
.sig{margin:1.2em 0 .2em;padding-top:.8em;border-top:1px solid var(--rule);}
.k{color:var(--tok-kw);}
.nm{color:var(--tok-fn);font-weight:700;}
.ns{color:var(--faint);}
.eq{color:var(--dim);}
.doc{color:var(--dim);margin:.2em 0 .6em;}
.num,.n{color:var(--tok-num);}
.host,.lab,.lang,.path,.tag,.stage,.sec-num,.lesson-num{
  color:var(--faint);font-size:.85em;letter-spacing:.12em;text-transform:uppercase;
}
.anchor{border:0;color:var(--faint);opacity:0;padding-left:.4em;}
h1:hover .anchor,h2:hover .anchor,h3:hover .anchor{opacity:1;}
.chip{
  display:inline-block;padding:.05em .5em;margin:0 .15em;border:1px solid var(--rule);
  border-radius:2px;color:var(--dim);font-size:.82em;
}
.chip.on{color:var(--fg);border-color:var(--tok-fn);}
.hazard{color:#e0555f;font-weight:700;}
.hl-old{color:var(--tok-builtin);}
.hl-new{color:var(--tok-fn);}
.yes,.good-mark{color:var(--tok-str);}
.callout{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-fn);border-radius:3px;
}
.zn-source{margin:.6em 0 1.4em;}
.lesson{margin:2em 0;}
.lesson-title{font-weight:700;color:#fff;}
.lesson-goal{color:var(--dim);}
/* page furniture: the landing page and the tutorials' own scaffolding */
.blog-container,.wrap,.max{max-width:var(--maxw);margin:0 auto;}
.title{font-size:1.8rem;margin:0 0 .2em;}
.subtitle,.lede,.sub{
  border:0;font-size:1rem;font-weight:400;color:var(--dim);
  margin:0 0 1.6em;line-height:1.6;
}
.eyebrow{color:var(--faint);font-size:.85em;letter-spacing:.14em;text-transform:uppercase;}
.toplinks{
  display:flex;flex-wrap:wrap;gap:.1em 1.1em;margin:0 0 2em;
  padding:.9em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:.88em;
}
.toplinks a{border:0;color:var(--dim);}
.toplinks a:hover,.toplinks a.offsite{color:var(--link);}
.wip-warning{
  margin:0 0 2em;padding:.8em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-builtin);border-radius:3px;
  color:var(--dim);font-size:.9em;
}
.wip-warning strong{display:block;color:var(--tok-builtin);margin-bottom:.2em;}
/* cheatsheet: one declaration per .fn row */
.fn{margin:1.1em 0;}
.what,.body{color:var(--dim);}
.sketch{color:var(--dim);}
.pane{border:1px solid var(--rule);border-radius:3px;margin:1.1em 0;}
.pane-head{
  padding:5px 11px;background:var(--panel-2);border-bottom:1px solid var(--rule);
  color:var(--faint);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
}
.cell{padding:.5em .8em;}
.swatch{display:inline-block;width:.9em;height:.9em;border:1px solid var(--rule);vertical-align:-1px;}
.old,.meh{color:var(--tok-builtin);}
.new,.win{color:var(--tok-str);}
.crit{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid #e0555f;border-radius:3px;
}
/* The examples gallery (index.html): the list of examples on the left, the
   selected one running in a frame that fills the rest. On a phone the list
   is a drawer over the example, under the bar. `list-open` shows the list. */
body.gallery{
  max-width:none;margin:0;padding:0;height:100vh;height:100dvh;overflow:hidden;
  display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);
  color-scheme:dark;
}
body.gallery.list-open{grid-template-columns:minmax(240px,25%) 1fr;}
.gallery a{border:0;}
.g-side{display:none;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--rule);}
.list-open .g-side{display:flex;}
.g-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 1em;padding:.7em 1em .6em;font-size:.85em;}
.g-head a{color:var(--dim);}
.g-head a:hover{color:var(--link);}
.g-head .g-logo{margin-right:auto;font-size:1.1rem;font-weight:700;color:var(--fg);white-space:nowrap;}
.g-filters{display:flex;flex-wrap:wrap;gap:.4em;padding:0 1em;}
.g-filters input,.g-filters select{
  min-width:0;padding:.35em .5em;background:var(--panel);color:var(--fg);
  border:1px solid var(--rule);border-radius:3px;font:inherit;font-size:.85em;
}
.g-filters input{flex:1 1 10em;}
.g-filters select{flex:1 1 auto;}
.g-filters input:focus,.g-filters select:focus{outline:none;border-color:var(--tok-fn);}
.g-count{padding:.45em 1em;color:var(--faint);font-size:.75em;border-bottom:1px solid var(--rule);}
.g-list{flex:1;overflow-y:auto;padding-bottom:3em;font-size:13px;}
.g-group{
  position:sticky;top:0;padding:.8em 1em .3em;background:var(--bg);
  color:var(--faint);font-size:.8em;letter-spacing:.14em;text-transform:uppercase;
}
/* scroll-margin: scrolled into view, a row clears the sticky module heading */
.g-item{
  display:flex;justify-content:space-between;gap:.6em;padding:.15em 1em;
  color:var(--dim);border-left:2px solid transparent;scroll-margin-top:2.4em;
}
.g-item:hover{color:var(--fg);background:var(--panel);}
.g-item.on{color:#fff;background:var(--panel-2);border-left-color:var(--tok-fn);}
.g-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-stars{color:var(--faint);font-size:.8em;white-space:nowrap;}
.g-none{padding:1em;color:var(--faint);}
.g-main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.g-bar{
  flex:none;display:flex;align-items:center;gap:.4em;height:44px;padding:0 .6em;
  border-bottom:1px solid var(--rule);white-space:nowrap;
}
.g-btn{
  flex:none;width:30px;height:30px;padding:0;background:var(--panel);color:var(--dim);
  border:1px solid var(--rule);border-radius:3px;font:inherit;cursor:pointer;
}
.g-btn:hover{color:var(--fg);border-color:var(--tok-fn);}
.g-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding-left:.4em;}
.g-desc{margin-left:.6em;color:var(--dim);font-size:.9em;}
.g-open{flex:none;padding:0 .4em;font-size:.9em;}
.g-stage{flex:1;position:relative;min-height:0;}
.g-stage iframe{position:absolute;inset:0;width:100%;height:100%;max-width:none;border:0;border-radius:0;}
.g-intro{max-width:36em;margin:12vh auto 0;padding:0 1.5em;}
@media(max-width:700px){
  body.gallery.list-open{grid-template-columns:1fr;}
  .g-side{position:fixed;inset:44px 0 0 0;z-index:1;border-right:0;}
  .g-item{padding:.45em 1em;}
  .g-desc{display:none;}
}
/* A tutorial pointer, sitting directly under the heading whose subject it
   covers rather than pooled in a list at the foot of the page. */
.tut{
  margin:.2em 0 1.3em;padding:.55em .9em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-fn);border-radius:3px;
  color:var(--dim);font-size:.9em;
}
.tut a{color:var(--link);border:0;font-weight:700;}
.tut-index{list-style:none;padding-left:0;}
.tut-index li{padding:.25em 0;border-bottom:1px solid var(--rule);}
.tut-index a{border:0;}
/* `.reveal` was animated in by the JS that docfmt replaced; without a rule
   it is simply visible, which is the correct end state. */
@media(max-width:700px){body{font-size:14px;padding:1.4rem .8rem 4rem;}pre{font-size:12px;}}
</style>
<style>
/* PROTOTYPE ONLY: in the real change these rules go into docfmt.zig's `style`
   constant next to the other .g-* rules (doc_gate forbids a page <style>). */
.g-main{--f:.58;}
.g-stage{flex:1 1 0;}
.code-open .g-stage{flex:0 0 calc((100% - 44px) * var(--f));}
.g-split{display:none;flex:none;height:9px;margin:-4px 0;position:relative;z-index:2;cursor:row-resize;touch-action:none;}
.g-split::after{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--rule);}
.g-split:hover::after,.dragging .g-split::after{top:3px;height:3px;background:var(--tok-fn);}
.code-open .g-split{display:block;}
.dragging{cursor:row-resize;user-select:none;}
.dragging iframe{pointer-events:none;}
.g-code{display:none;flex:1 1 0;min-height:0;flex-direction:column;background:var(--bg);}
.code-open .g-code{display:flex;}
.g-tabs{flex:none;display:flex;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--rule);font-size:12px;scrollbar-width:thin;}
.g-tab{
  flex:none;padding:.45em .9em;background:none;color:var(--dim);font:inherit;cursor:pointer;white-space:nowrap;
  border:0;border-right:1px solid var(--rule);border-bottom:2px solid transparent;
}
.g-tab:hover{color:var(--fg);}
.g-tab.on{color:#fff;background:var(--bg);border-bottom-color:var(--tok-fn);}
.g-tab .n{margin-left:.6em;color:var(--faint);font-size:.9em;}
.g-tab.g-copy{margin-left:auto;border-left:1px solid var(--rule);border-right:0;}
.g-src{flex:1;min-height:0;overflow:auto;}
.g-src:focus{outline:none;}
.g-src:focus-visible{outline:1px solid var(--tok-fn);outline-offset:-1px;}
.g-src pre{
  margin:0;padding:8px 0 3em;background:none;border:0;border-radius:0;overflow:visible;
  font-size:12.5px;line-height:1.55;
}
/* one row per source line; the number is a CSS counter, so it is never
   selected or copied, and it stays on the first row of a wrapped line */
.g-src code{display:block;counter-reset:ln;padding:0;}
.g-src .l{display:block;position:relative;min-height:1.55em;padding:0 1.2em 0 calc(4ch + 2.2em);}
.g-src .l::before{
  counter-increment:ln;content:counter(ln);position:absolute;left:0;top:0;bottom:0;
  width:calc(4ch + 1em);padding-right:.9em;box-sizing:border-box;
  text-align:right;color:var(--faint);border-right:1px solid var(--rule);
}
@media(max-width:700px){.g-src .l{white-space:pre-wrap;overflow-wrap:anywhere;}}
.g-src-msg{padding:1em 1.2em;color:var(--faint);}
.g-btn.g-wide{width:auto;padding:0 .7em;font-size:.85em;}
.g-btn.on{color:var(--fg);border-color:var(--tok-fn);}
</style>
</head>
<body class="gallery list-open">
    <aside class="g-side">
        <div class="g-head">
            <a class="g-logo" href="./">zimr examples</a>
            <a href="../readme.html">readme</a>
            <a href="../cheatsheet.html">cheatsheet</a>
        </div>
        <div class="g-filters">
            <input type="search" id="q" placeholder="search  (press /)" autocomplete="off" spellcheck="false" />
            <select id="mod" aria-label="module"><option value="">all modules</option></select>
        </div>
        <div class="g-count" id="count"></div>
        <nav class="g-list" id="list"></nav>
    </aside>

    <main class="g-main" id="main">
        <div class="g-bar">
            <button class="g-btn" id="menu" title="show / hide the list">&#9776;</button>
            <button class="g-btn" id="prev" title="previous (&uarr; or k)">&#8249;</button>
            <button class="g-btn" id="next" title="next (&darr; or j)">&#8250;</button>
            <span class="g-title" id="title"></span>
            <button class="g-btn g-wide" id="codebtn" title="show / hide the source (c)">code</button>
            <a class="g-open" id="open" target="_blank" hidden>open &#8599;</a>
        </div>
        <div class="g-stage" id="stage">
            <div class="g-intro">
                <h1>zimr examples</h1>
                <p>Prototype: the selected example runs here, its source shows below.</p>
            </div>
        </div>
        <div class="g-split" id="split" title="drag to resize, double-click to reset"></div>
        <section class="g-code" id="code" aria-label="source">
            <div class="g-tabs" id="tabs"></div>
            <div class="g-src" id="src" tabindex="0"><p class="g-src-msg">Pick an example; its source shows here.</p></div>
        </section>
    </main>

    <script type="module">
        const $ = id => document.getElementById(id);
        const list = $("list"), q = $("q"), mod = $("mod"), count = $("count");
        const stage = $("stage"), title = $("title"), open = $("open");
        const main = $("main"), codeBtn = $("codebtn"), split = $("split"), tabs = $("tabs"), srcBox = $("src");
        const narrow = matchMedia("(max-width: 700px)");

        const ORDER = ["core", "shapes", "textures", "text", "models", "shaders",
                       "ui", "plot", "compute", "audio", "physics", "robot"];
        const rank = m => { const i = ORDER.indexOf(m); return i < 0 ? ORDER.length : i; };

        let examples = [];
        let current = null;
        let mountTimer = 0;

        // ---- per-viewer conveniences: pane open/closed and the split. Browser
        // storage can throw (private mode, blocked site data), so every access is
        // guarded and the page works without it.
        const store = {
            get(k, d) { try { const v = localStorage.getItem("zimr.gallery." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
            set(k, v) { try { localStorage.setItem("zimr.gallery." + k, JSON.stringify(v)); } catch { } },
        };
        const SPLIT_DEFAULT = 0.58;
        let codeOpen = store.get("code", !narrow.matches);
        let frac = store.get("split", SPLIT_DEFAULT);
        let source = null;      // { name, files: [{ path, lines, html }] } for `current`
        let fileIdx = 0;
        let sourceReq = 0;      // a newer pick wins over a slow fetch

        function escapeHtml(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
            }[c]));
        }
        const stars = n => "★".repeat(Math.max(0, Math.min(5, n | 0)));

        async function load() {
            try {
                const r = await fetch("../manifest.json", { cache: "no-store" });
                examples = (await r.json()).examples;
            } catch (e) {
                list.innerHTML = `<p class="g-none">Failed to load manifest.json.</p>`;
                return;
            }
            examples.sort((a, b) => rank(a.module) - rank(b.module)
                || a.module.localeCompare(b.module) || a.name.localeCompare(b.name));
            for (const ex of examples) {
                ex.hay = [ex.name, ex.name.replace(/_/g, " "), ex.module, ex.description,
                          ...(ex.functions || [])].join(" ").toLowerCase();
            }
            for (const m of new Set(examples.map(ex => ex.module))) {
                mod.add(new Option(`${m} (${examples.filter(ex => ex.module === m).length})`, m));
            }
            render();
            applyCode();
            fromHash();
            if (narrow.matches) {
                document.body.classList.toggle("list-open", !current);
            }
        }

        function render() {
            const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
            const m = mod.value;
            const shown = examples.filter(ex => (!m || ex.module === m) && terms.every(t => ex.hay.includes(t)));
            let html = "", group = "";
            for (const ex of shown) {
                if (ex.module !== group) {
                    group = ex.module;
                    html += `<div class="g-group">${escapeHtml(group)}</div>`;
                }
                const on = ex === current ? " on" : "";
                html += `<a class="g-item${on}" href="#${escapeHtml(ex.name)}"
                    title="${escapeHtml(ex.description)}"><span>${escapeHtml(ex.name)}</span><span
                    class="g-stars">${stars(ex.stars)}</span></a>`;
            }
            list.innerHTML = html || `<p class="g-none">No example matches.</p>`;
            count.textContent = shown.length === examples.length
                ? `${examples.length} examples` : `${shown.length} of ${examples.length}`;
        }

        const visible = () => [...list.querySelectorAll(".g-item")];

        function select(name) {
            const ex = examples.find(e => e.name === name);
            if (!ex) {
                return;
            }
            if (narrow.matches) {
                document.body.classList.remove("list-open");
            }
            if (ex === current) {
                return;
            }
            current = ex;
            history.replaceState(null, "", "#" + ex.name);
            document.title = `${ex.name} — zimr examples`;
            title.innerHTML = `<strong>${escapeHtml(ex.name)}</strong>
                <span class="g-stars">${stars(ex.stars)}</span>
                <span class="g-desc">${escapeHtml(ex.description)}</span>`;
            title.title = ex.description;
            open.href = `../${ex.name}/`;
            open.hidden = false;
            for (const a of visible()) {
                const on = a.hash === "#" + ex.name;
                a.classList.toggle("on", on);
                if (on) {
                    a.scrollIntoView({ block: "nearest" });
                }
            }
            // Same debounce as the frame: a held arrow key skims the list without
            // fetching (or booting) every example on the way.
            clearTimeout(mountTimer);
            mountTimer = setTimeout(() => {
                const frame = document.createElement("iframe");
                frame.src = `../${ex.name}/`;
                frame.title = ex.name;
                frame.allow = "autoplay; fullscreen";
                stage.replaceChildren(frame);
                if (codeOpen) {
                    loadSource(ex);
                }
            }, 120);
        }

        // ---- the code pane ------------------------------------------------
        function applyCode() {
            document.body.classList.toggle("code-open", codeOpen);
            codeBtn.classList.toggle("on", codeOpen);
            main.style.setProperty("--f", frac.toFixed(4));
            if (codeOpen && current && (!source || source.name !== current.name)) {
                loadSource(current);
            }
        }

        async function loadSource(ex) {
            if (source && source.name === ex.name) {
                return;
            }
            const req = ++sourceReq;
            const t0 = performance.now();
            tabs.replaceChildren();
            srcBox.innerHTML = `<p class="g-src-msg">loading ${escapeHtml(ex.name)} source…</p>`;
            let files;
            try {
                const r = await fetch(`src/${ex.name}.json`);
                if (!r.ok) {
                    throw new Error(`HTTP ${r.status}`);
                }
                files = (await r.json()).files;
            } catch (e) {
                if (req === sourceReq) {
                    srcBox.innerHTML = `<p class="g-src-msg">No source for ${escapeHtml(ex.name)} (${escapeHtml(e.message)}).</p>`;
                }
                return;
            }
            if (req !== sourceReq) {
                return;
            }
            const t1 = performance.now();
            source = { name: ex.name, files };
            renderTabs();
            showFile(0);
            const t2 = performance.now();
            window.__srcTiming = { name: ex.name, fetchMs: +(t1 - t0).toFixed(1), renderMs: +(t2 - t1).toFixed(1) };
        }

        function renderTabs() {
            tabs.innerHTML = source.files.map((f, i) =>
                `<button class="g-tab" data-i="${i}" title="${escapeHtml(f.path)}">${escapeHtml(f.path.split("/").pop())}<span class="n">${f.lines}</span></button>`
            ).join("") + `<button class="g-tab g-copy" id="copy" title="copy this file">copy</button>`;
        }

        function showFile(i) {
            fileIdx = i;
            const f = source.files[i];
            for (const t of tabs.querySelectorAll(".g-tab[data-i]")) {
                t.classList.toggle("on", +t.dataset.i === i);
            }
            // No highlighted token crosses a newline (Zig has no multi-line
            // tokens), so every line's HTML is balanced and can be its own row.
            const lines = f.html.split("\n");
            if (lines.length > 0 && lines[lines.length - 1] === "") {
                lines.pop();
            }
            srcBox.innerHTML = `<pre><code>${lines.map(l => `<span class="l">${l}</span>`).join("")}</code></pre>`;
            srcBox.scrollTop = 0;
            srcBox.scrollLeft = 0;
        }

        tabs.addEventListener("click", async e => {
            const t = e.target.closest(".g-tab");
            if (!t || !source) {
                return;
            }
            if (t.id === "copy") {
                const rows = [...srcBox.querySelectorAll(".l")];
                try {
                    await navigator.clipboard.writeText(rows.map(r => r.textContent).join("\n") + "\n");
                    t.textContent = "copied";
                } catch {
                    t.textContent = "copy failed";
                }
                setTimeout(() => { t.textContent = "copy"; }, 1200);
                return;
            }
            showFile(+t.dataset.i);
        });

        codeBtn.addEventListener("click", () => {
            codeOpen = !codeOpen;
            store.set("code", codeOpen);
            applyCode();
        });

        // Drag the rule between the example and the code. The frame is made
        // inert while dragging, or it swallows the pointer as soon as the rule
        // moves over it.
        split.addEventListener("pointerdown", e => {
            e.preventDefault();
            split.setPointerCapture(e.pointerId);
            document.body.classList.add("dragging");
        });
        split.addEventListener("pointermove", e => {
            if (!split.hasPointerCapture(e.pointerId)) {
                return;
            }
            const top = stage.getBoundingClientRect().top;
            const room = main.getBoundingClientRect().bottom - top;
            frac = Math.min(0.9, Math.max(0.1, (e.clientY - top) / room));
            main.style.setProperty("--f", frac.toFixed(4));
        });
        const endDrag = () => {
            document.body.classList.remove("dragging");
            store.set("split", frac);
        };
        split.addEventListener("pointerup", endDrag);
        split.addEventListener("pointercancel", endDrag);
        split.addEventListener("dblclick", () => {
            frac = SPLIT_DEFAULT;
            store.set("split", frac);
            applyCode();
        });

        function fromHash() {
            select(decodeURIComponent(location.hash.slice(1)));
        }

        function step(delta) {
            const items = visible();
            if (items.length === 0) {
                return;
            }
            const at = items.findIndex(a => a.classList.contains("on"));
            const next = at < 0 ? (delta > 0 ? 0 : items.length - 1)
                : Math.max(0, Math.min(items.length - 1, at + delta));
            select(items[next].hash.slice(1));
        }

        list.addEventListener("click", e => {
            const a = e.target.closest(".g-item");
            if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) {
                return;
            }
            e.preventDefault();
            select(a.hash.slice(1));
        });
        q.addEventListener("input", render);
        mod.addEventListener("change", render);
        $("prev").addEventListener("click", () => step(-1));
        $("next").addEventListener("click", () => step(1));
        $("menu").addEventListener("click", () => {
            document.body.classList.toggle("list-open");
            list.querySelector(".on")?.scrollIntoView({ block: "nearest" });
        });
        addEventListener("hashchange", fromHash);
        narrow.addEventListener("change", () =>
            document.body.classList.toggle("list-open", !narrow.matches || !current));

        document.addEventListener("keydown", e => {
            if (e.ctrlKey || e.metaKey || e.altKey) {
                return;
            }
            if (e.target === mod) {
                return;
            }
            // Focus in the code pane: the keys scroll the code (arrows, page
            // keys, space) - none of them steps the list.
            if (e.target.closest && e.target.closest(".g-code")) {
                return;
            }
            if (e.key === "ArrowDown") {
                e.preventDefault();
                step(1);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                step(-1);
            } else if (e.target === q) {
                if (e.key === "Escape") {
                    q.value = "";
                    render();
                }
            } else if (e.key === "j") {
                step(1);
            } else if (e.key === "k") {
                step(-1);
            } else if (e.key === "c") {
                codeBtn.click();
            } else if (e.key === "/") {
                e.preventDefault();
                document.body.classList.add("list-open");
                q.focus();
                q.select();
            }
        });

        load();
    </script>
</body>
</html>
