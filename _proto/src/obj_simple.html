<h1>obj_simple</h1>
<figure class="code src-file" data-path="examples/obj_simple/obj_simple.zig" data-lines="110"><figcaption><span>examples/obj_simple/obj_simple.zig</span><span>110 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/obj_simple/obj_simple.zig</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Loads a Wavefront OBJ model through the new `codecs.obj` path and draws it</span>
<span class="tok-comment">// lit + auto-rotating, exactly like `gltf_simple` does for glTF. The</span>
<span class="tok-comment">// embedded cube uses QUAD faces with `v/vt/vn` corners, so one small file</span>
<span class="tok-comment">// exercises the whole loader: polygon triangulation (quads -&gt; tris), tex-coord</span>
<span class="tok-comment">// indices, explicit per-face normals, and the de-index/dedup that turns OBJ's</span>
<span class="tok-comment">// separate v/vt/vn streams into a single GPU vertex + u16 index buffer.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Build:      zig build wgpu-obj-simple</span>
<span class="tok-comment">// Standalone: zig build wgpu-obj-simple-standalone</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> rotationX = zm.rotationX;
<span class="tok-kw">const</span> rotationY = zm.rotationY;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-kw">const</span> pbr_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pbr_vs.wgsl"</span>);
<span class="tok-kw">const</span> pbr_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pbr_fs.wgsl"</span>);

<span class="tok-comment">// A unit cube, written by hand. Quad faces (4 corners each) prove the fan</span>
<span class="tok-comment">// triangulation; `v/vt/vn` corners prove tex-coord + normal index parsing.</span>
<span class="tok-kw">const</span> cube_obj =
    <span class="tok-str">\\# unit cube</span>
    <span class="tok-str">\\v -1 -1 -1</span>
    <span class="tok-str">\\v  1 -1 -1</span>
    <span class="tok-str">\\v  1  1 -1</span>
    <span class="tok-str">\\v -1  1 -1</span>
    <span class="tok-str">\\v -1 -1  1</span>
    <span class="tok-str">\\v  1 -1  1</span>
    <span class="tok-str">\\v  1  1  1</span>
    <span class="tok-str">\\v -1  1  1</span>
    <span class="tok-str">\\vt 0 0</span>
    <span class="tok-str">\\vt 1 0</span>
    <span class="tok-str">\\vt 1 1</span>
    <span class="tok-str">\\vt 0 1</span>
    <span class="tok-str">\\vn  0  0 -1</span>
    <span class="tok-str">\\vn  0  0  1</span>
    <span class="tok-str">\\vn -1  0  0</span>
    <span class="tok-str">\\vn  1  0  0</span>
    <span class="tok-str">\\vn  0 -1  0</span>
    <span class="tok-str">\\vn  0  1  0</span>
    <span class="tok-str">\\f 1/1/1 2/2/1 3/3/1 4/4/1</span>
    <span class="tok-str">\\f 5/1/2 8/2/2 7/3/2 6/4/2</span>
    <span class="tok-str">\\f 1/1/3 4/2/3 8/3/3 5/4/3</span>
    <span class="tok-str">\\f 2/1/4 6/2/4 7/3/4 3/4/4</span>
    <span class="tok-str">\\f 1/1/5 5/2/5 6/3/5 2/4/5</span>
    <span class="tok-str">\\f 4/1/6 3/2/6 7/3/6 8/4/6</span>
;

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    renderer: z.pbr3d.Renderer,
    model: z.pbr3d.Model,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> gf: *z.GpuFrame = f.gpu;
    <span class="tok-kw">var</span> renderer: z.pbr3d.Renderer = <span class="tok-kw">try</span> z.pbr3d.Renderer.<span class="tok-fn">init</span>(.{
        .device = gf.device,
        .queue = gf.queue,
        .gpa = gpa,
        .surface_format = gf.backbuffer_format,
        .depth_format = .depth24_plus,
        .vs_wgsl = pbr_vs_wgsl,
        .fs_wgsl = pbr_fs_wgsl,
        .cull_mode = .none, <span class="tok-comment">// depth-sort the solid cube; winding-agnostic</span>
    });
    <span class="tok-kw">const</span> model: z.pbr3d.Model = <span class="tok-kw">try</span> renderer.<span class="tok-fn">loadObj</span>(cube_obj);
    s.* = .{ .renderer = renderer, .model = model };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> aspect: f32 = f.window.<span class="tok-fn">aspect</span>();

    <span class="tok-kw">const</span> model_m: Mat = <span class="tok-fn">mulMat</span>(<span class="tok-fn">rotationY</span>(t * <span class="tok-num">0.6</span>), <span class="tok-fn">rotationX</span>(t * <span class="tok-num">0.25</span>));
    <span class="tok-kw">const</span> view: Mat = <span class="tok-fn">lookAtRh</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">5</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(<span class="tok-num">0.9</span>, aspect, <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>);

    s.renderer.<span class="tok-fn">beginFrame</span>(f.gpu, .{
        .camera = .{ .view = view, .proj = proj, .eye = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">5</span> } },
        .light = .{ .dir = .{ -<span class="tok-num">0.4</span>, -<span class="tok-num">0.6</span>, -<span class="tok-num">0.7</span> }, .color = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span> }, .ambient = .{ <span class="tok-num">0.25</span>, <span class="tok-num">0.27</span>, <span class="tok-num">0.32</span> } },
        .clear = .{ .r = <span class="tok-num">0.04</span>, .g = <span class="tok-num">0.05</span>, .b = <span class="tok-num">0.07</span>, .a = <span class="tok-num">1.0</span> },
    });
