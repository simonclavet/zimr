<h1>net_cursors</h1>
<figure class="code src-file" data-path="examples/net_cursors/net_cursors.zig" data-lines="382"><figcaption><span>examples/net_cursors/net_cursors.zig</span><span>382 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! net_cursors - the payoff demo: a shared 2D canvas where everyone in the room</span>
<span class="tok-comment">//! sees everyone else's mouse cursor moving in real time, and clicks send a</span>
<span class="tok-comment">//! ripple that all peers see. This is the "invite friends to a local game"</span>
<span class="tok-comment">//! goal in its simplest form.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! It's built entirely on `z.net.Session` (the L2 layer), so it's also the</span>
<span class="tok-comment">//! reference for how to use it:</span>
<span class="tok-comment">//!   - `session.connect(url, room)` to join (host generates a shareable room</span>
<span class="tok-comment">//!     name; others type it in).</span>
<span class="tok-comment">//!   - each frame, `session.broadcast(channel, bytes)` your cursor, and drain</span>
<span class="tok-comment">//!     `session.poll(&amp;buf)` for peers joining/leaving and their messages.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Wire format is deliberately tiny: a cursor or click is two f32s (normalized</span>
<span class="tok-comment">//! [0,1] so it maps correctly regardless of each peer's window size), 8 bytes.</span>
<span class="tok-comment">//! Cursors go on channel 0 (unreliable - a dropped position is instantly</span>
<span class="tok-comment">//! replaced by the next); clicks go on channel 1 (reliable - never dropped).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Native builds render the UI but do no networking (ws/rtc are wasm-only), so</span>
<span class="tok-comment">//! the headless smoke test exercises the whole thing harmlessly.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> net = z.net;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> clamp01 = zm.clamp01;

<span class="tok-kw">const</span> chan_cursor = <span class="tok-num">0</span>; <span class="tok-comment">// unreliable, unordered</span>
<span class="tok-kw">const</span> chan_click = <span class="tok-num">1</span>; <span class="tok-comment">// reliable, ordered</span>
<span class="tok-kw">const</span> ripple_life = <span class="tok-num">0.8</span>; <span class="tok-comment">// seconds</span>
<span class="tok-kw">const</span> ripple_max_r = <span class="tok-num">46.0</span>; <span class="tok-comment">// px at end of life</span>
<span class="tok-kw">const</span> max_ripples = <span class="tok-num">24</span>;

<span class="tok-comment">// A peer's latest cursor position (normalized), tracked from their messages.</span>
<span class="tok-kw">const</span> PeerView = <span class="tok-kw">struct</span> {
    id: u32,
    nx: f32,
    ny: f32,
    active: bool,
    has_pos: bool,
};

<span class="tok-kw">const</span> Ripple = <span class="tok-kw">struct</span> {
    nx: f32,
    ny: f32,
    age: f32,
    color: Color,
    active: bool,
};

<span class="tok-comment">// A friendly, distinct colour per peer (indexed by id).</span>
<span class="tok-kw">const</span> peer_colors = [_]Color{
    .{ .r = <span class="tok-num">239</span>, .g = <span class="tok-num">71</span>, .b = <span class="tok-num">111</span>, .a = <span class="tok-num">255</span> },
    .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">209</span>, .b = <span class="tok-num">102</span>, .a = <span class="tok-num">255</span> },
    .{ .r = <span class="tok-num">6</span>, .g = <span class="tok-num">214</span>, .b = <span class="tok-num">160</span>, .a = <span class="tok-num">255</span> },
    .{ .r = <span class="tok-num">17</span>, .g = <span class="tok-num">138</span>, .b = <span class="tok-num">178</span>, .a = <span class="tok-num">255</span> },
    .{ .r = <span class="tok-num">131</span>, .g = <span class="tok-num">56</span>, .b = <span class="tok-num">236</span>, .a = <span class="tok-num">255</span> },
    .{ .r = <span class="tok-num">251</span>, .g = <span class="tok-num">133</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">255</span> },
    .{ .r = <span class="tok-num">58</span>, .g = <span class="tok-num">134</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> },
    .{ .r = <span class="tok-num">131</span>, .g = <span class="tok-num">197</span>, .b = <span class="tok-num">190</span>, .a = <span class="tok-num">255</span> },
};

<span class="tok-kw">fn</span> <span class="tok-fn">peerColor</span>(id: u32) Color {
    <span class="tok-kw">return</span> peer_colors[id % peer_colors.len];
}

<span class="tok-kw">fn</span> <span class="tok-fn">withAlpha</span>(c: Color, a: u8) Color {
    <span class="tok-kw">return</span> .{ .r = c.r, .g = c.g, .b = c.b, .a = a };
}

<span class="tok-comment">// A cursor/click position is two f32s. WASM is little-endian everywhere, so a</span>
<span class="tok-comment">// raw bit copy is a fine, tiny wire format between browsers.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">packVec2</span>(nx: f32, ny: f32) [<span class="tok-num">8</span>]u8 {
    <span class="tok-kw">const</span> v: [<span class="tok-num">2</span>]f32 = .{ nx, ny };
    <span class="tok-kw">return</span> <span class="tok-builtin">@bitCast</span>(v);
}

<span class="tok-kw">fn</span> <span class="tok-fn">unpackVec2</span>(bytes: []<span class="tok-kw">const</span> u8) ?[<span class="tok-num">2</span>]f32 {
    <span class="tok-kw">if</span> (bytes.len &lt; <span class="tok-num">8</span>) {
        <span class="tok-kw">return</span> null;
    }
    <span class="tok-kw">var</span> tmp: [<span class="tok-num">8</span>]u8 = undefined;
    <span class="tok-builtin">@memcpy</span>(&amp;tmp, bytes[<span class="tok-num">0</span>..<span class="tok-num">8</span>]);
    <span class="tok-kw">return</span> <span class="tok-builtin">@as</span>([<span class="tok-num">2</span>]f32, <span class="tok-builtin">@bitCast</span>(tmp));
}

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    font: z.Font,
    ui_host: z.UiHost,

    session: net.Session,
    url_buf: [<span class="tok-num">256</span>]u8,
    url_len: usize,
    room_buf: [<span class="tok-num">64</span>]u8,
    room_len: usize,

    peers: [net.max_peers]PeerView,
    ripples: [max_ripples]Ripple,
    my_nx: f32,
    my_ny: f32,

    poll_buf: [<span class="tok-num">512</span>]u8, <span class="tok-comment">// receives message bytes from session.poll (msgs are 8B)</span>
};

<span class="tok-kw">fn</span> <span class="tok-fn">peerView</span>(s: *State, id: u32) ?*PeerView {
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.peers.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (s.peers[i].active <span class="tok-kw">and</span> s.peers[i].id == id) {
            <span class="tok-kw">return</span> &amp;s.peers[i];
        }
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-kw">fn</span> <span class="tok-fn">addPeerView</span>(s: *State, id: u32) void {
    <span class="tok-kw">if</span> (<span class="tok-fn">peerView</span>(s, id) != null) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.peers.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (!s.peers[i].active) {
            s.peers[i] = .{ .id = id, .nx = <span class="tok-num">0.5</span>, .ny = <span class="tok-num">0.5</span>, .active = true, .has_pos = false };
            <span class="tok-kw">return</span>;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">removePeerView</span>(s: *State, id: u32) void {
    <span class="tok-kw">if</span> (<span class="tok-fn">peerView</span>(s, id)) |p| {
        p.active = false;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">spawnRipple</span>(s: *State, nx: f32, ny: f32, color: Color) void {
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> oldest: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> oldest_age: f32 = -<span class="tok-num">1.0</span>;
    <span class="tok-kw">while</span> (i &lt; s.ripples.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (!s.ripples[i].active) {
            s.ripples[i] = .{ .nx = nx, .ny = ny, .age = <span class="tok-num">0.0</span>, .color = color, .active = true };
            <span class="tok-kw">return</span>;
        }
        <span class="tok-kw">if</span> (s.ripples[i].age &gt; oldest_age) {
            oldest_age = s.ripples[i].age;
            oldest = i;
        }
    }
    <span class="tok-comment">// All slots busy - recycle the oldest.</span>
    s.ripples[oldest] = .{ .nx = nx, .ny = ny, .age = <span class="tok-num">0.0</span>, .color = color, .active = true };
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">20</span>);
    s.* = .{
        .gpa = gpa,
        .font = font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .session = net.Session.<span class="tok-fn">init</span>(),
        .url_buf = undefined,
        .url_len = <span class="tok-num">0</span>,
        .room_buf = undefined,
        .room_len = <span class="tok-num">0</span>,
        .peers = undefined,
        .ripples = undefined,
        .my_nx = <span class="tok-num">0.5</span>,
        .my_ny = <span class="tok-num">0.5</span>,
        .poll_buf = undefined,
    };
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.peers.len) : (i += <span class="tok-num">1</span>) {
        s.peers[i] = .{ .id = <span class="tok-num">0</span>, .nx = <span class="tok-num">0</span>, .ny = <span class="tok-num">0</span>, .active = false, .has_pos = false };
    }
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.ripples.len) : (i += <span class="tok-num">1</span>) {
        s.ripples[i] = .{ .nx = <span class="tok-num">0</span>, .ny = <span class="tok-num">0</span>, .age = <span class="tok-num">0</span>, .color = peer_colors[<span class="tok-num">0</span>], .active = false };
    }
    <span class="tok-kw">const</span> origin: []<span class="tok-kw">const</span> u8 = z.web.ws.<span class="tok-fn">originUrl</span>(&amp;s.url_buf);
    s.url_len = origin.len;
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.session.<span class="tok-fn">disconnect</span>();
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">hostRoom</span>(s: *State) void {
    <span class="tok-kw">var</span> name_buf: [<span class="tok-num">32</span>]u8 = undefined;
    <span class="tok-kw">const</span> seed: u64 = <span class="tok-builtin">@trunc</span>(z.web.dom.<span class="tok-fn">epochMillis</span>());
    <span class="tok-kw">const</span> name: []<span class="tok-kw">const</span> u8 = net.<span class="tok-fn">generateRoomName</span>(seed, &amp;name_buf);
    <span class="tok-kw">const</span> n: usize = <span class="tok-builtin">@min</span>(name.len, s.room_buf.len);
    <span class="tok-builtin">@memcpy</span>(s.room_buf[<span class="tok-num">0</span>..n], name[<span class="tok-num">0</span>..n]);
    s.room_len = n;
    s.session.<span class="tok-fn">connect</span>(s.url_buf[<span class="tok-num">0</span>..s.url_len], s.room_buf[<span class="tok-num">0</span>..s.room_len]);
}

<span class="tok-kw">fn</span> <span class="tok-fn">joinRoom</span>(s: *State) void {
    <span class="tok-kw">if</span> (s.room_len == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    s.session.<span class="tok-fn">connect</span>(s.url_buf[<span class="tok-num">0</span>..s.url_len], s.room_buf[<span class="tok-num">0</span>..s.room_len]);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> dt: f32 = f.time.delta_time;
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-comment">// 1. Drain the session: peers joining/leaving and their cursor/click bytes.</span>
    <span class="tok-kw">while</span> (s.session.<span class="tok-fn">poll</span>(&amp;s.poll_buf)) |ev| {
        <span class="tok-kw">switch</span> (ev) {
            .joined_as =&gt; {},
            .peer_joined =&gt; |id| <span class="tok-fn">addPeerView</span>(s, id),
            .peer_state =&gt; {}, <span class="tok-comment">// terminal states also fire peer_left, handled below</span>
            .channel_open =&gt; {},
            .peer_left =&gt; |id| <span class="tok-fn">removePeerView</span>(s, id),
            .host_changed =&gt; {}, <span class="tok-comment">// cursors are peer-owned; no host needed here</span>
            .room_full =&gt; {}, <span class="tok-comment">// (would show "room full"; unreachable at this demo's scale)</span>
            .message =&gt; |m| {
                <span class="tok-kw">if</span> (<span class="tok-fn">unpackVec2</span>(m.bytes)) |pos| {
                    <span class="tok-kw">if</span> (m.channel == chan_cursor) {
                        <span class="tok-kw">if</span> (<span class="tok-fn">peerView</span>(s, m.peer)) |p| {
                            p.nx = <span class="tok-fn">clamp01</span>(pos[<span class="tok-num">0</span>]);
                            p.ny = <span class="tok-fn">clamp01</span>(pos[<span class="tok-num">1</span>]);
                            p.has_pos = true;
                        }
                    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (m.channel == chan_click) {
                        <span class="tok-fn">spawnRipple</span>(s, <span class="tok-fn">clamp01</span>(pos[<span class="tok-num">0</span>]), <span class="tok-fn">clamp01</span>(pos[<span class="tok-num">1</span>]), <span class="tok-fn">peerColor</span>(m.peer));
                    }
                }
            },
        }
    }

    <span class="tok-comment">// 2. Send my own cursor + clicks (only once we're fully joined).</span>
    <span class="tok-kw">if</span> (s.session.<span class="tok-fn">isReady</span>()) {
        <span class="tok-kw">const</span> mouse: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
        s.my_nx = <span class="tok-fn">clamp01</span>(mouse[<span class="tok-num">0</span>] / w);
        s.my_ny = <span class="tok-fn">clamp01</span>(mouse[<span class="tok-num">1</span>] / h);
        <span class="tok-kw">const</span> cur: [<span class="tok-num">8</span>]u8 = <span class="tok-fn">packVec2</span>(s.my_nx, s.my_ny);
        s.session.<span class="tok-fn">broadcast</span>(chan_cursor, &amp;cur);
        <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
            <span class="tok-kw">const</span> clk: [<span class="tok-num">8</span>]u8 = <span class="tok-fn">packVec2</span>(s.my_nx, s.my_ny);
            s.session.<span class="tok-fn">broadcast</span>(chan_click, &amp;clk);
            <span class="tok-fn">spawnRipple</span>(s, s.my_nx, s.my_ny, .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> });
        }
    }

    <span class="tok-comment">// 3. Age ripples.</span>
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.ripples.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (s.ripples[i].active) {
            s.ripples[i].age += dt;
            <span class="tok-kw">if</span> (s.ripples[i].age &gt;= ripple_life) {
                s.ripples[i].active = false;
            }
        }
    }

    <span class="tok-comment">// 4. Render the canvas.</span>
    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">15</span>, .g = <span class="tok-num">17</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-comment">// ripples (expanding, fading rings)</span>
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.ripples.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> rp: Ripple = s.ripples[i];
        <span class="tok-kw">if</span> (!rp.active) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> t: f32 = rp.age / ripple_life;
        <span class="tok-kw">const</span> radius: f32 = <span class="tok-num">6.0</span> + t * ripple_max_r;
        <span class="tok-kw">const</span> alpha_f: f32 = (<span class="tok-num">1.0</span> - t) * <span class="tok-num">220.0</span>;
        <span class="tok-kw">const</span> alpha: u8 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, alpha_f));
        <span class="tok-kw">const</span> center: Vec2 = .{ rp.nx * w, rp.ny * h };
        f.gl.<span class="tok-fn">circle</span>(center, radius, .{ .color = <span class="tok-fn">withAlpha</span>(rp.color, alpha), .outline = <span class="tok-num">2.5</span>, .segments = <span class="tok-num">32</span> });
    }

    <span class="tok-comment">// peer cursors</span>
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.peers.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> p: PeerView = s.peers[i];
        <span class="tok-kw">if</span> (!p.active <span class="tok-kw">or</span> !p.has_pos) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> col: Color = <span class="tok-fn">peerColor</span>(p.id);
        <span class="tok-kw">const</span> center: Vec2 = .{ p.nx * w, p.ny * h };
        <span class="tok-fn">drawCursor</span>(f, center, col);
        <span class="tok-kw">var</span> label: [<span class="tok-num">24</span>]u8 = undefined;
        <span class="tok-kw">const</span> txt: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;label, <span class="tok-str">"peer {d}"</span>, .{p.id}) <span class="tok-kw">catch</span> <span class="tok-str">"peer"</span>;
        <span class="tok-kw">const</span> label_pos: Vec2 = .{ center[<span class="tok-num">0</span>] + <span class="tok-num">12.0</span>, center[<span class="tok-num">1</span>] - <span class="tok-num">6.0</span> };
        f.gl.<span class="tok-fn">text</span>(label_pos, txt, .{ .size = <span class="tok-num">13</span>, .color = col, .font = &amp;s.font });
    }

    <span class="tok-comment">// my own cursor (a hollow ring so it reads as "me")</span>
    <span class="tok-kw">if</span> (s.session.<span class="tok-fn">isReady</span>()) {
        <span class="tok-kw">const</span> me: Vec2 = .{ s.my_nx * w, s.my_ny * h };
        <span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">235</span> };
        f.gl.<span class="tok-fn">circle</span>(me, <span class="tok-num">10.0</span>, .{ .color = white, .outline = <span class="tok-num">2.0</span>, .segments = <span class="tok-num">28</span> });
        f.gl.<span class="tok-fn">circle</span>(me, <span class="tok-num">2.5</span>, .{ .color = white, .segments = <span class="tok-num">12</span> });
    }

    <span class="tok-comment">// 5. UI overlay.</span>
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Shared cursors"</span>, .{
        .initial_pos = .{ <span class="tok-num">12</span>, <span class="tok-num">12</span> },
        .initial_size = .{ <span class="tok-num">340</span>, <span class="tok-num">250</span> },
    })) |win| {
        <span class="tok-kw">defer</span> win.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (!s.session.<span class="tok-fn">isActive</span>()) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"Signaling server:"</span>, .{});
            _ = u.<span class="tok-fn">inputTextWithHint</span>(<span class="tok-str">"Server URL"</span>, <span class="tok-str">"wss://your-app.onrender.com"</span>, &amp;s.url_buf, &amp;s.url_len, .{});
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Host a new room"</span>, .{})) {
                <span class="tok-fn">hostRoom</span>(s);
            }
            u.<span class="tok-fn">text</span>(<span class="tok-str">"or join an existing room:"</span>, .{});
            _ = u.<span class="tok-fn">inputTextWithHint</span>(<span class="tok-str">"Room name"</span>, <span class="tok-str">"brave-otter-42"</span>, &amp;s.room_buf, &amp;s.room_len, .{});
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Join room"</span>, .{})) {
                <span class="tok-fn">joinRoom</span>(s);
            }
        } <span class="tok-kw">else</span> {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"room: {s}"</span>, .{s.room_buf[<span class="tok-num">0</span>..s.room_len]});
            <span class="tok-kw">if</span> (s.session.<span class="tok-fn">isReady</span>()) {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"you are peer {d}"</span>, .{s.session.<span class="tok-fn">myId</span>()});
            } <span class="tok-kw">else</span> {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"connecting..."</span>, .{});
            }
            u.<span class="tok-fn">text</span>(<span class="tok-str">"peers connected: {d}"</span>, .{<span class="tok-fn">activePeers</span>(s)});
            u.<span class="tok-fn">text</span>(<span class="tok-str">"move your mouse; click to ripple"</span>, .{});
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Leave"</span>, .{})) {
                s.session.<span class="tok-fn">disconnect</span>();
                <span class="tok-fn">clearPeers</span>(s);
            }
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">activePeers</span>(s: *State) usize {
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.peers.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (s.peers[i].active) {
            n += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">return</span> n;
}

<span class="tok-kw">fn</span> <span class="tok-fn">clearPeers</span>(s: *State) void {
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.peers.len) : (i += <span class="tok-num">1</span>) {
        s.peers[i].active = false;
    }
}

<span class="tok-comment">// A simple arrow-ish cursor: a filled dot with a short tail line.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawCursor</span>(f: *z.Frame, center: Vec2, col: Color) void {
    <span class="tok-kw">const</span> tail: Vec2 = .{ center[<span class="tok-num">0</span>] - <span class="tok-num">10.0</span>, center[<span class="tok-num">1</span>] - <span class="tok-num">10.0</span> };
    f.gl.<span class="tok-fn">line</span>(tail, center, .{ .color = <span class="tok-fn">withAlpha</span>(col, <span class="tok-num">180</span>), .thickness = <span class="tok-num">2.0</span> });
    f.gl.<span class="tok-fn">circle</span>(center, <span class="tok-num">7.0</span>, .{ .color = col, .segments = <span class="tok-num">20</span> });
    f.gl.<span class="tok-fn">circle</span>(center, <span class="tok-num">3.0</span>, .{ .color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> }, .segments = <span class="tok-num">12</span> });
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - shared cursors"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .update = update,
    .deinit = deinit,
};
