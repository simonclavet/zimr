<h1>colors_palette</h1>
<figure class="code src-file" data-path="examples/colors_palette/colors_palette.zig" data-lines="167"><figcaption><span>examples/colors_palette/colors_palette.zig</span><span>167 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/colors_palette.zig - interactive grid of raylib's 21</span>
<span class="tok-comment">// named colour constants.</span>
<span class="tok-comment">// Port of raylib's `examples/shapes/shapes_colors_palette.c` (*2,</span>
<span class="tok-comment">// ~105 LOC).  Each colour gets a 100x100 swatch in a 7x3 grid;</span>
<span class="tok-comment">// hovering reveals the colour name and a darker bottom strip.</span>
<span class="tok-comment">// Holding SPACE reveals all labels at once.</span>
<span class="tok-comment">// What this exercises:</span>
<span class="tok-comment">//   - `z.colors.Color` namespace - the static raylib palette is</span>
<span class="tok-comment">//     exposed as `Color.maroon`, `Color.gold`, etc. (see</span>
<span class="tok-comment">//     `src/types.zig`'s field list).</span>
<span class="tok-comment">//   - `z.drawRectangleRec` and `drawRectangleLinesThick` for</span>
<span class="tok-comment">//     filled vs outlined swatches.</span>
<span class="tok-comment">//   - Per-swatch hover state via the rectangle-point overlap test</span>
<span class="tok-comment">//     (this maps to raylib's `CheckCollisionPointRec`; zimr's</span>
<span class="tok-comment">//     equivalent is the small math helper at the bottom).</span>
<span class="tok-comment">//   - `Color.fade(c, alpha)` - the standard "transparency"</span>
<span class="tok-comment">//     operation; in raylib it's the `Fade()` macro.  In zimr it's</span>
<span class="tok-comment">//     a method on `Color`.  Same multiplier semantics.</span>
<span class="tok-comment">// Controls:</span>
<span class="tok-comment">//   Hover    swatch fades and reveals the colour name in its bottom strip</span>
<span class="tok-comment">//   SPACE    reveal every label at once</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> screen_w: i32 = <span class="tok-num">800</span>;
<span class="tok-kw">const</span> screen_h: i32 = <span class="tok-num">450</span>;
<span class="tok-kw">const</span> swatch_size: f32 = <span class="tok-num">100.0</span>;
<span class="tok-kw">const</span> gap: f32 = <span class="tok-num">10.0</span>;
<span class="tok-kw">const</span> cols: usize = <span class="tok-num">7</span>;
<span class="tok-kw">const</span> rows: usize = <span class="tok-num">3</span>;
<span class="tok-kw">const</span> total: usize = cols * rows;

<span class="tok-kw">const</span> c = Color;

<span class="tok-comment">// The 21 named raylib colours in the order raylib's example uses</span>
<span class="tok-comment">// them.  Order matters for the grid layout below.</span>
<span class="tok-kw">const</span> palette = [total]Color{
    c.darkgray,  c.maroon, c.orange, c.darkgreen, c.darkblue, c.darkpurple, c.darkbrown,
    c.gray,      c.red,    c.gold,   c.lime,      c.blue,     c.violet,     c.brown,
    c.lightgray, c.pink,   c.yellow, c.green,     c.skyblue,  c.purple,     c.beige,
};

<span class="tok-kw">const</span> names = [total][]<span class="tok-kw">const</span> u8{
    <span class="tok-str">"DARKGRAY"</span>,  <span class="tok-str">"MAROON"</span>, <span class="tok-str">"ORANGE"</span>, <span class="tok-str">"DARKGREEN"</span>, <span class="tok-str">"DARKBLUE"</span>, <span class="tok-str">"DARKPURPLE"</span>, <span class="tok-str">"DARKBROWN"</span>,
    <span class="tok-str">"GRAY"</span>,      <span class="tok-str">"RED"</span>,    <span class="tok-str">"GOLD"</span>,   <span class="tok-str">"LIME"</span>,      <span class="tok-str">"BLUE"</span>,     <span class="tok-str">"VIOLET"</span>,     <span class="tok-str">"BROWN"</span>,
    <span class="tok-str">"LIGHTGRAY"</span>, <span class="tok-str">"PINK"</span>,   <span class="tok-str">"YELLOW"</span>, <span class="tok-str">"GREEN"</span>,     <span class="tok-str">"SKYBLUE"</span>,  <span class="tok-str">"PURPLE"</span>,     <span class="tok-str">"BEIGE"</span>,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// Owned shapes-texture state.  Default-init points at rlgl's</span>
    <span class="tok-comment">/// internal 1x1 white pixel (texture id=1) - no upload needed.</span>
    <span class="tok-comment">/// Owned default-font cache.  Populated by `z.loadFontFromTtfBytes`</span>
    <span class="tok-comment">/// in `initState` below.</span>
    font: z.Font,
    frame_count: usize = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Bitmask of "this swatch is being hovered" - set during the</span>
    <span class="tok-comment">/// hover pass each frame.  Could fit in a single u32 but the</span>
    <span class="tok-comment">/// bool array reads cleaner in the draw loop.</span>
    hover: [total]bool = <span class="tok-builtin">@splat</span>(false),
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">32</span>);
    s.* = .{ .font = font };
}

<span class="tok-comment">/// Point-in-rectangle hit test.  Closed on min, open on max</span>
<span class="tok-comment">/// (matches raylib's `CheckCollisionPointRec`).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pointInRect</span>(p: Vec2, r: z.Rectangle) bool {
    <span class="tok-kw">return</span> p[<span class="tok-num">0</span>] &gt;= r.x <span class="tok-kw">and</span> p[<span class="tok-num">0</span>] &lt;= (r.x + r.width) <span class="tok-kw">and</span>
        p[<span class="tok-num">1</span>] &gt;= r.y <span class="tok-kw">and</span> p[<span class="tok-num">1</span>] &lt;= (r.y + r.height);
}

<span class="tok-comment">/// Compute the rectangle for swatch index `i` in the 7x3 grid.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">swatchRect</span>(i: usize) z.Rectangle {
    <span class="tok-kw">const</span> col: f32 = <span class="tok-fn">float</span>(i % cols);
    <span class="tok-kw">const</span> row: f32 = <span class="tok-fn">float</span>(i / cols);
    <span class="tok-kw">return</span> .{
        .x = <span class="tok-num">20.0</span> + (swatch_size + gap) * col,
        .y = <span class="tok-num">80.0</span> + (swatch_size + gap) * row,
        .width = swatch_size,
        .height = swatch_size,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    state.frame_count += <span class="tok-num">1</span>;
    <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> mouse: Vec2 = .{ mp[<span class="tok-num">0</span>], mp[<span class="tok-num">1</span>] };

    <span class="tok-comment">// ---- Hit-test every swatch ------------------------------------------</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..total) |i| {
        state.hover[i] = <span class="tok-fn">pointInRect</span>(mouse, <span class="tok-fn">swatchRect</span>(i));
    }

    <span class="tok-kw">const</span> reveal_all: bool = z.<span class="tok-fn">isKeyDown</span>(f.input, .space);

    <span class="tok-comment">// ---- Render -----------------------------------------------------------</span>
    z.<span class="tok-fn">clearViewport</span>(f, c.raywhite);

    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">28</span>, <span class="tok-num">42</span> }, <span class="tok-str">"raylib colors palette"</span>, .{ .size = <span class="tok-num">20</span>, .color = c.black, .font = &amp;state.font });
    f.gl.<span class="tok-fn">text</span>(
        .{ screen_w - <span class="tok-num">180</span>, screen_h - <span class="tok-num">40</span> },
        <span class="tok-str">"press SPACE to see all colors"</span>,
        .{ .size = <span class="tok-num">10</span>, .color = c.gray, .font = &amp;state.font },
    );

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..total) |i| {
        <span class="tok-kw">const</span> rect: z.Rectangle = <span class="tok-fn">swatchRect</span>(i);
        <span class="tok-kw">const</span> fill: Color = <span class="tok-kw">if</span> (state.hover[i]) palette[i].<span class="tok-fn">fade</span>(<span class="tok-num">0.6</span>) <span class="tok-kw">else</span> palette[i];

        f.gl.<span class="tok-fn">rect</span>(rect, .{ .color = fill });

        <span class="tok-comment">// Show label if either reveal-all is on or the swatch is hovered.</span>
        <span class="tok-kw">if</span> (reveal_all <span class="tok-kw">or</span> state.hover[i]) {
            <span class="tok-comment">// Dark strip behind the label (raylib uses a black bar</span>
            <span class="tok-comment">// at the bottom of the swatch).</span>
            f.gl.<span class="tok-fn">rect</span>(
                .{ .x = rect.x, .y = rect.y + rect.height - <span class="tok-num">26</span>, .width = rect.width, .height = <span class="tok-num">20.0</span> },
                .{ .color = c.black },
            );
            <span class="tok-comment">// Border around the entire swatch in faded black.</span>
            f.gl.<span class="tok-fn">rect</span>(
                .{ .x = rect.x, .y = rect.y, .width = rect.width, .height = rect.height },
                .{ .color = c.black.<span class="tok-fn">fade</span>(<span class="tok-num">0.3</span>), .outline = <span class="tok-num">6</span> },
            );

            <span class="tok-comment">// Name aligned to the right inside the dark strip,</span>
            <span class="tok-comment">// coloured with the swatch's own colour so it reads</span>
            <span class="tok-comment">// against black.</span>
            <span class="tok-kw">const</span> label_w: f32 = z.<span class="tok-fn">measureText</span>(state.font, names[i], <span class="tok-num">10</span>)[<span class="tok-num">0</span>];
            <span class="tok-kw">const</span> tx: f32 = rect.x + rect.width - label_w - <span class="tok-num">12</span>;
            <span class="tok-kw">const</span> ty: f32 = rect.y + rect.height - <span class="tok-num">20</span>;
            f.gl.<span class="tok-fn">text</span>(.{ tx, ty }, names[i], .{ .size = <span class="tok-num">10</span>, .color = palette[i], .font = &amp;state.font });
        }
    }
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}
