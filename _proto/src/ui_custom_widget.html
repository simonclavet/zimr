<style>

<h1>ui_custom_widget</h1>
<figure class="code src-file" data-path="examples/ui_custom_widget/ui_custom_widget.zig" data-lines="187"><figcaption><span>examples/ui_custom_widget/ui_custom_widget.zig</span><span>187 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_custom_widget.zig</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Reference implementation of a CUSTOM WIDGET built on the public</span>
<span class="tok-comment">// `beginItem` / `endItem` extension primitives plus the typed-</span>
<span class="tok-comment">// generic ext-state storage (`getState` / `getOrPutState`).  No</span>
<span class="tok-comment">// internals reached - everything imports through `z.ui`.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The widget: `starRating(label, value: *u8, max_stars)`.  Renders</span>
<span class="tok-comment">// a row of star glyphs; clicking the Nth star sets value to N.</span>
<span class="tok-comment">// Hover highlights stars up to the cursor.  A future animated grow</span>
<span class="tok-comment">// on the hovered star would use `u.animated`.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// This is the file extension authors should look at when they</span>
<span class="tok-comment">// want to know "how do I write a custom widget for zimr."  It's</span>
<span class="tok-comment">// SHORT because the primitives do the boilerplate.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Build standalone:</span>
<span class="tok-comment">//   zig build install -Dfocus=ui_custom_widget</span>
<span class="tok-comment">//   python3 scripts/build_standalone.py ui_custom_widget</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> ui = z.ui_real;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    rating_food: u8 = <span class="tok-num">3</span>,
    rating_service: u8 = <span class="tok-num">0</span>,
    rating_ambience: u8 = <span class="tok-num">5</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">28</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
}

<span class="tok-comment">/// Per-widget hover state.  Stored in Q2 by widget id - multiple</span>
<span class="tok-comment">/// `starRating` instances each get their own slot.</span>
<span class="tok-kw">const</span> StarRatingState = <span class="tok-kw">struct</span> {
    hover_index: i32 = -<span class="tok-num">1</span>, <span class="tok-comment">// -1 = not hovered; else index in 0..max-1</span>
};

<span class="tok-comment">/// Custom widget built on widget primitives + ext-state storage.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Pattern (the whole point of this file):</span>
<span class="tok-comment">///   1. Compute size from caller args.</span>
<span class="tok-comment">///   2. `u.beginItem(label, .{.size = ...})` - does ID hashing,</span>
<span class="tok-comment">///      cursor placement, clip test, hovered_id update, AND the</span>
<span class="tok-comment">///      press/release state machine in one call.</span>
<span class="tok-comment">///   3. Read/write per-id state via `u.getOrPutState`.</span>
<span class="tok-comment">///   4. Draw based on `it.hovered`, `it.held`, `it.rect`.</span>
<span class="tok-comment">///   5. Return whether the value changed.</span>
<span class="tok-comment">///   6. `defer u.endItem(it)` advances the cursor.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Returns true if the user clicked a star this frame.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">starRating</span>(
    u: ui.Ui,
    label: []<span class="tok-kw">const</span> u8,
    value: *u8,
    max_stars: u8,
) bool {
    <span class="tok-kw">const</span> STAR_SIZE: f32 = <span class="tok-num">28</span>;
    <span class="tok-kw">const</span> STAR_SPACING: f32 = <span class="tok-num">2</span>;
    <span class="tok-kw">const</span> row_width: f32 = <span class="tok-fn">float</span>(max_stars) * (STAR_SIZE + STAR_SPACING) - STAR_SPACING;

    <span class="tok-kw">const</span> it: ui.Ui.ItemCtx = u.<span class="tok-fn">beginItem</span>(label, .{
        .size = .{ row_width, STAR_SIZE },
    }) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> false;
    <span class="tok-kw">defer</span> u.<span class="tok-fn">endItem</span>(it);

    <span class="tok-kw">const</span> r = u.<span class="tok-fn">getOrPutState</span>(StarRatingState, it.id, .{});
    <span class="tok-kw">if</span> (!r.found_existing) {
        r.value_ptr.* = .{};
    }
    <span class="tok-kw">const</span> state: *StarRatingState = r.value_ptr;

    <span class="tok-comment">// Compute which star the mouse is over (if any).  Using</span>
    <span class="tok-comment">// it.rect to keep coords consistent with what itemAdd</span>
    <span class="tok-comment">// registered.</span>
    <span class="tok-kw">var</span> hover_idx: i32 = -<span class="tok-num">1</span>;
    <span class="tok-kw">if</span> (it.hovered) {
        <span class="tok-kw">const</span> local_x: f32 = u.ctx.input.mouse_pos[<span class="tok-num">0</span>] - it.rect.x;
        <span class="tok-kw">const</span> star_pitch: f32 = STAR_SIZE + STAR_SPACING;
        <span class="tok-kw">const</span> idx: i32 = <span class="tok-builtin">@floor</span>(local_x / star_pitch);
        <span class="tok-kw">if</span> (idx &gt;= <span class="tok-num">0</span> <span class="tok-kw">and</span> idx &lt; <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(max_stars))) {
            hover_idx = idx;
        }
    }
    state.hover_index = hover_idx;

    <span class="tok-comment">// Click -&gt; set value to hovered star (1-indexed for human-</span>
    <span class="tok-comment">// readable "3 out of 5 stars" semantics).</span>
    <span class="tok-kw">var</span> changed: bool = false;
    <span class="tok-kw">if</span> (it.pressed <span class="tok-kw">and</span> hover_idx &gt;= <span class="tok-num">0</span>) {
        value.* = <span class="tok-builtin">@intCast</span>(hover_idx + <span class="tok-num">1</span>);
        changed = true;
    }

    <span class="tok-comment">// Draw each star into the window's draw list - clipped to the</span>
    <span class="tok-comment">// window content rect, so stars never spill past the edge.</span>
    <span class="tok-comment">// (getWindowDrawList exposes the same list built-in widgets use.)</span>
    <span class="tok-kw">const</span> dl: ui.DrawListHandle = u.<span class="tok-fn">getWindowDrawList</span>();
    <span class="tok-kw">const</span> filled_cutoff: i32 = <span class="tok-builtin">@max</span>(<span class="tok-builtin">@as</span>(i32, value.*), hover_idx + <span class="tok-num">1</span>);
    <span class="tok-kw">var</span> i: u8 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; max_stars) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> star_rect: z.Rectangle = .{
            .x = it.rect.x + <span class="tok-fn">float</span>(i) * (STAR_SIZE + STAR_SPACING),
            .y = it.rect.y,
            .width = STAR_SIZE,
            .height = STAR_SIZE,
        };
        <span class="tok-kw">const</span> is_filled: bool = <span class="tok-builtin">@as</span>(i32, i) &lt; filled_cutoff;
        <span class="tok-kw">const</span> color: Color = <span class="tok-kw">if</span> (is_filled)
            .{ .r = <span class="tok-num">0xFF</span>, .g = <span class="tok-num">0xD7</span>, .b = <span class="tok-num">0x00</span>, .a = <span class="tok-num">0xFF</span> } <span class="tok-comment">// gold</span>
        <span class="tok-kw">else</span>
            .{ .r = <span class="tok-num">0x44</span>, .g = <span class="tok-num">0x44</span>, .b = <span class="tok-num">0x4A</span>, .a = <span class="tok-num">0xFF</span> }; <span class="tok-comment">// dim</span>
        <span class="tok-comment">// Simple square stand-in for a star - keep this example</span>
        <span class="tok-comment">// about the widget pattern, not glyph rendering.  Real</span>
        <span class="tok-comment">// implementations would u.text("*", ...) at the right pos.</span>
        dl.<span class="tok-fn">addRectFilled</span>(star_rect, color);
    }

    <span class="tok-kw">return</span> changed;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">18</span>, .b = <span class="tok-num">26</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Restaurant review"</span>, .{
        .initial_pos = .{ <span class="tok-num">20</span>, <span class="tok-num">20</span> },
        .initial_size = .{ <span class="tok-num">440</span>, <span class="tok-num">320</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Rate each axis:"</span>, .{});
        u.<span class="tok-fn">spacing</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Food:"</span>, .{});
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = <span class="tok-fn">starRating</span>(u, <span class="tok-str">"food"</span>, &amp;s.rating_food, <span class="tok-num">5</span>);

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Service:"</span>, .{});
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = <span class="tok-fn">starRating</span>(u, <span class="tok-str">"service"</span>, &amp;s.rating_service, <span class="tok-num">5</span>);

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Ambience:"</span>, .{});
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = <span class="tok-fn">starRating</span>(u, <span class="tok-str">"ambience"</span>, &amp;s.rating_ambience, <span class="tok-num">5</span>);

        u.<span class="tok-fn">spacing</span>();
        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">spacing</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Stored: food={d}/5 service={d}/5 ambience={d}/5"</span>, .{
            s.rating_food, s.rating_service, s.rating_ambience,
        });
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - custom widget reference"</span>,
            .width = <span class="tok-num">480</span>,
            .height = <span class="tok-num">360</span>,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
};
