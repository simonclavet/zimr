<h1>audio_spectrum_visualizer</h1>
<figure class="code src-file" data-path="examples/audio_spectrum_visualizer/audio_spectrum_visualizer.zig" data-lines="221"><figcaption><span>examples/audio_spectrum_visualizer/audio_spectrum_visualizer.zig</span><span>221 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/audio_spectrum_visualizer.zig - live FFT of whatever is playing.</span>
<span class="tok-comment">// Ports raylib's `audio_spectrum_visualizer`.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The spectrum comes from a WebAudio AnalyserNode tapped off the master bus. It</span>
<span class="tok-comment">// is a TAP, not an insert: master already reaches the speakers, and the analyser</span>
<span class="tok-comment">// merely receives a copy - so attaching one cannot alter what you hear. Each</span>
<span class="tok-comment">// frame it writes one byte per frequency bin (0..255) STRAIGHT into a wasm-side</span>
<span class="tok-comment">// slice; there is no intermediate copy.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What this exercises (the engine work this drove):</span>
<span class="tok-comment">//   - `z.analyser.attach / read / detach` - NEW. Backed by three new host</span>
<span class="tok-comment">//     functions in the WebAudio bridge (`js_audio_create_analyser`,</span>
<span class="tok-comment">//     `js_audio_get_frequency_data`, `js_audio_destroy_analyser`), which is only</span>
<span class="tok-comment">//     possible now that bridge.zig provides an `audio` import namespace at all.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Bins are drawn on a LOG frequency axis, because a linear one wastes most of the</span>
<span class="tok-comment">// screen on the inaudible top octaves - musical content lives in the bottom fifth</span>
<span class="tok-comment">// of a linear FFT.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Leak-clean (`.memory = .managed`): sounds + UiHost are released in deinit.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> clamp = zm.clamp;

<span class="tok-kw">const</span> fft_size: u32 = <span class="tok-num">1024</span>;
<span class="tok-kw">const</span> max_bins: usize = fft_size / <span class="tok-num">2</span>; <span class="tok-comment">// usable bins = half the FFT</span>
<span class="tok-kw">const</span> bars: usize = <span class="tok-num">48</span>;
<span class="tok-kw">const</span> voice_count: usize = <span class="tok-num">4</span>;

<span class="tok-comment">/// Four tones spread over the spectrum, so the bars have something to separate.</span>
<span class="tok-kw">const</span> freqs = [voice_count]f32{ <span class="tok-num">110.0</span>, <span class="tok-num">330.0</span>, <span class="tok-num">880.0</span>, <span class="tok-num">2200.0</span> };
<span class="tok-kw">const</span> names = [voice_count][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"110 Hz"</span>, <span class="tok-str">"330 Hz"</span>, <span class="tok-str">"880 Hz"</span>, <span class="tok-str">"2.2 kHz"</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    ui_font: z.Font,
    audio: z.AudioState = .{},
    an: z.analyser.Analyser = .{},

    voice: [voice_count]z.Sound,
    spectrum: [max_bins]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    smooth: [bars]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>), <span class="tok-comment">// display-smoothed bar heights</span>
    bins: u32 = <span class="tok-num">0</span>,
    loop_on: bool = false,
    next_hit: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    z.audio_device.<span class="tok-fn">init</span>(f.audio_device);

    <span class="tok-kw">var</span> audio: z.AudioState = .{};
    <span class="tok-kw">const</span> env: z.composer.Envelope = .{ .attack_ms = <span class="tok-num">8.0</span>, .release_ms = <span class="tok-num">260.0</span> };

    <span class="tok-kw">var</span> voice: [voice_count]z.Sound = undefined;
    <span class="tok-kw">for</span> (freqs, <span class="tok-num">0</span>..) |hz, i| {
        <span class="tok-kw">const</span> w: z.Wave = <span class="tok-kw">try</span> z.composer.<span class="tok-fn">tone</span>(&amp;audio.waves, gpa, .{
            .frequency_hz = hz,
            .duration_ms = <span class="tok-num">700</span>,
            .shape = .sine, <span class="tok-comment">// a pure tone =&gt; one clean peak, so the FFT is readable</span>
            .amplitude = <span class="tok-num">0.32</span>,
            .envelope = env,
        });
        <span class="tok-kw">defer</span> z.waves.<span class="tok-fn">unload</span>(&amp;audio.waves, w);
        voice[i] = <span class="tok-kw">try</span> z.sounds.<span class="tok-fn">loadFromWave</span>(&amp;audio.sounds, f.audio_device, gpa, w);
    }

    <span class="tok-kw">const</span> an: z.analyser.Analyser = z.analyser.<span class="tok-fn">attach</span>(f.audio_device, fft_size);

    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">15</span>);

    s.* = .{
        .ui_font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
        .font = font,
        .audio = audio,
        .an = an,
        .voice = voice,
        .bins = an.bins,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.ui_font);
    <span class="tok-kw">for</span> (s.voice) |v| {
        z.sounds.<span class="tok-fn">unload</span>(&amp;s.audio.sounds, v);
    }
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-comment">// Pull this frame's spectrum. Returns 0 bins when there's no analyser (e.g. a</span>
    <span class="tok-comment">// native host), so everything below degrades to a flat, silent display rather</span>
    <span class="tok-comment">// than reading stale samples.</span>
    <span class="tok-kw">const</span> n: u32 = z.analyser.<span class="tok-fn">read</span>(f.audio_device, s.an, &amp;s.spectrum);

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">14</span>, .g = <span class="tok-num">16</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-kw">if</span> (s.loop_on <span class="tok-kw">and</span> f.time.time &gt;= s.next_hit) {
        <span class="tok-comment">// Round-robin the voices so the peak visibly walks up the spectrum.</span>
        <span class="tok-kw">const</span> idx: usize = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@mod</span>(f.time.time * <span class="tok-num">1.6</span>, <span class="tok-fn">float</span>(voice_count)));
        z.sounds.<span class="tok-fn">play</span>(&amp;s.audio.sounds, s.voice[idx]);
        s.next_hit = f.time.time + <span class="tok-num">0.62</span>;
    }

    <span class="tok-comment">// ---- bars -------------------------------------------------------------</span>
    <span class="tok-kw">const</span> base_y: f32 = fh - <span class="tok-num">30.0</span>;
    <span class="tok-kw">const</span> top_y: f32 = <span class="tok-num">300.0</span>;
    <span class="tok-kw">const</span> height: f32 = <span class="tok-builtin">@max</span>(base_y - top_y, <span class="tok-num">60.0</span>);
    <span class="tok-kw">const</span> bw: f32 = (fw - <span class="tok-num">24.0</span>) / <span class="tok-fn">float</span>(bars);

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..bars) |i| {
        <span class="tok-comment">// LOG bin mapping: bar i covers [lo, hi) so each bar spans a constant</span>
        <span class="tok-comment">// RATIO of frequency, which is how pitch actually works. A linear map</span>
        <span class="tok-comment">// would cram every musical tone into the leftmost few bars.</span>
        <span class="tok-kw">const</span> t0: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(bars);
        <span class="tok-kw">const</span> t1: f32 = <span class="tok-fn">float</span>(i + <span class="tok-num">1</span>) / <span class="tok-fn">float</span>(bars);
        <span class="tok-kw">const</span> nb: f32 = <span class="tok-fn">float</span>(<span class="tok-builtin">@max</span>(n, <span class="tok-num">1</span>));
        <span class="tok-kw">const</span> lo: usize = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@min</span>(nb - <span class="tok-num">1.0</span>, <span class="tok-builtin">@exp</span>(t0 * <span class="tok-builtin">@log</span>(nb))));
        <span class="tok-kw">const</span> hi: usize = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@min</span>(nb, <span class="tok-builtin">@exp</span>(t1 * <span class="tok-builtin">@log</span>(nb))));

        <span class="tok-kw">var</span> peak: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">var</span> k: usize = lo;
        <span class="tok-kw">while</span> (k &lt; <span class="tok-builtin">@max</span>(hi, lo + <span class="tok-num">1</span>) <span class="tok-kw">and</span> k &lt; n) : (k += <span class="tok-num">1</span>) {
            peak = <span class="tok-builtin">@max</span>(peak, <span class="tok-fn">float</span>(s.spectrum[k]) / <span class="tok-num">255.0</span>);
        }

        <span class="tok-comment">// Attack fast, release slow - otherwise the bars strobe and read as noise.</span>
        <span class="tok-kw">const</span> prev: f32 = s.smooth[i];
        s.smooth[i] = <span class="tok-kw">if</span> (peak &gt; prev) peak <span class="tok-kw">else</span> prev + (peak - prev) * <span class="tok-num">0.18</span>;

        <span class="tok-kw">const</span> h: f32 = <span class="tok-fn">clamp</span>(s.smooth[i], <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>) * height;
        <span class="tok-kw">const</span> x: f32 = <span class="tok-num">12.0</span> + <span class="tok-fn">float</span>(i) * bw;
        <span class="tok-kw">const</span> heat: f32 = <span class="tok-fn">clamp</span>(s.smooth[i], <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>);
        <span class="tok-kw">const</span> col: Color = .{
            .r = <span class="tok-builtin">@trunc</span>(<span class="tok-num">60.0</span> + <span class="tok-num">195.0</span> * heat),
            .g = <span class="tok-builtin">@trunc</span>(<span class="tok-num">200.0</span> - <span class="tok-num">90.0</span> * heat),
            .b = <span class="tok-builtin">@trunc</span>(<span class="tok-num">180.0</span> - <span class="tok-num">60.0</span> * heat),
            .a = <span class="tok-num">255</span>,
        };
        f.gl.<span class="tok-fn">rect</span>(
            .{ .x = x + <span class="tok-num">1.0</span>, .y = base_y - h, .width = bw - <span class="tok-num">2.0</span>, .height = h },
            .{ .color = col },
        );
    }
    f.gl.<span class="tok-fn">line</span>(.{ <span class="tok-num">12</span>, base_y }, .{ fw - <span class="tok-num">12.0</span>, base_y }, .{
        .color = .{ .r = <span class="tok-num">60</span>, .g = <span class="tok-num">66</span>, .b = <span class="tok-num">84</span>, .a = <span class="tok-num">255</span> },
        .thickness = <span class="tok-num">2</span>,
    });
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">12</span>, base_y + <span class="tok-num">6.0</span> }, <span class="tok-str">"low"</span>, .{ .size = <span class="tok-num">14</span>, .color = c.gray, .font = &amp;s.font });
    f.gl.<span class="tok-fn">text</span>(
        .{ fw - <span class="tok-num">60.0</span>, base_y + <span class="tok-num">6.0</span> },
        <span class="tok-str">"high"</span>,
        .{ .size = <span class="tok-num">14</span>, .color = c.gray, .font = &amp;s.font },
    );

    <span class="tok-comment">// ---- UI ---------------------------------------------------------------</span>
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16.0</span>, <span class="tok-num">270</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Spectrum"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Tap a tone; watch its peak move."</span>, .{});
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">for</span> (names, <span class="tok-num">0</span>..) |nm, i| {
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(nm, .{})) {
                z.sounds.<span class="tok-fn">play</span>(&amp;s.audio.sounds, s.voice[i]);
            }
            <span class="tok-kw">if</span> (i % <span class="tok-num">2</span> == <span class="tok-num">0</span>) {
                u.<span class="tok-fn">sameLine</span>(.{});
            }
        }
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-kw">if</span> (s.loop_on) <span class="tok-str">"Auto: ON"</span> <span class="tok-kw">else</span> <span class="tok-str">"Auto: OFF"</span>, .{})) {
            s.loop_on = !s.loop_on;
        }
        <span class="tok-comment">// If bins is 0 the analyser never attached - say so, rather than showing a</span>
        <span class="tok-comment">// convincingly-empty graph.</span>
        <span class="tok-kw">if</span> (s.bins == <span class="tok-num">0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"no analyser (audio host missing?)"</span>, .{});
        } <span class="tok-kw">else</span> {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"fft {d}   bins {d}   live {d}"</span>, .{ fft_size, s.bins, n });
        }
    }

    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - audio - spectrum visualizer"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            .scale_mode = .responsive,
            .depth_format = null,
            .clear = .{ .r = <span class="tok-num">14.0</span> / <span class="tok-num">255.0</span>, .g = <span class="tok-num">16.0</span> / <span class="tok-num">255.0</span>, .b = <span class="tok-num">24.0</span> / <span class="tok-num">255.0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    .memory = .managed,
};
