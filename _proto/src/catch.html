<h1>catch</h1>
<figure class="code src-file" data-path="examples/catch/catch.zig" data-lines="696"><figcaption><span>examples/catch/catch.zig</span><span>696 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! catch - an arm that reaches ahead into empty space, and one that chases.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A ball is thrown across the workspace. Both arms must **catch** it: be at the right place, at</span>
<span class="tok-comment">//! the right moment, **moving with it**. The near one runs IK plus a PD to the interception; the</span>
<span class="tok-comment">//! far one plans.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- *** WATCH THE RELATIVE SPEED, NOT THE DISTANCE --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The servo is very good at the obvious metric and useless at the job:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!     controller    closest gap    relative speed    verdict</span>
<span class="tok-comment">//!     IK + PD           5-11 mm       5.0-7.0 m/s    swats every one</span>
<span class="tok-comment">//!     MPC              84-178 mm       1.4-2.2 m/s    closing</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! **A PD driven to a fixed pose arrives and STOPS.** The ball is doing 4.7 m/s, so the hand</span>
<span class="tok-comment">//! meets it at 5 to 7 m/s of relative speed and knocks it across the room. Position says it</span>
<span class="tok-comment">//! caught the ball. It did not.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! That distinction is why the acceptance test was written down before any code existed -</span>
<span class="tok-comment">//! `|relative speed| &lt; 0.5 m/s` - and it is the only reason a controller that looks perfect is</span>
<span class="tok-comment">//! correctly scored at zero.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** THE ARM IS INVENTED, AND THAT IS THE POINT --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Five joints, 1.28 m reach, finite torque. It corresponds to no real robot because the target</span>
<span class="tok-comment">//! is a game in which characters are physically simulated robots, not sim2real. A URDF import</span>
<span class="tok-comment">//! would have arrived with **no actuators at all** - URDF has no concept of one - and nothing to</span>
<span class="tok-comment">//! plan with.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * HONEST STATUS --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Neither controller catches yet by the full criterion. The planner is at 0.08 m and 1.4 m/s</span>
<span class="tok-comment">//! against bars of 0.05 and 0.5, and it got there through two library fixes that matter beyond</span>
<span class="tok-comment">//! this demo: the control box is now on by default (the plan was asking for 357 N*m against a</span>
<span class="tok-comment">//! +/-260 limit and being silently clamped), and `Plan.setHorizon` lets the terminal cost land at</span>
<span class="tok-comment">//! the interception rather than 0.88 s past it - which alone was worth 6x in distance.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> hand_colour: Color = .{ .r = <span class="tok-num">89</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">153</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> ball_colour: Color = .{ .r = <span class="tok-num">237</span>, .g = <span class="tok-num">184</span>, .b = <span class="tok-num">89</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> arc_colour: Color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">100</span>, .b = <span class="tok-num">124</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> meet_colour: Color = .{ .r = <span class="tok-num">226</span>, .g = <span class="tok-num">106</span>, .b = <span class="tok-num">154</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> trail_colour: Color = .{ .r = <span class="tok-num">96</span>, .g = <span class="tok-num">132</span>, .b = <span class="tok-num">186</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">fn</span> <span class="tok-fn">ballAt</span>(p0: Vec, v0: Vec, t: f32) Vec {
    <span class="tok-kw">return</span> p0 + v0 * <span class="tok-fn">splat</span>(t) + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">0.5</span> * gravity * t * t);
}
<span class="tok-kw">fn</span> <span class="tok-fn">ballVel</span>(v0: Vec, t: f32) Vec {
    <span class="tok-kw">return</span> v0 + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -gravity * t);
}

<span class="tok-comment">/// One arm and whichever controller drives it.</span>
<span class="tok-kw">const</span> Keeper = <span class="tok-kw">struct</span> {
    data: rbt.Data,
    plan: mpc.Plan,
    planned: bool,
    <span class="tok-comment">/// The pose that meets the ball, and the joint speeds that match its velocity there.</span>
    meet_pose: []f32,
    meet_qvel: []f32,
    meet_time: f32,
    reference: []f32,
    <span class="tok-comment">/// Closest approach so far, and the relative speed at that instant.</span>
    best_gap: f32,
    best_relative: f32,
    <span class="tok-comment">/// -- *** WHERE THE DECISION WAS RESOLVED, KEPT SO IT CAN BE SHOWN --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// The whole verdict turns on one instant lasting about 30 ms, and a demo that only draws</span>
    <span class="tok-comment">/// the live frame throws it away before anyone can look. These hold the hand and the ball at</span>
    <span class="tok-comment">/// closest approach so the moment persists after the throw is over.</span>
    best_hand: Vec,
    best_ball: Vec,
    <span class="tok-comment">/// Where the hand has been, so reaching AHEAD is visible rather than inferred.</span>
    trail: [<span class="tok-num">180</span>]Vec,
    trail_count: usize,
    caught: u32,
    swatted: u32,
    missed: u32,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    doc: z.codecs.xml.Document,
    robot: mjcf.Robot,
    imported: rmj.Imported,
    model: rbt.Model,
    hand: u32,
    rest: []f32,
    arm_act: ctl.Actuation,
    all_act: ctl.Actuation,
    ik_scratch: []Vec,
    state_w: []f32,
    term_w: []f32,
    ctrl_w: []f32,

    servo: Keeper,
    planner: Keeper,

    ball_p0: Vec,
    ball_v0: Vec,
    flight: f32,
    in_flight: bool,
    throw_speed: f32,
    throw_side: f32,
    seed: u32,

    accumulator: f32,
    running: bool,
    <span class="tok-comment">/// Seconds since the last throw ended, for the auto-repeat.</span>
    idle: f32,
    <span class="tok-comment">/// * SLOW BY DEFAULT. The catch happens in about 30 ms of simulated time; at full speed the</span>
    <span class="tok-comment">/// entire argument of the demo is over before the eye has found the ball.</span>
    time_scale: f32,

    cam: z.OrbitCamera,
    font: z.Font,
    ui_host: z.UiHost,
    cube: z.Mesh,
    sphere: z.Mesh,
    transform: [<span class="tok-num">1</span>]Mat,
};

<span class="tok-kw">fn</span> <span class="tok-fn">makeKeeper</span>(gpa: Allocator, model: *<span class="tok-kw">const</span> rbt.Model, planned: bool) !Keeper {
    <span class="tok-kw">const</span> plan: mpc.Plan = <span class="tok-kw">try</span> mpc.Plan.<span class="tok-fn">init</span>(gpa, model, max_horizon);
    <span class="tok-kw">return</span> .{
        .data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, model),
        .plan = plan,
        .planned = planned,
        .meet_pose = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, model.nq),
        .meet_qvel = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, model.nv),
        .meet_time = -<span class="tok-num">1</span>,
        .reference = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, (max_horizon + <span class="tok-num">1</span>) * (model.nq + model.nv)),
        .best_gap = <span class="tok-num">1.0e9</span>,
        .best_relative = <span class="tok-num">0</span>,
        .best_hand = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .best_ball = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .trail = <span class="tok-builtin">@splat</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>)),
        .trail_count = <span class="tok-num">0</span>,
        .caught = <span class="tok-num">0</span>,
        .swatted = <span class="tok-num">0</span>,
        .missed = <span class="tok-num">0</span>,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.gpa = gpa;
    s.doc = <span class="tok-kw">try</span> z.codecs.xml.<span class="tok-fn">parse</span>(gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"keeper.xml"</span>), null);
    s.robot = <span class="tok-kw">try</span> mjcf.<span class="tok-fn">readRobot</span>(gpa, &amp;s.doc);
    s.imported = <span class="tok-kw">try</span> rmj.<span class="tok-fn">build</span>(gpa, &amp;s.robot, .{
        .max_contacts = <span class="tok-num">16</span>,
        .timestep = sim_dt,
        .gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -gravity),
    });
    s.model = s.imported.model;
    s.hand = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"hand"</span>) <span class="tok-kw">orelse</span> <span class="tok-num">0</span>;

    s.servo = <span class="tok-kw">try</span> <span class="tok-fn">makeKeeper</span>(gpa, &amp;s.model, false);
    s.planner = <span class="tok-kw">try</span> <span class="tok-fn">makeKeeper</span>(gpa, &amp;s.model, true);
    rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;s.servo.data);
    s.rest = <span class="tok-kw">try</span> gpa.<span class="tok-fn">dupe</span>(f32, s.servo.data.pos);

    s.arm_act = <span class="tok-kw">try</span> ctl.<span class="tok-fn">limbActuation</span>(gpa, &amp;s.model, s.hand);
    s.all_act = <span class="tok-kw">try</span> ctl.Actuation.<span class="tok-fn">init</span>(gpa, &amp;s.model);
    s.ik_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, ctl.Ik.<span class="tok-fn">scratchSize</span>(&amp;s.model));

    s.state_w = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.planner.plan.ndx);
    s.term_w = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.planner.plan.ndx);
    s.ctrl_w = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.model.nu);
    <span class="tok-comment">// * POSITION AND VELOCITY BLOCKS SEPARATELY. `ndx` is nv positions THEN nv velocities, and</span>
    <span class="tok-comment">// the joint speeds that match 4.7 m/s of hand travel are large - one number for both lets</span>
    <span class="tok-comment">// the velocity term swamp everything else in the problem.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.model.nv) |i| {
        s.state_w[i] = <span class="tok-num">0.5</span>;
        s.state_w[s.model.nv + i] = <span class="tok-num">0.02</span>;
        s.term_w[i] = <span class="tok-num">60.0</span>;
        s.term_w[s.model.nv + i] = <span class="tok-num">4.0</span>;
    }
    <span class="tok-builtin">@memset</span>(s.ctrl_w, <span class="tok-num">1.0e-4</span>);

    s.throw_speed = <span class="tok-num">3.4</span>;
    s.throw_side = <span class="tok-num">0.0</span>;
    s.seed = <span class="tok-num">0x2545f491</span>;
    s.in_flight = false;
    s.flight = <span class="tok-num">0</span>;
    s.accumulator = <span class="tok-num">0</span>;
    s.running = true;
    s.idle = <span class="tok-num">0</span>;
    s.time_scale = <span class="tok-num">0.35</span>;

    s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.9</span>, <span class="tok-num">0</span>), <span class="tok-num">6.5</span>);
    s.font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font);
    s.cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    s.sphere = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">14</span>, <span class="tok-num">12</span>);
    s.transform = .{<span class="tok-fn">identity</span>()};
    <span class="tok-comment">// *** THROW ON START, AND THAT IS A GATE AS MUCH AS A COURTESY. The smoke run executes 60</span>
    <span class="tok-comment">// frames; with no ball in flight it never entered `optimize` at all, so the reference-length</span>
    <span class="tok-comment">// assert that fires in the browser could not fire there. A demo that idles until clicked</span>
    <span class="tok-comment">// has an automated check that verifies almost nothing.</span>
    <span class="tok-fn">throwBall</span>(s);
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.sphere);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cube);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (.{ &amp;s.planner, &amp;s.servo }) |k| {
        gpa.<span class="tok-fn">free</span>(k.reference);
        gpa.<span class="tok-fn">free</span>(k.meet_qvel);
        gpa.<span class="tok-fn">free</span>(k.meet_pose);
        k.plan.<span class="tok-fn">deinit</span>();
        k.data.<span class="tok-fn">deinit</span>();
    }
    gpa.<span class="tok-fn">free</span>(s.ctrl_w);
    gpa.<span class="tok-fn">free</span>(s.term_w);
    gpa.<span class="tok-fn">free</span>(s.state_w);
    gpa.<span class="tok-fn">free</span>(s.ik_scratch);
    s.all_act.<span class="tok-fn">deinit</span>();
    s.arm_act.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.rest);
    s.imported.<span class="tok-fn">deinit</span>();
    s.robot.<span class="tok-fn">deinit</span>();
    s.doc.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">resetArms</span>(s: *State) void {
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (.{ &amp;s.servo, &amp;s.planner }) |k| {
        <span class="tok-builtin">@memcpy</span>(k.data.pos, s.rest);
        <span class="tok-builtin">@memset</span>(k.data.vel, <span class="tok-num">0</span>);
        <span class="tok-builtin">@memset</span>(k.data.ctrl, <span class="tok-num">0</span>);
        k.data.stage = .stale;
        rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;k.data);
        k.best_gap = <span class="tok-num">1.0e9</span>;
        k.best_relative = <span class="tok-num">0</span>;
        k.meet_time = -<span class="tok-num">1</span>;
        k.trail_count = <span class="tok-num">0</span>;
        <span class="tok-comment">// * AND THE PLAN, NOT ONLY THE ARM. `optimize` warm-starts from `plan.ctrl`; leaving the</span>
        <span class="tok-comment">// last throw's commands there means the first tick of the next one applies them.</span>
        <span class="tok-builtin">@memset</span>(k.plan.ctrl, <span class="tok-num">0</span>);
        k.plan.<span class="tok-fn">setHorizon</span>(max_horizon);
    }
    s.in_flight = false;
    s.flight = <span class="tok-num">0</span>;
    s.idle = <span class="tok-num">0</span>;
}

<span class="tok-comment">/// Scan the arc for the LATEST instant the arm can still reach - more time to prepare, and the</span>
<span class="tok-comment">/// arm is not committed before it has to be. Reachability judged by `Ik.Result.reached` rather</span>
<span class="tok-comment">/// than a threshold invented for the occasion.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">planInterception</span>(s: *State, k: *Keeper) void {
    <span class="tok-kw">const</span> m: *rbt.Model = &amp;s.model;
    <span class="tok-kw">var</span> best: f32 = -<span class="tok-num">1</span>;
    <span class="tok-kw">var</span> t: f32 = <span class="tok-num">0.15</span>;
    <span class="tok-kw">while</span> (t &lt; <span class="tok-num">1.4</span>) : (t += <span class="tok-num">0.03</span>) {
        <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">ballAt</span>(s.ball_p0, s.ball_v0, t);
        <span class="tok-kw">if</span> (at[<span class="tok-num">2</span>] &lt; <span class="tok-num">0.3</span>) {
            <span class="tok-kw">break</span>;
        }
        <span class="tok-builtin">@memcpy</span>(k.data.pos, s.rest);
        k.data.stage = .stale;
        rbt.<span class="tok-fn">forward</span>(m, &amp;k.data);
        <span class="tok-kw">const</span> r: ctl.Ik.Result = (ctl.Ik{ .max_iterations = <span class="tok-num">50</span> }).<span class="tok-fn">solve</span>(
            m,
            &amp;k.data,
            s.arm_act,
            .{ .body = s.hand, .offset = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .goal = at },
            s.ik_scratch,
        );
        <span class="tok-kw">if</span> (r.reached) {
            best = t;
        }
    }
    k.meet_time = best;
    <span class="tok-builtin">@memcpy</span>(k.data.pos, s.rest);
    k.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;k.data);
    <span class="tok-kw">if</span> (best &lt;= <span class="tok-num">0</span>) {
        <span class="tok-builtin">@memcpy</span>(k.meet_pose, s.rest[<span class="tok-num">0</span>..m.nq]);
        <span class="tok-builtin">@memset</span>(k.meet_qvel, <span class="tok-num">0</span>);
        <span class="tok-kw">return</span>;
    }

    _ = (ctl.Ik{ .max_iterations = <span class="tok-num">70</span> }).<span class="tok-fn">solve</span>(
        m,
        &amp;k.data,
        s.arm_act,
        .{ .body = s.hand, .offset = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .goal = <span class="tok-fn">ballAt</span>(s.ball_p0, s.ball_v0, best) },
        s.ik_scratch,
    );
    <span class="tok-builtin">@memcpy</span>(k.meet_pose, k.data.pos[<span class="tok-num">0</span>..m.nq]);

    <span class="tok-comment">// Joint velocities that put the hand on the ball's velocity, least-norm through the hand</span>
    <span class="tok-comment">// Jacobian. This is what a servo has no way to ask for.</span>
    <span class="tok-builtin">@memset</span>(k.meet_qvel, <span class="tok-num">0</span>);
    <span class="tok-kw">var</span> jac_buf: [<span class="tok-num">16</span>]Vec = undefined;
    <span class="tok-kw">if</span> (m.nv &gt; jac_buf.len) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> jac: []Vec = jac_buf[<span class="tok-num">0</span>..m.nv];
    rbt.<span class="tok-fn">jacPoint</span>(m, &amp;k.data, s.hand, k.data.body_xpos[s.hand], jac, null);
    <span class="tok-kw">var</span> gram: [<span class="tok-num">9</span>]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>);
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">3</span>) |a| {
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">3</span>) |b| {
            <span class="tok-kw">var</span> sum: f32 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.nv) |v| {
                sum += jac[v][a] * jac[v][b];
            }
            gram[a * <span class="tok-num">3</span> + b] = sum;
        }
    }
    <span class="tok-kw">const</span> ridge: f32 = <span class="tok-num">1.0e-4</span> * (<span class="tok-builtin">@abs</span>(gram[<span class="tok-num">0</span>]) + <span class="tok-builtin">@abs</span>(gram[<span class="tok-num">4</span>]) + <span class="tok-builtin">@abs</span>(gram[<span class="tok-num">8</span>]) + <span class="tok-num">1.0</span>);
    gram[<span class="tok-num">0</span>] += ridge;
    gram[<span class="tok-num">4</span>] += ridge;
    gram[<span class="tok-num">8</span>] += ridge;
    <span class="tok-kw">const</span> want: Vec = <span class="tok-fn">ballVel</span>(s.ball_v0, best);
    <span class="tok-kw">var</span> lambda: [<span class="tok-num">3</span>]f32 = .{ want[<span class="tok-num">0</span>], want[<span class="tok-num">1</span>], want[<span class="tok-num">2</span>] };
    <span class="tok-kw">if</span> (ctl.<span class="tok-fn">solve3Pub</span>(&amp;gram, &amp;lambda)) {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.nv) |v| {
            k.meet_qvel[v] = lambda[<span class="tok-num">0</span>] * jac[v][<span class="tok-num">0</span>] + lambda[<span class="tok-num">1</span>] * jac[v][<span class="tok-num">1</span>] + lambda[<span class="tok-num">2</span>] * jac[v][<span class="tok-num">2</span>];
        }
    }
    <span class="tok-builtin">@memcpy</span>(k.data.pos, s.rest);
    k.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;k.data);
}

<span class="tok-kw">fn</span> <span class="tok-fn">throwBall</span>(s: *State) void {
    <span class="tok-fn">resetArms</span>(s);
    s.seed = s.seed *% <span class="tok-num">1664525</span> +% <span class="tok-num">1013904223</span>;
    <span class="tok-kw">const</span> jitter: f32 = <span class="tok-fn">float</span>(s.seed &gt;&gt; <span class="tok-num">12</span>) / <span class="tok-num">1048576.0</span> - <span class="tok-num">0.5</span>;
    s.ball_p0 = <span class="tok-fn">vec</span>(-<span class="tok-num">2.6</span>, s.throw_side, <span class="tok-num">1.0</span>);
    s.ball_v0 = <span class="tok-fn">vec</span>(s.throw_speed, -<span class="tok-num">0.35</span> * s.throw_side + <span class="tok-num">0.4</span> * jitter, <span class="tok-num">3.0</span> + <span class="tok-num">0.4</span> * jitter);
    <span class="tok-fn">planInterception</span>(s, &amp;s.servo);
    <span class="tok-fn">planInterception</span>(s, &amp;s.planner);
    s.in_flight = true;
}

<span class="tok-kw">fn</span> <span class="tok-fn">advance</span>(s: *State, k: *Keeper, tick: u32) void {
    <span class="tok-kw">const</span> m: *rbt.Model = &amp;s.model;
    <span class="tok-kw">if</span> (k.meet_time &lt;= <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }

    <span class="tok-kw">if</span> (k.planned) {
        <span class="tok-kw">if</span> (tick % <span class="tok-num">5</span> == <span class="tok-num">0</span>) {
            <span class="tok-comment">// -- *** THE TERMINAL KNOT *IS* THE INTERCEPTION --</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// With a fixed 0.88 s horizon the terminal knot - carrying by far the largest weight,</span>
            <span class="tok-comment">// 60 against a running 0.5 - sat AFTER the ball had already hit the floor. The plan</span>
            <span class="tok-comment">// was asked with maximum emphasis to be somewhere at a moment that no longer meant</span>
            <span class="tok-comment">// anything, and no amount of iteration helped: a 6-to-60 sweep gave 0.4981, 0.4985,</span>
            <span class="tok-comment">// 0.4964. Identical.</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// Shrinking the horizon to the time remaining moved that weight onto the catch and</span>
            <span class="tok-comment">// was worth **6x in distance and 3x in relative speed**, on its own.</span>
            <span class="tok-kw">const</span> nstate: u32 = m.nq + m.nv;
            <span class="tok-kw">const</span> left: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, k.meet_time - s.flight);
            <span class="tok-kw">const</span> arrive: u32 = <span class="tok-builtin">@min</span>(max_horizon, zm.<span class="tok-fn">floori</span>(u32, left / sim_dt));
            k.plan.<span class="tok-fn">setHorizon</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">2</span>, arrive));

            <span class="tok-comment">// * AND THE REFERENCE IS A TRAJECTORY, NOT A DESTINATION. Copied into every knot it</span>
            <span class="tok-comment">// asks the arm to be at the target from knot zero, which is the rocket's first wrong</span>
            <span class="tok-comment">// question. Smoothstepped from here to there gives every knot somewhere reachable.</span>
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..k.plan.horizon + <span class="tok-num">1</span>) |step| {
                <span class="tok-kw">const</span> along: f32 = <span class="tok-kw">if</span> (arrive == <span class="tok-num">0</span>) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-builtin">@min</span>(
                    <span class="tok-num">1.0</span>,
                    <span class="tok-fn">float</span>(step) / <span class="tok-fn">float</span>(arrive),
                );
                <span class="tok-kw">const</span> blend: f32 = along * along * (<span class="tok-num">3.0</span> - <span class="tok-num">2.0</span> * along);
                <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.nq) |q| {
                    k.reference[step * nstate + q] = k.data.pos[q] +
                        blend * (k.meet_pose[q] - k.data.pos[q]);
                }
                <span class="tok-kw">const</span> near_end: bool = arrive &gt; <span class="tok-num">0</span> <span class="tok-kw">and</span> step + <span class="tok-num">10</span> &gt;= arrive;
                <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.nv) |v| {
                    k.reference[step * nstate + m.nq + v] = <span class="tok-kw">if</span> (near_end) k.meet_qvel[v] <span class="tok-kw">else</span> <span class="tok-num">0</span>;
                }
            }
            <span class="tok-comment">// *** THE REFERENCE MUST BE EXACTLY `(horizon + 1) x nstate`, AND THE HORIZON MOVES.</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// `setHorizon` shrinks the plan in place while the buffer stays allocated for the</span>
            <span class="tok-comment">// maximum, so handing over the whole thing describes a longer plan than the one</span>
            <span class="tok-comment">// being solved - 2210 entries for a plan wanting 1880. The assert in `optimize` is</span>
            <span class="tok-comment">// right to refuse it: a reference and a horizon that disagree is exactly the</span>
            <span class="tok-comment">// silent-misalignment class of bug that has cost this project several turns.</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// * AND IT ONLY SURFACED IN THE BROWSER, because the probe runs ReleaseFast where</span>
            <span class="tok-comment">// `assertf` is compiled out. The debug wasm build caught it. The probe's numbers</span>
            <span class="tok-comment">// still stand - it filled and read the same prefix - but the demo had to be told.</span>
            <span class="tok-kw">const</span> wanted: usize = (k.plan.horizon + <span class="tok-num">1</span>) * nstate;
            _ = mpc.<span class="tok-fn">optimize</span>(m, &amp;k.data, &amp;k.plan, .{
                .state = s.state_w,
                .control = s.ctrl_w,
                .terminal = s.term_w,
                .reference = k.reference[<span class="tok-num">0</span>..wanted],
            }, .{ .iterations = <span class="tok-num">6</span> });
        }
        <span class="tok-builtin">@memcpy</span>(k.data.ctrl, k.plan.ctrl[<span class="tok-num">0</span>..m.nu]);
        mpc.<span class="tok-fn">shift</span>(&amp;k.plan);
    } <span class="tok-kw">else</span> {
        <span class="tok-comment">// * THE HONEST BASELINE, AND IT IS NOT A STRAWMAN: it is handed the interception point</span>
        <span class="tok-comment">// AND the moment, and servos straight to them. What it cannot express is "be moving when</span>
        <span class="tok-comment">// you get there" - a PD driven to a fixed pose arrives and stops.</span>
        (ctl.PoseHold{
            .target = k.meet_pose,
            .kp = <span class="tok-num">900</span>,
            .kv = <span class="tok-num">60</span>,
            .max_torque = <span class="tok-num">260</span>,
        }).<span class="tok-fn">apply</span>(m, &amp;k.data, s.all_act);
    }
    rbt.<span class="tok-fn">step</span>(m, &amp;k.data);

    <span class="tok-kw">const</span> ball: Vec = <span class="tok-fn">ballAt</span>(s.ball_p0, s.ball_v0, s.flight);
    <span class="tok-kw">const</span> gap: f32 = <span class="tok-fn">length3</span>(k.data.body_xpos[s.hand] - ball);
    <span class="tok-kw">if</span> (gap &lt; k.best_gap) {
        k.best_gap = gap;
        k.best_relative = <span class="tok-fn">length3</span>(k.data.cvel[s.hand].lin - <span class="tok-fn">ballVel</span>(s.ball_v0, s.flight));
        k.best_hand = k.data.body_xpos[s.hand];
        k.best_ball = ball;
    }
    <span class="tok-kw">if</span> (k.trail_count &lt; k.trail.len) {
        k.trail[k.trail_count] = k.data.body_xpos[s.hand];
        k.trail_count += <span class="tok-num">1</span>;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">const</span> captured: bool = <span class="tok-fn">drawPanel</span>(u, s, f.window.<span class="tok-fn">widthf</span>(), f.window.<span class="tok-fn">heightf</span>());

    <span class="tok-comment">// *** PROFILING OFF ACROSS THE PLANNER. `optimize` at 220 knots with six iterations executes</span>
    <span class="tok-comment">// an enormous amount of instrumented code per frame, and each zone costs two timestamps -</span>
    <span class="tok-comment">// on wasm, two JS boundary crossings. Measured here: the smoke runner exhausted Node's</span>
    <span class="tok-comment">// 2 GB heap before finishing sixty frames. The cartpole hit this exact wall and the fix is</span>
    <span class="tok-comment">// the same: the instrument is priced for a frame that does a few things, and a frame that</span>
    <span class="tok-comment">// solves a trajectory optimisation is not that.</span>
    <span class="tok-kw">const</span> was_frozen: bool = profiler.<span class="tok-fn">isFrozen</span>();
    profiler.<span class="tok-fn">freeze</span>();
    <span class="tok-kw">defer</span> <span class="tok-kw">if</span> (!was_frozen) profiler.<span class="tok-fn">unfreeze</span>();

    <span class="tok-comment">// * AUTO-REPEAT, so the thing loops and can be WATCHED rather than clicked at. A demo whose</span>
    <span class="tok-comment">// interesting second requires a button press gets seen once.</span>
    <span class="tok-kw">if</span> (s.running <span class="tok-kw">and</span> !s.in_flight) {
        s.idle += f.time.delta_time;
        <span class="tok-kw">if</span> (s.idle &gt; <span class="tok-num">1.6</span>) {
            <span class="tok-fn">throwBall</span>(s);
        }
    }
    <span class="tok-kw">if</span> (s.running <span class="tok-kw">and</span> s.in_flight) {
        s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>) * s.time_scale;
        <span class="tok-kw">var</span> tick: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (s.accumulator &gt;= sim_dt) : (s.accumulator -= sim_dt) {
            <span class="tok-fn">advance</span>(s, &amp;s.servo, tick);
            <span class="tok-fn">advance</span>(s, &amp;s.planner, tick);
            s.flight += sim_dt;
            tick += <span class="tok-num">1</span>;
            <span class="tok-kw">if</span> (<span class="tok-fn">ballAt</span>(s.ball_p0, s.ball_v0, s.flight)[<span class="tok-num">2</span>] &lt; <span class="tok-num">0.05</span>) {
                <span class="tok-fn">score</span>(s, &amp;s.servo);
                <span class="tok-fn">score</span>(s, &amp;s.planner);
                s.in_flight = false;
                <span class="tok-kw">break</span>;
            }
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, background);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, captured, .{ .min_distance = <span class="tok-num">3.0</span>, .max_distance = <span class="tok-num">16.0</span> });
    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.05</span>, <span class="tok-num">0</span>), <span class="tok-fn">scaling</span>(<span class="tok-num">12</span>, <span class="tok-num">0.1</span>, <span class="tok-num">8</span>));
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, ground_colour);
    <span class="tok-fn">drawKeeper</span>(s, gl, &amp;s.servo, -<span class="tok-num">1.3</span>);
    <span class="tok-fn">drawKeeper</span>(s, gl, &amp;s.planner, <span class="tok-num">1.3</span>);
    <span class="tok-fn">drawBall</span>(s, gl);
    z.<span class="tok-fn">endMode3D</span>(gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">score</span>(s: *State, k: *Keeper) void {
    _ = s;
    <span class="tok-kw">if</span> (k.best_gap &lt; <span class="tok-num">0.05</span> <span class="tok-kw">and</span> k.best_relative &lt; <span class="tok-num">0.5</span>) {
        k.caught += <span class="tok-num">1</span>;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (k.best_gap &lt; <span class="tok-num">0.05</span>) {
        k.swatted += <span class="tok-num">1</span>;
    } <span class="tok-kw">else</span> {
        k.missed += <span class="tok-num">1</span>;
    }
}

<span class="tok-comment">/// Model space is Z-up; the renderer is Y-up. One swizzle, at the boundary.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">toRender</span>(at: Vec, depth: f32) Vec {
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(at[<span class="tok-num">0</span>], at[<span class="tok-num">2</span>], at[<span class="tok-num">1</span>] + depth);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawKeeper</span>(s: *State, gl: *z.WgpuGl, k: *<span class="tok-kw">const</span> Keeper, depth: f32) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.model;
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..m.nbody) |b| {
        <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">toRender</span>(k.data.body_xpos[b], depth);
        <span class="tok-kw">const</span> parent: u32 = m.body_parent[b];
        <span class="tok-kw">if</span> (parent != rbt.world_body) {
            z.<span class="tok-fn">drawLine3D</span>(gl, <span class="tok-fn">toRender</span>(k.data.body_xpos[parent], depth), at, link_colour);
        }
        <span class="tok-kw">const</span> is_hand: bool = b == s.hand;
        <span class="tok-kw">const</span> size: f32 = <span class="tok-kw">if</span> (is_hand) <span class="tok-num">0.10</span> <span class="tok-kw">else</span> <span class="tok-num">0.05</span>;
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(at[<span class="tok-num">0</span>], at[<span class="tok-num">1</span>], at[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(size, size, size));
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, <span class="tok-kw">if</span> (is_hand) hand_colour <span class="tok-kw">else</span> link_colour);
    }
    <span class="tok-comment">// * WHERE THIS ARM HAS DECIDED TO MEET THE BALL. Drawn, because the decision happens before</span>
    <span class="tok-comment">// the motion does and is otherwise invisible - the arm reaching into empty space and waiting</span>
    <span class="tok-comment">// there IS the plan, made visible.</span>
    <span class="tok-kw">if</span> (k.meet_time &gt; <span class="tok-num">0</span>) {
        <span class="tok-kw">const</span> meet: Vec = <span class="tok-fn">toRender</span>(<span class="tok-fn">ballAt</span>(s.ball_p0, s.ball_v0, k.meet_time), depth);
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(meet[<span class="tok-num">0</span>], meet[<span class="tok-num">1</span>], meet[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.06</span>, <span class="tok-num">0.06</span>, <span class="tok-num">0.06</span>));
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, meet_colour);
    }

    <span class="tok-comment">// ** THE HAND'S PATH. A planner that reaches AHEAD and waits looks identical to one that</span>
    <span class="tok-comment">// chases, in any single frame. Over a whole throw the two paths are unmistakable.</span>
    <span class="tok-comment">// *** `1..0` IS AN INTEGER UNDERFLOW, NOT AN EMPTY RANGE - and this is the SECOND time this</span>
    <span class="tok-comment">// session, after the identical line in `examples/rocket`. It runs fine in release on the</span>
    <span class="tok-comment">// host and traps instantly in the debug wasm smoke run, which is exactly what that gate is</span>
    <span class="tok-comment">// for. Any `for (1..count)` over a buffer that can be empty needs this guard.</span>
    <span class="tok-kw">if</span> (k.trail_count &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">for</span> (<span class="tok-num">1</span>..k.trail_count) |i| {
            z.<span class="tok-fn">drawLine3D</span>(gl, <span class="tok-fn">toRender</span>(k.trail[i - <span class="tok-num">1</span>], depth), <span class="tok-fn">toRender</span>(k.trail[i], depth), trail_colour);
        }
    }

    <span class="tok-comment">// -- *** THE VERDICT, HELD --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The whole thing turns on one instant of about 30 ms. Drawing only the live frame throws it</span>
    <span class="tok-comment">// away before anyone can look at it, which is why this demo read as "did something happen?".</span>
    <span class="tok-comment">// The hand and the ball at closest approach stay on screen, with the gap drawn between them</span>
    <span class="tok-comment">// and coloured by the outcome: green if it was a catch, pink if the hand was there and</span>
    <span class="tok-comment">// moving too fast, grey if it never arrived.</span>
    <span class="tok-kw">if</span> (k.best_gap &lt; <span class="tok-num">1.0e8</span>) {
        <span class="tok-kw">const</span> hand_at: Vec = <span class="tok-fn">toRender</span>(k.best_hand, depth);
        <span class="tok-kw">const</span> ball_at: Vec = <span class="tok-fn">toRender</span>(k.best_ball, depth);
        <span class="tok-kw">const</span> verdict: Color = <span class="tok-kw">if</span> (k.best_gap &lt; <span class="tok-num">0.05</span> <span class="tok-kw">and</span> k.best_relative &lt; <span class="tok-num">0.5</span>)
            hand_colour
        <span class="tok-kw">else</span> <span class="tok-kw">if</span> (k.best_gap &lt; <span class="tok-num">0.05</span>)
            meet_colour
        <span class="tok-kw">else</span>
            arc_colour;
        z.<span class="tok-fn">drawLine3D</span>(gl, hand_at, ball_at, verdict);
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
            <span class="tok-fn">translation</span>(ball_at[<span class="tok-num">0</span>], ball_at[<span class="tok-num">1</span>], ball_at[<span class="tok-num">2</span>]),
            <span class="tok-fn">scaling</span>(<span class="tok-num">0.05</span>, <span class="tok-num">0.05</span>, <span class="tok-num">0.05</span>),
        );
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, verdict);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawBall</span>(s: *State, gl: *z.WgpuGl) void {
    <span class="tok-kw">if</span> (s.flight &lt;= <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-comment">// The predicted arc, as a ghost - what the planner knows and the eye does not.</span>
    <span class="tok-kw">var</span> previous: Vec = <span class="tok-fn">toRender</span>(s.ball_p0, <span class="tok-num">0</span>);
    <span class="tok-kw">var</span> t: f32 = <span class="tok-num">0.05</span>;
    <span class="tok-kw">while</span> (t &lt; <span class="tok-num">1.4</span>) : (t += <span class="tok-num">0.05</span>) {
        <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">ballAt</span>(s.ball_p0, s.ball_v0, t);
        <span class="tok-kw">if</span> (at[<span class="tok-num">2</span>] &lt; <span class="tok-num">0.05</span>) {
            <span class="tok-kw">break</span>;
        }
        <span class="tok-kw">const</span> here: Vec = <span class="tok-fn">toRender</span>(at, <span class="tok-num">0</span>);
        z.<span class="tok-fn">drawLine3D</span>(gl, previous, here, arc_colour);
        previous = here;
    }
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> ([_]f32{ -<span class="tok-num">1.3</span>, <span class="tok-num">1.3</span> }) |depth| {
        <span class="tok-comment">// * THE BALL STAYS ON SCREEN AFTER THE THROW. It used to vanish the instant the flight</span>
        <span class="tok-comment">// ended, so the scene the viewer was left studying had no ball in it at all.</span>
        <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">toRender</span>(<span class="tok-fn">ballAt</span>(s.ball_p0, s.ball_v0, s.flight), depth);
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(at[<span class="tok-num">0</span>], at[<span class="tok-num">1</span>], at[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.07</span>, <span class="tok-num">0.07</span>, <span class="tok-num">0.07</span>));
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, ball_colour);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(u: ui.Ui, s: *State, viewport_w: f32, viewport_h: f32) bool {
    <span class="tok-kw">const</span> captured: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    <span class="tok-kw">const</span> narrow: bool = ui.Ui.<span class="tok-fn">isNarrow</span>(viewport_w);

    <span class="tok-comment">// -- * THE CONTROLS STAY SMALL AND THE PROSE LEAVES THE BOX --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// On a phone the panel had grown to most of the screen and the robots were a sliver at the</span>
    <span class="tok-comment">// bottom - which is backwards for a demo whose entire argument is something you WATCH. The</span>
    <span class="tok-comment">// window now holds only what needs a widget; the explanation is drawn as a borderless</span>
    <span class="tok-comment">// overlay below, where it costs no interactive area at all.</span>
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-kw">if</span> (narrow) <span class="tok-builtin">@min</span>(viewport_w - <span class="tok-num">16</span>, <span class="tok-num">340.0</span>) <span class="tok-kw">else</span> <span class="tok-builtin">@min</span>(<span class="tok-num">380.0</span>, viewport_w * <span class="tok-num">0.32</span>);

    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">0</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"catching, not swatting"</span>, .{ .flags = .{ .always_auto_resize = true } })) |window| {
        <span class="tok-kw">defer</span> window.<span class="tok-fn">close</span>();

        <span class="tok-fn">report</span>(u, <span class="tok-str">"IK+PD"</span>, &amp;s.servo);
        <span class="tok-fn">report</span>(u, <span class="tok-str">"MPC  "</span>, &amp;s.planner);
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"speed"</span>, &amp;s.throw_speed, .{ .min = <span class="tok-num">2.6</span>, .max = <span class="tok-num">4.4</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"side"</span>, &amp;s.throw_side, .{ .min = -<span class="tok-num">1.0</span>, .max = <span class="tok-num">1.0</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"THROW"</span>, .{})) {
            <span class="tok-fn">throwBall</span>(s);
        }
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"slowmo"</span>, &amp;s.time_scale, .{ .min = <span class="tok-num">0.08</span>, .max = <span class="tok-num">1.0</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"run"</span>, &amp;s.running);
    }

    <span class="tok-comment">// * BORDERLESS, NON-INTERACTIVE, AND OUT OF THE WAY - the recipe `ui.zig` names for an</span>
    <span class="tok-comment">// overlay. `no_inputs` matters as much as `no_background`: prose that silently eats taps is</span>
    <span class="tok-comment">// worse than prose in a box.</span>
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, viewport_h - <span class="tok-num">118</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ viewport_w - <span class="tok-num">16</span>, <span class="tok-num">110</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"catch_help"</span>, .{ .flags = .{
        .no_title_bar = true,
        .no_resize = true,
        .no_move = true,
        .no_background = true,
        .no_inputs = true,
        .no_scrollbar = true,
    } })) |help| {
        <span class="tok-kw">defer</span> help.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"a catch needs the hand MOVING with the ball:"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"   gap &lt; 5 cm  AND  relative &lt; 0.5 m/s"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"the line held after each throw is the verdict:"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"   green caught / pink swatted / grey missed"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"near arm = IK+PD,  far arm = MPC.  blue = path."</span>, .{});
    }
    <span class="tok-kw">return</span> captured;
}

<span class="tok-kw">fn</span> <span class="tok-fn">report</span>(u: ui.Ui, label: []<span class="tok-kw">const</span> u8, k: *<span class="tok-kw">const</span> Keeper) void {
    <span class="tok-kw">if</span> (k.best_gap &gt; <span class="tok-num">1.0e8</span>) {
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}  ready"</span>, .{label});
        <span class="tok-kw">return</span>;
    }
    u.<span class="tok-fn">text</span>(<span class="tok-str">"{s} {d:&gt;5.3}m {d:&gt;5.2}m/s  {d}/{d}/{d}"</span>, .{
        label, k.best_gap, k.best_relative, k.caught, k.swatted, k.missed,
    });
}
