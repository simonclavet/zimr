<span class="tok-comment">//! The classic aircraft-orientation demo: three independent rotations -</span>
<span class="tok-comment">//! PITCH (nose up/down, X axis), YAW (nose left/right, Y axis), and ROLL</span>
<span class="tok-comment">//! (bank, Z axis) - composed as one XYZ rotation matrix and applied to a</span>
<span class="tok-comment">//! plane. raylib loads a WWI biplane .obj; a standalone can't fetch that,</span>
<span class="tok-comment">//! so the plane here is built from immediate-3D-batch primitives (fuselage,</span>
<span class="tok-comment">//! wings, tail, nose) - enough of a recognizable body that all three axes</span>
<span class="tok-comment">//! read clearly. Each part's offset from the origin AND its own orientation</span>
<span class="tok-comment">//! are rotated by the same matrix, so the whole craft turns rigidly.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Controls: UP/DOWN pitch, A/S yaw, LEFT/RIGHT roll (raylib's mapping),</span>
<span class="tok-comment">//! plus on-screen buttons for phones. Inputs ease back toward level when</span>
<span class="tok-comment">//! released, like the original.</span>

<span class="tok-comment">// Plane palette.</span>
<span class="tok-kw">const</span> body_col: Color = .{ .r = <span class="tok-num">180</span>, .g = <span class="tok-num">60</span>, .b = <span class="tok-num">55</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> wing_col: Color = .{ .r = <span class="tok-num">210</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">180</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> tail_col: Color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">120</span>, .b = <span class="tok-num">190</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> nose_col: Color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> };

};

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-comment">// ---- controls: keyboard (raylib mapping) + easing back to level ----</span>
    <span class="tok-kw">const</span> in = f.input;
    <span class="tok-comment">// Pitch: UP nose-down, DOWN nose-up (raylib's sign).</span>
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyDown</span>(in, .down)) {
        s.pitch += <span class="tok-num">0.6</span>;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyDown</span>(in, .up)) {
        s.pitch -= <span class="tok-num">0.6</span>;
    } <span class="tok-kw">else</span> {
        s.pitch = <span class="tok-fn">easeToZero</span>(s.pitch, <span class="tok-num">0.3</span>);
    }
    <span class="tok-comment">// Yaw: A left, S right.</span>
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyDown</span>(in, .s)) {
        s.yaw -= <span class="tok-num">1.0</span>;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyDown</span>(in, .a)) {
        s.yaw += <span class="tok-num">1.0</span>;
    } <span class="tok-kw">else</span> {
        s.yaw = <span class="tok-fn">easeToZero</span>(s.yaw, <span class="tok-num">0.5</span>);
    }
    <span class="tok-comment">// Roll: LEFT/RIGHT bank.</span>
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyDown</span>(in, .left)) {
        s.roll -= <span class="tok-num">1.0</span>;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyDown</span>(in, .right)) {
        s.roll += <span class="tok-num">1.0</span>;
    } <span class="tok-kw">else</span> {
        s.roll = <span class="tok-fn">easeToZero</span>(s.roll, <span class="tok-num">0.5</span>);
    }

    <span class="tok-comment">// ---- on-screen buttons (phone): three held pairs ----</span>
    <span class="tok-fn">controlPanel</span>(u, s, vw, vh);

    <span class="tok-comment">// ---- compose the XYZ rotation (raylib's MatrixRotateXYZ) ----</span>
    <span class="tok-kw">const</span> rp: f32 = s.pitch * rad_per_deg;
    <span class="tok-kw">const</span> ry: f32 = s.yaw * rad_per_deg;
    <span class="tok-kw">const</span> rr: f32 = s.roll * rad_per_deg;
    <span class="tok-kw">const</span> rot: Mat = <span class="tok-fn">mulMat</span>(<span class="tok-fn">rotationX</span>(rp), <span class="tok-fn">mulMat</span>(<span class="tok-fn">rotationY</span>(ry), <span class="tok-fn">rotationZ</span>(rr)));

    <span class="tok-kw">const</span> cam: Camera3D = .{
        .position = <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">6</span>, -<span class="tok-num">16</span>),
        .target = <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = <span class="tok-num">45.0</span>,
        .projection = <span class="tok-num">0</span>,
    };

    <span class="tok-comment">// ---- draw the plane: rotate each part's offset AND orientation ----</span>
    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam);
    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">20</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">for</span> (parts) |p| {
        <span class="tok-kw">const</span> local: Vec = <span class="tok-fn">pointVec</span>(p.offset[<span class="tok-num">0</span>], p.offset[<span class="tok-num">1</span>], p.offset[<span class="tok-num">2</span>]);
        <span class="tok-kw">const</span> world: Vec = <span class="tok-fn">mulMatVec</span>(rot, local);
        z.<span class="tok-fn">drawCube</span>(f.gl, world, .{
            .size = <span class="tok-fn">vec</span>(p.size[<span class="tok-num">0</span>], p.size[<span class="tok-num">1</span>], p.size[<span class="tok-num">2</span>]),
            .rotation = rot,
            .color = p.color,
        });
    }
    z.<span class="tok-fn">endMode3D</span>(f.gl);

    <span class="tok-comment">// ---- HUD ----</span>
    <span class="tok-kw">var</span> buf: [<span class="tok-num">96</span>]u8 = undefined;
    <span class="tok-kw">const</span> hud: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf,
        <span class="tok-str">"pitch {d: &gt;6.1}   yaw {d: &gt;6.1}   roll {d: &gt;6.1}"</span>,
        .{ s.pitch, s.yaw, s.roll },
    ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">14</span>, <span class="tok-num">42</span> }, hud, .{ .size = <span class="tok-num">18</span>, .color = common.palette.ink_dim, .font = &amp;s.font });
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"WebGPU 3D - yaw / pitch / roll (arrows + A/S, or buttons)"</span>);
    s.ui_host.<span class="tok-fn">render</span>(f);
}

<span class="tok-comment">/// Ease a value toward 0 by `step` (raylib's release behavior).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">easeToZero</span>(v: f32, step: f32) f32 {
    <span class="tok-kw">if</span> (v &gt; step) {
        <span class="tok-kw">return</span> v - step;
    }
    <span class="tok-kw">if</span> (v &lt; -step) {
        <span class="tok-kw">return</span> v + step;
    }
    <span class="tok-kw">return</span> <span class="tok-num">0</span>;
}

<span class="tok-comment">/// On-screen held buttons: pitch (+/-), yaw (+/-), roll (+/-). Phone-first: 2 rows.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">controlPanel</span>(u: z.ui_real.Ui, s: *State, vw: f32, vh: f32) void {
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">108</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ <span class="tok-builtin">@min</span>(<span class="tok-num">340</span>, vw - <span class="tok-num">16</span>), <span class="tok-num">100</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"attitude"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        <span class="tok-fn">heldPair</span>(u, <span class="tok-str">"nose up"</span>, <span class="tok-str">"nose dn"</span>, &amp;s.pitch, <span class="tok-num">0.6</span>, false);
        <span class="tok-fn">heldPair</span>(u, <span class="tok-str">"yaw L"</span>, <span class="tok-str">"yaw R"</span>, &amp;s.yaw, <span class="tok-num">1.0</span>, true);
        <span class="tok-fn">heldPair</span>(u, <span class="tok-str">"roll L"</span>, <span class="tok-str">"roll R"</span>, &amp;s.roll, <span class="tok-num">1.0</span>, false);
    }
}

<span class="tok-comment">/// A pair of held buttons that increment/decrement `v` while pressed. `plus_left`</span>
<span class="tok-comment">/// flips which button adds (yaw's A/S is inverted vs the others in raylib).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">heldPair</span>(
    u: z.ui_real.Ui,
    neg_label: []<span class="tok-kw">const</span> u8,
    pos_label: []<span class="tok-kw">const</span> u8,
    v: *f32,
    step: f32,
    plus_left: bool,
) void {
    _ = u.<span class="tok-fn">button</span>(neg_label, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">isItemActive</span>()) {
        v.* += <span class="tok-kw">if</span> (plus_left) step <span class="tok-kw">else</span> -step;
    }
    u.<span class="tok-fn">sameLine</span>(.{});
    _ = u.<span class="tok-fn">button</span>(pos_label, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">isItemActive</span>()) {
        v.* += <span class="tok-kw">if</span> (plus_left) -step <span class="tok-kw">else</span> step;
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - yaw pitch roll"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
};
