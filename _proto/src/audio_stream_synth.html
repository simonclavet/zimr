<h1>audio_stream_synth</h1>
<figure class="code src-file" data-path="examples/audio_stream_synth/audio_stream_synth.zig" data-lines="146"><figcaption><span>examples/audio_stream_synth/audio_stream_synth.zig</span><span>146 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! audio_stream_synth - port of the GL `audio_stream_synth`: a theremin on</span>
<span class="tok-comment">//! the wgpu audio bridge. Mouse Y maps (logarithmically) to a pitch in</span>
<span class="tok-comment">//! 110-1760 Hz; each frame it synthesizes sine samples and feeds them to an</span>
<span class="tok-comment">//! `AudioStream` - a 3-buffer rotation scheduled gaplessly via the bridge's</span>
<span class="tok-comment">//! `play_buffer_at` (implemented this turn). Click toggles the sound. The synth</span>
<span class="tok-comment">//! phase_turns persists across chunks so the wave doesn't click at chunk seams.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> allocPrint = std.fmt.allocPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> sinTurns = zm.sinTurns;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;

<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> c = z.colors;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> sample_rate: u32 = <span class="tok-num">48000</span>;
<span class="tok-kw">const</span> frames_per_push: usize = <span class="tok-num">480</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    scratch: std.heap.ArenaAllocator,
    audio: z.AudioState = .{},
    stream: z.AudioStream = .{},
    phase_turns: f32 = <span class="tok-num">0.0</span>,
    enabled: bool = false,
    frame_count: usize = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.streams.<span class="tok-fn">unload</span>(&amp;s.audio.streams, s.stream);
    s.scratch.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    z.audio_device.<span class="tok-fn">init</span>(f.audio_device);
    <span class="tok-kw">var</span> audio: z.AudioState = .{};
    <span class="tok-kw">const</span> stream: z.AudioStream = z.streams.<span class="tok-fn">load</span>(&amp;audio.streams, f.audio_device, sample_rate, <span class="tok-num">32</span>, <span class="tok-num">2</span>);
    z.streams.<span class="tok-fn">setVolume</span>(&amp;audio.streams, stream, <span class="tok-num">0.3</span>);
    z.streams.<span class="tok-fn">pause</span>(&amp;audio.streams, stream); <span class="tok-comment">// silent until the user holds</span>
    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">28</span>),
        .scratch = std.heap.ArenaAllocator.<span class="tok-fn">init</span>(gpa),
        .audio = audio,
        .stream = stream,
    };
}

<span class="tok-comment">/// Mouse Y -&gt; frequency in [110, 1760] Hz (4 octaves of A), logarithmic so equal</span>
<span class="tok-comment">/// pixel-spans give equal musical intervals.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">mouseToFreq</span>(mouse_y: f32, height: f32) f32 {
    <span class="tok-kw">const</span> min_freq: f32 = <span class="tok-num">110.0</span>;
    <span class="tok-kw">const</span> max_freq: f32 = <span class="tok-num">1760.0</span>;
    <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">clamp</span>(<span class="tok-num">1.0</span> - mouse_y / height, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> log_min: f32 = <span class="tok-builtin">@log2</span>(min_freq);
    <span class="tok-kw">const</span> log_max: f32 = <span class="tok-builtin">@log2</span>(max_freq);
    <span class="tok-kw">return</span> <span class="tok-builtin">@exp2</span>(log_min + t * (log_max - log_min));
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    _ = state.scratch.<span class="tok-fn">reset</span>(.retain_capacity);
    state.frame_count += <span class="tok-num">1</span>;
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);

    <span class="tok-comment">// Hold-to-play (theremin): sound while the finger/button is held, silent on</span>
    <span class="tok-comment">// release - so lifting your finger stops it.</span>
    <span class="tok-kw">const</span> down: bool = z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left);
    <span class="tok-kw">if</span> (down <span class="tok-kw">and</span> !state.enabled) {
        state.enabled = true;
        z.streams.<span class="tok-fn">resumeStream</span>(&amp;state.audio.streams, state.stream);
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (!down <span class="tok-kw">and</span> state.enabled) {
        state.enabled = false;
        z.streams.<span class="tok-fn">pause</span>(&amp;state.audio.streams, state.stream);
    }

    <span class="tok-comment">// Top up the stream while the scheduler wants data (~ one chunk/frame).</span>
    <span class="tok-kw">if</span> (state.enabled) {
        <span class="tok-kw">const</span> freq: f32 = <span class="tok-fn">mouseToFreq</span>(mp[<span class="tok-num">1</span>], h);
        <span class="tok-kw">const</span> phase_step_turns: f32 = freq / <span class="tok-fn">float</span>(sample_rate);
        <span class="tok-kw">var</span> pushes: u8 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (z.streams.<span class="tok-fn">isProcessed</span>(&amp;state.audio.streams, state.stream) <span class="tok-kw">and</span> pushes &lt; <span class="tok-num">4</span>) : (pushes += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> samples = state.scratch.<span class="tok-fn">allocator</span>().<span class="tok-fn">alloc</span>(f32, frames_per_push * <span class="tok-num">2</span>) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..frames_per_push) |i| {
                <span class="tok-comment">// `state.phase_turns` is already a turn count on [0, 1), so `sinTurns` takes it</span>
                <span class="tok-comment">// directly. Measured over one cycle at 48 kHz: 4.11e-7 of error becomes 1.04e-7,</span>
                <span class="tok-comment">// and every whole turn lands on exactly zero instead of drifting.</span>
                <span class="tok-kw">const</span> v: f32 = <span class="tok-fn">sinTurns</span>(state.phase_turns);
                samples[i * <span class="tok-num">2</span> + <span class="tok-num">0</span>] = v;
                samples[i * <span class="tok-num">2</span> + <span class="tok-num">1</span>] = v;
                state.phase_turns += phase_step_turns;
                <span class="tok-kw">if</span> (state.phase_turns &gt;= <span class="tok-num">1.0</span>) {
                    state.phase_turns -= <span class="tok-num">1.0</span>;
                }
            }
            z.streams.<span class="tok-fn">update</span>(&amp;state.audio.streams, state.stream, samples);
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">16</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-comment">// Pitch bar tracking the cursor's Y.</span>
    f.gl.<span class="tok-fn">line</span>(
        .{ <span class="tok-num">0</span>, mp[<span class="tok-num">1</span>] },
        .{ f.window.<span class="tok-fn">widthf</span>(), mp[<span class="tok-num">1</span>] },
        .{ .color = <span class="tok-kw">if</span> (state.enabled) c.amber_400 <span class="tok-kw">else</span> c.slate_600, .thickness = <span class="tok-num">1.0</span> },
    );
    f.gl.<span class="tok-fn">circle</span>(mp, <span class="tok-num">7</span>, .{ .color = <span class="tok-kw">if</span> (state.enabled) c.white <span class="tok-kw">else</span> c.slate_500, .segments = <span class="tok-num">16</span> });

    <span class="tok-kw">const</span> hud: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">allocPrint</span>(
        state.scratch.<span class="tok-fn">allocator</span>(),
        <span class="tok-str">"freq: {d:.1} Hz  ({s})"</span>,
        .{ <span class="tok-fn">mouseToFreq</span>(mp[<span class="tok-num">1</span>], h), <span class="tok-kw">if</span> (state.enabled) <span class="tok-str">"ON"</span> <span class="tok-kw">else</span> <span class="tok-str">"OFF"</span> },
    ) <span class="tok-kw">catch</span> <span class="tok-str">"freq"</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">16</span> }, <span class="tok-str">"theremin"</span>, .{ .size = <span class="tok-num">28</span>, .color = c.white, .font = &amp;state.font });
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">52</span> }, hud, .{ .size = <span class="tok-num">16</span>, .color = c.amber_300, .font = &amp;state.font });
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, <span class="tok-num">78</span> },
        <span class="tok-str">"hold + move to play - release to stop"</span>,
        .{ .size = <span class="tok-num">14</span>, .color = c.slate_400, .font = &amp;state.font },
    );

    common.<span class="tok-fn">caption</span>(f.gl, state.font, <span class="tok-str">"AudioStream: live sine fed gaplessly via play_buffer_at"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}
