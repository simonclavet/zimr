<h1>models_geometric_shapes</h1>
<figure class="code src-file" data-path="examples/models_geometric_shapes/models_geometric_shapes.zig" data-lines="182"><figcaption><span>examples/models_geometric_shapes/models_geometric_shapes.zig</span><span>182 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! models_geometric_shapes - raylib's [models] geometric-shapes sample, as a 3D</span>
<span class="tok-comment">//! gallery you spin with your finger.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! raylib lines up cube / sphere / cylinder / cone / torus / knot / plane, each</span>
<span class="tok-comment">//! built by a `GenMeshX` procedural generator, and draws them with a fixed</span>
<span class="tok-comment">//! camera.  zimr already ships every one of those generators, so the port is</span>
<span class="tok-comment">//! really about SHOWING them off: a 2x4 grid of primitives on a grid floor, the</span>
<span class="tok-comment">//! shared `OrbitCamera` for orbit / pan / pinch-zoom (works with one finger on a</span>
<span class="tok-comment">//! phone), and a solid / wireframe / both toggle so you can see the actual</span>
<span class="tok-comment">//! triangles each generator emits - the whole point of a mesh-generator demo.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> pointVec = zm.pointVec;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">/// Each primitive: a label for the HUD and a hue so it stays visually distinct.</span>
<span class="tok-kw">const</span> Shape = <span class="tok-kw">struct</span> { name: []<span class="tok-kw">const</span> u8, hue: f32 };
<span class="tok-kw">const</span> shapes = [_]Shape{
    .{ .name = <span class="tok-str">"cube"</span>, .hue = <span class="tok-num">12</span> },
    .{ .name = <span class="tok-str">"sphere"</span>, .hue = <span class="tok-num">205</span> },
    .{ .name = <span class="tok-str">"cylinder"</span>, .hue = <span class="tok-num">150</span> },
    .{ .name = <span class="tok-str">"cone"</span>, .hue = <span class="tok-num">45</span> },
    .{ .name = <span class="tok-str">"torus"</span>, .hue = <span class="tok-num">325</span> },
    .{ .name = <span class="tok-str">"knot"</span>, .hue = <span class="tok-num">265</span> },
    .{ .name = <span class="tok-str">"plane"</span>, .hue = <span class="tok-num">95</span> },
    .{ .name = <span class="tok-str">"hemisphere"</span>, .hue = <span class="tok-num">185</span> },
};
<span class="tok-kw">const</span> n_shapes: usize = shapes.len;
<span class="tok-kw">const</span> cols: usize = <span class="tok-num">4</span>;
<span class="tok-kw">const</span> spacing: f32 = <span class="tok-num">3.2</span>;

<span class="tok-kw">const</span> Mode = <span class="tok-kw">enum</span>(u8) { solid, wireframe, both };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    ui_host: z.UiHost,
    cam: z.OrbitCamera,
    models: [n_shapes]z.Model = undefined,
    mode: Mode = .both,
};

<span class="tok-comment">/// Build the mesh for shape `i`. These are exactly raylib's GenMeshX generators;</span>
<span class="tok-comment">/// the numbers are just sizes / segment counts tuned to sit nicely in the grid.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">genShape</span>(gpa: Allocator, i: usize) !z.Mesh {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (i) {
        <span class="tok-num">0</span> =&gt; z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.4</span>, <span class="tok-num">1.4</span>, <span class="tok-num">1.4</span>),
        <span class="tok-num">1</span> =&gt; z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">0.85</span>, <span class="tok-num">24</span>, <span class="tok-num">16</span>),
        <span class="tok-num">2</span> =&gt; z.<span class="tok-fn">genMeshCylinder</span>(gpa, <span class="tok-num">0.72</span>, <span class="tok-num">1.5</span>, <span class="tok-num">24</span>, <span class="tok-num">2</span>),
        <span class="tok-num">3</span> =&gt; z.<span class="tok-fn">genMeshCone</span>(gpa, <span class="tok-num">0.85</span>, <span class="tok-num">1.5</span>, <span class="tok-num">24</span>, <span class="tok-num">2</span>),
        <span class="tok-num">4</span> =&gt; z.<span class="tok-fn">genMeshTorus</span>(gpa, <span class="tok-num">0.3</span>, <span class="tok-num">0.9</span>, <span class="tok-num">24</span>, <span class="tok-num">16</span>),
        <span class="tok-num">5</span> =&gt; z.<span class="tok-fn">genMeshKnot</span>(gpa, <span class="tok-num">0.35</span>, <span class="tok-num">0.8</span>, <span class="tok-num">128</span>, <span class="tok-num">12</span>),
        <span class="tok-num">6</span> =&gt; z.<span class="tok-fn">genMeshPlane</span>(gpa, <span class="tok-num">1.6</span>, <span class="tok-num">1.6</span>, <span class="tok-num">2</span>, <span class="tok-num">2</span>),
        <span class="tok-kw">else</span> =&gt; z.<span class="tok-fn">genMeshHemiSphere</span>(gpa, <span class="tok-num">0.9</span>, <span class="tok-num">24</span>, <span class="tok-num">16</span>),
    };
}

<span class="tok-comment">/// Grid slot for shape `i`, floating just above the floor so nothing z-fights.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">shapePos</span>(i: usize) Vec {
    <span class="tok-kw">const</span> col: f32 = <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(i % cols)));
    <span class="tok-kw">const</span> row: f32 = <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(i / cols)));
    <span class="tok-kw">return</span> <span class="tok-fn">pointVec</span>((col - <span class="tok-num">1.5</span>) * spacing, <span class="tok-num">1.1</span>, (row - <span class="tok-num">0.5</span>) * spacing);
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    <span class="tok-kw">for</span> (&amp;s.models) |*m| {
        z.<span class="tok-fn">unloadModel</span>(gpa, m.*);
    }
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson, <span class="tok-num">22</span>);
    s.* = .{
        .font = font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        <span class="tok-comment">// Look down at the grid from a comfortable three-quarter angle.</span>
        .cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>), <span class="tok-num">16.0</span>),
    };
    <span class="tok-comment">// uploadMesh hands the CPU mesh to the GPU; loadModelFromMesh wraps it in a</span>
    <span class="tok-comment">// Model the retained-draw path can render (and unloadModel later frees).</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n_shapes) |i| {
        <span class="tok-kw">var</span> mesh: z.Mesh = <span class="tok-kw">try</span> <span class="tok-fn">genShape</span>(gpa, i);
        <span class="tok-kw">try</span> z.<span class="tok-fn">uploadMesh</span>(gpa, &amp;mesh, false);
        s.models[i] = <span class="tok-kw">try</span> z.<span class="tok-fn">loadModelFromMesh</span>(f.gl, gpa, mesh);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">modeLabel</span>(mode: Mode) []<span class="tok-kw">const</span> u8 {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (mode) {
        .solid =&gt; <span class="tok-str">"view: solid"</span>,
        .wireframe =&gt; <span class="tok-str">"view: wireframe"</span>,
        .both =&gt; <span class="tok-str">"view: both"</span>,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-comment">// UI first so wantCaptureMouse reflects this frame before the camera reads it.</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">62</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ <span class="tok-builtin">@min</span>(<span class="tok-num">320</span>, vw - <span class="tok-num">16</span>), <span class="tok-num">54</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"controls"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-fn">modeLabel</span>(s.mode), .{})) {
            s.mode = <span class="tok-kw">switch</span> (s.mode) {
                .solid =&gt; .wireframe,
                .wireframe =&gt; .both,
                .both =&gt; .solid,
            };
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"reset view"</span>, .{})) {
            s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>), <span class="tok-num">16.0</span>);
        }
    }

    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, u.<span class="tok-fn">wantCaptureMouse</span>(), .{
        .min_distance = <span class="tok-num">6.0</span>,
        .max_distance = <span class="tok-num">40.0</span>,
    });

    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam);
    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">20</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n_shapes) |i| {
        <span class="tok-kw">const</span> pos: Vec = <span class="tok-fn">shapePos</span>(i);
        <span class="tok-kw">const</span> hue: f32 = shapes[i].hue;
        <span class="tok-kw">if</span> (s.mode != .wireframe) {
            <span class="tok-kw">const</span> fill: Color = <span class="tok-kw">if</span> (s.mode == .both)
                z.<span class="tok-fn">colorFromHSV</span>(hue, <span class="tok-num">0.45</span>, <span class="tok-num">0.5</span>)
            <span class="tok-kw">else</span>
                z.<span class="tok-fn">colorFromHSV</span>(hue, <span class="tok-num">0.55</span>, <span class="tok-num">0.88</span>);
            z.<span class="tok-fn">drawModel</span>(f.gl, s.models[i], pos, <span class="tok-num">1.0</span>, fill);
        }
        <span class="tok-kw">if</span> (s.mode != .solid) {
            z.<span class="tok-fn">drawModelWires</span>(f.gl, s.models[i], pos, <span class="tok-num">1.0</span>, z.<span class="tok-fn">colorFromHSV</span>(hue, <span class="tok-num">0.8</span>, <span class="tok-num">1.0</span>));
        }
    }
    z.<span class="tok-fn">endMode3D</span>(f.gl);

    <span class="tok-comment">// HUD: title, the recognisable primitive names, and the gesture hint.</span>
    <span class="tok-kw">const</span> ink_dim = common.palette.ink_dim;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">16</span> }, <span class="tok-str">"Mesh Gallery"</span>, .{ .size = <span class="tok-num">24</span>, .color = common.palette.ink, .font = &amp;s.font });
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, <span class="tok-num">46</span> },
        <span class="tok-str">"cube . sphere . cylinder . cone . torus . knot . plane . hemisphere"</span>,
        .{ .size = <span class="tok-num">14</span>, .color = ink_dim, .font = &amp;s.font },
    );
    common.<span class="tok-fn">caption</span>(
        f.gl,
        s.font,
        <span class="tok-str">"GenMesh* primitives - drag to orbit, pinch to zoom, toggle wireframe for the triangles"</span>,
    );
    s.ui_host.<span class="tok-fn">render</span>(f);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - models - geometric shapes (mesh gallery)"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
