<h1>textures_screen_buffer</h1>
<figure class="code src-file" data-path="examples/textures_screen_buffer/textures_screen_buffer.zig" data-lines="146"><figcaption><span>examples/textures_screen_buffer/textures_screen_buffer.zig</span><span>146 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! textures_screen_buffer - port of raylib [textures] example.</span>
<span class="tok-comment">//! A classic palette-cycling fire effect rendered entirely on the CPU: an</span>
<span class="tok-comment">//! 8-bit index buffer is seeded along the bottom row and propagated upward with</span>
<span class="tok-comment">//! random horizontal drift and decay each frame, mapped through a 256-entry HSV</span>
<span class="tok-comment">//! palette into an RGBA buffer, then uploaded to a texture and drawn 2x scaled.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;

<span class="tok-kw">const</span> scale_factor: i32 = <span class="tok-num">2</span>;
<span class="tok-kw">const</span> img_w: usize = <span class="tok-num">800</span> / scale_factor;
<span class="tok-kw">const</span> img_h: usize = <span class="tok-num">450</span> / scale_factor;
<span class="tok-kw">const</span> max_colors: usize = <span class="tok-num">256</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    tex: z.WgpuTexture,
    index_buffer: []u8,
    flame_root: []u8,
    pixels: []u8,
    palette: [max_colors]Color,
    prng: std.Random.DefaultPrng,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    gpa.<span class="tok-fn">free</span>(s.index_buffer);
    gpa.<span class="tok-fn">free</span>(s.flame_root);
    gpa.<span class="tok-fn">free</span>(s.pixels);
    s.tex.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> index_buffer: []u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u8, img_w * img_h);
    <span class="tok-builtin">@memset</span>(index_buffer, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> flame_root: []u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u8, img_w);
    <span class="tok-builtin">@memset</span>(flame_root, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> pixels: []u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u8, img_w * img_h * <span class="tok-num">4</span>);
    <span class="tok-builtin">@memset</span>(pixels, <span class="tok-num">0</span>);

    <span class="tok-kw">var</span> palette: [max_colors]Color = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..max_colors) |i| {
        <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(max_colors - <span class="tok-num">1</span>);
        palette[i] = z.<span class="tok-fn">colorFromHSV</span>(<span class="tok-num">250.0</span> + <span class="tok-num">150.0</span> * (t * t), t, t);
    }

    <span class="tok-kw">const</span> img: z.Image = .{
        .data = <span class="tok-builtin">@ptrCast</span>(pixels.ptr),
        .width = <span class="tok-builtin">@intCast</span>(img_w),
        .height = <span class="tok-builtin">@intCast</span>(img_h),
        .mipmaps = <span class="tok-num">1</span>,
        .format = <span class="tok-builtin">@backingInt</span>(z.PixelFormat.uncompressed_r8g8b8a8),
    };
    s.* = .{
        .tex = z.<span class="tok-fn">loadTextureFromImage</span>(f.gl, img),
        .index_buffer = index_buffer,
        .flame_root = flame_root,
        .pixels = pixels,
        .palette = palette,
        .prng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0x5EED</span>),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> rng: std.Random = s.prng.<span class="tok-fn">random</span>();
    <span class="tok-kw">const</span> w: usize = img_w;
    <span class="tok-kw">const</span> h: usize = img_h;

    <span class="tok-comment">// Grow the flame roots (the hot bottom seed row).</span>
    <span class="tok-kw">var</span> x: usize = <span class="tok-num">2</span>;
    <span class="tok-kw">while</span> (x &lt; w) : (x += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> grown: i32 = <span class="tok-builtin">@as</span>(i32, s.flame_root[x]) + rng.<span class="tok-fn">intRangeAtMost</span>(i32, <span class="tok-num">0</span>, <span class="tok-num">2</span>);
        s.flame_root[x] = <span class="tok-kw">if</span> (grown &gt; <span class="tok-num">255</span>) <span class="tok-num">255</span> <span class="tok-kw">else</span> <span class="tok-builtin">@intCast</span>(grown);
    }
    <span class="tok-comment">// Copy roots into the bottom row; clear the top row.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..w) |i| {
        s.index_buffer[i + (h - <span class="tok-num">1</span>) * w] = s.flame_root[i];
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..w) |i| {
        s.index_buffer[i] = <span class="tok-num">0</span>;
    }

    <span class="tok-comment">// Propagate upward with random drift + decay.</span>
    <span class="tok-kw">var</span> y: usize = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (y &lt; h) : (y += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> xx: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (xx &lt; w) : (xx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> i: usize = xx + y * w;
            <span class="tok-kw">var</span> ci: u8 = s.index_buffer[i];
            <span class="tok-kw">if</span> (ci == <span class="tok-num">0</span>) {
                <span class="tok-kw">continue</span>;
            }
            s.index_buffer[i] = <span class="tok-num">0</span>;
            <span class="tok-kw">const</span> move: i32 = rng.<span class="tok-fn">intRangeAtMost</span>(i32, <span class="tok-num">0</span>, <span class="tok-num">2</span>) - <span class="tok-num">1</span>;
            <span class="tok-kw">const</span> new_x: i32 = <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(xx)) + move;
            <span class="tok-kw">if</span> (new_x &gt; <span class="tok-num">0</span> <span class="tok-kw">and</span> new_x &lt; <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(w))) {
                <span class="tok-kw">const</span> iabove: usize = <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(i)) - <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(w)) + move);
                <span class="tok-kw">const</span> decay: u8 = <span class="tok-builtin">@intCast</span>(rng.<span class="tok-fn">intRangeAtMost</span>(i32, <span class="tok-num">0</span>, <span class="tok-num">3</span>));
                ci -= <span class="tok-kw">if</span> (decay &lt; ci) decay <span class="tok-kw">else</span> ci;
                s.index_buffer[iabove] = ci;
            }
        }
    }

    <span class="tok-comment">// Map palette indices to RGBA.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..w * h) |i| {
        <span class="tok-kw">const</span> col: Color = s.palette[s.index_buffer[i]];
        s.pixels[i * <span class="tok-num">4</span> + <span class="tok-num">0</span>] = col.r;
        s.pixels[i * <span class="tok-num">4</span> + <span class="tok-num">1</span>] = col.g;
        s.pixels[i * <span class="tok-num">4</span> + <span class="tok-num">2</span>] = col.b;
        s.pixels[i * <span class="tok-num">4</span> + <span class="tok-num">3</span>] = <span class="tok-num">255</span>;
    }
    <span class="tok-kw">const</span> img: z.Image = .{
        .data = <span class="tok-builtin">@ptrCast</span>(s.pixels.ptr),
        .width = <span class="tok-builtin">@intCast</span>(w),
        .height = <span class="tok-builtin">@intCast</span>(h),
        .mipmaps = <span class="tok-num">1</span>,
        .format = <span class="tok-builtin">@backingInt</span>(z.PixelFormat.uncompressed_r8g8b8a8),
    };
    z.<span class="tok-fn">updateTexture</span>(f.gl, s.tex, img);

    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, c.black);
    f.gl.<span class="tok-fn">texture</span>(
        .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = f.window.<span class="tok-fn">widthf</span>(), .height = f.window.<span class="tok-fn">heightf</span>() },
        s.tex,
        .{ .tint = c.white },
    );
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}
