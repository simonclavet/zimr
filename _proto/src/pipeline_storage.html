<h1>pipeline_storage</h1>
<figure class="code src-file" data-path="examples/pipeline_storage/pipeline_storage.zig" data-lines="175"><figcaption><span>examples/pipeline_storage/pipeline_storage.zig</span><span>175 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! pipeline_storage - Phase 2 (`src/notes/webgpu_control.md`): a COMPUTE</span>
<span class="tok-comment">//! shader writes an image into a STORAGE TEXTURE, which a render pass then</span>
<span class="tok-comment">//! samples. This is the compute&lt;-&gt;render bridge: GPU-generated texture content,</span>
<span class="tok-comment">//! no CPU upload.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Flow (one-shot at init, on its own command encoder so it runs outside the</span>
<span class="tok-comment">//! frame's render pass - compute and render passes can't be open at once):</span>
<span class="tok-comment">//!   - create an rgba8unorm texture with usage { storage_binding, texture_binding }</span>
<span class="tok-comment">//!   - compute BGL: @binding(0) texture_storage_2d&lt;rgba8unorm, write&gt;, vis=compute</span>
<span class="tok-comment">//!   - dispatch an 8x8 workgroup grid; the kernel `textureStore`s a plasma</span>
<span class="tok-comment">//!   - submit; then every frame a fullscreen pipeline samples the same view</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Uses the material API: z.material.storageTexture (STORAGE|TEXTURE binding)</span>
<span class="tok-comment">//! + z.ComputePipeline (one WGSL @compute entry; .dispatch runs it once on its</span>
<span class="tok-comment">//! own encoder, the right shape for a fill outside the frame's render pass).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Build:  zig build wgpu-pipeline-storage</span>
<span class="tok-comment">//! Device: zig build wgpu-pipeline-storage-standalone -Dmode=release</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> tex_dim: u32 = <span class="tok-num">512</span>;

<span class="tok-kw">const</span> compute_wgsl =
    <span class="tok-str">\\@group(0) @binding(0) var out_tex: texture_storage_2d&lt;rgba8unorm, write&gt;;</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@compute @workgroup_size(8, 8)</span>
    <span class="tok-str">\\fn cs_main(@builtin(global_invocation_id) gid: vec3u) {</span>
    <span class="tok-str">\\    let dims = textureDimensions(out_tex);</span>
    <span class="tok-str">\\    if (gid.x &gt;= dims.x || gid.y &gt;= dims.y) {</span>
    <span class="tok-str">\\        return;</span>
    <span class="tok-str">\\    }</span>
    <span class="tok-str">\\    let fx = f32(gid.x) / f32(dims.x);</span>
    <span class="tok-str">\\    let fy = f32(gid.y) / f32(dims.y);</span>
    <span class="tok-str">\\    let v = sinRad(fx * 10.0) + sinRad(fy * 10.0) + sinRad((fx + fy) * 10.0)</span>
    <span class="tok-str">\\          + sinRad(sqrt(fx * fx + fy * fy) * 14.0);</span>
    <span class="tok-str">\\    let c = vec3f(</span>
    <span class="tok-str">\\        0.5 + 0.5 * sinRad(v * 1.5),</span>
    <span class="tok-str">\\        0.5 + 0.5 * sinRad(v * 1.5 + 2.094),</span>
    <span class="tok-str">\\        0.5 + 0.5 * sinRad(v * 1.5 + 4.188)</span>
    <span class="tok-str">\\    );</span>
    <span class="tok-str">\\    textureStore(out_tex, vec2i(i32(gid.x), i32(gid.y)), vec4f(c, 1.0));</span>
    <span class="tok-str">\\}</span>
;

<span class="tok-kw">const</span> render_wgsl =
    <span class="tok-str">\\@group(0) @binding(0) var tex: texture_2d&lt;f32&gt;;</span>
    <span class="tok-str">\\@group(0) @binding(1) var samp: sampler;</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\struct VsOut {</span>
    <span class="tok-str">\\    @builtin(position) pos: vec4f,</span>
    <span class="tok-str">\\    @location(0) uv: vec2f,</span>
    <span class="tok-str">\\};</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@vertex</span>
    <span class="tok-str">\\fn vs_main(@builtin(vertex_index) vi: u32) -&gt; VsOut {</span>
    <span class="tok-str">\\    var pts = array&lt;vec2f, 3&gt;(</span>
    <span class="tok-str">\\        vec2f(-1.0, -1.0),</span>
    <span class="tok-str">\\        vec2f(3.0, -1.0),</span>
    <span class="tok-str">\\        vec2f(-1.0, 3.0)</span>
    <span class="tok-str">\\    );</span>
    <span class="tok-str">\\    let xy = pts[vi];</span>
    <span class="tok-str">\\    var out: VsOut;</span>
    <span class="tok-str">\\    out.pos = vec4f(xy, 0.0, 1.0);</span>
    <span class="tok-str">\\    out.uv = vec2f((xy.x + 1.0) * 0.5, 1.0 - (xy.y + 1.0) * 0.5);</span>
    <span class="tok-str">\\    return out;</span>
    <span class="tok-str">\\}</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@fragment</span>
    <span class="tok-str">\\fn fs_main(in: VsOut) -&gt; @location(0) vec4f {</span>
    <span class="tok-str">\\    return vec4f(textureSample(tex, samp, in.uv).rgb, 1.0);</span>
    <span class="tok-str">\\}</span>
;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    st: z.material.StorageTexture,
    sampler: z.wgpu.SamplerHandle,
    render_pipe: z.Pipeline,
    render_bg: z.wgpu.BindGroupHandle,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.render_pipe.<span class="tok-fn">deinit</span>();
    s.st.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">if</span> (s.render_bg != .invalid) {
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.render_bg);
    }
    <span class="tok-kw">if</span> (s.sampler != .invalid) {
        z.wgpu.<span class="tok-fn">destroySampler</span>(s.sampler);
    }
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-comment">// Create the storage texture and paint it once via compute - the fill's</span>
    <span class="tok-comment">// scaffolding is built and released inside the helper (leak-safe).</span>
    <span class="tok-kw">const</span> st: z.material.StorageTexture = <span class="tok-kw">try</span> z.material.<span class="tok-fn">storageTextureFilled</span>(
        gpa,
        f,
        tex_dim,
        tex_dim,
        compute_wgsl,
        <span class="tok-str">"storage_tex"</span>,
    );

    <span class="tok-kw">const</span> sampler: z.wgpu.SamplerHandle = z.wgpu.<span class="tok-fn">createSampler</span>(f.gpu.device, .{
        .mag_filter_linear = true,
        .min_filter_linear = true,
        .address_mode = .clamp_to_edge,
    });

    <span class="tok-kw">const</span> render_bgl: z.wgpu.BindGroupLayoutHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroupLayout</span>(gpa, f, &amp;.{
        .{ .binding = <span class="tok-num">0</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">1</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
    }, <span class="tok-str">"storage_render_bgl"</span>);
    <span class="tok-kw">const</span> render_bg: z.wgpu.BindGroupHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroup</span>(gpa, f, render_bgl, &amp;.{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .texture_view = st.view } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .sampler = sampler } },
    }, <span class="tok-str">"storage_render_bg"</span>);
    <span class="tok-kw">const</span> render_pipe: z.Pipeline = <span class="tok-kw">try</span> z.Pipeline.<span class="tok-fn">init</span>(gpa, f, .{
        .wgsl = render_wgsl,
        .bind_group_layouts = &amp;.{render_bgl},
        .label = <span class="tok-str">"storage_render"</span>,
    });
    <span class="tok-comment">// render_bgl was build-only: it defined the render pipeline's layout and the</span>
    <span class="tok-comment">// render bind group, both of which retain it. Release the handle now.</span>
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(render_bgl);

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>),
        .st = st,
        .sampler = sampler,
        .render_pipe = render_pipe,
        .render_bg = render_bg,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    s.render_pipe.<span class="tok-fn">bind</span>(ps);
    s.render_pipe.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">0</span>, s.render_bg);
    s.render_pipe.<span class="tok-fn">drawArrays</span>(ps, <span class="tok-num">3</span>, <span class="tok-num">1</span>);

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"pipeline_storage: compute shader -&gt; storage texture -&gt; sampled fullscreen"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    <span class="tok-comment">// Transient GPU-technique demo: pipeline setup creates layouts and shader</span>
    <span class="tok-comment">// modules that aren't retained in State, so a leak-tight deinit isn't</span>
    <span class="tok-comment">// practical. Opt out of the managed leak gate rather than fake teardown.</span>
    .memory = .managed,
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - pipeline storage"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.0</span>, .g = <span class="tok-num">0.0</span>, .b = <span class="tok-num">0.0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    <span class="tok-comment">// .memory left default (arena): init creates a compute pipeline + storage</span>
    <span class="tok-comment">// texture (+ their bind groups/layouts) that aren't kept in State, so a full</span>
    <span class="tok-comment">// managed teardown needs new State fields to hold those handles - deferred.</span>
    <span class="tok-comment">// The stored render_pipe/tex_view/sampler/render_bg would free cleanly.</span>
    .deinit = deinit,
    .update = update,
};
