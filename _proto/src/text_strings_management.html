<figure class="code src-file" data-path="examples/text_strings_management/text_strings_management.zig" data-lines="381"><figcaption><span>examples/text_strings_management/text_strings_management.zig</span><span>381 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! text_strings_management - raylib's [text] strings-management sample, reimagined</span>
<span class="tok-comment">//! as a hands-on playground for the string ops themselves.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! raylib's version demos TextSubtext / TextSplit / TextJoin by turning a</span>
<span class="tok-comment">//! sentence into draggable "text particles" you slice and glue. We keep that</span>
<span class="tok-comment">//! spirit but lean into what's fun on a phone: every word is a chip you can drag</span>
<span class="tok-comment">//! with a finger, and the two gestures ARE the two headline operations -</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * TAP a chip            -&gt; SHATTER it into one chip per character  (a split)</span>
<span class="tok-comment">//!   * DROP a chip onto       -&gt; GLUE the two chips into one, text joined (a join)</span>
<span class="tok-comment">//!     another chip</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The HUD rebuilds the whole sentence live by joining every chip left-to-right,</span>
<span class="tok-comment">//! so you can watch the string come apart and go back together. No engine feature</span>
<span class="tok-comment">//! needed - just text, rects, and touch; the "string library" is plain Zig slices.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> font_size: f32 = <span class="tok-num">28</span>;
<span class="tok-kw">const</span> chip_h: f32 = font_size + <span class="tok-num">20</span>;
<span class="tok-kw">const</span> pad_x: f32 = <span class="tok-num">16</span>; <span class="tok-comment">// horizontal breathing room inside a chip</span>
<span class="tok-kw">const</span> max_chips: usize = <span class="tok-num">64</span>; <span class="tok-comment">// a short sentence shattered to characters fits</span>
<span class="tok-kw">const</span> tap_slop: f32 = <span class="tok-num">8</span>; <span class="tok-comment">// finger travel under this counts as a tap, not a drag</span>

<span class="tok-comment">// Colors, pulled out so the draw calls stay short and readable.</span>
<span class="tok-kw">const</span> bg: Color = .{ .r = <span class="tok-num">17</span>, .g = <span class="tok-num">24</span>, .b = <span class="tok-num">39</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> ink: Color = .{ .r = <span class="tok-num">15</span>, .g = <span class="tok-num">23</span>, .b = <span class="tok-num">42</span>, .a = <span class="tok-num">255</span> }; <span class="tok-comment">// chip label on bright chip</span>
<span class="tok-kw">const</span> title_col: Color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">240</span>, .b = <span class="tok-num">250</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> sub_col: Color = .{ .r = <span class="tok-num">148</span>, .g = <span class="tok-num">163</span>, .b = <span class="tok-num">184</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> hud_bg: Color = .{ .r = <span class="tok-num">12</span>, .g = <span class="tok-num">17</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">235</span> };
<span class="tok-kw">const</span> hud_col: Color = .{ .r = <span class="tok-num">203</span>, .g = <span class="tok-num">213</span>, .b = <span class="tok-num">225</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> shadow: Color = .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">90</span> };

<span class="tok-kw">const</span> palette = [_]Color{
    .{ .r = <span class="tok-num">56</span>, .g = <span class="tok-num">189</span>, .b = <span class="tok-num">248</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// sky</span>
    .{ .r = <span class="tok-num">251</span>, .g = <span class="tok-num">146</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// orange</span>
    .{ .r = <span class="tok-num">163</span>, .g = <span class="tok-num">230</span>, .b = <span class="tok-num">53</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// lime</span>
    .{ .r = <span class="tok-num">244</span>, .g = <span class="tok-num">114</span>, .b = <span class="tok-num">182</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// pink</span>
    .{ .r = <span class="tok-num">168</span>, .g = <span class="tok-num">132</span>, .b = <span class="tok-num">247</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// violet</span>
    .{ .r = <span class="tok-num">45</span>, .g = <span class="tok-num">212</span>, .b = <span class="tok-num">191</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// teal</span>
};

<span class="tok-kw">const</span> Rect = <span class="tok-kw">struct</span> { x: f32, y: f32, w: f32, h: f32 };

<span class="tok-comment">/// One draggable piece of text. `pos` is the chip's CENTER; the on-screen rect is</span>
<span class="tok-comment">/// derived each frame from the measured text width so a chip hugs its letters.</span>
<span class="tok-kw">const</span> Chip = <span class="tok-kw">struct</span> {
    buf: [<span class="tok-num">96</span>]u8 = undefined,
    len: usize = <span class="tok-num">0</span>,
    pos: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    vel: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    tint: usize = <span class="tok-num">0</span>,

    <span class="tok-kw">fn</span> <span class="tok-fn">text</span>(self: *<span class="tok-kw">const</span> Chip) []<span class="tok-kw">const</span> u8 {
        <span class="tok-kw">return</span> self.buf[<span class="tok-num">0</span>..self.len];
    }
    <span class="tok-kw">fn</span> <span class="tok-fn">setText</span>(self: *Chip, s: []<span class="tok-kw">const</span> u8) void {
        <span class="tok-kw">const</span> n: usize = <span class="tok-builtin">@min</span>(s.len, self.buf.len);
        <span class="tok-builtin">@memcpy</span>(self.buf[<span class="tok-num">0</span>..n], s[<span class="tok-num">0</span>..n]);
        self.len = n;
    }
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,

    grab_offset: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, <span class="tok-comment">// finger-to-chip-center offset, set on grab</span>
    press: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, <span class="tok-comment">// where the current press started (for tap vs drag)</span>
    laid_out: bool = false, <span class="tok-comment">// seed the row once, when we first know the viewport</span>

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {

<span class="tok-comment">// ---- chip helpers ----------------------------------------------------------</span>

<span class="tok-kw">fn</span> <span class="tok-fn">chipWidth</span>(s: *State, ch: *<span class="tok-kw">const</span> Chip) f32 {
    <span class="tok-kw">return</span> z.<span class="tok-fn">measureText</span>(s.font, ch.<span class="tok-fn">text</span>(), font_size)[<span class="tok-num">0</span>] + pad_x * <span class="tok-num">2</span>;

<span class="tok-kw">fn</span> <span class="tok-fn">chipRect</span>(s: *State, ch: *<span class="tok-kw">const</span> Chip) Rect {
    <span class="tok-kw">const</span> w: f32 = <span class="tok-fn">chipWidth</span>(s, ch);

}

<span class="tok-kw">fn</span> <span class="tok-fn">addChip</span>(s: *State, text: []<span class="tok-kw">const</span> u8, pos: Vec2) void {
    <span class="tok-kw">if</span> (s.count &gt;= max_chips) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">var</span> ch: Chip = .{ .pos = pos, .tint = s.count % palette.len };
    ch.<span class="tok-fn">setText</span>(text);
    s.chips[s.count] = ch;
    s.count += <span class="tok-num">1</span>;

<span class="tok-kw">fn</span> <span class="tok-fn">resetRect</span>(vw: f32) Rect {
    <span class="tok-kw">return</span> .{ .x = vw - <span class="tok-num">92</span> - <span class="tok-num">16</span>, .y = <span class="tok-num">16</span>, .w = <span class="tok-num">92</span>, .h = <span class="tok-num">40</span> };
}

<span class="tok-comment">/// The sentence, split on spaces into a centered row of word-chips. This is the</span>
<span class="tok-comment">/// "reset" state and the first-frame seed.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">layout</span>(s: *State, vw: f32, vh: f32) void {
    s.count = <span class="tok-num">0</span>;
    s.grabbed = null;
    <span class="tok-kw">const</span> sentence: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"strings are just bytes you can rearrange"</span>;
    <span class="tok-kw">var</span> total: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> it = std.mem.<span class="tok-fn">tokenizeScalar</span>(u8, sentence, <span class="tok-str">' '</span>);
    <span class="tok-kw">while</span> (it.<span class="tok-fn">next</span>()) |word| {
        total += z.<span class="tok-fn">measureText</span>(s.font, word, font_size)[<span class="tok-num">0</span>] + pad_x * <span class="tok-num">2</span> + <span class="tok-num">12</span>;
    }
    <span class="tok-kw">var</span> x: f32 = (vw - total) * <span class="tok-num">0.5</span> + pad_x;
    it = std.mem.<span class="tok-fn">tokenizeScalar</span>(u8, sentence, <span class="tok-str">' '</span>);
    <span class="tok-kw">while</span> (it.<span class="tok-fn">next</span>()) |word| {
        <span class="tok-kw">const</span> w: f32 = z.<span class="tok-fn">measureText</span>(s.font, word, font_size)[<span class="tok-num">0</span>] + pad_x * <span class="tok-num">2</span>;
        <span class="tok-fn">addChip</span>(s, word, .{ x + w * <span class="tok-num">0.5</span>, vh * <span class="tok-num">0.42</span> });
        x += w + <span class="tok-num">12</span>;
    }
}

<span class="tok-comment">/// SPLIT: replace chip `idx` with one chip per character, fanned outward from</span>
<span class="tok-comment">/// where it stood. Spaces are dropped so you get pure letters to play with.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">shatter</span>(s: *State, idx: usize) void {
    <span class="tok-kw">const</span> src: Chip = s.chips[idx];
    s.chips[idx] = s.chips[s.count - <span class="tok-num">1</span>]; <span class="tok-comment">// swap-remove the source</span>
    s.count -= <span class="tok-num">1</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (src.<span class="tok-fn">text</span>()) |byte| {
        <span class="tok-kw">if</span> (byte == <span class="tok-str">' '</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> a: f32 = <span class="tok-fn">float</span>(i) * <span class="tok-num">0.9</span>;
        <span class="tok-kw">const</span> one = [_]u8{byte};
        <span class="tok-fn">addChip</span>(s, &amp;one, .{ src.pos[<span class="tok-num">0</span>] + <span class="tok-builtin">@cos</span>(a) * <span class="tok-num">6</span>, src.pos[<span class="tok-num">1</span>] + <span class="tok-builtin">@sin</span>(a) * <span class="tok-num">6</span> });
        <span class="tok-kw">if</span> (s.count &gt; <span class="tok-num">0</span>) {
            s.chips[s.count - <span class="tok-num">1</span>].vel = .{ <span class="tok-builtin">@cos</span>(a) * <span class="tok-num">220</span>, <span class="tok-builtin">@sin</span>(a) * <span class="tok-num">220</span> - <span class="tok-num">60</span> };
        }
        i += <span class="tok-num">1</span>;
    }
}

<span class="tok-comment">/// JOIN: fold chip `b`'s text onto chip `a` (a space between) and drop `b`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">glue</span>(s: *State, a: usize, b: usize) void {
    <span class="tok-kw">var</span> joined: [<span class="tok-num">96</span>]u8 = undefined;
    <span class="tok-kw">const</span> merged: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;joined, <span class="tok-str">"{s} {s}"</span>, .{ s.chips[a].<span class="tok-fn">text</span>(), s.chips[b].<span class="tok-fn">text</span>() }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    s.chips[a].<span class="tok-fn">setText</span>(merged);
    s.chips[b] = s.chips[s.count - <span class="tok-num">1</span>];
    s.count -= <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">pointInRect</span>(p: Vec2, r: Rect) bool {
    <span class="tok-kw">return</span> p[<span class="tok-num">0</span>] &gt;= r.x <span class="tok-kw">and</span> p[<span class="tok-num">0</span>] &lt;= r.x + r.w <span class="tok-kw">and</span> p[<span class="tok-num">1</span>] &gt;= r.y <span class="tok-kw">and</span> p[<span class="tok-num">1</span>] &lt;= r.y + r.h;
}

<span class="tok-comment">/// Topmost chip under the pointer, or null. Later chips draw on top, so we scan</span>
<span class="tok-comment">/// back-to-front to grab the one you can actually see.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">chipAt</span>(s: *State, p: Vec2) ?usize {
    <span class="tok-kw">var</span> i: usize = s.count;
    <span class="tok-kw">while</span> (i &gt; <span class="tok-num">0</span>) {
        i -= <span class="tok-num">1</span>;
        <span class="tok-kw">if</span> (<span class="tok-fn">pointInRect</span>(p, <span class="tok-fn">chipRect</span>(s, &amp;s.chips[i]))) {
            <span class="tok-kw">return</span> i;
        }
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-comment">/// A chip (other than `gi`) whose rect overlaps `gi`'s - the glue target.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">overlapTarget</span>(s: *State, gi: usize) ?usize {
    <span class="tok-kw">const</span> g: Rect = <span class="tok-fn">chipRect</span>(s, &amp;s.chips[gi]);
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (i == gi) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> r: Rect = <span class="tok-fn">chipRect</span>(s, &amp;s.chips[i]);
        <span class="tok-kw">const</span> hit: bool = g.x &lt; r.x + r.w <span class="tok-kw">and</span> g.x + g.w &gt; r.x <span class="tok-kw">and</span> g.y &lt; r.y + r.h <span class="tok-kw">and</span> g.y + g.h &gt; r.y;
        <span class="tok-kw">if</span> (hit) {
            <span class="tok-kw">return</span> i;
        }
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-comment">/// Gentle physics: nudge overlapping idle chips apart, coast on any velocity from</span>
<span class="tok-comment">/// a shatter, and keep everything on screen. Alive, but damped enough to read.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">settle</span>(s: *State, vw: f32, vh: f32, dt: f32) void {
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> j: usize = i + <span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (j &lt; s.count) : (j += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (s.grabbed == i <span class="tok-kw">or</span> s.grabbed == j) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> dx: f32 = s.chips[i].pos[<span class="tok-num">0</span>] - s.chips[j].pos[<span class="tok-num">0</span>];
            <span class="tok-kw">const</span> dy: f32 = s.chips[i].pos[<span class="tok-num">1</span>] - s.chips[j].pos[<span class="tok-num">1</span>];
            <span class="tok-kw">const</span> min_x: f32 = (<span class="tok-fn">chipWidth</span>(s, &amp;s.chips[i]) + <span class="tok-fn">chipWidth</span>(s, &amp;s.chips[j])) * <span class="tok-num">0.5</span>;
            <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(dx) &lt; min_x <span class="tok-kw">and</span> <span class="tok-builtin">@abs</span>(dy) &lt; chip_h) {
                <span class="tok-kw">const</span> push: f32 = <span class="tok-kw">if</span> (dx &gt;= <span class="tok-num">0</span>) <span class="tok-num">8</span> <span class="tok-kw">else</span> -<span class="tok-num">8</span>;
                s.chips[i].vel[<span class="tok-num">0</span>] += push;
                s.chips[j].vel[<span class="tok-num">0</span>] -= push;
            }
        }
    }
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (s.grabbed == i) {
            <span class="tok-kw">continue</span>;
        }
        s.chips[i].pos[<span class="tok-num">0</span>] += s.chips[i].vel[<span class="tok-num">0</span>] * dt;
        s.chips[i].pos[<span class="tok-num">1</span>] += s.chips[i].vel[<span class="tok-num">1</span>] * dt;
        s.chips[i].vel[<span class="tok-num">0</span>] *= <span class="tok-num">0.86</span>;
        s.chips[i].vel[<span class="tok-num">1</span>] *= <span class="tok-num">0.86</span>;
        <span class="tok-kw">const</span> w: f32 = <span class="tok-fn">chipWidth</span>(s, &amp;s.chips[i]);
        s.chips[i].pos[<span class="tok-num">0</span>] = <span class="tok-fn">clamp</span>(s.chips[i].pos[<span class="tok-num">0</span>], w * <span class="tok-num">0.5</span>, vw - w * <span class="tok-num">0.5</span>);
        s.chips[i].pos[<span class="tok-num">1</span>] = <span class="tok-fn">clamp</span>(s.chips[i].pos[<span class="tok-num">1</span>], chip_h * <span class="tok-num">0.5</span> + <span class="tok-num">64</span>, vh - chip_h * <span class="tok-num">0.5</span> - <span class="tok-num">96</span>);
    }
}

<span class="tok-comment">// ---- update ----------------------------------------------------------------</span>

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (!s.laid_out) {
        <span class="tok-fn">layout</span>(s, vw, vh);
        s.laid_out = true;
    }

    <span class="tok-kw">const</span> ptr: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> pressed: bool = z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left);
    <span class="tok-comment">// Raw held-state + press origin - the phone-safe way (delta accumulation</span>
    <span class="tok-comment">// jumps on touch because the pre-touch pointer is stale). Follow the finger</span>
    <span class="tok-comment">// absolutely: chip.pos = finger - grab_offset. Same recipe as ui_phone_gestures.</span>
    <span class="tok-kw">const</span> down: bool = f.input.mouse.current_button[<span class="tok-num">0</span>] != <span class="tok-num">0</span>;
    <span class="tok-kw">const</span> press: Vec2 = f.input.mouse.press_position[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> over_reset: bool = <span class="tok-fn">pointInRect</span>(ptr, <span class="tok-fn">resetRect</span>(vw));

    <span class="tok-kw">if</span> (pressed <span class="tok-kw">and</span> over_reset) {
        <span class="tok-fn">layout</span>(s, vw, vh);
        <span class="tok-fn">drawScene</span>(f, s, vw, vh);
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (pressed <span class="tok-kw">and</span> !over_reset) {
        <span class="tok-comment">// Hit-test where the press LANDED, not the current pointer.</span>
        s.grabbed = <span class="tok-fn">chipAt</span>(s, press);
        s.press = press;
        <span class="tok-kw">if</span> (s.grabbed) |gi| {
            s.grab_offset = .{ press[<span class="tok-num">0</span>] - s.chips[gi].pos[<span class="tok-num">0</span>], press[<span class="tok-num">1</span>] - s.chips[gi].pos[<span class="tok-num">1</span>] };
        }
    }
    <span class="tok-kw">if</span> (down) {
        <span class="tok-kw">if</span> (s.grabbed) |gi| {
            s.chips[gi].pos = .{ ptr[<span class="tok-num">0</span>] - s.grab_offset[<span class="tok-num">0</span>], ptr[<span class="tok-num">1</span>] - s.grab_offset[<span class="tok-num">1</span>] };
            s.chips[gi].vel = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
        }
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.grabbed) |gi| {
        <span class="tok-comment">// Released: a press that barely travelled is a tap (split); one that was</span>
        <span class="tok-comment">// dragged onto a neighbour is a join.</span>
        <span class="tok-kw">const</span> dx: f32 = ptr[<span class="tok-num">0</span>] - s.press[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = ptr[<span class="tok-num">1</span>] - s.press[<span class="tok-num">1</span>];
        <span class="tok-kw">if</span> (dx * dx + dy * dy &lt;= tap_slop * tap_slop) {
            <span class="tok-fn">shatter</span>(s, gi);
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (<span class="tok-fn">overlapTarget</span>(s, gi)) |ti| {
            <span class="tok-fn">glue</span>(s, ti, gi);
        }
        s.grabbed = null;
    }

    <span class="tok-fn">settle</span>(s, vw, vh, f.time.delta_time);
    <span class="tok-fn">drawScene</span>(f, s, vw, vh);
}

<span class="tok-comment">// ---- draw ------------------------------------------------------------------</span>

<span class="tok-kw">fn</span> <span class="tok-fn">label</span>(

        <span class="tok-kw">const</span> edge: Color = <span class="tok-kw">if</span> (lifted)

        <span class="tok-kw">else</span>
            .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">70</span> };
        f.gl.<span class="tok-fn">rect</span>(.{ .x = r.x, .y = r.y, .width = r.w, .height = r.h }, .{ .color = edge, .outline = <span class="tok-num">1.5</span> });
        <span class="tok-kw">const</span> tw: f32 = z.<span class="tok-fn">measureText</span>(s.font, ch.<span class="tok-fn">text</span>(), font_size)[<span class="tok-num">0</span>];
        <span class="tok-fn">label</span>(f, s, .{ ch.pos[<span class="tok-num">0</span>] - tw * <span class="tok-num">0.5</span>, ch.pos[<span class="tok-num">1</span>] - font_size * <span class="tok-num">0.5</span> }, ch.<span class="tok-fn">text</span>(), font_size, ink);

    <span class="tok-kw">const</span> btn: Color = <span class="tok-kw">if</span> (over)
        .{ .r = <span class="tok-num">71</span>, .g = <span class="tok-num">85</span>, .b = <span class="tok-num">105</span>, .a = <span class="tok-num">255</span> }
    <span class="tok-kw">else</span>
        .{ .r = <span class="tok-num">51</span>, .g = <span class="tok-num">65</span>, .b = <span class="tok-num">85</span>, .a = <span class="tok-num">255</span> };
    f.gl.<span class="tok-fn">rect</span>(.{ .x = rr.x, .y = rr.y, .width = rr.w, .height = rr.h }, .{ .color = btn });
    <span class="tok-fn">label</span>(f, s, .{ rr.x + <span class="tok-num">20</span>, rr.y + <span class="tok-num">11</span> }, <span class="tok-str">"reset"</span>, <span class="tok-num">18</span>, .{ .r = <span class="tok-num">226</span>, .g = <span class="tok-num">232</span>, .b = <span class="tok-num">240</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-fn">drawHud</span>(f, s, vw, vh);
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"tap = split into letters, drag-and-drop = join - the two string ops as gestures"</span>);
}

<span class="tok-comment">/// Join every chip back into one sentence in visual (left-to-right) order and</span>
<span class="tok-comment">/// show it live, so the string ops read as one evolving string.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawHud</span>(f: *z.Frame, s: *State, vw: f32, vh: f32) void {
    <span class="tok-kw">var</span> order: [max_chips]usize = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.count) |k| {
        order[k] = k;
    }
    std.sort.<span class="tok-fn">pdq</span>(usize, order[<span class="tok-num">0</span>..s.count], s, cmpByX);
    <span class="tok-kw">var</span> joined: [<span class="tok-num">1024</span>]u8 = undefined;
    <span class="tok-kw">var</span> w: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (order[<span class="tok-num">0</span>..s.count], <span class="tok-num">0</span>..) |ci, n| {
        <span class="tok-kw">const</span> t: []<span class="tok-kw">const</span> u8 = s.chips[ci].<span class="tok-fn">text</span>();
        <span class="tok-kw">if</span> (n != <span class="tok-num">0</span> <span class="tok-kw">and</span> w &lt; joined.len) {
            joined[w] = <span class="tok-str">' '</span>;
            w += <span class="tok-num">1</span>;
        }
        <span class="tok-kw">const</span> take: usize = <span class="tok-builtin">@min</span>(t.len, joined.len - w);
        <span class="tok-builtin">@memcpy</span>(joined[w .. w + take], t[<span class="tok-num">0</span>..take]);
        w += take;
    }
    <span class="tok-kw">var</span> hud: [<span class="tok-num">1100</span>]u8 = undefined;
    <span class="tok-kw">const</span> line: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;hud, <span class="tok-str">"{d} chips  |  {s}"</span>, .{ s.count, joined[<span class="tok-num">0</span>..w] }) <span class="tok-kw">catch</span> joined[<span class="tok-num">0</span>..w];
    f.gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">0</span>, .y = vh - <span class="tok-num">64</span>, .width = vw, .height = <span class="tok-num">64</span> }, .{ .color = hud_bg });
    <span class="tok-fn">label</span>(f, s, .{ <span class="tok-num">20</span>, vh - <span class="tok-num">44</span> }, line, <span class="tok-num">17</span>, hud_col);
}

<span class="tok-kw">fn</span> <span class="tok-fn">cmpByX</span>(s: *State, a: usize, b: usize) bool {
    <span class="tok-kw">return</span> s.chips[a].pos[<span class="tok-num">0</span>] &lt; s.chips[b].pos[<span class="tok-num">0</span>];
}
