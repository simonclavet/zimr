<span class="tok-comment">//</span>
<span class="tok-comment">// Forward kinematics: a chain of bones where each joint's world transform is</span>
<span class="tok-comment">// its PARENT's world transform composed with the joint's local rotation. The</span>
<span class="tok-comment">// angles animate (a phase-shifted sine down the chain) so the arm coils and</span>
<span class="tok-comment">// sways, and the whole rig slowly spins about Y so bones pass in front of each</span>
<span class="tok-comment">// other - a direct test of depth.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// It also exercises the custom-pipeline API on a real 3D job: ONE instanced</span>
<span class="tok-comment">// draw renders all N bones. Per-bone data (a clip-space matrix, a rotation-only</span>
<span class="tok-comment">// matrix for normals, and a tint) lives in a read-only STORAGE buffer indexed</span>
<span class="tok-comment">// by @builtin(instance_index). No per-draw UBO churn, so none of the</span>
<span class="tok-comment">// "UBO-between-draws" hazard. Depth comes from the window opting into</span>
<span class="tok-comment">// depth_format, which makes the 2D main pass carry a depth attachment that a</span>
<span class="tok-comment">// depth=.less custom pipeline matches.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Build:      zig build wgpu-forward-kinematics</span>
<span class="tok-comment">// Standalone: zig build wgpu-forward-kinematics-standalone</span>

<span class="tok-kw">const</span> joint_count: usize = <span class="tok-num">8</span>;

<span class="tok-kw">const</span> box_verts: [<span class="tok-num">36</span>]Vtx = <span class="tok-fn">buildBox</span>();

            <span class="tok-kw">for</span> (uv, <span class="tok-num">0</span>..) |c, k| {

    <span class="tok-str">\\struct Instance {</span>
    <span class="tok-str">\\  mvp: mat4x4&lt;f32&gt;,</span>
    <span class="tok-str">\\  nrm: mat4x4&lt;f32&gt;,</span>
    <span class="tok-str">\\  color: vec4&lt;f32&gt;,</span>
    <span class="tok-str">\\};</span>
    <span class="tok-str">\\struct Light { dir: vec4&lt;f32&gt;, ambient: vec4&lt;f32&gt; };</span>
    <span class="tok-str">\\@group(0) @binding(0) var&lt;uniform&gt; light: Light;</span>
    <span class="tok-str">\\@group(0) @binding(1) var&lt;storage, read&gt; instances: array&lt;Instance&gt;;</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\struct VsOut {</span>
    <span class="tok-str">\\  @builtin(position) clip: vec4&lt;f32&gt;,</span>
    <span class="tok-str">\\  @location(0) normal: vec3&lt;f32&gt;,</span>
    <span class="tok-str">\\  @location(1) color: vec3&lt;f32&gt;,</span>
    <span class="tok-str">\\};</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@vertex</span>
    <span class="tok-str">\\fn vs_main(@location(0) pos: vec3&lt;f32&gt;, @location(1) nrm: vec3&lt;f32&gt;,</span>
    <span class="tok-str">\\           @builtin(instance_index) ii: u32) -&gt; VsOut {</span>
    <span class="tok-str">\\  let inst = instances[ii];</span>
    <span class="tok-str">\\  var out: VsOut;</span>
    <span class="tok-str">\\  out.clip = inst.mvp * vec4&lt;f32&gt;(pos, 1.0);</span>
    <span class="tok-str">\\  out.normal = (inst.nrm * vec4&lt;f32&gt;(nrm, 0.0)).xyz;</span>
    <span class="tok-str">\\  out.color = inst.color.rgb;</span>
    <span class="tok-str">\\  return out;</span>
    <span class="tok-str">\\}</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@fragment</span>
    <span class="tok-str">\\fn fs_main(in: VsOut) -&gt; @location(0) vec4&lt;f32&gt; {</span>
    <span class="tok-str">\\  let n = normalize(in.normal);</span>
    <span class="tok-str">\\  let l = normalize(-light.dir.xyz);</span>
    <span class="tok-str">\\  let diff = max(dot(n, l), 0.0);</span>
    <span class="tok-str">\\  let lit = in.color * (light.ambient.rgb + diff * vec3&lt;f32&gt;(1.0, 1.0, 1.0));</span>
    <span class="tok-str">\\  return vec4&lt;f32&gt;(lit, 1.0);</span>
    <span class="tok-str">\\}</span>
;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    pipeline: z.Pipeline,
    vbo: z.wgpu.BufferHandle,
    instances: z.wgpu.BufferHandle,
    light: z.wgpu.BufferHandle,
    bind_group: z.wgpu.BindGroupHandle,
};

<span class="tok-kw">fn</span> <span class="tok-fn">hsv</span>(h: f32, s: f32, v: f32) [<span class="tok-num">4</span>]f32 {
    <span class="tok-kw">const</span> c: f32 = v * s;
    <span class="tok-kw">const</span> hp: f32 = h * <span class="tok-num">6.0</span>;
    <span class="tok-kw">const</span> x: f32 = c * (<span class="tok-num">1.0</span> - <span class="tok-builtin">@abs</span>(<span class="tok-builtin">@mod</span>(hp, <span class="tok-num">2.0</span>) - <span class="tok-num">1.0</span>));
    <span class="tok-kw">const</span> m: f32 = v - c;
    <span class="tok-kw">var</span> rgb: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    <span class="tok-kw">if</span> (hp &lt; <span class="tok-num">1.0</span>) {
        rgb = .{ c, x, <span class="tok-num">0</span> };
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (hp &lt; <span class="tok-num">2.0</span>) {
        rgb = .{ x, c, <span class="tok-num">0</span> };
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (hp &lt; <span class="tok-num">3.0</span>) {
        rgb = .{ <span class="tok-num">0</span>, c, x };
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (hp &lt; <span class="tok-num">4.0</span>) {
        rgb = .{ <span class="tok-num">0</span>, x, c };
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (hp &lt; <span class="tok-num">5.0</span>) {
        rgb = .{ x, <span class="tok-num">0</span>, c };
    } <span class="tok-kw">else</span> {
        rgb = .{ c, <span class="tok-num">0</span>, x };
    }
    <span class="tok-kw">return</span> .{ rgb[<span class="tok-num">0</span>] + m, rgb[<span class="tok-num">1</span>] + m, rgb[<span class="tok-num">2</span>] + m, <span class="tok-num">1</span> };
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(box_verts)),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"fk_box_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;box_verts));

    <span class="tok-kw">const</span> instances: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = joint_count * <span class="tok-builtin">@sizeOf</span>(Instance),
        .usage = .{ .storage = true, .copy_dst = true },
        .label = <span class="tok-str">"fk_instances"</span>,
    });

    <span class="tok-kw">const</span> light_init: Light = .{ .dir = .{ -<span class="tok-num">0.4</span>, -<span class="tok-num">0.7</span>, -<span class="tok-num">0.55</span>, <span class="tok-num">0</span> }, .ambient = .{ <span class="tok-num">0.20</span>, <span class="tok-num">0.22</span>, <span class="tok-num">0.28</span>, <span class="tok-num">0</span> } };
    <span class="tok-kw">const</span> light: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(Light),
        .usage = .{ .uniform = true, .copy_dst = true },
        .label = <span class="tok-str">"fk_light"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, light, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;light_init));

    <span class="tok-kw">const</span> bgl: z.wgpu.BindGroupLayoutHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroupLayout</span>(gpa, f, &amp;.{
        .{ .binding = <span class="tok-num">0</span>, .visibility = .{ .fragment = true }, .resource = .{ .uniform_buffer = .{} } },
        .{ .binding = <span class="tok-num">1</span>, .visibility = .{ .vertex = true }, .resource = .{ .storage_buffer = .{ .read_only = true } } },
    }, <span class="tok-str">"fk_bgl"</span>);

    <span class="tok-kw">const</span> bind_group: z.wgpu.BindGroupHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroup</span>(gpa, f, bgl, &amp;.{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = light } } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .buffer = .{ .handle = instances } } },
    }, <span class="tok-str">"fk_bg"</span>);

    <span class="tok-kw">const</span> layout: z.VertexLayout = .{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(Vtx),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
            .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
        },
    };
    <span class="tok-kw">const</span> pipeline: z.Pipeline = <span class="tok-kw">try</span> z.Pipeline.<span class="tok-fn">init</span>(gpa, f, .{
        .wgsl = fk_wgsl,
        .layouts = &amp;.{layout},
        .bind_group_layouts = &amp;.{bgl},
        .depth = .less,
        .cull = .none,
        .label = <span class="tok-str">"forward_kinematics"</span>,
    });

    <span class="tok-comment">// bgl fed both the bind group and the pipeline's layout; the pipeline has</span>
    <span class="tok-comment">// internalized what it needs, so the build-time layout can be released now.</span>
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgl);

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>),
        .pipeline = pipeline,
        .vbo = vbo,
        .instances = instances,
        .light = light,
        .bind_group = bind_group,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> aspect: f32 = f.window.<span class="tok-fn">aspect</span>();

    <span class="tok-kw">const</span> view: Mat = <span class="tok-fn">lookAtRh</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.3</span>, <span class="tok-num">7.5</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.2</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(<span class="tok-num">0.7</span>, aspect, <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>);
    <span class="tok-kw">const</span> view_proj: Mat = <span class="tok-fn">mulMat</span>(proj, view);

    <span class="tok-comment">// Root frame: spin the whole rig about Y so depth ordering changes, and</span>
    <span class="tok-comment">// drop the base so the chain rises through the middle of the view.</span>
    <span class="tok-kw">const</span> total: f32 = <span class="tok-builtin">@as</span>(f32, joint_count) * seg_len;
    <span class="tok-kw">var</span> joint_world: Mat = <span class="tok-fn">mulMat</span>(<span class="tok-fn">rotationY</span>(t * <span class="tok-num">0.55</span>), <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, -total * <span class="tok-num">0.5</span>, <span class="tok-num">0</span>));

    <span class="tok-kw">var</span> records: [joint_count]Instance = undefined;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; joint_count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        <span class="tok-comment">// Phase-shifted sway about Z plus a gentle bend about X down the chain.</span>
        <span class="tok-kw">const</span> ang_z: f32 = <span class="tok-fn">sinRad</span>(t * <span class="tok-num">1.6</span> + fi * <span class="tok-num">0.7</span>) * <span class="tok-num">0.42</span>;
        <span class="tok-kw">const</span> ang_x: f32 = <span class="tok-fn">sinRad</span>(t * <span class="tok-num">1.1</span> + fi * <span class="tok-num">0.5</span>) * <span class="tok-num">0.18</span>;
        <span class="tok-kw">const</span> local_rot: Mat = <span class="tok-fn">mulMat</span>(<span class="tok-fn">rotationZ</span>(ang_z), <span class="tok-fn">rotationX</span>(ang_x));

        <span class="tok-comment">// Rotation applied at this joint (rigid -&gt; good for normals too).</span>
        <span class="tok-kw">const</span> rot_world: Mat = <span class="tok-fn">mulMat</span>(joint_world, local_rot);

        <span class="tok-comment">// The bone box spans [0, seg_len] in local +Y, with `thickness` sides.</span>
        <span class="tok-kw">const</span> bone_local: Mat = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(<span class="tok-num">0</span>, seg_len * <span class="tok-num">0.5</span>, <span class="tok-num">0</span>), <span class="tok-fn">scaling</span>(thickness, seg_len, thickness));
        <span class="tok-kw">const</span> model: Mat = <span class="tok-fn">mulMat</span>(rot_world, bone_local);

        records[i] = .{
            .mvp = <span class="tok-fn">matToArray</span>(<span class="tok-fn">mulMat</span>(view_proj, model)),
            .nrm = <span class="tok-fn">matToArray</span>(rot_world),
            .color = <span class="tok-fn">hsv</span>(fi / <span class="tok-builtin">@as</span>(f32, joint_count), <span class="tok-num">0.55</span>, <span class="tok-num">0.95</span>),
        };

        <span class="tok-comment">// Advance to the next joint's base: up the length of this bone.</span>
        joint_world = <span class="tok-fn">mulMat</span>(rot_world, <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, seg_len, <span class="tok-num">0</span>));
    }

    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.instances, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;records));

    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    s.pipeline.<span class="tok-fn">bind</span>(ps);
    s.pipeline.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">0</span>, s.bind_group);
    s.pipeline.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(box_verts)));
    s.pipeline.<span class="tok-fn">drawArrays</span>(ps, box_verts.len, joint_count);

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"forward_kinematics: one instanced draw, per-joint world matrices"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">matToArray</span>(m: Mat) [<span class="tok-num">16</span>]f32 {
    <span class="tok-kw">var</span> out: [<span class="tok-num">16</span>]f32 = undefined;
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |r| {
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |c| {
            out[r * <span class="tok-num">4</span> + c] = m[r][c];
        }
    }
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.pipeline.handle);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(s.pipeline.layout);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(s.pipeline.module);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.instances);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.light);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.bind_group);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - forward kinematics"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.03</span>, .g = <span class="tok-num">0.04</span>, .b = <span class="tok-num">0.06</span>, .a = <span class="tok-num">1.0</span> },
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
