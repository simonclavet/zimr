<h1>undo_redo</h1>
<figure class="code src-file" data-path="examples/undo_redo/undo_redo.zig" data-lines="229"><figcaption><span>examples/undo_redo/undo_redo.zig</span><span>229 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/undo_redo.zig - snapshot-based undo / redo over an edited string.</span>
<span class="tok-comment">// Ports raylib's core `undo_redo`: every edit pushes a snapshot of the text, so</span>
<span class="tok-comment">// undo/redo is just moving a cursor through that history (and a fresh edit drops</span>
<span class="tok-comment">// whatever redo branch was ahead of it).</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Editing is driven by UI BUTTONS (word buttons, Backspace, Undo, Redo) so the</span>
<span class="tok-comment">// whole example is testable by tapping on a phone. A hardware keyboard still</span>
<span class="tok-comment">// works too: typed characters arrive via `z.getCharPressed`, and Backspace via</span>
<span class="tok-comment">// `isKeyPressed` - both feed the exact same edit path as the buttons.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What this exercises (the engine work this drove):</span>
<span class="tok-comment">//   - `z.getCharPressed(f.input)` - the typed-character queue (raylib's</span>
<span class="tok-comment">//     GetCharPressed), newly exported for text input.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Leak-clean (`.memory = .managed`): the UiHost is deinit'd; the atlas is</span>
<span class="tok-comment">// engine-owned.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-comment">// Atkinson Hyperlegible Mono - the Braille Institute's legibility font.</span>
<span class="tok-comment">// Distinct letterforms (slashed zero, unambiguous I/l/1), and a deliberate</span>
<span class="tok-comment">// break from raylib's look. Latin-only content, so its cmap is plenty:</span>
<span class="tok-comment">// ASCII + Latin-1 accented in full. (It has NO Cyrillic and almost no Greek,</span>
<span class="tok-comment">// which is why the Unicode examples stay on RobotoMono.)</span>
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;

<span class="tok-kw">const</span> max_len: usize = <span class="tok-num">96</span>;
<span class="tok-kw">const</span> max_hist: usize = <span class="tok-num">64</span>;

<span class="tok-comment">/// One point in the edit history: the whole string, not a diff. Snapshots are</span>
<span class="tok-comment">/// the simplest correct undo model - no inverse operations to get wrong.</span>
<span class="tok-kw">const</span> Snapshot = <span class="tok-kw">struct</span> {
    buf: [max_len]u8 = undefined,
    len: usize = <span class="tok-num">0</span>,

    <span class="tok-kw">fn</span> <span class="tok-fn">text</span>(self: *<span class="tok-kw">const</span> Snapshot) []<span class="tok-kw">const</span> u8 {
        <span class="tok-kw">return</span> self.buf[<span class="tok-num">0</span>..self.len];
    }
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    ui_font: z.Font,
    history: [max_hist]Snapshot = <span class="tok-builtin">@splat</span>(.{}),
    hist_count: usize = <span class="tok-num">1</span>, <span class="tok-comment">// index 0 is the initial empty snapshot</span>
    hist_pos: usize = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">28</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font), .font = font, .ui_font = ui_font };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.ui_font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">current</span>(s: *<span class="tok-kw">const</span> State) *<span class="tok-kw">const</span> Snapshot {
    <span class="tok-kw">return</span> &amp;s.history[s.hist_pos];
}

<span class="tok-comment">/// Commit `work` as a new state: drop any redo branch (everything after the</span>
<span class="tok-comment">/// cursor), then append - sliding the window down if the history is full.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pushState</span>(s: *State, work: Snapshot) void {
    <span class="tok-kw">if</span> (s.hist_pos + <span class="tok-num">1</span> &gt;= max_hist) {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..max_hist - <span class="tok-num">1</span>) |i| {
            s.history[i] = s.history[i + <span class="tok-num">1</span>];
        }
        s.history[max_hist - <span class="tok-num">1</span>] = work;
        s.hist_count = max_hist;
        s.hist_pos = max_hist - <span class="tok-num">1</span>;
        <span class="tok-kw">return</span>;
    }
    s.history[s.hist_pos + <span class="tok-num">1</span>] = work;
    s.hist_pos += <span class="tok-num">1</span>;
    s.hist_count = s.hist_pos + <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">appendText</span>(s: *State, add: []<span class="tok-kw">const</span> u8) void {
    <span class="tok-kw">var</span> work: Snapshot = s.history[s.hist_pos];
    <span class="tok-kw">for</span> (add) |ch| {
        <span class="tok-kw">if</span> (work.len &lt; max_len) {
            work.buf[work.len] = ch;
            work.len += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-fn">pushState</span>(s, work);
}

<span class="tok-kw">fn</span> <span class="tok-fn">backspace</span>(s: *State) void {
    <span class="tok-kw">var</span> work: Snapshot = s.history[s.hist_pos];
    <span class="tok-kw">if</span> (work.len == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    work.len -= <span class="tok-num">1</span>;
    <span class="tok-fn">pushState</span>(s, work);
}

<span class="tok-kw">fn</span> <span class="tok-fn">undo</span>(s: *State) void {
    <span class="tok-kw">if</span> (s.hist_pos &gt; <span class="tok-num">0</span>) {
        s.hist_pos -= <span class="tok-num">1</span>;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">redo</span>(s: *State) void {
    <span class="tok-kw">if</span> (s.hist_pos + <span class="tok-num">1</span> &lt; s.hist_count) {
