<figure class="code src-file" data-path="examples/digital_clock/digital_clock.zig" data-lines="219"><figcaption><span>examples/digital_clock/digital_clock.zig</span><span>219 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! digital_clock - a clock with two faces: a custom seven-segment digital readout and an</span>
<span class="tok-comment">//! analog dial with sweeping hands. Both are ported faithfully from the raylib original (the</span>
<span class="tok-comment">//! seven-segment glyphs are hand-built from hexagonal bar segments; the hands are rotated bars).</span>
<span class="tok-comment">//! There is no wall-clock-of-day in the raylib original's sense, but zimr exposes z.localTime()</span>
<span class="tok-comment">//! (real local time, DST-correct), so this shows the actual current time. Tap anywhere to switch</span>
<span class="tok-comment">//! faces (raylib uses SPACE). From raylib shapes_digital_clock.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> sinRad = zm.sinRad;
<span class="tok-kw">const</span> cosRad = zm.cosRad;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> rad_per_deg = zm.rad_per_deg;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// seven-segment patterns, bit A=0 .. G=6 (matches the raylib byte table)</span>
<span class="tok-kw">const</span> seg_patterns = [<span class="tok-num">10</span>]u8{ <span class="tok-num">0x3F</span>, <span class="tok-num">0x06</span>, <span class="tok-num">0x5B</span>, <span class="tok-num">0x4F</span>, <span class="tok-num">0x66</span>, <span class="tok-num">0x6D</span>, <span class="tok-num">0x7D</span>, <span class="tok-num">0x07</span>, <span class="tok-num">0x7F</span>, <span class="tok-num">0x6F</span> };
<span class="tok-comment">// per-segment centre (native units, relative to a digit's top-left) + orientation</span>
<span class="tok-kw">const</span> seg_cx = [<span class="tok-num">7</span>]f32{ <span class="tok-num">50</span>, <span class="tok-num">90</span>, <span class="tok-num">90</span>, <span class="tok-num">50</span>, <span class="tok-num">10</span>, <span class="tok-num">10</span>, <span class="tok-num">50</span> };
<span class="tok-kw">const</span> seg_cy = [<span class="tok-num">7</span>]f32{ <span class="tok-num">20</span>, <span class="tok-num">64</span>, <span class="tok-num">152</span>, <span class="tok-num">196</span>, <span class="tok-num">152</span>, <span class="tok-num">64</span>, <span class="tok-num">108</span> };
<span class="tok-kw">const</span> seg_vert = [<span class="tok-num">7</span>]bool{ false, true, true, false, true, true, false };
<span class="tok-comment">// native digit x-positions and colon-dot centres inside the HH:MM:SS block</span>
<span class="tok-kw">const</span> digit_x = [<span class="tok-num">6</span>]f32{ <span class="tok-num">0</span>, <span class="tok-num">120</span>, <span class="tok-num">260</span>, <span class="tok-num">380</span>, <span class="tok-num">520</span>, <span class="tok-num">640</span> };
<span class="tok-kw">const</span> colon_x = [<span class="tok-num">2</span>]f32{ <span class="tok-num">240</span>, <span class="tok-num">500</span> };
<span class="tok-kw">const</span> block_w = <span class="tok-num">740.0</span>;
<span class="tok-kw">const</span> block_h = <span class="tok-num">216.0</span>;

<span class="tok-kw">const</span> on_col: Color = .{ .r = <span class="tok-num">236</span>, .g = <span class="tok-num">72</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> off_col: Color = .{ .r = <span class="tok-num">54</span>, .g = <span class="tok-num">58</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> face_col: Color = .{ .r = <span class="tok-num">22</span>, .g = <span class="tok-num">26</span>, .b = <span class="tok-num">36</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> tick_col: Color = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">128</span>, .b = <span class="tok-num">146</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    digital: bool = true,
    press: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    dragged: bool = false,

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {

}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{ .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>) };
}

<span class="tok-comment">/// One hexagonal seven-segment bar (a 6-vertex strip), horizontal or vertical.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawSegment</span>(
    gl: *z.WgpuGl,
    center: Vec2,
    len: f32,
    thick: f32,
    vertical: bool,
    color: Color,
) void {
    <span class="tok-kw">const</span> hl: f32 = len * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> ht: f32 = thick * <span class="tok-num">0.5</span>;
    <span class="tok-kw">var</span> p: [<span class="tok-num">6</span>]Vec2 = undefined;
    <span class="tok-kw">if</span> (vertical) {
        p = .{
            .{ <span class="tok-num">0</span>, -hl - ht }, .{ -ht, -hl }, .{ ht, -hl },
            .{ -ht, hl },     .{ ht, hl },   .{ <span class="tok-num">0</span>, hl + ht },
        };
    } <span class="tok-kw">else</span> {
        p = .{
            .{ -hl - ht, <span class="tok-num">0</span> }, .{ -hl, ht }, .{ -hl, -ht },
            .{ hl, ht },      .{ hl, -ht }, .{ hl + ht, <span class="tok-num">0</span> },
        };
    }
    <span class="tok-kw">for</span> (&amp;p) |*pt| {
        pt.* = .{ center[<span class="tok-num">0</span>] + pt[<span class="tok-num">0</span>], center[<span class="tok-num">1</span>] + pt[<span class="tok-num">1</span>] };
    }
    gl.<span class="tok-fn">triangle</span>(p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>], p[<span class="tok-num">2</span>], .{ .color = color });
    gl.<span class="tok-fn">triangle</span>(p[<span class="tok-num">1</span>], p[<span class="tok-num">2</span>], p[<span class="tok-num">3</span>], .{ .color = color });
    gl.<span class="tok-fn">triangle</span>(p[<span class="tok-num">2</span>], p[<span class="tok-num">3</span>], p[<span class="tok-num">4</span>], .{ .color = color });
    gl.<span class="tok-fn">triangle</span>(p[<span class="tok-num">3</span>], p[<span class="tok-num">4</span>], p[<span class="tok-num">5</span>], .{ .color = color });
}

<span class="tok-comment">/// One digit at `pos` (top-left), scaled by `k`. Lit segments use `on`, dark ones `off`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawDigit</span>(
    gl: *z.WgpuGl,
    pos: Vec2,
    value: usize,
    k: f32,
    on: Color,
    off: Color,
) void {
    <span class="tok-kw">const</span> bits: u8 = seg_patterns[value];
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">7</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> center: Vec2 = .{ pos[<span class="tok-num">0</span>] + seg_cx[i] * k, pos[<span class="tok-num">1</span>] + seg_cy[i] * k };
        <span class="tok-kw">const</span> lit: bool = ((bits &gt;&gt; <span class="tok-builtin">@intCast</span>(i)) &amp; <span class="tok-num">1</span>) != <span class="tok-num">0</span>;
        <span class="tok-fn">drawSegment</span>(gl, center, <span class="tok-num">60.0</span> * k, <span class="tok-num">20.0</span> * k, seg_vert[i], <span class="tok-kw">if</span> (lit) on <span class="tok-kw">else</span> off);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawDigital</span>(f: *z.Frame, hms: [<span class="tok-num">3</span>]i64) void {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> k: f32 = <span class="tok-fn">clamp</span>(<span class="tok-builtin">@min</span>(w * <span class="tok-num">0.92</span> / block_w, h * <span class="tok-num">0.62</span> / block_h), <span class="tok-num">0.1</span>, <span class="tok-num">1.2</span>);
    <span class="tok-kw">const</span> x0: f32 = (w - block_w * k) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> y0: f32 = (h - block_h * k) * <span class="tok-num">0.5</span>;

    <span class="tok-kw">const</span> digits = [<span class="tok-num">6</span>]usize{
        <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@divFloor</span>(hms[<span class="tok-num">0</span>], <span class="tok-num">10</span>)), <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@mod</span>(hms[<span class="tok-num">0</span>], <span class="tok-num">10</span>)),
        <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@divFloor</span>(hms[<span class="tok-num">1</span>], <span class="tok-num">10</span>)), <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@mod</span>(hms[<span class="tok-num">1</span>], <span class="tok-num">10</span>)),
        <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@divFloor</span>(hms[<span class="tok-num">2</span>], <span class="tok-num">10</span>)), <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@mod</span>(hms[<span class="tok-num">2</span>], <span class="tok-num">10</span>)),
    };
    <span class="tok-kw">for</span> (digits, <span class="tok-num">0</span>..) |d, i| {
        <span class="tok-fn">drawDigit</span>(f.gl, .{ x0 + digit_x[i] * k, y0 }, d, k, on_col, off_col);
    }
    <span class="tok-comment">// colon dots blink with the seconds parity</span>
    <span class="tok-kw">const</span> blink: Color = <span class="tok-kw">if</span> (<span class="tok-builtin">@mod</span>(hms[<span class="tok-num">2</span>], <span class="tok-num">2</span>) == <span class="tok-num">0</span>) on_col <span class="tok-kw">else</span> off_col;
    <span class="tok-kw">for</span> (colon_x) |cx| {
        f.gl.<span class="tok-fn">circle</span>(.{ x0 + cx * k, y0 + <span class="tok-num">70.0</span> * k }, <span class="tok-num">12.0</span> * k, .{ .color = blink, .segments = <span class="tok-num">16</span> });
        f.gl.<span class="tok-fn">circle</span>(.{ x0 + cx * k, y0 + <span class="tok-num">150.0</span> * k }, <span class="tok-num">12.0</span> * k, .{ .color = blink, .segments = <span class="tok-num">16</span> });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">handTip</span>(center: Vec2, deg: f32, len: f32) Vec2 {
    <span class="tok-kw">const</span> r: f32 = deg * rad_per_deg;
    <span class="tok-kw">return</span> .{ center[<span class="tok-num">0</span>] + <span class="tok-fn">cosRad</span>(r) * len, center[<span class="tok-num">1</span>] + <span class="tok-fn">sinRad</span>(r) * len };
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawAnalog</span>(f: *z.Frame, hms: [<span class="tok-num">3</span>]i64) void {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> center: Vec2 = .{ w * <span class="tok-num">0.5</span>, h * <span class="tok-num">0.5</span> };
    <span class="tok-kw">const</span> radius: f32 = <span class="tok-builtin">@min</span>(w, h) * <span class="tok-num">0.42</span>;
    <span class="tok-kw">const</span> ks: f32 = radius / <span class="tok-num">160.0</span>;

    f.gl.<span class="tok-fn">circle</span>(center, radius, .{ .color = face_col, .segments = <span class="tok-num">16</span> });

    <span class="tok-comment">// 60 minute/second ticks (every 5th is longer + thicker)</span>
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">60</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> r: f32 = (<span class="tok-num">6.0</span> * <span class="tok-fn">float</span>(i) - <span class="tok-num">90.0</span>) * rad_per_deg;
        <span class="tok-kw">const</span> dir: Vec2 = .{ <span class="tok-fn">cosRad</span>(r), <span class="tok-fn">sinRad</span>(r) };
        <span class="tok-kw">const</span> major: bool = (i % <span class="tok-num">5</span>) == <span class="tok-num">0</span>;
        <span class="tok-kw">const</span> factor: f32 = <span class="tok-kw">if</span> (major) <span class="tok-num">0.84</span> <span class="tok-kw">else</span> <span class="tok-num">0.90</span>;
        <span class="tok-kw">const</span> inner: f32 = radius * factor;
        <span class="tok-kw">const</span> outer: f32 = radius * <span class="tok-num">0.97</span>;
        <span class="tok-kw">const</span> a: Vec2 = .{ center[<span class="tok-num">0</span>] + dir[<span class="tok-num">0</span>] * inner, center[<span class="tok-num">1</span>] + dir[<span class="tok-num">1</span>] * inner };
        <span class="tok-kw">const</span> b: Vec2 = .{ center[<span class="tok-num">0</span>] + dir[<span class="tok-num">0</span>] * outer, center[<span class="tok-num">1</span>] + dir[<span class="tok-num">1</span>] * outer };
        f.gl.<span class="tok-fn">line</span>(a, b, .{ .color = tick_col, .thickness = <span class="tok-kw">if</span> (major) <span class="tok-num">3.0</span> * ks <span class="tok-kw">else</span> <span class="tok-num">1.0</span> * ks });
    }

    <span class="tok-kw">const</span> hf: f32 = <span class="tok-fn">float</span>(hms[<span class="tok-num">0</span>]);
    <span class="tok-kw">const</span> mf: f32 = <span class="tok-fn">float</span>(hms[<span class="tok-num">1</span>]);
    <span class="tok-kw">const</span> sf: f32 = <span class="tok-fn">float</span>(hms[<span class="tok-num">2</span>]);
    <span class="tok-kw">const</span> hour_deg: f32 = <span class="tok-builtin">@mod</span>(hf, <span class="tok-num">12.0</span>) * <span class="tok-num">30.0</span> + mf * <span class="tok-num">0.5</span> - <span class="tok-num">90.0</span>;
    <span class="tok-kw">const</span> min_deg: f32 = mf * <span class="tok-num">6.0</span> + sf * <span class="tok-num">0.1</span> - <span class="tok-num">90.0</span>;
    <span class="tok-kw">const</span> sec_deg: f32 = sf * <span class="tok-num">6.0</span> - <span class="tok-num">90.0</span>;

    f.gl.<span class="tok-fn">line</span>(center, <span class="tok-fn">handTip</span>(center, hour_deg, radius * <span class="tok-num">0.5</span>), .{ .color = common.palette.ink, .thickness = <span class="tok-num">7.0</span> * ks });
    f.gl.<span class="tok-fn">line</span>(center, <span class="tok-fn">handTip</span>(center, min_deg, radius * <span class="tok-num">0.72</span>), .{
        .color = common.palette.accent,
        .thickness = <span class="tok-num">5.0</span> * ks,
    });
    f.gl.<span class="tok-fn">line</span>(center, <span class="tok-fn">handTip</span>(center, sec_deg, radius * <span class="tok-num">0.82</span>), .{ .color = on_col, .thickness = <span class="tok-num">2.0</span> * ks });
    f.gl.<span class="tok-fn">circle</span>(center, radius * <span class="tok-num">0.05</span>, .{ .color = tick_col, .segments = <span class="tok-num">16</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-comment">// real local wall-clock time (DST-correct), via z.localTime()</span>
    <span class="tok-kw">const</span> dt: z.DateTime = z.<span class="tok-fn">localTime</span>();
    <span class="tok-kw">const</span> hms = [<span class="tok-num">3</span>]i64{ dt.hour, dt.minute, dt.second };

    <span class="tok-comment">// tap toggles the face</span>
    <span class="tok-kw">const</span> down: bool = z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left);
    <span class="tok-kw">const</span> mouse: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        s.press = mouse;
        s.dragged = false;
    }
    <span class="tok-kw">if</span> (down <span class="tok-kw">and</span> zm.<span class="tok-fn">distance</span>(mouse, s.press) &gt; <span class="tok-num">8.0</span>) {
        s.dragged = true;
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonReleased</span>(f.input, .left) <span class="tok-kw">and</span> !s.dragged) {
        s.digital = !s.digital;
    }

    <span class="tok-kw">if</span> (s.digital) {
        <span class="tok-fn">drawDigital</span>(f, hms);
    } <span class="tok-kw">else</span> {
        <span class="tok-fn">drawAnalog</span>(f, hms);
    }

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-kw">if</span> (s.digital)
        <span class="tok-str">"digital clock - tap to switch to the analog face"</span>
    <span class="tok-kw">else</span>
        <span class="tok-str">"analog clock - tap to switch to the digital face"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{

            .width = <span class="tok-num">800</span>,

            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
