    <span class="tok-kw">fn</span> <span class="tok-fn">camDistance</span>(self: Scene) f32 {

<span class="tok-comment">/// Context for the conveyor scene's contact listener: which body is the belt and the</span>
<span class="tok-comment">/// surface speed it drives. The belt is the lower body index, so in a belt-vs-marble</span>
<span class="tok-comment">/// pair the belt is `a` and we negate the desired carry direction.</span>
<span class="tok-kw">const</span> ConveyorCtx = <span class="tok-kw">struct</span> {
    belt: zp.BodyIndex = <span class="tok-num">0</span>,
    speed: f32 = <span class="tok-num">5.0</span>,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    gpa: Allocator,
    world: zp.World,
    scratch: std.heap.ArenaAllocator,
    ui_host: z.UiHost,
    profiling: bool = false, <span class="tok-comment">// "Profile" button: freeze the profiler + pause stepping</span>
    watching: bool = false, <span class="tok-comment">// "Watch" button: auto-freeze the profiler on a frame-time spike</span>
    launch_shape: zp.ShapeId = <span class="tok-num">0</span>,
    slider_plat: zp.BodyHandle = .nil, <span class="tok-comment">// .slider scene: platform body (read x to reverse motor)</span>
    slider_idx: usize = <span class="tok-num">0</span>, <span class="tok-comment">// .slider scene: index of the slider constraint in world.constraints</span>
    pulley_idx: usize = <span class="tok-num">0</span>, <span class="tok-comment">// .pulley scene: index of the pulley constraint (rope overlay)</span>
    path_idx: usize = <span class="tok-num">0</span>, <span class="tok-comment">// .path scene: index of the path constraint (rail overlay), +1 (0 = none)</span>
    plinko_phys_steps: usize = <span class="tok-num">0</span>, <span class="tok-comment">// .plinko: physics-step counter driving the ball spawner</span>
    plinko_spawned: usize = <span class="tok-num">0</span>, <span class="tok-comment">// .plinko: balls released so far (caps the stream)</span>
    plinko_seed: u32 = <span class="tok-num">777</span>, <span class="tok-comment">// .plinko: LCG state for drop-point jitter</span>
    galton_ball: zp.ShapeId = <span class="tok-num">0</span>, <span class="tok-comment">// .stress: galton drop-ball shape (released one at a time)</span>
    galton_origin: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-comment">// .stress: galton board world origin</span>
    galton_y_top: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// .stress: galton peg-field top (spawn just above it)</span>
    conveyor_ctx: ConveyorCtx = .{}, <span class="tok-comment">// .conveyor: belt body + surface speed for the contact listener</span>
    conveyor_steps: usize = <span class="tok-num">0</span>, <span class="tok-comment">// .conveyor: physics-step counter driving the marble spawner</span>
    conveyor_spawned: usize = <span class="tok-num">0</span>, <span class="tok-comment">// .conveyor: marbles released so far (caps the stream)</span>
    clockwork_motor: usize = <span class="tok-num">0</span>, <span class="tok-comment">// .clockwork: index of the driven gear's hinge (reverse it to reciprocate)</span>
    clockwork_rack: zp.BodyHandle = .nil, <span class="tok-comment">// .clockwork: the rack body (read x to reverse the drive)</span>
    clockwork_home: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// .clockwork: the rack's home x (reverse when it strays past +-1.3)</span>
    scene: Scene = .shapes,
    cam_angle_yaw: f32 = <span class="tok-num">35.0</span>,
    cam_angle_pitch: f32 = <span class="tok-num">18.0</span>,
    cam_distance: f32 = <span class="tok-num">16.0</span>,
    cam_pan: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-comment">// target offset from two-finger / drag pan</span>
    prev_pinch: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// last two-finger spacing (px); 0 = not pinching</span>
    prev_pan_mid: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, <span class="tok-comment">// last two-finger midpoint (px)</span>
    two_finger: bool = false,
    frame_count: usize = <span class="tok-num">0</span>,
    phys_accum: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// fixed-timestep accumulator (real seconds owed to the solver)</span>
    spawned: bool = false,
    dragging: bool = false,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    s.world.<span class="tok-fn">deinit</span>(gpa);
    s.scratch.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> world: zp.World = <span class="tok-kw">try</span> zp.World.<span class="tok-fn">init</span>(gpa, <span class="tok-num">1024</span>);
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);
    s.* = .{
        .font = font,
        .gpa = gpa,
        .world = world,
        .scratch = std.heap.ArenaAllocator.<span class="tok-fn">init</span>(gpa),
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
    };
}

<span class="tok-comment">/// Static flat floor (a box; static box-vs-convex contact is solid).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">addFlatFloor</span>(world: *zp.World, gpa: Allocator, half: f32) !void {
    <span class="tok-kw">const</span> floor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(half, <span class="tok-num">0.5</span>, half),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = floor_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.5</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .material = <span class="tok-num">0</span>,
    });
}

<span class="tok-comment">/// Wave B - shape gallery. One of (almost) every convex / decorator shape the</span>
<span class="tok-comment">/// engine has, dropped in a row so each settles on the floor: SphereShape,</span>
<span class="tok-comment">/// BoxShape, CapsuleShape, CylinderShape, TaperedCapsuleShape, ConvexHullShape,</span>
<span class="tok-comment">/// StaticCompoundShape, OffsetCenterOfMassShape, RotatedTranslatedShape.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneShapes</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">9</span>);
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });
    <span class="tok-kw">const</span> qid: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">0.0</span>);
    <span class="tok-kw">const</span> y: f32 = <span class="tok-num">3.0</span>;

    <span class="tok-kw">const</span> s_sphere: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.5</span> } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = s_sphere, .position = <span class="tok-fn">vec</span>(-<span class="tok-num">7.0</span>, y, <span class="tok-num">0</span>), .material = <span class="tok-num">1</span> });

    <span class="tok-kw">const</span> s_box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>), .convex_radius = <span class="tok-num">0.05</span> },
    });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = s_box, .position = <span class="tok-fn">vec</span>(-<span class="tok-num">5.25</span>, y, <span class="tok-num">0</span>), .material = <span class="tok-num">2</span> });

    <span class="tok-kw">const</span> s_cap: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .capsule = .{ .half_height = <span class="tok-num">0.4</span>, .radius = <span class="tok-num">0.35</span> } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = s_cap, .position = <span class="tok-fn">vec</span>(-<span class="tok-num">3.5</span>, y, <span class="tok-num">0</span>), .material = <span class="tok-num">3</span> });

    <span class="tok-kw">const</span> s_cyl: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .cylinder = .{ .half_height = <span class="tok-num">0.5</span>, .radius = <span class="tok-num">0.4</span>, .convex_radius = <span class="tok-num">0.05</span> },
    });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = s_cyl, .position = <span class="tok-fn">vec</span>(-<span class="tok-num">1.75</span>, y, <span class="tok-num">0</span>), .material = <span class="tok-num">4</span> });

    <span class="tok-kw">const</span> s_tcap: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .tapered_capsule = .{ .half_height = <span class="tok-num">0.4</span>, .top_radius = <span class="tok-num">0.2</span>, .bottom_radius = <span class="tok-num">0.45</span> },
    });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = s_tcap, .position = <span class="tok-fn">vec</span>(<span class="tok-num">0.0</span>, y, <span class="tok-num">0</span>), .material = <span class="tok-num">5</span> });

    <span class="tok-comment">// Convex hull: an octahedron from 6 axis points.</span>
    <span class="tok-kw">const</span> hull_pts = [_]Vec{
        <span class="tok-fn">vec</span>(<span class="tok-num">0.6</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(-<span class="tok-num">0.6</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.6</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.6</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0.6</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">0.6</span>),
    };
    <span class="tok-kw">const</span> s_hull: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addConvexHull</span>(gpa, &amp;hull_pts);
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = s_hull, .position = <span class="tok-fn">vec</span>(<span class="tok-num">1.75</span>, y, <span class="tok-num">0</span>), .material = <span class="tok-num">1</span> });

    <span class="tok-comment">// Static compound: a dumbbell (cylinder bar + two end spheres) as one body.</span>
    <span class="tok-kw">const</span> bar: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .cylinder = .{ .half_height = <span class="tok-num">0.55</span>, .radius = <span class="tok-num">0.14</span>, .convex_radius = <span class="tok-num">0.02</span> },
    });
    <span class="tok-kw">const</span> knob: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.32</span> } });
    <span class="tok-kw">const</span> dumbbell: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addCompound</span>(gpa, &amp;.{
        .{ .shape = bar, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = qid },
        .{ .shape = knob, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.62</span>, <span class="tok-num">0</span>), .local_rot = qid },
        .{ .shape = knob, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.62</span>, <span class="tok-num">0</span>), .local_rot = qid },
    });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = dumbbell, .position = <span class="tok-fn">vec</span>(<span class="tok-num">3.5</span>, y, <span class="tok-num">0</span>), .material = <span class="tok-num">2</span> });

    <span class="tok-comment">// Offset centre of mass: a box whose COM is shifted low, so it self-rights.</span>
    <span class="tok-kw">const</span> base_box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>), .convex_radius = <span class="tok-num">0.05</span> },
    });
    <span class="tok-kw">const</span> s_offcom: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addOffsetCom</span>(gpa, base_box, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.4</span>, <span class="tok-num">0</span>));
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = s_offcom,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">5.25</span>, y, <span class="tok-num">0</span>),
        .rotation = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), <span class="tok-num">0.9</span>),
        .material = <span class="tok-num">3</span>,
    });

    <span class="tok-comment">// Rotated/translated: a box pre-posed 45 deg about Z; lands on an edge.</span>
    <span class="tok-kw">const</span> rt_rot: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), pi * <span class="tok-num">0.25</span>);
    <span class="tok-kw">const</span> s_rt: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addRotatedTranslated</span>(gpa, base_box, rt_rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>));
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = s_rt, .position = <span class="tok-fn">vec</span>(<span class="tok-num">7.0</span>, y, <span class="tok-num">0</span>), .material = <span class="tok-num">4</span> });
}

<span class="tok-comment">/// Wave B - static special geometry: a heightfield terrain, a triangle mesh</span>
<span class="tok-comment">/// ramp, an infinite plane wall, and a single triangle, with a few balls and</span>
<span class="tok-comment">/// boxes dropped on them to show they collide. Covers HeightFieldShape,</span>
<span class="tok-comment">/// MeshShape, PlaneShape, TriangleShape.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneTerrain</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });

    <span class="tok-comment">// Heightfield terrain: a 13x13 grid with a smooth central bump.</span>
    <span class="tok-kw">const</span> sn: u32 = <span class="tok-num">13</span>;
    <span class="tok-kw">const</span> cell: f32 = <span class="tok-num">1.2</span>;
    <span class="tok-kw">var</span> heights: [sn * sn]f32 = undefined;
    <span class="tok-kw">var</span> gz: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (gz &lt; sn) : (gz += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> gx: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (gx &lt; sn) : (gx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> fx: f32 = <span class="tok-fn">float</span>(gx) - <span class="tok-fn">float</span>(sn - <span class="tok-num">1</span>) * <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> fz: f32 = <span class="tok-fn">float</span>(gz) - <span class="tok-fn">float</span>(sn - <span class="tok-num">1</span>) * <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> r: f32 = <span class="tok-builtin">@sqrt</span>(fx * fx + fz * fz);
            heights[gz * sn + gx] = <span class="tok-num">1.6</span> * <span class="tok-builtin">@exp</span>(-r * r * <span class="tok-num">0.06</span>);
        }
    }
    <span class="tok-kw">const</span> hf: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addHeightField</span>(gpa, &amp;heights, sn, sn, cell);
    <span class="tok-kw">const</span> span: f32 = <span class="tok-fn">float</span>(sn - <span class="tok-num">1</span>) * cell;
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = hf,
        .position = <span class="tok-fn">vec</span>(-span * <span class="tok-num">0.5</span>, <span class="tok-num">0</span>, -span * <span class="tok-num">0.5</span>),
        .motion_type = .static,
        .material = <span class="tok-num">0</span>,
    });

    <span class="tok-comment">// A static triangle-mesh ramp off to the side.</span>
    <span class="tok-kw">const</span> ramp_v = [_]Vec{
        <span class="tok-fn">vec</span>(<span class="tok-num">5</span>, <span class="tok-num">0</span>, -<span class="tok-num">3</span>), <span class="tok-fn">vec</span>(<span class="tok-num">11</span>, <span class="tok-num">0</span>, -<span class="tok-num">3</span>), <span class="tok-fn">vec</span>(<span class="tok-num">11</span>, <span class="tok-num">3</span>, <span class="tok-num">3</span>),
        <span class="tok-fn">vec</span>(<span class="tok-num">5</span>, <span class="tok-num">0</span>, -<span class="tok-num">3</span>), <span class="tok-fn">vec</span>(<span class="tok-num">11</span>, <span class="tok-num">3</span>, <span class="tok-num">3</span>),  <span class="tok-fn">vec</span>(<span class="tok-num">5</span>, <span class="tok-num">3</span>, <span class="tok-num">3</span>),
    };
    <span class="tok-kw">const</span> ramp_t = [_][<span class="tok-num">3</span>]u32{ .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span> }, .{ <span class="tok-num">3</span>, <span class="tok-num">4</span>, <span class="tok-num">5</span> } };
    <span class="tok-kw">const</span> ramp: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addMesh</span>(gpa, &amp;ramp_v, &amp;ramp_t);
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = ramp, .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .motion_type = .static, .material = <span class="tok-num">0</span> });

    <span class="tok-comment">// An infinite plane as a back wall (normal +Z, offset back).</span>
    <span class="tok-kw">const</span> wall: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addPlane</span>(gpa, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), <span class="tok-num">9.0</span>, <span class="tok-num">12.0</span>);
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = wall, .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .motion_type = .static, .material = <span class="tok-num">0</span> });

    <span class="tok-comment">// A single large static triangle as a little shelf.</span>
    <span class="tok-kw">const</span> tri: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .triangle = .{
        .v0 = <span class="tok-fn">vec</span>(-<span class="tok-num">10</span>, <span class="tok-num">2.5</span>, <span class="tok-num">2</span>),
        .v1 = <span class="tok-fn">vec</span>(-<span class="tok-num">6</span>, <span class="tok-num">2.5</span>, <span class="tok-num">2</span>),
        .v2 = <span class="tok-fn">vec</span>(-<span class="tok-num">8</span>, <span class="tok-num">2.5</span>, -<span class="tok-num">2</span>),
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = tri, .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .motion_type = .static, .material = <span class="tok-num">0</span> });

    <span class="tok-comment">// Drop balls and boxes to show the terrain/mesh/triangle are solid.</span>
    <span class="tok-kw">const</span> ball: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.45</span> } });
    <span class="tok-kw">const</span> box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>), .convex_radius = <span class="tok-num">0.05</span> },
    });
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">6</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = <span class="tok-kw">if</span> (i % <span class="tok-num">2</span> == <span class="tok-num">0</span>) ball <span class="tok-kw">else</span> box,
            .position = <span class="tok-fn">vec</span>(-<span class="tok-num">3.0</span> + fi * <span class="tok-num">1.1</span>, <span class="tok-num">6.0</span> + fi * <span class="tok-num">0.4</span>, -<span class="tok-num">1.0</span> + fi * <span class="tok-num">0.3</span>),
            .material = <span class="tok-builtin">@intCast</span>(<span class="tok-num">1</span> + i % <span class="tok-num">5</span>),
        });
    }
    <span class="tok-comment">// One ball aimed at the ramp.</span>
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = ball, .position = <span class="tok-fn">vec</span>(<span class="tok-num">8.0</span>, <span class="tok-num">6.0</span>, <span class="tok-num">2.0</span>), .material = <span class="tok-num">2</span> });
}

<span class="tok-comment">/// A staggered rain of every supported convex shape (sphere/capsule/cylinder/box).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneShowcase</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">12</span>);
    <span class="tok-kw">const</span> sphere: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.5</span> } });
    <span class="tok-kw">const</span> capsule: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .capsule = .{ .half_height = <span class="tok-num">0.5</span>, .radius = <span class="tok-num">0.35</span> } });
    <span class="tok-kw">const</span> cylinder: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .cylinder = .{
        .half_height = <span class="tok-num">0.5</span>,
        .radius = <span class="tok-num">0.45</span>,
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    <span class="tok-kw">const</span> box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    state.launch_shape = sphere;
    <span class="tok-kw">const</span> shapes = [_]zp.ShapeId{ sphere, capsule, cylinder, box };
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">24</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> col: f32 = <span class="tok-fn">float</span>(i % <span class="tok-num">6</span>);
        <span class="tok-kw">const</span> row: f32 = <span class="tok-fn">float</span>(i / <span class="tok-num">6</span>);
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = shapes[i % <span class="tok-num">4</span>],
            .position = <span class="tok-fn">vec</span>((col - <span class="tok-num">2.5</span>) * <span class="tok-num">1.6</span>, <span class="tok-num">4.0</span> + row * <span class="tok-num">1.4</span>, (row - <span class="tok-num">1.5</span>) * <span class="tok-num">1.6</span>),
            .motion_type = .dynamic,
            .restitution = <span class="tok-num">0.3</span>,
            .friction = <span class="tok-num">0.6</span>,
            .material = <span class="tok-builtin">@intCast</span>(i % <span class="tok-num">6</span>),
        });
    }
}

<span class="tok-comment">/// A square-base box pyramid (Jolt PyramidTest), 4 wide =&gt; 30 boxes.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">scenePyramid</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">12</span>);
    <span class="tok-kw">const</span> box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });
    <span class="tok-kw">const</span> base: u32 = <span class="tok-num">4</span>;
    <span class="tok-kw">var</span> mat: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> layer: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (layer &lt; base) : (layer += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> n: u32 = base - layer;
        <span class="tok-kw">const</span> y: f32 = <span class="tok-num">0.55</span> + <span class="tok-fn">float</span>(layer) * <span class="tok-num">1.01</span>;
        <span class="tok-kw">const</span> off: f32 = <span class="tok-fn">float</span>(n - <span class="tok-num">1</span>) * <span class="tok-num">0.5</span>;
        <span class="tok-kw">var</span> j: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (j &lt; n) : (j += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> k: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (k &lt; n) : (k += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> px: f32 = (<span class="tok-fn">float</span>(j) - off) * <span class="tok-num">1.02</span>;
                <span class="tok-kw">const</span> pz: f32 = (<span class="tok-fn">float</span>(k) - off) * <span class="tok-num">1.02</span>;
                _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
                    .shape = box,
                    .position = <span class="tok-fn">vec</span>(px, y, pz),
                    .motion_type = .dynamic,
                    .friction = <span class="tok-num">0.8</span>,
                    .material = <span class="tok-builtin">@intCast</span>(mat % <span class="tok-num">6</span>),
                });
                mat += <span class="tok-num">1</span>;
            }
        }
    }
}

<span class="tok-comment">/// Eight elongated boxes stacked with alternating 90 deg yaw (Jolt StackTest) - a</span>
<span class="tok-comment">/// stability stress now that box-vs-box rests cleanly.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneStack</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">10</span>);
    <span class="tok-kw">const</span> box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.45</span>, <span class="tok-num">0.45</span>, <span class="tok-num">0.95</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">8</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> angle: f32 = <span class="tok-kw">if</span> (i % <span class="tok-num">2</span> == <span class="tok-num">0</span>) <span class="tok-num">0.0</span> <span class="tok-kw">else</span> pi * <span class="tok-num">0.5</span>;
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = box,
            .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.55</span> + <span class="tok-fn">float</span>(i) * <span class="tok-num">0.92</span>, <span class="tok-num">0</span>),
            .rotation = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), angle),
            .motion_type = .dynamic,
            .friction = <span class="tok-num">0.8</span>,
            .material = <span class="tok-builtin">@intCast</span>(i % <span class="tok-num">6</span>),
        });
    }
}

<span class="tok-comment">/// Ten elongated rods dropped from different angles with different spins. This is the</span>
<span class="tok-comment">/// torque-free-rotation stress case: a thin (anisotropic) body tumbling while spinning</span>
<span class="tok-comment">/// exercises world-frame angular integration and the rocking-contact solve. They should</span>
<span class="tok-comment">/// tumble, clatter, and settle flat without launching or wobbling indefinitely.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneRods</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">12</span>);
    <span class="tok-kw">const</span> rod: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.15</span>, <span class="tok-num">0.15</span>, <span class="tok-num">0.8</span>),
        .convex_radius = <span class="tok-num">0.03</span>,
    } });
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">10</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> px: f32 = (fi - <span class="tok-num">4.5</span>) * <span class="tok-num">1.6</span>;
        <span class="tok-kw">const</span> py: f32 = <span class="tok-num">3.0</span> + fi * <span class="tok-num">0.15</span>;
        <span class="tok-kw">const</span> tilt_x: f32 = <span class="tok-num">0.3</span> + fi * <span class="tok-num">0.12</span>;
        <span class="tok-kw">const</span> tilt_z: f32 = <span class="tok-num">0.7</span> - fi * <span class="tok-num">0.09</span>;
        <span class="tok-kw">const</span> rot: zm.Quat = <span class="tok-fn">qmul</span>(<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), tilt_z), <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), tilt_x));
        <span class="tok-kw">const</span> bi: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = rod,
            .position = <span class="tok-fn">vec</span>(px, py, <span class="tok-num">0</span>),
            .rotation = rot,
            .motion_type = .dynamic,
            .friction = <span class="tok-num">0.6</span>,
            .restitution = <span class="tok-num">0.3</span>,
            .material = <span class="tok-builtin">@intCast</span>(i % <span class="tok-num">6</span>),
        });
        <span class="tok-kw">try</span> world.<span class="tok-fn">setAngularVelocity</span>(gpa, bi, <span class="tok-fn">vec</span>(<span class="tok-num">0.2</span> * fi - <span class="tok-num">0.5</span>, <span class="tok-num">1.0</span> + <span class="tok-num">0.2</span> * fi, <span class="tok-num">0.3</span> - <span class="tok-num">0.1</span> * fi));
    }
}

<span class="tok-comment">/// A row of spheres with restitution stepping 0 -&gt; 1 (Jolt RestitutionTest):</span>
<span class="tok-comment">/// dropped from one height they rebound to visibly increasing heights.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneRestitution</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">14</span>);
    <span class="tok-kw">const</span> sphere: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.5</span> } });
    state.launch_shape = sphere;
    <span class="tok-kw">const</span> n: u32 = <span class="tok-num">7</span>;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(n - <span class="tok-num">1</span>);
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = sphere,
            .position = <span class="tok-fn">vec</span>((<span class="tok-fn">float</span>(i) - <span class="tok-num">3.0</span>) * <span class="tok-num">1.9</span>, <span class="tok-num">6.0</span>, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .restitution = t,
            .friction = <span class="tok-num">0.4</span>,
            .linear_damping = <span class="tok-num">0.0</span>,
            .material = <span class="tok-builtin">@intCast</span>(i % <span class="tok-num">6</span>),
        });
    }
}

<span class="tok-comment">/// A tilted static ramp with a row of boxes whose friction steps 0 -&gt; 1 (Jolt</span>
<span class="tok-comment">/// FrictionTest): the slippery ones slide off, the grippy ones hold.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneFrictionRamp</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">const</span> angle: f32 = <span class="tok-num">0.40</span>; <span class="tok-comment">// ~23 deg</span>
    <span class="tok-kw">const</span> ramp: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">9</span>, <span class="tok-num">0.5</span>, <span class="tok-num">6</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = ramp,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .rotation = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), angle),
        .motion_type = .static,
        .friction = <span class="tok-num">1.0</span>,
        .material = <span class="tok-num">0</span>,
    });
    <span class="tok-kw">const</span> box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });
    <span class="tok-kw">const</span> n: u32 = <span class="tok-num">6</span>;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(n - <span class="tok-num">1</span>);
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = box,
            .position = <span class="tok-fn">vec</span>(<span class="tok-num">3.0</span>, <span class="tok-num">2.6</span>, (<span class="tok-fn">float</span>(i) - <span class="tok-num">2.5</span>) * <span class="tok-num">1.1</span>),
            .motion_type = .dynamic,
            .friction = t,
            .material = <span class="tok-builtin">@intCast</span>(i % <span class="tok-num">6</span>),
        });
    }
}

<span class="tok-comment">/// Four inward-leaning static walls form a bowl; a mix of shapes pours in and</span>
<span class="tok-comment">/// piles toward the centre (a lightweight take on Jolt FunnelTest).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneFunnel</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">6</span>);
    <span class="tok-kw">const</span> wall: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">5</span>, <span class="tok-num">0.3</span>, <span class="tok-num">5</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    <span class="tok-kw">const</span> tilt: f32 = <span class="tok-num">0.6</span>; <span class="tok-comment">// top leans inward</span>
    <span class="tok-kw">var</span> w: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (w &lt; <span class="tok-num">4</span>) : (w += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> yaw: f32 = pi * <span class="tok-num">0.5</span> * <span class="tok-fn">float</span>(w);
        <span class="tok-kw">const</span> rot: zm.Quat = <span class="tok-fn">qmul</span>(<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), tilt), <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), yaw));
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = wall,
            .position = <span class="tok-fn">vec</span>(<span class="tok-builtin">@sin</span>(yaw) * <span class="tok-num">4.5</span>, <span class="tok-num">3.0</span>, <span class="tok-builtin">@cos</span>(yaw) * <span class="tok-num">4.5</span>),
            .rotation = rot,
            .motion_type = .static,
            .material = <span class="tok-num">0</span>,
        });
    }
    <span class="tok-kw">const</span> sphere: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });
    <span class="tok-kw">const</span> box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    <span class="tok-kw">const</span> capsule: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .capsule = .{ .half_height = <span class="tok-num">0.4</span>, .radius = <span class="tok-num">0.3</span> } });
    state.launch_shape = sphere;
    <span class="tok-kw">const</span> shapes = [_]zp.ShapeId{ sphere, box, capsule };
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">30</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> col: f32 = <span class="tok-fn">float</span>(i % <span class="tok-num">5</span>) - <span class="tok-num">2.0</span>;
        <span class="tok-kw">const</span> row: f32 = <span class="tok-fn">float</span>(i / <span class="tok-num">5</span>);
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = shapes[i % <span class="tok-num">3</span>],
            .position = <span class="tok-fn">vec</span>(col * <span class="tok-num">0.6</span>, <span class="tok-num">7.0</span> + row * <span class="tok-num">1.0</span>, (<span class="tok-fn">float</span>((i * <span class="tok-num">7</span>) % <span class="tok-num">5</span>) - <span class="tok-num">2.0</span>) * <span class="tok-num">0.6</span>),
            .motion_type = .dynamic,
            .friction = <span class="tok-num">0.5</span>,
            .restitution = <span class="tok-num">0.2</span>,
            .material = <span class="tok-builtin">@intCast</span>(i % <span class="tok-num">6</span>),
        });
    }
}

<span class="tok-comment">/// Group id shared by the links of a constraint construct so they don't</span>
<span class="tok-comment">/// self-collide (Jolt's samples use a GroupFilterTable for the same reason);</span>
<span class="tok-comment">/// dropped props stay in group 0 so they still hit the construct.</span>
<span class="tok-kw">const</span> link_group: u32 = <span class="tok-num">1</span>;

<span class="tok-comment">/// Swing bridge (Jolt PointConstraintTest, both ends pinned): a row of dynamic</span>
<span class="tok-comment">/// planks linked end-to-end with `createPointJoint`, anchored to two static</span>
<span class="tok-comment">/// posts. The chain of point joints sags into a catenary; dropped boxes load it</span>
<span class="tok-comment">/// so it visibly flexes. Headless-proven: neighbour spans hold to 0.003, mid sags.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneBridge</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">const</span> post: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.3</span>, <span class="tok-num">0.4</span>, <span class="tok-num">0.6</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    <span class="tok-kw">const</span> plank: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.12</span>, <span class="tok-num">0.6</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    <span class="tok-kw">const</span> span_y: f32 = <span class="tok-num">5.0</span>;
    <span class="tok-kw">const</span> left: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = post,
        .position = <span class="tok-fn">vec</span>(-<span class="tok-num">4.5</span>, span_y, <span class="tok-num">0</span>),
        .motion_type = .static,
        .material = <span class="tok-num">0</span>,
    });
    <span class="tok-kw">const</span> right: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = post,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">4.5</span>, span_y, <span class="tok-num">0</span>),
        .motion_type = .static,
        .material = <span class="tok-num">0</span>,
    });
    <span class="tok-kw">const</span> n: u32 = <span class="tok-num">8</span>;
    <span class="tok-kw">var</span> prev: zp.BodyHandle = left;
    <span class="tok-kw">var</span> prev_x: f32 = -<span class="tok-num">4.5</span>;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> px: f32 = -<span class="tok-num">3.5</span> + <span class="tok-fn">float</span>(i) * <span class="tok-num">1.0</span>;
        <span class="tok-kw">const</span> idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = plank,
            .position = <span class="tok-fn">vec</span>(px, span_y, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .friction = <span class="tok-num">0.6</span>,
            .group_id = link_group, <span class="tok-comment">// planks ignore each other; props (group 0) still land on them</span>
            .material = <span class="tok-builtin">@intCast</span>(<span class="tok-num">1</span> + i % <span class="tok-num">5</span>),
        });
        <span class="tok-comment">// Pin BOTH front/back corners of the shared edge (z = +/-0.4). A single</span>
        <span class="tok-comment">// mid-edge anchor puts the link's two pins on one line (the bridge X</span>
        <span class="tok-comment">// axis), leaving each plank free to ROLL about it - so any off-centre</span>
        <span class="tok-comment">// load (the dropped crates) spins the deck up without limit. A point</span>
        <span class="tok-comment">// constraint locks position, not rotation; two anchors spread across the</span>
        <span class="tok-comment">// width remove the roll/twist DOF while still letting the bridge sag.</span>
        <span class="tok-kw">const</span> jx: f32 = (prev_x + px) * <span class="tok-num">0.5</span>;
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createPointJoint</span>(world, prev, idx, <span class="tok-fn">vec</span>(jx, span_y, -<span class="tok-num">0.4</span>));
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createPointJoint</span>(world, prev, idx, <span class="tok-fn">vec</span>(jx, span_y, <span class="tok-num">0.4</span>));
        prev = idx;
        prev_x = px;
    }
    <span class="tok-kw">const</span> jx_end: f32 = (prev_x + <span class="tok-num">4.5</span>) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createPointJoint</span>(world, prev, right, <span class="tok-fn">vec</span>(jx_end, span_y, -<span class="tok-num">0.4</span>));
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createPointJoint</span>(world, prev, right, <span class="tok-fn">vec</span>(jx_end, span_y, <span class="tok-num">0.4</span>));

    <span class="tok-comment">// Two boxes dropped onto the deck so the bridge flexes under load.</span>
    <span class="tok-kw">const</span> crate: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = crate,
        .position = <span class="tok-fn">vec</span>(-<span class="tok-num">1.0</span>, <span class="tok-num">8.0</span>, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .material = <span class="tok-num">3</span>,
    });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = crate,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">1.2</span>, <span class="tok-num">9.5</span>, <span class="tok-num">0.2</span>),
        .motion_type = .dynamic,
        .material = <span class="tok-num">4</span>,
    });
}

<span class="tok-comment">/// Hanging chain (Jolt DistanceConstraintTest): capsule links joined by</span>
<span class="tok-comment">/// `createDistanceJoint` ropes (min 0, max = gap) dangling from a static</span>
<span class="tok-comment">/// anchor, with a heavy ball on the end and a sideways nudge so it swings like a</span>
<span class="tok-comment">/// pendulum. Headless-proven: the rope holds at its cap distance.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneChain</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">const</span> anchor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.25</span> } });
    <span class="tok-kw">const</span> link: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .capsule = .{ .half_height = <span class="tok-num">0.3</span>, .radius = <span class="tok-num">0.22</span> } });
    <span class="tok-kw">const</span> ball: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.6</span> } });
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });

    <span class="tok-kw">const</span> top_y: f32 = <span class="tok-num">7.5</span>;
    <span class="tok-comment">// Spawn pitch = the caps-touching geometry: 2 radii (cap-sphere gap at touch)</span>
    <span class="tok-comment">// + 2 half-heights (the two cap-centre offsets). At this pitch the rest config</span>
    <span class="tok-comment">// already has the end spheres touching, the pair ropes are taut at rest, and</span>
    <span class="tok-comment">// the 5% tethers stay genuinely slack. (At the old 0.85 the caps spawned</span>
    <span class="tok-comment">// OVERLAPPED and the tethers - sized from that pitch - pinned the chain there,</span>
    <span class="tok-comment">// so the pair ropes could never reach touching.)</span>
    <span class="tok-kw">const</span> gap: f32 = <span class="tok-num">2.0</span> * <span class="tok-num">0.22</span> + <span class="tok-num">2.0</span> * <span class="tok-num">0.3</span>; <span class="tok-comment">// = 1.04</span>
    <span class="tok-kw">const</span> anchor: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = anchor_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, top_y, <span class="tok-num">0</span>),
        .motion_type = .static,
        .material = <span class="tok-num">0</span>,
    });
    <span class="tok-kw">const</span> n: u32 = <span class="tok-num">8</span>;
    <span class="tok-kw">const</span> hh: f32 = <span class="tok-num">0.3</span>; <span class="tok-comment">// capsule half-height = cap-sphere-centre offset from COM</span>
    <span class="tok-kw">const</span> two_r: f32 = <span class="tok-num">2.0</span> * <span class="tok-num">0.22</span>; <span class="tok-comment">// two capsule radii: the end spheres may touch, not part</span>
    <span class="tok-kw">var</span> prev: zp.BodyHandle = anchor;
    <span class="tok-kw">var</span> prev_y: f32 = top_y;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> cy: f32 = top_y - gap * <span class="tok-fn">float</span>(i + <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = link,
            .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, cy, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .group_id = link_group,
            .material = <span class="tok-builtin">@intCast</span>(<span class="tok-num">1</span> + i % <span class="tok-num">5</span>),
        });
        <span class="tok-comment">// Link the adjacent CAP-SPHERE CENTRES with max = 2 radii, so the two</span>
        <span class="tok-comment">// end spheres can touch but the link can't pull apart - a natural chain</span>
        <span class="tok-comment">// (a distance constraint fixes only the one DOF, so links still swing</span>
        <span class="tok-comment">// and spin). The anchors sit off-COM, which only holds under load thanks</span>
        <span class="tok-comment">// to the per-position-iteration re-derive of the constraint (Jolt does</span>
        <span class="tok-comment">// the same): without it the heavy bob below tore an off-COM rope open.</span>
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createDistanceJoint</span>(world, prev, idx, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, prev_y - hh, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, cy + hh, <span class="tok-num">0</span>), <span class="tok-num">0.0</span>, two_r);
        <span class="tok-comment">// Long "safety" tether: ceiling -&gt; this body centre, capped at 1.05x the</span>
        <span class="tok-comment">// body's rest depth below the ceiling (min=0). The 5% slack is deliberate:</span>
        <span class="tok-comment">// taut tethers pin every body to an exact depth and the pair ropes have</span>
        <span class="tok-comment">// nothing left to do (the chain dangles kinked). With slack, the pair</span>
        <span class="tok-comment">// constraints define the shape and the tether only catches runaway creep -</span>
        <span class="tok-comment">// the bob's load no longer has to propagate down all 8 links for a body to</span>
        <span class="tok-comment">// be held (the anchor is infinite-mass), which is the iterative-solver</span>
        <span class="tok-comment">// limit that bites every engine on a heavy-ended long chain, Jolt included.</span>
        <span class="tok-kw">const</span> rest_depth: f32 = top_y - cy;
        <span class="tok-kw">const</span> tether_max: f32 = rest_depth * <span class="tok-num">1.05</span>;
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createDistanceJoint</span>(world, anchor, idx, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, top_y, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, cy, <span class="tok-num">0</span>), <span class="tok-num">0.0</span>, tether_max);
        prev = idx;
        prev_y = cy;
    }
    <span class="tok-comment">// Heavy bob on the end, then shove the whole chain sideways so it swings.</span>
    <span class="tok-kw">const</span> bob: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = ball,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, prev_y - gap, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">4000.0</span>,
        .group_id = link_group,
        .material = <span class="tok-num">3</span>,
    });
    <span class="tok-comment">// Last cap-sphere centre to the top of the bob, same touch-but-don't-part rule.</span>
    <span class="tok-kw">const</span> bob_a: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, prev_y - hh, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> bob_b: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, prev_y - gap + <span class="tok-num">0.6</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createDistanceJoint</span>(world, prev, bob, bob_a, bob_b, <span class="tok-num">0.0</span>, two_r);
    <span class="tok-comment">// Ceiling tether for the heaviest body too - this is the one the link chain</span>
    <span class="tok-comment">// struggles to hold, so the direct anchor link matters most here. Same 5% slack.</span>
    <span class="tok-kw">const</span> bob_y: f32 = prev_y - gap;
    <span class="tok-kw">const</span> bob_tether_max: f32 = (top_y - bob_y) * <span class="tok-num">1.05</span>;
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createDistanceJoint</span>(world, anchor, bob, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, top_y, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, bob_y, <span class="tok-num">0</span>), <span class="tok-num">0.0</span>, bob_tether_max);
    <span class="tok-kw">try</span> world.<span class="tok-fn">setLinearVelocity</span>(gpa, bob, <span class="tok-fn">vec</span>(<span class="tok-num">7.0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>));
}

<span class="tok-comment">/// stepped speeds - they spin like propellers (COM at the pivot, so gravity adds</span>
<span class="tok-comment">/// no torque). Loose balls get batted around. Headless-proven: a motor reaches</span>
<span class="tok-comment">/// its target rad/s; here sleeping is disabled so the bars never doze.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneMotor</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false; <span class="tok-comment">// a powered joint must keep running (Jolt sets SetAllowSleeping(false))</span>
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">10</span>);
    <span class="tok-kw">const</span> hub: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.15</span> } });
    <span class="tok-kw">const</span> bar: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">1.6</span>, <span class="tok-num">0.18</span>, <span class="tok-num">0.18</span>),
        .convex_radius = <span class="tok-num">0.04</span>,
    } });
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.35</span> } });

    <span class="tok-kw">const</span> bar_y: f32 = <span class="tok-num">3.0</span>;
    <span class="tok-kw">const</span> speeds = [_]f32{ <span class="tok-num">2.5</span>, <span class="tok-num">4.0</span>, <span class="tok-num">6.0</span> };
    <span class="tok-kw">var</span> b: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (b &lt; speeds.len) : (b += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> bx: f32 = (<span class="tok-fn">float</span>(b) - <span class="tok-num">1.0</span>) * <span class="tok-num">4.0</span>;
        <span class="tok-kw">const</span> hub_idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = hub,
            .position = <span class="tok-fn">vec</span>(bx, bar_y, <span class="tok-num">0</span>),
            .motion_type = .static,
            .material = <span class="tok-num">0</span>,
        });
        <span class="tok-kw">const</span> paddle: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = bar,
            .position = <span class="tok-fn">vec</span>(bx, bar_y, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .density = <span class="tok-num">300.0</span>,
            .group_id = link_group + b + <span class="tok-num">1</span>, <span class="tok-comment">// each bar ignores nothing but itself; balls (group 0) still hit it</span>
            .material = <span class="tok-builtin">@intCast</span>(<span class="tok-num">1</span> + b % <span class="tok-num">5</span>),
        });
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createRevoluteJoint</span>(world, hub_idx, paddle, .{
            .anchor = <span class="tok-fn">vec</span>(bx, bar_y, <span class="tok-num">0</span>),
            .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
            <span class="tok-comment">// Motor torque scales with inertia (Jolt: torque_limit = inertia * accel),</span>
            <span class="tok-comment">// so `max_force` is set well above what this bar needs to hold target.</span>
            .motor = .{ .mode = .velocity, .target_velocity = speeds[b], .max_force = <span class="tok-num">150000.0</span> },
        });
    }
    <span class="tok-comment">// Props for the bars to fling around.</span>
    <span class="tok-kw">const</span> ballp: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.35</span> } });
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">8</span>) : (i += <span class="tok-num">1</span>) {
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = ballp,
            .position = <span class="tok-fn">vec</span>((<span class="tok-fn">float</span>(i % <span class="tok-num">4</span>) - <span class="tok-num">1.5</span>) * <span class="tok-num">2.6</span>, <span class="tok-num">5.5</span> + <span class="tok-fn">float</span>(i / <span class="tok-num">4</span>) * <span class="tok-num">1.0</span>, (<span class="tok-fn">float</span>(i % <span class="tok-num">2</span>) - <span class="tok-num">0.5</span>) * <span class="tok-num">0.8</span>),
            .motion_type = .dynamic,
            .restitution = <span class="tok-num">0.4</span>,
            .material = <span class="tok-builtin">@intCast</span>(<span class="tok-num">2</span> + i % <span class="tok-num">4</span>),
        });
    }
}

<span class="tok-comment">/// Welded structures (Jolt FixedConstraintTest): a horizontal cantilever of boxes</span>
<span class="tok-comment">/// welded with `createWeldJoint` holds straight out from a static anchor (the</span>
<span class="tok-comment">/// weld locks position AND orientation, so it doesn't sag like the bridge/chain),</span>
<span class="tok-comment">/// and a welded "table" dropped beside it lands as one rigid piece.</span>
<span class="tok-comment">/// Headless-proven: a 5-box cantilever droops only 0.07; a 2-box weld stays rigid.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneWeld</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">12</span>);
    <span class="tok-kw">const</span> box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });

    <span class="tok-comment">// Cantilever: a static anchor box, then 5 dynamic boxes welded in a line.</span>
    <span class="tok-kw">const</span> arm_y: f32 = <span class="tok-num">5.0</span>;
    <span class="tok-kw">var</span> prev: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = box,
        .position = <span class="tok-fn">vec</span>(-<span class="tok-num">5.0</span>, arm_y, <span class="tok-num">0</span>),
        .motion_type = .static,
        .group_id = link_group,
        .material = <span class="tok-num">0</span>,
    });
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (i &lt;= <span class="tok-num">5</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = box,
            .position = <span class="tok-fn">vec</span>(-<span class="tok-num">5.0</span> + <span class="tok-fn">float</span>(i) * <span class="tok-num">1.0</span>, arm_y, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .group_id = link_group,
            .material = <span class="tok-builtin">@intCast</span>(<span class="tok-num">1</span> + i % <span class="tok-num">5</span>),
        });
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createWeldJoint</span>(world, prev, idx);
        prev = idx;
    }

    <span class="tok-comment">// A welded "table": a top slab welded onto four leg boxes, dropped to land rigid.</span>
    <span class="tok-kw">const</span> slab: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">1.4</span>, <span class="tok-num">0.18</span>, <span class="tok-num">1.4</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    <span class="tok-kw">const</span> leg: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.18</span>, <span class="tok-num">0.7</span>, <span class="tok-num">0.18</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    <span class="tok-kw">const</span> tx: f32 = <span class="tok-num">3.0</span>;
    <span class="tok-kw">const</span> ty: f32 = <span class="tok-num">4.0</span>;
    <span class="tok-kw">const</span> top: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = slab,
        .position = <span class="tok-fn">vec</span>(tx, ty + <span class="tok-num">0.7</span>, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .group_id = link_group + <span class="tok-num">1</span>,
        .material = <span class="tok-num">5</span>,
    });
    <span class="tok-kw">const</span> leg_dx = [_]f32{ -<span class="tok-num">1.1</span>, <span class="tok-num">1.1</span>, -<span class="tok-num">1.1</span>, <span class="tok-num">1.1</span> };
    <span class="tok-kw">const</span> leg_dz = [_]f32{ -<span class="tok-num">1.1</span>, -<span class="tok-num">1.1</span>, <span class="tok-num">1.1</span>, <span class="tok-num">1.1</span> };
    <span class="tok-kw">var</span> l: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (l &lt; <span class="tok-num">4</span>) : (l += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> leg_idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = leg,
            .position = <span class="tok-fn">vec</span>(tx + leg_dx[l], ty, leg_dz[l]),
            .motion_type = .dynamic,
            .group_id = link_group + <span class="tok-num">1</span>,
            .material = <span class="tok-num">2</span>,
        });
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createWeldJoint</span>(world, top, leg_idx);
    }
}

<span class="tok-comment">/// A powered linear slider (Jolt PoweredSliderConstraintTest): a dynamic platform</span>
<span class="tok-comment">/// rides a horizontal rail, driven back and forth by a velocity motor that the</span>
<span class="tok-comment">/// update loop reverses at the limit stops. Only the slide axis is free; the</span>
<span class="tok-comment">/// slider's perpendicular DOFs hold the platform up against gravity. Headless-</span>
<span class="tok-comment">/// proven: the platform sweeps x in [-2.83, 2.80] with ~0.12 m perpendicular</span>
<span class="tok-comment">/// drift and reverses cleanly at +-2.8 (steady-state drift is zero when driven</span>
<span class="tok-comment">/// to a single limit). The platform COM is coincident with the rail centre-line</span>
<span class="tok-comment">/// because the slider preserves the creation-pose perpendicular offset.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneSlider</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false; <span class="tok-comment">// a powered joint must keep running</span>
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">8</span>);
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.35</span> } });

    <span class="tok-kw">const</span> mid: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">4.0</span>, <span class="tok-num">0</span>);
    <span class="tok-comment">// Long thin static rail: the visible track the platform slides along.</span>
    <span class="tok-kw">const</span> rail_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">3.6</span>, <span class="tok-num">0.08</span>, <span class="tok-num">0.08</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> rail: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = rail_shape,
        .position = mid,
        .motion_type = .static,
    });
    <span class="tok-comment">// Dynamic platform, COM coincident with the rail centre-line.</span>
    <span class="tok-kw">const</span> plat_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.7</span>, <span class="tok-num">0.2</span>, <span class="tok-num">0.7</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> plat: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = plat_shape,
        .position = mid,
        .motion_type = .dynamic,
        .density = <span class="tok-num">300.0</span>,
        .material = <span class="tok-num">3</span>,
    });

    <span class="tok-kw">try</span> zp.<span class="tok-fn">createPrismaticJoint</span>(world, rail, plat, .{
        .anchor = mid,
        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .has_limits = true,
        .limit_min = -<span class="tok-num">3.0</span>,
        .limit_max = <span class="tok-num">3.0</span>,
        <span class="tok-comment">// Motor force scales with mass; set well above what 2 m/s needs to hold.</span>
        .motor = .{ .mode = .velocity, .target_velocity = <span class="tok-num">2.0</span>, .max_force = <span class="tok-num">300000.0</span> },
    });
    state.slider_plat = plat;
    state.slider_idx = world.constraints.items.len - <span class="tok-num">1</span>;
}

<span class="tok-comment">/// that runs up over a fixed beam and back down. The rope is rigid (min == max ==</span>
<span class="tok-comment">/// the creation length), so the total length is conserved: the heavy box descends</span>
<span class="tok-comment">/// to the floor and hauls the light box up toward the beam. The rope itself is</span>
<span class="tok-comment">/// drawn by drawSceneOverlay (it isn't a body). Headless-proven: heavy box settles</span>
<span class="tok-comment">/// at y=0.48 (on the floor), light box rises to y=8.02, rope length drift = 0.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">scenePulley</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">10</span>);
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.35</span> } });

    <span class="tok-comment">// Static beam the rope hangs over.</span>
    <span class="tok-kw">const</span> beam: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">3.2</span>, <span class="tok-num">0.15</span>, <span class="tok-num">0.15</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = beam, .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">9.0</span>, <span class="tok-num">0</span>), .motion_type = .static });

    <span class="tok-kw">const</span> box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> pa: Vec = <span class="tok-fn">vec</span>(-<span class="tok-num">2.5</span>, <span class="tok-num">5.0</span>, <span class="tok-num">0</span>); <span class="tok-comment">// heavy box (descends)</span>
    <span class="tok-kw">const</span> pb: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">2.5</span>, <span class="tok-num">3.5</span>, <span class="tok-num">0</span>); <span class="tok-comment">// light box (rises)</span>
    <span class="tok-kw">const</span> a: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = box,
        .position = pa,
        .motion_type = .dynamic,
        .density = <span class="tok-num">1500.0</span>,
        .material = <span class="tok-num">1</span>,
    });
    <span class="tok-kw">const</span> b: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = box,
        .position = pb,
        .motion_type = .dynamic,
        .density = <span class="tok-num">300.0</span>,
        .material = <span class="tok-num">4</span>,
    });

    <span class="tok-comment">// Rope ends at the top of each box; the two fixed pulley points sit just under</span>
    <span class="tok-comment">// the beam, directly above each box. ratio 1, rigid rope (min == max == current).</span>
    <span class="tok-kw">const</span> bp_a: Vec = pa + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> bp_b: Vec = pb + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> fixed_a: Vec = <span class="tok-fn">vec</span>(-<span class="tok-num">2.5</span>, <span class="tok-num">8.85</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> fixed_b: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">2.5</span>, <span class="tok-num">8.85</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createPulleyJoint</span>(world, a, b, bp_a, fixed_a, bp_b, fixed_b, <span class="tok-num">1.0</span>, -<span class="tok-num">1.0</span>, -<span class="tok-num">1.0</span>);
