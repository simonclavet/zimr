    state.pulley_idx = world.constraints.items.len - <span class="tok-num">1</span>;
}

<span class="tok-comment">/// Swing-twist (ragdoll) cone joints. A static overhead bar holds four capsule</span>
<span class="tok-comment">/// "limbs", each pinned by `createSwingTwistJoint` with an increasingly wide</span>
<span class="tok-comment">/// swing cone (0.25..1.0 rad) and a tight twist range. Each limb is kicked</span>
<span class="tok-comment">/// sideways so it drives into its cone: a correct cone holds the limb within</span>
<span class="tok-comment">/// roughly its half-angle (the swing-twist cone limit now holds - see zimrphysics.zig).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneRagdoll</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });

    <span class="tok-kw">const</span> bar: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">7</span>, <span class="tok-num">0.2</span>, <span class="tok-num">0.2</span>), .convex_radius = <span class="tok-num">0.05</span> },
    });
    <span class="tok-kw">const</span> top_y: f32 = <span class="tok-num">8.0</span>;
    <span class="tok-kw">const</span> anchor: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = bar,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, top_y, <span class="tok-num">0</span>),
        .motion_type = .static,
        .material = <span class="tok-num">0</span>,
    });

    <span class="tok-kw">const</span> limb: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .capsule = .{ .half_height = <span class="tok-num">0.7</span>, .radius = <span class="tok-num">0.22</span> } });
    <span class="tok-kw">const</span> cones = [_]f32{ <span class="tok-num">0.25</span>, <span class="tok-num">0.45</span>, <span class="tok-num">0.7</span>, <span class="tok-num">1.0</span> };
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; cones.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = -<span class="tok-num">5.25</span> + <span class="tok-num">3.5</span> * <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> cy: f32 = top_y - <span class="tok-num">0.95</span>; <span class="tok-comment">// COM just below the pivot; long axis (Y) vertical</span>
        <span class="tok-kw">const</span> idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = limb,
            .position = <span class="tok-fn">vec</span>(x, cy, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .group_id = link_group,
            .material = <span class="tok-builtin">@intCast</span>(<span class="tok-num">1</span> + i % <span class="tok-num">5</span>),
        });
        <span class="tok-comment">// Twist axis = the limb's long axis (vertical Y); plane axis = X. The cone</span>
        <span class="tok-comment">// limits how far the limb may tilt away from vertical; twist about Y is tight.</span>
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createSwingTwistJoint</span>(world, anchor, idx, .{
            .anchor = <span class="tok-fn">vec</span>(x, top_y, <span class="tok-num">0</span>),
            .twist_axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
            .plane_axis = <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
            .swing_type = .cone,
            .normal_half_cone = cones[i],
            .plane_half_cone = cones[i],
            .twist_min = -<span class="tok-num">0.2</span>,
            .twist_max = <span class="tok-num">0.2</span>,
        });
        <span class="tok-comment">// Kick it sideways (about Z) so it swings into the cone, then gravity returns it.</span>
        <span class="tok-kw">try</span> world.<span class="tok-fn">setAngularVelocity</span>(gpa, idx, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">7.0</span>));
    }
}

<span class="tok-comment">/// Gear train (Jolt GearConstraintTest): three disks pinned by hinges about Z and</span>
<span class="tok-comment">/// coupled by `createGearJoint`. The first disk is driven by a velocity motor;</span>
<span class="tok-comment">/// the gear constraints make the neighbours counter-rotate at the meshing ratio</span>
<span class="tok-comment">/// (ratio = r_driven / r_driver, so smaller gears spin faster). Each gear is a</span>
<span class="tok-comment">/// compound (disk + a contrasting spoke) so the rotation is visible, and the COM</span>
<span class="tok-comment">/// sits on the pivot so gravity adds no torque. Headless-proven: a 2:1 pair gives</span>
<span class="tok-comment">/// wB ~= -wA/2.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneGear</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.35</span> } });
    <span class="tok-kw">const</span> hub: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.12</span> } });
    <span class="tok-comment">// Cylinder axis is local Y; rotate 90deg about X so the disk faces the camera (axis -&gt; Z).</span>
    <span class="tok-kw">const</span> face_z: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), pi * <span class="tok-num">0.5</span>);
    <span class="tok-kw">const</span> qid: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">0.0</span>);

    <span class="tok-kw">const</span> radii = [_]f32{ <span class="tok-num">1.1</span>, <span class="tok-num">0.8</span>, <span class="tok-num">0.55</span> };
    <span class="tok-kw">const</span> gy: f32 = <span class="tok-num">4.0</span>;
    <span class="tok-kw">var</span> cx: f32 = -<span class="tok-num">2.2</span>; <span class="tok-comment">// running x; first gear centre</span>
    <span class="tok-kw">var</span> prev_idx: zp.BodyHandle = .nil;
    <span class="tok-kw">var</span> prev_r: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; radii.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> r: f32 = radii[i];
        <span class="tok-comment">// Place so the disks mesh: adjacent centres are exactly the sum of the two radii, so</span>
        <span class="tok-comment">// they touch without overlapping. The first disk has no predecessor to offset from.</span>
        <span class="tok-kw">if</span> (i &gt; <span class="tok-num">0</span>) {
            cx += prev_r + r;
        }
        <span class="tok-kw">const</span> disk: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
            .cylinder = .{ .half_height = <span class="tok-num">0.18</span>, .radius = r, .convex_radius = <span class="tok-num">0.03</span> },
        });
        <span class="tok-kw">const</span> spoke: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
            <span class="tok-comment">// A diametric rib that clearly stands proud of the disk on BOTH faces</span>
            <span class="tok-comment">// (depth 0.30 &gt; disk half-height 0.18) so it reads as an attached spoke</span>
            <span class="tok-comment">// rather than a same-coloured bar embedded flush in the disk face (which</span>
            <span class="tok-comment">// z-fights and looks like it is detaching as the gear spins).</span>
            .box = .{ .half_extent = <span class="tok-fn">vec</span>(r * <span class="tok-num">0.96</span>, <span class="tok-num">0.11</span>, <span class="tok-num">0.30</span>), .convex_radius = <span class="tok-num">0.02</span> },
        });
        <span class="tok-kw">const</span> gear_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addCompound</span>(gpa, &amp;.{
            .{ .shape = disk, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = face_z },
            .{ .shape = spoke, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = qid },
        });
        <span class="tok-kw">const</span> hub_idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = hub,
            .position = <span class="tok-fn">vec</span>(cx, gy, <span class="tok-num">0</span>),
            .motion_type = .static,
            <span class="tok-comment">// Same group as the gear: the hub sits inside the disk, and zimr does not yet</span>
            <span class="tok-comment">// collision-filter constraint-connected bodies (Jolt's collide_connected=false),</span>
            <span class="tok-comment">// so without this the embedded static hub fights the spinning gear and blows up.</span>
            .group_id = link_group + i + <span class="tok-num">1</span>,
            .material = <span class="tok-num">0</span>,
        });
        <span class="tok-kw">const</span> gear_idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = gear_shape,
            .position = <span class="tok-fn">vec</span>(cx, gy, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .density = <span class="tok-num">120.0</span>,
            .group_id = link_group + i + <span class="tok-num">1</span>, <span class="tok-comment">// gears never collide with each other (teeth aren't modelled)</span>
            .material = <span class="tok-builtin">@intCast</span>(<span class="tok-num">1</span> + i % <span class="tok-num">5</span>),
        });
        <span class="tok-comment">// Hinge about Z. Motor only the first gear; the rest are driven through the gears.</span>
        <span class="tok-kw">const</span> motor: zp.MotorSettings = <span class="tok-kw">if</span> (i == <span class="tok-num">0</span>)
            .{ .mode = .velocity, .target_velocity = <span class="tok-num">2.5</span>, .max_force = <span class="tok-num">1.0e6</span> }
        <span class="tok-kw">else</span>
            .{};
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createRevoluteJoint</span>(world, hub_idx, gear_idx, .{
            .anchor = <span class="tok-fn">vec</span>(cx, gy, <span class="tok-num">0</span>),
            .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
            .motor = motor,
        });
        <span class="tok-kw">if</span> (i &gt; <span class="tok-num">0</span>) {
            <span class="tok-comment">// ratio = r_this / r_prev: equal surface speed at the mesh, opposite sense.</span>
            <span class="tok-comment">// Pure velocity coupling (hinge refs -1): the velocity part now enforces the</span>
            <span class="tok-comment">// coupling on its own and is stable; the optional drift-correction path is not</span>
            <span class="tok-comment">// wired here (see createGearJoint's note).</span>
            <span class="tok-kw">try</span> zp.<span class="tok-fn">createGearJoint</span>(
                world,
                prev_idx,
                gear_idx,
                <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
                <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
                r / prev_r,
                -<span class="tok-num">1</span>,
                -<span class="tok-num">1</span>,
            );
        }
        prev_idx = gear_idx;
        prev_r = r;
    }
}

<span class="tok-comment">/// Rack and pinion (Jolt's RackAndPinionConstraintTest): a motor-driven pinion (a</span>
<span class="tok-comment">/// gear-like disk+spoke hinged about Z) whose rotation is tied to a long toothed rack</span>
<span class="tok-comment">/// sliding along X by `createRackAndPinionJoint`. ratio = 1/r_pinion, so the rack</span>
<span class="tok-comment">/// surface speed matches the pinion rim. Pure velocity coupling (refs -1): the</span>
<span class="tok-comment">/// rack tracks the pinion at v = w/ratio. Pinion and rack share a no-collide group</span>
<span class="tok-comment">/// (the constraint provides the meshing; teeth are not modelled as geometry).</span>
<span class="tok-comment">/// NOTE: the rack travels one way under the constant motor; reciprocation via motor</span>
<span class="tok-comment">/// reversal or a slider spring is not wired here - both currently lose stability /</span>
<span class="tok-comment">/// energy through the coupling (logged as a parity gap). Reset to replay.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneRackPinion</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.35</span> } });
    <span class="tok-kw">const</span> grp: u32 = <span class="tok-num">1500</span>;

    <span class="tok-comment">// Pinion: disk + spoke compound, hinged about Z, velocity-motored.</span>
    <span class="tok-kw">const</span> r_pin: f32 = <span class="tok-num">0.7</span>;
    <span class="tok-kw">const</span> py: f32 = <span class="tok-num">3.2</span>;
    <span class="tok-kw">const</span> face_z: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), pi * <span class="tok-num">0.5</span>);
    <span class="tok-kw">const</span> qid: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">0.0</span>);
    <span class="tok-kw">const</span> disk: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .cylinder = .{ .half_height = <span class="tok-num">0.18</span>, .radius = r_pin, .convex_radius = <span class="tok-num">0.03</span> },
    });
    <span class="tok-kw">const</span> spoke: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(r_pin * <span class="tok-num">0.96</span>, <span class="tok-num">0.11</span>, <span class="tok-num">0.30</span>), .convex_radius = <span class="tok-num">0.02</span> },
    });
    <span class="tok-kw">const</span> pinion_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addCompound</span>(gpa, &amp;.{
        .{ .shape = disk, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = face_z },
        .{ .shape = spoke, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = qid },
    });
    <span class="tok-kw">const</span> hub_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.12</span> } });
    <span class="tok-kw">const</span> pin_hub: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = hub_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, py, <span class="tok-num">0</span>),
        .motion_type = .static,
        .group_id = grp,
    });
    <span class="tok-kw">const</span> pinion: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = pinion_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, py, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">120.0</span>,
        .group_id = grp,
        .material = <span class="tok-num">4</span>,
    });
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createRevoluteJoint</span>(world, pin_hub, pinion, .{
        .anchor = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, py, <span class="tok-num">0</span>),
        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
        .motor = .{ .mode = .velocity, .target_velocity = <span class="tok-num">1.3</span>, .max_force = <span class="tok-num">1.0e6</span> },
    });

    <span class="tok-comment">// Rack: a long bar with evenly spaced teeth (compound) on a slider along X.</span>
    <span class="tok-kw">const</span> ry: f32 = py - r_pin - <span class="tok-num">0.18</span>; <span class="tok-comment">// rack top just under the pinion rim</span>
    <span class="tok-kw">const</span> half_len: f32 = <span class="tok-num">6.0</span>;
    <span class="tok-kw">const</span> bar: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(half_len, <span class="tok-num">0.18</span>, <span class="tok-num">0.25</span>), .convex_radius = <span class="tok-num">0.02</span> },
    });
    <span class="tok-kw">const</span> tooth: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.12</span>, <span class="tok-num">0.16</span>, <span class="tok-num">0.22</span>), .convex_radius = <span class="tok-num">0.01</span> },
    });
    <span class="tok-kw">var</span> children: [<span class="tok-num">48</span>]zp.CompoundChild = undefined;
    <span class="tok-kw">var</span> nch: usize = <span class="tok-num">0</span>;
    children[nch] = .{ .shape = bar, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = qid };
    nch += <span class="tok-num">1</span>;
    <span class="tok-kw">const</span> pitch: f32 = <span class="tok-num">0.55</span>;
    <span class="tok-kw">var</span> tx: f32 = -half_len + pitch;
    <span class="tok-kw">while</span> (tx &lt; half_len - pitch * <span class="tok-num">0.5</span> <span class="tok-kw">and</span> nch &lt; children.len) : (tx += pitch) {
        children[nch] = .{ .shape = tooth, .local_pos = <span class="tok-fn">vec</span>(tx, <span class="tok-num">0.30</span>, <span class="tok-num">0</span>), .local_rot = qid };
        nch += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">const</span> rack_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addCompound</span>(gpa, children[<span class="tok-num">0</span>..nch]);
    <span class="tok-kw">const</span> rack_rail: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = hub_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, ry, <span class="tok-num">0</span>),
        .motion_type = .static,
        .group_id = grp,
    });
    <span class="tok-kw">const</span> rack: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = rack_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, ry, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">80.0</span>,
        .group_id = grp,
        .material = <span class="tok-num">1</span>,
    });
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createPrismaticJoint</span>(world, rack_rail, rack, .{ .anchor = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, ry, <span class="tok-num">0</span>), .axis = <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>) });

    <span class="tok-comment">// ratio = 1/r_pinion: rack surface speed == pinion rim speed. Pure velocity coupling.</span>
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createRackAndPinionJoint</span>(world, pinion, rack, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">1.0</span> / r_pin, -<span class="tok-num">1</span>, -<span class="tok-num">1</span>);
}

<span class="tok-comment">/// A bead threaded on a valley-shaped Hermite rail (Jolt PathConstraintTest). The rail is</span>
<span class="tok-comment">/// defined in a static anchor's space and drawn by drawSceneOverlay; the bead is frictionless,</span>
<span class="tok-comment">/// so under gravity it slides to the bottom and oscillates side to side, conserving energy.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">scenePath</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">10</span>);

    <span class="tok-kw">const</span> anchor: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.12</span> } });
    <span class="tok-kw">const</span> a: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = anchor,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
    });

    <span class="tok-kw">const</span> bead: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.45</span> } });
    state.launch_shape = bead;
    <span class="tok-kw">const</span> origin: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">3</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> p0: Vec = <span class="tok-fn">vec</span>(-<span class="tok-num">4</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>); <span class="tok-comment">// high left</span>
    <span class="tok-kw">const</span> p1: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>); <span class="tok-comment">// valley bottom</span>
    <span class="tok-kw">const</span> p2: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">4</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>); <span class="tok-comment">// high right</span>
    <span class="tok-kw">const</span> b: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = bead,
        .position = origin + p0,
        .motion_type = .dynamic,
        .density = <span class="tok-num">500.0</span>,
        .material = <span class="tok-num">3</span>,
    });
    <span class="tok-kw">const</span> nrm: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>); <span class="tok-comment">// frame normal: keep the rail in the XY plane</span>
    <span class="tok-kw">const</span> pts = [_]zp.HermitePoint{
        .{ .position = p0, .tangent = <span class="tok-fn">vec</span>(<span class="tok-num">4</span>, -<span class="tok-num">2</span>, <span class="tok-num">0</span>), .normal = nrm },
        .{ .position = p1, .tangent = <span class="tok-fn">vec</span>(<span class="tok-num">4</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .normal = nrm },
        .{ .position = p2, .tangent = <span class="tok-fn">vec</span>(<span class="tok-num">4</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>), .normal = nrm },
    };
    <span class="tok-kw">const</span> path_i: usize = <span class="tok-kw">try</span> zp.<span class="tok-fn">createPathJoint</span>(world, a, b, &amp;pts, false, origin, quat_identity, <span class="tok-num">0.0</span>, .free);
    state.path_idx = path_i + <span class="tok-num">1</span>; <span class="tok-comment">// +1 so 0 means "no path in this scene"</span>
}

<span class="tok-comment">/// Newton's cradle: five equal balls hang as planar pendulums (rigid distance-constraint</span>
<span class="tok-comment">/// strings) from a static beam, just touching, restitution ~1. The leftmost is lifted and</span>
<span class="tok-comment">/// released; momentum transfers along the row and the rightmost swings out - then it</span>
<span class="tok-comment">/// oscillates back and forth. `allowed_dofs = plane_2d` keeps every ball in the XY plane so</span>
<span class="tok-comment">/// the row stays aligned. Strings are drawn by drawSceneOverlay. A tiny gap helps the</span>
<span class="tok-comment">/// transfers resolve sequentially rather than as one mushy pile.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneNewtonsCradle</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    world.settings.min_velocity_for_restitution = <span class="tok-num">0.02</span>; <span class="tok-comment">// let the chain stay elastic</span>
    world.settings.velocity_steps = <span class="tok-num">24</span>;
    world.settings.position_steps = <span class="tok-num">4</span>;
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">10</span>);

    <span class="tok-kw">const</span> r: f32 = <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> y_top: f32 = <span class="tok-num">6.0</span>;
    <span class="tok-kw">const</span> y_rest: f32 = <span class="tok-num">3.0</span>;
    <span class="tok-kw">const</span> rope_len: f32 = y_top - y_rest;

    <span class="tok-kw">const</span> beam_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">4</span>, <span class="tok-num">0.2</span>, <span class="tok-num">0.2</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> beam: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = beam_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">2</span>, y_top + <span class="tok-num">0.2</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
    });

    <span class="tok-kw">const</span> ball_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = r } });
    state.launch_shape = ball_shape;
    <span class="tok-kw">const</span> gap: f32 = <span class="tok-num">0.004</span>; <span class="tok-comment">// 4 mm - sequential, near-invisible</span>
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">5</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">float</span>(i) * (<span class="tok-num">2</span> * r + gap);
        <span class="tok-kw">var</span> pos: Vec = <span class="tok-fn">vec</span>(x, y_rest, <span class="tok-num">0</span>);
        <span class="tok-kw">if</span> (i == <span class="tok-num">0</span>) {
            <span class="tok-kw">const</span> th: f32 = <span class="tok-num">0.8727</span>; <span class="tok-comment">// 50 degrees in radians (lift leftmost)</span>
            pos = <span class="tok-fn">vec</span>(x - rope_len * <span class="tok-builtin">@sin</span>(th), y_top - rope_len * <span class="tok-builtin">@cos</span>(th), <span class="tok-num">0</span>);
        }
        <span class="tok-kw">const</span> ball: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = ball_shape,
            .position = pos,
            .motion_type = .dynamic,
            .density = <span class="tok-num">1000.0</span>,
            .restitution = <span class="tok-num">1.0</span>,
            .friction = <span class="tok-num">0.0</span>,
            .linear_damping = <span class="tok-num">0.0</span>,
            .angular_damping = <span class="tok-num">0.0</span>,
            .allowed_dofs = zp.AllowedDofs.plane_2d,
        });
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createDistanceJoint</span>(world, beam, ball, <span class="tok-fn">vec</span>(x, y_top, <span class="tok-num">0</span>), pos, rope_len, rope_len);
    }
}

<span class="tok-comment">/// Wrecking ball: a heavy sphere hangs from a fixed pivot by a rigid distance-constraint</span>
<span class="tok-comment">/// chain, lifted to one side. Released, it swings down and smashes through a free-standing</span>
<span class="tok-comment">/// brick wall (a 2-deep box stack), scattering it. Pure gravity drive - no motor. Combines a</span>
<span class="tok-comment">/// distance-constraint pendulum, box stacking + friction, and big mass ratios. The chain is</span>
<span class="tok-comment">/// drawn by drawSceneOverlay. Headless-proven: the wall settles, then the ball plows through</span>
<span class="tok-comment">/// (mean brick displacement &gt; 1.5 m) with no NaN.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneWreckingBall</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    <span class="tok-kw">try</span> <span class="tok-fn">addFlatFloor</span>(world, gpa, <span class="tok-num">16</span>);

    <span class="tok-comment">// Free-standing brick wall: nx deep, nz wide, ny tall.</span>
    <span class="tok-kw">const</span> hx: f32 = <span class="tok-num">0.4</span>;
    <span class="tok-kw">const</span> hy: f32 = <span class="tok-num">0.3</span>;
    <span class="tok-kw">const</span> hz: f32 = <span class="tok-num">0.6</span>;
    <span class="tok-kw">const</span> brick: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(hx, hy, hz),
        .convex_radius = <span class="tok-num">0.01</span>,
    } });
    <span class="tok-kw">const</span> nx: usize = <span class="tok-num">2</span>;
    <span class="tok-kw">const</span> nz: usize = <span class="tok-num">3</span>;
    <span class="tok-kw">const</span> ny: usize = <span class="tok-num">5</span>;
    <span class="tok-kw">const</span> x0: f32 = <span class="tok-num">2.6</span>;
    <span class="tok-kw">var</span> ix: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (ix &lt; nx) : (ix += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> iz: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (iz &lt; nz) : (iz += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> iy: usize = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (iy &lt; ny) : (iy += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> px: f32 = x0 + <span class="tok-fn">float</span>(ix) * (<span class="tok-num">2</span> * hx);
                <span class="tok-kw">const</span> pz: f32 = (<span class="tok-fn">float</span>(iz) - <span class="tok-num">1.0</span>) * (<span class="tok-num">2</span> * hz);
                <span class="tok-kw">const</span> py: f32 = hy + <span class="tok-fn">float</span>(iy) * (<span class="tok-num">2</span> * hy);
                _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
                    .shape = brick,
                    .position = <span class="tok-fn">vec</span>(px, py, pz),
                    .motion_type = .dynamic,
                    .density = <span class="tok-num">400.0</span>,
                    .friction = <span class="tok-num">0.7</span>,
                    .restitution = <span class="tok-num">0.0</span>,
                    .material = <span class="tok-num">2</span>,
                });
            }
        }
    }

    <span class="tok-comment">// Pivot + heavy ball on a rigid chain, lifted ~70 deg.</span>
    <span class="tok-kw">const</span> pivot_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.3</span>, <span class="tok-num">0.3</span>, <span class="tok-num">0.3</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> pivot: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = pivot_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">9</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
    });
    <span class="tok-kw">const</span> rope_len: f32 = <span class="tok-num">6.0</span>;
    <span class="tok-kw">const</span> ball_r: f32 = <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> ball_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = ball_r } });
    state.launch_shape = ball_shape;
    <span class="tok-kw">const</span> th: f32 = <span class="tok-num">1.222</span>; <span class="tok-comment">// ~70 degrees</span>
    <span class="tok-kw">const</span> bp: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span> - rope_len * <span class="tok-builtin">@sin</span>(th), <span class="tok-num">9</span> - rope_len * <span class="tok-builtin">@cos</span>(th), <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> ball: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = ball_shape,
        .position = bp,
        .motion_type = .dynamic,
        .density = <span class="tok-num">5000.0</span>,
        .friction = <span class="tok-num">0.5</span>,
        .restitution = <span class="tok-num">0.1</span>,
        .material = <span class="tok-num">5</span>,
    });
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createDistanceJoint</span>(world, pivot, ball, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">9</span>, <span class="tok-num">0</span>), bp, rope_len, rope_len);
}

<span class="tok-comment">/// Plinko / Galton board: balls are released one at a time from the top centre (by the</span>
<span class="tok-comment">/// per-step spawner in update) and cascade through a staggered field of frictionless static</span>
<span class="tok-comment">/// pegs into binned slots, building a bell curve. Balls are `plane_2d` so it stays a clean 2D</span>
<span class="tok-comment">/// board; the small drop-point jitter + peg deflections supply the distribution. Frictionless</span>
<span class="tok-comment">/// pegs (restitution 0.30) keep balls sliding off rather than balancing on top (no jams).</span>
<span class="tok-comment">/// Headless-proven: 36 balls all reach the bins (zero field-jams), centre bins outweigh edges,</span>
<span class="tok-comment">/// distribution centred (meanX ~0).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">scenePlinko</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    state.plinko_phys_steps = <span class="tok-num">0</span>;
    state.plinko_spawned = <span class="tok-num">0</span>;
    state.plinko_seed = <span class="tok-num">777</span>;

    <span class="tok-kw">const</span> dx: f32 = <span class="tok-num">1.4</span>;
    <span class="tok-kw">const</span> dy: f32 = <span class="tok-num">1.1</span>;
    <span class="tok-kw">const</span> rows: usize = <span class="tok-num">6</span>;
    <span class="tok-kw">const</span> y_top: f32 = <span class="tok-num">11.0</span>;
    <span class="tok-kw">const</span> half: f32 = <span class="tok-num">6.5</span>;

    <span class="tok-kw">const</span> floor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(half + <span class="tok-num">1</span>, <span class="tok-num">0.5</span>, <span class="tok-num">2</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = floor_shape, .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.5</span>, <span class="tok-num">0</span>), .motion_type = .static });
    <span class="tok-kw">const</span> wall_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.3</span>, <span class="tok-num">7</span>, <span class="tok-num">2</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = wall_shape, .position = <span class="tok-fn">vec</span>(-half, <span class="tok-num">6</span>, <span class="tok-num">0</span>), .motion_type = .static });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = wall_shape, .position = <span class="tok-fn">vec</span>(half, <span class="tok-num">6</span>, <span class="tok-num">0</span>), .motion_type = .static });

    <span class="tok-kw">const</span> peg_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.25</span> } });
    <span class="tok-kw">var</span> row: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (row &lt; rows) : (row += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> py: f32 = y_top - <span class="tok-fn">float</span>(row) * dy;
        <span class="tok-kw">const</span> odd: bool = (row % <span class="tok-num">2</span> == <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> ncols: usize = <span class="tok-kw">if</span> (odd) <span class="tok-num">8</span> <span class="tok-kw">else</span> <span class="tok-num">9</span>;
        <span class="tok-kw">var</span> col: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (col &lt; ncols) : (col += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> px: f32 = (<span class="tok-fn">float</span>(col) - <span class="tok-num">4.0</span>) * dx;
            <span class="tok-kw">if</span> (odd) {
                px += dx / <span class="tok-num">2.0</span>;
            }
            <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(px) &gt; half - <span class="tok-num">0.4</span>) {
                <span class="tok-kw">continue</span>;
            }
            _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
                .shape = peg_shape,
                .position = <span class="tok-fn">vec</span>(px, py, <span class="tok-num">0</span>),
                .motion_type = .static,
                .friction = <span class="tok-num">0.0</span>,
                .restitution = <span class="tok-num">0.30</span>,
                .material = <span class="tok-num">4</span>, <span class="tok-comment">// distinct peg colour</span>
            });
        }
    }

    <span class="tok-kw">const</span> div_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.08</span>, <span class="tok-num">1.3</span>, <span class="tok-num">2</span>),
        .convex_radius = <span class="tok-num">0.01</span>,
    } });
    <span class="tok-kw">var</span> b: i32 = -<span class="tok-num">4</span>;
    <span class="tok-kw">while</span> (b &lt;= <span class="tok-num">5</span>) : (b += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> dxpos: f32 = (<span class="tok-fn">float</span>(b) - <span class="tok-num">0.5</span>) * dx;
        <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(dxpos) &gt; half) {
            <span class="tok-kw">continue</span>;
        }
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = div_shape, .position = <span class="tok-fn">vec</span>(dxpos, <span class="tok-num">1.3</span>, <span class="tok-num">0</span>), .motion_type = .static });
    }

    <span class="tok-comment">// The balls are released over time by spawnPlinkoBall (update loop).</span>
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.25</span> } });
}

<span class="tok-comment">/// Rube Goldberg chain reaction (Wave-J flagship). A CCD marble rolls down a ramp,</span>
<span class="tok-comment">/// bowls into a line of six dominoes that topple in sequence; the last domino shoves</span>
<span class="tok-comment">/// a heavy ball off a ledge; the ball drops onto an angled chute that funnels it into</span>
<span class="tok-comment">/// a catch bin. One self-running spectacle exercising CCD (`motion_quality =</span>
<span class="tok-comment">/// .linear_cast`) * a ramp * stacking + friction (dominoes) * restitution * a chute +</span>
<span class="tok-comment">/// bin. Gravity-driven end to end (no motors), so it replays identically on Reset.</span>
<span class="tok-comment">/// Headless-proven: marble rolls, 6/6 dominoes fall, ball settles in the bin</span>
<span class="tok-comment">/// (x ~17.8, y ~-2.9), nothing goes non-finite.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneRubeGoldberg</span>(world: *zp.World, gpa: Allocator) !void {
    world.settings.allow_sleeping = false;

    <span class="tok-comment">// Upper floor - ends at x=10 to make the ledge the ball gets shoved off.</span>
    <span class="tok-kw">const</span> floor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">7</span>, <span class="tok-num">0.5</span>, <span class="tok-num">2</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = floor_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">3</span>, -<span class="tok-num">0.5</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">0.5</span>,
    });

    <span class="tok-comment">// Ramp: half-length 3 along local X, tilted -28 deg, sloping down to the right.</span>
    <span class="tok-kw">const</span> ramp_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">3</span>, <span class="tok-num">0.2</span>, <span class="tok-num">1.5</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = ramp_shape,
        .position = <span class="tok-fn">vec</span>(-<span class="tok-num">0.65</span>, <span class="tok-num">1.71</span>, <span class="tok-num">0</span>),
        .rotation = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), -<span class="tok-num">0.4887</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">0.15</span>,
    });

    <span class="tok-comment">// CCD marble at the top of the ramp (linear_cast so a fast roll can't tunnel).</span>
    <span class="tok-kw">const</span> marble_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.32</span> } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = marble_shape,
        .position = <span class="tok-fn">vec</span>(-<span class="tok-num">2.8</span>, <span class="tok-num">3.5</span>, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">1200</span>,
        .friction = <span class="tok-num">0.3</span>,
        .restitution = <span class="tok-num">0.05</span>,
        .motion_quality = .linear_cast,
        .material = <span class="tok-num">1</span>,
    });

    <span class="tok-comment">// Six dominoes - thin, tall, light; spaced so each topples into the next.</span>
    <span class="tok-kw">const</span> dom_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.08</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.5</span>),
        .convex_radius = <span class="tok-num">0.01</span>,
    } });
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">6</span>) |i| {
        <span class="tok-kw">const</span> x: f32 = <span class="tok-num">3.3</span> + <span class="tok-fn">float</span>(i) * <span class="tok-num">1.2</span>;
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = dom_shape,
            .position = <span class="tok-fn">vec</span>(x, <span class="tok-num">1.0</span>, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .density = <span class="tok-num">120</span>,
            .friction = <span class="tok-num">0.4</span>,
            .restitution = <span class="tok-num">0.0</span>,
            .material = <span class="tok-builtin">@intCast</span>(i % <span class="tok-num">5</span> + <span class="tok-num">2</span>),
        });
    }

    <span class="tok-comment">// Trigger ball at the ledge edge - the last domino shoves it off.</span>
    <span class="tok-kw">const</span> tball_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.3</span> } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = tball_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">9.9</span>, <span class="tok-num">0.35</span>, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">800</span>,
        .friction = <span class="tok-num">0.3</span>,
        .restitution = <span class="tok-num">0.1</span>,
        .motion_quality = .linear_cast,
        .material = <span class="tok-num">4</span>,
    });

    <span class="tok-comment">// Angled chute that funnels the fallen ball down into the bin.</span>
    <span class="tok-kw">const</span> chute_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">3.0</span>, <span class="tok-num">0.15</span>, <span class="tok-num">0.8</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = chute_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">12.2</span>, -<span class="tok-num">1.7</span>, <span class="tok-num">0</span>),
        .rotation = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), -<span class="tok-num">0.32</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">0.25</span>,
    });

    <span class="tok-comment">// Catch bin: a floor + a right wall.</span>
    <span class="tok-kw">const</span> bin_floor: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">2.5</span>, <span class="tok-num">0.3</span>, <span class="tok-num">1</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = bin_floor,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">16</span>, -<span class="tok-num">3.5</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">0.6</span>,
    });
    <span class="tok-kw">const</span> bin_wall: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.2</span>, <span class="tok-num">1.2</span>, <span class="tok-num">1</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = bin_wall, .position = <span class="tok-fn">vec</span>(<span class="tok-num">18.3</span>, -<span class="tok-num">2.6</span>, <span class="tok-num">0</span>), .motion_type = .static });
}

<span class="tok-comment">/// Tumbler (Wave-J showcase). A hexagonal drum - six tangential wall boxes welded into</span>
<span class="tok-comment">/// one compound body - spins on a velocity-motored hinge while a load of balls tumbles</span>
<span class="tok-comment">/// inside. Shows a powered hinge motor, a compound shape used as a moving container, and</span>
<span class="tok-comment">/// many-body contact, all contained so nothing can escape. Headless-proven: 15/15 balls</span>
<span class="tok-comment">/// stay inside, drum holds 1.3 rad/s, balls tumble (avg speed ~1.5), zero z-drift.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneTumbler</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    <span class="tok-kw">const</span> grp: u16 = <span class="tok-num">4</span>;
    <span class="tok-kw">const</span> center: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">3</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> radius: f32 = <span class="tok-num">2.5</span>;
    <span class="tok-comment">// Hexagonal drum: six tangential wall boxes posed around the centre as one compound.</span>
    <span class="tok-kw">const</span> wall: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.12</span>, <span class="tok-num">1.5</span>, <span class="tok-num">1.2</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">var</span> children: [<span class="tok-num">6</span>]zp.CompoundChild = undefined;
    <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (k &lt; <span class="tok-num">6</span>) : (k += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> th: f32 = <span class="tok-fn">float</span>(k) * pi / <span class="tok-num">3.0</span>;
        children[k] = .{
            .shape = wall,
            .local_pos = <span class="tok-fn">vec</span>(radius * <span class="tok-builtin">@cos</span>(th), radius * <span class="tok-builtin">@sin</span>(th), <span class="tok-num">0</span>),
            .local_rot = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), th),
        };
    }
    <span class="tok-kw">const</span> drum_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addCompound</span>(gpa, &amp;children);
    <span class="tok-kw">const</span> hub_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.1</span>, <span class="tok-num">0.1</span>, <span class="tok-num">0.1</span>),
        .convex_radius = <span class="tok-num">0.01</span>,
    } });
    <span class="tok-kw">const</span> hub: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = hub_shape,
        .position = center,
        .motion_type = .static,
        .group_id = grp,
    });
    <span class="tok-kw">const</span> drum: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = drum_shape,
        .position = center,
        .motion_type = .dynamic,
        .density = <span class="tok-num">200</span>,
        .friction = <span class="tok-num">0.8</span>,
        .group_id = grp,
    });
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createRevoluteJoint</span>(world, hub, drum, .{
        .anchor = center,
        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
        .motor = .{ .mode = .velocity, .target_velocity = <span class="tok-num">1.3</span>, .max_force = <span class="tok-num">1.0e7</span> },
    });
    <span class="tok-comment">// A load of balls tumbling inside (varied materials for colour).</span>
    <span class="tok-kw">const</span> ball: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.3</span> } });
    state.launch_shape = ball;
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> gy: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (gy &lt; <span class="tok-num">3</span>) : (gy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> gx: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (gx &lt; <span class="tok-num">5</span>) : (gx += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (n &gt;= <span class="tok-num">15</span>) {
                <span class="tok-kw">break</span>;
            }
            _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
                .shape = ball,
                .position = center + <span class="tok-fn">vec</span>((gx - <span class="tok-num">2</span>) * <span class="tok-num">0.7</span>, (gy - <span class="tok-num">1</span>) * <span class="tok-num">0.7</span> - <span class="tok-num">0.5</span>, <span class="tok-num">0</span>),
                .motion_type = .dynamic,
                .density = <span class="tok-num">500</span>,
                .friction = <span class="tok-num">0.5</span>,
                .restitution = <span class="tok-num">0.1</span>,
                .material = <span class="tok-builtin">@intCast</span>(n % <span class="tok-num">6</span> + <span class="tok-num">1</span>),
            });
            n += <span class="tok-num">1</span>;
        }
    }
}

<span class="tok-comment">/// Contact listener for the conveyor scene: drive any marble touching the belt along</span>
<span class="tok-comment">/// the belt surface. The belt is the lower body index, so it is `a` in a belt-vs-marble</span>
<span class="tok-comment">/// pair and we negate the carry direction (set the relative surface velocity v_a - v_b).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">conveyorContact</span>(
    cptr: ?*anyopaque,
    _: *<span class="tok-kw">const</span> zp.World,
    a: zp.BodyIndex,
    b: zp.BodyIndex,
    _: u32,
    _: *<span class="tok-kw">const</span> zp.Manifold,
    settings: *zp.ContactSettings,
) void {
    <span class="tok-kw">const</span> cc: *<span class="tok-kw">const</span> ConveyorCtx = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(cptr.?));
    <span class="tok-kw">if</span> (a == cc.belt) {
        settings.relative_linear_surface_velocity = <span class="tok-fn">vec</span>(-cc.speed, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (b == cc.belt) {
        settings.relative_linear_surface_velocity = <span class="tok-fn">vec</span>(cc.speed, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    }
}

<span class="tok-comment">/// Conveyor (Wave-J showcase). A flat belt - a static box whose contact friction is given</span>
<span class="tok-comment">/// a surface velocity by `conveyorContact` - carries a stream of marbles from a feed point</span>
<span class="tok-comment">/// on the left into a walled catch bin on the right. Shows Jolt-style contact-surface</span>
<span class="tok-comment">/// velocity (the conveyor-belt feature). Reliable BY CONTAINMENT: a left back-stop plus a</span>
<span class="tok-comment">/// walled bin (left wall just below the drop-off) mean a marble cannot escape even if it is</span>
<span class="tok-comment">/// jostled. Headless-proven: 16/16 marbles ride across and stay in the bin, zero z-drift.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneConveyor</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    <span class="tok-comment">// Flat belt driving +X; the contact listener reads conveyor_ctx each step.</span>
    <span class="tok-kw">const</span> belt_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">5</span>, <span class="tok-num">0.15</span>, <span class="tok-num">1.3</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> belt: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = belt_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">1.0</span>,
    });
    state.conveyor_ctx = .{ .belt = belt.<span class="tok-fn">index</span>(), .speed = <span class="tok-num">5.0</span> };
    world.contact_listener = .{
        .context = &amp;state.conveyor_ctx,
        .on_contact_added = conveyorContact,
        .on_contact_persisted = conveyorContact,
    };
    <span class="tok-comment">// Left back-stop so a freshly dropped marble can't drift off the feed end.</span>
    <span class="tok-kw">const</span> lstop: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.2</span>, <span class="tok-num">1.5</span>, <span class="tok-num">1.3</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = lstop, .position = <span class="tok-fn">vec</span>(-<span class="tok-num">5.2</span>, <span class="tok-num">3.0</span>, <span class="tok-num">0</span>), .motion_type = .static });
    <span class="tok-comment">// Walled catch bin: floor + left wall (top just below the drop-off) + right wall, so</span>
    <span class="tok-comment">// marbles fall in over the left wall but cannot be knocked back out onto the belt.</span>
    <span class="tok-kw">const</span> bin_floor: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">2.25</span>, <span class="tok-num">0.3</span>, <span class="tok-num">1.3</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = bin_floor,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">7.25</span>, -<span class="tok-num">1.3</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">0.6</span>,
    });
    <span class="tok-kw">const</span> bin_wall: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.15</span>, <span class="tok-num">1.25</span>, <span class="tok-num">1.3</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = bin_wall, .position = <span class="tok-fn">vec</span>(<span class="tok-num">5.0</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0</span>), .motion_type = .static });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{ .shape = bin_wall, .position = <span class="tok-fn">vec</span>(<span class="tok-num">9.5</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0</span>), .motion_type = .static });
    <span class="tok-comment">// Marble shape (also the tap-launch shape); the stream is released by spawnConveyorMarble.</span>
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.28</span> } });
    state.conveyor_steps = <span class="tok-num">0</span>;
    state.conveyor_spawned = <span class="tok-num">0</span>;
}

<span class="tok-comment">/// Clockwork (Wave-J showcase). A five-gear train of alternating sizes (so each gear spins</span>
<span class="tok-comment">/// at a visibly different rate and adjacent gears counter-rotate) is driven by a velocity</span>
<span class="tok-comment">/// motor on the first gear; the last gear drives a VERTICAL rack (a piston tangent to its</span>
<span class="tok-comment">/// right edge) via rack-and-pinion. The drive reverses whenever the rack reaches the end of</span>
<span class="tok-comment">/// its travel, so the whole machine reciprocates forever. Combines a powered hinge motor, a</span>
<span class="tok-comment">/// gear train (pure velocity coupling), and rack-and-pinion (the coupling holds the rack's</span>
<span class="tok-comment">/// weight against gravity along its slide axis). Headless-proven: each gear holds w0*r0/r_i</span>
<span class="tok-comment">/// (alternating sign), the rack reciprocates ~2 units about its home height, nothing NaNs.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneClockwork</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    <span class="tok-kw">const</span> grp: u16 = <span class="tok-num">7</span>;
    <span class="tok-kw">const</span> radii = [_]f32{ <span class="tok-num">0.6</span>, <span class="tok-num">1.3</span>, <span class="tok-num">0.5</span>, <span class="tok-num">1.1</span>, <span class="tok-num">0.7</span> };
    <span class="tok-kw">const</span> w0: f32 = <span class="tok-num">2.5</span>;
    <span class="tok-kw">const</span> gy: f32 = <span class="tok-num">3.0</span>;
    <span class="tok-kw">const</span> face_z: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), pi * <span class="tok-num">0.5</span>);
    <span class="tok-kw">const</span> qid: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">0.0</span>);
    <span class="tok-kw">const</span> hub: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.12</span> } });
    <span class="tok-comment">// Centre the train: the centres span the sum of adjacent radius pairs.</span>
    <span class="tok-kw">var</span> span: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> s: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (s + <span class="tok-num">1</span> &lt; radii.len) : (s += <span class="tok-num">1</span>) {
        span += radii[s] + radii[s + <span class="tok-num">1</span>];
    }
    <span class="tok-kw">var</span> cx: f32 = -span * <span class="tok-num">0.5</span>;
    <span class="tok-kw">var</span> prev_idx: zp.BodyHandle = .nil;
    <span class="tok-kw">var</span> prev_r: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> last_gear: zp.BodyHandle = .nil;
    <span class="tok-kw">var</span> last_cx: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; radii.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> r: f32 = radii[i];
        <span class="tok-kw">if</span> (i &gt; <span class="tok-num">0</span>) {
            cx += prev_r + r; <span class="tok-comment">// place so the disks mesh (centres = sum of radii)</span>
        }
        <span class="tok-kw">const</span> disk: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
            .cylinder = .{ .half_height = <span class="tok-num">0.18</span>, .radius = r, .convex_radius = <span class="tok-num">0.03</span> },
        });
        <span class="tok-kw">const</span> spoke: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
            .box = .{ .half_extent = <span class="tok-fn">vec</span>(r * <span class="tok-num">0.96</span>, <span class="tok-num">0.11</span>, <span class="tok-num">0.30</span>), .convex_radius = <span class="tok-num">0.02</span> },
        });
        <span class="tok-kw">const</span> gear_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addCompound</span>(gpa, &amp;.{
            .{ .shape = disk, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = face_z },
            .{ .shape = spoke, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = qid },
        });
        <span class="tok-kw">const</span> hub_idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = hub,
            .position = <span class="tok-fn">vec</span>(cx, gy, <span class="tok-num">0</span>),
            .motion_type = .static,
            .group_id = grp,
        });
        <span class="tok-kw">const</span> gear_idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = gear_shape,
            .position = <span class="tok-fn">vec</span>(cx, gy, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .density = <span class="tok-num">100.0</span>,
            .group_id = grp,
            .material = <span class="tok-builtin">@intCast</span>(i % <span class="tok-num">6</span> + <span class="tok-num">1</span>),
        });
        <span class="tok-kw">const</span> motor: zp.MotorSettings = <span class="tok-kw">if</span> (i == <span class="tok-num">0</span>)
            .{ .mode = .velocity, .target_velocity = w0, .max_force = <span class="tok-num">1.0e7</span> }
        <span class="tok-kw">else</span>
            .{};
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createRevoluteJoint</span>(world, hub_idx, gear_idx, .{
            .anchor = <span class="tok-fn">vec</span>(cx, gy, <span class="tok-num">0</span>),
            .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
            .motor = motor,
        });
        <span class="tok-kw">if</span> (i == <span class="tok-num">0</span>) {
            state.clockwork_motor = world.constraints.items.len - <span class="tok-num">1</span>;
        }
        <span class="tok-kw">if</span> (i &gt; <span class="tok-num">0</span>) {
            <span class="tok-comment">// ratio = r_this / r_prev: equal surface speed at the mesh, opposite sense.</span>
            <span class="tok-kw">try</span> zp.<span class="tok-fn">createGearJoint</span>(world, prev_idx, gear_idx, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), r / prev_r, -<span class="tok-num">1</span>, -<span class="tok-num">1</span>);
        }
        prev_idx = gear_idx;
        prev_r = r;
        last_gear = gear_idx;
        last_cx = cx;
    }
    <span class="tok-comment">// The last gear drives a VERTICAL rack tangent to its right edge (a piston that</span>
    <span class="tok-comment">// slides up and down), so the rack never crosses the other gears.</span>
    <span class="tok-kw">const</span> r_last: f32 = radii[radii.len - <span class="tok-num">1</span>];
    <span class="tok-kw">const</span> rack_x: f32 = last_cx + r_last + <span class="tok-num">0.1</span>;
    <span class="tok-kw">const</span> rail: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.1</span>, <span class="tok-num">0.1</span>, <span class="tok-num">0.1</span>),
        .convex_radius = <span class="tok-num">0.01</span>,
    } });
    <span class="tok-kw">const</span> rack_rail: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = rail,
        .position = <span class="tok-fn">vec</span>(rack_x, gy, <span class="tok-num">0</span>),
        .motion_type = .static,
        .group_id = grp,
    });
    <span class="tok-kw">const</span> rack_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.18</span>, <span class="tok-num">1.5</span>, <span class="tok-num">0.25</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> rack: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = rack_shape,
        .position = <span class="tok-fn">vec</span>(rack_x, gy, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">60.0</span>,
        .group_id = grp,
        .material = <span class="tok-num">4</span>,
    });
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createPrismaticJoint</span>(world, rack_rail, rack, .{
        .anchor = <span class="tok-fn">vec</span>(rack_x, gy, <span class="tok-num">0</span>),
        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
    });
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createRackAndPinionJoint</span>(world, last_gear, rack, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">1.0</span> / r_last, -<span class="tok-num">1</span>, -<span class="tok-num">1</span>);
    state.clockwork_rack = rack;
    state.clockwork_home = gy;
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.3</span> } });
}

<span class="tok-comment">/// The four collision-stable shapes the stirrer rains in. tapered_capsule and convex_hull are</span>
<span class="tok-comment">/// excluded on purpose - both NaN under heavy crowding (see sceneStirrer).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">stirrerObjectShape</span>(world: *zp.World, gpa: Allocator, kind: usize) !zp.ShapeId {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (kind) {
        <span class="tok-num">0</span> =&gt; <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.3</span> } }),
        <span class="tok-num">1</span> =&gt; <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.24</span>, <span class="tok-num">0.24</span>, <span class="tok-num">0.24</span>), .convex_radius = <span class="tok-num">0.12</span> } }),
        <span class="tok-num">2</span> =&gt; <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .cylinder = .{
            .half_height = <span class="tok-num">0.28</span>,
            .radius = <span class="tok-num">0.26</span>,
            .convex_radius = <span class="tok-num">0.12</span>,
        } }),
        <span class="tok-kw">else</span> =&gt; <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .capsule = .{ .half_height = <span class="tok-num">0.26</span>, .radius = <span class="tok-num">0.22</span> } }),
    };
}

<span class="tok-comment">/// Stirrer (Wave-J showcase). A near-full-width four-blade rotor spins about a VERTICAL axis</span>
<span class="tok-comment">/// inside a ROUND bowl, vigorously steering a deep load of 36 mixed-shape objects (spheres,</span>
<span class="tok-comment">/// cubes, cylinders, capsules) around the wall. The rotor is driven by a swing-twist TWIST</span>
<span class="tok-comment">/// motor (the powered ragdoll joint, used here as a continuous drive) with a tight cone so it</span>
<span class="tok-comment">/// only spins, never tilts - the one constraint the showcase hadn't exercised under power.</span>
<span class="tok-comment">/// Two things make a big rotor stable here: (1) a ROUND wall (32 tangent segments) so the</span>
<span class="tok-comment">/// blade tip shoves objects ALONG the wall (they orbit) instead of wedging them into a flat</span>
<span class="tok-comment">/// corner; (2) FAT convex radius on the cubes/cylinders so deep contacts resolve via GJK</span>
<span class="tok-comment">/// before the EPA degeneracy (flat-face deep penetration -&gt; NaN) trips. tapered_capsule and</span>
<span class="tok-comment">/// convex_hull are still excluded (they NaN under crowding regardless). Objects rain in from</span>
<span class="tok-comment">/// above so none spawn inside the blades. Headless-proven: 36/36 stay in, churn ~2.9 m/s,</span>
<span class="tok-comment">/// finite over 7200 steps (120 s).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneStirrer</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    <span class="tok-kw">const</span> grp: u16 = <span class="tok-num">3</span>;
    <span class="tok-kw">const</span> center: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1.15</span>, <span class="tok-num">0</span>);
    <span class="tok-comment">// Static bowl: a big floor + a ROUND wall of tangent segments. A curved wall is what lets</span>
    <span class="tok-comment">// the near-full-width rotor work: the blade tip moves tangentially, so it shoves objects</span>
    <span class="tok-comment">// ALONG the wall (they orbit) instead of wedging them into a flat corner. Flat walls</span>
    <span class="tok-comment">// wedge box/cylinder shapes into deep penetration and trip the EPA degeneracy (NaN).</span>
    <span class="tok-kw">const</span> floor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">3.2</span>, <span class="tok-num">0.3</span>, <span class="tok-num">3.2</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = floor_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">0.5</span>,
    });
    <span class="tok-kw">const</span> r_wall: f32 = <span class="tok-num">2.7</span>;
    <span class="tok-kw">const</span> seg_count: usize = <span class="tok-num">32</span>;
