    <span class="tok-kw">const</span> seg_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.35</span>, <span class="tok-num">1.6</span>, <span class="tok-num">0.15</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">var</span> seg: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (seg &lt; seg_count) : (seg += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> phi: f32 = <span class="tok-fn">float</span>(seg) * (<span class="tok-num">2.0</span> * pi / <span class="tok-fn">float</span>(seg_count));
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = seg_shape,
            .position = <span class="tok-fn">vec</span>(r_wall * zm.<span class="tok-fn">cosRad</span>(phi), <span class="tok-num">1.5</span>, r_wall * zm.<span class="tok-fn">sinRad</span>(phi)),
            .rotation = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), -(phi + pi / <span class="tok-num">2.0</span>)),
            .motion_type = .static,
        });
    }
    <span class="tok-comment">// Rotor: a horizontal cross of blades spinning about Y via a swing-twist twist motor.</span>
    <span class="tok-kw">const</span> anchor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.12</span>, <span class="tok-num">0.12</span>, <span class="tok-num">0.12</span>),
        .convex_radius = <span class="tok-num">0.01</span>,
    } });
    <span class="tok-kw">const</span> anchor: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = anchor_shape,
        .position = center,
        .motion_type = .static,
        .group_id = grp,
    });
    <span class="tok-kw">const</span> blade_x: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">2.3</span>, <span class="tok-num">0.32</span>, <span class="tok-num">0.34</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> blade_z: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.34</span>, <span class="tok-num">0.32</span>, <span class="tok-num">2.3</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> rotor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addCompound</span>(gpa, &amp;.{
        .{ .shape = blade_x, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">0</span>) },
        .{ .shape = blade_z, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">0</span>) },
    });
    <span class="tok-kw">const</span> rotor: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = rotor_shape,
        .position = center,
        .motion_type = .dynamic,
        .density = <span class="tok-num">120.0</span>,
        .group_id = grp,
        .material = <span class="tok-num">2</span>,
    });
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createSwingTwistJoint</span>(world, anchor, rotor, .{
        .anchor = center,
        .twist_axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .plane_axis = <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .normal_half_cone = <span class="tok-num">0.05</span>, <span class="tok-comment">// tight cone -&gt; pure spin about Y, no tilt</span>
        .plane_half_cone = <span class="tok-num">0.05</span>,
        .twist_min = -<span class="tok-num">1000.0</span>,
        .twist_max = <span class="tok-num">1000.0</span>,
        .twist_motor = .{ .min_torque = -<span class="tok-num">1.0e7</span>, .max_torque = <span class="tok-num">1.0e7</span> },
    });
    <span class="tok-kw">const</span> con: *zp.Constraint = &amp;world.constraints.items[world.constraints.items.len - <span class="tok-num">1</span>];
    zp.<span class="tok-fn">swingTwistSetTwistMotorState</span>(con, .velocity);
    zp.<span class="tok-fn">swingTwistSetTargetAngularVelocityCS</span>(con, <span class="tok-fn">vec</span>(<span class="tok-num">1.5</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>));
    <span class="tok-comment">// 36 mixed objects (sphere, cube, cylinder, capsule) raining into the bowl from above</span>
    <span class="tok-comment">// the rotor, so nothing spawns overlapping the blades. tapered_capsule and convex_hull</span>
    <span class="tok-comment">// are deliberately excluded: both go non-finite when many are crowded/churned together</span>
    <span class="tok-comment">// (a real collision instability, logged as an open engine item, separate from the</span>
    <span class="tok-comment">// sphere-vs-cylinder deep-penetration note).</span>
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.3</span> } });
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> layer: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (layer &lt; <span class="tok-num">3</span> <span class="tok-kw">and</span> n &lt; <span class="tok-num">36</span>) : (layer += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> oy: f32 = <span class="tok-num">2.2</span> + <span class="tok-fn">float</span>(layer) * <span class="tok-num">0.75</span>;
        <span class="tok-kw">var</span> ix: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (ix &lt; <span class="tok-num">5</span> <span class="tok-kw">and</span> n &lt; <span class="tok-num">36</span>) : (ix += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> iz: usize = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (iz &lt; <span class="tok-num">3</span> <span class="tok-kw">and</span> n &lt; <span class="tok-num">36</span>) : (iz += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> ox: f32 = -<span class="tok-num">1.8</span> + <span class="tok-fn">float</span>(ix) * <span class="tok-num">0.9</span>;
                <span class="tok-kw">const</span> oz: f32 = -<span class="tok-num">1.6</span> + <span class="tok-fn">float</span>(iz) * <span class="tok-num">1.6</span>;
                <span class="tok-kw">const</span> shape: zp.ShapeId = <span class="tok-kw">try</span> <span class="tok-fn">stirrerObjectShape</span>(world, gpa, n % <span class="tok-num">4</span>);
                _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
                    .shape = shape,
                    .position = <span class="tok-fn">vec</span>(ox, oy, oz),
                    .motion_type = .dynamic,
                    .density = <span class="tok-num">400.0</span>,
                    .friction = <span class="tok-num">0.4</span>,
                    .restitution = <span class="tok-num">0.1</span>,
                    .material = <span class="tok-builtin">@intCast</span>(n % <span class="tok-num">6</span> + <span class="tok-num">1</span>),
                });
                n += <span class="tok-num">1</span>;
            }
        }
    }
}

<span class="tok-kw">const</span> RagPart = <span class="tok-kw">struct</span> { hh: f32, r: f32, pos: Vec, horiz: bool };

<span class="tok-kw">const</span> RagJoint = <span class="tok-kw">struct</span> {
    parent: usize,
    child: usize,
    pivot: Vec,
    twist: Vec,
    twist_deg: f32,
    normal_deg: f32,
    plane_deg: f32,
};

<span class="tok-kw">fn</span> <span class="tok-fn">rj</span>(
    parent: usize,
    child: usize,
    pivot: Vec,
    twist: Vec,
    tw: f32,
    n: f32,
    p: f32,
) RagJoint {
    <span class="tok-kw">return</span> .{
        .parent = parent,
        .child = child,
        .pivot = pivot,
        .twist = twist,
        .twist_deg = tw,
        .normal_deg = n,
        .plane_deg = p,
    };
}

<span class="tok-comment">/// Build one Jolt-standard humanoid ragdoll: 12 capsule bones (3 torso segments, head, two</span>
<span class="tok-comment">/// arms of two bones, two legs of two bones) joined by swing-twist constraints with per-joint</span>
<span class="tok-comment">/// cone + twist limits (values taken from Jolt's RagdollLoader). All bones share one collision</span>
<span class="tok-comment">/// group so the ragdoll does not self-collide, but different ragdolls (different groups) do</span>
<span class="tok-comment">/// collide with each other and the ground. The whole body is offset by `off` and given an</span>
<span class="tok-comment">/// initial `shove` so it topples and flops on landing. Headless-proven: 12 bones stay finite,</span>
<span class="tok-comment">/// the joints hold, and the body settles flat on the ground (no explosion).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildRagdoll</span>(
    world: *zp.World,
    gpa: Allocator,
    off: Vec,
    grp: u16,
    shove: Vec,
    scale: f32,
) !void {
    <span class="tok-kw">const</span> parts = [<span class="tok-num">12</span>]RagPart{
        .{ .hh = <span class="tok-num">0.15</span>, .r = <span class="tok-num">0.10</span>, .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1.15</span>, <span class="tok-num">0</span>), .horiz = true },

        .{ .hh = <span class="tok-num">0.2</span>, .r = <span class="tok-num">0.075</span>, .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0.15</span>, <span class="tok-num">0.8</span>, <span class="tok-num">0</span>), .horiz = false },
        .{ .hh = <span class="tok-num">0.2</span>, .r = <span class="tok-num">0.06</span>, .pos = <span class="tok-fn">vec</span>(-<span class="tok-num">0.15</span>, <span class="tok-num">0.3</span>, <span class="tok-num">0</span>), .horiz = false },

    <span class="tok-kw">const</span> z90: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), pi / <span class="tok-num">2.0</span>);

    <span class="tok-kw">const</span> joints = [<span class="tok-num">11</span>]RagJoint{

        <span class="tok-fn">rj</span>(<span class="tok-num">2</span>, <span class="tok-num">3</span>, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1.65</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">90</span>, <span class="tok-num">45</span>, <span class="tok-num">45</span>),
        <span class="tok-fn">rj</span>(<span class="tok-num">2</span>, <span class="tok-num">4</span>, <span class="tok-fn">vec</span>(-<span class="tok-num">0.225</span>, <span class="tok-num">1.55</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(-<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">45</span>, <span class="tok-num">90</span>, <span class="tok-num">45</span>),
        <span class="tok-fn">rj</span>(<span class="tok-num">2</span>, <span class="tok-num">5</span>, <span class="tok-fn">vec</span>(<span class="tok-num">0.225</span>, <span class="tok-num">1.55</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">45</span>, <span class="tok-num">90</span>, <span class="tok-num">45</span>),
        <span class="tok-fn">rj</span>(<span class="tok-num">4</span>, <span class="tok-num">6</span>, <span class="tok-fn">vec</span>(-<span class="tok-num">0.65</span>, <span class="tok-num">1.55</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(-<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">45</span>, <span class="tok-num">0</span>, <span class="tok-num">90</span>),
        <span class="tok-fn">rj</span>(<span class="tok-num">5</span>, <span class="tok-num">7</span>, <span class="tok-fn">vec</span>(<span class="tok-num">0.65</span>, <span class="tok-num">1.55</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">45</span>, <span class="tok-num">0</span>, <span class="tok-num">90</span>),
        <span class="tok-fn">rj</span>(<span class="tok-num">0</span>, <span class="tok-num">8</span>, <span class="tok-fn">vec</span>(-<span class="tok-num">0.15</span>, <span class="tok-num">1.05</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">45</span>, <span class="tok-num">45</span>, <span class="tok-num">45</span>),
        <span class="tok-fn">rj</span>(<span class="tok-num">0</span>, <span class="tok-num">9</span>, <span class="tok-fn">vec</span>(<span class="tok-num">0.15</span>, <span class="tok-num">1.05</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">45</span>, <span class="tok-num">45</span>, <span class="tok-num">45</span>),
        <span class="tok-fn">rj</span>(<span class="tok-num">8</span>, <span class="tok-num">10</span>, <span class="tok-fn">vec</span>(-<span class="tok-num">0.15</span>, <span class="tok-num">0.55</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">45</span>, <span class="tok-num">0</span>, <span class="tok-num">60</span>),
        <span class="tok-fn">rj</span>(<span class="tok-num">9</span>, <span class="tok-num">11</span>, <span class="tok-fn">vec</span>(<span class="tok-num">0.15</span>, <span class="tok-num">0.55</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">45</span>, <span class="tok-num">0</span>, <span class="tok-num">60</span>),
    };
    <span class="tok-kw">for</span> (joints) |j| {
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createSwingTwistJoint</span>(world, bodies[j.parent], bodies[j.child], .{

}

<span class="tok-comment">/// Ragdoll pile (Wave-J showcase). Three Jolt-standard humanoid ragdolls are dropped with a</span>
<span class="tok-comment">/// sideways shove so they topple, collide, and flop into a heap on the ground - the classic</span>
<span class="tok-comment">/// Jolt "Ragdoll" sample. Each is 12 capsule bones joined by 11 swing-twist constraints with</span>
<span class="tok-comment">/// realistic per-joint cone/twist limits (tight spine, hinge-like elbows/knees, wide shoulders</span>
<span class="tok-comment">/// and hips). Tapping Launch fires a ball into the pile to scatter them. Headless-proven: all</span>
<span class="tok-comment">/// 36 bones stay finite, joints hold, the ragdolls settle into a stable pile. Each ragdoll has</span>
<span class="tok-comment">/// its own collision group (no self-collision; different ragdolls and the ground do collide).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneRagdollPile</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = true;
    <span class="tok-kw">const</span> ground: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">20</span>, <span class="tok-num">0.5</span>, <span class="tok-num">20</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = ground,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.5</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">0.7</span>,
    });
    <span class="tok-kw">const</span> offs = [<span class="tok-num">3</span>]Vec{ <span class="tok-fn">vec</span>(-<span class="tok-num">2.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1.6</span>, <span class="tok-num">0.3</span>), <span class="tok-fn">vec</span>(<span class="tok-num">2.0</span>, <span class="tok-num">1.0</span>, -<span class="tok-num">0.2</span>) };
    <span class="tok-kw">const</span> shoves = [<span class="tok-num">3</span>]Vec{ <span class="tok-fn">vec</span>(<span class="tok-num">1.2</span>, <span class="tok-num">0</span>, <span class="tok-num">0.4</span>), <span class="tok-fn">vec</span>(-<span class="tok-num">0.3</span>, <span class="tok-num">0</span>, <span class="tok-num">0.6</span>), <span class="tok-fn">vec</span>(-<span class="tok-num">1.2</span>, <span class="tok-num">0</span>, -<span class="tok-num">0.5</span>) };
    <span class="tok-kw">for</span> (offs, <span class="tok-num">0</span>..) |off, i| {
        <span class="tok-kw">try</span> <span class="tok-fn">buildRagdoll</span>(world, gpa, off, <span class="tok-builtin">@intCast</span>(<span class="tok-num">30</span> + i), shoves[i], <span class="tok-num">1.0</span>);
    }
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.4</span> } });
}

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Mega STRESS scene: one big world combining a spinning blender in a round</span>
<span class="tok-comment">// container with many balls, a Galton board fed 100 balls, a ~100-box pyramid,</span>
<span class="tok-comment">// and a chain pendulum. Built to push the solver - broad/narrow phase plus the</span>
<span class="tok-comment">// velocity/position constraint sweeps - to the limit. Pair with the profiler's</span>
<span class="tok-comment">// Statistics tab (each physics PHASE zone shows where the time goes).</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">fn</span> <span class="tok-fn">stressObjectShape</span>(world: *zp.World, gpa: Allocator, kind: usize) !zp.ShapeId {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (kind % <span class="tok-num">5</span>) {
        <span class="tok-num">0</span> =&gt; <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.45</span> } }),
        <span class="tok-num">1</span> =&gt; <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.42</span>, <span class="tok-num">0.42</span>, <span class="tok-num">0.42</span>), .convex_radius = <span class="tok-num">0.12</span> } }),
        <span class="tok-num">2</span> =&gt; <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">1.0</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0.25</span>), .convex_radius = <span class="tok-num">0.1</span> } }),
        <span class="tok-num">3</span> =&gt; <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .cylinder = .{
            .half_height = <span class="tok-num">0.55</span>,
            .radius = <span class="tok-num">0.38</span>,
            .convex_radius = <span class="tok-num">0.12</span>,
        } }),
        <span class="tok-kw">else</span> =&gt; <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .capsule = .{ .half_height = <span class="tok-num">0.55</span>, .radius = <span class="tok-num">0.32</span> } }),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">stressFloor</span>(world: *zp.World, gpa: Allocator) !void {
    <span class="tok-kw">const</span> floor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">40</span>, <span class="tok-num">0.5</span>, <span class="tok-num">40</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = floor_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.5</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">0.6</span>,
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">stressBlender</span>(world: *zp.World, gpa: Allocator, state: *State, o: Vec) !void {
    <span class="tok-comment">// This mirrors the proven sceneStirrer geometry (curved wall so the rotor tip</span>
    <span class="tok-comment">// shoves objects ALONG the wall, no corner-wedging EPA blow-ups), scaled ~1.3x</span>
    <span class="tok-comment">// to fit three ragdolls, with the same 1.5 rad/s twist motor. The earlier big</span>
    <span class="tok-comment">// version (r_wall 5, blade 4.3) churned hard enough to jitter - this doesn't.</span>
    <span class="tok-kw">const</span> grp: u32 = <span class="tok-num">3</span>;
    <span class="tok-kw">const</span> center: Vec = o + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">3.0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> floor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">8.0</span>, <span class="tok-num">0.3</span>, <span class="tok-num">8.0</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = floor_shape,
        .position = o + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .friction = <span class="tok-num">0.5</span>,
    });
    <span class="tok-kw">const</span> r_wall: f32 = <span class="tok-num">6.5</span>;
    <span class="tok-kw">const</span> seg_count: usize = <span class="tok-num">48</span>;
    <span class="tok-kw">const</span> seg_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.6</span>, <span class="tok-num">3.8</span>, <span class="tok-num">0.18</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">var</span> seg: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (seg &lt; seg_count) : (seg += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> phi: f32 = <span class="tok-fn">float</span>(seg) * (<span class="tok-num">2.0</span> * pi / <span class="tok-fn">float</span>(seg_count));
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = seg_shape,
            .position = o + <span class="tok-fn">vec</span>(r_wall * zm.<span class="tok-fn">cosRad</span>(phi), <span class="tok-num">3.8</span>, r_wall * zm.<span class="tok-fn">sinRad</span>(phi)),
            .rotation = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), -(phi + pi / <span class="tok-num">2.0</span>)),
            .motion_type = .static,
        });
    }
    <span class="tok-kw">const</span> anchor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.12</span>, <span class="tok-num">0.12</span>, <span class="tok-num">0.12</span>),
        .convex_radius = <span class="tok-num">0.01</span>,
    } });
    <span class="tok-kw">const</span> anchor: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = anchor_shape,
        .position = center,
        .motion_type = .static,
        .group_id = grp,
    });
    <span class="tok-kw">const</span> blade_x: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">5.2</span>, <span class="tok-num">1.5</span>, <span class="tok-num">0.5</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> blade_z: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">1.5</span>, <span class="tok-num">5.2</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> rotor_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">addCompound</span>(gpa, &amp;.{
        .{ .shape = blade_x, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">0</span>) },
        .{ .shape = blade_z, .local_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .local_rot = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-num">0</span>) },
    });
    <span class="tok-kw">const</span> rotor: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = rotor_shape,
        .position = center,
        .motion_type = .dynamic,
        .density = <span class="tok-num">120.0</span>,
        .group_id = grp,
        .material = <span class="tok-num">2</span>,

    <span class="tok-comment">// A hinge locks the rotor to pure Y-spin: it geometrically cannot tilt or flip,</span>
    <span class="tok-comment">// unlike the swing-twist cone which only softly limited it and lost the fight when</span>
    <span class="tok-comment">// a ragdoll landed off-centre on a blade. Velocity motor drives the constant spin.</span>

        .anchor = center,
        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .motor = .{ .mode = .velocity, .target_velocity = <span class="tok-num">0.8</span>, .max_force = <span class="tok-num">1.0e7</span> },
    });

    <span class="tok-comment">// 24 mixed objects (spheres, cubes, rods, cylinders, capsules) raining in over</span>
    <span class="tok-comment">// the rotor, then 3 big ragdolls dropped from higher so nothing spawns overlapping.</span>
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.45</span> } });
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> layer: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (layer &lt; <span class="tok-num">3</span> <span class="tok-kw">and</span> n &lt; <span class="tok-num">24</span>) : (layer += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> oy: f32 = <span class="tok-num">5.0</span> + <span class="tok-fn">float</span>(layer) * <span class="tok-num">1.0</span>;
        <span class="tok-kw">var</span> ix: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (ix &lt; <span class="tok-num">4</span> <span class="tok-kw">and</span> n &lt; <span class="tok-num">24</span>) : (ix += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> iz: usize = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (iz &lt; <span class="tok-num">2</span> <span class="tok-kw">and</span> n &lt; <span class="tok-num">24</span>) : (iz += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> ox: f32 = -<span class="tok-num">3.3</span> + <span class="tok-fn">float</span>(ix) * <span class="tok-num">2.2</span>;
                <span class="tok-kw">const</span> oz: f32 = -<span class="tok-num">1.8</span> + <span class="tok-fn">float</span>(iz) * <span class="tok-num">3.6</span>;
                <span class="tok-kw">const</span> shape: zp.ShapeId = <span class="tok-kw">try</span> <span class="tok-fn">stressObjectShape</span>(world, gpa, n);
                _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
                    .shape = shape,
                    .position = o + <span class="tok-fn">vec</span>(ox, oy, oz),
                    .motion_type = .dynamic,
                    .density = <span class="tok-num">400.0</span>,
                    .friction = <span class="tok-num">0.4</span>,
                    .restitution = <span class="tok-num">0.1</span>,
                    .material = <span class="tok-builtin">@intCast</span>(n % <span class="tok-num">6</span> + <span class="tok-num">1</span>),
                });
                n += <span class="tok-num">1</span>;
            }
        }
    }
    <span class="tok-kw">const</span> rag_off = [<span class="tok-num">3</span>]Vec{ <span class="tok-fn">vec</span>(-<span class="tok-num">2.6</span>, <span class="tok-num">8.0</span>, <span class="tok-num">1.0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">2.6</span>, <span class="tok-num">9.5</span>, -<span class="tok-num">1.2</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0.3</span>, <span class="tok-num">11.0</span>, <span class="tok-num">1.8</span>) };
    <span class="tok-kw">const</span> rag_shove = [<span class="tok-num">3</span>]Vec{ <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0</span>, <span class="tok-num">0.3</span>), <span class="tok-fn">vec</span>(-<span class="tok-num">0.4</span>, <span class="tok-num">0</span>, <span class="tok-num">0.4</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0.2</span>, <span class="tok-num">0</span>, -<span class="tok-num">0.5</span>) };
    <span class="tok-kw">var</span> ri: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (ri &lt; <span class="tok-num">3</span>) : (ri += <span class="tok-num">1</span>) {
        <span class="tok-kw">try</span> <span class="tok-fn">buildRagdoll</span>(world, gpa, o + rag_off[ri], <span class="tok-builtin">@intCast</span>(<span class="tok-num">40</span> + ri), rag_shove[ri], <span class="tok-num">3.0</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">stressGalton</span>(world: *zp.World, gpa: Allocator, o: Vec, state: *State) !void {
    <span class="tok-kw">const</span> half: f32 = <span class="tok-num">6.5</span>;
    <span class="tok-kw">const</span> wall_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.3</span>, <span class="tok-num">9</span>, <span class="tok-num">1.0</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> glass: u16 = render.invisible_material;
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = wall_shape,
        .position = o + <span class="tok-fn">vec</span>(-half, <span class="tok-num">9</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .material = glass,
    });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = wall_shape,
        .position = o + <span class="tok-fn">vec</span>(half, <span class="tok-num">9</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .material = glass,
    });
    <span class="tok-kw">const</span> back_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(half + <span class="tok-num">0.5</span>, <span class="tok-num">9</span>, <span class="tok-num">0.3</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = back_shape,
        .position = o + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">9</span>, <span class="tok-num">0.95</span>),
        .motion_type = .static,
        .material = glass,
    });
    _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = back_shape,
        .position = o + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">9</span>, -<span class="tok-num">0.95</span>),
        .motion_type = .static,
        .material = glass,
    });

    <span class="tok-comment">// Pegs: cylinders lying along Z (rotate Y-&gt;Z) so a round face meets each ball</span>
    <span class="tok-comment">// in the X-Y drop plane, like a real Galton board.</span>
    <span class="tok-kw">const</span> peg_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .cylinder = .{
        .half_height = <span class="tok-num">0.85</span>,
        .radius = <span class="tok-num">0.25</span>,
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> peg_rot: zm.Quat = <span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), pi / <span class="tok-num">2.0</span>);
    <span class="tok-kw">const</span> dx: f32 = <span class="tok-num">1.4</span>;
    <span class="tok-kw">const</span> dy: f32 = <span class="tok-num">1.1</span>;
    <span class="tok-kw">const</span> y_top: f32 = <span class="tok-num">13.0</span>;
    <span class="tok-kw">var</span> row: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (row &lt; <span class="tok-num">8</span>) : (row += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> py: f32 = y_top - <span class="tok-fn">float</span>(row) * dy;
        <span class="tok-kw">const</span> odd: bool = (row % <span class="tok-num">2</span> == <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> ncols: usize = <span class="tok-kw">if</span> (odd) <span class="tok-num">8</span> <span class="tok-kw">else</span> <span class="tok-num">9</span>;
        <span class="tok-kw">var</span> col: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (col &lt; ncols) : (col += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> px: f32 = (<span class="tok-fn">float</span>(col) - <span class="tok-num">4.0</span>) * dx;
            <span class="tok-kw">if</span> (odd) {
                px += dx / <span class="tok-num">2.0</span>;
            }
            <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(px) &gt; half - <span class="tok-num">0.4</span>) {
                <span class="tok-kw">continue</span>;
            }
            _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
                .shape = peg_shape,
                .position = o + <span class="tok-fn">vec</span>(px, py, <span class="tok-num">0</span>),
                .rotation = peg_rot,
                .motion_type = .static,
                .friction = <span class="tok-num">0.0</span>,
                .restitution = <span class="tok-num">0.30</span>,
                .material = <span class="tok-num">4</span>,
            });
        }
    }
    <span class="tok-comment">// Visible collecting bins at the bottom: thin vertical dividers so the balls</span>
    <span class="tok-comment">// pile up in columns and the bell curve is legible.</span>
    <span class="tok-kw">const</span> div_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.1</span>, <span class="tok-num">2.0</span>, <span class="tok-num">0.95</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">var</span> d: i32 = -<span class="tok-num">5</span>;
    <span class="tok-kw">while</span> (d &lt;= <span class="tok-num">5</span>) : (d += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> dxpos: f32 = <span class="tok-fn">float</span>(d) * <span class="tok-num">1.3</span>;
        _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = div_shape,
            .position = o + <span class="tok-fn">vec</span>(dxpos, <span class="tok-num">2.0</span>, <span class="tok-num">0</span>),
            .motion_type = .static,
            .material = <span class="tok-num">5</span>,
        });
    }
    <span class="tok-comment">// Balls sized so their diameter is ~half the board's (thin) width. They are</span>
    <span class="tok-comment">// released ONE AT A TIME from the middle by spawnStressGaltonBall (update loop),</span>
    <span class="tok-comment">// so they stream through the pegs like a real Galton board.</span>
    state.galton_ball = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.225</span> } });
    state.galton_origin = o;
    state.galton_y_top = y_top;
    state.plinko_phys_steps = <span class="tok-num">0</span>;
    state.plinko_spawned = <span class="tok-num">0</span>;
    state.plinko_seed = <span class="tok-num">24681</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">stressPyramid</span>(world: *zp.World, gpa: Allocator, o: Vec) !void {
    <span class="tok-kw">const</span> box: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>),
        .convex_radius = <span class="tok-num">0.05</span>,
    } });
    <span class="tok-kw">const</span> base: u32 = <span class="tok-num">6</span>;
    <span class="tok-kw">var</span> count: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> mat: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> layer: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (layer &lt; base <span class="tok-kw">and</span> count &lt; <span class="tok-num">1000</span>) : (layer += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> ncells: u32 = base - layer;
        <span class="tok-kw">const</span> y: f32 = <span class="tok-num">0.55</span> + <span class="tok-fn">float</span>(layer) * <span class="tok-num">1.01</span>;
        <span class="tok-kw">const</span> offc: f32 = <span class="tok-fn">float</span>(ncells - <span class="tok-num">1</span>) * <span class="tok-num">0.5</span>;
        <span class="tok-kw">var</span> j: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (j &lt; ncells <span class="tok-kw">and</span> count &lt; <span class="tok-num">1000</span>) : (j += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> k: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (k &lt; ncells <span class="tok-kw">and</span> count &lt; <span class="tok-num">1000</span>) : (k += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> px: f32 = (<span class="tok-fn">float</span>(j) - offc) * <span class="tok-num">1.02</span>;
                <span class="tok-kw">const</span> pz: f32 = (<span class="tok-fn">float</span>(k) - offc) * <span class="tok-num">1.02</span>;
                _ = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
                    .shape = box,
                    .position = o + <span class="tok-fn">vec</span>(px, y, pz),
                    .motion_type = .dynamic,
                    .friction = <span class="tok-num">0.8</span>,
                    .material = <span class="tok-builtin">@intCast</span>(mat % <span class="tok-num">6</span>),
                });
                mat += <span class="tok-num">1</span>;
                count += <span class="tok-num">1</span>;
            }
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">stressChain</span>(world: *zp.World, gpa: Allocator, o: Vec) !void {
    <span class="tok-comment">// A motorized arm spins about Y; the chain hangs from the arm's END, so the</span>
    <span class="tok-comment">// attachment point orbits and the chain+bob are dragged around forever (a</span>
    <span class="tok-comment">// tetherball / centrifuge) instead of swinging once and damping out.</span>
    <span class="tok-kw">const</span> top_y: f32 = <span class="tok-num">13.0</span>;
    <span class="tok-kw">const</span> arm_len: f32 = <span class="tok-num">3.5</span>;
    <span class="tok-kw">const</span> hub_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.35</span>, <span class="tok-num">0.35</span>, <span class="tok-num">0.35</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> hub: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = hub_shape,
        .position = o + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, top_y, <span class="tok-num">0</span>),
        .motion_type = .static,
        .group_id = link_group,
    });
    <span class="tok-kw">const</span> arm_shape: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .box = .{
        .half_extent = <span class="tok-fn">vec</span>(arm_len, <span class="tok-num">0.22</span>, <span class="tok-num">0.22</span>),
        .convex_radius = <span class="tok-num">0.02</span>,
    } });
    <span class="tok-kw">const</span> arm: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = arm_shape,
        .position = o + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, top_y, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">300.0</span>,
        .group_id = link_group,
        .material = <span class="tok-num">2</span>,
    });
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createRevoluteJoint</span>(world, hub, arm, .{
        .anchor = o + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, top_y, <span class="tok-num">0</span>),
        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .motor = .{ .mode = .velocity, .target_velocity = <span class="tok-num">1.3</span>, .max_force = <span class="tok-num">1.0e6</span> },
    });

    <span class="tok-kw">const</span> link: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .capsule = .{ .half_height = <span class="tok-num">0.3</span>, .radius = <span class="tok-num">0.22</span> } });
    <span class="tok-kw">const</span> ball: zp.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.55</span> } });
    <span class="tok-kw">const</span> gap: f32 = <span class="tok-num">2.0</span> * <span class="tok-num">0.22</span> + <span class="tok-num">2.0</span> * <span class="tok-num">0.3</span>;
    <span class="tok-kw">const</span> hh: f32 = <span class="tok-num">0.3</span>;
    <span class="tok-kw">const</span> two_r: f32 = <span class="tok-num">2.0</span> * <span class="tok-num">0.22</span>;
    <span class="tok-kw">const</span> ex: f32 = arm_len; <span class="tok-comment">// chain hangs from the arm end</span>
    <span class="tok-kw">const</span> n: u32 = <span class="tok-num">7</span>;
    <span class="tok-kw">var</span> prev: zp.BodyHandle = arm;
    <span class="tok-kw">var</span> prev_bottom: Vec = o + <span class="tok-fn">vec</span>(ex, top_y, <span class="tok-num">0</span>);
    <span class="tok-kw">var</span> prev_y: f32 = top_y;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> cy: f32 = top_y - gap * <span class="tok-fn">float</span>(i + <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> idx: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
            .shape = link,
            .position = o + <span class="tok-fn">vec</span>(ex, cy, <span class="tok-num">0</span>),
            .motion_type = .dynamic,
            .group_id = link_group,
            .material = <span class="tok-builtin">@intCast</span>(<span class="tok-num">1</span> + i % <span class="tok-num">5</span>),
        });
        <span class="tok-kw">const</span> link_b: Vec = o + <span class="tok-fn">vec</span>(ex, cy + hh, <span class="tok-num">0</span>);
        <span class="tok-kw">try</span> zp.<span class="tok-fn">createDistanceJoint</span>(world, prev, idx, prev_bottom, link_b, <span class="tok-num">0.0</span>, two_r);
        prev = idx;
        prev_bottom = o + <span class="tok-fn">vec</span>(ex, cy - hh, <span class="tok-num">0</span>);
        prev_y = cy;
    }
    <span class="tok-kw">const</span> bob: zp.BodyHandle = <span class="tok-kw">try</span> world.<span class="tok-fn">createBody</span>(.{
        .shape = ball,
        .position = o + <span class="tok-fn">vec</span>(ex, prev_y - gap, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">1500.0</span>,
        .group_id = link_group,
        .material = <span class="tok-num">3</span>,
    });
    <span class="tok-kw">const</span> bob_top: Vec = o + <span class="tok-fn">vec</span>(ex, prev_y - gap + <span class="tok-num">0.55</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createDistanceJoint</span>(world, prev, bob, prev_bottom, bob_top, <span class="tok-num">0.0</span>, two_r);
}

<span class="tok-kw">fn</span> <span class="tok-fn">sceneStress</span>(world: *zp.World, gpa: Allocator, state: *State) !void {
    world.settings.allow_sleeping = false;
    <span class="tok-kw">try</span> <span class="tok-fn">stressFloor</span>(world, gpa);
    <span class="tok-kw">try</span> <span class="tok-fn">stressBlender</span>(world, gpa, state, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">try</span> <span class="tok-fn">stressGalton</span>(world, gpa, <span class="tok-fn">vec</span>(<span class="tok-num">15</span>, <span class="tok-num">0</span>, -<span class="tok-num">3</span>), state);
    <span class="tok-kw">try</span> <span class="tok-fn">stressPyramid</span>(world, gpa, <span class="tok-fn">vec</span>(-<span class="tok-num">14</span>, <span class="tok-num">0</span>, <span class="tok-num">5</span>));
    <span class="tok-kw">try</span> <span class="tok-fn">stressChain</span>(world, gpa, <span class="tok-fn">vec</span>(-<span class="tok-num">14</span>, <span class="tok-num">0</span>, <span class="tok-num">13</span>));
    <span class="tok-comment">// A big heavy projectile: 3x the usual radius (~27x mass) so a thrown ball</span>
    <span class="tok-comment">// can bowl through the pyramid.</span>
    state.launch_shape = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.9</span> } });
}

<span class="tok-kw">fn</span> <span class="tok-fn">buildScene</span>(state: *State) !void {
    <span class="tok-kw">const</span> gpa: Allocator = state.gpa;

    <span class="tok-kw">switch</span> (state.scene) {
        .shapes =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneShapes</span>(world, gpa, state),
        .terrain =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneTerrain</span>(world, gpa, state),
        .showcase =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneShowcase</span>(world, gpa, state),
        .pyramid =&gt; <span class="tok-kw">try</span> <span class="tok-fn">scenePyramid</span>(world, gpa, state),
        .stack =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneStack</span>(world, gpa, state),

        .friction_ramp =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneFrictionRamp</span>(world, gpa, state),
        .funnel =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneFunnel</span>(world, gpa, state),
        .bridge =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneBridge</span>(world, gpa, state),
        .chain =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneChain</span>(world, gpa, state),
        .motor =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneMotor</span>(world, gpa, state),
        .weld =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneWeld</span>(world, gpa, state),
        .slider =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneSlider</span>(world, gpa, state),
        .pulley =&gt; <span class="tok-kw">try</span> <span class="tok-fn">scenePulley</span>(world, gpa, state),
        .ragdoll =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneRagdoll</span>(world, gpa, state),
        .gear =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneGear</span>(world, gpa, state),
        .rack_and_pinion =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneRackPinion</span>(world, gpa, state),
        .path =&gt; <span class="tok-kw">try</span> <span class="tok-fn">scenePath</span>(world, gpa, state),
        .newtons_cradle =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneNewtonsCradle</span>(world, gpa, state),
        .wrecking_ball =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneWreckingBall</span>(world, gpa, state),
        .plinko =&gt; <span class="tok-kw">try</span> <span class="tok-fn">scenePlinko</span>(world, gpa, state),
        .rube_goldberg =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneRubeGoldberg</span>(world, gpa),
        .tumbler =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneTumbler</span>(world, gpa, state),
        .conveyor =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneConveyor</span>(world, gpa, state),
        .clockwork =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneClockwork</span>(world, gpa, state),
        .stirrer =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneStirrer</span>(world, gpa, state),
        .ragdoll_pile =&gt; <span class="tok-kw">try</span> <span class="tok-fn">sceneRagdollPile</span>(world, gpa, state),
