<span class="tok-comment">/// Tear the World down and rebuild it for `scene` (exercises `World.deinit`).</span>
<span class="tok-comment">/// The fresh World is created BEFORE freeing the old one so a failed init</span>
<span class="tok-comment">/// leaves the running scene intact.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">switchScene</span>(state: *State, scene: Scene) void {
    <span class="tok-kw">const</span> fresh: zp.World = zp.World.<span class="tok-fn">init</span>(state.gpa, <span class="tok-num">1024</span>) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    state.world.<span class="tok-fn">deinit</span>(state.gpa);
    state.world = fresh;
    state.scene = scene;
    state.cam_distance = scene.<span class="tok-fn">camDistance</span>();
    state.cam_pan = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-fn">buildScene</span>(state) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
}

<span class="tok-comment">// ===== Phase 4: constraint showcase scenes (one Jolt sample each) =====</span>

<span class="tok-comment">/// Plinko ball spawner: called once per physics step. Releases one `plane_2d` ball from the</span>
<span class="tok-comment">/// top centre (with small deterministic jitter) every `interval` steps, up to `max_balls`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">spawnPlinkoBall</span>(state: *State) void {
    <span class="tok-kw">const</span> max_balls: usize = <span class="tok-num">40</span>;
    <span class="tok-kw">const</span> interval: usize = <span class="tok-num">18</span>;
    state.plinko_phys_steps += <span class="tok-num">1</span>;
    <span class="tok-kw">if</span> (state.plinko_spawned &gt;= max_balls <span class="tok-kw">or</span> state.plinko_phys_steps % interval != <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    state.plinko_seed = state.plinko_seed *% <span class="tok-num">1664525</span> +% <span class="tok-num">1013904223</span>;
    <span class="tok-kw">const</span> j: f32 = (<span class="tok-fn">float</span>(state.plinko_seed % <span class="tok-num">1000</span>) / <span class="tok-num">1000.0</span> - <span class="tok-num">0.5</span>) * <span class="tok-num">0.7</span>; <span class="tok-comment">// +-0.35</span>
    _ = state.world.<span class="tok-fn">createBody</span>(.{
        .shape = state.launch_shape,
        .position = <span class="tok-fn">vec</span>(j, <span class="tok-num">12.5</span>, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">800.0</span>,
        .friction = <span class="tok-num">0.0</span>,
        .restitution = <span class="tok-num">0.30</span>,
        .material = <span class="tok-builtin">@intCast</span>(state.plinko_spawned % <span class="tok-num">6</span> + <span class="tok-num">1</span>),
    }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    state.plinko_spawned += <span class="tok-num">1</span>;
}

<span class="tok-comment">/// Release a marble onto the feed end of the belt at a fixed interval (well spaced so they</span>
<span class="tok-comment">/// ride across without crowding), capped so the bin doesn't overflow. Driven from `update`.</span>
<span class="tok-comment">/// Stress-scene Galton spawner: releases one ball from the board's middle every</span>
<span class="tok-comment">/// `interval` steps (reusing the plinko counters), up to `max_balls`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">spawnStressGaltonBall</span>(state: *State) void {
    <span class="tok-kw">const</span> max_balls: usize = <span class="tok-num">160</span>;
    <span class="tok-kw">const</span> interval: usize = <span class="tok-num">9</span>;
    state.plinko_phys_steps += <span class="tok-num">1</span>;
    <span class="tok-kw">if</span> (state.plinko_spawned &gt;= max_balls <span class="tok-kw">or</span> state.plinko_phys_steps % interval != <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    state.plinko_seed = state.plinko_seed *% <span class="tok-num">1664525</span> +% <span class="tok-num">1013904223</span>;
    <span class="tok-kw">const</span> jx: f32 = (<span class="tok-fn">float</span>(state.plinko_seed % <span class="tok-num">1000</span>) / <span class="tok-num">1000.0</span> - <span class="tok-num">0.5</span>) * <span class="tok-num">0.3</span>;
    state.plinko_seed = state.plinko_seed *% <span class="tok-num">1664525</span> +% <span class="tok-num">1013904223</span>;
    <span class="tok-kw">const</span> jz: f32 = (<span class="tok-fn">float</span>(state.plinko_seed % <span class="tok-num">1000</span>) / <span class="tok-num">1000.0</span> - <span class="tok-num">0.5</span>) * <span class="tok-num">0.3</span>;
    <span class="tok-kw">const</span> y: f32 = state.galton_y_top + <span class="tok-num">2.0</span>;
    _ = state.world.<span class="tok-fn">createBody</span>(.{
        .shape = state.galton_ball,
        .position = state.galton_origin + <span class="tok-fn">vec</span>(jx, y, jz),
        .motion_type = .dynamic,
        .friction = <span class="tok-num">0.05</span>,
        .restitution = <span class="tok-num">0.25</span>,
        .material = <span class="tok-builtin">@intCast</span>(state.plinko_spawned % <span class="tok-num">6</span> + <span class="tok-num">1</span>),
    }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    state.plinko_spawned += <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">spawnConveyorMarble</span>(state: *State) void {
    <span class="tok-kw">const</span> max_marbles: usize = <span class="tok-num">15</span>;
    <span class="tok-kw">const</span> interval: usize = <span class="tok-num">55</span>;
    state.conveyor_steps += <span class="tok-num">1</span>;
    <span class="tok-kw">if</span> (state.conveyor_spawned &gt;= max_marbles <span class="tok-kw">or</span> state.conveyor_steps % interval != <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    _ = state.world.<span class="tok-fn">createBody</span>(.{
        .shape = state.launch_shape,
        .position = <span class="tok-fn">vec</span>(-<span class="tok-num">4.2</span>, <span class="tok-num">2.7</span>, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">600.0</span>,
        .friction = <span class="tok-num">0.9</span>,
        .restitution = <span class="tok-num">0.05</span>,
        .material = <span class="tok-builtin">@intCast</span>(state.conveyor_spawned % <span class="tok-num">6</span> + <span class="tok-num">1</span>),
    }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    state.conveyor_spawned += <span class="tok-num">1</span>;
}

<span class="tok-comment">/// Per-scene 3D overlay, drawn in the same pass as the world (after drawWorld,</span>
<span class="tok-comment">/// before endMode3D). The pulley scene's rope isn't a body, so draw it here: each</span>
<span class="tok-comment">/// box's attachment point up to its fixed pulley point, plus the span between the</span>
<span class="tok-comment">/// two pulleys along the beam.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawSceneOverlay</span>(f: *z.Frame, state: *State) void {
    <span class="tok-kw">switch</span> (state.scene) {
        .pulley =&gt; {
            <span class="tok-kw">if</span> (state.pulley_idx &gt;= state.world.constraints.items.len) {
                <span class="tok-kw">return</span>;
            }
            <span class="tok-kw">const</span> con: *<span class="tok-kw">const</span> zp.Constraint = &amp;state.world.constraints.items[state.pulley_idx];
            <span class="tok-kw">const</span> ba: *<span class="tok-kw">const</span> zp.Body = &amp;state.world.bodies.data[con.body_a];
            <span class="tok-kw">const</span> bb: *<span class="tok-kw">const</span> zp.Body = &amp;state.world.bodies.data[con.body_b];
            <span class="tok-kw">const</span> wa: Vec = ba.com_pos + <span class="tok-fn">rotate</span>(ba.rot, con.local_anchor_a);
            <span class="tok-kw">const</span> wb: Vec = bb.com_pos + <span class="tok-fn">rotate</span>(bb.rot, con.local_anchor_b);
            <span class="tok-kw">const</span> rope: Color = c.slate_300;
            z.<span class="tok-fn">drawLine3D</span>(f.gl, wa, con.pulley_fixed_a, rope);
            z.<span class="tok-fn">drawLine3D</span>(f.gl, con.pulley_fixed_a, con.pulley_fixed_b, rope);
            z.<span class="tok-fn">drawLine3D</span>(f.gl, con.pulley_fixed_b, wb, rope);
        },
        .path =&gt; {
            <span class="tok-kw">if</span> (state.path_idx == <span class="tok-num">0</span> <span class="tok-kw">or</span> state.path_idx - <span class="tok-num">1</span> &gt;= zp.<span class="tok-fn">pathCount</span>(&amp;state.world)) {
                <span class="tok-kw">return</span>;
            }
            <span class="tok-kw">const</span> idx: usize = state.path_idx - <span class="tok-num">1</span>;
            <span class="tok-kw">const</span> rail: Color = c.slate_300;
            <span class="tok-kw">const</span> segs: usize = <span class="tok-num">64</span>;
            <span class="tok-kw">var</span> prev: Vec = zp.<span class="tok-fn">pathWorldPoint</span>(&amp;state.world, idx, <span class="tok-num">0.0</span>);
            <span class="tok-kw">var</span> i: usize = <span class="tok-num">1</span>;
            <span class="tok-kw">while</span> (i &lt;= segs) : (i += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(segs);
                <span class="tok-kw">const</span> cur: Vec = zp.<span class="tok-fn">pathWorldPoint</span>(&amp;state.world, idx, t);
                z.<span class="tok-fn">drawLine3D</span>(f.gl, prev, cur, rail);
                prev = cur;
            }
        },
        .newtons_cradle, .wrecking_ball =&gt; {
            <span class="tok-comment">// Each rigid string is a distance constraint; draw beam-anchor -&gt; ball.</span>
            <span class="tok-kw">const</span> rope: Color = c.slate_300;
            <span class="tok-kw">for</span> (state.world.constraints.items) |*con| {
                <span class="tok-kw">if</span> (con.kind != .distance) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> ba: *<span class="tok-kw">const</span> zp.Body = &amp;state.world.bodies.data[con.body_a];
                <span class="tok-kw">const</span> bb: *<span class="tok-kw">const</span> zp.Body = &amp;state.world.bodies.data[con.body_b];
                <span class="tok-kw">const</span> wa: Vec = ba.com_pos + <span class="tok-fn">rotate</span>(ba.rot, con.local_anchor_a);
                <span class="tok-kw">const</span> wb: Vec = bb.com_pos + <span class="tok-fn">rotate</span>(bb.rot, con.local_anchor_b);
                z.<span class="tok-fn">drawLine3D</span>(f.gl, wa, wb, rope);
            }
        },
        <span class="tok-kw">else</span> =&gt; {},
    }
}

<span class="tok-comment">/// The point the camera orbits and looks at: the per-scene framing height plus</span>
<span class="tok-comment">/// any accumulated pan offset.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">orbitTarget</span>(state: *<span class="tok-kw">const</span> State) Vec {
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(state.scene.<span class="tok-fn">camTargetX</span>(), state.scene.<span class="tok-fn">camTargetY</span>(), <span class="tok-num">0</span>) + state.cam_pan;
}

<span class="tok-kw">fn</span> <span class="tok-fn">orbitCamPos</span>(state: *<span class="tok-kw">const</span> State) Vec {
    <span class="tok-kw">const</span> yaw_rad: f32 = state.cam_angle_yaw * pi / <span class="tok-num">180.0</span>;
    <span class="tok-kw">const</span> pitch_rad: f32 = state.cam_angle_pitch * pi / <span class="tok-num">180.0</span>;
    <span class="tok-kw">const</span> cos_p: f32 = <span class="tok-builtin">@cos</span>(pitch_rad);
    <span class="tok-kw">const</span> offset: Vec = <span class="tok-fn">vec</span>(
        <span class="tok-builtin">@sin</span>(yaw_rad) * cos_p * state.cam_distance,
        <span class="tok-builtin">@sin</span>(pitch_rad) * state.cam_distance,
        <span class="tok-builtin">@cos</span>(yaw_rad) * cos_p * state.cam_distance,
    );
    <span class="tok-kw">return</span> <span class="tok-fn">orbitTarget</span>(state) + offset;
}

<span class="tok-kw">fn</span> <span class="tok-fn">launchSphere</span>(state: *State) !void {
    <span class="tok-kw">const</span> cam_pos: Vec = <span class="tok-fn">orbitCamPos</span>(state);
    <span class="tok-kw">const</span> dir: Vec = <span class="tok-fn">normalize3</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">2.0</span>, <span class="tok-num">0</span>) - cam_pos);
    <span class="tok-kw">const</span> idx: zp.BodyHandle = <span class="tok-kw">try</span> state.world.<span class="tok-fn">createBody</span>(.{
        .shape = state.launch_shape,
        .position = cam_pos + dir * <span class="tok-fn">splat</span>(<span class="tok-num">1.5</span>),
        .motion_type = .dynamic,
        .restitution = <span class="tok-num">0.4</span>,
        .material = <span class="tok-num">1</span>,
    });
    <span class="tok-kw">try</span> state.world.<span class="tok-fn">setLinearVelocity</span>(state.gpa, idx, dir * <span class="tok-fn">splat</span>(<span class="tok-num">26.0</span>));
}

<span class="tok-comment">// ===== On-screen controls via ui.zig (TAB/R/SPACE are keyboard-only; phones need taps) =====</span>

<span class="tok-comment">/// A pinned `ui.zig` panel: current scene + the joint it shows + body count, then</span>
<span class="tok-comment">/// the four controls as real `u.button` widgets. Returns `wantCaptureMouse` so the</span>
<span class="tok-comment">/// caller suppresses camera orbit while a finger is on the panel (imgui idiom).</span>
<span class="tok-comment">/// Built between `ui_host.begin` and `ui_host.render`; the click handling is the</span>
<span class="tok-comment">/// immediate-mode button return value, so there is no manual hit-testing.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawUiPanel</span>(f: *z.Frame, state: *State) bool {
    <span class="tok-kw">const</span> u: z.ui_real.Ui = state.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> btn: z.ui_real.ButtonOpts = .{ .size = .{ <span class="tok-num">82</span>, <span class="tok-num">26</span> } }; <span class="tok-comment">// thumb-sized targets</span>

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"zimrphysics"</span>, .{
        .initial_pos = .{ <span class="tok-num">10</span>, <span class="tok-num">10</span> },
        .initial_size = .{ <span class="tok-num">196</span>, <span class="tok-num">172</span> },
        .flags = .{ .no_move = true, .no_resize = true, .no_collapse = true },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"scene: {s}"</span>, .{state.scene.<span class="tok-fn">label</span>()});
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"&lt; Prev"</span>, btn)) {
            <span class="tok-fn">switchScene</span>(state, state.scene.<span class="tok-fn">prev</span>());
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Next &gt;"</span>, btn)) {
            <span class="tok-fn">switchScene</span>(state, state.scene.<span class="tok-fn">next</span>());
        }
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Reset"</span>, btn)) {
            <span class="tok-fn">switchScene</span>(state, state.scene);
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Launch"</span>, btn)) {
            <span class="tok-fn">launchSphere</span>(state) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
        }
        <span class="tok-kw">const</span> plabel: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (state.profiling) <span class="tok-str">"Resume"</span> <span class="tok-kw">else</span> <span class="tok-str">"Profile"</span>;
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(plabel, btn)) {
            state.profiling = !state.profiling;
            <span class="tok-kw">if</span> (state.profiling) {
                z.profiler.<span class="tok-fn">freeze</span>();
            } <span class="tok-kw">else</span> {
                z.profiler.<span class="tok-fn">unfreeze</span>();
            }
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">const</span> wlabel: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (state.watching) <span class="tok-str">"Watching"</span> <span class="tok-kw">else</span> <span class="tok-str">"Watch"</span>;
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(wlabel, btn)) {
            state.watching = !state.watching;
            <span class="tok-kw">if</span> (state.watching) {
                z.profiler.<span class="tok-fn">armAutoFreeze</span>(<span class="tok-num">2.0</span>, <span class="tok-num">4.0</span>); <span class="tok-comment">// freeze on a frame &gt; 2x baseline (and &gt; 4ms)</span>
            } <span class="tok-kw">else</span> {
                z.profiler.<span class="tok-fn">disarmAutoFreeze</span>();
                <span class="tok-kw">if</span> (state.profiling <span class="tok-kw">and</span> z.profiler.<span class="tok-fn">autoFroze</span>()) {
                    state.profiling = false;
                    z.profiler.<span class="tok-fn">unfreeze</span>();
                }
            }
        }
    }
    <span class="tok-comment">// A watched spike auto-freezes the profiler; mirror that into the app's pause so</span>
    <span class="tok-comment">// the panel pops up on the captured hitch without the user timing anything.</span>
    <span class="tok-kw">if</span> (state.watching <span class="tok-kw">and</span> z.profiler.<span class="tok-fn">isFrozen</span>() <span class="tok-kw">and</span> !state.profiling) {
        state.profiling = true;
    }
    <span class="tok-comment">// When profiling, pause the sim and show the flamegraph of the worst frame</span>
    <span class="tok-comment">// in the 2s before freezing. App-owned: the profiler imposes no input.</span>
    <span class="tok-kw">if</span> (state.profiling) {
        <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"profiler - worst frame"</span>, .{
            .initial_pos = .{ <span class="tok-num">10</span>, <span class="tok-num">184</span> },
            .initial_size = .{ <span class="tok-num">600</span>, <span class="tok-num">380</span> },
        })) |w| {
            <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
            z.profiler_ui.<span class="tok-fn">panel</span>(u);
        }
    }
    <span class="tok-kw">return</span> u.<span class="tok-fn">wantCaptureMouse</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    <span class="tok-comment">// Physics runs on a FIXED 1/60 s timestep, decoupled from the (variable, often</span>
    <span class="tok-comment">// ~30 fps on mobile) render rate. Passing the raw frame dt straight to the solver</span>
    <span class="tok-comment">// was the bug behind exploding stacks: one ~1/30 s Euler step is too large for the</span>
    <span class="tok-comment">// contact solver and pumps energy into the pile. Jolt's own guidance is the same -</span>
    <span class="tok-comment">// keep each step &lt;= 1/60 s and subdivide longer frames. We accumulate real time here</span>
    <span class="tok-comment">// and drain it in fixed sub-steps below (capped to avoid a slow-device spiral).</span>
    state.phys_accum += <span class="tok-fn">clamp</span>(f.time.delta_time, <span class="tok-num">0.0</span>, <span class="tok-num">0.1</span>);
    state.frame_count += <span class="tok-num">1</span>;

    <span class="tok-kw">if</span> (!state.spawned) {
        state.cam_distance = state.scene.<span class="tok-fn">camDistance</span>();
        <span class="tok-fn">buildScene</span>(state) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
        state.spawned = true;
    }

    <span class="tok-comment">// The ui.zig panel runs first: its buttons fire here (immediate-mode) and it</span>
    <span class="tok-comment">// reports whether the pointer is over the panel so orbit can stand down.</span>
    <span class="tok-kw">const</span> ui_capture: bool = <span class="tok-fn">drawUiPanel</span>(f, state);

    <span class="tok-comment">// Phone-style camera: 1 finger orbits, 2 fingers pinch-zoom and pan. Mirrors</span>
    <span class="tok-comment">// the helmet/raytracer viewers. Orbit is gated to &lt;2 touches so a pinch never</span>
    <span class="tok-comment">// also spins the view; all gestures stand down while the pointer is on the UI.</span>
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span> <span class="tok-kw">and</span> !ui_capture) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> spread_x: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> spread_y: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> spacing: f32 = <span class="tok-builtin">@sqrt</span>(spread_x * spread_x + spread_y * spread_y);
        <span class="tok-kw">const</span> mid: Vec2 = .{ (a[<span class="tok-num">0</span>] + b[<span class="tok-num">0</span>]) * <span class="tok-num">0.5</span>, (a[<span class="tok-num">1</span>] + b[<span class="tok-num">1</span>]) * <span class="tok-num">0.5</span> };
        <span class="tok-kw">if</span> (state.two_finger) {
            <span class="tok-comment">// Pinch: fingers spreading -&gt; move closer.</span>
            state.cam_distance = <span class="tok-fn">clamp</span>(state.cam_distance - (spacing - state.prev_pinch) * <span class="tok-num">0.03</span>, <span class="tok-num">6.0</span>, <span class="tok-num">40.0</span>);
            <span class="tok-comment">// Pan: slide the target in the camera's screen plane by the midpoint delta.</span>
            <span class="tok-kw">const</span> md_x: f32 = mid[<span class="tok-num">0</span>] - state.prev_pan_mid[<span class="tok-num">0</span>];
            <span class="tok-kw">const</span> md_y: f32 = mid[<span class="tok-num">1</span>] - state.prev_pan_mid[<span class="tok-num">1</span>];
            <span class="tok-kw">const</span> fwd: Vec = <span class="tok-fn">normalize3</span>(<span class="tok-fn">orbitTarget</span>(state) - <span class="tok-fn">orbitCamPos</span>(state));
            <span class="tok-kw">const</span> right: Vec = <span class="tok-fn">normalize3</span>(<span class="tok-fn">cross</span>(fwd, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>)));
            <span class="tok-kw">const</span> up: Vec = <span class="tok-fn">cross</span>(right, fwd);
            <span class="tok-kw">const</span> k: f32 = state.cam_distance * <span class="tok-num">0.0016</span>;
            state.cam_pan = state.cam_pan - right * <span class="tok-fn">splat</span>(md_x * k) + up * <span class="tok-fn">splat</span>(md_y * k);
        }
        state.prev_pinch = spacing;
        state.prev_pan_mid = mid;
        state.two_finger = true;
        state.dragging = false;
    } <span class="tok-kw">else</span> {
        state.two_finger = false;
        state.prev_pinch = <span class="tok-num">0</span>;
        <span class="tok-kw">if</span> (touches &lt; <span class="tok-num">2</span> <span class="tok-kw">and</span> z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !ui_capture) {
            <span class="tok-kw">if</span> (state.dragging) {
                <span class="tok-kw">const</span> delta: Vec2 = z.<span class="tok-fn">getMouseDelta</span>(f.input);
                state.cam_angle_yaw -= delta[<span class="tok-num">0</span>] * <span class="tok-num">0.4</span>;
                state.cam_angle_pitch = <span class="tok-fn">clamp</span>(state.cam_angle_pitch + delta[<span class="tok-num">1</span>] * <span class="tok-num">0.4</span>, -<span class="tok-num">85.0</span>, <span class="tok-num">85.0</span>);
            }
            state.dragging = true;
        } <span class="tok-kw">else</span> {
            state.dragging = false;
        }
    }
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span> <span class="tok-kw">and</span> !ui_capture) {
        state.cam_distance = <span class="tok-fn">clamp</span>(state.cam_distance - wheel * <span class="tok-num">1.5</span>, <span class="tok-num">6.0</span>, <span class="tok-num">40.0</span>);
    }

    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .space)) {
        <span class="tok-fn">launchSphere</span>(state) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .tab)) {
        <span class="tok-fn">switchScene</span>(state, state.scene.<span class="tok-fn">next</span>());
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .r)) {
        <span class="tok-fn">switchScene</span>(state, state.scene);
    }

    <span class="tok-comment">// Powered-slider scene: reverse the velocity motor at the limit stops so the</span>
    <span class="tok-comment">// platform sweeps back and forth instead of parking against one end.</span>
    <span class="tok-kw">if</span> (state.scene == .slider <span class="tok-kw">and</span> state.slider_idx &lt; state.world.constraints.items.len) {
        <span class="tok-kw">const</span> px: f32 = state.world.bodies.data[state.slider_plat.<span class="tok-fn">index</span>()].com_pos[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> con: *zp.Constraint = &amp;state.world.constraints.items[state.slider_idx];
        <span class="tok-kw">if</span> (px &gt; <span class="tok-num">2.8</span> <span class="tok-kw">and</span> con.motor.target_velocity &gt; <span class="tok-num">0</span>) {
            con.motor.target_velocity = -<span class="tok-num">2.0</span>;
        }
        <span class="tok-kw">if</span> (px &lt; -<span class="tok-num">2.8</span> <span class="tok-kw">and</span> con.motor.target_velocity &lt; <span class="tok-num">0</span>) {
            con.motor.target_velocity = <span class="tok-num">2.0</span>;
        }
    }

    <span class="tok-kw">if</span> (state.scene == .clockwork <span class="tok-kw">and</span> state.clockwork_motor &lt; state.world.constraints.items.len) {
        <span class="tok-kw">const</span> ry: f32 = state.world.bodies.data[state.clockwork_rack.<span class="tok-fn">index</span>()].com_pos[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> con: *zp.Constraint = &amp;state.world.constraints.items[state.clockwork_motor];
        <span class="tok-kw">if</span> (ry &gt; state.clockwork_home + <span class="tok-num">1.0</span> <span class="tok-kw">and</span> con.motor.target_velocity &gt; <span class="tok-num">0</span>) {
            con.motor.target_velocity = -<span class="tok-num">2.5</span>;
        }
        <span class="tok-kw">if</span> (ry &lt; state.clockwork_home - <span class="tok-num">1.0</span> <span class="tok-kw">and</span> con.motor.target_velocity &lt; <span class="tok-num">0</span>) {
            con.motor.target_velocity = <span class="tok-num">2.5</span>;
        }
    }

    <span class="tok-kw">const</span> fixed_dt: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">60.0</span>;
    <span class="tok-kw">if</span> (state.profiling) {
        state.phys_accum = <span class="tok-num">0</span>; <span class="tok-comment">// paused for inspection; profiler is frozen</span>
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">var</span> sub: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (state.phys_accum &gt;= fixed_dt <span class="tok-kw">and</span> sub &lt; <span class="tok-num">4</span>) : (sub += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (state.scene == .plinko) {
                <span class="tok-fn">spawnPlinkoBall</span>(state);
            }
            <span class="tok-kw">if</span> (state.scene == .stress) {
                <span class="tok-fn">spawnStressGaltonBall</span>(state);
            }
            <span class="tok-kw">if</span> (state.scene == .conveyor) {
                <span class="tok-fn">spawnConveyorMarble</span>(state);
            }
            zp.<span class="tok-fn">step</span>(&amp;state.world, fixed_dt) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
            state.phys_accum -= fixed_dt;
        }
        <span class="tok-kw">if</span> (state.phys_accum &gt; fixed_dt) {
            state.phys_accum = <span class="tok-num">0</span>; <span class="tok-comment">// device fell behind; drop the backlog rather than spiral</span>
        }
    }

    <span class="tok-comment">// No clearViewport: the runner's pass already cleared to the config colour.</span>
    <span class="tok-comment">// A full-screen 2D quad here would flush after the 3D and paint over it.</span>
    <span class="tok-kw">const</span> cam: Camera3D = .{
        .position = <span class="tok-fn">orbitCamPos</span>(state),
        .target = <span class="tok-fn">orbitTarget</span>(state),
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = <span class="tok-num">50</span>,
        .projection = <span class="tok-num">0</span>,
    };
    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam);
    {
        <span class="tok-kw">const</span> zg: z.profiler.Zone = z.profiler.<span class="tok-fn">zoneNamed</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"render.grid"</span>);
        <span class="tok-kw">defer</span> zg.<span class="tok-fn">end</span>();
        z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">24</span>, <span class="tok-num">1.0</span>);
    }
    <span class="tok-kw">const</span> style: render.Style = .{
        .palette = &amp;demo_palette,
        <span class="tok-comment">// A medium slate so static geometry (terrain, ramps, floors) reads</span>
        <span class="tok-comment">// against the near-black background; co.palette.surface was almost black.</span>
        .static_color = c.slate_500,
    };
    render.<span class="tok-fn">drawWorld</span>(f.gl, &amp;state.world, style);
    {
        <span class="tok-kw">const</span> zo: z.profiler.Zone = z.profiler.<span class="tok-fn">zoneNamed</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"render.overlay"</span>);
        <span class="tok-kw">defer</span> zo.<span class="tok-fn">end</span>();
        <span class="tok-fn">drawSceneOverlay</span>(f, state);
    }
    {
        <span class="tok-kw">const</span> zf: z.profiler.Zone = z.profiler.<span class="tok-fn">zoneNamed</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"render.flush3d"</span>);
        <span class="tok-kw">defer</span> zf.<span class="tok-fn">end</span>();
        z.<span class="tok-fn">endMode3D</span>(f.gl);
    }
    <span class="tok-comment">// endMode3D restores the 2D pipeline automatically, so the UI composes on</span>
    <span class="tok-comment">// top of the 3D in the same pass with no manual restore/reopen.</span>
    {
        <span class="tok-kw">const</span> zu: z.profiler.Zone = z.profiler.<span class="tok-fn">zoneNamed</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"render.ui"</span>);
        <span class="tok-kw">defer</span> zu.<span class="tok-fn">end</span>();
        state.ui_host.<span class="tok-fn">render</span>(f);
    }
    <span class="tok-comment">// NB: no explicit endDrawing - the runner closes the frame (and endDrawing is</span>
    <span class="tok-comment">// idempotent). Leaving the pass open lets a host like the launcher compose its</span>
    <span class="tok-comment">// own overlay on top of this app's frame.</span>
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - zimrphysics demo"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
            <span class="tok-comment">// Clear via the pass load-op (matches the page background). Drawing the</span>
            <span class="tok-comment">// background as a full-screen 2D quad instead would sit in the 2D</span>
            <span class="tok-comment">// batch and flush AFTER the immediate 3D, painting over it.</span>
            .clear = .{ .r = <span class="tok-num">10.0</span> / <span class="tok-num">255.0</span>, .g = <span class="tok-num">12.0</span> / <span class="tok-num">255.0</span>, .b = <span class="tok-num">18.0</span> / <span class="tok-num">255.0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    .memory = .managed,
};

<figure class="code src-file" data-path="examples/zimrphysics_demo/render.zig" data-lines="229"><figcaption><span>examples/zimrphysics_demo/render.zig</span><span>229 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! render.zig - draw a `zimrphysics` World with zimr's 3D immediate-mode API.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The pattern: the renderer is a *pure read* over `world.bodies` - the physics</span>
<span class="tok-comment">//! ECS (`entities.Entities(Body)`) IS the scene description, so there is no</span>
<span class="tok-comment">//! parallel render state to allocate, sync, or tear down. Per-body colour rides</span>
<span class="tok-comment">//! on the Body's own `material` tag (an opaque `u16` the caller already owns), so</span>
<span class="tok-comment">//! the physics world stays the single source of truth.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Contrast the older `wgpu_physics_pyramid` demo, which mirrored every transform</span>
<span class="tok-comment">//! into a *second* ECS (Transform + Collider + BodyColor) purely so it could be</span>
<span class="tok-comment">//! drawn. Here the draw pass is a `world.bodies.forEach` over the bodies that</span>
<span class="tok-comment">//! already exist, reading `com_pos` / `rot` / `shape` straight off each Body.</span>

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;

<span class="tok-kw">const</span> phys = z.zimrphysics;

<span class="tok-comment">/// A body with this `material` is collidable but not drawn - "glass" walls that</span>
<span class="tok-comment">/// keep bodies contained while staying out of the camera's way.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> invisible_material: u16 = <span class="tok-num">0xFFFF</span>;

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Quat = zm.Quat;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> rotate = zm.rotate;
<span class="tok-kw">const</span> qmul = zm.qmul;
<span class="tok-kw">const</span> cross = zm.cross;
<span class="tok-kw">const</span> normalize3 = zm.normalize3;
<span class="tok-kw">const</span> matFromQuat = zm.matFromQuat;
<span class="tok-kw">const</span> WgpuGl = z.WgpuGl;

<span class="tok-comment">/// How the world is coloured and tessellated. `palette` is indexed by</span>
<span class="tok-comment">/// `Body.material` (wrapping), so materials 0,1,2,... select palette[0],[1],[2],...;</span>
<span class="tok-comment">/// static bodies use `static_color` so the ground reads as fixed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Style = <span class="tok-kw">struct</span> {
    palette: []<span class="tok-kw">const</span> Color,
    static_color: Color,
    sphere_rings: i32 = <span class="tok-num">12</span>,
    sphere_slices: i32 = <span class="tok-num">16</span>,
    capsule_slices: i32 = <span class="tok-num">12</span>,
    capsule_rings: i32 = <span class="tok-num">6</span>,
    cylinder_sides: i32 = <span class="tok-num">16</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">colorFor</span>(style: Style, body: *<span class="tok-kw">const</span> phys.Body) Color {
    <span class="tok-kw">if</span> (body.motion_type == .static) {
        <span class="tok-kw">return</span> style.static_color;
    }
    <span class="tok-kw">if</span> (style.palette.len == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> style.static_color;
    }
    <span class="tok-kw">return</span> style.palette[body.material % style.palette.len];
}

<span class="tok-kw">fn</span> <span class="tok-fn">darkenColor</span>(c: Color, factor: f32) Color {
    <span class="tok-kw">const</span> f: f32 = <span class="tok-kw">if</span> (factor &lt; <span class="tok-num">0.0</span>) <span class="tok-num">0.0</span> <span class="tok-kw">else</span> <span class="tok-kw">if</span> (factor &gt; <span class="tok-num">1.0</span>) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> factor;
    <span class="tok-kw">return</span> .{
        .r = <span class="tok-builtin">@intFromFloat</span>(<span class="tok-fn">float</span>(c.r) * f),
        .g = <span class="tok-builtin">@intFromFloat</span>(<span class="tok-fn">float</span>(c.g) * f),
        .b = <span class="tok-builtin">@intFromFloat</span>(<span class="tok-fn">float</span>(c.b) * f),
        .a = c.a,
    };
}

<span class="tok-comment">/// Heightfield local vertex (gx, gz): `(gx*cell, height, gz*cell)`, matching the</span>
<span class="tok-comment">/// engine's `hfVertex`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">hfVertexLocal</span>(hf: *<span class="tok-kw">const</span> phys.HeightField, gx: u32, gz: u32) Vec {
    <span class="tok-kw">const</span> fx: f32 = <span class="tok-fn">float</span>(gx);
    <span class="tok-kw">const</span> fz: f32 = <span class="tok-fn">float</span>(gz);
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(fx * hf.cell_size, hf.heights[gz * hf.sample_count_x + gx], fz * hf.cell_size);
}

<span class="tok-comment">/// Recursive so compounds and pose decorators draw their resolved leaves.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawShape</span>(
    gl: *WgpuGl,
    world: *phys.World,
    style: *<span class="tok-kw">const</span> Style,
    shape: *<span class="tok-kw">const</span> phys.Shape,
    pos: Vec,
    rot: Quat,
    color: Color,
) void {
    <span class="tok-kw">switch</span> (shape.*) {
        .sphere =&gt; |s| {
            z.<span class="tok-fn">drawSphere</span>(gl, pos, .{
                .radius = s.radius,
                .rings = style.sphere_rings,
                .slices = style.sphere_slices,
                .color = color,
            });
        },
        .box =&gt; |b| {
            z.<span class="tok-fn">drawCube</span>(gl, pos, .{
                .size = b.half_extent * <span class="tok-fn">splat</span>(<span class="tok-num">2.0</span>),
                .rotation = <span class="tok-fn">matFromQuat</span>(rot),
                .color = color,
            });
        },
        .capsule =&gt; |c| {
            <span class="tok-kw">const</span> axis: Vec = <span class="tok-fn">rotate</span>(rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, c.half_height, <span class="tok-num">0</span>));
            z.<span class="tok-fn">drawCapsule</span>(gl, pos + axis, pos - axis, c.radius, style.capsule_slices, style.capsule_rings, color);
        },
        .cylinder =&gt; |c| {
            <span class="tok-kw">const</span> axis: Vec = <span class="tok-fn">rotate</span>(rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, c.half_height, <span class="tok-num">0</span>));
            z.<span class="tok-fn">drawCylinderBetween</span>(gl, pos + axis, pos - axis, c.radius, c.radius, style.cylinder_sides, color);
        },
        .tapered_capsule =&gt; |c| {
            <span class="tok-kw">const</span> axis: Vec = <span class="tok-fn">rotate</span>(rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, c.half_height, <span class="tok-num">0</span>));
            <span class="tok-kw">const</span> sides: i32 = style.cylinder_sides;
            z.<span class="tok-fn">drawCylinderBetween</span>(gl, pos + axis, pos - axis, c.top_radius, c.bottom_radius, sides, color);
        },
        .compound =&gt; |cmp| {
            <span class="tok-kw">for</span> (cmp.children, <span class="tok-num">0</span>..) |child, ci| {
                <span class="tok-kw">const</span> cs: *<span class="tok-kw">const</span> phys.Shape = world.shapes.<span class="tok-fn">get</span>(child.shape);
                <span class="tok-kw">const</span> cpos: Vec = pos + <span class="tok-fn">rotate</span>(rot, child.local_pos);
                <span class="tok-kw">const</span> crot: Quat = <span class="tok-fn">qmul</span>(rot, child.local_rot);
                <span class="tok-comment">// Child 0 is the main shape (its body colour); later children (spokes,</span>
                <span class="tok-comment">// markers, knobs) are drawn a shade darker so they read as distinct</span>
                <span class="tok-comment">// attached parts rather than blending into the same-coloured parent.</span>
                <span class="tok-kw">const</span> ccolor: Color = <span class="tok-kw">if</span> (ci == <span class="tok-num">0</span>) color <span class="tok-kw">else</span> <span class="tok-fn">darkenColor</span>(color, <span class="tok-num">0.58</span>);
                <span class="tok-fn">drawShape</span>(gl, world, style, cs, cpos, crot, ccolor);
            }
        },
        .rotated_translated =&gt; |rt| {
            <span class="tok-kw">const</span> cs: *<span class="tok-kw">const</span> phys.Shape = world.shapes.<span class="tok-fn">get</span>(rt.child);
            <span class="tok-kw">const</span> cpos: Vec = pos + <span class="tok-fn">rotate</span>(rot, rt.position);
            <span class="tok-kw">const</span> crot: Quat = <span class="tok-fn">qmul</span>(rot, rt.rotation);
            <span class="tok-fn">drawShape</span>(gl, world, style, cs, cpos, crot, color);
        },
        .offset_com =&gt; |oc| {
            <span class="tok-comment">// The body's com_pos IS the COM; the child origin sits at -offset from</span>
            <span class="tok-comment">// it (engine: `p = p - rotate(r, oc.offset)`), so draw the child there.</span>
            <span class="tok-kw">const</span> cs: *<span class="tok-kw">const</span> phys.Shape = world.shapes.<span class="tok-fn">get</span>(oc.child);
            <span class="tok-kw">const</span> cpos: Vec = pos - <span class="tok-fn">rotate</span>(rot, oc.offset);
            <span class="tok-fn">drawShape</span>(gl, world, style, cs, cpos, rot, color);
        },
        .convex_hull =&gt; |h| {
            <span class="tok-comment">// Triangle-fan each hull face. Hull points are COM-centred and com_pos</span>
            <span class="tok-comment">// is the COM, so pos + rot*point is world.</span>
            <span class="tok-kw">for</span> (h.faces) |face| {
                <span class="tok-kw">if</span> (face.vertex_count &lt; <span class="tok-num">3</span>) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> base: u32 = face.first_vertex;
                <span class="tok-kw">const</span> p0: Vec = pos + <span class="tok-fn">rotate</span>(rot, h.points[h.face_vertices[base]]);
                <span class="tok-kw">var</span> k: u32 = <span class="tok-num">1</span>;
                <span class="tok-kw">while</span> (k + <span class="tok-num">1</span> &lt; face.vertex_count) : (k += <span class="tok-num">1</span>) {
                    <span class="tok-kw">const</span> p1: Vec = pos + <span class="tok-fn">rotate</span>(rot, h.points[h.face_vertices[base + k]]);
                    <span class="tok-kw">const</span> p2: Vec = pos + <span class="tok-fn">rotate</span>(rot, h.points[h.face_vertices[base + k + <span class="tok-num">1</span>]]);
                    z.<span class="tok-fn">drawTriangle3D</span>(gl, p0, p1, p2, color);
                }
            }
        },
        .triangle =&gt; |t| {
            z.<span class="tok-fn">drawTriangle3D</span>(gl, pos + <span class="tok-fn">rotate</span>(rot, t.v0), pos + <span class="tok-fn">rotate</span>(rot, t.v1), pos + <span class="tok-fn">rotate</span>(rot, t.v2), color);
        },
        .mesh =&gt; |m| {
            <span class="tok-kw">for</span> (m.triangles) |t| {
                z.<span class="tok-fn">drawTriangle3D</span>(
                    gl,
                    pos + <span class="tok-fn">rotate</span>(rot, m.vertices[t.v[<span class="tok-num">0</span>]]),
                    pos + <span class="tok-fn">rotate</span>(rot, m.vertices[t.v[<span class="tok-num">1</span>]]),
                    pos + <span class="tok-fn">rotate</span>(rot, m.vertices[t.v[<span class="tok-num">2</span>]]),
                    color,
                );
            }
        },
        .heightfield =&gt; |hf| {
            <span class="tok-comment">// Two triangles per cell (tri order matches collision: a,d,b / a,c,d).</span>
            <span class="tok-kw">var</span> cz: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (cz + <span class="tok-num">1</span> &lt; hf.sample_count_z) : (cz += <span class="tok-num">1</span>) {
                <span class="tok-kw">var</span> cx: u32 = <span class="tok-num">0</span>;
                <span class="tok-kw">while</span> (cx + <span class="tok-num">1</span> &lt; hf.sample_count_x) : (cx += <span class="tok-num">1</span>) {
                    <span class="tok-kw">const</span> a: Vec = pos + <span class="tok-fn">rotate</span>(rot, <span class="tok-fn">hfVertexLocal</span>(&amp;hf, cx, cz));
                    <span class="tok-kw">const</span> b: Vec = pos + <span class="tok-fn">rotate</span>(rot, <span class="tok-fn">hfVertexLocal</span>(&amp;hf, cx + <span class="tok-num">1</span>, cz));
                    <span class="tok-kw">const</span> c: Vec = pos + <span class="tok-fn">rotate</span>(rot, <span class="tok-fn">hfVertexLocal</span>(&amp;hf, cx, cz + <span class="tok-num">1</span>));
                    <span class="tok-kw">const</span> d: Vec = pos + <span class="tok-fn">rotate</span>(rot, <span class="tok-fn">hfVertexLocal</span>(&amp;hf, cx + <span class="tok-num">1</span>, cz + <span class="tok-num">1</span>));
                    z.<span class="tok-fn">drawTriangle3D</span>(gl, a, d, b, color);
                    z.<span class="tok-fn">drawTriangle3D</span>(gl, a, c, d, color);
                }
            }
        },
        .plane =&gt; |pl| {
            <span class="tok-comment">// Finite quad on the infinite half-space. x0 = closest point to origin;</span>
            <span class="tok-comment">// an orthonormal tangent basis spans a display-capped square.</span>
            <span class="tok-kw">const</span> n: Vec = <span class="tok-fn">rotate</span>(rot, pl.normal);
            <span class="tok-kw">const</span> x0: Vec = pos + <span class="tok-fn">rotate</span>(rot, pl.normal * <span class="tok-fn">splat</span>(-pl.distance));
            <span class="tok-kw">const</span> seed: Vec = <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(n[<span class="tok-num">1</span>]) &lt; <span class="tok-num">0.9</span>) <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>) <span class="tok-kw">else</span> <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
            <span class="tok-kw">const</span> u: Vec = <span class="tok-fn">normalize3</span>(<span class="tok-fn">cross</span>(seed, n));
            <span class="tok-kw">const</span> w: Vec = <span class="tok-fn">cross</span>(n, u);
            <span class="tok-kw">const</span> e: f32 = <span class="tok-builtin">@min</span>(pl.half_extent, <span class="tok-num">25.0</span>);
            <span class="tok-kw">const</span> c0: Vec = x0 + (u + w) * <span class="tok-fn">splat</span>(e);
            <span class="tok-kw">const</span> c1: Vec = x0 + (w - u) * <span class="tok-fn">splat</span>(e);
            <span class="tok-kw">const</span> c2: Vec = x0 - (u + w) * <span class="tok-fn">splat</span>(e);
            <span class="tok-kw">const</span> c3: Vec = x0 + (u - w) * <span class="tok-fn">splat</span>(e);
            z.<span class="tok-fn">drawTriangle3D</span>(gl, c0, c1, c2, color);
            z.<span class="tok-fn">drawTriangle3D</span>(gl, c0, c2, c3, color);
        },
        <span class="tok-comment">// empty = constraint-only placeholder (nothing to draw).</span>
        .empty =&gt; {},
    }
}

<span class="tok-comment">/// Draw every live body in `world`. Call between `z.beginMode3D` and</span>
<span class="tok-comment">/// `z.endMode3D`. No allocation, no persistent state: one ECS pass per frame.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">drawWorld</span>(gl: *WgpuGl, world: *phys.World, style: Style) void {
    <span class="tok-kw">const</span> zw: z.profiler.Zone = z.profiler.<span class="tok-fn">zoneNamed</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"render.world"</span>);
    <span class="tok-kw">defer</span> zw.<span class="tok-fn">end</span>();
    <span class="tok-kw">const</span> Ctx = <span class="tok-kw">struct</span> {
        gl: *WgpuGl,
        world: *phys.World,
        style: Style,
    };
    <span class="tok-kw">var</span> ctx: Ctx = .{ .gl = gl, .world = world, .style = style };
    world.bodies.<span class="tok-fn">forEach</span>(<span class="tok-kw">struct</span> {
        <span class="tok-kw">fn</span> <span class="tok-fn">cb</span>(cx: *Ctx, body: *<span class="tok-kw">const</span> phys.Body) void {
            <span class="tok-kw">if</span> (body.material == invisible_material) {
                <span class="tok-kw">return</span>;
            }
            <span class="tok-kw">const</span> color: Color = <span class="tok-fn">colorFor</span>(cx.style, body);
            <span class="tok-kw">const</span> shape: *<span class="tok-kw">const</span> phys.Shape = cx.world.shapes.<span class="tok-fn">get</span>(body.shape);
            <span class="tok-fn">drawShape</span>(cx.gl, cx.world, &amp;cx.style, shape, body.com_pos, body.rot, color);
        }
    }.cb, &amp;ctx);
}
