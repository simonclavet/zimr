<h1>gripper</h1>
<figure class="code src-file" data-path="examples/gripper/gripper.zig" data-lines="479"><figcaption><span>examples/gripper/gripper.zig</span><span>479 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! gripper - a 4-DOF arm with a geared two-finger gripper, driven by inverse kinematics.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * WHAT THIS DEMONSTRATES --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * an `&lt;equality type="joint"&gt;` COUPLING: one slider moves the left finger, and the right</span>
<span class="tok-comment">//!     mirrors it through a constraint the solver enforces - not through code that sets two</span>
<span class="tok-comment">//!     numbers. That is what a real parallel gripper is;</span>
<span class="tok-comment">//!   * damped-least-squares IK placing the grasp point wherever you put it, on a redundant</span>
<span class="tok-comment">//!     arm, once per frame;</span>
<span class="tok-comment">//!   * gains in FREQUENCY units. This arm's wrist has a mass-matrix diagonal of 0.00041</span>
<span class="tok-comment">//!     against 0.13 at its shoulder, and a `kp` that suits one destroys the other - see</span>
<span class="tok-comment">//!     `PoseHold.scale_by_inertia`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** WHY IT IS HAND-DRIVEN AND NOT A SCRIPTED PICK-AND-PLACE --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! **Inverse kinematics is collision-blind**, here and in MuJoCo. It will happily return a</span>
<span class="tok-comment">//! pose that folds the arm through its own base or through the table, reporting a</span>
<span class="tok-comment">//! sub-millimetre error for a configuration the robot cannot occupy. Measured: five targets in</span>
<span class="tok-comment">//! free space reached to under a millimetre with zero contacts; the same solver aiming at a</span>
<span class="tok-comment">//! cube on a table put the forearm INTO the table.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Choosing waypoints around an obstacle is a planning problem this engine does not claim to</span>
<span class="tok-comment">//! solve. So the human does it - which is not a consolation prize, because watching the arm</span>
<span class="tok-comment">//! track a target you drag around is a better demonstration of the IK than any fixed sequence.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** THE THING TO TRY --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Move the target down and toward the base. The arm follows until it cannot, and `reach err`</span>
<span class="tok-comment">//! climbs - that is the solver telling you the truth about a pose it found but the robot</span>
<span class="tok-comment">//! cannot hold.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> rbt = z.robot;
<span class="tok-kw">const</span> zp = z.zimrphysics;
<span class="tok-kw">const</span> mjcf = z.mjcf;
<span class="tok-kw">const</span> rmj = z.robot_mjcf;
<span class="tok-kw">const</span> bridge_mod = z.robot_physics;
<span class="tok-kw">const</span> ctl = z.robot_control;
<span class="tok-kw">const</span> Color = zm.Color;

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> ui = z.ui;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> quatToMat = zm.quatToMat;
<span class="tok-kw">const</span> identity = zm.identity;

<span class="tok-comment">/// The Go1 runs at 500 Hz in Menagerie, and its contacts want it.</span>
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> timestep: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">500.0</span>;

<span class="tok-comment">/// How many projectiles the scene carries.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** A FIXED POOL, RECYCLED, RATHER THAN SPAWNED ON DEMAND --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// A ball has to be a body in the ROBOT'S OWN TREE to hit it properly (section 4k) - that is the</span>
<span class="tok-comment">/// whole point of the unified tree, and it is what makes the impact push back on the legs</span>
<span class="tok-comment">/// with the right mass. But a tree is built once: adding a body means rebuilding the model,</span>
<span class="tok-comment">/// which throws away the robot's state mid-flight.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// So the balls exist from the start, parked below the floor where nothing can reach them,</span>
<span class="tok-comment">/// and a throw teleports one into place with a velocity. Recycling the oldest means the</span>
<span class="tok-comment">/// scene never grows and a rapid-fire user cannot exhaust it.</span>
<span class="tok-comment">/// Where an unthrown ball waits: far below the floor, spread out so two never overlap.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THEY ARE STILL SIMULATED DOWN THERE, and that is fine - nothing is near them, so they</span>
<span class="tok-comment">/// contribute no contacts and cost only their six DOFs in the mass matrix. Parking beats</span>
<span class="tok-comment">/// deleting because a tree cannot gain a body without being rebuilt, and rebuilding mid-throw</span>
<span class="tok-comment">/// would discard the robot's state.</span>
<span class="tok-comment">/// Where the fingers meet, in the wrist's frame.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * NOT THE WRIST'S ORIGIN. The jaws hang from it spanning 0.010..0.100, so the point a</span>
<span class="tok-comment">/// grasped object's centre belongs at is halfway down them. Aiming the origin instead puts the</span>
<span class="tok-comment">/// object 5 cm above the fingers and everything after looks like an IK failure.</span>
<span class="tok-kw">const</span> grasp_offset: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0.055</span>);

<span class="tok-kw">const</span> cube_half: f32 = <span class="tok-num">0.020</span>;
<span class="tok-comment">/// * THE TABLE CLEARS THE ARM. A first attempt spanned x from 0.10 - straight through the</span>
<span class="tok-comment">/// forearm's rest position at x = 0.163 - so the arm started embedded in the furniture and the</span>
<span class="tok-comment">/// cube was fired across the room. Obstacles are placed against the robot's ACTUAL rest pose.</span>
<span class="tok-kw">const</span> table_center: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0.45</span>, <span class="tok-num">0</span>, <span class="tok-num">0.40</span>);
<span class="tok-kw">const</span> table_half: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0.15</span>, <span class="tok-num">0.20</span>, <span class="tok-num">0.05</span>);

<span class="tok-kw">const</span> bg: Color = .{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">15</span>, .b = <span class="tok-num">20</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> link_col: Color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">185</span>, .b = <span class="tok-num">175</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> finger_col: Color = .{ .r = <span class="tok-num">225</span>, .g = <span class="tok-num">130</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> cube_col: Color = .{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> table_col: Color = .{ .r = <span class="tok-num">70</span>, .g = <span class="tok-num">66</span>, .b = <span class="tok-num">72</span>, .a = <span class="tok-num">255</span> };
<span class="tok-comment">/// Straight down: the wrist's local +z onto the world's -z.</span>
<span class="tok-kw">const</span> jaws_down: zm.Quat = zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), pi);

<span class="tok-kw">const</span> target_col: Color = .{ .r = <span class="tok-num">250</span>, .g = <span class="tok-num">240</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    doc: z.codecs.xml.Document,
    robot: mjcf.Robot,
    imported: rmj.Imported,
    data: rbt.Data,
    world: zp.World,
    bridge: bridge_mod.Bridge,
    actuated: ctl.Actuation,
    cam: z.OrbitCamera,
    ui_host: z.UiHost,
    font: z.Font,
    cylinder: z.Mesh,
    sphere: z.Mesh,
    cube: z.Mesh,
    transform: [<span class="tok-num">1</span>]Mat,
    accumulator: f32,

    <span class="tok-comment">/// What the PD tracks. IK writes joint angles here; nothing else does.</span>
    home: []f32,
    <span class="tok-comment">/// Scratch so the IK solve can run on a copy - see `solveReach`.</span>
    pose_scratch: []f32,
    ik_scratch: []Vec,
    wrist: u32,
    cube_body: u32,
    left_finger_q: u32,

    target: Vec,
    reach_error: f32,
    grip: f32,
    physics_on: bool,
    <span class="tok-comment">/// Whether to constrain the wrist's attitude as well as its position.</span>
    aim_down: bool,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.gpa = gpa;
    s.doc = <span class="tok-kw">try</span> z.codecs.xml.<span class="tok-fn">parse</span>(gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"arm.xml"</span>), null);
    s.robot = <span class="tok-kw">try</span> mjcf.<span class="tok-fn">readRobot</span>(gpa, &amp;s.doc);
    <span class="tok-kw">const</span> cube_body = [_]z.robot_scene.FreeBody{.{
        .name = <span class="tok-str">"cube"</span>,
        .pos = <span class="tok-fn">vec</span>(table_center[<span class="tok-num">0</span>], <span class="tok-num">0</span>, table_center[<span class="tok-num">2</span>] + table_half[<span class="tok-num">2</span>] + cube_half),
        .geoms = &amp;.{.{ .shape = .{ .box = .{ .half_extent = <span class="tok-fn">splat</span>(cube_half) } }, .mass = <span class="tok-num">0.08</span> }},
    }};
    s.imported = <span class="tok-kw">try</span> rmj.<span class="tok-fn">buildScene</span>(gpa, &amp;s.robot, &amp;cube_body, .{
        .max_contacts = <span class="tok-num">64</span>,
        .timestep = timestep,
        .gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">9.81</span>),
    });
    s.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);
    s.actuated = <span class="tok-kw">try</span> ctl.Actuation.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);

    s.world = <span class="tok-kw">try</span> zp.World.<span class="tok-fn">init</span>(gpa, <span class="tok-num">64</span>);
    s.world.gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">9.81</span>);
    <span class="tok-kw">const</span> table_shape: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = table_half, .convex_radius = <span class="tok-num">0.01</span> },
    });
    _ = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{ .shape = table_shape, .position = table_center, .motion_type = .static });
    <span class="tok-kw">const</span> floor_shape: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">3</span>, <span class="tok-num">3</span>, <span class="tok-num">0.5</span>), .convex_radius = <span class="tok-num">0.01</span> },
    });
    _ = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{ .shape = floor_shape, .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">0.5</span>), .motion_type = .static });

    <span class="tok-comment">// * THE READY POSE, and it is not decoration. Every joint at zero stands the arm straight</span>
    <span class="tok-comment">// up, which is SINGULAR: the Jacobian has no preferred direction, so the first IK call</span>
    <span class="tok-comment">// picks one arbitrarily. Measured from zero, a goal at (0.30, 0, 0.05) ended at</span>
    <span class="tok-comment">// (-0.50, 0, 0.45) - the opposite side of the robot.</span>
    _ = rmj.<span class="tok-fn">applyKeyframe</span>(&amp;s.imported.model, &amp;s.data, s.robot.keyframes[<span class="tok-num">0</span>]);
    rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);

    s.bridge = <span class="tok-kw">try</span> bridge_mod.Bridge.<span class="tok-fn">init</span>(gpa, &amp;s.world, &amp;s.imported.model, &amp;s.data, <span class="tok-num">64</span>);
    s.bridge.<span class="tok-fn">listen</span>(&amp;s.world);

    s.home = <span class="tok-kw">try</span> gpa.<span class="tok-fn">dupe</span>(f32, s.data.pos);
    s.pose_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.imported.model.nq);
    s.ik_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, ctl.Ik.<span class="tok-fn">scratchSize</span>(&amp;s.imported.model));
    s.wrist = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"wrist"</span>).?;
    s.cube_body = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"cube"</span>).?;
    s.left_finger_q = blk: {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.imported.model.njnt) |j| {
            <span class="tok-kw">if</span> (s.imported.model.jnt_type[j] == .slide) {
                <span class="tok-kw">break</span> :blk s.imported.model.jnt_qpos_adr[j];
            }
        }
        <span class="tok-kw">break</span> :blk <span class="tok-num">0</span>;
    };

    <span class="tok-comment">// Start the target where the grasp point already is, so nothing lurches on frame one.</span>
    s.target = s.data.body_xpos[s.wrist] + zm.<span class="tok-fn">rotate</span>(s.data.body_xrot[s.wrist], grasp_offset);
    s.reach_error = <span class="tok-num">0</span>;
    s.grip = <span class="tok-num">0</span>;
    s.physics_on = true;
    s.aim_down = true;
    s.accumulator = <span class="tok-num">0</span>;

    <span class="tok-comment">// * THE ORBIT TARGET IS THE TABLE, not the origin: the interesting half of this scene is</span>
    <span class="tok-comment">// 45 cm up, and a camera aimed at the floor spends its range looking at the pedestal.</span>
    s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.45</span>, <span class="tok-num">0.25</span>), <span class="tok-num">1.5</span>);
    s.font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font);
    s.cylinder = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCylinder</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">16</span>, <span class="tok-num">2</span>);
    s.sphere = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">10</span>, <span class="tok-num">8</span>);
    s.cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    s.transform = .{<span class="tok-fn">identity</span>()};
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    gpa.<span class="tok-fn">free</span>(s.ik_scratch);
    gpa.<span class="tok-fn">free</span>(s.pose_scratch);
    gpa.<span class="tok-fn">free</span>(s.home);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    s.actuated.<span class="tok-fn">deinit</span>();
    s.bridge.<span class="tok-fn">deinit</span>(&amp;s.world);
    s.world.<span class="tok-fn">deinit</span>(gpa);
    s.data.<span class="tok-fn">deinit</span>();
    s.imported.<span class="tok-fn">deinit</span>();
    s.robot.<span class="tok-fn">deinit</span>();
    s.doc.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Point the grasp at `s.target`, and write the result where the controller will read it.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- * THE SOLVE RUNS ON A COPY --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `Ik.solve` writes joint angles into `data` - that IS its answer. Doing it to the live state</span>
<span class="tok-comment">/// would teleport the arm every frame: no dynamics, no contact, nothing to resist. The result</span>
<span class="tok-comment">/// becomes a TARGET instead, so the arm travels there under its own torque limits and can</span>
<span class="tok-comment">/// visibly fail to arrive.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">solveReach</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-builtin">@memcpy</span>(s.pose_scratch, s.data.pos);
    <span class="tok-kw">const</span> result: ctl.Ik.Result = (ctl.Ik{ .max_iterations = <span class="tok-num">40</span> }).<span class="tok-fn">solve</span>(
        m,
        &amp;s.data,
        s.actuated,
        .{
            .body = s.wrist,
            .offset = grasp_offset,
            .goal = s.target,
            <span class="tok-comment">// * JAWS DOWN, WHICH A POSITION TARGET CANNOT ASK FOR. Without this the wrist's</span>
            <span class="tok-comment">// attitude is whatever the solver's nullspace drifted into - on this arm, sideways</span>
            <span class="tok-comment">// - and a top grasp is not expressible however the target position is moved.</span>
            .orientation = <span class="tok-kw">if</span> (s.aim_down) jaws_down <span class="tok-kw">else</span> null,
        },
        s.ik_scratch,
    );
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.njnt) |j| {
        <span class="tok-kw">if</span> (m.jnt_type[j] != .hinge) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> q: u32 = m.jnt_qpos_adr[j];
        s.home[q] = s.data.pos[q];
    }
    <span class="tok-builtin">@memcpy</span>(s.data.pos, s.pose_scratch);
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
    s.reach_error = result.error_distance;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;

    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">const</span> captured: bool = <span class="tok-fn">drawPanel</span>(u, s, f.window.<span class="tok-fn">widthf</span>(), f.window.<span class="tok-fn">heightf</span>());

    <span class="tok-comment">// * IK RUNS ONCE PER FRAME, NOT PER SUBSTEP. It answers "where should the joints be",</span>
    <span class="tok-comment">// which changes only when the target moves; inside the fixed-timestep loop it would</span>
    <span class="tok-comment">// recompute the same answer several times over and the cost would multiply.</span>
    <span class="tok-fn">solveReach</span>(s);

    s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
    <span class="tok-kw">while</span> (s.accumulator &gt;= timestep) : (s.accumulator -= timestep) {
        rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
        <span class="tok-kw">if</span> (s.physics_on) {
            <span class="tok-comment">// These two can only fail by running out of memory: the frame callback that contains them</span>
            <span class="tok-comment">// returns `void` by the engine's design, so there is nothing to propagate to. Swallowing</span>
            <span class="tok-comment">// leaves the world un-stepped for one frame, which is the least-bad outcome available here -</span>
            <span class="tok-comment">// and is why the rule wants it said out loud rather than written silently.</span>
            <span class="tok-comment">// lint:off catch-suppression: OOM only, void callback - see above</span>
            s.bridge.<span class="tok-fn">sync</span>(&amp;s.world, m, &amp;s.data) <span class="tok-kw">catch</span> {};
            <span class="tok-comment">// lint:off catch-suppression: OOM only, void callback - see above</span>
            zp.<span class="tok-fn">step</span>(&amp;s.world, timestep) <span class="tok-kw">catch</span> {};
            s.bridge.<span class="tok-fn">harvest</span>(&amp;s.data);
        } <span class="tok-kw">else</span> {
            s.data.<span class="tok-fn">clearContacts</span>();
        }
        <span class="tok-comment">// * GAINS IN FREQUENCY UNITS: `kp` is omega^2 and `kv` is 2 zeta omega. This arm's links differ by</span>
        <span class="tok-comment">// three orders of magnitude in inertia - 0.13 at the shoulder, 0.00041 at the wrist -</span>
        <span class="tok-comment">// and a single torque-unit gain cannot serve both. Measured at kp = 600 unscaled, the</span>
        <span class="tok-comment">// wrist DIVERGED to the velocity clamp while its position sat still, which reads as a</span>
        <span class="tok-comment">// stuck joint rather than a broken controller.</span>
        (ctl.PoseHold{
            .target = s.home,
            .kp = <span class="tok-num">2500</span>,
            .kv = <span class="tok-num">100</span>,
            .max_torque = <span class="tok-num">300</span>,
            .scale_by_inertia = true,
        }).<span class="tok-fn">apply</span>(m, &amp;s.data, s.actuated);
        <span class="tok-comment">// The gripper is commanded directly; the coupling moves the other finger.</span>
        s.home[s.left_finger_q] = -s.grip;
        rbt.<span class="tok-fn">step</span>(m, &amp;s.data);
    }
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);

    z.<span class="tok-fn">clearViewport</span>(f, bg);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, captured, .{ .min_distance = <span class="tok-num">0.5</span>, .max_distance = <span class="tok-num">4.0</span> });
    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    z.<span class="tok-fn">drawGrid</span>(gl, <span class="tok-num">16</span>, <span class="tok-num">0.25</span>);
    <span class="tok-fn">drawScene</span>(s, gl);
    z.<span class="tok-fn">endMode3D</span>(gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawScene</span>(s: *State, gl: *z.WgpuGl) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> to_y_up: Mat = zm.<span class="tok-fn">zUpToYUp</span>();

    <span class="tok-comment">// The table, which is world geometry rather than part of the tree.</span>
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">mulMat</span>(to_y_up, <span class="tok-fn">translation</span>(table_center[<span class="tok-num">0</span>], table_center[<span class="tok-num">1</span>], table_center[<span class="tok-num">2</span>])),
        <span class="tok-fn">scaling</span>(<span class="tok-num">2</span> * table_half[<span class="tok-num">0</span>], <span class="tok-num">2</span> * table_half[<span class="tok-num">1</span>], <span class="tok-num">2</span> * table_half[<span class="tok-num">2</span>]),
    );
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, table_col);

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.ngeom) |g| {
        <span class="tok-kw">const</span> body: u32 = m.geom_body[g];
        <span class="tok-kw">const</span> body_rot: zm.Quat = s.data.body_xrot[body];
        <span class="tok-kw">const</span> world_pos: Vec = s.data.body_xpos[body] + zm.<span class="tok-fn">rotate</span>(body_rot, m.geom_pos[g]);
        <span class="tok-kw">const</span> world_rot: Mat = <span class="tok-fn">quatToMat</span>(zm.<span class="tok-fn">qmul</span>(body_rot, m.geom_rot[g]));
        <span class="tok-kw">const</span> place: Mat = <span class="tok-fn">mulMat</span>(
            <span class="tok-fn">mulMat</span>(to_y_up, <span class="tok-fn">translation</span>(world_pos[<span class="tok-num">0</span>], world_pos[<span class="tok-num">1</span>], world_pos[<span class="tok-num">2</span>])),
            world_rot,
        );
        <span class="tok-kw">const</span> tint: Color = <span class="tok-kw">if</span> (body == s.cube_body)
            cube_col
        <span class="tok-kw">else</span> <span class="tok-kw">if</span> (body &gt;= s.wrist)
            finger_col
        <span class="tok-kw">else</span>
            link_col;
        <span class="tok-kw">switch</span> (m.geom_shape[g]) {
            .sphere =&gt; |sph| {
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">scaling</span>(sph.radius, sph.radius, sph.radius));
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, tint);
            },
            .capsule =&gt; |cap| {
                <span class="tok-comment">// * THE GENERATED CYLINDER SPANS [0, h] ALONG Y, not centred on the origin and</span>
                <span class="tok-comment">// not along Z - measured from the mesh's own bounds rather than read off the</span>
                <span class="tok-comment">// generator, which remaps as it writes.</span>
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
                    <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, -cap.half_height, <span class="tok-num">0</span>)),
                    <span class="tok-fn">scaling</span>(cap.radius, <span class="tok-num">2.0</span> * cap.half_height, cap.radius),
                );
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cylinder, &amp;s.transform, tint);
            },
            .cylinder =&gt; |cyl| {
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
                    <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, -cyl.half_height, <span class="tok-num">0</span>)),
                    <span class="tok-fn">scaling</span>(cyl.radius, <span class="tok-num">2.0</span> * cyl.half_height, cyl.radius),
                );
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cylinder, &amp;s.transform, tint);
            },
            .box =&gt; |b| {
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">scaling</span>(
                    <span class="tok-num">2</span> * b.half_extent[<span class="tok-num">0</span>],
                    <span class="tok-num">2</span> * b.half_extent[<span class="tok-num">1</span>],
                    <span class="tok-num">2</span> * b.half_extent[<span class="tok-num">2</span>],
                ));
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, tint);
            },
            <span class="tok-kw">else</span> =&gt; {},
        }
    }

    <span class="tok-comment">// The target, so the thing being tracked is visible alongside what is tracking it.</span>
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">mulMat</span>(to_y_up, <span class="tok-fn">translation</span>(s.target[<span class="tok-num">0</span>], s.target[<span class="tok-num">1</span>], s.target[<span class="tok-num">2</span>])),
        <span class="tok-fn">scaling</span>(<span class="tok-num">0.016</span>, <span class="tok-num">0.016</span>, <span class="tok-num">0.016</span>),
    );
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, target_col);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(u: ui.Ui, s: *State, viewport_w: f32, viewport_h: f32) bool {
    <span class="tok-kw">const</span> captured: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    <span class="tok-comment">// Sized to the viewport rather than to pixels - see `ui.Ui.scaleToViewport`.</span>
    <span class="tok-kw">const</span> narrow: bool = ui.Ui.<span class="tok-fn">isNarrow</span>(viewport_w);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-kw">if</span> (narrow) viewport_w - <span class="tok-num">16</span> <span class="tok-kw">else</span> <span class="tok-builtin">@min</span>(<span class="tok-num">400.0</span>, viewport_w * <span class="tok-num">0.32</span>);
    _ = u.<span class="tok-fn">scaleToViewport</span>(panel_w, <span class="tok-kw">if</span> (narrow) <span class="tok-num">30.0</span> <span class="tok-kw">else</span> <span class="tok-num">22.0</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    <span class="tok-comment">// Height capped to the viewport: auto-size lets the window run off a short screen.</span>
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-builtin">@min</span>(<span class="tok-num">470.0</span>, viewport_h * <span class="tok-num">0.7</span>) }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"4-DOF arm with a geared gripper"</span>, .{})) |window| {
        <span class="tok-kw">defer</span> window.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"IK target (metres)"</span>, .{});
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"x"</span>, &amp;s.target[<span class="tok-num">0</span>], .{ .min = <span class="tok-num">0.10</span>, .max = <span class="tok-num">0.60</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"y"</span>, &amp;s.target[<span class="tok-num">1</span>], .{ .min = -<span class="tok-num">0.40</span>, .max = <span class="tok-num">0.40</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"z"</span>, &amp;s.target[<span class="tok-num">2</span>], .{ .min = <span class="tok-num">0.20</span>, .max = <span class="tok-num">0.75</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"   reach err {d:.4} m"</span>, .{s.reach_error});
        <span class="tok-comment">// * TURN THIS OFF AND WATCH THE WRIST WANDER. Position targets say nothing about</span>
        <span class="tok-comment">// attitude, so the jaws end up wherever the nullspace leaves them - which is exactly</span>
        <span class="tok-comment">// why an orientation target had to exist.</span>
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"aim the jaws down"</span>, &amp;s.aim_down);
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// ** ONE SLIDER, TWO FINGERS. The right one is not set here - an</span>
        <span class="tok-comment">// `&lt;equality type="joint" polycoef="0 -1"&gt;` ties it to the left, and the SOLVER moves</span>
        <span class="tok-comment">// it. That is what a parallel gripper physically is, and modelling it as two joints a</span>
        <span class="tok-comment">// controller keeps in sync is how a gripper ends up gripping crooked.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"gripper (one motor, coupled)"</span>, .{});
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"close"</span>, &amp;s.grip, .{ .min = -<span class="tok-num">0.010</span>, .max = <span class="tok-num">0.020</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"   left {d:&gt;6.3}  right {d:&gt;6.3}"</span>, .{
            s.data.pos[s.left_finger_q],
            s.data.pos[s.left_finger_q + <span class="tok-num">1</span>],
        });
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"physics"</span>, &amp;s.physics_on);
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"reset"</span>, .{})) {
            <span class="tok-fn">resetScene</span>(s);
        }
        u.<span class="tok-fn">text</span>(<span class="tok-str">"contacts {d}"</span>, .{s.data.contact_count});
    }
    <span class="tok-kw">return</span> captured;
}

<span class="tok-comment">/// Put the arm and the cube back where they started.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * EVERYTHING THAT REMEMBERS, or the button appears to do nothing: `home` is what the</span>
<span class="tok-comment">/// controller tracks, so restoring `pos` alone lets it drag the arm straight back. Velocities</span>
<span class="tok-comment">/// go too - a reset mid-swing keeps its momentum - and so does the solver's warm start.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">resetScene</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    _ = rmj.<span class="tok-fn">applyKeyframe</span>(m, &amp;s.data, s.robot.keyframes[<span class="tok-num">0</span>]);
    <span class="tok-kw">const</span> cube_joint: u32 = m.jnt_qpos_adr[m.body_jnt_adr[s.cube_body]];
    s.data.pos[cube_joint + <span class="tok-num">0</span>] = table_center[<span class="tok-num">0</span>];
    s.data.pos[cube_joint + <span class="tok-num">1</span>] = <span class="tok-num">0</span>;
    s.data.pos[cube_joint + <span class="tok-num">2</span>] = table_center[<span class="tok-num">2</span>] + table_half[<span class="tok-num">2</span>] + cube_half;
    s.data.pos[cube_joint + <span class="tok-num">3</span>] = <span class="tok-num">0</span>;
    s.data.pos[cube_joint + <span class="tok-num">4</span>] = <span class="tok-num">0</span>;
    s.data.pos[cube_joint + <span class="tok-num">5</span>] = <span class="tok-num">0</span>;
    s.data.pos[cube_joint + <span class="tok-num">6</span>] = <span class="tok-num">1</span>;
    <span class="tok-builtin">@memset</span>(s.data.vel, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.data.acc, <span class="tok-num">0</span>);
    s.data.<span class="tok-fn">clearContacts</span>();
    s.data.<span class="tok-fn">forgetWarmStart</span>();
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
    <span class="tok-builtin">@memcpy</span>(s.home, s.data.pos);
    s.grip = <span class="tok-num">0</span>;
    s.accumulator = <span class="tok-num">0</span>;
    s.target = s.data.body_xpos[s.wrist] + zm.<span class="tok-fn">rotate</span>(s.data.body_xrot[s.wrist], grasp_offset);
}
