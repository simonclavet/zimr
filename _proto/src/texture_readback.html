<h1>texture_readback</h1>
<figure class="code src-file" data-path="examples/texture_readback/texture_readback.zig" data-lines="194"><figcaption><span>examples/texture_readback/texture_readback.zig</span><span>194 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! texture_readback - port of the GL `texture_readback`: prove the</span>
<span class="tok-comment">//! GPU-&gt;CPU pixel path end-to-end.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   1. Render an animated scene into a 256x256 RenderTexture.</span>
<span class="tok-comment">//!   2. `wgpu.copyTextureToBuffer` (NEW bridge op, t1171) copies the RTT</span>
<span class="tok-comment">//!      into a MAP_READ staging buffer on its own encoder+submit.</span>
<span class="tok-comment">//!   3. The poll-based `bufferRead*` family (the compute path's readback</span>
<span class="tok-comment">//!      machinery) maps it without ever stalling a frame.</span>
<span class="tok-comment">//!   4. The bytes re-upload into a `CpuFramebuffer` and draw NEXT to the</span>
<span class="tok-comment">//!      live RTT - the two panels must match (one async step apart).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The GL original's `loadImageFromTexture` was synchronous (glReadPixels);</span>
<span class="tok-comment">//! WebGPU mapping is async by spec, so the wgpu shape is a frame-delayed</span>
<span class="tok-comment">//! state machine: copy -&gt; poll -&gt; read -&gt; re-upload -&gt; repeat.  The readback</span>
<span class="tok-comment">//! panel therefore trails the live panel by the round-trip latency - watch</span>
<span class="tok-comment">//! the orbiting dot lag a step; that lag IS the demo being honest.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! 256x256 is chosen so `width * 4 = 1024` bytes/row is already 256-aligned</span>
<span class="tok-comment">//! (the WebGPU `bytesPerRow` rule) - no row padding to strip.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> c = z.colors;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> rt_size: u32 = <span class="tok-num">256</span>;
<span class="tok-kw">const</span> rt_bytes: u32 = rt_size * rt_size * <span class="tok-num">4</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    rt: z.RenderTexture = .{},
    <span class="tok-comment">/// MAP_READ|COPY_DST staging buffer the texture copies into.</span>
    staging: z.wgpu.BufferHandle,
    <span class="tok-comment">/// In-flight poll handle; .invalid = no read pending -&gt; start one.</span>
    read: z.wgpu.BufferRead = .invalid,
    <span class="tok-comment">/// CPU destination + the texture it re-uploads into.</span>
    pixels: []u8,
    readback_fb: z.CpuFramebuffer,
    angle: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Completed round-trips, shown in the HUD (proves liveness in smoke).</span>
    roundtrips: u32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    gpa.<span class="tok-fn">free</span>(s.pixels);
    s.rt.<span class="tok-fn">deinit</span>();
    s.readback_fb.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.staging);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> pixels: []u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u8, rt_bytes);
    <span class="tok-builtin">@memset</span>(pixels, <span class="tok-num">0</span>);
    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .staging = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
            .size = rt_bytes,
            .usage = .{ .copy_dst = true, .map_read = true },
            .label = <span class="tok-str">"readback_staging"</span>,
        }),
        .pixels = pixels,
        .readback_fb = z.CpuFramebuffer.<span class="tok-fn">init</span>(
            f.gpu.device,
            f.gpu.queue,
            rt_size,
            rt_size,
            pixels,
            <span class="tok-str">"readback_view"</span>,
        ),
    };
}

<span class="tok-comment">/// Advance the copy-&gt;map-&gt;read state machine by at most one step per frame.</span>
<span class="tok-comment">/// Submission order makes this read LAST frame's RTT (the copy encoder</span>
<span class="tok-comment">/// submits before the frame's own encoder) - exactly the one-step lag the</span>
<span class="tok-comment">/// header describes.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pumpReadback</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">if</span> (s.read != .invalid) {
        <span class="tok-kw">if</span> (z.wgpu.<span class="tok-fn">bufferReadPoll</span>(s.read)) {
            z.wgpu.<span class="tok-fn">bufferReadInto</span>(s.read, s.pixels);
            z.wgpu.<span class="tok-fn">bufferReadRelease</span>(s.read);
            s.read = .invalid;
            s.readback_fb.<span class="tok-fn">update</span>(f.gpu.queue, s.pixels);
            s.roundtrips += <span class="tok-num">1</span>;
        }
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> enc: z.wgpu.CommandEncoderHandle = z.wgpu.<span class="tok-fn">createCommandEncoder</span>(f.gpu.device);
    z.wgpu.<span class="tok-fn">copyTextureToBuffer</span>(enc, s.rt.color, s.staging, rt_size * <span class="tok-num">4</span>, rt_size, rt_size);
    z.wgpu.<span class="tok-fn">queueSubmit</span>(f.gpu.queue, z.wgpu.<span class="tok-fn">finishCommandEncoder</span>(enc));
    s.read = z.wgpu.<span class="tok-fn">bufferReadStart</span>(s.staging, rt_bytes);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">if</span> (s.rt.color == .invalid) {
        s.rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, rt_size, rt_size);
    }
    <span class="tok-fn">pumpReadback</span>(f, s);
    s.angle += f.time.delta_time * <span class="tok-num">90.0</span>;
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing).</span>
    <span class="tok-comment">// ---- Animated source content into the RTT --------------------------------</span>
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt, .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">22</span>, .b = <span class="tok-num">34</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> rtf: f32 = <span class="tok-fn">float</span>(rt_size);
    <span class="tok-kw">const</span> rad: f32 = s.angle * pi / <span class="tok-num">180.0</span>;
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = <span class="tok-num">24</span>, .y = <span class="tok-num">24</span>, .width = rtf - <span class="tok-num">48</span>, .height = rtf - <span class="tok-num">48</span> },
        .{ .color = .{ .r = <span class="tok-num">30</span>, .g = <span class="tok-num">40</span>, .b = <span class="tok-num">64</span>, .a = <span class="tok-num">255</span> } },
    );
    f.gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">24</span>, .y = <span class="tok-num">24</span>, .width = rtf - <span class="tok-num">48</span>, .height = rtf - <span class="tok-num">48</span> }, .{ .color = c.slate_400, .outline = <span class="tok-num">1.0</span> });
    f.gl.<span class="tok-fn">circle</span>(
        .{ rtf * <span class="tok-num">0.5</span> + <span class="tok-builtin">@cos</span>(rad) * <span class="tok-num">80</span>, rtf * <span class="tok-num">0.5</span> + <span class="tok-builtin">@sin</span>(rad) * <span class="tok-num">80</span> },
        <span class="tok-num">18</span>,
        .{ .color = c.amber_400, .segments = <span class="tok-num">16</span> },
    );
    f.gl.<span class="tok-fn">circle</span>(.{ rtf * <span class="tok-num">0.5</span>, rtf * <span class="tok-num">0.5</span> }, <span class="tok-num">30</span>, .{ .color = c.sky_400, .segments = <span class="tok-num">16</span> });
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = rtf * <span class="tok-num">0.5</span> - <span class="tok-num">6</span>, .y = rtf * <span class="tok-num">0.5</span> - <span class="tok-num">60</span> - <span class="tok-builtin">@sin</span>(rad * <span class="tok-num">2</span>) * <span class="tok-num">20</span>, .width = <span class="tok-num">12</span>, .height = <span class="tok-num">40</span> },
        .{ .color = c.rose_400 },
    );
    z.<span class="tok-fn">endTextureMode</span>(f.gl);

    <span class="tok-comment">// SCREEN PASS: open once, clear, then draw the panels.</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-comment">// ---- Two panels: live RTT (left) vs round-tripped pixels (right) ---------</span>
    <span class="tok-kw">const</span> pad: f32 = <span class="tok-num">14</span>;
    <span class="tok-kw">const</span> panel: f32 = <span class="tok-builtin">@min</span>((vw - pad * <span class="tok-num">3</span>) * <span class="tok-num">0.5</span>, vh - <span class="tok-num">110</span>);
    <span class="tok-kw">const</span> py: f32 = (vh - panel) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> x1: f32 = pad;
    <span class="tok-kw">const</span> x2: f32 = pad * <span class="tok-num">2</span> + panel;
    <span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };
    f.gl.<span class="tok-fn">texture</span>(.{ .x = x1, .y = py, .width = panel, .height = panel }, s.rt.<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    s.readback_fb.<span class="tok-fn">present</span>(f.gl, x2, py, panel, panel);
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = x1 - <span class="tok-num">1</span>, .y = py - <span class="tok-num">1</span>, .width = panel + <span class="tok-num">2</span>, .height = panel + <span class="tok-num">2</span> },
        .{ .color = c.slate_500, .outline = <span class="tok-num">1.0</span> },
    );
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = x2 - <span class="tok-num">1</span>, .y = py - <span class="tok-num">1</span>, .width = panel + <span class="tok-num">2</span>, .height = panel + <span class="tok-num">2</span> },
        .{ .color = c.slate_500, .outline = <span class="tok-num">1.0</span> },
    );

    f.gl.<span class="tok-fn">text</span>(
        .{ x1, py - <span class="tok-num">28</span> },
        <span class="tok-str">"render texture"</span>,
        .{ .size = <span class="tok-num">18</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
    f.gl.<span class="tok-fn">text</span>(
        .{ x2, py - <span class="tok-num">28</span> },
        <span class="tok-str">"GPU&gt;CPU&gt;GPU readback"</span>,
        .{ .size = <span class="tok-num">18</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
    <span class="tok-kw">var</span> hud_buf: [<span class="tok-num">64</span>]u8 = undefined;
    <span class="tok-kw">const</span> hud: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;hud_buf, <span class="tok-str">"round-trips: {d}"</span>, .{s.roundtrips}) <span class="tok-kw">catch</span> <span class="tok-str">"round-trips: ?"</span>;
    f.gl.<span class="tok-fn">text</span>(
        .{ x2, py + panel + <span class="tok-num">10</span> },
        hud,
        .{ .size = <span class="tok-num">16</span>, .color = .{ .r = <span class="tok-num">170</span>, .g = <span class="tok-num">180</span>, .b = <span class="tok-num">200</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"copyTextureToBuffer + poll-mapped staging - the panels match, one async step apart"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}
