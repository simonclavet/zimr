<h1>image_editor</h1>
<figure class="code src-file" data-path="examples/image_editor/image_editor.zig" data-lines="184"><figcaption><span>examples/image_editor/image_editor.zig</span><span>184 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! image_editor - port of the GL `image_editor`: a tour of the CPU image</span>
<span class="tok-comment">//! API now living in src/image.zig. A 32x32 PNG is decoded once</span>
<span class="tok-comment">//! (`loadImageFromMemory`), then `imageCopy`'d four ways and edited -</span>
<span class="tok-comment">//! `imageBlurGaussian`, `imageColorInvert`, `imageRotateCW` - each uploaded to</span>
<span class="tok-comment">//! its own GPU texture (`loadTextureFromImage`). A fifth "live" panel keeps a</span>
<span class="tok-comment">//! CPU buffer around, rewrites its pixels every frame (a brightness wave over a</span>
<span class="tok-comment">//! diagonal gradient), and pushes them with `updateTexture` (in-place, no new</span>
<span class="tok-comment">//! texture). Panels are drawn via the rl-immediate textured-quad path.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> c = z.colors;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> smiley_png = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"smiley.png"</span>);

<span class="tok-kw">const</span> panel_size: f32 = <span class="tok-num">128</span>;
<span class="tok-kw">const</span> panel_pad: f32 = <span class="tok-num">16</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    scratch: std.heap.ArenaAllocator,
    gpa: Allocator,
    tex_original: z.WgpuTexture,
    tex_blurred: z.WgpuTexture,
    tex_inverted: z.WgpuTexture,
    tex_rotated: z.WgpuTexture,
    live_tex: z.WgpuTexture,
    <span class="tok-comment">/// Kept on CPU so its bytes can be rewritten + re-uploaded each frame.</span>
    live_image: z.Image,
    frame_count: usize = <span class="tok-num">0</span>,
};

<span class="tok-comment">/// imageCopy the source, run `edit` on the copy, upload it, free the copy.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">variant</span>(
    f: *z.Frame,
    gpa: Allocator,
    source: z.Image,
    edit: *<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (gpa: Allocator, img: *z.Image) anyerror!void,
) !z.WgpuTexture {
    <span class="tok-kw">var</span> img: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">imageCopy</span>(gpa, source);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadImage</span>(gpa, img);
    <span class="tok-kw">try</span> <span class="tok-fn">edit</span>(gpa, &amp;img);
    <span class="tok-kw">return</span> z.<span class="tok-fn">loadTextureFromImage</span>(f.gl, img);
}

<span class="tok-kw">fn</span> <span class="tok-fn">editBlur</span>(gpa: Allocator, img: *z.Image) anyerror!void {
    <span class="tok-kw">try</span> z.<span class="tok-fn">imageBlurGaussian</span>(gpa, img, <span class="tok-num">4</span>);
}
<span class="tok-kw">fn</span> <span class="tok-fn">editInvert</span>(gpa: Allocator, img: *z.Image) anyerror!void {
    _ = gpa;
    z.<span class="tok-fn">imageColorInvert</span>(img);
}
<span class="tok-kw">fn</span> <span class="tok-fn">editRotate</span>(gpa: Allocator, img: *z.Image) anyerror!void {
    <span class="tok-kw">try</span> z.<span class="tok-fn">imageRotateCW</span>(gpa, img);
}
<span class="tok-kw">fn</span> <span class="tok-fn">editNone</span>(gpa: Allocator, img: *z.Image) anyerror!void {
    _ = gpa;
    _ = img;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);
    <span class="tok-kw">const</span> source: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">loadImageFromMemory</span>(gpa, smiley_png);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadImage</span>(gpa, source);

    s.* = .{
        .font = font,
        .scratch = std.heap.ArenaAllocator.<span class="tok-fn">init</span>(gpa),
        .gpa = gpa,
        .tex_original = <span class="tok-kw">try</span> <span class="tok-fn">variant</span>(f, gpa, source, editNone),
        .tex_blurred = <span class="tok-kw">try</span> <span class="tok-fn">variant</span>(f, gpa, source, editBlur),
        .tex_inverted = <span class="tok-kw">try</span> <span class="tok-fn">variant</span>(f, gpa, source, editInvert),
        .tex_rotated = <span class="tok-kw">try</span> <span class="tok-fn">variant</span>(f, gpa, source, editRotate),
        <span class="tok-comment">// Live: keep its own CPU copy alive for per-frame re-upload.</span>
        .live_image = <span class="tok-kw">try</span> z.<span class="tok-fn">imageCopy</span>(gpa, source),
        .live_tex = <span class="tok-kw">try</span> <span class="tok-fn">variant</span>(f, gpa, source, editNone),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.tex_original.<span class="tok-fn">deinit</span>();
    s.tex_blurred.<span class="tok-fn">deinit</span>();
    s.tex_inverted.<span class="tok-fn">deinit</span>();
    s.tex_rotated.<span class="tok-fn">deinit</span>();
    s.live_tex.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadImage</span>(gpa, s.live_image);
    s.scratch.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Draw `tex` as a `sizexsize` quad at (x,y) via rl-immediate, + a caption.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(
    f: *z.Frame,
    font: z.Font,
    tex: z.WgpuTexture,
    x: f32,
    y: f32,
    size: f32,
    label: []<span class="tok-kw">const</span> u8,
) void {
    f.gl.<span class="tok-fn">rect</span>(.{ .x = x - <span class="tok-num">4</span>, .y = y - <span class="tok-num">4</span>, .width = size + <span class="tok-num">8</span>, .height = size + <span class="tok-num">26</span> }, .{ .color = c.slate_800 });
    z.<span class="tok-fn">rlSetTexture</span>(f.gl, tex);
    z.<span class="tok-fn">rlBegin</span>(f.gl, .triangles);
    z.<span class="tok-fn">rlColor4ub</span>(f.gl, <span class="tok-num">255</span>, <span class="tok-num">255</span>, <span class="tok-num">255</span>, <span class="tok-num">255</span>);
    z.<span class="tok-fn">rlTexCoord2f</span>(f.gl, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    z.<span class="tok-fn">rlVertex2f</span>(f.gl, x, y);
    z.<span class="tok-fn">rlTexCoord2f</span>(f.gl, <span class="tok-num">1</span>, <span class="tok-num">0</span>);
    z.<span class="tok-fn">rlVertex2f</span>(f.gl, x + size, y);
    z.<span class="tok-fn">rlTexCoord2f</span>(f.gl, <span class="tok-num">1</span>, <span class="tok-num">1</span>);
    z.<span class="tok-fn">rlVertex2f</span>(f.gl, x + size, y + size);
    z.<span class="tok-fn">rlTexCoord2f</span>(f.gl, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    z.<span class="tok-fn">rlVertex2f</span>(f.gl, x, y);
    z.<span class="tok-fn">rlTexCoord2f</span>(f.gl, <span class="tok-num">1</span>, <span class="tok-num">1</span>);
    z.<span class="tok-fn">rlVertex2f</span>(f.gl, x + size, y + size);
    z.<span class="tok-fn">rlTexCoord2f</span>(f.gl, <span class="tok-num">0</span>, <span class="tok-num">1</span>);
    z.<span class="tok-fn">rlVertex2f</span>(f.gl, x, y + size);
    z.<span class="tok-fn">rlEnd</span>(f.gl);
    z.<span class="tok-fn">rlSetTexture</span>(f.gl, .{});
    f.gl.<span class="tok-fn">text</span>(.{ x, y + size + <span class="tok-num">6</span> }, label, .{ .size = <span class="tok-num">13</span>, .color = c.sky_200, .font = &amp;font });
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    _ = state.scratch.<span class="tok-fn">reset</span>(.retain_capacity);
    state.frame_count += <span class="tok-num">1</span>;
    <span class="tok-kw">const</span> t: f32 = f.time.time;

    <span class="tok-comment">// Live panel: rewrite the CPU pixels (brightness wave over a diagonal</span>
    <span class="tok-comment">// gradient) and re-upload in place with updateTexture - no new texture.</span>
    <span class="tok-kw">if</span> (state.live_image.data) |data| {
        <span class="tok-kw">const</span> wave: f32 = <span class="tok-num">0.7</span> + <span class="tok-num">0.3</span> * <span class="tok-builtin">@sin</span>(t * <span class="tok-num">2.0</span>);
        <span class="tok-kw">const</span> w: usize = <span class="tok-builtin">@intCast</span>(state.live_image.width);
        <span class="tok-kw">const</span> total: usize = w * <span class="tok-builtin">@as</span>(usize, <span class="tok-builtin">@intCast</span>(state.live_image.height));
        <span class="tok-kw">const</span> pixels: [*]u8 = <span class="tok-builtin">@ptrCast</span>(data);
        <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (i &lt; total) : (i += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">float</span>(i % w);
            <span class="tok-kw">const</span> y: f32 = <span class="tok-fn">float</span>(i / w);
            <span class="tok-kw">const</span> r: f32 = (x / <span class="tok-fn">float</span>(state.live_image.width)) * <span class="tok-num">255.0</span> * wave;
            <span class="tok-kw">const</span> g: f32 = (y / <span class="tok-fn">float</span>(state.live_image.height)) * <span class="tok-num">255.0</span> * wave;
            pixels[i * <span class="tok-num">4</span> + <span class="tok-num">0</span>] = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(r, <span class="tok-num">0.0</span>, <span class="tok-num">255.0</span>));
            pixels[i * <span class="tok-num">4</span> + <span class="tok-num">1</span>] = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(g, <span class="tok-num">0.0</span>, <span class="tok-num">255.0</span>));
            pixels[i * <span class="tok-num">4</span> + <span class="tok-num">2</span>] = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(<span class="tok-num">128.0</span> * wave, <span class="tok-num">0.0</span>, <span class="tok-num">255.0</span>));
            pixels[i * <span class="tok-num">4</span> + <span class="tok-num">3</span>] = <span class="tok-num">255</span>;
        }
        z.<span class="tok-fn">updateTexture</span>(f.gl, state.live_tex, state.live_image);
    }

    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);
    common.<span class="tok-fn">caption</span>(f.gl, state.font, <span class="tok-str">"image* CPU edits (blur/invert/rotate) + a live updateTexture pulse"</span>);

    <span class="tok-comment">// 2x2 grid of static variants.</span>
    <span class="tok-kw">const</span> x0: f32 = <span class="tok-num">32</span>;
    <span class="tok-kw">const</span> y0: f32 = <span class="tok-num">48</span>;
    <span class="tok-kw">const</span> step: f32 = panel_size + panel_pad + <span class="tok-num">14</span>;
    <span class="tok-fn">drawPanel</span>(f, state.font, state.tex_original, x0, y0, panel_size, <span class="tok-str">"original"</span>);
    <span class="tok-fn">drawPanel</span>(f, state.font, state.tex_blurred, x0 + panel_size + panel_pad, y0, panel_size, <span class="tok-str">"blurred"</span>);
    <span class="tok-fn">drawPanel</span>(f, state.font, state.tex_inverted, x0, y0 + step, panel_size, <span class="tok-str">"inverted"</span>);
    <span class="tok-fn">drawPanel</span>(f, state.font, state.tex_rotated, x0 + panel_size + panel_pad, y0 + step, panel_size, <span class="tok-str">"rotated 90"</span>);

    <span class="tok-comment">// Live panel, larger, on the right.</span>
    <span class="tok-fn">drawPanel</span>(f, state.font, state.live_tex, <span class="tok-num">480</span>, <span class="tok-num">70</span>, <span class="tok-num">240</span>, <span class="tok-str">"live (updateTexture)"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

            .scale_mode = .responsive,
        },

    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
