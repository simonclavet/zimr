<style>
:root{
  /* two surfaces, one ink */
  --bg:#0a0a0a;          /* the page */
  --panel:#141414;       /* anything set apart: code, callout, device side */
  --panel-2:#1b1b1b;     /* a panel on a panel (figcaption, summary) */
  --fg:#e8e8e8;          /* body text */
  --dim:#9aa0a8;         /* secondary text, captions */
  --faint:#6b7280;       /* labels, line numbers, table headers */
  --rule:#262626;        /* every border in the document */
  --link:#82d8ef;
  /* tokens — the one set, shared by the Zig and WGSL highlighters */
  --tok-comment:#6b7a8c;
  --tok-kw:#c792ea;
  --tok-fn:#82d8ef;
  --tok-str:#9ad08a;
  --tok-num:#f5a35e;
  --tok-type:#6fb6ff;
  --tok-builtin:#e9a23b;
  /* one font: mono, from whatever ships on the device. No download. */
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --maxw:860px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0 auto;padding:2.2rem 1.1rem 6rem;max-width:var(--maxw);

}

h1{font-size:1.6rem;margin-top:0;}

h3{font-size:1.05rem;}

p{margin:0 0 1.1em;}
a{color:var(--link);text-decoration:none;border-bottom:1px solid var(--rule);}

pre{

  border:1px solid var(--rule);border-radius:3px;
  overflow-x:auto;font-size:13px;line-height:1.6;
}
pre,code,kbd,samp{font-family:var(--mono);}
pre code{background:none;padding:0;border:0;font-size:inherit;color:var(--fg);}
code{background:var(--panel);padding:.1em .35em;border-radius:2px;font-size:.92em;color:#fff;}
.tok-comment{color:var(--tok-comment);font-style:italic;}

/* a captioned code block: <figure class="code"><figcaption>… */
figure{margin:1.3em 0;}

  background:var(--panel-2);border:1px solid var(--rule);border-bottom:0;
  border-radius:3px 3px 0 0;padding:6px 12px;font-size:11.5px;color:var(--faint);
  display:flex;justify-content:space-between;gap:1em;
}
figure.code figcaption .lang{color:var(--dim);text-transform:uppercase;letter-spacing:.16em;}
figure.code pre{margin:0;border-radius:0 0 3px 3px;}
/* folds — pure CSS, no JS. The summary text is just the name; the prose
   comes from ::before, which is zimrnum-tutorial's trick and a good one. */
details{border:1px solid var(--rule);border-radius:3px;margin:.5em 0;background:var(--panel);}
details[open]{background:var(--bg);}
summary{
  cursor:pointer;padding:.4em .8em;color:var(--dim);font-size:.9em;
  list-style:none;user-select:none;
}
summary::-webkit-details-marker{display:none;}
summary::before{content:"\\25b8\\00a0";color:var(--faint);}
details[open]>summary::before{content:"\\25be\\00a0";}
summary:hover{color:var(--fg);}
details>pre{margin:0;border:0;border-top:1px solid var(--rule);border-radius:0;}
.src-fold>summary::after{content:" \\2014 source";color:var(--faint);}
/* callouts — one box, a coloured left rule says which kind */
.note,.warn,.good,.bad{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);

}
.note{border-left-color:var(--tok-fn);}

/* tables */
table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:13px;}
th,td{border:1px solid var(--rule);padding:.45em .7em;text-align:left;vertical-align:top;}

.split-cpu{background:var(--bg);}

img,svg,canvas,video{max-width:100%;height:auto;}

.demo-embed iframe{display:block;width:100%;aspect-ratio:16/9;}

/* Inline marks the pages already use, mapped onto the SAME token colours

.k{color:var(--tok-kw);}
.nm{color:var(--tok-fn);font-weight:700;}
.ns{color:var(--faint);}
.eq{color:var(--dim);}

.num,.n{color:var(--tok-num);}
.host,.lab,.lang,.path,.tag,.stage,.sec-num,.lesson-num{

}
.anchor{border:0;color:var(--faint);opacity:0;padding-left:.4em;}

}

.hazard{color:#e0555f;font-weight:700;}

.hl-new{color:var(--tok-fn);}
.yes,.good-mark{color:var(--tok-str);}
.callout{

}
.zn-source{margin:.6em 0 1.4em;}
.lesson{margin:2em 0;}
.lesson-title{font-weight:700;color:#fff;}
.lesson-goal{color:var(--dim);}
/* page furniture: the landing page and the tutorials' own scaffolding */
.blog-container,.wrap,.max{max-width:var(--maxw);margin:0 auto;}
.title{font-size:1.8rem;margin:0 0 .2em;}
.subtitle,.lede,.sub{
  border:0;font-size:1rem;font-weight:400;color:var(--dim);
  margin:0 0 1.6em;line-height:1.6;
}
.eyebrow{color:var(--faint);font-size:.85em;letter-spacing:.14em;text-transform:uppercase;}
.toplinks{
  display:flex;flex-wrap:wrap;gap:.1em 1.1em;margin:0 0 2em;

}
.toplinks a{border:0;color:var(--dim);}
.toplinks a:hover,.toplinks a.offsite{color:var(--link);}
.wip-warning{
  margin:0 0 2em;padding:.8em 1em;background:var(--panel);

  color:var(--dim);font-size:.9em;
}
.wip-warning strong{display:block;color:var(--tok-builtin);margin-bottom:.2em;}
/* cheatsheet: one declaration per .fn row */
.fn{margin:1.1em 0;}
.what,.body{color:var(--dim);}
.sketch{color:var(--dim);}
.pane{border:1px solid var(--rule);border-radius:3px;margin:1.1em 0;}
.pane-head{
  padding:5px 11px;background:var(--panel-2);border-bottom:1px solid var(--rule);

}
.cell{padding:.5em .8em;}
.swatch{display:inline-block;width:.9em;height:.9em;border:1px solid var(--rule);vertical-align:-1px;}
.old,.meh{color:var(--tok-builtin);}

/* The examples gallery (index.html): the list of examples on the left, the
   selected one running in a frame that fills the rest. On a phone the list
   is a drawer over the example, under the bar. `list-open` shows the list. */
body.gallery{
  max-width:none;margin:0;padding:0;height:100vh;height:100dvh;overflow:hidden;
  display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);
  color-scheme:dark;
}
body.gallery.list-open{grid-template-columns:minmax(240px,25%) 1fr;}
.gallery a{border:0;}
.g-side{display:none;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--rule);}
.list-open .g-side{display:flex;}
.g-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 1em;padding:.7em 1em .6em;font-size:.85em;}
.g-head a{color:var(--dim);}
.g-head a:hover{color:var(--link);}
.g-head .g-logo{margin-right:auto;font-size:1.1rem;font-weight:700;color:var(--fg);white-space:nowrap;}
.g-filters{display:flex;flex-wrap:wrap;gap:.4em;padding:0 1em;}
.g-filters input,.g-filters select{
  min-width:0;padding:.35em .5em;background:var(--panel);color:var(--fg);
  border:1px solid var(--rule);border-radius:3px;font:inherit;font-size:.85em;
}
.g-filters input{flex:1 1 10em;}
.g-filters select{flex:1 1 auto;}
.g-filters input:focus,.g-filters select:focus{outline:none;border-color:var(--tok-fn);}
.g-count{padding:.45em 1em;color:var(--faint);font-size:.75em;border-bottom:1px solid var(--rule);}
.g-list{flex:1;overflow-y:auto;padding-bottom:3em;font-size:13px;}
.g-group{
  position:sticky;top:0;padding:.8em 1em .3em;background:var(--bg);
  color:var(--faint);font-size:.8em;letter-spacing:.14em;text-transform:uppercase;
}
/* scroll-margin: scrolled into view, a row clears the sticky module heading */
.g-item{
  display:flex;justify-content:space-between;gap:.6em;padding:.15em 1em;
  color:var(--dim);border-left:2px solid transparent;scroll-margin-top:2.4em;
}
.g-item:hover{color:var(--fg);background:var(--panel);}
.g-item.on{color:#fff;background:var(--panel-2);border-left-color:var(--tok-fn);}
.g-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-stars{color:var(--faint);font-size:.8em;white-space:nowrap;}
.g-none{padding:1em;color:var(--faint);}
.g-main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.g-bar{
  flex:none;display:flex;align-items:center;gap:.4em;height:44px;padding:0 .6em;
  border-bottom:1px solid var(--rule);white-space:nowrap;
}
.g-btn{
  flex:none;width:30px;height:30px;padding:0;background:var(--panel);color:var(--dim);
  border:1px solid var(--rule);border-radius:3px;font:inherit;cursor:pointer;
}
.g-btn:hover{color:var(--fg);border-color:var(--tok-fn);}
.g-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding-left:.4em;}
.g-desc{margin-left:.6em;color:var(--dim);font-size:.9em;}
.g-open{flex:none;padding:0 .4em;font-size:.9em;}
.g-stage{flex:1;position:relative;min-height:0;}
.g-stage iframe{position:absolute;inset:0;width:100%;height:100%;max-width:none;border:0;border-radius:0;}
.g-intro{max-width:36em;margin:12vh auto 0;padding:0 1.5em;}
@media(max-width:700px){
  body.gallery.list-open{grid-template-columns:1fr;}
  .g-side{position:fixed;inset:44px 0 0 0;z-index:1;border-right:0;}
  .g-item{padding:.45em 1em;}
  .g-desc{display:none;}
}
/* A tutorial pointer, sitting directly under the heading whose subject it
   covers rather than pooled in a list at the foot of the page. */
.tut{
  margin:.2em 0 1.3em;padding:.55em .9em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-fn);border-radius:3px;
  color:var(--dim);font-size:.9em;
}
.tut a{color:var(--link);border:0;font-weight:700;}
.tut-index{list-style:none;padding-left:0;}
.tut-index li{padding:.25em 0;border-bottom:1px solid var(--rule);}
.tut-index a{border:0;}
/* `.reveal` was animated in by the JS that docfmt replaced; without a rule
   it is simply visible, which is the correct end state. */
@media(max-width:700px){body{font-size:14px;padding:1.4rem .8rem 4rem;}pre{font-size:12px;}}

<h1>ui_animation_gallery</h1>
<figure class="code src-file" data-path="examples/ui_animation_gallery/ui_animation_gallery.zig" data-lines="212"><figcaption><span>examples/ui_animation_gallery/ui_animation_gallery.zig</span><span>212 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_animation_gallery.zig</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Live demo of `u.animated` (one-shot tween with selectable</span>
<span class="tok-comment">// easing curve) and `u.spring` (critically-damped physical</span>
<span class="tok-comment">// spring tracking a target).</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Layout:</span>
<span class="tok-comment">//   - Six tween rows, one per easing curve.  Each row shows a</span>
<span class="tok-comment">//     moving dot that ping-pongs between two anchor positions on</span>
<span class="tok-comment">//     a 2-second cycle.  All six tweens share a phase clock so</span>
<span class="tok-comment">//     callers can see the curves visually compared.</span>
<span class="tok-comment">//   - One spring row at the bottom: drag the slider to set a</span>
<span class="tok-comment">//     target; the spring's dot chases.  Adjusting the slider</span>
<span class="tok-comment">//     mid-flight shows interruptibility.</span>
<span class="tok-comment">//   - One stiffness/damping pair lets the viewer tune the</span>
<span class="tok-comment">//     spring's feel.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// All animation state lives in `ext_storage` via `getOrPutState`,</span>
<span class="tok-comment">// keyed off label strings.  No app-owned animation bookkeeping.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Build standalone:</span>
<span class="tok-comment">//   zig build install -Dfocus=ui_animation_gallery</span>
<span class="tok-comment">//   python3 scripts/build_standalone.py ui_animation_gallery</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    <span class="tok-comment">// App-owned phase ticker - drives the ping-pong target for</span>
    <span class="tok-comment">// the tween rows.  Not strictly needed (the tweens themselves</span>
    <span class="tok-comment">// restart on `to` change), but it's how a real app would</span>
    <span class="tok-comment">// produce the "bounce between two anchors" effect.</span>
    cycle_t: f32 = <span class="tok-num">0</span>,

    <span class="tok-comment">// User-tunable spring target + parameters.</span>
    spring_target: f32 = <span class="tok-num">100</span>,
    spring_stiffness: f32 = <span class="tok-num">200</span>,
    spring_damping: f32 = <span class="tok-num">1.0</span>,
};

<span class="tok-kw">const</span> row_height: f32 = <span class="tok-num">36</span>;
<span class="tok-kw">const</span> track_inset: f32 = <span class="tok-num">12</span>;
<span class="tok-kw">const</span> dot_radius: f32 = <span class="tok-num">8</span>;

<span class="tok-kw">const</span> EasingRow = <span class="tok-kw">struct</span> {
    label: []<span class="tok-kw">const</span> u8,
    easing: ui.Easing,
};

<span class="tok-kw">const</span> easing_rows = [_]EasingRow{
    .{ .label = <span class="tok-str">"linear"</span>, .easing = .linear },
    .{ .label = <span class="tok-str">"ease_in"</span>, .easing = .ease_in },
    .{ .label = <span class="tok-str">"ease_out"</span>, .easing = .ease_out },
    .{ .label = <span class="tok-str">"ease_in_out"</span>, .easing = .ease_in_out },
    .{ .label = <span class="tok-str">"back"</span>, .easing = .back },
    .{ .label = <span class="tok-str">"elastic"</span>, .easing = .elastic },
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .font = font, .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font) };
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawTweenRow</span>(
    u: ui.Ui,
    row: EasingRow,
    phase_to_right: bool,
) void {
    <span class="tok-comment">// Reserve a row's worth of space.  Label on the left, track</span>
    <span class="tok-comment">// on the right.</span>
    <span class="tok-kw">const</span> it: ui.Ui.ItemCtx = u.<span class="tok-fn">beginItem</span>(row.label, .{
        .size = .{ <span class="tok-num">440</span>, row_height },
    }) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">defer</span> u.<span class="tok-fn">endItem</span>(it);

    <span class="tok-comment">// Label inside the reserved rect.</span>
    u.<span class="tok-fn">getForegroundDrawList</span>().<span class="tok-fn">addText</span>(row.label, .{ it.rect.x + <span class="tok-num">4</span>, it.rect.y + <span class="tok-num">8</span> }, <span class="tok-num">14</span>, Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFFD0D0D0</span>));

    <span class="tok-comment">// Track starts after the label area (90 px) and ends at the</span>
    <span class="tok-comment">// right edge with a small inset.</span>
    <span class="tok-kw">const</span> track_x0: f32 = it.rect.x + <span class="tok-num">100</span>;
    <span class="tok-kw">const</span> track_x1: f32 = it.rect.x + it.rect.width - track_inset;
    <span class="tok-kw">const</span> track_y: f32 = it.rect.y + it.rect.height / <span class="tok-num">2</span>;
    u.<span class="tok-fn">getForegroundDrawList</span>().<span class="tok-fn">addLine</span>(
        .{ track_x0, track_y },
        .{ track_x1, track_y },
        Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFF404858</span>),
        <span class="tok-num">2</span>,
    );

    <span class="tok-comment">// Tween the dot's normalized position [0..1].</span>
    <span class="tok-kw">const</span> target: f32 = <span class="tok-kw">if</span> (phase_to_right) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
    <span class="tok-kw">const</span> t: f32 = u.<span class="tok-fn">animated</span>(row.label, .{
        .from = <span class="tok-num">1.0</span> - target,
        .to = target,
        .duration = <span class="tok-num">1.0</span>,
        .easing = row.easing,
    });

    <span class="tok-kw">const</span> dot_x: f32 = track_x0 + (track_x1 - track_x0) * t;
    u.<span class="tok-fn">getForegroundDrawList</span>().<span class="tok-fn">addCircleFilled</span>(.{ dot_x, track_y }, dot_radius, Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFF6DB0E0</span>));
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawSpringRow</span>(
    u: ui.Ui,
    target: f32,
    stiffness: f32,
    damping: f32,
) void {
    <span class="tok-kw">const</span> it: ui.Ui.ItemCtx = u.<span class="tok-fn">beginItem</span>(<span class="tok-str">"spring_row"</span>, .{
        .size = .{ <span class="tok-num">440</span>, row_height * <span class="tok-num">2</span> },
    }) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">defer</span> u.<span class="tok-fn">endItem</span>(it);

    <span class="tok-comment">// Track spans the row, with a slight inset on each side.</span>
    <span class="tok-kw">const</span> track_x0: f32 = it.rect.x + track_inset;
    <span class="tok-kw">const</span> track_x1: f32 = it.rect.x + it.rect.width - track_inset;
    <span class="tok-kw">const</span> track_y: f32 = it.rect.y + it.rect.height / <span class="tok-num">2</span>;
    u.<span class="tok-fn">getForegroundDrawList</span>().<span class="tok-fn">addLine</span>(
        .{ track_x0, track_y },
        .{ track_x1, track_y },
        Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFF404858</span>),
        <span class="tok-num">2</span>,
    );

    <span class="tok-comment">// Target marker - a thin vertical line at the slider value.</span>
    <span class="tok-kw">const</span> target_x: f32 = track_x0 + target;
    u.<span class="tok-fn">getForegroundDrawList</span>().<span class="tok-fn">addLine</span>(
        .{ target_x, track_y - <span class="tok-num">14</span> },
        .{ target_x, track_y + <span class="tok-num">14</span> },
        Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFFA0A0A0</span>),
        <span class="tok-num">1</span>,
    );

    <span class="tok-comment">// Spring's actual current value chasing the target.</span>
    <span class="tok-kw">const</span> v: f32 = u.<span class="tok-fn">spring</span>(<span class="tok-str">"spring_demo"</span>, .{
        .target = target,
        .stiffness = stiffness,
        .damping = damping,
    });
    <span class="tok-kw">const</span> dot_x: f32 = track_x0 + v;
    u.<span class="tok-fn">getForegroundDrawList</span>().<span class="tok-fn">addCircleFilled</span>(.{ dot_x, track_y }, dot_radius, Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFFE07B5C</span>));
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">22</span>, .b = <span class="tok-num">32</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-comment">// Advance the shared phase ticker.  Tweens ping-pong between</span>
    <span class="tok-comment">// two anchors on a 2-second cycle.</span>
    <span class="tok-kw">const</span> cycle_sec: f32 = <span class="tok-num">2.0</span>;
    s.cycle_t += u.ctx.input.delta_time;
    <span class="tok-kw">if</span> (s.cycle_t &gt;= cycle_sec) {
        s.cycle_t = <span class="tok-num">0</span>;
    }
    <span class="tok-kw">const</span> phase_to_right: bool = s.cycle_t &lt; (cycle_sec / <span class="tok-num">2.0</span>);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Animations"</span>, .{
        .initial_pos = .{ <span class="tok-num">8</span>, <span class="tok-num">8</span> },
        .initial_size = .{ <span class="tok-num">464</span>, <span class="tok-num">700</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Tweens - six easing curves"</span>, .{});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// Each row renders its own track + dot.  The dot's</span>
        <span class="tok-comment">// x-position comes from `u.animated`; the to-value flips</span>
        <span class="tok-comment">// every cycle_sec/2 seconds so the dot ping-pongs.</span>
        <span class="tok-kw">for</span> (easing_rows) |row| {
            <span class="tok-fn">drawTweenRow</span>(u, row, phase_to_right);
        }

        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Spring - drag the slider, watch it chase"</span>, .{});

        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"target"</span>, &amp;s.spring_target, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">380</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"stiffness"</span>, &amp;s.spring_stiffness, .{ .min = <span class="tok-num">20</span>, .max = <span class="tok-num">800</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"damping"</span>, &amp;s.spring_damping, .{ .min = <span class="tok-num">0.2</span>, .max = <span class="tok-num">2.5</span> });

        <span class="tok-fn">drawSpringRow</span>(u, s.spring_target, s.spring_stiffness, s.spring_damping);
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - animation gallery"</span>,
            .width = <span class="tok-num">480</span>,
            .height = <span class="tok-num">720</span>,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
};
