<h1>text_unicode_ranges</h1>
<figure class="code src-file" data-path="examples/text_unicode_ranges/text_unicode_ranges.zig" data-lines="198"><figcaption><span>examples/text_unicode_ranges/text_unicode_ranges.zig</span><span>198 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/text_unicode_ranges.zig - adding Unicode ranges to a font at RUNTIME.</span>
<span class="tok-comment">// Ports raylib's `text_unicode_ranges`: the font starts with plain ASCII, and</span>
<span class="tok-comment">// each range you enable is BAKED INTO A NEW ATLAS - so glyphs that rendered as</span>
<span class="tok-comment">// fallback boxes suddenly appear. Toggle the ranges and watch the glyph count</span>
<span class="tok-comment">// grow.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// raylib's original pulls ranges (Devanagari / Arabic / Hebrew / CJK) out of a</span>
<span class="tok-comment">// large NotoSans font. The bundled RobotoMono has no such coverage - shipping a</span>
<span class="tok-comment">// multi-megabyte CJK font just for a demo isn't worth it - so this port keeps the</span>
<span class="tok-comment">// MECHANISM identical and uses the scripts this TTF actually has (checked against</span>
<span class="tok-comment">// its cmap: Latin-1, Latin Extended-A, most Greek, nearly all Cyrillic).</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What this exercises (the engine work this drove):</span>
<span class="tok-comment">//   - `z.releaseFont(gl, gpa, font)` - NEW. Re-baking a font means registering a</span>
<span class="tok-comment">//     new GPU atlas; the old one has to go back. `z.unloadFont` only frees the</span>
<span class="tok-comment">//     CPU glyph arrays, so without this each re-bake abandons a GPU texture, and</span>
<span class="tok-comment">//     after 64 the registry runs out of slots and hands back the WHITE texture -</span>
<span class="tok-comment">//     text would silently turn into solid blocks. `releaseFont` destroys the</span>
<span class="tok-comment">//     atlas + its bind group and recycles the registry slot.</span>
<span class="tok-comment">//   - `z.loadFontEx(f, gpa, ttf, size, codepoints)` - bakes the chosen set.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Leak-clean (`.memory = .managed`): every re-bake releases its predecessor, so</span>
<span class="tok-comment">// toggling ranges all day keeps exactly ONE atlas alive.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-comment">// Stays on RobotoMono ON PURPOSE: this example needs Greek + Cyrillic, and the</span>
<span class="tok-comment">// other bundled font (Atkinson Mono) has ZERO Cyrillic and only 4/57 Greek -</span>
<span class="tok-comment">// every sample line below would render as fallback boxes. Probe the cmap before</span>
<span class="tok-comment">// swapping a font under a Unicode example.</span>
<span class="tok-kw">const</span> roboto_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"roboto_mono_ttf"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;

<span class="tok-kw">const</span> font_px: i32 = <span class="tok-num">22</span>;
<span class="tok-kw">const</span> max_cp: usize = <span class="tok-num">400</span>;

<span class="tok-comment">/// One toggleable script. `sample` only contains codepoints from its own range,</span>
<span class="tok-comment">/// so before the range is enabled the line renders as fallback marks - and after,</span>
<span class="tok-comment">/// as real glyphs. That contrast IS the example.</span>
<span class="tok-kw">const</span> Range = <span class="tok-kw">struct</span> {
    name: []<span class="tok-kw">const</span> u8,
    lo: u21,
    hi: u21,
    sample: []<span class="tok-kw">const</span> u8,
};

<span class="tok-kw">const</span> ranges = [_]Range{
    .{ .name = <span class="tok-str">"Latin-1"</span>, .lo = <span class="tok-num">0xC0</span>, .hi = <span class="tok-num">0xFF</span>, .sample = <span class="tok-str">"Grüße Ñoño Åland Çà"</span> },
    .{ .name = <span class="tok-str">"Latin Ext-A"</span>, .lo = <span class="tok-num">0x100</span>, .hi = <span class="tok-num">0x17F</span>, .sample = <span class="tok-str">"Āā Ćć Ďď Łł Šš Žž"</span> },
    .{ .name = <span class="tok-str">"Greek"</span>, .lo = <span class="tok-num">0x391</span>, .hi = <span class="tok-num">0x3C9</span>, .sample = <span class="tok-str">"ΑΒΓΔΕ αβγδε ΞΠΣΦ"</span> },
    .{ .name = <span class="tok-str">"Cyrillic"</span>, .lo = <span class="tok-num">0x410</span>, .hi = <span class="tok-num">0x44F</span>, .sample = <span class="tok-str">"Привет мир Здравствуй"</span> },
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// `Frame` carries no allocator (gpu/gl/input/time/window only), so stash the</span>
    <span class="tok-comment">/// one `init` was handed - re-baking a font in `update` needs it.</span>
    gpa: Allocator,
    ui_host: z.UiHost,
    font: z.Font, <span class="tok-comment">// re-baked whenever the enabled set changes</span>
    ui_font: z.Font,
    enabled: [ranges.len]bool = <span class="tok-builtin">@splat</span>(false),
    glyph_count: i32 = <span class="tok-num">0</span>,
    bakes: u32 = <span class="tok-num">0</span>, <span class="tok-comment">// how many atlases we've built - proves slots are recycled</span>
};

<span class="tok-comment">/// Build the codepoint set for the currently-enabled ranges (ASCII is always in)</span>
<span class="tok-comment">/// and bake a fresh atlas. Returns the new font; the CALLER releases the old one.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">bakeFont</span>(f: *z.Frame, gpa: Allocator, enabled: [ranges.len]bool) !z.Font {
    <span class="tok-kw">var</span> cps: [max_cp]u21 = undefined;
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;

    <span class="tok-kw">var</span> v: u21 = <span class="tok-num">32</span>;
    <span class="tok-kw">while</span> (v &lt; <span class="tok-num">127</span>) : (v += <span class="tok-num">1</span>) { <span class="tok-comment">// ASCII always</span>
        cps[n] = v;
        n += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">for</span> (ranges, <span class="tok-num">0</span>..) |rg, i| {
        <span class="tok-kw">if</span> (!enabled[i]) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">var</span> cp: u21 = rg.lo;
        <span class="tok-kw">while</span> (cp &lt;= rg.hi <span class="tok-kw">and</span> n &lt; max_cp) : (cp += <span class="tok-num">1</span>) {
            cps[n] = cp;
            n += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">return</span> z.<span class="tok-fn">loadFontEx</span>(f, gpa, roboto_mono_ttf, font_px, cps[<span class="tok-num">0</span>..n]);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, roboto_mono_ttf, <span class="tok-num">24</span>);
    <span class="tok-kw">const</span> enabled: [ranges.len]bool = <span class="tok-builtin">@splat</span>(false);
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> <span class="tok-fn">bakeFont</span>(f, gpa, enabled);
    s.* = .{
        .gpa = gpa,
        .ui_font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
        .font = font,
        .glyph_count = font.glyphCount,
        .bakes = <span class="tok-num">1</span>,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.ui_font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Toggle a range and re-bake. The OLD atlas is released first - this is the</span>
<span class="tok-comment">/// whole point of `releaseFont`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">toggleRange</span>(f: *z.Frame, s: *State, gpa: Allocator, idx: usize) void {
    <span class="tok-kw">var</span> next: [ranges.len]bool = s.enabled;
    next[idx] = !next[idx];
    <span class="tok-kw">const</span> new_font: z.Font = <span class="tok-fn">bakeFont</span>(f, gpa, next) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>; <span class="tok-comment">// keep the old font on failure</span>
    z.<span class="tok-fn">releaseFont</span>(f.gl, gpa, s.font);
    s.font = new_font;
    s.enabled = next;
    s.glyph_count = new_font.glyphCount;
    s.bakes += <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gpa: Allocator = s.gpa;
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();

    z.<span class="tok-fn">clearViewport</span>(f, c.raywhite);

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16.0</span>, <span class="tok-num">250</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Unicode ranges"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Tap a range to bake it in."</span>, .{});
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">for</span> (ranges, <span class="tok-num">0</span>..) |rg, i| {
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(rg.name, .{})) {
                <span class="tok-fn">toggleRange</span>(f, s, gpa, i);
            }
            <span class="tok-kw">if</span> (i % <span class="tok-num">2</span> == <span class="tok-num">0</span>) {
                u.<span class="tok-fn">sameLine</span>(.{});
            }
        }
        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"glyphs baked: {d}   atlases built: {d}"</span>, .{ s.glyph_count, s.bakes });
    }

    <span class="tok-comment">// Each script's sample. Disabled ranges have no glyphs baked, so the line</span>
    <span class="tok-comment">// renders as fallback marks until you enable it.</span>
    <span class="tok-kw">var</span> y: f32 = <span class="tok-num">280</span>;
    <span class="tok-kw">for</span> (ranges, <span class="tok-num">0</span>..) |rg, i| {
        <span class="tok-kw">const</span> on: bool = s.enabled[i];
        f.gl.<span class="tok-fn">text</span>(
            .{ <span class="tok-num">16</span>, y },
            rg.name,
            .{ .size = <span class="tok-num">15</span>, .color = <span class="tok-kw">if</span> (on) c.darkgreen <span class="tok-kw">else</span> c.gray, .font = &amp;s.font },
        );
        f.gl.<span class="tok-fn">text</span>(
            .{ <span class="tok-num">130</span>, y },
            rg.sample,
            .{ .size = <span class="tok-num">22</span>, .color = <span class="tok-kw">if</span> (on) c.black <span class="tok-kw">else</span> c.gray, .font = &amp;s.font },
        );
        y += <span class="tok-num">40</span>;
    }

    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, y + <span class="tok-num">8.0</span> },
        <span class="tok-str">"Old atlas is released on every re-bake (releaseFont)."</span>,
        .{ .size = <span class="tok-num">15</span>, .color = c.gray, .font = &amp;s.font },
    );

    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{

            .width = <span class="tok-num">800</span>,

            .scale_mode = .responsive,
            .depth_format = null,
            .clear = .{ .r = <span class="tok-num">245.0</span> / <span class="tok-num">255.0</span>, .g = <span class="tok-num">245.0</span> / <span class="tok-num">255.0</span>, .b = <span class="tok-num">245.0</span> / <span class="tok-num">255.0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
