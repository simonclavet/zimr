<figure class="code src-file" data-path="examples/pipeline_mipmap/pipeline_mipmap.zig" data-lines="312"><figcaption><span>examples/pipeline_mipmap/pipeline_mipmap.zig</span><span>312 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! pipeline_mipmap - Phase 3 (`src/notes/webgpu_control.md`): mipmaps and</span>
<span class="tok-comment">//! LOD selection. A texture is built with a full mip chain, and a COMPUTE</span>
<span class="tok-comment">//! shader paints each level a DISTINCT hue (level 0 red, climbing the spectrum</span>
<span class="tok-comment">//! to the 1x1 top). The texture is then drawn on a perspective ground plane:</span>
<span class="tok-comment">//! the GPU picks a mip level per pixel from the UV derivatives, so distance</span>
<span class="tok-comment">//! selects the level and the road shows the chain as colour bands receding to</span>
<span class="tok-comment">//! the horizon - you literally see which LOD is sampled where.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Plumbing added (additive): wgpu.TextureDesc.mip_level_count,</span>
<span class="tok-comment">//! wgpu.createTextureViewMip (a single-level view, used to bind each mip as a</span>
<span class="tok-comment">//! compute write target), and SamplerDesc.mipmap_filter_linear. The sampler</span>
<span class="tok-comment">//! here uses nearest mip filtering so the bands stay crisp.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Each level is filled by one dispatch whose storage view targets just that</span>
<span class="tok-comment">//! level; the colour is derived from the level's own dimensions, so no</span>
<span class="tok-comment">//! per-level uniform is needed.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Build:  zig build wgpu-pipeline-mipmap</span>
<span class="tok-comment">//! Device: zig build wgpu-pipeline-mipmap-standalone -Dmode=release</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> tex_dim: u32 = <span class="tok-num">256</span>;
<span class="tok-kw">const</span> mip_levels: u32 = <span class="tok-num">9</span>; <span class="tok-comment">// log2(256) + 1</span>

<span class="tok-kw">const</span> compute_wgsl =
    <span class="tok-str">\\@group(0) @binding(0) var out_tex: texture_storage_2d&lt;rgba8unorm, write&gt;;</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\fn hsv2rgb(h: f32, s: f32, v: f32) -&gt; vec3f {</span>
    <span class="tok-str">\\    let k = vec3f(5.0, 3.0, 1.0);</span>
    <span class="tok-str">\\    let p = abs(fract(vec3f(h) + k / 6.0) * 6.0 - 3.0);</span>
    <span class="tok-str">\\    return v * mix(vec3f(1.0), clamp(p - 1.0, vec3f(0.0), vec3f(1.0)), s);</span>
    <span class="tok-str">\\}</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@compute @workgroup_size(8, 8)</span>
    <span class="tok-str">\\fn cs_main(@builtin(global_invocation_id) gid: vec3u) {</span>
    <span class="tok-str">\\    let dims = textureDimensions(out_tex);</span>
    <span class="tok-str">\\    if (gid.x &gt;= dims.x || gid.y &gt;= dims.y) {</span>
    <span class="tok-str">\\        return;</span>
    <span class="tok-str">\\    }</span>
    <span class="tok-str">\\    let lvl = log2(256.0 / f32(max(dims.x, 1u)));</span>
    <span class="tok-str">\\    let c = hsv2rgb(lvl / 8.0, 0.85, 0.95);</span>
    <span class="tok-str">\\    textureStore(out_tex, vec2i(i32(gid.x), i32(gid.y)), vec4f(c, 1.0));</span>
    <span class="tok-str">\\}</span>
;

<span class="tok-kw">const</span> render_wgsl =
    <span class="tok-str">\\struct U { mvp: mat4x4f };</span>
    <span class="tok-str">\\@group(0) @binding(0) var&lt;uniform&gt; u: U;</span>
    <span class="tok-str">\\@group(0) @binding(1) var tex: texture_2d&lt;f32&gt;;</span>
    <span class="tok-str">\\@group(0) @binding(2) var samp: sampler;</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\struct VsOut {</span>
    <span class="tok-str">\\    @builtin(position) pos: vec4f,</span>
    <span class="tok-str">\\    @location(0) uv: vec2f,</span>
    <span class="tok-str">\\};</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@vertex</span>
    <span class="tok-str">\\fn vs_main(@location(0) p: vec3f, @location(1) uv: vec2f) -&gt; VsOut {</span>
    <span class="tok-str">\\    var out: VsOut;</span>
    <span class="tok-str">\\    out.pos = u.mvp * vec4f(p, 1.0);</span>
    <span class="tok-str">\\    out.uv = uv;</span>
    <span class="tok-str">\\    return out;</span>
    <span class="tok-str">\\}</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@fragment</span>
    <span class="tok-str">\\fn fs_main(in: VsOut) -&gt; @location(0) vec4f {</span>
    <span class="tok-str">\\    return vec4f(textureSample(tex, samp, in.uv).rgb, 1.0);</span>
    <span class="tok-str">\\}</span>
;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    tex: z.wgpu.TextureHandle,
    full_view: z.wgpu.TextureViewHandle,
    sampler: z.wgpu.SamplerHandle,
    mvp_ubo: z.wgpu.BufferHandle,
    pipe: z.Pipeline,
    bind_group: z.wgpu.BindGroupHandle,
    vbo: z.wgpu.BufferHandle,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.pipe.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">if</span> (s.full_view != .invalid) {
        z.wgpu.<span class="tok-fn">destroyTextureView</span>(s.full_view);
    }
    <span class="tok-kw">if</span> (s.tex != .invalid) {
        z.wgpu.<span class="tok-fn">destroyTexture</span>(s.tex);
    }
    <span class="tok-kw">if</span> (s.sampler != .invalid) {
        z.wgpu.<span class="tok-fn">destroySampler</span>(s.sampler);
    }
    <span class="tok-kw">if</span> (s.bind_group != .invalid) {
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.bind_group);
    }
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.mvp_ubo);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-comment">// --- tiny column-major mat4 helpers ---------------------------------------</span>

<span class="tok-kw">fn</span> <span class="tok-fn">perspective</span>(fovy: f32, aspect: f32, near: f32, far: f32) [<span class="tok-num">16</span>]f32 {
    <span class="tok-kw">const</span> ft: f32 = <span class="tok-num">1.0</span> / <span class="tok-builtin">@tan</span>(fovy * <span class="tok-num">0.5</span>);
    <span class="tok-kw">const</span> nf: f32 = <span class="tok-num">1.0</span> / (near - far);
    <span class="tok-kw">return</span> .{ ft / aspect, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, ft, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, far * nf, -<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, near * far * nf, <span class="tok-num">0</span> };
}

<span class="tok-kw">fn</span> <span class="tok-fn">cross</span>(a: [<span class="tok-num">3</span>]f32, b: [<span class="tok-num">3</span>]f32) [<span class="tok-num">3</span>]f32 {
    <span class="tok-kw">return</span> .{ a[<span class="tok-num">1</span>] * b[<span class="tok-num">2</span>] - a[<span class="tok-num">2</span>] * b[<span class="tok-num">1</span>], a[<span class="tok-num">2</span>] * b[<span class="tok-num">0</span>] - a[<span class="tok-num">0</span>] * b[<span class="tok-num">2</span>], a[<span class="tok-num">0</span>] * b[<span class="tok-num">1</span>] - a[<span class="tok-num">1</span>] * b[<span class="tok-num">0</span>] };
}

<span class="tok-kw">fn</span> <span class="tok-fn">norm3</span>(a: [<span class="tok-num">3</span>]f32) [<span class="tok-num">3</span>]f32 {
    <span class="tok-kw">const</span> l: f32 = <span class="tok-builtin">@sqrt</span>(a[<span class="tok-num">0</span>] * a[<span class="tok-num">0</span>] + a[<span class="tok-num">1</span>] * a[<span class="tok-num">1</span>] + a[<span class="tok-num">2</span>] * a[<span class="tok-num">2</span>]);
    <span class="tok-kw">return</span> .{ a[<span class="tok-num">0</span>] / l, a[<span class="tok-num">1</span>] / l, a[<span class="tok-num">2</span>] / l };
}

<span class="tok-kw">fn</span> <span class="tok-fn">dot3</span>(a: [<span class="tok-num">3</span>]f32, b: [<span class="tok-num">3</span>]f32) f32 {
    <span class="tok-kw">return</span> a[<span class="tok-num">0</span>] * b[<span class="tok-num">0</span>] + a[<span class="tok-num">1</span>] * b[<span class="tok-num">1</span>] + a[<span class="tok-num">2</span>] * b[<span class="tok-num">2</span>];
}

<span class="tok-kw">fn</span> <span class="tok-fn">lookAt</span>(eye: [<span class="tok-num">3</span>]f32, center: [<span class="tok-num">3</span>]f32, up: [<span class="tok-num">3</span>]f32) [<span class="tok-num">16</span>]f32 {
    <span class="tok-kw">const</span> fwd: [<span class="tok-num">3</span>]f32 = <span class="tok-fn">norm3</span>(.{ center[<span class="tok-num">0</span>] - eye[<span class="tok-num">0</span>], center[<span class="tok-num">1</span>] - eye[<span class="tok-num">1</span>], center[<span class="tok-num">2</span>] - eye[<span class="tok-num">2</span>] });
    <span class="tok-kw">const</span> s: [<span class="tok-num">3</span>]f32 = <span class="tok-fn">norm3</span>(<span class="tok-fn">cross</span>(fwd, up));
    <span class="tok-kw">const</span> u: [<span class="tok-num">3</span>]f32 = <span class="tok-fn">cross</span>(s, fwd);
    <span class="tok-kw">return</span> .{
        s[<span class="tok-num">0</span>],          u[<span class="tok-num">0</span>],          -fwd[<span class="tok-num">0</span>],        <span class="tok-num">0</span>,
        s[<span class="tok-num">1</span>],          u[<span class="tok-num">1</span>],          -fwd[<span class="tok-num">1</span>],        <span class="tok-num">0</span>,
        s[<span class="tok-num">2</span>],          u[<span class="tok-num">2</span>],          -fwd[<span class="tok-num">2</span>],        <span class="tok-num">0</span>,
        -<span class="tok-fn">dot3</span>(s, eye), -<span class="tok-fn">dot3</span>(u, eye), <span class="tok-fn">dot3</span>(fwd, eye), <span class="tok-num">1</span>,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">mul4</span>(a: [<span class="tok-num">16</span>]f32, b: [<span class="tok-num">16</span>]f32) [<span class="tok-num">16</span>]f32 {
    <span class="tok-kw">var</span> r: [<span class="tok-num">16</span>]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>);
    <span class="tok-kw">var</span> col: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (col &lt; <span class="tok-num">4</span>) : (col += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> row: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (row &lt; <span class="tok-num">4</span>) : (row += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> sum: f32 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (k &lt; <span class="tok-num">4</span>) : (k += <span class="tok-num">1</span>) {
                sum += a[k * <span class="tok-num">4</span> + row] * b[col * <span class="tok-num">4</span> + k];
            }
            r[col * <span class="tok-num">4</span> + row] = sum;
        }
    }
    <span class="tok-kw">return</span> r;
}

<span class="tok-kw">fn</span> <span class="tok-fn">fillMips</span>(gpa: Allocator, f: *z.Frame, tex: z.wgpu.TextureHandle) !void {
    <span class="tok-kw">const</span> bgl: z.wgpu.BindGroupLayoutHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroupLayout</span>(gpa, f, &amp;.{
        .{
            .binding = <span class="tok-num">0</span>,
            .visibility = .{ .compute = true },
            .resource = .{ .storage_texture = .{ .access = .write_only, .format = .rgba8_unorm } },
        },
    }, <span class="tok-str">"mip_cs_bgl"</span>);
    <span class="tok-kw">var</span> pipe: z.ComputePipeline = z.ComputePipeline.<span class="tok-fn">init</span>(gpa, f, .{
        .wgsl = compute_wgsl,
        .bind_group_layouts = &amp;.{bgl},
        .label = <span class="tok-str">"mip_cs"</span>,
    });
    <span class="tok-kw">var</span> lvl: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (lvl &lt; mip_levels) : (lvl += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> view: z.wgpu.TextureViewHandle = z.wgpu.<span class="tok-fn">createTextureViewMip</span>(tex, lvl, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> bg: z.wgpu.BindGroupHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroup</span>(gpa, f, bgl, &amp;.{
            .{ .binding = <span class="tok-num">0</span>, .resource = .{ .texture_view = view } },
        }, <span class="tok-str">"mip_cs_bg"</span>);
        <span class="tok-kw">const</span> dim: u32 = <span class="tok-builtin">@max</span>(tex_dim &gt;&gt; <span class="tok-builtin">@intCast</span>(lvl), <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> groups: u32 = (dim + <span class="tok-num">7</span>) / <span class="tok-num">8</span>;
        pipe.<span class="tok-fn">dispatch</span>(f, bg, .{ .x = groups, .y = groups });
        <span class="tok-comment">// The per-level bind group is ours to free (build-only for this</span>
        <span class="tok-comment">// dispatch). The mip `view`, however, is owned by `tex`: on this bridge</span>
        <span class="tok-comment">// destroying the mipmapped texture (in deinit) releases its per-level</span>
        <span class="tok-comment">// views, so destroying `view` here too would double-free it. Freed with</span>
        <span class="tok-comment">// the texture, not here. (NB: full `createTextureView` views are NOT</span>
        <span class="tok-comment">// auto-freed and still need an explicit destroy - see notes.)</span>
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(bg);
    }
    <span class="tok-comment">// The compute pipeline + its layout were build-only for the whole fill.</span>
    pipe.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> tex: z.wgpu.TextureHandle = z.wgpu.<span class="tok-fn">createTexture</span>(f.gpu.device, .{
        .width = tex_dim,
        .height = tex_dim,
        .format = .rgba8_unorm,
        .usage = .{ .storage_binding = true, .texture_binding = true },
        .mip_level_count = mip_levels,
        .label = <span class="tok-str">"mip_tex"</span>,
    });
    <span class="tok-kw">try</span> <span class="tok-fn">fillMips</span>(gpa, f, tex);
    <span class="tok-kw">const</span> full_view: z.wgpu.TextureViewHandle = z.wgpu.<span class="tok-fn">createTextureView</span>(tex);

    <span class="tok-kw">const</span> sampler: z.wgpu.SamplerHandle = z.wgpu.<span class="tok-fn">createSampler</span>(f.gpu.device, .{
        .mag_filter_linear = true,
        .min_filter_linear = true,
        .mipmap_filter_linear = false, <span class="tok-comment">// nearest mip -&gt; crisp bands</span>
        .address_mode = .repeat,
    });

    <span class="tok-kw">const</span> mvp0: [<span class="tok-num">16</span>]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>);
    <span class="tok-kw">const</span> mvp_ubo: z.wgpu.BufferHandle = z.material.<span class="tok-fn">uniformBuffer</span>(f, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;mvp0), <span class="tok-str">"mip_mvp"</span>);

    <span class="tok-kw">const</span> bgl: z.wgpu.BindGroupLayoutHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroupLayout</span>(gpa, f, &amp;.{
        .{ .binding = <span class="tok-num">0</span>, .visibility = .{ .vertex = true }, .resource = .{ .uniform_buffer = .{} } },
        .{ .binding = <span class="tok-num">1</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">2</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
    }, <span class="tok-str">"mip_bgl"</span>);
    <span class="tok-kw">const</span> bind_group: z.wgpu.BindGroupHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroup</span>(gpa, f, bgl, &amp;.{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = mvp_ubo } } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .texture_view = full_view } },
        .{ .binding = <span class="tok-num">2</span>, .resource = .{ .sampler = sampler } },
    }, <span class="tok-str">"mip_bg"</span>);

    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(plane)),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"mip_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;plane));

    <span class="tok-kw">const</span> layout: z.VertexLayout = .{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(Vertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
            .{ .format = .float32x2, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
        },
    };
    <span class="tok-kw">const</span> pipe: z.Pipeline = <span class="tok-kw">try</span> z.Pipeline.<span class="tok-fn">init</span>(gpa, f, .{
        .wgsl = render_wgsl,
        .layouts = &amp;.{layout},
        .bind_group_layouts = &amp;.{bgl},
        .label = <span class="tok-str">"mip_render"</span>,
    });
    <span class="tok-comment">// Render bgl was build-only (defined the pipeline + bind group).</span>
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgl);

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .tex = tex,
        .full_view = full_view,
        .sampler = sampler,
        .mvp_ubo = mvp_ubo,
        .pipe = pipe,
        .bind_group = bind_group,
        .vbo = vbo,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> aspect: f32 = w / <span class="tok-builtin">@max</span>(h, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> proj: [<span class="tok-num">16</span>]f32 = <span class="tok-fn">perspective</span>(<span class="tok-num">1.0472</span>, aspect, <span class="tok-num">0.1</span>, <span class="tok-num">200.0</span>);
    <span class="tok-kw">const</span> view: [<span class="tok-num">16</span>]f32 = <span class="tok-fn">lookAt</span>(.{ <span class="tok-num">0</span>, <span class="tok-num">3.0</span>, -<span class="tok-num">3.0</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">28.0</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> });
    <span class="tok-kw">const</span> mvp: [<span class="tok-num">16</span>]f32 = <span class="tok-fn">mul4</span>(proj, view);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.mvp_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;mvp));

    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    s.pipe.<span class="tok-fn">bind</span>(ps);
    s.pipe.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">0</span>, s.bind_group);
    s.pipe.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(plane)));
    s.pipe.<span class="tok-fn">drawArrays</span>(ps, plane.len, <span class="tok-num">1</span>);

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"pipeline_mipmap: each band is a mip level - distance selects the LOD"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    <span class="tok-comment">// Transient GPU-technique demo: pipeline setup creates layouts and shader</span>
    <span class="tok-comment">// modules that aren't retained in State, so a leak-tight deinit isn't</span>
    <span class="tok-comment">// practical. Opt out of the managed leak gate rather than fake teardown.</span>
    .memory = .managed,
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - pipeline mipmap"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.02</span>, .g = <span class="tok-num">0.02</span>, .b = <span class="tok-num">0.03</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    <span class="tok-comment">// .memory left default (arena): init builds a compute pipeline / multi-pass</span>
    <span class="tok-comment">// chain (mipmap or bloom) whose intermediate handles aren't kept in State,</span>
    <span class="tok-comment">// so a full managed teardown needs added State fields - deferred.</span>
    .deinit = deinit,
    .update = update,
};
