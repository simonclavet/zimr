<span class="tok-comment">//!</span>
<span class="tok-comment">//! One scene of solid + wireframe primitives, drawn twice ways: press</span>
<span class="tok-comment">//! SPACE (or tap the toggle) to swap the camera between a normal</span>
<span class="tok-comment">//! PERSPECTIVE projection and an ORTHOGRAPHIC one. Perspective makes</span>
<span class="tok-comment">//! far things smaller (vanishing point); orthographic keeps every depth</span>
<span class="tok-comment">//! the same size (parallel lines stay parallel) - the difference is</span>
<span class="tok-comment">//! obvious the instant you flip it, which is the whole point of the</span>
<span class="tok-comment">//! example.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! raylib expresses the ortho "zoom" by reusing the camera's `fovy`</span>
<span class="tok-comment">//! field as a world-space WIDTH (10 units here). zimr's immediate 3D</span>
<span class="tok-comment">//! batch always builds a perspective matrix internally, so this example</span>
<span class="tok-comment">//! builds BOTH matrices itself (`perspectiveFovRh` / `orthographicRh`)</span>
<span class="tok-comment">//! and feeds the chosen one to `beginMode3DMatrix`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Phone-first: the camera is fixed (like raylib), a big on-screen</span>
<span class="tok-comment">//! button flips the projection, and the current mode is labelled.</span>

<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> fovy_perspective: f32 = <span class="tok-num">45.0</span>; <span class="tok-comment">// degrees</span>

<span class="tok-kw">const</span> red: Color = .{ .r = <span class="tok-num">230</span>, .g = <span class="tok-num">41</span>, .b = <span class="tok-num">55</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> gold: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">203</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> maroon: Color = .{ .r = <span class="tok-num">190</span>, .g = <span class="tok-num">33</span>, .b = <span class="tok-num">55</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> lime: Color = .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">158</span>, .b = <span class="tok-num">47</span>, .a = <span class="tok-num">255</span> };

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"projection"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-kw">if</span> (s.ortho) <span class="tok-str">"switch to PERSPECTIVE"</span> <span class="tok-kw">else</span> <span class="tok-str">"switch to ORTHOGRAPHIC"</span>, .{})) {
            s.ortho = !s.ortho;
        }
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .space)) {
        s.ortho = !s.ortho;
    }

    <span class="tok-comment">// ---- build the chosen projection (raylib's fixed camera) ----</span>
    <span class="tok-kw">const</span> eye: Vec = <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">10</span>, <span class="tok-num">10</span>);
    <span class="tok-kw">const</span> view: Mat = <span class="tok-fn">lookAtRh</span>(eye, <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> aspect: f32 = vw / vh;
    <span class="tok-kw">const</span> proj: Mat = <span class="tok-kw">if</span> (s.ortho)
        <span class="tok-fn">orthographicRh</span>(width_orthographic, width_orthographic / aspect, <span class="tok-num">0.01</span>, <span class="tok-num">1000.0</span>)
    <span class="tok-kw">else</span>
        <span class="tok-fn">perspectiveFovRh</span>(fovy_perspective * rad_per_deg, aspect, <span class="tok-num">0.01</span>, <span class="tok-num">1000.0</span>);
    <span class="tok-kw">const</span> view_proj: Mat = <span class="tok-fn">mulMat</span>(proj, view);

    <span class="tok-comment">// ---- the scene (raylib's exact primitives + positions) ----</span>
    z.<span class="tok-fn">beginMode3DMatrix</span>(f.gl, view_proj);

    z.<span class="tok-fn">drawCube</span>(f.gl, <span class="tok-fn">pointVec</span>(-<span class="tok-num">4</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">2</span>, <span class="tok-num">5</span>, <span class="tok-num">2</span>), .color = red });
    z.<span class="tok-fn">drawCubeWires</span>(f.gl, <span class="tok-fn">pointVec</span>(-<span class="tok-num">4</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">2</span>, <span class="tok-num">5</span>, <span class="tok-num">2</span>), .color = gold });
    z.<span class="tok-fn">drawCubeWires</span>(f.gl, <span class="tok-fn">pointVec</span>(-<span class="tok-num">4</span>, <span class="tok-num">0</span>, -<span class="tok-num">2</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">3</span>, <span class="tok-num">6</span>, <span class="tok-num">2</span>), .color = maroon });

    z.<span class="tok-fn">drawSphere</span>(f.gl, <span class="tok-fn">pointVec</span>(-<span class="tok-num">1</span>, <span class="tok-num">0</span>, -<span class="tok-num">2</span>), .{ .radius = <span class="tok-num">1.0</span>, .color = green });
    z.<span class="tok-fn">drawSphereWires</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>), .{ .radius = <span class="tok-num">2.0</span>, .color = lime });

    z.<span class="tok-fn">drawCylinder</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">4</span>, <span class="tok-num">0</span>, -<span class="tok-num">2</span>), .{ .radius = <span class="tok-num">1.5</span>, .height = <span class="tok-num">3.0</span>, .color = sky_blue });
    z.<span class="tok-fn">drawCylinderWires</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">4</span>, <span class="tok-num">0</span>, -<span class="tok-num">2</span>), .{ .radius = <span class="tok-num">1.5</span>, .height = <span class="tok-num">3.0</span>, .color = dark_blue });
    z.<span class="tok-fn">drawCylinderWires</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">4.5</span>, -<span class="tok-num">1</span>, <span class="tok-num">2</span>), .{ .radius = <span class="tok-num">1.0</span>, .height = <span class="tok-num">2.0</span>, .color = brown });

    <span class="tok-comment">// A cone (top radius 0) via the variable-radius cylinder, raylib's last two.</span>
    z.<span class="tok-fn">drawCylinderBetween</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">1</span>, -<span class="tok-num">1.5</span>, -<span class="tok-num">4</span>), <span class="tok-fn">pointVec</span>(<span class="tok-num">1</span>, <span class="tok-num">1.5</span>, -<span class="tok-num">4</span>), <span class="tok-num">0.0</span>, <span class="tok-num">1.5</span>, <span class="tok-num">8</span>, gold);
    z.<span class="tok-fn">drawCylinderBetween</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">1</span>, -<span class="tok-num">1.5</span>, -<span class="tok-num">4</span>), <span class="tok-fn">pointVec</span>(<span class="tok-num">1</span>, <span class="tok-num">1.5</span>, -<span class="tok-num">4</span>), <span class="tok-num">0.0</span>, <span class="tok-num">1.55</span>, <span class="tok-num">8</span>, pink);

    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">10</span>, <span class="tok-num">1.0</span>);
    z.<span class="tok-fn">endMode3D</span>(f.gl);

    <span class="tok-comment">// ---- HUD ----</span>
    <span class="tok-kw">const</span> label: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.ortho) <span class="tok-str">"ORTHOGRAPHIC"</span> <span class="tok-kw">else</span> <span class="tok-str">"PERSPECTIVE"</span>;
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">14</span>, <span class="tok-num">44</span> },
        label,
        .{ .size = <span class="tok-num">22</span>, .color = <span class="tok-kw">if</span> (s.ortho) common.palette.accent <span class="tok-kw">else</span> common.palette.accent2, .font = &amp;s.font },
    );
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"WebGPU 3D - orthographic vs perspective (SPACE / tap to switch)"</span>);
    s.ui_host.<span class="tok-fn">render</span>(f);
}
