<h1>text_sprite_fonts</h1>
<figure class="code src-file" data-path="examples/text_sprite_fonts/text_sprite_fonts.zig" data-lines="192"><figcaption><span>examples/text_sprite_fonts/text_sprite_fonts.zig</span><span>192 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! text_sprite_fonts - port of raylib [text] examples "font spritefont" and</span>
<span class="tok-comment">//! "sprite fonts" (merged). raylib sources: examples/text/text_font_spritefont.c</span>
<span class="tok-comment">//! and examples/text/text_sprite_fonts.c.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Both raylib samples do the same thing: `LoadFont("something.png")`, which for</span>
<span class="tok-comment">//! a PNG routes into `LoadFontFromImage` - an XNA-style BITMAP font where the</span>
<span class="tok-comment">//! glyphs sit on a MAGENTA key background and are separated by key-coloured</span>
<span class="tok-comment">//! gutters. raylib then draws a fixed sentence per font and exits; nothing is</span>
<span class="tok-comment">//! interactive. This is the honest phone translation and adds what a touch UI</span>
<span class="tok-comment">//! makes worth having: pick the sample text, scale every font live, and tighten</span>
<span class="tok-comment">//! or loosen the inter-glyph spacing (raylib's `DrawTextEx` spacing) - so you</span>
<span class="tok-comment">//! can actually see how each face behaves, not just a frozen screenshot.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The engine work this drove is `z.loadFontFromImage` (raylib's</span>
<span class="tok-comment">//! `LoadFontFromImage`): segment the image into glyph rectangles (a pure,</span>
<span class="tok-comment">//! unit-tested `image.segmentSpriteFont` - first non-key pixel gives the shared</span>
<span class="tok-comment">//! char/line spacing border, the first glyph column gives the char height, then</span>
<span class="tok-comment">//! each line band is walked splitting glyphs on key columns), replace the key</span>
<span class="tok-comment">//! colour with transparent, and upload the cleaned image as a NEAREST atlas.</span>
<span class="tok-comment">//! The glyphs carry `advanceX = 0`, so the existing text path advances by the</span>
<span class="tok-comment">//! rec width - exactly like raylib. The segmentation was validated headless:</span>
<span class="tok-comment">//! pixel-for-pixel identical glyph counts/rects to a reference scan on all three</span>
<span class="tok-comment">//! real fonts (mecha 96, alagard 95, jupiter_crash 96 glyphs).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! `.memory = .managed`: all four fonts (three sprite + the TTF UI font) and the</span>
<span class="tok-comment">//! UI host are freed in `deinit`; the sprite-font atlases are engine-owned</span>
<span class="tok-comment">//! (registered) and reclaimed with the renderer at teardown, so the twice-</span>
<span class="tok-comment">//! lifecycle smoke census must come back FLAT.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = z.colors;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> mecha_png = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"mecha.png"</span>);
<span class="tok-kw">const</span> alagard_png = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"alagard.png"</span>);
<span class="tok-kw">const</span> jupiter_png = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"jupiter_crash.png"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">/// The MAGENTA key colour these XNA-style fonts use for their background.</span>
<span class="tok-kw">const</span> key_magenta: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> FontInfo = <span class="tok-kw">struct</span> {
    label: []<span class="tok-kw">const</span> u8,
    tint: Color,
};

<span class="tok-kw">const</span> font_info = [_]FontInfo{
    .{ .label = <span class="tok-str">"MECHA  -  by Captain Falcon"</span>, .tint = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">220</span>, .b = <span class="tok-num">160</span>, .a = <span class="tok-num">255</span> } },
    .{ .label = <span class="tok-str">"ALAGARD  -  by Hewett Tsoi"</span>, .tint = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> } },
    .{ .label = <span class="tok-str">"JUPITER CRASH  -  by Brian Kent"</span>, .tint = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">205</span>, .b = <span class="tok-num">110</span>, .a = <span class="tok-num">255</span> } },
};

<span class="tok-kw">const</span> samples = [_][]<span class="tok-kw">const</span> u8{
    <span class="tok-str">"THE QUICK BROWN FOX"</span>,
    <span class="tok-str">"Sphinx of black quartz"</span>,
    <span class="tok-str">"ABCDEFG abcdefg"</span>,
    <span class="tok-str">"0123456789 !?.,:;"</span>,
    <span class="tok-str">"zimr sprite fonts"</span>,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_font: z.Font,
    ui_host: z.UiHost,
    <span class="tok-comment">/// mecha, alagard, jupiter_crash - parsed from magenta-keyed PNGs.</span>
    fonts: [<span class="tok-num">3</span>]z.Font,

    sample_idx: u32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Multiplier applied to each font's own baseSize.</span>
    size_scale: f32 = <span class="tok-num">2.0</span>,
    <span class="tok-comment">/// raylib `DrawTextEx` inter-glyph spacing (logical px; may be negative).</span>
    spacing: f32 = <span class="tok-num">1.0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">loadSpriteFont</span>(f: *z.Frame, gpa: Allocator, bytes: []<span class="tok-kw">const</span> u8) !z.Font {
    <span class="tok-comment">// loadFontFromImage copies what it needs, so the decoded image is freed here.</span>
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">loadImageFromMemory</span>(gpa, bytes);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadImage</span>(gpa, img);
    <span class="tok-kw">return</span> z.<span class="tok-fn">loadFontFromImage</span>(f.gl, gpa, img, key_magenta, <span class="tok-num">32</span>);
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    <span class="tok-kw">for</span> (&amp;s.fonts) |font| {
        z.<span class="tok-fn">unloadFont</span>(gpa, font);
    }
    z.<span class="tok-fn">unloadFont</span>(gpa, s.ui_font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>);
    s.* = .{
        .ui_font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
        .fonts = .{
            <span class="tok-kw">try</span> <span class="tok-fn">loadSpriteFont</span>(f, gpa, mecha_png),
            <span class="tok-kw">try</span> <span class="tok-fn">loadSpriteFont</span>(f, gpa, alagard_png),
            <span class="tok-kw">try</span> <span class="tok-fn">loadSpriteFont</span>(f, gpa, jupiter_png),
        },
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> msg: []<span class="tok-kw">const</span> u8 = samples[s.sample_idx];

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">18</span>, .b = <span class="tok-num">26</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-comment">// ---- three font rows, each centred on its own sample line -------------</span>
    <span class="tok-kw">const</span> panel_h: f32 = <span class="tok-num">232</span>;
    <span class="tok-kw">const</span> top: f32 = <span class="tok-num">40</span>;
    <span class="tok-kw">const</span> avail: f32 = fh - panel_h - top - <span class="tok-num">16</span>;
    <span class="tok-kw">const</span> row_h: f32 = avail / <span class="tok-num">3.0</span>;
    <span class="tok-kw">for</span> (s.fonts, <span class="tok-num">0</span>..) |font, i| {
        <span class="tok-kw">const</span> info: FontInfo = font_info[i];
        <span class="tok-kw">const</span> size: f32 = <span class="tok-fn">float</span>(font.baseSize) * s.size_scale;
        <span class="tok-kw">const</span> dim: zm.Vec2 = z.<span class="tok-fn">measureTextEx</span>(font, msg, size, s.spacing);
        <span class="tok-kw">const</span> row_y: f32 = top + row_h * <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(i)));

        <span class="tok-comment">// small TTF caption naming the face</span>
        f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, row_y + <span class="tok-num">4</span> }, info.label, .{ .size = <span class="tok-num">16</span>, .color = c.slate_400, .font = &amp;s.ui_font });

        <span class="tok-comment">// the sprite-font sample, horizontally centred in its row</span>
        <span class="tok-kw">const</span> tx: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">16.0</span>, (fw - dim[<span class="tok-num">0</span>]) * <span class="tok-num">0.5</span>);
        <span class="tok-kw">const</span> ty: f32 = row_y + (row_h - dim[<span class="tok-num">1</span>]) * <span class="tok-num">0.5</span> + <span class="tok-num">10</span>;
        f.gl.<span class="tok-fn">text</span>(.{ tx, ty }, msg, .{ .size = size, .color = info.tint, .font = &amp;font, .spacing = s.spacing });

        <span class="tok-comment">// a thin divider under each row (except the last)</span>
        <span class="tok-kw">if</span> (i &lt; <span class="tok-num">2</span>) {
            <span class="tok-kw">const</span> ly: f32 = top + row_h * <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(i)) + <span class="tok-num">1</span>);
            f.gl.<span class="tok-fn">rect</span>(
                .{ .x = <span class="tok-num">16</span>, .y = ly, .width = fw - <span class="tok-num">32</span>, .height = <span class="tok-num">1</span> },
                .{ .color = .{ .r = <span class="tok-num">40</span>, .g = <span class="tok-num">44</span>, .b = <span class="tok-num">54</span>, .a = <span class="tok-num">255</span> } },
            );
        }
    }

    <span class="tok-comment">// ---- control panel ----------------------------------------------------</span>
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, fh - panel_h - <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16.0</span>, panel_h }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Sprite fonts (LoadFontFromImage)"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"XNA-style bitmap fonts: glyphs on a magenta key, split by key gutters."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"glyphs  mecha {d}  alagard {d}  jupiter {d}"</span>, .{
            s.fonts[<span class="tok-num">0</span>].glyphCount,
            s.fonts[<span class="tok-num">1</span>].glyphCount,
            s.fonts[<span class="tok-num">2</span>].glyphCount,
        });
        u.<span class="tok-fn">separator</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"sample: {s}"</span>, .{msg});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"&lt; prev text"</span>, .{})) {
            s.sample_idx = <span class="tok-kw">if</span> (s.sample_idx == <span class="tok-num">0</span>) samples.len - <span class="tok-num">1</span> <span class="tok-kw">else</span> s.sample_idx - <span class="tok-num">1</span>;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"next text &gt;"</span>, .{})) {
            s.sample_idx = <span class="tok-kw">if</span> (s.sample_idx + <span class="tok-num">1</span> &gt;= samples.len) <span class="tok-num">0</span> <span class="tok-kw">else</span> s.sample_idx + <span class="tok-num">1</span>;
        }

        u.<span class="tok-fn">separator</span>();
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"size"</span>, &amp;s.size_scale, .{ .min = <span class="tok-num">1.0</span>, .max = <span class="tok-num">4.0</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"spacing"</span>, &amp;s.spacing, .{ .min = -<span class="tok-num">4.0</span>, .max = <span class="tok-num">12.0</span> });
    }

    s.ui_host.<span class="tok-fn">render</span>(f);

    common.<span class="tok-fn">caption</span>(f.gl, s.ui_font, <span class="tok-str">"Bitmap fonts parsed by z.loadFontFromImage - fonts (c) their designers"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// Descriptor-only: the runner/launcher drives begin/end (no offscreen pass, so</span>
<span class="tok-comment">/// no `manages_own_frame`), exactly like the other 2D UI examples.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - text sprite fonts"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">640</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
