<h1>instancing</h1>
<figure class="code src-file" data-path="examples/instancing/instancing.zig" data-lines="138"><figcaption><span>examples/instancing/instancing.zig</span><span>138 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! instancing - port of the GL `instancing`: 1000 cubes (a 10x10x10 grid)</span>
<span class="tok-comment">//! drawn in ONE instanced GPU draw. The GL version split a per-instance mat4</span>
<span class="tok-comment">//! into four vec4 vertex attributes through a custom GLSL shader; on wgpu the</span>
<span class="tok-comment">//! engine owns that - `drawMeshInstanced` keeps the cube mesh GPU-resident and</span>
<span class="tok-comment">//! streams a per-instance buffer (model matrix + colour, instance step-mode),</span>
<span class="tok-comment">//! and the instanced cube3d shader reconstructs the matrix on the GPU. Each cube</span>
<span class="tok-comment">//! spins on its own Y axis at a phase from its grid position, so the motion is</span>
<span class="tok-comment">//! spatially varied rather than synchronised. The camera slowly orbits.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> allocPrint = std.fmt.allocPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> pointVec = zm.pointVec;
<span class="tok-kw">const</span> rotationY = zm.rotationY;
<span class="tok-kw">const</span> translationV = zm.translationV;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> c = z.colors;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> grid: usize = <span class="tok-num">10</span>;
<span class="tok-kw">const</span> instance_count: usize = grid * grid * grid;
<span class="tok-kw">const</span> spacing: f32 = <span class="tok-num">1.2</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    gpa: Allocator,
    cube: z.Mesh,
    <span class="tok-comment">/// Grid base positions (fixed); per-frame transforms derive from these.</span>
    base_positions: []Vec,
    <span class="tok-comment">/// Per-instance model matrices, rebuilt each frame, passed to drawMeshInstanced.</span>
    transforms: []Mat,
    angle: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// camera orbit (degrees)</span>
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cube);
    gpa.<span class="tok-fn">free</span>(s.base_positions);
    gpa.<span class="tok-fn">free</span>(s.transforms);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> positions: []Vec = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, instance_count);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(positions);
    <span class="tok-kw">const</span> transforms: []Mat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Mat, instance_count);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(transforms);

    <span class="tok-comment">// Gridxgridxgrid centred on the origin, `spacing` units apart.</span>
    <span class="tok-kw">const</span> half: f32 = <span class="tok-fn">float</span>(grid - <span class="tok-num">1</span>) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">var</span> idx: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> zi: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (zi &lt; grid) : (zi += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> yi: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (yi &lt; grid) : (yi += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> xi: usize = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (xi &lt; grid) : (xi += <span class="tok-num">1</span>) {
                positions[idx] = <span class="tok-fn">pointVec</span>(
                    (<span class="tok-fn">float</span>(xi) - half) * spacing,
                    (<span class="tok-fn">float</span>(yi) - half) * spacing,
                    (<span class="tok-fn">float</span>(zi) - half) * spacing,
                );
                idx += <span class="tok-num">1</span>;
            }
        }
    }

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>),
        .gpa = gpa,
        .cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>),
        .base_positions = positions,
        .transforms = transforms,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    s.angle += f.time.delta_time * <span class="tok-num">12.0</span>; <span class="tok-comment">// 12 deg/sec orbit</span>
    <span class="tok-kw">const</span> t: f32 = f.time.time;

    <span class="tok-comment">// Rebuild per-instance transforms: each cube rotates around its own Y axis</span>
    <span class="tok-comment">// at a phase derived from its grid position, then translates to that cell.</span>
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; instance_count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> p: Vec = s.base_positions[i];
        <span class="tok-kw">const</span> phase: f32 = p[<span class="tok-num">0</span>] * <span class="tok-num">0.5</span> + p[<span class="tok-num">2</span>] * <span class="tok-num">0.7</span> + t;
        s.transforms[i] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translationV</span>(p), <span class="tok-fn">rotationY</span>(phase));
    }

    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-kw">const</span> orbit: f32 = s.angle * pi / <span class="tok-num">180.0</span>;
    <span class="tok-kw">const</span> dist: f32 = <span class="tok-fn">float</span>(grid) * spacing * <span class="tok-num">1.6</span>;
    <span class="tok-kw">const</span> cam: Camera3D = .{
        .position = <span class="tok-fn">pointVec</span>(<span class="tok-builtin">@cos</span>(orbit) * dist, dist * <span class="tok-num">0.45</span>, <span class="tok-builtin">@sin</span>(orbit) * dist),
