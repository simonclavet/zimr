<figure class="code src-file" data-path="examples/ui_primitives_zoo_phone/ui_primitives_zoo_phone.zig" data-lines="496"><figcaption><span>examples/ui_primitives_zoo_phone/ui_primitives_zoo_phone.zig</span><span>496 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_primitives_zoo_phone.zig - bug-hunter phone example.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Visual smoke test for every canvas drawList primitive in zimr.</span>
<span class="tok-comment">// One card per primitive, each rendered with a label saying what</span>
<span class="tok-comment">// it SHOULD look like.  If anything renders blank, wrong colour,</span>
<span class="tok-comment">// wrong position, or wrong shape, it's immediately obvious by</span>
<span class="tok-comment">// eyeball - no snapshot baselines required.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Why: through turns 410-437 zimr accumulated a set of canvas</span>
<span class="tok-comment">// primitives (addLine / addArc / addPolyline / etc) whose only</span>
<span class="tok-comment">// test coverage was at the COMMAND QUEUE level - "did the</span>
<span class="tok-comment">// polyline cmd land with N points?" - not at the RENDERED PIXEL</span>
<span class="tok-comment">// level.  Turn 437 found that `drawTriangleStrip` (the path</span>
<span class="tok-comment">// every line/arc primitive routes through) had been shipping</span>
<span class="tok-comment">// broken in WebGL2 with no texture binding + no UVs for many</span>
<span class="tok-comment">// turns.  This example exists so the next such regression is</span>
<span class="tok-comment">// visible the moment someone opens the page.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Card layout:</span>
<span class="tok-comment">//   [primitive name] [colour swatch]</span>
<span class="tok-comment">//   [drawn primitive inside 350x140 canvas]</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Tap a primitive name (left side) to highlight which one</span>
<span class="tok-comment">// you're looking at - useful when something renders wrong</span>
<span class="tok-comment">// and you need to know exactly which API is at fault.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> sinTurns = zm.sinTurns;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> tau = zm.tau;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    <span class="tok-comment">// Animation phase in turns, 0..1 cycling every 4 seconds, used to drive</span>
    <span class="tok-comment">// any primitives that look better moving (mainly the bezier</span>
    <span class="tok-comment">// and the arc sweep).  Cycles forever.</span>
    phase_turns: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
}

<span class="tok-comment">// A single test card.  `draw` is invoked with a rect describing</span>
<span class="tok-comment">// the drawable area for the primitive; the card's outer chrome</span>
<span class="tok-comment">// (label + frame) is drawn for the caller.</span>
<span class="tok-kw">const</span> Card = <span class="tok-kw">struct</span> {
    label: []<span class="tok-kw">const</span> u8,
    draw: *<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (dl: ui.DrawListHandle, area: z.Rectangle, phase_turns: f32) void,
};

<span class="tok-kw">const</span> card_height: f32 = <span class="tok-num">170</span>;

<span class="tok-kw">fn</span> <span class="tok-fn">drawCard</span>(
    u: ui.Ui,
    card: Card,
    phase_turns: f32,
) void {
    u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{card.label});
    <span class="tok-kw">const</span> canvas_dim: Vec2 = .{ <span class="tok-num">380</span>, card_height };
    <span class="tok-kw">if</span> (u.<span class="tok-fn">beginCanvas</span>(card.label, canvas_dim, .{})) |c| {
        <span class="tok-kw">defer</span> u.<span class="tok-fn">endCanvas</span>(c);
        <span class="tok-comment">// Subtle frame so the canvas extent is visible even when</span>
        <span class="tok-comment">// the primitive itself draws nothing.  Uses addRectOutline</span>
        <span class="tok-comment">// (the working drawRect path) so we never lose the frame.</span>
        c.<span class="tok-fn">drawList</span>().<span class="tok-fn">addRectOutline</span>(c.rect, Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFF303540</span>));
        <span class="tok-comment">// Slightly inset the drawing area so primitives near the</span>
        <span class="tok-comment">// edge aren't clipped by the frame.</span>
        <span class="tok-kw">const</span> area: z.Rectangle = .{
            .x = c.rect.x + <span class="tok-num">8</span>,
            .y = c.rect.y + <span class="tok-num">8</span>,
            .width = c.rect.width - <span class="tok-num">16</span>,
            .height = c.rect.height - <span class="tok-num">16</span>,
        };
        card.<span class="tok-fn">draw</span>(c.<span class="tok-fn">drawList</span>(), area, phase_turns);
    }
    u.<span class="tok-fn">spacing</span>();
}

<span class="tok-comment">// `area` with a known expected shape.</span>

<span class="tok-kw">const</span> accent: Color = Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFF70C870</span>); <span class="tok-comment">// green</span>
<span class="tok-kw">const</span> accent2: Color = Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFFFFB060</span>); <span class="tok-comment">// amber</span>
<span class="tok-kw">const</span> accent3: Color = Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFFE07070</span>); <span class="tok-comment">// red</span>
<span class="tok-kw">const</span> white: Color = Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFFFFFFFF</span>);

<span class="tok-kw">fn</span> <span class="tok-fn">drawRectFilledCard</span>(
    dl: ui.DrawListHandle,
    area: z.Rectangle,
    phase_turns: f32,

    _ = phase_turns;
    <span class="tok-comment">// EXPECT: solid green rectangle in the middle.</span>
    <span class="tok-kw">const</span> r: z.Rectangle = .{
