<h1>audio_amp_envelope</h1>
<figure class="code src-file" data-path="examples/audio_amp_envelope/audio_amp_envelope.zig" data-lines="241"><figcaption><span>examples/audio_amp_envelope/audio_amp_envelope.zig</span><span>241 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/audio_amp_envelope.zig - shaping a tone's amplitude over time (ADSR).</span>
<span class="tok-comment">// Ports raylib's `audio_amp_envelope`.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   ATTACK  silence -&gt; full, over attack_ms      (0 = a hard click)</span>
<span class="tok-comment">//   DECAY   full -&gt; sustain_level, over decay_ms</span>
<span class="tok-comment">//   SUSTAIN held at sustain_level</span>
<span class="tok-comment">//   RELEASE sustain_level -&gt; silence, over release_ms</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The four sliders regenerate the Wave on the CPU, so the plot below is not an</span>
<span class="tok-comment">// illustration of the envelope - it IS the PCM that will be played. What you see</span>
<span class="tok-comment">// is literally what you hear, which is the only way to be sure the envelope is</span>
<span class="tok-comment">// actually being applied rather than merely configured.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// No engine work needed: `composer.Envelope` already carries the full ADSR</span>
<span class="tok-comment">// (attack_ms / decay_ms / sustain_level / release_ms) and `tone()` multiplies it</span>
<span class="tok-comment">// into every sample. That shape is pinned by a host test in features_test.zig -</span>
<span class="tok-comment">// tone generation is pure CPU, so it is checkable without a device or ears.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Leak-clean (`.memory = .managed`): each regeneration releases the previous</span>
<span class="tok-comment">// Sound + samples before allocating the next.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> clamp = zm.clamp;

<span class="tok-kw">const</span> plot_cols: usize = <span class="tok-num">220</span>;
<span class="tok-kw">const</span> duration_ms: u32 = <span class="tok-num">900</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator, <span class="tok-comment">// Frame carries no allocator; regeneration happens in update</span>
    ui_host: z.UiHost,
    font: z.Font,
    ui_font: z.Font,
    audio: z.AudioState = .{},

    snd: z.Sound = .{},
    have_snd: bool = false,

    <span class="tok-comment">// live ADSR</span>
    attack_ms: f32 = <span class="tok-num">60.0</span>,
    decay_ms: f32 = <span class="tok-num">120.0</span>,
    sustain: f32 = <span class="tok-num">0.55</span>,
    release_ms: f32 = <span class="tok-num">320.0</span>,
    freq_hz: f32 = <span class="tok-num">330.0</span>,

    <span class="tok-comment">/// Per-column peak |sample| of the generated PCM - the envelope, MEASURED off</span>
    <span class="tok-comment">/// the wave rather than re-derived from the sliders.</span>
    plot: [plot_cols]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    frames: u32 = <span class="tok-num">0</span>,
    dirty: bool = true,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    z.audio_device.<span class="tok-fn">init</span>(f.audio_device);
    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">15</span>);
    s.* = .{
        .gpa = gpa,
        .ui_font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
        .font = font,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.ui_font);
    <span class="tok-kw">if</span> (s.have_snd) {
        z.sounds.<span class="tok-fn">unload</span>(&amp;s.audio.sounds, s.snd);
    }
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Rebuild the Wave from the current ADSR, upload it, and measure its envelope</span>
<span class="tok-comment">/// for the plot. The OLD sound is released first - regenerating on every slider</span>
<span class="tok-comment">/// nudge would otherwise pile up buffers.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">regenerate</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> w: z.Wave = z.composer.<span class="tok-fn">tone</span>(&amp;s.audio.waves, s.gpa, .{
        .frequency_hz = s.freq_hz,
        .duration_ms = duration_ms,
        .shape = .sine,
        .amplitude = <span class="tok-num">0.9</span>,
        .envelope = .{
            .attack_ms = s.attack_ms,
            .decay_ms = s.decay_ms,
            .sustain_level = s.sustain,
            .release_ms = s.release_ms,
        },
    }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">defer</span> z.waves.<span class="tok-fn">unload</span>(&amp;s.audio.waves, w);

    <span class="tok-comment">// Measure the envelope OFF THE PCM: peak |sample| per column. At these</span>
    <span class="tok-comment">// frequencies a column spans many periods, so its peak is the envelope there.</span>
    <span class="tok-kw">const</span> samples: []f32 = z.waves.<span class="tok-fn">loadSamples</span>(s.gpa, w) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">defer</span> z.waves.<span class="tok-fn">unloadSamples</span>(s.gpa, samples);

    s.frames = w.frameCount;
    <span class="tok-kw">const</span> per: usize = <span class="tok-builtin">@max</span>(samples.len / plot_cols, <span class="tok-num">1</span>);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..plot_cols) |i| {
        <span class="tok-kw">const</span> a: usize = i * per;
        <span class="tok-kw">const</span> b: usize = <span class="tok-builtin">@min</span>(a + per, samples.len);
        <span class="tok-kw">var</span> m: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">var</span> k: usize = a;
        <span class="tok-kw">while</span> (k &lt; b) : (k += <span class="tok-num">1</span>) {
            m = <span class="tok-builtin">@max</span>(m, <span class="tok-builtin">@abs</span>(samples[k]));
        }
        s.plot[i] = m;
    }

    <span class="tok-kw">if</span> (s.have_snd) {
        z.sounds.<span class="tok-fn">unload</span>(&amp;s.audio.sounds, s.snd);
        s.have_snd = false;
    }
    s.snd = z.sounds.<span class="tok-fn">loadFromWave</span>(&amp;s.audio.sounds, f.audio_device, s.gpa, w) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    s.have_snd = true;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-kw">if</span> (s.dirty) {
        <span class="tok-fn">regenerate</span>(f, s);
        s.dirty = false;
    }

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">18</span>, .b = <span class="tok-num">26</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-comment">// ---- the measured envelope ------------------------------------------</span>
    <span class="tok-kw">const</span> base: f32 = fh - <span class="tok-num">60.0</span>;
    <span class="tok-kw">const</span> top: f32 = <span class="tok-num">330.0</span>;
    <span class="tok-kw">const</span> h: f32 = <span class="tok-builtin">@max</span>(base - top, <span class="tok-num">80.0</span>);
    <span class="tok-kw">const</span> cw: f32 = (fw - <span class="tok-num">32.0</span>) / <span class="tok-fn">float</span>(plot_cols);

    <span class="tok-comment">// Mirror it about the centre line: that's what a waveform actually looks</span>
    <span class="tok-comment">// like, and it makes the attack/decay/release slopes obvious.</span>
    <span class="tok-kw">const</span> mid: f32 = base - h * <span class="tok-num">0.5</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..plot_cols) |i| {
        <span class="tok-kw">const</span> v: f32 = <span class="tok-fn">clamp</span>(s.plot[i], <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>) * h * <span class="tok-num">0.5</span>;
        <span class="tok-kw">const</span> x: f32 = <span class="tok-num">16.0</span> + <span class="tok-fn">float</span>(i) * cw;
        <span class="tok-kw">const</span> heat: f32 = <span class="tok-fn">clamp</span>(s.plot[i], <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>);
        <span class="tok-kw">const</span> col: Color = .{
            .r = <span class="tok-builtin">@trunc</span>(<span class="tok-num">70.0</span> + <span class="tok-num">150.0</span> * heat),
            .g = <span class="tok-builtin">@trunc</span>(<span class="tok-num">210.0</span> - <span class="tok-num">40.0</span> * heat),
            .b = <span class="tok-builtin">@trunc</span>(<span class="tok-num">160.0</span> + <span class="tok-num">40.0</span> * heat),
            .a = <span class="tok-num">255</span>,
        };
        f.gl.<span class="tok-fn">rect</span>(
            .{ .x = x, .y = mid - v, .width = <span class="tok-builtin">@max</span>(cw - <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>), .height = <span class="tok-builtin">@max</span>(v * <span class="tok-num">2.0</span>, <span class="tok-num">1.0</span>) },
            .{ .color = col },
        );
    }
    f.gl.<span class="tok-fn">line</span>(.{ <span class="tok-num">16</span>, mid }, .{ fw - <span class="tok-num">16.0</span>, mid }, .{
        .color = .{ .r = <span class="tok-num">60</span>, .g = <span class="tok-num">66</span>, .b = <span class="tok-num">84</span>, .a = <span class="tok-num">255</span> },
        .thickness = <span class="tok-num">1</span>,
    });

    <span class="tok-comment">// Stage boundaries, so each slider's region of the curve is identifiable.</span>
    <span class="tok-kw">const</span> total: f32 = <span class="tok-fn">float</span>(duration_ms);
    <span class="tok-kw">const</span> marks = [<span class="tok-num">3</span>]f32{
        s.attack_ms,
        s.attack_ms + s.decay_ms,
        total - s.release_ms,
    };
    <span class="tok-kw">const</span> labels = [<span class="tok-num">3</span>][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"A"</span>, <span class="tok-str">"D"</span>, <span class="tok-str">"R"</span> };
    <span class="tok-kw">for</span> (marks, labels) |ms, lb| {
        <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">clamp</span>(ms / total, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>);
        <span class="tok-kw">const</span> x: f32 = <span class="tok-num">16.0</span> + t * (fw - <span class="tok-num">32.0</span>);
        f.gl.<span class="tok-fn">line</span>(.{ x, mid - h * <span class="tok-num">0.5</span> }, .{ x, mid + h * <span class="tok-num">0.5</span> }, .{
            .color = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">130</span>, .b = <span class="tok-num">160</span>, .a = <span class="tok-num">140</span> },
            .thickness = <span class="tok-num">1</span>,
        });
        f.gl.<span class="tok-fn">text</span>(.{ x + <span class="tok-num">3.0</span>, mid + h * <span class="tok-num">0.5</span> + <span class="tok-num">4.0</span> }, lb, .{
            .size = <span class="tok-num">14</span>,
            .color = c.gray,
            .font = &amp;s.font,
        });
    }
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, base + <span class="tok-num">6.0</span> },
        <span class="tok-str">"peak |sample| per column - the ACTUAL pcm, not a sketch"</span>,
        .{ .size = <span class="tok-num">14</span>, .color = c.gray, .font = &amp;s.font },
    );

    <span class="tok-comment">// ---- UI ---------------------------------------------------------------</span>
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16.0</span>, <span class="tok-num">300</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Amp envelope (ADSR)"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"PLAY"</span>, .{})) {
            <span class="tok-kw">if</span> (s.have_snd) {
                z.sounds.<span class="tok-fn">play</span>(&amp;s.audio.sounds, s.snd);
            }
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{d} ms tone"</span>, .{duration_ms});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-kw">var</span> changed: bool = false;
        changed = u.<span class="tok-fn">slider</span>(<span class="tok-str">"attack ms"</span>, &amp;s.attack_ms, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">400</span> }) <span class="tok-kw">or</span> changed;
        changed = u.<span class="tok-fn">slider</span>(<span class="tok-str">"decay ms"</span>, &amp;s.decay_ms, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">400</span> }) <span class="tok-kw">or</span> changed;
        changed = u.<span class="tok-fn">slider</span>(<span class="tok-str">"sustain"</span>, &amp;s.sustain, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">1.0</span> }) <span class="tok-kw">or</span> changed;
        changed = u.<span class="tok-fn">slider</span>(<span class="tok-str">"release ms"</span>, &amp;s.release_ms, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">600</span> }) <span class="tok-kw">or</span> changed;
        changed = u.<span class="tok-fn">slider</span>(<span class="tok-str">"freq Hz"</span>, &amp;s.freq_hz, .{ .min = <span class="tok-num">80</span>, .max = <span class="tok-num">900</span> }) <span class="tok-kw">or</span> changed;
        <span class="tok-kw">if</span> (changed) {
            s.dirty = true; <span class="tok-comment">// regenerate ONCE next frame, not per slider event</span>
        }
        u.<span class="tok-fn">text</span>(<span class="tok-str">"frames {d}"</span>, .{s.frames});
    }

    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - audio - amp envelope"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            .scale_mode = .responsive,
            .depth_format = null,
            .clear = .{ .r = <span class="tok-num">16.0</span> / <span class="tok-num">255.0</span>, .g = <span class="tok-num">18.0</span> / <span class="tok-num">255.0</span>, .b = <span class="tok-num">26.0</span> / <span class="tok-num">255.0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    .memory = .managed,
};
