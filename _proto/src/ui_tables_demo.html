    };
    <span class="tok-kw">for</span> (&amp;s.builds, <span class="tok-num">0</span>..) |*b, i| {
        b.id = <span class="tok-builtin">@intCast</span>(i + <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> branch_name: []<span class="tok-kw">const</span> u8 = branch_names[i % branch_names.len];
        <span class="tok-kw">const</span> written: []u8 = <span class="tok-fn">bufPrint</span>(&amp;b.name_buf, <span class="tok-str">"{s}#{d}"</span>, .{ branch_name, b.id }) <span class="tok-kw">catch</span> b.name_buf[<span class="tok-num">0</span>..<span class="tok-num">0</span>];
        b.name_len = written.len;
        <span class="tok-kw">const</span> status_roll: u8 = r.<span class="tok-fn">intRangeAtMost</span>(u8, <span class="tok-num">0</span>, <span class="tok-num">99</span>);
        b.status = <span class="tok-kw">if</span> (status_roll &lt; <span class="tok-num">60</span>)
            BuildStatus.passed
        <span class="tok-kw">else</span> <span class="tok-kw">if</span> (status_roll &lt; <span class="tok-num">80</span>)
            BuildStatus.failed
        <span class="tok-kw">else</span> <span class="tok-kw">if</span> (status_roll &lt; <span class="tok-num">90</span>)
            BuildStatus.running
        <span class="tok-kw">else</span> <span class="tok-kw">if</span> (status_roll &lt; <span class="tok-num">97</span>)
            BuildStatus.queued
        <span class="tok-kw">else</span>
            BuildStatus.cancelled;
        b.duration_s = <span class="tok-kw">if</span> (b.status == .queued) <span class="tok-num">0</span> <span class="tok-kw">else</span> r.<span class="tok-fn">intRangeAtMost</span>(i32, <span class="tok-num">15</span>, <span class="tok-num">1800</span>);
        b.queue = r.<span class="tok-fn">intRangeAtMost</span>(u32, <span class="tok-num">1</span>, <span class="tok-num">4</span>);
    }
    s.initialized = true;
}

<span class="tok-kw">fn</span> <span class="tok-fn">sortBuilds</span>(
    specs: *<span class="tok-kw">const</span> ui.TableSortSpecs,
    a: Build,
    b: Build,
) bool {
    <span class="tok-kw">for</span> (specs.<span class="tok-fn">items</span>()) |spec| {
        <span class="tok-kw">const</span> ord: i32 = <span class="tok-kw">switch</span> (spec.column_index) {
            <span class="tok-num">0</span> =&gt; <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(a.id)) - <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(b.id)),
            <span class="tok-num">1</span> =&gt; <span class="tok-kw">switch</span> (std.mem.<span class="tok-fn">order</span>(u8, a.<span class="tok-fn">name</span>(), b.<span class="tok-fn">name</span>())) {
                .lt =&gt; -<span class="tok-num">1</span>,
                .gt =&gt; <span class="tok-num">1</span>,
                .eq =&gt; <span class="tok-num">0</span>,
            },
            <span class="tok-num">2</span> =&gt; a.status.<span class="tok-fn">rank</span>() - b.status.<span class="tok-fn">rank</span>(),
            <span class="tok-num">3</span> =&gt; a.duration_s - b.duration_s,
            <span class="tok-num">4</span> =&gt; <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(a.queue)) - <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(b.queue)),
            <span class="tok-kw">else</span> =&gt; <span class="tok-num">0</span>,
        };
        <span class="tok-kw">if</span> (ord != <span class="tok-num">0</span>) {
            <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (spec.direction) {
                .ascending =&gt; ord &lt; <span class="tok-num">0</span>,
                .descending =&gt; ord &gt; <span class="tok-num">0</span>,
            };
        }
    }
    <span class="tok-kw">return</span> false;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Tables - full showcase"</span>, .{
        .initial_pos = .{ <span class="tok-num">20</span>, <span class="tok-num">20</span> },
        .initial_size = .{ <span class="tok-num">940</span>, <span class="tok-num">640</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"CI build dashboard.  {d} builds.  All table features: layout + sort + scroll + tints."</span>, .{n_builds});
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"striped rows"</span>, &amp;s.striped);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"highlight failures/running"</span>, &amp;s.highlight_failures);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"borders"</span>, &amp;s.show_borders);
        <span class="tok-comment">// P8.2 demo (turn 407): granular border toggles.  Each</span>
        <span class="tok-comment">// checkbox flips one of the four `borders_*` sub-flags.</span>
        <span class="tok-comment">// The master `borders` checkbox above AND-gates them all.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Border edges:"</span>, .{});
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"inner H"</span>, &amp;s.borders_inner_h);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"outer H"</span>, &amp;s.borders_outer_h);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"inner V"</span>, &amp;s.borders_inner_v);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"outer V"</span>, &amp;s.borders_outer_v);
        <span class="tok-comment">// P8.3 demo (turn 408): no_pad_outer_x / no_pad_inner_x</span>
        <span class="tok-comment">// toggles.  Watch column 0's content slide flush against</span>
        <span class="tok-comment">// the outer-left edge when outer-X is checked; watch</span>
        <span class="tok-comment">// columns 1..N-1 tighten up against their dividers when</span>
        <span class="tok-comment">// inner-X is checked.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"No-pad X:"</span>, .{});
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"outer X"</span>, &amp;s.no_pad_outer_x);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"inner X"</span>, &amp;s.no_pad_inner_x);
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"table height"</span>, &amp;s.table_height, .{ .min = <span class="tok-num">200</span>, .max = <span class="tok-num">540</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });

        u.<span class="tok-fn">separator</span>();

        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTable</span>(<span class="tok-str">"builds"</span>, <span class="tok-num">5</span>, .{
            .borders = s.show_borders,
            .borders_inner_h = s.borders_inner_h,
            .borders_outer_h = s.borders_outer_h,
            .borders_inner_v = s.borders_inner_v,
            .borders_outer_v = s.borders_outer_v,
            .no_pad_outer_x = s.no_pad_outer_x,
            .no_pad_inner_x = s.no_pad_inner_x,
            .outer_height = s.table_height,
            .freeze_rows = <span class="tok-num">1</span>,
            .row_bg = s.striped,
        })) {
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Build"</span>, .{ .sizing = .fixed, .width = <span class="tok-num">70</span> });
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Name"</span>, .{ .sizing = .stretch });
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Status"</span>, .{ .sizing = .fixed, .width = <span class="tok-num">100</span> });
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Duration"</span>, .{ .sizing = .fixed, .width = <span class="tok-num">100</span> });
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Queue"</span>, .{ .sizing = .fixed, .width = <span class="tok-num">80</span> });

            u.<span class="tok-fn">tableHeadersRow</span>();
            <span class="tok-kw">if</span> (u.<span class="tok-fn">tableGetSortSpecs</span>()) |specs| {
                std.mem.<span class="tok-fn">sort</span>(Build, &amp;s.builds, specs, sortBuilds);
            }

            <span class="tok-kw">for</span> (s.builds) |b| {
                u.<span class="tok-fn">tableNextRow</span>();
                <span class="tok-kw">if</span> (s.highlight_failures) {
                    <span class="tok-kw">switch</span> (b.status) {
                        .failed =&gt; u.<span class="tok-fn">tableSetRowBgColor</span>(.{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">60</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">50</span> }),
                        .running =&gt; u.<span class="tok-fn">tableSetRowBgColor</span>(.{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">180</span>, .b = <span class="tok-num">40</span>, .a = <span class="tok-num">60</span> }),
                        <span class="tok-kw">else</span> =&gt; {},
                    }
                }
                _ = u.<span class="tok-fn">tableNextColumn</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"#{d}"</span>, .{b.id});
                _ = u.<span class="tok-fn">tableNextColumn</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{b.<span class="tok-fn">name</span>()});
                _ = u.<span class="tok-fn">tableNextColumn</span>();
                <span class="tok-comment">// P8.1 demo (turn 406): per-cell bg color via</span>
                <span class="tok-comment">// tableSetCellBgColor.  Highlights ONLY the Status</span>
                <span class="tok-comment">// column based on the build's current state; the</span>
                <span class="tok-comment">// cell bg paints OVER the row bg (more specific</span>
                <span class="tok-comment">// override wins) but UNDER the cell text.  Effect:</span>
                <span class="tok-comment">// a colored chip behind the status label, regardless</span>
                <span class="tok-comment">// of the row's overall highlight.</span>
                <span class="tok-kw">if</span> (s.highlight_failures) {
                    <span class="tok-kw">switch</span> (b.status) {
                        .failed =&gt; u.<span class="tok-fn">tableSetCellBgColor</span>(.{ .r = <span class="tok-num">200</span>, .g = <span class="tok-num">40</span>, .b = <span class="tok-num">40</span>, .a = <span class="tok-num">120</span> }),
                        .running =&gt; u.<span class="tok-fn">tableSetCellBgColor</span>(.{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">160</span>, .b = <span class="tok-num">30</span>, .a = <span class="tok-num">140</span> }),
                        .passed =&gt; u.<span class="tok-fn">tableSetCellBgColor</span>(.{ .r = <span class="tok-num">40</span>, .g = <span class="tok-num">160</span>, .b = <span class="tok-num">80</span>, .a = <span class="tok-num">90</span> }),
                        <span class="tok-kw">else</span> =&gt; {},
                    }
                }
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{b.status.<span class="tok-fn">label</span>()});
                _ = u.<span class="tok-fn">tableNextColumn</span>();
                <span class="tok-kw">if</span> (b.duration_s == <span class="tok-num">0</span>) {
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"--"</span>, .{});
                } <span class="tok-kw">else</span> {
                    <span class="tok-kw">const</span> m: i32 = <span class="tok-builtin">@divTrunc</span>(b.duration_s, <span class="tok-num">60</span>);
                    <span class="tok-kw">const</span> sec: i32 = <span class="tok-builtin">@mod</span>(b.duration_s, <span class="tok-num">60</span>);
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"{d}m{d:0&gt;2}s"</span>, .{ m, sec });
                }
                _ = u.<span class="tok-fn">tableNextColumn</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"q{d}"</span>, .{b.queue});
            }
            u.<span class="tok-fn">endTable</span>();
        }

        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Try: shift-click 'Status' then 'Duration' to group failures by length."</span>, .{});

        <span class="tok-comment">// ---- P8.4 sizing-mode showcase (turn 412) -------------------</span>
        <span class="tok-comment">// A small second table next to a mode selector so each of</span>
        <span class="tok-comment">// the four `TableSizing` policies can be flipped through</span>
        <span class="tok-comment">// and the layout change observed.  Three columns with</span>
        <span class="tok-comment">// intentionally different content widths so the mode</span>
        <span class="tok-comment">// differences pop:</span>
        <span class="tok-comment">//   - "Id" (narrow numbers)</span>
        <span class="tok-comment">//   - "Description" (long varied text)</span>
        <span class="tok-comment">//   - "Tag" (short labels)</span>
        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"P8.4 sizing modes: each policy in TableSizing controls how unspecified columns size themselves."</span>, .{});
        <span class="tok-kw">for</span> (sizing_modes, <span class="tok-num">0</span>..) |sm, i| {
            <span class="tok-kw">if</span> (i &gt; <span class="tok-num">0</span>) {
                u.<span class="tok-fn">sameLine</span>(.{});
            }
            <span class="tok-comment">// selectable() acts as a single-select radio chip.</span>
            <span class="tok-kw">if</span> (u.<span class="tok-fn">selectable</span>(sm.label, s.sizing_mode_idx == <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(i)), .{})) {
                s.sizing_mode_idx = <span class="tok-builtin">@intCast</span>(i);
            }
        }
        <span class="tok-kw">const</span> active_mode: ui.TableSizing = sizing_modes[<span class="tok-builtin">@intCast</span>(s.sizing_mode_idx)].mode;
        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTable</span>(<span class="tok-str">"sizing_demo"</span>, <span class="tok-num">3</span>, .{
            .sizing = active_mode,
            .row_bg = true,
            .outer_height = <span class="tok-num">140</span>,
        })) {
            <span class="tok-comment">// No per-column `sizing` override - every column inherits</span>
            <span class="tok-comment">// from the table's policy.  Switching the mode above</span>
            <span class="tok-comment">// shows how the same data lays out under each policy.</span>
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Id"</span>, .{});
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Description"</span>, .{});
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Tag"</span>, .{});
            u.<span class="tok-fn">tableHeadersRow</span>();
            <span class="tok-kw">const</span> rows: [<span class="tok-num">4</span>]<span class="tok-kw">struct</span> { id: []<span class="tok-kw">const</span> u8, desc: []<span class="tok-kw">const</span> u8, tag: []<span class="tok-kw">const</span> u8 } = .{
                .{ .id = <span class="tok-str">"1"</span>, .desc = <span class="tok-str">"short"</span>, .tag = <span class="tok-str">"A"</span> },
                .{ .id = <span class="tok-str">"12"</span>, .desc = <span class="tok-str">"medium length"</span>, .tag = <span class="tok-str">"BB"</span> },
                .{ .id = <span class="tok-str">"123"</span>, .desc = <span class="tok-str">"a noticeably longer description for this row"</span>, .tag = <span class="tok-str">"CCC"</span> },
                .{ .id = <span class="tok-str">"1234"</span>, .desc = <span class="tok-str">"tiny"</span>, .tag = <span class="tok-str">"DDDD"</span> },
            };
            <span class="tok-kw">for</span> (rows) |row| {
                u.<span class="tok-fn">tableNextRow</span>();
                _ = u.<span class="tok-fn">tableNextColumn</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{row.id});
                _ = u.<span class="tok-fn">tableNextColumn</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{row.desc});
                _ = u.<span class="tok-fn">tableNextColumn</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{row.tag});
            }
            u.<span class="tok-fn">endTable</span>();
        }
    }
}
