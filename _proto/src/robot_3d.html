<h1>robot_3d</h1>
<figure class="code src-file" data-path="examples/robot_3d/robot_3d.zig" data-lines="1101"><figcaption><span>examples/robot_3d/robot_3d.zig</span><span>1101 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! robot_3d - a real robot, from a real URDF, moving in three dimensions.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! * THE MILESTONE. Everything before this simulated robots we wrote ourselves. This one is</span>
<span class="tok-comment">//! a KUKA LBR iiwa: seven axes, eight links, mass properties measured from the actual</span>
<span class="tok-comment">//! hardware, described in a file somebody else wrote for a different toolchain.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- HOW IT GETS HERE --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!     kuka_iiwa.urdf --(zig build urdf-import)--&gt; kuka_iiwa.zig --(comptime)--&gt; Model</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The generated file is checked in and compiled like any hand-written model, so `Spec()`</span>
<span class="tok-comment">//! validates it and the joint names become an ENUM - `Kuka.Joint.lbr_iiwa_joint_4` is</span>
<span class="tok-comment">//! compile-checked, and a typo is a build error rather than a silent index. That is the</span>
<span class="tok-comment">//! whole argument for the code generator over loading at runtime, and this file is where it</span>
<span class="tok-comment">//! pays off: the controller below names joints, and the compiler checks it did so correctly.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! (`src/robot_urdf.zig` loads the same file at runtime for robots chosen at startup. Both</span>
<span class="tok-comment">//! paths end at the same builder and a test asserts they agree - see section 4i-quater.)</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- THE MESHES --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The URDF names an `.obj` per link for its visual geometry, and `codecs.obj` already</span>
<span class="tok-comment">//! parses those - so the robot is drawn with the actual shapes KUKA shipped, 890 KB of</span>
<span class="tok-comment">//! them, embedded the way `damaged_helmet` embeds its 3.7 MB glb.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! * THE MESH IS DECORATION AND THE SKELETON IS THE TRUTH. What is simulated is eight</span>
<span class="tok-comment">//! inertias connected by seven hinges; the meshes hang off those body frames and affect</span>
<span class="tok-comment">//! nothing. Press W to see the joint frames underneath - the mass properties come from the</span>
<span class="tok-comment">//! URDF's `&lt;inertial&gt;` blocks, not from these shapes, and the collision geometry (separate</span>
<span class="tok-comment">//! `.stl` files) is not loaded at all yet. A pretty robot that is lying about its physics</span>
<span class="tok-comment">//! is a real hazard, so this one shows you both.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> ui = z.ui;
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> isFinite = zm.isFinite;
<span class="tok-kw">const</span> log10 = zm.log10;
<span class="tok-kw">const</span> pow = zm.pow;
<span class="tok-kw">const</span> rbt = z.robot;
<span class="tok-kw">const</span> zp = z.zimrphysics;
<span class="tok-kw">const</span> bridge_mod = z.robot_physics;
<span class="tok-kw">const</span> scene_mod = z.robot_scene;
<span class="tok-kw">const</span> ctl = z.robot_control;
<span class="tok-comment">// * THE GENERATED MODEL ITSELF, not a copy of it.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// This used to import a local `kuka_iiwa.zig` copied here by hand, and the copy went STALE</span>
<span class="tok-comment">// the moment the importer learned to emit collision hulls: the example kept a model with</span>
<span class="tok-comment">// `ngeom = 0`, so the bridge created no proxies, so the arm did not exist as far as the</span>
<span class="tok-comment">// collision detector was concerned. The arm swept through the tower reporting zero contacts</span>
<span class="tok-comment">// with every other part of the seam working perfectly.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Nothing warns about a stale copy - it compiles, runs, and is simply an older robot. The</span>
<span class="tok-comment">// fix is not to re-copy it but to stop having two of it.</span>
<span class="tok-kw">const</span> kuka = <span class="tok-builtin">@import</span>(<span class="tok-str">"kuka_iiwa.zig"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> rotate = zm.rotate;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> acosRad = zm.acosRad;
<span class="tok-kw">const</span> length3 = zm.length3;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;

<span class="tok-kw">const</span> timestep: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">240.0</span>;

<span class="tok-kw">const</span> bg: Color = .{ .r = <span class="tok-num">24</span>, .g = <span class="tok-num">17</span>, .b = <span class="tok-num">13</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> link_col: Color = .{ .r = <span class="tok-num">79</span>, .g = <span class="tok-num">179</span>, .b = <span class="tok-num">165</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> joint_col: Color = .{ .r = <span class="tok-num">232</span>, .g = <span class="tok-num">196</span>, .b = <span class="tok-num">92</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> tip_col: Color = .{ .r = <span class="tok-num">211</span>, .g = <span class="tok-num">95</span>, .b = <span class="tok-num">51</span>, .a = <span class="tok-num">255</span> };
<span class="tok-comment">/// Green when IK has the wrist on the goal, amber when it is straining at the edge of reach -</span>
<span class="tok-comment">/// the same distinction the panel reports, where the eye already is.</span>
<span class="tok-kw">const</span> goal_reached_col: Color = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">230</span>, .b = <span class="tok-num">140</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> goal_straining_col: Color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> };

<span class="tok-comment">/// A pose to hold, as joint angles. Named rather than numbered so the HUD can say which.</span>
<span class="tok-kw">const</span> Pose = <span class="tok-kw">struct</span> {
    name: []<span class="tok-kw">const</span> u8,
    angles: [<span class="tok-num">7</span>]f32,
};

<span class="tok-kw">const</span> poses = [_]Pose{
    .{ .name = <span class="tok-str">"home"</span>, .angles = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .name = <span class="tok-str">"reach out"</span>, .angles = .{ <span class="tok-num">0</span>, <span class="tok-num">0.9</span>, <span class="tok-num">0</span>, -<span class="tok-num">1.2</span>, <span class="tok-num">0</span>, <span class="tok-num">0.9</span>, <span class="tok-num">0</span> } },
    .{ .name = <span class="tok-str">"folded"</span>, .angles = .{ <span class="tok-num">0</span>, <span class="tok-num">1.4</span>, <span class="tok-num">0</span>, -<span class="tok-num">2.0</span>, <span class="tok-num">0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0</span> } },
    .{ .name = <span class="tok-str">"twisted"</span>, .angles = .{ <span class="tok-num">1.2</span>, <span class="tok-num">0.6</span>, -<span class="tok-num">0.8</span>, -<span class="tok-num">1.5</span>, <span class="tok-num">1.1</span>, <span class="tok-num">0.7</span>, -<span class="tok-num">0.5</span> } },
    <span class="tok-comment">// * The two that make contact interesting. "wind up" holds the arm clear to one side;</span>
    <span class="tok-comment">// "sweep" carries it across the crate's position at roughly the crate's height. Going</span>
    <span class="tok-comment">// from one to the other is a real arm swinging its own mass into an obstacle, with the</span>
    <span class="tok-comment">// controller discovering the obstacle rather than being told about it.</span>
    .{ .name = <span class="tok-str">"wind up"</span>, .angles = .{ -<span class="tok-num">1.1</span>, <span class="tok-num">1.15</span>, <span class="tok-num">0</span>, -<span class="tok-num">1.1</span>, <span class="tok-num">0</span>, <span class="tok-num">0.8</span>, <span class="tok-num">0</span> } },
    .{ .name = <span class="tok-str">"sweep"</span>, .angles = .{ <span class="tok-num">0.6</span>, <span class="tok-num">1.15</span>, <span class="tok-num">0</span>, -<span class="tok-num">1.1</span>, <span class="tok-num">0</span>, <span class="tok-num">0.8</span>, <span class="tok-num">0</span> } },
};

<span class="tok-comment">/// -- THE TOWER --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// A stack of crates rather than one, because a single box slides and a STACK TOPPLES - and</span>
<span class="tok-comment">/// toppling is the thing worth watching. It also exercises far more of both engines: the</span>
<span class="tok-comment">/// crates rest on each other through zimrphysics' own solver while the arm meets only the</span>
<span class="tok-comment">/// one it strikes, so the collapse is transmitted through contacts neither engine was told</span>
<span class="tok-comment">/// about in advance.</span>
<span class="tok-kw">const</span> crate_count: usize = <span class="tok-num">5</span>;
<span class="tok-kw">const</span> crate_half: f32 = <span class="tok-num">0.055</span>;
<span class="tok-comment">/// Where the bottom crate's centre sits.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * MEASURED TWICE, AND THE SECOND TIME PROPERLY. The first placement put the tower at</span>
<span class="tok-comment">/// radius 0.56 and the sweep missed it entirely - 0 N, a demo that silently does nothing.</span>
<span class="tok-comment">/// Moving it to radius 0.64 produced a GLANCING blow: the closest any link centre came to</span>
<span class="tok-comment">/// the tower was 0.062 m against a crate half-width of 0.055, so whether it connected at all</span>
<span class="tok-comment">/// depended on which link happened to pass. That is worse than missing, because it works</span>
<span class="tok-comment">/// sometimes.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The fix was to ask where the arm actually goes rather than nudge: sweeping it and</span>
<span class="tok-comment">/// printing every link position showed the path is an ARC at y = 0.200 and radius 0.70. The</span>
<span class="tok-comment">/// tower now sits ON that arc - same azimuth, radius corrected - so the arm goes through the</span>
<span class="tok-comment">/// middle of it rather than shaving the edge.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// This is the same lesson the 2D contact demo taught: a robot's reachable set is not</span>
<span class="tok-comment">/// something to eyeball. Ask the kinematics where the hand goes, then put the target there.</span>
<span class="tok-kw">const</span> tower_base: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0.679</span>, crate_half, <span class="tok-num">0.175</span>);

<span class="tok-comment">/// Centre of crate `i`, counting up from the floor. A hair of clearance between them so the</span>
<span class="tok-comment">/// stack settles under gravity instead of starting interpenetrated - a stack that begins</span>
<span class="tok-comment">/// overlapping explodes on frame one, which looks like a physics bug and is a setup bug.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">cratePosition</span>(i: usize) Vec {
    <span class="tok-kw">const</span> gap: f32 = <span class="tok-num">0.004</span>;
    <span class="tok-kw">const</span> step: f32 = <span class="tok-num">2.0</span> * crate_half + gap;
    <span class="tok-kw">return</span> tower_base + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-fn">float</span>(i) * step, <span class="tok-num">0</span>);
}

<span class="tok-comment">/// One visual mesh per link, in link order. `link_N.obj` is the shape bolted to</span>
<span class="tok-comment">/// `lbr_iiwa_link_N`, so the index IS the body index minus one.</span>
<span class="tok-kw">const</span> mesh_sources = [_][]<span class="tok-kw">const</span> u8{
    <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"meshes/link_0.obj"</span>),
    <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"meshes/link_1.obj"</span>),
    <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"meshes/link_2.obj"</span>),
    <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"meshes/link_3.obj"</span>),
    <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"meshes/link_4.obj"</span>),
    <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"meshes/link_5.obj"</span>),
    <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"meshes/link_6.obj"</span>),
    <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"meshes/link_7.obj"</span>),
};

<span class="tok-comment">/// ** THE CRATES LIVE IN THE ROBOT'S OWN TREE (section 4k).</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Not in zimrphysics as dynamic bodies with contacts handed across a seam - as free-jointed</span>
<span class="tok-comment">/// bodies in the same mass matrix as the arm. A contact between a link and a crate is then a</span>
<span class="tok-comment">/// contact between two bodies of ONE system: the relative Jacobian spans both, the solver</span>
<span class="tok-comment">/// resolves it once, and momentum is conserved by construction.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The visible consequence, and the thing to look for: **a heavier crate now resists more.**</span>
<span class="tok-comment">/// Under the old two-solver seam a 666x mass range changed the arm's behaviour by under 1%,</span>
<span class="tok-comment">/// because each engine treated the other side as immovable.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// zimrphysics keeps the floor and does all the collision DETECTION. It simulates none of</span>
<span class="tok-comment">/// the dynamics that matter here.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sceneCrates</span>() [crate_count]scene_mod.FreeBody {
    <span class="tok-kw">var</span> crates: [crate_count]scene_mod.FreeBody = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..crate_count) |i| {
        crates[i] = .{
            .name = crate_names[i],
            .pos = <span class="tok-fn">cratePosition</span>(i),
            .geoms = &amp;.{.{
                .shape = .{ .box = .{ .half_extent = <span class="tok-fn">splat</span>(crate_half) } },
                .mass = <span class="tok-num">0.8</span>,
            }},
            <span class="tok-comment">// A little damping: real crates have none, but a scene that never settles</span>
            <span class="tok-comment">// accumulates jitter into perpetual motion. Small enough to leave a shove lively.</span>
            .damping = <span class="tok-num">0.05</span>,
        };
    }
    <span class="tok-kw">return</span> crates;
}

<span class="tok-kw">const</span> crate_names = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"crate0"</span>, <span class="tok-str">"crate1"</span>, <span class="tok-str">"crate2"</span>, <span class="tok-str">"crate3"</span>, <span class="tok-str">"crate4"</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    model: rbt.Model,
    data: rbt.Data,
    font: z.Font,
    cam: z.OrbitCamera,
    <span class="tok-comment">/// GPU-resident link meshes, and a one-element transform buffer reused for each draw.</span>
    meshes: [mesh_sources.len]z.Mesh,
    <span class="tok-comment">/// One unit-ish cube, drawn once per crate with that crate's own transform.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * WHY A MESH RATHER THAN `drawCube`. `drawCube` is axis-aligned and takes no</span>
    <span class="tok-comment">/// rotation, so a toppling crate would keep sitting bolt upright - hiding the very</span>
    <span class="tok-comment">/// thing the scene exists to show, and quietly implying the crates only ever slide.</span>
    <span class="tok-comment">/// `drawMeshInstanced` takes a full transform, so a tumble reads as a tumble.</span>
    crate_mesh: z.Mesh,
    transform: [<span class="tok-num">1</span>]zm.Mat,
    ui_host: z.UiHost,
    <span class="tok-comment">/// Show the skeleton the meshes hang on, and the meshes themselves.</span>
    show_frames: bool,
    show_meshes: bool,
    <span class="tok-comment">/// Vertices actually uploaded, summed. A READOUT rather than a comment: if the meshes</span>
    <span class="tok-comment">/// silently fail to load this reads zero, and the alternative is staring at an empty</span>
    <span class="tok-comment">/// screen wondering which half is broken. It would have saved a round trip.</span>
    mesh_vertices: u32,
    <span class="tok-comment">// -- THE PHYSICS SEAM --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Two engines, each owning what it is good at. `robot.zig` owns the arm: seven hinges</span>
    <span class="tok-comment">// in generalized coordinates, no collision detector, contacts arriving as an INPUT the</span>
    <span class="tok-comment">// way controls do. `zimrphysics` owns the floor and the crate, and also holds a</span>
    <span class="tok-comment">// KINEMATIC PROXY for each of the arm's collision hulls - bodies it steers to wherever</span>
    <span class="tok-comment">// the arm's own kinematics put them.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The proxies are what make the arm exist as far as the crate is concerned: a body</span>
    <span class="tok-comment">// outside the broad phase cannot be collided with, however real it is elsewhere.</span>
    world: zp.World,
    bridge: bridge_mod.Bridge,
    <span class="tok-comment">/// Peak contact force the ARM has felt, so a brief tap leaves a trace in the readout.</span>
    peak_force: f32,
    physics_on: bool,
    accumulator: f32,
    pose: usize,
    <span class="tok-comment">/// * THE COMMANDED POSE, WHICH IS NOT THE SELECTED POSE.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Pressing a button used to change the target INSTANTLY, and a computed-torque</span>
    <span class="tok-comment">/// controller asked to move a metre in one timestep obliges: the arm reached the speed</span>
    <span class="tok-comment">/// of a swung bat and launched the crates a hundred metres. That is not the controller</span>
    <span class="tok-comment">/// misbehaving, it is being told to do something absurd.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Real arms are commanded along a TRAJECTORY, not teleported to a setpoint. This slides</span>
    <span class="tok-comment">/// toward the selected pose at a bounded joint rate, which is both what a real</span>
    <span class="tok-comment">/// controller receives and what keeps the collision sane - the one-way coupling of section 4h</span>
    <span class="tok-comment">/// treats the arm as immovable, so an arm moving impossibly fast delivers an impossible</span>
    <span class="tok-comment">/// impulse and nothing pushes back.</span>
    commanded: [<span class="tok-num">7</span>]f32,
    <span class="tok-comment">/// Scratch for the controller, sized from `nv` - which now counts the crates too.</span>
    desired_acc: []f32,
    <span class="tok-comment">/// Which DOFs have a motor. The crates' free joints do not; see `ctl.Actuation`.</span>
    actuation: ctl.Actuation,
    <span class="tok-comment">/// Scratch for the IK solve, and the pose it produces.</span>
    ik_scratch: []Vec,
    ik_pose: []f32,
    <span class="tok-comment">/// Where the wrist is being asked to go, and whether IK is driving.</span>
    ik_goal: Vec,
    ik_on: bool,
    ik_reached: bool,
    ik_error: f32,
    <span class="tok-comment">/// Fastest crate this frame, and the largest ever seen. See the readout.</span>
    fastest_crate: f32,
    fastest_ever: f32,
    <span class="tok-comment">/// Crate mass in kg, live. See `applyCrateMass`.</span>
    crate_mass: f32,
    <span class="tok-comment">/// Per-joint torque ceiling in N*m, live. See `control`.</span>
    motor_limit: f32,
    <span class="tok-comment">/// What the sliders actually edit: base-10 exponents of the two above.</span>
    crate_mass_exp: f32,
    motor_limit_exp: f32,
    <span class="tok-comment">/// Closed-loop natural frequency squared, and twice the damping. In computed-torque</span>
    <span class="tok-comment">/// form these are PHYSICAL rather than tuned: `kp = omega^2` and `kv = 2 zeta omega` give a settling</span>
    <span class="tok-comment">/// response of omega rad/s at damping ratio zeta, identical on every joint.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// omega = 8 rad/s, critically damped. At `dt = 1/240` that is `kv*dt = 0.067`, two orders</span>
    <span class="tok-comment">/// of magnitude inside the explicit integrator's stability limit - where the naive</span>
    <span class="tok-comment">/// uniform-gain version sat at 11.4 and diverged.</span>
    kp: f32,
    kv: f32,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    <span class="tok-kw">var</span> vertices_loaded: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> meshes: [mesh_sources.len]z.Mesh = undefined;
    <span class="tok-kw">for</span> (mesh_sources, <span class="tok-num">0</span>..) |source, i| {
        <span class="tok-comment">// * The existing OBJ codec, unchanged. Nothing about loading a robot's geometry</span>
        <span class="tok-comment">// needed a new parser - the URDF points at `.obj`, and zimr has parsed those since</span>
        <span class="tok-comment">// long before robots existed.</span>
        meshes[i] = <span class="tok-kw">try</span> <span class="tok-fn">loadObjMesh</span>(gpa, source);
        vertices_loaded += <span class="tok-builtin">@intCast</span>(meshes[i].vertexCount);
        <span class="tok-comment">// No `uploadMesh` call: it is a raylib-parity no-op, and `drawMeshInstanced` uploads</span>
        <span class="tok-comment">// on first use keyed by the mesh pointer. Calling it looked like the upload step and</span>
        <span class="tok-comment">// was not one.</span>
    }

    <span class="tok-comment">// -- THE WORLD --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Built before the arm's model only because `initState` assigns the whole struct at</span>
    <span class="tok-comment">// once; nothing here depends on the arm.</span>
    s.* = .{
        .gpa = gpa,
        <span class="tok-comment">// * ONE MODEL for the arm and the crates. `kuka.spec` is the generated ModelSpec;</span>
        <span class="tok-comment">// `Scene` appends the crates as free-jointed bodies and builds the lot. Robot 0</span>
        <span class="tok-comment">// keeps its body indices, so `kuka.Model.Joint.*` still names the right joints.</span>
        .model = <span class="tok-kw">try</span> (scene_mod.Scene{
            .robots = &amp;.{kuka.spec},
            .free_bodies = &amp;<span class="tok-fn">sceneCrates</span>(),
            .options = .{ .timestep = timestep, .max_contacts = <span class="tok-num">64</span> },
        }).<span class="tok-fn">build</span>(gpa),
        .data = undefined,
        .font = font,
        .meshes = meshes,
        .crate_mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">2.0</span> * crate_half, <span class="tok-num">2.0</span> * crate_half, <span class="tok-num">2.0</span> * crate_half),
        .transform = .{zm.<span class="tok-fn">identity</span>()},
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .show_frames = false,
        .show_meshes = true,
        .mesh_vertices = vertices_loaded,
        <span class="tok-comment">// The iiwa is about 1.3 m tall; frame it from a little above and back.</span>
        .cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>), <span class="tok-num">2.6</span>),
        .world = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, <span class="tok-num">32</span>),
        .bridge = undefined, <span class="tok-comment">// needs the arm's kinematics; see below</span>
        .peak_force = <span class="tok-num">0</span>,
        .physics_on = true,
        .accumulator = <span class="tok-num">0</span>,
        .pose = <span class="tok-num">4</span>, <span class="tok-comment">// "wind up", so the first thing pressed can be "sweep"</span>
        .commanded = poses[<span class="tok-num">4</span>].angles,
        .desired_acc = &amp;.{}, <span class="tok-comment">// sized from `nv` once the model exists</span>
        .actuation = undefined, <span class="tok-comment">// needs the model; built below</span>
        .ik_scratch = &amp;.{},
        .ik_pose = &amp;.{},
        <span class="tok-comment">// Out in front of the arm, at about elbow height - inside the workspace so the first</span>
        <span class="tok-comment">// frame shows IK working rather than straining.</span>
        .ik_goal = <span class="tok-fn">vec</span>(<span class="tok-num">0.45</span>, <span class="tok-num">0.55</span>, <span class="tok-num">0.15</span>),
        .ik_on = false,
        .ik_reached = false,
        .ik_error = <span class="tok-num">0</span>,
        .fastest_crate = <span class="tok-num">0</span>,
        .fastest_ever = <span class="tok-num">0</span>,
        .crate_mass = crate_mass_default,
        .motor_limit = motor_limit_default,
        .crate_mass_exp = <span class="tok-fn">log10</span>(crate_mass_default),
        .motor_limit_exp = <span class="tok-fn">log10</span>(motor_limit_default),

        .kp = <span class="tok-num">64</span>, <span class="tok-comment">// omega^2 for omega = 8 rad/s</span>
        .kv = <span class="tok-num">16</span>, <span class="tok-comment">// 2 zeta omega for zeta = 1</span>
    };
    s.model.opt.timestep = timestep;
    s.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;s.model);
    s.desired_acc = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.model.nv);
    s.actuation = <span class="tok-kw">try</span> ctl.Actuation.<span class="tok-fn">init</span>(gpa, &amp;s.model);
    s.ik_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, ctl.Ik.<span class="tok-fn">scratchSize</span>(&amp;s.model));
    s.ik_pose = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.model.nq);
    <span class="tok-comment">// Start at the commanded pose so the first frame is not a lunge.</span>
    <span class="tok-kw">for</span> (poses[s.pose].angles, <span class="tok-num">0</span>..) |angle, i| {
        s.data.pos[i] = angle;
    }

    <span class="tok-comment">// -- THE WORLD, BUILT THROUGH `s.world` --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * NOT built on a local and copied in. `zp.World` owns arrays that other parts of the</span>
    <span class="tok-comment">// engine reference by address, so a world constructed locally and then MOVED into the</span>
    <span class="tok-comment">// state struct leaves the bodies created against the original - and the arm then swept</span>
    <span class="tok-comment">// through the crates reporting zero contacts, with everything else about the setup</span>
    <span class="tok-comment">// correct. Nothing crashes; the collisions simply never happen.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `robot_contact` had this right and this file did not, which is what made the</span>
    <span class="tok-comment">// difference findable: two demos with the same seam, one working.</span>
    s.world.gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">9.81</span>, <span class="tok-num">0</span>);

    <span class="tok-comment">// The floor. STATIC - and it only collides with the arm because the robot proxies set</span>
    <span class="tok-comment">// `report_immovable_contacts`. Without that flag zimrphysics drops any pair where</span>
    <span class="tok-comment">// neither body can respond (kinematic vs static), and the arm would sweep through the</span>
    <span class="tok-comment">// floor as if it were not there.</span>
    <span class="tok-kw">const</span> floor_shape: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        <span class="tok-comment">// * HALF A METRE THICK, not a sheet.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// At 0.05 the crates TUNNELLED THROUGH: struck by the arm they crossed the whole</span>
        <span class="tok-comment">// slab inside one 1/240 s step, missed it entirely, and free-fell to y = -100 m.</span>
        <span class="tok-comment">// Measured, after the tower alone was shown to be perfectly stable - which is what</span>
        <span class="tok-comment">// narrowed it from "the stack explodes" to "the floor is too thin to catch a fast</span>
        <span class="tok-comment">// body".</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Half a metre of solid is what a floor actually is, and it is free: a static box</span>
        <span class="tok-comment">// is one broad-phase entry whatever its size.</span>
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">3</span>, <span class="tok-num">0.5</span>, <span class="tok-num">3</span>), .convex_radius = <span class="tok-num">0.01</span> },
    });
    _ = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{
        .shape = floor_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.5</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
    });

    rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;s.data);

    <span class="tok-comment">// * THE BRIDGE IS BUILT LAST, and the order is load-bearing: it snapshots where each of</span>
    <span class="tok-comment">// the arm's collision hulls currently IS, so the arm's kinematics must have run first.</span>
    <span class="tok-comment">// Built earlier, every proxy would be born at the origin and the first world step would</span>
    <span class="tok-comment">// see a spurious sweep from there to the arm's real pose - eight hulls scything through</span>
    <span class="tok-comment">// the scene on frame one.</span>
    s.bridge = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, &amp;s.world, &amp;s.model, &amp;s.data, <span class="tok-num">32</span>);
    s.bridge.<span class="tok-fn">listen</span>(&amp;s.world);
}

<span class="tok-comment">/// Turn an OBJ into the `Mesh` the renderer wants.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// A shim rather than a parser: `codecs.obj` does the reading and hands back a de-indexed</span>
<span class="tok-comment">/// CPU mesh, and this only rearranges it into the renderer's C-compatible layout. The one</span>
<span class="tok-comment">/// substantive conversion is 32-bit indices down to 16, which is what `types.Mesh` carries -</span>
<span class="tok-comment">/// asserted rather than truncated, because a mesh silently losing its high indices renders</span>
<span class="tok-comment">/// as an unrecognisable tangle and looks like a broken loader.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">loadObjMesh</span>(gpa: Allocator, source: []<span class="tok-kw">const</span> u8) !z.Mesh {
    <span class="tok-kw">const</span> parsed: z.codecs.obj.Data = <span class="tok-kw">try</span> z.codecs.obj.<span class="tok-fn">parse</span>(gpa, source);
    <span class="tok-kw">defer</span> parsed.<span class="tok-fn">deinit</span>(gpa);
    <span class="tok-kw">const</span> cpu: z.codecs.obj.Mesh = <span class="tok-kw">try</span> parsed.<span class="tok-fn">toMesh</span>(gpa);
    <span class="tok-kw">defer</span> cpu.<span class="tok-fn">deinit</span>(gpa);

    <span class="tok-kw">const</span> vertex_count: usize = cpu.<span class="tok-fn">vertexCount</span>();
    zm.<span class="tok-fn">assertf</span>(
        vertex_count &lt;= <span class="tok-num">65535</span>,
        <span class="tok-builtin">@src</span>(),
        <span class="tok-str">"mesh has {d} vertices, more than 16-bit indices can address"</span>,
        .{vertex_count},
    );

    <span class="tok-comment">// The renderer owns these for the life of the mesh; `unloadMesh` frees them.</span>
    <span class="tok-kw">const</span> vertices: []f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">dupe</span>(f32, cpu.positions);
    <span class="tok-kw">const</span> normals: []f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">dupe</span>(f32, cpu.normals);
    <span class="tok-kw">const</span> indices: []u16 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u16, cpu.indices.len);
    <span class="tok-kw">for</span> (cpu.indices, <span class="tok-num">0</span>..) |index, k| {
        indices[k] = <span class="tok-builtin">@intCast</span>(index);
    }

    <span class="tok-kw">return</span> .{
        .vertexCount = <span class="tok-builtin">@intCast</span>(vertex_count),
        .triangleCount = <span class="tok-builtin">@intCast</span>(cpu.indices.len / <span class="tok-num">3</span>),
        .vertices = vertices.ptr,
        .normals = <span class="tok-kw">if</span> (cpu.had_normals) normals.ptr <span class="tok-kw">else</span> null,
        .indices = indices.ptr,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    gpa.<span class="tok-fn">free</span>(s.ik_pose);
    gpa.<span class="tok-fn">free</span>(s.ik_scratch);
    s.actuation.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.desired_acc);
    s.bridge.<span class="tok-fn">deinit</span>(&amp;s.world);
    s.world.<span class="tok-fn">deinit</span>(gpa);
    s.ui_host.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">for</span> (&amp;s.meshes) |*mesh| {
        z.<span class="tok-fn">unloadMesh</span>(gpa, mesh.*);
    }
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.crate_mesh);
    s.data.<span class="tok-fn">deinit</span>();
    s.model.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-comment">/// COMPUTED-TORQUE CONTROL: the textbook robot controller, and the one this arm needs.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- WHY THE OBVIOUS VERSION DOES NOT WORK --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The first version of this was a plain PD with one gain pair for all seven joints:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///     tau = c + kp*(q* - q) - kv*q_dot</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// It exploded on the first pose change. The reason is worth keeping, because it is a</span>
<span class="tok-comment">/// property of robot arms rather than a coding slip: **this arm's joint inertias span a</span>
<span class="tok-comment">/// factor of 300** - 3.43 kg*m^2 at the shoulder, 0.011 at the wrist. A damping gain that is</span>
<span class="tok-comment">/// gentle on the shoulder is violent on the wrist. Explicit integration needs roughly</span>
<span class="tok-comment">/// `kv*dt/M_ii &lt; 2`; with `kv = 30` and `dt = 1/240` the wrist sat at **11.4**, and diverged</span>
<span class="tok-comment">/// in a handful of steps.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- THE FIX, WHICH IS ALSO THE STANDARD ANSWER --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Ask for an ACCELERATION and let the mass matrix convert it to torque:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///     a* = kp*(q* - q) - kv*q_dot          the motion we want, in acceleration</span>
<span class="tok-comment">///     * tau  = M(q)*a* + c                 what it costs, given the arm's real inertia</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Substituting into `M q_ddot + c = tau` gives `q_ddot = a*` exactly - the closed loop becomes a</span>
<span class="tok-comment">/// linear, decoupled second-order system with the SAME response on every joint, whatever</span>
<span class="tok-comment">/// the configuration. The 300x inertia spread disappears because `M` is precisely the thing</span>
<span class="tok-comment">/// that accounts for it, and the gains become physical: `kp = omega^2`, `kv = 2 zeta omega` for a</span>
<span class="tok-comment">/// natural frequency omega and damping ratio zeta.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// It costs one `mulM` - a sparse multiply the engine already has because inverse dynamics</span>
<span class="tok-comment">/// needed it - plus `bias_force`, which IS the torque that holds the arm still, so gravity</span>
<span class="tok-comment">/// is cancelled exactly rather than fought.</span>
<span class="tok-comment">/// Slide the commanded pose toward the selected one at a bounded rate.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// 1.4 rad/s is about what a mid-size industrial arm's joints actually do. The point is not</span>
<span class="tok-comment">/// realism for its own sake: an unbounded step command makes the arm arrive at a contact</span>
<span class="tok-comment">/// with a speed no motor could produce, and with section 4h's one-way coupling nothing slows it</span>
<span class="tok-comment">/// down - the crates then leave at a speed that says more about the setup than the physics.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">advanceTrajectory</span>(s: *State, dt: f32) void {
    <span class="tok-kw">const</span> max_rate: f32 = <span class="tok-num">1.4</span>; <span class="tok-comment">// rad/s</span>
    <span class="tok-kw">const</span> step: f32 = max_rate * dt;
    <span class="tok-kw">const</span> target: [<span class="tok-num">7</span>]f32 = poses[s.pose].angles;
    <span class="tok-kw">for</span> (&amp;s.commanded, target) |*commanded, want| {
        <span class="tok-kw">const</span> delta: f32 = want - commanded.*;
        commanded.* += <span class="tok-fn">clamp</span>(delta, -step, step);
    }
}

<span class="tok-comment">/// Ask IK where the arm should be, and make that the pose the controller holds.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** THE SOLVE RUNS ON A COPY, and that is the whole design --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `Ik.solve` writes joint angles directly into a `Data` - it IS the answer. Running it on the</span>
<span class="tok-comment">/// LIVE data would teleport the arm to the solution every frame: no dynamics, no contact, no</span>
<span class="tok-comment">/// crates being pushed, just a shape snapping between poses. The robot would look like it was</span>
<span class="tok-comment">/// working and would be doing nothing.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// So the solve runs on `s.data`'s positions saved and restored around it, and its output</span>
<span class="tok-comment">/// becomes a TARGET for `PoseHold`. The arm then travels there under its own torque limits,</span>
<span class="tok-comment">/// hits things on the way, and can fail to arrive - which is what makes it a robot rather than</span>
<span class="tok-comment">/// an animation.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">solveIk</span>(s: *State) void {
    <span class="tok-kw">const</span> wrist: u32 = <span class="tok-builtin">@intCast</span>(kuka.spec.bodies.len); <span class="tok-comment">// last link of the arm</span>
    <span class="tok-comment">// Save the live pose; the solve is destructive.</span>
    <span class="tok-builtin">@memcpy</span>(s.ik_pose, s.data.pos);

    <span class="tok-kw">const</span> result: ctl.Ik.Result = (ctl.Ik{ .max_iterations = <span class="tok-num">12</span> }).<span class="tok-fn">solve</span>(
        &amp;s.model,
        &amp;s.data,
        s.actuation,
        .{ .body = wrist, .goal = s.ik_goal },
        s.ik_scratch,
    );
    s.ik_reached = result.reached;
    s.ik_error = result.error_distance;

    <span class="tok-comment">// The solved ARM angles become the commanded pose; everything else - the crates' free</span>
    <span class="tok-comment">// joints - is restored, because IK has no business moving them.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">7</span>) |i| {
        s.commanded[i] = s.data.pos[i];
    }
    <span class="tok-builtin">@memcpy</span>(s.data.pos, s.ik_pose);
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;s.data);
}

<span class="tok-kw">fn</span> <span class="tok-fn">control</span>(s: *State) void {
    <span class="tok-comment">// ** THE CONTROLLER ACTS ON THE ARM'S DOFs ONLY, and both halves of that matter.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Once the crates joined the tree `nv` went from 7 to 37 - seven arm joints plus six per</span>
    <span class="tok-comment">// crate. Two things broke.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// **The buffers.** `mulM` wants `nv`-vectors, and a `[7]f32` written up to `nv` is a</span>
    <span class="tok-comment">// buffer overrun. The engine caught the size mismatch (`mulM wants 37-vectors`) and</span>
    <span class="tok-comment">// `factorM` then reported NaN pivots - the corruption surfacing one pass later.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// *** AND THE CRATES MUST NOT BE HELD UP.** `bias_force` is the torque needed to keep</span>
    <span class="tok-comment">// every DOF still, INCLUDING gravity on the crates. Adding it across all of `nv` would</span>
    <span class="tok-comment">// cancel their weight and leave five boxes hanging in the air. Gravity compensation is</span>
    <span class="tok-comment">// something a MOTOR does, and crates have no motors.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The arm's rows are unaffected by the crates: free bodies are separate roots, so the</span>
    <span class="tok-comment">// mass matrix has no coupling between them and the arm, and `M*a*` restricted to the arm</span>
    <span class="tok-comment">// rows is exactly the arm's own mass matrix times its own desired acceleration.</span>
    <span class="tok-kw">const</span> arm_dofs: usize = <span class="tok-num">7</span>;
    <span class="tok-builtin">@memset</span>(s.desired_acc, <span class="tok-num">0</span>);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..arm_dofs) |i| {
        s.desired_acc[i] = s.kp * (s.commanded[i] - s.data.pos[i]) - s.kv * s.data.vel[i];
    }
    rbt.<span class="tok-fn">mulM</span>(&amp;s.model, &amp;s.data, s.desired_acc, s.data.applied_force);

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.model.nv) |i| {
        <span class="tok-kw">if</span> (i &lt; arm_dofs) {
            <span class="tok-comment">// * GRAVITY COMPENSATION FIRST, THEN CLAMP THE TOTAL. A motor's rating bounds</span>
            <span class="tok-comment">// everything it does, including holding itself up - clamping only the tracking</span>
            <span class="tok-comment">// part would let a weak arm cheat by treating its own weight as free.</span>
            <span class="tok-kw">const</span> wanted: f32 = s.data.applied_force[i] + s.data.bias_force[i];
            s.data.applied_force[i] = <span class="tok-fn">clamp</span>(wanted, -s.motor_limit, s.motor_limit);
        } <span class="tok-kw">else</span> {
            s.data.applied_force[i] = <span class="tok-num">0</span>;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;

    <span class="tok-comment">// -- ** IK RUNS ONCE PER FRAME, NOT ONCE PER PHYSICS SUBSTEP --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// It is a PLANNING step, not a physics one: it answers "where should the arm be aiming",</span>
    <span class="tok-comment">// and that answer only changes when the goal moves - at frame rate, when a slider is</span>
    <span class="tok-comment">// dragged. Solving it inside the fixed-timestep loop recomputed the same answer for every</span>
    <span class="tok-comment">// substep, and the cost multiplied by however many substeps the accumulator owed.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Worse, it fed back: a slow frame means a larger `delta_time`, which means more substeps,</span>
    <span class="tok-comment">// which means more IK, which means a slower frame. The clamp on `delta_time` is the only</span>
    <span class="tok-comment">// thing that bounded it. Reported from the device as "bad framerate when the IK target is</span>
    <span class="tok-comment">// unreachable" - unreachable is exactly when the solve stops converging early and spends</span>
    <span class="tok-comment">// its whole iteration budget.</span>
    <span class="tok-kw">if</span> (s.ik_on) {
        <span class="tok-fn">solveIk</span>(s);
    }

    s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
    <span class="tok-kw">while</span> (s.accumulator &gt;= timestep) : (s.accumulator -= timestep) {
        <span class="tok-comment">// ** ONE STEP OF TWO ENGINES - AND KINEMATICS COME FIRST.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">//   1. forward: where is everything RIGHT NOW</span>
        <span class="tok-comment">//   2. steer the proxies to exactly that</span>
        <span class="tok-comment">//   3. step the world, so its detector tests the current pose</span>
        <span class="tok-comment">//   4. harvest the contacts as `robot.Contact` inputs</span>
        <span class="tok-comment">//   5. decide torques, knowing what is touching</span>
        <span class="tok-comment">//   6. step</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * `forward` USED TO COME AFTER `sync`, and that was a full step of positional lag:</span>
        <span class="tok-comment">// the proxies were steered from `body_xpos` computed BEFORE the previous</span>
        <span class="tok-comment">// integration, so the collision detector was always testing where the bodies had</span>
        <span class="tok-comment">// been, not where they were.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// MuJoCo has no such gap - `mj_forward` runs kinematics, then collision, then the</span>
        <span class="tok-comment">// constraint solve, all at the same `q`. For a body resting flat the lag is</span>
        <span class="tok-comment">// invisible; for one balanced on a corner it is the difference between a contact</span>
        <span class="tok-comment">// that holds and one that is computed for a pose the body has already left.</span>
        <span class="tok-comment">// * IK REPLACES THE POSE RAMP RATHER THAN FIGHTING IT. Both write `s.commanded`, so</span>
        <span class="tok-comment">// only one may drive at a time - running the trajectory ramp underneath a live IK</span>
        <span class="tok-comment">// solve would have the two overwrite each other every frame and produce a visible</span>
        <span class="tok-comment">// stutter with no obvious cause.</span>
        <span class="tok-kw">if</span> (!s.ik_on) {
            <span class="tok-fn">advanceTrajectory</span>(s, timestep);
        }
        rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;s.data);
        <span class="tok-kw">if</span> (s.physics_on) {
            s.bridge.<span class="tok-fn">sync</span>(&amp;s.world, &amp;s.model, &amp;s.data) <span class="tok-kw">catch</span> |err| {
                zm.<span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"proxy sync failed: {t}"</span>, .{err});
            };
            zp.<span class="tok-fn">step</span>(&amp;s.world, timestep) <span class="tok-kw">catch</span> |err| {
                zm.<span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"world step failed: {t}"</span>, .{err});
            };
            s.bridge.<span class="tok-fn">harvest</span>(&amp;s.data);
        } <span class="tok-kw">else</span> {
            <span class="tok-comment">// ** TURNING PHYSICS OFF MUST CLEAR THE CONTACTS, and forgetting to is how this</span>
            <span class="tok-comment">// demo produced `factorM: pivot 24 is nan`.</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// `harvest` is what refreshes `d.contacts` each step. Skipping it does not leave</span>
            <span class="tok-comment">// the robot contact-free - it leaves it enforcing the LAST set collected, frozen,</span>
            <span class="tok-comment">// while the arm goes on moving. Those contacts describe a pose that no longer</span>
            <span class="tok-comment">// exists, so their violations grow without bound, and a few hundred steps later</span>
            <span class="tok-comment">// the mass matrix has a NaN pivot and the assert fires.</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// The symptom named `factorM`, which is the first place a NaN becomes visible</span>
            <span class="tok-comment">// rather than where it came from.</span>
            s.data.<span class="tok-fn">clearContacts</span>();
            s.data.<span class="tok-fn">forgetWarmStart</span>();
        }
        <span class="tok-fn">control</span>(s);
        rbt.<span class="tok-fn">step</span>(&amp;s.model, &amp;s.data);
    }
    rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;s.data);

    <span class="tok-comment">// Track the load the ARM is carrying, summed over its solver's rows, with a peak held</span>
    <span class="tok-comment">// so a brief tap leaves something to read - a contact at 240 Hz is otherwise gone</span>
    <span class="tok-comment">// before an eye can catch it.</span>
    <span class="tok-comment">// Fastest crate, from the tree's own velocities - six DOFs per crate, translation first.</span>
    s.fastest_crate = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..crate_count) |i| {
        <span class="tok-kw">const</span> body: u32 = <span class="tok-fn">crateBody</span>(i);
        <span class="tok-kw">const</span> v: u32 = s.model.jnt_dof_adr[s.model.body_jnt_adr[body]];
        <span class="tok-kw">const</span> speed: f32 = <span class="tok-fn">length3</span>(<span class="tok-fn">vec</span>(s.data.vel[v], s.data.vel[v + <span class="tok-num">1</span>], s.data.vel[v + <span class="tok-num">2</span>]));
        s.fastest_crate = <span class="tok-builtin">@max</span>(s.fastest_crate, speed);
    }
    s.fastest_ever = <span class="tok-builtin">@max</span>(s.fastest_ever, s.fastest_crate);

    <span class="tok-kw">var</span> contact_force: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.constraint_count) |row| {
        contact_force += s.data.constraint_force[row];
    }
    s.peak_force = <span class="tok-builtin">@max</span>(s.peak_force, contact_force);

    <span class="tok-comment">// * THE UI IS BUILT FIRST, BEFORE THE CAMERA READS THE MOUSE.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `wantCaptureMouse` hit-tests the pointer against the windows submitted THIS</span>
    <span class="tok-comment">// frame, so it can only answer correctly once they have been submitted. Building the</span>
    <span class="tok-comment">// panel after the camera meant a drag on a checkbox also spun the scene - the camera</span>
    <span class="tok-comment">// asked whether the UI wanted the mouse before the UI existed, and was told no.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Nothing is drawn out of order by this: `ui_host.render` is deferred to the end of</span>
    <span class="tok-comment">// the frame, so the panel still lands on top of the 3D scene.</span>
    <span class="tok-comment">// ---- UI ----</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * A REAL UI PANEL, not hand-drawn rectangles with hit tests.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The earlier version toggled the skeleton with the W key, which is unusable on a</span>
    <span class="tok-comment">// phone - where every one of these demos is actually looked at. Hand-rolled buttons</span>
    <span class="tok-comment">// also meant re-deriving hit testing, scaling and layout in each example, and getting</span>
    <span class="tok-comment">// the scaling subtly wrong at device resolution.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `zimr.ui` handles touch, scaling and layout, so a control is one call and works</span>
    <span class="tok-comment">// where the demo is used.</span>
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-comment">// * `initial_pos` / `initial_size` as WINDOW OPTIONS - the idiom nine of ten UI examples</span>
    <span class="tok-comment">// use, and none of them calls `setNextWindowSize`.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The difference matters: `setNextWindowSize` is the imperative override applied EVERY</span>
    <span class="tok-comment">// frame, so it fights the window's own layout; `initial_size` seeds the window once and</span>
    <span class="tok-comment">// then leaves it alone. Reaching for the override first is what produced a panel with a</span>
    <span class="tok-comment">// title bar and no content.</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"KUKA LBR iiwa, imported from URDF"</span>, .{
        .initial_pos = .{ <span class="tok-num">12</span>, <span class="tok-num">12</span> },
        .initial_size = .{ <span class="tok-num">360</span>, <span class="tok-num">300</span> },
    })) |window| {
        <span class="tok-kw">defer</span> window.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"{d} bodies   {d} DOF   {d:.1} kg"</span>, .{ s.model.nbody - <span class="tok-num">1</span>, s.model.nv, <span class="tok-fn">totalMass</span>(&amp;s.model) });

        <span class="tok-comment">// * The mesh readout. Zero here means the geometry did not load, which is a very</span>
        <span class="tok-comment">// different problem from the geometry not being drawn - and telling them apart from</span>
        <span class="tok-comment">// a screenshot is otherwise impossible.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{d} mesh vertices across {d} links"</span>, .{ s.mesh_vertices, s.meshes.len });

        <span class="tok-comment">// The joint name the generated enum makes safe to write. `lbr_iiwa_joint_4` is</span>
        <span class="tok-comment">// checked at compile time - the payoff for emitting Zig rather than parsing at</span>
        <span class="tok-comment">// runtime.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"elbow (joint_4) = {d:.3} rad"</span>, .{s.data.pos[<span class="tok-builtin">@backingInt</span>(kuka.Model.Joint.lbr_iiwa_joint_4)]});

        <span class="tok-comment">// * THE PANEL MUST FIT WITHOUT SCROLLING, on a phone, which is where these demos</span>
        <span class="tok-comment">// are actually looked at.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The previous version overflowed: the pose row ran off the right edge so "sweep" -</span>
        <span class="tok-comment">// the one button that makes the scene do anything - was unreachable, and the panel</span>
        <span class="tok-comment">// grew a scrollbar. A scrollable panel over a 3D scene is also the worst case for</span>
        <span class="tok-comment">// gesture ownership, since a drag inside it could plausibly mean either "scroll the</span>
        <span class="tok-comment">// list" or "orbit the camera". Making it fit removes the ambiguity rather than</span>
        <span class="tok-comment">// arbitrating it.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// So: no explanatory paragraph, short labels, and the poses wrapped two per row.</span>
        u.<span class="tok-fn">separator</span>();
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"meshes"</span>, &amp;s.show_meshes);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"frames"</span>, &amp;s.show_frames);

        u.<span class="tok-fn">text</span>(<span class="tok-str">"contacts {d}   rows {d}   peak {d:.0} N"</span>, .{
            s.data.contact_count,
            s.data.constraint_count,
            s.peak_force,
        });
        <span class="tok-comment">// * A DIAGNOSTIC THAT SEPARATES THE TWO WAYS THIS CAN BE BROKEN, because from a</span>
        <span class="tok-comment">// screenshot they look identical.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// `world` counts the bodies the physics engine actually holds: 1 floor + 5 crates +</span>
        <span class="tok-comment">// one kinematic proxy per collision hull. If the proxies are missing, the arm does</span>
        <span class="tok-comment">// not exist as far as the detector is concerned and nothing can ever touch it.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// `top y` is the highest crate's height. If the world is stepping, the stack settles</span>
        <span class="tok-comment">// a millimetre or two under gravity and this reads slightly below its start; if it</span>
        <span class="tok-comment">// is EXACTLY the start value the world is not stepping at all.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Two numbers, and between them "no contact" stops being one symptom and becomes</span>
        <span class="tok-comment">// three distinguishable causes.</span>
        <span class="tok-comment">// * FASTEST CRATE, WITH A PEAK HELD - the readout for the one open problem.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Measured headlessly after a hard sweep: a crate reaches 128 m/s. The solver</span>
        <span class="tok-comment">// converges in one iteration and peak force stays a sane 800 N, so this is not the</span>
        <span class="tok-comment">// old force explosion - it looks like a fast proxy sweeping THROUGH a crate within</span>
        <span class="tok-comment">// one step and the contact being resolved once, hard. Tunnelling, of exactly the</span>
        <span class="tok-comment">// kind speculative contacts exist to prevent.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// A live number rather than a note, because "the crates look fine" and "one crate</span>
        <span class="tok-comment">// left at 128 m/s two seconds ago" are indistinguishable by eye once it is gone.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"iters {d}   crate max {d:.1} m/s   peak {d:.1} m/s"</span>, .{
            s.data.solver_iterations,
            s.fastest_crate,
            s.fastest_ever,
        });

        <span class="tok-comment">// * PER-CRATE TILT AND CONTACT COUNT - the readout that settles what a crate resting</span>
        <span class="tok-comment">// on its corner actually is.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// A box tilted ~0.79 rad with ONE contact is impossible: a single point force cannot</span>
        <span class="tok-comment">// resist the gravity torque about that point, so it must tip. A box tilted with</span>
        <span class="tok-comment">// contacts against a NEIGHBOUR is an ordinary leaning pile and correct.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Headless runs settle every crate flat at 1 iteration, so whatever is happening on</span>
        <span class="tok-comment">// a device is not in the physics I can reproduce from here. Two numbers per crate</span>
        <span class="tok-comment">// turn "it looks wrong" into which of those two it is.</span>
        <span class="tok-kw">var</span> tilt_line: [<span class="tok-num">96</span>]u8 = undefined;
        <span class="tok-kw">var</span> used: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..crate_count) |i| {
            <span class="tok-kw">const</span> body: u32 = <span class="tok-fn">crateBody</span>(i);
            <span class="tok-kw">const</span> up: Vec = <span class="tok-fn">rotate</span>(s.data.body_xrot[body], <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
            <span class="tok-kw">const</span> tilt: f32 = <span class="tok-fn">acosRad</span>(<span class="tok-fn">clamp</span>(up[<span class="tok-num">1</span>], -<span class="tok-num">1</span>, <span class="tok-num">1</span>));
            <span class="tok-kw">var</span> touching: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.contact_count) |c| {
                <span class="tok-kw">const</span> contact: rbt.Contact = s.data.contacts[c];
                <span class="tok-kw">if</span> (contact.body_a == body <span class="tok-kw">or</span> contact.body_b == body) {
                    touching += <span class="tok-num">1</span>;
                }
            }
            <span class="tok-kw">const</span> written: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
                tilt_line[used..],
                <span class="tok-str">"{d:.1}/{d} "</span>,
                .{ tilt, touching },
            ) <span class="tok-kw">catch</span> <span class="tok-kw">break</span>;
            used += written.len;
        }
        u.<span class="tok-fn">text</span>(<span class="tok-str">"tilt/contacts: {s}"</span>, .{tilt_line[<span class="tok-num">0</span>..used]});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// -- * INVERSE KINEMATICS: point at a place, not at seven angles --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The pose buttons below command JOINT ANGLES, which is how a robot is actually</span>
        <span class="tok-comment">// driven and a hopeless way for a person to aim. IK inverts that: give it a point and</span>
        <span class="tok-comment">// it finds angles that put the wrist there - or the closest it can manage, which is</span>
        <span class="tok-comment">// the honest answer for a target outside the arm's reach.</span>
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"inverse kinematics"</span>, &amp;s.ik_on);
        <span class="tok-kw">if</span> (s.ik_on) {
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"goal x"</span>, &amp;s.ik_goal[<span class="tok-num">0</span>], .{ .min = -<span class="tok-num">0.8</span>, .max = <span class="tok-num">0.8</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"goal y"</span>, &amp;s.ik_goal[<span class="tok-num">1</span>], .{ .min = <span class="tok-num">0.05</span>, .max = <span class="tok-num">1.2</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"goal z"</span>, &amp;s.ik_goal[<span class="tok-num">2</span>], .{ .min = -<span class="tok-num">0.8</span>, .max = <span class="tok-num">0.8</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            <span class="tok-comment">// * THE ERROR IS SHOWN, ALWAYS. "Reached" and "as close as it can get" look</span>
            <span class="tok-comment">// identical from outside, and the difference is exactly what a caller needs: drag</span>
            <span class="tok-comment">// the goal past the arm's reach and watch it stop shrinking.</span>
            u.<span class="tok-fn">text</span>(<span class="tok-str">"   {s}   error {d:.4} m"</span>, .{
                <span class="tok-kw">if</span> (s.ik_reached) <span class="tok-str">"reached"</span> <span class="tok-kw">else</span> <span class="tok-str">"straining"</span>,
                s.ik_error,
            });
        }

        <span class="tok-comment">// -- * THE TWO NUMBERS THAT MAKE THE COUPLING VISIBLE --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Drag `crate kg` up and sweep: the arm stops being able to move the boxes, and its</span>
        <span class="tok-comment">// own pose starts lagging what it was told to hold. Drag `motor N*m` up and it wins</span>
        <span class="tok-comment">// again. Neither of those could happen before section 4k - the robot treated every external</span>
        <span class="tok-comment">// body as immovable, so across a 666x mass range its behaviour changed by under 1%.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * THE SLIDERS ARE LOGARITHMIC, mapped here rather than by the widget.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Both quantities span three decades and the interesting transition - "brushes it</span>
        <span class="tok-comment">// aside" to "cannot budge it" - is narrow and sits in the middle. A linear slider</span>
        <span class="tok-comment">// spends 90% of its travel above 30 kg where nothing further changes. `SliderOpts`</span>
        <span class="tok-comment">// has no log mode, so the exponent is what the widget edits and the value is derived.</span>
        <span class="tok-kw">if</span> (u.<span class="tok-fn">slider</span>(<span class="tok-str">"crate kg"</span>, &amp;s.crate_mass_exp, .{ .min = -<span class="tok-num">0.7</span>, .max = <span class="tok-num">2.5</span>, .fmt = <span class="tok-str">""</span> })) {
            s.crate_mass = <span class="tok-fn">pow</span>(<span class="tok-num">10.0</span>, s.crate_mass_exp);
            <span class="tok-fn">applyCrateMass</span>(s);
        }
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"motor N·m"</span>, &amp;s.motor_limit_exp, .{ .min = <span class="tok-num">0.5</span>, .max = <span class="tok-num">2.5</span>, .fmt = <span class="tok-str">""</span> });
        s.motor_limit = <span class="tok-fn">pow</span>(<span class="tok-num">10.0</span>, s.motor_limit_exp);
        u.<span class="tok-fn">text</span>(<span class="tok-str">"   {d:.1} kg each   {d:.0} N·m per joint"</span>, .{ s.crate_mass, s.motor_limit });
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"physics"</span>, &amp;s.physics_on);
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"restack"</span>, .{})) {
            <span class="tok-fn">resetCrate</span>(s);
        }

        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">for</span> (poses, <span class="tok-num">0</span>..) |pose, i| {
            <span class="tok-comment">// Two per row: five buttons in one row overflow any phone, and the row that</span>
            <span class="tok-comment">// overflows is the row with the interesting button on it.</span>
            <span class="tok-kw">if</span> (i % <span class="tok-num">2</span> != <span class="tok-num">0</span>) {
                u.<span class="tok-fn">sameLine</span>(.{});
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(pose.name, .{})) {
                s.pose = i;
            }
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, bg);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, u.<span class="tok-fn">wantCaptureMouse</span>(), .{
        .min_distance = <span class="tok-num">0.8</span>,
        .max_distance = <span class="tok-num">6.0</span>,
    });
    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    z.<span class="tok-fn">drawGrid</span>(gl, <span class="tok-num">12</span>, <span class="tok-num">0.25</span>);

    <span class="tok-comment">// ---- the arm ----</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * EACH MESH IS PLACED BY ITS BODY'S SIMULATED POSE, and that is the whole trick. The</span>
    <span class="tok-comment">// engine knows nothing about meshes; it produces a position and orientation per body,</span>
    <span class="tok-comment">// and the shape is a rigid decoration hanging off that frame. Nothing here knows the</span>
    <span class="tok-comment">// robot is a KUKA either - it walks whatever tree the model describes.</span>
    <span class="tok-kw">var</span> bi: u32 = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (bi &lt; s.model.nbody) : (bi += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> mesh_index: usize = bi - <span class="tok-num">1</span>;
        <span class="tok-kw">if</span> (s.show_meshes <span class="tok-kw">and</span> mesh_index &lt; s.meshes.len) {
            <span class="tok-kw">const</span> at: Vec = s.data.body_xpos[bi];
            s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
                zm.<span class="tok-fn">translation</span>(at[<span class="tok-num">0</span>], at[<span class="tok-num">1</span>], at[<span class="tok-num">2</span>]),
                zm.<span class="tok-fn">quatToMat</span>(s.data.body_xrot[bi]),
            );
            z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.meshes[mesh_index], &amp;s.transform, link_col);
        }
    }

    <span class="tok-comment">// The skeleton the meshes hang on. Available because it is the TRUTH - the simulation</span>
    <span class="tok-comment">// is these eight frames, and the meshes affect nothing.</span>
    <span class="tok-kw">if</span> (s.show_frames) {
        bi = <span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (bi &lt; s.model.nbody) : (bi += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> parent: u32 = s.model.body_parent[bi];
            z.<span class="tok-fn">drawLine3D</span>(gl, s.data.body_xpos[parent], s.data.body_xpos[bi], joint_col);
            z.<span class="tok-fn">drawSphere</span>(gl, s.data.body_xpos[bi], .{
                .radius = <span class="tok-num">0.03</span>,
                .rings = <span class="tok-num">8</span>,
                .slices = <span class="tok-num">12</span>,
                .color = joint_col,
            });
        }
        <span class="tok-kw">const</span> last: u32 = s.model.nbody - <span class="tok-num">1</span>;
        <span class="tok-kw">const</span> flange: Vec = s.data.body_xpos[last] +
            <span class="tok-fn">rotate</span>(s.data.body_xrot[last], <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0.08</span>));
        z.<span class="tok-fn">drawSphere</span>(gl, flange, .{ .radius = <span class="tok-num">0.025</span>, .rings = <span class="tok-num">8</span>, .slices = <span class="tok-num">12</span>, .color = tip_col });
    }

    <span class="tok-comment">// -- * THE IK GOAL, AND A LINE TO IT --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The line is the point of the drawing. A marker alone shows WHERE the target is; the line</span>
    <span class="tok-comment">// shows how far the arm is from it. Inside the workspace it shrinks to nothing; drag the</span>
    <span class="tok-comment">// goal beyond reach and it grows - the same information the panel's error readout gives,</span>
    <span class="tok-comment">// in the place the eye is already looking.</span>
    <span class="tok-kw">if</span> (s.ik_on) {
        <span class="tok-kw">const</span> arm_tip: u32 = <span class="tok-builtin">@intCast</span>(kuka.spec.bodies.len);
        z.<span class="tok-fn">drawSphere</span>(gl, s.ik_goal, .{
            .radius = <span class="tok-num">0.03</span>,
            .rings = <span class="tok-num">8</span>,
            .slices = <span class="tok-num">12</span>,
            .color = <span class="tok-kw">if</span> (s.ik_reached) goal_reached_col <span class="tok-kw">else</span> goal_straining_col,
        });
        z.<span class="tok-fn">drawLine3D</span>(gl, s.data.body_xpos[arm_tip], s.ik_goal, goal_straining_col);
    }
    <span class="tok-comment">// -- THE CRATE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Drawn from its ACTUAL simulated pose, so a tumble reads as a tumble. `drawCube` is</span>
    <span class="tok-comment">// axis-aligned and takes no rotation, so the eight corners are transformed by hand and</span>
    <span class="tok-comment">// joined - which also makes the rotation visible, where a fixed-orientation box would</span>
    <span class="tok-comment">// hide it and quietly suggest the crate only ever slides.</span>
    <span class="tok-comment">// -- THE CRATES --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Drawn SOLID, from each crate's actual simulated transform. `drawMeshInstanced` takes</span>
    <span class="tok-comment">// a full model matrix, so a crate that has been knocked over is drawn knocked over -</span>
    <span class="tok-comment">// where an axis-aligned `drawCube` would keep it bolt upright and hide the tumble.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..crate_count) |i| {
        <span class="tok-kw">const</span> body: u32 = <span class="tok-fn">crateBody</span>(i);
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
            zm.<span class="tok-fn">translation</span>(s.data.body_xpos[body][<span class="tok-num">0</span>], s.data.body_xpos[body][<span class="tok-num">1</span>], s.data.body_xpos[body][<span class="tok-num">2</span>]),
            zm.<span class="tok-fn">quatToMat</span>(s.data.body_xrot[body]),
        );
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.crate_mesh, &amp;s.transform, tip_col);
    }

    <span class="tok-comment">// Every contact the ARM is currently feeling, at the point it acts. These are the rows</span>
    <span class="tok-comment">// in the arm's own solver, not zimrphysics' - what is drawn is what the robot knows.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.contact_count) |ci| {
        <span class="tok-kw">const</span> contact: rbt.Contact = s.data.contacts[ci];
        <span class="tok-kw">if</span> (contact.distance &gt;= <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        z.<span class="tok-fn">drawSphere</span>(gl, contact.position, .{
            .radius = <span class="tok-num">0.02</span>,
            .rings = <span class="tok-num">6</span>,
            .slices = <span class="tok-num">10</span>,
            .color = joint_col,
        });
    }
    z.<span class="tok-fn">endMode3D</span>(gl);
}
