<span class="tok-comment">/// Put the crate back where it started, at rest.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Worth having as a button rather than a restart: the interesting thing about this scene is</span>
<span class="tok-comment">/// what happens when the arm meets the crate, and that is worth being able to repeat without</span>
<span class="tok-comment">/// losing the camera angle you found.</span>
<span class="tok-comment">/// Default crate mass, and the arm's default per-joint torque ceiling.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THE CEILING IS WHAT MAKES MASS MATTER, and without it the demo would show nothing.</span>
<span class="tok-comment">/// Computed torque asks the mass matrix for whatever acceleration it wants and gets it, so an</span>
<span class="tok-comment">/// unlimited arm pushes a 200 kg block exactly as easily as a 1 kg one. A real motor has a</span>
<span class="tok-comment">/// rating it cannot exceed to win an argument. 25 N*m is deliberately feeble for a KUKA -</span>
<span class="tok-comment">/// enough to hold itself up and shove a light box, not enough to move a heavy one.</span>
<span class="tok-kw">const</span> crate_mass_default: f32 = <span class="tok-num">0.8</span>;
<span class="tok-kw">const</span> motor_limit_default: f32 = <span class="tok-num">25.0</span>;

<span class="tok-comment">/// Push the slider's mass into the model, live.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * NO REBUILD NEEDED. `body_inertia` is read by `crb` every step to form the mass matrix,</span>
<span class="tok-comment">/// so scaling it here changes the physics from the next step on - the crate genuinely becomes</span>
<span class="tok-comment">/// heavier rather than being re-created heavier. Rotational inertia scales with mass for a</span>
<span class="tok-comment">/// box of fixed size, so the whole tensor takes the same factor.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">applyCrateMass</span>(s: *State) void {
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..crate_count) |i| {
        <span class="tok-kw">const</span> body: u32 = <span class="tok-fn">crateBody</span>(i);
        <span class="tok-comment">// ** A RATIO NEEDS ITS DENOMINATOR CHECKED, and this one reaches the mass matrix.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Scaling by `target / current` is the right operation - it keeps the inertia tensor</span>
        <span class="tok-comment">// consistent with the mass without re-deriving it - but a zero or non-finite `current`</span>
        <span class="tok-comment">// turns the factor into `inf`, and `0 * inf` is NaN. That NaN then propagates into</span>
        <span class="tok-comment">// `body_inertia`, into `M`, and surfaces as `factorM: pivot N is nan`, which names the</span>
        <span class="tok-comment">// place it became VISIBLE rather than where it came from.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// A device report of exactly that assert could not be reproduced here, so this is a</span>
        <span class="tok-comment">// guard rather than a fix: if the ratio is ever unusable, the mass is set directly and</span>
        <span class="tok-comment">// the model stays finite. Cheap, and it removes one candidate from the next hunt.</span>
        <span class="tok-kw">const</span> current: f32 = s.model.body_mass[body];
        <span class="tok-kw">const</span> scale: f32 = <span class="tok-kw">if</span> (current &gt; <span class="tok-num">1.0e-9</span>) s.crate_mass / current <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
        <span class="tok-kw">if</span> (scale == <span class="tok-num">0.0</span> <span class="tok-kw">or</span> !<span class="tok-fn">isFinite</span>(scale)) {
            std.log.<span class="tok-fn">warn</span>(<span class="tok-str">"crate {d}: mass {d} cannot be scaled to {d}; leaving it alone"</span>, .{
                i,
                current,
                s.crate_mass,
            });
            <span class="tok-kw">continue</span>;
        }
        s.model.body_mass[body] *= scale;
        s.model.body_inertia[body].mass *= scale;
        s.model.body_inertia[body].diag *= <span class="tok-fn">splat</span>(scale);
        s.model.body_inertia[body].off *= <span class="tok-fn">splat</span>(scale);
        s.model.body_inertia[body].h *= <span class="tok-fn">splat</span>(scale);
    }
    <span class="tok-comment">// ** AND THE SUBTREE MASSES, which are NOT recomputed each step. Miss this and the</span>
    <span class="tok-comment">// model is internally inconsistent - 100 kg bodies inside a subtree that still believes</span>
    <span class="tok-comment">// it weighs 0.8 - and the mass matrix is assembled from two different systems. It cost</span>
    <span class="tok-comment">// over a meganewton and a negative pivot to find. See `refreshSubtreeMass`.</span>
    rbt.<span class="tok-fn">refreshSubtreeMass</span>(&amp;s.model);

    <span class="tok-comment">// -- ** AND THE SCENE IS RE-POSED, which is not a cop-out but the honest operation --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Changing mass by 100x on bodies that are ACTIVELY IN CONTACT is violent. The stack is</span>
    <span class="tok-comment">// resting at an equilibrium penetration that matched the old weight; multiply the weight</span>
    <span class="tok-comment">// and every contact is suddenly wrong by that factor, all at once, while touching.</span>
    <span class="tok-comment">// Measured: peak row force **1.16 MN** and velocities past 1e24 - a numerical runaway,</span>
    <span class="tok-comment">// not physics.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Two things were tried and neither was enough on its own. Clearing the warm start helps</span>
    <span class="tok-comment">// - it holds forces computed for the old inertias, and seeding those into a system a</span>
    <span class="tok-comment">// hundred times heavier is an enormous impulse - but only halved the peak. Ramping the</span>
    <span class="tok-comment">// change over thirty frames did not help either; the contacts are wrong throughout the</span>
    <span class="tok-comment">// ramp rather than only at its end.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The fix is to stop pretending it is a small change. A body's mass is not a runtime</span>
    <span class="tok-comment">// knob in any physics engine; changing it is closer to rebuilding the scene. So the</span>
    <span class="tok-comment">// crates are put back at rest, which is also what a user dragging a mass slider</span>
    <span class="tok-comment">// expects - heavier boxes, freshly stacked.</span>
    <span class="tok-fn">resetCrate</span>(s);
    s.data.<span class="tok-fn">forgetWarmStart</span>();
}

<span class="tok-comment">/// Restack the crates by writing the TREE's own coordinates.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * A free body's state lives in `qpos` and `vel` like every other joint's - seven position</span>
<span class="tok-comment">/// coordinates (three for the translation, four for the quaternion) and six velocities. There</span>
<span class="tok-comment">/// is no separate rigid-body store to keep in step, which is one of the quieter benefits of</span>
<span class="tok-comment">/// the unified tree: resetting a crate is the same operation as resetting a joint angle.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">resetCrate</span>(s: *State) void {
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..crate_count) |i| {
        <span class="tok-kw">const</span> body: u32 = <span class="tok-fn">crateBody</span>(i);
        <span class="tok-kw">const</span> joint: u32 = s.model.body_jnt_adr[body];
        <span class="tok-kw">const</span> q: u32 = s.model.jnt_qpos_adr[joint];
        <span class="tok-kw">const</span> v: u32 = s.model.jnt_dof_adr[joint];
        <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">cratePosition</span>(i);
        s.data.pos[q + <span class="tok-num">0</span>] = at[<span class="tok-num">0</span>];
        s.data.pos[q + <span class="tok-num">1</span>] = at[<span class="tok-num">1</span>];
        s.data.pos[q + <span class="tok-num">2</span>] = at[<span class="tok-num">2</span>];
        <span class="tok-comment">// Identity quaternion, in the engine's (x, y, z, w) order.</span>
        s.data.pos[q + <span class="tok-num">3</span>] = <span class="tok-num">0</span>;
        s.data.pos[q + <span class="tok-num">4</span>] = <span class="tok-num">0</span>;
        s.data.pos[q + <span class="tok-num">5</span>] = <span class="tok-num">0</span>;
        s.data.pos[q + <span class="tok-num">6</span>] = <span class="tok-num">1</span>;
        <span class="tok-builtin">@memset</span>(s.data.vel[v..][<span class="tok-num">0</span>..<span class="tok-num">6</span>], <span class="tok-num">0</span>);
    }
    s.data.stage = .stale;
    s.peak_force = <span class="tok-num">0</span>;
}

<span class="tok-comment">/// Tree index of crate `i`. The arm's bodies come first and keep their numbering, so the</span>
<span class="tok-comment">/// crates follow - see `Scene.freeBodyIndex`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">crateBody</span>(i: usize) u32 {
    <span class="tok-kw">return</span> <span class="tok-builtin">@intCast</span>(<span class="tok-num">1</span> + kuka.spec.bodies.len + i);
}

<span class="tok-kw">fn</span> <span class="tok-fn">totalMass</span>(m: *<span class="tok-kw">const</span> rbt.Model) f32 {
    <span class="tok-kw">var</span> total: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..m.nbody) |bi| {
        total += m.body_mass[bi];
    }
    <span class="tok-kw">return</span> total;
}
