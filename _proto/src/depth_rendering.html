<h1>depth_rendering</h1>
<figure class="code src-file" data-path="examples/depth_rendering/depth_rendering.zig" data-lines="314"><figcaption><span>examples/depth_rendering/depth_rendering.zig</span><span>314 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/depth_rendering/depth_rendering.zig</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// shaders_depth_rendering (Route 1: depth-as-colour). Renders a</span>
<span class="tok-comment">// depth-tested 3D scene and writes each fragment's normalized device</span>
<span class="tok-comment">// depth straight into the colour buffer as grayscale (near = dark, far</span>
<span class="tok-comment">// = light). This is the per-PIXEL depth port (distinct from the</span>
<span class="tok-comment">// per-OBJECT `depth_cue` CPU tint): the depth comes out of the depth</span>
<span class="tok-comment">// shader's fragment stage.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Why this exists as a milestone: the `depth_vs` + `depth_fs` pair it</span>
<span class="tok-comment">// drives is the SAME "depth-in-red" primitive the shadow-map light</span>
<span class="tok-comment">// pass needs (pbr_fs.computeShadow samples exactly this value as</span>
<span class="tok-comment">// `closest_depth`). Proving it renders here de-risks the shadow pass.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Custom single-group pipeline (simpler than lambert_demo - no</span>
<span class="tok-comment">// samplers, no FS uniforms; the only binding is the VS's mvp UBO at</span>
<span class="tok-comment">// group 0). The WebGPU binding model is documented in src/zimr.zig.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// CANNOT be verified in the sandbox (no GPU); Simon verifies in the</span>
<span class="tok-comment">// browser. Build-side contract: compiles clean, embedded WGSL is</span>
<span class="tok-comment">// naga-valid (wgsl_strict), node link-check instantiates, lint 0.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> mulMatVec = zm.mulMatVec;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> rotationY = zm.rotationY;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Scene geometry: three unit cubes staggered in depth so the grayscale</span>
<span class="tok-comment">// gradient reads clearly (a nearer cube is visibly darker than a far one).</span>
<span class="tok-comment">// Positions are baked into ONE world-space vertex buffer and drawn in a</span>
<span class="tok-comment">// single call, so the shader needs only view-projection (no per-object</span>
<span class="tok-comment">// model uniform, which a single shared UBO could not express per draw).</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">const</span> DepthVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    position: [<span class="tok-num">3</span>]f32,
};

<span class="tok-kw">const</span> hs: f32 = <span class="tok-num">0.6</span>;

<span class="tok-comment">// 24 corners (4 per face) of a unit cube centred at the origin, CCW from</span>
<span class="tok-comment">// outside. Only position is needed - the depth shader reads location 0.</span>
<span class="tok-kw">const</span> cube_corners = [_][<span class="tok-num">3</span>]f32{
    <span class="tok-comment">// +Z</span>
    .{ -hs, -hs, hs },  .{ hs, -hs, hs },   .{ hs, hs, hs },   .{ -hs, hs, hs },
    <span class="tok-comment">// -Z</span>
    .{ hs, -hs, -hs },  .{ -hs, -hs, -hs }, .{ -hs, hs, -hs }, .{ hs, hs, -hs },
    <span class="tok-comment">// +X</span>
    .{ hs, -hs, hs },   .{ hs, -hs, -hs },  .{ hs, hs, -hs },  .{ hs, hs, hs },
    <span class="tok-comment">// -X</span>
    .{ -hs, -hs, -hs }, .{ -hs, -hs, hs },  .{ -hs, hs, hs },  .{ -hs, hs, -hs },
    <span class="tok-comment">// +Y</span>
    .{ -hs, hs, hs },   .{ hs, hs, hs },    .{ hs, hs, -hs },  .{ -hs, hs, -hs },
    <span class="tok-comment">// -Y</span>
    .{ -hs, -hs, -hs }, .{ hs, -hs, -hs },  .{ hs, -hs, hs },  .{ -hs, -hs, hs },
};

<span class="tok-kw">const</span> face_indices = [_]u16{
    <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span>, <span class="tok-comment">// +Z</span>
    <span class="tok-num">4</span>, <span class="tok-num">5</span>, <span class="tok-num">6</span>, <span class="tok-num">4</span>, <span class="tok-num">6</span>, <span class="tok-num">7</span>, <span class="tok-comment">// -Z</span>
    <span class="tok-num">8</span>, <span class="tok-num">9</span>, <span class="tok-num">10</span>, <span class="tok-num">8</span>, <span class="tok-num">10</span>, <span class="tok-num">11</span>, <span class="tok-comment">// +X</span>
    <span class="tok-num">12</span>, <span class="tok-num">13</span>, <span class="tok-num">14</span>, <span class="tok-num">12</span>, <span class="tok-num">14</span>, <span class="tok-num">15</span>, <span class="tok-comment">// -X</span>
    <span class="tok-num">16</span>, <span class="tok-num">17</span>, <span class="tok-num">18</span>, <span class="tok-num">16</span>, <span class="tok-num">18</span>, <span class="tok-num">19</span>, <span class="tok-comment">// +Y</span>
    <span class="tok-num">20</span>, <span class="tok-num">21</span>, <span class="tok-num">22</span>, <span class="tok-num">20</span>, <span class="tok-num">22</span>, <span class="tok-num">23</span>, <span class="tok-comment">// -Y</span>
};

<span class="tok-comment">// World placements: near-centre, far-left, far-right.</span>
<span class="tok-kw">const</span> cube_offsets = [_][<span class="tok-num">3</span>]f32{
    .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.0</span>, <span class="tok-num">1.6</span> },
    .{ -<span class="tok-num">1.7</span>, <span class="tok-num">0.0</span>, -<span class="tok-num">1.8</span> },
    .{ <span class="tok-num">1.7</span>, <span class="tok-num">0.0</span>, -<span class="tok-num">1.8</span> },
};

<span class="tok-kw">const</span> vertex_count: usize = cube_corners.len * cube_offsets.len;
<span class="tok-kw">const</span> index_count: usize = face_indices.len * cube_offsets.len;

<span class="tok-comment">// Host mirror of `depth_vs_io.Ubo` - must match byte-for-byte (96 bytes).</span>
<span class="tok-kw">const</span> DepthUbo = <span class="tok-kw">struct</span> {
    mvp: [<span class="tok-num">4</span>]Vec,
    params: Vec,
    mode: i32,
    pad0: i32 = <span class="tok-num">0</span>,
    pad1: i32 = <span class="tok-num">0</span>,
    pad2: i32 = <span class="tok-num">0</span>,
};
<span class="tok-kw">const</span> ubo_bytes: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(DepthUbo); <span class="tok-comment">// 96</span>

<span class="tok-kw">const</span> depth_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"depth_vs.wgsl"</span>);
<span class="tok-kw">const</span> depth_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"depth_fs.wgsl"</span>);

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Persistent state</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ubo_buffer: z.wgpu.BufferHandle,
    group0_bind_group: z.wgpu.BindGroupHandle,
    pipeline: z.wgpu.RenderPipelineHandle,
    pipeline_layout: z.wgpu.PipelineLayoutHandle,
    vs_module: z.wgpu.ShaderModuleHandle,
    fs_module: z.wgpu.ShaderModuleHandle,
    vertex_buffer: z.wgpu.BufferHandle,
    index_buffer: z.wgpu.BufferHandle,
};

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Init</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(
    gpa: Allocator,
    f: *z.Frame,
    s: *State,
) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> queue: z.wgpu.QueueHandle = f.gpu.queue;
    <span class="tok-kw">const</span> fmt: z.wgpu.TextureFormat = f.gpu.backbuffer_format;
    f.gpu.depth_format = .depth24_plus;

    <span class="tok-comment">// ---- Bake the three cubes into one world-space vertex + index buffer ----</span>
    <span class="tok-kw">var</span> verts: [vertex_count]DepthVertex = undefined;
    <span class="tok-kw">var</span> idxs: [index_count]u16 = undefined;
    <span class="tok-kw">var</span> vw: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> iw: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (cube_offsets) |off| {
        <span class="tok-kw">const</span> base: u16 = <span class="tok-builtin">@intCast</span>(vw);
        <span class="tok-kw">for</span> (cube_corners) |c| {
            verts[vw] = .{ .position = .{ c[<span class="tok-num">0</span>] + off[<span class="tok-num">0</span>], c[<span class="tok-num">1</span>] + off[<span class="tok-num">1</span>], c[<span class="tok-num">2</span>] + off[<span class="tok-num">2</span>] } };
            vw += <span class="tok-num">1</span>;
        }
        <span class="tok-kw">for</span> (face_indices) |fi| {
            idxs[iw] = base + fi;
            iw += <span class="tok-num">1</span>;
        }
    }

    <span class="tok-kw">const</span> vertex_buffer: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(verts)),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"depth_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(queue, vertex_buffer, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;verts));

    <span class="tok-kw">const</span> index_buffer: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(idxs)),
        .usage = .{ .index = true, .copy_dst = true },
        .label = <span class="tok-str">"depth_ibo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(queue, index_buffer, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;idxs));

    <span class="tok-comment">// ---- Vertex layout: position only (location 0). ----</span>
    <span class="tok-kw">const</span> depth_layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(DepthVertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
        },
    };

    <span class="tok-comment">// ---- group 0: the VS mvp UBO (single binding, vertex-visible). ----</span>
    <span class="tok-kw">const</span> ubo_buffer: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = ubo_bytes,
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-kw">const</span> g0_layout_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{
            .binding = <span class="tok-num">0</span>,
            .visibility = .{ .vertex = true },
            .resource = .{ .uniform_buffer = .{ .min_size = ubo_bytes } },
        },
    };
    <span class="tok-kw">const</span> g0_layout_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g0_layout_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g0_layout_blob);
    <span class="tok-kw">const</span> g0_bgl: z.wgpu.BindGroupLayoutHandle = z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g0_layout_blob, <span class="tok-str">"depth_g0"</span>);

    <span class="tok-kw">const</span> g0_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = ubo_buffer, .size = ubo_bytes } } },
    };
    <span class="tok-kw">const</span> g0_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;g0_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g0_blob);
    <span class="tok-kw">const</span> group0_bind_group: z.wgpu.BindGroupHandle = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, g0_bgl, g0_blob, <span class="tok-str">"depth_g0_bg"</span>);

    <span class="tok-comment">// ---- Pipeline layout: single bind group. ----</span>
    <span class="tok-kw">const</span> bgls: [<span class="tok-num">1</span>]z.wgpu.BindGroupLayoutHandle = .{g0_bgl};
    <span class="tok-kw">const</span> pipeline_layout: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(device, bgls[<span class="tok-num">0</span>..], <span class="tok-str">"depth_pl"</span>);

    <span class="tok-kw">const</span> vs_module: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, depth_vs_wgsl, <span class="tok-str">"depth_vs"</span>);
    <span class="tok-kw">const</span> fs_module: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, depth_fs_wgsl, <span class="tok-str">"depth_fs"</span>);

    <span class="tok-kw">const</span> state_combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .alpha,
        .less, <span class="tok-comment">// depth test LESS</span>
        .back, <span class="tok-comment">// cull back faces (CCW from outside)</span>
        fmt,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> pipe_desc = z.gpu.RenderPipelineDescriptor{
        .vertex_buffer_layouts = &amp;.{depth_layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = state_combo,
    };
    <span class="tok-kw">const</span> pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, pipe_desc);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pipe_blob);
    <span class="tok-kw">const</span> pipeline: z.wgpu.RenderPipelineHandle = z.wgpu.<span class="tok-fn">createRenderPipeline</span>(
        device,
        pipeline_layout,
        vs_module,
        fs_module,
        pipe_blob,
        <span class="tok-str">"depth_pipe"</span>,
    );

    s.* = .{
        .ubo_buffer = ubo_buffer,
        .group0_bind_group = group0_bind_group,
        .pipeline = pipeline,
        .pipeline_layout = pipeline_layout,
        .vs_module = vs_module,
        .fs_module = fs_module,
        .vertex_buffer = vertex_buffer,
        .index_buffer = index_buffer,
    };
}

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Frame</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gf: *z.GpuFrame = f.gpu;
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;

    <span class="tok-comment">// Slowly orbit the camera so the depth ordering of the cubes is legible.</span>
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> aspect: f32 = f.window.<span class="tok-fn">aspect</span>();
    <span class="tok-kw">const</span> eye_spin: Mat = <span class="tok-fn">rotationY</span>(t * <span class="tok-num">0.3</span>);
    <span class="tok-kw">const</span> eye0: Vec = .{ <span class="tok-num">0.0</span>, <span class="tok-num">2.2</span>, <span class="tok-num">5.2</span>, <span class="tok-num">1.0</span> };
    <span class="tok-kw">const</span> eye4: Vec = <span class="tok-fn">mulMatVec</span>(eye_spin, eye0);

    <span class="tok-kw">const</span> view: Mat = <span class="tok-fn">lookAtRh</span>(
        <span class="tok-fn">vec</span>(eye4[<span class="tok-num">0</span>], eye4[<span class="tok-num">1</span>], eye4[<span class="tok-num">2</span>]),
        <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
    );
    <span class="tok-kw">const</span> cam_near: f32 = <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> cam_far: f32 = <span class="tok-num">20.0</span>;
    <span class="tok-kw">const</span> proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(<span class="tok-num">0.9</span>, aspect, cam_near, cam_far);
    <span class="tok-kw">const</span> mvp: Mat = <span class="tok-fn">mulMat</span>(proj, view);

    <span class="tok-comment">// mode 1 = linearized/normalized viz. The viz window [3.5, 8.5]</span>
    <span class="tok-comment">// tightly brackets the cubes' view-space distances so the grayscale</span>
    <span class="tok-comment">// gradient uses the full range (near cube dark, far cubes light).</span>
    <span class="tok-kw">const</span> ubo: DepthUbo = .{
        .mvp = mvp,
        .params = .{ cam_near, cam_far, <span class="tok-num">3.0</span>, <span class="tok-num">11.0</span> },
        .mode = <span class="tok-num">1</span>,
    };
    <span class="tok-kw">const</span> ubo_bytes_buf: [z.shader.<span class="tok-fn">wireSizeOf</span>(DepthUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(DepthUbo, &amp;ubo);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(gf.queue, s.ubo_buffer, <span class="tok-num">0</span>, &amp;ubo_bytes_buf);

    <span class="tok-kw">const</span> fctx = Backend.<span class="tok-fn">beginFrame</span>(gf);
    <span class="tok-kw">var</span> ps = Backend.<span class="tok-fn">beginRenderPass</span>(fctx.encoder, .{
        .color_view = fctx.surface_view,
        .clear = .{ .r = <span class="tok-num">1.0</span>, .g = <span class="tok-num">1.0</span>, .b = <span class="tok-num">1.0</span>, .a = <span class="tok-num">1.0</span> },
        .depth_view = fctx.depth_view,
    });
    ps.queue = gf.queue;

    Backend.<span class="tok-fn">setPipeline</span>(&amp;ps, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(&amp;ps, <span class="tok-num">0</span>, s.group0_bind_group);

    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(ps.pass, .{
        .slot = <span class="tok-num">0</span>,
        .buffer = s.vertex_buffer,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-builtin">@sizeOf</span>([vertex_count]DepthVertex),
    });
    z.render_pass.<span class="tok-fn">setIndexBuffer</span>(ps.pass, .{
        .buffer = s.index_buffer,
        .format = .uint16,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-builtin">@sizeOf</span>([index_count]u16),
    });
    z.render_pass.<span class="tok-fn">drawIndexed</span>(ps.pass, .{
        .index_count = index_count,
        .instance_count = <span class="tok-num">1</span>,
        .first_index = <span class="tok-num">0</span>,
        .base_vertex = <span class="tok-num">0</span>,
        .first_instance = <span class="tok-num">0</span>,
    });

    Backend.<span class="tok-fn">endRenderPass</span>(&amp;ps);
    Backend.<span class="tok-fn">endFrame</span>(gf);
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">main</span>() !void {
    <span class="tok-kw">try</span> zimr_app.<span class="tok-fn">run</span>(.{
        .window = .{ .title = <span class="tok-str">"zimr - WebGPU - depth rendering"</span>, .width = <span class="tok-num">800</span>, .height = <span class="tok-num">600</span> },
    }, State, initState, update);
}
