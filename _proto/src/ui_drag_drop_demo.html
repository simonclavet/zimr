<h1>ui_drag_drop_demo</h1>
<figure class="code src-file" data-path="examples/ui_drag_drop_demo/ui_drag_drop_demo.zig" data-lines="222"><figcaption><span>examples/ui_drag_drop_demo/ui_drag_drop_demo.zig</span><span>222 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_drag_drop_demo.zig - Phase 2b drag-drop capstone.</span>
<span class="tok-comment">// Source + target wired together.  Five named lanes ("backlog",</span>
<span class="tok-comment">// "queued", "running", "passed", "failed") each containing a</span>
<span class="tok-comment">// list of build chips.  Drag any chip from one lane to another</span>
<span class="tok-comment">// to move it.  Builds the full picture of imgui-style drag-drop</span>
<span class="tok-comment">// in zimr.</span>
<span class="tok-comment">// What to look at:</span>
<span class="tok-comment">// - Click + drag any chip -&gt; preview tooltip follows cursor.</span>
<span class="tok-comment">// - Hover another lane -&gt; outline ring lights up on the lane.</span>
<span class="tok-comment">// - Release over a lane -&gt; build moves there.</span>
<span class="tok-comment">// - Release outside any lane -&gt; no move, drag is cancelled.</span>
<span class="tok-comment">// - Status counts at the bottom update live.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> screen_w: i32 = <span class="tok-num">1080</span>;
<span class="tok-kw">const</span> screen_h: i32 = <span class="tok-num">680</span>;

<span class="tok-kw">const</span> Lane = <span class="tok-kw">enum</span> {
    backlog,
    queued,
    running,
    passed,
    failed,

    <span class="tok-kw">fn</span> <span class="tok-fn">label</span>(self: Lane) []<span class="tok-kw">const</span> u8 {
        <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (self) {
            .backlog =&gt; <span class="tok-str">"Backlog"</span>,
            .queued =&gt; <span class="tok-str">"Queued"</span>,
            .running =&gt; <span class="tok-str">"Running"</span>,
            .passed =&gt; <span class="tok-str">"Passed"</span>,
            .failed =&gt; <span class="tok-str">"Failed"</span>,
        };
    }
};

<span class="tok-kw">const</span> Build = <span class="tok-kw">struct</span> {
    id: u32,
    name_buf: [<span class="tok-num">20</span>]u8,
    name_len: usize,
    lane: Lane,

    <span class="tok-kw">fn</span> <span class="tok-fn">name</span>(self: *<span class="tok-kw">const</span> Build) []<span class="tok-kw">const</span> u8 {
        <span class="tok-kw">return</span> self.name_buf[<span class="tok-num">0</span>..self.name_len];
    }
};

<span class="tok-comment">/// Payload type for the drag.  Just the build id - cheaper than</span>
<span class="tok-comment">/// copying the whole build, and the lane state owns the storage</span>
<span class="tok-comment">/// anyway.</span>
<span class="tok-kw">const</span> DragPayload = <span class="tok-kw">struct</span> {
    build_id: u32,
};

<span class="tok-kw">const</span> max_builds: usize = <span class="tok-num">12</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    builds: [max_builds]Build = undefined,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .font = font, .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font) };
    <span class="tok-kw">const</span> branches = [_][]<span class="tok-kw">const</span> u8{
        <span class="tok-str">"main"</span>,
        <span class="tok-str">"feature/x"</span>,
        <span class="tok-str">"bugfix/123"</span>,
        <span class="tok-str">"release-1.4"</span>,
        <span class="tok-str">"deps-bump"</span>,
        <span class="tok-str">"wip"</span>,
        <span class="tok-str">"ci-tune"</span>,
        <span class="tok-str">"docs"</span>,
        <span class="tok-str">"perf"</span>,
        <span class="tok-str">"exp/gpu"</span>,
        <span class="tok-str">"hotfix"</span>,
        <span class="tok-str">"refactor"</span>,
    };
    <span class="tok-kw">const</span> start_lanes = [_]Lane{
        .backlog,
        .backlog,
        .backlog,
        .queued,
        .queued,
        .running,
        .running,
        .passed,
        .passed,
        .passed,
        .failed,
        .failed,
    };
    <span class="tok-kw">for</span> (&amp;s.builds, <span class="tok-num">0</span>..) |*b, i| {
        b.id = <span class="tok-builtin">@intCast</span>(<span class="tok-num">1000</span> + i);
        <span class="tok-kw">const</span> written: []u8 = <span class="tok-fn">bufPrint</span>(&amp;b.name_buf, <span class="tok-str">"{s}#{d}"</span>, .{ branches[i], b.id }) <span class="tok-kw">catch</span> b.name_buf[<span class="tok-num">0</span>..<span class="tok-num">0</span>];
        b.name_len = written.len;
        b.lane = start_lanes[i];
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">findBuildIndex</span>(builds: []<span class="tok-kw">const</span> Build, id: u32) ?usize {
    <span class="tok-kw">for</span> (builds, <span class="tok-num">0</span>..) |b, i| {
        <span class="tok-kw">if</span> (b.id == id) {
            <span class="tok-kw">return</span> i;
        }
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-kw">fn</span> <span class="tok-fn">laneCount</span>(builds: []<span class="tok-kw">const</span> Build, lane: Lane) usize {
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (builds) |b| {
        <span class="tok-kw">if</span> (b.lane == lane) {
            n += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">return</span> n;
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawLane</span>(
    u: ui.Ui,
    s: *State,
    lane: Lane,
) void {
    <span class="tok-comment">// Lane label with count.</span>
    u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}  ({d})"</span>, .{ lane.<span class="tok-fn">label</span>(), <span class="tok-fn">laneCount</span>(&amp;s.builds, lane) });

    <span class="tok-comment">// Lane container: a `child` block holds chips + provides a</span>
    <span class="tok-comment">// hit-rect for beginDragDropTarget.</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">beginChild</span>(<span class="tok-builtin">@tagName</span>(lane), .{ <span class="tok-num">180</span>, <span class="tok-num">360</span> }, .{ .border = true })) {
        <span class="tok-kw">defer</span> u.<span class="tok-fn">endChild</span>();
        <span class="tok-kw">for</span> (s.builds) |b| {
            <span class="tok-kw">if</span> (b.lane != lane) {
                <span class="tok-kw">continue</span>;
            }
            _ = u.<span class="tok-fn">button</span>(b.<span class="tok-fn">name</span>(), .{});
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginDragDropSource</span>(.{})) {
                <span class="tok-kw">const</span> payload: DragPayload = .{ .build_id = b.id };
                u.<span class="tok-fn">setDragDropPayload</span>(DragPayload, &amp;payload);
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{b.<span class="tok-fn">name</span>()});
                u.<span class="tok-fn">endDragDropSource</span>();
            }
        }
    }

    <span class="tok-comment">// The child block becomes the target.  beginDragDropTarget</span>
    <span class="tok-comment">// reads w.last_item_id / last_item_rect from the closed child.</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">beginDragDropTarget</span>(.{})) {
        <span class="tok-kw">if</span> (u.<span class="tok-fn">acceptDragDropPayload</span>(DragPayload, .{})) |payload| {
            <span class="tok-kw">if</span> (<span class="tok-fn">findBuildIndex</span>(&amp;s.builds, payload.build_id)) |idx| {
                s.builds[idx].lane = lane;
            }
        }
        u.<span class="tok-fn">endDragDropTarget</span>();
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Drag-drop demo - Kanban lanes"</span>, .{
        .initial_pos = .{ <span class="tok-num">20</span>, <span class="tok-num">20</span> },
        .initial_size = .{ <span class="tok-num">1040</span>, <span class="tok-num">640</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag any build chip between lanes.  Hover-over highlights the target."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// Five lanes side-by-side.</span>
        <span class="tok-fn">drawLane</span>(u, s, .backlog);
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-fn">drawLane</span>(u, s, .queued);
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-fn">drawLane</span>(u, s, .running);
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-fn">drawLane</span>(u, s, .passed);
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-fn">drawLane</span>(u, s, .failed);

        u.<span class="tok-fn">separator</span>();

        <span class="tok-kw">const</span> dd: *z.ui_real.DragDropState = &amp;s.ui_host.ctx.drag_drop;
        <span class="tok-kw">const</span> phase_str: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">switch</span> (dd.phase) {
            .idle =&gt; <span class="tok-str">"idle"</span>,
            .pending =&gt; <span class="tok-str">"pending"</span>,
            .active =&gt; <span class="tok-str">"active"</span>,
        };
        u.<span class="tok-fn">text</span>(<span class="tok-str">"drag: {s}"</span>, .{phase_str});
        <span class="tok-kw">if</span> (dd.phase == .active) {
            u.<span class="tok-fn">sameLine</span>(.{});
            u.<span class="tok-fn">text</span>(<span class="tok-str">"    payload: {s} ({d} bytes)"</span>, .{ dd.<span class="tok-fn">typeName</span>(), dd.payload_len });
        }
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - UI drag-drop demo"</span>,
            .width = screen_w,
            .height = screen_h,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
};
