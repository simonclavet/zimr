<h1>textures_magnifying_glass</h1>
<figure class="code src-file" data-path="examples/textures_magnifying_glass/textures_magnifying_glass.zig" data-lines="162"><figcaption><span>examples/textures_magnifying_glass/textures_magnifying_glass.zig</span><span>162 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! textures_magnifying_glass - port of raylib [textures] example.</span>
<span class="tok-comment">//! A 2x magnifier follows the pointer. The magnified world is rendered into a</span>
<span class="tok-comment">//! 256x256 render texture through a zoomed Camera2D, where hidden bunnies are</span>
<span class="tok-comment">//! drawn with MULTIPLY blend so they blend into the parrots below (invisible in</span>
<span class="tok-comment">//! the normal view). The square RTT is masked to a circle by drawing a white</span>
<span class="tok-comment">//! circle over it with MULTIPLY blend - whose alpha function (src.a * dst.a)</span>
<span class="tok-comment">//! zeroes the RTT alpha outside the circle. Drag/move the pointer to hunt.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;

<span class="tok-kw">const</span> parrots_png = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"parrots.png"</span>);
<span class="tok-kw">const</span> bunny_png = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"raybunny.png"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> glass: f32 = <span class="tok-num">256</span>; <span class="tok-comment">// magnifier size</span>

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    parrots: z.WgpuTexture,
    bunny: z.WgpuTexture,
    mask: z.WgpuTexture,
    rt: z.RenderTexture,
    font: z.Font,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.parrots.<span class="tok-fn">deinit</span>();
    s.bunny.<span class="tok-fn">deinit</span>();
    s.mask.<span class="tok-fn">deinit</span>();
    s.rt.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">uploadPng</span>(gpa: Allocator, gl: *z.WgpuGl, png: []<span class="tok-kw">const</span> u8) !z.WgpuTexture {
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">loadImageFromMemory</span>(gpa, png);
    <span class="tok-kw">const</span> tex: z.WgpuTexture = z.<span class="tok-fn">loadTextureFromImage</span>(gl, img);
    z.<span class="tok-fn">unloadImage</span>(gpa, img);
    <span class="tok-kw">return</span> tex;
}

<span class="tok-comment">/// A 256x256 white disc on transparent - the circular alpha mask.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildCircleMask</span>(gpa: Allocator, gl: *z.WgpuGl) !z.WgpuTexture {
    <span class="tok-kw">const</span> sz: usize = <span class="tok-num">256</span>;
    <span class="tok-kw">const</span> r: f32 = <span class="tok-num">128</span>;
    <span class="tok-kw">const</span> pixels: []u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u8, sz * sz * <span class="tok-num">4</span>);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pixels);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..sz) |y| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..sz) |x| {
            <span class="tok-kw">const</span> dx: f32 = <span class="tok-fn">float</span>(x) - r;
            <span class="tok-kw">const</span> dy: f32 = <span class="tok-fn">float</span>(y) - r;
            <span class="tok-kw">const</span> inside: bool = (dx * dx + dy * dy) &lt;= r * r;
            <span class="tok-kw">const</span> idx: usize = (y * sz + x) * <span class="tok-num">4</span>;
            pixels[idx + <span class="tok-num">0</span>] = <span class="tok-num">255</span>;
            pixels[idx + <span class="tok-num">1</span>] = <span class="tok-num">255</span>;
            pixels[idx + <span class="tok-num">2</span>] = <span class="tok-num">255</span>;
            pixels[idx + <span class="tok-num">3</span>] = <span class="tok-kw">if</span> (inside) <span class="tok-num">255</span> <span class="tok-kw">else</span> <span class="tok-num">0</span>;
        }
    }
    <span class="tok-kw">const</span> img: z.Image = .{
        .data = <span class="tok-builtin">@ptrCast</span>(pixels.ptr),
        .width = <span class="tok-builtin">@intCast</span>(sz),
        .height = <span class="tok-builtin">@intCast</span>(sz),
        .mipmaps = <span class="tok-num">1</span>,
        .format = <span class="tok-builtin">@backingInt</span>(z.PixelFormat.uncompressed_r8g8b8a8),
    };
    <span class="tok-kw">return</span> z.<span class="tok-fn">loadTextureFromImage</span>(gl, img);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{
        .parrots = <span class="tok-kw">try</span> <span class="tok-fn">uploadPng</span>(gpa, f.gl, parrots_png),
        .bunny = <span class="tok-kw">try</span> <span class="tok-fn">uploadPng</span>(gpa, f.gl, bunny_png),
        .mask = <span class="tok-kw">try</span> <span class="tok-fn">buildCircleMask</span>(gpa, f.gl),
        .rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intFromFloat</span>(glass), <span class="tok-builtin">@intFromFloat</span>(glass)),
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawScene</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> pw: f32 = <span class="tok-fn">float</span>(s.parrots.width);
    <span class="tok-kw">const</span> ph: f32 = <span class="tok-fn">float</span>(s.parrots.height);
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">144</span>, .y = <span class="tok-num">33</span>, .width = pw, .height = ph }, s.parrots, .{ .tint = c.white });
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">154</span>, <span class="tok-num">6</span> }, <span class="tok-str">"Find the hidden bunnies!"</span>, .{ .size = <span class="tok-num">20</span>, .color = c.black, .font = &amp;s.font });
}

<span class="tok-kw">const</span> zoom: f32 = <span class="tok-num">2</span>; <span class="tok-comment">// magnifier zoom</span>
<span class="tok-kw">const</span> half: f32 = glass / <span class="tok-num">2</span>;

<span class="tok-comment">/// Draw a texture into the RTT at world (wx,wy), transformed by the magnifier</span>
<span class="tok-comment">/// camera manually: (world - mouse) * zoom + 128. (beginMode2D can't run inside</span>
<span class="tok-comment">/// beginTextureMode, so we apply the Camera2D math by hand.)</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawMag</span>(
    f: *z.Frame,
    tex: z.WgpuTexture,
    m: Vec2,
    wx: f32,
    wy: f32,
) void {
    <span class="tok-kw">const</span> x: f32 = (wx - m[<span class="tok-num">0</span>]) * zoom + half;
    <span class="tok-kw">const</span> y: f32 = (wy - m[<span class="tok-num">1</span>]) * zoom + half;
    f.gl.<span class="tok-fn">texture</span>(
        .{ .x = x, .y = y, .width = <span class="tok-fn">float</span>(tex.width) * zoom, .height = <span class="tok-fn">float</span>(tex.height) * zoom },
        tex,
        .{ .tint = c.white },
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> m: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);

    <span class="tok-comment">// OFFSCREEN FIRST: render the magnified world + circular mask into the RTT.</span>
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt, c.raywhite);
    <span class="tok-comment">// Magnified parrots + label (manual camera transform).</span>
    <span class="tok-fn">drawMag</span>(f, s.parrots, m, <span class="tok-num">144</span>, <span class="tok-num">33</span>);
    f.gl.<span class="tok-fn">text</span>(
        .{ (<span class="tok-num">154</span> - m[<span class="tok-num">0</span>]) * zoom + half, (<span class="tok-num">6</span> - m[<span class="tok-num">1</span>]) * zoom + half },
        <span class="tok-str">"Find the hidden bunnies!"</span>,
        .{ .size = <span class="tok-num">20</span> * zoom, .color = c.black, .font = &amp;s.font },
    );
    <span class="tok-comment">// Hidden bunnies: MULTIPLY makes them take the colour of the parrots below.</span>
    z.<span class="tok-fn">beginBlendMode</span>(f.gl, .multiply);
    <span class="tok-fn">drawMag</span>(f, s.bunny, m, <span class="tok-num">250</span>, <span class="tok-num">350</span>);
    <span class="tok-fn">drawMag</span>(f, s.bunny, m, <span class="tok-num">500</span>, <span class="tok-num">100</span>);
    <span class="tok-fn">drawMag</span>(f, s.bunny, m, <span class="tok-num">420</span>, <span class="tok-num">300</span>);
    <span class="tok-fn">drawMag</span>(f, s.bunny, m, <span class="tok-num">650</span>, <span class="tok-num">10</span>);
    z.<span class="tok-fn">endBlendMode</span>(f.gl);
    <span class="tok-comment">// Mask to a circle: MULTIPLY's alpha = src.a * dst.a, so the disc's zero</span>
    <span class="tok-comment">// alpha outside the circle zeroes the RTT's alpha there.</span>
    z.<span class="tok-fn">beginBlendMode</span>(f.gl, .multiply);
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = glass, .height = glass }, s.mask, .{ .tint = c.white });
    z.<span class="tok-fn">endBlendMode</span>(f.gl);
    z.<span class="tok-fn">endTextureMode</span>(f.gl);

    <span class="tok-comment">// MAIN PASS: normal scene + the magnifier centered on the pointer.</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, c.raywhite);
    <span class="tok-fn">drawScene</span>(f, s);
    f.gl.<span class="tok-fn">texture</span>(
        .{ .x = m[<span class="tok-num">0</span>] - glass / <span class="tok-num">2</span>, .y = m[<span class="tok-num">1</span>] - glass / <span class="tok-num">2</span>, .width = glass, .height = glass },
        s.rt.<span class="tok-fn">asTexture</span>(),
        .{ .tint = c.white },
    );
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{ .window = .{
        .title = <span class="tok-str">"zimr - WebGPU - textures magnifying glass"</span>,
        .width = <span class="tok-num">800</span>,
        .height = <span class="tok-num">450</span>,
        .scale_mode = .responsive,
    } },
    .init = initState,
    .deinit = deinit,
    .update = update,
    .manages_own_frame = true,
    .memory = .managed,
};
