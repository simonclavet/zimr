<h1>collision_area</h1>
<figure class="code src-file" data-path="examples/collision_area/collision_area.zig" data-lines="190"><figcaption><span>examples/collision_area/collision_area.zig</span><span>190 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/collision_area.zig - visualise the intersection of an</span>
<span class="tok-comment">// axis-aligned bouncing box (A) and a mouse-controlled box (B).</span>
<span class="tok-comment">// Port of raylib's `examples/shapes/shapes_collision_area.c` (*2,</span>
<span class="tok-comment">// ~117 LOC).  Box A slides left-right and bounces off the screen</span>
<span class="tok-comment">// edges; box B tracks the mouse cursor.  When they overlap, the</span>
<span class="tok-comment">// intersection rectangle is drawn in lime green and a HUD strip</span>
<span class="tok-comment">// at the top flashes red.</span>
<span class="tok-comment">// What this exercises:</span>
<span class="tok-comment">//   - Axis-aligned bounding box (AABB) overlap test.  raylib's</span>
<span class="tok-comment">//     `CheckCollisionRecs` and `GetCollisionRec` - equivalent</span>
<span class="tok-comment">//     to the two small helpers at the bottom of this file.</span>
<span class="tok-comment">//   - Rectangle clamping for keeping box B in-bounds.</span>
<span class="tok-comment">//   - Live geometry HUD: as box A scrubs back-and-forth, the</span>
<span class="tok-comment">//     mouse position cleanly defines a moving Boolean test.</span>
<span class="tok-comment">// Controls:</span>
<span class="tok-comment">//   Mouse    moves box B</span>
<span class="tok-comment">//   SPACE    pause/resume box A's motion</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;

<span class="tok-kw">const</span> screen_w: i32 = <span class="tok-num">800</span>;
<span class="tok-kw">const</span> screen_h: i32 = <span class="tok-num">450</span>;
<span class="tok-kw">const</span> screen_w_f: f32 = <span class="tok-fn">float</span>(screen_w);
<span class="tok-kw">const</span> screen_h_f: f32 = <span class="tok-fn">float</span>(screen_h);
<span class="tok-kw">const</span> upper_strip: f32 = <span class="tok-num">40.0</span>;
<span class="tok-kw">const</span> box_a_speed: f32 = <span class="tok-num">4.0</span>;

<span class="tok-kw">const</span> c = Color;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// Owned shapes-texture state.  Default-init points at rlgl's</span>
    <span class="tok-comment">/// internal 1x1 white pixel (texture id=1) - no upload needed.</span>
    <span class="tok-comment">/// Owned default-font cache.  Populated by `z.loadFontFromTtfBytes`</span>
    <span class="tok-comment">/// in `initState` below.</span>
    font: z.Font,
    frame_count: usize = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Box A - moving, bounces between screen edges.</span>
    box_a: z.Rectangle = .{
        .x = <span class="tok-num">10</span>,
        .y = screen_h_f / <span class="tok-num">2</span> - <span class="tok-num">50</span>,
        .width = <span class="tok-num">200</span>,
        .height = <span class="tok-num">100</span>,
    },
    <span class="tok-comment">/// Per-frame velocity of box A in the X axis.  Flipped on</span>
    <span class="tok-comment">/// edge contact.</span>
    box_a_speed_x: f32 = box_a_speed,
    <span class="tok-comment">/// Box B - follows mouse, clamped to screen + below the upper strip.</span>
    box_b: z.Rectangle = .{
        .x = screen_w_f / <span class="tok-num">2</span> - <span class="tok-num">30</span>,
        .y = screen_h_f / <span class="tok-num">2</span> - <span class="tok-num">30</span>,
        .width = <span class="tok-num">60</span>,
        .height = <span class="tok-num">60</span>,
    },
    <span class="tok-comment">/// Whether box A's motion is currently paused.</span>
    paused: bool = false,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">32</span>);
    s.* = .{ .font = font };
}

<span class="tok-comment">/// AABB overlap test - closed intervals on both axes.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">rectsOverlap</span>(a: z.Rectangle, b: z.Rectangle) bool {
    <span class="tok-kw">return</span> (a.x &lt;= b.x + b.width) <span class="tok-kw">and</span> (a.x + a.width &gt;= b.x) <span class="tok-kw">and</span>
        (a.y &lt;= b.y + b.height) <span class="tok-kw">and</span> (a.y + a.height &gt;= b.y);
}

<span class="tok-comment">/// AABB intersection rectangle.  Caller should only invoke when</span>
<span class="tok-comment">/// `rectsOverlap` is true - width/height would otherwise be</span>
<span class="tok-comment">/// negative for non-overlapping rects.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">rectIntersection</span>(a: z.Rectangle, b: z.Rectangle) z.Rectangle {
    <span class="tok-kw">const</span> x: f32 = <span class="tok-builtin">@max</span>(a.x, b.x);
    <span class="tok-kw">const</span> y: f32 = <span class="tok-builtin">@max</span>(a.y, b.y);
    <span class="tok-kw">const</span> x2: f32 = <span class="tok-builtin">@min</span>(a.x + a.width, b.x + b.width);
    <span class="tok-kw">const</span> y2: f32 = <span class="tok-builtin">@min</span>(a.y + a.height, b.y + b.height);
    <span class="tok-kw">return</span> .{ .x = x, .y = y, .width = x2 - x, .height = y2 - y };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    state.frame_count += <span class="tok-num">1</span>;

    <span class="tok-comment">// ---- Update box A (moving) -------------------------------------------</span>
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .space)) {
        state.paused = !state.paused;
    }

    <span class="tok-comment">// dt-scaled so motion is independent of frame rate.  raylib's</span>
    <span class="tok-comment">// source uses fixed integer pixels per frame; we match the</span>
    <span class="tok-comment">// visual feel with `60 * dt * speed_per_frame`.</span>
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-builtin">@floatCast</span>(f.time.delta_time);
    <span class="tok-kw">const</span> k: f32 = dt * <span class="tok-num">60.0</span>;

    <span class="tok-kw">if</span> (!state.paused) {
        state.box_a.x += state.box_a_speed_x * k;
    }
    <span class="tok-comment">// Edge-bounce by flipping the speed sign.</span>
    <span class="tok-kw">if</span> ((state.box_a.x + state.box_a.width) &gt;= screen_w_f <span class="tok-kw">or</span> state.box_a.x &lt;= <span class="tok-num">0</span>) {
        state.box_a_speed_x *= -<span class="tok-num">1</span>;
    }

    <span class="tok-comment">// ---- Update box B (mouse-tracked) ------------------------------------</span>
    state.box_b.x = <span class="tok-fn">float</span>(z.<span class="tok-fn">getMouseX</span>(f.input)) - state.box_b.width / <span class="tok-num">2</span>;
    state.box_b.y = <span class="tok-fn">float</span>(z.<span class="tok-fn">getMouseY</span>(f.input)) - state.box_b.height / <span class="tok-num">2</span>;

    <span class="tok-comment">// Clamp inside the play area (below the upper strip).</span>
    state.box_b.x = <span class="tok-fn">clamp</span>(state.box_b.x, <span class="tok-num">0</span>, screen_w_f - state.box_b.width);
    state.box_b.y = <span class="tok-fn">clamp</span>(state.box_b.y, upper_strip, screen_h_f - state.box_b.height);

    <span class="tok-comment">// ---- Collision -------------------------------------------------------</span>
    <span class="tok-kw">const</span> collision: bool = <span class="tok-fn">rectsOverlap</span>(state.box_a, state.box_b);
    <span class="tok-kw">const</span> overlap: z.Rectangle = <span class="tok-kw">if</span> (collision)
        <span class="tok-fn">rectIntersection</span>(state.box_a, state.box_b)
    <span class="tok-kw">else</span>
        .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = <span class="tok-num">0</span>, .height = <span class="tok-num">0</span> };

    <span class="tok-comment">// ---- Render ----------------------------------------------------------</span>
    z.<span class="tok-fn">clearViewport</span>(f, c.raywhite);

    <span class="tok-comment">// Top strip flips red when colliding, black otherwise.</span>
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = <span class="tok-fn">float</span>(screen_w), .height = upper_strip },
        .{ .color = <span class="tok-kw">if</span> (collision) c.red <span class="tok-kw">else</span> c.black },
    );

    f.gl.<span class="tok-fn">rect</span>(state.box_a, .{ .color = c.gold });
    f.gl.<span class="tok-fn">rect</span>(state.box_b, .{ .color = c.blue });

    <span class="tok-kw">if</span> (collision) {
        <span class="tok-comment">// Intersection in lime.  This is the visual payoff.</span>
        f.gl.<span class="tok-fn">rect</span>(overlap, .{ .color = c.lime });

        <span class="tok-comment">// Centred "COLLISION!" inside the upper strip.</span>
        <span class="tok-kw">const</span> msg: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"COLLISION!"</span>;
        <span class="tok-kw">const</span> w: f32 = z.<span class="tok-fn">measureText</span>(state.font, msg, <span class="tok-num">20</span>)[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> msg_x: f32 = screen_w_f / <span class="tok-num">2</span> - w / <span class="tok-num">2</span>;
        <span class="tok-kw">const</span> msg_y: f32 = upper_strip / <span class="tok-num">2</span> - <span class="tok-num">10</span>;
        f.gl.<span class="tok-fn">text</span>(.{ msg_x, msg_y }, msg, .{ .size = <span class="tok-num">20</span>, .color = c.black, .font = &amp;state.font });

        <span class="tok-comment">// Area readout just below the upper strip.</span>
        <span class="tok-kw">var</span> buf: [<span class="tok-num">64</span>]u8 = undefined;
        <span class="tok-kw">const</span> aw: i32 = <span class="tok-builtin">@trunc</span>(overlap.width);
        <span class="tok-kw">const</span> ah: i32 = <span class="tok-builtin">@trunc</span>(overlap.height);
        <span class="tok-kw">const</span> area: i32 = aw * ah;
        <span class="tok-kw">const</span> area_msg: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"Collision Area: {d}"</span>, .{area}) <span class="tok-kw">catch</span> <span class="tok-str">"Collision Area: ?"</span>;
        <span class="tok-kw">const</span> area_y = <span class="tok-builtin">@as</span>(i32, upper_strip) + <span class="tok-num">10</span>;
        f.gl.<span class="tok-fn">text</span>(
            .{ <span class="tok-builtin">@divFloor</span>(screen_w, <span class="tok-num">2</span>) - <span class="tok-num">100</span>, area_y },
            area_msg,
            .{ .size = <span class="tok-num">20</span>, .color = c.black, .font = &amp;state.font },
        );
    }

    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">20</span>, screen_h - <span class="tok-num">35</span> },
        <span class="tok-str">"Press SPACE to PAUSE/RESUME"</span>,
        .{ .size = <span class="tok-num">20</span>, .color = c.lightgray, .font = &amp;state.font },
    );
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}
