<style>
:root{
  /* two surfaces, one ink */
  --bg:#0a0a0a;          /* the page */
  --panel:#141414;       /* anything set apart: code, callout, device side */
  --panel-2:#1b1b1b;     /* a panel on a panel (figcaption, summary) */
  --fg:#e8e8e8;          /* body text */
  --dim:#9aa0a8;         /* secondary text, captions */
  --faint:#6b7280;       /* labels, line numbers, table headers */
  --rule:#262626;        /* every border in the document */
  --link:#82d8ef;
  /* tokens — the one set, shared by the Zig and WGSL highlighters */
  --tok-comment:#6b7a8c;
  --tok-kw:#c792ea;
  --tok-fn:#82d8ef;
  --tok-str:#9ad08a;
  --tok-num:#f5a35e;
  --tok-type:#6fb6ff;
  --tok-builtin:#e9a23b;
  /* one font: mono, from whatever ships on the device. No download. */
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --maxw:860px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0 auto;padding:2.2rem 1.1rem 6rem;max-width:var(--maxw);
  background:var(--bg);color:var(--fg);
  font-family:var(--mono);font-size:15px;line-height:1.65;
}
h1,h2,h3,h4{font-family:var(--mono);font-weight:700;line-height:1.25;margin:2.2em 0 .7em;}
h1{font-size:1.6rem;margin-top:0;}
h2{font-size:1.25rem;border-bottom:1px solid var(--rule);padding-bottom:.35em;}
h3{font-size:1.05rem;}
h4{font-size:.95rem;color:var(--dim);}
p{margin:0 0 1.1em;}
a{color:var(--link);text-decoration:none;border-bottom:1px solid var(--rule);}
a:hover{border-bottom-color:var(--link);}
strong,b{color:#fff;font-weight:700;}
em,i{color:var(--dim);font-style:italic;}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0;}
small,.dim{color:var(--dim);font-size:.87em;}
.faint{color:var(--faint);}
ul,ol{margin:0 0 1.1em;padding-left:1.5em;}
li{margin:.3em 0;}
blockquote{margin:1.2em 0;padding:.1em 0 .1em 1em;border-left:2px solid var(--rule);color:var(--dim);}
/* code */
pre{
  margin:1.1em 0;padding:14px 16px;background:var(--panel);
  border:1px solid var(--rule);border-radius:3px;
  overflow-x:auto;font-size:13px;line-height:1.6;
}
pre,code,kbd,samp{font-family:var(--mono);}
pre code{background:none;padding:0;border:0;font-size:inherit;color:var(--fg);}
code{background:var(--panel);padding:.1em .35em;border-radius:2px;font-size:.92em;color:#fff;}
.tok-comment{color:var(--tok-comment);font-style:italic;}
.tok-kw{color:var(--tok-kw);}
.tok-fn{color:var(--tok-fn);}
.tok-str{color:var(--tok-str);}
.tok-num{color:var(--tok-num);}
.tok-type{color:var(--tok-type);}
.tok-builtin{color:var(--tok-builtin);}
/* a captioned code block: <figure class="code"><figcaption>… */
figure{margin:1.3em 0;}
figure.code{margin:1.3em 0;}
figure.code figcaption{
  background:var(--panel-2);border:1px solid var(--rule);border-bottom:0;
  border-radius:3px 3px 0 0;padding:6px 12px;font-size:11.5px;color:var(--faint);
  display:flex;justify-content:space-between;gap:1em;
}
figure.code figcaption .lang{color:var(--dim);text-transform:uppercase;letter-spacing:.16em;}
figure.code pre{margin:0;border-radius:0 0 3px 3px;}
/* folds — pure CSS, no JS. The summary text is just the name; the prose
   comes from ::before, which is zimrnum-tutorial's trick and a good one. */
details{border:1px solid var(--rule);border-radius:3px;margin:.5em 0;background:var(--panel);}
details[open]{background:var(--bg);}
summary{
  cursor:pointer;padding:.4em .8em;color:var(--dim);font-size:.9em;
  list-style:none;user-select:none;
}
summary::-webkit-details-marker{display:none;}
summary::before{content:"\\25b8\\00a0";color:var(--faint);}
details[open]>summary::before{content:"\\25be\\00a0";}
summary:hover{color:var(--fg);}
details>pre{margin:0;border:0;border-top:1px solid var(--rule);border-radius:0;}
.src-fold>summary::after{content:" \\2014 source";color:var(--faint);}
/* callouts — one box, a coloured left rule says which kind */
.note,.warn,.good,.bad{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left-width:3px;border-radius:3px;
}
.note{border-left-color:var(--tok-fn);}
.warn{border-left-color:var(--tok-builtin);}
.good{border-left-color:var(--tok-str);}
.bad{border-left-color:#e0555f;}
/* tables */
table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:13px;}
th,td{border:1px solid var(--rule);padding:.45em .7em;text-align:left;vertical-align:top;}
th{color:var(--faint);font-weight:700;background:var(--panel);}
/* the CPU/GPU split: two surfaces, same two colours as everything else */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:1.3em 0;}
.split>*{min-width:0;}
.split-cpu,.split-gpu{border:1px solid var(--rule);border-radius:3px;padding:2px;}
.split-cpu{background:var(--bg);}
.split-gpu{background:var(--panel);}
.split-cpu>pre,.split-gpu>pre{margin:0;border:0;background:none;}
.split h4,.split .lab{
  margin:.2em 0 .4em;padding:4px 10px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--rule);
}
@media(max-width:700px){.split{grid-template-columns:1fr;}}
/* media */
img,svg,canvas,video{max-width:100%;height:auto;}
iframe{max-width:100%;border:1px solid var(--rule);border-radius:3px;background:#000;}
/* a live demo embedded in a page: the full column, 16:9. Without a size the
   frame is the browser default 300x150 and the app boots that small. */
.demo-embed{margin:1.6em 0;}
.demo-embed iframe{display:block;width:100%;aspect-ratio:16/9;}
.demo-embed figcaption{color:var(--dim);font-size:.9em;margin-top:.5em;}
/* Inline marks the pages already use, mapped onto the SAME token colours
   rather than given colours of their own — cheatsheet's signature rows,
   the reference tables, and the two semantic marks that carry teaching
   weight in shader-authoring (`hazard` = the hand-counted integer, and the
   old/new path contrast). One palette, reused. */
.sig{margin:1.2em 0 .2em;padding-top:.8em;border-top:1px solid var(--rule);}
.k{color:var(--tok-kw);}
.nm{color:var(--tok-fn);font-weight:700;}
.ns{color:var(--faint);}
.eq{color:var(--dim);}
.doc{color:var(--dim);margin:.2em 0 .6em;}
.num,.n{color:var(--tok-num);}
.host,.lab,.lang,.path,.tag,.stage,.sec-num,.lesson-num{
  color:var(--faint);font-size:.85em;letter-spacing:.12em;text-transform:uppercase;
}
.anchor{border:0;color:var(--faint);opacity:0;padding-left:.4em;}
h1:hover .anchor,h2:hover .anchor,h3:hover .anchor{opacity:1;}
.chip{
  display:inline-block;padding:.05em .5em;margin:0 .15em;border:1px solid var(--rule);
  border-radius:2px;color:var(--dim);font-size:.82em;
}
.chip.on{color:var(--fg);border-color:var(--tok-fn);}
.hazard{color:#e0555f;font-weight:700;}
.hl-old{color:var(--tok-builtin);}
.hl-new{color:var(--tok-fn);}
.yes,.good-mark{color:var(--tok-str);}
.callout{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-fn);border-radius:3px;
}
.zn-source{margin:.6em 0 1.4em;}
.lesson{margin:2em 0;}
.lesson-title{font-weight:700;color:#fff;}
.lesson-goal{color:var(--dim);}
/* page furniture: the landing page and the tutorials' own scaffolding */
.blog-container,.wrap,.max{max-width:var(--maxw);margin:0 auto;}
.title{font-size:1.8rem;margin:0 0 .2em;}
.subtitle,.lede,.sub{
  border:0;font-size:1rem;font-weight:400;color:var(--dim);
  margin:0 0 1.6em;line-height:1.6;
}
.eyebrow{color:var(--faint);font-size:.85em;letter-spacing:.14em;text-transform:uppercase;}
.toplinks{
  display:flex;flex-wrap:wrap;gap:.1em 1.1em;margin:0 0 2em;
  padding:.9em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:.88em;
}
.toplinks a{border:0;color:var(--dim);}
.toplinks a:hover,.toplinks a.offsite{color:var(--link);}
.wip-warning{
  margin:0 0 2em;padding:.8em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-builtin);border-radius:3px;
  color:var(--dim);font-size:.9em;
}
.wip-warning strong{display:block;color:var(--tok-builtin);margin-bottom:.2em;}
/* cheatsheet: one declaration per .fn row */
.fn{margin:1.1em 0;}
.what,.body{color:var(--dim);}
.sketch{color:var(--dim);}
.pane{border:1px solid var(--rule);border-radius:3px;margin:1.1em 0;}
.pane-head{
  padding:5px 11px;background:var(--panel-2);border-bottom:1px solid var(--rule);
  color:var(--faint);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
}
.cell{padding:.5em .8em;}
.swatch{display:inline-block;width:.9em;height:.9em;border:1px solid var(--rule);vertical-align:-1px;}
.old,.meh{color:var(--tok-builtin);}
.new,.win{color:var(--tok-str);}
.crit{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid #e0555f;border-radius:3px;
}
/* The examples gallery (index.html): the list of examples on the left, the
   selected one running in a frame that fills the rest. On a phone the list
   is a drawer over the example, under the bar. `list-open` shows the list. */
body.gallery{
  max-width:none;margin:0;padding:0;height:100vh;height:100dvh;overflow:hidden;
  display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);
  color-scheme:dark;
}
body.gallery.list-open{grid-template-columns:minmax(240px,25%) 1fr;}
.gallery a{border:0;}
.g-side{display:none;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--rule);}
.list-open .g-side{display:flex;}
.g-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 1em;padding:.7em 1em .6em;font-size:.85em;}
.g-head a{color:var(--dim);}
.g-head a:hover{color:var(--link);}
.g-head .g-logo{margin-right:auto;font-size:1.1rem;font-weight:700;color:var(--fg);white-space:nowrap;}
.g-filters{display:flex;flex-wrap:wrap;gap:.4em;padding:0 1em;}
.g-filters input,.g-filters select{
  min-width:0;padding:.35em .5em;background:var(--panel);color:var(--fg);
  border:1px solid var(--rule);border-radius:3px;font:inherit;font-size:.85em;
}
.g-filters input{flex:1 1 10em;}
.g-filters select{flex:1 1 auto;}
.g-filters input:focus,.g-filters select:focus{outline:none;border-color:var(--tok-fn);}
.g-count{padding:.45em 1em;color:var(--faint);font-size:.75em;border-bottom:1px solid var(--rule);}
.g-list{flex:1;overflow-y:auto;padding-bottom:3em;font-size:13px;}
.g-group{
  position:sticky;top:0;padding:.8em 1em .3em;background:var(--bg);
  color:var(--faint);font-size:.8em;letter-spacing:.14em;text-transform:uppercase;
}
/* scroll-margin: scrolled into view, a row clears the sticky module heading */
.g-item{
  display:flex;justify-content:space-between;gap:.6em;padding:.15em 1em;
  color:var(--dim);border-left:2px solid transparent;scroll-margin-top:2.4em;
}
.g-item:hover{color:var(--fg);background:var(--panel);}
.g-item.on{color:#fff;background:var(--panel-2);border-left-color:var(--tok-fn);}
.g-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-stars{color:var(--faint);font-size:.8em;white-space:nowrap;}
.g-none{padding:1em;color:var(--faint);}
.g-main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.g-bar{
  flex:none;display:flex;align-items:center;gap:.4em;height:44px;padding:0 .6em;
  border-bottom:1px solid var(--rule);white-space:nowrap;
}
.g-btn{
  flex:none;width:30px;height:30px;padding:0;background:var(--panel);color:var(--dim);
  border:1px solid var(--rule);border-radius:3px;font:inherit;cursor:pointer;
}
.g-btn:hover{color:var(--fg);border-color:var(--tok-fn);}
.g-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding-left:.4em;}
.g-desc{margin-left:.6em;color:var(--dim);font-size:.9em;}
.g-open{flex:none;padding:0 .4em;font-size:.9em;}
.g-stage{flex:1;position:relative;min-height:0;}
.g-stage iframe{position:absolute;inset:0;width:100%;height:100%;max-width:none;border:0;border-radius:0;}
.g-intro{max-width:36em;margin:12vh auto 0;padding:0 1.5em;}
@media(max-width:700px){
  body.gallery.list-open{grid-template-columns:1fr;}
  .g-side{position:fixed;inset:44px 0 0 0;z-index:1;border-right:0;}
  .g-item{padding:.45em 1em;}
  .g-desc{display:none;}
}
/* A tutorial pointer, sitting directly under the heading whose subject it
   covers rather than pooled in a list at the foot of the page. */
.tut{
  margin:.2em 0 1.3em;padding:.55em .9em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-fn);border-radius:3px;
  color:var(--dim);font-size:.9em;
}
.tut a{color:var(--link);border:0;font-weight:700;}
.tut-index{list-style:none;padding-left:0;}
.tut-index li{padding:.25em 0;border-bottom:1px solid var(--rule);}
.tut-index a{border:0;}
/* `.reveal` was animated in by the JS that docfmt replaced; without a rule
   it is simply visible, which is the correct end state. */
@media(max-width:700px){body{font-size:14px;padding:1.4rem .8rem 4rem;}pre{font-size:12px;}}
</style>

<h1>ui_dock_basic</h1>
<figure class="code src-file" data-path="examples/ui_dock_basic/ui_dock_basic.zig" data-lines="197"><figcaption><span>examples/ui_dock_basic/ui_dock_basic.zig</span><span>197 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_dock_basic.zig - docking arc demo (phone-friendly,</span>
<span class="tok-comment">//).</span>
<span class="tok-comment">// Shows off everything that landed in the 5.5e-i sub-steps:</span>
<span class="tok-comment">//   - Drag-to-dock with smooth-pull overlay (5.5e).  Grab the</span>
<span class="tok-comment">//     "Floating Notes" window's title bar and drag it over the</span>
<span class="tok-comment">//     dockspace - five drop zones light up; whichever zone the</span>
<span class="tok-comment">//     cursor pulls toward strongest wins.  Release to dock.</span>
<span class="tok-comment">//   - Pre-dock pos/size restore (5.5h).  After dragging Notes</span>
<span class="tok-comment">//     into the dock, click the Reset button to tear down the</span>
<span class="tok-comment">//     layout - Notes pops back to where it was floating.</span>
<span class="tok-comment">//   - DockNodeFlags (5.5f).  The Tools leaf is configured</span>
<span class="tok-comment">//     `no_split` + `no_docking_over_me`: try dragging Notes</span>
<span class="tok-comment">//     over Tools and notice the overlay doesn't appear there.</span>
<span class="tok-comment">//   - Splitter drag (5.5i).  Grab the seam between Tools and</span>
<span class="tok-comment">//     the right group; drag to resize.  Brightens on hover.</span>
<span class="tok-comment">//   - size_ref lock (5.5g).  Tools is initially locked at</span>
<span class="tok-comment">//     a sensible fraction of the viewport.  The "Unlock Tools"</span>
<span class="tok-comment">//     button clears the lock so Tools resizes proportionally.</span>
<span class="tok-comment">// Phone-friendly setup:</span>
<span class="tok-comment">//   - `.scale = .responsive` - canvas coords track CSS pixels</span>
<span class="tok-comment">//     1:1, so widgets size correctly regardless of viewport.</span>
<span class="tok-comment">//   - `style.font_size = 24` - readable on phone (3x the</span>
<span class="tok-comment">//     default 10).  Default widget heights (buttons, title</span>
<span class="tok-comment">//     bars, item spacing) follow proportionally - bigger</span>
<span class="tok-comment">//     touch targets come for free.</span>
<span class="tok-comment">//   - All window/dockspace dimensions derived from</span>
<span class="tok-comment">//     `f.window.screen_width/height` so the layout fills the</span>
<span class="tok-comment">//     viewport on phone AND desktop.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    layout_built: bool = false,
    counter: i32 = <span class="tok-num">0</span>,
    tools_locked: bool = true,
    <span class="tok-comment">// Stable handles so the Reset / Lock buttons don't have to</span>
    <span class="tok-comment">// walk the tree.</span>
    root: ui.Id = <span class="tok-num">0</span>,
    tools_parent_split: ui.Id = <span class="tok-num">0</span>,
    tools_locked_px: f32 = <span class="tok-num">200</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
    <span class="tok-comment">// Bump font_size off the bitmap default (10) so labels are</span>
    <span class="tok-comment">// legible without being huge.  `.scale = .responsive` keeps</span>
    <span class="tok-comment">// input/draw coords 1:1 with CSS pixels - no stretching that</span>
    <span class="tok-comment">// would desync mouse position from where widgets render.</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, Color.raywhite);

    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">const</span> sw: f32 = <span class="tok-fn">float</span>(f.window.screen_width);
    <span class="tok-kw">const</span> sh: f32 = <span class="tok-fn">float</span>(f.window.screen_height);
    <span class="tok-comment">// Lock the Tools panel at ~30 % of the viewport width.</span>
    <span class="tok-comment">// Re-read each frame so rotating the phone keeps Tools at</span>
    <span class="tok-comment">// a sensible width.</span>
    s.tools_locked_px = <span class="tok-builtin">@max</span>(<span class="tok-num">160</span>, sw * <span class="tok-num">0.30</span>);

    <span class="tok-comment">// Host window fills the viewport with a small margin so the</span>
    <span class="tok-comment">// user can still see the edge of the canvas.</span>
    <span class="tok-kw">const</span> margin: f32 = <span class="tok-num">8</span>;
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Host"</span>, .{
        .initial_pos = .{ margin, margin },
        .initial_size = .{ sw - <span class="tok-num">2</span> * margin, sh - <span class="tok-num">2</span> * margin },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag 'Notes' onto the dock. Grab seam to resize."</span>, .{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Reset"</span>, .{})) {
            u.<span class="tok-fn">dockBuilderRemoveNode</span>(s.root);
            s.layout_built = false;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-kw">if</span> (s.tools_locked) <span class="tok-str">"Unlock Tools"</span> <span class="tok-kw">else</span> <span class="tok-str">"Lock Tools"</span>, .{})) {
            s.tools_locked = !s.tools_locked;
            <span class="tok-kw">if</span> (s.tools_parent_split != <span class="tok-num">0</span>) {
                u.<span class="tok-fn">dockBuilderSetSizeRef</span>(
                    s.tools_parent_split,
                    .a,
                    <span class="tok-kw">if</span> (s.tools_locked) s.tools_locked_px <span class="tok-kw">else</span> null,
                );
            }
        }
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// Dockspace fills the rest of the Host content area.</span>
        <span class="tok-comment">// Use a fixed size hint that reaches near the host's</span>
        <span class="tok-comment">// bottom edge; the auto-fill via getContentRegionAvail</span>
        <span class="tok-comment">// is more idiomatic but the simple form is enough for</span>
        <span class="tok-comment">// this demo.</span>
        <span class="tok-kw">const</span> dockspace_size: Vec2 = .{ sw - <span class="tok-num">2</span> * margin - <span class="tok-num">24</span>, sh - <span class="tok-num">2</span> * margin - <span class="tok-num">180</span> };
        s.root = u.<span class="tok-fn">dockSpace</span>(<span class="tok-str">"MainDockSpace"</span>, dockspace_size, .{});

        <span class="tok-comment">// Build the default layout once per "session" (after</span>
        <span class="tok-comment">// reset the flag flips back to false, rebuilding).</span>
        <span class="tok-kw">if</span> (!s.layout_built <span class="tok-kw">and</span> s.root != <span class="tok-num">0</span>) {
            <span class="tok-kw">const</span> split: ui.SplitResult = u.<span class="tok-fn">dockBuilderSplitNode</span>(s.root, .left, <span class="tok-num">0.30</span>);
            <span class="tok-kw">if</span> (split.a != <span class="tok-num">0</span> <span class="tok-kw">and</span> split.b != <span class="tok-num">0</span>) {
                u.<span class="tok-fn">dockBuilderDockWindow</span>(<span class="tok-str">"Tools"</span>, split.a);
                u.<span class="tok-fn">dockBuilderDockWindow</span>(<span class="tok-str">"Viewport"</span>, split.b);
                u.<span class="tok-fn">dockBuilderDockWindow</span>(<span class="tok-str">"Console"</span>, split.b);

                <span class="tok-comment">// Tools panel locked at the viewport-relative px.</span>
                <span class="tok-comment">// Won't scale when the dockspace resizes;</span>
                <span class="tok-comment">// right group absorbs the remainder.  Plus</span>
                <span class="tok-comment">// no_split (can't sub-split it) and</span>
                <span class="tok-comment">// no_docking_over_me (incoming drags skip</span>
                <span class="tok-comment">// this leaf entirely).  Mark central node on</span>
                <span class="tok-comment">// the right group for persistence (5.5k).</span>
                u.<span class="tok-fn">dockBuilderSetSizeRef</span>(s.root, .a, s.tools_locked_px);
                u.<span class="tok-fn">dockBuilderSetNodeFlags</span>(split.a, .{
                    .no_split = true,
                    .no_docking_over_me = true,
                });
                u.<span class="tok-fn">dockBuilderSetCentralNode</span>(split.b);
                s.tools_parent_split = s.root;
                s.tools_locked = true;

                u.<span class="tok-fn">dockBuilderFinish</span>(s.root);
                s.layout_built = true;
            }
        }
    }

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Tools"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Locked."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"No drop here."</span>, .{});
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"+1"</span>, .{})) {
            s.counter += <span class="tok-num">1</span>;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Count: {d}"</span>, .{s.counter});
    }

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Viewport"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Central leaf."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag the seam to resize."</span>, .{});
    }

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Console"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"&gt; 5.5e-i shipped"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"&gt; 5.5j next: tab close"</span>, .{});
    }

    <span class="tok-comment">// Floating window - drag its title bar onto the dock to</span>
    <span class="tok-comment">// exercise the smooth-pull overlay.  No dockBuilder calls</span>
    <span class="tok-comment">// -&gt; starts floating.  Position lower-center so its title</span>
    <span class="tok-comment">// bar is well within the viewport on phone.</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Notes"</span>, .{
        .initial_pos = .{ sw * <span class="tok-num">0.10</span>, sh * <span class="tok-num">0.55</span> },
        .initial_size = .{ sw * <span class="tok-num">0.80</span>, sh * <span class="tok-num">0.30</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag my title onto the dock."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Watch the 5-zone overlay."</span>, .{});
    }
}
