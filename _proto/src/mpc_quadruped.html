<h1>mpc_quadruped</h1>
<figure class="code src-file" data-path="examples/mpc_quadruped/mpc_quadruped.zig" data-lines="479"><figcaption><span>examples/mpc_quadruped/mpc_quadruped.zig</span><span>479 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! mpc_quadruped - watching a quadruped's trunk planner think.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * HONEST STATUS, BECAUSE THE DEMO SHOWS BOTH --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! **NOTHING HOLDS YET, INCLUDING THE STAND.** The force allocation is right - four feet find</span>
<span class="tok-comment">//! 29.4 N each against a quarter-weight of 29.4, which nobody told it - but the closed loop</span>
<span class="tok-comment">//! diverges within a second or two. See the banner in `robot_mpc.zig` for what has been ruled</span>
<span class="tok-comment">//! out. The demo is here to be looked at, not to impress.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** WHAT IS BEING PLANNED, AND WHAT IS NOT --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! This draws the SINGLE RIGID BODY model - the trunk, and four contact points. It is not the</span>
<span class="tok-comment">//! articulated Go1: there are no legs here, because the whole-body mapping that turns these</span>
<span class="tok-comment">//! forces into joint torques is a separate layer and this one has to be right first.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! So the trunk box is a real simulated rigid body, the feet are real planned contact points,</span>
<span class="tok-comment">//! and the arrows are real planned ground reaction forces. The legs you cannot see are the</span>
<span class="tok-comment">//! part that comes next.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * THE MODEL IS Z-UP AND THE RENDERER IS Y-UP --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! MJCF is Z-up and this model matches it, so nothing has to be converted where the physics</span>
<span class="tok-comment">//! is. The swizzle happens once, at the boundary, in `toRender`. Doing it anywhere else means</span>
<span class="tok-comment">//! two conventions in the same file and a permanent supply of sign bugs.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Command = mpc.Command;
<span class="tok-kw">const</span> ui = z.ui;

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> identity = zm.identity;
<span class="tok-kw">const</span> translation = zm.translation;

<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> rotationX = zm.rotationX;
<span class="tok-kw">const</span> rotationY = zm.rotationY;
<span class="tok-kw">const</span> rotationZ = zm.rotationZ;

<span class="tok-kw">const</span> sim_timestep: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">100.0</span>;
<span class="tok-kw">const</span> horizon_knots: u32 = <span class="tok-num">20</span>;
<span class="tok-kw">const</span> stand_height: f32 = <span class="tok-num">0.30</span>;

<span class="tok-kw">const</span> background: Color = .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> trunk_colour: Color = .{ .r = <span class="tok-num">107</span>, .g = <span class="tok-num">158</span>, .b = <span class="tok-num">219</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> stance_foot_colour: Color = .{ .r = <span class="tok-num">237</span>, .g = <span class="tok-num">184</span>, .b = <span class="tok-num">89</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> swing_foot_colour: Color = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">128</span>, .b = <span class="tok-num">150</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> force_colour: Color = .{ .r = <span class="tok-num">89</span>, .g = <span class="tok-num">214</span>, .b = <span class="tok-num">143</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> ghost_colour: Color = .{ .r = <span class="tok-num">70</span>, .g = <span class="tok-num">110</span>, .b = <span class="tok-num">130</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> target_colour: Color = .{ .r = <span class="tok-num">214</span>, .g = <span class="tok-num">110</span>, .b = <span class="tok-num">190</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    trunk: mpc.TrunkModel,
    layout: mpc.Layout,
    plan: mpc.TrunkPlan,

    <span class="tok-comment">/// `[position(3), roll-pitch-yaw(3), velocity(3), angular rate(3)]`.</span>
    trunk_state: [mpc.trunk_state_dim]f32,
    <span class="tok-comment">/// Where each foot is planted, world. Only meaningful while that foot is in stance.</span>
    foot_planted: [mpc.leg_count]Vec,
    <span class="tok-comment">/// Where each swinging foot is heading.</span>

    ui_host: z.UiHost,
    cube: z.Mesh,

    transform: [<span class="tok-num">1</span>]zm.Mat,
};

<span class="tok-kw">const</span> gait_names = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"stand (works)"</span>, <span class="tok-str">"walk (broken)"</span>, <span class="tok-str">"trot (broken)"</span> };

<span class="tok-kw">fn</span> <span class="tok-fn">gaitAt</span>(index: i32) mpc.Gait {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (index) {
        <span class="tok-num">0</span> =&gt; mpc.Gait.stand,
        <span class="tok-num">1</span> =&gt; mpc.Gait.walk,
        <span class="tok-kw">else</span> =&gt; mpc.Gait.trot,
    };
}

<span class="tok-comment">// -- The cost weights, in state order [x y z | roll pitch yaw | vx vy vz | wx wy wz] --</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// * HEIGHT AND ATTITUDE ARE WEIGHTED FAR ABOVE POSITION, and that is not arbitrary. Where the</span>
<span class="tok-comment">// robot IS barely matters - it is walking, it is meant to move. How HIGH it is and which way</span>
<span class="tok-comment">// up it is matter enormously, because those are the two ways it falls over.</span>
<span class="tok-kw">const</span> state_weight = [_]f32{ <span class="tok-num">20</span>, <span class="tok-num">20</span>, <span class="tok-num">400</span>, <span class="tok-num">400</span>, <span class="tok-num">400</span>, <span class="tok-num">200</span>, <span class="tok-num">2</span>, <span class="tok-num">2</span>, <span class="tok-num">20</span>, <span class="tok-num">20</span>, <span class="tok-num">20</span>, <span class="tok-num">10</span> };
<span class="tok-kw">const</span> control_weight: [mpc.trunk_control_dim]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0.0005</span>);
<span class="tok-kw">const</span> terminal_weight = [_]f32{ <span class="tok-num">40</span>, <span class="tok-num">40</span>, <span class="tok-num">800</span>, <span class="tok-num">800</span>, <span class="tok-num">800</span>, <span class="tok-num">400</span>, <span class="tok-num">4</span>, <span class="tok-num">4</span>, <span class="tok-num">40</span>, <span class="tok-num">40</span>, <span class="tok-num">40</span>, <span class="tok-num">20</span> };

<span class="tok-kw">fn</span> <span class="tok-fn">weights</span>() mpc.Weights {
    <span class="tok-kw">return</span> .{ .state = &amp;state_weight, .control = &amp;control_weight, .terminal = &amp;terminal_weight };
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.gpa = gpa;
    s.trunk = .{
        .mass = <span class="tok-num">12.0</span>,
        .inertia = <span class="tok-fn">vec</span>(<span class="tok-num">0.017</span>, <span class="tok-num">0.057</span>, <span class="tok-num">0.064</span>),
        .gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">9.81</span>),
    };
    s.layout = .{
        .hip = .{
            <span class="tok-fn">vec</span>(<span class="tok-num">0.19</span>, -<span class="tok-num">0.13</span>, <span class="tok-num">0</span>),
            <span class="tok-fn">vec</span>(<span class="tok-num">0.19</span>, <span class="tok-num">0.13</span>, <span class="tok-num">0</span>),
            <span class="tok-fn">vec</span>(-<span class="tok-num">0.19</span>, -<span class="tok-num">0.13</span>, <span class="tok-num">0</span>),
            <span class="tok-fn">vec</span>(-<span class="tok-num">0.19</span>, <span class="tok-num">0.13</span>, <span class="tok-num">0</span>),
        },
        .feedback = <span class="tok-num">0.03</span>,
    };
    s.plan = <span class="tok-kw">try</span> mpc.TrunkPlan.<span class="tok-fn">init</span>(gpa, horizon_knots);
    <span class="tok-builtin">@memset</span>(s.plan.ctrl, <span class="tok-num">0</span>);

    s.gait_index = <span class="tok-num">0</span>;
    s.gait = <span class="tok-fn">gaitAt</span>(<span class="tok-num">0</span>);
    s.gait_phase = <span class="tok-num">0</span>;
    s.command = .{};
    s.running = true;
    s.accumulator = <span class="tok-num">0</span>;
    s.last_cost = <span class="tok-num">0</span>;
    s.solve_ms = <span class="tok-num">0</span>;
    s.frame_ms = <span class="tok-num">16.7</span>;
    <span class="tok-fn">resetRobot</span>(s);

    s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0</span>), <span class="tok-num">2.0</span>);
    s.font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font);
    s.cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    s.sphere = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">10</span>, <span class="tok-num">8</span>);
    s.transform = .{<span class="tok-fn">identity</span>()};
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.sphere);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cube);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    s.plan.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">resetRobot</span>(s: *State) void {
    <span class="tok-builtin">@memset</span>(&amp;s.trunk_state, <span class="tok-num">0</span>);
    s.trunk_state[mpc.pos_offset + <span class="tok-num">2</span>] = stand_height;
    s.gait_phase = <span class="tok-num">0</span>;
    s.accumulator = <span class="tok-num">0</span>;
    <span class="tok-builtin">@memset</span>(s.plan.ctrl, <span class="tok-num">0</span>);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..mpc.leg_count) |leg| {
        s.foot_planted[leg] = s.layout.hip[leg];
        s.foot_target[leg] = s.layout.hip[leg];
        s.foot_was_down[leg] = true;
    }
}

<span class="tok-comment">/// One control tick: decide where the feet are, plan the forces, apply the first knot.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** THIS FUNCTION IS THE PART THAT IS WRONG, AND IT IS WORTH KNOWING WHY --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Standing, it is exact. The moment a foot lifts it stops being exact, because of how the</span>
<span class="tok-comment">/// contact points are told to the planner over the horizon:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///   * a foot in stance NOW keeps ONE planted position for every knot - including knots after</span>
<span class="tok-comment">///     the schedule says it lifts and lands again;</span>
<span class="tok-comment">///   * a foot in swing NOW uses ONE target for every knot, likewise across two touchdowns.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Over a 0.4 s horizon of a 2 Hz trot that is a whole cycle of wrong moment arms, and the</span>
<span class="tok-comment">/// symptom is a robot that sags and drifts BACKWARD on a forward command. A backward drift is</span>
<span class="tok-comment">/// a sign error somewhere in `r x f`, not a bad gain - gains scale a response, they do not</span>
<span class="tok-comment">/// reverse it.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">controlTick</span>(s: *State) void {
    <span class="tok-comment">// -- *** YOU CANNOT TRANSLATE WITHOUT STEPPING, AND STAND HAS TO SAY SO --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// With `stand`, no foot ever lifts, so no foot is ever re-planted. Commanding a velocity</span>
    <span class="tok-comment">// anyway moves the REFERENCE while the contact points stay nailed to the ground, and the</span>
    <span class="tok-comment">// trunk walks out from over its own feet. The moment arm `r = foot - centre` then grows</span>
    <span class="tok-comment">// without bound and the planner cannot push up without tipping - so it correctly gives up</span>
    <span class="tok-comment">// vertical force and sags.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Measured in the demo before this guard: commanded 0.21 m/s sideways, the trunk drifted</span>
    <span class="tok-comment">// clear of its feet, vertical force fell to **34.25 N against a weight of 117.72**, and</span>
    <span class="tok-comment">// height sank from 0.300 to 0.206. Nothing was broken; the planner was handed a geometry</span>
    <span class="tok-comment">// with no solution and returned the least-bad one.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// A gait is what makes translation possible. Standing, the honest command is zero.</span>
    <span class="tok-kw">const</span> command: Command = <span class="tok-kw">if</span> (s.gait.duty &gt;= <span class="tok-num">1.0</span>) .{} <span class="tok-kw">else</span> s.command;
    <span class="tok-kw">const</span> state: []<span class="tok-kw">const</span> f32 = &amp;s.trunk_state;
    <span class="tok-kw">const</span> centre_now: Vec = <span class="tok-fn">vec</span>(
        state[mpc.pos_offset],
        state[mpc.pos_offset + <span class="tok-num">1</span>],
        state[mpc.pos_offset + <span class="tok-num">2</span>],
    );
    <span class="tok-kw">const</span> yaw_now: f32 = state[mpc.rpy_offset + <span class="tok-num">2</span>];
    <span class="tok-kw">const</span> here: mpc.Trunk = .{
        .position = centre_now,
        .yaw = yaw_now,
        .velocity = <span class="tok-fn">vec</span>(state[mpc.vel_offset], state[mpc.vel_offset + <span class="tok-num">1</span>], state[mpc.vel_offset + <span class="tok-num">2</span>]),
    };

    <span class="tok-comment">// Touchdown bookkeeping: a foot that has just landed adopts the spot chosen for it, and</span>
    <span class="tok-comment">// stays there. A foot in the air keeps aiming.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..mpc.leg_count) |leg_index| {
        <span class="tok-kw">const</span> leg: mpc.Leg = <span class="tok-builtin">@fromBackingInt</span>(<span class="tok-builtin">@intCast</span>(leg_index));
        <span class="tok-kw">const</span> down_now: bool = mpc.<span class="tok-fn">inStance</span>(s.gait, s.gait_phase, leg);
        <span class="tok-kw">if</span> (down_now <span class="tok-kw">and</span> !s.foot_was_down[leg_index]) {
            s.foot_planted[leg_index] = s.foot_target[leg_index];
        }
        <span class="tok-kw">if</span> (!down_now) {
            s.foot_target[leg_index] = mpc.<span class="tok-fn">footTarget</span>(
                s.layout,
                s.gait,
                here,
                command,
                leg,
                s.gait_phase,
                <span class="tok-num">0</span>,
            );
        }
        s.foot_was_down[leg_index] = down_now;
    }

    <span class="tok-comment">// The contact set across the horizon. `offset` is the moment arm `r` in `r x f`, so it is</span>
    <span class="tok-comment">// measured from where the trunk will BE at that knot, not from where it is now.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..horizon_knots) |knot| {
        <span class="tok-kw">const</span> phase_at_knot: f32 = s.gait_phase + s.gait.frequency * sim_timestep * <span class="tok-fn">float</span>(knot);
        <span class="tok-kw">var</span> stance: mpc.Stance = .{ .foot = <span class="tok-builtin">@splat</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>)), .active = <span class="tok-builtin">@splat</span>(false) };
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..mpc.leg_count) |leg_index| {
            <span class="tok-kw">const</span> leg: mpc.Leg = <span class="tok-builtin">@fromBackingInt</span>(<span class="tok-builtin">@intCast</span>(leg_index));
            stance.active[leg_index] = mpc.<span class="tok-fn">inStance</span>(s.gait, phase_at_knot, leg);
            <span class="tok-kw">const</span> contact_point: Vec = <span class="tok-kw">if</span> (mpc.<span class="tok-fn">inStance</span>(s.gait, s.gait_phase, leg))
                s.foot_planted[leg_index]
            <span class="tok-kw">else</span>
                s.foot_target[leg_index];
            stance.foot[leg_index] = contact_point;
        }
        s.plan.stance[knot] = stance;
    }

    mpc.<span class="tok-fn">buildTrunkReference</span>(&amp;s.plan, state, command, stand_height, sim_timestep);
    s.last_cost = mpc.<span class="tok-fn">solveTrunk</span>(
        s.trunk,
        &amp;s.plan,
        state,
        <span class="tok-fn">weights</span>(),
        <span class="tok-num">0.6</span>, <span class="tok-comment">// friction</span>
        <span class="tok-num">200.0</span>, <span class="tok-comment">// the most one foot may push, newtons</span>
        sim_timestep,
        <span class="tok-num">2</span>, <span class="tok-comment">// passes; the model is affine, so this is only chasing the yaw dependence</span>
    );

    s.trunk_state = mpc.<span class="tok-fn">srbdStep</span>(
        s.trunk,
        state,
        s.plan.ctrl[<span class="tok-num">0</span>..mpc.trunk_control_dim],
        s.plan.stance[<span class="tok-num">0</span>],
        sim_timestep,
    );
    s.gait_phase = mpc.<span class="tok-fn">advance</span>(s.gait, s.gait_phase, sim_timestep);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">const</span> captured: bool = <span class="tok-fn">drawPanel</span>(u, s, f.window.<span class="tok-fn">widthf</span>(), f.window.<span class="tok-fn">heightf</span>());

    s.frame_ms += (f.time.delta_time * <span class="tok-num">1000.0</span> - s.frame_ms) * <span class="tok-num">0.1</span>;
    <span class="tok-kw">if</span> (s.running) {
        s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
        <span class="tok-kw">while</span> (s.accumulator &gt;= sim_timestep) : (s.accumulator -= sim_timestep) {
            <span class="tok-fn">controlTick</span>(s);
        }
    }

    <span class="tok-comment">// The trunk falling through the floor is the failure mode, and a demo you have to reset by</span>
    <span class="tok-comment">// hand after every glance at it is a demo nobody looks at twice.</span>
    <span class="tok-kw">if</span> (s.trunk_state[mpc.pos_offset + <span class="tok-num">2</span>] &lt; -<span class="tok-num">0.5</span>) {
        <span class="tok-fn">resetRobot</span>(s);
    }

    z.<span class="tok-fn">clearViewport</span>(f, background);
    <span class="tok-kw">const</span> aspect: f32 = f.window.<span class="tok-fn">widthf</span>() / <span class="tok-builtin">@max</span>(<span class="tok-num">1.0</span>, f.window.<span class="tok-fn">heightf</span>());
    s.cam.distance = <span class="tok-fn">clamp</span>(<span class="tok-num">2.0</span> / <span class="tok-builtin">@max</span>(<span class="tok-num">0.35</span>, aspect), <span class="tok-num">1.4</span>, <span class="tok-num">5.0</span>);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, captured, .{ .min_distance = <span class="tok-num">0.8</span>, .max_distance = <span class="tok-num">8.0</span> });
    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    <span class="tok-fn">drawScene</span>(s, gl);
    z.<span class="tok-fn">endMode3D</span>(gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawScene</span>(s: *State, gl: *z.WgpuGl) void {
    z.<span class="tok-fn">drawGrid</span>(gl, <span class="tok-num">16</span>, <span class="tok-num">0.25</span>);

    <span class="tok-kw">const</span> centre: Vec = <span class="tok-fn">vec</span>(
        s.trunk_state[mpc.pos_offset],
        s.trunk_state[mpc.pos_offset + <span class="tok-num">1</span>],
        s.trunk_state[mpc.pos_offset + <span class="tok-num">2</span>],
    );

    <span class="tok-comment">// * THE PLANNED PATH, which is the point of drawing any of this: where the optimiser</span>
    <span class="tok-comment">// thinks the trunk is about to go, one faint segment per knot.</span>
    <span class="tok-kw">var</span> knot: usize = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (knot &lt;= horizon_knots) : (knot += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> previous: Vec = <span class="tok-fn">planPosition</span>(s, knot - <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> current: Vec = <span class="tok-fn">planPosition</span>(s, knot);
        z.<span class="tok-fn">drawLine3D</span>(gl, zm.<span class="tok-fn">zUpToYUpPoint</span>(previous), zm.<span class="tok-fn">zUpToYUpPoint</span>(current), ghost_colour);
    }

    <span class="tok-comment">// The trunk, oriented by roll-pitch-yaw.</span>
    <span class="tok-kw">const</span> roll: f32 = s.trunk_state[mpc.rpy_offset];
    <span class="tok-kw">const</span> pitch: f32 = s.trunk_state[mpc.rpy_offset + <span class="tok-num">1</span>];
    <span class="tok-kw">const</span> yaw: f32 = s.trunk_state[mpc.rpy_offset + <span class="tok-num">2</span>];
    <span class="tok-comment">// Renderer is Y-up, so the model's yaw about +z is a rotation about the renderer's +y.</span>
    <span class="tok-kw">const</span> orientation: zm.Mat = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">mulMat</span>(<span class="tok-fn">rotationY</span>(-yaw), <span class="tok-fn">rotationZ</span>(pitch)),
        <span class="tok-fn">rotationX</span>(roll),
    );
    <span class="tok-kw">const</span> drawn: Vec = zm.<span class="tok-fn">zUpToYUpPoint</span>(centre);
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(drawn[<span class="tok-num">0</span>], drawn[<span class="tok-num">1</span>], drawn[<span class="tok-num">2</span>]), orientation),
        <span class="tok-fn">scaling</span>(<span class="tok-num">0.38</span>, <span class="tok-num">0.10</span>, <span class="tok-num">0.22</span>),
    );
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, trunk_colour);

    <span class="tok-comment">// Feet, and the force each one is being asked for.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..mpc.leg_count) |leg_index| {
        <span class="tok-kw">const</span> leg: mpc.Leg = <span class="tok-builtin">@fromBackingInt</span>(<span class="tok-builtin">@intCast</span>(leg_index));
        <span class="tok-kw">const</span> down: bool = mpc.<span class="tok-fn">inStance</span>(s.gait, s.gait_phase, leg);
        <span class="tok-kw">const</span> foot: Vec = <span class="tok-kw">if</span> (down) s.foot_planted[leg_index] <span class="tok-kw">else</span> <span class="tok-fn">swingFootPosition</span>(s, leg, leg_index);
        <span class="tok-kw">const</span> rendered: Vec = zm.<span class="tok-fn">zUpToYUpPoint</span>(foot);
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
            <span class="tok-fn">translation</span>(rendered[<span class="tok-num">0</span>], rendered[<span class="tok-num">1</span>], rendered[<span class="tok-num">2</span>]),
            <span class="tok-fn">scaling</span>(<span class="tok-num">0.035</span>, <span class="tok-num">0.035</span>, <span class="tok-num">0.035</span>),
        );
        z.<span class="tok-fn">drawMeshInstanced</span>(
            gl,
            &amp;s.sphere,
            &amp;s.transform,
            <span class="tok-kw">if</span> (down) stance_foot_colour <span class="tok-kw">else</span> swing_foot_colour,
        );

        <span class="tok-comment">// * THE FORCE ARROW IS THE INTERESTING PART. Standing, all four are equal and vertical;</span>
        <span class="tok-comment">// lean the command and you can watch the load move onto the feet that can act on it.</span>
        <span class="tok-comment">// 0.004 m per newton puts a 29 N hold at about 12 cm - readable without swamping the</span>
        <span class="tok-comment">// robot.</span>
        <span class="tok-kw">if</span> (down) {
            <span class="tok-kw">const</span> force: Vec = <span class="tok-fn">vec</span>(
                s.plan.ctrl[<span class="tok-num">3</span> * leg_index],
                s.plan.ctrl[<span class="tok-num">3</span> * leg_index + <span class="tok-num">1</span>],
                s.plan.ctrl[<span class="tok-num">3</span> * leg_index + <span class="tok-num">2</span>],
            );
            <span class="tok-kw">const</span> tip: Vec = foot + force * <span class="tok-fn">splat</span>(<span class="tok-num">0.004</span>);
            z.<span class="tok-fn">drawLine3D</span>(gl, rendered, zm.<span class="tok-fn">zUpToYUpPoint</span>(tip), force_colour);
        } <span class="tok-kw">else</span> {
            <span class="tok-comment">// Where this foot is going to land.</span>
            <span class="tok-kw">const</span> target: Vec = zm.<span class="tok-fn">zUpToYUpPoint</span>(s.foot_target[leg_index]);
            s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(target[<span class="tok-num">0</span>], target[<span class="tok-num">1</span>], target[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.02</span>, <span class="tok-num">0.005</span>, <span class="tok-num">0.02</span>));
            z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, target_colour);
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">planPosition</span>(s: *<span class="tok-kw">const</span> State, knot: usize) Vec {
    <span class="tok-kw">const</span> base: usize = knot * mpc.trunk_state_dim;
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(
        s.plan.states[base + mpc.pos_offset],
        s.plan.states[base + mpc.pos_offset + <span class="tok-num">1</span>],
        s.plan.states[base + mpc.pos_offset + <span class="tok-num">2</span>],
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">swingFootPosition</span>(s: *<span class="tok-kw">const</span> State, leg: mpc.Leg, leg_index: usize) Vec {
    <span class="tok-kw">const</span> progress: f32 = mpc.<span class="tok-fn">swingProgress</span>(s.gait, s.gait_phase, leg);
    <span class="tok-kw">return</span> mpc.<span class="tok-fn">swingPoint</span>(s.foot_planted[leg_index], s.foot_target[leg_index], <span class="tok-num">0.06</span>, progress);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(u: ui.Ui, s: *State, viewport_w: f32, viewport_h: f32) bool {
    <span class="tok-kw">const</span> captured: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    <span class="tok-kw">const</span> narrow: bool = ui.Ui.<span class="tok-fn">isNarrow</span>(viewport_w);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-kw">if</span> (narrow) viewport_w - <span class="tok-num">16</span> <span class="tok-kw">else</span> <span class="tok-builtin">@min</span>(<span class="tok-num">460.0</span>, viewport_w * <span class="tok-num">0.36</span>);

    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-builtin">@min</span>(<span class="tok-num">520.0</span>, viewport_h * <span class="tok-num">0.74</span>) }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"quadruped trunk planner"</span>, .{})) |window| {
        <span class="tok-kw">defer</span> window.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"height {d:&gt;6.3} m   (target {d:.3})"</span>, .{ s.trunk_state[mpc.pos_offset + <span class="tok-num">2</span>], stand_height });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"tilt   {d:&gt;6.3} rad roll, {d:&gt;6.3} pitch"</span>, .{
            s.trunk_state[mpc.rpy_offset],
            s.trunk_state[mpc.rpy_offset + <span class="tok-num">1</span>],
        });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"travelled {d:&gt;6.3} m"</span>, .{s.trunk_state[mpc.pos_offset]});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"cost {d:.1}   frame {d:.1} ms"</span>, .{ s.last_cost, s.frame_ms });
        u.<span class="tok-fn">separator</span>();

        <span class="tok-kw">var</span> total_vertical: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..mpc.leg_count) |leg| {
            total_vertical += s.plan.ctrl[<span class="tok-num">3</span> * leg + <span class="tok-num">2</span>];
        }
        u.<span class="tok-fn">text</span>(<span class="tok-str">"vertical force {d:&gt;7.2} N"</span>, .{total_vertical});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"weight         {d:&gt;7.2} N"</span>, .{s.trunk.mass * <span class="tok-num">9.81</span>});

        <span class="tok-comment">// * HOW FAR THE TRUNK HAS WANDERED OFF ITS OWN FEET. This is the number that explains</span>
        <span class="tok-comment">// a sagging robot: once the centre leaves the polygon the feet make, no set of upward</span>
        <span class="tok-comment">// forces can hold it level, and the planner trades height for not tipping. Watching</span>
        <span class="tok-comment">// vertical force sag without this is watching a symptom.</span>
        <span class="tok-kw">var</span> foot_centre: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
        <span class="tok-kw">for</span> (s.foot_planted) |foot| {
            foot_centre += foot;
        }
        foot_centre *= <span class="tok-fn">splat</span>(<span class="tok-num">1.0</span> / <span class="tok-fn">float</span>(mpc.leg_count));
        <span class="tok-kw">const</span> offset: f32 = <span class="tok-builtin">@sqrt</span>(
            (s.trunk_state[mpc.pos_offset] - foot_centre[<span class="tok-num">0</span>]) *
                (s.trunk_state[mpc.pos_offset] - foot_centre[<span class="tok-num">0</span>]) +
                (s.trunk_state[mpc.pos_offset + <span class="tok-num">1</span>] - foot_centre[<span class="tok-num">1</span>]) *
                    (s.trunk_state[mpc.pos_offset + <span class="tok-num">1</span>] - foot_centre[<span class="tok-num">1</span>]),
        );
        u.<span class="tok-fn">text</span>(<span class="tok-str">"trunk off feet {d:&gt;7.3} m  (support ~0.19)"</span>, .{offset});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-kw">if</span> (s.gait.duty &gt;= <span class="tok-num">1.0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"standing: velocity commands are ignored"</span>, .{});
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  (no foot lifts, so none can be re-placed)"</span>, .{});
        }
        <span class="tok-kw">if</span> (u.<span class="tok-fn">combo</span>(<span class="tok-str">"gait"</span>, &amp;s.gait_index, &amp;gait_names, .{})) {
            s.gait = <span class="tok-fn">gaitAt</span>(s.gait_index);
            <span class="tok-fn">resetRobot</span>(s);
        }
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"forward m/s"</span>, &amp;s.command.forward, .{ .min = -<span class="tok-num">0.6</span>, .max = <span class="tok-num">0.6</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"lateral m/s"</span>, &amp;s.command.lateral, .{ .min = -<span class="tok-num">0.4</span>, .max = <span class="tok-num">0.4</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"turn rad/s"</span>, &amp;s.command.yaw_rate, .{ .min = -<span class="tok-num">1.5</span>, .max = <span class="tok-num">1.5</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"run"</span>, &amp;s.running);
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"reset"</span>, .{})) {
            <span class="tok-fn">resetRobot</span>(s);
        }
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"stop still"</span>, .{})) {
            s.command = .{};
        }
    }
    <span class="tok-kw">return</span> captured;
}
