<h1>decals</h1>
<figure class="code src-file" data-path="examples/decals/decals.zig" data-lines="414"><figcaption><span>examples/decals/decals.zig</span><span>414 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! decals - raylib's `models_decals`, done the real-engine way.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Click a surface (the sphere or the bunny) to splat a textured DECAL onto</span>
<span class="tok-comment">//! it. Each decal is SHADER-PROJECTED: the receiver mesh is re-drawn through a</span>
<span class="tok-comment">//! decal pipeline whose fragment shader transforms each fragment's world</span>
<span class="tok-comment">//! position by a projector matrix (world -&gt; decal-box space), discards anything</span>
<span class="tok-comment">//! outside the box, and samples the decal texture at the planar box UV where it</span>
<span class="tok-comment">//! lands. So a decal "paints" exactly the surface patch under its projector -</span>
<span class="tok-comment">//! it wraps around curvature and follows the geometry with no mesh clipping,</span>
<span class="tok-comment">//! and scales to any mesh density (the 69k-tri bunny is no problem). This is</span>
<span class="tok-comment">//! how engines do bullet holes and scorch marks.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! An earlier version clipped the target mesh per-triangle (Sutherland-Hodgman</span>
<span class="tok-comment">//! against the box) and re-uploaded the clipped geometry. That works on coarse</span>
<span class="tok-comment">//! meshes but shatters on dense ones - thousands of tiny triangles fall in one</span>
<span class="tok-comment">//! box and a fixed output cap captures a scattered subset. The shader path</span>
<span class="tok-comment">//! replaces it entirely.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Engine additions this drove: `z.uploadDecalReceiver` (upload a mesh once as</span>
<span class="tok-comment">//! a decal receiver) + `z.drawDecal` (paint a projected decal onto it), backed</span>
<span class="tok-comment">//! by a dedicated decal pipeline in draw3d with the decal_vs/decal_fs shaders</span>
<span class="tok-comment">//! and a `less_equal_no_write` depth mode.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Ray = zm.Ray;
<span class="tok-kw">const</span> RayCollision = zm.RayCollision;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> inverse = zm.inverse;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> compose = zm.compose;
<span class="tok-kw">const</span> mulMatVec = zm.mulMatVec;
<span class="tok-kw">const</span> pointVec = zm.pointVec;
<span class="tok-kw">const</span> rotationZ = zm.rotationZ;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> dot3 = zm.dot3;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> rad_per_deg = zm.rad_per_deg;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> bunny_obj = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"bunny.obj"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-comment">// Bunny placement: recenter its AABB, scale up, and shove it to the right of</span>
<span class="tok-comment">// the sphere. Baked into the mesh vertices so pick-space == draw-space (both</span>
<span class="tok-comment">// use an identity transform).</span>
<span class="tok-kw">const</span> bunny_center: [<span class="tok-num">3</span>]f32 = .{ -<span class="tok-num">0.0168</span>, <span class="tok-num">0.1102</span>, -<span class="tok-num">0.0015</span> };
<span class="tok-kw">const</span> bunny_scale: f32 = <span class="tok-num">22.0</span>;
<span class="tok-kw">const</span> bunny_offset: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">4.2</span>, -<span class="tok-num">1.6</span>, <span class="tok-num">0.0</span> };

<span class="tok-kw">const</span> sphere_radius: f32 = <span class="tok-num">2.0</span>;
<span class="tok-kw">const</span> decal_size: f32 = <span class="tok-num">1.1</span>; <span class="tok-comment">// world extent of a decal box</span>
<span class="tok-kw">const</span> max_decals: usize = <span class="tok-num">64</span>;

<span class="tok-comment">/// A recorded decal: the world-&gt;box projector, its tint, and which receiver</span>
<span class="tok-comment">/// (sphere or bunny) it paints onto. The GPU does the projection each frame.</span>
<span class="tok-kw">const</span> Decal = <span class="tok-kw">struct</span> {
    projector: Mat,
    forward: Vec, <span class="tok-comment">// projector facing dir = surface normal at the hit</span>
    color: Color,
    receiver: u32, <span class="tok-comment">// decal-receiver handle</span>
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    ui_host: z.UiHost,
    cam: z.OrbitCamera,
    mesh: z.Mesh, <span class="tok-comment">// CPU sphere (for picking)</span>
    sphere_model: z.Model, <span class="tok-comment">// GPU sphere for drawing (same mesh as the receiver)</span>
    bunny: z.Mesh, <span class="tok-comment">// CPU bunny (for picking)</span>
    bunny_model: z.Model, <span class="tok-comment">// GPU bunny for drawing</span>
    sphere_recv: u32, <span class="tok-comment">// decal-receiver handle for the sphere</span>
    bunny_recv: u32, <span class="tok-comment">// decal-receiver handle for the bunny</span>
    decal_tex: z.WgpuTexture,
    decals: [max_decals]Decal = undefined,
    decal_count: usize = <span class="tok-num">0</span>,
    show_target: bool = true,
    rng: u32 = <span class="tok-num">0x1234abcd</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    <span class="tok-comment">// sphere_model/bunny_model COPY the mesh struct (shared vboId + CPU array</span>
    <span class="tok-comment">// pointers), so unloadModel is the single owner of those buffers+arrays -</span>
    <span class="tok-comment">// freeing s.mesh/s.bunny too would double-free (they're the same handles).</span>
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.<span class="tok-fn">unloadModel</span>(gpa, s.sphere_model);
    z.<span class="tok-fn">unloadModel</span>(gpa, s.bunny_model);
    s.decal_tex.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Parse the bunny .obj and bake recenter + scale + world offset into a</span>
<span class="tok-comment">/// `z.Mesh` (interleaved xyz verts + u16 indices), so picking, decal</span>
<span class="tok-comment">/// projection, and drawing all share one world-space coordinate frame.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">loadBunny</span>(gpa: Allocator) !z.Mesh {
    <span class="tok-kw">var</span> data: z.codecs.obj.Data = <span class="tok-kw">try</span> z.codecs.obj.<span class="tok-fn">parse</span>(gpa, bunny_obj);
    <span class="tok-kw">defer</span> data.<span class="tok-fn">deinit</span>(gpa);
    <span class="tok-kw">const</span> om: z.codecs.obj.Mesh = <span class="tok-kw">try</span> data.<span class="tok-fn">toMesh</span>(gpa);
    <span class="tok-kw">defer</span> om.<span class="tok-fn">deinit</span>(gpa);

    <span class="tok-kw">const</span> vcount: usize = om.<span class="tok-fn">vertexCount</span>();
    <span class="tok-kw">const</span> tris: usize = om.indices.len / <span class="tok-num">3</span>;
    <span class="tok-kw">const</span> verts: []f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vcount * <span class="tok-num">3</span>);
    <span class="tok-kw">const</span> norms: []f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vcount * <span class="tok-num">3</span>);
    <span class="tok-kw">const</span> idx: []u16 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u16, tris * <span class="tok-num">3</span>);

    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; vcount) : (i += <span class="tok-num">1</span>) {
        <span class="tok-comment">// Bake: (p - center) * scale + offset.</span>
        verts[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>] = (om.positions[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>] - bunny_center[<span class="tok-num">0</span>]) * bunny_scale + bunny_offset[<span class="tok-num">0</span>];
        verts[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>] = (om.positions[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>] - bunny_center[<span class="tok-num">1</span>]) * bunny_scale + bunny_offset[<span class="tok-num">1</span>];
        verts[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] = (om.positions[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] - bunny_center[<span class="tok-num">2</span>]) * bunny_scale + bunny_offset[<span class="tok-num">2</span>];
        <span class="tok-comment">// `toMesh` always populates normals - it synthesizes smooth per-vertex</span>
        <span class="tok-comment">// normals when the OBJ has no `vn` (bunny.obj has none). So use them</span>
        <span class="tok-comment">// directly; the decal facing test depends on real normals.</span>
        norms[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>] = om.normals[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>];
        norms[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>] = om.normals[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>];
        norms[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] = om.normals[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>];
    }
    <span class="tok-kw">for</span> (om.indices, <span class="tok-num">0</span>..) |ix, k| {
        idx[k] = <span class="tok-builtin">@intCast</span>(ix);
    }

    <span class="tok-kw">var</span> mesh: z.Mesh = .{};
    mesh.vertexCount = <span class="tok-builtin">@intCast</span>(vcount);
    mesh.triangleCount = <span class="tok-builtin">@intCast</span>(tris);
    mesh.vertices = verts.ptr;
    mesh.normals = norms.ptr;
    mesh.indices = idx.ptr;
    <span class="tok-kw">return</span> mesh;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    <span class="tok-kw">const</span> mesh: z.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, sphere_radius, <span class="tok-num">32</span>, <span class="tok-num">24</span>);
    <span class="tok-kw">const</span> sphere_model: z.Model = <span class="tok-kw">try</span> z.<span class="tok-fn">loadModelFromMesh</span>(f.gl, gpa, mesh);
    <span class="tok-kw">const</span> bunny: z.Mesh = <span class="tok-kw">try</span> <span class="tok-fn">loadBunny</span>(gpa);
    <span class="tok-kw">const</span> bunny_model: z.Model = <span class="tok-kw">try</span> z.<span class="tok-fn">loadModelFromMesh</span>(f.gl, gpa, bunny);
    <span class="tok-comment">// Upload both targets as decal receivers (pos+normal VBOs, once). Decals are</span>
    <span class="tok-comment">// painted onto these by re-drawing them through the projector shader. Both</span>
    <span class="tok-comment">// targets are drawn as MODELS from the SAME meshes used as receivers, so the</span>
    <span class="tok-comment">// drawn surface and the decal surface are identical geometry (no mismatch).</span>
    <span class="tok-kw">const</span> sphere_recv: u32 = z.<span class="tok-fn">uploadDecalReceiver</span>(f.gl, mesh) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-kw">error</span>.DecalReceiverFailed;
    <span class="tok-kw">const</span> bunny_recv: u32 = z.<span class="tok-fn">uploadDecalReceiver</span>(f.gl, bunny) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-kw">error</span>.DecalReceiverFailed;
    <span class="tok-kw">var</span> cam: z.OrbitCamera = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">pointVec</span>(<span class="tok-num">1.6</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">9.0</span>);
    cam.yaw = <span class="tok-num">0.7</span>;
    cam.pitch = <span class="tok-num">0.4</span>;
    <span class="tok-kw">const</span> decal_img: z.Image = <span class="tok-kw">try</span> <span class="tok-fn">makeDecalImage</span>(gpa);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadImage</span>(gpa, decal_img);
    s.* = .{
        .font = font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .cam = cam,
        .mesh = mesh,
        .sphere_model = sphere_model,
        .bunny = bunny,
        .bunny_model = bunny_model,
        .sphere_recv = sphere_recv,
        .bunny_recv = bunny_recv,
        .decal_tex = z.<span class="tok-fn">loadTextureFromImage</span>(f.gl, decal_img),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">xorshift</span>(state: *u32) u32 {
    <span class="tok-kw">var</span> x: u32 = state.*;
    x ^= x &lt;&lt; <span class="tok-num">13</span>;
    x ^= x &gt;&gt; <span class="tok-num">17</span>;
    x ^= x &lt;&lt; <span class="tok-num">5</span>;
    state.* = x;
    <span class="tok-kw">return</span> x;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, u.<span class="tok-fn">wantCaptureMouse</span>(), .{
        .min_distance = <span class="tok-num">4.0</span>,
        .max_distance = <span class="tok-num">20.0</span>,
    });

    <span class="tok-comment">// ---- pick the surface under the cursor (test both targets, keep nearer) ----</span>
    <span class="tok-kw">const</span> m: zm.Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> ray: Ray = z.<span class="tok-fn">getScreenToWorldRay</span>(m, cam, vw, vh);
    <span class="tok-kw">const</span> hit_sphere: RayCollision = z.<span class="tok-fn">getRayCollisionMesh</span>(ray, s.mesh, zm.<span class="tok-fn">identity</span>());
    <span class="tok-kw">const</span> hit_bunny: RayCollision = z.<span class="tok-fn">getRayCollisionMesh</span>(ray, s.bunny, zm.<span class="tok-fn">identity</span>());
    <span class="tok-kw">var</span> hit: RayCollision = hit_sphere;
    <span class="tok-kw">var</span> receiver: u32 = s.sphere_recv;
    <span class="tok-kw">if</span> (hit_bunny.hit <span class="tok-kw">and</span> (!hit_sphere.hit <span class="tok-kw">or</span> hit_bunny.distance &lt; hit_sphere.distance)) {
        hit = hit_bunny;
        receiver = s.bunny_recv;
    }
    <span class="tok-comment">// `getRayCollisionTriangle` derives the normal from cross(edge1, edge2),</span>
    <span class="tok-comment">// whose sign depends on triangle WINDING - genMeshSphereLegacy is CW-wound, so its</span>
    <span class="tok-comment">// hit normal points INWARD (opposite the surface's outward vertex normals),</span>
    <span class="tok-comment">// while the OBJ bunny is CCW so its points outward. That inconsistency made</span>
    <span class="tok-comment">// the decal facing test reject the whole sphere. Fix winding-independently:</span>
    <span class="tok-comment">// the visible surface always faces the ray origin, so flip the normal to</span>
    <span class="tok-comment">// point back toward the camera.</span>
    <span class="tok-kw">if</span> (hit.hit) {
        <span class="tok-kw">const</span> to_eye: Vec = <span class="tok-fn">vec</span>(
            ray.position[<span class="tok-num">0</span>] - hit.point[<span class="tok-num">0</span>],
            ray.position[<span class="tok-num">1</span>] - hit.point[<span class="tok-num">1</span>],
            ray.position[<span class="tok-num">2</span>] - hit.point[<span class="tok-num">2</span>],
        );
        <span class="tok-kw">if</span> (<span class="tok-fn">dot3</span>(hit.normal, to_eye) &lt; <span class="tok-num">0</span>) {
            hit.normal = <span class="tok-fn">vec</span>(-hit.normal[<span class="tok-num">0</span>], -hit.normal[<span class="tok-num">1</span>], -hit.normal[<span class="tok-num">2</span>]);
        }
    }

    <span class="tok-comment">// ---- click: splat a decal on whichever target was hit ----</span>
    <span class="tok-kw">if</span> (hit.hit <span class="tok-kw">and</span> !u.<span class="tok-fn">wantCaptureMouse</span>() <span class="tok-kw">and</span> z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        <span class="tok-fn">placeDecal</span>(s, hit, receiver);
    }

    <span class="tok-comment">// ---- UI ----</span>
    <span class="tok-fn">controlPanel</span>(u, s, vw, vh);

    <span class="tok-comment">// ---- render ----</span>
    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam);
    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">12</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">if</span> (s.show_target) {
        <span class="tok-comment">// Both targets drawn the SAME way - as models from the exact meshes used</span>
        <span class="tok-comment">// as decal receivers, so drawn surface == decal surface for both.</span>
        z.<span class="tok-fn">drawModel</span>(f.gl, s.sphere_model, <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">1.0</span>, .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">130</span>, .b = <span class="tok-num">150</span>, .a = <span class="tok-num">255</span> });
        z.<span class="tok-fn">drawModel</span>(f.gl, s.bunny_model, <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">1.0</span>, .{ .r = <span class="tok-num">150</span>, .g = <span class="tok-num">140</span>, .b = <span class="tok-num">130</span>, .a = <span class="tok-num">255</span> });
    }
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.decal_count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> d: *<span class="tok-kw">const</span> Decal = &amp;s.decals[i];
        z.<span class="tok-fn">drawDecal</span>(f.gl, d.receiver, d.projector, s.decal_tex, .{
            .size = decal_size,
            .tint = d.color,
            .forward = d.forward,
        });
    }
    <span class="tok-comment">// Placement preview: a wire box oriented like the decal-to-be.</span>
    <span class="tok-kw">if</span> (hit.hit <span class="tok-kw">and</span> !u.<span class="tok-fn">wantCaptureMouse</span>()) {
        <span class="tok-fn">drawPreview</span>(f, hit);
    }
    z.<span class="tok-fn">endMode3D</span>(f.gl);

    <span class="tok-comment">// ---- HUD ----</span>
    <span class="tok-kw">var</span> buf: [<span class="tok-num">80</span>]u8 = undefined;
    <span class="tok-kw">const</span> hud: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf,
        <span class="tok-str">"decals: {d}/{d}   click to splat"</span>,
        .{ s.decal_count, max_decals },
    ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">14</span>, <span class="tok-num">42</span> }, hud, .{ .size = <span class="tok-num">18</span>, .color = common.palette.ink_dim, .font = &amp;s.font });

    <span class="tok-comment">// ---- DEBUG: show the last hit + first decal vertex to diagnose placement ----</span>
    <span class="tok-kw">if</span> (hit.hit) {
        <span class="tok-kw">var</span> dbg: [<span class="tok-num">128</span>]u8 = undefined;
        <span class="tok-kw">const</span> d1: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
            &amp;dbg,
            <span class="tok-str">"hit ({d:.2},{d:.2},{d:.2}) n({d:.2},{d:.2},{d:.2})"</span>,
            .{ hit.point[<span class="tok-num">0</span>], hit.point[<span class="tok-num">1</span>], hit.point[<span class="tok-num">2</span>], hit.normal[<span class="tok-num">0</span>], hit.normal[<span class="tok-num">1</span>], hit.normal[<span class="tok-num">2</span>] },
        ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
        f.gl.<span class="tok-fn">text</span>(
            .{ <span class="tok-num">14</span>, <span class="tok-num">66</span> },
            d1,
            .{ .size = <span class="tok-num">15</span>, .color = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">230</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
        );
    }

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"WebGPU 3D - projected decals (click sphere or bunny; drag to orbit)"</span>);
    s.ui_host.<span class="tok-fn">render</span>(f);
}

<span class="tok-comment">/// Record a decal at the hit: build the world-&gt;box projector and store it with</span>
<span class="tok-comment">/// the receiver handle. The GPU projects + paints it each frame (no clipping).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">placeDecal</span>(s: *State, hit: RayCollision, receiver: u32) void {
    <span class="tok-kw">if</span> (s.decal_count &gt;= max_decals) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-comment">// Projection: look from just outside the surface toward the hit point,</span>
    <span class="tok-comment">// spun a random amount about its own axis (raylib's `splat`).</span>
    <span class="tok-kw">const</span> eye: Vec = <span class="tok-fn">vec</span>(
        hit.point[<span class="tok-num">0</span>] + hit.normal[<span class="tok-num">0</span>],
        hit.point[<span class="tok-num">1</span>] + hit.normal[<span class="tok-num">1</span>],
        hit.point[<span class="tok-num">2</span>] + hit.normal[<span class="tok-num">2</span>],
    );
    <span class="tok-kw">const</span> look: Mat = <span class="tok-fn">lookAtRh</span>(hit.point, eye, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> spin_deg: f32 = <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(<span class="tok-fn">xorshift</span>(&amp;s.rng) % <span class="tok-num">360</span>)) - <span class="tok-num">180</span>);
    <span class="tok-comment">// Apply the world-&gt;box `look`, then spin in-plane (spin acting in box space).</span>
    <span class="tok-comment">// `compose(first, then)` reads in application order.</span>
    <span class="tok-kw">const</span> projector: Mat = <span class="tok-fn">compose</span>(look, <span class="tok-fn">rotationZ</span>(spin_deg * rad_per_deg));

    s.decals[s.decal_count] = .{
        .projector = projector,
        .forward = <span class="tok-fn">vec</span>(hit.normal[<span class="tok-num">0</span>], hit.normal[<span class="tok-num">1</span>], hit.normal[<span class="tok-num">2</span>]),
        .color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> },
        .receiver = receiver,
    };
    s.decal_count += <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPreview</span>(f: *z.Frame, hit: RayCollision) void {
    <span class="tok-comment">// Show the ACTUAL oriented decal box at the hit: the 8 corners of the</span>
    <span class="tok-comment">// [-s, s]^3 box transformed by the inverse projection into world space,</span>
    <span class="tok-comment">// drawn as edges. This is the ground-truth cursor - if a decal doesn't</span>
    <span class="tok-comment">// land inside this box, the projection is wrong.</span>
    <span class="tok-kw">const</span> eye: Vec = <span class="tok-fn">vec</span>(
        hit.point[<span class="tok-num">0</span>] + hit.normal[<span class="tok-num">0</span>],
        hit.point[<span class="tok-num">1</span>] + hit.normal[<span class="tok-num">1</span>],
        hit.point[<span class="tok-num">2</span>] + hit.normal[<span class="tok-num">2</span>],
    );
    <span class="tok-kw">const</span> look: Mat = <span class="tok-fn">lookAtRh</span>(hit.point, eye, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> inv_proj: Mat = <span class="tok-fn">inverse</span>(look);
    <span class="tok-kw">const</span> s: f32 = <span class="tok-num">0.5</span> * decal_size;
    <span class="tok-kw">var</span> c: [<span class="tok-num">8</span>]Vec = undefined;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> ([_]f32{ -<span class="tok-num">1</span>, <span class="tok-num">1</span> }) |sx| {
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> ([_]f32{ -<span class="tok-num">1</span>, <span class="tok-num">1</span> }) |sy| {
            <span class="tok-kw">inline</span> <span class="tok-kw">for</span> ([_]f32{ -<span class="tok-num">1</span>, <span class="tok-num">1</span> }) |sz| {
                c[i] = <span class="tok-fn">mulMatVec</span>(inv_proj, <span class="tok-fn">pointVec</span>(sx * s, sy * s, sz * s));
                i += <span class="tok-num">1</span>;
            }
        }
    }
    <span class="tok-kw">const</span> col: Color = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">230</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-comment">// 12 edges of the box (corner index bit pattern: x=bit2, y=bit1, z=bit0).</span>
    <span class="tok-kw">const</span> edges = [_][<span class="tok-num">2</span>]usize{
        .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .{ <span class="tok-num">2</span>, <span class="tok-num">3</span> }, .{ <span class="tok-num">4</span>, <span class="tok-num">5</span> }, .{ <span class="tok-num">6</span>, <span class="tok-num">7</span> }, <span class="tok-comment">// z edges</span>
        .{ <span class="tok-num">0</span>, <span class="tok-num">2</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">3</span> }, .{ <span class="tok-num">4</span>, <span class="tok-num">6</span> }, .{ <span class="tok-num">5</span>, <span class="tok-num">7</span> }, <span class="tok-comment">// y edges</span>
        .{ <span class="tok-num">0</span>, <span class="tok-num">4</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">5</span> }, .{ <span class="tok-num">2</span>, <span class="tok-num">6</span> }, .{ <span class="tok-num">3</span>, <span class="tok-num">7</span> }, <span class="tok-comment">// x edges</span>
    };
    <span class="tok-kw">for</span> (edges) |e| {
        z.<span class="tok-fn">drawLine3D</span>(f.gl, c[e[<span class="tok-num">0</span>]], c[e[<span class="tok-num">1</span>]], col);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">controlPanel</span>(u: z.ui_real.Ui, s: *State, vw: f32, vh: f32) void {
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">66</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ <span class="tok-builtin">@min</span>(<span class="tok-num">320</span>, vw - <span class="tok-num">16</span>), <span class="tok-num">58</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"decals"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-kw">if</span> (s.show_target) <span class="tok-str">"hide target"</span> <span class="tok-kw">else</span> <span class="tok-str">"show target"</span>, .{})) {
            s.show_target = !s.show_target;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"clear"</span>, .{})) {
            s.decal_count = <span class="tok-num">0</span>;
        }
    }
}

<span class="tok-comment">/// The decal sticker: a bright ring/target with a transparent surround so the</span>
<span class="tok-comment">/// decal edges fade rather than showing box seams.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">makeDecalImage</span>(gpa: Allocator) !z.Image {
    <span class="tok-kw">const</span> n: usize = <span class="tok-num">64</span>;
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">genImageColor</span>(gpa, <span class="tok-builtin">@intCast</span>(n), <span class="tok-builtin">@intCast</span>(n), .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">0</span> });
    <span class="tok-kw">const</span> px: [*]u8 = <span class="tok-builtin">@ptrCast</span>(img.data.?);
    <span class="tok-kw">const</span> c: f32 = <span class="tok-fn">float</span>(n) * <span class="tok-num">0.5</span> - <span class="tok-num">0.5</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |y| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |x| {
            <span class="tok-kw">const</span> dx: f32 = <span class="tok-fn">float</span>(x) - c;
            <span class="tok-kw">const</span> dy: f32 = <span class="tok-fn">float</span>(y) - c;
            <span class="tok-kw">const</span> r: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy) / c;
            <span class="tok-kw">var</span> a: u8 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> col: [<span class="tok-num">3</span>]u8 = .{ <span class="tok-num">255</span>, <span class="tok-num">220</span>, <span class="tok-num">60</span> };
            <span class="tok-comment">// Fade the ring fully to transparent by r~0.72 - well inside the</span>
            <span class="tok-comment">// decal box's edges - so the box side-plane clip only ever cuts</span>
            <span class="tok-comment">// already-transparent texels and never leaves a hard straight edge.</span>
            <span class="tok-kw">if</span> (r &lt; <span class="tok-num">0.72</span>) {
                a = <span class="tok-num">255</span>;
                <span class="tok-comment">// Concentric rings (packed into the inner 0.7 radius).</span>
                <span class="tok-kw">const</span> band: f32 = <span class="tok-builtin">@mod</span>(r * <span class="tok-num">5.0</span>, <span class="tok-num">1.0</span>);
                <span class="tok-kw">if</span> (band &lt; <span class="tok-num">0.5</span>) {
                    col = .{ <span class="tok-num">230</span>, <span class="tok-num">60</span>, <span class="tok-num">60</span> };
                } <span class="tok-kw">else</span> {
                    col = .{ <span class="tok-num">255</span>, <span class="tok-num">220</span>, <span class="tok-num">60</span> };
                }
                <span class="tok-kw">if</span> (r &gt; <span class="tok-num">0.55</span>) {
                    a = <span class="tok-builtin">@round</span>(<span class="tok-num">255.0</span> * (<span class="tok-num">0.72</span> - r) / <span class="tok-num">0.17</span>);
                }
            }
            <span class="tok-kw">const</span> i: usize = (y * n + x) * <span class="tok-num">4</span>;
            px[i + <span class="tok-num">0</span>] = col[<span class="tok-num">0</span>];
            px[i + <span class="tok-num">1</span>] = col[<span class="tok-num">1</span>];
            px[i + <span class="tok-num">2</span>] = col[<span class="tok-num">2</span>];
            px[i + <span class="tok-num">3</span>] = a;
        }
    }
    <span class="tok-kw">return</span> img;
}
