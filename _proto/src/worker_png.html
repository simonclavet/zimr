<h1>worker_png</h1>
<figure class="code src-file" data-path="examples/worker_png/worker_png.zig" data-lines="346"><figcaption><span>examples/worker_png/worker_png.zig</span><span>346 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! worker_png - start a task on a worker, and watch the frame NOT freeze.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! `codecs.png.encode` of a 1024x1024 image costs ~240 ms in wasm on a phone.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * On the MAIN THREAD that is a 233 ms frozen frame - fourteen dropped frames. The</span>
<span class="tok-comment">//!     orbiting dot below stops dead, and the "worst frame gap" readout says so.</span>
<span class="tok-comment">//!   * On a WORKER the encode still takes ~222 ms, but the worst frame gap is 17 ms.</span>
<span class="tok-comment">//!     Nothing stalls. The dot never even flickers.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The job is not FASTER. It is ELSEWHERE, and elsewhere is the whole feature.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Tap either button and watch the dot. That is the demo.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! (Where workers are unavailable - a sandboxed iframe refuses `new Worker()` - the</span>
<span class="tok-comment">//! kernel runs inline on the main thread instead, so this example still WORKS. It just</span>
<span class="tok-comment">//! hitches on both buttons, and the readout tells you why.)</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> kernels = <span class="tok-builtin">@import</span>(<span class="tok-str">"kernels.zig"</span>);
<span class="tok-kw">const</span> jobs = z.jobs;
<span class="tok-kw">const</span> cosRad = zm.cosRad;
<span class="tok-kw">const</span> sinRad = zm.sinRad;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">/// 1024x1024 RGBA - 4 MB in, ~2.7 MB of PNG out. Big enough that the main-thread encode</span>
<span class="tok-comment">/// is unmissable; small enough to stay inside the registry's 8 MB bounds.</span>
<span class="tok-kw">const</span> dim: u32 = <span class="tok-num">1024</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    ui_host: z.UiHost,
    font: z.Font,
    <span class="tok-comment">/// The image we encode. Filled once, never touched again - the kernel gets a COPY.</span>
    pixels: []u8,

    <span class="tok-comment">/// The result buffer, allocated ONCE. Handing this to `pollInto` every frame is the</span>
    <span class="tok-comment">/// difference between a 17 ms landing frame and a 154 ms one: `poll()` would allocate</span>
    <span class="tok-comment">/// 2.7 MB on the frame the PNG arrives, and a multi-megabyte request grows the wasm</span>
    <span class="tok-comment">/// linear memory - which Chrome services by copying the whole thing. The worker had</span>
    <span class="tok-comment">/// already handed the frame back; collecting the answer took it away again.</span>
    result_buf: []u8,

    <span class="tok-comment">/// The one piece of job state an app carries: a handle you poll.</span>
    job: jobs.Job = .{},

    png_kb: usize = <span class="tok-num">0</span>,
    png_ok: bool = false,
    <span class="tok-comment">/// Worst frame gap seen while a job was outstanding. THIS is the measurement.</span>
    worst_gap_ms: f32 = <span class="tok-num">0</span>,
    watching: bool = false,

    <span class="tok-comment">/// WHERE the main thread actually spent the time. A single "worst gap" told us a worker</span>
    <span class="tok-comment">/// run still cost 157 ms and left us guessing which part of the round trip did it - and</span>
    <span class="tok-comment">/// guessing is how you spend a day bisecting the wrong layer. So the number is broken</span>
    <span class="tok-comment">/// into the three places it can possibly come from:</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">///   submit  the frame we called `submit()`. Blame: staging the 4 MB payload (a Zig</span>
    <span class="tok-comment">///           alloc + memcpy, then a JS-owned copy), and - the first time only - bringing</span>
    <span class="tok-comment">///           the worker pool up, which `available()` does lazily INSIDE a frame.</span>
    <span class="tok-comment">///   wait    the worst frame while the worker was actually working. This one SHOULD be</span>
    <span class="tok-comment">///           ~16 ms. If it is not, the work is not really off-thread and the feature is</span>
    <span class="tok-comment">///           a lie.</span>
    <span class="tok-comment">///   land    the frame the result arrived. Blame: allocating and copying the 2.7 MB PNG</span>
    <span class="tok-comment">///           back out of the host.</span>
    submit_ms: f32 = <span class="tok-num">0</span>,
    wait_ms: f32 = <span class="tok-num">0</span>,
    land_ms: f32 = <span class="tok-num">0</span>,

    <span class="tok-comment">/// LAND is 149 ms and does not shrink with repetition, so it is not a one-off</span>
    <span class="tok-comment">/// `memory.grow` - and `submit` allocates a BIGGER buffer (4 MB) in 17 ms, so a large</span>
    <span class="tok-comment">/// wasm_allocator alloc is not inherently slow either. Both of my hypotheses died.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// So: stop inferring from frame gaps and time the landing frame from the inside.</span>
    <span class="tok-comment">/// `poll_ms` is wall-clock around `job.poll()` alone - the alloc, the copy-out, the</span>
    <span class="tok-comment">/// handle retire. If the 149 ms is in there, it is ours. If it is NOT, the cost is</span>
    <span class="tok-comment">/// elsewhere in the frame (GC from churning 7 MB a run is the next suspect) and no</span>
    <span class="tok-comment">/// amount of tuning `poll` would have touched it.</span>
    poll_ms: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// `pollInto` crosses into JS exactly twice: ask if the result is ready, then copy it</span>
    <span class="tok-comment">/// out. With the allocation gone it STILL costs 93 ms for 2.7 MB - 29 MB/s, when a</span>
    <span class="tok-comment">/// native `TypedArray.set` runs at gigabytes/sec. So one of these two is not what it</span>
    <span class="tok-comment">/// looks like, and the only way to know which is to time them apart.</span>
    ready_ms: f32 = <span class="tok-num">0</span>,
    copy_ms: f32 = <span class="tok-num">0</span>,
    phase: <span class="tok-kw">enum</span> { idle, submitted, waiting, landed } = .idle,

    <span class="tok-comment">/// Keep watching for a few frames after the work "finishes".</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Load-bearing. A main-thread encode BLOCKS INSIDE its own frame, so the frame time that</span>
    <span class="tok-comment">/// proves it only arrives on the NEXT frame. Clearing `watching` the moment the encode</span>
    <span class="tok-comment">/// returned meant the 233 ms this example exists to show was never actually recorded -</span>
    <span class="tok-comment">/// the headline number could not measure itself.</span>
    settle: u32 = <span class="tok-num">0</span>,
    ran_on: <span class="tok-kw">enum</span> { nothing, main_thread, worker } = .nothing,

    <span class="tok-comment">/// Which run this is. A wasm `memory.grow` is paid ONCE - if `land` collapses on run 2,</span>
    <span class="tok-comment">/// the 2.7 MB result alloc was growing the heap, and the fix is to keep a buffer rather</span>
    <span class="tok-comment">/// than allocate one per job.</span>
    runs: u32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>);

    <span class="tok-kw">const</span> pixels: []u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u8, dim * dim * <span class="tok-num">4</span>);
    <span class="tok-comment">// ONCE, and sized from the REGISTRY rather than from a number typed here.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// A hand-written constant that drifts from `max_output` does not fail loudly - it fails as</span>
    <span class="tok-comment">// `Error.OutputTooLarge`, on a phone, on the frame a result lands. The registry already</span>
    <span class="tok-comment">// knows the answer; there is no reason to know it twice.</span>
    <span class="tok-kw">const</span> result_buf: []u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u8, kernels.registry.max_output);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..dim * dim) |i| {
        <span class="tok-kw">const</span> x: u32 = <span class="tok-builtin">@intCast</span>(i % dim);
        <span class="tok-kw">const</span> y: u32 = <span class="tok-builtin">@intCast</span>(i / dim);
        <span class="tok-comment">// Gradients plus noise: compresses like a real screenshot, so the encoder does</span>
        <span class="tok-comment">// real work rather than running away with a trivial RLE.</span>
        pixels[i * <span class="tok-num">4</span> + <span class="tok-num">0</span>] = <span class="tok-builtin">@truncate</span>(x ^ y);
        pixels[i * <span class="tok-num">4</span> + <span class="tok-num">1</span>] = <span class="tok-builtin">@truncate</span>(x +% y);
        pixels[i * <span class="tok-num">4</span> + <span class="tok-num">2</span>] = <span class="tok-builtin">@truncate</span>((i *% <span class="tok-num">2654435761</span>) &gt;&gt; <span class="tok-num">24</span>);
        pixels[i * <span class="tok-num">4</span> + <span class="tok-num">3</span>] = <span class="tok-num">255</span>;
    }

    s.* = .{
        .gpa = gpa,
        .result_buf = result_buf,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .font = font,
        .pixels = pixels,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.job.<span class="tok-fn">deinit</span>(); <span class="tok-comment">// cancels it host-side too, if it is still in flight</span>
    gpa.<span class="tok-fn">free</span>(s.pixels);
    gpa.<span class="tok-fn">free</span>(s.result_buf);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// ---- the measurement -----------------------------------------------------</span>
    <span class="tok-comment">// The worst gap between frames while a job was outstanding. On the main thread this</span>
    <span class="tok-comment">// reads ~233 ms (the frame simply did not happen). On a worker it reads ~17 ms.</span>
    <span class="tok-kw">const</span> gap_ms: f32 = f.time.delta_time * <span class="tok-num">1000.0</span>;
    <span class="tok-kw">if</span> (s.watching) {
        <span class="tok-kw">if</span> (gap_ms &gt; s.worst_gap_ms) {
            s.worst_gap_ms = gap_ms;
        }
        <span class="tok-comment">// Attribute this frame's cost to the phase that CAUSED it. A dispatch blocks inside</span>
        <span class="tok-comment">// its own frame, so the cost always lands on the frame AFTER - which is why the</span>
        <span class="tok-comment">// phase advances here, one frame late, rather than at the call site.</span>
        <span class="tok-kw">switch</span> (s.phase) {
            .submitted =&gt; {
                s.submit_ms = gap_ms;
                s.phase = .waiting;
            },
            .waiting =&gt; {
                <span class="tok-kw">if</span> (gap_ms &gt; s.wait_ms) {
                    s.wait_ms = gap_ms;
                }
            },
            .landed =&gt; {
                <span class="tok-comment">// The landing frame AND the ones just after it: the 2.7 MB copy-out, the</span>
                <span class="tok-comment">// free, and any wasm `memory.grow` the alloc triggered can all land a frame</span>
                <span class="tok-comment">// or two late. Attribute the whole tail here rather than let it hide in</span>
                <span class="tok-comment">// `.idle` and surface only as an unexplained `worst`.</span>
                <span class="tok-kw">if</span> (gap_ms &gt; s.land_ms) {
                    s.land_ms = gap_ms;
                }
            },
            .idle =&gt; {},
        }
        <span class="tok-kw">if</span> (s.settle &gt; <span class="tok-num">0</span>) {
            s.settle -= <span class="tok-num">1</span>;
        }
    }

    <span class="tok-comment">// ---- collect the job -----------------------------------------------------</span>
    <span class="tok-comment">// One line, once a frame, never blocks. Identical whether a real worker ran it or</span>
    <span class="tok-comment">// the inline fallback did.</span>
    <span class="tok-kw">const</span> t_poll0: f64 = z.wgpu.<span class="tok-fn">nowMs</span>();
    <span class="tok-kw">if</span> (s.job.<span class="tok-fn">pollInto</span>(s.result_buf)) |maybe_png| {
        <span class="tok-kw">if</span> (maybe_png) |png| {
            s.png_kb = png.len / <span class="tok-num">1024</span>;
            <span class="tok-comment">// Cheap end-to-end proof that the bytes really crossed two wasm instances</span>
            <span class="tok-comment">// intact: a PNG starts with this signature.</span>
            s.png_ok = png.len &gt; <span class="tok-num">8</span> <span class="tok-kw">and</span> std.mem.<span class="tok-fn">eql</span>(u8, png[<span class="tok-num">0</span>..<span class="tok-num">4</span>], &amp;[_]u8{ <span class="tok-num">0x89</span>, <span class="tok-str">'P'</span>, <span class="tok-str">'N'</span>, <span class="tok-str">'G'</span> });
            s.phase = .landed; <span class="tok-comment">// the copy-out cost shows up on the NEXT frame</span>
            s.settle = <span class="tok-num">3</span>;
            s.job.<span class="tok-fn">deinit</span>();
        }
    } <span class="tok-kw">else</span> |err| {
        std.log.<span class="tok-fn">err</span>(<span class="tok-str">"worker_png: job failed: {s}"</span>, .{<span class="tok-builtin">@errorName</span>(err)});
        s.watching = false;
        s.job.<span class="tok-fn">deinit</span>();
    }
    <span class="tok-kw">const</span> poll_took: f32 = <span class="tok-builtin">@floatCast</span>(z.wgpu.<span class="tok-fn">nowMs</span>() - t_poll0);
    <span class="tok-kw">if</span> (s.phase == .landed <span class="tok-kw">and</span> poll_took &gt; s.poll_ms) {
        s.poll_ms = poll_took;
        s.ready_ms = jobs.last_ready_ms;
        s.copy_ms = jobs.last_copy_ms;
    }

    <span class="tok-comment">// The watch ends only after the settle frames, so the blocking frame's cost is counted.</span>
    <span class="tok-kw">if</span> (s.watching <span class="tok-kw">and</span> s.settle == <span class="tok-num">0</span> <span class="tok-kw">and</span> !s.job.<span class="tok-fn">inFlight</span>() <span class="tok-kw">and</span> s.png_kb &gt; <span class="tok-num">0</span>) {
        s.watching = false;
    }

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">11</span>, .g = <span class="tok-num">15</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();

    <span class="tok-comment">// ---- the orbiting dot: its smoothness IS the demo ------------------------</span>
    <span class="tok-comment">// A frozen frame stops it dead. You cannot miss it, and you cannot fake it.</span>
    <span class="tok-kw">const</span> cx: f32 = fw * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-num">110.0</span>;
    <span class="tok-kw">const</span> angle: f32 = f.time.time * <span class="tok-num">3.0</span>;
    <span class="tok-kw">const</span> orbit: f32 = <span class="tok-num">46.0</span>;
    f.gl.<span class="tok-fn">circle</span>(.{ cx, cy }, <span class="tok-num">52.0</span>, .{ .color = .{ .r = <span class="tok-num">22</span>, .g = <span class="tok-num">30</span>, .b = <span class="tok-num">48</span>, .a = <span class="tok-num">255</span> }, .segments = <span class="tok-num">32</span> });
    f.gl.<span class="tok-fn">circle</span>(
        .{ cx + orbit * <span class="tok-fn">cosRad</span>(angle), cy + orbit * <span class="tok-fn">sinRad</span>(angle) },
        <span class="tok-num">11.0</span>,
        .{ .color = .{ .r = <span class="tok-num">126</span>, .g = <span class="tok-num">231</span>, .b = <span class="tok-num">135</span>, .a = <span class="tok-num">255</span> }, .segments = <span class="tok-num">16</span> },
    );

    <span class="tok-comment">// ---- the buttons ---------------------------------------------------------</span>
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">190</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16</span>, <span class="tok-num">330</span> }, .{}); <span class="tok-comment">// tall enough that no number hides below the fold</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"encode a 1024x1024 PNG"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        <span class="tok-kw">const</span> busy: bool = s.job.<span class="tok-fn">inFlight</span>();

        <span class="tok-kw">const</span> bh: f32 = <span class="tok-num">44.0</span>; <span class="tok-comment">// a real tap target; this is a phone-first engine</span>
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Encode on the MAIN THREAD"</span>, .{ .size = .{ <span class="tok-num">0</span>, bh } }) <span class="tok-kw">and</span> !busy) {
            s.worst_gap_ms = <span class="tok-num">0</span>;
            s.submit_ms = <span class="tok-num">0</span>;
            s.wait_ms = <span class="tok-num">0</span>;
            s.land_ms = <span class="tok-num">0</span>;
            s.watching = true;
            s.settle = <span class="tok-num">0</span>;
            s.phase = .submitted; <span class="tok-comment">// the whole encode happens inside this one frame</span>
            s.ran_on = .main_thread;
            <span class="tok-comment">// The bad way, kept on purpose. This BLOCKS the frame for ~240 ms - the dot</span>
            <span class="tok-comment">// stops, and `worst frame gap` below records exactly how long for.</span>
            <span class="tok-kw">if</span> (z.codecs.png.<span class="tok-fn">encode</span>(s.gpa, s.pixels, dim, dim)) |png| {
                <span class="tok-kw">defer</span> s.gpa.<span class="tok-fn">free</span>(png);
                s.png_kb = png.len / <span class="tok-num">1024</span>;
                s.png_ok = true;
            } <span class="tok-kw">else</span> |err| {
                std.log.<span class="tok-fn">err</span>(<span class="tok-str">"worker_png: main-thread encode failed: {s}"</span>, .{<span class="tok-builtin">@errorName</span>(err)});
            }
            <span class="tok-comment">// NOT `s.watching = false` - see `settle`. The 240 ms just spent blocking shows</span>
            <span class="tok-comment">// up as the NEXT frame's delta, and stopping the watch here would discard it.</span>
            s.settle = <span class="tok-num">3</span>;
        }

        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Encode on a WORKER"</span>, .{ .size = .{ <span class="tok-num">0</span>, bh } }) <span class="tok-kw">and</span> !busy) {
            s.worst_gap_ms = <span class="tok-num">0</span>;
            s.submit_ms = <span class="tok-num">0</span>;
            s.wait_ms = <span class="tok-num">0</span>;
            s.land_ms = <span class="tok-num">0</span>;
            s.poll_ms = <span class="tok-num">0</span>;
            s.watching = true;
            s.settle = <span class="tok-num">0</span>;
            s.phase = .submitted;
            s.ran_on = .worker;
            s.runs += <span class="tok-num">1</span>;
            <span class="tok-comment">// The good way. Returns IMMEDIATELY; `poll` above collects it whenever it</span>
            <span class="tok-comment">// lands. Note the kernel is named by the FUNCTION, not a string - so a typo</span>
            <span class="tok-comment">// is a compile error, not a NoSuchKernel at runtime.</span>
            s.job = kernels.registry.<span class="tok-fn">submit</span>(
                s.gpa,
                kernels.encodePng,
                .{ .w = dim, .h = dim },
                s.pixels,
            ) <span class="tok-kw">catch</span> |err| blk: {
                std.log.<span class="tok-fn">err</span>(<span class="tok-str">"worker_png: submit failed: {s}"</span>, .{<span class="tok-builtin">@errorName</span>(err)});
                s.watching = false;
                <span class="tok-kw">break</span> :blk .{};
            };
        }

        u.<span class="tok-fn">separator</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"workers: {s}"</span>, .{
            <span class="tok-kw">if</span> (jobs.<span class="tok-fn">parallel</span>()) <span class="tok-str">"available"</span> <span class="tok-kw">else</span> <span class="tok-str">"UNAVAILABLE - running inline"</span>,
        });
        <span class="tok-kw">if</span> (s.png_kb &gt; <span class="tok-num">0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"png: {d} KB  signature {s}  (ran on {s})"</span>, .{
                s.png_kb,
                <span class="tok-kw">if</span> (s.png_ok) <span class="tok-str">"OK"</span> <span class="tok-kw">else</span> <span class="tok-str">"BAD"</span>,
                <span class="tok-builtin">@tagName</span>(s.ran_on),
            });
        }
        <span class="tok-comment">// THE number, DECOMPOSED. `wait` is the one that matters: it is the only one that</span>
        <span class="tok-comment">// says whether the work is really off the main thread.</span>
        <span class="tok-kw">const</span> dropped: f32 = s.worst_gap_ms / <span class="tok-num">16.7</span>;
        u.<span class="tok-fn">textColored</span>(
            <span class="tok-kw">if</span> (s.worst_gap_ms &gt; <span class="tok-num">34.0</span>) z.colors.red_400 <span class="tok-kw">else</span> z.colors.emerald_400,
            <span class="tok-str">"worst gap {d:.0} ms  (~{d:.0} frames dropped)"</span>,
            .{ s.worst_gap_ms, <span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, dropped - <span class="tok-num">1.0</span>) },
        );
        u.<span class="tok-fn">textColored</span>(
            <span class="tok-kw">if</span> (s.wait_ms &gt; <span class="tok-num">34.0</span>) z.colors.red_400 <span class="tok-kw">else</span> z.colors.emerald_400,
            <span class="tok-str">"  WAIT   {d:.0} ms  &lt;- is the work really off-thread?"</span>,
            .{s.wait_ms},
        );
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  submit {d:.0} ms  (4 MB staged + copied to the worker)"</span>, .{s.submit_ms});
        u.<span class="tok-fn">textColored</span>(
            <span class="tok-kw">if</span> (s.land_ms &gt; <span class="tok-num">34.0</span>) z.colors.red_400 <span class="tok-kw">else</span> z.colors.emerald_400,
            <span class="tok-str">"  LAND   {d:.0} ms  (2.7 MB PNG alloc'd + copied back)"</span>,
            .{s.land_ms},
        );
        u.<span class="tok-fn">textColored</span>(
            <span class="tok-kw">if</span> (s.poll_ms &gt; <span class="tok-num">34.0</span>) z.colors.red_400 <span class="tok-kw">else</span> z.colors.emerald_400,
            <span class="tok-str">"    pollInto {d:.0} ms  = ready {d:.0} + copy {d:.0}"</span>,
            .{ s.poll_ms, s.ready_ms, s.copy_ms },
        );
        u.<span class="tok-fn">text</span>(<span class="tok-str">"run #{d}   (2.7 MB copy should be ~2 ms)"</span>, .{s.runs});
    }

    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - jobs - PNG encode on a worker"</span>,
            .width = <span class="tok-num">420</span>,
            .height = <span class="tok-num">480</span>,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,

<figure class="code src-file" data-path="examples/worker_png/kernels.zig" data-lines="94"><figcaption><span>examples/worker_png/kernels.zig</span><span>94 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/worker_png/kernels.zig - the PURE half of the example.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! This file is compiled TWICE:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * into the app's wasm, so `registry.submit(...)` knows the kernel's header type -</span>
<span class="tok-comment">//!     all at comptime, so a mismatch is a build error;</span>
<span class="tok-comment">//!   * into a SEPARATE, freestanding kernel wasm (~20 KB, ZERO imports) that the workers</span>
<span class="tok-comment">//!     instantiate. Zero imports is the whole trick: the worker's JS can instantiate it</span>
<span class="tok-comment">//!     with `{}`. Nothing to stub, no DOM, no WebGPU, no WASI.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! It imports `z` like any other example - but it may only TOUCH the pure parts of it</span>
<span class="tok-comment">//! (`codecs`, `zm`, `jobs`, `easings`, ...). Reach for `z.drawText` and the kernel wasm</span>
<span class="tok-comment">//! sprouts a `dom` import and the trick dies. That is not a style rule you can forget: the</span>
<span class="tok-comment">//! build ASSERTS the kernel wasm's import section is empty, so a kernel that touches the</span>
<span class="tok-comment">//! DOM fails to build, with a message saying which import gave it away.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! (Zig's lazy analysis is what makes this work: `src/z.zig` declares the whole engine,</span>
<span class="tok-comment">//! but only what the kernel actually REACHES gets compiled in. Touch nothing impure and</span>
<span class="tok-comment">//! nothing impure is linked.)</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Note what is NOT here: `exportWorkerEntry`. build.zig generates a tiny root that calls</span>
<span class="tok-comment">//! it, so the app - which imports this file for `registry` - never links the worker's</span>
<span class="tok-comment">//! buffers.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> codecs = z.codecs;
<span class="tok-kw">const</span> jobs = z.jobs;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> expect = std.testing.expect;
<span class="tok-kw">const</span> expectEqualSlices = std.testing.expectEqualSlices;

<span class="tok-comment">/// `extern`, not a plain struct: these bytes are memcpy'd out of the app's wasm and into</span>
<span class="tok-comment">/// the kernel's - two separate compilations - and Zig's auto layout is free to reorder</span>
<span class="tok-comment">/// fields. `extern` is what the language provides for a boundary. (The call site is</span>
<span class="tok-comment">/// unchanged: `.{ .w = 1024, .h = 1024 }` still coerces.)</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Size = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    w: u32,
    h: u32,
};

<span class="tok-comment">/// Encode an RGBA8 image to PNG.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// An ordinary Zig function: allocator first, as everywhere else in std, and a plain</span>
<span class="tok-comment">/// `std.Io.Writer` for output. Nothing about it announces that it will run on another</span>
<span class="tok-comment">/// thread - which is exactly the point. It runs in its own wasm instance with its own</span>
<span class="tok-comment">/// linear memory, so it cannot see the app's globals even if it wanted to.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `gpa` is an ARENA. Whatever the kernel allocates is released for it when the job ends,</span>
<span class="tok-comment">/// which is why there is no `defer free` here and no way to leak.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ~240 ms for 1024x1024 in wasm on a phone. On the main thread that is a 233 ms frozen</span>
<span class="tok-comment">/// frame - fourteen dropped frames, plainly visible. Here it is zero.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">encodePng</span>(
    gpa: Allocator,
    hdr: Size,
    pixels: []<span class="tok-kw">const</span> u8,
    out: *std.Io.Writer,
) !void {
    <span class="tok-kw">const</span> png: []u8 = <span class="tok-kw">try</span> codecs.png.<span class="tok-fn">encode</span>(gpa, pixels, hdr.w, hdr.h);
    <span class="tok-kw">try</span> out.<span class="tok-fn">writeAll</span>(png);
}

<span class="tok-comment">/// The kernel table, exposed so registries can COMPOSE. A page that bundles several</span>
<span class="tok-comment">/// examples (the launcher) builds one kernel wasm from the concatenation:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///     jobs.Registry(worker_png.job_kernels ++ four_ways.job_kernels, .{})</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// which works because the wasm exports are keyed by NAME, not by an index or a hash -</span>
<span class="tok-comment">/// so a merged kernel wasm satisfies every example's `submit` with nobody renumbering.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> job_kernels = .{
    .{ <span class="tok-str">"encodePng"</span>, encodePng },
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> registry = jobs.<span class="tok-fn">Registry</span>(job_kernels, .{
    .max_input = <span class="tok-num">8</span> &lt;&lt; <span class="tok-num">20</span>, <span class="tok-comment">// 4 MB of RGBA at 1024x1024, with room to spare</span>
    .max_output = <span class="tok-num">8</span> &lt;&lt; <span class="tok-num">20</span>, <span class="tok-comment">// a 1024x1024 PNG comes out around 2.7 MB</span>
});

<span class="tok-comment">// The kernel is a plain function, so testing it needs no browser, no worker and no wasm.</span>
<span class="tok-comment">// This is the ergonomic payoff, and it is worth stating plainly: if you can `zig build</span>
<span class="tok-comment">// test` your kernel, the only thing left to break is transport - and transport is the</span>
<span class="tok-comment">// engine's problem, not yours.</span>
<span class="tok-kw">test</span> <span class="tok-str">"encodePng emits a valid PNG signature"</span> {
    <span class="tok-kw">var</span> out_buf: [<span class="tok-num">1</span> &lt;&lt; <span class="tok-num">16</span>]u8 = undefined;
    <span class="tok-kw">var</span> out: std.Io.Writer = .<span class="tok-fn">fixed</span>(&amp;out_buf);
    <span class="tok-kw">const</span> px: [<span class="tok-num">4</span> * <span class="tok-num">4</span> * <span class="tok-num">4</span>]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">255</span>); <span class="tok-comment">// 4x4 RGBA, all white</span>

    <span class="tok-kw">try</span> <span class="tok-fn">encodePng</span>(std.testing.allocator, .{ .w = <span class="tok-num">4</span>, .h = <span class="tok-num">4</span> }, &amp;px, &amp;out);

    <span class="tok-kw">try</span> <span class="tok-fn">expect</span>(out.<span class="tok-fn">buffered</span>().len &gt; <span class="tok-num">8</span>);
    <span class="tok-kw">try</span> <span class="tok-fn">expectEqualSlices</span>(u8, &amp;[_]u8{ <span class="tok-num">0x89</span>, <span class="tok-str">'P'</span>, <span class="tok-str">'N'</span>, <span class="tok-str">'G'</span> }, out.<span class="tok-fn">buffered</span>()[<span class="tok-num">0</span>..<span class="tok-num">4</span>]);
}
