<h1>shared_smoke</h1>
<figure class="code src-file" data-path="examples/shared_smoke/shared_smoke.zig" data-lines="171"><figcaption><span>examples/shared_smoke/shared_smoke.zig</span><span>171 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! shared_smoke - workgroup shared-memory + barrier DIAGNOSTIC, on device.</span>
<span class="tok-comment">//! Runs the `diag` kernel once and checks three independent results so a single</span>
<span class="tok-comment">//! run pinpoints which primitive works on this GPU:</span>
<span class="tok-comment">//!   1. local id     (out_localid)  - is local_invocation_id delivered?</span>
<span class="tok-comment">//!   2. shared self  (out_self)     - does a workgroup var round-trip a value?</span>
<span class="tok-comment">//!   3. shared rotate(out_rotate)   - does cross-thread sharing + the barrier work?</span>
<span class="tok-comment">//! Each line shows PASS (green) or FAIL (red, with mismatch count). The CPU</span>
<span class="tok-comment">//! backend runs the same kernel at startup as an independent oracle.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> shared_rotate = <span class="tok-builtin">@import</span>(<span class="tok-str">"shared_rotate.zig"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> diag_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"shared_rotate_wgsl"</span>);

<span class="tok-kw">const</span> count: u32 = <span class="tok-num">1024</span>; <span class="tok-comment">// 4 full workgroups of 256 (must be a multiple of wg_size)</span>

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    pipe: z.<span class="tok-fn">Compute</span>(shared_rotate),
    cpu_ok: bool = false,
    dispatched: bool = false,
    have_result: bool = false,
    miss_localid: u32 = count,
    miss_self: u32 = count,
    miss_rotate: u32 = count,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    _ = gpa;
    s.pipe.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">expectLocalId</span>(gid: u32) f32 {
    <span class="tok-kw">return</span> <span class="tok-builtin">@floatFromInt</span>(gid % shared_rotate.wg_size);
}
<span class="tok-kw">fn</span> <span class="tok-fn">expectSelf</span>(gid: u32) f32 {
    <span class="tok-kw">return</span> <span class="tok-builtin">@floatFromInt</span>(gid);
}
<span class="tok-kw">fn</span> <span class="tok-fn">expectRotate</span>(gid: u32) f32 {
    <span class="tok-kw">const</span> wg: u32 = shared_rotate.wg_size;
    <span class="tok-kw">const</span> base: u32 = (gid / wg) * wg;
    <span class="tok-kw">const</span> lid: u32 = gid % wg;
    <span class="tok-kw">return</span> <span class="tok-builtin">@floatFromInt</span>(base + ((lid + <span class="tok-num">1</span>) % wg));
}

<span class="tok-kw">fn</span> <span class="tok-fn">countMismatch</span>(out: []<span class="tok-kw">const</span> f32, <span class="tok-kw">comptime</span> expect: <span class="tok-kw">fn</span> (u32) f32) u32 {
    <span class="tok-kw">var</span> m: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; count <span class="tok-kw">and</span> i &lt; out.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (out[i] != <span class="tok-fn">expect</span>(i)) {
            m += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">return</span> m;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);

    <span class="tok-comment">// CPU-backend oracle.</span>
    <span class="tok-kw">var</span> cpu: z.<span class="tok-fn">Compute</span>(shared_rotate) = z.<span class="tok-fn">Compute</span>(shared_rotate).<span class="tok-fn">initCpu</span>();
    cpu.element_count = count;
    cpu.params = .{ .count = count };
    <span class="tok-kw">var</span> probe: [count]f32 = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..count) |i| {
        probe[i] = <span class="tok-builtin">@floatFromInt</span>(i);
    }
    cpu.<span class="tok-fn">upload</span>(.input, probe[<span class="tok-num">0</span>..]);
    cpu.<span class="tok-fn">run</span>(<span class="tok-str">"diag"</span>, count);
    <span class="tok-kw">const</span> cl: []<span class="tok-kw">const</span> f32 = cpu.<span class="tok-fn">readLatest</span>(.out_localid).?;
    <span class="tok-kw">const</span> cs: []<span class="tok-kw">const</span> f32 = cpu.<span class="tok-fn">readLatest</span>(.out_self).?;
    <span class="tok-kw">const</span> cr: []<span class="tok-kw">const</span> f32 = cpu.<span class="tok-fn">readLatest</span>(.out_rotate).?;
    <span class="tok-kw">const</span> cpu_ok: bool = <span class="tok-fn">countMismatch</span>(cl, expectLocalId) == <span class="tok-num">0</span> <span class="tok-kw">and</span>
        <span class="tok-fn">countMismatch</span>(cs, expectSelf) == <span class="tok-num">0</span> <span class="tok-kw">and</span> <span class="tok-fn">countMismatch</span>(cr, expectRotate) == <span class="tok-num">0</span>;

    <span class="tok-comment">// GPU round-trip.</span>
    <span class="tok-kw">var</span> pipe: z.<span class="tok-fn">Compute</span>(shared_rotate) = <span class="tok-kw">try</span> z.<span class="tok-fn">Compute</span>(shared_rotate).<span class="tok-fn">initGpu</span>(
        gpa,
        f.gpu.device,
        f.gpu.queue,
        &amp;.{.{ .name = <span class="tok-str">"diag"</span>, .wgsl = diag_wgsl }},
    );
    pipe.element_count = count;
    pipe.params = .{ .count = count };
    <span class="tok-kw">var</span> input: [count]f32 = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..count) |i| {
        input[i] = <span class="tok-builtin">@floatFromInt</span>(i);
    }
    pipe.<span class="tok-fn">upload</span>(.input, input[<span class="tok-num">0</span>..]);

    s.* = .{ .font = font, .pipe = pipe, .cpu_ok = cpu_ok };
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawLine</span>(
    f: *z.Frame,
    s: *State,
    label: []<span class="tok-kw">const</span> u8,
    miss: u32,
    y: *f32,
) void {
    <span class="tok-kw">var</span> buf: [<span class="tok-num">128</span>]u8 = undefined;
    <span class="tok-kw">const</span> txt: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (!s.have_result)
        <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"{s}: ..."</span>, .{label}) <span class="tok-kw">catch</span> label
    <span class="tok-kw">else</span> <span class="tok-kw">if</span> (miss == <span class="tok-num">0</span>)
        <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"{s}: PASS"</span>, .{label}) <span class="tok-kw">catch</span> label
    <span class="tok-kw">else</span>
        <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"{s}: FAIL ({d}/{d} wrong)"</span>, .{ label, miss, count }) <span class="tok-kw">catch</span> label;
    <span class="tok-kw">const</span> col: Color = <span class="tok-kw">if</span> (!s.have_result)
        z.colors.slate_300
    <span class="tok-kw">else</span> <span class="tok-kw">if</span> (miss == <span class="tok-num">0</span>)
        z.colors.green_400
    <span class="tok-kw">else</span>
        z.colors.red_500;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">14</span>, y.* }, txt, .{ .size = <span class="tok-num">20</span>, .color = col, .font = &amp;s.font });
    y.* += <span class="tok-num">30</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">if</span> (!s.dispatched) {
        s.dispatched = true;
        s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"diag"</span>, count);
    }
    <span class="tok-comment">// All three outputs land together; read them once the readback is ready.</span>
    <span class="tok-kw">if</span> (s.pipe.<span class="tok-fn">readLatest</span>(.out_rotate)) |rot| {
        <span class="tok-kw">if</span> (s.pipe.<span class="tok-fn">readLatest</span>(.out_localid)) |lid| {
            <span class="tok-kw">if</span> (s.pipe.<span class="tok-fn">readLatest</span>(.out_self)) |slf| {
                s.miss_localid = <span class="tok-fn">countMismatch</span>(lid, expectLocalId);
                s.miss_self = <span class="tok-fn">countMismatch</span>(slf, expectSelf);
                s.miss_rotate = <span class="tok-fn">countMismatch</span>(rot, expectRotate);
                s.have_result = true;
            }
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, z.colors.slate_900);

    <span class="tok-kw">var</span> y: f32 = <span class="tok-num">14</span>;
    <span class="tok-fn">drawLine</span>(f, s, <span class="tok-str">"1. local_invocation_id"</span>, s.miss_localid, &amp;y);
    <span class="tok-fn">drawLine</span>(f, s, <span class="tok-str">"2. shared var self-roundtrip"</span>, s.miss_self, &amp;y);
    <span class="tok-fn">drawLine</span>(f, s, <span class="tok-str">"3. shared + barrier (rotate)"</span>, s.miss_rotate, &amp;y);

    y += <span class="tok-num">12</span>;
    <span class="tok-kw">const</span> cpu_msg: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.cpu_ok) <span class="tok-str">"CPU oracle: PASS"</span> <span class="tok-kw">else</span> <span class="tok-str">"CPU oracle: FAIL"</span>;
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">14</span>, y },
        cpu_msg,
        .{ .size = <span class="tok-num">15</span>, .color = <span class="tok-kw">if</span> (s.cpu_ok) z.colors.green_400 <span class="tok-kw">else</span> z.colors.red_500, .font = &amp;s.font },
    );

    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - shared memory diagnostic"</span>,
            .width = <span class="tok-num">760</span>,
            .height = <span class="tok-num">420</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};

<figure class="code src-file" data-path="examples/shared_smoke/shared_rotate.zig" data-lines="96"><figcaption><span>examples/shared_smoke/shared_rotate.zig</span><span>96 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! shared_rotate.zig - workgroup shared-memory + barrier DIAGNOSTIC.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! One dispatch writes THREE separate result buffers so a single device run</span>
<span class="tok-comment">//! pinpoints exactly which primitive works:</span>
<span class="tok-comment">//!   out_localid[gid] = local_invocation_id         -&gt; is the local id delivered?</span>
<span class="tok-comment">//!   out_self[gid]    = tile[lid]    (own slot)      -&gt; does a workgroup var even</span>
<span class="tok-comment">//!                                                      round-trip a value?</span>
<span class="tok-comment">//!   out_rotate[gid]  = tile[(lid+1)%wg] (neighbour) -&gt; does cross-thread sharing</span>
<span class="tok-comment">//!                                                      + the barrier work?</span>
<span class="tok-comment">//! All three reads happen AFTER one barrier over a tile each thread filled with</span>
<span class="tok-comment">//! its own input value. Expected (input[i] == i, wg_size == 256):</span>
<span class="tok-comment">//!   out_localid[gid] == gid % 256</span>
<span class="tok-comment">//!   out_self[gid]    == gid</span>
<span class="tok-comment">//!   out_rotate[gid]  == base + (lid+1)%256   (left-rotate within the block)</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! GPU path uses k.shared / k.localId / k.workgroupBarrier. CPU path computes</span>
<span class="tok-comment">//! the same values directly (the oracle). The barrier is in UNIFORM control</span>
<span class="tok-comment">//! flow (no early-return; count is an exact multiple of wg_size).</span>
<span class="tok-kw">const</span> k = <span class="tok-builtin">@import</span>(<span class="tok-str">"kompute"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> config = k.Config{ .max = <span class="tok-num">1024</span>, .workgroup = <span class="tok-num">256</span> };

<span class="tok-comment">/// Workgroup size as a comptime constant (the rotate modulus + tile length).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> wg_size: u32 = config.workgroup;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Buffers = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    input: [config.max]f32,
    out_localid: [config.max]f32,
    out_self: [config.max]f32,
    out_rotate: [config.max]f32,
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Params = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    count: u32,
    _pad0: u32 = <span class="tok-num">0</span>,
    _pad1: u32 = <span class="tok-num">0</span>,
    _pad2: u32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> g = k.<span class="tok-fn">Globals</span>(<span class="tok-builtin">@This</span>());
<span class="tok-kw">const</span> b_input = g.<span class="tok-fn">bind</span>(.input);
<span class="tok-kw">const</span> b_out_localid = g.<span class="tok-fn">bind</span>(.out_localid);
<span class="tok-kw">const</span> b_out_self = g.<span class="tok-fn">bind</span>(.out_self);
<span class="tok-kw">const</span> b_out_rotate = g.<span class="tok-fn">bind</span>(.out_rotate);
<span class="tok-kw">const</span> tile = k.<span class="tok-fn">shared</span>(f32, wg_size, <span class="tok-str">"rot_tile"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">diag</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> gid: u32 = c.id;
    <span class="tok-kw">if</span> (k.is_gpu) {
        <span class="tok-kw">const</span> lid: u32 = k.<span class="tok-fn">localId</span>();
        b_out_localid[gid] = <span class="tok-builtin">@floatFromInt</span>(lid);
        tile[lid] = b_input[gid];
        k.<span class="tok-fn">workgroupBarrier</span>();
        b_out_self[gid] = tile[lid];
        <span class="tok-kw">const</span> src: u32 = (lid + <span class="tok-num">1</span>) % wg_size;
        b_out_rotate[gid] = tile[src];
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">if</span> (gid &gt;= c.params.count) {
            <span class="tok-kw">return</span>;
        }
        <span class="tok-kw">const</span> base: u32 = (gid / wg_size) * wg_size;
        <span class="tok-kw">const</span> lid: u32 = gid % wg_size;
        b_out_localid[gid] = <span class="tok-builtin">@floatFromInt</span>(lid);
        b_out_self[gid] = b_input[gid];
        b_out_rotate[gid] = b_input[base + ((lid + <span class="tok-num">1</span>) % wg_size)];
    }
}

<span class="tok-kw">comptime</span> {
    k.<span class="tok-fn">installKernel</span>(<span class="tok-builtin">@This</span>(), <span class="tok-str">"diag"</span>);
}

<span class="tok-kw">test</span> <span class="tok-str">"shared_rotate CPU oracle: diag buffers"</span> {
    <span class="tok-comment">// lint:off import-at-top: test-local std keeps the file free of a col-0 std import</span>
    <span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
    <span class="tok-kw">const</span> N: u32 = <span class="tok-num">1024</span>;
    g.P = .{ .count = N };
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..N) |i| {
        g.B.input[i] = <span class="tok-builtin">@floatFromInt</span>(i);
    }
    <span class="tok-kw">var</span> id: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (id &lt; N) : (id += <span class="tok-num">1</span>) {
        <span class="tok-fn">diag</span>(.{ .id = id, .params = g.P });
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..N) |gi| {
        <span class="tok-kw">const</span> gid: u32 = <span class="tok-builtin">@intCast</span>(gi);
        <span class="tok-kw">const</span> base: u32 = (gid / wg_size) * wg_size;
        <span class="tok-kw">const</span> lid: u32 = gid % wg_size;
        <span class="tok-kw">try</span> std.testing.<span class="tok-fn">expectEqual</span>(<span class="tok-fn">float</span>(lid), g.B.out_localid[gi]);
        <span class="tok-kw">try</span> std.testing.<span class="tok-fn">expectEqual</span>(<span class="tok-fn">float</span>(gid), g.B.out_self[gi]);
        <span class="tok-kw">const</span> want_rot: f32 = <span class="tok-fn">float</span>(base + ((lid + <span class="tok-num">1</span>) % wg_size));
        <span class="tok-kw">try</span> std.testing.<span class="tok-fn">expectEqual</span>(want_rot, g.B.out_rotate[gi]);
    }
}
