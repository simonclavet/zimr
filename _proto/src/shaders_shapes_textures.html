<h1>shaders_shapes_textures</h1>
<figure class="code src-file" data-path="examples/shaders_shapes_textures/shaders_shapes_textures.zig" data-lines="236"><figcaption><span>examples/shaders_shapes_textures/shaders_shapes_textures.zig</span><span>236 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/shaders_shapes_textures - a port of raylib's `shaders_shapes_textures`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! THE POINT. raylib's `BeginShaderMode` wraps ORDINARY draws, and toggles in and out of the</span>
<span class="tok-comment">//! shader SEVERAL TIMES within a single frame:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!     DrawCircle(...);                 // default shader</span>
<span class="tok-comment">//!     BeginShaderMode(grayscale);</span>
<span class="tok-comment">//!       DrawRectangle(...);            // &lt;- filtered</span>
<span class="tok-comment">//!     EndShaderMode();</span>
<span class="tok-comment">//!     DrawTriangle(...);               // default again</span>
<span class="tok-comment">//!     BeginShaderMode(grayscale);</span>
<span class="tok-comment">//!       DrawTexture(fudesumi, ...);    // &lt;- filtered</span>
<span class="tok-comment">//!     EndShaderMode();</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Until now zimr could only run a shader over a FULLSCREEN QUAD (`effects2d`), which is a</span>
<span class="tok-comment">//! post-process: render the scene to a texture, then filter the texture. That cannot express</span>
<span class="tok-comment">//! the above at all, because it cannot filter SOME shapes and not others.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! `z.Shader2D` can. The user's fragment shader BECOMES the fragment stage of the shapes</span>
<span class="tok-comment">//! pipeline, so the rectangles below are grey because THEIR OWN fragments went through it.</span>
<span class="tok-comment">//! Nothing is rendered to a texture and nothing is read back.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The repeated toggling is not decoration - it is the test. Each `beginShaderMode` /</span>
<span class="tok-comment">//! `endShaderMode` must FLUSH the pending batch, or geometry queued before the swap would be</span>
<span class="tok-comment">//! drawn with the pipeline bound after it, and the columns would bleed into one another.</span>
<span class="tok-comment">//! Three toggles in one frame is what makes that visible rather than theoretical.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! IMPROVEMENTS ON THE ORIGINAL</span>
<span class="tok-comment">//!   * The grey is a SLIDER, not a hard on/off. The shader `mix`es rather than branching, so a</span>
<span class="tok-comment">//!     value parked at 0.5 proves the shader really is running per fragment, rather than</span>
<span class="tok-comment">//!     swapping in a pre-greyed texture.</span>
<span class="tok-comment">//!   * A UI panel replaces the keyboard, because this runs on a phone.</span>
<span class="tok-comment">//!   * A "filter the whole frame" toggle wraps EVERYTHING in one shader mode - the other thing</span>
<span class="tok-comment">//!     raylib's API allows and its example never shows.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! (c) Fudesumi sprite by Eiden Marsal - shipped with raylib's examples.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;
<span class="tok-kw">const</span> tau = zm.tau;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-comment">/// The WGSL the build generated from `src/shaders/shapes_filter_fs.zig` - raylib's</span>
<span class="tok-comment">/// `grayscale.fs`, written in Zig.</span>
<span class="tok-kw">const</span> filter_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"shapes_filter_fs.wgsl"</span>);

<span class="tok-kw">const</span> fudesumi_png = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"fudesumi.png"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,

    <span class="tok-comment">/// The user 2D shader. Owns SIX GPU handles - pipeline, its layout, the group-2</span>
    <span class="tok-comment">/// bind-group layout, the fragment module, the uniform buffer, the bind group - and frees</span>
    <span class="tok-comment">/// all six in `deinit`. Creating a pipeline creates more than a pipeline, and an example</span>
    <span class="tok-comment">/// that frees only the obvious one leaks the other five in silence.</span>
    filter: z.Shader2D = .{},

    fudesumi: z.WgpuTexture = .{},

    <span class="tok-comment">/// 0 = untouched, 1 = fully grey.</span>
    amount: f32 = <span class="tok-num">1.0</span>,

    <span class="tok-comment">/// Wrap the ENTIRE frame in one shader mode instead of the three interleaved ones.</span>
    filter_everything: bool = false,

    elapsed: f32 = <span class="tok-num">0</span>,
    font: z.Font,
    ui_host: z.UiHost,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">18</span>);

    <span class="tok-kw">const</span> image: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">loadImageFromMemory</span>(gpa, fudesumi_png);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadImage</span>(gpa, image);
    <span class="tok-kw">const</span> fudesumi: z.WgpuTexture = z.<span class="tok-fn">loadTextureFromImage</span>(f.gl, image);

    <span class="tok-comment">// Built against the RENDERER'S OWN bind-group layouts. That shared identity is not a</span>
    <span class="tok-comment">// convenience: WebGPU keeps groups 0 (projection) and 1 (texture) bound across a pipeline</span>
    <span class="tok-comment">// swap only when the two pipeline layouts agree on that prefix, and handing it the same</span>
    <span class="tok-comment">// handles is the only way to be certain that they do.</span>
    <span class="tok-kw">const</span> filter: z.Shader2D = <span class="tok-kw">try</span> z.Shader2D.<span class="tok-fn">init</span>(
        gpa,
        f.gpu.device,
        f.gpu.queue,
        f.gl.<span class="tok-fn">renderer</span>(),
        filter_wgsl,
        <span class="tok-str">"grayscale"</span>,
    );

    s.* = .{
        .gpa = gpa,
        .font = font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .fudesumi = fudesumi,
        .filter = filter,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    <span class="tok-comment">// Six GPU handles in `filter`, and the texture. Creating a pipeline creates a layout, a</span>
    <span class="tok-comment">// bind-group layout and a shader module as well - an example that frees only the obvious</span>
    <span class="tok-comment">// one leaks the rest in silence, which is exactly what the smoke harness's leak census is</span>
    <span class="tok-comment">// there to catch.</span>
    s.filter.<span class="tok-fn">deinit</span>();
    s.fudesumi.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">// ---- the three columns, laid out exactly as raylib does ---------------------------------</span>

<span class="tok-comment">/// Column 1 (x = 80): circles. raylib leaves these on the DEFAULT shader.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawCircles</span>(gl: <span class="tok-kw">anytype</span>) void {
    gl.<span class="tok-fn">circle</span>(.{ <span class="tok-num">80</span>, <span class="tok-num">120</span> }, <span class="tok-num">35</span>, .{ .color = c.darkblue, .segments = <span class="tok-num">48</span> });
    gl.<span class="tok-fn">circleGradient</span>(.{ <span class="tok-num">80</span>, <span class="tok-num">220</span> }, <span class="tok-num">60</span>, c.green, c.skyblue);
    gl.<span class="tok-fn">circleSectorLines</span>(.{ <span class="tok-num">80</span>, <span class="tok-num">340</span> }, <span class="tok-num">80</span>, <span class="tok-num">0</span>, tau, <span class="tok-num">36</span>, .{ .color = c.darkblue });
}

<span class="tok-comment">/// Column 2 (x = 250): rectangles. raylib puts these INSIDE the shader.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawRectangles</span>(gl: <span class="tok-kw">anytype</span>) void {
    gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">250</span> - <span class="tok-num">60</span>, .y = <span class="tok-num">90</span>, .width = <span class="tok-num">120</span>, .height = <span class="tok-num">60</span> }, .{ .color = c.red });

    <span class="tok-comment">// raylib's `DrawRectangleGradientH` is a horizontal gradient; zimr's four-corner form says</span>
    <span class="tok-comment">// the same thing as a left pair and a right pair.</span>
    gl.<span class="tok-fn">rectGradientCorners</span>(
        .{ .x = <span class="tok-num">250</span> - <span class="tok-num">90</span>, .y = <span class="tok-num">170</span>, .width = <span class="tok-num">180</span>, .height = <span class="tok-num">130</span> },
        c.maroon, <span class="tok-comment">// top-left</span>
        c.maroon, <span class="tok-comment">// bottom-left</span>
        c.gold, <span class="tok-comment">// bottom-right</span>
        c.gold, <span class="tok-comment">// top-right</span>
    );

    gl.<span class="tok-fn">rect</span>(
        .{ .x = <span class="tok-num">250</span> - <span class="tok-num">40</span>, .y = <span class="tok-num">320</span>, .width = <span class="tok-num">80</span>, .height = <span class="tok-num">60</span> },
        .{ .color = c.orange, .outline = <span class="tok-num">1</span> },
    );
}

<span class="tok-comment">/// Column 3 (x = 430): triangles and a hexagon. DEFAULT shader again.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawTriangles</span>(gl: <span class="tok-kw">anytype</span>) void {
    gl.<span class="tok-fn">triangle</span>(.{ <span class="tok-num">430</span>, <span class="tok-num">80</span> }, .{ <span class="tok-num">430</span> - <span class="tok-num">60</span>, <span class="tok-num">150</span> }, .{ <span class="tok-num">430</span> + <span class="tok-num">60</span>, <span class="tok-num">150</span> }, .{ .color = c.violet });
    gl.<span class="tok-fn">triangleLines</span>(.{ <span class="tok-num">430</span>, <span class="tok-num">160</span> }, .{ <span class="tok-num">430</span> - <span class="tok-num">20</span>, <span class="tok-num">230</span> }, .{ <span class="tok-num">430</span> + <span class="tok-num">20</span>, <span class="tok-num">230</span> }, .{ .color = c.darkblue });
    gl.<span class="tok-fn">poly</span>(.{ <span class="tok-num">430</span>, <span class="tok-num">320</span> }, <span class="tok-num">6</span>, <span class="tok-num">80</span>, <span class="tok-num">0</span>, .{ .color = c.brown });
}

<span class="tok-comment">/// The sprite. raylib puts this INSIDE the shader, as a SECOND, separate shader mode - which</span>
<span class="tok-comment">/// is what proves the mode can be re-entered rather than merely entered once.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawSprite</span>(gl: <span class="tok-kw">anytype</span>, s: *State) void {
    <span class="tok-kw">const</span> w: f32 = <span class="tok-builtin">@floatFromInt</span>(s.fudesumi.width);
    <span class="tok-kw">const</span> h: f32 = <span class="tok-builtin">@floatFromInt</span>(s.fudesumi.height);
    gl.<span class="tok-fn">texture</span>(
        .{ .x = <span class="tok-num">500</span>, .y = -<span class="tok-num">30</span>, .width = w, .height = h },
        s.fudesumi,
        .{ .tint = c.white },
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawLabels</span>(gl: <span class="tok-kw">anytype</span>) void {
    gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">20</span>, <span class="tok-num">40</span> }, <span class="tok-str">"USING DEFAULT SHADER"</span>, .{ .size = <span class="tok-num">14</span>, .color = c.red });
    gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">190</span>, <span class="tok-num">40</span> }, <span class="tok-str">"USING CUSTOM SHADER"</span>, .{ .size = <span class="tok-num">14</span>, .color = c.red });
    gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">370</span>, <span class="tok-num">40</span> }, <span class="tok-str">"USING DEFAULT SHADER"</span>, .{ .size = <span class="tok-num">14</span>, .color = c.red });
    gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">380</span>, <span class="tok-num">428</span> },
        <span class="tok-str">"(c) Fudesumi sprite by Eiden Marsal"</span>,
        .{ .size = <span class="tok-num">11</span>, .color = c.gray },
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    s.elapsed += f.time.delta_time;
    z.<span class="tok-fn">clearViewport</span>(f, c.raywhite);

    <span class="tok-kw">const</span> gl = f.gl;
    s.filter.<span class="tok-fn">setParams</span>(.{ .params = .{ s.amount, s.elapsed, <span class="tok-num">0</span>, <span class="tok-num">0</span> } });

    <span class="tok-kw">if</span> (s.filter_everything) {
        <span class="tok-comment">// One shader mode around the whole frame - everything, including the labels, goes grey.</span>
        z.<span class="tok-fn">beginShaderMode</span>(gl, s.filter);
        <span class="tok-fn">drawLabels</span>(gl);
        <span class="tok-fn">drawCircles</span>(gl);
        <span class="tok-fn">drawRectangles</span>(gl);
        <span class="tok-fn">drawTriangles</span>(gl);
        <span class="tok-fn">drawSprite</span>(gl, s);
        z.<span class="tok-fn">endShaderMode</span>(gl);
    } <span class="tok-kw">else</span> {
        <span class="tok-comment">// raylib's exact interleaving: default, custom, default, custom.</span>
        <span class="tok-fn">drawLabels</span>(gl);
        <span class="tok-fn">drawCircles</span>(gl);

        z.<span class="tok-fn">beginShaderMode</span>(gl, s.filter);
        <span class="tok-fn">drawRectangles</span>(gl);
        z.<span class="tok-fn">endShaderMode</span>(gl);

        <span class="tok-fn">drawTriangles</span>(gl);

        z.<span class="tok-fn">beginShaderMode</span>(gl, s.filter);
        <span class="tok-fn">drawSprite</span>(gl, s);
        z.<span class="tok-fn">endShaderMode</span>(gl);
    }

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"grayscale.fs"</span>, .{})) |win| {
        <span class="tok-kw">defer</span> win.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Middle column + sprite run the user shader."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Circles and triangles do not."</span>, .{});
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"grey"</span>, &amp;s.amount, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">1</span> });
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"filter the whole frame"</span>, &amp;s.filter_everything);
    }
    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - shaders - shapes + textures (BeginShaderMode)"</span>,
            <span class="tok-comment">// raylib's 800x450 design space, kept exactly.</span>
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            <span class="tok-comment">// `.fit` because those coordinates are a FIXED design space. Under `.responsive`</span>
            <span class="tok-comment">// the coordinate space is the ACTUAL device size (a phone is ~412 CSS px wide), so</span>
            <span class="tok-comment">// every hardcoded column above would land off-screen.</span>
            .scale_mode = .fit,
            .depth_format = null,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    .memory = .managed,
};
