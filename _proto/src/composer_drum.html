<h1>composer_drum</h1>
<figure class="code src-file" data-path="examples/composer_drum/composer_drum.zig" data-lines="212"><figcaption><span>examples/composer_drum/composer_drum.zig</span><span>212 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! composer_drum - port of the GL `composer_drum`: a tiny drum machine on</span>
<span class="tok-comment">//! the wgpu audio bridge. Synthesizes a kick (60Hz sine), snare (250Hz saw),</span>
<span class="tok-comment">//! and hat (4kHz triangle) with `composer.tone`, then bakes an 8-step pattern</span>
<span class="tok-comment">//! into ONE looping Wave via `composer.Sequence` (each drum added at its step's</span>
<span class="tok-comment">//! frame offset). Tap PLAY (or press SPACE) to play the loop; a step grid shows</span>
<span class="tok-comment">//! the pattern and a playhead sweeps it. All PCM - no streaming/OGG needed.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;

<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> c = z.colors;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> sample_rate: u32 = <span class="tok-num">44100</span>;
<span class="tok-kw">const</span> step_ms: usize = <span class="tok-num">125</span>;
<span class="tok-kw">const</span> steps_per_loop: usize = <span class="tok-num">8</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    scratch: std.heap.ArenaAllocator,
    audio: z.AudioState = .{},
    loop: z.Sound = .{},
    playing: bool = false,
    play_started_at_frame: usize = <span class="tok-num">0</span>,
    frame_count: usize = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.scratch.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    z.audio_device.<span class="tok-fn">init</span>(f.audio_device);
    <span class="tok-kw">var</span> audio: z.AudioState = .{};

    <span class="tok-kw">const</span> kick: z.Wave = <span class="tok-kw">try</span> z.composer.<span class="tok-fn">tone</span>(&amp;audio.waves, gpa, .{
        .frequency_hz = <span class="tok-num">60.0</span>,
        .duration_ms = <span class="tok-num">100</span>,
        .shape = .sine,
        .amplitude = <span class="tok-num">0.7</span>,
        .sample_rate = sample_rate,
        .envelope = .{ .attack_ms = <span class="tok-num">1.0</span>, .release_ms = <span class="tok-num">80.0</span> },
    });
    <span class="tok-kw">defer</span> z.waves.<span class="tok-fn">unload</span>(&amp;audio.waves, kick);
    <span class="tok-kw">const</span> snare: z.Wave = <span class="tok-kw">try</span> z.composer.<span class="tok-fn">tone</span>(&amp;audio.waves, gpa, .{
        .frequency_hz = <span class="tok-num">250.0</span>,
        .duration_ms = <span class="tok-num">80</span>,
        .shape = .sawtooth,
        .amplitude = <span class="tok-num">0.5</span>,
        .sample_rate = sample_rate,
        .envelope = .{ .attack_ms = <span class="tok-num">0.5</span>, .release_ms = <span class="tok-num">60.0</span> },
    });
    <span class="tok-kw">defer</span> z.waves.<span class="tok-fn">unload</span>(&amp;audio.waves, snare);
    <span class="tok-kw">const</span> hat: z.Wave = <span class="tok-kw">try</span> z.composer.<span class="tok-fn">tone</span>(&amp;audio.waves, gpa, .{
        .frequency_hz = <span class="tok-num">4000.0</span>,
        .duration_ms = <span class="tok-num">30</span>,
        .shape = .triangle,
        .amplitude = <span class="tok-num">0.3</span>,
        .sample_rate = sample_rate,
        .envelope = .{ .attack_ms = <span class="tok-num">0.5</span>, .release_ms = <span class="tok-num">20.0</span> },
    });
    <span class="tok-kw">defer</span> z.waves.<span class="tok-fn">unload</span>(&amp;audio.waves, hat);

    <span class="tok-comment">// Bake the 8-step pattern into one Wave (kick on 0,4; snare on 2,6; hat all).</span>
    <span class="tok-kw">var</span> seq: z.composer.Sequence = .<span class="tok-fn">init</span>(&amp;audio.waves, gpa, sample_rate, <span class="tok-num">1</span>);
    <span class="tok-kw">defer</span> seq.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">const</span> step_frames: u32 = (sample_rate * <span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(step_ms))) / <span class="tok-num">1000</span>;
    <span class="tok-kw">try</span> seq.<span class="tok-fn">add</span>(kick, <span class="tok-num">0</span> * step_frames);
    <span class="tok-kw">try</span> seq.<span class="tok-fn">add</span>(kick, <span class="tok-num">4</span> * step_frames);
    <span class="tok-kw">try</span> seq.<span class="tok-fn">add</span>(snare, <span class="tok-num">2</span> * step_frames);
    <span class="tok-kw">try</span> seq.<span class="tok-fn">add</span>(snare, <span class="tok-num">6</span> * step_frames);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..steps_per_loop) |si| {
        <span class="tok-kw">try</span> seq.<span class="tok-fn">add</span>(hat, <span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(si)) * step_frames);
    }
    <span class="tok-kw">const</span> loop_wave: z.Wave = <span class="tok-kw">try</span> seq.<span class="tok-fn">finalize</span>();
    <span class="tok-kw">defer</span> z.waves.<span class="tok-fn">unload</span>(&amp;audio.waves, loop_wave);

    <span class="tok-kw">const</span> loop_snd: z.Sound = <span class="tok-kw">try</span> z.sounds.<span class="tok-fn">loadFromWave</span>(&amp;audio.sounds, f.audio_device, gpa, loop_wave);
    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">28</span>),
        .scratch = std.heap.ArenaAllocator.<span class="tok-fn">init</span>(gpa),
        .audio = audio,
        .loop = loop_snd,
    };
}

<span class="tok-kw">const</span> Lane = <span class="tok-kw">struct</span> { name: []<span class="tok-kw">const</span> u8, hits: [steps_per_loop]bool, color: Color };
<span class="tok-kw">const</span> lanes = [<span class="tok-num">3</span>]Lane{
    .{
        .name = <span class="tok-str">"KICK"</span>,
        .hits = .{ true, false, false, false, true, false, false, false },
        .color = .{ .r = <span class="tok-num">210</span>, .g = <span class="tok-num">100</span>, .b = <span class="tok-num">80</span>, .a = <span class="tok-num">255</span> },
    },
    .{
        .name = <span class="tok-str">"SNRE"</span>,
        .hits = .{ false, false, true, false, false, false, true, false },
        .color = .{ .r = <span class="tok-num">100</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> },
    },
    .{
        .name = <span class="tok-str">"HAT "</span>,
        .hits = .{ true, true, true, true, true, true, true, true },
        .color = .{ .r = <span class="tok-num">100</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">230</span>, .a = <span class="tok-num">255</span> },
    },
};

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    _ = state.scratch.<span class="tok-fn">reset</span>(.retain_capacity);
    state.frame_count += <span class="tok-num">1</span>;

    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> click: bool = z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left);

    <span class="tok-kw">const</span> button_x: f32 = <span class="tok-num">40</span>;
    <span class="tok-kw">const</span> button_w: f32 = w - <span class="tok-num">80</span>;
    <span class="tok-kw">const</span> button_y: f32 = <span class="tok-num">470</span>;
    <span class="tok-kw">const</span> button_h: f32 = <span class="tok-num">110</span>;
    <span class="tok-kw">const</span> in_button: bool = mp[<span class="tok-num">0</span>] &gt;= button_x <span class="tok-kw">and</span> mp[<span class="tok-num">0</span>] &lt;= button_x + button_w <span class="tok-kw">and</span>
        mp[<span class="tok-num">1</span>] &gt;= button_y <span class="tok-kw">and</span> mp[<span class="tok-num">1</span>] &lt;= button_y + button_h;

    <span class="tok-kw">if</span> ((click <span class="tok-kw">and</span> in_button) <span class="tok-kw">or</span> z.<span class="tok-fn">isKeyPressed</span>(f.input, .space)) {
        state.playing = !state.playing;
        <span class="tok-kw">if</span> (state.playing) {
            z.sounds.<span class="tok-fn">play</span>(&amp;state.audio.sounds, state.loop);
            state.play_started_at_frame = state.frame_count;
        } <span class="tok-kw">else</span> {
            z.sounds.<span class="tok-fn">stop</span>(&amp;state.audio.sounds, state.loop);
        }
    }

    <span class="tok-kw">const</span> total_ms: usize = steps_per_loop * step_ms;
    <span class="tok-comment">// The baked Wave plays once (Sound.play is one-shot); re-trigger when it</span>
    <span class="tok-comment">// ends so the pattern loops continuously while "playing".</span>
    <span class="tok-kw">if</span> (state.playing) {
        <span class="tok-kw">const</span> el: usize = (state.frame_count - state.play_started_at_frame) * <span class="tok-num">16</span>;
        <span class="tok-kw">if</span> (el &gt;= total_ms) {
            z.sounds.<span class="tok-fn">play</span>(&amp;state.audio.sounds, state.loop);
            state.play_started_at_frame = state.frame_count;
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">20</span>, .g = <span class="tok-num">22</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">255</span> });
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">16</span> }, <span class="tok-str">"8-step drum loop"</span>, .{ .size = <span class="tok-num">26</span>, .color = c.white, .font = &amp;state.font });
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">50</span> }, <span class="tok-str">"tap PLAY or press SPACE"</span>, .{ .size = <span class="tok-num">15</span>, .color = c.slate_400, .font = &amp;state.font });

    <span class="tok-comment">// Playhead step (loops with the audio; ~60fps frame-&gt;ms approximation).</span>
    <span class="tok-kw">const</span> elapsed_ms: usize = <span class="tok-kw">if</span> (state.playing) (state.frame_count - state.play_started_at_frame) * <span class="tok-num">16</span> <span class="tok-kw">else</span> <span class="tok-num">0</span>;
    <span class="tok-kw">const</span> cur_step: usize = <span class="tok-kw">if</span> (state.playing)
        (elapsed_ms / step_ms) % steps_per_loop
    <span class="tok-kw">else</span>
        steps_per_loop;

    <span class="tok-kw">const</span> grid_x: f32 = <span class="tok-num">64</span>;
    <span class="tok-kw">const</span> grid_y: f32 = <span class="tok-num">110</span>;
    <span class="tok-kw">const</span> cell_w: f32 = (w - grid_x - <span class="tok-num">16</span>) / <span class="tok-fn">float</span>(steps_per_loop);
    <span class="tok-kw">const</span> cell_h: f32 = <span class="tok-num">56</span>;
    <span class="tok-kw">for</span> (lanes, <span class="tok-num">0</span>..) |lane, li| {
        <span class="tok-kw">const</span> ly: f32 = grid_y + <span class="tok-fn">float</span>(li) * (cell_h + <span class="tok-num">10</span>);
        f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">12</span>, ly + <span class="tok-num">18</span> }, lane.name, .{ .size = <span class="tok-num">16</span>, .color = c.slate_300, .font = &amp;state.font });
        <span class="tok-kw">for</span> (lane.hits, <span class="tok-num">0</span>..) |hit, step| {
            <span class="tok-kw">const</span> cx: f32 = grid_x + <span class="tok-fn">float</span>(step) * cell_w;
            <span class="tok-kw">const</span> fill: Color = <span class="tok-kw">if</span> (hit) lane.color <span class="tok-kw">else</span> .{ .r = <span class="tok-num">40</span>, .g = <span class="tok-num">42</span>, .b = <span class="tok-num">52</span>, .a = <span class="tok-num">255</span> };
            f.gl.<span class="tok-fn">rect</span>(.{ .x = cx + <span class="tok-num">2</span>, .y = ly, .width = cell_w - <span class="tok-num">6</span>, .height = cell_h }, .{ .color = fill });
            <span class="tok-kw">if</span> (step == cur_step) {
                f.gl.<span class="tok-fn">rect</span>(
                    .{ .x = cx + <span class="tok-num">2</span>, .y = ly, .width = cell_w - <span class="tok-num">6</span>, .height = cell_h },
                    .{ .color = c.white, .outline = <span class="tok-num">1.0</span> },
                );
            }
        }
    }

    <span class="tok-comment">// PLAY / STOP button.</span>
    <span class="tok-kw">const</span> btn_fill: Color = <span class="tok-kw">if</span> (state.playing) c.rose_500 <span class="tok-kw">else</span> c.emerald_500;
    f.gl.<span class="tok-fn">rect</span>(.{ .x = button_x, .y = button_y, .width = button_w, .height = button_h }, .{ .color = btn_fill });
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = button_x, .y = button_y, .width = button_w, .height = button_h },
        .{ .color = c.white, .outline = <span class="tok-num">1.0</span> },
    );
    <span class="tok-kw">const</span> label: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (state.playing) <span class="tok-str">"STOP"</span> <span class="tok-kw">else</span> <span class="tok-str">"PLAY"</span>;
    f.gl.<span class="tok-fn">text</span>(
        .{ button_x + button_w / <span class="tok-num">2</span> - <span class="tok-num">38</span>, button_y + button_h / <span class="tok-num">2</span> - <span class="tok-num">16</span> },
        label,
        .{ .size = <span class="tok-num">32</span>, .color = c.white, .font = &amp;state.font },
    );

    common.<span class="tok-fn">caption</span>(f.gl, state.font, <span class="tok-str">"composer.tone + composer.Sequence baked into one looping Wave"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - composer drum"</span>,
            .width = <span class="tok-num">450</span>,
            .height = <span class="tok-num">800</span>,
            .scale_mode = .fit,
            .depth_format = null,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
