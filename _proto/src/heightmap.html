<h1>heightmap</h1>
<figure class="code src-file" data-path="examples/heightmap/heightmap.zig" data-lines="435"><figcaption><span>examples/heightmap/heightmap.zig</span><span>435 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! heightmap - raylib's `models_heightmap`, the zimr way.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A Perlin-noise image is turned into a terrain mesh by</span>
<span class="tok-comment">//! `genMeshHeightmap` (already in the engine - each pixel's grayscale</span>
<span class="tok-comment">//! becomes a vertex height), then drawn with the new height-banded</span>
<span class="tok-comment">//! `terrain_fs` on the shared `gbuffer_vs`, so the landscape colours</span>
<span class="tok-comment">//! itself water-&gt;grass-&gt;rock-&gt;snow from its own shape with no texture</span>
<span class="tok-comment">//! upload.  A "regen" button rolls a fresh noise field (new offset)</span>
<span class="tok-comment">//! and rebuilds the mesh into the same GPU buffers.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! raylib loads a PNG heightmap and maps a matching PNG as the</span>
<span class="tok-comment">//! surface texture; this port generates the field procedurally (so the</span>
<span class="tok-comment">//! standalone needs no asset) and reads height as colour instead of</span>
<span class="tok-comment">//! sampling a texture - the terrain look falls out of the geometry.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Phone-first: slow auto-orbit; one finger drags to take over, pinch</span>
<span class="tok-comment">//! zooms.  The little source-noise image is shown in the corner via</span>
<span class="tok-comment">//! `drawTextureRec` so you can see the map the mesh came from.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-kw">const</span> mat_vs = z.deferred_shaders.gbuffer_vs;
<span class="tok-kw">const</span> mat_fs = z.terrain_shader;

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> gbuffer_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"gbuffer_vs.wgsl"</span>);
<span class="tok-kw">const</span> terrain_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"terrain_fs.wgsl"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> VsUbo = <span class="tok-builtin">@FieldType</span>(mat_vs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> FsUbo = <span class="tok-builtin">@FieldType</span>(mat_fs.Io, <span class="tok-str">"u"</span>);

<span class="tok-kw">const</span> bg_clear: Color = .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">22</span>, .b = <span class="tok-num">30</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> sun_dir: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0.5</span>, <span class="tok-num">0.8</span>, <span class="tok-num">0.35</span> };

<span class="tok-kw">const</span> map_dim: i32 = <span class="tok-num">64</span>; <span class="tok-comment">// heightmap resolution (raylib uses ~128 PNG)</span>
<span class="tok-kw">const</span> terrain_size: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">16.0</span>, <span class="tok-num">5.0</span>, <span class="tok-num">16.0</span> }; <span class="tok-comment">// world extents (x, max height, z)</span>

<span class="tok-kw">const</span> MeshVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    position: [<span class="tok-num">3</span>]f32,
    normal: [<span class="tok-num">3</span>]f32,
};

<span class="tok-kw">const</span> GpuMesh = <span class="tok-kw">struct</span> {
    vbo: z.wgpu.BufferHandle,
    vbo_bytes: u64,
    vcount: u32,
};

<span class="tok-comment">/// Turn the engine's heightmap mesh (separate pos/normal float arrays)</span>
<span class="tok-comment">/// into our interleaved P3N3 stream and (re)fill the GPU buffer.  The</span>
<span class="tok-comment">/// vertex count is fixed by map_dim, so one allocation serves every</span>
<span class="tok-comment">/// regen.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">fillMesh</span>(
    gpa: Allocator,
    queue: z.wgpu.QueueHandle,
    vbo: z.wgpu.BufferHandle,
    mesh: z.Mesh,
    scratch: []MeshVertex,
) void {
    _ = gpa;
    <span class="tok-kw">const</span> vcount: usize = <span class="tok-builtin">@intCast</span>(mesh.vertexCount);
    <span class="tok-kw">for</span> (scratch[<span class="tok-num">0</span>..vcount], <span class="tok-num">0</span>..) |*v, i| {
        v.* = .{
            .position = .{ mesh.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>], mesh.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>], mesh.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] },
            .normal = .{ mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>], mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>], mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] },
        };
    }
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(scratch[<span class="tok-num">0</span>..vcount]));
}

<span class="tok-comment">/// Build a fresh Perlin field at `offset`, upload it to `preview`, and</span>
<span class="tok-comment">/// regenerate the terrain mesh from it.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">regen</span>(
    gpa: Allocator,
    f: *z.Frame,
    vbo: z.wgpu.BufferHandle,
    scratch: []MeshVertex,
    preview: *z.WgpuTexture,
    offset: i32,
) !u32 {
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">genImagePerlinNoise</span>(gpa, map_dim, map_dim, offset, offset, <span class="tok-num">4.0</span>);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadImage</span>(gpa, img);

    <span class="tok-comment">// Refresh the little corner preview of the source noise.</span>
    <span class="tok-kw">if</span> (preview.handle != .invalid) {
        preview.<span class="tok-fn">deinit</span>();
    }
    preview.* = z.<span class="tok-fn">loadTextureFromImage</span>(f.gl, img);

    <span class="tok-kw">const</span> mesh: z.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshHeightmap</span>(gpa, img, <span class="tok-fn">vec</span>(
        terrain_size[<span class="tok-num">0</span>],
        terrain_size[<span class="tok-num">1</span>],
        terrain_size[<span class="tok-num">2</span>],
    ));
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadMesh</span>(gpa, mesh);
    <span class="tok-fn">fillMesh</span>(gpa, f.gpu.queue, vbo, mesh, scratch);
    <span class="tok-kw">return</span> <span class="tok-builtin">@intCast</span>(mesh.vertexCount);
}

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    pipeline: z.wgpu.RenderPipelineHandle,
    empty_bg: z.wgpu.BindGroupHandle,
    mesh: GpuMesh,
    scratch: []MeshVertex,
    vs_ubo: z.wgpu.BufferHandle,
    g0_bg: z.wgpu.BindGroupHandle,
    fs_ubo: z.wgpu.BufferHandle,
    g2_bg: z.wgpu.BindGroupHandle,
    preview: z.WgpuTexture = .{},

    offset: i32 = <span class="tok-num">0</span>,

    rt: z.RenderTexture,
    ui_host: z.UiHost,
    font: z.Font,

    cam_yaw: f32 = <span class="tok-num">0.7</span>,
    cam_pitch: f32 = <span class="tok-num">0.6</span>,
    cam_dist: f32 = <span class="tok-num">26.0</span>,
    auto_orbit: bool = true,
    dragging: bool = false,
    prev_pinch: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.pipeline);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.empty_bg);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.g0_bg);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.g2_bg);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.mesh.vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vs_ubo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.fs_ubo);
    s.preview.<span class="tok-fn">deinit</span>();
    s.rt.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.scratch);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;

    <span class="tok-comment">// (map_dim-1)^2 quads * 2 tris * 3 verts - the fixed vertex budget.</span>
    <span class="tok-kw">const</span> cap: usize = <span class="tok-builtin">@as</span>(usize, <span class="tok-builtin">@intCast</span>(map_dim - <span class="tok-num">1</span>)) * <span class="tok-builtin">@as</span>(usize, <span class="tok-builtin">@intCast</span>(map_dim - <span class="tok-num">1</span>)) * <span class="tok-num">6</span>;
    <span class="tok-kw">const</span> scratch: []MeshVertex = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(MeshVertex, cap);
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = cap * <span class="tok-builtin">@sizeOf</span>(MeshVertex),
        .usage = .{ .vertex = true, .copy_dst = true },
    });

    <span class="tok-kw">const</span> vs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(VsUbo),
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-kw">const</span> fs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(FsUbo),
        .usage = .{ .uniform = true, .copy_dst = true },
    });

    <span class="tok-kw">const</span> g0_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{
            .binding = <span class="tok-num">0</span>,
            .visibility = .{ .vertex = true },
            .resource = .{ .uniform_buffer = .{ .min_size = <span class="tok-builtin">@sizeOf</span>(VsUbo) } },
        },
    };
    <span class="tok-kw">const</span> g0_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g0_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g0_blob);
    <span class="tok-kw">const</span> g0_bgl: z.wgpu.BindGroupLayoutHandle = z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g0_blob, <span class="tok-str">"hm_g0"</span>);
    <span class="tok-kw">const</span> g2_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{
            .binding = <span class="tok-num">0</span>,
            .visibility = .{ .fragment = true },
            .resource = .{ .uniform_buffer = .{ .min_size = <span class="tok-builtin">@sizeOf</span>(FsUbo) } },
        },
    };
    <span class="tok-kw">const</span> g2_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g2_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g2_blob);
    <span class="tok-kw">const</span> g2_bgl: z.wgpu.BindGroupLayoutHandle = z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g2_blob, <span class="tok-str">"hm_g2"</span>);
    <span class="tok-kw">const</span> empty_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_blob);
    <span class="tok-kw">const</span> empty_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, empty_blob, <span class="tok-str">"hm_empty"</span>);
    <span class="tok-kw">const</span> empty_bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_bg_blob);
    <span class="tok-kw">const</span> empty_bg: z.wgpu.BindGroupHandle =
        z.wgpu.<span class="tok-fn">createBindGroup</span>(device, empty_bgl, empty_bg_blob, <span class="tok-str">"hm_empty_bg"</span>);

    <span class="tok-kw">const</span> g0_bg_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = vs_ubo, .size = <span class="tok-builtin">@sizeOf</span>(VsUbo) } } },
    };
    <span class="tok-kw">const</span> g0_bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;g0_bg_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g0_bg_blob);
    <span class="tok-kw">const</span> g0_bg: z.wgpu.BindGroupHandle = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, g0_bgl, g0_bg_blob, <span class="tok-str">"hm_g0_bg"</span>);
    <span class="tok-kw">const</span> g2_bg_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = fs_ubo, .size = <span class="tok-builtin">@sizeOf</span>(FsUbo) } } },
    };
    <span class="tok-kw">const</span> g2_bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;g2_bg_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g2_bg_blob);
    <span class="tok-kw">const</span> g2_bg: z.wgpu.BindGroupHandle = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, g2_bgl, g2_bg_blob, <span class="tok-str">"hm_g2_bg"</span>);

    <span class="tok-kw">const</span> pl: z.wgpu.PipelineLayoutHandle =
        z.wgpu.<span class="tok-fn">createPipelineLayout</span>(device, &amp;.{ g0_bgl, empty_bgl, g2_bgl }, <span class="tok-str">"hm_pl"</span>);
    <span class="tok-kw">const</span> vs_mod: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, gbuffer_vs_wgsl, <span class="tok-str">"gbuffer_vs"</span>);
    <span class="tok-kw">const</span> fs_mod: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, terrain_fs_wgsl, <span class="tok-str">"terrain_fs"</span>);
    <span class="tok-kw">const</span> combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less,
        .back,
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{.{
            .array_stride = <span class="tok-builtin">@sizeOf</span>(MeshVertex),
            .step_mode = .vertex,
            .attributes = &amp;.{
                .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
                .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
            },
        }},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pipe_blob);
    <span class="tok-kw">const</span> pipeline: z.wgpu.RenderPipelineHandle =
        z.wgpu.<span class="tok-fn">createRenderPipeline</span>(device, pl, vs_mod, fs_mod, pipe_blob, <span class="tok-str">"hm_pipe"</span>);

    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.* = .{
        .gpa = gpa,
        .pipeline = pipeline,
        .empty_bg = empty_bg,
        .mesh = .{ .vbo = vbo, .vbo_bytes = cap * <span class="tok-builtin">@sizeOf</span>(MeshVertex), .vcount = <span class="tok-num">0</span> },
        .scratch = scratch,
        .vs_ubo = vs_ubo,
        .g0_bg = g0_bg,
        .fs_ubo = fs_ubo,
        .g2_bg = g2_bg,
        .rt = .{},
        .font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
    };
    s.mesh.vcount = <span class="tok-kw">try</span> <span class="tok-fn">regen</span>(gpa, f, vbo, scratch, &amp;s.preview, s.offset);

    <span class="tok-comment">// Build-only intermediates: the pipeline + bind groups have internalized</span>
    <span class="tok-comment">// what they reference, so these locals can be released now.</span>
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(fs_mod);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(pl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(g0_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(g2_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(empty_bgl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> bw: u32 = <span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> bh: u32 = <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt.color != .invalid <span class="tok-kw">and</span> s.rt.width == bw <span class="tok-kw">and</span> s.rt.height == bh) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.rt.color != .invalid) {
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt);
    }
    s.rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(bw), <span class="tok-builtin">@intCast</span>(bh));
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(f: *z.Frame, s: *State, ui_wants_mouse: bool) void {
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> dx: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (s.prev_pinch &gt; <span class="tok-num">0</span>) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - (dist - s.prev_pinch) * <span class="tok-num">0.05</span>, <span class="tok-num">10.0</span>, <span class="tok-num">48.0</span>);
        }
        s.prev_pinch = dist;
        <span class="tok-kw">return</span>;
    }
    s.prev_pinch = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !ui_wants_mouse) {
        <span class="tok-kw">if</span> (s.dragging) {
            <span class="tok-kw">const</span> d: Vec2 = z.<span class="tok-fn">getMouseDelta</span>(f.input);
            s.cam_yaw -= d[<span class="tok-num">0</span>] * <span class="tok-num">0.008</span>;
            s.cam_pitch = <span class="tok-fn">clamp</span>(s.cam_pitch + d[<span class="tok-num">1</span>] * <span class="tok-num">0.008</span>, <span class="tok-num">0.1</span>, <span class="tok-num">1.4</span>);
            s.auto_orbit = false;
        }
        s.dragging = true;
    } <span class="tok-kw">else</span> {
        s.dragging = false;
    }
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span>) {
        s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - wheel * <span class="tok-num">1.0</span>, <span class="tok-num">10.0</span>, <span class="tok-num">48.0</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-builtin">@floatCast</span>(f.time.delta_time);
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing; uses</span>
    <span class="tok-comment">// last-frame UI state = 1-frame lag, imperceptible).</span>

    <span class="tok-kw">if</span> (s.auto_orbit) {
        s.cam_yaw += dt * <span class="tok-num">0.2</span>;
    }

    <span class="tok-comment">// ---- camera, centered on the terrain's middle ----</span>
    <span class="tok-kw">const</span> cx: f32 = terrain_size[<span class="tok-num">0</span>] * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> cz: f32 = terrain_size[<span class="tok-num">2</span>] * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> center: Vec = <span class="tok-fn">vec</span>(cx, terrain_size[<span class="tok-num">1</span>] * <span class="tok-num">0.35</span>, cz);
    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(s.cam_pitch);
    <span class="tok-kw">const</span> sp: f32 = <span class="tok-builtin">@sin</span>(s.cam_pitch);
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-builtin">@cos</span>(s.cam_yaw);
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-builtin">@sin</span>(s.cam_yaw);
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(
        center[<span class="tok-num">0</span>] + s.cam_dist * cp * sy,
        center[<span class="tok-num">1</span>] + s.cam_dist * sp,
        center[<span class="tok-num">2</span>] + s.cam_dist * cp * cy,
    );
    <span class="tok-kw">const</span> cam_view: Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, center, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> cam_proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(<span class="tok-num">1.0</span>, vw / vh, <span class="tok-num">0.1</span>, <span class="tok-num">200.0</span>);
    <span class="tok-kw">const</span> cam_vp: Mat = <span class="tok-fn">mulMat</span>(cam_proj, cam_view);

    <span class="tok-kw">var</span> vs_io: mat_vs.Io = undefined;
    vs_io.u = .{ .mvp = cam_vp, .model = zm.<span class="tok-fn">identity</span>(), .normal_matrix = zm.<span class="tok-fn">identity</span>() };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.vs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;vs_io.u));

    <span class="tok-kw">var</span> fs_io: mat_fs.Io = undefined;
    fs_io.u = .{
        .light_dir = .{ sun_dir[<span class="tok-num">0</span>], sun_dir[<span class="tok-num">1</span>], sun_dir[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .band_lo = .{ <span class="tok-num">0.16</span>, <span class="tok-num">0.30</span>, <span class="tok-num">0.55</span>, <span class="tok-num">1</span> }, <span class="tok-comment">// deep water</span>
        .band_mid = .{ <span class="tok-num">0.30</span>, <span class="tok-num">0.62</span>, <span class="tok-num">0.32</span>, <span class="tok-num">1</span> }, <span class="tok-comment">// grass</span>
        .band_hi = .{ <span class="tok-num">0.48</span>, <span class="tok-num">0.40</span>, <span class="tok-num">0.30</span>, <span class="tok-num">1</span> }, <span class="tok-comment">// rock</span>
        .band_top = .{ <span class="tok-num">0.95</span>, <span class="tok-num">0.95</span>, <span class="tok-num">0.98</span>, <span class="tok-num">1</span> }, <span class="tok-comment">// snow</span>
        .params = .{ <span class="tok-num">0.0</span>, terrain_size[<span class="tok-num">1</span>], <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.fs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;fs_io.u));

    <span class="tok-comment">// ---- the terrain pass ----</span>
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.rt, bg_clear);
    <span class="tok-kw">const</span> pa: *z.PassState = f.gl.pass;
    Backend.<span class="tok-fn">setPipeline</span>(pa, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">0</span>, s.g0_bg);
    Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">1</span>, s.empty_bg);
    Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">2</span>, s.g2_bg);
    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(pa.pass, .{
        .slot = <span class="tok-num">0</span>,
        .buffer = s.mesh.vbo,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-builtin">@as</span>(u64, s.mesh.vcount) * <span class="tok-builtin">@sizeOf</span>(MeshVertex),
    });
    z.render_pass.<span class="tok-fn">draw</span>(pa.pass, .{
        .vertex_count = s.mesh.vcount,
        .instance_count = <span class="tok-num">1</span>,
        .first_vertex = <span class="tok-num">0</span>,
        .first_instance = <span class="tok-num">0</span>,
    });
    z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);

    <span class="tok-comment">// SCREEN PASS: open once, composite (+ preview), then UI.</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, bg_clear);
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh }, s.rt.<span class="tok-fn">asTexture</span>(), .{ .tint = white });

    <span class="tok-comment">// Corner preview of the source noise the mesh came from.</span>
    <span class="tok-kw">if</span> (s.preview.handle != .invalid) {
        <span class="tok-kw">const</span> pv: f32 = <span class="tok-builtin">@min</span>(vw, vh) * <span class="tok-num">0.22</span>;
        f.gl.<span class="tok-fn">texture</span>(.{ .x = vw - pv - <span class="tok-num">8</span>, .y = <span class="tok-num">8</span>, .width = pv, .height = pv }, s.preview, .{ .tint = white });
    }

    <span class="tok-comment">// ---- UI ----</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">300</span>, vw - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">120</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">112</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"heightmap"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"perlin -&gt; genMeshHeightmap"</span>, .{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"regen"</span>, .{})) {
            s.offset += <span class="tok-num">137</span>; <span class="tok-comment">// new slice of the noise field</span>
            s.mesh.vcount = <span class="tok-fn">regen</span>(s.gpa, f, s.mesh.vbo, s.scratch, &amp;s.preview, s.offset) <span class="tok-kw">catch</span> s.mesh.vcount;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"orbit"</span>, &amp;s.auto_orbit);
    }
    <span class="tok-fn">handleInput</span>(f, s, u.<span class="tok-fn">wantCaptureMouse</span>());
    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}
