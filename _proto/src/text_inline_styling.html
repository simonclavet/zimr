<h1>text_inline_styling</h1>
<figure class="code src-file" data-path="examples/text_inline_styling/text_inline_styling.zig" data-lines="324"><figcaption><span>examples/text_inline_styling/text_inline_styling.zig</span><span>324 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/text_inline_styling.zig - inline styling markers inside a string.</span>
<span class="tok-comment">// Ports raylib's `text_inline_styling`: the text carries its own formatting via</span>
<span class="tok-comment">// `[ ]` tags, so one string can change color mid-sentence without the caller</span>
<span class="tok-comment">// splitting it up.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   [cRRGGBBAA]  set FOREGROUND color</span>
<span class="tok-comment">//   [bRRGGBBAA]  set BACKGROUND color (a filled rect behind the glyphs)</span>
<span class="tok-comment">//   [r]          reset to the base style</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Tag colors are multiplied by the BASE color's alpha, so fading the whole</span>
<span class="tok-comment">// string fades its styled spans with it (raylib does the same).</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The renderer walks the string, splits it into STYLED RUNS at each tag, and</span>
<span class="tok-comment">// draws run by run: `z.measureText` gives each run's exact width, which both</span>
<span class="tok-comment">// advances the pen and sizes the background rect. Measuring (rather than</span>
<span class="tok-comment">// assuming a monospace advance) is what keeps backgrounds flush with their text</span>
<span class="tok-comment">// and makes `measureStyled` agree with what is actually drawn.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Leak-clean (`.memory = .managed`): the UiHost is deinit'd; atlases are</span>
<span class="tok-comment">// engine-owned.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-comment">// Atkinson Hyperlegible Mono - the Braille Institute's legibility font.</span>
<span class="tok-comment">// Distinct letterforms (slashed zero, unambiguous I/l/1), and a deliberate</span>
<span class="tok-comment">// break from raylib's look. Latin-only content, so its cmap is plenty:</span>
<span class="tok-comment">// ASCII + Latin-1 accented in full. (It has NO Cyrillic and almost no Greek,</span>
<span class="tok-comment">// which is why the Unicode examples stay on RobotoMono.)</span>
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> text_size: f32 = <span class="tok-num">20.0</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    ui_font: z.Font,
    rng: std.Random.DefaultPrng,
    rand_col: Color = .{ .r = <span class="tok-num">230</span>, .g = <span class="tok-num">41</span>, .b = <span class="tok-num">55</span>, .a = <span class="tok-num">255</span> },
    line_buf: [<span class="tok-num">96</span>]u8 = undefined,
    fade: f32 = <span class="tok-num">255.0</span>, <span class="tok-comment">// base alpha - proves tag colors inherit it</span>
};

<span class="tok-comment">/// Parse 8 hex digits (RRGGBBAA). Returns null on anything malformed, so a typo</span>
<span class="tok-comment">/// in a tag degrades to "draw the tag literally" rather than a wrong color.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">parseHex8</span>(s: []<span class="tok-kw">const</span> u8) ?Color {
    <span class="tok-kw">if</span> (s.len != <span class="tok-num">8</span>) {
        <span class="tok-kw">return</span> null;
    }
    <span class="tok-kw">const</span> v: u32 = std.fmt.<span class="tok-fn">parseInt</span>(u32, s, <span class="tok-num">16</span>) <span class="tok-kw">catch</span> <span class="tok-kw">return</span> null;
    <span class="tok-kw">return</span> .{
        .r = <span class="tok-builtin">@intCast</span>((v &gt;&gt; <span class="tok-num">24</span>) &amp; <span class="tok-num">0xFF</span>),
        .g = <span class="tok-builtin">@intCast</span>((v &gt;&gt; <span class="tok-num">16</span>) &amp; <span class="tok-num">0xFF</span>),
        .b = <span class="tok-builtin">@intCast</span>((v &gt;&gt; <span class="tok-num">8</span>) &amp; <span class="tok-num">0xFF</span>),
        .a = <span class="tok-builtin">@intCast</span>(v &amp; <span class="tok-num">0xFF</span>),
    };
}

<span class="tok-comment">/// Scale a tag color's alpha by the base alpha (raylib's rule).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">withBaseAlpha</span>(col: Color, base: Color) Color {
    <span class="tok-kw">const</span> a: u32 = (<span class="tok-builtin">@as</span>(u32, col.a) * <span class="tok-builtin">@as</span>(u32, base.a)) / <span class="tok-num">255</span>;
    <span class="tok-kw">return</span> .{ .r = col.r, .g = col.g, .b = col.b, .a = <span class="tok-builtin">@intCast</span>(a) };
}

<span class="tok-kw">const</span> Style = <span class="tok-kw">struct</span> {
    fg: Color,
    bg: ?Color = null,
};

<span class="tok-comment">/// Draw one run of plain text in the current style, advancing the pen.</span>
<span class="tok-comment">/// The background (if any) is sized by the run's MEASURED width, so it hugs the</span>
<span class="tok-comment">/// glyphs exactly.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawRun</span>(
    gl: *z.WgpuGl,
    font: *z.Font,
    run: []<span class="tok-kw">const</span> u8,
    pen: *f32,
    y: f32,
    st: Style,
) void {
    <span class="tok-kw">if</span> (run.len == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> w: f32 = z.<span class="tok-fn">measureText</span>(font.*, run, text_size)[<span class="tok-num">0</span>];
    <span class="tok-kw">if</span> (st.bg) |bg| {
        gl.<span class="tok-fn">rect</span>(.{ .x = pen.*, .y = y, .width = w, .height = text_size }, .{ .color = bg });
    }
    gl.<span class="tok-fn">text</span>(.{ pen.*, y }, run, .{ .size = text_size, .color = st.fg, .font = font });
    pen.* += w;
}

<span class="tok-comment">/// Walk `text`, applying `[c..]` / `[b..]` / `[r]` tags and drawing the runs</span>
<span class="tok-comment">/// between them. `emit = false` measures only (the shared walk keeps</span>
<span class="tok-comment">/// measurement and drawing from ever disagreeing).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">walkStyled</span>(
    gl: ?*z.WgpuGl,
    font: *z.Font,
    text: []<span class="tok-kw">const</span> u8,
    pos: Vec2,
    base: Color,
    emit: bool,
) f32 {
    <span class="tok-kw">var</span> pen: f32 = pos[<span class="tok-num">0</span>];
    <span class="tok-kw">var</span> st: Style = .{ .fg = base, .bg = null };

<span class="tok-kw">fn</span> <span class="tok-fn">drawStyled</span>(

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {

<span class="tok-kw">fn</span> <span class="tok-fn">rollColor</span>(s: *State) void {

        .g = r.<span class="tok-fn">intRangeAtMost</span>(u8, <span class="tok-num">60</span>, <span class="tok-num">255</span>),
        .b = r.<span class="tok-fn">intRangeAtMost</span>(u8, <span class="tok-num">60</span>, <span class="tok-num">255</span>),

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();

    z.<span class="tok-fn">clearViewport</span>(f, c.raywhite);

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-comment">// Window is sized generously ON PURPOSE. `buttonImpl` bails via `itemAdd`</span>
    <span class="tok-comment">// when a widget lands FULLY outside the window rect - a too-short window</span>
    <span class="tok-comment">// silently produces a button that renders but never returns true. Long help</span>
    <span class="tok-comment">// text WRAPS on a narrow phone, which is what pushes widgets out.</span>
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16.0</span>, <span class="tok-num">250</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Inline styling"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"[c..] fg  [b..] bg  [r] reset"</span>, .{});
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Randomize color"</span>, .{})) {
            <span class="tok-fn">rollColor</span>(s);
        }
        <span class="tok-comment">// Readout of the live state: if these numbers don't change when the</span>
        <span class="tok-comment">// button is tapped, the button isn't firing (not the color pipeline).</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"color: {d}, {d}, {d}"</span>, .{ s.rand_col.r, s.rand_col.g, s.rand_col.b });

        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"base alpha"</span>, &amp;s.fade, .{ .min = <span class="tok-num">40</span>, .max = <span class="tok-num">255</span> });

    <span class="tok-comment">// Unmissable swatch of the current random color, next to the line it tints.</span>
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = fw - <span class="tok-num">60.0</span>, .y = <span class="tok-num">270</span>, .width = <span class="tok-num">44</span>, .height = <span class="tok-num">44</span> },
        .{ .color = s.rand_col },
    );

    <span class="tok-kw">const</span> base: Color = .{ .r = <span class="tok-num">40</span>, .g = <span class="tok-num">40</span>, .b = <span class="tok-num">48</span>, .a = <span class="tok-builtin">@intFromFloat</span>(s.fade) };
    <span class="tok-kw">var</span> y: f32 = <span class="tok-num">280</span>;

    <span class="tok-fn">drawStyled</span>(
        f.gl,
        &amp;s.font,
        <span class="tok-str">"Changes the [cFF0000FF]foreground[r] color!"</span>,
        .{ <span class="tok-num">16</span>, y },
        base,
    );
    y += <span class="tok-num">34</span>;
    <span class="tok-fn">drawStyled</span>(
        f.gl,
        &amp;s.font,
        <span class="tok-str">"Changes the [bFFDD00FF]background[r] color!"</span>,
        .{ <span class="tok-num">16</span>, y },
        base,
    );
    y += <span class="tok-num">34</span>;
    <span class="tok-fn">drawStyled</span>(
        f.gl,
        &amp;s.font,
        <span class="tok-str">"[c00A040FF][bFFFFFFFF]Both at once[r] - then back to normal."</span>,
        .{ <span class="tok-num">16</span>, y },
        base,
    );
    y += <span class="tok-num">34</span>;
    <span class="tok-fn">drawStyled</span>(
        f.gl,
        &amp;s.font,
        <span class="tok-str">"Alpha is [cFF000088]relative to the base[r] color."</span>,
        .{ <span class="tok-num">16</span>, y },
        base,
    );
    y += <span class="tok-num">44</span>;

    <span class="tok-comment">// Colors can be built at runtime - the tag is just text.</span>
    <span class="tok-kw">const</span> line: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;s.line_buf,
        <span class="tok-str">"Let's be [c{X:0&gt;2}{X:0&gt;2}{X:0&gt;2}FF]CREATIVE[r] !!!"</span>,
        .{ s.rand_col.r, s.rand_col.g, s.rand_col.b },
    ) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
    <span class="tok-fn">drawStyled</span>(f.gl, &amp;s.font, line, .{ <span class="tok-num">16</span>, y }, base);

    <span class="tok-comment">// its measured width. If the underline over/undershoots, the two walks have</span>
    <span class="tok-comment">// diverged.</span>

        .{ .color = .{ .r = <span class="tok-num">150</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">160</span>, .a = <span class="tok-num">255</span> } },
    );
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, y + <span class="tok-num">34.0</span> },
        <span class="tok-str">"(underline = measureStyled width; tags excluded)"</span>,
        .{ .size = <span class="tok-num">15</span>, .color = c.gray, .font = &amp;s.font },
    );

    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}
