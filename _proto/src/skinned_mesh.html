<h1>skinned_mesh</h1>
<figure class="code src-file" data-path="examples/skinned_mesh/skinned_mesh.zig" data-lines="335"><figcaption><span>examples/skinned_mesh/skinned_mesh.zig</span><span>335 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! skinned_mesh - port of the GL `skinned_mesh`: a skinned glTF rig,</span>
<span class="tok-comment">//! animated and deformed every frame. (The bone-socket technique - parenting</span>
<span class="tok-comment">//! an object to a bone - now lives in its own `bone_socket` example on a real</span>
<span class="tok-comment">//! rigged character, so this stays a focused pure-skinning demo.)</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The 2KB embedded GLB (same `skinned_mesh_data` the GL demo generated):</span>
<span class="tok-comment">//! a 6-vertex quad, 2 bones, JOINTS_0/WEIGHTS_0, inverseBindMatrices, and a</span>
<span class="tok-comment">//! "wave" animation rotating bone 1 +/-45 deg around Z over 1.5s - so the right</span>
<span class="tok-comment">//! edge of the quad waves while the left edge stays anchored.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Port shape: the GL original ran a GPU skinning shader (bone VBOs in</span>
<span class="tok-comment">//! slots 7/8 + a boneMatrices uniform).  The wgpu typed-shader path has no</span>
<span class="tok-comment">//! skinned pipeline variant yet, so this is the honest CPU-SKINNED v1:</span>
<span class="tok-comment">//!   parse (codecs.gltf already does skins + animations + JOINTS/WEIGHTS)</span>
<span class="tok-comment">//!   -&gt; sample keyframes (nlerp quats) -&gt; per-joint world = v*R*T</span>
<span class="tok-comment">//!   -&gt; skin matrix = v*inverseBind*world -&gt; vertices deformed on the CPU</span>
<span class="tok-comment">//!   -&gt; `updateMeshBuffer` (the dynamic-mesh path) -&gt; `drawModel`.</span>
<span class="tok-comment">//! Bone gizmos (spheres + a line) draw the live skeleton over the mesh.</span>
<span class="tok-comment">//! When the typed-3D-shader arc grows a skinned variant, the pose math</span>
<span class="tok-comment">//! here moves behind it unchanged - the matrices are the same either way.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Matrix conventions, derived from zm's source: zm is row-vector /</span>
<span class="tok-comment">//! row-major (`mulMatVec(m, v) = v*m`, translation lives in row 3), which</span>
<span class="tok-comment">//! makes glTF's COLUMN-major mat4 floats map DIRECTLY onto zm.Mat rows,</span>
<span class="tok-comment">//! and "rotate then translate" compose as `mulMat(R, T)`.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> f32x4 = zm.f32x4;
<span class="tok-kw">const</span> matFromQuat = zm.matFromQuat;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> mulMatVec = zm.mulMatVec;
<span class="tok-kw">const</span> pointVec = zm.pointVec;
<span class="tok-kw">const</span> quat_identity = zm.quat_identity;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> translationV = zm.translationV;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> c = z.colors;
<span class="tok-kw">const</span> skin_data = <span class="tok-builtin">@import</span>(<span class="tok-str">"skinned_mesh_data.zig"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> max_joints: usize = <span class="tok-num">8</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    model: z.Model,
    <span class="tok-comment">/// Bind-pose positions (the skin source - never mutated).</span>
    base_positions: []f32,
    <span class="tok-comment">/// Per-frame skinned positions, memcpy'd into the mesh via</span>
    <span class="tok-comment">/// `updateMeshBuffer`.</span>
    skinned: []f32,
    <span class="tok-comment">/// vec4 u8 per vertex / vec4 f32 per vertex (views into the mesh).</span>
    bone_ids: [*c]u8,
    bone_weights: [*c]f32,
    vertex_count: usize,

    <span class="tok-comment">// ---- the rig, extracted from the GLB at init ----</span>
    joint_count: usize,
    <span class="tok-comment">/// glTF node index per joint slot.</span>
    joint_nodes: [max_joints]u32,
    <span class="tok-comment">/// Bind translation per joint node (the rig animates rotation only).</span>
    node_translation: [max_joints]Vec,
    inverse_bind: [max_joints]Mat,
    <span class="tok-comment">/// Keyframe times (shared by both channels in this rig).</span>
    times: []f32,
    <span class="tok-comment">/// Per-joint keyframe rotations: rot[j][k] = quat at keyframe k.</span>
    rot: [max_joints][]Vec,

    t: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.<span class="tok-fn">unloadModel</span>(gpa, s.model);
    gpa.<span class="tok-fn">free</span>(s.base_positions);
    gpa.<span class="tok-fn">free</span>(s.skinned);
    gpa.<span class="tok-fn">free</span>(s.times);
    <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; s.joint_count) : (j += <span class="tok-num">1</span>) {
        gpa.<span class="tok-fn">free</span>(s.rot[j]);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">var</span> document: z.codecs.gltf.Data = <span class="tok-kw">try</span> z.codecs.gltf.<span class="tok-fn">parse</span>(gpa, &amp;skin_data.skin_glb);
    <span class="tok-kw">defer</span> document.<span class="tok-fn">deinit</span>();

    <span class="tok-kw">const</span> meshes: []z.types.Mesh = <span class="tok-kw">try</span> z.codecs.gltf.<span class="tok-fn">meshesFromGltf</span>(gpa, document);
    <span class="tok-kw">if</span> (meshes.len == <span class="tok-num">0</span> <span class="tok-kw">or</span> meshes[<span class="tok-num">0</span>].boneIndices == null <span class="tok-kw">or</span> meshes[<span class="tok-num">0</span>].boneWeights == null) {
        <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NotASkinnedMesh;
    }
    <span class="tok-kw">const</span> mesh: z.types.Mesh = meshes[<span class="tok-num">0</span>];
    <span class="tok-comment">// Free the outer slice from meshesFromGltf (we keep meshes[0] by value; its</span>
    <span class="tok-comment">// CPU arrays travel with the model). Without this the twice-lifecycle census</span>
    <span class="tok-comment">// leaks a little each cycle.</span>
    gpa.<span class="tok-fn">free</span>(meshes);
    <span class="tok-kw">const</span> vertex_count: usize = <span class="tok-builtin">@intCast</span>(mesh.vertexCount);

    <span class="tok-comment">// Snapshot the bind pose; the mesh's own position array becomes the</span>
    <span class="tok-comment">// per-frame skinning destination.</span>
    <span class="tok-kw">const</span> base: []f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vertex_count * <span class="tok-num">3</span>);
    <span class="tok-builtin">@memcpy</span>(base, mesh.vertices[<span class="tok-num">0</span> .. vertex_count * <span class="tok-num">3</span>]);
    <span class="tok-kw">const</span> skinned: []f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vertex_count * <span class="tok-num">3</span>);
    <span class="tok-builtin">@memcpy</span>(skinned, base);

    <span class="tok-comment">// ---- skin: joints + inverse binds (glTF column-major -&gt; zm rows) ----</span>
    <span class="tok-kw">if</span> (document.skins.len == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NotASkinnedMesh;
    }
    <span class="tok-kw">const</span> skin: z.codecs.gltf.Skin = document.skins[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> joint_count: usize = <span class="tok-builtin">@min</span>(skin.joints.len, max_joints);
    <span class="tok-kw">var</span> joint_nodes: [max_joints]u32 = undefined;
    <span class="tok-kw">var</span> node_translation: [max_joints]Vec = undefined;
    <span class="tok-kw">var</span> inverse_bind: [max_joints]Mat = undefined;
    <span class="tok-kw">const</span> ibm_accessor: u32 = skin.inverse_bind_matrices <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NotASkinnedMesh;
    <span class="tok-kw">const</span> ibm: []f32 = <span class="tok-kw">try</span> z.codecs.gltf.<span class="tok-fn">readAccessor</span>(f32, gpa, document, document.accessors[ibm_accessor]);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(ibm);
    <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; joint_count) : (j += <span class="tok-num">1</span>) {
        joint_nodes[j] = skin.joints[j];
        node_translation[j] = document.nodes[skin.joints[j]].translation;
        <span class="tok-kw">const</span> base_f: usize = j * <span class="tok-num">16</span>;
        inverse_bind[j] = .{
            <span class="tok-fn">f32x4</span>(ibm[base_f + <span class="tok-num">0</span>], ibm[base_f + <span class="tok-num">1</span>], ibm[base_f + <span class="tok-num">2</span>], ibm[base_f + <span class="tok-num">3</span>]),
            <span class="tok-fn">f32x4</span>(ibm[base_f + <span class="tok-num">4</span>], ibm[base_f + <span class="tok-num">5</span>], ibm[base_f + <span class="tok-num">6</span>], ibm[base_f + <span class="tok-num">7</span>]),
            <span class="tok-fn">f32x4</span>(ibm[base_f + <span class="tok-num">8</span>], ibm[base_f + <span class="tok-num">9</span>], ibm[base_f + <span class="tok-num">10</span>], ibm[base_f + <span class="tok-num">11</span>]),
            <span class="tok-fn">f32x4</span>(ibm[base_f + <span class="tok-num">12</span>], ibm[base_f + <span class="tok-num">13</span>], ibm[base_f + <span class="tok-num">14</span>], ibm[base_f + <span class="tok-num">15</span>]),
        };
    }

    <span class="tok-comment">// ---- animation: shared timeline + per-joint rotation tracks ----</span>
    <span class="tok-kw">if</span> (document.animations.len == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NoAnimation;
    }
    <span class="tok-kw">const</span> anim: z.codecs.gltf.Animation = document.animations[<span class="tok-num">0</span>];
    <span class="tok-kw">var</span> times: []f32 = &amp;.{};
    <span class="tok-kw">var</span> rot: [max_joints][]Vec = undefined;
    <span class="tok-kw">var</span> have_rot: [max_joints]bool = <span class="tok-builtin">@splat</span>(false);
    <span class="tok-kw">for</span> (anim.channels) |ch| {
        <span class="tok-kw">if</span> (ch.target_path != .rotation) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-comment">// Which joint slot does this channel's node drive?</span>
        <span class="tok-kw">var</span> slot: ?usize = null;
        <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (k &lt; joint_count) : (k += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (joint_nodes[k] == ch.target_node) {
                slot = k;
            }
        }
        <span class="tok-kw">const</span> joint_slot: usize = slot <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
        <span class="tok-kw">const</span> sampler: z.codecs.gltf.AnimationSampler = anim.samplers[ch.sampler];
        <span class="tok-kw">if</span> (times.len == <span class="tok-num">0</span>) {
            times = <span class="tok-kw">try</span> z.codecs.gltf.<span class="tok-fn">readAccessor</span>(f32, gpa, document, document.accessors[sampler.input]);
        }
        <span class="tok-kw">const</span> raw: []f32 = <span class="tok-kw">try</span> z.codecs.gltf.<span class="tok-fn">readAccessor</span>(f32, gpa, document, document.accessors[sampler.output]);
        <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(raw);
        <span class="tok-kw">const</span> quats: []Vec = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, raw.len / <span class="tok-num">4</span>);
        <span class="tok-kw">for</span> (quats, <span class="tok-num">0</span>..) |*q, qi| {
            q.* = <span class="tok-fn">f32x4</span>(raw[qi * <span class="tok-num">4</span>], raw[qi * <span class="tok-num">4</span> + <span class="tok-num">1</span>], raw[qi * <span class="tok-num">4</span> + <span class="tok-num">2</span>], raw[qi * <span class="tok-num">4</span> + <span class="tok-num">3</span>]);
        }
        rot[joint_slot] = quats;
        have_rot[joint_slot] = true;
    }
    <span class="tok-comment">// Joints without a rotation track hold the bind rotation.</span>
    j = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; joint_count) : (j += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (!have_rot[j]) {
            <span class="tok-kw">const</span> quats: []Vec = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, <span class="tok-num">1</span>);
            quats[<span class="tok-num">0</span>] = document.nodes[joint_nodes[j]].rotation;
            rot[j] = quats;
        }
    }

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .model = <span class="tok-kw">try</span> z.<span class="tok-fn">loadModelFromMesh</span>(f.gl, gpa, mesh),
        .base_positions = base,
        .skinned = skinned,
        .bone_ids = mesh.boneIndices,
        .bone_weights = mesh.boneWeights,
        .vertex_count = vertex_count,
        .joint_count = joint_count,
        .joint_nodes = joint_nodes,
        .node_translation = node_translation,
        .inverse_bind = inverse_bind,
        .times = times,
        .rot = rot,
    };
}

<span class="tok-comment">/// Normalized lerp between two quaternions - plenty for +/-45 deg keyframes.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">nlerp</span>(a: Vec, b: Vec, alpha: f32) Vec {
    <span class="tok-kw">const</span> va: Vec = a * <span class="tok-fn">splat</span>(<span class="tok-num">1.0</span> - alpha) + b * <span class="tok-fn">splat</span>(alpha);
    <span class="tok-kw">const</span> len: f32 = <span class="tok-builtin">@sqrt</span>(va[<span class="tok-num">0</span>] * va[<span class="tok-num">0</span>] + va[<span class="tok-num">1</span>] * va[<span class="tok-num">1</span>] + va[<span class="tok-num">2</span>] * va[<span class="tok-num">2</span>] + va[<span class="tok-num">3</span>] * va[<span class="tok-num">3</span>]);
    <span class="tok-kw">if</span> (len &lt; <span class="tok-num">1e-8</span>) {
        <span class="tok-kw">return</span> quat_identity;
    }
    <span class="tok-kw">return</span> va / <span class="tok-fn">splat</span>(len);
}

<span class="tok-comment">/// Sample joint `j`'s rotation track at time `t` (looped externally).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sampleRotation</span>(s: *<span class="tok-kw">const</span> State, j: usize, t: f32) Vec {
    <span class="tok-kw">const</span> track: []Vec = s.rot[j];
    <span class="tok-kw">if</span> (track.len &lt;= <span class="tok-num">1</span> <span class="tok-kw">or</span> s.times.len &lt;= <span class="tok-num">1</span>) {
        <span class="tok-kw">return</span> track[<span class="tok-num">0</span>];
    }
    <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (k + <span class="tok-num">1</span> &lt; s.times.len <span class="tok-kw">and</span> s.times[k + <span class="tok-num">1</span>] &lt; t) : (k += <span class="tok-num">1</span>) {}
    <span class="tok-kw">if</span> (k + <span class="tok-num">1</span> &gt;= track.len) {
        <span class="tok-kw">return</span> track[track.len - <span class="tok-num">1</span>];
    }
    <span class="tok-kw">const</span> span: f32 = <span class="tok-builtin">@max</span>(s.times[k + <span class="tok-num">1</span>] - s.times[k], <span class="tok-num">1e-6</span>);
    <span class="tok-kw">const</span> alpha: f32 = <span class="tok-fn">clamp</span>((t - s.times[k]) / span, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">return</span> <span class="tok-fn">nlerp</span>(track[k], track[k + <span class="tok-num">1</span>], alpha);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// ---- pose: loop the timeline, build per-joint world + skin matrices ----</span>
    <span class="tok-kw">const</span> duration: f32 = <span class="tok-kw">if</span> (s.times.len &gt; <span class="tok-num">0</span>) s.times[s.times.len - <span class="tok-num">1</span>] <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
    s.t += f.time.delta_time;
    <span class="tok-kw">if</span> (s.t &gt; duration) {
        s.t -= duration;
    }
    <span class="tok-kw">var</span> world: [max_joints]Mat = undefined;
    <span class="tok-kw">var</span> skin_mat: [max_joints]Mat = undefined;
    <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; s.joint_count) : (j += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> rot_m: Mat = <span class="tok-fn">matFromQuat</span>(<span class="tok-fn">sampleRotation</span>(s, j, s.t));
        <span class="tok-comment">// Rotate then translate (this rig's joints are unparented; a</span>
        <span class="tok-comment">// hierarchy would multiply the parent's world here too).</span>
        world[j] = <span class="tok-fn">mulMat</span>(rot_m, <span class="tok-fn">translationV</span>(s.node_translation[j]));
        <span class="tok-comment">// Bind space -&gt; joint local -&gt; world:  v * invBind * world.</span>
        skin_mat[j] = <span class="tok-fn">mulMat</span>(s.inverse_bind[j], world[j]);
    }

    <span class="tok-comment">// ---- CPU skinning: v' = sum_k w_k * (v * skin[joint_k]) ----</span>
    <span class="tok-kw">var</span> vi: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (vi &lt; s.vertex_count) : (vi += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> p: Vec = <span class="tok-fn">f32x4</span>(
            s.base_positions[vi * <span class="tok-num">3</span>],
            s.base_positions[vi * <span class="tok-num">3</span> + <span class="tok-num">1</span>],
            s.base_positions[vi * <span class="tok-num">3</span> + <span class="tok-num">2</span>],
            <span class="tok-num">1.0</span>,
        );
        <span class="tok-kw">var</span> acc: Vec = <span class="tok-fn">f32x4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
        <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (k &lt; <span class="tok-num">4</span>) : (k += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> w: f32 = s.bone_weights[vi * <span class="tok-num">4</span> + k];
            <span class="tok-kw">if</span> (w == <span class="tok-num">0</span>) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> joint: usize = s.bone_ids[vi * <span class="tok-num">4</span> + k];
            <span class="tok-kw">if</span> (joint &gt;= s.joint_count) {
                <span class="tok-kw">continue</span>;
            }
            acc += <span class="tok-fn">mulMatVec</span>(skin_mat[joint], p) * <span class="tok-fn">splat</span>(w);
        }
        s.skinned[vi * <span class="tok-num">3</span>] = acc[<span class="tok-num">0</span>];
        s.skinned[vi * <span class="tok-num">3</span> + <span class="tok-num">1</span>] = acc[<span class="tok-num">1</span>];
        s.skinned[vi * <span class="tok-num">3</span> + <span class="tok-num">2</span>] = acc[<span class="tok-num">2</span>];
    }
    z.<span class="tok-fn">updateMeshBuffer</span>(s.model.meshes[<span class="tok-num">0</span>], <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(s.skinned), <span class="tok-num">0</span>);

    <span class="tok-comment">// ---- draw: the deformed quad + the live skeleton over it ----</span>
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> cam: Camera3D = .{
        .position = <span class="tok-fn">pointVec</span>(<span class="tok-num">1.0</span>, <span class="tok-num">1.2</span>, <span class="tok-num">4.5</span>),
        .target = <span class="tok-fn">pointVec</span>(<span class="tok-num">1.0</span>, <span class="tok-num">0.2</span>, <span class="tok-num">0</span>),
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = <span class="tok-num">55</span>,
        .projection = <span class="tok-num">0</span>,
    };
    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam);
    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">10</span>, <span class="tok-num">0.5</span>);
    z.<span class="tok-fn">drawModel</span>(f.gl, s.model, <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">1.0</span>, c.emerald_400);
    <span class="tok-comment">// Skeleton gizmos: joint world position is the world matrix's</span>
    <span class="tok-comment">// translation row (row-major zm).</span>
    j = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; s.joint_count) : (j += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> pos: Vec = <span class="tok-fn">pointVec</span>(world[j][<span class="tok-num">3</span>][<span class="tok-num">0</span>], world[j][<span class="tok-num">3</span>][<span class="tok-num">1</span>], world[j][<span class="tok-num">3</span>][<span class="tok-num">2</span>]);
        z.<span class="tok-fn">drawSphere</span>(f.gl, pos, .{ .radius = <span class="tok-num">0.08</span>, .rings = <span class="tok-num">6</span>, .slices = <span class="tok-num">8</span>, .color = c.amber_400 });
        <span class="tok-kw">if</span> (j + <span class="tok-num">1</span> &lt; s.joint_count) {
            <span class="tok-kw">const</span> next: Vec = <span class="tok-fn">pointVec</span>(world[j + <span class="tok-num">1</span>][<span class="tok-num">3</span>][<span class="tok-num">0</span>], world[j + <span class="tok-num">1</span>][<span class="tok-num">3</span>][<span class="tok-num">1</span>], world[j + <span class="tok-num">1</span>][<span class="tok-num">3</span>][<span class="tok-num">2</span>]);
            z.<span class="tok-fn">drawLine3D</span>(f.gl, pos, next, c.amber_300);
        }
    }

    z.<span class="tok-fn">endMode3D</span>(f.gl);

    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, <span class="tok-num">14</span> },
        <span class="tok-str">"skinned mesh - CPU skinning"</span>,
        .{ .size = <span class="tok-num">22</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
    <span class="tok-kw">var</span> hud_buf: [<span class="tok-num">64</span>]u8 = undefined;
    <span class="tok-kw">const</span> hud: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;hud_buf,
        <span class="tok-str">"anim 'wave'  t = {d:.2}s / {d:.2}s"</span>,
        .{ s.t, duration },
    ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">42</span> }, hud, .{ .size = <span class="tok-num">16</span>, .color = .{ .r = <span class="tok-num">170</span>, .g = <span class="tok-num">180</span>, .b = <span class="tok-num">200</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font });
    _ = vw;
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"glTF skin + animation parsed by codecs - bone 1 waves the right edge"</span>);
}

    .config = .{
