<h1>ui_window_menubar</h1>
<figure class="code src-file" data-path="examples/ui_window_menubar/ui_window_menubar.zig" data-lines="237"><figcaption><span>examples/ui_window_menubar/ui_window_menubar.zig</span><span>237 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! ui_window_menubar - per-window menu bars ported to WebGPU. Three windows,</span>
<span class="tok-comment">//! each with its own `beginMenuBar` pinned to its top (not a canvas-wide bar):</span>
<span class="tok-comment">//! a Document window (File/Edit/View, with a dirty bit and undo depth), a</span>
<span class="tok-comment">//! Properties window (its own Tools menu), and a Settings window (Help -&gt; About).</span>
<span class="tok-comment">//! Drag any window and its bar drags with it. A foreground draw list paints an</span>
<span class="tok-comment">//! About overlay and a bottom status bar showing the last menu action.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Ported from the GL `ui_window_menubar`. GL `UiContext` (+ shapes_texture +</span>
<span class="tok-comment">//! font_cache) becomes `z.UiHost`; the widget body is unchanged (shared ui.zig).</span>
<span class="tok-comment">//! The GL version opened the UI frame BEFORE `beginDrawing`; the wgpu UiHost</span>
<span class="tok-comment">//! renders into the open draw frame, so here `beginDrawing`/`clearBackground`</span>
<span class="tok-comment">//! come FIRST, then `ui_host.begin`.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    document_dirty: bool = true,
    document_undo_depth: u8 = <span class="tok-num">3</span>,
    grid_visible: bool = true,
    handles_visible: bool = false,
    rulers_visible: bool = true,
    last_action: [<span class="tok-num">64</span>]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    last_action_len: u8 = <span class="tok-num">0</span>,
    show_about: bool = false,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">init</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">32</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
}

<span class="tok-kw">fn</span> <span class="tok-fn">setLastAction</span>(s: *State, msg: []<span class="tok-kw">const</span> u8) void {
    <span class="tok-kw">const</span> n: usize = <span class="tok-builtin">@min</span>(msg.len, s.last_action.len);
    <span class="tok-builtin">@memcpy</span>(s.last_action[<span class="tok-num">0</span>..n], msg[<span class="tok-num">0</span>..n]);
    s.last_action_len = <span class="tok-builtin">@intCast</span>(n);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// Descriptor app: the runner/launcher owns begin/clear/end. Paint our own bg</span>
    <span class="tok-comment">// (the menu windows + status bar don't cover the whole surface).</span>
    <span class="tok-kw">const</span> bg_w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> bg_h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> bg_col: Color = .{ .r = <span class="tok-num">15</span>, .g = <span class="tok-num">23</span>, .b = <span class="tok-num">42</span>, .a = <span class="tok-num">255</span> };
    f.gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = bg_w, .height = bg_h }, .{ .color = bg_col });

    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-comment">// Window #1: Document. File + Edit + View menus.</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Document"</span>, .{
        .initial_pos = .{ <span class="tok-num">32</span>, <span class="tok-num">32</span> },
        .initial_size = .{ <span class="tok-num">420</span>, <span class="tok-num">280</span> },
        .flags = .{ .menu_bar = true },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginMenuBar</span>()) {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">endMenuBar</span>();

            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginMenu</span>(<span class="tok-str">"File"</span>)) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endMenu</span>();
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"New"</span>, .{ .shortcut = <span class="tok-str">"Ctrl+N"</span> })) {
                    s.document_dirty = false;
                    s.document_undo_depth = <span class="tok-num">0</span>;
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"File -&gt; New"</span>);
                }
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Save"</span>, .{ .shortcut = <span class="tok-str">"Ctrl+S"</span> })) {
                    s.document_dirty = false;
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"File -&gt; Save"</span>);
                }
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Save As..."</span>, .{ .shortcut = <span class="tok-str">"Ctrl+Shift+S"</span> })) {
                    s.document_dirty = false;
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"File -&gt; Save As"</span>);
                }
            }

            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginMenu</span>(<span class="tok-str">"Edit"</span>)) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endMenu</span>();
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Undo"</span>, .{ .shortcut = <span class="tok-str">"Ctrl+Z"</span> })) {
                    <span class="tok-kw">if</span> (s.document_undo_depth &gt; <span class="tok-num">0</span>) {
                        s.document_undo_depth -= <span class="tok-num">1</span>;
                    }
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"Edit -&gt; Undo"</span>);
                }
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Redo"</span>, .{ .shortcut = <span class="tok-str">"Ctrl+Y"</span> })) {
                    s.document_undo_depth += <span class="tok-num">1</span>;
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"Edit -&gt; Redo"</span>);
                }
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Mark Dirty"</span>, .{})) {
                    s.document_dirty = true;
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"Edit -&gt; Mark Dirty"</span>);
                }
            }

            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginMenu</span>(<span class="tok-str">"View"</span>)) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endMenu</span>();
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Grid"</span>, .{ .selected = s.grid_visible })) {
                    s.grid_visible = !s.grid_visible;
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"View -&gt; Grid toggled"</span>);
                }
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Handles"</span>, .{ .selected = s.handles_visible })) {
                    s.handles_visible = !s.handles_visible;
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"View -&gt; Handles toggled"</span>);
                }
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Rulers"</span>, .{ .selected = s.rulers_visible })) {
                    s.rulers_visible = !s.rulers_visible;
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"View -&gt; Rulers toggled"</span>);
                }
            }
        }

        u.<span class="tok-fn">text</span>(<span class="tok-str">"This window has its own menu bar."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag the title - the bar drags with the window."</span>, .{});
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">if</span> (s.document_dirty) {
            u.<span class="tok-fn">textColored</span>(.{ .r = <span class="tok-num">251</span>, .g = <span class="tok-num">191</span>, .b = <span class="tok-num">36</span>, .a = <span class="tok-num">255</span> }, <span class="tok-str">"* Document has unsaved changes"</span>, .{});
        } <span class="tok-kw">else</span> {
            u.<span class="tok-fn">textColored</span>(.{ .r = <span class="tok-num">34</span>, .g = <span class="tok-num">197</span>, .b = <span class="tok-num">94</span>, .a = <span class="tok-num">255</span> }, <span class="tok-str">"* Saved"</span>, .{});
        }
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"undo depth: {d}"</span>, .{s.document_undo_depth});
        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Layers visible:"</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"  grid:    {s}"</span>, .{<span class="tok-kw">if</span> (s.grid_visible) <span class="tok-str">"on "</span> <span class="tok-kw">else</span> <span class="tok-str">"off"</span>});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"  handles: {s}"</span>, .{<span class="tok-kw">if</span> (s.handles_visible) <span class="tok-str">"on "</span> <span class="tok-kw">else</span> <span class="tok-str">"off"</span>});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"  rulers:  {s}"</span>, .{<span class="tok-kw">if</span> (s.rulers_visible) <span class="tok-str">"on "</span> <span class="tok-kw">else</span> <span class="tok-str">"off"</span>});
    }

    <span class="tok-comment">// Window #2: Properties. Its OWN Tools menu - independent of Document's.</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Properties"</span>, .{
        .initial_pos = .{ <span class="tok-num">480</span>, <span class="tok-num">32</span> },
        .initial_size = .{ <span class="tok-num">320</span>, <span class="tok-num">220</span> },
        .flags = .{ .menu_bar = true },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginMenuBar</span>()) {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">endMenuBar</span>();
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginMenu</span>(<span class="tok-str">"Tools"</span>)) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endMenu</span>();
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Reset View"</span>, .{})) {
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"Tools -&gt; Reset View"</span>);
                }
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"Snap to Grid"</span>, .{})) {
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"Tools -&gt; Snap to Grid"</span>);
                }
            }
        }

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Second window with its own bar."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Menus here don't interfere with"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"the Document window's File/Edit/View."</span>, .{});
    }

    <span class="tok-comment">// Window #3: Settings. Help -&gt; About toggles a foreground overlay.</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Settings"</span>, .{
        .initial_pos = .{ <span class="tok-num">32</span>, <span class="tok-num">360</span> },
        .initial_size = .{ <span class="tok-num">360</span>, <span class="tok-num">180</span> },
        .flags = .{ .menu_bar = true },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginMenuBar</span>()) {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">endMenuBar</span>();
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginMenu</span>(<span class="tok-str">"Help"</span>)) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endMenu</span>();
                <span class="tok-kw">if</span> (u.<span class="tok-fn">menuItem</span>(<span class="tok-str">"About"</span>, .{ .selected = s.show_about })) {
                    s.show_about = !s.show_about;
                    <span class="tok-fn">setLastAction</span>(s, <span class="tok-str">"Help -&gt; About toggled"</span>);
                }
            }
        }

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Open Help -&gt; About to flash an"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"overlay drawn on the foreground"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"draw list."</span>, .{});
    }

    <span class="tok-comment">// Foreground draw list - overlay banner + bottom status bar.</span>
    <span class="tok-kw">const</span> fg: ui.DrawListHandle = u.<span class="tok-fn">getForegroundDrawList</span>();
    <span class="tok-kw">const</span> sw_f: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> sh_f: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-comment">// Overlay palette - named Colors instead of packed-wire hex.</span>
    <span class="tok-kw">const</span> panel_bg: Color = Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xEE111827</span>);
    <span class="tok-kw">const</span> status_bg: Color = Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xCC0F172A</span>);
    <span class="tok-kw">const</span> text_light: Color = Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFFE2E8F0</span>);
    <span class="tok-kw">const</span> text_muted: Color = Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFF94A3B8</span>);
    <span class="tok-kw">const</span> text_dim: Color = Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFF64748B</span>);

    <span class="tok-kw">if</span> (s.show_about) {
        <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-num">360</span>;
        <span class="tok-kw">const</span> panel_h: f32 = <span class="tok-num">88</span>;
        <span class="tok-kw">const</span> panel_x: f32 = (sw_f - panel_w) / <span class="tok-num">2</span>;
        <span class="tok-kw">const</span> panel_y: f32 = <span class="tok-num">80</span>;
        <span class="tok-kw">const</span> panel: z.Rectangle = .{ .x = panel_x, .y = panel_y, .width = panel_w, .height = panel_h };
        fg.<span class="tok-fn">addRectFilled</span>(panel, panel_bg);
        fg.<span class="tok-fn">addRectOutline</span>(panel, text_light);
        fg.<span class="tok-fn">addText</span>(<span class="tok-str">"zimr - per-window menu bar demo"</span>, .{ panel_x + <span class="tok-num">16</span>, panel_y + <span class="tok-num">16</span> }, <span class="tok-num">14</span>, text_light);
        fg.<span class="tok-fn">addText</span>(<span class="tok-str">"close from Help -&gt; About"</span>, .{ panel_x + <span class="tok-num">16</span>, panel_y + <span class="tok-num">48</span> }, <span class="tok-num">12</span>, text_muted);
    }

    <span class="tok-comment">// Bottom status bar.</span>
    fg.<span class="tok-fn">addRectFilled</span>(.{ .x = <span class="tok-num">0</span>, .y = sh_f - <span class="tok-num">24</span>, .width = sw_f, .height = <span class="tok-num">24</span> }, status_bg);
    <span class="tok-kw">if</span> (s.last_action_len &gt; <span class="tok-num">0</span>) {
        <span class="tok-kw">const</span> slice: []u8 = s.last_action[<span class="tok-num">0</span>..s.last_action_len];
        fg.<span class="tok-fn">addText</span>(slice, .{ <span class="tok-num">12</span>, sh_f - <span class="tok-num">18</span> }, <span class="tok-num">12</span>, text_light);
    } <span class="tok-kw">else</span> {
        fg.<span class="tok-fn">addText</span>(<span class="tok-str">"(no menu action yet - pick something)"</span>, .{ <span class="tok-num">12</span>, sh_f - <span class="tok-num">18</span> }, <span class="tok-num">12</span>, text_dim);
    }
}
