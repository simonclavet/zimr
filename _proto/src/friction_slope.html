<h1>friction_slope</h1>
<figure class="code src-file" data-path="examples/friction_slope/friction_slope.zig" data-lines="404"><figcaption><span>examples/friction_slope/friction_slope.zig</span><span>404 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! friction_slope - does the engine's friction match Coulomb's law?</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- *** A DEMO WITH A CLOSED-FORM ANSWER --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A body resting on a slope holds when **tan(theta) &lt; mu** and slides beyond. That is not a</span>
<span class="tok-comment">//! judgement call or a tuning target; it is a line on the chart, and the engine either lands on</span>
<span class="tok-comment">//! it or does not. The predicted threshold is drawn as a marker on the angle slider, so the</span>
<span class="tok-comment">//! question "is the friction right?" is answered by looking at where the sliding starts.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** WHY THIS EXISTS --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! `examples/quadruped` slides about a metre in twenty seconds while standing perfectly still,</span>
<span class="tok-comment">//! with the measured tangential demand at only **0.20 of the friction cone** - the feet creep</span>
<span class="tok-comment">//! with four fifths of the grip unused. That says the sliding is not Coulomb slip. But it does</span>
<span class="tok-comment">//! not say whether the Coulomb LIMIT is right, and those are different faults with different</span>
<span class="tok-comment">//! fixes:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * **the limit is wrong** -&gt; the robot would slip at angles well below `atan(mu)`;</span>
<span class="tok-comment">//!   * **the limit is right and the solver creeps** -&gt; it holds to the predicted angle, but drifts</span>
<span class="tok-comment">//!     slowly at every angle below it.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! * THE SLOPE SEPARATES THEM, and nothing else measured so far does.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> rbt = z.robot;
<span class="tok-kw">const</span> ctl = z.robot_control;
<span class="tok-kw">const</span> zp = z.zimrphysics;
<span class="tok-kw">const</span> rphys = z.robot_physics;
<span class="tok-kw">const</span> mjcf = z.mjcf;
<span class="tok-kw">const</span> rmj = z.robot_mjcf;
<span class="tok-kw">const</span> ui = z.ui;
<span class="tok-kw">const</span> profiler = z.profiler;

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> length3 = zm.length3;
<span class="tok-kw">const</span> identity = zm.identity;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> atanRad = zm.atanRad;

<span class="tok-kw">const</span> sim_dt: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">250.0</span>;

<span class="tok-kw">const</span> background: Color = .{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">18</span>, .b = <span class="tok-num">26</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> slope_colour: Color = .{ .r = <span class="tok-num">58</span>, .g = <span class="tok-num">66</span>, .b = <span class="tok-num">84</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> robot_colour: Color = .{ .r = <span class="tok-num">150</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">190</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> hold_colour: Color = .{ .r = <span class="tok-num">108</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">168</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> slip_colour: Color = .{ .r = <span class="tok-num">226</span>, .g = <span class="tok-num">106</span>, .b = <span class="tok-num">154</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    doc: z.codecs.xml.Document,
    robot: mjcf.Robot,
    imported: rmj.Imported,
    data: rbt.Data,
    act: ctl.Actuation,
    home: []f32,
    world: zp.World,
    bridge: rphys.Bridge,
    ground: zp.BodyHandle,

    <span class="tok-comment">/// Slope angle in radians, and the friction the contacts are given.</span>
    slope: f32,
    friction: f32,
    <span class="tok-comment">/// What the slope and friction were when the run started, so a change restarts cleanly.</span>
    last_slope: f32,
    last_friction: f32,

    start_pos: Vec,
    slid: f32,
    elapsed: f32,
    <span class="tok-comment">/// Peak |tangential| / (mu * normal) seen since the reset - the cone occupancy.</span>
    cone_worst: f32,

    running: bool,
    cam: z.OrbitCamera,
    font: z.Font,

    sphere: z.Mesh,
    transform: [<span class="tok-num">1</span>]Mat,

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.gpa = gpa;
    s.doc = <span class="tok-kw">try</span> z.codecs.xml.<span class="tok-fn">parse</span>(gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"go1.xml"</span>), null);
    s.robot = <span class="tok-kw">try</span> mjcf.<span class="tok-fn">readRobot</span>(gpa, &amp;s.doc);
    s.imported = <span class="tok-kw">try</span> rmj.<span class="tok-fn">build</span>(gpa, &amp;s.robot, .{
        .max_contacts = <span class="tok-num">64</span>,
        .timestep = sim_dt,
        .gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">9.81</span>),
    });
    s.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);
    s.act = <span class="tok-kw">try</span> ctl.Actuation.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);

    s.world = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, <span class="tok-num">256</span>);
    s.world.gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">9.81</span>);
    <span class="tok-kw">const</span> shape: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">8</span>, <span class="tok-num">8</span>, <span class="tok-num">0.5</span>), .convex_radius = <span class="tok-num">0.01</span> },
    });
    s.ground = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{
        .shape = shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">0.5</span>),
        .motion_type = .static,
    });
    s.bridge = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, &amp;s.world, &amp;s.imported.model, &amp;s.data, <span class="tok-num">256</span>);
    s.bridge.<span class="tok-fn">listen</span>(&amp;s.world);

    s.home = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.imported.model.nq);
    s.slope = <span class="tok-num">0.0</span>;
    s.friction = <span class="tok-num">0.6</span>;
    s.last_slope = -<span class="tok-num">1</span>;
    s.last_friction = -<span class="tok-num">1</span>;
    s.start_pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    s.slid = <span class="tok-num">0</span>;
    s.elapsed = <span class="tok-num">0</span>;
    s.cone_worst = <span class="tok-num">0</span>;
    s.running = true;

    s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.3</span>, <span class="tok-num">0</span>), <span class="tok-num">3.4</span>);
    s.font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font);
    s.cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    s.sphere = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">12</span>, <span class="tok-num">10</span>);
    s.transform = .{<span class="tok-fn">identity</span>()};
    <span class="tok-fn">restart</span>(s);
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.sphere);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cube);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.home);
    s.bridge.<span class="tok-fn">deinit</span>(&amp;s.world);
    s.world.<span class="tok-fn">deinit</span>(gpa);
    s.act.<span class="tok-fn">deinit</span>();
    s.data.<span class="tok-fn">deinit</span>();
    s.imported.<span class="tok-fn">deinit</span>();
    s.robot.<span class="tok-fn">deinit</span>();
    s.doc.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">restart</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *rbt.Model = &amp;s.imported.model;

    <span class="tok-comment">// -- * THE SLOPE IS THE GROUND ROTATED, NOT GRAVITY TILTED --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Tilting gravity would give the same free-body diagram and a much easier contact problem:</span>
    <span class="tok-comment">// the normal would stay aligned with the box's face. Rotating the GROUND is the honest</span>
    <span class="tok-comment">// version, because it exercises the same oblique contact normals a real slope produces.</span>
    <span class="tok-kw">var</span> body: *zp.Body = &amp;s.world.bodies.data[s.ground.<span class="tok-fn">index</span>()];
    body.rot = zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), s.slope);
    body.com_pos = zm.<span class="tok-fn">rotate</span>(body.rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">0.5</span>));

    <span class="tok-comment">// * FRICTION ON THE GROUND BODY. Contact friction combines the two bodies' values, so the</span>
    <span class="tok-comment">// slider has to move one of them and the robot's feet keep theirs - which is what a real</span>
    <span class="tok-comment">// surface change looks like.</span>
    body.friction = s.friction;

    <span class="tok-kw">for</span> (s.robot.keyframes) |key| {
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, key.name, <span class="tok-str">"home"</span>)) {
            <span class="tok-kw">if</span> (!rmj.<span class="tok-fn">applyKeyframe</span>(m, &amp;s.data, key)) {
                std.log.<span class="tok-fn">err</span>(<span class="tok-str">"friction_slope: home keyframe refused"</span>, .{});
            }
        }
    }
    <span class="tok-comment">// Sit the robot ON the slope: rotate its base to match and lift it clear.</span>
    <span class="tok-kw">const</span> tilt: zm.Quat = zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), s.slope);
    s.data.pos[<span class="tok-num">3</span>] = tilt[<span class="tok-num">0</span>];
    s.data.pos[<span class="tok-num">4</span>] = tilt[<span class="tok-num">1</span>];
    s.data.pos[<span class="tok-num">5</span>] = tilt[<span class="tok-num">2</span>];
    s.data.pos[<span class="tok-num">6</span>] = tilt[<span class="tok-num">3</span>];
    s.data.pos[<span class="tok-num">2</span>] = <span class="tok-num">0.30</span> + <span class="tok-num">0.25</span> * <span class="tok-builtin">@sin</span>(<span class="tok-builtin">@abs</span>(s.slope));
    <span class="tok-builtin">@memset</span>(s.data.vel, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.data.applied_force, <span class="tok-num">0</span>);
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
    <span class="tok-builtin">@memcpy</span>(s.home, s.data.pos[<span class="tok-num">0</span>..m.nq]);
    s.bridge.<span class="tok-fn">teleported</span>();

    s.start_pos = s.data.body_xpos[<span class="tok-num">1</span>];
    s.slid = <span class="tok-num">0</span>;
    s.elapsed = <span class="tok-num">0</span>;
    s.cone_worst = <span class="tok-num">0</span>;
    s.last_slope = s.slope;
    s.last_friction = s.friction;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">const</span> captured: bool = <span class="tok-fn">drawPanel</span>(u, s, f.window.<span class="tok-fn">widthf</span>(), f.window.<span class="tok-fn">heightf</span>());

    <span class="tok-kw">const</span> was_frozen: bool = profiler.<span class="tok-fn">isFrozen</span>();
    profiler.<span class="tok-fn">freeze</span>();
    <span class="tok-kw">defer</span> <span class="tok-kw">if</span> (!was_frozen) profiler.<span class="tok-fn">unfreeze</span>();

    <span class="tok-kw">if</span> (s.slope != s.last_slope <span class="tok-kw">or</span> s.friction != s.last_friction) {
        <span class="tok-fn">restart</span>(s);
    }

    <span class="tok-kw">if</span> (s.running) {
        <span class="tok-kw">const</span> m: *rbt.Model = &amp;s.imported.model;
        <span class="tok-kw">var</span> step: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (step &lt; <span class="tok-num">4</span>) : (step += <span class="tok-num">1</span>) {
            (ctl.PoseHold{
                .target = s.home,
                .kp = <span class="tok-num">100</span>,
                .kv = <span class="tok-num">6</span>,
                .max_torque = <span class="tok-num">35</span>,
            }).<span class="tok-fn">apply</span>(m, &amp;s.data, s.act);
            rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
            <span class="tok-comment">// These two can only fail by running out of memory: the frame callback that contains them</span>
            <span class="tok-comment">// returns `void` by the engine's design, so there is nothing to propagate to. Swallowing</span>
            <span class="tok-comment">// leaves the world un-stepped for one frame, which is the least-bad outcome available here -</span>
            <span class="tok-comment">// and is why the rule wants it said out loud rather than written silently.</span>
            <span class="tok-comment">// lint:off catch-suppression: OOM only, void callback - see above</span>
            s.bridge.<span class="tok-fn">sync</span>(&amp;s.world, m, &amp;s.data) <span class="tok-kw">catch</span> {};
            <span class="tok-comment">// lint:off catch-suppression: OOM only, void callback - see above</span>
            zp.<span class="tok-fn">step</span>(&amp;s.world, sim_dt) <span class="tok-kw">catch</span> {};
            s.bridge.<span class="tok-fn">harvest</span>(&amp;s.data);
            rbt.<span class="tok-fn">step</span>(m, &amp;s.data);
            s.elapsed += sim_dt;

            <span class="tok-comment">// ** CONE OCCUPANCY, the number that separates "the limit is wrong" from "the solver</span>
            <span class="tok-comment">// creeps". A body sliding at 0.2 of its cone is not being held back by friction.</span>
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.contact_count) |c| {
                <span class="tok-kw">const</span> base: usize = c * rbt.rows_per_contact;
                <span class="tok-kw">var</span> normal: f32 = <span class="tok-num">0</span>;
                <span class="tok-kw">for</span> (<span class="tok-num">0</span>..rbt.rows_per_contact) |r| {
                    normal += s.data.constraint_force[base + r];
                }
                <span class="tok-kw">if</span> (normal &lt; <span class="tok-num">1.0</span>) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> t1: f32 = s.data.constraint_force[base] - s.data.constraint_force[base + <span class="tok-num">1</span>];
                <span class="tok-kw">const</span> t2: f32 = s.data.constraint_force[base + <span class="tok-num">2</span>] - s.data.constraint_force[base + <span class="tok-num">3</span>];
                <span class="tok-kw">const</span> tang: f32 = <span class="tok-builtin">@sqrt</span>(t1 * t1 + t2 * t2);
                <span class="tok-kw">const</span> mu: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">0.01</span>, s.data.contacts[c].friction[<span class="tok-num">0</span>]);
                s.cone_worst = <span class="tok-builtin">@max</span>(s.cone_worst, tang / (mu * normal));
            }
        }
        rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
        s.slid = <span class="tok-fn">length3</span>(s.data.body_xpos[<span class="tok-num">1</span>] - s.start_pos);
    }

    z.<span class="tok-fn">clearViewport</span>(f, background);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, captured, .{ .min_distance = <span class="tok-num">1.6</span>, .max_distance = <span class="tok-num">12.0</span> });
    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    <span class="tok-fn">drawScene</span>(s, gl);
    z.<span class="tok-fn">endMode3D</span>(gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawScene</span>(s: *State, gl: *z.WgpuGl) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;

    <span class="tok-comment">// The slope, drawn from the same rotation the solver is using.</span>
    <span class="tok-kw">const</span> body: *<span class="tok-kw">const</span> zp.Body = &amp;s.world.bodies.data[s.ground.<span class="tok-fn">index</span>()];
    <span class="tok-kw">const</span> centre: Vec = zm.<span class="tok-fn">zUpToYUpPoint</span>(body.com_pos);
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
        <span class="tok-comment">// -- *** THE RENDER AXIS IS DERIVED, NOT GUESSED --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The solver tilts the ground about **Y in its Z-up frame**:</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">//     x' =  x*cos theta + z*sin theta</span>
        <span class="tok-comment">//     z' = -x*sin theta + z*cos theta</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The render swizzle is `(x,y,z)_zup -&gt; (x,z,y)_yup`, so substituting:</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">//     x_r' =  x_r*cos theta + y_r*sin theta</span>
        <span class="tok-comment">//     y_r' = -x_r*sin theta + y_r*cos theta</span>
        <span class="tok-comment">//     z_r' =  z_r</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * THAT IS A ROTATION IN THE RENDER x-y PLANE - **about render Z**, not X. I guessed X</span>
        <span class="tok-comment">// and the ground drew tilted the wrong way while the robot, whose base quaternion is set</span>
        <span class="tok-comment">// in solver space, banked correctly. **The robot was right and the floor was wrong**,</span>
        <span class="tok-comment">// which reads as the robot leaning the wrong way.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// ** AND THE SIGN FOLLOWS THE SAME WAY: `rotationZ(phi)` gives `x' = x*cos phi - y*sin phi`, so</span>
        <span class="tok-comment">// matching the substitution above needs `phi = -theta`. A frame conversion is two lines of</span>
        <span class="tok-comment">// algebra; guessing it is two turns of looking at pictures.</span>
        <span class="tok-fn">mulMat</span>(zm.<span class="tok-fn">rotationZ</span>(-s.slope), <span class="tok-fn">scaling</span>(<span class="tok-num">16</span>, <span class="tok-num">1</span>, <span class="tok-num">16</span>)),
        <span class="tok-fn">translation</span>(centre[<span class="tok-num">0</span>], centre[<span class="tok-num">1</span>], centre[<span class="tok-num">2</span>]),
    );
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, slope_colour);

    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..m.nbody) |b| {
        <span class="tok-kw">const</span> at: Vec = zm.<span class="tok-fn">zUpToYUpPoint</span>(s.data.body_xpos[b]);
        <span class="tok-kw">const</span> parent: u32 = m.body_parent[b];
        <span class="tok-kw">if</span> (parent != rbt.world_body) {
            z.<span class="tok-fn">drawLine3D</span>(gl, zm.<span class="tok-fn">zUpToYUpPoint</span>(s.data.body_xpos[parent]), at, robot_colour);
        }
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(at[<span class="tok-num">0</span>], at[<span class="tok-num">1</span>], at[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.05</span>, <span class="tok-num">0.05</span>, <span class="tok-num">0.05</span>));
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, robot_colour);
    }

    <span class="tok-comment">// * WHERE IT STARTED, so the slide is visible rather than only reported.</span>
    <span class="tok-kw">const</span> from: Vec = zm.<span class="tok-fn">zUpToYUpPoint</span>(s.start_pos);
    <span class="tok-kw">const</span> now: Vec = zm.<span class="tok-fn">zUpToYUpPoint</span>(s.data.body_xpos[<span class="tok-num">1</span>]);
    <span class="tok-kw">const</span> holding: bool = s.slid &lt; <span class="tok-num">0.05</span>;
    z.<span class="tok-fn">drawLine3D</span>(gl, from, now, <span class="tok-kw">if</span> (holding) hold_colour <span class="tok-kw">else</span> slip_colour);
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(from[<span class="tok-num">0</span>], from[<span class="tok-num">1</span>], from[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.05</span>, <span class="tok-num">0.05</span>, <span class="tok-num">0.05</span>));
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, <span class="tok-kw">if</span> (holding) hold_colour <span class="tok-kw">else</span> slip_colour);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(u: ui.Ui, s: *State, viewport_w: f32, viewport_h: f32) bool {
    <span class="tok-kw">const</span> captured: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">380.0</span>, viewport_w - <span class="tok-num">16</span>);

    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">0</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"does friction obey Coulomb?"</span>, .{ .flags = .{ .always_auto_resize = true } })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        <span class="tok-kw">var</span> degrees: f32 = s.slope * <span class="tok-num">180.0</span> / pi;
        <span class="tok-kw">if</span> (u.<span class="tok-fn">slider</span>(<span class="tok-str">"slope deg"</span>, &amp;degrees, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">45</span>, .fmt = <span class="tok-str">"{d:.1}"</span> })) {
            s.slope = degrees * pi / <span class="tok-num">180.0</span>;
        }
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"friction mu"</span>, &amp;s.friction, .{ .min = <span class="tok-num">0.05</span>, .max = <span class="tok-num">1.5</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });

        <span class="tok-comment">// -- *** THE PREDICTION, STATED BEFORE THE RESULT --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Coulomb says a resting body holds while tan(theta) &lt; mu. That threshold is arithmetic, not</span>
        <span class="tok-comment">// opinion, so the demo can mark it and let the engine be judged against it.</span>
        <span class="tok-kw">const</span> threshold: f32 = <span class="tok-fn">atanRad</span>(s.friction) * <span class="tok-num">180.0</span> / pi;
        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Coulomb says: holds below {d:.1} deg"</span>, .{threshold});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  tan(slope) {d:.3}  vs  mu {d:.2}"</span>, .{ <span class="tok-builtin">@tan</span>(s.slope), s.friction });
        <span class="tok-kw">if</span> (degrees &lt; threshold - <span class="tok-num">1.0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  -&gt; should HOLD"</span>, .{});
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (degrees &gt; threshold + <span class="tok-num">1.0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  -&gt; should SLIDE"</span>, .{});
        } <span class="tok-kw">else</span> {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  -&gt; right at the threshold"</span>, .{});
        }

        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"after {d:.1} s:  slid {d:.4} m"</span>, .{ s.elapsed, s.slid });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  peak cone occupancy {d:.2}"</span>, .{s.cone_worst});
        <span class="tok-comment">// ** THE DIAGNOSIS THE DEMO EXISTS TO MAKE. Sliding while the cone is far from full means</span>
        <span class="tok-comment">// friction is not what is failing - the solver is letting contacts drift inside their</span>
        <span class="tok-comment">// own limit. Sliding WITH a full cone is ordinary Coulomb slip and entirely correct.</span>
        <span class="tok-kw">if</span> (s.slid &gt; <span class="tok-num">0.05</span> <span class="tok-kw">and</span> s.cone_worst &lt; <span class="tok-num">0.8</span> <span class="tok-kw">and</span> degrees &lt; threshold - <span class="tok-num">1.0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  SLIDING BELOW THE THRESHOLD, cone not full:"</span>, .{});
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  the limit is fine, the solver is creeping."</span>, .{});
        }
