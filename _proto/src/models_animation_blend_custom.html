<h1>models_animation_blend_custom</h1>
<figure class="code src-file" data-path="examples/models_animation_blend_custom/models_animation_blend_custom.zig" data-lines="450"><figcaption><span>examples/models_animation_blend_custom/models_animation_blend_custom.zig</span><span>450 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! models_animation_blend_custom - port of raylib's per-bone animation</span>
<span class="tok-comment">//! blending. The CC0 `greenman.glb` plays TWO clips at once - `2_move` (walk)</span>
<span class="tok-comment">//! and `3_attack` - and blends them PER BONE: the upper body (torso, arms,</span>
<span class="tok-comment">//! hands) follows the attack while the lower body (hips, legs) keeps walking,</span>
<span class="tok-comment">//! so the character strides forward mid-swing. A checkbox flips to a uniform</span>
<span class="tok-comment">//! 50/50 blend of the whole skeleton for comparison.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Built on the same hierarchical CPU-skinning path as `bone_socket`: parse -&gt;</span>
<span class="tok-comment">//! per-node local TRS (bind, overridden by each clip's sampled channels) -&gt;</span>
<span class="tok-comment">//! blend the two clips' local TRS per node (lerp T/S, nlerp R) -&gt; walk the node</span>
<span class="tok-comment">//! hierarchy -&gt; skin. Matrix order follows zm's convention (see the `Mat` docs):</span>
<span class="tok-comment">//! transforms are built with `composeN`/`compose`, which read in application</span>
<span class="tok-comment">//! order. raylib bakes GLOBAL poses and blends those; blending LOCAL TRS then</span>
<span class="tok-comment">//! accumulating the hierarchy (as here) is the same idea and a touch cleaner.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> c = z.colors;

<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> f32x4 = zm.f32x4;
<span class="tok-kw">const</span> pointVec = zm.pointVec;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> compose = zm.compose;
<span class="tok-kw">const</span> composeN = zm.composeN;
<span class="tok-kw">const</span> mulMatVec = zm.mulMatVec;
<span class="tok-kw">const</span> matFromQuat = zm.matFromQuat;
<span class="tok-kw">const</span> translationV = zm.translationV;
<span class="tok-kw">const</span> scalingV = zm.scalingV;
<span class="tok-kw">const</span> quat_identity = zm.quat_identity;

<span class="tok-kw">const</span> greenman_glb = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"greenman.glb"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> max_nodes: usize = <span class="tok-num">32</span>;
<span class="tok-kw">const</span> max_joints: usize = <span class="tok-num">16</span>;

<span class="tok-kw">const</span> Path = <span class="tok-kw">enum</span> { translation, rotation, scale };

<span class="tok-comment">/// One pre-read animation track (a sampler bound to a node + property).</span>
<span class="tok-kw">const</span> Track = <span class="tok-kw">struct</span> {
    target_node: u32,
    path: Path,
    times: []f32,
    values: []f32,
    comps: usize,
};

<span class="tok-comment">/// One animation clip: its TRS tracks plus its total duration.</span>
<span class="tok-kw">const</span> Clip = <span class="tok-kw">struct</span> {
    tracks: []Track,
    duration: f32,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    ui_host: z.UiHost,
    doc: z.codecs.gltf.Data,

    char_model: z.Model,
    char_base: []f32,
    char_skinned: []f32,
    bone_ids: [*c]u8,
    bone_weights: [*c]f32,
    char_vc: usize,

    joint_count: usize,
    joint_nodes: [max_joints]u32,
    inverse_bind: [max_joints]Mat,

    node_count: usize,
    parent: [max_nodes]i32,
    order: [max_nodes]usize,
    <span class="tok-comment">/// Per node: true = upper body (follows the attack clip in split mode).</span>
    upper: [max_nodes]bool,

    walk: Clip,
    attack: Clip,
    split_mode: bool = true,

    cam: z.OrbitCamera,
    t_walk: f32 = <span class="tok-num">0</span>,
    t_attack: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">freeClip</span>(gpa: Allocator, clip: Clip) void {
    <span class="tok-kw">for</span> (clip.tracks) |tr| {
        gpa.<span class="tok-fn">free</span>(tr.times);
        gpa.<span class="tok-fn">free</span>(tr.values);
    }
    gpa.<span class="tok-fn">free</span>(clip.tracks);
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadModel</span>(gpa, s.char_model);
    gpa.<span class="tok-fn">free</span>(s.char_base);
    gpa.<span class="tok-fn">free</span>(s.char_skinned);
    <span class="tok-fn">freeClip</span>(gpa, s.walk);
    <span class="tok-fn">freeClip</span>(gpa, s.attack);
    s.doc.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// True if a joint node belongs to the upper body (torso/arms/hands/head),</span>
<span class="tok-comment">/// matched by name - greenman uses `body_up`, `hand_*`, `socket_hand_*`,</span>
<span class="tok-comment">/// `socket_hat`; everything else (hips, legs, root) is lower body.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">nameIsUpper</span>(name: []<span class="tok-kw">const</span> u8) bool {
    <span class="tok-kw">const</span> keys = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"up"</span>, <span class="tok-str">"hand"</span>, <span class="tok-str">"hat"</span>, <span class="tok-str">"arm"</span>, <span class="tok-str">"head"</span>, <span class="tok-str">"chest"</span>, <span class="tok-str">"spine"</span>, <span class="tok-str">"neck"</span>, <span class="tok-str">"shoulder"</span> };
    <span class="tok-kw">for</span> (keys) |k| {
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">indexOf</span>(u8, name, k) != null) {
            <span class="tok-kw">return</span> true;
        }
    }
    <span class="tok-kw">return</span> false;
}

<span class="tok-comment">/// Pre-read a clip's TRS tracks (nlerp for rotation, lerp for T/S at draw time).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">readClip</span>(
    gpa: Allocator,
    doc: z.codecs.gltf.Data,
    anim: z.codecs.gltf.Animation,
) !Clip {
    <span class="tok-kw">var</span> tracks: std.<span class="tok-fn">ArrayListUnmanaged</span>(Track) = .empty;
    <span class="tok-kw">errdefer</span> tracks.<span class="tok-fn">deinit</span>(gpa);
    <span class="tok-kw">var</span> duration: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (anim.channels) |chn| {

        <span class="tok-kw">const</span> values: []f32 = <span class="tok-kw">try</span> z.codecs.gltf.<span class="tok-fn">readAccessor</span>(f32, gpa, doc, doc.accessors[sampler.output]);
        <span class="tok-kw">if</span> (times.len &gt; <span class="tok-num">0</span> <span class="tok-kw">and</span> times[times.len - <span class="tok-num">1</span>] &gt; duration) {
            duration = times[times.len - <span class="tok-num">1</span>];
        }
        <span class="tok-kw">const</span> path: Path = <span class="tok-kw">switch</span> (chn.target_path) {
            .translation =&gt; .translation,
            .rotation =&gt; .rotation,
            .scale =&gt; .scale,
            .weights =&gt; {

                gpa.<span class="tok-fn">free</span>(values);
                <span class="tok-kw">continue</span>;
            },
        };
        <span class="tok-kw">try</span> tracks.<span class="tok-fn">append</span>(gpa, .{
            .target_node = chn.target_node,
            .path = path,
            .times = times,
            .values = values,
            .comps = <span class="tok-kw">if</span> (path == .rotation) <span class="tok-num">4</span> <span class="tok-kw">else</span> <span class="tok-num">3</span>,

    }
    <span class="tok-kw">return</span> .{ .tracks = <span class="tok-kw">try</span> tracks.<span class="tok-fn">toOwnedSlice</span>(gpa), .duration = <span class="tok-kw">if</span> (duration &gt; <span class="tok-num">0</span>) duration <span class="tok-kw">else</span> <span class="tok-num">1.0</span> };
}

<span class="tok-kw">fn</span> <span class="tok-fn">findClip</span>(

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">var</span> doc: z.codecs.gltf.Data = <span class="tok-kw">try</span> z.codecs.gltf.<span class="tok-fn">parse</span>(gpa, greenman_glb);
    <span class="tok-kw">errdefer</span> doc.<span class="tok-fn">deinit</span>();

    <span class="tok-kw">const</span> meshes: []z.types.Mesh = <span class="tok-kw">try</span> z.codecs.gltf.<span class="tok-fn">meshesFromGltf</span>(gpa, doc);
    <span class="tok-kw">if</span> (meshes.len == <span class="tok-num">0</span> <span class="tok-kw">or</span> meshes[<span class="tok-num">0</span>].boneIndices == null <span class="tok-kw">or</span> meshes[<span class="tok-num">0</span>].boneWeights == null) {

    <span class="tok-kw">const</span> skinned: []f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vc * <span class="tok-num">3</span>);
    <span class="tok-builtin">@memcpy</span>(skinned, base);

    <span class="tok-comment">// ---- skin: joints + inverse-bind matrices ----</span>
    <span class="tok-kw">if</span> (doc.skins.len == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NoSkin;
    }
    <span class="tok-kw">const</span> skin: z.codecs.gltf.Skin = doc.skins[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> joint_count: usize = <span class="tok-builtin">@min</span>(skin.joints.len, max_joints);
    <span class="tok-kw">var</span> joint_nodes: [max_joints]u32 = undefined;
    <span class="tok-kw">var</span> inverse_bind: [max_joints]Mat = undefined;
    <span class="tok-kw">const</span> ibm_acc: u32 = skin.inverse_bind_matrices <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NoInverseBind;
    <span class="tok-kw">const</span> ibm: []f32 = <span class="tok-kw">try</span> z.codecs.gltf.<span class="tok-fn">readAccessor</span>(f32, gpa, doc, doc.accessors[ibm_acc]);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(ibm);
    <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; joint_count) : (j += <span class="tok-num">1</span>) {
        joint_nodes[j] = skin.joints[j];
        <span class="tok-kw">const</span> b: usize = j * <span class="tok-num">16</span>;
        inverse_bind[j] = .{
            <span class="tok-fn">f32x4</span>(ibm[b + <span class="tok-num">0</span>], ibm[b + <span class="tok-num">1</span>], ibm[b + <span class="tok-num">2</span>], ibm[b + <span class="tok-num">3</span>]),
            <span class="tok-fn">f32x4</span>(ibm[b + <span class="tok-num">4</span>], ibm[b + <span class="tok-num">5</span>], ibm[b + <span class="tok-num">6</span>], ibm[b + <span class="tok-num">7</span>]),
            <span class="tok-fn">f32x4</span>(ibm[b + <span class="tok-num">8</span>], ibm[b + <span class="tok-num">9</span>], ibm[b + <span class="tok-num">10</span>], ibm[b + <span class="tok-num">11</span>]),
            <span class="tok-fn">f32x4</span>(ibm[b + <span class="tok-num">12</span>], ibm[b + <span class="tok-num">13</span>], ibm[b + <span class="tok-num">14</span>], ibm[b + <span class="tok-num">15</span>]),
        };
    }

    <span class="tok-comment">// ---- hierarchy: parent[] + parents-first order[] + upper-body flags ----</span>
    <span class="tok-kw">const</span> node_count: usize = <span class="tok-builtin">@min</span>(doc.nodes.len, max_nodes);
    <span class="tok-kw">var</span> parent: [max_nodes]i32 = <span class="tok-builtin">@splat</span>(-<span class="tok-num">1</span>);
    <span class="tok-kw">var</span> upper: [max_nodes]bool = <span class="tok-builtin">@splat</span>(false);
    <span class="tok-kw">for</span> (doc.nodes[<span class="tok-num">0</span>..node_count], <span class="tok-num">0</span>..) |n, ni| {

    <span class="tok-kw">var</span> order: [max_nodes]usize = undefined;
    <span class="tok-kw">var</span> emitted: [max_nodes]bool = <span class="tok-builtin">@splat</span>(false);
    <span class="tok-kw">var</span> count: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (count &lt; node_count) {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..node_count) |ni| {
            <span class="tok-kw">if</span> (emitted[ni]) {
                <span class="tok-kw">continue</span>;

    <span class="tok-kw">const</span> walk: Clip = <span class="tok-kw">try</span> <span class="tok-fn">findClip</span>(gpa, doc, <span class="tok-str">"2_move"</span>, <span class="tok-num">2</span>);

    <span class="tok-kw">const</span> attack: Clip = <span class="tok-kw">try</span> <span class="tok-fn">findClip</span>(gpa, doc, <span class="tok-str">"3_attack"</span>, <span class="tok-num">3</span>);

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>),
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font),
        .doc = doc,
        .char_model = <span class="tok-kw">try</span> z.<span class="tok-fn">loadModelFromMesh</span>(f.gl, gpa, mesh),
        .char_base = base,
        .char_skinned = skinned,
        .bone_ids = mesh.boneIndices,
        .bone_weights = mesh.boneWeights,
        .char_vc = vc,
        .joint_count = joint_count,
        .joint_nodes = joint_nodes,
        .inverse_bind = inverse_bind,
        .node_count = node_count,
        .parent = parent,
        .order = order,
        .upper = upper,
        .walk = walk,
        .attack = attack,
        .cam = .{ .target = <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.9</span>, <span class="tok-num">0</span>), .distance = <span class="tok-num">6.0</span>, .pitch = <span class="tok-num">0.25</span>, .yaw = <span class="tok-num">0.7</span> },
    };
}

<span class="tok-comment">/// nlerp between quaternions (enough for these clips).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">nlerp</span>(a: Vec, b: Vec, alpha: f32) Vec {
    <span class="tok-kw">const</span> qd: f32 = a[<span class="tok-num">0</span>] * b[<span class="tok-num">0</span>] + a[<span class="tok-num">1</span>] * b[<span class="tok-num">1</span>] + a[<span class="tok-num">2</span>] * b[<span class="tok-num">2</span>] + a[<span class="tok-num">3</span>] * b[<span class="tok-num">3</span>];
    <span class="tok-kw">const</span> bb: Vec = <span class="tok-kw">if</span> (qd &lt; <span class="tok-num">0</span>) -b <span class="tok-kw">else</span> b;
    <span class="tok-kw">const</span> q: Vec = a + (bb - a) * <span class="tok-fn">splat</span>(alpha);
    <span class="tok-kw">const</span> len: f32 = <span class="tok-builtin">@sqrt</span>(q[<span class="tok-num">0</span>] * q[<span class="tok-num">0</span>] + q[<span class="tok-num">1</span>] * q[<span class="tok-num">1</span>] + q[<span class="tok-num">2</span>] * q[<span class="tok-num">2</span>] + q[<span class="tok-num">3</span>] * q[<span class="tok-num">3</span>]);
    <span class="tok-kw">if</span> (len &lt; <span class="tok-num">1e-6</span>) {
        <span class="tok-kw">return</span> quat_identity;
    }
    <span class="tok-kw">return</span> q / <span class="tok-fn">splat</span>(len);
}

<span class="tok-kw">fn</span> <span class="tok-fn">lerpVec</span>(a: Vec, b: Vec, alpha: f32) Vec {
    <span class="tok-kw">return</span> a + (b - a) * <span class="tok-fn">splat</span>(alpha);
}

<span class="tok-comment">/// Sample one clip at time t into per-node local TRS arrays, starting from each</span>
<span class="tok-comment">/// node's bind pose and overriding with the clip's channels.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">poseFromClip</span>(
    s: *State,
    clip: Clip,
    t: f32,
    trans: *[max_nodes]Vec,
    rot: *[max_nodes]Vec,
    scal: *[max_nodes]Vec,
) void {
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.node_count) |ni| {
        trans[ni] = s.doc.nodes[ni].translation;
        rot[ni] = s.doc.nodes[ni].rotation;
        scal[ni] = s.doc.nodes[ni].scale;
    }
    <span class="tok-kw">for</span> (clip.tracks) |tr| {
        <span class="tok-kw">if</span> (tr.target_node &gt;= s.node_count) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> v: [<span class="tok-num">4</span>]f32 = <span class="tok-fn">sampleTrack</span>(tr, t);
        <span class="tok-kw">switch</span> (tr.path) {
            .translation =&gt; trans[tr.target_node] = <span class="tok-fn">f32x4</span>(v[<span class="tok-num">0</span>], v[<span class="tok-num">1</span>], v[<span class="tok-num">2</span>], <span class="tok-num">0</span>),
            .rotation =&gt; rot[tr.target_node] = <span class="tok-fn">f32x4</span>(v[<span class="tok-num">0</span>], v[<span class="tok-num">1</span>], v[<span class="tok-num">2</span>], v[<span class="tok-num">3</span>]),
            .scale =&gt; scal[tr.target_node] = <span class="tok-fn">f32x4</span>(v[<span class="tok-num">0</span>], v[<span class="tok-num">1</span>], v[<span class="tok-num">2</span>], <span class="tok-num">0</span>),
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">sampleTrack</span>(tr: Track, t: f32) [<span class="tok-num">4</span>]f32 {
    <span class="tok-kw">const</span> n: usize = tr.times.len;
    <span class="tok-kw">if</span> (n == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    }
    <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (k + <span class="tok-num">1</span> &lt; n <span class="tok-kw">and</span> tr.times[k + <span class="tok-num">1</span>] &lt; t) : (k += <span class="tok-num">1</span>) {}
    <span class="tok-kw">const</span> k1: usize = <span class="tok-builtin">@min</span>(k + <span class="tok-num">1</span>, n - <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> t0: f32 = tr.times[k];
    <span class="tok-kw">const</span> t1: f32 = tr.times[k1];
    <span class="tok-kw">const</span> span: f32 = t1 - t0;
    <span class="tok-kw">const</span> alpha: f32 = <span class="tok-kw">if</span> (span &gt; <span class="tok-num">1e-6</span>) (t - t0) / span <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
    <span class="tok-kw">var</span> out: [<span class="tok-num">4</span>]f32 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    <span class="tok-kw">if</span> (tr.path == .rotation) {
        <span class="tok-kw">const</span> a: Vec = <span class="tok-fn">f32x4</span>(tr.values[k * <span class="tok-num">4</span>], tr.values[k * <span class="tok-num">4</span> + <span class="tok-num">1</span>], tr.values[k * <span class="tok-num">4</span> + <span class="tok-num">2</span>], tr.values[k * <span class="tok-num">4</span> + <span class="tok-num">3</span>]);
        <span class="tok-kw">const</span> b: Vec = <span class="tok-fn">f32x4</span>(tr.values[k1 * <span class="tok-num">4</span>], tr.values[k1 * <span class="tok-num">4</span> + <span class="tok-num">1</span>], tr.values[k1 * <span class="tok-num">4</span> + <span class="tok-num">2</span>], tr.values[k1 * <span class="tok-num">4</span> + <span class="tok-num">3</span>]);
        <span class="tok-kw">const</span> q: Vec = <span class="tok-fn">nlerp</span>(a, b, alpha);
        out = .{ q[<span class="tok-num">0</span>], q[<span class="tok-num">1</span>], q[<span class="tok-num">2</span>], q[<span class="tok-num">3</span>] };
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">var</span> comp: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (comp &lt; <span class="tok-num">3</span>) : (comp += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> va: f32 = tr.values[k * <span class="tok-num">3</span> + comp];
            <span class="tok-kw">const</span> vb: f32 = tr.values[k1 * <span class="tok-num">3</span> + comp];
            out[comp] = va + (vb - va) * alpha;
        }
    }
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    s.t_walk += f.time.delta_time;
    <span class="tok-kw">if</span> (s.t_walk &gt; s.walk.duration) {
        s.t_walk -= s.walk.duration;
    }
    s.t_attack += f.time.delta_time;
    <span class="tok-kw">if</span> (s.t_attack &gt; s.attack.duration) {
        s.t_attack -= s.attack.duration;
    }

    <span class="tok-comment">// ---- sample both clips into per-node local TRS ----</span>
    <span class="tok-kw">var</span> wt: [max_nodes]Vec = undefined;
    <span class="tok-kw">var</span> wr: [max_nodes]Vec = undefined;
    <span class="tok-kw">var</span> ws: [max_nodes]Vec = undefined;
    <span class="tok-kw">var</span> at: [max_nodes]Vec = undefined;
    <span class="tok-kw">var</span> ar: [max_nodes]Vec = undefined;
    <span class="tok-kw">var</span> as: [max_nodes]Vec = undefined;
    <span class="tok-fn">poseFromClip</span>(s, s.walk, s.t_walk, &amp;wt, &amp;wr, &amp;ws);
    <span class="tok-fn">poseFromClip</span>(s, s.attack, s.t_attack, &amp;at, &amp;ar, &amp;as);

    <span class="tok-comment">// ---- blend per node, then walk the hierarchy ----</span>
    <span class="tok-kw">var</span> world: [max_nodes]Mat = undefined;
    <span class="tok-kw">for</span> (s.order[<span class="tok-num">0</span>..s.node_count]) |ni| {
        <span class="tok-comment">// 0 = full walk, 1 = full attack. Split mode: upper body = attack (1),</span>
        <span class="tok-comment">// lower body = walk (0). Uniform mode: everything at 0.5.</span>
        <span class="tok-kw">const</span> factor: f32 = <span class="tok-kw">if</span> (s.split_mode) (<span class="tok-kw">if</span> (s.upper[ni]) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">0.0</span>) <span class="tok-kw">else</span> <span class="tok-num">0.5</span>;
        <span class="tok-kw">const</span> tt: Vec = <span class="tok-fn">lerpVec</span>(wt[ni], at[ni], factor);
        <span class="tok-kw">const</span> rr: Vec = <span class="tok-fn">nlerp</span>(wr[ni], ar[ni], factor);
        <span class="tok-kw">const</span> sc: Vec = <span class="tok-fn">lerpVec</span>(ws[ni], as[ni], factor);
        <span class="tok-kw">const</span> local: Mat = <span class="tok-fn">composeN</span>(<span class="tok-fn">scalingV</span>(sc), <span class="tok-fn">matFromQuat</span>(rr), <span class="tok-fn">translationV</span>(tt));
        <span class="tok-kw">const</span> p: i32 = s.parent[ni];
        world[ni] = <span class="tok-kw">if</span> (p &lt; <span class="tok-num">0</span>) local <span class="tok-kw">else</span> <span class="tok-fn">compose</span>(local, world[<span class="tok-builtin">@intCast</span>(p)]);
    }

    <span class="tok-comment">// ---- skin: v' = sum w_k * (v * invBind_k * world_k) ----</span>
    <span class="tok-kw">var</span> skin_mat: [max_joints]Mat = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.joint_count) |ji| {
        skin_mat[ji] = <span class="tok-fn">compose</span>(s.inverse_bind[ji], world[s.joint_nodes[ji]]);
    }
    <span class="tok-kw">var</span> vi: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (vi &lt; s.char_vc) : (vi += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> p: Vec = <span class="tok-fn">f32x4</span>(s.char_base[vi * <span class="tok-num">3</span>], s.char_base[vi * <span class="tok-num">3</span> + <span class="tok-num">1</span>], s.char_base[vi * <span class="tok-num">3</span> + <span class="tok-num">2</span>], <span class="tok-num">1.0</span>);
        <span class="tok-kw">var</span> acc: Vec = <span class="tok-fn">f32x4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
        <span class="tok-kw">var</span> kk: usize = <span class="tok-num">0</span>;
