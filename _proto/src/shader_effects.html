<h1>shader_effects</h1>
<figure class="code src-file" data-path="examples/shader_effects/shader_effects.zig" data-lines="496"><figcaption><span>examples/shader_effects/shader_effects.zig</span><span>496 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! shader_effects - raylib's 2D texture-shader examples, gathered into</span>
<span class="tok-comment">//! one live gallery.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Covers four of their `shaders_*` demos with one FS file each:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   grade    -&gt; `shaders_color_correction` (and, at saturation -1,</span>
<span class="tok-comment">//!              `shaders_texture_grayscale` for free)</span>
<span class="tok-comment">//!   waves    -&gt; `shaders_texture_waves`</span>
<span class="tok-comment">//!   outline  -&gt; `shaders_texture_outline`</span>
<span class="tok-comment">//!   palette  -&gt; `shaders_palette_switch`</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Where raylib filters a static PNG, the gallery filters a LIVE scene:</span>
<span class="tok-comment">//! bouncing balls, spinning slabs and a big label drawn by the 2D</span>
<span class="tok-comment">//! renderer into an offscreen texture every frame (on a TRANSPARENT</span>
<span class="tok-comment">//! clear - the outline effect keys on alpha).  The effect pass is a</span>
<span class="tok-comment">//! fullscreen quad through `deferred_shading_vs` - reused yet again -</span>
<span class="tok-comment">//! with the chosen effect FS, into a second texture that's blitted to</span>
<span class="tok-comment">//! screen.  Sliders are contextual per effect; the palette has a few</span>
<span class="tok-comment">//! tables to cycle, which IS the raylib demo.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;

<span class="tok-kw">const</span> fx = z.effect_shaders;

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> shading_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"deferred_shading_vs.wgsl"</span>);
<span class="tok-kw">const</span> grade_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"effect_grade_fs.wgsl"</span>);
<span class="tok-kw">const</span> wave_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"effect_wave_fs.wgsl"</span>);
<span class="tok-kw">const</span> outline_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"effect_outline_fs.wgsl"</span>);
<span class="tok-kw">const</span> palette_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"effect_palette_fs.wgsl"</span>);
<span class="tok-kw">const</span> spotlight_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"effect_spotlight_fs.wgsl"</span>);
<span class="tok-kw">const</span> tiling_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"effect_tiling_fs.wgsl"</span>);
<span class="tok-kw">const</span> sieve_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"effect_sieve_fs.wgsl"</span>);
<span class="tok-kw">const</span> ascii_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"effect_ascii_fs.wgsl"</span>);
<span class="tok-kw">const</span> cubes_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"effect_cubes_fs.wgsl"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> GradeUbo = <span class="tok-builtin">@FieldType</span>(fx.grade_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> WaveUbo = <span class="tok-builtin">@FieldType</span>(fx.wave_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> OutlineUbo = <span class="tok-builtin">@FieldType</span>(fx.outline_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> PaletteUbo = <span class="tok-builtin">@FieldType</span>(fx.palette_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> SpotlightUbo = <span class="tok-builtin">@FieldType</span>(fx.spotlight_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> TilingUbo = <span class="tok-builtin">@FieldType</span>(fx.tiling_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> SieveUbo = <span class="tok-builtin">@FieldType</span>(fx.sieve_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> AsciiUbo = <span class="tok-builtin">@FieldType</span>(fx.ascii_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> CubesUbo = <span class="tok-builtin">@FieldType</span>(fx.cubes_fs.Io, <span class="tok-str">"u"</span>);

<span class="tok-kw">const</span> Mode = <span class="tok-kw">enum</span> { source, grade, waves, outline, palette, spotlight, tiling, sieve, ascii, cubes };

<span class="tok-kw">const</span> mode_count: usize = std.enums.<span class="tok-fn">values</span>(Mode).len;

<span class="tok-comment">/// Step through the effects, wrapping. `dir` is +1 / -1.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">cycleMode</span>(m: Mode, dir: i32) Mode {
    <span class="tok-kw">const</span> n: i32 = <span class="tok-builtin">@intCast</span>(mode_count);
    <span class="tok-kw">const</span> i: i32 = <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@backingInt</span>(m));
    <span class="tok-kw">const</span> next: i32 = <span class="tok-builtin">@mod</span>(i + dir + n, n);
    <span class="tok-kw">return</span> <span class="tok-builtin">@fromBackingInt</span>(<span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(next))));
}

<span class="tok-kw">const</span> bg_clear: Color = .{ .r = <span class="tok-num">28</span>, .g = <span class="tok-num">27</span>, .b = <span class="tok-num">34</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };

<span class="tok-comment">/// The palette tables the palette effect cycles through - recoloring by</span>
<span class="tok-comment">/// table swap is the whole point of raylib's `shaders_palette_switch`.</span>
<span class="tok-kw">const</span> palette_count: usize = <span class="tok-num">3</span>;
<span class="tok-kw">const</span> palettes: [palette_count][<span class="tok-num">8</span>][<span class="tok-num">4</span>]f32 = .{
    <span class="tok-comment">// Game Boy greens, darkest to lightest.</span>

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,

    <span class="tok-comment">/// Keyed BY THE MODE ENUM, not by a parallel index. Adding an effect used to</span>
    <span class="tok-comment">/// mean editing four things in lockstep - the array, its length, the</span>
    <span class="tok-comment">/// `switch (mode) =&gt; index` map, and the ubo writes - and any one of them</span>
    <span class="tok-comment">/// could silently drift. An EnumArray makes the mapping total and checked:</span>
    <span class="tok-comment">/// a new Mode member that nobody initialises is a COMPILE error, not a</span>
    <span class="tok-comment">/// wrong-pipeline-at-runtime.</span>
    fx: std.<span class="tok-fn">EnumArray</span>(Mode, z.effects2d.Effect),
    fx_host: z.effects2d.Host,
    ascii_cell: f32 = <span class="tok-num">9.0</span>,
    ascii_mix: f32 = <span class="tok-num">0.55</span>,
    cubes_div: f32 = <span class="tok-num">5.0</span>,
    cubes_fill: f32 = <span class="tok-num">0.216</span>,
    src_sampler: z.wgpu.SamplerHandle,

    rt_src: z.RenderTexture, <span class="tok-comment">// the live scene (transparent clear)</span>
    rt_out: z.RenderTexture, <span class="tok-comment">// the filtered result</span>

    ui_host: z.UiHost,
    font: z.Font,

    mode: Mode = .waves,
    <span class="tok-comment">// grade knobs ([-1,1]; raylib's /100 pre-applied)</span>
    contrast: f32 = <span class="tok-num">0.15</span>,
    brightness: f32 = <span class="tok-num">0.0</span>,
    saturation: f32 = <span class="tok-num">0.2</span>,
    <span class="tok-comment">// wave knobs (raylib defaults 25/5/8)</span>
    wave_amp: f32 = <span class="tok-num">5.0</span>,
    wave_freq: f32 = <span class="tok-num">25.0</span>,
    <span class="tok-comment">// outline knobs</span>
    outline_px: f32 = <span class="tok-num">3.0</span>,
    <span class="tok-comment">// palette knobs</span>
    palette_ix: usize = <span class="tok-num">0</span>,
    palette_colors: f32 = <span class="tok-num">8.0</span>,
    <span class="tok-comment">// spotlight knobs (radii in source px; darkness = bleed outside spots)</span>
    spot_radius: f32 = <span class="tok-num">170.0</span>,
    spot_dark: f32 = <span class="tok-num">0.12</span>,
    <span class="tok-comment">// The hero spot chases the last pointer position (backing px).</span>
    spot_pos: Vec2 = .{ <span class="tok-num">300</span>, <span class="tok-num">300</span> },
    <span class="tok-comment">// tiling knob (source repeats per axis)</span>
    tiling_n: f32 = <span class="tok-num">3.0</span>,
    <span class="tok-comment">// sieve knob (grid = scale x scale integers)</span>
    sieve_scale: f32 = <span class="tok-num">220.0</span>,

    cam_pad: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// reserved</span>

    balls: [<span class="tok-num">5</span>]Ball,
};

<span class="tok-kw">const</span> Ball = <span class="tok-kw">struct</span> {
    pos: Vec2,
    vel: Vec2,
    radius: f32,
    color: Color,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    <span class="tok-kw">for</span> (s.fx.values) |e| {
        e.<span class="tok-fn">deinit</span>();
    }
    s.fx_host.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroySampler</span>(s.src_sampler);
    s.rt_src.<span class="tok-fn">deinit</span>();
    s.rt_out.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// What every effect pipeline shares: the layout holes, the quad VS,</span>
<span class="tok-comment">/// the quad vertex layout.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;

    <span class="tok-comment">// Linear sampling: the waves effect reads BETWEEN texels on purpose.</span>
    <span class="tok-kw">const</span> src_sampler: z.wgpu.SamplerHandle = z.wgpu.<span class="tok-fn">createSampler</span>(device, .{
        .mag_filter_linear = true,
        .min_filter_linear = true,
        .address_mode = .clamp_to_edge,
    });

    <span class="tok-comment">// The engine owns the quad, the layouts and the binding contract now; this</span>
    <span class="tok-comment">// example only says WHICH fragment shaders it wants.</span>
    <span class="tok-kw">var</span> fx_host: z.effects2d.Host = <span class="tok-kw">try</span> z.effects2d.Host.<span class="tok-fn">init</span>(gpa, f.gl, shading_vs_wgsl, .{});

    <span class="tok-comment">// EnumArray: every Mode must be given an effect, and the compiler checks it.</span>
    <span class="tok-comment">// `.source` is the passthrough (no effect runs), so it gets the empty default.</span>
    <span class="tok-kw">var</span> fx_table: std.<span class="tok-fn">EnumArray</span>(Mode, z.effects2d.Effect) = .<span class="tok-fn">initFill</span>(.{});
    fx_table.<span class="tok-fn">set</span>(.grade, <span class="tok-kw">try</span> fx_host.<span class="tok-fn">load</span>(gpa, device, grade_fs_wgsl, <span class="tok-builtin">@sizeOf</span>(GradeUbo), <span class="tok-str">"fx_grade"</span>));
    fx_table.<span class="tok-fn">set</span>(.waves, <span class="tok-kw">try</span> fx_host.<span class="tok-fn">load</span>(gpa, device, wave_fs_wgsl, <span class="tok-builtin">@sizeOf</span>(WaveUbo), <span class="tok-str">"fx_wave"</span>));
    fx_table.<span class="tok-fn">set</span>(.outline, <span class="tok-kw">try</span> fx_host.<span class="tok-fn">load</span>(gpa, device, outline_fs_wgsl, <span class="tok-builtin">@sizeOf</span>(OutlineUbo), <span class="tok-str">"fx_outline"</span>));
    fx_table.<span class="tok-fn">set</span>(.palette, <span class="tok-kw">try</span> fx_host.<span class="tok-fn">load</span>(gpa, device, palette_fs_wgsl, <span class="tok-builtin">@sizeOf</span>(PaletteUbo), <span class="tok-str">"fx_palette"</span>));
    fx_table.<span class="tok-fn">set</span>(.spotlight, <span class="tok-kw">try</span> fx_host.<span class="tok-fn">load</span>(gpa, device, spotlight_fs_wgsl, <span class="tok-builtin">@sizeOf</span>(SpotlightUbo), <span class="tok-str">"fx_spot"</span>));
    fx_table.<span class="tok-fn">set</span>(.tiling, <span class="tok-kw">try</span> fx_host.<span class="tok-fn">load</span>(gpa, device, tiling_fs_wgsl, <span class="tok-builtin">@sizeOf</span>(TilingUbo), <span class="tok-str">"fx_tiling"</span>));
    fx_table.<span class="tok-fn">set</span>(.sieve, <span class="tok-kw">try</span> fx_host.<span class="tok-fn">load</span>(gpa, device, sieve_fs_wgsl, <span class="tok-builtin">@sizeOf</span>(SieveUbo), <span class="tok-str">"fx_sieve"</span>));
    fx_table.<span class="tok-fn">set</span>(.ascii, <span class="tok-kw">try</span> fx_host.<span class="tok-fn">load</span>(gpa, device, ascii_fs_wgsl, <span class="tok-builtin">@sizeOf</span>(AsciiUbo), <span class="tok-str">"fx_ascii"</span>));
    fx_table.<span class="tok-fn">set</span>(.cubes, <span class="tok-kw">try</span> fx_host.<span class="tok-fn">load</span>(gpa, device, cubes_fs_wgsl, <span class="tok-builtin">@sizeOf</span>(CubesUbo), <span class="tok-str">"fx_cubes"</span>));

    <span class="tok-comment">// A seeded scatter of bouncing balls, phone-friendly sizes.</span>
    <span class="tok-kw">var</span> balls: [<span class="tok-num">5</span>]Ball = undefined;
    <span class="tok-kw">const</span> ball_colors = [<span class="tok-num">5</span>]Color{
        .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">120</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> },
        .{ .r = <span class="tok-num">110</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> },
        .{ .r = <span class="tok-num">150</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> },
        .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">210</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> },
        .{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">140</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> },
    };
    <span class="tok-kw">for</span> (&amp;balls, ball_colors, <span class="tok-num">0</span>..) |*b, c, i| {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        b.* = .{
            .pos = .{ <span class="tok-num">120</span> + fi * <span class="tok-num">130</span>, <span class="tok-num">140</span> + fi * <span class="tok-num">60</span> },
            .vel = .{ <span class="tok-num">90</span> + fi * <span class="tok-num">25</span>, <span class="tok-num">70</span> + fi * <span class="tok-num">17</span> },
            .radius = <span class="tok-num">34</span> + fi * <span class="tok-num">7</span>,
            .color = c,
        };
    }

    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.* = .{
        .gpa = gpa,
        .fx = fx_table,
        .fx_host = fx_host,
        .src_sampler = src_sampler,
        .rt_src = .{},
        .rt_out = .{},
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .font = font,
        .balls = balls,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> bw: u32 = <span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> bh: u32 = <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt_src.color != .invalid <span class="tok-kw">and</span> s.rt_src.width == bw <span class="tok-kw">and</span> s.rt_src.height == bh) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.rt_src.color != .invalid) {
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt_src);
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt_out);
    }
    s.rt_src = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(bw), <span class="tok-builtin">@intCast</span>(bh));
    s.rt_out = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(bw), <span class="tok-builtin">@intCast</span>(bh));

    <span class="tok-comment">// Re-point every effect at the new source. `setSource` destroys the previous</span>
    <span class="tok-comment">// bind group; the hand-rolled version this replaced leaked one per resize.</span>
    s.fx_host.<span class="tok-fn">setSource</span>(
        s.gpa,
        f.gpu.device,
        s.rt_src.<span class="tok-fn">asTexture</span>().view,
        s.src_sampler,
    ) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
}

<span class="tok-comment">/// The live source: bouncing balls, two spinning slabs, a big label -</span>
<span class="tok-comment">/// drawn on a TRANSPARENT clear so the outline effect has alpha to bite.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawSourceScene</span>(f: *z.Frame, s: *State, t: f32, dt: f32) void {
    <span class="tok-kw">const</span> w: f32 = <span class="tok-fn">float</span>(s.rt_src.width);
    <span class="tok-kw">const</span> h: f32 = <span class="tok-fn">float</span>(s.rt_src.height);

    <span class="tok-kw">for</span> (&amp;s.balls) |*b| {
        b.pos += b.vel * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(dt));
        <span class="tok-kw">if</span> (b.pos[<span class="tok-num">0</span>] &lt; b.radius <span class="tok-kw">or</span> b.pos[<span class="tok-num">0</span>] &gt; w - b.radius) {
            b.vel[<span class="tok-num">0</span>] = -b.vel[<span class="tok-num">0</span>];
            b.pos[<span class="tok-num">0</span>] = <span class="tok-fn">clamp</span>(b.pos[<span class="tok-num">0</span>], b.radius, w - b.radius);
        }
        <span class="tok-kw">if</span> (b.pos[<span class="tok-num">1</span>] &lt; b.radius <span class="tok-kw">or</span> b.pos[<span class="tok-num">1</span>] &gt; h - b.radius) {
            b.vel[<span class="tok-num">1</span>] = -b.vel[<span class="tok-num">1</span>];
            b.pos[<span class="tok-num">1</span>] = <span class="tok-fn">clamp</span>(b.pos[<span class="tok-num">1</span>], b.radius, h - b.radius);
        }
    }

    <span class="tok-comment">// Clear to TRANSPARENT - the outline effect keys on the alpha channel.</span>
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt_src, .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">0</span> });

    <span class="tok-kw">for</span> (&amp;s.balls) |*b| {
        f.gl.<span class="tok-fn">circle</span>(b.pos, b.radius, .{ .color = b.color, .segments = <span class="tok-num">40</span> });
    }
    <span class="tok-kw">const</span> slab: Color = .{ .r = <span class="tok-num">245</span>, .g = <span class="tok-num">245</span>, .b = <span class="tok-num">250</span>, .a = <span class="tok-num">255</span> };
    f.gl.<span class="tok-fn">rectRotated</span>(
        .{ .x = w * <span class="tok-num">0.30</span>, .y = h * <span class="tok-num">0.62</span>, .width = w * <span class="tok-num">0.24</span>, .height = <span class="tok-num">26</span> },
        .{ w * <span class="tok-num">0.12</span>, <span class="tok-num">13</span> },
        t * <span class="tok-num">0.7</span>,
        .{ .color = slab },
    );
    f.gl.<span class="tok-fn">rectRotated</span>(
        .{ .x = w * <span class="tok-num">0.72</span>, .y = h * <span class="tok-num">0.30</span>, .width = w * <span class="tok-num">0.20</span>, .height = <span class="tok-num">22</span> },
        .{ w * <span class="tok-num">0.10</span>, <span class="tok-num">11</span> },
        -t * <span class="tok-num">0.95</span>,
        .{ .color = slab },
    );
    f.gl.<span class="tok-fn">text</span>(.{ w * <span class="tok-num">0.5</span> - <span class="tok-num">70</span>, h * <span class="tok-num">0.5</span> - <span class="tok-num">20</span> }, <span class="tok-str">"zimr"</span>, .{ .size = <span class="tok-num">56</span>, .color = white, .font = &amp;s.font });

    z.<span class="tok-fn">endTextureMode</span>(f.gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">writeEffectUbos</span>(f: *z.Frame, s: *State, t: f32) void {
    <span class="tok-kw">const</span> w: f32 = <span class="tok-fn">float</span>(s.rt_src.width);
    <span class="tok-kw">const</span> h: f32 = <span class="tok-fn">float</span>(s.rt_src.height);
    <span class="tok-kw">const</span> q: z.wgpu.QueueHandle = f.gpu.queue;

    <span class="tok-kw">var</span> grade: GradeUbo = .{ .params = .{ s.contrast, s.brightness, s.saturation, <span class="tok-num">0</span> } };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(q, s.fx.<span class="tok-fn">get</span>(.grade).ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;grade));

    <span class="tok-kw">var</span> wave: WaveUbo = .{
        .drive = .{ t, s.wave_freq, s.wave_freq, <span class="tok-num">0</span> },
        .motion = .{ s.wave_amp, s.wave_amp, <span class="tok-num">8</span>, <span class="tok-num">8</span> },
        .size = .{ w, h, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(q, s.fx.<span class="tok-fn">get</span>(.waves).ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;wave));

    <span class="tok-kw">var</span> outline: OutlineUbo = .{
        .outline_color = .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.42</span>, <span class="tok-num">0.1</span>, <span class="tok-num">1</span> },
        .params = .{ s.outline_px, w, h, <span class="tok-num">0</span> },
    };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(q, s.fx.<span class="tok-fn">get</span>(.outline).ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;outline));

    <span class="tok-kw">var</span> spot: SpotlightUbo = .{
        .spots = .{
            .{ s.spot_pos[<span class="tok-num">0</span>], s.spot_pos[<span class="tok-num">1</span>], s.spot_radius * <span class="tok-num">0.35</span>, s.spot_radius },
            .{ s.balls[<span class="tok-num">0</span>].pos[<span class="tok-num">0</span>], s.balls[<span class="tok-num">0</span>].pos[<span class="tok-num">1</span>], s.spot_radius * <span class="tok-num">0.22</span>, s.spot_radius * <span class="tok-num">0.62</span> },
            .{ s.balls[<span class="tok-num">2</span>].pos[<span class="tok-num">0</span>], s.balls[<span class="tok-num">2</span>].pos[<span class="tok-num">1</span>], s.spot_radius * <span class="tok-num">0.22</span>, s.spot_radius * <span class="tok-num">0.62</span> },
        },
        .params = .{ s.spot_dark, w, h, <span class="tok-num">0</span> },
    };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(q, s.fx.<span class="tok-fn">get</span>(.spotlight).ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;spot));

    <span class="tok-kw">var</span> pal: PaletteUbo = .{
        .palette = undefined,
        .params = .{ s.palette_colors, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    <span class="tok-kw">for</span> (palettes[s.palette_ix], &amp;pal.palette) |src, *dst| {
        dst.* = src;
    }
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(q, s.fx.<span class="tok-fn">get</span>(.palette).ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;pal));

    <span class="tok-kw">var</span> tiling: TilingUbo = .{ .tiling = .{ s.tiling_n, s.tiling_n, <span class="tok-num">0</span>, <span class="tok-num">0</span> } };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(q, s.fx.<span class="tok-fn">get</span>(.tiling).ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;tiling));

    <span class="tok-kw">var</span> sieve: SieveUbo = .{ .params = .{ s.sieve_scale, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(q, s.fx.<span class="tok-fn">get</span>(.sieve).ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;sieve));

    <span class="tok-comment">// The ASCII cell grid is defined in PIXELS, so the shader must be told the</span>
    <span class="tok-comment">// live canvas size - derive it from the UV and it would stretch with aspect.</span>
    <span class="tok-kw">var</span> ascii: AsciiUbo = .{
        .params = .{ s.ascii_cell, s.ascii_mix, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .resolution = .{ f.window.<span class="tok-fn">widthf</span>(), f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(q, s.fx.<span class="tok-fn">get</span>(.ascii).ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;ascii));

    <span class="tok-comment">// Purely procedural - it never samples the scene, it just needs the clock.</span>
    <span class="tok-kw">var</span> cubes: CubesUbo = .{ .params = .{ t, s.cubes_div, s.cubes_fill, <span class="tok-num">0</span> } };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(q, s.fx.<span class="tok-fn">get</span>(.cubes).ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;cubes));
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.05</span>);
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);

    <span class="tok-comment">// ===== OFFSCREEN PASSES FIRST - tile-based-GPU safe: never tear down the</span>
    <span class="tok-comment">// swapchain mid-frame. Uses s.* mode/slider state from the PREVIOUS frame</span>
    <span class="tok-comment">// (a 1-frame lag, imperceptible at 60fps); the UI below updates it for the</span>
    <span class="tok-comment">// next frame. This is why the app owns its own begin/endDrawing. =====</span>
    <span class="tok-fn">drawSourceScene</span>(f, s, t, dt);
    <span class="tok-fn">writeEffectUbos</span>(f, s, t);
    <span class="tok-kw">if</span> (s.mode != .source) {
        <span class="tok-comment">// raylib's shape: open the target, run the shader over the source, close.</span>
        <span class="tok-comment">// No pipeline/bind-group/vertex-buffer bookkeeping in userland any more -</span>
        <span class="tok-comment">// and no `mode -&gt; index` map to keep in sync, because the EnumArray IS the</span>
        <span class="tok-comment">// map.</span>
        z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.rt_out, .{ .r = <span class="tok-num">28</span>, .g = <span class="tok-num">27</span>, .b = <span class="tok-num">34</span>, .a = <span class="tok-num">255</span> });
        z.effects2d.<span class="tok-fn">beginShaderMode</span>(f.gl, &amp;s.fx_host, s.fx.<span class="tok-fn">get</span>(s.mode));
        z.effects2d.<span class="tok-fn">drawFullscreen</span>(f.gl);
        z.effects2d.<span class="tok-fn">endShaderMode</span>(f.gl);
        z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);
    }

    <span class="tok-comment">// ===== SCREEN PASS - opens exactly ONCE, after all offscreen work. =====</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, bg_clear);
    <span class="tok-kw">const</span> composited: z.WgpuRenderTexture = <span class="tok-kw">if</span> (s.mode == .source) s.rt_src <span class="tok-kw">else</span> s.rt_out;
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh }, composited.<span class="tok-fn">asTexture</span>(), .{ .tint = white });

    <span class="tok-comment">// ---- UI: effect picker + contextual knobs ----</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-comment">//</span>
    <span class="tok-comment">// A CYCLER, not a grid of buttons. The grid's height grew with every effect</span>
    <span class="tok-comment">// added, and the newest one kept landing outside the window - where `itemAdd`</span>
    <span class="tok-comment">// CLIPS it, so it still draws but can never be tapped. That has now bitten</span>
    <span class="tok-comment">// twice (ascii, then cubes), and "budget more pixels per row" only postpones</span>
    <span class="tok-comment">// it: the height of a grid is O(number of effects), so the bug comes back the</span>
    <span class="tok-comment">// next time one is added.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// prev/next is O(1) in height. Reachability no longer depends on how many</span>
    <span class="tok-comment">// effects exist, which is the actual invariant that kept breaking.</span>
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">460</span>, vw - <span class="tok-num">16</span>);
    <span class="tok-kw">const</span> panel_h: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">280</span>, vh - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, panel_h }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"effects"</span>, .{})) |win| {
        <span class="tok-kw">defer</span> win.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"&lt; prev"</span>, .{})) {
            s.mode = <span class="tok-fn">cycleMode</span>(s.mode, -<span class="tok-num">1</span>);
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"next &gt;"</span>, .{})) {
            s.mode = <span class="tok-fn">cycleMode</span>(s.mode, <span class="tok-num">1</span>);
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{<span class="tok-builtin">@tagName</span>(s.mode)});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"effect {d} of {d}"</span>, .{ <span class="tok-builtin">@backingInt</span>(s.mode) + <span class="tok-num">1</span>, mode_count });
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">switch</span> (s.mode) {
            .source =&gt; u.<span class="tok-fn">text</span>(<span class="tok-str">"unfiltered scene"</span>, .{}),
            .grade =&gt; {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"contrast"</span>, &amp;s.contrast, .{ .min = -<span class="tok-num">1</span>, .max = <span class="tok-num">1</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"brightness"</span>, &amp;s.brightness, .{ .min = -<span class="tok-num">1</span>, .max = <span class="tok-num">1</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"saturation"</span>, &amp;s.saturation, .{ .min = -<span class="tok-num">1</span>, .max = <span class="tok-num">1</span> });
            },
            .waves =&gt; {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"amplitude"</span>, &amp;s.wave_amp, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">20</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"frequency"</span>, &amp;s.wave_freq, .{ .min = <span class="tok-num">5</span>, .max = <span class="tok-num">60</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
            },
            .outline =&gt; {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"width px"</span>, &amp;s.outline_px, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">8</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
            },
            .palette =&gt; {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"colors"</span>, &amp;s.palette_colors, .{ .min = <span class="tok-num">2</span>, .max = <span class="tok-num">8</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
                <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"next palette"</span>, .{})) {
                    s.palette_ix = (s.palette_ix + <span class="tok-num">1</span>) % palette_count;
                }
            },
            .spotlight =&gt; {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"radius"</span>, &amp;s.spot_radius, .{ .min = <span class="tok-num">60</span>, .max = <span class="tok-num">340</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"darkness"</span>, &amp;s.spot_dark, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">0.5</span> });
            },
            .tiling =&gt; {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"repeat"</span>, &amp;s.tiling_n, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">6</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
            },
            .ascii =&gt; {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"cell px"</span>, &amp;s.ascii_cell, .{ .min = <span class="tok-num">4</span>, .max = <span class="tok-num">24</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"color mix"</span>, &amp;s.ascii_mix, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">1.0</span> });
            },
            .cubes =&gt; {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"procedural: samples nothing"</span>, .{});
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"divisions"</span>, &amp;s.cubes_div, .{ .min = <span class="tok-num">2</span>, .max = <span class="tok-num">16</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"fill"</span>, &amp;s.cubes_fill, .{ .min = <span class="tok-num">0.05</span>, .max = <span class="tok-num">0.9</span> });
            },
            .sieve =&gt; {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"grid"</span>, &amp;s.sieve_scale, .{ .min = <span class="tok-num">60</span>, .max = <span class="tok-num">400</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
            },
        }
    }

    <span class="tok-comment">// ---- hero spotlight chases the pointer (backing-pixel space) ----</span>
    {
        <span class="tok-kw">const</span> sx: f32 = <span class="tok-fn">float</span>(s.rt_src.width) / vw;
        <span class="tok-kw">const</span> sy: f32 = <span class="tok-fn">float</span>(s.rt_src.height) / vh;
        <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
        <span class="tok-kw">const</span> target: Vec2 = <span class="tok-kw">if</span> (u.<span class="tok-fn">wantCaptureMouse</span>())
            Vec2{ <span class="tok-comment">// idle orbit while the pointer is busy with the panel</span>
                <span class="tok-fn">float</span>(s.rt_src.width) * (<span class="tok-num">0.5</span> + <span class="tok-num">0.25</span> * <span class="tok-builtin">@cos</span>(t * <span class="tok-num">0.5</span>)),
                <span class="tok-fn">float</span>(s.rt_src.height) * (<span class="tok-num">0.42</span> + <span class="tok-num">0.2</span> * <span class="tok-builtin">@sin</span>(t * <span class="tok-num">0.7</span>)),
            }
        <span class="tok-kw">else</span>
            Vec2{ mp[<span class="tok-num">0</span>] * sx, mp[<span class="tok-num">1</span>] * sy };
        <span class="tok-kw">const</span> chase: f32 = <span class="tok-builtin">@min</span>(dt * <span class="tok-num">6.0</span>, <span class="tok-num">1.0</span>);
        s.spot_pos += (target - s.spot_pos) * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(chase));
    }

    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - 2D shader effects gallery"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Owns its own begin/endDrawing so the source + effect render-textures are</span>
    <span class="tok-comment">// built BEFORE the screen pass opens - no mid-frame swapchain teardown, so</span>
    <span class="tok-comment">// no tile-based-GPU frame-feedback tiling.</span>
    .manages_own_frame = true,
};

<figure class="code src-file" data-path="examples/shader_effects/native_verify.zig" data-lines="231"><figcaption><span>examples/shader_effects/native_verify.zig</span><span>231 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! native_verify - render every 2D effect NATIVELY through the same</span>
<span class="tok-comment">//! `shaderMain`s the gallery compiles to WGSL, over a synthetic test</span>
<span class="tok-comment">//! pattern, into one contact sheet (`effects_verify.png`): source,</span>
<span class="tok-comment">//! grade, waves, outline, palette, left to right.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Each panel is a fullscreen quad through `deferred_shading_vs` with</span>
<span class="tok-comment">//! the effect FS sampling the pattern via a TextureRef - the CPU twin</span>
<span class="tok-comment">//! of the gallery's GPU pass.  Cheap assertions per effect catch the</span>
<span class="tok-comment">//! "shipped a blob" class of bug before a device ever sees it.</span>
<span class="tok-comment">//! `zig build shader-effects-verify`.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> float = zm.float;

<span class="tok-kw">const</span> quad_vs = z.deferred_shaders.shading_vs;
<span class="tok-kw">const</span> fx = z.effect_shaders;

<span class="tok-kw">const</span> src_w: usize = <span class="tok-num">220</span>;
<span class="tok-kw">const</span> src_h: usize = <span class="tok-num">160</span>;
<span class="tok-kw">const</span> panels: usize = <span class="tok-num">6</span>;

<span class="tok-comment">/// Synthetic source: three colored disks + a white bar on TRANSPARENT</span>
<span class="tok-comment">/// background (the outline effect needs alpha edges to bite).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildPattern</span>() [src_w * src_h][<span class="tok-num">4</span>]u8 {
    <span class="tok-kw">var</span> img: [src_w * src_h][<span class="tok-num">4</span>]u8 = <span class="tok-builtin">@splat</span>(.{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> });
    <span class="tok-kw">const</span> disks = [<span class="tok-num">3</span>]<span class="tok-kw">struct</span> { cx: f32, cy: f32, r: f32, rgb: [<span class="tok-num">3</span>]u8 }{
        .{ .cx = <span class="tok-num">60</span>, .cy = <span class="tok-num">70</span>, .r = <span class="tok-num">38</span>, .rgb = .{ <span class="tok-num">255</span>, <span class="tok-num">120</span>, <span class="tok-num">90</span> } },
        .{ .cx = <span class="tok-num">130</span>, .cy = <span class="tok-num">95</span>, .r = <span class="tok-num">30</span>, .rgb = .{ <span class="tok-num">110</span>, <span class="tok-num">200</span>, <span class="tok-num">255</span> } },
        .{ .cx = <span class="tok-num">170</span>, .cy = <span class="tok-num">50</span>, .r = <span class="tok-num">22</span>, .rgb = .{ <span class="tok-num">150</span>, <span class="tok-num">235</span>, <span class="tok-num">120</span> } },
    };
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..src_h) |y| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..src_w) |x| {
            <span class="tok-kw">const</span> px: *[<span class="tok-num">4</span>]u8 = &amp;img[y * src_w + x];
            <span class="tok-kw">for</span> (disks) |d| {
                <span class="tok-kw">const</span> dx: f32 = <span class="tok-fn">float</span>(x) - d.cx;
                <span class="tok-kw">const</span> dy: f32 = <span class="tok-fn">float</span>(y) - d.cy;
                <span class="tok-kw">if</span> (dx * dx + dy * dy &lt; d.r * d.r) {
                    px.* = .{ d.rgb[<span class="tok-num">0</span>], d.rgb[<span class="tok-num">1</span>], d.rgb[<span class="tok-num">2</span>], <span class="tok-num">255</span> };
                }
            }
            <span class="tok-comment">// The bar: hard horizontal edges for the wave to bend.</span>
            <span class="tok-kw">if</span> (y &gt; <span class="tok-num">120</span> <span class="tok-kw">and</span> y &lt; <span class="tok-num">134</span> <span class="tok-kw">and</span> x &gt; <span class="tok-num">20</span> <span class="tok-kw">and</span> x &lt; <span class="tok-num">200</span>) {
                px.* = .{ <span class="tok-num">245</span>, <span class="tok-num">245</span>, <span class="tok-num">250</span>, <span class="tok-num">255</span> };
            }
        }
    }
    <span class="tok-kw">return</span> img;
}

<span class="tok-kw">const</span> quad_positions = [_][<span class="tok-num">2</span>]f32{
    .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> },
    .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> },  .{ -<span class="tok-num">1</span>, <span class="tok-num">1</span> },
};
<span class="tok-kw">const</span> quad_indices = [_]u32{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span>, <span class="tok-num">4</span>, <span class="tok-num">5</span> };

<span class="tok-comment">/// Run one effect FS over the pattern; returns the filtered panel.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">runEffect</span>(
    <span class="tok-kw">comptime</span> FsModule: type,
    fs_io: FsModule.Io,
) [src_w * src_h][<span class="tok-num">4</span>]u8 {
    <span class="tok-kw">var</span> outs: [<span class="tok-num">6</span>]quad_vs.Out = undefined;
    <span class="tok-kw">var</span> vio: quad_vs.Io = undefined;
    <span class="tok-kw">for</span> (quad_positions, &amp;outs) |p, *o| {
        vio.vertex_ndc_pos = .{ p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>] };
        o.* = quad_vs.<span class="tok-fn">shaderMain</span>(vio);
    }
    <span class="tok-kw">const</span> connect: <span class="tok-kw">fn</span> (quad_vs.Out, *FsModule.Io) void = z.shader.<span class="tok-fn">autoConnect</span>(quad_vs.Out, FsModule.Io);
    <span class="tok-kw">return</span> z.raster_shader.<span class="tok-fn">rasterizeToImage</span>(
        quad_vs,
        FsModule,
        src_w,
        src_h,
        &amp;outs,
        &amp;quad_indices,
        fs_io,
        connect,
        .{ .front_face = .none, .depth_test = false },
        .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> }, <span class="tok-comment">// transparent clear - panels composite like the app</span>
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">countDiff</span>(a: []<span class="tok-kw">const</span> [<span class="tok-num">4</span>]u8, b: []<span class="tok-kw">const</span> [<span class="tok-num">4</span>]u8) u32 {
    <span class="tok-kw">var</span> n: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (a, b) |pa, pb| {
        <span class="tok-kw">if</span> (pa[<span class="tok-num">0</span>] != pb[<span class="tok-num">0</span>] <span class="tok-kw">or</span> pa[<span class="tok-num">1</span>] != pb[<span class="tok-num">1</span>] <span class="tok-kw">or</span> pa[<span class="tok-num">2</span>] != pb[<span class="tok-num">2</span>] <span class="tok-kw">or</span> pa[<span class="tok-num">3</span>] != pb[<span class="tok-num">3</span>]) {
            n += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">return</span> n;
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">main</span>() !void {
    <span class="tok-kw">const</span> gpa: Allocator = std.heap.page_allocator;
    <span class="tok-kw">var</span> io_threaded: std.Io.Threaded = .<span class="tok-fn">init</span>(gpa, .{});
    <span class="tok-kw">defer</span> io_threaded.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">const</span> io: std.Io = io_threaded.<span class="tok-fn">io</span>();

    <span class="tok-kw">const</span> pattern: [src_w * src_h][<span class="tok-num">4</span>]u8 = <span class="tok-fn">buildPattern</span>();
    <span class="tok-comment">// NOTE: every externs module declares its OWN structurally-identical</span>
    <span class="tok-comment">// TextureRef type, so each effect gets an anonymous literal (they</span>
    <span class="tok-comment">// coerce); a shared typed const would not cross-assign.</span>
    <span class="tok-kw">const</span> src_bytes: []<span class="tok-kw">const</span> u8 = std.mem.<span class="tok-fn">sliceAsBytes</span>(pattern[<span class="tok-num">0</span>..]);

    <span class="tok-comment">// ---- grade: strong contrast + saturation, must differ from source ----</span>
    <span class="tok-kw">var</span> grade_io: fx.grade_fs.Io = undefined;
    grade_io.u = .{ .params = .{ <span class="tok-num">0.5</span>, <span class="tok-num">0.0</span>, <span class="tok-num">0.6</span>, <span class="tok-num">0</span> } };
    grade_io._texture0 = .{ .pixels = src_bytes, .width = src_w, .height = src_h };
    <span class="tok-kw">const</span> grade: [src_w * src_h][<span class="tok-num">4</span>]u8 = <span class="tok-fn">runEffect</span>(fx.grade_fs, grade_io);

    <span class="tok-comment">// ---- waves: frozen mid-swing, edges must be displaced ----</span>
    <span class="tok-kw">var</span> wave_io: fx.wave_fs.Io = undefined;
    wave_io.u = .{
        .drive = .{ <span class="tok-num">1.7</span>, <span class="tok-num">25</span>, <span class="tok-num">25</span>, <span class="tok-num">0</span> },
        .motion = .{ <span class="tok-num">5</span>, <span class="tok-num">5</span>, <span class="tok-num">8</span>, <span class="tok-num">8</span> },
        .size = .{ <span class="tok-fn">float</span>(src_w), <span class="tok-fn">float</span>(src_h), <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    wave_io._texture0 = .{ .pixels = src_bytes, .width = src_w, .height = src_h };
    <span class="tok-kw">const</span> waves: [src_w * src_h][<span class="tok-num">4</span>]u8 = <span class="tok-fn">runEffect</span>(fx.wave_fs, wave_io);

    <span class="tok-comment">// ---- outline: orange ink must appear around the alpha silhouettes ----</span>
    <span class="tok-kw">var</span> outline_io: fx.outline_fs.Io = undefined;
    outline_io.u = .{
        .outline_color = .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.42</span>, <span class="tok-num">0.1</span>, <span class="tok-num">1</span> },
        .params = .{ <span class="tok-num">3</span>, <span class="tok-fn">float</span>(src_w), <span class="tok-fn">float</span>(src_h), <span class="tok-num">0</span> },
    };
    outline_io._texture0 = .{ .pixels = src_bytes, .width = src_w, .height = src_h };
    <span class="tok-kw">const</span> outline: [src_w * src_h][<span class="tok-num">4</span>]u8 = <span class="tok-fn">runEffect</span>(fx.outline_fs, outline_io);

    <span class="tok-comment">// ---- palette: every opaque pixel must BE a palette entry ----</span>
    <span class="tok-kw">const</span> table: [<span class="tok-num">8</span>][<span class="tok-num">4</span>]f32 = .{
        .{ <span class="tok-num">0.06</span>, <span class="tok-num">0.22</span>, <span class="tok-num">0.06</span>, <span class="tok-num">1</span> }, .{ <span class="tok-num">0.19</span>, <span class="tok-num">0.38</span>, <span class="tok-num">0.19</span>, <span class="tok-num">1</span> },
        .{ <span class="tok-num">0.30</span>, <span class="tok-num">0.51</span>, <span class="tok-num">0.30</span>, <span class="tok-num">1</span> }, .{ <span class="tok-num">0.42</span>, <span class="tok-num">0.65</span>, <span class="tok-num">0.30</span>, <span class="tok-num">1</span> },
        .{ <span class="tok-num">0.55</span>, <span class="tok-num">0.75</span>, <span class="tok-num">0.35</span>, <span class="tok-num">1</span> }, .{ <span class="tok-num">0.67</span>, <span class="tok-num">0.84</span>, <span class="tok-num">0.45</span>, <span class="tok-num">1</span> },
        .{ <span class="tok-num">0.78</span>, <span class="tok-num">0.91</span>, <span class="tok-num">0.56</span>, <span class="tok-num">1</span> }, .{ <span class="tok-num">0.88</span>, <span class="tok-num">0.97</span>, <span class="tok-num">0.68</span>, <span class="tok-num">1</span> },
    };
    <span class="tok-kw">var</span> pal_io: fx.palette_fs.Io = undefined;
    pal_io.u = .{ .palette = undefined, .params = .{ <span class="tok-num">8</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } };
    <span class="tok-kw">for</span> (table, &amp;pal_io.u.palette) |src, *dst| {
        dst.* = src;
    }
    pal_io._texture0 = .{ .pixels = src_bytes, .width = src_w, .height = src_h };
    <span class="tok-kw">const</span> palette: [src_w * src_h][<span class="tok-num">4</span>]u8 = <span class="tok-fn">runEffect</span>(fx.palette_fs, pal_io);

    <span class="tok-comment">// ---- spotlight: center of the hero spot keeps its color, the far</span>
    <span class="tok-comment">//      corner goes dark ----</span>
    <span class="tok-kw">var</span> spot_io: fx.spotlight_fs.Io = undefined;
    spot_io.u = .{
        .spots = .{
            .{ <span class="tok-num">60</span>, <span class="tok-num">70</span>, <span class="tok-num">14</span>, <span class="tok-num">42</span> }, <span class="tok-comment">// hero: parked on the red disk</span>
            .{ <span class="tok-num">130</span>, <span class="tok-num">95</span>, <span class="tok-num">8</span>, <span class="tok-num">26</span> },
            .{ <span class="tok-num">170</span>, <span class="tok-num">50</span>, <span class="tok-num">8</span>, <span class="tok-num">26</span> },
        },
        .params = .{ <span class="tok-num">0.12</span>, <span class="tok-fn">float</span>(src_w), <span class="tok-fn">float</span>(src_h), <span class="tok-num">0</span> },
    };
    spot_io._texture0 = .{ .pixels = src_bytes, .width = src_w, .height = src_h };
    <span class="tok-kw">const</span> spotlight: [src_w * src_h][<span class="tok-num">4</span>]u8 = <span class="tok-fn">runEffect</span>(fx.spotlight_fs, spot_io);

    <span class="tok-comment">// ---- assertions ----</span>
    <span class="tok-kw">const</span> grade_diff: u32 = <span class="tok-fn">countDiff</span>(pattern[<span class="tok-num">0</span>..], grade[<span class="tok-num">0</span>..]);
    <span class="tok-kw">const</span> wave_diff: u32 = <span class="tok-fn">countDiff</span>(pattern[<span class="tok-num">0</span>..], waves[<span class="tok-num">0</span>..]);
    <span class="tok-kw">var</span> ink_px: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (outline) |px| {
        <span class="tok-kw">if</span> (px[<span class="tok-num">0</span>] &gt; <span class="tok-num">200</span> <span class="tok-kw">and</span> px[<span class="tok-num">1</span>] &gt; <span class="tok-num">70</span> <span class="tok-kw">and</span> px[<span class="tok-num">1</span>] &lt; <span class="tok-num">160</span> <span class="tok-kw">and</span> px[<span class="tok-num">2</span>] &lt; <span class="tok-num">80</span>) {
            ink_px += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-comment">// Spot center (inside disk 0's inner circle) must keep the disk's</span>
    <span class="tok-comment">// red; the bar's far end (x=190,y=127 - outside all spots) must be</span>
    <span class="tok-comment">// darkened to ~12% of its source brightness.</span>
    <span class="tok-kw">const</span> center_px: [<span class="tok-num">4</span>]u8 = spotlight[<span class="tok-num">70</span> * src_w + <span class="tok-num">60</span>];
    <span class="tok-kw">const</span> far_src: [<span class="tok-num">4</span>]u8 = pattern[<span class="tok-num">127</span> * src_w + <span class="tok-num">190</span>];
    <span class="tok-kw">const</span> far_px: [<span class="tok-num">4</span>]u8 = spotlight[<span class="tok-num">127</span> * src_w + <span class="tok-num">190</span>];
    <span class="tok-kw">const</span> spot_center_ok: bool = center_px[<span class="tok-num">0</span>] &gt; <span class="tok-num">220</span>;
    <span class="tok-kw">const</span> spot_dark_ok: bool = far_px[<span class="tok-num">0</span>] &lt; <span class="tok-builtin">@divTrunc</span>(<span class="tok-builtin">@as</span>(u16, far_src[<span class="tok-num">0</span>]) * <span class="tok-num">25</span>, <span class="tok-num">100</span>);

    <span class="tok-kw">var</span> pal_bad: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (palette) |px| {
        <span class="tok-kw">if</span> (px[<span class="tok-num">3</span>] &lt; <span class="tok-num">10</span>) {
            <span class="tok-kw">continue</span>; <span class="tok-comment">// transparent bg passes through</span>
        }
        <span class="tok-kw">var</span> matched: bool = false;
        <span class="tok-kw">for</span> (table) |entry| {
            <span class="tok-kw">const</span> er: i32 = <span class="tok-builtin">@trunc</span>(entry[<span class="tok-num">0</span>] * <span class="tok-num">255.0</span>);
            <span class="tok-kw">const</span> eg: i32 = <span class="tok-builtin">@trunc</span>(entry[<span class="tok-num">1</span>] * <span class="tok-num">255.0</span>);
            <span class="tok-kw">const</span> eb: i32 = <span class="tok-builtin">@trunc</span>(entry[<span class="tok-num">2</span>] * <span class="tok-num">255.0</span>);
            <span class="tok-kw">const</span> dr: i32 = <span class="tok-builtin">@as</span>(i32, px[<span class="tok-num">0</span>]) - er;
            <span class="tok-kw">const</span> dg: i32 = <span class="tok-builtin">@as</span>(i32, px[<span class="tok-num">1</span>]) - eg;
            <span class="tok-kw">const</span> db: i32 = <span class="tok-builtin">@as</span>(i32, px[<span class="tok-num">2</span>]) - eb;
            <span class="tok-kw">if</span> (dr * dr + dg * dg + db * db &lt; <span class="tok-num">32</span>) {
                matched = true;
            }
        }
        <span class="tok-kw">if</span> (!matched) {
            pal_bad += <span class="tok-num">1</span>;
        }
    }
    std.debug.<span class="tok-fn">print</span>(
        <span class="tok-str">"effects_verify: grade diff {d} px, wave diff {d} px, outline ink {d} px, "</span> ++
            <span class="tok-str">"palette off-table {d} px, spot center ok {}, spot dark ok {}\n"</span>,
        .{ grade_diff, wave_diff, ink_px, pal_bad, spot_center_ok, spot_dark_ok },
    );

    <span class="tok-comment">// ---- contact sheet: source | grade | waves | outline | palette ----</span>
    <span class="tok-kw">const</span> sheet_w: usize = src_w * panels;
    <span class="tok-kw">const</span> sheet: []([<span class="tok-num">4</span>]u8) = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>([<span class="tok-num">4</span>]u8, sheet_w * src_h);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(sheet);
    <span class="tok-kw">const</span> panels_data = [panels]*<span class="tok-kw">const</span> [src_w * src_h][<span class="tok-num">4</span>]u8{
        &amp;pattern, &amp;grade, &amp;waves, &amp;outline, &amp;palette, &amp;spotlight,
    };
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..src_h) |y| {
        <span class="tok-kw">for</span> (panels_data, <span class="tok-num">0</span>..) |panel, pi| {
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..src_w) |x| {
                sheet[y * sheet_w + pi * src_w + x] = panel[y * src_w + x];
            }
        }
    }
    <span class="tok-kw">const</span> png: []u8 = <span class="tok-kw">try</span> z.codecs.png.<span class="tok-fn">encode</span>(gpa, std.mem.<span class="tok-fn">sliceAsBytes</span>(sheet), sheet_w, src_h);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(png);
    <span class="tok-kw">try</span> std.Io.Dir.<span class="tok-fn">cwd</span>().<span class="tok-fn">writeFile</span>(io, .{ .sub_path = <span class="tok-str">"effects_verify.png"</span>, .data = png });
    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"  wrote effects_verify.png\n"</span>, .{});

    <span class="tok-kw">if</span> (grade_diff == <span class="tok-num">0</span> <span class="tok-kw">or</span> wave_diff == <span class="tok-num">0</span> <span class="tok-kw">or</span> ink_px == <span class="tok-num">0</span> <span class="tok-kw">or</span> pal_bad &gt; <span class="tok-num">50</span> <span class="tok-kw">or</span>
        !spot_center_ok <span class="tok-kw">or</span> !spot_dark_ok)
    {
        <span class="tok-kw">return</span> <span class="tok-kw">error</span>.EffectsLookWrong;
    }
    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"  OK\n"</span>, .{});
}
