<h1>input_actions</h1>
<figure class="code src-file" data-path="examples/input_actions/input_actions.zig" data-lines="469"><figcaption><span>examples/input_actions/input_actions.zig</span><span>469 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! input_actions - port of raylib [core] example - input actions.</span>
<span class="tok-comment">//! raylib source: examples/core/core_input_actions.c.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! raylib's sample is about ONE idea: an ACTION MAP. Game logic never reads a</span>
<span class="tok-comment">//! key directly - it asks "is ACTION_UP down?", and a small indirection layer</span>
<span class="tok-comment">//! decides which physical input satisfies that action. raylib proves the point</span>
<span class="tok-comment">//! by letting you swap between two keysets (WASD vs the cursor keys) while the</span>
<span class="tok-comment">//! box-moving logic stays byte-for-byte identical.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! On a phone there is no keyboard, so the honest translation keeps the LESSON</span>
<span class="tok-comment">//! (game logic depends only on logical actions) and swaps the two *keysets* for</span>
<span class="tok-comment">//! two *input schemes* that a touch screen actually has:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * PAD   - a discrete D-pad (four buttons) + a Fire button. Multi-touch, so</span>
<span class="tok-comment">//!             two thumbs give real diagonals and simultaneous fire.</span>
<span class="tok-comment">//!   * STICK - a virtual analog stick: drag inside the ring, the knob's offset</span>
<span class="tok-comment">//!             past a dead-zone becomes the same four direction actions.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Both schemes fill the SAME `Actions` struct; the box update and the on-screen</span>
<span class="tok-comment">//! read-out consume only that struct and cannot tell which scheme produced it -</span>
<span class="tok-comment">//! which is the entire raylib lesson, made tactile. Toggle the scheme live and</span>
<span class="tok-comment">//! watch the identical logic keep working.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! No new engine primitive: the action map is a tiny in-example construct (raw</span>
<span class="tok-comment">//! touch/mouse in, logical `Actions` out). `.memory = .managed`: only the UI</span>
<span class="tok-comment">//! font is owned, freed in `deinit`.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = z.colors;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Scheme = <span class="tok-kw">enum</span> { pad, stick };

<span class="tok-comment">/// The logical action set - the ONLY thing the game logic reads.</span>
<span class="tok-kw">const</span> Actions = <span class="tok-kw">struct</span> {
    up: bool = false,
    down: bool = false,
    left: bool = false,
    right: bool = false,
    <span class="tok-comment">/// Edge-triggered: true only on the frame Fire goes down.</span>
    fire_pressed: bool = false,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_font: z.Font,
    scheme: Scheme = .pad,
    box: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    <span class="tok-comment">/// Fire button held last frame, so a press is an edge not a level.</span>
    fire_was_down: bool = false,
    <span class="tok-comment">/// Fire feedback: expanding ring, seconds remaining.</span>
    flash: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Latest actions, kept for the on-screen read-out.</span>
    acts: Actions = .{},
    <span class="tok-comment">/// Live knob offset for the stick scheme (for drawing), in px.</span>
    knob: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    initialised: bool = false,
};

<span class="tok-comment">/// Control geometry, recomputed each frame from the window size so it adapts to</span>
<span class="tok-comment">/// portrait/landscape and any screen. All positions are in logical px.</span>
<span class="tok-kw">const</span> Layout = <span class="tok-kw">struct</span> {
    play: z.Rectangle,
    <span class="tok-comment">/// D-pad / stick base centre + button/base radius.</span>
    left_center: Vec2,
    dir_radius: f32,
    base_radius: f32,
    fire_center: Vec2,
    fire_radius: f32,
    toggle: z.Rectangle,
};

<span class="tok-kw">fn</span> <span class="tok-fn">computeLayout</span>(fw: f32, fh: f32) Layout {
    <span class="tok-kw">const</span> band: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">280.0</span>, fh * <span class="tok-num">0.42</span>);
    <span class="tok-kw">const</span> play: z.Rectangle = .{ .x = <span class="tok-num">12</span>, .y = <span class="tok-num">56</span>, .width = fw - <span class="tok-num">24</span>, .height = fh - band - <span class="tok-num">68</span> };
    <span class="tok-kw">const</span> cy: f32 = fh - band * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> dir_r: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">44.0</span>, band * <span class="tok-num">0.16</span>);
    <span class="tok-kw">return</span> .{
        .play = play,
        .left_center = .{ fw * <span class="tok-num">0.24</span>, cy },
        .dir_radius = dir_r,
        .base_radius = dir_r * <span class="tok-num">2.1</span>,
        .fire_center = .{ fw * <span class="tok-num">0.78</span>, cy },
        .fire_radius = <span class="tok-builtin">@min</span>(<span class="tok-num">58.0</span>, band * <span class="tok-num">0.2</span>),
        .toggle = .{ .x = fw - <span class="tok-num">150</span>, .y = <span class="tok-num">12</span>, .width = <span class="tok-num">138</span>, .height = <span class="tok-num">34</span> },
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">dpadButtonCenter</span>(lay: Layout, dir: u2) Vec2 {
    <span class="tok-comment">// 0=up 1=down 2=left 3=right, arranged as a cross around left_center.</span>
    <span class="tok-kw">const</span> g: f32 = lay.dir_radius * <span class="tok-num">1.15</span>;
    <span class="tok-kw">const</span> p: Vec2 = lay.left_center;
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (dir) {
        <span class="tok-num">0</span> =&gt; .{ p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>] - g },
        <span class="tok-num">1</span> =&gt; .{ p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>] + g },
        <span class="tok-num">2</span> =&gt; .{ p[<span class="tok-num">0</span>] - g, p[<span class="tok-num">1</span>] },
        <span class="tok-num">3</span> =&gt; .{ p[<span class="tok-num">0</span>] + g, p[<span class="tok-num">1</span>] },
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">within</span>(point: Vec2, center: Vec2, radius: f32) bool {
    <span class="tok-kw">const</span> dx: f32 = point[<span class="tok-num">0</span>] - center[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> dy: f32 = point[<span class="tok-num">1</span>] - center[<span class="tok-num">1</span>];
    <span class="tok-kw">return</span> dx * dx + dy * dy &lt;= radius * radius;
}

<span class="tok-kw">fn</span> <span class="tok-fn">pointInRect</span>(point: Vec2, r: z.Rectangle) bool {
    <span class="tok-kw">return</span> point[<span class="tok-num">0</span>] &gt;= r.x <span class="tok-kw">and</span> point[<span class="tok-num">0</span>] &lt;= r.x + r.width <span class="tok-kw">and</span>
        point[<span class="tok-num">1</span>] &gt;= r.y <span class="tok-kw">and</span> point[<span class="tok-num">1</span>] &lt;= r.y + r.height;
}

<span class="tok-comment">/// Gather every active pointer this frame (all touch points; else mouse if the</span>
<span class="tok-comment">/// left button is held) into `buf`, returning the count.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">gatherPoints</span>(f: *z.Frame, buf: []Vec2) usize {
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">const</span> tc: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">var</span> i: i32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; tc <span class="tok-kw">and</span> n &lt; buf.len) : (i += <span class="tok-num">1</span>) {
        buf[n] = z.<span class="tok-fn">getTouchPosition</span>(f.input, i);
        n += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">if</span> (n == <span class="tok-num">0</span> <span class="tok-kw">and</span> z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left)) {
        buf[<span class="tok-num">0</span>] = z.<span class="tok-fn">getMousePosition</span>(f.input);
        n = <span class="tok-num">1</span>;
    }
    <span class="tok-kw">return</span> n;
}

<span class="tok-comment">/// PAD scheme: OR every pointer against each button. `fire_down` is the raw</span>
<span class="tok-comment">/// (level) fire state; the caller turns it into an edge.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">readPad</span>(
    points: []<span class="tok-kw">const</span> Vec2,
    lay: Layout,
    fire_down: *bool,
) Actions {
    <span class="tok-kw">var</span> a: Actions = .{};
    <span class="tok-kw">for</span> (points) |p| {
        <span class="tok-kw">if</span> (<span class="tok-fn">within</span>(p, <span class="tok-fn">dpadButtonCenter</span>(lay, <span class="tok-num">0</span>), lay.dir_radius)) {
            a.up = true;
        }
        <span class="tok-kw">if</span> (<span class="tok-fn">within</span>(p, <span class="tok-fn">dpadButtonCenter</span>(lay, <span class="tok-num">1</span>), lay.dir_radius)) {
            a.down = true;
        }
        <span class="tok-kw">if</span> (<span class="tok-fn">within</span>(p, <span class="tok-fn">dpadButtonCenter</span>(lay, <span class="tok-num">2</span>), lay.dir_radius)) {
            a.left = true;
        }
        <span class="tok-kw">if</span> (<span class="tok-fn">within</span>(p, <span class="tok-fn">dpadButtonCenter</span>(lay, <span class="tok-num">3</span>), lay.dir_radius)) {
            a.right = true;
        }
        <span class="tok-kw">if</span> (<span class="tok-fn">within</span>(p, lay.fire_center, lay.fire_radius)) {
            fire_down.* = true;
        }
    }
    <span class="tok-kw">return</span> a;
}

<span class="tok-comment">/// STICK scheme: the first pointer inside the base becomes the stick; its offset</span>
<span class="tok-comment">/// past a dead-zone maps to the four direction actions. `out_knob` receives the</span>
<span class="tok-comment">/// clamped knob offset for drawing. Fire stays a button.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">readStick</span>(
    points: []<span class="tok-kw">const</span> Vec2,
    lay: Layout,
    fire_down: *bool,
    out_knob: *Vec2,
) Actions {
    <span class="tok-kw">var</span> a: Actions = .{};
    out_knob.* = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    <span class="tok-kw">const</span> dead: f32 = lay.base_radius * <span class="tok-num">0.28</span>;
    <span class="tok-kw">for</span> (points) |p| {
        <span class="tok-kw">if</span> (<span class="tok-fn">within</span>(p, lay.fire_center, lay.fire_radius)) {
            fire_down.* = true;
        }
    }
    <span class="tok-kw">for</span> (points) |p| {
        <span class="tok-kw">if</span> (!<span class="tok-fn">within</span>(p, lay.left_center, lay.base_radius)) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">var</span> off: Vec2 = .{ p[<span class="tok-num">0</span>] - lay.left_center[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>] - lay.left_center[<span class="tok-num">1</span>] };
        <span class="tok-kw">const</span> len: f32 = <span class="tok-builtin">@sqrt</span>(off[<span class="tok-num">0</span>] * off[<span class="tok-num">0</span>] + off[<span class="tok-num">1</span>] * off[<span class="tok-num">1</span>]);
        <span class="tok-kw">if</span> (len &gt; lay.base_radius) {
            <span class="tok-kw">const</span> s: f32 = lay.base_radius / len;
            off = .{ off[<span class="tok-num">0</span>] * s, off[<span class="tok-num">1</span>] * s };
        }
        out_knob.* = off;
        <span class="tok-kw">if</span> (off[<span class="tok-num">1</span>] &lt; -dead) {
            a.up = true;
        }
        <span class="tok-kw">if</span> (off[<span class="tok-num">1</span>] &gt; dead) {
            a.down = true;
        }
        <span class="tok-kw">if</span> (off[<span class="tok-num">0</span>] &lt; -dead) {
            a.left = true;
        }
        <span class="tok-kw">if</span> (off[<span class="tok-num">0</span>] &gt; dead) {
            a.right = true;
        }
        <span class="tok-kw">break</span>;
    }
    <span class="tok-kw">return</span> a;
}

<span class="tok-comment">/// Top-left position that centres a `size`-square box in `play`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">playCenter</span>(play: z.Rectangle, size: f32) Vec2 {
    <span class="tok-kw">return</span> .{ play.x + play.width * <span class="tok-num">0.5</span> - size * <span class="tok-num">0.5</span>, play.y + play.height * <span class="tok-num">0.5</span> - size * <span class="tok-num">0.5</span> };
}

<span class="tok-comment">/// PURE game logic: move the box by the actions. Reads ONLY `Actions` - it has</span>
<span class="tok-comment">/// no idea which scheme produced them. Returns the new position, clamped to the</span>
<span class="tok-comment">/// play rect. This is the whole point of the action map.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">applyActions</span>(
    box: Vec2,
    size: f32,
    acts: Actions,
    dt: f32,
    play: z.Rectangle,
) Vec2 {
    <span class="tok-kw">const</span> speed: f32 = <span class="tok-num">320.0</span>;
    <span class="tok-kw">var</span> p: Vec2 = box;
    <span class="tok-kw">if</span> (acts.up) {
        p[<span class="tok-num">1</span>] -= speed * dt;
    }
    <span class="tok-kw">if</span> (acts.down) {
        p[<span class="tok-num">1</span>] += speed * dt;
    }
    <span class="tok-kw">if</span> (acts.left) {
        p[<span class="tok-num">0</span>] -= speed * dt;
    }
    <span class="tok-kw">if</span> (acts.right) {
        p[<span class="tok-num">0</span>] += speed * dt;
    }
    <span class="tok-kw">const</span> min_x: f32 = play.x;
    <span class="tok-kw">const</span> min_y: f32 = play.y;
    <span class="tok-kw">const</span> max_x: f32 = play.x + play.width - size;
    <span class="tok-kw">const</span> max_y: f32 = play.y + play.height - size;
    p[<span class="tok-num">0</span>] = <span class="tok-fn">clamp</span>(p[<span class="tok-num">0</span>], min_x, max_x);
    p[<span class="tok-num">1</span>] = <span class="tok-fn">clamp</span>(p[<span class="tok-num">1</span>], min_y, max_y);
    <span class="tok-kw">return</span> p;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{ .ui_font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>) };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.ui_font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> dt: f32 = f.time.delta_time;
    <span class="tok-kw">const</span> lay: Layout = <span class="tok-fn">computeLayout</span>(fw, fh);
    <span class="tok-kw">const</span> box_size: f32 = <span class="tok-num">44</span>;

    <span class="tok-comment">// Centre the box on first frame (needs a valid layout).</span>
    <span class="tok-kw">if</span> (!s.initialised) {
        s.box = <span class="tok-fn">playCenter</span>(lay.play, box_size);
        s.initialised = true;
    }

    <span class="tok-comment">// ---- input -&gt; actions (the swappable layer) ---------------------------</span>
    <span class="tok-kw">var</span> pbuf: [<span class="tok-num">8</span>]Vec2 = undefined;
    <span class="tok-kw">const</span> np: usize = <span class="tok-fn">gatherPoints</span>(f, &amp;pbuf);
    <span class="tok-kw">const</span> points: []<span class="tok-kw">const</span> Vec2 = pbuf[<span class="tok-num">0</span>..np];

    <span class="tok-kw">var</span> fire_down: bool = false;
    <span class="tok-kw">var</span> knob: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    <span class="tok-kw">const</span> acts: Actions = <span class="tok-kw">switch</span> (s.scheme) {
        .pad =&gt; <span class="tok-fn">readPad</span>(points, lay, &amp;fire_down),
        .stick =&gt; <span class="tok-fn">readStick</span>(points, lay, &amp;fire_down, &amp;knob),
    };

    <span class="tok-comment">// Scheme toggle (its own hit region, so it never feeds the game).</span>
    <span class="tok-kw">var</span> toggled: bool = false;
    <span class="tok-kw">for</span> (points) |p| {
        <span class="tok-kw">if</span> (<span class="tok-fn">pointInRect</span>(p, lay.toggle)) {
            toggled = true;
        }
    }
    <span class="tok-comment">// toggle is edge-triggered off the same fire_was_down guard? No - give it</span>
    <span class="tok-comment">// its own edge via a static-ish check: only flip when a fresh press lands.</span>
    <span class="tok-comment">// Reuse fire edge machinery would double-fire, so gate on !fire_was_down and</span>
    <span class="tok-comment">// require the toggle not to have been held: track via the flash-free path.</span>
    <span class="tok-kw">if</span> (toggled <span class="tok-kw">and</span> !s.fire_was_down <span class="tok-kw">and</span> np == <span class="tok-num">1</span>) {
        <span class="tok-comment">// a single fresh pointer on the toggle flips the scheme</span>
        s.scheme = <span class="tok-kw">if</span> (s.scheme == .pad) .stick <span class="tok-kw">else</span> .pad;
    }

    <span class="tok-kw">var</span> out_acts: Actions = acts;
    out_acts.fire_pressed = fire_down <span class="tok-kw">and</span> !s.fire_was_down;
    s.fire_was_down = fire_down <span class="tok-kw">or</span> toggled;

    <span class="tok-comment">// ---- game logic (reads ONLY actions) ----------------------------------</span>
    s.box = <span class="tok-fn">applyActions</span>(s.box, box_size, out_acts, dt, lay.play);
    <span class="tok-kw">if</span> (out_acts.fire_pressed) {
        s.box = <span class="tok-fn">playCenter</span>(lay.play, box_size);
        s.flash = <span class="tok-num">0.45</span>;
    }
    <span class="tok-kw">if</span> (s.flash &gt; <span class="tok-num">0</span>) {
        s.flash -= dt;
    }
    s.acts = out_acts;
    s.knob = knob;

    <span class="tok-comment">// ---- draw -------------------------------------------------------------</span>
    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">15</span>, .g = <span class="tok-num">17</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> });
    common.<span class="tok-fn">backdrop</span>(f.gl, fw, fh);

    <span class="tok-comment">// play area frame</span>
    f.gl.<span class="tok-fn">rect</span>(lay.play, .{ .color = .{ .r = <span class="tok-num">30</span>, .g = <span class="tok-num">34</span>, .b = <span class="tok-num">44</span>, .a = <span class="tok-num">255</span> }, .outline = <span class="tok-num">1.0</span> });

    <span class="tok-comment">// fire flash ring</span>
    <span class="tok-kw">if</span> (s.flash &gt; <span class="tok-num">0</span>) {
        <span class="tok-kw">const</span> t: f32 = <span class="tok-num">1.0</span> - s.flash / <span class="tok-num">0.45</span>;
        <span class="tok-kw">const</span> cx: f32 = lay.play.x + lay.play.width * <span class="tok-num">0.5</span>;
        <span class="tok-kw">const</span> cy2: f32 = lay.play.y + lay.play.height * <span class="tok-num">0.5</span>;
        <span class="tok-kw">const</span> a8: u8 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, <span class="tok-num">200.0</span> * (<span class="tok-num">1.0</span> - t)));
        f.gl.<span class="tok-fn">circle</span>(.{ cx, cy2 }, <span class="tok-num">20.0</span> + <span class="tok-num">90.0</span> * t, .{
            .color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">190</span>, .b = <span class="tok-num">90</span>, .a = a8 },
            .outline = <span class="tok-num">3.0</span>,
            .segments = <span class="tok-num">40</span>,
        });
    }

    <span class="tok-comment">// the box</span>
    f.gl.<span class="tok-fn">rectRoundedXYWH</span>(s.box[<span class="tok-num">0</span>], s.box[<span class="tok-num">1</span>], box_size, box_size, <span class="tok-num">0.3</span>, <span class="tok-num">8</span>, .{ .color = c.sky_400 });
    f.gl.<span class="tok-fn">rectRoundedXYWH</span>(s.box[<span class="tok-num">0</span>], s.box[<span class="tok-num">1</span>], box_size, box_size, <span class="tok-num">0.3</span>, <span class="tok-num">8</span>, .{ .color = c.sky_200, .outline = <span class="tok-num">2.0</span> });

    <span class="tok-fn">drawControls</span>(f, s, lay);
    <span class="tok-fn">drawReadout</span>(f, s, lay);

    common.<span class="tok-fn">caption</span>(
        f.gl,
        s.ui_font,
        <span class="tok-str">"Action map: the box logic reads only logical actions - swap the input scheme, it never notices"</span>,
    );
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">dirActive</span>(a: Actions, dir: u2) bool {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (dir) {
        <span class="tok-num">0</span> =&gt; a.up,
        <span class="tok-num">1</span> =&gt; a.down,
        <span class="tok-num">2</span> =&gt; a.left,
        <span class="tok-num">3</span> =&gt; a.right,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawControls</span>(f: *z.Frame, s: *State, lay: Layout) void {
    <span class="tok-kw">const</span> idle: Color = .{ .r = <span class="tok-num">44</span>, .g = <span class="tok-num">50</span>, .b = <span class="tok-num">62</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-kw">const</span> hot: Color = c.sky_500;

    <span class="tok-comment">// scheme toggle button</span>
    f.gl.<span class="tok-fn">rectRoundedXYWH</span>(lay.toggle.x, lay.toggle.y, lay.toggle.width, lay.toggle.height, <span class="tok-num">0.4</span>, <span class="tok-num">8</span>, .{
        .color = .{ .r = <span class="tok-num">50</span>, .g = <span class="tok-num">56</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> },
    });
    <span class="tok-kw">const</span> label: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.scheme == .pad) <span class="tok-str">"scheme: PAD"</span> <span class="tok-kw">else</span> <span class="tok-str">"scheme: STICK"</span>;
    f.gl.<span class="tok-fn">text</span>(.{ lay.toggle.x + <span class="tok-num">12</span>, lay.toggle.y + <span class="tok-num">9</span> }, label, .{
        .size = <span class="tok-num">15</span>,
        .color = c.slate_100,
        .font = &amp;s.ui_font,
    });

    <span class="tok-kw">switch</span> (s.scheme) {
        .pad =&gt; {
            <span class="tok-kw">var</span> d: u2 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (true) : (d += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> ctr: Vec2 = <span class="tok-fn">dpadButtonCenter</span>(lay, d);
                <span class="tok-kw">const</span> on: bool = <span class="tok-fn">dirActive</span>(s.acts, d);
                f.gl.<span class="tok-fn">circle</span>(ctr, lay.dir_radius, .{ .color = <span class="tok-kw">if</span> (on) hot <span class="tok-kw">else</span> idle, .segments = <span class="tok-num">24</span> });
                f.gl.<span class="tok-fn">circle</span>(ctr, lay.dir_radius, .{ .color = c.slate_500, .outline = <span class="tok-num">1.5</span>, .segments = <span class="tok-num">24</span> });
                <span class="tok-fn">drawArrow</span>(f, ctr, d, lay.dir_radius * <span class="tok-num">0.5</span>);
                <span class="tok-kw">if</span> (d == <span class="tok-num">3</span>) {
                    <span class="tok-kw">break</span>;
                }
            }
        },
        .stick =&gt; {
            f.gl.<span class="tok-fn">circle</span>(lay.left_center, lay.base_radius, .{
                .color = .{ .r = <span class="tok-num">34</span>, .g = <span class="tok-num">39</span>, .b = <span class="tok-num">50</span>, .a = <span class="tok-num">255</span> },
                .segments = <span class="tok-num">40</span>,
            });
            f.gl.<span class="tok-fn">circle</span>(lay.left_center, lay.base_radius, .{ .color = c.slate_600, .outline = <span class="tok-num">1.5</span>, .segments = <span class="tok-num">40</span> });
            <span class="tok-kw">const</span> knob_c: Vec2 = .{ lay.left_center[<span class="tok-num">0</span>] + s.knob[<span class="tok-num">0</span>], lay.left_center[<span class="tok-num">1</span>] + s.knob[<span class="tok-num">1</span>] };
            <span class="tok-kw">const</span> moving: bool = s.acts.up <span class="tok-kw">or</span> s.acts.down <span class="tok-kw">or</span> s.acts.left <span class="tok-kw">or</span> s.acts.right;
            f.gl.<span class="tok-fn">circle</span>(knob_c, lay.base_radius * <span class="tok-num">0.42</span>, .{ .color = <span class="tok-kw">if</span> (moving) hot <span class="tok-kw">else</span> idle, .segments = <span class="tok-num">28</span> });
            f.gl.<span class="tok-fn">circle</span>(knob_c, lay.base_radius * <span class="tok-num">0.42</span>, .{ .color = c.slate_400, .outline = <span class="tok-num">1.5</span>, .segments = <span class="tok-num">28</span> });
        },
    }

    <span class="tok-comment">// fire button (both schemes)</span>
    <span class="tok-kw">const</span> fire_hot: bool = s.acts.fire_pressed;
    <span class="tok-kw">const</span> fire_fill: Color = <span class="tok-kw">if</span> (fire_hot) c.amber_400 <span class="tok-kw">else</span> .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">44</span>, .b = <span class="tok-num">44</span>, .a = <span class="tok-num">255</span> };
    f.gl.<span class="tok-fn">circle</span>(lay.fire_center, lay.fire_radius, .{ .color = fire_fill, .segments = <span class="tok-num">32</span> });
    f.gl.<span class="tok-fn">circle</span>(lay.fire_center, lay.fire_radius, .{
        .color = .{ .r = <span class="tok-num">190</span>, .g = <span class="tok-num">33</span>, .b = <span class="tok-num">55</span>, .a = <span class="tok-num">255</span> },
        .outline = <span class="tok-num">2.0</span>,
        .segments = <span class="tok-num">32</span>,
    });
    <span class="tok-kw">const</span> fx: f32 = lay.fire_center[<span class="tok-num">0</span>] - z.<span class="tok-fn">measureText</span>(s.ui_font, <span class="tok-str">"FIRE"</span>, <span class="tok-num">16</span>)[<span class="tok-num">0</span>] * <span class="tok-num">0.5</span>;
    f.gl.<span class="tok-fn">text</span>(.{ fx, lay.fire_center[<span class="tok-num">1</span>] - <span class="tok-num">8</span> }, <span class="tok-str">"FIRE"</span>, .{ .size = <span class="tok-num">16</span>, .color = c.slate_100, .font = &amp;s.ui_font });
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawArrow</span>(f: *z.Frame, ctr: Vec2, dir: u2, r: f32) void {
    <span class="tok-kw">const</span> col: Color = c.slate_200;
    <span class="tok-kw">const</span> a: Vec2 = <span class="tok-kw">switch</span> (dir) {
        <span class="tok-num">0</span> =&gt; .{ ctr[<span class="tok-num">0</span>], ctr[<span class="tok-num">1</span>] - r },
        <span class="tok-num">1</span> =&gt; .{ ctr[<span class="tok-num">0</span>], ctr[<span class="tok-num">1</span>] + r },
        <span class="tok-num">2</span> =&gt; .{ ctr[<span class="tok-num">0</span>] - r, ctr[<span class="tok-num">1</span>] },
        <span class="tok-num">3</span> =&gt; .{ ctr[<span class="tok-num">0</span>] + r, ctr[<span class="tok-num">1</span>] },
    };
    <span class="tok-kw">const</span> b: Vec2 = <span class="tok-kw">switch</span> (dir) {
        <span class="tok-num">0</span> =&gt; .{ ctr[<span class="tok-num">0</span>] - r * <span class="tok-num">0.7</span>, ctr[<span class="tok-num">1</span>] + r * <span class="tok-num">0.4</span> },
        <span class="tok-num">1</span> =&gt; .{ ctr[<span class="tok-num">0</span>] - r * <span class="tok-num">0.7</span>, ctr[<span class="tok-num">1</span>] - r * <span class="tok-num">0.4</span> },
        <span class="tok-num">2</span> =&gt; .{ ctr[<span class="tok-num">0</span>] + r * <span class="tok-num">0.4</span>, ctr[<span class="tok-num">1</span>] - r * <span class="tok-num">0.7</span> },
        <span class="tok-num">3</span> =&gt; .{ ctr[<span class="tok-num">0</span>] - r * <span class="tok-num">0.4</span>, ctr[<span class="tok-num">1</span>] - r * <span class="tok-num">0.7</span> },
    };
    <span class="tok-kw">const</span> e: Vec2 = <span class="tok-kw">switch</span> (dir) {
        <span class="tok-num">0</span> =&gt; .{ ctr[<span class="tok-num">0</span>] + r * <span class="tok-num">0.7</span>, ctr[<span class="tok-num">1</span>] + r * <span class="tok-num">0.4</span> },
        <span class="tok-num">1</span> =&gt; .{ ctr[<span class="tok-num">0</span>] + r * <span class="tok-num">0.7</span>, ctr[<span class="tok-num">1</span>] - r * <span class="tok-num">0.4</span> },
        <span class="tok-num">2</span> =&gt; .{ ctr[<span class="tok-num">0</span>] + r * <span class="tok-num">0.4</span>, ctr[<span class="tok-num">1</span>] + r * <span class="tok-num">0.7</span> },
        <span class="tok-num">3</span> =&gt; .{ ctr[<span class="tok-num">0</span>] - r * <span class="tok-num">0.4</span>, ctr[<span class="tok-num">1</span>] + r * <span class="tok-num">0.7</span> },
    };
    f.gl.<span class="tok-fn">triangle</span>(a, b, e, .{ .color = col });
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawReadout</span>(f: *z.Frame, s: *State, lay: Layout) void {
    <span class="tok-kw">const</span> x: f32 = lay.play.x + <span class="tok-num">12</span>;
    <span class="tok-kw">var</span> y: f32 = lay.play.y + <span class="tok-num">10</span>;
    f.gl.<span class="tok-fn">text</span>(.{ x, y }, <span class="tok-str">"logical actions (what the game sees):"</span>, .{
        .size = <span class="tok-num">14</span>,
        .color = c.slate_400,
        .font = &amp;s.ui_font,
    });
    y += <span class="tok-num">24</span>;
    <span class="tok-kw">const</span> names = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"UP"</span>, <span class="tok-str">"DOWN"</span>, <span class="tok-str">"LEFT"</span>, <span class="tok-str">"RIGHT"</span>, <span class="tok-str">"FIRE"</span> };
    <span class="tok-kw">const</span> on = [_]bool{ s.acts.up, s.acts.down, s.acts.left, s.acts.right, s.acts.fire_pressed };
    <span class="tok-kw">var</span> cx: f32 = x;
    <span class="tok-kw">for</span> (names, on) |nm, active| {
        <span class="tok-kw">const</span> col: Color = <span class="tok-kw">if</span> (active) c.emerald_400 <span class="tok-kw">else</span> .{ .r = <span class="tok-num">60</span>, .g = <span class="tok-num">66</span>, .b = <span class="tok-num">78</span>, .a = <span class="tok-num">255</span> };
        <span class="tok-kw">const</span> w: f32 = z.<span class="tok-fn">measureText</span>(s.ui_font, nm, <span class="tok-num">16</span>)[<span class="tok-num">0</span>] + <span class="tok-num">18</span>;
        f.gl.<span class="tok-fn">rectRoundedXYWH</span>(cx, y, w, <span class="tok-num">26</span>, <span class="tok-num">0.4</span>, <span class="tok-num">6</span>, .{ .color = col });
        <span class="tok-kw">const</span> tcol: Color = <span class="tok-kw">if</span> (active) .{ .r = <span class="tok-num">10</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">15</span>, .a = <span class="tok-num">255</span> } <span class="tok-kw">else</span> c.slate_300;
        f.gl.<span class="tok-fn">text</span>(.{ cx + <span class="tok-num">9</span>, y + <span class="tok-num">5</span> }, nm, .{ .size = <span class="tok-num">16</span>, .color = tcol, .font = &amp;s.ui_font });
        cx += w + <span class="tok-num">8</span>;
    }
}
