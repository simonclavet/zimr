<h1>robot_pendulum</h1>
<figure class="code src-file" data-path="examples/robot_pendulum/robot_pendulum.zig" data-lines="293"><figcaption><span>examples/robot_pendulum/robot_pendulum.zig</span><span>293 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! robot_pendulum - the first thing `src/robot.zig` can draw.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A double pendulum, simulated in GENERALIZED COORDINATES: the whole machine is two</span>
<span class="tok-comment">//! numbers (two hinge angles) plus their velocities. There are no constraints to enforce</span>
<span class="tok-comment">//! and nothing to converge - the links cannot come apart, because the freedom to come</span>
<span class="tok-comment">//! apart was never represented.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! It is a good first demo for a reason beyond being easy. A double pendulum is chaotic,</span>
<span class="tok-comment">//! so a mass matrix or a bias force that is subtly wrong does not produce a subtly wrong</span>
<span class="tok-comment">//! swing; it produces motion that is visibly not a pendulum. And with no damping and no</span>
<span class="tok-comment">//! contact, total mechanical energy must be conserved - so the HUD shows the drift, which</span>
<span class="tok-comment">//! is a live readout of how good the integrator is.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Tap to re-throw from a new pose. The button switches integrator, which makes the point</span>
<span class="tok-comment">//! of the energy readout obvious: RK4 holds the line, Euler leaks.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Deliberately minimal, and it should stay that way. New scenes belong in a scene table,</span>
<span class="tok-comment">//! not bolted onto the demo whose job is to be the simplest thing that exercises the whole</span>
<span class="tok-comment">//! pipeline. See src/notes/robot_port_plan.md section 4b.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Standard wgpu example contract: a `pub const app: z.AppSpec(State)`.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> rbt = z.robot;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// zm decls bound at file scope (the linter wants no qualified `zm.x` inside fn bodies).</span>
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> vec2 = zm.vec2;
<span class="tok-kw">const</span> rotate = zm.rotate;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> assertUnreachable = zm.assertUnreachable;

<span class="tok-comment">/// The model. Two links hanging along -Y, hinged about Z, so the whole thing swings in the</span>
<span class="tok-comment">/// screen plane and can be drawn in 2D without a camera.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `damping = 0` is deliberate: a conserved quantity is only informative when it is</span>
<span class="tok-comment">/// actually conserved, and the energy readout is the point of the demo.</span>
<span class="tok-kw">const</span> Pendulum = rbt.<span class="tok-fn">Spec</span>(.{
    .bodies = &amp;.{
        .{
            .name = <span class="tok-str">"upper"</span>,
            .joints = &amp;.{.{ .name = <span class="tok-str">"shoulder"</span>, .kind = .hinge, .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>) }},
            .geoms = &amp;.{.{
                .shape = .{ .capsule = .{ .half_height = upper_half, .radius = <span class="tok-num">0.05</span> } },
                .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -upper_half, <span class="tok-num">0</span>),
            }},
        },
        .{
            .name = <span class="tok-str">"lower"</span>,
            .parent = <span class="tok-str">"upper"</span>,
            .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * upper_half, <span class="tok-num">0</span>),
            .joints = &amp;.{.{ .name = <span class="tok-str">"elbow"</span>, .kind = .hinge, .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>) }},
            .geoms = &amp;.{.{
                .shape = .{ .capsule = .{ .half_height = lower_half, .radius = <span class="tok-num">0.04</span> } },
                .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -lower_half, <span class="tok-num">0</span>),
            }},
        },
    },
    .options = .{ .timestep = <span class="tok-num">1.0</span> / <span class="tok-num">240.0</span> },
});

<span class="tok-kw">const</span> upper_half: f32 = <span class="tok-num">0.25</span>;
<span class="tok-kw">const</span> lower_half: f32 = <span class="tok-num">0.20</span>;

<span class="tok-comment">/// Metres to pixels. The pendulum is about 0.9 m tall, so this keeps it comfortably on a</span>
<span class="tok-comment">/// phone screen in portrait.</span>
<span class="tok-kw">const</span> scale: f32 = <span class="tok-num">260.0</span>;

<span class="tok-comment">// zimr's dark-warm palette, so the demo looks like the rest of the tree.</span>
<span class="tok-kw">const</span> bg: Color = .{ .r = <span class="tok-num">31</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">14</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> upper_color: Color = .{ .r = <span class="tok-num">211</span>, .g = <span class="tok-num">95</span>, .b = <span class="tok-num">51</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> lower_color: Color = .{ .r = <span class="tok-num">79</span>, .g = <span class="tok-num">179</span>, .b = <span class="tok-num">165</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> trail_color: Color = .{ .r = <span class="tok-num">79</span>, .g = <span class="tok-num">179</span>, .b = <span class="tok-num">165</span>, .a = <span class="tok-num">90</span> };
<span class="tok-kw">const</span> text_color: Color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">230</span>, .b = <span class="tok-num">210</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> dim_color: Color = .{ .r = <span class="tok-num">168</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">132</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> panel_color: Color = .{ .r = <span class="tok-num">51</span>, .g = <span class="tok-num">34</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> };

<span class="tok-comment">/// How many past tip positions to draw. Enough to show the shape of the motion, short</span>
<span class="tok-comment">/// enough that a chaotic path stays readable rather than filling the screen.</span>
<span class="tok-kw">const</span> trail_len: usize = <span class="tok-num">220</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    model: rbt.Model,
    data: rbt.Data,
    font: z.Font,

    <span class="tok-comment">/// Energy at the moment of the last throw, so the HUD can show DRIFT rather than an</span>
    <span class="tok-comment">/// absolute number nobody can calibrate against.</span>
    energy0: f32,
    <span class="tok-comment">/// Ring buffer of tip positions, in world metres.</span>
    trail: [trail_len]Vec2,
    trail_n: usize,
    <span class="tok-comment">/// Simulated seconds since the last throw - the axis the drift should be read against.</span>
    elapsed: f32,
    <span class="tok-comment">/// Advances the fixed-timestep loop independently of frame rate.</span>
    accumulator: f32,
    <span class="tok-comment">/// Cycled by the button; also relabels the readout.</span>
    integrator: rbt.Integrator,

    <span class="tok-kw">fn</span> <span class="tok-fn">throwFrom</span>(self: *State, shoulder: f32, elbow: f32) void {
        self.data.<span class="tok-fn">reset</span>(&amp;self.model);
        self.data.<span class="tok-fn">setJointPos</span>(&amp;self.model, Pendulum.Joint.shoulder, shoulder);
        self.data.<span class="tok-fn">setJointPos</span>(&amp;self.model, Pendulum.Joint.elbow, elbow);
        <span class="tok-comment">// `forward` so the energy baseline and the first frame's drawing both see a state</span>
        <span class="tok-comment">// whose derived quantities are current. Without it `energy` would read a stale</span>
        <span class="tok-comment">// mass matrix - the imperative pipeline being imperative.</span>
        rbt.<span class="tok-fn">forward</span>(&amp;self.model, &amp;self.data);
        self.energy0 = rbt.<span class="tok-fn">energy</span>(&amp;self.model, &amp;self.data);
        self.trail_n = <span class="tok-num">0</span>;
        self.elapsed = <span class="tok-num">0</span>;
        self.accumulator = <span class="tok-num">0</span>;
    }
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{
        .model = <span class="tok-kw">try</span> Pendulum.<span class="tok-fn">build</span>(gpa),
        .data = undefined,
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .energy0 = <span class="tok-num">0</span>,
        .trail = <span class="tok-builtin">@splat</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>)),
        .trail_n = <span class="tok-num">0</span>,
        .elapsed = <span class="tok-num">0</span>,
        .accumulator = <span class="tok-num">0</span>,
        .integrator = .rk4,
    };
    s.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;s.model);
    s.<span class="tok-fn">throwFrom</span>(<span class="tok-num">2.2</span>, -<span class="tok-num">1.4</span>);
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.data.<span class="tok-fn">deinit</span>();
    s.model.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// World metres to screen pixels. The pivot sits a third of the way down so a full swing</span>
<span class="tok-comment">/// stays in frame.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">toScreen</span>(w: f32, h: f32, p: Vec2) Vec2 {
    <span class="tok-kw">return</span> <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.5</span> + p[<span class="tok-num">0</span>] * scale, h * <span class="tok-num">0.34</span> - p[<span class="tok-num">1</span>] * scale);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> w: f32 = <span class="tok-fn">float</span>(f.window.screen_width);
    <span class="tok-kw">const</span> h: f32 = <span class="tok-fn">float</span>(f.window.screen_height);

    <span class="tok-comment">// Fixed-timestep integration, decoupled from the frame rate so the physics is the same</span>
    <span class="tok-comment">// on a 60 Hz phone and a 120 Hz one. Capped so a long stall cannot spiral.</span>
    s.model.opt.integrator = s.integrator;
    <span class="tok-kw">const</span> dt: f32 = s.model.opt.timestep;
    s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
    <span class="tok-kw">while</span> (s.accumulator &gt;= dt) : (s.accumulator -= dt) {
        rbt.<span class="tok-fn">step</span>(&amp;s.model, &amp;s.data);
        s.elapsed += dt;
    }

    <span class="tok-comment">// `step` leaves the derived quantities describing the state BEFORE the last step, so</span>
    <span class="tok-comment">// bring them up to date before drawing or measuring anything.</span>
    rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;s.data);

    <span class="tok-comment">// ---- geometry, straight out of the engine ----</span>
    <span class="tok-kw">const</span> bi_lower: usize = <span class="tok-num">2</span>;
    <span class="tok-kw">const</span> pivot: Vec2 = <span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> elbow: Vec2 = <span class="tok-fn">vec2</span>(s.data.body_xpos[bi_lower][<span class="tok-num">0</span>], s.data.body_xpos[bi_lower][<span class="tok-num">1</span>]);
    <span class="tok-comment">// The tip is the far end of the lower link, which is its body origin plus its own</span>
    <span class="tok-comment">// length along the link's local -Y. Asking the engine where a point on a body is, is</span>
    <span class="tok-comment">// exactly what a site would be for; for one point, this is cheaper than a site.</span>
    <span class="tok-kw">const</span> tip_local: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * lower_half, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> tip_world: Vec = s.data.body_xpos[bi_lower] + <span class="tok-fn">rotate</span>(s.data.body_xrot[bi_lower], tip_local);
    <span class="tok-kw">const</span> tip: Vec2 = <span class="tok-fn">vec2</span>(tip_world[<span class="tok-num">0</span>], tip_world[<span class="tok-num">1</span>]);

    s.trail[s.trail_n % trail_len] = tip;
    s.trail_n += <span class="tok-num">1</span>;

    <span class="tok-comment">// ---- draw ----</span>
    z.<span class="tok-fn">clearViewport</span>(f, bg);

    <span class="tok-comment">// The trail first, so the links sit on top of it.</span>
    <span class="tok-kw">const</span> shown: usize = <span class="tok-builtin">@min</span>(s.trail_n, trail_len);
    <span class="tok-kw">var</span> k: usize = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (k &lt; shown) : (k += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> oldest: usize = <span class="tok-kw">if</span> (s.trail_n &gt; trail_len) s.trail_n - trail_len <span class="tok-kw">else</span> <span class="tok-num">0</span>;
        <span class="tok-kw">const</span> a: Vec2 = s.trail[(oldest + k - <span class="tok-num">1</span>) % trail_len];
        <span class="tok-kw">const</span> b: Vec2 = s.trail[(oldest + k) % trail_len];
        gl.<span class="tok-fn">line</span>(<span class="tok-fn">toScreen</span>(w, h, a), <span class="tok-fn">toScreen</span>(w, h, b), .{ .color = trail_color, .thickness = <span class="tok-num">2</span> });
    }

    gl.<span class="tok-fn">line</span>(<span class="tok-fn">toScreen</span>(w, h, pivot), <span class="tok-fn">toScreen</span>(w, h, elbow), .{ .color = upper_color, .thickness = <span class="tok-num">10</span> });
    gl.<span class="tok-fn">line</span>(<span class="tok-fn">toScreen</span>(w, h, elbow), <span class="tok-fn">toScreen</span>(w, h, tip), .{ .color = lower_color, .thickness = <span class="tok-num">8</span> });
    gl.<span class="tok-fn">circle</span>(<span class="tok-fn">toScreen</span>(w, h, pivot), <span class="tok-num">7</span>, .{ .color = dim_color });
    gl.<span class="tok-fn">circle</span>(<span class="tok-fn">toScreen</span>(w, h, elbow), <span class="tok-num">6</span>, .{ .color = upper_color });
    gl.<span class="tok-fn">circle</span>(<span class="tok-fn">toScreen</span>(w, h, tip), <span class="tok-num">7</span>, .{ .color = lower_color });

    <span class="tok-comment">// ---- readout ----</span>
    <span class="tok-comment">// Energy drift is the honest measure of a closed system's integration: with no damping</span>
    <span class="tok-comment">// and no contact it MUST be conserved, so whatever this shows is the integrator's.</span>
    <span class="tok-kw">const</span> now: f32 = rbt.<span class="tok-fn">energy</span>(&amp;s.model, &amp;s.data);
    <span class="tok-kw">const</span> drift: f32 = <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(s.energy0) &gt; <span class="tok-num">1.0e-6</span>)
        (now - s.energy0) / <span class="tok-builtin">@abs</span>(s.energy0) * <span class="tok-num">100.0</span>
    <span class="tok-kw">else</span>
        <span class="tok-num">0.0</span>;

    <span class="tok-kw">var</span> buf: [<span class="tok-num">128</span>]u8 = undefined;
    <span class="tok-comment">// Only `.rk4` and `.euler` are reachable - the toggle below flips between those two. The</span>
    <span class="tok-comment">// other arms exist because this switch is EXHAUSTIVE ON PURPOSE: `.implicit` was added to</span>
    <span class="tok-comment">// `rbt.Integrator` and broke this line, which is the behaviour we want. An `else` here</span>
    <span class="tok-comment">// would have compiled and then shown the wrong name forever.</span>
    <span class="tok-kw">const</span> label: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">switch</span> (s.integrator) {
        .rk4 =&gt; <span class="tok-str">"RK4"</span>,
        .euler =&gt; <span class="tok-str">"semi-implicit Euler"</span>,
        .implicit =&gt; <span class="tok-str">"implicit"</span>,
        .implicitfast =&gt; <span class="tok-str">"implicit (fast)"</span>,
    };
    <span class="tok-kw">const</span> line: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf,
        <span class="tok-str">"{s}  |  t = {d:.1} s  |  energy drift {c}{d:.3} %"</span>,
        .{ label, s.elapsed, <span class="tok-builtin">@as</span>(u8, <span class="tok-kw">if</span> (drift &lt; <span class="tok-num">0</span>) <span class="tok-str">'-'</span> <span class="tok-kw">else</span> <span class="tok-str">'+'</span>), <span class="tok-builtin">@abs</span>(drift) },
    ) <span class="tok-kw">catch</span> <span class="tok-str">"readout unavailable"</span>;
    gl.<span class="tok-fn">text</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">16</span>, <span class="tok-num">24</span>), line, .{ .size = <span class="tok-num">18</span>, .color = text_color, .font = &amp;s.font });
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(<span class="tok-num">16</span>, <span class="tok-num">48</span>),
        <span class="tok-str">"two numbers describe this machine - tap to re-throw"</span>,
        .{ .size = <span class="tok-num">14</span>, .color = dim_color, .font = &amp;s.font },
    );

    <span class="tok-comment">// A hand-rolled toggle rather than the UI framework: this demo's job is to be the</span>
    <span class="tok-comment">// smallest thing that exercises the whole pipeline, and one hit-tested rectangle is</span>
    <span class="tok-comment">// less to read than a widget system.</span>
    <span class="tok-kw">const</span> toggle: z.Rectangle = .{ .x = <span class="tok-num">16</span>, .y = h - <span class="tok-num">62</span>, .width = <span class="tok-num">210</span>, .height = <span class="tok-num">44</span> };
    gl.<span class="tok-fn">rect</span>(toggle, .{ .color = panel_color });
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(toggle.x + <span class="tok-num">14</span>, toggle.y + <span class="tok-num">27</span>),
        <span class="tok-kw">if</span> (s.integrator == .rk4) <span class="tok-str">"integrator: RK4"</span> <span class="tok-kw">else</span> <span class="tok-str">"integrator: Euler"</span>,
        .{ .size = <span class="tok-num">16</span>, .color = text_color, .font = &amp;s.font },
    );

    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        <span class="tok-kw">const</span> p: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
        <span class="tok-kw">const</span> on_toggle: bool = p[<span class="tok-num">0</span>] &gt;= toggle.x <span class="tok-kw">and</span> p[<span class="tok-num">0</span>] &lt;= toggle.x + toggle.width <span class="tok-kw">and</span>
            p[<span class="tok-num">1</span>] &gt;= toggle.y <span class="tok-kw">and</span> p[<span class="tok-num">1</span>] &lt;= toggle.y + toggle.height;
        <span class="tok-kw">if</span> (on_toggle) {
            <span class="tok-comment">// Re-throw from the same pose so the two integrators are compared on identical</span>
            <span class="tok-comment">// initial conditions -- otherwise the energy readout means nothing.</span>
            s.integrator = <span class="tok-kw">if</span> (s.integrator == .rk4) .euler <span class="tok-kw">else</span> .rk4;
            s.<span class="tok-fn">throwFrom</span>(<span class="tok-num">2.2</span>, -<span class="tok-num">1.4</span>);
        } <span class="tok-kw">else</span> {
            <span class="tok-comment">// Tap elsewhere to re-throw from a pose that depends on where you tapped, so</span>
            <span class="tok-comment">// the chaos is something to play with rather than watch.</span>
            s.<span class="tok-fn">throwFrom</span>(pi * (p[<span class="tok-num">0</span>] / w) * <span class="tok-num">2.0</span> - pi, pi * (p[<span class="tok-num">1</span>] / h) * <span class="tok-num">2.0</span> - pi);
        }
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - robot: double pendulum"</span>,
            .width = <span class="tok-num">520</span>,
            .height = <span class="tok-num">900</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};

<span class="tok-kw">comptime</span> {
    <span class="tok-comment">// The whole point of the demo: this machine is TWO numbers.</span>
    <span class="tok-kw">if</span> (Pendulum.nv != <span class="tok-num">2</span>) {
        <span class="tok-builtin">@compileError</span>(<span class="tok-str">"robot_pendulum expects a 2-DOF model"</span>);
    }
    _ = assertUnreachable;
}
