<style>
:root{

}

.lesson{margin:2em 0;}

/* page furniture: the landing page and the tutorials' own scaffolding */
.blog-container,.wrap,.max{max-width:var(--maxw);margin:0 auto;}
.title{font-size:1.8rem;margin:0 0 .2em;}
.subtitle,.lede,.sub{

<h1>lambert_demo</h1>
<figure class="code src-file" data-path="examples/lambert_demo/lambert_demo.zig" data-lines="429"><figcaption><span>examples/lambert_demo/lambert_demo.zig</span><span>429 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/lambert_demo/lambert_demo.zig</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Canonical MULTI-GROUP wgpu example (section 4(b) of the architecture doc):</span>
<span class="tok-comment">// the Lambert-lit cube, binding VS uniforms (group 0), a sampler</span>
<span class="tok-comment">// (group 1), and an FS uniform (group 2) by hand.  The WebGPU</span>
<span class="tok-comment">// architecture - especially the stage-segregated binding model that</span>
<span class="tok-comment">// makes this layout necessary - is documented centrally in</span>
<span class="tok-comment">// src/zimr.zig.  Read that before changing this demo.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The first 3D-on-wgpu demo: a textured spinning cube, depth-tested,</span>
<span class="tok-comment">// drawn through the WebGPU backend (not GL).  This is section 4.A of</span>
<span class="tok-comment">// `src/notes/finishing_webgpu.md` - the linchpin that proves the</span>
<span class="tok-comment">// 3D draw path renders end-to-end before lambert/PBR/the helmet.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What's new vs the 2D wgpu_bringup:</span>
<span class="tok-comment">//   - a DEPTH texture (depth24plus) created + threaded into the</span>
<span class="tok-comment">//     render pass (2D never needed depth);</span>
<span class="tok-comment">//   - a 3D vertex-buffer layout (interleaved position+uv) passed via</span>
<span class="tok-comment">//     ShaderDesc.vertex_buffer_layouts (the override added this arc);</span>
<span class="tok-comment">//   - an MVP matrix pushed to the VS UBO each frame</span>
<span class="tok-comment">//     (perspective x view x model-rotation).</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Reuses the cube_split VS+FS shader pair (already typed +</span>
<span class="tok-comment">// naga-valid): cube_split_vs_io declares `Ubo.mvp`, cube_split_fs</span>
<span class="tok-comment">// samples texture0.  Same source the GL+CPU cube_split demo uses -</span>
<span class="tok-comment">// here it runs through spv2wgsl -&gt; WGSL -&gt; wgpu.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Build:    zig build wgpu-cube-demo</span>
<span class="tok-comment">// Serve:    bun run webtests/server.ts --web-dir=zig-out/wgpu-cube</span>
<span class="tok-comment">// Browse:   http://localhost:8000/index.html</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// CANNOT be verified in the sandbox (no GPU); Simon verifies the</span>
<span class="tok-comment">// spinning cube in the browser.  The build-side contract: compiles</span>
<span class="tok-comment">// clean, the embedded WGSL is naga-valid, lint 0.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> rotationX = zm.rotationX;
<span class="tok-kw">const</span> rotationY = zm.rotationY;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Cube geometry (reused from examples/cube_split.zig)</span>
<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// 24 vertices (4 per face) so each face gets clean UVs; 36 indices.</span>
<span class="tok-comment">// Interleaved position(vec3) + tex_coord(vec2) -&gt; ONE vertex buffer,</span>
<span class="tok-comment">// stride 20 bytes (3*4 + 2*4).  CCW winding from outside.</span>

<span class="tok-kw">const</span> LitVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    position: [<span class="tok-num">3</span>]f32,
    tex_coord: [<span class="tok-num">2</span>]f32,
    normal: [<span class="tok-num">3</span>]f32,
};

<span class="tok-kw">const</span> half_size: f32 = <span class="tok-num">0.7</span>;

<span class="tok-kw">const</span> cube_vertices = [_]LitVertex{
    <span class="tok-comment">// +Z face (front)</span>
    .{ .position = .{ -half_size, -half_size, half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> } },
    .{ .position = .{ half_size, -half_size, half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> } },
    .{ .position = .{ half_size, half_size, half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> } },
    .{ .position = .{ -half_size, half_size, half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> } },
    <span class="tok-comment">// -Z face (back)</span>
    .{ .position = .{ half_size, -half_size, -half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">1</span> } },
    .{ .position = .{ -half_size, -half_size, -half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">1</span> } },
    .{ .position = .{ -half_size, half_size, -half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">1</span> } },
    .{ .position = .{ half_size, half_size, -half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">1</span> } },
    <span class="tok-comment">// +X face (right)</span>
    .{ .position = .{ half_size, -half_size, half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ half_size, -half_size, -half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ half_size, half_size, -half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ half_size, half_size, half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    <span class="tok-comment">// -X face (left)</span>
    .{ .position = .{ -half_size, -half_size, -half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .normal = .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -half_size, -half_size, half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> }, .normal = .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -half_size, half_size, half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> }, .normal = .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -half_size, half_size, -half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .normal = .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    <span class="tok-comment">// +Y face (top)</span>
    .{ .position = .{ -half_size, half_size, half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ half_size, half_size, half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ half_size, half_size, -half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -half_size, half_size, -half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    <span class="tok-comment">// -Y face (bottom)</span>
    .{ .position = .{ -half_size, -half_size, -half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ half_size, -half_size, -half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ half_size, -half_size, half_size }, .tex_coord = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -half_size, -half_size, half_size }, .tex_coord = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .normal = .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span> } },
};

<span class="tok-kw">const</span> cube_indices = [_]u32{
    <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span>, <span class="tok-comment">// +Z</span>
    <span class="tok-num">4</span>, <span class="tok-num">5</span>, <span class="tok-num">6</span>, <span class="tok-num">4</span>, <span class="tok-num">6</span>, <span class="tok-num">7</span>, <span class="tok-comment">// -Z</span>
    <span class="tok-num">8</span>, <span class="tok-num">9</span>, <span class="tok-num">10</span>, <span class="tok-num">8</span>, <span class="tok-num">10</span>, <span class="tok-num">11</span>, <span class="tok-comment">// +X</span>
    <span class="tok-num">12</span>, <span class="tok-num">13</span>, <span class="tok-num">14</span>, <span class="tok-num">12</span>, <span class="tok-num">14</span>, <span class="tok-num">15</span>, <span class="tok-comment">// -X</span>
    <span class="tok-num">16</span>, <span class="tok-num">17</span>, <span class="tok-num">18</span>, <span class="tok-num">16</span>, <span class="tok-num">18</span>, <span class="tok-num">19</span>, <span class="tok-comment">// +Y</span>
    <span class="tok-num">20</span>, <span class="tok-num">21</span>, <span class="tok-num">22</span>, <span class="tok-num">20</span>, <span class="tok-num">22</span>, <span class="tok-num">23</span>, <span class="tok-comment">// -Y</span>
};

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Combined cube schema (Ubo + Samplers -&gt; two bind groups)</span>
<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// cube_split's VS UBO (mvp) lands at @group(0) and its FS texture0 at</span>
<span class="tok-comment">// @group(1) (the shader was built so the sampler sits in group 1 -</span>
<span class="tok-comment">// confirmed in its WGSL).  loadShader's single-schema path only wires</span>
<span class="tok-comment">// ONE bind group, so it can't drive this two-group layout.  Instead we</span>
<span class="tok-comment">// use `Resources(LambertSchema)` + an explicit pipeline, exactly like</span>
<span class="tok-comment">// Renderer2D: the schema declares BOTH `Ubo` and `Samplers`, Resources</span>
<span class="tok-comment">// builds a bind-group-layout per group (bg_layouts[0]=UBO,</span>
<span class="tok-comment">// bg_layouts[1]=sampler), and we chain both into the pipeline layout.</span>
<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Persistent state</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {

    <span class="tok-comment">// The engine emits each loose uniform as its own binding (a one-field</span>
    <span class="tok-comment">// uniform block per field), so lambert's VS uniforms are TWO bindings at</span>
    <span class="tok-comment">// group 0 - `mvp` @binding(0) + `mat_model` @binding(1) - not one buffer.</span>
    <span class="tok-comment">// (Confirmed in the emitted WGSL.)  `Resources` models one UBO</span>
    <span class="tok-comment">// buffer per group, so it can't drive this; we build the bind</span>
    <span class="tok-comment">// groups explicitly: two uniform buffers at group 0, texture+sampler</span>
    <span class="tok-comment">// at group 1.  col_diffuse (@group0 @binding... in the FS) is a</span>
    <span class="tok-comment">// third uniform - see init.</span>
    mvp_buffer: z.wgpu.BufferHandle,
    model_buffer: z.wgpu.BufferHandle,
    col_diffuse_buffer: z.wgpu.BufferHandle,
    group0_bind_group: z.wgpu.BindGroupHandle,
    group1_bind_group: z.wgpu.BindGroupHandle,
    group2_bind_group: z.wgpu.BindGroupHandle,

    pipeline: z.wgpu.RenderPipelineHandle,
    pipeline_layout: z.wgpu.PipelineLayoutHandle,
    vs_module: z.wgpu.ShaderModuleHandle,
    fs_module: z.wgpu.ShaderModuleHandle,
    lit_texture: z.WgpuTexture,

    vertex_buffer: z.wgpu.BufferHandle,
    index_buffer: z.wgpu.BufferHandle,
};

<span class="tok-kw">const</span> Mat4 = [<span class="tok-num">4</span>]<span class="tok-builtin">@Vector</span>(<span class="tok-num">4</span>, f32);
<span class="tok-kw">const</span> mat4_bytes: u64 = <span class="tok-builtin">@sizeOf</span>(Mat4); <span class="tok-comment">// 64</span>

<span class="tok-kw">const</span> lambert_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"lambert_vs.wgsl"</span>);
<span class="tok-kw">const</span> lambert_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"lambert_fs.wgsl"</span>);

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Init</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(
    gpa: Allocator,
    f: *z.Frame,
    s: *State,
) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> queue: z.wgpu.QueueHandle = f.gpu.queue;
    <span class="tok-kw">const</span> fmt: z.wgpu.TextureFormat = f.gpu.backbuffer_format;
    <span class="tok-comment">// The GpuFrame owns the depth texture and auto-resizes it to the surface</span>
    <span class="tok-comment">// each frame; just set the format (see GpuFrame.ensureDepth).</span>
    f.gpu.depth_format = .depth24_plus;

    <span class="tok-comment">// ---- Checkerboard texture (stand-in for a real albedo map) ----</span>
    <span class="tok-kw">const</span> lit_texture: z.WgpuTexture = <span class="tok-kw">try</span> z.WgpuTexture.<span class="tok-fn">createCheckerboard</span>(
        device,
        queue,
        gpa,
        .{ <span class="tok-num">0xff</span>, <span class="tok-num">0xff</span>, <span class="tok-num">0xff</span>, <span class="tok-num">0xff</span> },
        .{ <span class="tok-num">0x33</span>, <span class="tok-num">0x66</span>, <span class="tok-num">0xcc</span>, <span class="tok-num">0xff</span> },
        <span class="tok-num">64</span>,
        <span class="tok-num">8</span>,
    );

    <span class="tok-comment">// ---- Cube vertex + index buffers ----</span>
    <span class="tok-kw">const</span> vertex_buffer: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_vertices)),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"cube_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(queue, vertex_buffer, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;cube_vertices));

    <span class="tok-kw">const</span> index_buffer: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_indices)),
        .usage = .{ .index = true, .copy_dst = true },
        .label = <span class="tok-str">"cube_ibo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(queue, index_buffer, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;cube_indices));

    <span class="tok-comment">// ---- 3D vertex-buffer layout: ONE interleaved buffer ----</span>
    <span class="tok-comment">// slot 0, stride 20: position vec3 @0 (offset 0), tex_coord vec2 @1 (offset 12).</span>
    <span class="tok-kw">const</span> cube_layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(LitVertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
            .{ .format = .float32x2, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
            .{ .format = .float32x3, .offset = <span class="tok-num">20</span>, .shader_location = <span class="tok-num">2</span> },
        },
    };

    <span class="tok-comment">// ---- Explicit bind groups (NOT Resources - see note below) ----</span>
    <span class="tok-comment">// The engine now emits stage-segregated uniform groups (the</span>
    <span class="tok-comment">// toolchain fix for the cross-stage binding collision):</span>
    <span class="tok-comment">//   group 0 = VS uniforms: mvp@0, mat_model@1</span>
    <span class="tok-comment">//   group 1 = samplers:    texture0@0, sampler@1</span>
    <span class="tok-comment">//   group 2 = FS uniforms:  col_diffuse@0</span>
    <span class="tok-comment">// (Confirmed in the emitted, naga-valid WGSL.)  Resources models one</span>
    <span class="tok-comment">// UBO buffer per group at a single binding, so it can't express the</span>
    <span class="tok-comment">// multi-binding group 0 or the split across three groups - we build</span>
    <span class="tok-comment">// the bind groups by hand.</span>
    <span class="tok-kw">const</span> mvp_buffer: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = mat4_bytes,
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-kw">const</span> model_buffer: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = mat4_bytes,
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-kw">const</span> col_diffuse_buffer: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(Vec),
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-comment">// White diffuse tint (col_diffuse stays constant this demo).</span>
    <span class="tok-kw">const</span> white: Vec = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span> };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(queue, col_diffuse_buffer, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;white));

    <span class="tok-comment">// group 0 layout: VS uniforms - mvp@0, mat_model@1.</span>
    <span class="tok-kw">const</span> g0_layout_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{
            .binding = <span class="tok-num">0</span>,
            .visibility = .{ .vertex = true },
            .resource = .{ .uniform_buffer = .{ .min_size = mat4_bytes } },
        },
        .{
            .binding = <span class="tok-num">1</span>,
            .visibility = .{ .vertex = true },
            .resource = .{ .uniform_buffer = .{ .min_size = mat4_bytes } },
        },
    };
    <span class="tok-kw">const</span> g0_layout_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g0_layout_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g0_layout_blob);
    <span class="tok-kw">const</span> g0_bgl: z.wgpu.BindGroupLayoutHandle = z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g0_layout_blob, <span class="tok-str">"lambert_g0"</span>);

    <span class="tok-kw">const</span> g0_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = mvp_buffer, .size = mat4_bytes } } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .buffer = .{ .handle = model_buffer, .size = mat4_bytes } } },
    };
    <span class="tok-kw">const</span> g0_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;g0_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g0_blob);
    <span class="tok-kw">const</span> group0_bind_group: z.wgpu.BindGroupHandle = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, g0_bgl, g0_blob, <span class="tok-str">"lambert_g0_bg"</span>);

    <span class="tok-comment">// group 1 layout: texture0@0 + sampler@1.</span>
    <span class="tok-kw">const</span> g1_layout_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{ .binding = <span class="tok-num">0</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">1</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
    };
    <span class="tok-kw">const</span> g1_layout_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g1_layout_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_layout_blob);
    <span class="tok-kw">const</span> g1_bgl: z.wgpu.BindGroupLayoutHandle = z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g1_layout_blob, <span class="tok-str">"lambert_g1"</span>);

    <span class="tok-kw">const</span> g1_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .texture_view = lit_texture.view } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .sampler = lit_texture.sampler } },
    };
    <span class="tok-kw">const</span> g1_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;g1_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_blob);
    <span class="tok-kw">const</span> group1_bind_group: z.wgpu.BindGroupHandle = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, g1_bgl, g1_blob, <span class="tok-str">"lambert_g1_bg"</span>);

    <span class="tok-comment">// group 2 layout: FS uniform - col_diffuse@0.</span>
    <span class="tok-kw">const</span> g2_layout_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{
            .binding = <span class="tok-num">0</span>,
            .visibility = .{ .fragment = true },
            .resource = .{ .uniform_buffer = .{ .min_size = <span class="tok-num">16</span> } },
        },
    };
    <span class="tok-kw">const</span> g2_layout_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g2_layout_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g2_layout_blob);
    <span class="tok-kw">const</span> g2_bgl: z.wgpu.BindGroupLayoutHandle = z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g2_layout_blob, <span class="tok-str">"lambert_g2"</span>);

    <span class="tok-kw">const</span> g2_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = col_diffuse_buffer, .size = <span class="tok-num">16</span> } } },
    };
    <span class="tok-kw">const</span> g2_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;g2_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g2_blob);
    <span class="tok-kw">const</span> group2_bind_group: z.wgpu.BindGroupHandle = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, g2_bgl, g2_blob, <span class="tok-str">"lambert_g2_bg"</span>);

    <span class="tok-comment">// ---- Pipeline layout chains all three bind-group layouts ----</span>
    <span class="tok-kw">const</span> bgls: [<span class="tok-num">3</span>]z.wgpu.BindGroupLayoutHandle = .{ g0_bgl, g1_bgl, g2_bgl };
    <span class="tok-kw">const</span> pipeline_layout: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(device, bgls[<span class="tok-num">0</span>..], <span class="tok-str">"lambert_pl"</span>);

    <span class="tok-comment">// ---- Shader modules ----</span>
    <span class="tok-kw">const</span> vs_module: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, lambert_vs_wgsl, <span class="tok-str">"lambert_vs"</span>);
    <span class="tok-kw">const</span> fs_module: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, lambert_fs_wgsl, <span class="tok-str">"lambert_fs"</span>);

    <span class="tok-comment">// ---- Render pipeline: depth-tested, back-face culled, 3D layout ----</span>
    <span class="tok-kw">const</span> state_combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .alpha,
        .less, <span class="tok-comment">// depth test (LESS)</span>
        .back, <span class="tok-comment">// cull back faces (cube_split is CCW-from-outside)</span>
        fmt,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> pipe_desc = z.gpu.RenderPipelineDescriptor{
        .vertex_buffer_layouts = &amp;.{cube_layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = state_combo,
    };
    <span class="tok-kw">const</span> pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, pipe_desc);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pipe_blob);
    <span class="tok-kw">const</span> pipeline: z.wgpu.RenderPipelineHandle = z.wgpu.<span class="tok-fn">createRenderPipeline</span>(
        device,
        pipeline_layout,
        vs_module,
        fs_module,
        pipe_blob,
        <span class="tok-str">"lambert_pipe"</span>,
    );
    s.* = .{
        .mvp_buffer = mvp_buffer,
        .model_buffer = model_buffer,
        .col_diffuse_buffer = col_diffuse_buffer,
        .group0_bind_group = group0_bind_group,
        .group1_bind_group = group1_bind_group,
        .group2_bind_group = group2_bind_group,
        .pipeline = pipeline,
        .pipeline_layout = pipeline_layout,
        .vs_module = vs_module,
        .fs_module = fs_module,
        .lit_texture = lit_texture,
        .vertex_buffer = vertex_buffer,
        .index_buffer = index_buffer,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gf: *z.GpuFrame = f.gpu;
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;

    <span class="tok-comment">// ---- MVP: perspective x view x model(rotate over time) ----</span>
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> aspect: f32 = f.window.<span class="tok-fn">aspect</span>();

    <span class="tok-kw">const</span> model: Mat = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">rotationY</span>(t * <span class="tok-num">0.8</span>),
        <span class="tok-fn">rotationX</span>(t * <span class="tok-num">0.5</span>),
    );
    <span class="tok-kw">const</span> view: Mat = <span class="tok-fn">lookAtRh</span>(
        <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">3.0</span>), <span class="tok-comment">// eye, 3 units back</span>
        <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-comment">// target = origin</span>
        <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), <span class="tok-comment">// up</span>
    );
    <span class="tok-kw">const</span> proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(
        <span class="tok-num">0.9</span>, <span class="tok-comment">// fovy radians (~52 deg)</span>
        aspect,
        <span class="tok-num">0.1</span>, <span class="tok-comment">// near</span>
        <span class="tok-num">100.0</span>, <span class="tok-comment">// far</span>
    );
    <span class="tok-kw">const</span> mvp: Mat = <span class="tok-fn">mulMat</span>(proj, <span class="tok-fn">mulMat</span>(view, model));

    <span class="tok-comment">// Push mvp + mat_model to their separate uniform buffers (the engine</span>
    <span class="tok-comment">// emits one binding per uniform, so two buffers, not one struct).</span>
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(gf.queue, s.mvp_buffer, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;mvp));
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(gf.queue, s.model_buffer, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;model));

    <span class="tok-comment">// ---- Frame ----</span>
    <span class="tok-kw">const</span> fctx = Backend.<span class="tok-fn">beginFrame</span>(gf);
    <span class="tok-kw">var</span> ps = Backend.<span class="tok-fn">beginRenderPass</span>(fctx.encoder, .{
        .color_view = fctx.surface_view,
        .clear = .{ .r = <span class="tok-num">0.05</span>, .g = <span class="tok-num">0.06</span>, .b = <span class="tok-num">0.10</span>, .a = <span class="tok-num">1.0</span> },
        .depth_view = fctx.depth_view,
    });
    ps.queue = gf.queue;

    <span class="tok-comment">// Bind the lambert pipeline + all three bind groups (group 0 = VS</span>
    <span class="tok-comment">// uniforms, group 1 = texture+sampler, group 2 = FS uniform).</span>
    Backend.<span class="tok-fn">setPipeline</span>(&amp;ps, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(&amp;ps, <span class="tok-num">0</span>, s.group0_bind_group);
    Backend.<span class="tok-fn">setBindGroup</span>(&amp;ps, <span class="tok-num">1</span>, s.group1_bind_group);
    Backend.<span class="tok-fn">setBindGroup</span>(&amp;ps, <span class="tok-num">2</span>, s.group2_bind_group);

    <span class="tok-comment">// Bind cube geometry + draw all 36 indices.</span>
    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(ps.pass, .{
        .slot = <span class="tok-num">0</span>,
        .buffer = s.vertex_buffer,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_vertices)),
    });
    z.render_pass.<span class="tok-fn">setIndexBuffer</span>(ps.pass, .{
        .buffer = s.index_buffer,
        .format = .uint32,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_indices)),
    });
    z.render_pass.<span class="tok-fn">drawIndexed</span>(ps.pass, .{
        .index_count = cube_indices.len,
        .instance_count = <span class="tok-num">1</span>,
        .first_index = <span class="tok-num">0</span>,
        .base_vertex = <span class="tok-num">0</span>,
        .first_instance = <span class="tok-num">0</span>,
    });

    Backend.<span class="tok-fn">endRenderPass</span>(&amp;ps);
    Backend.<span class="tok-fn">endFrame</span>(gf);
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">main</span>() !void {
    <span class="tok-kw">try</span> zimr_app.<span class="tok-fn">run</span>(.{
        .window = .{ .title = <span class="tok-str">"zimr - WebGPU - Lambert-lit cube"</span>, .width = <span class="tok-num">800</span>, .height = <span class="tok-num">600</span> },
    }, State, initState, update);
}
