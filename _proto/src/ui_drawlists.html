<h1>ui_drawlists</h1>
<figure class="code src-file" data-path="examples/ui_drawlists/ui_drawlists.zig" data-lines="126"><figcaption><span>examples/ui_drawlists/ui_drawlists.zig</span><span>126 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! ui_drawlists - port of the GL `ui_drawlists` onto the WebGPU UI host.</span>
<span class="tok-comment">//! Background + foreground draw lists (imgui's GetBackground/GetForegroundDrawList):</span>
<span class="tok-comment">//! the background grid renders UNDER every window, the corner watermark renders</span>
<span class="tok-comment">//! ABOVE them. Drag the control window - the grid stays under it, the watermark</span>
<span class="tok-comment">//! over it.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Review note vs the GL original: it wrote raw packed hex (e.g. `0xFFEF4444`),</span>
<span class="tok-comment">//! but ColorU32 is 0xAABBGGRR (R in the low byte), so that literal is actually</span>
<span class="tok-comment">//! BLUE, not the red the name implied. Here colors are named `Color` literals</span>
<span class="tok-comment">//! packed through `colorToU32` - explicit RGBA, no byte-order trap, and the</span>
<span class="tok-comment">//! constant ones fold at comptime so there's no per-call cost.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> backdrop: Color = .{ .r = <span class="tok-num">15</span>, .g = <span class="tok-num">23</span>, .b = <span class="tok-num">42</span>, .a = <span class="tok-num">255</span> }; <span class="tok-comment">// slate-900</span>
<span class="tok-kw">const</span> grid_rgb: Color = .{ .r = <span class="tok-num">203</span>, .g = <span class="tok-num">213</span>, .b = <span class="tok-num">225</span>, .a = <span class="tok-num">255</span> }; <span class="tok-comment">// slate-300 (alpha set per frame)</span>
<span class="tok-kw">const</span> accent: Color = .{ .r = <span class="tok-num">239</span>, .g = <span class="tok-num">68</span>, .b = <span class="tok-num">68</span>, .a = <span class="tok-num">255</span> }; <span class="tok-comment">// red-500</span>
<span class="tok-kw">const</span> accent_dim: Color = .{ .r = <span class="tok-num">239</span>, .g = <span class="tok-num">68</span>, .b = <span class="tok-num">68</span>, .a = <span class="tok-num">153</span> };
<span class="tok-kw">const</span> accent_faint: Color = .{ .r = <span class="tok-num">239</span>, .g = <span class="tok-num">68</span>, .b = <span class="tok-num">68</span>, .a = <span class="tok-num">102</span> };
<span class="tok-kw">const</span> panel_bg: Color = .{ .r = <span class="tok-num">15</span>, .g = <span class="tok-num">23</span>, .b = <span class="tok-num">42</span>, .a = <span class="tok-num">204</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    grid_spacing: f32 = <span class="tok-num">24</span>,
    grid_alpha: f32 = <span class="tok-num">0.20</span>,
    show_watermark: bool = true,
    show_origin: bool = true,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, backdrop); <span class="tok-comment">// solid base under the background draw list</span>
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-comment">// BACKGROUND draw list: a CAD grid that lives under every window.</span>
    <span class="tok-kw">const</span> bg: ui.DrawListHandle = u.<span class="tok-fn">getBackgroundDrawList</span>();
    {
        <span class="tok-kw">var</span> line_rgb: Color = grid_rgb;
        line_rgb.a = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(s.grid_alpha * <span class="tok-num">255</span>, <span class="tok-num">0</span>, <span class="tok-num">255</span>));
        <span class="tok-kw">const</span> line: Color = line_rgb;
        <span class="tok-kw">var</span> x: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (x &lt; w) : (x += s.grid_spacing) {
            bg.<span class="tok-fn">addLine</span>(.{ x, <span class="tok-num">0</span> }, .{ x, h }, line, <span class="tok-num">1</span>);
        }
        <span class="tok-kw">var</span> y: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (y &lt; h) : (y += s.grid_spacing) {
            bg.<span class="tok-fn">addLine</span>(.{ <span class="tok-num">0</span>, y }, .{ w, y }, line, <span class="tok-num">1</span>);
        }
        <span class="tok-kw">if</span> (s.show_origin) {
            <span class="tok-comment">// A bullseye at the canvas origin so the grid feels anchored.</span>
            <span class="tok-kw">const</span> o: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
            bg.<span class="tok-fn">addCircleFilled</span>(o, <span class="tok-num">6</span>, accent);
            bg.<span class="tok-fn">addCircle</span>(o, <span class="tok-num">16</span>, accent_dim, <span class="tok-num">2</span>);
            bg.<span class="tok-fn">addCircle</span>(o, <span class="tok-num">32</span>, accent_faint, <span class="tok-num">1</span>);
        }
    }

    <span class="tok-comment">// Control window: submitted between the bg + fg passes, mutates both.</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"drawlist controls"</span>, .{
        .initial_pos = .{ <span class="tok-num">24</span>, <span class="tok-num">96</span> },
        .initial_size = .{ <span class="tok-num">320</span>, <span class="tok-num">240</span> },
    })) |win| {
        <span class="tok-kw">defer</span> win.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Background DL"</span>, .{});
