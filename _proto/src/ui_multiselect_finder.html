<figure class="code src-file" data-path="examples/ui_multiselect_finder/ui_multiselect_finder.zig" data-lines="326"><figcaption><span>examples/ui_multiselect_finder/ui_multiselect_finder.zig</span><span>326 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_multiselect_finder.zig demo for the imgui-parity arc.</span>
<span class="tok-comment">// Finder-style file list (50 items) demonstrating the MultiSelect</span>
<span class="tok-comment">// API.  Built in parallel with the API across turns 303-305:</span>
<span class="tok-comment">//   - Turn 303: types + SelectionBasicStorage land; demo used the</span>
<span class="tok-comment">//     "manual click-toggle" placeholder pattern.</span>
<span class="tok-comment">//   - Turn 304: real Begin/End + Selectable hooks.  Click emits</span>
<span class="tok-comment">//     SetAll-clear + SetRange(item..item, true); Ctrl-click emits</span>
<span class="tok-comment">//     SetRange(item..item, toggle); Shift-click emits SetAll-clear</span>
<span class="tok-comment">//     + SetRange(anchor..item, true).  Escape clears when</span>
<span class="tok-comment">//     `clear_on_escape` is set.  ClearOnClickVoid wired.</span>
<span class="tok-comment">//   - Turn 305 (current): phone-friendly tap-mode segmented</span>
<span class="tok-comment">//     control.  Phones have no Ctrl/Shift, so the demo synthesizes</span>
<span class="tok-comment">//     them by flipping the InputSnapshot's modifier bits before</span>
<span class="tok-comment">//     calling beginMultiSelect (and restoring right after Begin</span>
<span class="tok-comment">//     captures them onto the scope).  Three modes:</span>
<span class="tok-comment">//       - Replace: plain tap, default; tap one row replaces sel.</span>
<span class="tok-comment">//       - Toggle: tap-as-Ctrl-click; each tap adds/removes from sel.</span>
<span class="tok-comment">//       - Range: tap-as-Shift-click; first tap sets anchor, second</span>
<span class="tok-comment">//         tap extends range.</span>
<span class="tok-comment">// The data model is a static array of file entries: name + size + type</span>
<span class="tok-comment">// (file/folder).  No real filesystem - this is a UI demo.  Layout</span>
<span class="tok-comment">// matches macOS Finder column view: name on left, type icon, size</span>
<span class="tok-comment">// on right.</span>
<span class="tok-comment">// Why MultiSelect matters: the standard "click=replace, Ctrl=add,</span>
<span class="tok-comment">// Shift=range" idiom is what every file manager and IDE list does.</span>
<span class="tok-comment">// Implementing it manually means tracking the anchor item across</span>
<span class="tok-comment">// frames, handling clipper interactions, dealing with Escape +</span>
<span class="tok-comment">// Ctrl-A keyboard.  The imgui API absorbs this complexity into a</span>
<span class="tok-comment">// request-list protocol you apply against your storage.  See</span>
<span class="tok-comment">// `src/notes/multiselect-tutorial.md` for the full walkthrough.</span>

<span class="tok-comment">// ----- State</span>
<span class="tok-kw">const</span> TapMode = <span class="tok-kw">enum</span> { replace, toggle, range };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    <span class="tok-comment">/// Allocator owned by the user, threaded explicitly through</span>
    <span class="tok-comment">/// every storage call below.  Captured in `initState`.  By</span>
    <span class="tok-comment">/// keeping the gpa here (and not reaching into `ui_ctx.gpa` at</span>
    <span class="tok-comment">/// the call site), the user can swap in a no-alloc-after-init</span>
    <span class="tok-comment">/// allocator to PROVE the update path doesn't allocate.  See</span>
    <span class="tok-comment">/// claude.md "Allocator lives on user State" for the rationale.</span>
    gpa: Allocator,
    <span class="tok-comment">/// Multi-select state - the persistent backing storage.</span>
    selection: ui.SelectionBasicStorage = .{},
    <span class="tok-comment">/// Phone tap-mode affordance.  Phones have no Ctrl/Shift, so the</span>
    <span class="tok-comment">/// canonical multi-select modifiers aren't reachable via touch.</span>
    <span class="tok-comment">/// This 3-state toggle synthesizes them: in `.toggle` mode the</span>
    <span class="tok-comment">/// demo flips `key_ctrl_down` on the input snapshot before</span>
    <span class="tok-comment">/// calling beginMultiSelect (so taps emit Ctrl-click requests),</span>
    <span class="tok-comment">/// and in `.range` mode it flips `key_shift_down`.  Restored</span>
    <span class="tok-comment">/// immediately after Begin captures them onto the scope.</span>
    tap_mode: TapMode = .replace,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .font = font,
        .gpa = gpa,
    };

    <span class="tok-comment">// Phone readability - same recipe as ui_log_viewer.</span>
}

<span class="tok-comment">// ----- Helpers</span>
<span class="tok-kw">fn</span> <span class="tok-fn">kindGlyph</span>(k: FileKind) []<span class="tok-kw">const</span> u8 {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (k) {
        .folder =&gt; <span class="tok-str">"[d]"</span>,
        .document =&gt; <span class="tok-str">"[f]"</span>,
        .image =&gt; <span class="tok-str">"[i]"</span>,
        .archive =&gt; <span class="tok-str">"[z]"</span>,
        .code =&gt; <span class="tok-str">"[c]"</span>,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">formatSize</span>(buf: []u8, bytes: u64) []<span class="tok-kw">const</span> u8 {
    <span class="tok-kw">if</span> (bytes == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> <span class="tok-str">"-"</span>;
    }
    <span class="tok-kw">const</span> kb: f64 = <span class="tok-fn">float64</span>(bytes) / <span class="tok-num">1024.0</span>;
    <span class="tok-kw">if</span> (kb &lt; <span class="tok-num">1.0</span>) {
        <span class="tok-kw">return</span> <span class="tok-fn">bufPrint</span>(buf, <span class="tok-str">"{d} B"</span>, .{bytes}) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (kb &lt; <span class="tok-num">1024.0</span>) {
        <span class="tok-kw">return</span> <span class="tok-fn">bufPrint</span>(buf, <span class="tok-str">"{d:.1} KB"</span>, .{kb}) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (kb &lt; <span class="tok-num">1024.0</span> * <span class="tok-num">1024.0</span>) {
        <span class="tok-kw">const</span> mb: f64 = kb / <span class="tok-num">1024.0</span>;
        <span class="tok-kw">return</span> <span class="tok-fn">bufPrint</span>(buf, <span class="tok-str">"{d:.1} MB"</span>, .{mb}) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">const</span> gb: f64 = kb / (<span class="tok-num">1024.0</span> * <span class="tok-num">1024.0</span>);
        <span class="tok-kw">return</span> <span class="tok-fn">bufPrint</span>(buf, <span class="tok-str">"{d:.1} GB"</span>, .{gb}) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
    }
}

<span class="tok-comment">// ----- Frame</span>
<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Files"</span>, .{
        .initial_pos = .{ <span class="tok-num">8</span>, <span class="tok-num">8</span> },
        .initial_size = .{ <span class="tok-num">380</span>, <span class="tok-num">840</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"multi-select finder demo"</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(
            <span class="tok-str">"Desktop: tap/Ctrl-tap/Shift-tap/Esc.  Phone: tap-mode buttons below."</span>,
            .{},
        );

        <span class="tok-comment">// ---- Selection HUD ------------------------------------</span>
        u.<span class="tok-fn">separatorText</span>(<span class="tok-str">"Selection"</span>);
        <span class="tok-kw">var</span> hud_buf: [<span class="tok-num">64</span>]u8 = undefined;
        <span class="tok-kw">const</span> hud_text: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
            &amp;hud_buf,
            <span class="tok-str">"selected: {d} / {d}"</span>,
            .{ s.selection.<span class="tok-fn">size</span>(), files.len },
        ) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{hud_text});

        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Clear All"</span>, .{})) {
            s.selection.<span class="tok-fn">clear</span>();
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Select All"</span>, .{})) {
            <span class="tok-comment">// Build a SetAll(true) request and apply - exercises the</span>
            <span class="tok-comment">// applyRequests path even before Begin/End emit anything.</span>
            <span class="tok-kw">const</span> reqs: [<span class="tok-num">1</span>]ui.SelectionRequest = .{.{ .set_all = true }};
            <span class="tok-kw">const</span> io: ui.MultiSelectIO = .{
                .requests = &amp;reqs,
                .range_src_item = null,
                .nav_id_item = null,
                .nav_id_selected = false,
                .items_count = <span class="tok-builtin">@intCast</span>(files.len),
            };
            s.selection.<span class="tok-fn">applyRequests</span>(s.gpa, &amp;io) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
        }

        <span class="tok-comment">// ---- Tap mode (phone affordance)</span>
        <span class="tok-comment">// Three-button segmented control sets `s.tap_mode`.  Below,</span>
        <span class="tok-comment">// around `beginMultiSelect`, we temporarily flip the input</span>
        <span class="tok-comment">// snapshot's modifier flags so the MS scope captures the</span>
        <span class="tok-comment">// synthesized modifier on its key_ctrl / key_shift fields.</span>
        <span class="tok-comment">// Restoration happens right after Begin returns, so</span>
        <span class="tok-comment">// downstream widgets in this frame see the real modifier</span>
        <span class="tok-comment">// state.</span>
        u.<span class="tok-fn">separatorText</span>(<span class="tok-str">"Tap mode"</span>);
        <span class="tok-kw">const</span> replace_label: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.tap_mode == .replace) <span class="tok-str">"[*] Replace"</span> <span class="tok-kw">else</span> <span class="tok-str">"[ ] Replace"</span>;
        <span class="tok-kw">const</span> toggle_label: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.tap_mode == .toggle) <span class="tok-str">"[*] Toggle"</span> <span class="tok-kw">else</span> <span class="tok-str">"[ ] Toggle"</span>;
        <span class="tok-kw">const</span> range_label: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.tap_mode == .range) <span class="tok-str">"[*] Range"</span> <span class="tok-kw">else</span> <span class="tok-str">"[ ] Range"</span>;
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(replace_label, .{})) {
            s.tap_mode = .replace;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(toggle_label, .{})) {
            s.tap_mode = .toggle;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(range_label, .{})) {
            s.tap_mode = .range;
        }

        <span class="tok-comment">// ---- File list ----------------------------------------</span>
        u.<span class="tok-fn">separatorText</span>(<span class="tok-str">"Files"</span>);

        <span class="tok-comment">// -------- MultiSelect scope</span>
        <span class="tok-comment">// Wraps the row loop so click/Ctrl-click/Shift-click emit</span>
        <span class="tok-comment">// proper SelectionRequest values.  Storage is updated by</span>
        <span class="tok-comment">// two `applyRequests` calls - one after Begin (drains any</span>
        <span class="tok-comment">// keyboard-shortcut-derived pending requests), one after</span>
        <span class="tok-comment">// End (drains this-frame's click-emitted requests).</span>
        <span class="tok-comment">// The Selectable's return value is now intentionally</span>
        <span class="tok-comment">// discarded - the storage state is owned by the scope's</span>
        <span class="tok-comment">// applyRequests path, not by inline mutation.</span>
        <span class="tok-comment">// Phone modifier synth: flip the left_ctrl / left_shift</span>
        <span class="tok-comment">// key down-state on the input snapshot just before Begin so</span>
        <span class="tok-comment">// the scope captures the synthesized modifier; restore</span>
        <span class="tok-comment">// immediately after Begin.  The scope retains its captured</span>
        <span class="tok-comment">// copy, so downstream widgets in this frame see the real</span>
        <span class="tok-comment">// modifier state.</span>
        <span class="tok-kw">const</span> ctrl_idx: usize = <span class="tok-builtin">@backingInt</span>(ui.KeyCode.left_control);
        <span class="tok-kw">const</span> shift_idx: usize = <span class="tok-builtin">@backingInt</span>(ui.KeyCode.left_shift);
        <span class="tok-kw">const</span> saved_ctrl: bool = u.ctx.input.keys[ctrl_idx].down;
        <span class="tok-kw">const</span> saved_shift: bool = u.ctx.input.keys[shift_idx].down;
        u.ctx.input.keys[ctrl_idx].down = saved_ctrl <span class="tok-kw">or</span> (s.tap_mode == .toggle);
        u.ctx.input.keys[shift_idx].down = saved_shift <span class="tok-kw">or</span> (s.tap_mode == .range);

        <span class="tok-kw">const</span> ms_io: *<span class="tok-kw">const</span> ui.MultiSelectIO = u.<span class="tok-fn">beginMultiSelect</span>(.{
            .clear_on_escape = true,
            .no_auto_clear_on_reselect = true, <span class="tok-comment">// Mac Finder feel on phone</span>
            .clear_on_click_void = true,
        }, <span class="tok-builtin">@intCast</span>(s.selection.<span class="tok-fn">size</span>()), <span class="tok-builtin">@intCast</span>(files.len));

        u.ctx.input.keys[ctrl_idx].down = saved_ctrl;
        u.ctx.input.keys[shift_idx].down = saved_shift;

        s.selection.<span class="tok-fn">applyRequests</span>(s.gpa, ms_io) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});

        <span class="tok-kw">for</span> (files, <span class="tok-num">0</span>..) |item, idx| {
            <span class="tok-comment">// Build the row label: "[k] name             size".  We</span>
            <span class="tok-comment">// pad the name area to a fixed width so the size column</span>
            <span class="tok-comment">// aligns.will replace this with a proper</span>
            <span class="tok-comment">// 3-column layout via separators.</span>
            <span class="tok-kw">var</span> row_buf: [<span class="tok-num">128</span>]u8 = undefined;
            <span class="tok-kw">var</span> size_buf: [<span class="tok-num">16</span>]u8 = undefined;
            <span class="tok-kw">const</span> size_str: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">formatSize</span>(&amp;size_buf, item.size_bytes);
            <span class="tok-kw">const</span> row: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
                &amp;row_buf,
                <span class="tok-str">"{s} {s:&lt;28} {s:&gt;10}"</span>,
                .{ <span class="tok-fn">kindGlyph</span>(item.kind), item.name, size_str },
            ) <span class="tok-kw">catch</span> item.name;

            <span class="tok-kw">const</span> id: u64 = <span class="tok-builtin">@intCast</span>(idx);
            u.<span class="tok-fn">setNextItemSelectionUserData</span>(id);
            <span class="tok-comment">// Discard return value - selection is mutated by the</span>
            <span class="tok-comment">// scope's applyRequests after endMultiSelect below,</span>
            <span class="tok-comment">// not by inline toggle.  Matches the canonical</span>
            <span class="tok-comment">// multi-select demo idiom in imgui_demo.cpp:2745+.</span>
            _ = u.<span class="tok-fn">selectable</span>(row, s.selection.<span class="tok-fn">contains</span>(id), .{});
        }

        <span class="tok-kw">const</span> ms_io2: *<span class="tok-kw">const</span> ui.MultiSelectIO = u.<span class="tok-fn">endMultiSelect</span>();
        s.selection.<span class="tok-fn">applyRequests</span>(s.gpa, ms_io2) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});

        u.<span class="tok-fn">separatorText</span>(<span class="tok-str">"Status"</span>);
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Buttons exercise applyRequests directly."</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Rows go through the MS scope (tap mode applies)."</span>, .{});
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - multi-select finder"</span>,
            .width = <span class="tok-num">400</span>,
            .height = <span class="tok-num">880</span>,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
};
