<h1>pipeline_settings</h1>
<figure class="code src-file" data-path="examples/pipeline_settings/pipeline_settings.zig" data-lines="151"><figcaption><span>examples/pipeline_settings/pipeline_settings.zig</span><span>151 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! pipeline_settings - pipeline STATE: the same translucent geometry drawn</span>
<span class="tok-comment">//! twice, left with `.blend = .alpha`, right with `.blend = .additive`, so the</span>
<span class="tok-comment">//! difference is unmistakable (alpha occludes back-to-front; additive sums to</span>
<span class="tok-comment">//! white where the three triangles overlap).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! No hand-written WGSL. The shaders are authored in Zig: a bespoke VS</span>
<span class="tok-comment">//! (`pipeline_settings_vs.zig`) plus the SHARED pass-through fragment shader</span>
<span class="tok-comment">//! (`pipeline_uniforms_fs.zig`) - a reminder that "emit the interpolated colour"</span>
<span class="tok-comment">//! is one shader, reused. The two pipelines come from two `loadShaderVF` calls</span>
<span class="tok-comment">//! that differ ONLY by `.blend_state`; everything else (schema, layout, UBO) is</span>
<span class="tok-comment">//! identical. The per-pipeline x-offset rides in the UBO (`p.z`) rather than a</span>
<span class="tok-comment">//! pipeline-override constant - overrides are pipeline_constants' story.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Build:  zig build wgpu-pipeline-settings</span>
<span class="tok-comment">//! Device: zig build wgpu-pipeline-settings-standalone -Dmode=release</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// Bespoke VS + the shared pass-through FS, build-generated from Zig.</span>
<span class="tok-kw">const</span> vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pipeline_settings_vs.wgsl"</span>);
<span class="tok-kw">const</span> fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pipeline_uniforms_fs.wgsl"</span>);
<span class="tok-kw">const</span> vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_settings_vs_io.zig"</span>);
<span class="tok-kw">const</span> fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_fs_io.zig"</span>);

<span class="tok-kw">const</span> Vertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    x: f32,
    y: f32,
    r: f32,
    g: f32,
    b: f32,
    a: f32,
};

<span class="tok-comment">/// One translucent triangle centred at (cx,cy).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">tri</span>(cx: f32, cy: f32, r: f32, g: f32, b: f32) [<span class="tok-num">3</span>]Vertex {
    <span class="tok-kw">const</span> h: f32 = <span class="tok-num">0.42</span>;
    <span class="tok-kw">const</span> al: f32 = <span class="tok-num">0.6</span>;
    <span class="tok-kw">return</span> .{
        .{ .x = cx, .y = cy + h, .r = r, .g = g, .b = b, .a = al },
        .{ .x = cx - <span class="tok-num">0.36</span>, .y = cy - <span class="tok-num">0.3</span>, .r = r, .g = g, .b = b, .a = al },
        .{ .x = cx + <span class="tok-num">0.36</span>, .y = cy - <span class="tok-num">0.3</span>, .r = r, .g = g, .b = b, .a = al },
    };
}

<span class="tok-comment">/// Three overlapping triangles (R/G/B) forming a rosette.</span>
<span class="tok-kw">const</span> cluster = <span class="tok-fn">tri</span>(<span class="tok-num">0.0</span>, <span class="tok-num">0.12</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.2</span>, <span class="tok-num">0.2</span>) ++
    <span class="tok-fn">tri</span>(-<span class="tok-num">0.12</span>, -<span class="tok-num">0.08</span>, <span class="tok-num">0.2</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.3</span>) ++
    <span class="tok-fn">tri</span>(<span class="tok-num">0.12</span>, -<span class="tok-num">0.08</span>, <span class="tok-num">0.3</span>, <span class="tok-num">0.4</span>, <span class="tok-num">1.0</span>);

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    vbo: z.wgpu.BufferHandle,
    alpha_shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io),
    add_shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io),
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.alpha_shader.<span class="tok-fn">deinit</span>();
    s.add_shader.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
}

<span class="tok-comment">/// Build a pipeline for one blend mode. Identical except for `.blend_state`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">blendShader</span>(
    gpa: Allocator,
    f: *z.Frame,
    blend: z.wgpu.BlendMode,
    label: []<span class="tok-kw">const</span> u8,
) !z.shader.<span class="tok-fn">LoadedShader</span>(vs_io) {
    <span class="tok-kw">return</span> z.shader.<span class="tok-fn">loadShaderVF</span>(vs_io, fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = vs_wgsl,
        .fs_wgsl_source = fs_wgsl,
        .vertex_buffer_layouts = &amp;.{z.shader.<span class="tok-fn">vertexLayout</span>(vs_io)},
        .blend_state = blend,
        .label = label,
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cluster)),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"blend_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;cluster));

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>),
        .vbo = vbo,
        .alpha_shader = <span class="tok-kw">try</span> <span class="tok-fn">blendShader</span>(gpa, f, .alpha, <span class="tok-str">"blend_alpha"</span>),
        .add_shader = <span class="tok-kw">try</span> <span class="tok-fn">blendShader</span>(gpa, f, .additive, <span class="tok-str">"blend_additive"</span>),
    };
}

<span class="tok-comment">/// Aspect-correct scale packed with an x-offset: p = (sx, sy, ox, 0).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">scaleOffset</span>(f: *z.Frame, ox: f32) Vec {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> aspect: f32 = w / <span class="tok-builtin">@max</span>(h, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> size: f32 = <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> sx: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) size <span class="tok-kw">else</span> size / aspect;
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) size * aspect <span class="tok-kw">else</span> size;
    <span class="tok-kw">return</span> .{ sx, sy, ox, <span class="tok-num">0.0</span> };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    <span class="tok-kw">const</span> verts: u32 = cluster.len;
    <span class="tok-kw">const</span> vbo_bytes: u64 = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cluster));

    <span class="tok-comment">// Left half: alpha blend (offset -0.5).</span>
    s.alpha_shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .p = <span class="tok-fn">scaleOffset</span>(f, -<span class="tok-num">0.5</span>) });
    s.alpha_shader.<span class="tok-fn">bindForDraw</span>(ps);
    s.alpha_shader.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, vbo_bytes);
    s.alpha_shader.<span class="tok-fn">draw</span>(ps, verts, <span class="tok-num">1</span>);

    <span class="tok-comment">// Right half: additive blend (offset +0.5).</span>
    s.add_shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .p = <span class="tok-fn">scaleOffset</span>(f, <span class="tok-num">0.5</span>) });
    s.add_shader.<span class="tok-fn">bindForDraw</span>(ps);
    s.add_shader.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, vbo_bytes);
    s.add_shader.<span class="tok-fn">draw</span>(ps, verts, <span class="tok-num">1</span>);

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"pipeline_settings: blend modes - left alpha, right additive (same geometry)"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - pipeline settings"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.02</span>, .g = <span class="tok-num">0.02</span>, .b = <span class="tok-num">0.03</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
</code></pre></figure>
<figure class="code src-file" data-path="examples/pipeline_settings_vs.zig" data-lines="30"><figcaption><span>examples/pipeline_settings_vs.zig</span><span>30 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/pipeline_settings_vs.zig - pipeline_settings vertex shader body.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Applies the UBO's per-axis scale and x-offset, then passes the RGBA colour</span>
<span class="tok-comment">//! through (its alpha drives whichever blend mode the pipeline was built with).</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_settings_vs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_settings_vs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_io.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-kw">const</span> pos: Vec2 = io_in.vertex_position;
    <span class="tok-kw">const</span> u: Vec = io_in.u.p;
    <span class="tok-comment">// pos.x * scale_x + offset, pos.y * scale_y, on the z = 0 plane.</span>
    out.position = .{ pos[<span class="tok-num">0</span>] * u[<span class="tok-num">0</span>] + u[<span class="tok-num">2</span>], pos[<span class="tok-num">1</span>] * u[<span class="tok-num">1</span>], <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span> };
    out.frag_color = io_in.vertex_color;

    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_io;
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}

<span class="tok-comment">//! scale and an x-offset into one vec4, letting the two blend pipelines place</span>
<span class="tok-comment">//! their cluster on opposite halves of the screen from the same geometry.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;

<span class="tok-comment">/// Vertex attributes: 2D position + an RGBA colour whose alpha drives the blend.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Attributes = <span class="tok-kw">struct</span> {

};

<span class="tok-comment">/// Vertex-stage uniform (group 0): `p.xy` = (scale_x, scale_y), `p.z` = x-offset</span>
<span class="tok-comment">/// (the host pushes a different offset to each blend pipeline), `p.w` unused.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Ubo = <span class="tok-kw">struct</span> {
    p: Vec,
};

<span class="tok-comment">/// Varying to the fragment stage - the RGBA colour (matches the shared</span>
<span class="tok-comment">/// pass-through FS `Inputs.frag_color`).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Outputs = <span class="tok-kw">struct</span> {
    frag_color: Vec,
};
</code></pre></figure>
