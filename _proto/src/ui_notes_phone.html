<h1>ui_notes_phone</h1>
<figure class="code src-file" data-path="examples/ui_notes_phone/ui_notes_phone.zig" data-lines="183"><figcaption><span>examples/ui_notes_phone/ui_notes_phone.zig</span><span>183 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_notes_phone.zig - Q8 auto-save scratchpad.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The phone-focused demo for turn 442b.  Wires together three</span>
<span class="tok-comment">// pieces that landed across turns 423, 441b, and 442:</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   1. The `inputTextMultiline` widget with the DOM `&lt;textarea&gt;`</span>
<span class="tok-comment">//      overlay (turn 441b - so the soft keyboard actually pops on</span>
<span class="tok-comment">//      mobile and the user can write more than a few words).</span>
<span class="tok-comment">//   2. The `edit` callback on InputTextOpts (turn 442 - the only</span>
<span class="tok-comment">//      callback that fires reliably on web; great for "saved!"</span>
<span class="tok-comment">//      indicators).</span>
<span class="tok-comment">//   3. Q8 persistent state via `getOrPutState(T, id, .{.persist =</span>
<span class="tok-comment">//      true})` (turn 423 - typed comptime-generated serialize/</span>
<span class="tok-comment">//      deserialize for plain-data structs).</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The interaction: open the page on a phone (or any browser),</span>
<span class="tok-comment">// type some notes into the field.  Each keystroke bumps a "Saved</span>
<span class="tok-comment">// at frame N" counter via the edit callback.  Close the tab.</span>
<span class="tok-comment">// Reopen the page.  Your notes are still there.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What makes this a useful demo (vs the input-flags zoo):</span>
<span class="tok-comment">//   - The zoo proves every flag works in isolation.</span>
<span class="tok-comment">//   - This example proves the *combination* of (textarea overlay</span>
<span class="tok-comment">//     + edit callback + Q8 persistence) composes into something a</span>
<span class="tok-comment">//     user would actually use.  Composition is where bugs hide.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Build standalone:</span>
<span class="tok-comment">//   zig build install -Dfocus=ui_notes_phone</span>
<span class="tok-comment">//   python3 scripts/build_standalone.py ui_notes_phone</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-comment">/// State that LIVES IN Q8.  Q8's serializer walks this struct at</span>
<span class="tok-comment">/// app exit (writes to localStorage on web, to a file on host)</span>
<span class="tok-comment">/// and reconstitutes it on next startup.  Has to be plain-data</span>
<span class="tok-comment">/// (no pointers, no slices - just fixed-size primitives + arrays).</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `buf` is 512 bytes which is enough for a few paragraphs of</span>
<span class="tok-comment">/// notes; bigger if the demo grows.  `len` is usize because that's</span>
<span class="tok-comment">/// what `inputTextMultiline` expects - Q8 handles platform-dependent</span>
<span class="tok-comment">/// widths (wasm32: 4 bytes; host: 8 bytes) via the same compile-</span>
<span class="tok-comment">/// time codepath that generated the (de)serializer.</span>
<span class="tok-kw">const</span> NotesData = <span class="tok-kw">struct</span> {
    buf: [<span class="tok-num">512</span>]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    len: usize = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Frame number at which the most recent edit happened.  Used</span>
    <span class="tok-comment">/// to show "saved Xs ago" in the UI.  u32 wraps every ~2</span>
    <span class="tok-comment">/// years at 60fps, fine for a scratchpad.</span>
    last_edit_frame: u32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Monotonic count of how many edit-events fired.  Visible in</span>
    <span class="tok-comment">/// the readout so the user can see the callback is actually</span>
    <span class="tok-comment">/// firing on every keystroke.</span>
    edit_count: u32 = <span class="tok-num">0</span>,
};

<span class="tok-comment">/// Stable Id for the persistent notes state.  Any arbitrary u32</span>
<span class="tok-comment">/// works; just needs to be the same across app launches.  Picked</span>
<span class="tok-comment">/// the bytes of "NOTE" mapped through "0x" so it's obvious in a</span>
<span class="tok-comment">/// Q8 dump.</span>
<span class="tok-kw">const</span> notes_state_id: ui.Id = <span class="tok-num">0x4E4F_5445</span>;

<span class="tok-comment">/// Sidecar passed as `user_data` to the edit callback.  Holds a</span>
<span class="tok-comment">/// pointer to the Q8-resident NotesData PLUS the current frame</span>
<span class="tok-comment">/// number (which Q8 can't know - it changes every frame).  The</span>
<span class="tok-comment">/// callback uses both: writes to NotesData via the pointer,</span>
<span class="tok-comment">/// reads the current frame via the value.</span>
<span class="tok-kw">const</span> EditCbCtx = <span class="tok-kw">struct</span> {
    notes: *NotesData,
    frame: u32,
};

<span class="tok-kw">fn</span> <span class="tok-fn">notesEditCb</span>(d: *ui.InputTextCallbackData) void {
    <span class="tok-kw">const</span> cb: *EditCbCtx = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(d.user_data.?));
    cb.notes.last_edit_frame = cb.frame;
    cb.notes.edit_count +%= <span class="tok-num">1</span>;
}

<span class="tok-comment">/// Non-persistent app state.  UI context, font cache, shapes</span>
<span class="tok-comment">/// texture - none of this needs to survive across launches.  The</span>
<span class="tok-comment">/// PERSISTENT bits live in NotesData (above), reached via Q8.</span>
<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    frame: u32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    s.frame +%= <span class="tok-num">1</span>;

    <span class="tok-kw">const</span> fw: f32 = <span class="tok-fn">float</span>(f.window.screen_width);
    <span class="tok-kw">const</span> fh: f32 = <span class="tok-fn">float</span>(f.window.screen_height);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw, fh }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"notes"</span>, .{
        .flags = .{
            .no_title_bar = true,
            .no_resize = true,
            .no_move = true,
            .no_collapse = true,

    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xFFFFFFFF</span>), <span class="tok-str">"notes scratchpad"</span>, .{});
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"type into the field.  every keystroke auto-saves."</span>, .{});

        u.<span class="tok-fn">spacing</span>();

        <span class="tok-comment">// Resolve the Q8-persisted notes state.  First call after a</span>
        <span class="tok-comment">// fresh page load returns `found_existing = false`; if there</span>
        <span class="tok-comment">// was a prior session, Q8 has already deserialized the value</span>
        <span class="tok-comment">// back into the slot, so `found_existing` will be true and</span>
        <span class="tok-comment">// `value_ptr.*` holds the previous contents.</span>
        <span class="tok-kw">const</span> r = u.<span class="tok-fn">getOrPutState</span>(NotesData, notes_state_id, .{ .persist = true });
        <span class="tok-kw">if</span> (!r.found_existing) {

        <span class="tok-comment">// Sidecar lives in stack frame for THIS update call.  Safe</span>
        <span class="tok-comment">// because the callback only fires SYNCHRONOUSLY inside the</span>
        <span class="tok-comment">// upcoming inputTextMultiline call - `&amp;cb_ctx` doesn't</span>
        <span class="tok-comment">// escape.</span>
        <span class="tok-kw">var</span> cb_ctx = EditCbCtx{ .notes = notes, .frame = s.frame };
        _ = u.<span class="tok-fn">inputTextMultiline</span>(<span class="tok-str">"notes-field"</span>, &amp;notes.buf, &amp;notes.len, .{ <span class="tok-num">380</span>, <span class="tok-num">240</span> }, .{
            .edit = notesEditCb,
            .user_data = &amp;cb_ctx,

        u.<span class="tok-fn">spacing</span>();

        <span class="tok-comment">// keystroke; `last_edit_frame` captures when.  "frames ago"</span>
        <span class="tok-comment">// gives a sense of recency without needing to fetch wall-</span>
        <span class="tok-comment">// clock time.</span>
        <span class="tok-kw">const</span> frames_ago: u32 = s.frame -% notes.last_edit_frame;
        <span class="tok-kw">if</span> (notes.edit_count == <span class="tok-num">0</span>) {

                frames_ago, notes.edit_count,

        u.<span class="tok-fn">separator</span>();

        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"On web that's localStorage; on host a file."</span>, .{});
