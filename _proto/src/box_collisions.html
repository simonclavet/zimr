<figure class="code src-file" data-path="examples/box_collisions/box_collisions.zig" data-lines="602"><figcaption><span>examples/box_collisions/box_collisions.zig</span><span>602 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! box_collisions - raylib's `models_box_collisions`, the zimr way.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A green player box slides around an arena holding a gray enemy cube</span>
<span class="tok-comment">//! and a gray enemy sphere.  Every frame the player's AABB is tested</span>
<span class="tok-comment">//! against both (`checkCollisionBoxes`, `checkCollisionBoxSphere` -</span>
<span class="tok-comment">//! raylib's exact predicates, re-exported this port); on any overlap</span>
<span class="tok-comment">//! the player flashes RED and the panel says which enemy it's touching.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Phone-first: raylib steers with arrow keys.  Here you DRAG - one</span>
<span class="tok-comment">//! finger anywhere slides the player to the ground point under it,</span>
<span class="tok-comment">//! computed by casting `getScreenToWorldRay` (last port's engine</span>
<span class="tok-comment">//! addition) against the ground plane.  The camera is fixed like</span>
<span class="tok-comment">//! raylib's, so dragging never fights an orbit; pinch still zooms.</span>
<span class="tok-comment">//! Rendering is the shared forward stack (`gbuffer_vs` + `fog_fs` at</span>
<span class="tok-comment">//! density 0), one pipeline for the four draws.</span>

<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-kw">const</span> mat_vs = z.deferred_shaders.gbuffer_vs;
<span class="tok-kw">const</span> mat_fs = z.fog_shader; <span class="tok-comment">// density 0 = plain lambert+blinn</span>

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> gbuffer_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"gbuffer_vs.wgsl"</span>);

<span class="tok-kw">const</span> VsUbo = <span class="tok-builtin">@FieldType</span>(mat_vs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> FsUbo = <span class="tok-builtin">@FieldType</span>(mat_fs.Io, <span class="tok-str">"u"</span>);

<span class="tok-kw">const</span> bg_clear: Color = .{ .r = <span class="tok-num">24</span>, .g = <span class="tok-num">26</span>, .b = <span class="tok-num">32</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> sun_dir: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0.4</span>, <span class="tok-num">0.85</span>, <span class="tok-num">0.5</span> };
<span class="tok-kw">const</span> fovy_rad: f32 = <span class="tok-num">1.0</span>;

<span class="tok-kw">const</span> player_size: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">1.0</span>, <span class="tok-num">2.0</span>, <span class="tok-num">1.0</span> };
<span class="tok-kw">const</span> enemy_box_pos: [<span class="tok-num">3</span>]f32 = .{ -<span class="tok-num">4.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.0</span> };
<span class="tok-kw">const</span> enemy_box_size: f32 = <span class="tok-num">2.0</span>;

<span class="tok-kw">const</span> ground_verts = [_]MeshVertex{
    .{ .position = .{ -arena_half, <span class="tok-num">0</span>, -arena_half }, .normal = up_n },

<span class="tok-comment">/// Unit cube (half-extent 1), flat face normals.</span>
<span class="tok-kw">const</span> cube_verts = [_]MeshVertex{
    .{ .position = .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span>, <span class="tok-num">1</span> }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> } },

<span class="tok-kw">const</span> GpuMesh = <span class="tok-kw">struct</span> {

<span class="tok-kw">fn</span> <span class="tok-fn">uploadMesh</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    queue: z.wgpu.QueueHandle,
    mesh: z.Mesh,
    label: []<span class="tok-kw">const</span> u8,
) !GpuMesh {
    <span class="tok-kw">const</span> vcount: usize = <span class="tok-builtin">@intCast</span>(mesh.vertexCount);
    <span class="tok-kw">const</span> verts: []MeshVertex = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(MeshVertex, vcount);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(verts);
    <span class="tok-kw">for</span> (verts, <span class="tok-num">0</span>..) |*v, i| {
        v.* = .{
            .position = .{ mesh.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>], mesh.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>], mesh.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] },
            .normal = .{ mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>], mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>], mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] },
        };
    }
    <span class="tok-kw">const</span> icount: usize = <span class="tok-builtin">@as</span>(usize, <span class="tok-builtin">@intCast</span>(mesh.triangleCount)) * <span class="tok-num">3</span>;
    <span class="tok-kw">const</span> indices: []u32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u32, icount);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(indices);
    <span class="tok-kw">if</span> (mesh.indices != null) {
        <span class="tok-kw">for</span> (indices, <span class="tok-num">0</span>..) |*ix, i| {
            ix.* = mesh.indices[i];
        }
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">for</span> (indices, <span class="tok-num">0</span>..) |*ix, i| {
            ix.* = <span class="tok-builtin">@intCast</span>(i);
        }
    }
    <span class="tok-kw">return</span> .{
        .vbo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(verts),
            .{ .vertex = true, .copy_dst = true },
            label,
        ),
        .ibo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(indices),
            .{ .index = true, .copy_dst = true },
            label,
        ),
        .vbo_bytes = verts.len * <span class="tok-builtin">@sizeOf</span>(MeshVertex),
        .ibo_bytes = indices.len * <span class="tok-builtin">@sizeOf</span>(u32),
        .icount = <span class="tok-builtin">@intCast</span>(icount),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    _ = gpa;
    <span class="tok-comment">// Per-object uniforms + bind groups (NOT obj.mesh - those alias s.meshes below).</span>
    <span class="tok-kw">for</span> (s.objs) |o| {
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(o.vs_ubo);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(o.fs_ubo);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(o.g0_bg);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(o.g2_bg);
    }
    <span class="tok-comment">// The 3 unique meshes (freeing per-obj would double-destroy the shared cube).</span>
    <span class="tok-kw">for</span> (s.meshes) |m| {
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(m.vbo);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(m.ibo);
    }
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.pipeline);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.empty_bg);
    s.rt.<span class="tok-fn">deinit</span>(); <span class="tok-comment">// color+depth textures/views + sampler (no-op when empty)</span>
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> queue: z.wgpu.QueueHandle = f.gpu.queue;

    <span class="tok-kw">const</span> ground: GpuMesh = .{
        .vbo = z.wgpu.<span class="tok-fn">createBufferInit</span>(

            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(ground_indices[<span class="tok-num">0</span>..]),
            .{ .index = true, .copy_dst = true },
            <span class="tok-str">"bc_ground_ibo"</span>,
        ),
        .vbo_bytes = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(ground_verts)),
        .ibo_bytes = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(ground_indices)),
        .icount = ground_indices.len,
    };
    <span class="tok-kw">const</span> cube: GpuMesh = .{
        .vbo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_verts[<span class="tok-num">0</span>..]),
            .{ .vertex = true, .copy_dst = true },
            <span class="tok-str">"bc_cube_vbo"</span>,
        ),
        .ibo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_indices[<span class="tok-num">0</span>..]),
            .{ .index = true, .copy_dst = true },
            <span class="tok-str">"bc_cube_ibo"</span>,
        ),
        .vbo_bytes = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_verts)),
        .ibo_bytes = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_indices)),
        .icount = cube_indices.len,
    };
    <span class="tok-kw">const</span> sphere_cpu: z.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">24</span>, <span class="tok-num">20</span>);

    <span class="tok-kw">const</span> g0_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(VsUbo), .{ .vertex = true }, <span class="tok-str">"bc_g0"</span>);
    <span class="tok-kw">const</span> g2_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(FsUbo), .{ .fragment = true }, <span class="tok-str">"bc_g2"</span>);
    <span class="tok-kw">const</span> empty_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_blob);
    <span class="tok-kw">const</span> empty_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, empty_blob, <span class="tok-str">"bc_empty"</span>);
    <span class="tok-kw">const</span> empty_bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_bg_blob);

    <span class="tok-kw">const</span> vs_mod: z.wgpu.ShaderModuleHandle =

    <span class="tok-kw">const</span> combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less,
        .back,
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{.{
            .array_stride = <span class="tok-builtin">@sizeOf</span>(MeshVertex),
            .step_mode = .vertex,
            .attributes = &amp;.{
                .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
                .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
            },
        }},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pipe_blob);

    <span class="tok-kw">var</span> objs: [<span class="tok-num">4</span>]Obj = undefined;

            .size = <span class="tok-builtin">@sizeOf</span>(FsUbo),
            .usage = .{ .uniform = true, .copy_dst = true },

            .vs_ubo = vs_ubo,
            .g0_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, g0_bgl, vs_ubo, <span class="tok-builtin">@sizeOf</span>(VsUbo), <span class="tok-str">"bc_g0_bg"</span>),

    }

    <span class="tok-comment">// The layouts, pipeline layout, and shader modules are only needed to build</span>
    <span class="tok-comment">// the pipeline and bind groups; WebGPU keeps its own internal refs, so we can</span>
    <span class="tok-comment">// release these build intermediates now rather than leak them for the app's life.</span>
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(g0_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(g2_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(empty_bgl);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(pl);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(fs_mod);

    s.* = .{
        .gpa = gpa,
        .pipeline = pipeline,
        .empty_bg = empty_bg,
        .objs = objs,
        .meshes = .{ ground, cube, sphere }, <span class="tok-comment">// 3 unique; obj mesh fields alias these</span>

        .rt = .{},
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>)),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> bw: u32 = <span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> bh: u32 = <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt.color != .invalid <span class="tok-kw">and</span> s.rt.width == bw <span class="tok-kw">and</span> s.rt.height == bh) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.rt.color != .invalid) {
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt);
    }
    s.rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(bw), <span class="tok-builtin">@intCast</span>(bh));
}

<span class="tok-comment">/// Drag anywhere: the finger's ray hits the ground plane and the player</span>
<span class="tok-comment">/// glides there (clamped to the arena).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(
    f: *z.Frame,
    s: *State,
    ui_wants_mouse: bool,
    cam: zm.Camera3D,
    vw: f32,
    vh: f32,
) void {
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> dx: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (s.prev_pinch &gt; <span class="tok-num">0</span>) {
            s.cam_dist_scale = <span class="tok-fn">clamp</span>(s.cam_dist_scale - (dist - s.prev_pinch) * <span class="tok-num">0.002</span>, <span class="tok-num">0.6</span>, <span class="tok-num">1.8</span>);
        }
        s.prev_pinch = dist;
        <span class="tok-kw">return</span>;
    }
    s.prev_pinch = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !ui_wants_mouse) {
        <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
        <span class="tok-kw">const</span> ray: zm.Ray = z.<span class="tok-fn">getScreenToWorldRay</span>(mp, cam, vw, vh);
        <span class="tok-kw">const</span> hit: zm.RayCollision = z.<span class="tok-fn">getRayCollisionQuad</span>(
            ray,
            <span class="tok-fn">vec</span>(-<span class="tok-num">100</span>, <span class="tok-num">0</span>, -<span class="tok-num">100</span>),
            <span class="tok-fn">vec</span>(-<span class="tok-num">100</span>, <span class="tok-num">0</span>, <span class="tok-num">100</span>),
            <span class="tok-fn">vec</span>(<span class="tok-num">100</span>, <span class="tok-num">0</span>, <span class="tok-num">100</span>),
            <span class="tok-fn">vec</span>(<span class="tok-num">100</span>, <span class="tok-num">0</span>, -<span class="tok-num">100</span>),
        );
        <span class="tok-kw">if</span> (hit.hit) {
            s.player_pos[<span class="tok-num">0</span>] = <span class="tok-fn">clamp</span>(hit.point[<span class="tok-num">0</span>], -arena_half + <span class="tok-num">0.5</span>, arena_half - <span class="tok-num">0.5</span>);
            s.player_pos[<span class="tok-num">2</span>] = <span class="tok-fn">clamp</span>(hit.point[<span class="tok-num">2</span>], -arena_half + <span class="tok-num">0.5</span>, arena_half - <span class="tok-num">0.5</span>);
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">writeObj</span>(
    f: *z.Frame,
    obj: *Obj,
    model: Mat,
    cam_vp: Mat,
    cam_eye: Vec,
    color: [<span class="tok-num">4</span>]f32,
) void {
    <span class="tok-kw">var</span> vs_io: mat_vs.Io = undefined;
    vs_io.u = .{ .mvp = <span class="tok-fn">mulMat</span>(cam_vp, model), .model = model, .normal_matrix = zm.<span class="tok-fn">identity</span>() };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.vs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;vs_io.u));
    <span class="tok-kw">var</span> fs_io: mat_fs.Io = undefined;
    fs_io.u = .{
        .base_color = color,
        .view_pos = .{ cam_eye[<span class="tok-num">0</span>], cam_eye[<span class="tok-num">1</span>], cam_eye[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .light_dir = .{ sun_dir[<span class="tok-num">0</span>], sun_dir[<span class="tok-num">1</span>], sun_dir[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .fog_color = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> },
        .params = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.fs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;fs_io.u));
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing; uses</span>
    <span class="tok-comment">// last-frame UI state = 1-frame lag, imperceptible).</span>

    <span class="tok-comment">// raylib's fixed camera at (0,10,10), pinch-scaled.</span>
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">15.0</span> * s.cam_dist_scale, <span class="tok-num">20.0</span> * s.cam_dist_scale);
    <span class="tok-kw">const</span> cam_target: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> cam_view: Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, cam_target, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> cam_proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(fovy_rad, vw / vh, <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>);
    <span class="tok-kw">const</span> cam_vp: Mat = <span class="tok-fn">mulMat</span>(cam_proj, cam_view);
    <span class="tok-kw">const</span> cam3d: zm.Camera3D = .{
        .position = cam_eye,
        .target = cam_target,
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = fovy_rad * <span class="tok-num">180.0</span> / pi,
    };

    <span class="tok-comment">// ---- the collision tests, raylib's predicates verbatim ----</span>
    <span class="tok-kw">const</span> player_box: z.BoundingBox = .{
        .min = <span class="tok-fn">vec</span>(
            s.player_pos[<span class="tok-num">0</span>] - player_size[<span class="tok-num">0</span>] * <span class="tok-num">0.5</span>,
            s.player_pos[<span class="tok-num">1</span>] - player_size[<span class="tok-num">1</span>] * <span class="tok-num">0.5</span>,
            s.player_pos[<span class="tok-num">2</span>] - player_size[<span class="tok-num">2</span>] * <span class="tok-num">0.5</span>,
        ),
        .max = <span class="tok-fn">vec</span>(
            s.player_pos[<span class="tok-num">0</span>] + player_size[<span class="tok-num">0</span>] * <span class="tok-num">0.5</span>,
            s.player_pos[<span class="tok-num">1</span>] + player_size[<span class="tok-num">1</span>] * <span class="tok-num">0.5</span>,
            s.player_pos[<span class="tok-num">2</span>] + player_size[<span class="tok-num">2</span>] * <span class="tok-num">0.5</span>,
        ),
    };
    <span class="tok-kw">const</span> enemy_box: z.BoundingBox = .{
        .min = <span class="tok-fn">vec</span>(
            enemy_box_pos[<span class="tok-num">0</span>] - enemy_box_size * <span class="tok-num">0.5</span>,
            enemy_box_pos[<span class="tok-num">1</span>] - enemy_box_size * <span class="tok-num">0.5</span>,
            enemy_box_pos[<span class="tok-num">2</span>] - enemy_box_size * <span class="tok-num">0.5</span>,
        ),
        .max = <span class="tok-fn">vec</span>(
            enemy_box_pos[<span class="tok-num">0</span>] + enemy_box_size * <span class="tok-num">0.5</span>,
            enemy_box_pos[<span class="tok-num">1</span>] + enemy_box_size * <span class="tok-num">0.5</span>,
            enemy_box_pos[<span class="tok-num">2</span>] + enemy_box_size * <span class="tok-num">0.5</span>,
        ),
    };
    s.hit_box = z.<span class="tok-fn">checkCollisionBoxes</span>(player_box, enemy_box);
    s.hit_sphere = z.<span class="tok-fn">checkCollisionBoxSphere</span>(
        player_box,
        <span class="tok-fn">vec</span>(enemy_sphere_pos[<span class="tok-num">0</span>], enemy_sphere_pos[<span class="tok-num">1</span>], enemy_sphere_pos[<span class="tok-num">2</span>]),
        enemy_sphere_r,
    );
    <span class="tok-kw">const</span> colliding: bool = s.hit_box <span class="tok-kw">or</span> s.hit_sphere;

    <span class="tok-comment">// ---- uniforms: ground, enemies, then the player (green or RED) ----</span>
    <span class="tok-fn">writeObj</span>(f, &amp;s.objs[<span class="tok-num">0</span>], zm.<span class="tok-fn">identity</span>(), cam_vp, cam_eye, .{ <span class="tok-num">0.5</span>, <span class="tok-num">0.52</span>, <span class="tok-num">0.56</span>, <span class="tok-num">1</span> });
    <span class="tok-kw">const</span> ebox_model: Mat = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">translation</span>(enemy_box_pos[<span class="tok-num">0</span>], enemy_box_pos[<span class="tok-num">1</span>], enemy_box_pos[<span class="tok-num">2</span>]),
        <span class="tok-fn">scaling</span>(enemy_box_size * <span class="tok-num">0.5</span>, enemy_box_size * <span class="tok-num">0.5</span>, enemy_box_size * <span class="tok-num">0.5</span>),
    );
    <span class="tok-fn">writeObj</span>(f, &amp;s.objs[<span class="tok-num">1</span>], ebox_model, cam_vp, cam_eye, .{ <span class="tok-num">0.55</span>, <span class="tok-num">0.55</span>, <span class="tok-num">0.58</span>, <span class="tok-num">1</span> });
    <span class="tok-kw">const</span> esph_model: Mat = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">translation</span>(enemy_sphere_pos[<span class="tok-num">0</span>], enemy_sphere_pos[<span class="tok-num">1</span>], enemy_sphere_pos[<span class="tok-num">2</span>]),
        <span class="tok-fn">scaling</span>(enemy_sphere_r, enemy_sphere_r, enemy_sphere_r),
    );
    <span class="tok-fn">writeObj</span>(f, &amp;s.objs[<span class="tok-num">2</span>], esph_model, cam_vp, cam_eye, .{ <span class="tok-num">0.55</span>, <span class="tok-num">0.55</span>, <span class="tok-num">0.58</span>, <span class="tok-num">1</span> });
    <span class="tok-kw">const</span> player_model: Mat = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">translation</span>(s.player_pos[<span class="tok-num">0</span>], s.player_pos[<span class="tok-num">1</span>], s.player_pos[<span class="tok-num">2</span>]),
        <span class="tok-fn">scaling</span>(player_size[<span class="tok-num">0</span>] * <span class="tok-num">0.5</span>, player_size[<span class="tok-num">1</span>] * <span class="tok-num">0.5</span>, player_size[<span class="tok-num">2</span>] * <span class="tok-num">0.5</span>),
    );
    <span class="tok-kw">const</span> player_color: [<span class="tok-num">4</span>]f32 = <span class="tok-kw">if</span> (colliding) .{ <span class="tok-num">0.95</span>, <span class="tok-num">0.2</span>, <span class="tok-num">0.2</span>, <span class="tok-num">1</span> } <span class="tok-kw">else</span> .{ <span class="tok-num">0.25</span>, <span class="tok-num">0.85</span>, <span class="tok-num">0.35</span>, <span class="tok-num">1</span> };
    <span class="tok-fn">writeObj</span>(f, &amp;s.objs[<span class="tok-num">3</span>], player_model, cam_vp, cam_eye, player_color);

    <span class="tok-comment">// ---- the pass ----</span>
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.rt, bg_clear);
    <span class="tok-kw">const</span> pa: *z.PassState = f.gl.pass;
    Backend.<span class="tok-fn">setPipeline</span>(pa, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">1</span>, s.empty_bg);
    <span class="tok-kw">for</span> (&amp;s.objs) |*obj| {
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">0</span>, obj.g0_bg);
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">2</span>, obj.g2_bg);
        z.render_pass.<span class="tok-fn">setVertexBuffer</span>(pa.pass, .{
            .slot = <span class="tok-num">0</span>,
            .buffer = obj.mesh.vbo,
            .offset = <span class="tok-num">0</span>,
            .size = obj.mesh.vbo_bytes,
        });
        z.render_pass.<span class="tok-fn">setIndexBuffer</span>(pa.pass, .{
            .buffer = obj.mesh.ibo,
            .format = .uint32,
            .offset = <span class="tok-num">0</span>,
            .size = obj.mesh.ibo_bytes,
        });
        z.render_pass.<span class="tok-fn">drawIndexed</span>(pa.pass, .{
            .index_count = obj.mesh.icount,
            .instance_count = <span class="tok-num">1</span>,
            .first_index = <span class="tok-num">0</span>,
            .base_vertex = <span class="tok-num">0</span>,
            .first_instance = <span class="tok-num">0</span>,
        });
    }
    z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);

    <span class="tok-comment">// SCREEN PASS: open once, composite, then UI.</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, bg_clear);
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh }, s.rt.<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    <span class="tok-comment">// ---- UI first (its capture flag gates the drag) ----</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">300</span>, vw - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">118</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">110</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"box collisions"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"drag to slide the player"</span>, .{});
        <span class="tok-kw">const</span> status: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.hit_box <span class="tok-kw">and</span> s.hit_sphere)
            <span class="tok-str">"COLLISION: box + sphere!"</span>
        <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.hit_box)
            <span class="tok-str">"COLLISION: enemy box!"</span>
        <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.hit_sphere)
            <span class="tok-str">"COLLISION: enemy sphere!"</span>
        <span class="tok-kw">else</span>
            <span class="tok-str">"clear"</span>;
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{status});
    }
    <span class="tok-fn">handleInput</span>(f, s, u.<span class="tok-fn">wantCaptureMouse</span>(), cam3d, vw, vh);
    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - box collisions (drag the player)"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Renders offscreen before the screen opens (tile-based-GPU safe); owns</span>
    <span class="tok-comment">// its own begin/endDrawing.</span>
    .manages_own_frame = true,
};
