<h1>audio_sound_lab</h1>
<figure class="code src-file" data-path="examples/audio_sound_lab/audio_sound_lab.zig" data-lines="343"><figcaption><span>examples/audio_sound_lab/audio_sound_lab.zig</span><span>343 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/audio_sound_lab.zig - loading, polyphony and positioning.</span>
<span class="tok-comment">// MERGES three raylib audio samples behind a mode switch - `audio_sound_loading`,</span>
<span class="tok-comment">// `audio_sound_multi` and `audio_sound_positioning`. They all need the same</span>
<span class="tok-comment">// device bring-up and differ only in what they do with a Sound, so one app means</span>
<span class="tok-comment">// one build and one listening session instead of three.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   LOAD  - decode a real FILE (a .wav) into a Wave, read back what the decoder</span>
<span class="tok-comment">//           actually found (rate / channels / frames), then upload it as a Sound:</span>
<span class="tok-comment">//           play / stop / pause / resume, volume + pitch.</span>
<span class="tok-comment">//           Deliberately a small WAV, not the bundled 96 s Vorbis: decoding that</span>
<span class="tok-comment">//           to PCM would allocate ~16 MB up front and stall startup, and OGG is</span>
<span class="tok-comment">//           already covered - as STREAMING, which is the right way to play it -</span>
<span class="tok-comment">//           by the music_streaming example.</span>
<span class="tok-comment">//   MULTI - polyphony via ALIASES. One Sound = one playback slot, so re-playing</span>
<span class="tok-comment">//           it restarts it. `sounds.loadAlias` shares the decoded buffer but adds</span>
<span class="tok-comment">//           an independent voice, so N aliases = N overlapping copies for the</span>
<span class="tok-comment">//           price of one buffer. Tap fast and hear them stack.</span>
<span class="tok-comment">//   POS   - pan + distance attenuation from a draggable emitter. NOTE zimr's pan</span>
<span class="tok-comment">//           is [-1, 1] (left..right), NOT raylib's [0, 1] - see sounds.setPan.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Lifecycle rule that bites: aliases share the source's buffer id, so ALIASES</span>
<span class="tok-comment">// MUST BE UNLOADED BEFORE THE SOURCE, or their buffer id is already stale.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Browsers won't start audio without a user gesture; the runtime wires</span>
<span class="tok-comment">// `audio_device.resumeFromGesture` into the input layer, so the first tap on any</span>
<span class="tok-comment">// button unlocks it.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> test_sine_wav = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"test_sine_wav"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> alias_count: usize = <span class="tok-num">8</span>;

<span class="tok-kw">const</span> Mode = <span class="tok-kw">enum</span> { load, multi, position };

<span class="tok-comment">/// What the emitter geometry resolves to - a named type so the audio params and</span>
<span class="tok-comment">/// the on-screen readout can't drift apart.</span>
<span class="tok-kw">const</span> Placement = <span class="tok-kw">struct</span> {
    pan: f32,
    vol: f32,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    ui_font: z.Font,
    audio: z.AudioState = .{},

    clip: z.Sound, <span class="tok-comment">// decoded from the .wav</span>
    clip_ok: bool,
    clip_rate: u32 = <span class="tok-num">0</span>,
    clip_frames: u32 = <span class="tok-num">0</span>,
    clip_ch: u32 = <span class="tok-num">0</span>,
    blip: z.Sound, <span class="tok-comment">// synthesized; the alias source</span>
    alias: [alias_count]z.Sound,
    alias_i: usize = <span class="tok-num">0</span>,
    ping: z.Sound, <span class="tok-comment">// positioning voice</span>

    mode: Mode = .load,
    volume: f32 = <span class="tok-num">0.8</span>,
    pitch: f32 = <span class="tok-num">1.0</span>,
    emitter: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    emitter_set: bool = false,
    repeat: bool = false,
    next_ping: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    z.audio_device.<span class="tok-fn">init</span>(f.audio_device);

    <span class="tok-kw">var</span> audio: z.AudioState = .{};

    <span class="tok-comment">// --- LOAD: decode a real file -----------------------------------------</span>
    <span class="tok-kw">const</span> wave: z.Wave = z.waves.<span class="tok-fn">loadFromMemory</span>(&amp;audio.waves, gpa, <span class="tok-str">".wav"</span>, test_sine_wav) <span class="tok-kw">catch</span> .{};
    <span class="tok-kw">const</span> clip_ok: bool = z.waves.<span class="tok-fn">isValid</span>(wave);
    <span class="tok-kw">var</span> clip: z.Sound = .{};
    <span class="tok-kw">var</span> clip_rate: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> clip_frames: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> clip_ch: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (clip_ok) {
        <span class="tok-comment">// What the DECODER found - not what we assumed. This is the whole point</span>
        <span class="tok-comment">// of the loading path: the file dictates rate/channels, not the caller.</span>
        clip_rate = wave.sampleRate;
        clip_frames = wave.frameCount;
        clip_ch = wave.channels;
        clip = <span class="tok-kw">try</span> z.sounds.<span class="tok-fn">loadFromWave</span>(&amp;audio.sounds, f.audio_device, gpa, wave);
        z.waves.<span class="tok-fn">unload</span>(&amp;audio.waves, wave); <span class="tok-comment">// the Sound owns its buffer now</span>
    }

    <span class="tok-comment">// --- MULTI: one buffer, many voices ------------------------------------</span>
    <span class="tok-kw">const</span> env: z.composer.Envelope = .{ .attack_ms = <span class="tok-num">3.0</span>, .release_ms = <span class="tok-num">90.0</span> };
    <span class="tok-kw">const</span> blip_wave: z.Wave = <span class="tok-kw">try</span> z.composer.<span class="tok-fn">tone</span>(&amp;audio.waves, gpa, .{
        .frequency_hz = <span class="tok-num">660.0</span>,
        .duration_ms = <span class="tok-num">220</span>,
        .shape = .sine,
        .amplitude = <span class="tok-num">0.35</span>,
        .envelope = env,
    });
    <span class="tok-kw">defer</span> z.waves.<span class="tok-fn">unload</span>(&amp;audio.waves, blip_wave);
    <span class="tok-kw">const</span> blip: z.Sound = <span class="tok-kw">try</span> z.sounds.<span class="tok-fn">loadFromWave</span>(&amp;audio.sounds, f.audio_device, gpa, blip_wave);

    <span class="tok-kw">var</span> alias: [alias_count]z.Sound = undefined;
    <span class="tok-kw">for</span> (&amp;alias) |*a| {
        a.* = z.sounds.<span class="tok-fn">loadAlias</span>(&amp;audio.sounds, blip);
    }

    <span class="tok-comment">// --- POS: a longer voice so panning is audible while dragging ----------</span>
    <span class="tok-kw">const</span> ping_wave: z.Wave = <span class="tok-kw">try</span> z.composer.<span class="tok-fn">tone</span>(&amp;audio.waves, gpa, .{
        .frequency_hz = <span class="tok-num">440.0</span>,
        .duration_ms = <span class="tok-num">400</span>,
        .shape = .triangle,
        .amplitude = <span class="tok-num">0.4</span>,
        .envelope = env,
    });
    <span class="tok-kw">defer</span> z.waves.<span class="tok-fn">unload</span>(&amp;audio.waves, ping_wave);
    <span class="tok-kw">const</span> ping: z.Sound = <span class="tok-kw">try</span> z.sounds.<span class="tok-fn">loadFromWave</span>(&amp;audio.sounds, f.audio_device, gpa, ping_wave);

    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">16</span>);

    s.* = .{
        .ui_font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
        .font = font,
        .audio = audio,
        .clip = clip,
        .clip_ok = clip_ok,
        .clip_rate = clip_rate,
        .clip_frames = clip_frames,
        .clip_ch = clip_ch,
        .blip = blip,
        .alias = alias,
        .ping = ping,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.ui_font);
    <span class="tok-comment">// Aliases FIRST: they share the source's buffer id, which goes stale the</span>
    <span class="tok-comment">// moment the source is unloaded.</span>
    <span class="tok-kw">for</span> (s.alias) |a| {
        z.sounds.<span class="tok-fn">unload</span>(&amp;s.audio.sounds, a);
    }
    z.sounds.<span class="tok-fn">unload</span>(&amp;s.audio.sounds, s.blip);
    z.sounds.<span class="tok-fn">unload</span>(&amp;s.audio.sounds, s.ping);
    <span class="tok-kw">if</span> (s.clip_ok) {
        z.sounds.<span class="tok-fn">unload</span>(&amp;s.audio.sounds, s.clip);
    }
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Round-robin the next free voice. Re-playing a Sound restarts it, so cycling</span>
<span class="tok-comment">/// aliases is what turns one buffer into polyphony.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">fireAlias</span>(s: *State) void {
    <span class="tok-kw">const</span> a: z.Sound = s.alias[s.alias_i];
    s.alias_i = (s.alias_i + <span class="tok-num">1</span>) % alias_count;
    z.sounds.<span class="tok-fn">setVolume</span>(&amp;s.audio.sounds, a, s.volume);
    z.sounds.<span class="tok-fn">setPitch</span>(&amp;s.audio.sounds, a, s.pitch);
    z.sounds.<span class="tok-fn">play</span>(&amp;s.audio.sounds, a);
}

<span class="tok-comment">/// Pan + attenuation from the emitter's offset relative to the listener.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">applyPositioning</span>(s: *State, listener: Vec2, span: f32) Placement {
    <span class="tok-kw">const</span> dx: f32 = s.emitter[<span class="tok-num">0</span>] - listener[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> dy: f32 = s.emitter[<span class="tok-num">1</span>] - listener[<span class="tok-num">1</span>];
    <span class="tok-comment">// zimr pan is [-1, 1]: -1 hard left, 0 centre, +1 hard right.</span>
    <span class="tok-kw">const</span> pan: f32 = <span class="tok-fn">clamp</span>(dx / span, -<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
    <span class="tok-kw">const</span> vol: f32 = <span class="tok-fn">clamp</span>(<span class="tok-num">1.0</span> - dist / (span * <span class="tok-num">1.6</span>), <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>) * s.volume;
    z.sounds.<span class="tok-fn">setPan</span>(&amp;s.audio.sounds, s.ping, pan);
    z.sounds.<span class="tok-fn">setVolume</span>(&amp;s.audio.sounds, s.ping, vol);
    <span class="tok-kw">return</span> .{ .pan = pan, .vol = vol };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">20</span>, .g = <span class="tok-num">22</span>, .b = <span class="tok-num">30</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-kw">const</span> listener: Vec2 = .{ fw * <span class="tok-num">0.5</span>, fh * <span class="tok-num">0.72</span> };
    <span class="tok-kw">const</span> span: f32 = fw * <span class="tok-num">0.5</span>;
    <span class="tok-kw">if</span> (!s.emitter_set) {
        s.emitter = .{ fw * <span class="tok-num">0.5</span>, fh * <span class="tok-num">0.50</span> };
        s.emitter_set = true;
    }

    <span class="tok-kw">var</span> pan: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> vol: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (s.mode == .position) {
        <span class="tok-kw">if</span> (!u.<span class="tok-fn">wantCaptureMouse</span>() <span class="tok-kw">and</span> z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left)) {
            s.emitter = z.<span class="tok-fn">getMousePosition</span>(f.input);
        }
        <span class="tok-kw">const</span> pv: Placement = <span class="tok-fn">applyPositioning</span>(s, listener, span);
        pan = pv.pan;
        vol = pv.vol;
        <span class="tok-kw">if</span> (s.repeat <span class="tok-kw">and</span> f.time.time &gt;= s.next_ping) {
            z.sounds.<span class="tok-fn">play</span>(&amp;s.audio.sounds, s.ping);
            s.next_ping = f.time.time + <span class="tok-num">0.6</span>;
        }
    }

    <span class="tok-comment">// ---- scene ------------------------------------------------------------</span>
    <span class="tok-kw">if</span> (s.mode == .position) {
        <span class="tok-comment">// Listener, emitter, and the line between them: the geometry the pan and</span>
        <span class="tok-comment">// volume are derived from, drawn so the numbers are checkable by eye.</span>
        f.gl.<span class="tok-fn">line</span>(listener, s.emitter, .{ .color = .{ .r = <span class="tok-num">70</span>, .g = <span class="tok-num">80</span>, .b = <span class="tok-num">100</span>, .a = <span class="tok-num">255</span> }, .thickness = <span class="tok-num">2</span> });
        f.gl.<span class="tok-fn">circle</span>(listener, <span class="tok-num">14</span>, .{ .color = c.raywhite });
        f.gl.<span class="tok-fn">circle</span>(listener, <span class="tok-num">22</span>, .{ .color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">100</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> }, .outline = <span class="tok-num">2</span> });
        f.gl.<span class="tok-fn">circle</span>(s.emitter, <span class="tok-num">16</span>, .{ .color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">160</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> } });
        f.gl.<span class="tok-fn">text</span>(
            .{ listener[<span class="tok-num">0</span>] - <span class="tok-num">34.0</span>, listener[<span class="tok-num">1</span>] + <span class="tok-num">28.0</span> },
            <span class="tok-str">"listener"</span>,
            .{ .size = <span class="tok-num">14</span>, .color = c.gray, .font = &amp;s.font },
        );
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.mode == .multi) {
        <span class="tok-comment">// One bar per alias voice, lit while it's sounding - polyphony made</span>
        <span class="tok-comment">// visible, so "did they overlap?" isn't a matter of trusting my ears.</span>
        <span class="tok-kw">var</span> playing: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (s.alias, <span class="tok-num">0</span>..) |a, i| {
            <span class="tok-kw">const</span> on: bool = z.sounds.<span class="tok-fn">isPlaying</span>(&amp;s.audio.sounds, a);
            <span class="tok-kw">if</span> (on) {
                playing += <span class="tok-num">1</span>;
            }
            <span class="tok-kw">const</span> bw: f32 = (fw - <span class="tok-num">40.0</span>) / <span class="tok-fn">float</span>(alias_count);
            <span class="tok-kw">const</span> x: f32 = <span class="tok-num">20.0</span> + <span class="tok-fn">float</span>(i) * bw;
            <span class="tok-kw">const</span> h: f32 = <span class="tok-kw">if</span> (on) <span class="tok-num">90.0</span> <span class="tok-kw">else</span> <span class="tok-num">16.0</span>;
            <span class="tok-kw">const</span> lit: Color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">220</span>, .b = <span class="tok-num">140</span>, .a = <span class="tok-num">255</span> };
            <span class="tok-kw">const</span> dim: Color = .{ .r = <span class="tok-num">55</span>, .g = <span class="tok-num">60</span>, .b = <span class="tok-num">75</span>, .a = <span class="tok-num">255</span> };
            f.gl.<span class="tok-fn">rect</span>(
                .{ .x = x + <span class="tok-num">3.0</span>, .y = fh * <span class="tok-num">0.62</span> - h, .width = bw - <span class="tok-num">6.0</span>, .height = h },
                .{ .color = <span class="tok-kw">if</span> (on) lit <span class="tok-kw">else</span> dim },
            );
        }
        <span class="tok-kw">var</span> vb: [<span class="tok-num">48</span>]u8 = undefined;
        <span class="tok-kw">const</span> vt: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;vb, <span class="tok-str">"voices sounding: {d} / {d}"</span>, .{ playing, alias_count }) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
        f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">20</span>, fh * <span class="tok-num">0.62</span> + <span class="tok-num">14.0</span> }, vt, .{ .size = <span class="tok-num">16</span>, .color = c.raywhite, .font = &amp;s.font });
    }

    <span class="tok-comment">// ---- UI ---------------------------------------------------------------</span>
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16.0</span>, <span class="tok-num">300</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Sound lab"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Load"</span>, .{})) {
            s.mode = .load;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Multi"</span>, .{})) {
            s.mode = .multi;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Position"</span>, .{})) {
            s.mode = .position;
        }
        u.<span class="tok-fn">separator</span>();

        <span class="tok-kw">switch</span> (s.mode) {
            .load =&gt; {
                <span class="tok-kw">if</span> (!s.clip_ok) {
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"wav decode FAILED"</span>, .{});
                } <span class="tok-kw">else</span> {
                    <span class="tok-kw">const</span> secs: f32 = <span class="tok-kw">if</span> (s.clip_rate &gt; <span class="tok-num">0</span>) <span class="tok-fn">float</span>(s.clip_frames) / <span class="tok-fn">float</span>(s.clip_rate) <span class="tok-kw">else</span> <span class="tok-num">0</span>;
                    u.<span class="tok-fn">text</span>(<span class="tok-str">".wav decoded: {d} Hz, {d} ch"</span>, .{ s.clip_rate, s.clip_ch });
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"{d} frames = {d:.2} s"</span>, .{ s.clip_frames, secs });
                    <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Play"</span>, .{})) {
                        z.sounds.<span class="tok-fn">setVolume</span>(&amp;s.audio.sounds, s.clip, s.volume);
                        z.sounds.<span class="tok-fn">setPitch</span>(&amp;s.audio.sounds, s.clip, s.pitch);
                        z.sounds.<span class="tok-fn">play</span>(&amp;s.audio.sounds, s.clip);
                    }
                    u.<span class="tok-fn">sameLine</span>(.{});
                    <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Stop"</span>, .{})) {
                        z.sounds.<span class="tok-fn">stop</span>(&amp;s.audio.sounds, s.clip);
                    }
                    <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Pause"</span>, .{})) {
                        z.sounds.<span class="tok-fn">pause</span>(&amp;s.audio.sounds, s.clip);
                    }
                    u.<span class="tok-fn">sameLine</span>(.{});
                    <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Resume"</span>, .{})) {
                        z.sounds.<span class="tok-fn">resumeSound</span>(&amp;s.audio.sounds, s.clip);
                    }
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"playing: {}"</span>, .{z.sounds.<span class="tok-fn">isPlaying</span>(&amp;s.audio.sounds, s.clip)});
                }
            },
            .multi =&gt; {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"One buffer, {d} alias voices."</span>, .{alias_count});
                <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"FIRE (tap fast)"</span>, .{})) {
                    <span class="tok-fn">fireAlias</span>(s);
                }
            },
            .position =&gt; {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag the orange emitter."</span>, .{});
                <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Ping"</span>, .{})) {
                    z.sounds.<span class="tok-fn">play</span>(&amp;s.audio.sounds, s.ping);
                }
                u.<span class="tok-fn">sameLine</span>(.{});
                <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-kw">if</span> (s.repeat) <span class="tok-str">"Repeat: ON"</span> <span class="tok-kw">else</span> <span class="tok-str">"Repeat: OFF"</span>, .{})) {
                    s.repeat = !s.repeat;
                }
                u.<span class="tok-fn">text</span>(<span class="tok-str">"pan {d:.2}   volume {d:.2}"</span>, .{ pan, vol });
            },
        }

        u.<span class="tok-fn">separator</span>();
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"volume"</span>, &amp;s.volume, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">1.0</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"pitch"</span>, &amp;s.pitch, .{ .min = <span class="tok-num">0.5</span>, .max = <span class="tok-num">2.0</span> });
    }

    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - audio - sound lab"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            .scale_mode = .responsive,
            .depth_format = null,
            .clear = .{ .r = <span class="tok-num">20.0</span> / <span class="tok-num">255.0</span>, .g = <span class="tok-num">22.0</span> / <span class="tok-num">255.0</span>, .b = <span class="tok-num">30.0</span> / <span class="tok-num">255.0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    .memory = .managed,
};
