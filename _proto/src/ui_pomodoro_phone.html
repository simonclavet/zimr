<figure class="code src-file" data-path="examples/ui_pomodoro_phone/ui_pomodoro_phone.zig" data-lines="226"><figcaption><span>examples/ui_pomodoro_phone/ui_pomodoro_phone.zig</span><span>226 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! ui_pomodoro_phone - a 25-minute pomodoro timer with an animated progress</span>
<span class="tok-comment">//! ring, ported to WebGPU. Phone-shaped (420x760), big touch targets. Shows off</span>
<span class="tok-comment">//! the shared `ui.zig` on the wgpu UiHost: a `beginCanvas` ring drawn with the</span>
<span class="tok-comment">//! draw-list (addCircle track + addArc sweep + centred addText), `u.animated`</span>
<span class="tok-comment">//! tweening the ring colour from calm green to warning red over the final minute,</span>
<span class="tok-comment">//! and full-window no-chrome layout.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Ported from the GL `ui_pomodoro_phone`. The GL `UiContext` (+ shapes_texture +</span>
<span class="tok-comment">//! font_cache) becomes `z.UiHost`; the widget body is unchanged (same real</span>
<span class="tok-comment">//! ui.zig). The one structural addition the wgpu path needs: an explicit</span>
<span class="tok-comment">//! `beginDrawing`/`clearBackground` BEFORE `ui_host.begin` (the UI renders into</span>
<span class="tok-comment">//! the open draw frame), paired with `endDrawing`.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> session_seconds: f32 = <span class="tok-num">25</span> * <span class="tok-num">60</span>; <span class="tok-comment">// classic 25-min pomodoro</span>
<span class="tok-kw">const</span> warning_seconds: f32 = <span class="tok-num">60</span>; <span class="tok-comment">// last minute -&gt; red</span>

<span class="tok-kw">const</span> Phase = <span class="tok-kw">enum</span> {
    idle, <span class="tok-comment">// not yet started this session</span>
    running,
    paused,
    done, <span class="tok-comment">// session complete; needs reset</span>
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    phase: Phase = .idle,
    elapsed: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// seconds, [0..session_seconds]</span>
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">init</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-comment">// Larger atlas for the big timer readout; UI labels downscale from it.</span>
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">56</span>);
    s.* = .{ .font = font, .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font) };
}

<span class="tok-comment">/// Linearly interpolate two RGBA colour structs - drives the ring colour</span>
<span class="tok-comment">/// transition from the easing-curve output.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">lerpColor</span>(
    a: Color,
    b: Color,
    t: f32,
) Color {
    <span class="tok-kw">const</span> tc: f32 = <span class="tok-fn">clamp</span>(t, <span class="tok-num">0</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> af: Vec = .{
        <span class="tok-builtin">@floatFromInt</span>(a.r), <span class="tok-builtin">@floatFromInt</span>(a.g),
        <span class="tok-builtin">@floatFromInt</span>(a.b), <span class="tok-builtin">@floatFromInt</span>(a.a),
    };
    <span class="tok-kw">const</span> bf: Vec = .{
        <span class="tok-builtin">@floatFromInt</span>(b.r), <span class="tok-builtin">@floatFromInt</span>(b.g),
        <span class="tok-builtin">@floatFromInt</span>(b.b), <span class="tok-builtin">@floatFromInt</span>(b.a),
    };
    <span class="tok-kw">const</span> mix: Vec = af + (bf - af) * <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(tc));
    <span class="tok-kw">return</span> .{
        .r = <span class="tok-builtin">@trunc</span>(mix[<span class="tok-num">0</span>]),
        .g = <span class="tok-builtin">@trunc</span>(mix[<span class="tok-num">1</span>]),
        .b = <span class="tok-builtin">@trunc</span>(mix[<span class="tok-num">2</span>]),
        .a = <span class="tok-builtin">@trunc</span>(mix[<span class="tok-num">3</span>]),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">formatMinSec</span>(buf: []u8, total_sec: f32) []<span class="tok-kw">const</span> u8 {
    <span class="tok-comment">// u32 (not i32) so `{d:0&gt;2}` doesn't print a leading '+' sign. Clamped to</span>
    <span class="tok-comment">// zero via @max so a negative input is harmless.</span>
    <span class="tok-kw">const</span> sec_total: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">0</span>, <span class="tok-builtin">@ceil</span>(total_sec)));
    <span class="tok-kw">const</span> mins: u32 = sec_total / <span class="tok-num">60</span>;
    <span class="tok-kw">const</span> secs: u32 = sec_total % <span class="tok-num">60</span>;
    <span class="tok-kw">return</span> <span class="tok-fn">bufPrint</span>(buf, <span class="tok-str">"{d:0&gt;2}:{d:0&gt;2}"</span>, .{ mins, secs }) <span class="tok-kw">catch</span> buf[<span class="tok-num">0</span>..<span class="tok-num">0</span>];
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// Descriptor app: the runner/launcher owns begin/clear/end. The fullscreen</span>
    <span class="tok-comment">// panel below covers everything, so no separate background fill is needed.</span>
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-comment">// ---- Tick the timer while running -----------------------</span>
    <span class="tok-kw">if</span> (s.phase == .running) {
        s.elapsed += f.time.delta_time;
        <span class="tok-kw">if</span> (s.elapsed &gt;= session_seconds) {
            s.elapsed = session_seconds;
            s.phase = .done;
        }
    }
    <span class="tok-kw">const</span> remaining: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">0</span>, session_seconds - s.elapsed);
    <span class="tok-kw">const</span> progress: f32 = <span class="tok-kw">if</span> (session_seconds &gt; <span class="tok-num">0</span>)
        <span class="tok-fn">clamp</span>(s.elapsed / session_seconds, <span class="tok-num">0</span>, <span class="tok-num">1</span>)
    <span class="tok-kw">else</span>
        <span class="tok-num">0</span>;

    <span class="tok-comment">// Fullscreen window, no chrome - phone-style.</span>
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw, fh }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"pomodoro"</span>, .{
        .flags = .{
            .no_title_bar = true,
            .no_resize = true,
            .no_move = true,
            .no_collapse = true,
        },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Focus Session"</span>, .{});
        u.<span class="tok-fn">spacing</span>();

        <span class="tok-comment">// ---- Progress ring (canvas) -------------------------</span>
        <span class="tok-kw">const</span> ring_size: f32 = <span class="tok-builtin">@min</span>(fw - <span class="tok-num">40</span>, fh - <span class="tok-num">320</span>);
        <span class="tok-kw">const</span> ring_dim: Vec2 = .{ ring_size, ring_size };
        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginCanvas</span>(<span class="tok-str">"ring"</span>, ring_dim, .{})) |c| {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">endCanvas</span>(c);
            <span class="tok-kw">const</span> cx: f32 = c.rect.x + c.rect.width * <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> cy: f32 = c.rect.y + c.rect.height * <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> r_outer: f32 = ring_size * <span class="tok-num">0.45</span>;
            <span class="tok-kw">const</span> thickness: f32 = ring_size * <span class="tok-num">0.05</span>;

            <span class="tok-comment">// Track (background ring).</span>
            c.<span class="tok-fn">drawList</span>().<span class="tok-fn">addCircle</span>(.{ cx, cy }, r_outer, Color.<span class="tok-fn">fromWire</span>(<span class="tok-num">0xFF2A2D38</span>), thickness);

            <span class="tok-comment">// Active arc - sweep from 12-o'clock proportional to progress.</span>
            <span class="tok-comment">// addArc uses standard math angles (CCW positive, 0 = +X), so start</span>
            <span class="tok-comment">// at -pi/2 (top) and grow in +angle. Clamp to ~10 deg so even a few</span>
            <span class="tok-comment">// seconds of a 25-min session gives immediate visual feedback</span>
            <span class="tok-comment">// (cosmetic only - the numeric readout is always exact).</span>
            <span class="tok-kw">const</span> tau: f32 = zm.tau;
            <span class="tok-kw">const</span> min_visible_sweep: f32 = tau / <span class="tok-num">36.0</span>; <span class="tok-comment">// 10 deg</span>
            <span class="tok-kw">const</span> sweep: f32 = <span class="tok-kw">if</span> (progress &gt; <span class="tok-num">0</span>)
                <span class="tok-builtin">@max</span>(tau * progress, min_visible_sweep)
            <span class="tok-kw">else</span>
                <span class="tok-num">0</span>;
            <span class="tok-kw">const</span> a0: f32 = -pi * <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> a1: f32 = a0 + sweep;

            <span class="tok-comment">// Ring colour tweens calm green -&gt; warning red over 2s once the</span>
            <span class="tok-comment">// final minute starts. `u.animated` restarts when `to` changes.</span>
            <span class="tok-kw">const</span> want_warn: f32 = <span class="tok-kw">if</span> (remaining &lt;= warning_seconds <span class="tok-kw">and</span> s.phase == .running) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
            <span class="tok-kw">const</span> warn_t: f32 = u.<span class="tok-fn">animated</span>(<span class="tok-str">"ring_warn"</span>, .{
                .from = <span class="tok-num">0</span>,
                .to = want_warn,
                .duration = <span class="tok-num">2.0</span>,
                .easing = .ease_out,
            });
            <span class="tok-kw">const</span> col_calm: Color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">180</span>, .b = <span class="tok-num">110</span>, .a = <span class="tok-num">255</span> };
            <span class="tok-kw">const</span> col_warn: Color = .{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">80</span>, .b = <span class="tok-num">80</span>, .a = <span class="tok-num">255</span> };
            <span class="tok-kw">const</span> ring_col: Color = <span class="tok-fn">lerpColor</span>(col_calm, col_warn, warn_t);

            <span class="tok-kw">if</span> (sweep &gt; <span class="tok-num">0</span>) {
                c.<span class="tok-fn">drawList</span>().<span class="tok-fn">addArc</span>(.{ cx, cy }, r_outer, a0, a1, ring_col, thickness * <span class="tok-num">1.4</span>);
            }

            <span class="tok-comment">// Timer text centred by hand (addText takes a top-left position).</span>
            <span class="tok-kw">var</span> buf: [<span class="tok-num">16</span>]u8 = undefined;
            <span class="tok-kw">const</span> txt: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">formatMinSec</span>(&amp;buf, remaining);
            <span class="tok-kw">const</span> text_size: Vec2 = u.<span class="tok-fn">calcTextSize</span>(txt);
            <span class="tok-kw">const</span> tx: f32 = cx - text_size[<span class="tok-num">0</span>] * <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> ty: f32 = cy - text_size[<span class="tok-num">1</span>] * <span class="tok-num">0.5</span>;
            c.<span class="tok-fn">drawList</span>().<span class="tok-fn">addText</span>(txt, .{ tx, ty }, <span class="tok-num">56</span>, ring_col);
        }

        u.<span class="tok-fn">spacing</span>();
        u.<span class="tok-fn">spacing</span>();

        <span class="tok-comment">// ---- Buttons ----------------------------------------</span>
        <span class="tok-kw">const</span> btn_label: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">switch</span> (s.phase) {
            .idle =&gt; <span class="tok-str">"Start"</span>,
            .running =&gt; <span class="tok-str">"Pause"</span>,
            .paused =&gt; <span class="tok-str">"Resume"</span>,
            .done =&gt; <span class="tok-str">"Done"</span>,
        };
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(btn_label, .{ .size = .{ fw - <span class="tok-num">40</span>, <span class="tok-num">64</span> } })) {
            <span class="tok-kw">switch</span> (s.phase) {
                .idle, .paused =&gt; s.phase = .running,
                .running =&gt; s.phase = .paused,
                .done =&gt; {}, <span class="tok-comment">// wait for Reset</span>
            }
        }
        u.<span class="tok-fn">spacing</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Reset"</span>, .{ .size = .{ fw - <span class="tok-num">40</span>, <span class="tok-num">56</span> } })) {
            s.phase = .idle;
            s.elapsed = <span class="tok-num">0</span>;
        }

        u.<span class="tok-fn">spacing</span>();
        <span class="tok-kw">switch</span> (s.phase) {
            .idle =&gt; u.<span class="tok-fn">text</span>(<span class="tok-str">"Tap Start to begin."</span>, .{}),
            .running =&gt; u.<span class="tok-fn">text</span>(<span class="tok-str">"Focusing..."</span>, .{}),
            .paused =&gt; u.<span class="tok-fn">text</span>(<span class="tok-str">"Paused."</span>, .{}),
            .done =&gt; u.<span class="tok-fn">text</span>(<span class="tok-str">"Done!  Tap Reset for another round."</span>, .{}),
        }
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{

        .scale_mode = .responsive,

};
