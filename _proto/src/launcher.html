<style>

<h1>launcher</h1>
<figure class="code src-file" data-path="examples/launcher/launcher.zig" data-lines="181"><figcaption><span>examples/launcher/launcher.zig</span><span>181 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! launcher - the flagship multi-app switcher. Hosts many full example apps</span>
<span class="tok-comment">//! (each self-contained: its own shaders/fonts/State, isolated leak-checking</span>
<span class="tok-comment">//! allocator) and shows ONE at a time full-screen via z.Launcher. A switch pill</span>
<span class="tok-comment">//! (&lt; prev, a dot per app, &gt; next) cycles between apps on tap.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Children are added with addDeferred (LAZY): only the shown app is initialized,</span>
<span class="tok-comment">//! on the frame it's first switched to - so booting many apps (incl. a 6MB</span>
<span class="tok-comment">//! helmet) stays light. The contract is uniform: a child draws its scene + its</span>
<span class="tok-comment">//! own UI and NEVER calls endDrawing - the runner owns frame begin/end, and the</span>
<span class="tok-comment">//! launcher composes this pill on top in the same frame. App.endDrawing asserts</span>
<span class="tok-comment">//! if a child violates that (see Launcher.tickFullscreen).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Why fullscreen (not a placement rect): pushViewport remaps RENDERING but not</span>
<span class="tok-comment">//! INPUT, so an offset child's own touch UI (physics orbit, showcase tabs) would</span>
<span class="tok-comment">//! mis-hit. Fullscreen keeps each child's input space identical to standalone. On</span>
<span class="tok-comment">//! a switch tap we change the index and SKIP the child that frame, so the tap</span>
<span class="tok-comment">//! can't bleed into the incoming app.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> vec2 = zm.vec2;

<span class="tok-comment">// The flagship roster. Order = switch order. A broad tour of the engine: 3D PBR,</span>
<span class="tok-comment">// full UI, physics, robot dynamics with a live MPC planner, two CPU-vs-GPU</span>
<span class="tok-comment">// side-by-sides, 2D/3D plots, two GPU fluids, a warp starfield, switchable 2D</span>
<span class="tok-comment">// post-fx, and fractals.</span>
<span class="tok-kw">const</span> flagships = [_]z.AppVtable{
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_helmet_sw"</span>).app), <span class="tok-comment">// CPU vs GPU PBR helmet</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_bone_socket"</span>).app), <span class="tok-comment">// rigged character, skeletal animation + socketed sword</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_shadowmap_sw"</span>).app), <span class="tok-comment">// CPU vs GPU vs comptime shadow map</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_decals"</span>).app), <span class="tok-comment">// projected decals onto geometry</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_deferred_render"</span>).app), <span class="tok-comment">// MRT G-buffer deferred rendering</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_cel_shading"</span>).app), <span class="tok-comment">// toon/cel shading</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_fog_rendering"</span>).app), <span class="tok-comment">// distance fog</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_hybrid_render"</span>).app), <span class="tok-comment">// raster cubes + raymarched metaballs</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_textures_background_scrolling"</span>).app), <span class="tok-comment">// parallax scrolling layers</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_ui_full_showcase"</span>).app), <span class="tok-comment">// full imgui-style UI</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_zimrphysics_demo"</span>).app), <span class="tok-comment">// Jolt physics scenes</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_zimrphysics2d_demo"</span>).app), <span class="tok-comment">// box2d 2D physics scenes</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_mpc_cartpole"</span>).app), <span class="tok-comment">// MPC: a cartpole planning its own swing-up</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_mandel_sidebyside"</span>).app), <span class="tok-comment">// CPU vs GPU mandelbrot</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_rt_sidebyside"</span>).app), <span class="tok-comment">// CPU vs GPU ray tracer</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_plot_demo"</span>).app), <span class="tok-comment">// 2D plotting</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_plot3d_demo"</span>).app), <span class="tok-comment">// 3D plotting</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_sph_fluid_2d"</span>).app), <span class="tok-comment">// GPU SPH fluid</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_fluid_sort"</span>).app), <span class="tok-comment">// GPU SPH fluid (sorted grid)</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_four_ways"</span>).app),
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_worker_png"</span>).app), <span class="tok-comment">// PNG encode on a Web Worker (off the main thread)</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_mandel_julia"</span>).app), <span class="tok-comment">// fractal explorer</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_waving_cubes"</span>).app), <span class="tok-comment">// animated HSV cube field</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_tic_tac_toe"</span>).app), <span class="tok-comment">// two-player tic tac toe, plain 2D shapes</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_langton_ant"</span>).app), <span class="tok-comment">// Langtons ant with pan/zoom + turn trail</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_snake"</span>).app), <span class="tok-comment">// snake: eat dots to grow, keyboard + swipe</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_fps_playground"</span>).app), <span class="tok-comment">// first-person physics: walk + jump on cubes</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_starfield"</span>).app), <span class="tok-comment">// warp-speed starfield</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_shader_effects"</span>).app), <span class="tok-comment">// switchable 2D post-fx</span>
    <span class="tok-comment">// * A Go1 with a procedurally spliced arm: the torso weaves through three incommensurate</span>
    <span class="tok-comment">// frequencies while the gripper holds a point that travels with the feet. Reports its own</span>
    <span class="tok-comment">// attitude error, gripper drift, foot slip and friction-cone occupancy.</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_quadruped"</span>).app), <span class="tok-comment">// articulated robot: gimbal + contact readouts</span>
    z.<span class="tok-fn">eraseApp</span>(<span class="tok-builtin">@import</span>(<span class="tok-str">"ex_gallery_all"</span>).app), <span class="tok-comment">// 2x2 grid of 4 mini-apps (launcher-in-launcher!)</span>
};
<span class="tok-kw">const</span> n_apps = flagships.len;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> std_options = z.std_options;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    launcher: z.Launcher,
    ids: [n_apps]z.ChildId,
    active: usize,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    _ = f;
    <span class="tok-comment">// Build the Launcher straight into its final home and register children on</span>
    <span class="tok-comment">// it there - no local `var launcher` that gets copied into the slot. `.ids`</span>
    <span class="tok-comment">// is filled by the loop below (still exhaustive: the field is written here).</span>
    s.* = .{ .launcher = z.Launcher.<span class="tok-fn">init</span>(gpa), .ids = undefined, .active = <span class="tok-num">0</span> };
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (flagships, <span class="tok-num">0</span>..) |vt, i| {
        s.ids[i] = <span class="tok-kw">try</span> s.launcher.<span class="tok-fn">addDeferred</span>(vt); <span class="tok-comment">// lazy: init happens on first show</span>
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    _ = gpa;
    s.launcher.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">const</span> zone_w: f32 = <span class="tok-num">42</span>; <span class="tok-comment">// width of each tap zone (prev on the left, next on the right)</span>

<span class="tok-kw">fn</span> <span class="tok-fn">drawPill</span>(
    f: *z.Frame,
    x: f32,
    y: f32,
    w: f32,
    h: f32,
    active: usize,
) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> };
    gl.<span class="tok-fn">rect</span>(.{ .x = x, .y = y, .width = w, .height = h }, .{ .color = .{ .r = <span class="tok-num">24</span>, .g = <span class="tok-num">26</span>, .b = <span class="tok-num">34</span>, .a = <span class="tok-num">225</span> } });

    <span class="tok-kw">const</span> cy: f32 = y + h * <span class="tok-num">0.5</span>;

    <span class="tok-comment">// &lt; prev chevron (apex left), left zone.</span>
    gl.<span class="tok-fn">triangle</span>(<span class="tok-fn">vec2</span>(x + <span class="tok-num">18</span>, cy - <span class="tok-num">7</span>), <span class="tok-fn">vec2</span>(x + <span class="tok-num">18</span>, cy + <span class="tok-num">7</span>), <span class="tok-fn">vec2</span>(x + <span class="tok-num">8</span>, cy), .{ .color = white });
    <span class="tok-comment">// &gt; next chevron (apex right), right zone.</span>
    gl.<span class="tok-fn">triangle</span>(<span class="tok-fn">vec2</span>(x + w - <span class="tok-num">18</span>, cy - <span class="tok-num">7</span>), <span class="tok-fn">vec2</span>(x + w - <span class="tok-num">18</span>, cy + <span class="tok-num">7</span>), <span class="tok-fn">vec2</span>(x + w - <span class="tok-num">8</span>, cy), .{ .color = white });

    <span class="tok-comment">// One dot per app between the chevrons; the active one is bright.</span>
    <span class="tok-kw">const</span> spacing: f32 = <span class="tok-num">11</span>;
    <span class="tok-kw">const</span> start_x: f32 = x + <span class="tok-num">44</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n_apps) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> dx: f32 = start_x + spacing * <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> col: Color = <span class="tok-kw">if</span> (i == active)
            white
        <span class="tok-kw">else</span>
            .{ .r = <span class="tok-num">84</span>, .g = <span class="tok-num">90</span>, .b = <span class="tok-num">104</span>, .a = <span class="tok-num">255</span> };
        gl.<span class="tok-fn">circle</span>(.{ dx, cy }, <span class="tok-num">3</span>, .{ .color = col, .segments = <span class="tok-num">12</span> });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-comment">// Switch pill: &lt; [dot per app] &gt;. Centered, raised above the bottom edge so</span>
    <span class="tok-comment">// it clears bottom-corner content (insets, logs).</span>
    <span class="tok-kw">const</span> spacing: f32 = <span class="tok-num">11</span>;
    <span class="tok-kw">const</span> n_f: f32 = <span class="tok-fn">float</span>(n_apps);
    <span class="tok-kw">const</span> pill_w: f32 = <span class="tok-num">80</span> + spacing * (n_f - <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> pill_h: f32 = <span class="tok-num">34</span>;
    <span class="tok-kw">const</span> px: f32 = (w - pill_w) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> py: f32 = h - pill_h - <span class="tok-num">56</span>;

    <span class="tok-comment">// Hit-test BEFORE ticking the child so a switch tap is consumed here and</span>
    <span class="tok-comment">// can't reach the (incoming) app the same frame. Left zone = prev, right = next.</span>
    <span class="tok-kw">const</span> m: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> in_y: bool = m[<span class="tok-num">1</span>] &gt;= py <span class="tok-kw">and</span> m[<span class="tok-num">1</span>] &lt;= py + pill_h;
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left) <span class="tok-kw">and</span> in_y) {
        <span class="tok-kw">if</span> (m[<span class="tok-num">0</span>] &gt;= px <span class="tok-kw">and</span> m[<span class="tok-num">0</span>] &lt; px + zone_w) {
            s.active = (s.active + n_apps - <span class="tok-num">1</span>) % n_apps;
            <span class="tok-fn">drawPill</span>(f, px, py, pill_w, pill_h, s.active);
            <span class="tok-kw">return</span>;
        }
        <span class="tok-kw">if</span> (m[<span class="tok-num">0</span>] &gt; px + pill_w - zone_w <span class="tok-kw">and</span> m[<span class="tok-num">0</span>] &lt;= px + pill_w) {
            s.active = (s.active + <span class="tok-num">1</span>) % n_apps;
            <span class="tok-fn">drawPill</span>(f, px, py, pill_w, pill_h, s.active);
            <span class="tok-kw">return</span>;
        }
    }

    s.launcher.<span class="tok-fn">tickFullscreen</span>(f, s.ids[s.active]);
    <span class="tok-fn">drawPill</span>(f, px, py, pill_w, pill_h, s.active);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    <span class="tok-comment">// Multi-example host: it drives dozens of hosted example lifecycles, so a</span>
    <span class="tok-comment">// single leak-tight deinit isn't meaningful - opt out of the managed gate.</span>
    .memory = .managed,
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - launcher"</span>,
            .width = <span class="tok-num">480</span>,
            .height = <span class="tok-num">320</span>,
            .scale_mode = .responsive,
            <span class="tok-comment">// The 3D children (helmet, physics, plot3d, ...) need a depth</span>
            <span class="tok-comment">// attachment; the launcher owns the frame, so its config governs.</span>
            .depth_format = .depth24_plus,
            .clear = .{ .r = <span class="tok-num">10.0</span> / <span class="tok-num">255.0</span>, .g = <span class="tok-num">12.0</span> / <span class="tok-num">255.0</span>, .b = <span class="tok-num">18.0</span> / <span class="tok-num">255.0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
};

<figure class="code src-file" data-path="examples/launcher/kernels.zig" data-lines="54"><figcaption><span>examples/launcher/kernels.zig</span><span>54 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/launcher/kernels.zig - ONE kernel wasm for a page that bundles many examples.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A page carries exactly one `ZIMR_KERNEL_WASM`. The launcher carries a dozen examples, two</span>
<span class="tok-comment">//! of which have job kernels - so its kernel wasm has to serve both at once.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! It can, and cheaply, because the wasm exports are keyed by NAME (`zimr_job_encodePng`,</span>
<span class="tok-comment">//! `zimr_job_mandel`) rather than by an index or a hash. A merged wasm exports a SUPERSET of</span>
<span class="tok-comment">//! the names, so each example's `submit` finds its own kernel and nobody renumbers anything.</span>
<span class="tok-comment">//! Had the design kept a hashed dispatch table, merging two registries would have meant</span>
<span class="tok-comment">//! merging two id spaces - and this file could not exist.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The table below is written by hand rather than concatenated with `++`, and that is a</span>
<span class="tok-comment">//! limitation of the Zig, not the design: every kernel carries its own header type in its</span>
<span class="tok-comment">//! signature (`Size` for the encoder, `JobHeader(M)` for the kompute one), so `++` on two</span>
<span class="tok-comment">//! kernel TABLES has no common element type. Tuples would concatenate - but this Zig</span>
<span class="tok-comment">//! (0.17.0-dev.1282) has no `@Type`, no `std.meta.Tuple`, and `@Struct` with numeric field</span>
<span class="tok-comment">//! names yields something that does not support indexing. Two entries are cheap to write out;</span>
<span class="tok-comment">//! when the language grows the tuple back, this becomes `a.job_kernels ++ b.job_kernels`.</span>
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> jobs = z.jobs;

<span class="tok-comment">/// The examples on the launcher that have job kernels.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `four_ways` is the interesting one: it is the only example with BOTH `compute_kernels` and</span>
<span class="tok-comment">/// `job_kernels`, and for a long time it could not be here at all. Not because of anything to</span>
<span class="tok-comment">/// do with jobs - because `wireComputeKernels` minted a FRESH `kompute` module per example.</span>
<span class="tok-comment">/// One compute example per page hid that completely. Two of them on one page (which is what a</span>
<span class="tok-comment">/// launcher IS) gave Zig two distinct modules rooted at the same `src/kompute.zig`, so it</span>
<span class="tok-comment">/// renamed the second to `kompute0` and then refused the file for belonging to both. The error</span>
<span class="tok-comment">/// it printed named `escape_kernel.zig`, which is the import that tripped over it - not the</span>
<span class="tok-comment">/// cause. The build now shares one kompute module, and the cap is gone.</span>
<span class="tok-kw">const</span> png = <span class="tok-builtin">@import</span>(<span class="tok-str">"k_worker_png"</span>);
<span class="tok-kw">const</span> four = <span class="tok-builtin">@import</span>(<span class="tok-str">"k_four_ways"</span>);

<span class="tok-comment">/// The merged table.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `four_ways`' entry is DERIVED: `komputeKernel(module, "mandel")` builds the job wrapper and</span>
<span class="tok-comment">/// its header type from the kompute module itself, so the same Zig function that runs on the</span>
<span class="tok-comment">/// GPU as a compute shader runs here as a worker job, and neither spelling can drift from the</span>
<span class="tok-comment">/// other.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> job_kernels = .{
    .{ <span class="tok-str">"encodePng"</span>, png.encodePng },
    .{ <span class="tok-str">"mandel"</span>, z.<span class="tok-fn">komputeKernel</span>(four.module, <span class="tok-str">"mandel"</span>) },
};

<span class="tok-comment">/// The bounds are the MAX over the members: one buffer serves every kernel on the page, so it</span>
<span class="tok-comment">/// has to fit the largest input and the largest output any of them can present. A `max_input`</span>
<span class="tok-comment">/// that is too small does not fail loudly at build time - it fails as `Error.InputTooLarge` on</span>
<span class="tok-comment">/// a phone, which is exactly the kind of thing this should not be guessing at.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> registry = jobs.<span class="tok-fn">Registry</span>(job_kernels, .{
    .max_input = <span class="tok-builtin">@max</span>(png.registry.max_input, four.registry.max_input),
    .max_output = <span class="tok-builtin">@max</span>(png.registry.max_output, four.registry.max_output),
});
