<span class="tok-comment">//! chaos for ~10,000 steps and then, astonishingly, builds a repeating diagonal</span>
<span class="tok-comment">//! "highway" forever. The whole rule is four lines: on a white cell turn right, on</span>
<span class="tok-comment">//! a black cell turn left; flip the cell you leave; step forward one square.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! To make the rule legible we draw the last ten TURNS as a red polyline with a</span>
<span class="tok-comment">//! little L/R glyph at each turn, so you can read "white here, so it turned right"</span>
<span class="tok-comment">//! straight off the screen. Pan and zoom (mouse wheel + drag, or pinch + drag on a</span>
<span class="tok-comment">//! phone) to follow the ant in close, and slow the speed right down to watch one</span>
<span class="tok-comment">//! move at a time.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Controls:</span>
<span class="tok-comment">//!   space            pause / resume</span>
<span class="tok-comment">//!   . or right       single step (while paused)</span>
<span class="tok-comment">//!   1-9              speed: steps taken per frame</span>
<span class="tok-comment">//!   f                toggle follow-the-ant camera</span>
<span class="tok-comment">//!   r                reset</span>
<span class="tok-comment">//!   wheel / +  -     zoom     |   left-drag or pinch   zoom &amp; pan</span>

<span class="tok-comment">/// phones with no keyboard, so every action needs a tappable target).</span>

    scratch: std.heap.ArenaAllocator,
    gestures: z.GesturesState = .{},

    <span class="tok-comment">/// The board: false = black, true = white. Everything starts white.</span>
    cells: [grid_w * grid_h]bool = <span class="tok-builtin">@splat</span>(true),
    ant_x: i32 = grid_w / <span class="tok-num">2</span>,
    ant_y: i32 = grid_h / <span class="tok-num">2</span>,
    dir: Dir = .up,
    steps: u64 = <span class="tok-num">0</span>,

    <span class="tok-comment">/// The ant's last `path_len` footsteps, as an adjacent chain -&gt; a clean red</span>
    <span class="tok-comment">/// polyline (consecutive cells always touch, so it never jumps across the</span>
    <span class="tok-comment">/// board the way connecting scattered turn-cells did). Ring buffer.</span>
    path: [path_len]Turn = <span class="tok-builtin">@splat</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .right = false }),
    path_head: usize = <span class="tok-num">0</span>,
    path_n: usize = <span class="tok-num">0</span>,

    paused: bool = true,
    <span class="tok-comment">/// Simulation rate in steps per second. Below ~60 this is driven by a time</span>
    <span class="tok-comment">/// accumulator so a slow rate is genuinely slow (1 = one step every second);</span>
    <span class="tok-comment">/// above 60 we run several steps per frame. Ranges 1 .. 4096.</span>
    steps_per_sec: f32 = <span class="tok-num">1</span>,
    <span class="tok-comment">/// Seconds owed toward the next step, for the slow (sub-60/s) regime.</span>
    step_accum: f64 = <span class="tok-num">0</span>,

    <span class="tok-comment">/// Camera: which cell sits at the screen centre, and pixels per cell.</span>
    cam_x: f32 = grid_w / <span class="tok-num">2</span>,
    cam_y: f32 = grid_h / <span class="tok-num">2</span>,
    zoom: f32 = <span class="tok-num">6.0</span>,
    follow: bool = true,

    <span class="tok-comment">/// Drag-pan bookkeeping. We anchor the world (cell) point grabbed at press and</span>
    <span class="tok-comment">/// hold it under the cursor every frame -- absolute, so it can't drift, the way</span>
    <span class="tok-comment">/// mandel_sidebyside does it. Incremental `cam -= delta/zoom` was the broken</span>
    <span class="tok-comment">/// version.</span>
    dragging: bool = false,
    drag_anchor: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },

    <span class="tok-kw">fn</span> <span class="tok-fn">cell</span>(self: *<span class="tok-kw">const</span> State, x: i32, y: i32) bool {
        <span class="tok-kw">return</span> self.cells[<span class="tok-builtin">@intCast</span>(y * grid_w + x)];
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">setCell</span>(self: *State, x: i32, y: i32, v: bool) void {
        self.cells[<span class="tok-builtin">@intCast</span>(y * grid_w + x)] = v;
    }
};

<span class="tok-comment">/// Push into a fixed ring buffer: writes at head, advances, grows n up to cap.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">ringPush</span>(
    <span class="tok-kw">comptime</span> cap: usize,
    buf: *[cap]Turn,
    head: *usize,
    n: *usize,
    t: Turn,
) void {
    buf[head.*] = t;
    head.* = (head.* + <span class="tok-num">1</span>) % cap;
    <span class="tok-kw">if</span> (n.* &lt; cap) {
        n.* += <span class="tok-num">1</span>;
    }
}

<span class="tok-comment">/// One move of the ant, i.e. the entire simulation.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">step</span>(s: *State) void {
    <span class="tok-kw">const</span> on_white: bool = s.<span class="tok-fn">cell</span>(s.ant_x, s.ant_y);
    s.dir = <span class="tok-kw">if</span> (on_white) s.dir.<span class="tok-fn">turnRight</span>() <span class="tok-kw">else</span> s.dir.<span class="tok-fn">turnLeft</span>();
    s.<span class="tok-fn">setCell</span>(s.ant_x, s.ant_y, !on_white);

    <span class="tok-comment">// Record the cell the ant is standing on as a footstep (for the connected</span>
    <span class="tok-comment">// trail line) and as a turn (for the L/R glyph). Footsteps are consecutive</span>
    <span class="tok-comment">// cells, so the line through them is always a clean adjacent path.</span>
    <span class="tok-kw">const</span> here: Turn = .{ .x = s.ant_x, .y = s.ant_y, .right = on_white };
    <span class="tok-fn">ringPush</span>(path_len, &amp;s.path, &amp;s.path_head, &amp;s.path_n, here);

    <span class="tok-kw">switch</span> (s.dir) {
        .up =&gt; s.ant_y -= <span class="tok-num">1</span>,
        .right =&gt; s.ant_x += <span class="tok-num">1</span>,
        .down =&gt; s.ant_y += <span class="tok-num">1</span>,
        .left =&gt; s.ant_x -= <span class="tok-num">1</span>,
    }
    <span class="tok-comment">// Wrap at the edges so it runs forever.</span>
    s.ant_x = <span class="tok-builtin">@mod</span>(s.ant_x, grid_w);
    s.ant_y = <span class="tok-builtin">@mod</span>(s.ant_y, grid_h);
    s.steps += <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">reset</span>(s: *State) void {
    s.cells = <span class="tok-builtin">@splat</span>(true);
    s.ant_x = grid_w / <span class="tok-num">2</span>;
    s.ant_y = grid_h / <span class="tok-num">2</span>;
    s.dir = .up;
    s.steps = <span class="tok-num">0</span>;
    s.path_n = <span class="tok-num">0</span>;
    s.path_head = <span class="tok-num">0</span>;
    s.cam_x = grid_w / <span class="tok-num">2</span>;
    s.cam_y = grid_h / <span class="tok-num">2</span>;
    s.follow = true;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>),
        .scratch = std.heap.ArenaAllocator.<span class="tok-fn">init</span>(gpa),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.scratch.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Floor a coordinate to an i32 cell index (the visible-window maths needs ints).</span>
<span class="tok-comment">/// @trunc would round toward zero, which differs from floor for the negative</span>
<span class="tok-comment">/// coordinates the camera can reach, so we floor first then convert.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">floorToInt</span>(v: f32) i32 {
    <span class="tok-comment">// lint:off int-from-float: floor semantics are intentional here, not @trunc</span>
    <span class="tok-kw">return</span> <span class="tok-builtin">@intFromFloat</span>(<span class="tok-builtin">@floor</span>(v));
}

<span class="tok-comment">/// The on-screen control bar: a row of buttons across the bottom. Returns the rect</span>
<span class="tok-comment">/// for button `i` of `count`, sized to the window so it works at any size.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">barButton</span>(f: *z.Frame, i: usize, count: usize) Rect {
    <span class="tok-kw">const</span> sw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> sh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> pad: f32 = <span class="tok-num">8.0</span>;
    <span class="tok-kw">const</span> h: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">40.0</span>, sh * <span class="tok-num">0.09</span>);
    <span class="tok-kw">const</span> total_w: f32 = sw - pad * <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> w: f32 = (total_w - pad * (<span class="tok-fn">float</span>(count) - <span class="tok-num">1.0</span>)) / <span class="tok-fn">float</span>(count);
    <span class="tok-kw">return</span> .{
        .x = pad + <span class="tok-fn">float</span>(i) * (w + pad),
        .y = sh - h - pad,
        .w = w,
        .h = h,
    };
}

<span class="tok-comment">/// Draw one button and report whether it was tapped this frame.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">button</span>(
    f: *z.Frame,
    s: *State,
    r: Rect,
    label: []<span class="tok-kw">const</span> u8,
    tap: ?Vec2,
) bool {
    <span class="tok-kw">const</span> hot: bool = <span class="tok-kw">if</span> (tap) |p| r.<span class="tok-fn">contains</span>(p) <span class="tok-kw">else</span> false;
    f.gl.<span class="tok-fn">rect</span>(.{ .x = r.x, .y = r.y, .width = r.w, .height = r.h }, .{ .color = <span class="tok-kw">if</span> (hot) btn_hot_col <span class="tok-kw">else</span> btn_col });
    <span class="tok-comment">// Centre the label by eye: ~9 px per glyph at size 16.</span>
    <span class="tok-kw">const</span> approx_w: f32 = <span class="tok-fn">float</span>(label.len) * <span class="tok-num">9.0</span>;
    <span class="tok-kw">const</span> tx: f32 = r.x + (r.w - approx_w) / <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> ty: f32 = r.y + r.h / <span class="tok-num">2.0</span> - <span class="tok-num">8.0</span>;
    f.gl.<span class="tok-fn">text</span>(.{ tx, ty }, label, .{ .size = <span class="tok-num">16</span>, .color = btn_txt_col, .font = &amp;s.font });
    <span class="tok-kw">return</span> hot;
}

<span class="tok-comment">/// -1, 0, or +1 as a float, for the sign of an integer delta.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">signf</span>(v: i32) f32 {
    <span class="tok-kw">if</span> (v &gt; <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> <span class="tok-num">1.0</span>;
    }
    <span class="tok-kw">if</span> (v &lt; <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> -<span class="tok-num">1.0</span>;
    }
    <span class="tok-kw">return</span> <span class="tok-num">0.0</span>;
}

<span class="tok-comment">/// Unit step from cell `a` to cell `b` as a direction (-1,0,1 each axis).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">dirBetween</span>(ax: i32, ay: i32, bx: i32, by: i32) Vec2 {
    <span class="tok-kw">return</span> .{ <span class="tok-fn">signf</span>(bx - ax), <span class="tok-fn">signf</span>(by - ay) };
}

<span class="tok-comment">/// Straight half-cell stroke from cell centre `cx,cy` outward (toward=true) or back</span>
<span class="tok-comment">/// (toward=false) along direction `d`. Used for straight-through cells and for the</span>
<span class="tok-comment">/// two half-cells that lead into and out of a rounded corner.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawHalfStep</span>(
    f: *z.Frame,
    s: *State,
    cx: i32,
    cy: i32,
    d: Vec2,
    toward: bool,
    col: Color,
) void {
    <span class="tok-kw">const</span> cxf: f32 = <span class="tok-fn">float</span>(cx) + <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> cyf: f32 = <span class="tok-fn">float</span>(cy) + <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> sign: f32 = <span class="tok-kw">if</span> (toward) <span class="tok-num">0.5</span> <span class="tok-kw">else</span> -<span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> a: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, cxf, cyf);
    <span class="tok-kw">const</span> b: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, cxf + sign * d[<span class="tok-num">0</span>], cyf + sign * d[<span class="tok-num">1</span>]);
    f.gl.<span class="tok-fn">line</span>(a, b, .{ .color = col, .thickness = <span class="tok-num">3.0</span> });
}

<span class="tok-comment">/// Draw a rounded corner as a quarter-arc through cell centre `cx,cy`, tangent to</span>
<span class="tok-comment">/// the incoming (`ind`) and outgoing (`outd`) directions. Centred on the inside</span>
<span class="tok-comment">/// corner `C + 0.5*(outd - ind)`, radius half a cell, swept the short way. Drawn as</span>
<span class="tok-comment">/// our own short polyline (circleSectorLines would add radial cap spokes).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawCornerArc</span>(
    f: *z.Frame,
    s: *State,
    cx: i32,
    cy: i32,
    ind: Vec2,
    outd: Vec2,
    col: Color,
) void {
    <span class="tok-kw">const</span> cxf: f32 = <span class="tok-fn">float</span>(cx) + <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> cyf: f32 = <span class="tok-fn">float</span>(cy) + <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> ox: f32 = cxf + <span class="tok-num">0.5</span> * (outd[<span class="tok-num">0</span>] - ind[<span class="tok-num">0</span>]);
    <span class="tok-kw">const</span> oy: f32 = cyf + <span class="tok-num">0.5</span> * (outd[<span class="tok-num">1</span>] - ind[<span class="tok-num">1</span>]);
    <span class="tok-kw">const</span> entry_ang: f32 = <span class="tok-fn">atan2Rad</span>(cyf - <span class="tok-num">0.5</span> * ind[<span class="tok-num">1</span>] - oy, cxf - <span class="tok-num">0.5</span> * ind[<span class="tok-num">0</span>] - ox);
    <span class="tok-kw">const</span> exit_ang: f32 = <span class="tok-fn">atan2Rad</span>(cyf + <span class="tok-num">0.5</span> * outd[<span class="tok-num">1</span>] - oy, cxf + <span class="tok-num">0.5</span> * outd[<span class="tok-num">0</span>] - ox);
    <span class="tok-kw">var</span> sweep: f32 = exit_ang - entry_ang;
    <span class="tok-kw">while</span> (sweep &gt; zm.pi) {
        sweep -= tau;
    }
    <span class="tok-kw">while</span> (sweep &lt; -zm.pi) {
        sweep += tau;
    }

    <span class="tok-kw">const</span> segs: usize = <span class="tok-num">8</span>;
    <span class="tok-kw">var</span> prev_pt: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, ox + <span class="tok-num">0.5</span> * <span class="tok-builtin">@cos</span>(entry_ang), oy + <span class="tok-num">0.5</span> * <span class="tok-builtin">@sin</span>(entry_ang));
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (i &lt;= segs) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> frac: f32 = <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(i))) / <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(segs)));
        <span class="tok-kw">const</span> a: f32 = entry_ang + sweep * frac;
        <span class="tok-kw">const</span> pt: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, ox + <span class="tok-num">0.5</span> * <span class="tok-builtin">@cos</span>(a), oy + <span class="tok-num">0.5</span> * <span class="tok-builtin">@sin</span>(a));
        f.gl.<span class="tok-fn">line</span>(prev_pt, pt, .{ .color = col, .thickness = <span class="tok-num">3.0</span> });
        prev_pt = pt;
    }
}

<span class="tok-comment">/// Cell coordinates -&gt; screen pixels, through the camera.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">worldToScreen</span>(s: *<span class="tok-kw">const</span> State, f: *z.Frame, cx: f32, cy: f32) Vec2 {
    <span class="tok-kw">const</span> sw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> sh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">return</span> .{
        sw / <span class="tok-num">2.0</span> + (cx - s.cam_x) * s.zoom,
        sh / <span class="tok-num">2.0</span> + (cy - s.cam_y) * s.zoom,
    };
}

<span class="tok-comment">/// Screen pixels -&gt; cell coordinates: the exact inverse of worldToScreen. Pan and</span>
<span class="tok-comment">/// zoom both work by holding a screen point's world position fixed, so they need</span>
<span class="tok-comment">/// this. Getting it wrong (or out of sync with worldToScreen) is what makes pan</span>
<span class="tok-comment">/// drift or run backwards.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">screenToWorld</span>(s: *<span class="tok-kw">const</span> State, f: *z.Frame, p: Vec2) Vec2 {
    <span class="tok-kw">const</span> sw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> sh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">return</span> .{
        s.cam_x + (p[<span class="tok-num">0</span>] - sw / <span class="tok-num">2.0</span>) / s.zoom,
        s.cam_y + (p[<span class="tok-num">1</span>] - sh / <span class="tok-num">2.0</span>) / s.zoom,
    };
}

<span class="tok-comment">/// Apply a zoom factor while holding the world point under `focus` fixed on</span>
<span class="tok-comment">/// screen. Same shape as mandel_sidebyside: read the world point before, scale,</span>
<span class="tok-comment">/// read it after, shift the camera by the difference.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">zoomAbout</span>(s: *State, f: *z.Frame, factor: f32, focus: Vec2) void {
    <span class="tok-kw">const</span> before: Vec2 = <span class="tok-fn">screenToWorld</span>(s, f, focus);
    s.zoom = <span class="tok-fn">clamp</span>(s.zoom * factor, <span class="tok-num">1.0</span>, <span class="tok-num">40.0</span>);
    <span class="tok-kw">const</span> after: Vec2 = <span class="tok-fn">screenToWorld</span>(s, f, focus);
    s.cam_x += before[<span class="tok-num">0</span>] - after[<span class="tok-num">0</span>];
    s.cam_y += before[<span class="tok-num">1</span>] - after[<span class="tok-num">1</span>];
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// Keyboard (desktop). Harmless on a phone, which has none -- the on-screen</span>
    <span class="tok-comment">// buttons in update() cover the same actions.</span>
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .space)) {
        s.paused = !s.paused;
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .r)) {
        <span class="tok-fn">reset</span>(s);
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .f)) {
        s.follow = !s.follow;
    }
    <span class="tok-kw">if</span> (s.paused <span class="tok-kw">and</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .period) <span class="tok-kw">or</span> z.<span class="tok-fn">isKeyPressed</span>(f.input, .right))) {
        <span class="tok-fn">step</span>(s);
    }
    <span class="tok-kw">const</span> digits = [_]z.KeyboardKey{ .one, .two, .three, .four, .five, .six, .seven, .eight, .nine };
    <span class="tok-kw">const</span> rate_ladder = [_]f32{ <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">5</span>, <span class="tok-num">10</span>, <span class="tok-num">30</span>, <span class="tok-num">60</span>, <span class="tok-num">240</span>, <span class="tok-num">1000</span>, <span class="tok-num">4000</span> };
    <span class="tok-kw">for</span> (digits, <span class="tok-num">0</span>..) |k, n| {
        <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, k)) {
            s.steps_per_sec = rate_ladder[n];
        }
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .equal)) {
        <span class="tok-fn">zoomAbout</span>(s, f, <span class="tok-num">1.15</span>, .{ f.window.<span class="tok-fn">widthf</span>() / <span class="tok-num">2.0</span>, f.window.<span class="tok-fn">heightf</span>() / <span class="tok-num">2.0</span> });
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .minus)) {
        <span class="tok-fn">zoomAbout</span>(s, f, <span class="tok-num">1.0</span> / <span class="tok-num">1.15</span>, .{ f.window.<span class="tok-fn">widthf</span>() / <span class="tok-num">2.0</span>, f.window.<span class="tok-fn">heightf</span>() / <span class="tok-num">2.0</span> });
    }

    <span class="tok-comment">// Mouse wheel zoom about the cursor (desktop).</span>
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span>) {
        s.follow = false;
        <span class="tok-fn">zoomAbout</span>(s, f, <span class="tok-kw">if</span> (wheel &gt; <span class="tok-num">0</span>) <span class="tok-num">1.15</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span> / <span class="tok-num">1.15</span>, z.<span class="tok-fn">getMousePosition</span>(f.input));
    }

    <span class="tok-comment">// ---- Touch camera, mirroring mandel_sidebyside ----------------------------</span>
    z.<span class="tok-fn">updateGestures</span>(&amp;s.gestures, f.input, f.time);
    <span class="tok-kw">const</span> mouse: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> touch_count: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);

    <span class="tok-comment">// Two-finger pinch: scale about the midpoint, and pan by the midpoint's motion.</span>
    <span class="tok-kw">if</span> (touch_count &gt;= <span class="tok-num">2</span>) {
        s.dragging = false; <span class="tok-comment">// pinch wins over drag</span>
        s.follow = false;
        <span class="tok-kw">const</span> scale: f32 = z.<span class="tok-fn">getGesturePinchScale</span>(&amp;s.gestures);
        <span class="tok-kw">if</span> (scale &gt; <span class="tok-num">0</span> <span class="tok-kw">and</span> scale != <span class="tok-num">1.0</span>) {
            <span class="tok-fn">zoomAbout</span>(s, f, scale, z.<span class="tok-fn">getGesturePinchMid</span>(&amp;s.gestures));
            <span class="tok-comment">// Pan by the midpoint's screen motion, converted to cell units.</span>
            <span class="tok-kw">const</span> md: Vec2 = z.<span class="tok-fn">getGesturePinchMidDelta</span>(&amp;s.gestures);
            s.cam_x -= md[<span class="tok-num">0</span>] / s.zoom;
            s.cam_y -= md[<span class="tok-num">1</span>] / s.zoom;
        }
        <span class="tok-kw">return</span>;
    }

    <span class="tok-comment">// One-finger / mouse drag to pan: anchor the world point grabbed at press and</span>
    <span class="tok-comment">// keep it under the cursor. Absolute, so it never drifts. Taps on the control</span>
    <span class="tok-comment">// bar are not drags.</span>
    <span class="tok-kw">const</span> on_bar: bool = mouse[<span class="tok-num">1</span>] &gt; f.window.<span class="tok-fn">heightf</span>() - <span class="tok-builtin">@max</span>(<span class="tok-num">40.0</span>, f.window.<span class="tok-fn">heightf</span>() * <span class="tok-num">0.09</span>) - <span class="tok-num">16.0</span>;
    <span class="tok-kw">const</span> pressed: bool = z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !on_bar;
    <span class="tok-kw">if</span> (pressed <span class="tok-kw">and</span> !s.dragging) {
        s.dragging = true;
        s.follow = false;
        s.drag_anchor = <span class="tok-fn">screenToWorld</span>(s, f, mouse);
    }
    <span class="tok-kw">if</span> (!pressed) {
        s.dragging = false;
    }
    <span class="tok-kw">if</span> (s.dragging <span class="tok-kw">and</span> pressed) {
        <span class="tok-comment">// center = anchor - offset/zoom, on both axes (symmetric, so neither pans</span>
        <span class="tok-comment">// backwards). This holds drag_anchor exactly under the cursor.</span>
        <span class="tok-kw">const</span> sw: f32 = f.window.<span class="tok-fn">widthf</span>();
        <span class="tok-kw">const</span> sh: f32 = f.window.<span class="tok-fn">heightf</span>();
        s.cam_x = s.drag_anchor[<span class="tok-num">0</span>] - (mouse[<span class="tok-num">0</span>] - sw / <span class="tok-num">2.0</span>) / s.zoom;
        s.cam_y = s.drag_anchor[<span class="tok-num">1</span>] - (mouse[<span class="tok-num">1</span>] - sh / <span class="tok-num">2.0</span>) / s.zoom;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    _ = s.scratch.<span class="tok-fn">reset</span>(.retain_capacity);
    <span class="tok-kw">const</span> arena: Allocator = s.scratch.<span class="tok-fn">allocator</span>();

    <span class="tok-fn">handleInput</span>(f, s);

    <span class="tok-comment">// Advance the simulation by real elapsed time, so the rate means the same</span>
    <span class="tok-comment">// thing regardless of frame rate. At 1 step/s this fires once a second; at a</span>
    <span class="tok-comment">// high rate it runs many steps per frame. Capped so a big rate or a long gap</span>
    <span class="tok-comment">// (e.g. tab was backgrounded) can't stall the frame.</span>
    <span class="tok-kw">const</span> dt: f64 = f.time.delta_time;
    <span class="tok-kw">if</span> (!s.paused) {
        s.step_accum += dt * <span class="tok-builtin">@as</span>(f64, s.steps_per_sec);
        <span class="tok-kw">var</span> budget: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (s.step_accum &gt;= <span class="tok-num">1.0</span> <span class="tok-kw">and</span> budget &lt; <span class="tok-num">4096</span>) : (budget += <span class="tok-num">1</span>) {
            <span class="tok-fn">step</span>(s);
            s.step_accum -= <span class="tok-num">1.0</span>;
        }
    } <span class="tok-kw">else</span> {
        s.step_accum = <span class="tok-num">0</span>;
    }

    <span class="tok-kw">if</span> (s.follow) {
        <span class="tok-comment">// Ease the camera toward the ant.</span>
        s.cam_x += (<span class="tok-fn">float</span>(s.ant_x) - s.cam_x) * <span class="tok-num">0.1</span>;
        s.cam_y += (<span class="tok-fn">float</span>(s.ant_y) - s.cam_y) * <span class="tok-num">0.1</span>;
    }

    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    f.gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = f.window.<span class="tok-fn">widthf</span>(), .height = f.window.<span class="tok-fn">heightf</span>() }, .{ .color = bg_col });

    <span class="tok-comment">// Only the black cells need drawing (white is the background board colour). We</span>
    <span class="tok-comment">// walk the visible window of the grid, not all 40k cells.</span>
    <span class="tok-kw">const</span> sw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> sh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> half_cols: f32 = (sw / <span class="tok-num">2.0</span>) / s.zoom + <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> half_rows: f32 = (sh / <span class="tok-num">2.0</span>) / s.zoom + <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> x0: i32 = <span class="tok-builtin">@max</span>(<span class="tok-num">0</span>, <span class="tok-fn">floorToInt</span>(s.cam_x - half_cols));
    <span class="tok-kw">const</span> x1: i32 = <span class="tok-builtin">@min</span>(grid_w, <span class="tok-fn">floorToInt</span>(s.cam_x + half_cols) + <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> y0: i32 = <span class="tok-builtin">@max</span>(<span class="tok-num">0</span>, <span class="tok-fn">floorToInt</span>(s.cam_y - half_rows));
    <span class="tok-kw">const</span> y1: i32 = <span class="tok-builtin">@min</span>(grid_h, <span class="tok-fn">floorToInt</span>(s.cam_y + half_rows) + <span class="tok-num">1</span>);

    <span class="tok-kw">var</span> yy: i32 = y0;
    <span class="tok-kw">while</span> (yy &lt; y1) : (yy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> xx: i32 = x0;
        <span class="tok-kw">while</span> (xx &lt; x1) : (xx += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (s.<span class="tok-fn">cell</span>(xx, yy)) {
                <span class="tok-kw">continue</span>; <span class="tok-comment">// white == background</span>
            }
            <span class="tok-kw">const</span> p: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, <span class="tok-builtin">@floatFromInt</span>(xx), <span class="tok-builtin">@floatFromInt</span>(yy));
            f.gl.<span class="tok-fn">rect</span>(
                .{ .x = p[<span class="tok-num">0</span>], .y = p[<span class="tok-num">1</span>], .width = s.zoom + <span class="tok-num">1.0</span>, .height = s.zoom + <span class="tok-num">1.0</span> },
                .{ .color = white_col },
            );
        }
    }

    <span class="tok-comment">// Faint cell grid, only when zoomed in enough to be useful.</span>
    <span class="tok-kw">if</span> (s.zoom &gt;= <span class="tok-num">8.0</span>) {
        <span class="tok-kw">var</span> gx: i32 = x0;
        <span class="tok-kw">while</span> (gx &lt;= x1) : (gx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> a: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, <span class="tok-builtin">@floatFromInt</span>(gx), <span class="tok-builtin">@floatFromInt</span>(y0));
            <span class="tok-kw">const</span> b: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, <span class="tok-builtin">@floatFromInt</span>(gx), <span class="tok-builtin">@floatFromInt</span>(y1));
            f.gl.<span class="tok-fn">line</span>(a, b, .{ .color = grid_col, .thickness = <span class="tok-num">1.0</span> });
        }
        <span class="tok-kw">var</span> gy: i32 = y0;
        <span class="tok-kw">while</span> (gy &lt;= y1) : (gy += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> a: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, <span class="tok-builtin">@floatFromInt</span>(x0), <span class="tok-builtin">@floatFromInt</span>(gy));
            <span class="tok-kw">const</span> b: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, <span class="tok-builtin">@floatFromInt</span>(x1), <span class="tok-builtin">@floatFromInt</span>(gy));
            f.gl.<span class="tok-fn">line</span>(a, b, .{ .color = grid_col, .thickness = <span class="tok-num">1.0</span> });
        }
    }

    <span class="tok-comment">// The trail follows the ant's last footsteps. At each cell the ant turned, the</span>
    <span class="tok-comment">// corner is drawn as a quarter-circle ARC rounding it (rather than a sharp</span>
    <span class="tok-comment">// elbow); straight-through cells stay straight. Each piece is coloured by the</span>
    <span class="tok-comment">// turn taken leaving that cell: red = right (was white), blue = left (was</span>
    <span class="tok-comment">// black). Consecutive footsteps are adjacent; at a wrap the ant teleports</span>
    <span class="tok-comment">// edge-to-edge, so we skip any non-adjacent pair.</span>
    <span class="tok-kw">if</span> (s.path_n &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> start: usize = (s.path_head + path_len - s.path_n) % path_len;
        <span class="tok-comment">// Walk interior cells with a prev and next neighbour so we know in/out dir.</span>
        <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (k &lt; s.path_n) : (k += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> cur: Turn = s.path[(start + k) % path_len];
            <span class="tok-kw">const</span> col: Color = <span class="tok-kw">if</span> (cur.right) turn_r_col <span class="tok-kw">else</span> turn_l_col;

            <span class="tok-comment">// Previous cell (or none at the tail); next cell is the following</span>
            <span class="tok-comment">// footstep, or the ant's live position for the last one.</span>
            <span class="tok-kw">const</span> has_prev: bool = k &gt; <span class="tok-num">0</span>;
            <span class="tok-kw">const</span> prev: Turn = <span class="tok-kw">if</span> (has_prev) s.path[(start + k - <span class="tok-num">1</span>) % path_len] <span class="tok-kw">else</span> cur;
            <span class="tok-kw">const</span> next: Turn = <span class="tok-kw">if</span> (k + <span class="tok-num">1</span> &lt; s.path_n)
                s.path[(start + k + <span class="tok-num">1</span>) % path_len]
            <span class="tok-kw">else</span>
                .{ .x = s.ant_x, .y = s.ant_y, .right = cur.right };

            <span class="tok-kw">const</span> prev_adj: bool = has_prev <span class="tok-kw">and</span> (<span class="tok-builtin">@abs</span>(cur.x - prev.x) + <span class="tok-builtin">@abs</span>(cur.y - prev.y) &lt;= <span class="tok-num">1</span>);
            <span class="tok-kw">const</span> next_adj: bool = <span class="tok-builtin">@abs</span>(next.x - cur.x) + <span class="tok-builtin">@abs</span>(next.y - cur.y) &lt;= <span class="tok-num">1</span>;

            <span class="tok-kw">if</span> (prev_adj <span class="tok-kw">and</span> next_adj) {
                <span class="tok-kw">const</span> ind: Vec2 = <span class="tok-fn">dirBetween</span>(prev.x, prev.y, cur.x, cur.y);
                <span class="tok-kw">const</span> outd: Vec2 = <span class="tok-fn">dirBetween</span>(cur.x, cur.y, next.x, next.y);
                <span class="tok-kw">if</span> (ind[<span class="tok-num">0</span>] == outd[<span class="tok-num">0</span>] <span class="tok-kw">and</span> ind[<span class="tok-num">1</span>] == outd[<span class="tok-num">1</span>]) {
                    <span class="tok-comment">// Straight through: one full segment across the cell.</span>
                    <span class="tok-fn">drawHalfStep</span>(f, s, cur.x, cur.y, ind, false, col);
                    <span class="tok-fn">drawHalfStep</span>(f, s, cur.x, cur.y, outd, true, col);
                } <span class="tok-kw">else</span> {
                    <span class="tok-comment">// Turned here: round the corner with an arc.</span>
                    <span class="tok-fn">drawCornerArc</span>(f, s, cur.x, cur.y, ind, outd, col);
                }
            } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (next_adj) {
                <span class="tok-comment">// Tail cell with no known incoming dir: just the outgoing half.</span>
                <span class="tok-kw">const</span> outd: Vec2 = <span class="tok-fn">dirBetween</span>(cur.x, cur.y, next.x, next.y);
                <span class="tok-fn">drawHalfStep</span>(f, s, cur.x, cur.y, outd, true, col);
            } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (prev_adj) {
                <span class="tok-kw">const</span> ind: Vec2 = <span class="tok-fn">dirBetween</span>(prev.x, prev.y, cur.x, cur.y);
                <span class="tok-fn">drawHalfStep</span>(f, s, cur.x, cur.y, ind, false, col);
            }
        }
    }

    <span class="tok-comment">// The ant.</span>
    <span class="tok-kw">const</span> ap: Vec2 = <span class="tok-fn">worldToScreen</span>(s, f, <span class="tok-fn">float</span>(s.ant_x) + <span class="tok-num">0.5</span>, <span class="tok-fn">float</span>(s.ant_y) + <span class="tok-num">0.5</span>);
    f.gl.<span class="tok-fn">circle</span>(ap, <span class="tok-builtin">@max</span>(<span class="tok-num">3.0</span>, s.zoom * <span class="tok-num">0.45</span>), .{ .color = ant_col, .segments = <span class="tok-num">24</span> });

    <span class="tok-comment">// On-screen control bar (works with no keyboard). A tap is read once here; if</span>
    <span class="tok-comment">// it hits a button we act on it. Buttons sit on top of everything else.</span>
    <span class="tok-kw">const</span> tap: ?Vec2 = <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) z.<span class="tok-fn">getMousePosition</span>(f.input) <span class="tok-kw">else</span> null;
    <span class="tok-kw">const</span> n_btns: usize = <span class="tok-num">6</span>;
    <span class="tok-kw">if</span> (<span class="tok-fn">button</span>(f, s, <span class="tok-fn">barButton</span>(f, <span class="tok-num">0</span>, n_btns), <span class="tok-kw">if</span> (s.paused) <span class="tok-str">"play"</span> <span class="tok-kw">else</span> <span class="tok-str">"pause"</span>, tap)) {
        s.paused = !s.paused;
    }
    <span class="tok-kw">if</span> (<span class="tok-fn">button</span>(f, s, <span class="tok-fn">barButton</span>(f, <span class="tok-num">1</span>, n_btns), <span class="tok-str">"step"</span>, tap)) {
        <span class="tok-fn">step</span>(s);
        s.paused = true;
    }
    <span class="tok-kw">if</span> (<span class="tok-fn">button</span>(f, s, <span class="tok-fn">barButton</span>(f, <span class="tok-num">2</span>, n_btns), <span class="tok-str">"slower"</span>, tap)) {
        s.steps_per_sec = <span class="tok-builtin">@max</span>(<span class="tok-num">1.0</span>, s.steps_per_sec / <span class="tok-num">2.0</span>);
    }
    <span class="tok-kw">if</span> (<span class="tok-fn">button</span>(f, s, <span class="tok-fn">barButton</span>(f, <span class="tok-num">3</span>, n_btns), <span class="tok-str">"faster"</span>, tap)) {
        s.steps_per_sec = <span class="tok-builtin">@min</span>(<span class="tok-num">4096.0</span>, s.steps_per_sec * <span class="tok-num">2.0</span>);
    }
    <span class="tok-kw">if</span> (<span class="tok-fn">button</span>(f, s, <span class="tok-fn">barButton</span>(f, <span class="tok-num">4</span>, n_btns), <span class="tok-kw">if</span> (s.follow) <span class="tok-str">"unfollow"</span> <span class="tok-kw">else</span> <span class="tok-str">"follow"</span>, tap)) {
        s.follow = !s.follow;
    }
    <span class="tok-kw">if</span> (<span class="tok-fn">button</span>(f, s, <span class="tok-fn">barButton</span>(f, <span class="tok-num">5</span>, n_btns), <span class="tok-str">"reset"</span>, tap)) {
        <span class="tok-fn">reset</span>(s);
    }

    <span class="tok-kw">const</span> caption: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">allocPrint</span>(arena, <span class="tok-str">"langton's ant - {d} steps - {d:.0}/s{s}{s}"</span>, .{
        s.steps,
        s.steps_per_sec,
        <span class="tok-kw">if</span> (s.paused) <span class="tok-str">" - paused"</span> <span class="tok-kw">else</span> <span class="tok-str">""</span>,
        <span class="tok-kw">if</span> (s.follow) <span class="tok-str">" - following"</span> <span class="tok-kw">else</span> <span class="tok-str">""</span>,
    }) <span class="tok-kw">catch</span> <span class="tok-str">"langton's ant"</span>;
    common.<span class="tok-fn">caption</span>(f.gl, s.font, caption);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// Descriptor-only: the runner (standalone) or a launcher drives this.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - langton's ant"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
