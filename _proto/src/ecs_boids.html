<h1>ecs_boids</h1>
<figure class="code src-file" data-path="examples/ecs_boids/ecs_boids.zig" data-lines="243"><figcaption><span>examples/ecs_boids/ecs_boids.zig</span><span>243 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! ecs_boids - Reynolds flocking on the zimr ECS, ported to WebGPU. ~160 boids live</span>
<span class="tok-comment">//! in an archetype of Pos + Vel components. Each frame: a snapshot via `iterator` feeds a</span>
<span class="tok-comment">//! steering `forEach` (separation/alignment/cohesion), then integrate-and-wrap, then a</span>
<span class="tok-comment">//! render `iterator`. Proves the ECS subsystem (Registry, archetypes, iterator, forEach)</span>
<span class="tok-comment">//! on the wgpu backend. Self-running, viewport-relative under `.responsive`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! IMPORTANT: Pos and Vel are DISTINCT struct types, not both `Vec2`. The ECS keys</span>
<span class="tok-comment">//! components by type, so two components of the same type collide into one - reading Pos</span>
<span class="tok-comment">//! would return Vel data. Each component needs its own nominal type.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> tau = zm.tau;
<span class="tok-kw">const</span> ecs = z.ecs;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> c = Color;

<span class="tok-kw">const</span> num_boids: usize = <span class="tok-num">160</span>;
<span class="tok-kw">const</span> max_speed: f32 = <span class="tok-num">140</span>;
<span class="tok-kw">const</span> min_speed: f32 = <span class="tok-num">60</span>;

<span class="tok-kw">const</span> Pos = <span class="tok-kw">struct</span> { x: f32 = <span class="tok-num">0</span>, y: f32 = <span class="tok-num">0</span> };
<span class="tok-kw">const</span> Vel = <span class="tok-kw">struct</span> { x: f32 = <span class="tok-num">0</span>, y: f32 = <span class="tok-num">0</span> };
<span class="tok-kw">const</span> Snap = <span class="tok-kw">struct</span> { p: Pos, v: Vel };

<span class="tok-kw">const</span> Params = <span class="tok-kw">struct</span> {
    neighbor_radius: f32 = <span class="tok-num">60</span>,
    separation_radius: f32 = <span class="tok-num">18</span>,
    alignment_factor: f32 = <span class="tok-num">0.06</span>,
    cohesion_factor: f32 = <span class="tok-num">0.0009</span>,
    separation_factor: f32 = <span class="tok-num">1.4</span>,
};
<span class="tok-kw">const</span> params: Params = .{};

<span class="tok-kw">const</span> SteerCtx = <span class="tok-kw">struct</span> {
    snap: []<span class="tok-kw">const</span> Snap,
};

<span class="tok-kw">const</span> IntegrateCtx = <span class="tok-kw">struct</span> {
    dt: f32,
    w: f32,
    h: f32,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    es: ecs.Registry,
    rng: std.Random.DefaultPrng,
    snap: [num_boids]Snap = undefined,
    frame_count: usize = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.es.<span class="tok-fn">deinit</span>(gpa);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);
    <span class="tok-kw">var</span> es: ecs.Registry = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(.{
        .gpa = gpa,
        .cap = .{ .entities = num_boids + <span class="tok-num">16</span>, .arches = <span class="tok-num">4</span>, .chunks = <span class="tok-num">8</span>, .chunk = <span class="tok-num">4096</span> },
    });
    <span class="tok-kw">errdefer</span> es.<span class="tok-fn">deinit</span>(gpa);
    <span class="tok-kw">var</span> rng: std.Random.DefaultPrng = .<span class="tok-fn">init</span>(<span class="tok-num">0xB01D5</span>);
    <span class="tok-kw">const</span> r: std.Random = rng.<span class="tok-fn">random</span>();
    <span class="tok-kw">const</span> w: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">64.0</span>, f.window.<span class="tok-fn">widthf</span>());
    <span class="tok-kw">const</span> h: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">64.0</span>, f.window.<span class="tok-fn">heightf</span>());
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..num_boids) |_| {
        <span class="tok-kw">const</span> e: ecs.Entity = <span class="tok-kw">try</span> ecs.Entity.<span class="tok-fn">reserveImmediateOrErr</span>(&amp;es);
        <span class="tok-kw">const</span> angle: f32 = r.<span class="tok-fn">float</span>(f32) * tau;
        <span class="tok-kw">const</span> speed: f32 = min_speed + r.<span class="tok-fn">float</span>(f32) * (max_speed - min_speed);
        _ = <span class="tok-kw">try</span> e.<span class="tok-fn">changeArchImmediateOrErr</span>(&amp;es, gpa, <span class="tok-kw">struct</span> {
            pos: Pos,
            vel: Vel,
        }, .{
            .add = .{
                .pos = .{ .x = r.<span class="tok-fn">float</span>(f32) * w, .y = r.<span class="tok-fn">float</span>(f32) * h },
                .vel = .{ .x = <span class="tok-builtin">@cos</span>(angle) * speed, .y = <span class="tok-builtin">@sin</span>(angle) * speed },
            },
        });
    }
    s.* = .{ .font = font, .es = es, .rng = rng };
}

<span class="tok-comment">/// Three Reynolds rules from the immutable snapshot, then a speed clamp.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">steerBoid</span>(
    ctx: SteerCtx,
    p: *<span class="tok-kw">const</span> Pos,
    v: *Vel,
) void {
    <span class="tok-kw">var</span> sep_x: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> sep_y: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> ali_x: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> ali_y: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> coh_x: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> coh_y: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> neighbor_count: usize = <span class="tok-num">0</span>;

    <span class="tok-kw">for</span> (ctx.snap) |other| {
        <span class="tok-kw">if</span> (other.p.x == p.x <span class="tok-kw">and</span> other.p.y == p.y <span class="tok-kw">and</span> other.v.x == v.x <span class="tok-kw">and</span> other.v.y == v.y) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> dx: f32 = other.p.x - p.x;
        <span class="tok-kw">const</span> dy: f32 = other.p.y - p.y;
        <span class="tok-kw">const</span> d: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (d &gt; params.neighbor_radius) {
            <span class="tok-kw">continue</span>;
        }
        coh_x += other.p.x;
        coh_y += other.p.y;
        ali_x += other.v.x;
        ali_y += other.v.y;
        neighbor_count += <span class="tok-num">1</span>;
        <span class="tok-kw">if</span> (d &lt; params.separation_radius <span class="tok-kw">and</span> d &gt; <span class="tok-num">0.001</span>) {
            <span class="tok-kw">const</span> inv: f32 = <span class="tok-num">1.0</span> / d;
            sep_x += -dx * inv;
            sep_y += -dy * inv;
        }
    }

    <span class="tok-kw">if</span> (neighbor_count &gt; <span class="tok-num">0</span>) {
        <span class="tok-kw">const</span> inv_count: f32 = <span class="tok-num">1.0</span> / <span class="tok-fn">float</span>(neighbor_count);
        v.x += (ali_x * inv_count - v.x) * params.alignment_factor;
        v.y += (ali_y * inv_count - v.y) * params.alignment_factor;
        v.x += (coh_x * inv_count - p.x) * params.cohesion_factor;
        v.y += (coh_y * inv_count - p.y) * params.cohesion_factor;
        v.x += sep_x * params.separation_factor;
        v.y += sep_y * params.separation_factor;
    }

    <span class="tok-kw">const</span> speed: f32 = <span class="tok-builtin">@sqrt</span>(v.x * v.x + v.y * v.y);
    <span class="tok-kw">if</span> (speed &gt; max_speed) {
        <span class="tok-kw">const</span> scale: f32 = max_speed / speed;
        v.x *= scale;
        v.y *= scale;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (speed &lt; min_speed <span class="tok-kw">and</span> speed &gt; <span class="tok-num">0.001</span>) {
        <span class="tok-kw">const</span> scale: f32 = min_speed / speed;
        v.x *= scale;
        v.y *= scale;
    }
}

<span class="tok-comment">/// Move by velocity; toroidal wrap against the live viewport.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">integrateAndWrap</span>(
    ctx: IntegrateCtx,
    p: *Pos,
    v: *<span class="tok-kw">const</span> Vel,
) void {
    p.x += v.x * ctx.dt;
    p.y += v.y * ctx.dt;
    <span class="tok-kw">if</span> (p.x &lt; <span class="tok-num">0</span>) {
        p.x += ctx.w;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (p.x &gt;= ctx.w) {
        p.x -= ctx.w;
    }
    <span class="tok-kw">if</span> (p.y &lt; <span class="tok-num">0</span>) {
        p.y += ctx.h;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (p.y &gt;= ctx.h) {
        p.y -= ctx.h;
    }
}

<span class="tok-comment">/// A small triangle pointing along the boid's velocity.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawBoid</span>(
    gl: <span class="tok-kw">anytype</span>,
    pos: Pos,
    vel: Vel,
) void {
    <span class="tok-kw">const</span> sp: f32 = <span class="tok-builtin">@sqrt</span>(vel.x * vel.x + vel.y * vel.y);
    <span class="tok-kw">const</span> dx: f32 = <span class="tok-kw">if</span> (sp &gt; <span class="tok-num">0.001</span>) vel.x / sp <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> dy: f32 = <span class="tok-kw">if</span> (sp &gt; <span class="tok-num">0.001</span>) vel.y / sp <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
    <span class="tok-kw">const</span> size: f32 = <span class="tok-num">6.0</span>;
    <span class="tok-kw">const</span> tip: Vec2 = .{ pos.x + dx * size, pos.y + dy * size };
    <span class="tok-kw">const</span> bx: f32 = pos.x - dx * size * <span class="tok-num">0.6</span>;
    <span class="tok-kw">const</span> by: f32 = pos.y - dy * size * <span class="tok-num">0.6</span>;
    <span class="tok-kw">const</span> lft: Vec2 = .{ bx - dy * size * <span class="tok-num">0.5</span>, by + dx * size * <span class="tok-num">0.5</span> };
    <span class="tok-kw">const</span> rgt: Vec2 = .{ bx + dy * size * <span class="tok-num">0.5</span>, by - dx * size * <span class="tok-num">0.5</span> };
    <span class="tok-kw">const</span> col: Color = c.<span class="tok-fn">init</span>(<span class="tok-num">120</span>, <span class="tok-num">190</span>, <span class="tok-num">245</span>, <span class="tok-num">255</span>);
    gl.<span class="tok-fn">line</span>(tip, lft, .{ .color = col, .thickness = <span class="tok-num">1.5</span> });
    gl.<span class="tok-fn">line</span>(tip, rgt, .{ .color = col, .thickness = <span class="tok-num">1.5</span> });
    gl.<span class="tok-fn">line</span>(lft, rgt, .{ .color = col, .thickness = <span class="tok-num">1.5</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    s.frame_count += <span class="tok-num">1</span>;
    <span class="tok-kw">const</span> dt: f32 = f.time.delta_time;
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-comment">// 1. Snapshot every boid's (pos, vel) so steering reads a stable world.</span>
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> snap_it = s.es.<span class="tok-fn">iterator</span>(<span class="tok-kw">struct</span> {
        p: *<span class="tok-kw">const</span> Pos,
        v: *<span class="tok-kw">const</span> Vel,
    });
    <span class="tok-kw">while</span> (snap_it.<span class="tok-fn">next</span>(&amp;s.es)) |view| {
        <span class="tok-kw">if</span> (n &gt;= s.snap.len) {
            <span class="tok-kw">break</span>;
        }
        s.snap[n] = .{ .p = view.p.*, .v = view.v.* };
        n += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 2. Steer, 3. integrate + wrap.</span>
    s.es.<span class="tok-fn">forEach</span>(steerBoid, SteerCtx{ .snap = s.snap[<span class="tok-num">0</span>..n] });
    s.es.<span class="tok-fn">forEach</span>(integrateAndWrap, IntegrateCtx{ .dt = dt, .w = w, .h = h });

    <span class="tok-comment">// 4. Render.</span>
    z.<span class="tok-fn">clearViewport</span>(f, c.<span class="tok-fn">init</span>(<span class="tok-num">8</span>, <span class="tok-num">10</span>, <span class="tok-num">16</span>, <span class="tok-num">255</span>));
    <span class="tok-kw">var</span> draw_it = s.es.<span class="tok-fn">iterator</span>(<span class="tok-kw">struct</span> {
        p: *<span class="tok-kw">const</span> Pos,
        v: *<span class="tok-kw">const</span> Vel,
    });
    <span class="tok-kw">while</span> (draw_it.<span class="tok-fn">next</span>(&amp;s.es)) |view| {
        <span class="tok-fn">drawBoid</span>(f.gl, view.p.*, view.v.*);
    }
    <span class="tok-kw">var</span> buf: [<span class="tok-num">40</span>]u8 = undefined;
    <span class="tok-kw">const</span> lbl: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"ECS boids: {d} entities"</span>, .{n}) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">12</span>, <span class="tok-num">12</span> }, lbl, .{ .size = <span class="tok-num">16</span>, .color = c.<span class="tok-fn">init</span>(<span class="tok-num">210</span>, <span class="tok-num">214</span>, <span class="tok-num">224</span>, <span class="tok-num">220</span>), .font = &amp;s.font });
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - ECS boids"</span>,
            .width = <span class="tok-num">800</span>,

            .scale_mode = .responsive,

};
