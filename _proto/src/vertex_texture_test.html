<h1>vertex_texture_test</h1>
<figure class="code src-file" data-path="examples/vertex_texture_test/vertex_texture_test.zig" data-lines="162"><figcaption><span>examples/vertex_texture_test/vertex_texture_test.zig</span><span>162 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! vertex_texture_test - the end-to-end proof that zimr can sample a texture in</span>
<span class="tok-comment">//! the VERTEX stage.  A flat grid of triangles is warped in the vertex shader by</span>
<span class="tok-comment">//! reading a checkerboard texture (via the explicit-LOD `warpLevel` accessor) and</span>
<span class="tok-comment">//! offsetting each vertex.  A distorted grid (not a clean one) means vertex</span>
<span class="tok-comment">//! texture fetch works end-to-end: schema-declared vertex-visible sampler -&gt;</span>
<span class="tok-comment">//! bind-group layout -&gt; `textureSampleLevel` in the VS.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"vertex_texture_test_vs.wgsl"</span>);
<span class="tok-kw">const</span> fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"vertex_texture_test_fs.wgsl"</span>);
<span class="tok-kw">const</span> vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"vertex_texture_test_vs_io.zig"</span>);
<span class="tok-kw">const</span> fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"vertex_texture_test_fs_io.zig"</span>);
<span class="tok-kw">const</span> atkinson = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> grid: usize = <span class="tok-num">24</span>;
<span class="tok-kw">const</span> span: f32 = <span class="tok-num">1.7</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io),
    vbo: z.wgpu.BufferHandle,
    warp: z.WgpuTexture,
    vertex_count: u32,
};

<span class="tok-kw">fn</span> <span class="tok-fn">scale2d</span>(sx: f32, sy: f32) [<span class="tok-num">4</span>]Vec {
    <span class="tok-kw">return</span> .{
        .{ sx, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .{ <span class="tok-num">0</span>, sy, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> },
        .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> },
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    <span class="tok-comment">// `.managed`: free every GPU resource we created plus the font (see the</span>
    <span class="tok-comment">// policy on AppSpec.memory - examples must be leak-tight).</span>
    s.shader.<span class="tok-fn">deinit</span>();
    s.warp.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> verts: usize = grid * grid * <span class="tok-num">6</span>;
    <span class="tok-kw">const</span> data: []f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, verts * <span class="tok-num">4</span>);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(data);
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> gz: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (gz &lt; grid) : (gz += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> gx: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (gx &lt; grid) : (gx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> s0: f32 = <span class="tok-fn">float</span>(gx) / <span class="tok-fn">float</span>(grid);
            <span class="tok-kw">const</span> s1: f32 = <span class="tok-fn">float</span>(gx + <span class="tok-num">1</span>) / <span class="tok-fn">float</span>(grid);
            <span class="tok-kw">const</span> t0: f32 = <span class="tok-fn">float</span>(gz) / <span class="tok-fn">float</span>(grid);
            <span class="tok-kw">const</span> t1: f32 = <span class="tok-fn">float</span>(gz + <span class="tok-num">1</span>) / <span class="tok-fn">float</span>(grid);
            <span class="tok-kw">const</span> x0: f32 = (s0 - <span class="tok-num">0.5</span>) * span;
            <span class="tok-kw">const</span> x1: f32 = (s1 - <span class="tok-num">0.5</span>) * span;
            <span class="tok-kw">const</span> y0: f32 = (t0 - <span class="tok-num">0.5</span>) * span;
            <span class="tok-kw">const</span> y1: f32 = (t1 - <span class="tok-num">0.5</span>) * span;
            <span class="tok-kw">const</span> corners = [<span class="tok-num">4</span>][<span class="tok-num">4</span>]f32{
                .{ x0, y0, s0, t0 },
                .{ x1, y0, s1, t0 },
                .{ x1, y1, s1, t1 },
                .{ x0, y1, s0, t1 },
            };
            <span class="tok-kw">const</span> order = [<span class="tok-num">6</span>]usize{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span> };
            <span class="tok-kw">for</span> (order) |ci| {
                <span class="tok-builtin">@memcpy</span>(data[n .. n + <span class="tok-num">4</span>], &amp;corners[ci]);
                n += <span class="tok-num">4</span>;
            }
        }
    }

    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = data.len * <span class="tok-builtin">@sizeOf</span>(f32),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"vtx_test_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(data));

    <span class="tok-kw">const</span> warp: z.WgpuTexture = <span class="tok-kw">try</span> z.WgpuTexture.<span class="tok-fn">createCheckerboard</span>(
        f.gpu.device,
        f.gpu.queue,
        gpa,
        .{ <span class="tok-num">255</span>, <span class="tok-num">90</span>, <span class="tok-num">40</span>, <span class="tok-num">255</span> },
        .{ <span class="tok-num">40</span>, <span class="tok-num">120</span>, <span class="tok-num">255</span>, <span class="tok-num">255</span> },
        <span class="tok-num">64</span>,
        <span class="tok-num">8</span>,
    );

    <span class="tok-kw">const</span> shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(vs_io, fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = vs_wgsl,
        .fs_wgsl_source = fs_wgsl,
        .vertex_buffer_layouts = &amp;.{z.shader.<span class="tok-fn">vertexLayout</span>(vs_io)},
        .initial_ubo = .{ .transform = <span class="tok-fn">scale2d</span>(<span class="tok-num">1</span>, <span class="tok-num">1</span>) },
        .textures = .{ .warp = warp },
        .label = <span class="tok-str">"vertex_texture_test"</span>,
    });

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson, <span class="tok-num">22</span>),
        .shader = shader,
        .vbo = vbo,
        .warp = warp,
        .vertex_count = <span class="tok-builtin">@intCast</span>(verts),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> aspect: f32 = w / <span class="tok-builtin">@max</span>(h, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> sx: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span> / aspect;
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) aspect <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
    s.shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .transform = <span class="tok-fn">scale2d</span>(sx, sy) });

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">12</span>, .g = <span class="tok-num">16</span>, .b = <span class="tok-num">26</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    <span class="tok-comment">// The 2D immediate-mode batch reserves bind group 1 for its texture atlas</span>
    <span class="tok-comment">// (gpu_iface.batch_reserved_group) - the SAME group our vertex-visible</span>
    <span class="tok-comment">// sampler occupies. `flushBatch` drains the batch but does NOT rebind the</span>
    <span class="tok-comment">// pipeline (that's the consumer's job), so we bracket the custom draw:</span>
    <span class="tok-comment">//   1. drain the pending clearViewport quad now, while the 2D pipeline is</span>
    <span class="tok-comment">//      still bound, so it composites as the background under the 2D pipeline;</span>
    <span class="tok-comment">//   2. after our draw, restore the 2D pipeline (+ its ortho group 0) so the</span>
    <span class="tok-comment">//      text/caption material-swap flush below runs under the 2D pipeline</span>
    <span class="tok-comment">//      instead of ours (which would set the atlas at group 1 against our</span>
    <span class="tok-comment">//      pipeline -&gt; the "resources_bgl does not match" validation error).</span>
    <span class="tok-comment">// This is the same bracketing draw3d.zig uses around its point/decal draws.</span>
    f.gl.<span class="tok-fn">flushBeforeMaterialSwap</span>();
    s.shader.<span class="tok-fn">bindForDraw</span>(ps);
    s.shader.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, s.vertex_count * <span class="tok-num">4</span> * <span class="tok-builtin">@sizeOf</span>(f32));
    s.shader.<span class="tok-fn">draw</span>(ps, s.vertex_count, <span class="tok-num">1</span>);
    f.gl.<span class="tok-fn">renderer</span>().<span class="tok-fn">bindForPass</span>(ps);

    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">16</span> }, <span class="tok-str">"Vertex Texture Fetch"</span>, .{ .size = <span class="tok-num">22</span>, .color = common.palette.ink, .font = &amp;s.font });
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"grid warped by a texture sampled IN THE VERTEX SHADER (textureSampleLevel)"</span>);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - shaders - vertex texture fetch (smoke test)"</span>,
            .width = <span class="tok-num">900</span>,
            .height = <span class="tok-num">700</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};

<figure class="code src-file" data-path="examples/vertex_texture_test_vs.zig" data-lines="29"><figcaption><span>examples/vertex_texture_test_vs.zig</span><span>29 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/vertex_texture_test_vs.zig - the vertex shader that samples a</span>
<span class="tok-comment">//! texture IN THE VERTEX STAGE. `warpLevel` is the explicit-LOD accessor</span>
<span class="tok-comment">//! (-&gt; textureSampleLevel), which needs no derivatives and is legal here.</span>
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> mulMatPoint = zm.mulMatPoint;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"vertex_texture_test_vs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"vertex_texture_test_vs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_io.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;
    <span class="tok-kw">const</span> uv: zm.Vec2 = io_in.vertex_uv;
    <span class="tok-comment">// Vertex-stage texture fetch. Offset the 2D vertex by the sampled colour.</span>
    <span class="tok-kw">const</span> warp: zm.Vec = io_in.<span class="tok-fn">warpLevel</span>(uv, <span class="tok-num">0.0</span>);
    <span class="tok-kw">const</span> off_x: f32 = (warp[<span class="tok-num">0</span>] - <span class="tok-num">0.5</span>) * <span class="tok-num">0.35</span>;
    <span class="tok-kw">const</span> off_y: f32 = (warp[<span class="tok-num">1</span>] - <span class="tok-num">0.5</span>) * <span class="tok-num">0.35</span>;
    <span class="tok-kw">const</span> p: Vec3 = .{ io_in.vertex_position[<span class="tok-num">0</span>] + off_x, io_in.vertex_position[<span class="tok-num">1</span>] + off_y, <span class="tok-num">0.0</span> };
    out.position = <span class="tok-fn">mulMatPoint</span>(io_in.u.transform, p);
    out.frag_color = .{ warp[<span class="tok-num">0</span>], warp[<span class="tok-num">1</span>], warp[<span class="tok-num">2</span>], <span class="tok-num">1.0</span> };
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_io;
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
