<h1>quadruped</h1>
<figure class="code src-file" data-path="examples/quadruped/quadruped.zig" data-lines="1977"><figcaption><span>examples/quadruped/quadruped.zig</span><span>1977 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! quadruped - a real Unitree Go1, imported from MuJoCo Menagerie, standing on its own legs.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * WHAT THIS DEMONSTRATES --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Everything Phase B and Phase C turn 11 built, in one scene you can push over:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * an MJCF model read straight from Menagerie - 104 uses of `&lt;default&gt;`, 70 geoms,</span>
<span class="tok-comment">//!     12 actuators, and a `home` keyframe - with forward kinematics that matches MuJoCo's</span>
<span class="tok-comment">//!     own to 1e-4 on every body;</span>
<span class="tok-comment">//!   * that robot HOLDING ITS POSE against gravity, with contacts from `zimrphysics` and</span>
<span class="tok-comment">//!     dynamics from the articulated solver;</span>
<span class="tok-comment">//!   * the two controller rules that took three attempts to get right, live on sliders.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** THE THING TO TRY --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Drag **kp** down and watch the legs fold. Drag it up and the robot springs. Press **shove**</span>
<span class="tok-comment">//! and see it recover - or not. The gains are the manufacturer's own by default (`kp = 100`,</span>
<span class="tok-comment">//! from `&lt;position kp="100" forcerange="-35.55 35.55"&gt;` in `go1.xml`).</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> length3 = zm.length3;
<span class="tok-kw">const</span> sinTurns = zm.sinTurns;
<span class="tok-kw">const</span> rbt = z.robot;
<span class="tok-kw">const</span> zp = z.zimrphysics;
<span class="tok-kw">const</span> mjcf = z.mjcf;
<span class="tok-kw">const</span> rmj = z.robot_mjcf;
<span class="tok-kw">const</span> bridge_mod = z.robot_physics;
<span class="tok-kw">const</span> ctl = z.robot_control;
<span class="tok-kw">const</span> Color = zm.Color;

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> normalize3 = zm.normalize3;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> ui = z.ui;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> float64 = zm.float64;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> quatToMat = zm.quatToMat;
<span class="tok-kw">const</span> identity = zm.identity;

<span class="tok-comment">/// The Go1 runs at 500 Hz in Menagerie, and its contacts want it.</span>
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// -- *** A THREE-BONE ARM, SPLICED INTO THE MJCF AT LOAD TIME --</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Injected into the trunk body and its motors appended to the actuator block, then imported</span>
<span class="tok-comment">// normally. So the arm is a **parameter of this demo** rather than a second checked-in robot:</span>
<span class="tok-comment">// its reach, mass and mount can change without anyone maintaining a fork of the Go1.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// * THE MASS IS THE POINT. Measured on the assembled model, a 1.94 kg gripper swinging through</span>
<span class="tok-comment">// its range moves the whole-body centre of mass **0.144 m fore-aft**, against a foot base of</span>
<span class="tok-comment">// about 0.36 m - forty percent of the support polygon, moving fast. That is a large load</span>
<span class="tok-comment">// transfer between legs, and load transfer is what turns "hold the feet still" from a</span>
<span class="tok-comment">// kinematics problem into a force problem.</span>
<span class="tok-kw">const</span> arm_bodies =
    <span class="tok-str">\\      &lt;body name="arm_base" pos="0.02 0 0.06"&gt;</span>
    <span class="tok-str">\\        &lt;joint name="arm_yaw" type="hinge" axis="0 0 1" range="-3.0 3.0" damping="1.2" armature="0.02"/&gt;</span>
    <span class="tok-str">\\        &lt;geom type="capsule" fromto="0 0 0 0 0 0.10" size="0.035" density="700" rgba="0.85 0.62 0.30 1"/&gt;</span>
    <span class="tok-str">\\        &lt;body name="arm_upper" pos="0 0 0.10"&gt;</span>
    <span class="tok-str">\\          &lt;joint name="arm_shoulder" type="hinge" axis="0 1 0" range="-2.4 2.4" damping="1.2" armature="0.02"/&gt;</span>
    <span class="tok-str">\\          &lt;geom type="capsule" fromto="0 0 0 0 0 0.28" size="0.030" density="700" rgba="0.85 0.62 0.30 1"/&gt;</span>
    <span class="tok-str">\\          &lt;body name="arm_fore" pos="0 0 0.28"&gt;</span>
    <span class="tok-str">\\            &lt;joint name="arm_elbow" type="hinge" axis="0 1 0" range="-2.6 2.6" damping="1.0" armature="0.015"/&gt;</span>
    <span class="tok-str">\\            &lt;geom type="capsule" fromto="0 0 0 0 0 0.24" size="0.026" density="700" rgba="0.85 0.62 0.30 1"/&gt;</span>
    <span class="tok-str">\\            &lt;body name="arm_wrist" pos="0 0 0.24"&gt;</span>
    <span class="tok-str">\\              &lt;joint name="arm_wrist" type="hinge" axis="0 1 0" range="-2.2 2.2" damping="0.8" armature="0.01"/&gt;</span>
    <span class="tok-str">\\              &lt;geom type="capsule" fromto="0 0 0 0 0 0.10" size="0.022" density="700" rgba="0.85 0.62 0.30 1"/&gt;</span>
    <span class="tok-str">\\              &lt;body name="gripper" pos="0 0 0.10"&gt;</span>
    <span class="tok-str">\\                &lt;geom name="gripper_g" type="sphere" size="0.075" density="1100" rgba="0.35 0.80 0.60 1"/&gt;</span>
    <span class="tok-str">\\              &lt;/body&gt;</span>
    <span class="tok-str">\\            &lt;/body&gt;</span>
    <span class="tok-str">\\          &lt;/body&gt;</span>
    <span class="tok-str">\\        &lt;/body&gt;</span>
    <span class="tok-str">\\      &lt;/body&gt;</span>
    <span class="tok-str">\\</span>
;

<span class="tok-kw">const</span> arm_motors =
    <span class="tok-str">\\    &lt;motor name="m_arm_yaw" joint="arm_yaw" ctrlrange="-40 40" gear="1"/&gt;</span>
    <span class="tok-str">\\    &lt;motor name="m_arm_shoulder" joint="arm_shoulder" ctrlrange="-60 60" gear="1"/&gt;</span>
    <span class="tok-str">\\    &lt;motor name="m_arm_elbow" joint="arm_elbow" ctrlrange="-45 45" gear="1"/&gt;</span>
    <span class="tok-str">\\    &lt;motor name="m_arm_wrist" joint="arm_wrist" ctrlrange="-25 25" gear="1"/&gt;</span>
    <span class="tok-str">\\</span>
;

<span class="tok-comment">/// Splice the arm into the Go1's MJCF text. Caller owns the result.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">mjcfWithArm</span>(gpa: Allocator) ![]u8 {
    <span class="tok-kw">const</span> base: []<span class="tok-kw">const</span> u8 = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"go1.xml"</span>);
    <span class="tok-kw">var</span> out: std.<span class="tok-fn">ArrayList</span>(u8) = .empty;
    <span class="tok-kw">errdefer</span> out.<span class="tok-fn">deinit</span>(gpa);
    <span class="tok-comment">// -- *** THE ARM GOES AFTER THE LEGS, AND THE POSITION IS THE WHOLE BUG --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Inserted BEFORE `FR_hip`, the arm's four joints come first in qpos order and **every leg</span>
    <span class="tok-comment">// index shifts by four.** Leg angles then land in arm joints, the legs stay at qpos0 -</span>
    <span class="tok-comment">// straight - and the robot topples the instant it is reset.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THAT LOOKED EXACTLY LIKE "the arm is too heavy", and survived a rest-pose sweep AND a</span>
    <span class="tok-comment">// mass sweep down to a quarter of a kilo before the real cause showed itself: **it still</span>
    <span class="tok-comment">// fell with a 0.25 kg arm**, which no amount of mass explains. After the legs, every mass</span>
    <span class="tok-comment">// from 0.25 kg to 2.06 kg stands.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// ** AS THE LAST CHILD OF THE TRUNK all existing indices are preserved - the keyframe, the</span>
    <span class="tok-comment">// actuator order, and every piece of code that assumes where a leg lives - and padding the</span>
    <span class="tok-comment">// keyframe at the END becomes correct rather than accidentally right.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Anchored on text rather than a line number so it survives the fixture being reformatted.</span>
    <span class="tok-kw">const</span> tail: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"    &lt;/body&gt;\n  &lt;/worldbody&gt;"</span>;
    <span class="tok-kw">const</span> leg_at: usize = std.mem.<span class="tok-fn">indexOf</span>(u8, base, tail) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NoTrunkEnd;
    <span class="tok-kw">try</span> out.<span class="tok-fn">appendSlice</span>(gpa, base[<span class="tok-num">0</span>..leg_at]);
    <span class="tok-kw">try</span> out.<span class="tok-fn">appendSlice</span>(gpa, arm_bodies);
    <span class="tok-kw">const</span> tag: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"  &lt;actuator&gt;\n"</span>;
    <span class="tok-kw">const</span> act_at: usize = std.mem.<span class="tok-fn">indexOf</span>(u8, base[leg_at..], tag) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NoActuators;
    <span class="tok-kw">const</span> cut: usize = leg_at + act_at + tag.len;
    <span class="tok-kw">try</span> out.<span class="tok-fn">appendSlice</span>(gpa, base[leg_at..cut]);
    <span class="tok-kw">try</span> out.<span class="tok-fn">appendSlice</span>(gpa, arm_motors);
    <span class="tok-kw">try</span> out.<span class="tok-fn">appendSlice</span>(gpa, base[cut..]);

    <span class="tok-comment">// -- *** AND THE KEYFRAME MUST GROW WITH THE MODEL --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `home` carries 19 numbers because the Go1 has nq 19. Adding four arm joints makes it 23,</span>
    <span class="tok-comment">// and `applyKeyframe` then REFUSES - correctly, because a keyframe of the wrong length is</span>
    <span class="tok-comment">// not a pose. **Both call sites discarded the result with `_ =`**, so the refusal was</span>
    <span class="tok-comment">// silent: the robot simply never got its standing pose, and the arm never reached the</span>
    <span class="tok-comment">// configuration the demo assumed it was in.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THIS IS THE EXACT BUG `examples/humanoid` DOCUMENTS - "the keyframe was 28 numbers, the</span>
    <span class="tok-comment">// model 70 once the projectiles joined the tree, and `applyKeyframe` refused. The label</span>
    <span class="tok-comment">// still said holding: squat." Written down there, repeated here, because the splice changed</span>
    <span class="tok-comment">// `nq` and nothing connected the two facts.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// *** THE ARM RESTS HALF BENT, not folded and not straight. An arm at a joint limit cannot</span>
    <span class="tok-comment">// counter-animate in both directions, and the gimbal needs it to. Measured with these</span>
    <span class="tok-comment">// angles, the robot stands at every routine amplitude tested and the gripper holds its point</span>
    <span class="tok-comment">// to within 29 mm at the largest.</span>
    <span class="tok-comment">// * THESE FOUR NUMBERS ARE `arm_rest`, and they have to stay in step with it - the keyframe</span>
    <span class="tok-comment">// is text spliced into XML, so the compiler cannot check that for us. If the rest pose</span>
    <span class="tok-comment">// changes, this string changes with it, or a reset silently restores a different arm.</span>
    <span class="tok-kw">const</span> arm_key: []<span class="tok-kw">const</span> u8 = <span class="tok-str">" 0 1.1 -1.6 0.5"</span>;
    <span class="tok-comment">// -- *** ANCHORED ON THE `qpos` ATTRIBUTE, NOT ON ITS LAST FEW NUMBERS --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The splice used to find `-1.8 0 0.9 -1.8"` with `lastIndexOf`. **The home key's `ctrl`</span>
    <span class="tok-comment">// ends in exactly the same text and comes after `qpos`**, so it was `ctrl` that grew and</span>
    <span class="tok-comment">// `qpos` stayed at 19. `applyKeyframe` accepts 19 - it is a joint boundary, the whole robot</span>
    <span class="tok-comment">// minus its arm - so nothing refused it, `home` came out four short, and `control` indexed</span>
    <span class="tok-comment">// past it on the first arm joint: an out-of-bounds trap in the launcher.</span>
    <span class="tok-kw">const</span> owned: []u8 = <span class="tok-kw">try</span> out.<span class="tok-fn">toOwnedSlice</span>(gpa);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(owned);
    <span class="tok-kw">const</span> key_at: usize = std.mem.<span class="tok-fn">indexOf</span>(u8, owned, <span class="tok-str">"&lt;key "</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NoKeyframe;
    <span class="tok-kw">const</span> qpos_attr: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"qpos=\""</span>;
    <span class="tok-kw">const</span> qpos_at: usize = key_at + qpos_attr.len +
        (std.mem.<span class="tok-fn">indexOf</span>(u8, owned[key_at..], qpos_attr) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NoKeyframe);
    <span class="tok-kw">const</span> qpos_end: usize = qpos_at +
        (std.mem.<span class="tok-fn">indexOfScalar</span>(u8, owned[qpos_at..], <span class="tok-str">'"'</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-kw">error</span>.NoKeyframe);
    <span class="tok-kw">var</span> padded: std.<span class="tok-fn">ArrayList</span>(u8) = .empty;
    <span class="tok-kw">errdefer</span> padded.<span class="tok-fn">deinit</span>(gpa);
    <span class="tok-kw">try</span> padded.<span class="tok-fn">appendSlice</span>(gpa, owned[<span class="tok-num">0</span>..qpos_end]);
    <span class="tok-kw">try</span> padded.<span class="tok-fn">appendSlice</span>(gpa, arm_key);
    <span class="tok-kw">try</span> padded.<span class="tok-fn">appendSlice</span>(gpa, owned[qpos_end..]);
    <span class="tok-kw">return</span> padded.<span class="tok-fn">toOwnedSlice</span>(gpa);
}

<span class="tok-kw">const</span> timestep: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">500.0</span>;

<span class="tok-comment">/// How many projectiles the scene carries.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** A FIXED POOL, RECYCLED, RATHER THAN SPAWNED ON DEMAND --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// A ball has to be a body in the ROBOT'S OWN TREE to hit it properly (section 4k) - that is the</span>
<span class="tok-comment">/// whole point of the unified tree, and it is what makes the impact push back on the legs</span>
<span class="tok-comment">/// with the right mass. But a tree is built once: adding a body means rebuilding the model,</span>
<span class="tok-comment">/// which throws away the robot's state mid-flight.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// So the balls exist from the start, parked below the floor where nothing can reach them,</span>
<span class="tok-comment">/// and a throw teleports one into place with a velocity. Recycling the oldest means the</span>
<span class="tok-comment">/// scene never grows and a rapid-fire user cannot exhaust it.</span>
<span class="tok-kw">const</span> ball_count: usize = <span class="tok-num">6</span>;
<span class="tok-kw">const</span> ball_radius: f32 = <span class="tok-num">0.045</span>;

<span class="tok-kw">const</span> ball_names = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"ball0"</span>, <span class="tok-str">"ball1"</span>, <span class="tok-str">"ball2"</span>, <span class="tok-str">"ball3"</span>, <span class="tok-str">"ball4"</span>, <span class="tok-str">"ball5"</span> };
<span class="tok-kw">const</span> ball_col: Color = .{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">110</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> };

<span class="tok-comment">/// Where an unthrown ball waits: far below the floor, spread out so two never overlap.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THEY ARE STILL SIMULATED DOWN THERE, and that is fine - nothing is near them, so they</span>
<span class="tok-comment">/// contribute no contacts and cost only their six DOFs in the mass matrix. Parking beats</span>
<span class="tok-comment">/// deleting because a tree cannot gain a body without being rebuilt, and rebuilding mid-throw</span>
<span class="tok-comment">/// would discard the robot's state.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">parkedBall</span>(i: usize) Vec {
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(-<span class="tok-num">3.0</span> - <span class="tok-fn">float</span>(i) * <span class="tok-num">0.3</span>, <span class="tok-num">0</span>, -<span class="tok-num">2.0</span>);
}

<span class="tok-kw">const</span> bg: Color = .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">14</span>, .b = <span class="tok-num">16</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> trunk_col: Color = .{ .r = <span class="tok-num">130</span>, .g = <span class="tok-num">128</span>, .b = <span class="tok-num">132</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> link_col: Color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">205</span>, .b = <span class="tok-num">190</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> contact_col: Color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    <span class="tok-comment">/// The spliced MJCF text. **Owned here, not freed after parsing**: the XML reader is</span>
    <span class="tok-comment">/// zero-copy, so `doc`, `robot` and every body name in `imported` are slices into it.</span>
    xml_text: []u8,
    doc: z.codecs.xml.Document,
    robot: mjcf.Robot,
    imported: rmj.Imported,
    data: rbt.Data,
    world: zp.World,
    bridge: bridge_mod.Bridge,
    cam: z.OrbitCamera,
    ui_host: z.UiHost,
    <span class="tok-comment">/// One IK mask per leg - see `ctl.limbActuation`.</span>
    legs: [<span class="tok-num">4</span>]ctl.Actuation,
    <span class="tok-comment">/// The calf body of each leg, and where its foot is pinned in the world.</span>
    foot_body: [<span class="tok-num">4</span>]u32,
    planted: [<span class="tok-num">4</span>]Vec,
    <span class="tok-comment">/// Each foot's stance position expressed in the TORSO's frame - what the gait cycle is</span>
    <span class="tok-comment">/// measured from. See `solveGait`.</span>
    foot_rest: [<span class="tok-num">4</span>]Vec,
    foot_offset: [<span class="tok-num">4</span>]Vec,
    ik_scratch: []Vec,
    <span class="tok-comment">/// Commanded torso pose, relative to where the robot started.</span>
    body_roll: f32,
    body_pitch: f32,
    body_yaw: f32,
    body_height: f32,
    posing: bool,
    pose_error: f32,
    <span class="tok-comment">/// Gait state. Phase runs 0..1 and the four offsets are what make a gait a gait.</span>
    gait_on: bool,
    gait_phase: f32,
    <span class="tok-comment">/// -- *** THE ARM SWINGS WITH THE GAIT, OPEN-LOOP --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Three FEEDBACK balance laws made this robot worse, and the baseline explains why: it</span>
    <span class="tok-comment">/// already walks with a steady, harmless -0.012 rad of pitch, so a reactive controller has</span>
    <span class="tok-comment">/// nothing to react to and can only inject noise. An integrator on that never-zero error</span>
    <span class="tok-comment">/// additionally wound the arm to its stop, where 2 kg at maximum lever arm is dead weight.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// ** THE DISTURBANCE IS PERIODIC AND KNOWN. A trot's wobble is locked to the gait clock, so</span>
    <span class="tok-comment">/// it can be cancelled by swinging the arm at the same frequency with the right phase.</span>
    <span class="tok-comment">/// Measured over 10 s at hz 2.0 / stride 0.16 / duty 0.60:</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">///     amp 0.0             0.567 m   pitch steady at -0.012</span>
    <span class="tok-comment">///     amp 0.3  phase 0.50 **FELL** at 4.36 s</span>
    <span class="tok-comment">///     amp 0.3  phase 0.75 **0.843 m**   pitch flattens to 0.000</span>
    <span class="tok-comment">///     amp 0.6  phase 0.75   FELL</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// **1.49x further, and the pitch bias goes to zero.** * PHASE IS THE PARAMETER: the same</span>
    <span class="tok-comment">/// amplitude a quarter-cycle away falls over. A sweep over amplitude alone would have</span>
    <span class="tok-comment">/// concluded the arm does not help, at every amplitude, and been wrong.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// *** AND A BOUNDED SINUSOID CANNOT WIND UP - no gate, no anti-windup, no pull-home. Those</span>
    <span class="tok-comment">/// were three patches for a symptom of the wrong law.</span>
    arm_swing_amp: f32,
    arm_swing_phase: f32,
    <span class="tok-comment">/// How far the shoulder sweeps around its rest during the routine, and how slowly.</span>
    arm_lift_amp: f32,
    arm_lift_rate: f32,
    gait_hz: f32,
    gait_stride: f32,
    gait_lift: f32,
    gait_duty: f32,
    gait_offset: [<span class="tok-num">4</span>]f32,
    pose_scratch: []f32,
    rest_height: f32,
    rest_rot: zm.Quat,
    <span class="tok-comment">/// The full qpos the sliders are relative to.</span>
    stance: []f32,
    <span class="tok-comment">/// Last solved command, so the solve only runs when something changed.</span>
    last_cmd: [<span class="tok-num">4</span>]f32,
    <span class="tok-comment">/// -- *** THE LOOP THE PIPELINE WAS MISSING --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// The commanded attitude is turned into leg angles by IK and handed to a PD. Those angles</span>
    <span class="tok-comment">/// would give the commanded roll IF the joints tracked perfectly - under the trunk's weight</span>
    <span class="tok-comment">/// they do not, and **nothing here ever looked at the torso's real orientation.**</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Measured on the shipped version: every command undershot by a nearly constant</span>
    <span class="tok-comment">/// 0.030-0.048 rad. Ask for 0.15 rad of roll and you got 0.10. **The sliders lied.**</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// This trim is the missing feedback: the difference between what the torso is actually</span>
    <span class="tok-comment">/// doing and what was asked, integrated, and folded back into the command before the legs</span>
    <span class="tok-comment">/// are re-solved. Measured after: within 3%.</span>
    trim_roll: f32,
    trim_pitch: f32,
    <span class="tok-comment">/// Frames since the trim last updated. * IT MUST BE SLOW: `solveBodyPose`'s own comment</span>
    <span class="tok-comment">/// records that re-solving every frame destabilises the robot, so the correction runs on a</span>
    <span class="tok-comment">/// cadence and lets the PD settle in between.</span>
    trim_countdown: u32,
    <span class="tok-comment">/// What the torso is actually doing, for the readout - so the fix is visible rather than</span>
    <span class="tok-comment">/// asserted.</span>
    seen_roll: f32,
    seen_pitch: f32,
    <span class="tok-comment">/// -- *** A ROUTINE: PITCH AND YAW ROTATING TOGETHER, ROLL OSCILLATING SEPARATELY --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Pitch and yaw driven in quadrature trace a CONE - the nose sweeps a circle - while roll</span>
    <span class="tok-comment">/// rocks at its own frequency. Because the two rates are **incommensurate**, the combined</span>
    <span class="tok-comment">/// attitude never exactly repeats, so nothing downstream can quietly learn the pattern</span>
    <span class="tok-comment">/// instead of tracking it.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * AND IT IS THE CASE WHERE A PLANNER SHOULD EARN ITS PLACE. The trim loop that fixed the</span>
    <span class="tok-comment">/// static error is an INTEGRATOR: it converges to a constant target and lags a moving one,</span>
    <span class="tok-comment">/// exactly like the PD on the tracking arm. A moving attitude command is where preview -</span>
    <span class="tok-comment">/// the advantage that survived every ablation - has something to do.</span>
    routine: bool,
    routine_clock: f32,
    cone_rate: f32,
    roll_rate: f32,
    cone_amount: f32,
    roll_amount: f32,
    <span class="tok-comment">/// * THE BODY ALSO BOBS, at a third incommensurate rate. Three frequencies with no common</span>
    <span class="tok-comment">/// multiple means the pose never repeats, so the arm cannot be secretly tracking a cycle it</span>
    <span class="tok-comment">/// has memorised - it has to counter the motion it is actually given.</span>
    bob_rate: f32,
    bob_amount: f32,
    <span class="tok-comment">/// Mean and worst attitude error while the routine runs, so the lag is a number.</span>
    routine_error_sum: f64,
    routine_error_count: u32,
    routine_worst: f32,
    <span class="tok-comment">/// -- *** SLIP AND FRICTION DEMAND, MEASURED LIVE --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// The feet slide and there was no way to see by how much, or to know why. Slip is how far</span>
    <span class="tok-comment">/// the feet have travelled from where they were planted; the cone ratio is tangential force</span>
    <span class="tok-comment">/// over what friction can actually supply, so **above 1.0 is a foot being asked for force</span>
    <span class="tok-comment">/// the ground does not have.**</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Measured over the routine: about 1 m of slip in 12 s, cone exceeded at 1.83x. **A</span>
    <span class="tok-comment">/// position controller has no representation of that limit - not a weak one, none** - which</span>
    <span class="tok-comment">/// is why this readout exists, and why it is the number a planner would have to beat.</span>
    <span class="tok-comment">/// -- *** THE ARM, AND WHY IT IS DRIVEN SEPARATELY --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// The arm reaches for a moving target with its own IK and its own PD, and the torso</span>
    <span class="tok-comment">/// pipeline is left exactly as it was. **That separation is the experiment**: neither</span>
    <span class="tok-comment">/// controller knows about the other, so whatever the arm does to the legs' contact forces</span>
    <span class="tok-comment">/// arrives as a disturbance nobody planned for - which is the situation a force-allocating</span>
    <span class="tok-comment">/// planner would be able to handle and a pair of independent servos cannot.</span>
    arm_on: bool,
    arm_clock: f32,
    arm_rate: f32,
    arm_reach: f32,
    <span class="tok-comment">/// -- *** THE GRIPPER HOLDS A POINT IN THE WORLD WHILE THE BODY MOVES UNDER IT --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// A gimbal. The torso weaves through its cone, rocks, and bobs; the arm counter-animates so</span>
    <span class="tok-comment">/// the gripper stays put. **The arm is not doing anything of its own** - every joint motion</span>
    <span class="tok-comment">/// exists purely to cancel the base's.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * AND IT IS THE IDEAL SHAPE FOR A PLANNER. The torso routine is SCRIPTED, so where the</span>
    <span class="tok-comment">/// base will be a fraction of a second from now is known exactly - which makes the arm's</span>
    <span class="tok-comment">/// required trajectory knowable in advance. That is preview, the one advantage that survived</span>
    <span class="tok-comment">/// every ablation in this project.</span>
    hold_point: Vec,
    <span class="tok-comment">/// Where the held point sits relative to the FOOT AVERAGE, in the ground plane.</span>
    hold_offset: [<span class="tok-num">2</span>]f32,
    hold_height: f32,
    <span class="tok-comment">/// How far the gripper actually drifts from the point it is holding. The score.</span>
    hold_error: f32,
    hold_worst: f32,
    arm_act: ctl.Actuation,
    gripper: u32,
    arm_target: []f32,
    arm_error: f32,
    foot_slip: f32,
    cone_worst: f32,
    cone_over: u32,
    font: z.Font,
    <span class="tok-comment">/// The pose being held - the full `qpos` (balls included) as the `home` keyframe posed it.</span>
    home: []f32,
    <span class="tok-comment">/// Which DOFs have a motor. See `control`.</span>
    actuated: []bool,
    <span class="tok-comment">/// Servo gains, live.</span>
    kp: f32,
    kv: f32,
    <span class="tok-comment">/// Which free body the next throw will use, cycling through `ball_count`.</span>
    next_ball: usize,
    <span class="tok-comment">/// Set by the panel, consumed by `update` once the camera is known.</span>
    want_throw: bool,
    <span class="tok-comment">/// Meshes for the three geom shapes the Go1 actually uses.</span>
    cylinder: z.Mesh,
    sphere: z.Mesh,
    cube: z.Mesh,
    transform: [<span class="tok-num">1</span>]Mat,
    accumulator: f32,
    physics_on: bool,
    peak_force: f32,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.gpa = gpa;
    <span class="tok-comment">// * KEPT FOR THE STATE'S LIFETIME, freed in `deinit`. It used to be freed on the way out of</span>
    <span class="tok-comment">// this function, which left every name the importer borrowed dangling - `bodyIndex("trunk")`</span>
    <span class="tok-comment">// compared against freed memory every frame and only worked by falling back to body 1.</span>
    s.xml_text = <span class="tok-kw">try</span> <span class="tok-fn">mjcfWithArm</span>(gpa);
    s.doc = <span class="tok-kw">try</span> z.codecs.xml.<span class="tok-fn">parse</span>(gpa, s.xml_text, null);
    s.robot = <span class="tok-kw">try</span> mjcf.<span class="tok-fn">readRobot</span>(gpa, &amp;s.doc);
    <span class="tok-comment">// * THE PROJECTILES JOIN THE ROBOT'S TREE, which is what makes them able to hit it.</span>
    <span class="tok-comment">// A ball in zimrphysics alone would be resolved by a different solver treating the robot</span>
    <span class="tok-comment">// as immovable - the exact approximation section 4k removed. In the tree, an impact is one</span>
    <span class="tok-comment">// constraint between two inertias and the legs feel the real mass.</span>
    <span class="tok-kw">var</span> balls: [ball_count]z.robot_scene.FreeBody = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..ball_count) |i| {
        balls[i] = .{
            .name = ball_names[i],
            .pos = <span class="tok-fn">parkedBall</span>(i),
            .geoms = &amp;.{.{ .shape = .{ .sphere = .{ .radius = ball_radius } }, .mass = <span class="tok-num">0.6</span> }},
        };
    }
    s.imported = <span class="tok-kw">try</span> rmj.<span class="tok-fn">buildScene</span>(gpa, &amp;s.robot, &amp;balls, .{
        .max_contacts = <span class="tok-num">128</span>,
        .timestep = timestep,
        <span class="tok-comment">// Z-up, to match the model's own frame.</span>
        .gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">9.81</span>),
    });
    s.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);

    s.world = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, <span class="tok-num">128</span>);
    s.world.gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">9.81</span>);
    <span class="tok-kw">const</span> ground: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">5</span>, <span class="tok-num">5</span>, <span class="tok-num">0.5</span>), .convex_radius = <span class="tok-num">0.01</span> },
    });
    _ = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{
        .shape = ground,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">0.5</span>),
        .motion_type = .static,
    });

    <span class="tok-comment">// * THE RESULT IS CHECKED. Discarding it is how the pose silently stopped being applied the</span>
    <span class="tok-comment">// moment the arm changed `nq` - the humanoid's comment says exactly this and it happened</span>
    <span class="tok-comment">// again anyway.</span>
    <span class="tok-kw">if</span> (!rmj.<span class="tok-fn">applyKeyframe</span>(&amp;s.imported.model, &amp;s.data, s.robot.keyframes[<span class="tok-num">0</span>])) {
        std.log.<span class="tok-fn">err</span>(<span class="tok-str">"quadruped: home keyframe refused — {d} numbers for nq {d}"</span>, .{
            s.robot.keyframes[<span class="tok-num">0</span>].qpos.len, s.imported.model.nq,
        });
    }
    rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);
    s.bridge = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, &amp;s.world, &amp;s.imported.model, &amp;s.data, <span class="tok-num">128</span>);
    s.bridge.<span class="tok-fn">listen</span>(&amp;s.world);

    <span class="tok-comment">// -- *** A STIFFER CONTACT, WHICH CUTS THE FOOT CREEP 5.2x FOR FREE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The feet slide about a metre in twenty seconds while standing perfectly still, with the</span>
    <span class="tok-comment">// friction demand at only 0.20 of the cone - creep, not slip, so more friction would raise a</span>
    <span class="tok-comment">// limit that is never reached.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Measured over 20 static seconds, slide and cost together:</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//     as shipped (0.9/0.95, width 1e-3)   0.8097 m   301,988 ns/step</span>
    <span class="tok-comment">//     tolerance 1e-8 and 1e-10            0.8097 m   (identical - not the lever)</span>
    <span class="tok-comment">//     stiff + narrow (0.99, width 1e-4)   0.1545 m   301,854 ns/step</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// ** THE COST IS A WASH - 301,854 against 301,988, inside the noise. No extra iterations, no</span>
    <span class="tok-comment">// new state: the same arithmetic with a different constant. **A stiffer constraint leaves</span>
    <span class="tok-comment">// less residual velocity per step, and it is that residual which integrates into creep.**</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * AND THE CONE OCCUPANCY STAYS AT 0.24, well inside its limit - the creep did not stop by</span>
    <span class="tok-comment">// trading itself for friction saturation, which was the failure mode worth guarding against.</span>
    <span class="tok-comment">// The robot is still held by grip it would really have.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// This is MuJoCo's `impratio` idea reached from the other end: it stiffens friction relative</span>
    <span class="tok-comment">// to normal, and on a PYRAMID basis - where no row is purely frictional - stiffening the</span>
    <span class="tok-comment">// whole contact is the version actually available.</span>
    s.bridge.flesh.thickness_m = <span class="tok-num">0.0001</span>;
    s.bridge.flesh.soft_min = <span class="tok-num">0.99</span>;

    <span class="tok-comment">// * THE FULL `qpos`, NOT THE KEYFRAME. `home` is indexed by the model's qpos addresses, and</span>
    <span class="tok-comment">// a keyframe covers only the robot's prefix - the balls come after it. Sized from the</span>
    <span class="tok-comment">// keyframe, a short one let `control` index past the end, and `resetEverything`'s</span>
    <span class="tok-comment">// `@memcpy(s.home, s.data.pos)` trapped on the length mismatch (23 against 65).</span>
    s.home = <span class="tok-kw">try</span> gpa.<span class="tok-fn">dupe</span>(f32, s.data.pos);

    <span class="tok-comment">// * WHICH DOFs HAVE A MOTOR, decided once. The trunk's free joint does not, and</span>
    <span class="tok-comment">// forgetting that makes the robot FLY - gravity compensation on an unactuated DOF cancels</span>
    <span class="tok-comment">// the machine's own weight. Third time this rule has come up; computing it here instead</span>
    <span class="tok-comment">// of testing `jnt_type` inline is how it stops coming up.</span>
    s.actuated = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(bool, s.imported.model.nv);
    <span class="tok-builtin">@memset</span>(s.actuated, false);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.imported.model.njnt) |j| {
        <span class="tok-kw">if</span> (s.imported.model.jnt_type[j] == .hinge) {
            s.actuated[s.imported.model.jnt_dof_adr[j]] = true;
        }
    }

    <span class="tok-comment">// * THE GENERATED CYLINDER SPANS z in [0, height], NOT [-h/2, +h/2]. Its parametric</span>
    <span class="tok-comment">// surface is `(r*sin theta, r*cos theta, height*u)` with `u in [0,1]`, so a unit cylinder sits</span>
    <span class="tok-comment">// entirely ABOVE the origin. Scaling it to a capsule's length therefore offsets every</span>
    <span class="tok-comment">// limb by half its own length - legs that float away from their joints. Generating it</span>
    <span class="tok-comment">// pre-centred is one number here and saves a translate in every draw.</span>
    s.cylinder = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCylinder</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">16</span>, <span class="tok-num">2</span>);
    s.sphere = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">10</span>, <span class="tok-num">8</span>);
    s.cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    s.transform = .{<span class="tok-fn">identity</span>()};
    s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0</span>), <span class="tok-num">1.4</span>);
    s.font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font);

    <span class="tok-comment">// -- * ONE IK MASK AND ONE PINNED FOOT PER LEG --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The foot is the sphere geom at the end of each calf. Its planted position is captured</span>
    <span class="tok-comment">// from the STANDING pose, so "hold the feet still" means where the robot actually put</span>
    <span class="tok-comment">// them rather than where the model nominally says they go.</span>
    <span class="tok-kw">const</span> leg_tips = [<span class="tok-num">4</span>][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"FR_calf"</span>, <span class="tok-str">"FL_calf"</span>, <span class="tok-str">"RR_calf"</span>, <span class="tok-str">"RL_calf"</span> };
    <span class="tok-kw">for</span> (leg_tips, <span class="tok-num">0</span>..) |name, i| {
        <span class="tok-kw">const</span> body: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(name).?;
        s.foot_body[i] = body;
        s.legs[i] = <span class="tok-kw">try</span> ctl.<span class="tok-fn">limbActuation</span>(gpa, &amp;s.imported.model, body);
        <span class="tok-kw">var</span> offset: Vec = zm.vec_zero;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.imported.model.ngeom) |g| {
            <span class="tok-kw">if</span> (s.imported.model.geom_body[g] != body) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">switch</span> (s.imported.model.geom_shape[g]) {
                <span class="tok-comment">// The foot is the sphere at the end of the calf; its offset in the body's</span>
                <span class="tok-comment">// frame is what makes the planted point the FOOT rather than the calf's origin.</span>
                .sphere =&gt; offset = s.imported.model.geom_pos[g],
                <span class="tok-kw">else</span> =&gt; {},
            }
        }
        s.foot_offset[i] = offset;
    }

    <span class="tok-comment">// -- * THE ARM'S OWN ACTUATION MASK AND TARGET BUFFER --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `limbActuation` walks the chain from the gripper to the root, so the mask covers exactly</span>
    <span class="tok-comment">// the four arm joints and nothing else - the legs stay under the torso controller, which is</span>
    <span class="tok-comment">// what keeps the two problems separate and the experiment honest.</span>
    <span class="tok-comment">// * ONCE, OUTSIDE THE LEG LOOP. It used to sit inside the per-leg geom loop, so both were</span>
    <span class="tok-comment">// allocated once per calf geom and only the last pair was ever freed.</span>
    s.gripper = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"gripper"</span>) <span class="tok-kw">orelse</span> <span class="tok-num">0</span>;
    s.arm_act = <span class="tok-kw">try</span> ctl.<span class="tok-fn">limbActuation</span>(gpa, &amp;s.imported.model, s.gripper);
    s.arm_target = <span class="tok-kw">try</span> gpa.<span class="tok-fn">dupe</span>(f32, s.data.pos);
    s.ik_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, ctl.Ik.<span class="tok-fn">scratchSize</span>(&amp;s.imported.model));
    s.body_roll = <span class="tok-num">0</span>;
    s.body_pitch = <span class="tok-num">0</span>;
    s.body_yaw = <span class="tok-num">0</span>;
    s.body_height = <span class="tok-num">0</span>;
    s.posing = false;
    s.pose_error = <span class="tok-num">0</span>;
    s.gait_on = false;
    s.arm_swing_amp = <span class="tok-num">0.0</span>;
    s.arm_lift_amp = <span class="tok-num">0.7</span>;
    s.arm_lift_rate = <span class="tok-num">0.11</span>;
    s.arm_swing_phase = <span class="tok-num">0.75</span>;
    s.gait_phase = <span class="tok-num">0</span>;
    <span class="tok-comment">// -- * SWEPT AGAINST DISTANCE TRAVELLED, NOT CHOSEN --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// With the stance direction corrected, 10 s of trot on stiffened contacts:</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//     hz 1.4  stride 0.10  duty 0.65   -0.21 m   (too short a stride to propel)</span>
    <span class="tok-comment">//     hz 1.4  stride 0.16  duty 0.65   +1.04 m</span>
    <span class="tok-comment">//     hz 2.0  stride 0.16  duty 0.60   **+1.43 m**   &lt;- best</span>
    <span class="tok-comment">//     hz 2.4  stride 0.20  duty 0.55   +0.17 m   (too fast: less time in stance)</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THE STRIDE MATTERS MORE THAN THE RATE. 0.06 m - the old default - is small enough that</span>
    <span class="tok-comment">// the feet barely displace the body at all, which is part of why the gait read as "very</span>
    <span class="tok-comment">// slow" independently of its direction.</span>
    <span class="tok-comment">// WIP AND THE SWEEP ABOVE WAS RUN ON A **BARE GO1**. This robot carries a 1.94 kg arm high on</span>
    <span class="tok-comment">// the trunk, which the probe never had - so those distances describe a different machine.</span>
    <span class="tok-comment">// Taking the best row from it and raising the stride 2.7x (0.06 -&gt; 0.16) tipped the real</span>
    <span class="tok-comment">// demo over backwards immediately.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// *** THREE PARAMETERS CHANGED AT ONCE, FROM A MEASUREMENT OF SOMETHING ELSE. Each part of</span>
    <span class="tok-comment">// that is a mistake on its own: a sweep on the wrong model, and no isolation between the</span>
    <span class="tok-comment">// sign fix (which is certainly right) and the tuning (which was not tested here).</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Backed off to a stride only slightly above the original, with the CORRECTED direction -</span>
    <span class="tok-comment">// so the sign fix is kept and the untested tuning is not. **The sliders are live; sweep them</span>
    <span class="tok-comment">// on this robot rather than trusting numbers from the other one.**</span>
    <span class="tok-comment">// *** MEASURED FORWARD **WITH THE ARM**, which the earlier sweep was not. Trot, 10 s:</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//     hz 2.0  stride 0.16  duty 0.60   **+0.567 m**  stands (z 0.298)</span>
    <span class="tok-comment">//     hz 1.6  stride 0.08  duty 0.75     -0.931 m    stands, backward</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THE SECOND ROW IS WHAT THIS WAS BACKED OFF TO LAST TURN, on the strength of a probe</span>
    <span class="tok-comment">// whose edit had failed - so its output was a STALE binary's. **The two settings were</span>
    <span class="tok-comment">// exactly the wrong way round**, and the stale-binary trap cost a real conclusion.</span>
    s.gait_hz = <span class="tok-num">1.4</span>;
    <span class="tok-comment">// *** 0.20, MEASURED - 3.2x FURTHER THAN 0.14 AND STILL SOLID. Crawl, 10 s:</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//     hz 1.4  stride 0.14   0.207 m   z 0.302</span>
    <span class="tok-comment">//     hz 1.4  stride 0.20  **0.655 m**  z 0.307   &lt;- this</span>
    <span class="tok-comment">//     hz 1.4  stride 0.26  FELL at 2.96 s</span>
    <span class="tok-comment">//     hz 2.0  stride 0.20   0.134 m   (faster is WORSE)</span>
    <span class="tok-comment">//     hz 2.5  stride 0.20  FELL at 1.87 s</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * STRIDE IS THE LEVER AND RATE IS NOT. Raising `hz` shortens the time each foot has to</span>
    <span class="tok-comment">// settle before the next one lifts, and on a crawl that is the whole margin - 2.0 costs</span>
    <span class="tok-comment">// two thirds of the distance and 2.5 falls over. **Longer steps, not faster ones.**</span>
    s.gait_stride = <span class="tok-num">0.20</span>;
    <span class="tok-comment">// *** 0.08, AND IT NEARLY TRIPLES THE DISTANCE. Foot lift decides whether a swinging foot</span>
    <span class="tok-comment">// CLEARS or catches, and a catch on a top-heavy robot is a trip. Measured at amp 0.3 /</span>
    <span class="tok-comment">// phase 0.75 / hz 2.0 / stride 0.16 / duty 0.60:</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//     lift 0.03   0.379 m</span>
    <span class="tok-comment">//     lift 0.05   0.843 m</span>
    <span class="tok-comment">//     lift 0.08   **0.957 m**</span>
    <span class="tok-comment">//     lift 0.12   FELL</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// ** AND AT 0.08 THE ARM SWING BECOMES NECESSARY RATHER THAN MERELY HELPFUL: with</span>
    <span class="tok-comment">// `arm_swing_amp` at zero the robot **falls at 6.22 s**. That is the demonstrated failure</span>
    <span class="tok-comment">// the arm was missing - for the first time it fixes something instead of not hurting.</span>
    s.gait_lift = <span class="tok-num">0.06</span>;
    <span class="tok-comment">// -- ** DUTY IS THE WHOLE DIFFERENCE BETWEEN STANDING UP AND FALLING OVER --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Duty is the fraction of the cycle a foot spends ON THE GROUND. Measured on the Go1,</span>
    <span class="tok-comment">// trotting at 1.6 Hz, over ten seconds:</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//     duty 0.50  -&gt;  sags to 0.11 m, on its belly</span>
    <span class="tok-comment">//     duty 0.70  -&gt;  falls at 2.5 s</span>
    <span class="tok-comment">//     duty 0.85  -&gt;  z 0.346, minimum 0.332 - no sag at all</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// At 0.5 a trot has only two feet down at any instant and the Go1 cannot hold itself up</span>
    <span class="tok-comment">// on a diagonal pair for that long. 0.85 keeps three or four down almost always, which is</span>
    <span class="tok-comment">// a cautious gait and a standing one.</span>
    <span class="tok-comment">// * 0.60, measured with the arm present rather than reasoned about without it.</span>
    s.gait_duty = <span class="tok-num">0.80</span>;
    <span class="tok-comment">// Trot: diagonal pairs together. Leg order is FR, FL, RR, RL.</span>
    <span class="tok-comment">// *** THE CRAWL IS THE DEFAULT because it is the one that never falls. The trot travels 4.6x</span>
    <span class="tok-comment">// further (0.957 m against 0.207) and is one button away - but it is fragile, needs the arm's</span>
    <span class="tok-comment">// counter-swing, and topples if the attitude trim is left on. **"Move and do not fall" is the</span>
    <span class="tok-comment">// goal, and three feet down is how a robot does that.**</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THE PHASING AND THE TIMINGS MUST MATCH. Crawl offsets at trot rate and duty fall over;</span>
    <span class="tok-comment">// that mismatch is exactly what earned this pattern a "(falls)" label it did not deserve.</span>
    s.gait_offset = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0.75</span> };
    s.pose_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.imported.model.nq);
    s.rest_height = s.data.pos[s.imported.model.jnt_qpos_adr[<span class="tok-num">0</span>] + <span class="tok-num">2</span>];
    s.rest_rot = zm.quat_identity;
    s.stance = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.imported.model.nq);
    s.last_cmd = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    s.trim_roll = <span class="tok-num">0</span>;
    s.trim_pitch = <span class="tok-num">0</span>;
    s.trim_countdown = <span class="tok-num">0</span>;
    s.seen_roll = <span class="tok-num">0</span>;
    s.seen_pitch = <span class="tok-num">0</span>;
    <span class="tok-comment">// *** ON BY DEFAULT. The demo's whole argument is a robot weaving while a gripper hangs</span>
    <span class="tok-comment">// motionless in space, and that required two clicks to see. A demo that idles until clicked</span>
    <span class="tok-comment">// gets seen once - and its smoke test verifies an idle scene, which is how three bugs hid</span>
    <span class="tok-comment">// in `examples/catch`.</span>
    s.routine = true;
    s.routine_clock = <span class="tok-num">0</span>;
    <span class="tok-comment">// * INCOMMENSURATE ON PURPOSE - 0.55 and 0.31 have no small common multiple, so the pattern</span>
    <span class="tok-comment">// drifts forever instead of closing into a short loop.</span>
    <span class="tok-comment">// * FOUR INCOMMENSURATE RATES, AND THE GAIT'S 1.4 IS DELIBERATELY NOT AMONG THEM. A torso</span>
    <span class="tok-comment">// motion locked to the footfall reads as a limp; one that drifts against it reads as</span>
    <span class="tok-comment">// dancing, and never repeats.</span>
    s.cone_rate = <span class="tok-num">0.31</span>;
    s.roll_rate = <span class="tok-num">0.23</span>;
    <span class="tok-comment">// * MEASURED TO STAND. cone/roll/bob of 0.22/0.20/0.035 also stands but drifts 29 mm; this</span>
    <span class="tok-comment">// middle setting holds the gripper to 20 mm and still weaves visibly.</span>
    <span class="tok-comment">// *** THE MEASURED EDGE: 0.14 rad of roll and pitch (8 degrees), 3.5 cm of bob, and a big</span>
    <span class="tok-comment">// slow arm sweep - the largest amplitudes that still WALK. 0.18 falls at 6.42 s.</span>
    s.cone_amount = <span class="tok-num">0.14</span>;
    s.roll_amount = <span class="tok-num">0.14</span>;
    s.bob_rate = <span class="tok-num">0.17</span>;
    s.bob_amount = <span class="tok-num">0.035</span>;
    s.routine_error_sum = <span class="tok-num">0</span>;
    s.routine_error_count = <span class="tok-num">0</span>;
    s.routine_worst = <span class="tok-num">0</span>;
    s.arm_on = true;
    s.arm_clock = <span class="tok-num">0</span>;
    s.arm_rate = <span class="tok-num">0.35</span>;
    s.arm_reach = <span class="tok-num">0.34</span>;
    s.hold_point = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    s.hold_offset = .{ <span class="tok-num">0.22</span>, <span class="tok-num">0</span> };
    s.hold_height = <span class="tok-num">0.62</span>;
    s.hold_error = <span class="tok-num">0</span>;
    s.hold_worst = <span class="tok-num">0</span>;
    s.arm_error = <span class="tok-num">0</span>;
    s.foot_slip = <span class="tok-num">0</span>;
    s.cone_worst = <span class="tok-num">0</span>;
    s.cone_over = <span class="tok-num">0</span>;
    s.kp = <span class="tok-num">100.0</span>;
    <span class="tok-comment">// -- *** SIX, NOT TWO. THE DAMPING RATIO WAS OFF AND THE FEET PAID FOR IT --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `kv = 2` against `kp = 100` is badly underdamped: the ratio-preserving value is about 6.</span>
    <span class="tok-comment">// An underdamped leg oscillates about its target, and an oscillating foot alternately grips</span>
    <span class="tok-comment">// and breaks away - which is a better account of "the feet slide" than stiffness alone.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Measured over the 12 s routine, total foot slip and friction-cone violations:</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//     kp 100, kv  2    slip 1.079 m   2452 ticks over the cone   &lt;- was</span>
    <span class="tok-comment">//     kp 100, kv  6    slip 0.945 m   2217 ticks               &lt;- now</span>
    <span class="tok-comment">//     kp 100, kv 12    slip 21.75 m   7206 ticks   (overdamped, far worse)</span>
    <span class="tok-comment">//     kp 200, kv  8    slip 2.813 m   7838 ticks</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * AND BOTH DIRECTIONS ARE WORSE, which is what makes this a minimum rather than a guess.</span>
    <span class="tok-comment">// Stiffer slides more; much softer slides more; only the damping ratio was actually wrong.</span>
    s.kv = <span class="tok-num">6.0</span>;
    s.next_ball = <span class="tok-num">0</span>;
    s.want_throw = false;
    s.accumulator = <span class="tok-num">0</span>;
    s.physics_on = true;
    s.peak_force = <span class="tok-num">0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    gpa.<span class="tok-fn">free</span>(s.arm_target);
    s.arm_act.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cylinder);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.sphere);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cube);
    gpa.<span class="tok-fn">free</span>(s.stance);
    gpa.<span class="tok-fn">free</span>(s.pose_scratch);
    gpa.<span class="tok-fn">free</span>(s.ik_scratch);
    <span class="tok-kw">for</span> (&amp;s.legs) |*leg| {
        leg.<span class="tok-fn">deinit</span>();
    }
    s.ui_host.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    gpa.<span class="tok-fn">free</span>(s.actuated);
    gpa.<span class="tok-fn">free</span>(s.home);
    s.bridge.<span class="tok-fn">deinit</span>(&amp;s.world);
    s.world.<span class="tok-fn">deinit</span>(gpa);
    s.data.<span class="tok-fn">deinit</span>();
    s.imported.<span class="tok-fn">deinit</span>();
    s.robot.<span class="tok-fn">deinit</span>();
    s.doc.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.xml_text);
}

<span class="tok-comment">/// Hold the home pose.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** PLAIN PD, NOT COMPUTED TORQUE, and the reason is the floating base --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `tau = M*a*` is the right controller for an arm bolted to a table, and it is what `robot_3d`</span>
<span class="tok-comment">/// uses. It cannot work here. The mass matrix spans the trunk's six unactuated DOFs, so</span>
<span class="tok-comment">/// solving it produces accelerations the trunk has no motor to make; zeroing those rows</span>
<span class="tok-comment">/// afterwards leaves the legs supplying a difference nobody asked for. **Measured: the robot</span>
<span class="tok-comment">/// folded to 0.08 m against a 0.27 m home** - which looks exactly like a gains problem and is</span>
<span class="tok-comment">/// not one.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// What the Go1's own file describes is simpler and correct: a position servo per joint,</span>
<span class="tok-comment">/// clamped to that joint's force rating.</span>
<span class="tok-comment">/// Move the torso to the commanded pose while every foot stays where it stands.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** THE STANDARD QUADRUPED TRICK, AND WHY IT WORKS --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// A torso has no motors. It cannot be commanded anywhere. But it is standing on four legs</span>
<span class="tok-comment">/// whose feet are on the ground, so **moving the body is the same problem as moving four</span>
<span class="tok-comment">/// hips while four feet hold still** - and that IS a joint-space problem, three joints at a</span>
<span class="tok-comment">/// time.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// So: write the wanted torso pose straight into the free joint, then ask each leg on its own</span>
<span class="tok-comment">/// to put its foot back where it was. The result is a full `qpos` the PD controller can hold,</span>
<span class="tok-comment">/// and the legs physically push the body into place because the feet have friction.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- * THE SOLVE RUNS ON A COPY --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `Ik.solve` writes joint angles into `data` - it IS the answer. Doing that to the live state</span>
<span class="tok-comment">/// would teleport the robot every frame: no dynamics, no contact, no falling over when the</span>
<span class="tok-comment">/// pose is impossible. The result becomes a TARGET instead, so the robot travels there under</span>
<span class="tok-comment">/// its own torque limits and can fail to arrive.</span>
<span class="tok-comment">/// Capture where the feet are standing and how high the torso is, as the reference the</span>
<span class="tok-comment">/// sliders are relative to.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** THIS HAPPENS WHEN POSING IS SWITCHED ON, NOT AT STARTUP, and the difference is the</span>
<span class="tok-comment">/// whole thing working or not. At startup the robot is at its `home` keyframe and has not</span>
<span class="tok-comment">/// touched the ground yet; it then settles and **rises from 0.270 to 0.332** as the legs take</span>
<span class="tok-comment">/// its weight. Feet captured before that are 6 cm below where the robot actually stands, so</span>
<span class="tok-comment">/// the first solve asks every leg to stretch down to a floor that is no longer there - and</span>
<span class="tok-comment">/// the robot folds flat, which reads as the pose controller being broken.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Capturing on activation also makes the sliders mean the obvious thing: zero is wherever</span>
<span class="tok-comment">/// the robot was when you ticked the box.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">captureStance</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |i| {
        <span class="tok-kw">const</span> body: u32 = s.foot_body[i];
        s.planted[i] = s.data.body_xpos[body] + zm.<span class="tok-fn">rotate</span>(s.data.body_xrot[body], s.foot_offset[i]);
        <span class="tok-comment">// * AND THE SAME POINT IN THE TORSO'S FRAME, which is what a gait cycles around.</span>
        s.foot_rest[i] = zm.<span class="tok-fn">rotate</span>(
            zm.<span class="tok-fn">conjugate</span>(s.data.body_xrot[<span class="tok-num">1</span>]),
            s.planted[i] - s.data.body_xpos[<span class="tok-num">1</span>],
        );
    }
    s.rest_height = s.data.pos[m.jnt_qpos_adr[<span class="tok-num">0</span>] + <span class="tok-num">2</span>];
    s.rest_rot = s.data.body_xrot[<span class="tok-num">1</span>];
    <span class="tok-builtin">@memcpy</span>(s.stance, s.data.pos);
    s.last_cmd = .{ <span class="tok-num">1e9</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> }; <span class="tok-comment">// force one solve</span>
    <span class="tok-comment">// * THE TRIM RESETS WITH THE STANCE. It is an integrator, and an integrator carried across</span>
    <span class="tok-comment">// a teleport is the same class of stale state as a warm start nobody cleared.</span>
    s.trim_roll = <span class="tok-num">0</span>;
    s.trim_pitch = <span class="tok-num">0</span>;
    s.trim_countdown = <span class="tok-num">0</span>;
    s.body_roll = <span class="tok-num">0</span>;
    s.body_pitch = <span class="tok-num">0</span>;
    s.body_yaw = <span class="tok-num">0</span>;
    s.body_height = <span class="tok-num">0</span>;
}

<span class="tok-comment">/// Where a foot should be at a given point in its cycle, in the stance frame.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** A GAIT IS A FOOT TRAJECTORY AND FOUR PHASE OFFSETS --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Each leg runs the same cycle and they differ only in WHERE IN IT they are:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///   * **stance** (`phase &lt; duty`) - the foot is on the ground and travels straight backwards</span>
<span class="tok-comment">///     under the body. This is what actually moves the robot: the body goes forward because</span>
<span class="tok-comment">///     the planted foot goes back.</span>
<span class="tok-comment">///   * **swing** (`phase &gt;= duty`) - the foot lifts and arcs forward to where stance will</span>
<span class="tok-comment">///     start again.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * AND THE FAMOUS GAITS ARE THE SAME FUNCTION WITH DIFFERENT OFFSETS. Trot moves diagonal</span>
<span class="tok-comment">/// pairs together (0, 0.5, 0.5, 0); pace moves the legs on each side together (0, 0.5, 0,</span>
<span class="tok-comment">/// 0.5); bound moves front and back pairs (0, 0, 0.5, 0.5); walk spreads them evenly at</span>
<span class="tok-comment">/// quarters. **Four numbers, not four algorithms** - which is worth seeing rather than being</span>
<span class="tok-comment">/// told.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">footOffsetInCycle</span>(phase: f32, stride: f32, lift: f32, duty: f32) Vec {
    <span class="tok-kw">const</span> wrapped: f32 = phase - <span class="tok-builtin">@floor</span>(phase);
    <span class="tok-kw">if</span> (wrapped &lt; duty) {
        <span class="tok-comment">// -- *** STANCE: THE FOOT TRAVELS BACKWARD RELATIVE TO THE BODY --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// `t` runs 0 to 1, so `0.5 - t` runs +stride/2 to -stride/2: the planted foot moves</span>
        <span class="tok-comment">// backward under the body, and the body is carried forward. That is what walking is.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// ** THIS WAS `stride * (t - 0.5)` - the opposite - while the comment above it claimed</span>
        <span class="tok-comment">// this behaviour. **A comment describing the intent while the code did the reverse**,</span>
        <span class="tok-comment">// which is the third time in this project that a comment and its code disagreed and the</span>
        <span class="tok-comment">// comment turned out to be the correct statement of what was wanted.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Measured over 10 s, trot, with the stiffened contacts:</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">//     as written    hz 2.4  stride 0.20   **-5.25 m** (backward)</span>
        <span class="tok-comment">//     as written    hz 2.0  stride 0.16   -3.85 m</span>
        <span class="tok-comment">//     corrected     hz 2.0  stride 0.16   **+1.43 m** (forward)</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * AND THE OLD NOTE RECORDED ONLY "about half a metre backwards", which is why this</span>
        <span class="tok-comment">// read as slipping rather than as a sign error. **The contact stiffening from the creep</span>
        <span class="tok-comment">// work is what made the feet grip**; once they gripped, a weak ambiguous drift became</span>
        <span class="tok-comment">// unmistakable propulsion in the wrong direction.</span>
        <span class="tok-kw">const</span> t: f32 = wrapped / duty;
        <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(stride * (<span class="tok-num">0.5</span> - t), <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    }
    <span class="tok-comment">// Swing: forward again, lifting in an arc that starts and ends at ground level.</span>
    <span class="tok-kw">const</span> t: f32 = (wrapped - duty) / (<span class="tok-num">1.0</span> - duty);
    <span class="tok-comment">// A HALF turn across the swing: zero at lift-off, zero at touch-down, peak in the</span>
    <span class="tok-comment">// middle. `t` is already the fraction of the swing, so the `* pi` was only ever</span>
    <span class="tok-comment">// there to reach `@sin`.</span>
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(stride * (t - <span class="tok-num">0.5</span>), <span class="tok-num">0</span>, lift * <span class="tok-fn">sinTurns</span>(t * <span class="tok-num">0.5</span>));
}

<span class="tok-comment">/// Drive a gait by moving each foot's IK target around its cycle.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** WHAT THIS IS, AND WHAT IT IS NOT --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// This is an OPEN-LOOP gait: the feet trace a fixed cycle and the robot stays upright. It is</span>
<span class="tok-comment">/// the simplest thing that deserves the name, and it demonstrates the stack - per-leg IK,</span>
<span class="tok-comment">/// contact, a torque-limited controller - end to end.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// **It does not propel the robot properly.** Measured over ten seconds it drifts about half a</span>
<span class="tok-comment">/// metre BACKWARDS whichever way the stance direction is set, which means the feet are slipping</span>
<span class="tok-comment">/// through stance rather than gripping and pushing. The reason is structural rather than a</span>
<span class="tok-comment">/// tuning miss: **the torso is commanded at its captured stance pose every frame**, so the legs</span>
<span class="tok-comment">/// are always solving to put the body back where it started. The gait modulates the feet while</span>
<span class="tok-comment">/// the body command quietly fights any forward motion they produce.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Making it walk properly means commanding the body FORWARD as well - a velocity to track</span>
<span class="tok-comment">/// rather than a pose to hold - and then the foot placement has to respond to where the body</span>
<span class="tok-comment">/// actually got to. That is a controller with feedback, which is what MPC and a learned policy</span>
<span class="tok-comment">/// both are, and is the right place to solve it rather than here.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THIS IS `solveBodyPose` WITH TARGETS THAT MOVE. The body-pose controller already holds</span>
<span class="tok-comment">/// four feet at commanded world positions through per-leg IK; a gait commands different</span>
<span class="tok-comment">/// positions each frame. That the two share everything is not a coincidence - standing is a</span>
<span class="tok-comment">/// gait whose feet happen not to go anywhere.</span>
<span class="tok-comment">/// Put the whole scene back exactly as it started.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** WHAT "EVERYTHING" TURNED OUT TO MEAN --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Three attempts at this button failed, each because something ELSE remembered where things</span>
<span class="tok-comment">/// had got to. Written out, because the list is longer than it looks and every omission</span>
<span class="tok-comment">/// produced a different confusing symptom:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///   * **`home`** - what the PD controller tracks. Teleporting `data.pos` alone puts the robot</span>
<span class="tok-comment">///     at the keyframe for exactly one frame before the controller drags it back, which reads</span>
<span class="tok-comment">///     as the button doing nothing.</span>
<span class="tok-comment">///   * **Velocities** - a robot reset mid-fall keeps its downward speed and falls again from</span>
<span class="tok-comment">///     the new position, which looks like the reset placing it badly.</span>
<span class="tok-comment">///   * **The PROJECTILES.** This was the one that actually exploded. Thrown balls are free</span>
<span class="tok-comment">///     bodies in the same tree and stay where they landed; put the robot back at the origin</span>
<span class="tok-comment">///     and it materialises INSIDE whichever ball came to rest there. Deep overlap, enormous</span>
<span class="tok-comment">///     restoring force, robot across the map.</span>
<span class="tok-comment">///   * **The gait and pose modes** - left running, the next frame immediately commands a</span>
<span class="tok-comment">///     walking pose and the keyframe is never seen.</span>
<span class="tok-comment">///   * **The captured stance** - what the sliders and the gait are relative to.</span>
<span class="tok-comment">///   * **The warm start and the accumulator** - the solver's carried forces, and any physics</span>
<span class="tok-comment">///     substeps the frame still owed.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * AND THE ROBOT GOES BACK TO THE ORIGIN. An earlier version kept its position and heading,</span>
<span class="tok-comment">/// on the theory that "reset" means "stand up here". It does not: it means put it back.</span>
<span class="tok-comment">/// Put the arm back to its half-bent rest, in `s.data.pos` and in the commanded `s.home`.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * HALF BENT IS A CHOICE WITH A REASON: it leaves 2.4 rad of travel each way, so the arm can</span>
<span class="tok-comment">/// swing in either direction. Folded or extended, it can only help one way - and the gait's</span>
<span class="tok-comment">/// counter-swing needs both halves of the cycle.</span>
<span class="tok-comment">/// The arm's rest pose, root to tip: yaw, shoulder, elbow, wrist.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** HALF BENT IS A CHOICE WITH A REASON --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// It leaves roughly 2.4 rad of travel each way, so the shoulder can sweep in both directions</span>
<span class="tok-comment">/// without approaching a stop. **An arm at its limit is dead weight at maximum lever arm** -</span>
<span class="tok-comment">/// the failure that saturated every balance attempt in this example's history - and both the</span>
<span class="tok-comment">/// gait's counter-swing and the routine's slow lift need room on either side.</span>
<span class="tok-kw">const</span> arm_rest = [_]f32{ <span class="tok-num">0.0</span>, <span class="tok-num">1.1</span>, -<span class="tok-num">1.6</span>, <span class="tok-num">0.5</span> };
<span class="tok-comment">/// The shoulder's rest angle, which the gait and routine sweep around.</span>
<span class="tok-kw">const</span> arm_rest_shoulder: f32 = arm_rest[<span class="tok-num">1</span>];

<span class="tok-comment">/// The `qpos` index of the arm's `n`th joint, counting root to tip, or null if there is none.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** IDENTIFIED BY ACTUATION MASK, NEVER BY NAME --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// An earlier version matched `s.robot.joints[j].name` using the MODEL's joint index `j`.</span>
<span class="tok-comment">/// **Those are two different orderings** - `robot.joints` is MJCF parse order, `j` is the</span>
<span class="tok-comment">/// importer's - so the comparison silently matched nothing, the arm kept its old pose, and a</span>
<span class="tok-comment">/// control signal went into whatever joint sat at that index. It compiled, linted and passed</span>
<span class="tok-comment">/// every gate.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * `limbActuation` FROM THE GRIPPER ALREADY MARKS EXACTLY THE ARM'S DOFS, and the gimbal's IK</span>
<span class="tok-comment">/// uses it - so it is verified by a feature that visibly works. **When the lookup you want does</span>
<span class="tok-comment">/// not exist, reach for a structure already proven by something else.**</span>
<span class="tok-kw">fn</span> <span class="tok-fn">armJointQ</span>(s: *<span class="tok-kw">const</span> State, n: usize) ?u32 {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">var</span> seen: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.njnt) |j| {
        <span class="tok-kw">if</span> (m.jnt_type[j] != .hinge) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> v: u32 = m.jnt_dof_adr[j];
