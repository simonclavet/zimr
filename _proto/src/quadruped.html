                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"bob size"</span>, &amp;s.bob_amount, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">0.07</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
                <span class="tok-comment">// * THE ARM'S SLOW SWEEP. Measured to cost nothing while walking - 0.696 m with</span>
                <span class="tok-comment">// the arm alone against 0.655 for the bare crawl.</span>
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"arm lift"</span>, &amp;s.arm_lift_amp, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">1.2</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"arm lift rate"</span>, &amp;s.arm_lift_rate, .{ .min = <span class="tok-num">0.03</span>, .max = <span class="tok-num">0.4</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
                <span class="tok-kw">const</span> mean: f32 = <span class="tok-kw">if</span> (s.routine_error_count == <span class="tok-num">0</span>)
                    <span class="tok-num">0</span>
                <span class="tok-kw">else</span>
                    <span class="tok-builtin">@floatCast</span>(s.routine_error_sum / <span class="tok-fn">float64</span>(s.routine_error_count));
                <span class="tok-comment">// ** THE NUMBER THAT MATTERS. A routine that only looks impressive proves</span>
                <span class="tok-comment">// nothing; this says whether the controller is keeping up with it, and it is</span>
                <span class="tok-comment">// the quantity a planner would have to beat.</span>
                u.<span class="tok-fn">text</span>(<span class="tok-str">"  lag: mean {d:&gt;5.3} rad   worst {d:&gt;5.3}"</span>, .{ mean, s.routine_worst });
                u.<span class="tok-fn">text</span>(<span class="tok-str">"  rates are incommensurate — it never repeats"</span>, .{});
            }
            <span class="tok-comment">// *** SLIP AND CONE, ALWAYS ON. This is the quantity the whole "why do the feet</span>
            <span class="tok-comment">// slide" question turns on, and there was no way to see it. Above 1.0 the ground is</span>
            <span class="tok-comment">// being asked for force it does not have - which a position controller cannot even</span>
            <span class="tok-comment">// represent, let alone respect.</span>
            u.<span class="tok-fn">separator</span>();
            <span class="tok-comment">// -- * THE ARM --</span>
            <span class="tok-kw">if</span> (u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"gripper holds a fixed point (gimbal)"</span>, &amp;s.arm_on)) {
                s.arm_clock = <span class="tok-num">0</span>;
            }
            <span class="tok-kw">if</span> (s.arm_on) {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"hold height"</span>, &amp;s.hold_height, .{ .min = <span class="tok-num">0.45</span>, .max = <span class="tok-num">0.80</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"hold forward"</span>, &amp;s.hold_offset[<span class="tok-num">0</span>], .{ .min = -<span class="tok-num">0.1</span>, .max = <span class="tok-num">0.45</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
                <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"clear worst"</span>, .{})) {
                    s.hold_worst = <span class="tok-num">0</span>;
                }
                <span class="tok-comment">// ** THE GIMBAL'S SCORE. The body is weaving through three incommensurate</span>
                <span class="tok-comment">// frequencies; this is how far the gripper fails to ignore it.</span>
                <span class="tok-comment">// ** THE HEADLINE NUMBER. The body is weaving through three incommensurate</span>
                <span class="tok-comment">// frequencies; this is how completely the gripper ignores it.</span>
                u.<span class="tok-fn">text</span>(<span class="tok-str">"  gripper drift {d:&gt;6.4} m   worst {d:&gt;6.4}"</span>, .{ s.hold_error, s.hold_worst });
                u.<span class="tok-fn">text</span>(<span class="tok-str">"  (yellow crosshair = the point it holds)"</span>, .{});
                <span class="tok-comment">// ** HONEST ABOUT THE SLOW DRIFT. Verified over 30 s: the robot stays UP, but the</span>
                <span class="tok-comment">// gripper's mean error grows from 20 mm to 61 mm because the feet slide - the robot</span>
                <span class="tok-comment">// slowly walks away from a point that is fixed in the world. That is the same foot</span>
                <span class="tok-comment">// slip the readout above reports, arriving as a second symptom.</span>
                <span class="tok-kw">if</span> (s.hold_worst &gt; <span class="tok-num">0.09</span>) {
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"  drift growing — the feet are sliding."</span>, .{});
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"  re-place the point, or watch the cone number."</span>, .{});
                }
            }
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  foot slip {d:&gt;6.3} m   cone {d:&gt;4.2}x  over {d}"</span>, .{
                s.foot_slip, s.cone_worst, s.cone_over,
            });
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"clear slip"</span>, .{})) {
                <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |i| {
                    s.planted[i] = s.data.body_xpos[s.foot_body[i]] +
                        zm.<span class="tok-fn">rotate</span>(s.data.body_xrot[s.foot_body[i]], s.foot_offset[i]);
                }
                s.cone_worst = <span class="tok-num">0</span>;
                s.cone_over = <span class="tok-num">0</span>;
            }
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"yaw"</span>, &amp;s.body_yaw, .{ .min = -<span class="tok-num">0.6</span>, .max = <span class="tok-num">0.6</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            <span class="tok-comment">// * THE UP RANGE IS SMALLER THAN THE DOWN RANGE, and that is physical rather than</span>
            <span class="tok-comment">// arbitrary. The Go1 settles at 0.332 with thigh and calf each 0.213 m, so the legs</span>
            <span class="tok-comment">// are already well extended; asking for another 4 cm straightens them toward the</span>
            <span class="tok-comment">// singular configuration where a leg can no longer push vertically at all, and the</span>
            <span class="tok-comment">// robot folds. Crouching has no such limit - measured stable to -0.08.</span>
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"height"</span>, &amp;s.body_height, .{ .min = -<span class="tok-num">0.08</span>, .max = <span class="tok-num">0.02</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
            u.<span class="tok-fn">text</span>(<span class="tok-str">"   foot error {d:.4} m"</span>, .{s.pose_error});
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"level"</span>, .{})) {
                s.body_roll = <span class="tok-num">0</span>;
                s.body_pitch = <span class="tok-num">0</span>;
                s.body_yaw = <span class="tok-num">0</span>;
                s.body_height = <span class="tok-num">0</span>;
            }
        }
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"shove"</span>, .{})) {
            <span class="tok-fn">shove</span>(s);
        }
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"throw ball"</span>, .{})) {
            s.want_throw = true;
        }
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"reset everything"</span>, .{})) {
            <span class="tok-fn">resetEverything</span>(s);
        }
    }
    <span class="tok-kw">return</span> captured;
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - Unitree Go1 from MJCF"</span>,
            .width = <span class="tok-num">820</span>,
            .height = <span class="tok-num">680</span>,
            .scale_mode = .responsive,
            <span class="tok-comment">// 3D needs a depth buffer or nearer geometry does not occlude farther.</span>
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
