        <span class="tok-kw">if</span> (v &gt;= m.nv <span class="tok-kw">or</span> !s.arm_act.powered[v]) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">if</span> (seen == n) {
            <span class="tok-kw">return</span> m.jnt_qpos_adr[j];
        }
        seen += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-kw">fn</span> <span class="tok-fn">armShoulderQ</span>(s: *<span class="tok-kw">const</span> State) ?u32 {
    <span class="tok-kw">return</span> <span class="tok-fn">armJointQ</span>(s, <span class="tok-num">1</span>);
}

<span class="tok-comment">/// Put the arm back to its rest pose, in both the simulated state and the commanded one.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">setArmRest</span>(s: *State) void {
    <span class="tok-kw">for</span> (arm_rest, <span class="tok-num">0</span>..) |angle, n| {
        <span class="tok-kw">const</span> q: u32 = <span class="tok-fn">armJointQ</span>(s, n) <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
        s.data.pos[q] = angle;
        s.home[q] = angle;
    }
    s.data.stage = .stale;
}

<span class="tok-kw">fn</span> <span class="tok-fn">resetEverything</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;

    <span class="tok-comment">// The robot: its home keyframe, at the origin, exactly as built.</span>
    <span class="tok-kw">if</span> (!rmj.<span class="tok-fn">applyKeyframe</span>(m, &amp;s.data, s.robot.keyframes[<span class="tok-num">0</span>])) {
        std.log.<span class="tok-fn">err</span>(<span class="tok-str">"quadruped: home keyframe refused on reset"</span>, .{});
    }

    <span class="tok-comment">// * THE BALLS, BACK ON THEIR SHELF. `applyKeyframe` deliberately writes only the robot's</span>
    <span class="tok-comment">// slice - a ball in flight has no business being teleported by a pose button - so the free</span>
    <span class="tok-comment">// bodies are put back here, one free joint at a time.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..ball_count) |i| {
        <span class="tok-kw">const</span> body: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(ball_names[i]) <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
        <span class="tok-kw">const</span> j: u32 = m.body_jnt_adr[body];
        <span class="tok-kw">const</span> q: u32 = m.jnt_qpos_adr[j];
        <span class="tok-kw">const</span> parked: Vec = <span class="tok-fn">parkedBall</span>(i);
        s.data.pos[q + <span class="tok-num">0</span>] = parked[<span class="tok-num">0</span>];
        s.data.pos[q + <span class="tok-num">1</span>] = parked[<span class="tok-num">1</span>];
        s.data.pos[q + <span class="tok-num">2</span>] = parked[<span class="tok-num">2</span>];
        s.data.pos[q + <span class="tok-num">3</span>] = <span class="tok-num">0</span>;
        s.data.pos[q + <span class="tok-num">4</span>] = <span class="tok-num">0</span>;
        s.data.pos[q + <span class="tok-num">5</span>] = <span class="tok-num">0</span>;
        s.data.pos[q + <span class="tok-num">6</span>] = <span class="tok-num">1</span>;
    }
    s.next_ball = <span class="tok-num">0</span>;
    s.want_throw = false;

    <span class="tok-comment">// Nothing is moving, nothing is touching, and the solver remembers nothing.</span>
    <span class="tok-builtin">@memset</span>(s.data.vel, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.data.acc, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.data.applied_force, <span class="tok-num">0</span>);
    s.data.<span class="tok-fn">clearContacts</span>();
    s.data.<span class="tok-fn">forgetWarmStart</span>();
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);

    <span class="tok-comment">// What the controller tracks, and the modes that would immediately overwrite it.</span>
    <span class="tok-builtin">@memcpy</span>(s.home, s.data.pos);
    s.gait_on = false;
    s.posing = false;
    s.gait_phase = <span class="tok-num">0</span>;

    <span class="tok-comment">// -- *** AND THE ARM, WHICH "EVERYTHING" HAS TO INCLUDE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The padded keyframe carries the half-bent pose, but the GIMBAL will re-solve the arm on</span>
    <span class="tok-comment">// the very next frame if it is left on - so the reset has to clear the mode as well as the</span>
    <span class="tok-comment">// angles, or the arm snaps straight back to wherever it was holding.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * AND `hold_point` IS A CAPTURED WORLD POSITION. Left alone it survives the reset and the</span>
    <span class="tok-comment">// arm reaches for a point relative to feet that have moved - the same stale-anchor problem</span>
    <span class="tok-comment">// that made the gimbal drift, arriving through the reset path instead.</span>
    s.arm_on = false;
    s.hold_point = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    s.hold_error = <span class="tok-num">0</span>;
    s.hold_worst = <span class="tok-num">0</span>;
    s.routine = false;
    s.routine_clock = <span class="tok-num">0</span>;
    s.routine_error_sum = <span class="tok-num">0</span>;
    s.routine_error_count = <span class="tok-num">0</span>;
    s.routine_worst = <span class="tok-num">0</span>;
    s.trim_roll = <span class="tok-num">0</span>;
    s.trim_pitch = <span class="tok-num">0</span>;
    s.trim_countdown = <span class="tok-num">0</span>;
    s.body_roll = <span class="tok-num">0</span>;
    s.body_pitch = <span class="tok-num">0</span>;
    s.body_yaw = <span class="tok-num">0</span>;
    s.body_height = <span class="tok-num">0</span>;
    s.foot_slip = <span class="tok-num">0</span>;
    s.cone_worst = <span class="tok-num">0</span>;
    s.cone_over = <span class="tok-num">0</span>;
    <span class="tok-fn">setArmRest</span>(s);

    <span class="tok-comment">// * AND THE OWED SUBSTEPS. The accumulator can be holding most of a frame's worth of</span>
    <span class="tok-comment">// physics; left alone, the reset is immediately followed by a burst of steps that runs the</span>
    <span class="tok-comment">// scene forward before anyone sees it.</span>
    s.accumulator = <span class="tok-num">0</span>;
    s.peak_force = <span class="tok-num">0</span>;

    <span class="tok-comment">// * AND THE BRIDGE IS TOLD THIS WAS A TELEPORT. It cannot tell by looking - a proxy that</span>
    <span class="tok-comment">// was there and is now here looks the same whether it travelled or was moved - and a swept</span>
    <span class="tok-comment">// contact across the gap finds the floor and fires the robot away. See `Bridge.teleported`.</span>
    s.bridge.<span class="tok-fn">teleported</span>();

    <span class="tok-fn">captureStance</span>(s);
}

<span class="tok-comment">/// Solve every hinge for a commanded torso pose and a set of foot goals, and write the answer</span>
<span class="tok-comment">/// into `s.home`.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** THE ONE SHAPE BOTH SOLVERS HAD --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `solveGait` and `solveBodyPose` were written independently and converged on exactly the same</span>
<span class="tok-comment">/// six steps: save `data.pos`, seed a pose, plant the torso, IK four legs, harvest the hinges</span>
<span class="tok-comment">/// into `home`, restore. **They differed only in the seed and the foot goals** - everything else</span>
<span class="tok-comment">/// was duplicated, including two subtle invariants that are easy to get wrong in one copy and</span>
<span class="tok-comment">/// not the other.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THE FIRST INVARIANT: `data.pos` IS SCRATCH HERE, NOT STATE. Both solvers use the live pose</span>
<span class="tok-comment">/// array as an IK workspace and must put it back - a solve that leaks into the simulated state</span>
<span class="tok-comment">/// teleports the robot. The save/restore is the reason this is a function rather than inline</span>
<span class="tok-comment">/// code in two places.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** THE SECOND: SEED FROM A COMMAND, NEVER FROM THE MEASURED ROBOT. `solveBodyPose`'s own</span>
<span class="tok-comment">/// comment records why - seeding from where the robot actually got to closes a feedback loop</span>
<span class="tok-comment">/// through the IK, and the pose walks away from itself. Both callers pass a command.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">solveLegsInto</span>(
    s: *State,
    seed: []<span class="tok-kw">const</span> f32,
    ground: Vec,
    attitude: zm.Quat,
    height: f32,
    goals: [<span class="tok-num">4</span>]Vec,
) f32 {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> saved: []f32 = s.pose_scratch;
    <span class="tok-builtin">@memcpy</span>(saved, s.data.pos);

    <span class="tok-comment">// -- *** ONLY THE HINGES COME FROM THE SEED; THE ROOT'S GROUND POSITION IS A PARAMETER --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// A full `@memcpy` of the seed was a refactor regression that cost a working gait. The gait</span>
    <span class="tok-comment">// computes its foot goals from the LIVE torso position, then seeds from `home` - whose root</span>
    <span class="tok-comment">// x/y is wherever the command was last written, which is stale. **The legs then solve for a</span>
    <span class="tok-comment">// body that is not where the goals assume it is**, and the robot dances in place and falls.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THE TWO CALLERS GENUINELY DIFFER HERE, which is why this is an argument rather than a</span>
    <span class="tok-comment">// convention: the gait wants the LIVE ground position (the body is moving and the goals</span>
    <span class="tok-comment">// follow it), and posing wants the STANCE one (the body returns to where it was captured).</span>
    <span class="tok-comment">// Collapsing that difference is exactly what broke it.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.njnt) |j| {
        <span class="tok-kw">if</span> (m.jnt_type[j] != .hinge) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> q: u32 = m.jnt_qpos_adr[j];
        s.data.pos[q] = seed[q];
    }
    <span class="tok-kw">const</span> root: u32 = m.jnt_qpos_adr[<span class="tok-num">0</span>];
    s.data.pos[root + <span class="tok-num">0</span>] = ground[<span class="tok-num">0</span>];
    s.data.pos[root + <span class="tok-num">1</span>] = ground[<span class="tok-num">1</span>];
    s.data.pos[root + <span class="tok-num">2</span>] = height;
    s.data.pos[root + <span class="tok-num">3</span>] = attitude[<span class="tok-num">0</span>];
    s.data.pos[root + <span class="tok-num">4</span>] = attitude[<span class="tok-num">1</span>];
    s.data.pos[root + <span class="tok-num">5</span>] = attitude[<span class="tok-num">2</span>];
    s.data.pos[root + <span class="tok-num">6</span>] = attitude[<span class="tok-num">3</span>];
    s.data.stage = .stale;

    <span class="tok-kw">var</span> worst: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |i| {
        <span class="tok-kw">const</span> result: ctl.Ik.Result = (ctl.Ik{ .max_iterations = <span class="tok-num">12</span>, .max_step = <span class="tok-num">0.5</span> }).<span class="tok-fn">solve</span>(
            m,
            &amp;s.data,
            s.legs[i],
            .{ .body = s.foot_body[i], .offset = s.foot_offset[i], .goal = goals[i] },
            s.ik_scratch,
        );
        worst = <span class="tok-builtin">@max</span>(worst, result.error_distance);
    }
    <span class="tok-kw">return</span> worst;
}

<span class="tok-comment">/// Copy every hinge from the scratch pose into `s.home`, then restore the simulated state.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * SPLIT FROM `solveLegsInto` BECAUSE THE GAIT WRITES THE ARM IN BETWEEN - the shoulder's</span>
<span class="tok-comment">/// swing has to land after the legs are solved and before the pose is harvested, which is the</span>
<span class="tok-comment">/// ordering bug that once made the arm's motion silently disappear.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">harvestPose</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.njnt) |j| {
        <span class="tok-kw">if</span> (m.jnt_type[j] != .hinge) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> q: u32 = m.jnt_qpos_adr[j];
        s.home[q] = s.data.pos[q];
    }
    <span class="tok-builtin">@memcpy</span>(s.data.pos, s.pose_scratch);
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
}

<span class="tok-kw">fn</span> <span class="tok-fn">solveGait</span>(s: *State, dt: f32) void {
    s.gait_phase += dt * s.gait_hz;
    s.gait_phase -= <span class="tok-builtin">@floor</span>(s.gait_phase);

    <span class="tok-comment">// -- *** FOOT TARGETS ARE BODY-RELATIVE, NOT WORLD-FIXED --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// A gait's cycle is relative to the HIP. During stance the foot travels backwards relative</span>
    <span class="tok-comment">// to the body by one stride while the body advances by one - so the foot stays put in the</span>
    <span class="tok-comment">// world without anyone pinning it there. **Pinning it in world coordinates fights that**:</span>
    <span class="tok-comment">// the first version did, and the robot walked 1.1 m and arrived on its belly, legs stretched</span>
    <span class="tok-comment">// out behind toward targets that never moved.</span>
    <span class="tok-kw">const</span> torso_pos: Vec = s.data.body_xpos[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> torso_rot: zm.Quat = s.data.body_xrot[<span class="tok-num">1</span>];
    <span class="tok-kw">var</span> goals: [<span class="tok-num">4</span>]Vec = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |i| {
        <span class="tok-kw">const</span> cycle: Vec = <span class="tok-fn">footOffsetInCycle</span>(
            s.gait_phase + s.gait_offset[i],
            s.gait_stride,
            s.gait_lift,
            s.gait_duty,
        );
        goals[i] = torso_pos + zm.<span class="tok-fn">rotate</span>(torso_rot, s.foot_rest[i] + cycle);
    }

    <span class="tok-comment">// * THE COMMANDED ATTITUDE RIDES THE GAIT. Feedforward only: the legs solve for the pose the</span>
    <span class="tok-comment">// sliders ask for, and nothing measures the result and corrects it. That distinction is why</span>
    <span class="tok-comment">// walking and posing can combine - the attitude TRIM, which does measure and correct, topples</span>
    <span class="tok-comment">// the robot in under two seconds because a walking robot's pitch is not an error to remove.</span>
    <span class="tok-kw">const</span> posed: zm.Quat = <span class="tok-fn">commandedAttitude</span>(s);
    <span class="tok-comment">// * THE LIVE GROUND POSITION: the body is travelling and the foot goals were built around</span>
    <span class="tok-comment">// where it actually is.</span>
    s.pose_error = <span class="tok-fn">solveLegsInto</span>(s, s.home, torso_pos, posed, s.rest_height + s.body_height, goals);

    <span class="tok-comment">// ** THE ARM IS WRITTEN BETWEEN THE SOLVE AND THE HARVEST, which is the only correct place:</span>
    <span class="tok-comment">// after the legs have used the scratch pose, before it is copied into `home`.</span>
    <span class="tok-kw">if</span> (<span class="tok-fn">armShoulderQ</span>(s)) |q| {
        <span class="tok-kw">var</span> shoulder: f32 = arm_rest_shoulder;
        <span class="tok-comment">// The trot's counter-swing, locked to the gait clock. Zero for a crawl, which has no</span>
        <span class="tok-comment">// wobble to cancel and is measurably worse with one.</span>
        <span class="tok-kw">if</span> (s.arm_swing_amp != <span class="tok-num">0</span>) {
            shoulder += s.arm_swing_amp * <span class="tok-fn">sinTurns</span>(s.gait_phase + s.arm_swing_phase);
        }
        <span class="tok-comment">// * AND THE SLOW RISE AND FALL, on its own incommensurate clock. It sweeps around the</span>
        <span class="tok-comment">// half-bent rest so the shoulder never nears a stop - which is what turned the arm into</span>
        <span class="tok-comment">// dead weight at maximum lever arm in every earlier balance attempt.</span>
        <span class="tok-kw">if</span> (s.routine <span class="tok-kw">and</span> s.arm_lift_amp != <span class="tok-num">0</span>) {
            shoulder += s.arm_lift_amp * <span class="tok-fn">sinTurns</span>(s.routine_clock * s.arm_lift_rate);
        }
        s.data.pos[q] = shoulder;
    }
    <span class="tok-fn">harvestPose</span>(s);
}

<span class="tok-comment">/// The torso attitude the sliders and the routine are asking for.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">commandedAttitude</span>(s: *<span class="tok-kw">const</span> State) zm.Quat {
    <span class="tok-kw">return</span> zm.<span class="tok-fn">qmul</span>(
        zm.<span class="tok-fn">qmul</span>(
            zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), s.body_yaw),
            zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), s.body_pitch + s.trim_pitch),
        ),
        zm.<span class="tok-fn">qmul</span>(zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), s.body_roll + s.trim_roll), s.rest_rot),
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">solveBodyPose</span>(s: *State) void {
    <span class="tok-comment">// * THE FEET STAY WHERE THEY WERE PLANTED, in world coordinates - the opposite of the gait,</span>
    <span class="tok-comment">// and correct for the opposite reason: a posing robot's body moves while its feet do not.</span>
    <span class="tok-comment">// * THE STANCE GROUND POSITION: a posing robot returns to where it was captured, and its</span>
    <span class="tok-comment">// planted feet are in world coordinates around that point.</span>
    <span class="tok-kw">const</span> root: u32 = s.imported.model.jnt_qpos_adr[<span class="tok-num">0</span>];
    s.pose_error = <span class="tok-fn">solveLegsInto</span>(
        s,
        s.stance,
        <span class="tok-fn">vec</span>(s.stance[root], s.stance[root + <span class="tok-num">1</span>], <span class="tok-num">0</span>),
        <span class="tok-fn">commandedAttitude</span>(s),
        s.rest_height + s.body_height,
        s.planted,
    );
    <span class="tok-fn">harvestPose</span>(s);
}

<span class="tok-kw">fn</span> <span class="tok-fn">control</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-builtin">@memset</span>(s.data.applied_force, <span class="tok-num">0</span>);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.njnt) |j| {
        <span class="tok-kw">if</span> (m.jnt_type[j] != .hinge) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> q: u32 = m.jnt_qpos_adr[j];
        <span class="tok-kw">const</span> v: u32 = m.jnt_dof_adr[j];
        <span class="tok-kw">const</span> wanted: f32 = s.kp * (s.home[q] - s.data.pos[q]) - s.kv * s.data.vel[v];
        <span class="tok-comment">// * The clamp is the motor's rating, and it is what makes the kp slider mean</span>
        <span class="tok-comment">// something: without it, any gain eventually wins and the robot is infinitely strong.</span>
        s.data.applied_force[v] = <span class="tok-fn">clamp</span>(wanted, -<span class="tok-num">35.55</span>, <span class="tok-num">35.55</span>) + s.data.bias_force[v];
    }
}

<span class="tok-comment">/// Throw a ball at the robot, from wherever the camera is looking from.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * AIMED FROM THE CAMERA, so "throw" means what it looks like it means: the ball leaves the</span>
<span class="tok-comment">/// viewer's position and travels toward the robot's centre. A fixed launch direction would be</span>
<span class="tok-comment">/// unusable the moment the view is orbited, which on a phone is immediately.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">throwBall</span>(s: *State, cam: Camera3D) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> body: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(ball_names[s.next_ball]) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    s.next_ball = (s.next_ball + <span class="tok-num">1</span>) % ball_count;

    <span class="tok-comment">// -- ** FROM THE EYE, ALONG THE VIEW - not at a fixed point --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// This aimed at `(0, 0, 0.25)` regardless of where the camera was pointing, so every throw</span>
    <span class="tok-comment">// curved back toward the robot however you had orbited. That is a fine turret and a poor</span>
    <span class="tok-comment">// projectile: you cannot miss with it, and missing is most of what makes throwing things</span>
    <span class="tok-comment">// at a robot informative.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THE CAMERA IS Y-UP AND THE SIMULATION IS Z-UP. The demo draws through</span>
    <span class="tok-comment">// `rotationX(-90 deg)`, which sends sim `(x, y, z)` to display `(x, z, -y)`; going back is</span>
    <span class="tok-comment">// therefore display `(X, Y, Z)` to sim `(X, -Z, Y)`. Both the eye and the direction need</span>
    <span class="tok-comment">// it - converting only the position gives a ball that starts in the right place and flies</span>
    <span class="tok-comment">// somewhere else entirely.</span>
    <span class="tok-kw">const</span> toSim = <span class="tok-kw">struct</span> {
        <span class="tok-kw">fn</span> <span class="tok-fn">go</span>(v: Vec) Vec {
            <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(v[<span class="tok-num">0</span>], -v[<span class="tok-num">2</span>], v[<span class="tok-num">1</span>]);
        }
    }.go;
    <span class="tok-kw">const</span> eye: Vec = <span class="tok-fn">toSim</span>(cam.position);
    <span class="tok-kw">const</span> aim: Vec = <span class="tok-fn">normalize3</span>(<span class="tok-fn">toSim</span>(cam.target) - eye);

    <span class="tok-comment">// * NUDGED FORWARD BY THE BALL'S OWN RADIUS, and no more. Starting exactly at the eye puts</span>
    <span class="tok-comment">// the ball on the near plane where it is clipped, so the throw looks like it produced</span>
    <span class="tok-comment">// nothing until the ball is already halfway to the robot.</span>
    <span class="tok-kw">const</span> from: Vec = eye + aim * <span class="tok-fn">splat</span>(ball_radius);

    <span class="tok-kw">const</span> j: u32 = m.body_jnt_adr[body];
    <span class="tok-kw">const</span> q: u32 = m.jnt_qpos_adr[j];
    <span class="tok-kw">const</span> v: u32 = m.jnt_dof_adr[j];
    s.data.pos[q + <span class="tok-num">0</span>] = from[<span class="tok-num">0</span>];
    s.data.pos[q + <span class="tok-num">1</span>] = from[<span class="tok-num">1</span>];
    s.data.pos[q + <span class="tok-num">2</span>] = from[<span class="tok-num">2</span>];
    s.data.pos[q + <span class="tok-num">3</span>] = <span class="tok-num">0</span>;
    s.data.pos[q + <span class="tok-num">4</span>] = <span class="tok-num">0</span>;
    s.data.pos[q + <span class="tok-num">5</span>] = <span class="tok-num">0</span>;
    s.data.pos[q + <span class="tok-num">6</span>] = <span class="tok-num">1</span>;
    <span class="tok-builtin">@memset</span>(s.data.vel[v..][<span class="tok-num">0</span>..<span class="tok-num">6</span>], <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> speed: f32 = <span class="tok-num">4.5</span>;
    s.data.vel[v + <span class="tok-num">0</span>] = aim[<span class="tok-num">0</span>] * speed;
    s.data.vel[v + <span class="tok-num">1</span>] = aim[<span class="tok-num">1</span>] * speed;
    s.data.vel[v + <span class="tok-num">2</span>] = aim[<span class="tok-num">2</span>] * speed;
    s.data.stage = .stale;
    <span class="tok-comment">// * The warm start describes contacts that no longer exist for this body - see</span>
    <span class="tok-comment">// `Data.forgetWarmStart`. Cheap, and the alternative is an impulse from a different scene.</span>
    s.data.<span class="tok-fn">forgetWarmStart</span>();
}

<span class="tok-comment">/// Shove the trunk sideways, to see whether the legs catch it.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">shove</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.njnt) |j| {
        <span class="tok-kw">if</span> (m.jnt_type[j] == .free) {
            <span class="tok-comment">// The free joint's velocity DOFs are linear first, then angular.</span>
            <span class="tok-kw">const</span> v: u32 = m.jnt_dof_adr[j];
            s.data.vel[v + <span class="tok-num">0</span>] += <span class="tok-num">1.2</span>;
            s.data.vel[v + <span class="tok-num">1</span>] += <span class="tok-num">0.4</span>;
            s.data.stage = .stale;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;

    <span class="tok-comment">// * ONCE PER FRAME, NOT PER SUBSTEP. It answers "what should the legs be doing", which</span>
    <span class="tok-comment">// only changes when a slider moves. Solving it inside the fixed-timestep loop recomputes</span>
    <span class="tok-comment">// the same answer for every substep and the cost multiplies - a lesson the KUKA demo paid</span>
    <span class="tok-comment">// for in frame rate.</span>
    <span class="tok-kw">if</span> (s.posing) {
        <span class="tok-comment">// * ONLY WHEN A SLIDER MOVED. The answer is a function of the command alone, so</span>
        <span class="tok-comment">// recomputing it every frame cannot improve it and - as the comment in `solveBodyPose`</span>
        <span class="tok-comment">// records - actively destabilises the robot.</span>
        <span class="tok-kw">if</span> (s.routine) {
            <span class="tok-comment">// * TWO INDEPENDENT RATES. Pitch and yaw in quadrature sweep the nose round a cone;</span>
            <span class="tok-comment">// roll rocks at a different frequency entirely.</span>
            s.routine_clock += f.time.delta_time;
            <span class="tok-kw">const</span> cone: f32 = s.routine_clock * s.cone_rate * <span class="tok-num">2.0</span> * pi;
            <span class="tok-kw">const</span> rock: f32 = s.routine_clock * s.roll_rate * <span class="tok-num">2.0</span> * pi;
            s.body_pitch = s.cone_amount * <span class="tok-builtin">@cos</span>(cone);
            s.body_yaw = s.cone_amount * <span class="tok-builtin">@sin</span>(cone);
            s.body_roll = s.roll_amount * <span class="tok-builtin">@sin</span>(rock);
            <span class="tok-kw">const</span> bob: f32 = s.routine_clock * s.bob_rate * <span class="tok-num">2.0</span> * pi;
            s.body_height = s.bob_amount * <span class="tok-builtin">@sin</span>(bob);
        }
        <span class="tok-kw">const</span> cmd: [<span class="tok-num">4</span>]f32 = .{ s.body_roll, s.body_pitch, s.body_yaw, s.body_height };
        <span class="tok-kw">var</span> resolve: bool = !std.mem.<span class="tok-fn">eql</span>(f32, &amp;cmd, &amp;s.last_cmd);

        <span class="tok-comment">// -- *** CLOSE THE LOOP ON THE TORSO, NOT JUST ON THE JOINTS --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Read what the torso is ACTUALLY doing relative to its own rest attitude, and integrate</span>
        <span class="tok-comment">// the shortfall into a trim. Comparing against world level instead would fold in whatever</span>
        <span class="tok-comment">// tilt the settled stance already had, which is not the slider's fault and not its job.</span>
        <span class="tok-kw">const</span> seen: Vec = zm.<span class="tok-fn">quatToEulerXYZ</span>(
            zm.<span class="tok-fn">qmul</span>(s.data.body_xrot[<span class="tok-num">1</span>], zm.<span class="tok-fn">conjugate</span>(s.rest_rot)),
        );
        s.seen_roll = seen[<span class="tok-num">0</span>];
        s.seen_pitch = seen[<span class="tok-num">1</span>];
        <span class="tok-comment">// -- *** THE ATTITUDE TRIM IS OFF WHILE WALKING --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The trim integrates measured pitch error and folds it into the commanded attitude. On</span>
        <span class="tok-comment">// a STANDING robot that is exactly right - it took the sliders from 16-32% short to</span>
        <span class="tok-comment">// under 3%. **On a walking one it fights the gait**, because a trot pitches by design</span>
        <span class="tok-comment">// every step and the integrator treats that as an error to remove.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Measured, trot 10 s with the arm:</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">//     trim off   **0.957 m**, standing, pitch flat at -0.026</span>
        <span class="tok-comment">//     trim on      0.123 m, **FELL at 1.80 s**, pitch +0.229 in the first second</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * THAT IS SIMON'S OSCILLATION AND FALL, REPRODUCED AND ISOLATED. The probe walked</span>
        <span class="tok-comment">// forward for many turns while the demo toppled, and this loop is the entire difference</span>
        <span class="tok-comment">// between them - the fourth bug in this file caused by two controllers writing one</span>
        <span class="tok-comment">// array, and the one that had gone longest unfound.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// ** AN INTEGRATOR NEEDS A SETPOINT THAT IS ACTUALLY REACHABLE AND STEADY. Level is both</span>
        <span class="tok-comment">// while standing; neither while walking.</span>
        <span class="tok-kw">if</span> (s.gait_on) {
            s.trim_roll = <span class="tok-num">0</span>;
            s.trim_pitch = <span class="tok-num">0</span>;
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.trim_countdown &gt; <span class="tok-num">0</span>) {
            s.trim_countdown -= <span class="tok-num">1</span>;
        } <span class="tok-kw">else</span> {
            <span class="tok-kw">const</span> roll_gap: f32 = s.body_roll - seen[<span class="tok-num">0</span>];
            <span class="tok-kw">const</span> pitch_gap: f32 = s.body_pitch - seen[<span class="tok-num">1</span>];
            <span class="tok-comment">// * A GAIN WELL UNDER 1, because this integrator sits on top of a PD that is itself</span>
            <span class="tok-comment">// still settling. Correcting the whole gap at once fights the transient it is</span>
            <span class="tok-comment">// measuring and rings.</span>
            <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(roll_gap) &gt; <span class="tok-num">0.002</span> <span class="tok-kw">or</span> <span class="tok-builtin">@abs</span>(pitch_gap) &gt; <span class="tok-num">0.002</span>) {
                s.trim_roll = <span class="tok-fn">clamp</span>(s.trim_roll + <span class="tok-num">0.5</span> * roll_gap, -<span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>);
                s.trim_pitch = <span class="tok-fn">clamp</span>(s.trim_pitch + <span class="tok-num">0.5</span> * pitch_gap, -<span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>);
                resolve = true;
            }
            <span class="tok-comment">// *** FOUR, NOT TWELVE, AND BOTH ENDS ARE MEASURED. On the moving routine the</span>
            <span class="tok-comment">// trim's mean lag is 0.0182 rad at a cadence of 12 and **0.0098 at 4** - a free</span>
            <span class="tok-comment">// 1.9x. At a cadence of 1 the robot FALLS OVER (3.03 rad), which is</span>
            <span class="tok-comment">// `solveBodyPose`'s warning about re-solving every frame, confirmed rather than</span>
            <span class="tok-comment">// taken on trust. Four is measured to be inside that wall, not guessed to be.</span>
            s.trim_countdown = <span class="tok-num">4</span>;
        }

        <span class="tok-comment">// -- *** THE ARM REACHES FOR A MOVING TARGET --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// A circle in front of the robot, in the trunk's own frame - so as the torso rolls and</span>

        <span class="tok-comment">// -- ** SLIP AND FRICTION DEMAND, MEASURED LIVE --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// `rows_per_contact` is a PYRAMID BASIS: the four rows sum to the normal load, and the</span>
        <span class="tok-comment">// tangential content is what the opposing pairs disagree about. The coefficient comes</span>
        <span class="tok-comment">// from the contact itself rather than a number typed here, so the ratio means what it</span>
        <span class="tok-comment">// says - and **above 1.0 is a foot being asked for force the ground does not have.**</span>
        {
            <span class="tok-kw">var</span> slip: f32 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |i| {
                <span class="tok-kw">const</span> at: Vec = s.data.body_xpos[s.foot_body[i]] +
                    zm.<span class="tok-fn">rotate</span>(s.data.body_xrot[s.foot_body[i]], s.foot_offset[i]);
                slip += <span class="tok-fn">length3</span>(at - s.planted[i]);
            }
            s.foot_slip = slip;
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.contact_count) |c| {
                <span class="tok-kw">const</span> base: usize = c * rbt.rows_per_contact;
                <span class="tok-kw">var</span> normal: f32 = <span class="tok-num">0</span>;
                <span class="tok-kw">for</span> (<span class="tok-num">0</span>..rbt.rows_per_contact) |r| {
                    normal += s.data.constraint_force[base + r];
                }
                <span class="tok-kw">if</span> (normal &lt; <span class="tok-num">1.0</span>) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> t1: f32 = s.data.constraint_force[base] - s.data.constraint_force[base + <span class="tok-num">1</span>];
                <span class="tok-kw">const</span> t2: f32 = s.data.constraint_force[base + <span class="tok-num">2</span>] - s.data.constraint_force[base + <span class="tok-num">3</span>];
                <span class="tok-kw">const</span> tang: f32 = <span class="tok-builtin">@sqrt</span>(t1 * t1 + t2 * t2);
                <span class="tok-kw">const</span> mu: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">0.01</span>, s.data.contacts[c].friction[<span class="tok-num">0</span>]);
                <span class="tok-kw">const</span> ratio: f32 = tang / (mu * normal);
                s.cone_worst = <span class="tok-builtin">@max</span>(s.cone_worst, ratio);
                <span class="tok-kw">if</span> (ratio &gt; <span class="tok-num">0.98</span>) {
                    s.cone_over += <span class="tok-num">1</span>;
                }
            }
        }

        <span class="tok-comment">// ** THE LAG, SCORED. A routine that only looks impressive proves nothing; the number is</span>
        <span class="tok-comment">// what says whether the controller is keeping up with it.</span>
        <span class="tok-kw">if</span> (s.routine <span class="tok-kw">and</span> s.routine_clock &gt; <span class="tok-num">1.5</span>) {
            <span class="tok-kw">const</span> gap: f32 = <span class="tok-builtin">@sqrt</span>(
                (s.body_roll - seen[<span class="tok-num">0</span>]) * (s.body_roll - seen[<span class="tok-num">0</span>]) +
                    (s.body_pitch - seen[<span class="tok-num">1</span>]) * (s.body_pitch - seen[<span class="tok-num">1</span>]),
            );
            s.routine_error_sum += gap;
            s.routine_error_count += <span class="tok-num">1</span>;
            s.routine_worst = <span class="tok-builtin">@max</span>(s.routine_worst, gap);
        }

        <span class="tok-kw">if</span> (resolve) {
            s.last_cmd = cmd;
            <span class="tok-fn">solveBodyPose</span>(s);
        }

        <span class="tok-comment">// -- *** THE ARM COUNTERS *AFTER* THE TORSO SOLVE, NOT BEFORE --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// `solveBodyPose` copies EVERY hinge joint from `stance`, arm included - so running the</span>
        <span class="tok-comment">// arm's IK before it meant the counter-animation was overwritten the instant the torso</span>
        <span class="tok-comment">// re-solved. **The arm was solving correctly and its answer was being thrown away**,</span>
        <span class="tok-comment">// which looks exactly like an arm that never counters at all.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * ORDER IS PART OF A CONTROLLER'S DEFINITION. Two solves writing the same array is a</span>
        <span class="tok-comment">// sequencing bug, not a control one, and no amount of tuning either would have shown it.</span>
        <span class="tok-comment">// pitches, the world-space target moves with it and the arm must chase a point that is</span>
        <span class="tok-comment">// itself being thrown around. That coupling is the whole point: the arm's mass swings,</span>
        <span class="tok-comment">// the legs feel it, and neither controller is told about the other.</span>
        <span class="tok-kw">if</span> (s.arm_on) {
            s.arm_clock += f.time.delta_time;
            <span class="tok-comment">// -- *** A FIXED POINT IN THE WORLD, NOT A CIRCLE IN THE BODY'S FRAME --</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// Captured once, above where the robot is standing, and then held. Because the goal</span>
            <span class="tok-comment">// does not move, every joint motion the arm makes exists purely to CANCEL the base's</span>
            <span class="tok-comment">// - which is what makes the gimbal effect legible: the body weaves and the gripper</span>
            <span class="tok-comment">// does not.</span>
            <span class="tok-comment">// -- *** THE HELD POINT IS RELATIVE TO THE FEET, NOT TO THE WORLD --</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// Pinned in absolute world coordinates it is a target the robot slowly walks away</span>
            <span class="tok-comment">// from: the feet slide, and over 30 s the gripper's mean error grew from 20 mm to</span>
            <span class="tok-comment">// 61 mm chasing a point that had not moved while the robot had.</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// * THE FEET ARE WHERE THE ROBOT ACTUALLY IS. Anchoring to their average means the</span>
            <span class="tok-comment">// point travels with any drift the legs accumulate, so the arm counters the TORSO's</span>
            <span class="tok-comment">// motion - which is the thing it is for - instead of also fighting the base's slow</span>
            <span class="tok-comment">// walk. Simon's correction, and the same principle as anchoring the torso reference</span>
            <span class="tok-comment">// to current feet rather than to a stored stance.</span>
            <span class="tok-kw">var</span> foot_mean: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |i| {
                foot_mean += s.data.body_xpos[s.foot_body[i]] +
                    zm.<span class="tok-fn">rotate</span>(s.data.body_xrot[s.foot_body[i]], s.foot_offset[i]);
            }
            foot_mean /= <span class="tok-fn">splat</span>(<span class="tok-num">4.0</span>);
            <span class="tok-kw">const</span> goal: Vec = <span class="tok-fn">vec</span>(
                foot_mean[<span class="tok-num">0</span>] + s.hold_offset[<span class="tok-num">0</span>],
                foot_mean[<span class="tok-num">1</span>] + s.hold_offset[<span class="tok-num">1</span>],
                foot_mean[<span class="tok-num">2</span>] + s.hold_height,
            );
            s.hold_point = goal;

            <span class="tok-comment">// * IK FROM THE ARM'S CURRENT POSE, restored afterwards - the solve must not leave</span>
            <span class="tok-comment">// the simulated state anywhere, only produce a target for the servo.</span>
            <span class="tok-kw">const</span> keep_arm: []f32 = s.arm_target;
            <span class="tok-builtin">@memcpy</span>(keep_arm, s.data.pos[<span class="tok-num">0</span>..s.imported.model.nq]);
            _ = (ctl.Ik{ .max_iterations = <span class="tok-num">8</span>, .max_step = <span class="tok-num">0.3</span> }).<span class="tok-fn">solve</span>(
                &amp;s.imported.model,
                &amp;s.data,
                s.arm_act,
                .{ .body = s.gripper, .offset = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .goal = goal },
                s.ik_scratch,
            );
            <span class="tok-comment">// Copy only the ARM joints into `home`; the legs belong to the torso controller.</span>
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.imported.model.njnt) |j| {
                <span class="tok-kw">const</span> v: u32 = s.imported.model.jnt_dof_adr[j];
                <span class="tok-kw">if</span> (v &gt;= s.imported.model.nv <span class="tok-kw">or</span> !s.arm_act.powered[v]) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> q: u32 = s.imported.model.jnt_qpos_adr[j];
                s.home[q] = s.data.pos[q];
            }
            <span class="tok-builtin">@memcpy</span>(s.data.pos[<span class="tok-num">0</span>..s.imported.model.nq], keep_arm);
            s.data.stage = .stale;
            rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);
            <span class="tok-comment">// * THE DRIFT IS THE SCORE. A gimbal that visibly wobbles is a gimbal that failed,</span>
            <span class="tok-comment">// and the number says by how much - which is the quantity a planner with preview</span>
            <span class="tok-comment">// would have to beat.</span>
            s.arm_error = <span class="tok-fn">length3</span>(s.data.body_xpos[s.gripper] - goal);
            s.hold_error = s.arm_error;
            <span class="tok-kw">if</span> (s.routine_clock &gt; <span class="tok-num">1.5</span>) {
                s.hold_worst = <span class="tok-builtin">@max</span>(s.hold_worst, s.arm_error);
            }
        }
    }
    <span class="tok-comment">// * A GAIT RE-SOLVES EVERY FRAME, unlike a static pose, because its targets move by</span>
    <span class="tok-comment">// construction. The feedback loop `solveBodyPose` warns about is avoided the same way -</span>
    <span class="tok-comment">// seeding from the last command rather than from the measured robot.</span>
    <span class="tok-kw">if</span> (s.gait_on) {
        <span class="tok-fn">solveGait</span>(s, <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.05</span>));
    }

    s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
    <span class="tok-kw">while</span> (s.accumulator &gt;= timestep) : (s.accumulator -= timestep) {
        <span class="tok-comment">// Kinematics, then collision, then solve - all at one `q`. See `robot_physics.sync`</span>
        <span class="tok-comment">// for why the order is not negotiable.</span>
        rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);
        <span class="tok-kw">if</span> (s.physics_on) {
            s.bridge.<span class="tok-fn">sync</span>(&amp;s.world, &amp;s.imported.model, &amp;s.data) <span class="tok-kw">catch</span> |err| {
                zm.<span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"proxy sync failed: {t}"</span>, .{err});
            };
            zp.<span class="tok-fn">step</span>(&amp;s.world, timestep) <span class="tok-kw">catch</span> |err| {
                zm.<span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"world step failed: {t}"</span>, .{err});
            };
            s.bridge.<span class="tok-fn">harvest</span>(&amp;s.data);
        }
        <span class="tok-fn">control</span>(s);
        rbt.<span class="tok-fn">step</span>(&amp;s.imported.model, &amp;s.data);
    }
    rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);

    <span class="tok-kw">var</span> force: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.constraint_count) |row| {
        force += s.data.constraint_force[row];
    }
    s.peak_force = <span class="tok-builtin">@max</span>(s.peak_force * <span class="tok-num">0.995</span>, force);

    <span class="tok-comment">// -- ** THE UI IS BUILT EARLY AND RENDERED LAST, AND BOTH HALVES MATTER --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// **Built early**, because the camera has to know whether the mouse belongs to a slider -</span>
    <span class="tok-comment">// otherwise dragging `kp` orbits the view at the same time.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// **Rendered last**, because `clearViewport` wipes whatever has been drawn. Keeping</span>
    <span class="tok-comment">// `begin`/`render` inside the panel function put the deferred `render` at the END OF THAT</span>
    <span class="tok-comment">// FUNCTION - before the clear - so the panel was drawn and then erased, every frame. The</span>
    <span class="tok-comment">// demo showed a robot and no controls at all, and looked like a build problem.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `robot_3d` had it right by accident: its `begin` and its clear live in the same</span>
    <span class="tok-comment">// function, so the defer naturally lands after the 3D pass. Making that structural rather</span>
    <span class="tok-comment">// than incidental is the point of passing `u` in.</span>
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">const</span> captured: bool = <span class="tok-fn">drawPanel</span>(u, s);

    z.<span class="tok-fn">clearViewport</span>(f, bg);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, captured, .{
        .min_distance = <span class="tok-num">0.6</span>,
        .max_distance = <span class="tok-num">4.0</span>,
    });
    <span class="tok-comment">// * THE THROW HAPPENS HERE, not in the panel, because it needs the camera - and the</span>
    <span class="tok-comment">// camera is not known until after the panel has said whether the mouse belongs to it.</span>
    <span class="tok-kw">if</span> (s.want_throw) {
        s.want_throw = false;
        <span class="tok-fn">throwBall</span>(s, cam);
    }

    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    z.<span class="tok-fn">drawGrid</span>(gl, <span class="tok-num">16</span>, <span class="tok-num">0.25</span>);
    <span class="tok-fn">drawRobot</span>(s, gl);
    z.<span class="tok-fn">endMode3D</span>(gl);
}

<span class="tok-comment">/// Draw every collision geom the importer kept.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THESE ARE THE COLLISION SHAPES, not the visual meshes - the Go1's 13 `&lt;mesh&gt;` geoms are</span>
<span class="tok-comment">/// skipped by the converter because their vertices live in an `&lt;asset&gt;` block that is not read</span>
<span class="tok-comment">/// yet. Which turns out to be the better picture for a physics demo: what you see IS what the</span>
<span class="tok-comment">/// solver sees, so a leg that looks like it is touching the ground is touching the ground.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawRobot</span>(s: *State, gl: *z.WgpuGl) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> to_y_up: Mat = zm.<span class="tok-fn">zUpToYUp</span>();

    <span class="tok-comment">// -- *** THE HELD POINT, AND A LINE TO IT --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// "The gripper is not moving" is only legible against something that visibly is not moving</span>
    <span class="tok-comment">// either. The marker sits at the world point the arm is holding and the line measures the</span>
    <span class="tok-comment">// failure - so the gimbal's success is the SHORTNESS of that line while the body weaves.</span>
    <span class="tok-kw">if</span> (s.arm_on <span class="tok-kw">and</span> s.hold_point[<span class="tok-num">2</span>] != <span class="tok-num">0</span>) {
        <span class="tok-kw">const</span> at: Vec = zm.<span class="tok-fn">zUpToYUpPoint</span>(s.hold_point);
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
            <span class="tok-fn">translation</span>(at[<span class="tok-num">0</span>], at[<span class="tok-num">1</span>], at[<span class="tok-num">2</span>]),
            <span class="tok-fn">scaling</span>(<span class="tok-num">0.045</span>, <span class="tok-num">0.045</span>, <span class="tok-num">0.045</span>),
        );
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, .{ .r = <span class="tok-num">237</span>, .g = <span class="tok-num">184</span>, .b = <span class="tok-num">89</span>, .a = <span class="tok-num">255</span> });
        <span class="tok-kw">const</span> tip: Vec = zm.<span class="tok-fn">zUpToYUpPoint</span>(s.data.body_xpos[s.gripper]);
        z.<span class="tok-fn">drawLine3D</span>(gl, tip, at, .{ .r = <span class="tok-num">226</span>, .g = <span class="tok-num">106</span>, .b = <span class="tok-num">154</span>, .a = <span class="tok-num">255</span> });
        <span class="tok-comment">// * AND A CROSSHAIR, so the point reads as a fixed place in the world rather than as a</span>
        <span class="tok-comment">// small object that might itself be drifting.</span>
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> ([_]Vec{ <span class="tok-fn">vec</span>(<span class="tok-num">0.12</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.12</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0.12</span>) }) |axis| {
            z.<span class="tok-fn">drawLine3D</span>(gl, at - axis, at + axis, .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">100</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> });
        }
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.ngeom) |g| {
        <span class="tok-kw">const</span> body: u32 = m.geom_body[g];
        <span class="tok-comment">// * A GEOM'S WORLD POSE IS ITS BODY'S, COMPOSED WITH ITS OWN OFFSET. The engine</span>
        <span class="tok-comment">// stores the offset (`geom_pos`/`geom_rot`) and the body's world pose separately -</span>
        <span class="tok-comment">// it never needs the product except when something is drawn or collided, so it does</span>
        <span class="tok-comment">// not keep one.</span>
        <span class="tok-kw">const</span> body_rot: zm.Quat = s.data.body_xrot[body];
        <span class="tok-kw">const</span> world_pos: Vec = s.data.body_xpos[body] + zm.<span class="tok-fn">rotate</span>(body_rot, m.geom_pos[g]);
        <span class="tok-kw">const</span> world_rot: Mat = <span class="tok-fn">quatToMat</span>(zm.<span class="tok-fn">qmul</span>(body_rot, m.geom_rot[g]));
        <span class="tok-kw">const</span> place: Mat = <span class="tok-fn">mulMat</span>(<span class="tok-fn">mulMat</span>(to_y_up, <span class="tok-fn">translation</span>(world_pos[<span class="tok-num">0</span>], world_pos[<span class="tok-num">1</span>], world_pos[<span class="tok-num">2</span>])), world_rot);
        <span class="tok-comment">// Feet are the interesting part, so they get a brighter colour.</span>
        <span class="tok-kw">const</span> tint: Color = <span class="tok-kw">if</span> (body == <span class="tok-num">0</span>) trunk_col <span class="tok-kw">else</span> link_col;
        <span class="tok-kw">switch</span> (m.geom_shape[g]) {
            .sphere =&gt; |sph| {
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">scaling</span>(sph.radius, sph.radius, sph.radius));
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, tint);
            },
            .capsule =&gt; |cap| {
                <span class="tok-comment">// -- ** THE MESH ALREADY RUNS ALONG Y. MEASURED, NOT DERIVED. --</span>
                <span class="tok-comment">//</span>
                <span class="tok-comment">//     genMeshCylinder(r=1, h=1) extent:</span>
                <span class="tok-comment">//       x: [-1.000, 1.000]   y: [0.000, 1.000]   z: [-1.000, 1.000]</span>
                <span class="tok-comment">//</span>
                <span class="tok-comment">// `cylinderUv` returns the axis in its third slot, which reads as Z - but</span>
                <span class="tok-comment">// `parametricMesh` REMAPS as it writes (`verts.y = p[2]`), so the finished</span>
                <span class="tok-comment">// mesh extends along zimr's **Y**, spanning [0, h] rather than [-h/2, +h/2].</span>
                <span class="tok-comment">//</span>
                <span class="tok-comment">// That is the same axis `GeomShape.capsule` uses, so no rotation is needed at</span>
                <span class="tok-comment">// all. A previous version read `cylinderUv` and concluded Z, then rotated by</span>
                <span class="tok-comment">// -90 deg to "correct" it; the non-uniform scale then landed across the shape and</span>
                <span class="tok-comment">// flattened every limb into a wide curved ribbon. **Reading the generator was</span>
                <span class="tok-comment">// not enough - the answer was two functions away, and printing the mesh's</span>
                <span class="tok-comment">// bounds took one command.**</span>
                <span class="tok-comment">//</span>
                <span class="tok-comment">// Only the [0, h] span needs correcting, with a half-length shift along Y.</span>
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
                    <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, -cap.half_height, <span class="tok-num">0</span>)),
                    <span class="tok-fn">scaling</span>(cap.radius, <span class="tok-num">2.0</span> * cap.half_height, cap.radius),
                );
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cylinder, &amp;s.transform, tint);
                <span class="tok-kw">inline</span> <span class="tok-kw">for</span> ([_]f32{ -<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span> }) |end| {
                    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
                        <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, end * cap.half_height, <span class="tok-num">0</span>)),
                        <span class="tok-fn">scaling</span>(cap.radius, cap.radius, cap.radius),
                    );
                    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, tint);
                }
            },
            .cylinder =&gt; |cyl| {
                <span class="tok-comment">// Same axis and the same [0, h] span as the capsule above.</span>
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
                    <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, -cyl.half_height, <span class="tok-num">0</span>)),
                    <span class="tok-fn">scaling</span>(cyl.radius, <span class="tok-num">2.0</span> * cyl.half_height, cyl.radius),
                );
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cylinder, &amp;s.transform, tint);
            },
            .box =&gt; |box| {
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">scaling</span>(
                    <span class="tok-num">2.0</span> * box.half_extent[<span class="tok-num">0</span>],
                    <span class="tok-num">2.0</span> * box.half_extent[<span class="tok-num">1</span>],
                    <span class="tok-num">2.0</span> * box.half_extent[<span class="tok-num">2</span>],
                ));
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, tint);
            },
            <span class="tok-kw">else</span> =&gt; {},
        }
    }

    <span class="tok-comment">// The projectiles, drawn from the tree like everything else.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..ball_count) |i| {
        <span class="tok-kw">const</span> body: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(ball_names[i]) <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
        <span class="tok-kw">const</span> p: Vec = s.data.body_xpos[body];
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
            <span class="tok-fn">mulMat</span>(to_y_up, <span class="tok-fn">translation</span>(p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>], p[<span class="tok-num">2</span>])),
            <span class="tok-fn">scaling</span>(ball_radius, ball_radius, ball_radius),
        );
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, ball_col);
    }

    <span class="tok-comment">// Contact points, so "is it actually standing" is answerable by looking.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.contact_count) |c| {
        <span class="tok-kw">const</span> p: Vec = s.data.contacts[c].position;
        <span class="tok-comment">// Z-up to Y-up is a coordinate swap, and writing it as one is clearer here than</span>
        <span class="tok-comment">// pushing a point through a matrix: (x, y, z) becomes (x, z, -y).</span>
        <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">vec</span>(p[<span class="tok-num">0</span>], p[<span class="tok-num">2</span>], -p[<span class="tok-num">1</span>]);
        z.<span class="tok-fn">drawSphere</span>(gl, at, .{ .radius = <span class="tok-num">0.012</span>, .color = contact_col });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(u: ui.Ui, s: *State) bool {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> captured: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Unitree Go1, imported from Menagerie MJCF"</span>, .{
        .initial_pos = .{ <span class="tok-num">12</span>, <span class="tok-num">12</span> },
        .initial_size = .{ <span class="tok-num">360</span>, <span class="tok-num">300</span> },
    })) |window| {
        <span class="tok-kw">defer</span> window.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{d} bodies   {d} DOF   {d} collision geoms"</span>, .{ m.nbody - <span class="tok-num">1</span>, m.nv, m.ngeom });
        <span class="tok-kw">const</span> trunk: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"trunk"</span>) <span class="tok-kw">orelse</span> <span class="tok-num">1</span>;
        u.<span class="tok-fn">text</span>(<span class="tok-str">"trunk height {d:.4} m   (home 0.2700)"</span>, .{s.data.body_xpos[trunk][<span class="tok-num">2</span>]});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"contacts {d}   rows {d}   iters {d}   load {d:.0} N"</span>, .{
            s.data.contact_count,
            s.data.constraint_count,
            s.data.solver_iterations,
            s.peak_force,
        });
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// * THE TWO NUMBERS WORTH PLAYING WITH. `kp = 100` is the Go1's own, from</span>
        <span class="tok-comment">// `&lt;position kp="100"&gt;` in its MJCF. Drag it down and the legs fold under the robot's</span>
        <span class="tok-comment">// weight; drag it up and it goes rigid and starts to buzz against its force limit.</span>
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"kp"</span>, &amp;s.kp, .{ .min = <span class="tok-num">5.0</span>, .max = <span class="tok-num">400.0</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        <span class="tok-comment">// * THE DAMPING IS ON A SLIDER TOO. It was the parameter that mattered most for slip and</span>
        <span class="tok-comment">// there was no way to touch it - a control whose best value is 3x its default deserves</span>
        <span class="tok-comment">// to be reachable.</span>
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"kv"</span>, &amp;s.kv, .{ .min = <span class="tok-num">0.5</span>, .max = <span class="tok-num">16.0</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"kv"</span>, &amp;s.kv, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">20.0</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"physics"</span>, &amp;s.physics_on);
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// -- ** MOVE THE BODY WITH THE FEET PLANTED --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// A torso has no motors, so it cannot be commanded anywhere directly. But it stands on</span>
        <span class="tok-comment">// four legs whose feet are on the ground, and moving the body is then the same problem</span>
        <span class="tok-comment">// as moving four hips while four feet hold still - three joints at a time, which IS</span>
        <span class="tok-comment">// solvable.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Each leg gets its own IK mask, so the four solves are independent. Given the whole</span>
        <span class="tok-comment">// robot, one leg's solver would cheerfully bend the other three to help, and four of</span>
        <span class="tok-comment">// those fight each other into a standstill.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// `foot error` is what to watch: it stays near zero while the pose is reachable and</span>
        <span class="tok-comment">// climbs the moment a slider asks for more than the legs have.</span>
        <span class="tok-comment">// * THE STANCE IS CAPTURED ON THE RISING EDGE, so the sliders are relative to wherever</span>
        <span class="tok-comment">// the robot is standing right now rather than to a startup pose it has since left.</span>
        <span class="tok-kw">const</span> was_posing: bool = s.posing;
        <span class="tok-comment">// -- ** A GAIT IS FOUR PHASE OFFSETS --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Trot, pace, bound and walk run the SAME foot trajectory and differ only in where in</span>
        <span class="tok-comment">// the cycle each leg sits. The buttons below write four numbers; nothing else changes.</span>
        <span class="tok-kw">const</span> was_walking: bool = s.gait_on;
        <span class="tok-comment">// -- ** TURNING WALK ON PUTS THE ARM WHERE THE GAIT NEEDS IT --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The gait's counter-swing is measured around a HALF-BENT arm; started from wherever the</span>
        <span class="tok-comment">// gimbal happened to leave it, the swing is offset and the phase that was measured to</span>
        <span class="tok-comment">// work is not the phase the robot gets. **A mode that depends on a pose should establish</span>
        <span class="tok-comment">// that pose**, rather than inheriting whatever the last mode left behind.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * AND THE GIMBAL IS TURNED OFF, because the two want the arm for opposite reasons: the</span>
        <span class="tok-comment">// gimbal holds the gripper still, the gait swings it. They cannot both have it.</span>
        <span class="tok-kw">if</span> (u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"walk"</span>, &amp;s.gait_on)) {
            <span class="tok-kw">if</span> (s.gait_on) {
                s.arm_on = false;
                s.gait_phase = <span class="tok-num">0</span>;
                <span class="tok-fn">setArmRest</span>(s);
            }
        }
        <span class="tok-kw">if</span> (s.gait_on <span class="tok-kw">and</span> !was_walking) {
            <span class="tok-fn">captureStance</span>(s);
            s.posing = false;
        }
        <span class="tok-kw">if</span> (s.gait_on) {
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"rate Hz"</span>, &amp;s.gait_hz, .{ .min = <span class="tok-num">0.4</span>, .max = <span class="tok-num">3.5</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"stride"</span>, &amp;s.gait_stride, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">0.22</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"foot lift"</span>, &amp;s.gait_lift, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">0.12</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"duty"</span>, &amp;s.gait_duty, .{ .min = <span class="tok-num">0.3</span>, .max = <span class="tok-num">0.9</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            <span class="tok-comment">// ** THE ARM'S COUNTER-SWING. **Phase is the parameter that matters**: the same</span>
            <span class="tok-comment">// amplitude a quarter-cycle away falls the robot over, while 0.75 walks it 1.49x</span>
            <span class="tok-comment">// further than a still arm and flattens the pitch bias to zero.</span>
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"arm swing"</span>, &amp;s.arm_swing_amp, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">0.8</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"arm phase"</span>, &amp;s.arm_swing_phase, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">1.0</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            u.<span class="tok-fn">text</span>(<span class="tok-str">"   phase {d:.2}   foot error {d:.4} m"</span>, .{ s.gait_phase, s.pose_error });
            <span class="tok-comment">// * THE OTHER PATTERNS SET THEIR SETTINGS TOO, for the same reason: a pattern</span>
            <span class="tok-comment">// measured at another pattern's rate and duty is not the pattern being offered.</span>
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"trot (2 feet down, fast)"</span>, .{})) {
                s.gait_offset = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.0</span> };
                s.gait_hz = <span class="tok-num">2.0</span>;
                s.gait_stride = <span class="tok-num">0.16</span>;
                s.gait_duty = <span class="tok-num">0.60</span>;
                s.gait_lift = <span class="tok-num">0.08</span>;
                s.arm_swing_amp = <span class="tok-num">0.3</span>;
                s.gait_phase = <span class="tok-num">0</span>;
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"pace"</span>, .{})) {
                s.gait_offset = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.0</span>, <span class="tok-num">0.5</span> };
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"bound"</span>, .{})) {
                s.gait_offset = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span> };
            }
            <span class="tok-comment">// * THE 4-BEAT WALK IS OFFERED AND MARKED, because it FALLS at these settings -</span>
            <span class="tok-comment">// measured, z 0.134 with a minimum of -0.216, where trot and pace hold 0.346. Four</span>
            <span class="tok-comment">// evenly spread phases means a foot is always mid-swing, and the Go1 cannot carry</span>
            <span class="tok-comment">// that on three legs at this stride. Left in because watching a gait fail is more</span>
            <span class="tok-comment">// informative than not offering it, and hidden failures are worse than labelled</span>
            <span class="tok-comment">// ones.</span>
            <span class="tok-comment">// -- *** THE CRAWL, AND IT DOES NOT FALL - IT WAS MEASURED AT THE WRONG SETTINGS --</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// This button was labelled "(falls)" on a measurement taken at TROT parameters:</span>
            <span class="tok-comment">// hz 2.0, duty 0.60. At those, four evenly spread phases do fall. **At its own</span>
            <span class="tok-comment">// settings it is the most robust gait here.** Measured, 10 s:</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">//     crawl  hz 1.0  stride 0.14  duty 0.80   0.194 m   z 0.303   pitch 0.010 flat</span>
            <span class="tok-comment">//     crawl  hz 1.4  stride 0.14  duty 0.80   0.207 m   z 0.302   flat</span>
            <span class="tok-comment">//     crawl  hz 1.0  stride 0.14  duty 0.85   0.201 m   z 0.303   flat</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// **Every crawl configuration stands.** Duty 0.80 with quarter-spread phases leaves</span>
            <span class="tok-comment">// THREE FEET DOWN at all times, so the centre of mass only has to stay inside a</span>
            <span class="tok-comment">// triangle that always exists - statically stable by construction, which is the</span>
            <span class="tok-comment">// right property for a robot carrying 2 kg high on its back.</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// ** AND IT NEEDS NO ARM SWING AT ALL. Adding one makes it worse (0.127 against</span>
            <span class="tok-comment">// 0.194): the swing exists to cancel a trot's wobble, and a crawl does not have one.</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// * A GAIT PATTERN IS NOT A PARAMETER ON ITS OWN. Changing the offsets without</span>
            <span class="tok-comment">// changing rate and duty measures the new pattern at the old gait's settings, which</span>
            <span class="tok-comment">// is how this one earned a "(falls)" label it did not deserve.</span>
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"crawl (3 feet down)"</span>, .{})) {
                s.gait_offset = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0.75</span> };
                s.gait_hz = <span class="tok-num">1.4</span>;
                s.gait_stride = <span class="tok-num">0.20</span>;
                s.gait_duty = <span class="tok-num">0.80</span>;
                s.gait_lift = <span class="tok-num">0.06</span>;
                s.arm_swing_amp = <span class="tok-num">0.0</span>;
                s.gait_phase = <span class="tok-num">0</span>;
            }
        }
        u.<span class="tok-fn">separator</span>();
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"pose the torso"</span>, &amp;s.posing);
        <span class="tok-kw">if</span> (s.posing <span class="tok-kw">and</span> !was_posing) {
            <span class="tok-fn">captureStance</span>(s);
        }
        <span class="tok-kw">if</span> (s.posing) {
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"roll"</span>, &amp;s.body_roll, .{ .min = -<span class="tok-num">0.5</span>, .max = <span class="tok-num">0.5</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"pitch"</span>, &amp;s.body_pitch, .{ .min = -<span class="tok-num">0.5</span>, .max = <span class="tok-num">0.5</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            <span class="tok-comment">// ** ASKED VERSUS ACHIEVED, ON SCREEN. The whole bug was that nobody could see the</span>
            <span class="tok-comment">// difference: the sliders said 0.15 and the robot did 0.10, and nothing reported it.</span>
            <span class="tok-comment">// A commanded value with no measured counterpart is a claim, not a readout.</span>
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  asked {d:&gt;6.3} {d:&gt;6.3}"</span>, .{ s.body_roll, s.body_pitch });
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  actual{d:&gt;6.3} {d:&gt;6.3}   trim {d:&gt;5.3} {d:&gt;5.3}"</span>, .{
                s.seen_roll, s.seen_pitch, s.trim_roll, s.trim_pitch,
            });
            u.<span class="tok-fn">separator</span>();

            <span class="tok-comment">// -- * THE ROUTINE, AND ITS SCORE --</span>
            <span class="tok-kw">if</span> (u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"routine: cone + independent roll"</span>, &amp;s.routine)) {
                s.routine_clock = <span class="tok-num">0</span>;
                s.routine_error_sum = <span class="tok-num">0</span>;
                s.routine_error_count = <span class="tok-num">0</span>;
                s.routine_worst = <span class="tok-num">0</span>;
            }
            <span class="tok-kw">if</span> (s.routine) {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"cone rate"</span>, &amp;s.cone_rate, .{ .min = <span class="tok-num">0.1</span>, .max = <span class="tok-num">1.2</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"roll rate"</span>, &amp;s.roll_rate, .{ .min = <span class="tok-num">0.1</span>, .max = <span class="tok-num">1.2</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"cone size"</span>, &amp;s.cone_amount, .{ .min = <span class="tok-num">0.05</span>, .max = <span class="tok-num">0.35</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"roll size"</span>, &amp;s.roll_amount, .{ .min = <span class="tok-num">0.05</span>, .max = <span class="tok-num">0.35</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"bob rate"</span>, &amp;s.bob_rate, .{ .min = <span class="tok-num">0.05</span>, .max = <span class="tok-num">0.8</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
