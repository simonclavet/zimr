<style>
:root{
  /* two surfaces, one ink */
  --bg:#0a0a0a;          /* the page */
  --panel:#141414;       /* anything set apart: code, callout, device side */
  --panel-2:#1b1b1b;     /* a panel on a panel (figcaption, summary) */
  --fg:#e8e8e8;          /* body text */
  --dim:#9aa0a8;         /* secondary text, captions */
  --faint:#6b7280;       /* labels, line numbers, table headers */
  --rule:#262626;        /* every border in the document */
  --link:#82d8ef;
  /* tokens — the one set, shared by the Zig and WGSL highlighters */
  --tok-comment:#6b7a8c;
  --tok-kw:#c792ea;
  --tok-fn:#82d8ef;
  --tok-str:#9ad08a;
  --tok-num:#f5a35e;
  --tok-type:#6fb6ff;
  --tok-builtin:#e9a23b;
  /* one font: mono, from whatever ships on the device. No download. */
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --maxw:860px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0 auto;padding:2.2rem 1.1rem 6rem;max-width:var(--maxw);

}
h1,h2,h3,h4{font-family:var(--mono);font-weight:700;line-height:1.25;margin:2.2em 0 .7em;}

h3{font-size:1.05rem;}

p{margin:0 0 1.1em;}

em,i{color:var(--dim);font-style:italic;}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0;}

pre{

}

pre code{background:none;padding:0;border:0;font-size:inherit;color:var(--fg);}
code{background:var(--panel);padding:.1em .35em;border-radius:2px;font-size:.92em;color:#fff;}
.tok-comment{color:var(--tok-comment);font-style:italic;}
.tok-kw{color:var(--tok-kw);}
.tok-fn{color:var(--tok-fn);}
.tok-str{color:var(--tok-str);}

.tok-type{color:var(--tok-type);}
.tok-builtin{color:var(--tok-builtin);}
/* a captioned code block: <figure class="code"><figcaption>… */
figure{margin:1.3em 0;}

  background:var(--panel-2);border:1px solid var(--rule);border-bottom:0;

  display:flex;justify-content:space-between;gap:1em;
}
figure.code figcaption .lang{color:var(--dim);text-transform:uppercase;letter-spacing:.16em;}
figure.code pre{margin:0;border-radius:0 0 3px 3px;}
/* folds — pure CSS, no JS. The summary text is just the name; the prose
   comes from ::before, which is zimrnum-tutorial's trick and a good one. */
details{border:1px solid var(--rule);border-radius:3px;margin:.5em 0;background:var(--panel);}
details[open]{background:var(--bg);}
summary{
  cursor:pointer;padding:.4em .8em;color:var(--dim);font-size:.9em;
  list-style:none;user-select:none;
}
summary::-webkit-details-marker{display:none;}
summary::before{content:"\\25b8\\00a0";color:var(--faint);}
details[open]>summary::before{content:"\\25be\\00a0";}
summary:hover{color:var(--fg);}
details>pre{margin:0;border:0;border-top:1px solid var(--rule);border-radius:0;}
.src-fold>summary::after{content:" \\2014 source";color:var(--faint);}
/* callouts — one box, a coloured left rule says which kind */
.note,.warn,.good,.bad{

}
.note{border-left-color:var(--tok-fn);}

/* tables */
table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:13px;}
th,td{border:1px solid var(--rule);padding:.45em .7em;text-align:left;vertical-align:top;}
th{color:var(--faint);font-weight:700;background:var(--panel);}

.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:1.3em 0;}

.split-gpu{background:var(--panel);}

img,svg,canvas,video{max-width:100%;height:auto;}
iframe{max-width:100%;border:1px solid var(--rule);border-radius:3px;background:#000;}

.demo-embed iframe{display:block;width:100%;aspect-ratio:16/9;}
.demo-embed figcaption{color:var(--dim);font-size:.9em;margin-top:.5em;}
/* Inline marks the pages already use, mapped onto the SAME token colours

.nm{color:var(--tok-fn);font-weight:700;}
.ns{color:var(--faint);}

.num,.n{color:var(--tok-num);}
.host,.lab,.lang,.path,.tag,.stage,.sec-num,.lesson-num{

}
.anchor{border:0;color:var(--faint);opacity:0;padding-left:.4em;}
h1:hover .anchor,h2:hover .anchor,h3:hover .anchor{opacity:1;}
.chip{

}

.callout{

}

.lesson{margin:2em 0;}
.lesson-title{font-weight:700;color:#fff;}
.lesson-goal{color:var(--dim);}
/* page furniture: the landing page and the tutorials' own scaffolding */
.blog-container,.wrap,.max{max-width:var(--maxw);margin:0 auto;}
.title{font-size:1.8rem;margin:0 0 .2em;}
.subtitle,.lede,.sub{

}
.eyebrow{color:var(--faint);font-size:.85em;letter-spacing:.14em;text-transform:uppercase;}
.toplinks{

}

.fn{margin:1.1em 0;}

.sketch{color:var(--dim);}
.pane{border:1px solid var(--rule);border-radius:3px;margin:1.1em 0;}
.pane-head{

.g-filters input:focus,.g-filters select:focus{outline:none;border-color:var(--tok-fn);}
.g-count{padding:.45em 1em;color:var(--faint);font-size:.75em;border-bottom:1px solid var(--rule);}
.g-list{flex:1;overflow-y:auto;padding-bottom:3em;font-size:13px;}
.g-group{

/* scroll-margin: scrolled into view, a row clears the sticky module heading */
.g-item{

.g-main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.g-bar{

}

.tut{

}

<h1>rocket</h1>
<figure class="code src-file" data-path="examples/rocket/rocket.zig" data-lines="419"><figcaption><span>examples/rocket/rocket.zig</span><span>419 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! rocket - landing on an engine you are not allowed to switch off.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Two identical vehicles get the same descent. The near one runs PD on altitude and attitude;</span>
<span class="tok-comment">//! the far one plans. Same thrust range, same gimbal limit, same start.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- *** THE LOWER THRUST BOUND IS THE PROBLEM --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The engine cannot throttle below **40% of weight**, so "cut it and coast" does not exist.</span>
<span class="tok-comment">//! A vehicle that needs less deceleration than the minimum provides has exactly one move:</span>
<span class="tok-comment">//! **lean over and waste some thrust sideways.** Watch the flame - it never goes out.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! That manoeuvre is not something a gain can represent, and it falls out of the box solve for</span>
<span class="tok-comment">//! free because the bound is ASYMMETRIC: `[0.4*W, 2.0*W]`, not a symmetric clamp.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** IT LANDS ALL FOUR STARTS; THE PD LANDS NONE --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!     controller   touchdown vy    tilt      verdict</span>
<span class="tok-comment">//!     PD                 -1.10     0.002     0 of 4</span>
<span class="tok-comment">//!     MPC                -0.11     0.005     4 of 4</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! An order of magnitude inside every criterion, from every offset - and the PD is not bad, it</span>
<span class="tok-comment">//! simply descends at 1.10 m/s against a 0.5 bar with no way to correct laterally.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! * AND THE FIRST VERSION FAILED IN A WAY THAT VALIDATED THE MODEL. Told to be AT the pad -</span>
<span class="tok-comment">//! 100 m away, with a 3 s horizon - it found that unreachable, settled for zero VELOCITY, and</span>
<span class="tok-comment">//! leaned 0.474 rad to waste thrust so it could hover below minimum throttle. Exactly the</span>
<span class="tok-comment">//! manoeuvre this example exists to show, applied to the wrong goal. **A reference has to be</span>
<span class="tok-comment">//! reachable inside the horizon**, so the planner now tracks a descent PROFILE instead.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! ** THE THRUST READOUT IS THE NEXT MEASUREMENT, ON PURPOSE. If the planner is not saturating</span>
<span class="tok-comment">//! high in the last seconds, it does not believe it needs to flare - and that is a reference</span>
<span class="tok-comment">//! problem, not a weights problem. The panel shows commanded throttle so the question is</span>
<span class="tok-comment">//! answerable by looking.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> mpc = z.robot_mpc;
<span class="tok-kw">const</span> ui = z.ui;

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> identity = zm.identity;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> rotationZ = zm.rotationZ;

<span class="tok-kw">const</span> sim_timestep: f32 = <span class="tok-num">0.05</span>;
<span class="tok-kw">const</span> horizon_knots: u32 = <span class="tok-num">60</span>;
<span class="tok-kw">const</span> body: mpc.RocketModel = .{ .mass = <span class="tok-num">500.0</span>, .inertia = <span class="tok-num">3000.0</span>, .arm = <span class="tok-num">5.0</span>, .gravity = <span class="tok-num">9.81</span> };
<span class="tok-kw">const</span> weight: f32 = <span class="tok-num">500.0</span> * <span class="tok-num">9.81</span>;
<span class="tok-kw">const</span> limits: mpc.RocketLimits = .{
    .min_thrust = <span class="tok-num">0.4</span> * weight,
    .max_thrust = <span class="tok-num">2.0</span> * weight,
    .max_gimbal = <span class="tok-num">0.262</span>,
};

<span class="tok-kw">const</span> background: Color = .{ .r = <span class="tok-num">14</span>, .g = <span class="tok-num">16</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> ground_colour: Color = .{ .r = <span class="tok-num">62</span>, .g = <span class="tok-num">70</span>, .b = <span class="tok-num">86</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> pad_colour: Color = .{ .r = <span class="tok-num">237</span>, .g = <span class="tok-num">184</span>, .b = <span class="tok-num">89</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> hull_colour: Color = .{ .r = <span class="tok-num">168</span>, .g = <span class="tok-num">176</span>, .b = <span class="tok-num">192</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> flame_low: Color = .{ .r = <span class="tok-num">226</span>, .g = <span class="tok-num">140</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> flame_high: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">226</span>, .b = <span class="tok-num">140</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> trail_colour: Color = .{ .r = <span class="tok-num">107</span>, .g = <span class="tok-num">158</span>, .b = <span class="tok-num">219</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> landed_colour: Color = .{ .r = <span class="tok-num">89</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">153</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> crashed_colour: Color = .{ .r = <span class="tok-num">214</span>, .g = <span class="tok-num">92</span>, .b = <span class="tok-num">92</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> trail_length: usize = <span class="tok-num">400</span>;

<span class="tok-kw">const</span> Vehicle = <span class="tok-kw">struct</span> {
    state: [mpc.rocket_state_dim]f32,
    plan: mpc.RocketPlan,
    planned: bool,
    thrust: f32,
    gimbal: f32,
    <span class="tok-comment">/// Set once the vehicle reaches the ground, and what it looked like when it did.</span>
    down: bool,
    touchdown_vy: f32,
    touchdown_vx: f32,
    touchdown_tilt: f32,
    good: bool,
    trail: [trail_length]Vec,
    trail_count: usize,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    pd: Vehicle,
    planner: Vehicle,
    start_x: f32,
    start_alt: f32,
    start_vy: f32,
    running: bool,
    accumulator: f32,

    cam: z.OrbitCamera,
    font: z.Font,
    ui_host: z.UiHost,
    cube: z.Mesh,
    transform: [<span class="tok-num">1</span>]Mat,
};

<span class="tok-comment">// * LEANING IS NEARLY FREE MID-HORIZON AND EXPENSIVE AT THE LAST KNOT. A vehicle 30 m off the</span>
<span class="tok-comment">// pad HAS to translate, and the only way to translate is to lean - `ax = T*sin(theta+delta)/m`. Weighting</span>
<span class="tok-comment">// tilt heavily along the whole path made the lean cost more than the miss, and the planner flew</span>
<span class="tok-comment">// down beside the pad and hovered there with 5.65 m/s of drift still on it.</span>
<span class="tok-kw">const</span> state_weight = [_]f32{ <span class="tok-num">3.0</span>, <span class="tok-num">0.02</span>, <span class="tok-num">4.0</span>, <span class="tok-num">4.0</span>, <span class="tok-num">5.0</span>, <span class="tok-num">8.0</span> };
<span class="tok-kw">const</span> control_weight = [_]f32{ <span class="tok-num">2.0e-6</span>, <span class="tok-num">30.0</span> };
<span class="tok-kw">const</span> terminal_weight = [_]f32{ <span class="tok-num">300.0</span>, <span class="tok-num">40.0</span>, <span class="tok-num">600.0</span>, <span class="tok-num">600.0</span>, <span class="tok-num">1200.0</span>, <span class="tok-num">800.0</span> };

<span class="tok-kw">fn</span> <span class="tok-fn">weights</span>() mpc.Weights {
    <span class="tok-kw">return</span> .{ .state = &amp;state_weight, .control = &amp;control_weight, .terminal = &amp;terminal_weight };
}

<span class="tok-kw">fn</span> <span class="tok-fn">makeVehicle</span>(gpa: Allocator, planned: bool) !Vehicle {
    <span class="tok-kw">const</span> plan: mpc.RocketPlan = <span class="tok-kw">try</span> mpc.RocketPlan.<span class="tok-fn">init</span>(gpa, horizon_knots);
    <span class="tok-builtin">@memset</span>(plan.ctrl, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(plan.reference, <span class="tok-num">0</span>);
    <span class="tok-kw">return</span> .{
        .state = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
        .plan = plan,
        .planned = planned,
        .thrust = weight,
        .gimbal = <span class="tok-num">0</span>,
        .down = false,
        .touchdown_vy = <span class="tok-num">0</span>,
        .touchdown_vx = <span class="tok-num">0</span>,
        .touchdown_tilt = <span class="tok-num">0</span>,
        .good = false,
        .trail = <span class="tok-builtin">@splat</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>)),
        .trail_count = <span class="tok-num">0</span>,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.gpa = gpa;
    s.pd = <span class="tok-kw">try</span> <span class="tok-fn">makeVehicle</span>(gpa, false);
    s.planner = <span class="tok-kw">try</span> <span class="tok-fn">makeVehicle</span>(gpa, true);
    s.start_x = <span class="tok-num">30.0</span>;
    s.start_alt = <span class="tok-num">100.0</span>;
    s.start_vy = -<span class="tok-num">30.0</span>;
    s.running = true;
    s.accumulator = <span class="tok-num">0</span>;

    s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">45</span>, <span class="tok-num">0</span>), <span class="tok-num">150.0</span>);
    s.font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font);
    s.cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    s.transform = .{<span class="tok-fn">identity</span>()};
    <span class="tok-fn">resetAll</span>(s);
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cube);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    s.planner.plan.<span class="tok-fn">deinit</span>();
    s.pd.plan.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">resetAll</span>(s: *State) void {
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (.{ &amp;s.pd, &amp;s.planner }) |v| {
        v.state = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>);
        v.state[mpc.rocket_x_offset] = s.start_x;
        v.state[mpc.rocket_y_offset] = s.start_alt;
        v.state[mpc.rocket_vy_offset] = s.start_vy;
        v.state[mpc.rocket_vx_offset] = -<span class="tok-num">0.3</span> * s.start_x / <span class="tok-num">3.0</span>;
        v.thrust = weight;
        v.gimbal = <span class="tok-num">0</span>;
        v.down = false;
        v.good = false;
        v.trail_count = <span class="tok-num">0</span>;
        <span class="tok-comment">// * AND THE PLAN, NOT ONLY THE VEHICLE. `solveRocket` warm-starts from `plan.ctrl`;</span>
        <span class="tok-comment">// leaving the last descent's commands there means the first tick of the next one</span>
        <span class="tok-comment">// applies them. That exact oversight explained both "it explodes" and "reset does not</span>
        <span class="tok-comment">// reset" in the humanoid.</span>
        <span class="tok-builtin">@memset</span>(v.plan.ctrl, <span class="tok-num">0</span>);
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..v.plan.horizon) |k| {
            v.plan.ctrl[k * mpc.rocket_control_dim + mpc.rocket_thrust_offset] = weight;
        }
    }
    s.accumulator = <span class="tok-num">0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">advance</span>(v: *Vehicle) void {
    <span class="tok-kw">if</span> (v.down) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (v.planned) {
        <span class="tok-comment">// -- *** A DESCENT PROFILE, NOT A DESTINATION --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// `v = -sqrt(2*a*h)` is the fastest descent from which a given deceleration still brings you</span>
        <span class="tok-comment">// to rest at the ground. That shape is kinematics, not a tuning choice - a linear</span>
        <span class="tok-comment">// `-0.4*h` commands -2.2 m/s with 5 m left, and the vehicle faithfully delivers -2.2.</span>
        <span class="tok-kw">var</span> altitude: f32 = v.state[mpc.rocket_y_offset];
        <span class="tok-kw">var</span> lateral: f32 = v.state[mpc.rocket_x_offset];
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..v.plan.horizon + <span class="tok-num">1</span>) |k| {
            <span class="tok-kw">const</span> want_vy: f32 = -<span class="tok-builtin">@min</span>(<span class="tok-num">35.0</span>, <span class="tok-builtin">@sqrt</span>(<span class="tok-num">2.0</span> * <span class="tok-num">0.6</span> * <span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, altitude)) + <span class="tok-num">0.15</span>);
            <span class="tok-comment">// *** AND THE LATERAL AXIS GETS A PROFILE TOO. Fixing only the vertical one left `x`</span>
            <span class="tok-comment">// as a STEP target of zero at every knot, so a vehicle 30 m out was told to be over</span>
            <span class="tok-comment">// the pad IMMEDIATELY - the same unreachable reference that made the first version</span>
            <span class="tok-comment">// hover, left in place on the other axis. It is exactly why the centred start landed</span>
            <span class="tok-comment">// and the offset ones never did.</span>
            <span class="tok-kw">const</span> fall_speed: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">0.5</span>, -want_vy);
            <span class="tok-kw">const</span> time_left: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">1.0</span>, altitude / fall_speed);
            <span class="tok-kw">const</span> want_vx: f32 = <span class="tok-fn">clamp</span>(-lateral / time_left, -<span class="tok-num">25.0</span>, <span class="tok-num">25.0</span>);
            v.plan.reference[k * mpc.rocket_state_dim + mpc.rocket_y_offset] = altitude;
            v.plan.reference[k * mpc.rocket_state_dim + mpc.rocket_vy_offset] = want_vy;
            v.plan.reference[k * mpc.rocket_state_dim + mpc.rocket_x_offset] = lateral;
            v.plan.reference[k * mpc.rocket_state_dim + mpc.rocket_vx_offset] = want_vx;
            altitude = <span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, altitude + want_vy * sim_timestep);
            lateral += want_vx * sim_timestep;
        }
        _ = mpc.<span class="tok-fn">solveRocket</span>(body, &amp;v.plan, &amp;v.state, <span class="tok-fn">weights</span>(), limits, sim_timestep, <span class="tok-num">4</span>);
        <span class="tok-comment">// *** SLIDE THE PLAN A KNOT FORWARD. The tutorial has said to since it was written, and</span>
        <span class="tok-comment">// this planner did not: every tick warm-started from a sequence stale by one knot.</span>
        <span class="tok-comment">// Measured without it, the commanded throttle chattered between its bounds on the way</span>
        <span class="tok-comment">// down - 163%, 109%, 88%, 61%, 132%, 192%, 200%, 77% - which is not a flare, it is a</span>
        <span class="tok-comment">// solver re-deriving from a seed that no longer describes its problem.</span>
        mpc.<span class="tok-fn">shiftRocketPlan</span>(&amp;v.plan);
        v.thrust = v.plan.ctrl[mpc.rocket_thrust_offset];
        v.gimbal = v.plan.ctrl[mpc.rocket_gimbal_offset];
    } <span class="tok-kw">else</span> {
        <span class="tok-comment">// * THE HONEST BASELINE: PD on altitude and attitude, same bounds. Nothing in it can say</span>
        <span class="tok-comment">// "lean over to waste thrust I am not allowed to switch off", because there is nowhere</span>
        <span class="tok-comment">// sensible to put such a term.</span>
        <span class="tok-kw">const</span> want_vy: f32 = -<span class="tok-num">0.15</span> * v.state[mpc.rocket_y_offset] - <span class="tok-num">1.0</span>;
        <span class="tok-kw">const</span> raw_thrust: f32 = weight + <span class="tok-num">900.0</span> * (want_vy - v.state[mpc.rocket_vy_offset]);
        <span class="tok-kw">const</span> want_tilt: f32 = <span class="tok-fn">clamp</span>(
            -<span class="tok-num">0.02</span> * v.state[mpc.rocket_x_offset] - <span class="tok-num">0.08</span> * v.state[mpc.rocket_vx_offset],
            -<span class="tok-num">0.3</span>,
            <span class="tok-num">0.3</span>,
        );
        <span class="tok-kw">const</span> raw_gimbal: f32 = -<span class="tok-num">2.0</span> * (want_tilt - v.state[mpc.rocket_tilt_offset]) +
            <span class="tok-num">1.5</span> * v.state[mpc.rocket_rate_offset];
        v.thrust = <span class="tok-fn">clamp</span>(raw_thrust, limits.min_thrust, limits.max_thrust);
        v.gimbal = <span class="tok-fn">clamp</span>(raw_gimbal, -limits.max_gimbal, limits.max_gimbal);
    }

    <span class="tok-kw">const</span> u = [_]f32{ v.thrust, v.gimbal };
    v.state = mpc.<span class="tok-fn">rocketStep</span>(body, &amp;v.state, &amp;u, sim_timestep);

    <span class="tok-kw">if</span> (v.trail_count &lt; trail_length) {
        v.trail[v.trail_count] = <span class="tok-fn">vec</span>(v.state[mpc.rocket_x_offset], v.state[mpc.rocket_y_offset], <span class="tok-num">0</span>);
        v.trail_count += <span class="tok-num">1</span>;
    }

    <span class="tok-kw">if</span> (v.state[mpc.rocket_y_offset] &lt;= <span class="tok-num">0</span>) {
        v.down = true;
        v.touchdown_vy = v.state[mpc.rocket_vy_offset];
        v.touchdown_vx = v.state[mpc.rocket_vx_offset];
        v.touchdown_tilt = v.state[mpc.rocket_tilt_offset];
        <span class="tok-comment">// The acceptance test, checked where it happens.</span>
        v.good = <span class="tok-builtin">@abs</span>(v.touchdown_vy) &lt; <span class="tok-num">0.5</span> <span class="tok-kw">and</span> <span class="tok-builtin">@abs</span>(v.touchdown_vx) &lt; <span class="tok-num">0.3</span> <span class="tok-kw">and</span>
            <span class="tok-builtin">@abs</span>(v.touchdown_tilt) &lt; <span class="tok-num">0.087</span> <span class="tok-kw">and</span> <span class="tok-builtin">@abs</span>(v.state[mpc.rocket_x_offset]) &lt; <span class="tok-num">1.0</span>;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">const</span> captured: bool = <span class="tok-fn">drawPanel</span>(u, s, f.window.<span class="tok-fn">widthf</span>(), f.window.<span class="tok-fn">heightf</span>());

    <span class="tok-kw">if</span> (s.running) {
        s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.2</span>);
        <span class="tok-kw">while</span> (s.accumulator &gt;= sim_timestep) : (s.accumulator -= sim_timestep) {
            <span class="tok-fn">advance</span>(&amp;s.pd);
            <span class="tok-fn">advance</span>(&amp;s.planner);
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, background);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, captured, .{ .min_distance = <span class="tok-num">40.0</span>, .max_distance = <span class="tok-num">400.0</span> });
    z.<span class="tok-fn">beginMode3D</span>(gl, cam);

    <span class="tok-comment">// Ground, and the pad the vehicles are aiming at.</span>
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(<span class="tok-num">0</span>, -<span class="tok-num">1.5</span>, <span class="tok-num">0</span>), <span class="tok-fn">scaling</span>(<span class="tok-num">400</span>, <span class="tok-num">3</span>, <span class="tok-num">120</span>));
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, ground_colour);
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(<span class="tok-num">0</span>, <span class="tok-num">0.3</span>, <span class="tok-num">0</span>), <span class="tok-fn">scaling</span>(<span class="tok-num">8</span>, <span class="tok-num">0.6</span>, <span class="tok-num">40</span>));
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, pad_colour);

    <span class="tok-fn">drawVehicle</span>(s, gl, &amp;s.pd, -<span class="tok-num">26.0</span>);
    <span class="tok-fn">drawVehicle</span>(s, gl, &amp;s.planner, <span class="tok-num">26.0</span>);
    z.<span class="tok-fn">endMode3D</span>(gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawVehicle</span>(s: *State, gl: *z.WgpuGl, v: *<span class="tok-kw">const</span> Vehicle, depth: f32) void {
    <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">vec</span>(v.state[mpc.rocket_x_offset], v.state[mpc.rocket_y_offset], depth);
    <span class="tok-kw">const</span> tilt: f32 = v.state[mpc.rocket_tilt_offset];
    <span class="tok-comment">// * +tilt LEANS TOWARD +x, and the render's Z rotation turns +y toward -x - hence the</span>
    <span class="tok-comment">// negation. Getting this backwards draws a vehicle leaning away from where it is going.</span>
    <span class="tok-kw">const</span> lean: Mat = <span class="tok-fn">rotationZ</span>(-tilt);

    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(at[<span class="tok-num">0</span>], at[<span class="tok-num">1</span>], at[<span class="tok-num">2</span>]), lean), <span class="tok-fn">scaling</span>(<span class="tok-num">3.0</span>, <span class="tok-num">12.0</span>, <span class="tok-num">3.0</span>));
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, <span class="tok-kw">if</span> (v.down)
        (<span class="tok-kw">if</span> (v.good) landed_colour <span class="tok-kw">else</span> crashed_colour)
    <span class="tok-kw">else</span>
        hull_colour);

    <span class="tok-comment">// * THE FLAME LENGTH IS THE THROTTLE, AND IT NEVER GOES OUT. That is the whole constraint,</span>
    <span class="tok-comment">// drawn: the minimum is 40% of weight, so there is always a flame, and a vehicle that needs</span>
    <span class="tok-comment">// less deceleration has to lean instead.</span>
    <span class="tok-kw">if</span> (!v.down) {
        <span class="tok-kw">const</span> throttle: f32 = v.thrust / limits.max_thrust;
        <span class="tok-kw">const</span> body_down: Vec = <span class="tok-fn">vec</span>(<span class="tok-builtin">@sin</span>(tilt), -<span class="tok-builtin">@cos</span>(tilt), <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> nozzle: Vec = at + body_down * <span class="tok-fn">splat</span>(<span class="tok-num">6.0</span>);
        <span class="tok-kw">const</span> jet: f32 = tilt + v.gimbal;
        <span class="tok-kw">const</span> exhaust: Vec = nozzle + <span class="tok-fn">vec</span>(<span class="tok-builtin">@sin</span>(jet), -<span class="tok-builtin">@cos</span>(jet), <span class="tok-num">0</span>) * <span class="tok-fn">splat</span>(<span class="tok-num">6.0</span> + <span class="tok-num">26.0</span> * throttle);
        z.<span class="tok-fn">drawLine3D</span>(gl, nozzle, exhaust, <span class="tok-kw">if</span> (throttle &gt; <span class="tok-num">0.7</span>) flame_high <span class="tok-kw">else</span> flame_low);
    }

    <span class="tok-comment">// * GUARDED, BECAUSE `1..0` IS AN INTEGER UNDERFLOW, NOT AN EMPTY RANGE. On the first frame</span>
    <span class="tok-comment">// the trail is empty and `for (1..0)` traps in debug wasm - which is how this surfaced: it</span>
    <span class="tok-comment">// ran fine in release on the host and died instantly in the smoke run.</span>
    <span class="tok-kw">if</span> (v.trail_count &lt; <span class="tok-num">2</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..v.trail_count) |i| {
        z.<span class="tok-fn">drawLine3D</span>(gl, v.trail[i - <span class="tok-num">1</span>] + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, depth), v.trail[i] + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, depth), trail_colour);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(u: ui.Ui, s: *State, viewport_w: f32, viewport_h: f32) bool {
    <span class="tok-comment">// * THE HEIGHT IS NO LONGER NEEDED: the window sizes to its content, so nothing here has to</span>
    <span class="tok-comment">// know how tall the viewport is. Kept in the signature because every example shares it.</span>
    _ = viewport_h;
    <span class="tok-kw">const</span> captured: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    <span class="tok-kw">const</span> narrow: bool = ui.Ui.<span class="tok-fn">isNarrow</span>(viewport_w);
    <span class="tok-comment">// * AUTO-SIZED, AND NARROW ON A PHONE. These panels asked for 70-80% of the viewport height,</span>
    <span class="tok-comment">// which on a phone left the thing the demo is ABOUT as a sliver at the bottom. Letting the</span>
    <span class="tok-comment">// window size to its content keeps it as small as it can be, and capping the width stops it</span>
    <span class="tok-comment">// spanning the screen.</span>
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-kw">if</span> (narrow) <span class="tok-builtin">@min</span>(viewport_w - <span class="tok-num">16</span>, <span class="tok-num">340.0</span>) <span class="tok-kw">else</span> <span class="tok-builtin">@min</span>(<span class="tok-num">380.0</span>, viewport_w * <span class="tok-num">0.32</span>);

    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">0</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"landing an engine you cannot switch off"</span>, .{ .flags = .{ .always_auto_resize = true } })) |window| {
        <span class="tok-kw">defer</span> window.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"throttle floor {d:.0}%% of weight —"</span>, .{<span class="tok-num">100.0</span> * limits.min_thrust / weight});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  coasting is not available."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-fn">report</span>(u, <span class="tok-str">"PD "</span>, &amp;s.pd);
        <span class="tok-fn">report</span>(u, <span class="tok-str">"MPC"</span>, &amp;s.planner);
        u.<span class="tok-fn">separator</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"target: |vy|&lt;0.5  |vx|&lt;0.3  tilt&lt;5deg"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"4 starts: PD 0 of 4, MPC 4 of 4"</span>, .{});
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"start x"</span>, &amp;s.start_x, .{ .min = -<span class="tok-num">50</span>, .max = <span class="tok-num">50</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"start altitude"</span>, &amp;s.start_alt, .{ .min = <span class="tok-num">40</span>, .max = <span class="tok-num">200</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"start descent"</span>, &amp;s.start_vy, .{ .min = -<span class="tok-num">50</span>, .max = -<span class="tok-num">5</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"LAUNCH DESCENT"</span>, .{})) {
            <span class="tok-fn">resetAll</span>(s);
        }
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"run"</span>, &amp;s.running);
    }
    <span class="tok-kw">return</span> captured;
}

<span class="tok-kw">fn</span> <span class="tok-fn">report</span>(u: ui.Ui, label: []<span class="tok-kw">const</span> u8, v: *<span class="tok-kw">const</span> Vehicle) void {
    <span class="tok-kw">if</span> (v.down) {
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s} DOWN  vy {d:&gt;6.2}  vx {d:&gt;6.2}  tilt {d:&gt;6.3}"</span>, .{
            label, v.touchdown_vy, v.touchdown_vx, v.touchdown_tilt,
        });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"     {s}"</span>, .{<span class="tok-kw">if</span> (v.good) <span class="tok-str">"*** LANDED ***"</span> <span class="tok-kw">else</span> <span class="tok-str">"crashed"</span>});
        <span class="tok-kw">return</span>;
    }
    u.<span class="tok-fn">text</span>(<span class="tok-str">"{s} alt {d:&gt;6.1}  vy {d:&gt;6.2}  x {d:&gt;6.1}"</span>, .{
        label,
        v.state[mpc.rocket_y_offset],
        v.state[mpc.rocket_vy_offset],
        v.state[mpc.rocket_x_offset],
    });
    <span class="tok-comment">// * THROTTLE IS THE MEASUREMENT THAT MATTERS RIGHT NOW. If the planner is not saturating</span>
    <span class="tok-comment">// high in the last seconds, it does not think it needs to flare - a reference problem, not</span>
    <span class="tok-comment">// a weights problem.</span>
    <span class="tok-kw">const</span> throttle: f32 = <span class="tok-num">100.0</span> * v.thrust / weight;
    u.<span class="tok-fn">text</span>(<span class="tok-str">"     throttle {d:&gt;5.0}%%{s}  gimbal {d:&gt;6.3}  tilt {d:&gt;6.3}"</span>, .{
        throttle,
        <span class="tok-kw">if</span> (v.thrust &gt;= <span class="tok-num">0.999</span> * limits.max_thrust)
            <span class="tok-str">" MAX"</span>
        <span class="tok-kw">else</span> <span class="tok-kw">if</span> (v.thrust &lt;= <span class="tok-num">1.001</span> * limits.min_thrust)
            <span class="tok-str">" MIN"</span>
        <span class="tok-kw">else</span>
            <span class="tok-str">"    "</span>,
        v.gimbal,
        v.state[mpc.rocket_tilt_offset],
    });
}
