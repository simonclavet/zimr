<h1>text_font_sdf</h1>
<figure class="code src-file" data-path="examples/text_font_sdf/text_font_sdf.zig" data-lines="192"><figcaption><span>examples/text_font_sdf/text_font_sdf.zig</span><span>192 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! text_font_sdf - port of raylib [text] example - font SDF loading.</span>
<span class="tok-comment">//! raylib source: examples/text/text_font_sdf.c.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The point of SDF text: a normal glyph atlas stores COVERAGE, so magnifying a</span>
<span class="tok-comment">//! glyph past the resolution it was baked at just bilinear-blurs that coverage -</span>
<span class="tok-comment">//! the edge goes soft. A signed-distance-field atlas stores, per texel, the</span>
<span class="tok-comment">//! distance to the nearest glyph edge; a `smoothstep` around the 0.5 iso-line</span>
<span class="tok-comment">//! reconstructs a crisp ~1px edge at ANY magnification. raylib proves it by</span>
<span class="tok-comment">//! baking one 16px font both ways and drawing both big; this does the same and</span>
<span class="tok-comment">//! makes the size a live slider so you can watch the bitmap dissolve while the</span>
<span class="tok-comment">//! SDF stays razor-sharp.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Engine work this drove:</span>
<span class="tok-comment">//!   * `z.loadFontSdf` - bake a coverage atlas, then `image.coverageToSdf`</span>
<span class="tok-comment">//!     (a pure, unit-tested signed 8SSEDT) turns coverage into distance in the</span>
<span class="tok-comment">//!     alpha channel; uploaded LINEAR-filtered.</span>
<span class="tok-comment">//!   * `src/shaders/text_sdf_fs.zig` - raylib's `sdf.fs`, the `smoothstep(0.5)`</span>
<span class="tok-comment">//!     fragment stage, run over the 2D batch via `beginShaderMode`. The SDF</span>
<span class="tok-comment">//!     glyphs are just `gl.text` drawn between begin/endShaderMode.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! `.memory = .managed`: both fonts + the UI font + the shader are freed in</span>
<span class="tok-comment">//! `deinit`; the atlases are engine-owned (registered) and reclaimed with the</span>
<span class="tok-comment">//! renderer, so the twice-lifecycle census stays FLAT.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = z.colors;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-comment">/// The WGSL the build generated from `src/shaders/text_sdf_fs.zig`.</span>
<span class="tok-kw">const</span> sdf_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"text_sdf_fs.wgsl"</span>);

<span class="tok-kw">const</span> samples = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"Sphinx"</span>, <span class="tok-str">"SHARP"</span>, <span class="tok-str">"Ag&amp;Q@"</span>, <span class="tok-str">"zimr"</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_font: z.Font,
    <span class="tok-comment">/// Small coverage atlas - blurs when magnified far past its bake size.</span>
    bitmap_font: z.Font,
    <span class="tok-comment">/// Same face, baked as a signed distance field - crisp at any size.</span>
    sdf_font: z.Font,
    sdf_shader: z.Shader2D,
    ui_host: z.UiHost,

    <span class="tok-comment">/// On-screen pixel size both rows are drawn at.</span>
    size: f32 = <span class="tok-num">200.0</span>,
    <span class="tok-comment">/// SDF edge smoothing half-width (shader params[0]).</span>
    smoothing: f32 = <span class="tok-num">0.05</span>,
    sample_idx: u32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>);
    <span class="tok-kw">const</span> sdf_shader: z.Shader2D = <span class="tok-kw">try</span> z.Shader2D.<span class="tok-fn">init</span>(
        gpa,
        f.gpu.device,
        f.gpu.queue,
        f.gl.<span class="tok-fn">renderer</span>(),
        sdf_wgsl,
        <span class="tok-str">"text_sdf"</span>,
    );
    s.* = .{
        .ui_font = ui_font,
        <span class="tok-comment">// A deliberately small coverage atlas so the blur is honest at big sizes.</span>
        .bitmap_font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">32</span>),
        .sdf_font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFontSdf</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">128</span>),
        .sdf_shader = sdf_shader,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.bitmap_font);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.sdf_font);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.ui_font);
    s.sdf_shader.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> word: []<span class="tok-kw">const</span> u8 = samples[s.sample_idx];

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">18</span>, .b = <span class="tok-num">26</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-kw">const</span> panel_h: f32 = <span class="tok-num">210</span>;
    <span class="tok-kw">const</span> top: f32 = <span class="tok-num">44</span>;
    <span class="tok-kw">const</span> avail: f32 = fh - panel_h - top - <span class="tok-num">16</span>;
    <span class="tok-kw">const</span> row_h: f32 = avail / <span class="tok-num">2.0</span>;

    <span class="tok-comment">// ---- row 1: the plain coverage (bitmap) font --------------------------</span>
    <span class="tok-kw">const</span> bm_row_y: f32 = top;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, bm_row_y }, <span class="tok-str">"BITMAP (coverage atlas) - blurs when magnified"</span>, .{
        .size = <span class="tok-num">15</span>,
        .color = c.slate_400,
        .font = &amp;s.ui_font,
    });
    <span class="tok-fn">drawCentered</span>(f, s.bitmap_font, word, s.size, fw, bm_row_y + <span class="tok-num">28</span>, row_h - <span class="tok-num">40</span>, c.sky_300, null);

    <span class="tok-comment">// divider</span>
    f.gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">16</span>, .y = top + row_h, .width = fw - <span class="tok-num">32</span>, .height = <span class="tok-num">1</span> }, .{
        .color = .{ .r = <span class="tok-num">40</span>, .g = <span class="tok-num">44</span>, .b = <span class="tok-num">54</span>, .a = <span class="tok-num">255</span> },
    });

    <span class="tok-comment">// ---- row 2: the SDF font, drawn through the SDF shader -----------------</span>
    <span class="tok-kw">const</span> sdf_row_y: f32 = top + row_h;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, sdf_row_y }, <span class="tok-str">"SDF (distance field) - crisp at any size"</span>, .{
        .size = <span class="tok-num">15</span>,
        .color = c.slate_400,
        .font = &amp;s.ui_font,
    });
    s.sdf_shader.<span class="tok-fn">setParams</span>(.{ .params = .{ s.smoothing, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } });
    <span class="tok-fn">drawCentered</span>(f, s.sdf_font, word, s.size, fw, sdf_row_y + <span class="tok-num">28</span>, row_h - <span class="tok-num">40</span>, c.amber_300, &amp;s.sdf_shader);

    <span class="tok-comment">// ---- control panel ----------------------------------------------------</span>
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, fh - panel_h - <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16.0</span>, panel_h }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"SDF text (loadFontSdf + smoothstep shader)"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Both rows draw the same word at the SAME px size."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Crank size up: the bitmap softens, the SDF holds its edge."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"sample: {s}"</span>, .{word});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"&lt; prev"</span>, .{})) {
            s.sample_idx = <span class="tok-kw">if</span> (s.sample_idx == <span class="tok-num">0</span>) samples.len - <span class="tok-num">1</span> <span class="tok-kw">else</span> s.sample_idx - <span class="tok-num">1</span>;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"next &gt;"</span>, .{})) {
            s.sample_idx = <span class="tok-kw">if</span> (s.sample_idx + <span class="tok-num">1</span> &gt;= samples.len) <span class="tok-num">0</span> <span class="tok-kw">else</span> s.sample_idx + <span class="tok-num">1</span>;
        }

        u.<span class="tok-fn">separator</span>();
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"size px"</span>, &amp;s.size, .{ .min = <span class="tok-num">40.0</span>, .max = <span class="tok-num">360.0</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"SDF edge"</span>, &amp;s.smoothing, .{ .min = <span class="tok-num">0.02</span>, .max = <span class="tok-num">0.14</span> });
    }

    s.ui_host.<span class="tok-fn">render</span>(f);
    common.<span class="tok-fn">caption</span>(
        f.gl,
        s.ui_font,
        <span class="tok-str">"SDF: one distance-field atlas stays sharp at any zoom - z.loadFontSdf + src/shaders/text_sdf_fs.zig"</span>,
    );
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// Draw `word` horizontally centred in a row band. If `shader` is non-null,</span>
<span class="tok-comment">/// wrap the text in begin/endShaderMode so it renders through that shader.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawCentered</span>(
    f: *z.Frame,
    font: z.Font,
    word: []<span class="tok-kw">const</span> u8,
    size: f32,
    fw: f32,
    band_top: f32,
    band_h: f32,
    tint: Color,
    shader: ?*<span class="tok-kw">const</span> z.Shader2D,
) void {
    <span class="tok-kw">const</span> dim: Vec2 = z.<span class="tok-fn">measureText</span>(font, word, size);
    <span class="tok-kw">const</span> tx: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">12.0</span>, (fw - dim[<span class="tok-num">0</span>]) * <span class="tok-num">0.5</span>);
    <span class="tok-kw">const</span> ty: f32 = band_top + <span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, (band_h - dim[<span class="tok-num">1</span>]) * <span class="tok-num">0.5</span>);
    <span class="tok-kw">if</span> (shader) |sh| {
        z.<span class="tok-fn">beginShaderMode</span>(f.gl, sh.*);
        f.gl.<span class="tok-fn">text</span>(.{ tx, ty }, word, .{ .size = size, .color = tint, .font = &amp;font });
        z.<span class="tok-fn">endShaderMode</span>(f.gl);
    } <span class="tok-kw">else</span> {
        f.gl.<span class="tok-fn">text</span>(.{ tx, ty }, word, .{ .size = size, .color = tint, .font = &amp;font });
    }
}

        },
    },

};
