<h1>ui_dev_tools</h1>
<figure class="code src-file" data-path="examples/ui_dev_tools/ui_dev_tools.zig" data-lines="202"><figcaption><span>examples/ui_dev_tools/ui_dev_tools.zig</span><span>202 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_dev_tools.zig - P2.4 demo for the developer tools</span>
<span class="tok-comment">// surface introduced in P2 (turns 385-387):</span>
<span class="tok-comment">//   - `UiContext.metrics: Metrics` (P2.2, turn 386) - frame counters,</span>
<span class="tok-comment">//     time history, drawlist + cmd accumulators, window counts.</span>
<span class="tok-comment">//   - `UiContext.debug_log: BoundedArray(DebugEvent, 256)` (P2.1,</span>
<span class="tok-comment">//     turn 385) - internal event ring populated by openPopup,</span>
<span class="tok-comment">//     closeCurrentPopup, drag-threshold-cross, and dropAccepted.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What this demo shows:</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   1. The marquee payoff of P1's inspector arriving early - the</span>
<span class="tok-comment">//      Metrics panel is literally `u.inspect("Metrics", &amp;ctx.metrics)`.</span>
<span class="tok-comment">//      Field discovery is automatic; no per-field widget code in the</span>
<span class="tok-comment">//      example.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   2. A DebugLog viewer that walks `debugLogSlice(ctx)` and renders</span>
<span class="tok-comment">//      one row per event.  Doesn't go through inspect because the</span>
<span class="tok-comment">//      ring's storage layer (BoundedArray's `buffer: [256]DebugEvent`)</span>
<span class="tok-comment">//      would surface 256 elements where only `len` are meaningful.</span>
<span class="tok-comment">//      Future inspector helper (P9?) could special-case BoundedArray;</span>
<span class="tok-comment">//      for now it's a 6-line manual loop.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   3. A few interactive trigger widgets that generate events so</span>
<span class="tok-comment">//      the viewer isn't empty:</span>
<span class="tok-comment">//        - "Open popup" button -&gt; popup_opened entry.</span>
<span class="tok-comment">//        - Drag-drop source row + target slot -&gt; drag_started +</span>
<span class="tok-comment">//          drop_accepted entries.</span>
<span class="tok-comment">//        - "Bad slider" with `min == max` deliberately triggers</span>
<span class="tok-comment">//          the P2.3 lint #1 warning.  Look at the browser console</span>
<span class="tok-comment">//          for `[zimr lint]`.  Fires once.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Phone-friendly: responsive scale, font_size 16, full-screen host</span>
<span class="tok-comment">// window that scrolls when content overflows.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    <span class="tok-comment">// Drag-source payload - gets dropped onto the slot below to</span>
    <span class="tok-comment">// exercise the drag_started + drop_accepted log entries.</span>
    drag_value: i32 = <span class="tok-num">7</span>,
    slot_value: i32 = <span class="tok-num">0</span>,

    <span class="tok-comment">// Bad slider value - feeding it to a slider with min == max</span>
    <span class="tok-comment">// exercises lint #1.  Value is just a placeholder; the slider</span>
    <span class="tok-comment">// returns false because the range is degenerate.</span>
    bad_value: f32 = <span class="tok-num">0.5</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">const</span> sw: f32 = <span class="tok-fn">float</span>(f.window.screen_width);
    <span class="tok-kw">const</span> sh: f32 = <span class="tok-fn">float</span>(f.window.screen_height);
    <span class="tok-kw">const</span> margin: f32 = <span class="tok-num">8</span>;

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Devtools"</span>, .{
        .initial_pos = .{ margin, margin },
        .initial_size = .{ sw - <span class="tok-num">2</span> * margin, sh - <span class="tok-num">2</span> * margin },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Dear ImGui's Metrics + Log windows, zimr edition."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Frame {d} -- look at console for [zimr lint] hits."</span>, .{
            s.ui_host.ctx.metrics.frame_count,
        });
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// ---- Section 1: Metrics panel ------------------------------</span>
        <span class="tok-comment">// The whole point of P1 shipping early: this is one line.</span>
        <span class="tok-comment">// `inspect` walks the Metrics struct fields, opens its own</span>
        <span class="tok-comment">// tree node, and dispatches each field (u32 -&gt; read-only int,</span>
        <span class="tok-comment">// f32 -&gt; read-only float, history array -&gt; readonly preview).</span>
        _ = u.<span class="tok-fn">inspect</span>(<span class="tok-str">"Metrics (live)"</span>, &amp;s.ui_host.ctx.metrics);

        <span class="tok-comment">// ---- Section 2: DebugLog viewer ----------------------------</span>
        <span class="tok-comment">// BoundedArray's storage exposes a 256-slot buffer but only</span>
        <span class="tok-comment">// `len` slots are valid; debugLogSlice borrows just the</span>
        <span class="tok-comment">// populated prefix.  Render newest-first by reversing the</span>
        <span class="tok-comment">// walk index.</span>
        <span class="tok-kw">if</span> (u.<span class="tok-fn">treeNode</span>(<span class="tok-str">"DebugLog (newest first)"</span>, .{ .default_open = true })) {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">treePop</span>();
            <span class="tok-kw">const</span> events: []<span class="tok-kw">const</span> ui.DebugEvent = ui.<span class="tok-fn">debugLogSlice</span>(&amp;s.ui_host.ctx);
            <span class="tok-kw">if</span> (events.len == <span class="tok-num">0</span>) {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"(no events yet -- try the triggers below)"</span>, .{});
            } <span class="tok-kw">else</span> {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{d} event(s) in ring (cap {d})"</span>, .{
                    events.len,
                    ui.debug_log_cap,
                });
                <span class="tok-comment">// Walk newest -&gt; oldest.  10 rows max so phone</span>
                <span class="tok-comment">// viewport stays usable.</span>
                <span class="tok-kw">const</span> show_n: usize = <span class="tok-builtin">@min</span>(events.len, <span class="tok-num">10</span>);
                <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
                <span class="tok-kw">while</span> (i &lt; show_n) : (i += <span class="tok-num">1</span>) {
                    <span class="tok-kw">const</span> idx: usize = events.len - <span class="tok-num">1</span> - i;
                    <span class="tok-kw">const</span> ev: ui.DebugEvent = events[idx];
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"[{d:&gt;6}] {s}: {s}"</span>, .{
                        ev.frame,
                        <span class="tok-builtin">@tagName</span>(ev.kind),
                        ev.<span class="tok-fn">messageSlice</span>(),
                    });
                }
                <span class="tok-kw">if</span> (events.len &gt; <span class="tok-num">10</span>) {
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"... ({d} older)"</span>, .{events.len - <span class="tok-num">10</span>});
                }
            }
        }

        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// ---- Section 3: Event triggers -----------------------------</span>
        <span class="tok-kw">if</span> (u.<span class="tok-fn">treeNode</span>(<span class="tok-str">"Triggers (generate events)"</span>, .{ .default_open = true })) {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">treePop</span>();

            <span class="tok-comment">// Button -&gt; openPopup.  Two adjacent clicks within the</span>
            <span class="tok-comment">// same frame would also exercise lint #4 (double-open),</span>
            <span class="tok-comment">// but that's hard to do from a UI: it'd take submitting</span>
            <span class="tok-comment">// two `openPopup` calls in the same widget tree pass.</span>
            <span class="tok-comment">// The lint catches the programmer-error case where a</span>
            <span class="tok-comment">// helper function calls openPopup unconditionally on</span>
            <span class="tok-comment">// every frame.</span>
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Open popup"</span>, .{})) {
                u.<span class="tok-fn">openPopup</span>(<span class="tok-str">"dev_tools_demo_popup"</span>);
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginPopup</span>(<span class="tok-str">"dev_tools_demo_popup"</span>)) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endPopup</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"Popup body."</span>, .{});
                <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Close"</span>, .{})) {
                    u.<span class="tok-fn">closeCurrentPopup</span>();
                }
            }

            <span class="tok-comment">// Drag-drop trigger.  Source widget + target slot below.</span>
            <span class="tok-comment">// Moving past the drag threshold logs drag_started;</span>
            <span class="tok-comment">// dropping onto the slot logs drop_accepted.</span>
            u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag the {d} below onto the slot:"</span>, .{s.drag_value});
            <span class="tok-kw">var</span> label_buf: [<span class="tok-num">32</span>]u8 = undefined;
            <span class="tok-kw">const</span> drag_label: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
                &amp;label_buf,
                <span class="tok-str">"drag {d}"</span>,
                .{s.drag_value},
            ) <span class="tok-kw">catch</span> <span class="tok-str">"drag"</span>;
            _ = u.<span class="tok-fn">button</span>(drag_label, .{});
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginDragDropSource</span>(.{})) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endDragDropSource</span>();
                u.<span class="tok-fn">setDragDropPayload</span>(i32, &amp;s.drag_value);
                u.<span class="tok-fn">text</span>(<span class="tok-str">"dragging {d}..."</span>, .{s.drag_value});
            }

            u.<span class="tok-fn">text</span>(<span class="tok-str">"Slot (current: {d}):"</span>, .{s.slot_value});
            _ = u.<span class="tok-fn">button</span>(<span class="tok-str">"[ drop here ]"</span>, .{ .size = .{ <span class="tok-num">200</span>, <span class="tok-num">0</span> } });
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginDragDropTarget</span>(.{})) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endDragDropTarget</span>();
                <span class="tok-kw">if</span> (u.<span class="tok-fn">acceptDragDropPayload</span>(i32, .{})) |dropped| {
                    s.slot_value = dropped;
                }
            }

            <span class="tok-comment">// Slider with degenerate bounds -&gt; lint #1.</span>
            <span class="tok-comment">// Fires once at process startup; subsequent submissions</span>
            <span class="tok-comment">// skip the warn.</span>
            u.<span class="tok-fn">separator</span>();
            u.<span class="tok-fn">text</span>(<span class="tok-str">"Bad-bounds slider (triggers lint #1):"</span>, .{});
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"min == max"</span>, &amp;s.bad_value, .{ .min = <span class="tok-num">0.5</span>, .max = <span class="tok-num">0.5</span> });
        }
    }
}
