<h1>viewport_scaling</h1>
<figure class="code src-file" data-path="examples/viewport_scaling/viewport_scaling.zig" data-lines="183"><figcaption><span>examples/viewport_scaling/viewport_scaling.zig</span><span>183 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/viewport_scaling.zig - render at a FIXED virtual resolution, then</span>
<span class="tok-comment">// letterbox it into whatever window/screen you actually get.</span>
<span class="tok-comment">// Ports raylib's core `window_scale_letterbox` / viewport-scaling idea: the game</span>
<span class="tok-comment">// renders into a 640x360 render texture (its "design resolution"), and each frame</span>
<span class="tok-comment">// that texture is scaled by the LARGEST factor that still fits the real window,</span>
<span class="tok-comment">// centred, with black bars filling the remainder. Aspect ratio is always</span>
<span class="tok-comment">// preserved, so the layout never stretches. Mouse coordinates are mapped BACK</span>
<span class="tok-comment">// through the same transform, so hit-testing works in virtual coordinates on any</span>
<span class="tok-comment">// screen size.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// This is the manual, in-app version of the engine's `.scale_mode = .fit` (which</span>
<span class="tok-comment">// does the same letterboxing at the window level). Doing it by hand is what</span>
<span class="tok-comment">// raylib's sample teaches - and it's what you need when only PART of the app is</span>
<span class="tok-comment">// a fixed-resolution viewport.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What this exercises:</span>
<span class="tok-comment">//   - `z.loadRenderTextureEx(..., nearest_filter)` + beginTextureMode/endTextureMode.</span>
<span class="tok-comment">//   - Aspect-preserving fit math + the inverse mapping for input.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Leak-clean (`.memory = .managed`): the RT is freed in `deinit`; the font atlas</span>
<span class="tok-comment">// is engine-owned.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-comment">// The FIXED design resolution everything is authored against.</span>
<span class="tok-kw">const</span> virt_w: i32 = <span class="tok-num">640</span>;
<span class="tok-kw">const</span> virt_h: i32 = <span class="tok-num">360</span>;
<span class="tok-kw">const</span> virt_wf: f32 = <span class="tok-num">640.0</span>;
<span class="tok-kw">const</span> virt_hf: f32 = <span class="tok-num">360.0</span>;

<span class="tok-comment">/// How the virtual viewport maps onto the real window: uniform scale + centring</span>
<span class="tok-comment">/// offset. One value drives BOTH the draw (virtual -&gt; screen) and the input</span>
<span class="tok-comment">/// mapping (screen -&gt; virtual), so they can never disagree.</span>
<span class="tok-kw">const</span> Fit = <span class="tok-kw">struct</span> {
    scale: f32,
    off_x: f32,
    off_y: f32,

    <span class="tok-kw">fn</span> <span class="tok-fn">compute</span>(win_w: f32, win_h: f32) Fit {
        <span class="tok-comment">// Largest scale that fits BOTH axes = preserve aspect, never crop.</span>
        <span class="tok-kw">const</span> s: f32 = <span class="tok-builtin">@min</span>(win_w / virt_wf, win_h / virt_hf);
        <span class="tok-kw">return</span> .{
            .scale = s,
            .off_x = (win_w - virt_wf * s) * <span class="tok-num">0.5</span>,
            .off_y = (win_h - virt_hf * s) * <span class="tok-num">0.5</span>,
        };
    }

    <span class="tok-comment">/// Screen (window) point -&gt; virtual point. The exact inverse of the draw</span>
    <span class="tok-comment">/// transform, so a click lands where the user sees it.</span>
    <span class="tok-kw">fn</span> <span class="tok-fn">toVirtual</span>(self: Fit, p: Vec2) Vec2 {
        <span class="tok-kw">return</span> .{
            (p[<span class="tok-num">0</span>] - self.off_x) / self.scale,
            (p[<span class="tok-num">1</span>] - self.off_y) / self.scale,
        };
    }
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    rt: z.RenderTexture,
    font: z.Font,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-comment">// nearest: the virtual viewport is scaled by an arbitrary (often fractional)</span>
    <span class="tok-comment">// factor, and point sampling keeps the edges honest rather than mushy.</span>
    <span class="tok-kw">const</span> rt: z.RenderTexture = z.<span class="tok-fn">loadRenderTextureEx</span>(f.gl, virt_w, virt_h, true);
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>);
    s.* = .{ .rt = rt, .font = font };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.rt.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// The "game", authored entirely in 640x360 virtual coordinates. It never knows</span>
<span class="tok-comment">/// what the real window size is.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawGame</span>(gl: *z.WgpuGl, font: *z.Font, mouse_virt: Vec2, t: f32) void {
    <span class="tok-comment">// Border + corner markers prove the virtual viewport is fully visible and</span>
    <span class="tok-comment">// never cropped, whatever the window aspect.</span>
    gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = virt_wf, .height = virt_hf }, .{ .color = c.darkgray, .outline = <span class="tok-num">4</span> });
    <span class="tok-kw">const</span> corner: f32 = <span class="tok-num">26</span>;
    gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = corner, .height = corner }, .{ .color = c.red });
    gl.<span class="tok-fn">rect</span>(.{ .x = virt_wf - corner, .y = <span class="tok-num">0</span>, .width = corner, .height = corner }, .{ .color = c.lime });
    gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">0</span>, .y = virt_hf - corner, .width = corner, .height = corner }, .{ .color = c.blue });
    gl.<span class="tok-fn">rect</span>(.{ .x = virt_wf - corner, .y = virt_hf - corner, .width = corner, .height = corner }, .{ .color = c.gold });

    <span class="tok-comment">// A grid so scaling is obvious.</span>
    <span class="tok-kw">var</span> gx: f32 = <span class="tok-num">40</span>;
    <span class="tok-kw">while</span> (gx &lt; virt_wf) : (gx += <span class="tok-num">40</span>) {
        gl.<span class="tok-fn">line</span>(.{ gx, <span class="tok-num">0</span> }, .{ gx, virt_hf }, .{ .color = .{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">220</span>, .b = <span class="tok-num">228</span>, .a = <span class="tok-num">255</span> } });
    }
    <span class="tok-kw">var</span> gy: f32 = <span class="tok-num">40</span>;
    <span class="tok-kw">while</span> (gy &lt; virt_hf) : (gy += <span class="tok-num">40</span>) {
        gl.<span class="tok-fn">line</span>(.{ <span class="tok-num">0</span>, gy }, .{ virt_wf, gy }, .{ .color = .{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">220</span>, .b = <span class="tok-num">228</span>, .a = <span class="tok-num">255</span> } });
    }

    <span class="tok-comment">// A bouncing ball in virtual space.</span>
    <span class="tok-kw">const</span> bx: f32 = virt_wf * <span class="tok-num">0.5</span> + <span class="tok-builtin">@sin</span>(t * <span class="tok-num">0.9</span>) * (virt_wf * <span class="tok-num">0.35</span>);
    <span class="tok-kw">const</span> by: f32 = virt_hf * <span class="tok-num">0.5</span> + <span class="tok-builtin">@cos</span>(t * <span class="tok-num">1.3</span>) * (virt_hf * <span class="tok-num">0.28</span>);
    gl.<span class="tok-fn">circle</span>(.{ bx, by }, <span class="tok-num">22</span>, .{ .color = c.maroon });

    gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">40</span>, <span class="tok-num">40</span> },
        <span class="tok-str">"640x360 virtual viewport"</span>,
        .{ .size = <span class="tok-num">22</span>, .color = c.darkgray, .font = font },
    );

    <span class="tok-comment">// Crosshair at the mapped mouse position - the proof that screen-&gt;virtual</span>
    <span class="tok-comment">// input mapping is correct. It should sit exactly under the real cursor.</span>
    <span class="tok-kw">const</span> mx: f32 = mouse_virt[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> my: f32 = mouse_virt[<span class="tok-num">1</span>];
    gl.<span class="tok-fn">line</span>(.{ mx - <span class="tok-num">14</span>, my }, .{ mx + <span class="tok-num">14</span>, my }, .{ .color = c.darkblue, .thickness = <span class="tok-num">2</span> });
    gl.<span class="tok-fn">line</span>(.{ mx, my - <span class="tok-num">14</span> }, .{ mx, my + <span class="tok-num">14</span> }, .{ .color = c.darkblue, .thickness = <span class="tok-num">2</span> });
    gl.<span class="tok-fn">circle</span>(.{ mx, my }, <span class="tok-num">6</span>, .{ .color = c.darkblue, .outline = <span class="tok-num">2</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> win_w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> win_h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> fit: Fit = .<span class="tok-fn">compute</span>(win_w, win_h);

    <span class="tok-comment">// Map the real cursor into virtual coordinates BEFORE drawing the game, so</span>
    <span class="tok-comment">// the game only ever deals in its own 640x360 space.</span>
    <span class="tok-kw">const</span> mouse_virt: Vec2 = fit.<span class="tok-fn">toVirtual</span>(z.<span class="tok-fn">getMousePosition</span>(f.input));

    <span class="tok-comment">// --- the game renders into its fixed-resolution target ---</span>
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt, .{ .r = <span class="tok-num">245</span>, .g = <span class="tok-num">245</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-fn">drawGame</span>(f.gl, &amp;s.font, mouse_virt, f.time.time);
    z.<span class="tok-fn">endTextureMode</span>(f.gl);

    <span class="tok-comment">// --- letterbox: scale up as far as fits, centre, black bars around it ---</span>
    z.<span class="tok-fn">clearViewport</span>(f, c.black);
    <span class="tok-kw">const</span> dest: z.Rectangle = .{
        .x = fit.off_x,
        .y = fit.off_y,
        .width = virt_wf * fit.scale,
        .height = virt_hf * fit.scale,
    };
    f.gl.<span class="tok-fn">texture</span>(dest, s.rt.<span class="tok-fn">asTexture</span>(), .{});

    <span class="tok-comment">// HUD drawn in REAL screen space (outside the viewport), showing the fit.</span>
    <span class="tok-kw">var</span> buf: [<span class="tok-num">96</span>]u8 = undefined;
    <span class="tok-kw">const</span> hud: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf,
        <span class="tok-str">"window {d:.0}x{d:.0}  scale {d:.2}x  bars {d:.0},{d:.0}"</span>,
        .{ win_w, win_h, fit.scale, fit.off_x, fit.off_y },
    ) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">10</span>, <span class="tok-num">10</span> }, hud, .{ .size = <span class="tok-num">16</span>, .color = c.raywhite, .font = &amp;s.font });

    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - core - viewport scaling (letterbox)"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            <span class="tok-comment">// RESPONSIVE on purpose: the window is the REAL device size, so the</span>
            <span class="tok-comment">// letterbox math has something to solve. (`.fit` would do this same</span>
            <span class="tok-comment">// job at the engine level - this example does it by hand.)</span>
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    .memory = .managed,
};
