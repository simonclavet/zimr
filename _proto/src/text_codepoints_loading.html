<h1>text_codepoints_loading</h1>
<figure class="code src-file" data-path="examples/text_codepoints_loading/text_codepoints_loading.zig" data-lines="155"><figcaption><span>examples/text_codepoints_loading/text_codepoints_loading.zig</span><span>155 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/text_codepoints_loading.zig - baking a chosen set of Unicode</span>
<span class="tok-comment">// codepoints into a font atlas.</span>
<span class="tok-comment">// Ports raylib's `text_codepoints_loading`: `loadFont` bakes only ASCII 32..126,</span>
<span class="tok-comment">// so anything outside it (accented Latin, Greek, Cyrillic, ...) has no glyph.</span>
<span class="tok-comment">// `loadFontEx` takes an EXPLICIT codepoint list, so you bake exactly the scripts</span>
<span class="tok-comment">// your app renders - and no more, since every codepoint costs atlas space.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The example loads the SAME TTF twice - once ASCII-only, once extended - and</span>
<span class="tok-comment">// draws the same multilingual lines with both, so the difference is visible</span>
<span class="tok-comment">// rather than asserted.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What this exercises (the engine work this drove):</span>
<span class="tok-comment">//   - `z.loadFontEx(f, gpa, ttf, size, codepoints)` - newly exported; the atlas</span>
<span class="tok-comment">//     baker always accepted a codepoint slice, but only ASCII was reachable.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The ranges below are the ones the bundled RobotoMono actually covers (its cmap</span>
<span class="tok-comment">// has Latin-1, Latin Extended-A, most Greek and nearly all Cyrillic - but NO</span>
<span class="tok-comment">// arrows, box-drawing or CJK, which would bake as empty .notdef boxes).</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Leak-clean (`.memory = .managed`): both atlases are engine-owned.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> roboto_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"roboto_mono_ttf"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> screen_w: i32 = <span class="tok-num">800</span>;
<span class="tok-kw">const</span> screen_h: i32 = <span class="tok-num">450</span>;

<span class="tok-kw">const</span> n_ascii: usize = <span class="tok-num">95</span>; <span class="tok-comment">// 32..126</span>
<span class="tok-kw">const</span> n_latin1: usize = <span class="tok-num">64</span>; <span class="tok-comment">// C0..FF   accented Latin</span>
<span class="tok-kw">const</span> n_greek_u: usize = <span class="tok-num">25</span>; <span class="tok-comment">// 391..3A9 Alpha..Omega</span>
<span class="tok-kw">const</span> n_greek_l: usize = <span class="tok-num">25</span>; <span class="tok-comment">// 3B1..3C9 alpha..omega</span>
<span class="tok-kw">const</span> n_cyril: usize = <span class="tok-num">64</span>; <span class="tok-comment">// 410..44F  Cyrillic</span>

<span class="tok-comment">/// The exact codepoint set to bake, built at comptime - so the atlas contents</span>
<span class="tok-comment">/// are a compile-time fact and the count is exact (no "bake all of Unicode").</span>
<span class="tok-kw">const</span> cp_set: [n_ascii + n_latin1 + n_greek_u + n_greek_l + n_cyril]u21 = blk: {
    <span class="tok-kw">var</span> out: [n_ascii + n_latin1 + n_greek_u + n_greek_l + n_cyril]u21 = undefined;
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">32</span>..<span class="tok-num">127</span>) |v| {
        out[n] = <span class="tok-builtin">@intCast</span>(v);
        n += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0xC0</span>..<span class="tok-num">0x100</span>) |v| {
        out[n] = <span class="tok-builtin">@intCast</span>(v);
        n += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0x391</span>..<span class="tok-num">0x3AA</span>) |v| {
        out[n] = <span class="tok-builtin">@intCast</span>(v);
        n += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0x3B1</span>..<span class="tok-num">0x3CA</span>) |v| {
        out[n] = <span class="tok-builtin">@intCast</span>(v);
        n += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0x410</span>..<span class="tok-num">0x450</span>) |v| {
        out[n] = <span class="tok-builtin">@intCast</span>(v);
        n += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">break</span> :blk out;
};

<span class="tok-comment">// Every character below lives inside the baked ranges above.</span>
<span class="tok-kw">const</span> line_latin = <span class="tok-str">"Grüße! Ñoño, Åland, Çà et là"</span>;
<span class="tok-kw">const</span> line_greek = <span class="tok-str">"ΑΒΓΔΕΖΗΘΙΚΛΜ αβγδεζηθικλμ"</span>;
<span class="tok-kw">const</span> line_cyril = <span class="tok-str">"Привет, мир! Здравствуй"</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ascii_font: z.Font, <span class="tok-comment">// loadFont   - ASCII 32..126 only</span>
    uni_font: z.Font, <span class="tok-comment">// loadFontEx - the set above</span>
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{
        .ascii_font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, roboto_mono_ttf, <span class="tok-num">22</span>),
        .uni_font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFontEx</span>(f, gpa, roboto_mono_ttf, <span class="tok-num">22</span>, &amp;cp_set),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.ascii_font);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.uni_font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, c.raywhite);

    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">20</span>, <span class="tok-num">14</span> },
        <span class="tok-str">"loadFontEx bakes a chosen codepoint set - loadFont bakes ASCII only"</span>,
        .{ .size = <span class="tok-num">18</span>, .color = c.darkgray, .font = &amp;s.uni_font },
    );
