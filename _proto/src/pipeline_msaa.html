<h1>pipeline_msaa</h1>
<figure class="code src-file" data-path="examples/pipeline_msaa/pipeline_msaa.zig" data-lines="203"><figcaption><span>examples/pipeline_msaa/pipeline_msaa.zig</span><span>203 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! pipeline_msaa - MSAA (multisample anti-aliasing). The same rotating</span>
<span class="tok-comment">//! high-contrast triangle is rendered twice into small targets, magnified side</span>
<span class="tok-comment">//! by side so the edge quality is obvious:</span>
<span class="tok-comment">//!   - LEFT  : 1 sample  -&gt; jagged, stair-stepped diagonal edges</span>
<span class="tok-comment">//!   - RIGHT : 4 samples -&gt; resolved to a 1-sample texture -&gt; smooth edges</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! No hand-written WGSL: the shader is authored in Zig (position-only triangle,</span>
<span class="tok-comment">//! a vertex-stage transform UBO, a constant-colour FS with no varyings). The</span>
<span class="tok-comment">//! two pipelines come from two `loadShaderVF` calls differing only by</span>
<span class="tok-comment">//! `.sample_count` (1 vs 4). Because these render into rgba8 offscreen targets</span>
<span class="tok-comment">//! with no depth, the calls also pin `.color_format` and `.depth_state = .none`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The MSAA pass is self-managed on its OWN command encoder (a multisampled</span>
<span class="tok-comment">//! attachment + resolve target can't go through beginTextureMode). The aliased</span>
<span class="tok-comment">//! side uses the normal offscreen path. Both display via drawTextureRec.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Build:  zig build wgpu-pipeline-msaa</span>
<span class="tok-comment">//! Device: zig build wgpu-pipeline-msaa-standalone -Dmode=release</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> rotationZ = zm.rotationZ;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> rt_size: i32 = <span class="tok-num">220</span>; <span class="tok-comment">// small targets so magnified jaggies are visible</span>
<span class="tok-kw">const</span> samples: u4 = <span class="tok-num">4</span>;
<span class="tok-kw">const</span> rt_format: z.wgpu.TextureFormat = .rgba8_unorm;

<span class="tok-kw">const</span> vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pipeline_msaa_vs.wgsl"</span>);
<span class="tok-kw">const</span> fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pipeline_msaa_fs.wgsl"</span>);
<span class="tok-kw">const</span> vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_msaa_vs_io.zig"</span>);
<span class="tok-kw">const</span> fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_msaa_fs_io.zig"</span>);

<span class="tok-kw">const</span> Vertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> { x: f32, y: f32 };

<span class="tok-kw">const</span> vertices = [_]Vertex{
    .{ .x = <span class="tok-num">0.0</span>, .y = <span class="tok-num">0.62</span> },
    .{ .x = -<span class="tok-num">0.55</span>, .y = -<span class="tok-num">0.45</span> },
    .{ .x = <span class="tok-num">0.55</span>, .y = -<span class="tok-num">0.45</span> },
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    aliased_rt: z.RenderTexture,
    resolve_rt: z.RenderTexture,
    msaa_view: z.wgpu.TextureViewHandle,
    msaa_tex: z.wgpu.TextureHandle,
    aliased_shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io),
    msaa_shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io),
    vbo: z.wgpu.BufferHandle,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.aliased_shader.<span class="tok-fn">deinit</span>();
    s.msaa_shader.<span class="tok-fn">deinit</span>();
    s.aliased_rt.<span class="tok-fn">deinit</span>();
    s.resolve_rt.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyTextureView</span>(s.msaa_view);
    z.wgpu.<span class="tok-fn">destroyTexture</span>(s.msaa_tex);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
}

<span class="tok-comment">/// Build a pipeline for one sample count. Targets are rgba8 with no depth.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">msaaShader</span>(
    gpa: Allocator,
    f: *z.Frame,
    sample_count: u4,
    label: []<span class="tok-kw">const</span> u8,
) !z.shader.<span class="tok-fn">LoadedShader</span>(vs_io) {
    <span class="tok-kw">return</span> z.shader.<span class="tok-fn">loadShaderVF</span>(vs_io, fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = vs_wgsl,
        .fs_wgsl_source = fs_wgsl,
        .vertex_buffer_layouts = &amp;.{z.shader.<span class="tok-fn">vertexLayout</span>(vs_io)},
        .color_format = rt_format,
        .depth_state = .none,
        .sample_count = sample_count,
        .label = label,
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(vertices)),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"msaa_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;vertices));

    <span class="tok-comment">// 1-sample sampleable targets: one rendered directly (aliased), one used as</span>
    <span class="tok-comment">// the MSAA resolve target. Plus a 4-sample colour texture for the MSAA pass.</span>
    <span class="tok-kw">const</span> aliased_rt: z.RenderTexture = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, rt_size, rt_size);
    <span class="tok-kw">const</span> resolve_rt: z.RenderTexture = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, rt_size, rt_size);
    <span class="tok-kw">const</span> msaa_tex: z.wgpu.TextureHandle = z.wgpu.<span class="tok-fn">createTexture</span>(f.gpu.device, .{
        .width = <span class="tok-builtin">@intCast</span>(rt_size),
        .height = <span class="tok-builtin">@intCast</span>(rt_size),
        .format = rt_format,
        .usage = .{ .render_attachment = true },
        .sample_count = samples,
        .label = <span class="tok-str">"msaa_color"</span>,
    });
    <span class="tok-kw">const</span> msaa_view: z.wgpu.TextureViewHandle = z.wgpu.<span class="tok-fn">createTextureView</span>(msaa_tex);

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .aliased_rt = aliased_rt,
        .resolve_rt = resolve_rt,
        .msaa_view = msaa_view,
        .msaa_tex = msaa_tex,
        .aliased_shader = <span class="tok-kw">try</span> <span class="tok-fn">msaaShader</span>(gpa, f, <span class="tok-num">1</span>, <span class="tok-str">"msaa_aliased"</span>),
        .msaa_shader = <span class="tok-kw">try</span> <span class="tok-fn">msaaShader</span>(gpa, f, samples, <span class="tok-str">"msaa_4x"</span>),
        .vbo = vbo,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> m: zm.Mat = <span class="tok-fn">rotationZ</span>(f.time.time * <span class="tok-num">0.5</span>);
    <span class="tok-kw">const</span> vsize: u64 = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(vertices));
    <span class="tok-kw">const</span> clear: zm.Color = .{ .r = <span class="tok-num">12</span>, .g = <span class="tok-num">14</span>, .b = <span class="tok-num">20</span>, .a = <span class="tok-num">255</span> };

    <span class="tok-comment">// LEFT: aliased (1 sample) via the normal offscreen path.</span>
    s.aliased_shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .transform = m });
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.aliased_rt, clear);
    <span class="tok-kw">const</span> ap: *z.PassState = f.gl.pass;
    s.aliased_shader.<span class="tok-fn">bindForDraw</span>(ap);
    s.aliased_shader.<span class="tok-fn">setVertex</span>(ap, <span class="tok-num">0</span>, s.vbo, vsize);
    s.aliased_shader.<span class="tok-fn">draw</span>(ap, vertices.len, <span class="tok-num">1</span>);
    z.<span class="tok-fn">endTextureMode</span>(f.gl);

    <span class="tok-comment">// RIGHT: MSAA (4 samples) on its own encoder, resolving into resolve_rt.</span>
    s.msaa_shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .transform = m });
    <span class="tok-kw">const</span> enc: z.wgpu.CommandEncoderHandle = z.wgpu.<span class="tok-fn">createCommandEncoder</span>(f.gpu.device);
    <span class="tok-kw">const</span> raw: z.wgpu.RenderPassEncoderHandle = z.wgpu.render_pass.<span class="tok-fn">begin</span>(.{
        .encoder = enc,
        .color_view = s.msaa_view,
        .clear = .{ .r = <span class="tok-num">12.0</span> / <span class="tok-num">255.0</span>, .g = <span class="tok-num">14.0</span> / <span class="tok-num">255.0</span>, .b = <span class="tok-num">20.0</span> / <span class="tok-num">255.0</span>, .a = <span class="tok-num">1.0</span> },
        .resolve_view = s.resolve_rt.color_view,
    });
    <span class="tok-kw">var</span> mp: z.PassState = .{ .pass = raw };
    s.msaa_shader.<span class="tok-fn">bindForDraw</span>(&amp;mp);
    s.msaa_shader.<span class="tok-fn">setVertex</span>(&amp;mp, <span class="tok-num">0</span>, s.vbo, vsize);
    s.msaa_shader.<span class="tok-fn">draw</span>(&amp;mp, vertices.len, <span class="tok-num">1</span>);
    z.wgpu.render_pass.<span class="tok-fn">end</span>(raw);
    <span class="tok-kw">const</span> cmd: z.wgpu.CommandBufferHandle = z.wgpu.<span class="tok-fn">finishCommandEncoder</span>(enc);
    z.wgpu.<span class="tok-fn">queueSubmit</span>(f.gpu.queue, cmd);

    <span class="tok-comment">// ---- SCREEN PASS: open once, composite the two RTs side by side. ----</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);

    <span class="tok-comment">// Composite both, magnified side by side, on the backbuffer.</span>
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> cell: f32 = <span class="tok-builtin">@min</span>(w * <span class="tok-num">0.44</span>, h * <span class="tok-num">0.6</span>);
    <span class="tok-kw">const</span> gap: f32 = w * <span class="tok-num">0.04</span>;
    <span class="tok-kw">const</span> total: f32 = cell * <span class="tok-num">2</span> + gap;
    <span class="tok-kw">const</span> x0: f32 = (w - total) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> y0: f32 = (h - cell) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> white: zm.Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };
    f.gl.<span class="tok-fn">texture</span>(.{ .x = x0, .y = y0, .width = cell, .height = cell }, s.aliased_rt.<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    f.gl.<span class="tok-fn">texture</span>(
        .{ .x = x0 + cell + gap, .y = y0, .width = cell, .height = cell },
        s.resolve_rt.<span class="tok-fn">asTexture</span>(),
        .{ .tint = white },
    );

    f.gl.<span class="tok-fn">text</span>(.{ x0, y0 + cell + <span class="tok-num">10</span> }, <span class="tok-str">"1x (aliased)"</span>, .{
        .size = <span class="tok-num">22</span>,
        .color = common.palette.ink_dim,
        .font = &amp;s.font,
    });
    f.gl.<span class="tok-fn">text</span>(
        .{ x0 + cell + gap, y0 + cell + <span class="tok-num">10</span> },
        <span class="tok-str">"4x MSAA"</span>,
        .{ .size = <span class="tok-num">22</span>, .color = common.palette.ink_dim, .font = &amp;s.font },
    );
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"pipeline_msaa: 1x vs 4x multisampling - compare the diagonal edges"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - pipeline MSAA"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.02</span>, .g = <span class="tok-num">0.02</span>, .b = <span class="tok-num">0.03</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Aliased + MSAA-resolve targets render offscreen before the screen opens</span>
    <span class="tok-comment">// (tile-based-GPU safe); owns its own begin/endDrawing.</span>
    .manages_own_frame = true,
};
</code></pre></figure>

<span class="tok-comment">//! Emits one flat high-contrast colour so the MSAA edge quality is obvious.</span>

<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_msaa_fs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_msaa_fs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(void);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {

    out.final_color = .{ <span class="tok-num">0.45</span>, <span class="tok-num">0.85</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span> };
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {

}

<figure class="code src-file" data-path="examples/pipeline_msaa_vs.zig" data-lines="23"><figcaption><span>examples/pipeline_msaa_vs.zig</span><span>23 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/pipeline_msaa_vs.zig - pipeline_msaa vertex shader body.</span>
<span class="tok-comment">//! Transforms the 2D triangle by the UBO matrix; no varyings out.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> mulMatPoint = zm.mulMatPoint;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_msaa_vs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_msaa_vs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_io.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;
    <span class="tok-kw">const</span> p: Vec3 = .{ io_in.vertex_position[<span class="tok-num">0</span>], io_in.vertex_position[<span class="tok-num">1</span>], <span class="tok-num">0.0</span> };
    out.position = <span class="tok-fn">mulMatPoint</span>(io_in.u.transform, p);
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_io;
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}

<span class="tok-comment">//! vertex shader. A position-only triangle transformed by a vertex-stage UBO;</span>
<span class="tok-comment">//! there are NO varyings (the fragment stage emits a constant colour), so</span>
<span class="tok-comment">//! `Outputs` is empty and matches the empty FS `Inputs`.</span>

<span class="tok-kw">const</span> shader = <span class="tok-builtin">@import</span>(<span class="tok-str">"shader_interface"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Attributes = <span class="tok-kw">struct</span> {
    vertex_position: shader.<span class="tok-fn">Attr</span>(.vec2, <span class="tok-num">0</span>),
};

<span class="tok-comment">/// Vertex-stage uniform (group 0): a 4x4 rotation the host spins each frame.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Ubo = <span class="tok-kw">struct</span> {
    transform: [<span class="tok-num">4</span>]<span class="tok-builtin">@Vector</span>(<span class="tok-num">4</span>, f32),
};

<span class="tok-comment">/// No varyings - the fragment shader takes no interpolated inputs.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Outputs = <span class="tok-kw">struct</span> {};
