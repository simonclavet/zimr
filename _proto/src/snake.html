<h1>snake</h1>
<figure class="code src-file" data-path="examples/snake/snake.zig" data-lines="447"><figcaption><span>examples/snake/snake.zig</span><span>447 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! snake - the classic. Steer the snake around a grid, eat the dots to grow, and</span>
<span class="tok-comment">//! don't run into a wall or your own tail. Every dot eaten adds a segment and a</span>
<span class="tok-comment">//! little speed, so the game tightens as your score climbs.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Built to play equally well two ways: arrow keys or WASD on a keyboard, and</span>
<span class="tok-comment">//! SWIPES on a phone (swipe the way you want to turn). A pause and a restart</span>
<span class="tok-comment">//! button sit on screen so no keyboard is ever needed. The board is recomputed</span>
<span class="tok-comment">//! from the window every frame, so it fills a tall phone and a wide monitor alike.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Controls:</span>
<span class="tok-comment">//!   arrows / WASD    turn</span>
<span class="tok-comment">//!   swipe            turn (phone)</span>
<span class="tok-comment">//!   space            pause / resume  (also restarts after a game over)</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> allocPrint = std.fmt.allocPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> grid_w = <span class="tok-num">20</span>;
<span class="tok-kw">const</span> grid_h = <span class="tok-num">20</span>;
<span class="tok-kw">const</span> max_len = grid_w * grid_h;
<span class="tok-kw">const</span> base_tps = <span class="tok-num">6.0</span>; <span class="tok-comment">// ticks per second at the start</span>
<span class="tok-kw">const</span> tps_per_food = <span class="tok-num">0.35</span>; <span class="tok-comment">// speed added per dot eaten</span>

<span class="tok-kw">const</span> bg_col: Color = .{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">19</span>, .b = <span class="tok-num">27</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> board_col: Color = .{ .r = <span class="tok-num">24</span>, .g = <span class="tok-num">29</span>, .b = <span class="tok-num">40</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> grid_col: Color = .{ .r = <span class="tok-num">34</span>, .g = <span class="tok-num">40</span>, .b = <span class="tok-num">54</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> snake_col: Color = .{ .r = <span class="tok-num">96</span>, .g = <span class="tok-num">206</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> head_col: Color = .{ .r = <span class="tok-num">150</span>, .g = <span class="tok-num">240</span>, .b = <span class="tok-num">168</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> food_col: Color = .{ .r = <span class="tok-num">236</span>, .g = <span class="tok-num">92</span>, .b = <span class="tok-num">84</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> over_col: Color = .{ .r = <span class="tok-num">250</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> btn_col: Color = .{ .r = <span class="tok-num">34</span>, .g = <span class="tok-num">40</span>, .b = <span class="tok-num">54</span>, .a = <span class="tok-num">235</span> };
<span class="tok-kw">const</span> btn_hot_col: Color = .{ .r = <span class="tok-num">54</span>, .g = <span class="tok-num">64</span>, .b = <span class="tok-num">86</span>, .a = <span class="tok-num">245</span> };
<span class="tok-kw">const</span> btn_txt_col: Color = .{ .r = <span class="tok-num">210</span>, .g = <span class="tok-num">216</span>, .b = <span class="tok-num">228</span>, .a = <span class="tok-num">255</span> };

<span class="tok-comment">/// A heading. Turning can't reverse straight back on itself, which `opposite`</span>
<span class="tok-comment">/// makes easy to check.</span>
<span class="tok-kw">const</span> Dir = <span class="tok-kw">enum</span> {
    up,
    down,
    left,
    right,

    <span class="tok-kw">fn</span> <span class="tok-fn">delta</span>(self: Dir) [<span class="tok-num">2</span>]i32 {
        <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (self) {
            .up =&gt; .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span> },
            .down =&gt; .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> },
            .left =&gt; .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span> },
            .right =&gt; .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> },
        };
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">opposite</span>(self: Dir, other: Dir) bool {
        <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (self) {
            .up =&gt; other == .down,
            .down =&gt; other == .up,
            .left =&gt; other == .right,
            .right =&gt; other == .left,
        };
    }
};

<span class="tok-comment">/// A cell on the board.</span>
<span class="tok-kw">const</span> Cell = <span class="tok-kw">struct</span> {
    x: i32,
    y: i32,

    <span class="tok-kw">fn</span> <span class="tok-fn">eql</span>(self: Cell, o: Cell) bool {
        <span class="tok-kw">return</span> self.x == o.x <span class="tok-kw">and</span> self.y == o.y;
    }
};

<span class="tok-comment">/// A screen-space rectangle for the on-screen buttons.</span>
<span class="tok-kw">const</span> Rect = <span class="tok-kw">struct</span> {
    x: f32,
    y: f32,
    w: f32,
    h: f32,

    <span class="tok-kw">fn</span> <span class="tok-fn">contains</span>(self: Rect, p: Vec2) bool {
        <span class="tok-kw">return</span> p[<span class="tok-num">0</span>] &gt;= self.x <span class="tok-kw">and</span> p[<span class="tok-num">0</span>] &lt;= self.x + self.w <span class="tok-kw">and</span>
            p[<span class="tok-num">1</span>] &gt;= self.y <span class="tok-kw">and</span> p[<span class="tok-num">1</span>] &lt;= self.y + self.h;
    }
};

<span class="tok-comment">/// Board geometry for the current window: a square grid centred in the space</span>
<span class="tok-comment">/// above the control bar, sized off the shorter side. Recomputed every frame.</span>
<span class="tok-kw">const</span> Layout = <span class="tok-kw">struct</span> {
