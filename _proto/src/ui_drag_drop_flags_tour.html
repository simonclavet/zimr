<h1>ui_drag_drop_flags_tour</h1>
<figure class="code src-file" data-path="examples/ui_drag_drop_flags_tour/ui_drag_drop_flags_tour.zig" data-lines="229"><figcaption><span>examples/ui_drag_drop_flags_tour/ui_drag_drop_flags_tour.zig</span><span>229 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_drag_drop_flags_tour.zig</span>
<span class="tok-comment">// tour demo for DragDropFlags + ItemFlags.</span>
<span class="tok-comment">// Three sections in one window:</span>
<span class="tok-comment">//   1. ItemFlags.disabled - toggleable disabled scope graying out</span>
<span class="tok-comment">//      a row of buttons + suppressing their clicks.</span>
<span class="tok-comment">//   2. ItemFlags.button_repeat - held +/- buttons that auto-repeat</span>
<span class="tok-comment">//      while down (counter scrolls).</span>
<span class="tok-comment">//   3. DragDropFlags - drag a colored chip into either of two slots:</span>
<span class="tok-comment">//      one with the default highlight ring, the other with</span>
<span class="tok-comment">//      .accept_no_draw_default_rect (no ring) + .accept_draw_as_hovered</span>
<span class="tok-comment">//      (the slot button "lights up" hover-bg).  The third slot uses</span>
<span class="tok-comment">//      .accept_before_delivery to peek the payload mid-drag and</span>
<span class="tok-comment">//      display a "would drop here" preview.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> Bg: Color = .{ .r = <span class="tok-num">15</span>, .g = <span class="tok-num">23</span>, .b = <span class="tok-num">42</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> Chip = <span class="tok-kw">struct</span> {
    id: u32,
    label: []<span class="tok-kw">const</span> u8,
    color: Color,
};

<span class="tok-kw">const</span> chips = [_]Chip{
    .{ .id = <span class="tok-num">1</span>, .label = <span class="tok-str">"red"</span>, .color = .{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">80</span>, .b = <span class="tok-num">80</span>, .a = <span class="tok-num">255</span> } },
    .{ .id = <span class="tok-num">2</span>, .label = <span class="tok-str">"blue"</span>, .color = .{ .r = <span class="tok-num">80</span>, .g = <span class="tok-num">120</span>, .b = <span class="tok-num">220</span>, .a = <span class="tok-num">255</span> } },
    .{ .id = <span class="tok-num">3</span>, .label = <span class="tok-str">"green"</span>, .color = .{ .r = <span class="tok-num">80</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> } },
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    <span class="tok-comment">// Section 1.</span>
    section1_disabled: bool = true,
    section1_a_clicks: u32 = <span class="tok-num">0</span>,
    section1_b_clicks: u32 = <span class="tok-num">0</span>,

    <span class="tok-comment">// Section 2.</span>
    counter: i32 = <span class="tok-num">0</span>,

    <span class="tok-comment">// Section 3 - last-dropped chip id per slot.</span>
    slot_default: u32 = <span class="tok-num">0</span>,
    slot_no_ring: u32 = <span class="tok-num">0</span>,
    slot_peek_preview: u32 = <span class="tok-num">0</span>, <span class="tok-comment">// mid-drag peek; cleared each frame</span>
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
}

<span class="tok-kw">fn</span> <span class="tok-fn">showSlotContents</span>(
    u: ui.Ui,
    prefix: []<span class="tok-kw">const</span> u8,
    chip_id: u32,
) void {
    <span class="tok-kw">if</span> (chip_id == <span class="tok-num">0</span>) {
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"{s}: (empty)"</span>, .{prefix});
        <span class="tok-kw">return</span>;
    }
    <span class="tok-comment">// Look up the chip to recover label + color.</span>
    <span class="tok-kw">for</span> (chips) |chip| {
        <span class="tok-kw">if</span> (chip.id == chip_id) {
            u.<span class="tok-fn">textColored</span>(chip.color, <span class="tok-str">"{s}: {s}"</span>, .{ prefix, chip.label });
            <span class="tok-kw">return</span>;
        }
    }
    u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}: (unknown chip)"</span>, .{prefix});
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, Bg);

    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-comment">// Reset the per-frame peek preview.</span>
    s.slot_peek_preview = <span class="tok-num">0</span>;

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"DragDropFlags + ItemFlags tour"</span>, .{
        .initial_pos = .{ <span class="tok-num">8</span>, <span class="tok-num">8</span> },
        .initial_size = .{ <span class="tok-num">460</span>, <span class="tok-num">1060</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        <span class="tok-comment">// =====================================================</span>
        <span class="tok-comment">// 1. ItemFlags.disabled</span>
        <span class="tok-comment">// =====================================================</span>
        u.<span class="tok-fn">separatorText</span>(<span class="tok-str">"1. ItemFlags.disabled"</span>);
        u.<span class="tok-fn">textWrapped</span>(
            <span class="tok-str">"Toggle the checkbox: when true, buttons inside the disabled scope "</span> ++
                <span class="tok-str">"gray out + ignore clicks.  Counters stop incrementing."</span>,
            .{},
        );
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"disable next row"</span>, &amp;s.section1_disabled);
        u.<span class="tok-fn">pushItemFlag</span>(.{ .disabled = s.section1_disabled });
        {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">popItemFlag</span>();
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Click A"</span>, .{})) {
                s.section1_a_clicks += <span class="tok-num">1</span>;
            }

        u.<span class="tok-fn">pushItemFlag</span>(.{ .button_repeat = true });

        <span class="tok-comment">// 3. DragDropFlags</span>
        <span class="tok-comment">// =====================================================</span>
