<h1>deferred_render</h1>
<figure class="code src-file" data-path="examples/deferred_render/deferred_render.zig" data-lines="896"><figcaption><span>examples/deferred_render/deferred_render.zig</span><span>896 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! deferred_render - raylib's `shaders_deferred_rendering`, the zimr way.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Two passes, zero lighting math wasted on overdraw:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   PASS A (geometry -&gt; G-buffer): one MRT render pass fills THREE</span>
<span class="tok-comment">//!   textures at once through `gbuffer_vs/fs` - world position</span>
<span class="tok-comment">//!   (rgba16_float), world normal (rgba16_float), albedo+spec</span>
<span class="tok-comment">//!   (rgba8_unorm).  36 objects, one walk.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   PASS B (lighting): a fullscreen quad through `deferred_shading_fs`</span>
<span class="tok-comment">//!   reads the three maps back and runs Blinn-Phong for four point</span>
<span class="tok-comment">//!   lights - once per screen pixel, however many cubes overdrew it.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Phone-first upgrades over the raylib original: drag to orbit, pinch</span>
<span class="tok-comment">//! or wheel to zoom; the four lights slowly circle the scene (motion is</span>
<span class="tok-comment">//! what makes deferred lighting legible) with little glowing lamp cubes</span>
<span class="tok-comment">//! riding along; and the keyboard toggles became a proper UI panel -</span>
<span class="tok-comment">//! four light checkboxes plus a POSITION / NORMAL / ALBEDO / SHADING</span>
<span class="tok-comment">//! mode switch that blits the raw G-buffer maps for inspection.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> rotationY = zm.rotationY;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-comment">/// Plain white tint for the fullscreen blits - the maps ARE the picture.</span>
<span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> gbuf_vs = z.deferred_shaders.gbuffer_vs;
<span class="tok-kw">const</span> gbuf_fs = z.deferred_shaders.gbuffer_fs;
<span class="tok-kw">const</span> shade_fs = z.deferred_shaders.shading_fs;

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> gbuffer_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"gbuffer_vs.wgsl"</span>);
<span class="tok-kw">const</span> gbuffer_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"gbuffer_fs.wgsl"</span>);
<span class="tok-kw">const</span> shading_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"deferred_shading_vs.wgsl"</span>);
<span class="tok-kw">const</span> shading_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"deferred_shading_fs.wgsl"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// Uniform block types come FROM the shader Io schemas - the GPU buffers</span>
<span class="tok-comment">// and any future software run of these shaderMains cannot drift apart.</span>
<span class="tok-kw">const</span> GbufVsUbo = <span class="tok-builtin">@FieldType</span>(gbuf_vs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> GbufFsUbo = <span class="tok-builtin">@FieldType</span>(gbuf_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> LightsUbo = <span class="tok-builtin">@FieldType</span>(shade_fs.Io, <span class="tok-str">"u"</span>);

<span class="tok-kw">const</span> max_lights: usize = <span class="tok-num">4</span>;
<span class="tok-kw">const</span> tumbling_cubes: usize = <span class="tok-num">30</span>;

<span class="tok-comment">/// What pass B (or the debug blit) puts on screen.</span>
<span class="tok-kw">const</span> ViewMode = <span class="tok-kw">enum</span> { position, normal, albedo, shading };

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Geometry - the same position+normal layout the whole engine speaks.</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">const</span> MeshVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    position: [<span class="tok-num">3</span>]f32,
    normal: [<span class="tok-num">3</span>]f32,
};

<span class="tok-kw">const</span> up_n: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> };

<span class="tok-comment">/// 10x10 ground plane, matching raylib's GenMeshPlane(10, 10).</span>
<span class="tok-kw">const</span> plane_verts = [_]MeshVertex{
    .{ .position = .{ -<span class="tok-num">5</span>, <span class="tok-num">0</span>, -<span class="tok-num">5</span> }, .normal = up_n },
    .{ .position = .{ <span class="tok-num">5</span>, <span class="tok-num">0</span>, -<span class="tok-num">5</span> }, .normal = up_n },
    .{ .position = .{ <span class="tok-num">5</span>, <span class="tok-num">0</span>, <span class="tok-num">5</span> }, .normal = up_n },
    .{ .position = .{ -<span class="tok-num">5</span>, <span class="tok-num">0</span>, <span class="tok-num">5</span> }, .normal = up_n },
};
<span class="tok-kw">const</span> plane_indices = [_]u32{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span> };

<span class="tok-comment">/// Unit cube (half-extent 1) with flat face normals; every cube in the</span>
<span class="tok-comment">/// scene is this mesh under a different model matrix.</span>

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Staging - the seeded cube field + the light carousel.</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-comment">/// One drawable: which mesh, where, what material, how it tumbles.</span>
<span class="tok-kw">const</span> Placement = <span class="tok-kw">struct</span> {
    mesh: <span class="tok-kw">enum</span> { plane, cube },
    center: [<span class="tok-num">3</span>]f32,
    half: [<span class="tok-num">3</span>]f32,
    spin_rate: f32, <span class="tok-comment">// radians/sec about Y; 0 = static</span>
    albedo_spec: [<span class="tok-num">4</span>]f32, <span class="tok-comment">// rgb albedo + a spec strength - the G-buffer vec4</span>
};

<span class="tok-comment">/// Tiny deterministic PRNG (xorshift) so the cube field is the SAME</span>
<span class="tok-comment">/// composed scatter on every run - raylib reseeds rand() and gets a new</span>
<span class="tok-comment">/// jumble each launch, which makes screenshots impossible to compare.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">nextRand</span>(state: *u32) f32 {
    <span class="tok-kw">var</span> x: u32 = state.*;
    x ^= x &lt;&lt; <span class="tok-num">13</span>;
    x ^= x &gt;&gt; <span class="tok-num">17</span>;
    x ^= x &lt;&lt; <span class="tok-num">5</span>;
    state.* = x;
    <span class="tok-kw">return</span> <span class="tok-fn">float</span>(x &amp; <span class="tok-num">0xFFFF</span>) / <span class="tok-num">65535.0</span>;
}

<span class="tok-comment">/// plane + center cube + 30 tumblers.  Lamp cubes are separate (they</span>
<span class="tok-comment">/// track the moving lights, so their placement is computed per frame).</span>
<span class="tok-kw">const</span> scene_placements: [<span class="tok-num">2</span> + tumbling_cubes]Placement = <span class="tok-fn">buildPlacements</span>();

<span class="tok-kw">fn</span> <span class="tok-fn">buildPlacements</span>() [<span class="tok-num">2</span> + tumbling_cubes]Placement {
    <span class="tok-kw">var</span> out: [<span class="tok-num">2</span> + tumbling_cubes]Placement = undefined;
    out[<span class="tok-num">0</span>] = .{
        .mesh = .plane,
        .center = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .half = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span> },
        .spin_rate = <span class="tok-num">0</span>,
        .albedo_spec = .{ <span class="tok-num">0.82</span>, <span class="tok-num">0.82</span>, <span class="tok-num">0.85</span>, <span class="tok-num">0.15</span> }, <span class="tok-comment">// matte floor, faint sheen</span>
    };
    out[<span class="tok-num">1</span>] = .{
        .mesh = .cube,
        .center = .{ <span class="tok-num">0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0</span> },
        .half = .{ <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span> }, <span class="tok-comment">// raylib's 2.0 cube</span>
        .spin_rate = <span class="tok-num">0.25</span>,
        .albedo_spec = .{ <span class="tok-num">0.85</span>, <span class="tok-num">0.83</span>, <span class="tok-num">0.78</span>, <span class="tok-num">0.6</span> }, <span class="tok-comment">// the shiny centerpiece</span>
    };
    <span class="tok-kw">var</span> rng: u32 = <span class="tok-num">0xC0FFEE</span>;
    <span class="tok-kw">for</span> (out[<span class="tok-num">2</span>..]) |*p| {
        <span class="tok-comment">// Scatter like raylib (x,z in [-5,5), y in [0,5)) but seeded, and</span>
        <span class="tok-comment">// with per-cube tumble rates so the normals are alive on screen.</span>
        <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">nextRand</span>(&amp;rng) * <span class="tok-num">10.0</span> - <span class="tok-num">5.0</span>;
        <span class="tok-kw">const</span> y: f32 = <span class="tok-fn">nextRand</span>(&amp;rng) * <span class="tok-num">4.0</span> + <span class="tok-num">0.25</span>;
        <span class="tok-kw">const</span> zz: f32 = <span class="tok-fn">nextRand</span>(&amp;rng) * <span class="tok-num">10.0</span> - <span class="tok-num">5.0</span>;
        <span class="tok-kw">const</span> tone: f32 = <span class="tok-num">0.55</span> + <span class="tok-fn">nextRand</span>(&amp;rng) * <span class="tok-num">0.35</span>;
        p.* = .{
            .mesh = .cube,
            .center = .{ x, y, zz },
            .half = .{ <span class="tok-num">0.25</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0.25</span> }, <span class="tok-comment">// raylib's CUBE_SCALE</span>
            .spin_rate = (<span class="tok-fn">nextRand</span>(&amp;rng) - <span class="tok-num">0.5</span>) * <span class="tok-num">1.6</span>,
            .albedo_spec = .{ tone, tone, tone, <span class="tok-num">0.35</span> },
        };
    }
    <span class="tok-kw">return</span> out;
}

<span class="tok-comment">/// Light homes + colors, straight from raylib's four CreateLight calls</span>
<span class="tok-comment">/// (yellow/red/green/blue at the +/-2 corners) - but ours ORBIT: each</span>
<span class="tok-comment">/// circles the scene center at its home radius with its own phase, so</span>
<span class="tok-comment">/// shadow-free deferred lighting still reads as motion.</span>
<span class="tok-kw">const</span> light_color_table = [max_lights][<span class="tok-num">3</span>]f32{
    .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.9</span>, <span class="tok-num">0.3</span> }, <span class="tok-comment">// yellow</span>
    .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.32</span>, <span class="tok-num">0.3</span> }, <span class="tok-comment">// red</span>
    .{ <span class="tok-num">0.35</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.4</span> }, <span class="tok-comment">// green</span>
    .{ <span class="tok-num">0.4</span>, <span class="tok-num">0.55</span>, <span class="tok-num">1.0</span> }, <span class="tok-comment">// blue</span>
};
<span class="tok-kw">const</span> light_orbit_speed: f32 = <span class="tok-num">0.35</span>;
<span class="tok-kw">const</span> light_reach: f32 = <span class="tok-num">4.0</span>;

<span class="tok-kw">fn</span> <span class="tok-fn">lightPosition</span>(i: usize, t: f32) [<span class="tok-num">3</span>]f32 {
    <span class="tok-comment">// Radius sqrt8 ~ raylib's (+/-2,+/-2) corner distance; quarter-turn phase</span>
    <span class="tok-comment">// per light keeps the original square formation, just rotating.</span>
    <span class="tok-kw">const</span> phase: f32 = <span class="tok-fn">float</span>(i) * <span class="tok-num">1.5707964</span>; <span class="tok-comment">// quarter turn per light</span>
    <span class="tok-kw">const</span> a: f32 = t * light_orbit_speed + phase;
    <span class="tok-kw">const</span> r: f32 = <span class="tok-num">2.83</span>;
    <span class="tok-comment">// A gentle bob so the floor highlight breathes.</span>
    <span class="tok-kw">const</span> y: f32 = <span class="tok-num">1.2</span> + <span class="tok-num">0.35</span> * <span class="tok-builtin">@sin</span>(t * <span class="tok-num">0.9</span> + phase * <span class="tok-num">2.0</span>);
    <span class="tok-kw">return</span> .{ r * <span class="tok-builtin">@cos</span>(a), y, r * <span class="tok-builtin">@sin</span>(a) };
}

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// GPU plumbing - a G-buffer of three RTTs, two pipelines, per-object</span>
<span class="tok-comment">// uniforms (shadowmap_sw's Obj pattern, two UBOs here instead of three).</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">const</span> total_objects: usize = scene_placements.len + max_lights; <span class="tok-comment">// + lamp cubes</span>

<span class="tok-kw">const</span> Obj = <span class="tok-kw">struct</span> {
    vbo: z.wgpu.BufferHandle,
    ibo: z.wgpu.BufferHandle,
    vbo_bytes: u64,
    ibo_bytes: u64,
    icount: u32,
    vs_ubo: z.wgpu.BufferHandle,
    g0_bg: z.wgpu.BindGroupHandle,
    fs_ubo: z.wgpu.BufferHandle,
    g2_bg: z.wgpu.BindGroupHandle,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,

    gbuffer_pipeline: z.wgpu.RenderPipelineHandle,
    shading_pipeline: z.wgpu.RenderPipelineHandle,

    <span class="tok-comment">// The G-buffer: [0] position (owns the depth), [1] normal, [2] albedo.</span>
    <span class="tok-comment">// Recreated on canvas resize; .invalid before the first ensureTargets.</span>
    g_rts: [<span class="tok-num">3</span>]z.RenderTexture,
    g_sampler: z.wgpu.SamplerHandle,
    g1_bgl: z.wgpu.BindGroupLayoutHandle,
    g1_bg: z.wgpu.BindGroupHandle, <span class="tok-comment">// gbuffer textures for pass B (rebuilt on resize)</span>
    empty_bgl: z.wgpu.BindGroupLayoutHandle,
    empty_bg: z.wgpu.BindGroupHandle, <span class="tok-comment">// pass B group 0 (shading VS has no uniforms)</span>

    rt: z.RenderTexture, <span class="tok-comment">// pass B target = what the screen shows in .shading</span>

    objs: [total_objects]Obj,
    fullscreen_vbo: z.wgpu.BufferHandle,
    plane_vbo: z.wgpu.BufferHandle,
    plane_ibo: z.wgpu.BufferHandle,
    cube_vbo: z.wgpu.BufferHandle,
    cube_ibo: z.wgpu.BufferHandle,
    lights_ubo: z.wgpu.BufferHandle,
    lights_bg: z.wgpu.BindGroupHandle,

    ui_host: z.UiHost,
    font: z.Font,
    mode: ViewMode = .shading,
    light_on: [max_lights]bool = .{ true, true, true, true },

    cam_yaw: f32 = <span class="tok-num">0.8</span>,
    cam_pitch: f32 = <span class="tok-num">0.45</span>,
    cam_dist: f32 = <span class="tok-num">11.0</span>,
    dragging: bool = false,
    prev_pinch: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    <span class="tok-kw">for</span> (&amp;s.objs) |*o| {
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(o.vs_ubo);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(o.fs_ubo);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(o.g0_bg);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(o.g2_bg);
    }
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.plane_vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.plane_ibo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.cube_vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.cube_ibo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.fullscreen_vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.lights_ubo);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.lights_bg);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.empty_bg);
    <span class="tok-kw">if</span> (s.g1_bg != .invalid) {
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.g1_bg);
    }
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(s.g1_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(s.empty_bgl);
    z.wgpu.<span class="tok-fn">destroySampler</span>(s.g_sampler);
    <span class="tok-kw">for</span> (&amp;s.g_rts) |*g| {
        g.<span class="tok-fn">deinit</span>();
    }
    s.rt.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.gbuffer_pipeline);
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.shading_pipeline);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">uniformLayout</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    min_size: u64,
    vis: z.wgpu.ShaderStage,
    label: []<span class="tok-kw">const</span> u8,
) !z.wgpu.BindGroupLayoutHandle {
    <span class="tok-kw">const</span> entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{ .binding = <span class="tok-num">0</span>, .visibility = vis, .resource = .{ .uniform_buffer = .{ .min_size = min_size } } },
    };
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    <span class="tok-kw">return</span> z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, blob, label);
}

<span class="tok-kw">fn</span> <span class="tok-fn">uniformBindGroup</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    bgl: z.wgpu.BindGroupLayoutHandle,
    buffer: z.wgpu.BufferHandle,
    size: u64,
    label: []<span class="tok-kw">const</span> u8,
) !z.wgpu.BindGroupHandle {
    <span class="tok-kw">const</span> entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = buffer, .size = size } } },
    };
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    <span class="tok-kw">return</span> z.wgpu.<span class="tok-fn">createBindGroup</span>(device, bgl, blob, label);
}

<span class="tok-kw">const</span> Bgls = <span class="tok-kw">struct</span> {
    gbuf_g0: z.wgpu.BindGroupLayoutHandle,
    gbuf_g2: z.wgpu.BindGroupLayoutHandle,
};

<span class="tok-kw">fn</span> <span class="tok-fn">makeObj</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    bgls: Bgls,
    vbo: z.wgpu.BufferHandle,
    ibo: z.wgpu.BufferHandle,
    vbo_bytes: u64,
    ibo_bytes: u64,
    icount: u32,
) !Obj {
    <span class="tok-kw">const</span> vs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(GbufVsUbo),
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-kw">const</span> fs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(GbufFsUbo),
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-kw">return</span> .{
        .vbo = vbo,
        .ibo = ibo,
        .vbo_bytes = vbo_bytes,
        .ibo_bytes = ibo_bytes,
        .icount = icount,
        .vs_ubo = vs_ubo,
        .g0_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, bgls.gbuf_g0, vs_ubo, <span class="tok-builtin">@sizeOf</span>(GbufVsUbo), <span class="tok-str">"dfr_g0"</span>),
        .fs_ubo = fs_ubo,
        .g2_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, bgls.gbuf_g2, fs_ubo, <span class="tok-builtin">@sizeOf</span>(GbufFsUbo), <span class="tok-str">"dfr_g2"</span>),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> queue: z.wgpu.QueueHandle = f.gpu.queue;

    <span class="tok-comment">// ---- shared geometry buffers ----</span>
    <span class="tok-kw">const</span> plane_vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(plane_verts[<span class="tok-num">0</span>..]),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"dfr_plane_vbo"</span>,
    );
    <span class="tok-kw">const</span> plane_ibo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(plane_indices[<span class="tok-num">0</span>..]),
        .{ .index = true, .copy_dst = true },
        <span class="tok-str">"dfr_plane_ibo"</span>,
    );
    <span class="tok-kw">const</span> cube_vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_verts[<span class="tok-num">0</span>..]),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"dfr_cube_vbo"</span>,
    );
    <span class="tok-kw">const</span> cube_ibo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_indices[<span class="tok-num">0</span>..]),
        .{ .index = true, .copy_dst = true },
        <span class="tok-str">"dfr_cube_ibo"</span>,
    );
    <span class="tok-kw">const</span> fullscreen_vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(fullscreen_verts[<span class="tok-num">0</span>..]),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"dfr_fullscreen_vbo"</span>,
    );

    <span class="tok-comment">// ---- vertex layouts ----</span>
    <span class="tok-kw">const</span> pos_normal_layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(MeshVertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
            .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
        },
    };
    <span class="tok-kw">const</span> ndc_pos_layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-num">8</span>,
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x2, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
        },
    };

    <span class="tok-comment">// ---- bind group layouts ----</span>
    <span class="tok-kw">const</span> bgls: Bgls = .{
        .gbuf_g0 = <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(GbufVsUbo), .{ .vertex = true }, <span class="tok-str">"dfr_gbuf_g0"</span>),
        .gbuf_g2 = <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(GbufFsUbo), .{ .fragment = true }, <span class="tok-str">"dfr_gbuf_g2"</span>),
    };
    <span class="tok-kw">const</span> lights_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(LightsUbo), .{ .fragment = true }, <span class="tok-str">"dfr_lights_g2"</span>);

    <span class="tok-comment">// Pass B's group 1: three {texture, sampler} pairs, interleaved exactly as</span>
    <span class="tok-comment">// the generated WGSL declares them - texture at binding 2i, its sampler at</span>
    <span class="tok-comment">// 2i+1 (the schema solver spaces each Sampler2D pair 2 apart). This MUST</span>
    <span class="tok-comment">// match `deferred_shading_fs_io.Samplers` (g_world_pos, g_world_normal,</span>
    <span class="tok-comment">// g_albedo_spec); the old "textures 0/1/2, samplers 3/4/5" block scheme</span>
    <span class="tok-comment">// drifted from the interleaved WGSL and Dawn rejected the type mismatch.</span>
    <span class="tok-kw">var</span> g1_layout_entries: [<span class="tok-num">6</span>]z.shader_introspect.BindGroupLayoutEntry = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">3</span>) |i| {
        g1_layout_entries[<span class="tok-num">2</span> * i] = .{
            .binding = <span class="tok-builtin">@intCast</span>(<span class="tok-num">2</span> * i),
            .visibility = .{ .fragment = true },
            .resource = .{ .texture = .{} },
        };
        g1_layout_entries[<span class="tok-num">2</span> * i + <span class="tok-num">1</span>] = .{
            .binding = <span class="tok-builtin">@intCast</span>(<span class="tok-num">2</span> * i + <span class="tok-num">1</span>),
            .visibility = .{ .fragment = true },
            .resource = .{ .sampler = .{} },
        };
    }
    <span class="tok-kw">const</span> g1_layout_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g1_layout_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_layout_blob);
    <span class="tok-kw">const</span> g1_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g1_layout_blob, <span class="tok-str">"dfr_g1"</span>);

    <span class="tok-comment">// The shading VS declares NO group-0 uniforms, but the pipeline layout</span>
    <span class="tok-comment">// array is positional - group 2 exists only if slots 0 and 1 do.  An</span>
    <span class="tok-comment">// empty layout + empty bind group fills the hole honestly.</span>
    <span class="tok-kw">const</span> empty_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_blob);
    <span class="tok-kw">const</span> empty_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, empty_blob, <span class="tok-str">"dfr_empty"</span>);
    <span class="tok-kw">const</span> empty_bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_bg_blob);
    <span class="tok-kw">const</span> empty_bg: z.wgpu.BindGroupHandle =
        z.wgpu.<span class="tok-fn">createBindGroup</span>(device, empty_bgl, empty_bg_blob, <span class="tok-str">"dfr_empty_bg"</span>);

    <span class="tok-comment">// Nearest sampling: the G-buffer is data, not a picture - bilinearly</span>
    <span class="tok-comment">// mixing two world positions across a silhouette invents a third</span>
    <span class="tok-comment">// position that exists on neither surface.</span>
    <span class="tok-kw">const</span> g_sampler: z.wgpu.SamplerHandle = z.wgpu.<span class="tok-fn">createSampler</span>(device, .{
        .mag_filter_linear = false,
        .min_filter_linear = false,
        .address_mode = .clamp_to_edge,
    });

    <span class="tok-comment">// ---- PASS A pipeline: three color targets via the MRT tail ----</span>
    <span class="tok-kw">const</span> gbuf_pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ bgls.gbuf_g0, empty_bgl, bgls.gbuf_g2 },
        <span class="tok-str">"dfr_gbuf_pl"</span>,
    );
    <span class="tok-kw">const</span> gbuf_vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, gbuffer_vs_wgsl, <span class="tok-str">"gbuffer_vs"</span>);
    <span class="tok-kw">const</span> gbuf_fs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, gbuffer_fs_wgsl, <span class="tok-str">"gbuffer_fs"</span>);
    <span class="tok-kw">const</span> gbuf_combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none, <span class="tok-comment">// no blend - G-buffers store data</span>
        .less,
        .none,
        .rgba16_float, <span class="tok-comment">// location 0: world position</span>
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> gbuf_pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{pos_normal_layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = gbuf_combo,
        .extra_color_formats = &amp;.{ .rgba16_float, .rgba8_unorm }, <span class="tok-comment">// normal, albedo+spec</span>
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(gbuf_pipe_blob);
    <span class="tok-kw">const</span> gbuffer_pipeline: z.wgpu.RenderPipelineHandle = z.wgpu.<span class="tok-fn">createRenderPipeline</span>(
        device,
        gbuf_pl,
        gbuf_vs_mod,
        gbuf_fs_mod,
        gbuf_pipe_blob,
        <span class="tok-str">"dfr_gbuf_pipe"</span>,
    );

    <span class="tok-comment">// ---- PASS B pipeline: fullscreen quad -&gt; the rgba8 canvas RTT ----</span>
    <span class="tok-kw">const</span> shade_pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ empty_bgl, g1_bgl, lights_bgl },
        <span class="tok-str">"dfr_shade_pl"</span>,
    );
    <span class="tok-kw">const</span> shade_vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, shading_vs_wgsl, <span class="tok-str">"deferred_shading_vs"</span>);
    <span class="tok-kw">const</span> shade_fs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, shading_fs_wgsl, <span class="tok-str">"deferred_shading_fs"</span>);
    <span class="tok-kw">const</span> shade_combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less, <span class="tok-comment">// quad at z=0 vs cleared depth 1.0 - always passes</span>
        .none,
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> shade_pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{ndc_pos_layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = shade_combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(shade_pipe_blob);
    <span class="tok-kw">const</span> shading_pipeline: z.wgpu.RenderPipelineHandle = z.wgpu.<span class="tok-fn">createRenderPipeline</span>(
        device,
        shade_pl,
        shade_vs_mod,
        shade_fs_mod,
        shade_pipe_blob,
        <span class="tok-str">"dfr_shade_pipe"</span>,
    );

    <span class="tok-comment">// ---- per-object state (plane, cubes, lamp cubes) ----</span>
    <span class="tok-kw">var</span> objs: [total_objects]Obj = undefined;
    <span class="tok-kw">for</span> (&amp;objs, <span class="tok-num">0</span>..) |*slot, i| {
        <span class="tok-kw">const</span> is_plane: bool = i == <span class="tok-num">0</span>;
        slot.* = <span class="tok-kw">try</span> <span class="tok-fn">makeObj</span>(
            gpa,
            device,
            bgls,
            <span class="tok-kw">if</span> (is_plane) plane_vbo <span class="tok-kw">else</span> cube_vbo,
            <span class="tok-kw">if</span> (is_plane) plane_ibo <span class="tok-kw">else</span> cube_ibo,
            <span class="tok-kw">if</span> (is_plane) <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(plane_verts)) <span class="tok-kw">else</span> <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_verts)),
            <span class="tok-kw">if</span> (is_plane) <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(plane_indices)) <span class="tok-kw">else</span> <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_indices)),
            <span class="tok-kw">if</span> (is_plane) plane_indices.len <span class="tok-kw">else</span> cube_indices.len,
        );
    }

    <span class="tok-kw">const</span> lights_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(LightsUbo),
        .usage = .{ .uniform = true, .copy_dst = true },
    });

    <span class="tok-kw">const</span> lights_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, lights_bgl, lights_ubo, <span class="tok-builtin">@sizeOf</span>(LightsUbo), <span class="tok-str">"dfr_lights_bg"</span>);

    <span class="tok-comment">// Build-only intermediates consumed above - release (pipelines are direct/uncached -&gt; owned).</span>
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgls.gbuf_g0);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgls.gbuf_g2);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(lights_bgl);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(gbuf_pl);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(shade_pl);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(gbuf_vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(gbuf_fs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(shade_vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(shade_fs_mod);

    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.* = .{
        .gpa = gpa,
        .gbuffer_pipeline = gbuffer_pipeline,
        .shading_pipeline = shading_pipeline,
        .g_rts = .{ .{}, .{}, .{} },
        .g_sampler = g_sampler,
        .g1_bgl = g1_bgl,
        .g1_bg = .invalid,
        .empty_bgl = empty_bgl,
        .empty_bg = empty_bg,
        .rt = .{},
        .objs = objs,
        .fullscreen_vbo = fullscreen_vbo,
        .plane_vbo = plane_vbo,
        .plane_ibo = plane_ibo,
        .cube_vbo = cube_vbo,
        .cube_ibo = cube_ibo,
        .lights_ubo = lights_ubo,
        .lights_bg = lights_bg,
        .font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
    };
}

<span class="tok-comment">/// Keep the G-buffer + the pass B target at the canvas backing size;</span>
<span class="tok-comment">/// rebuild the G-buffer bind group whenever the texture views change.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> bw: u32 = <span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> bh: u32 = <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt.color != .invalid <span class="tok-kw">and</span> s.rt.width == bw <span class="tok-kw">and</span> s.rt.height == bh) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.rt.color != .invalid) {
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt);
        <span class="tok-kw">for</span> (&amp;s.g_rts) |*rt| {
            z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, rt);
        }
    }
    s.rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(bw), <span class="tok-builtin">@intCast</span>(bh));
    <span class="tok-kw">const</span> formats = [<span class="tok-num">3</span>]z.wgpu.TextureFormat{ .rgba16_float, .rgba16_float, .rgba8_unorm };
    <span class="tok-kw">for</span> (&amp;s.g_rts, formats, <span class="tok-num">0</span>..) |*rt, fmt, i| {
        rt.* = z.RenderTexture.<span class="tok-fn">create</span>(f.gpu.device, .{
            .width = bw,
            .height = bh,
            .format = fmt,
            .with_depth = i == <span class="tok-num">0</span>, <span class="tok-comment">// ONE depth, owned by the position target</span>
            .depth_format = .depth24_plus,
            .label = <span class="tok-str">"dfr_gbuf_rt"</span>,
        });
    }

    <span class="tok-comment">// Fresh views -&gt; fresh pass B bind group. Interleaved to match the layout</span>
    <span class="tok-comment">// and WGSL: g_rts[i]'s texture at binding 2i, the shared sampler at 2i+1.</span>
    <span class="tok-kw">const</span> g1_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .texture_view = s.g_rts[<span class="tok-num">0</span>].<span class="tok-fn">asTexture</span>().view } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .sampler = s.g_sampler } },
        .{ .binding = <span class="tok-num">2</span>, .resource = .{ .texture_view = s.g_rts[<span class="tok-num">1</span>].<span class="tok-fn">asTexture</span>().view } },
        .{ .binding = <span class="tok-num">3</span>, .resource = .{ .sampler = s.g_sampler } },
        .{ .binding = <span class="tok-num">4</span>, .resource = .{ .texture_view = s.g_rts[<span class="tok-num">2</span>].<span class="tok-fn">asTexture</span>().view } },
        .{ .binding = <span class="tok-num">5</span>, .resource = .{ .sampler = s.g_sampler } },
    };
    <span class="tok-kw">const</span> g1_blob: []<span class="tok-kw">const</span> u8 = z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(s.gpa, &amp;g1_entries) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">defer</span> s.gpa.<span class="tok-fn">free</span>(g1_blob);
    <span class="tok-kw">if</span> (s.g1_bg != .invalid) {
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.g1_bg);
    }
    s.g1_bg = z.wgpu.<span class="tok-fn">createBindGroup</span>(f.gpu.device, s.g1_bgl, g1_blob, <span class="tok-str">"dfr_g1_bg"</span>);
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(f: *z.Frame, s: *State, ui_wants_mouse: bool) void {
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> dx: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (s.prev_pinch &gt; <span class="tok-num">0</span>) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - (dist - s.prev_pinch) * <span class="tok-num">0.02</span>, <span class="tok-num">5.0</span>, <span class="tok-num">22.0</span>);
        }
        s.prev_pinch = dist;
        <span class="tok-kw">return</span>;
    }
    s.prev_pinch = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !ui_wants_mouse) {
        <span class="tok-kw">if</span> (s.dragging) {
            <span class="tok-kw">const</span> d: Vec2 = z.<span class="tok-fn">getMouseDelta</span>(f.input);
            s.cam_yaw -= d[<span class="tok-num">0</span>] * <span class="tok-num">0.008</span>;
            s.cam_pitch = <span class="tok-fn">clamp</span>(s.cam_pitch + d[<span class="tok-num">1</span>] * <span class="tok-num">0.008</span>, <span class="tok-num">0.08</span>, <span class="tok-num">1.45</span>);
        }
        s.dragging = true;
    } <span class="tok-kw">else</span> {
        s.dragging = false;
    }
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span>) {
        s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - wheel * <span class="tok-num">0.6</span>, <span class="tok-num">5.0</span>, <span class="tok-num">22.0</span>);
    }
}

<span class="tok-comment">/// Model matrix for a placement: place o spin o scale.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">placementModel</span>(p: Placement, t: f32) Mat {
    <span class="tok-kw">const</span> spin: Mat = <span class="tok-fn">rotationY</span>(p.spin_rate * t);
    <span class="tok-kw">const</span> scale_it: Mat = <span class="tok-fn">scaling</span>(p.half[<span class="tok-num">0</span>], p.half[<span class="tok-num">1</span>], p.half[<span class="tok-num">2</span>]);
    <span class="tok-kw">const</span> place_it: Mat = <span class="tok-fn">translation</span>(p.center[<span class="tok-num">0</span>], p.center[<span class="tok-num">1</span>], p.center[<span class="tok-num">2</span>]);
    <span class="tok-kw">return</span> <span class="tok-fn">mulMat</span>(place_it, <span class="tok-fn">mulMat</span>(spin, scale_it));
}

<span class="tok-kw">fn</span> <span class="tok-fn">writeObjUniforms</span>(f: *z.Frame, s: *State, t: f32, cam_vp: Mat) void {
    <span class="tok-comment">// Scene placements first, then the four lamp cubes riding the lights.</span>
    <span class="tok-kw">for</span> (&amp;s.objs, <span class="tok-num">0</span>..) |*obj, i| {
        <span class="tok-kw">var</span> model: Mat = undefined;
        <span class="tok-kw">var</span> normal_mat: Mat = undefined;
        <span class="tok-kw">var</span> material: [<span class="tok-num">4</span>]f32 = undefined;
        <span class="tok-kw">if</span> (i &lt; scene_placements.len) {
            <span class="tok-kw">const</span> p: Placement = scene_placements[i];
            model = <span class="tok-fn">placementModel</span>(p, t);
            normal_mat = <span class="tok-fn">rotationY</span>(p.spin_rate * t);
            material = p.albedo_spec;
        } <span class="tok-kw">else</span> {
            <span class="tok-kw">const</span> li: usize = i - scene_placements.len;
            <span class="tok-kw">const</span> lp: [<span class="tok-num">3</span>]f32 = <span class="tok-fn">lightPosition</span>(li, t);
            <span class="tok-kw">const</span> c: [<span class="tok-num">3</span>]f32 = light_color_table[li];
            model = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(lp[<span class="tok-num">0</span>], lp[<span class="tok-num">1</span>], lp[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.12</span>, <span class="tok-num">0.12</span>, <span class="tok-num">0.12</span>));
            normal_mat = zm.<span class="tok-fn">identity</span>();
            <span class="tok-comment">// Over-bright when on (reads emissive under its own light),</span>
            <span class="tok-comment">// dim husk when toggled off - the lamp itself tells you.</span>
            <span class="tok-kw">const</span> gain: f32 = <span class="tok-kw">if</span> (s.light_on[li]) <span class="tok-num">1.8</span> <span class="tok-kw">else</span> <span class="tok-num">0.12</span>;
            material = .{ c[<span class="tok-num">0</span>] * gain, c[<span class="tok-num">1</span>] * gain, c[<span class="tok-num">2</span>] * gain, <span class="tok-num">0.0</span> };
        }

        <span class="tok-kw">var</span> vs_io: gbuf_vs.Io = undefined;
        vs_io.u = .{
            .mvp = <span class="tok-fn">mulMat</span>(cam_vp, model),
            .model = model,
            .normal_matrix = normal_mat,
        };
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.vs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;vs_io.u));
        <span class="tok-kw">var</span> fs_io: gbuf_fs.Io = undefined;
        fs_io.u = .{ .albedo_spec = material };
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.fs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;fs_io.u));
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">writeLightsUbo</span>(f: *z.Frame, s: *State, t: f32, cam_eye: Vec) void {
    <span class="tok-kw">var</span> u: LightsUbo = undefined;
    u.view_pos = .{ cam_eye[<span class="tok-num">0</span>], cam_eye[<span class="tok-num">1</span>], cam_eye[<span class="tok-num">2</span>], <span class="tok-num">0</span> };
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..max_lights) |i| {
        <span class="tok-kw">const</span> lp: [<span class="tok-num">3</span>]f32 = <span class="tok-fn">lightPosition</span>(i, t);
        <span class="tok-kw">const</span> c: [<span class="tok-num">3</span>]f32 = light_color_table[i];
        u.light_pos[i] = .{ lp[<span class="tok-num">0</span>], lp[<span class="tok-num">1</span>], lp[<span class="tok-num">2</span>], light_reach };
        u.light_color[i] = .{ c[<span class="tok-num">0</span>], c[<span class="tok-num">1</span>], c[<span class="tok-num">2</span>], <span class="tok-kw">if</span> (s.light_on[i]) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">0.0</span> };
    }
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.lights_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;u));
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawMesh</span>(rps: *z.PassState, obj: *<span class="tok-kw">const</span> Obj) void {
    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(rps.pass, .{ .slot = <span class="tok-num">0</span>, .buffer = obj.vbo, .offset = <span class="tok-num">0</span>, .size = obj.vbo_bytes });
    z.render_pass.<span class="tok-fn">setIndexBuffer</span>(rps.pass, .{
        .buffer = obj.ibo,
        .format = .uint32,
        .offset = <span class="tok-num">0</span>,
        .size = obj.ibo_bytes,
    });
    z.render_pass.<span class="tok-fn">drawIndexed</span>(rps.pass, .{
        .index_count = obj.icount,
        .instance_count = <span class="tok-num">1</span>,
        .first_index = <span class="tok-num">0</span>,
        .base_vertex = <span class="tok-num">0</span>,
        .first_instance = <span class="tok-num">0</span>,
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing; uses</span>
    <span class="tok-comment">// last-frame UI state = 1-frame lag).</span>

    <span class="tok-comment">// ---- camera ----</span>
    <span class="tok-kw">const</span> cam_target: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(s.cam_pitch);
    <span class="tok-kw">const</span> sp: f32 = <span class="tok-builtin">@sin</span>(s.cam_pitch);
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-builtin">@cos</span>(s.cam_yaw);
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-builtin">@sin</span>(s.cam_yaw);
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(
        cam_target[<span class="tok-num">0</span>] + s.cam_dist * cp * sy,
        cam_target[<span class="tok-num">1</span>] + s.cam_dist * sp,
        cam_target[<span class="tok-num">2</span>] + s.cam_dist * cp * cy,
    );
    <span class="tok-kw">const</span> cam_view: Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, cam_target, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> cam_proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(<span class="tok-num">1.05</span>, vw / vh, <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>); <span class="tok-comment">// ~raylib's 60 deg fovy</span>
    <span class="tok-kw">const</span> cam_vp: Mat = <span class="tok-fn">mulMat</span>(cam_proj, cam_view);

    <span class="tok-fn">writeObjUniforms</span>(f, s, t, cam_vp);
    <span class="tok-fn">writeLightsUbo</span>(f, s, t, cam_eye);
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;

    <span class="tok-comment">// ---- PASS A: one MRT pass fills the whole G-buffer ----</span>
    z.<span class="tok-fn">beginTextureModeMrtRaw</span>(f.gl, s.g_rts[<span class="tok-num">0</span>..], .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">0</span> });
    <span class="tok-kw">const</span> pa: *z.PassState = f.gl.pass;
    Backend.<span class="tok-fn">setPipeline</span>(pa, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.gbuffer_pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">1</span>, s.empty_bg);
    <span class="tok-kw">for</span> (&amp;s.objs) |*obj| {
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">0</span>, obj.g0_bg);
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">2</span>, obj.g2_bg);
        <span class="tok-fn">drawMesh</span>(pa, obj);
    }
    z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);

    <span class="tok-comment">// ---- PASS B (shading): render lighting into the RTT, OFFSCREEN ----</span>
    <span class="tok-kw">if</span> (s.mode == .shading) {
        z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.rt, .{ .r = <span class="tok-num">6</span>, .g = <span class="tok-num">7</span>, .b = <span class="tok-num">12</span>, .a = <span class="tok-num">255</span> });
        <span class="tok-kw">const</span> pb: *z.PassState = f.gl.pass;
        Backend.<span class="tok-fn">setPipeline</span>(pb, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.shading_pipeline });
        Backend.<span class="tok-fn">setBindGroup</span>(pb, <span class="tok-num">0</span>, s.empty_bg);
        Backend.<span class="tok-fn">setBindGroup</span>(pb, <span class="tok-num">1</span>, s.g1_bg);
        Backend.<span class="tok-fn">setBindGroup</span>(pb, <span class="tok-num">2</span>, s.lights_bg);
        z.render_pass.<span class="tok-fn">setVertexBuffer</span>(pb.pass, .{
            .slot = <span class="tok-num">0</span>,
            .buffer = s.fullscreen_vbo,
            .offset = <span class="tok-num">0</span>,
            .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(fullscreen_verts)),
        });
        z.render_pass.<span class="tok-fn">draw</span>(pb.pass, .{
            .vertex_count = <span class="tok-num">6</span>,
            .instance_count = <span class="tok-num">1</span>,
            .first_vertex = <span class="tok-num">0</span>,
            .first_instance = <span class="tok-num">0</span>,
        });
        z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);
    }

    <span class="tok-comment">// ---- SCREEN PASS: open once, composite the lit RTT or a raw G-buffer. ----</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">6</span>, .g = <span class="tok-num">7</span>, .b = <span class="tok-num">12</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">if</span> (s.mode == .shading) {
        f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh }, s.rt.<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    } <span class="tok-kw">else</span> {
        <span class="tok-comment">// Debug views: blit the raw map (values outside [0,1] clip on display).</span>
        <span class="tok-kw">const</span> which: usize = <span class="tok-kw">switch</span> (s.mode) {
            .position =&gt; <span class="tok-num">0</span>,
            .normal =&gt; <span class="tok-num">1</span>,
            <span class="tok-kw">else</span> =&gt; <span class="tok-num">2</span>,
        };
        f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh }, s.g_rts[which].<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    }

    <span class="tok-comment">// ---- UI first: its capture flag gates the orbit drag ----</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">280</span>, vw - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">190</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">182</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"deferred"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"lights"</span>, .{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"yellow"</span>, &amp;s.light_on[<span class="tok-num">0</span>]);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"red"</span>, &amp;s.light_on[<span class="tok-num">1</span>]);
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"green"</span>, &amp;s.light_on[<span class="tok-num">2</span>]);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"blue"</span>, &amp;s.light_on[<span class="tok-num">3</span>]);
        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"view: {s}"</span>, .{<span class="tok-builtin">@tagName</span>(s.mode)});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"position"</span>, .{})) {
            s.mode = .position;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"normal"</span>, .{})) {
            s.mode = .normal;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"albedo"</span>, .{})) {
            s.mode = .albedo;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"shading"</span>, .{})) {
            s.mode = .shading;
        }
    }
    <span class="tok-fn">handleInput</span>(f, s, u.<span class="tok-fn">wantCaptureMouse</span>());
    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - deferred rendering (MRT G-buffer)"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// G-buffer + lighting rendered offscreen before the screen opens</span>
    <span class="tok-comment">// (tile-based-GPU safe); owns its own begin/endDrawing.</span>
    .manages_own_frame = true,
    .memory = .managed,
};
