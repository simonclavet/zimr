<figure class="code src-file" data-path="examples/fluid_gpu/fluid_kernels.zig" data-lines="824"><figcaption><span>examples/fluid_gpu/fluid_kernels.zig</span><span>824 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! fluid_kernels.zig - the GPU fluid: Clavet/Beaudoin/Poulin (2005)</span>
<span class="tok-comment">//! double-density relaxation as a SEVEN-kernel kompute module. The same</span>
<span class="tok-comment">//! algorithm as examples/sph_fluid_2d (the CPU port), now running where</span>
<span class="tok-comment">//! it was born: 20k particles in compute shaders. Every kernel is the pure</span>
<span class="tok-comment">//! kompute DSL - the SAME Zig compiles to a CPU loop and to SPIR-V-&gt;WGSL.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! THE GRID, WITHOUT ATOMICS. The original WebGPU sim builds its uniform</span>
<span class="tok-comment">//! grid with `atomicAdd` slot-claiming; zimr's SPIR-V-&gt;WGSL path has no</span>
<span class="tok-comment">//! atomics yet (queued as a transpiler arc). Instead `buildGrid` runs one</span>
<span class="tok-comment">//! invocation PER CELL: each cell scans all N particles and sequentially</span>
<span class="tok-comment">//! fills its own row - no two invocations ever touch the same memory, so no</span>
<span class="tok-comment">//! races, and the kernel is bit-identical on CPU. cellsxN ~ 1.5kx20k = 30M</span>
<span class="tok-comment">//! reads/build; two builds per substep, two substeps - well within budget.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Per-substep order (mirrors the reference sim):</span>
<span class="tok-comment">//!   gravityMouse -&gt; buildGrid -&gt; viscosity -&gt; predict</span>
<span class="tok-comment">//!   -&gt; buildGrid -&gt; density -&gt; force -&gt; applyAndFinalize</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Units are PIXELS of the fixed sim domain (domain_w x domain_h), exactly</span>
<span class="tok-comment">//! the reference parameterisation. The renderer maps pixels -&gt; NDC.</span>
<span class="tok-kw">const</span> k = <span class="tok-builtin">@import</span>(<span class="tok-str">"kompute"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> dot = zm.dot;
<span class="tok-kw">const</span> length = zm.length;
<span class="tok-kw">const</span> splat2 = zm.splat2;
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> expect = std.testing.expect;
<span class="tok-kw">const</span> expectEqual = std.testing.expectEqual;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> num_particles: u32 = <span class="tok-num">20000</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> domain_w: f32 = <span class="tok-num">900.0</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> domain_h: f32 = <span class="tok-num">600.0</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> interact_radius: f32 = <span class="tok-num">22.0</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> max_per_cell: u32 = <span class="tok-num">64</span>;
<span class="tok-comment">// ceil(domain/h) + 2 boundary pad, matching the reference grid.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> grid_cols: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@ceil</span>(domain_w / interact_radius) + <span class="tok-num">2</span>);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> grid_rows: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@ceil</span>(domain_h / interact_radius) + <span class="tok-num">2</span>);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> grid_cells: u32 = grid_cols * grid_rows;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> config = k.Config{ .max = num_particles, .workgroup = <span class="tok-num">256</span> };

<span class="tok-comment">/// One storage buffer, the whole sim state. `pos` is FIRST: the renderer</span>
<span class="tok-comment">/// reads positions at offset 0 by instance_index (the DrawPoints contract).</span>
<span class="tok-comment">// Plain struct (not extern): Zig 1245 bans @Vector fields in extern structs on</span>
<span class="tok-comment">// CPU targets. The GPU binds each field by name via @extern on the SPIR-V target</span>
<span class="tok-comment">// (vectors legal there); the CPU twin (`g.B`) just needs the arrays for the</span>
<span class="tok-comment">// reference kernels. Per-field binding means struct layout is never used for the</span>
<span class="tok-comment">// GPU storage buffers, so dropping `extern` changes nothing on either side.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Buffers = <span class="tok-kw">struct</span> {
    pos: [num_particles]Vec2,
    prev: [num_particles]Vec2,
    vel: [num_particles]Vec2,
    delta: [num_particles]Vec2,
    <span class="tok-comment">/// (rho, rho_near) per particle - also read by the renderer for colour.</span>
    density: [num_particles]Vec2,
    grid_counts: [grid_cells]u32,
    grid_data: [grid_cells * max_per_cell]u32,
    <span class="tok-comment">/// Pos-in-grid (Stage 2c optim): the particle position for each grid slot,</span>
    <span class="tok-comment">/// written by buildGrid alongside grid_data. The neighbour search reads this</span>
    <span class="tok-comment">/// (contiguous per cell) instead of b_pos[grid_data[..]] (a RANDOM indirection</span>
    <span class="tok-comment">/// that kills warp coalescing). Same layout/stride as grid_data.</span>
    grid_data_pos: [grid_cells * max_per_cell]Vec2,
};

<span class="tok-comment">/// Scalar-field uniform (array pads break uniform layout - see the</span>
<span class="tok-comment">/// gpu-compute tutorial). 16 x 4B = 64B, a 16-multiple.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Params = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    count: u32,
    dt: f32,
    h: f32,
    r0: f32,
    k_far: f32,
    k_near: f32,
    gravity_y: f32,
    visc_beta: f32,
    mouse_x: f32,
    mouse_y: f32,
    <span class="tok-comment">/// Signed: &gt;0 repels, &lt;0 attracts, 0 idle.</span>
    mouse_force: f32,
    mouse_radius: f32,
    dom_w: f32,
    dom_h: f32,
    n_cols: u32,
    n_rows: u32,
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> g = k.<span class="tok-fn">Globals</span>(<span class="tok-builtin">@This</span>());
<span class="tok-comment">// Per-field storage bindings (t1178): one binding per array - the</span>
<span class="tok-comment">// megastruct single-binding corrupted on Adreno. `bind` returns a</span>
<span class="tok-comment">// pointer-to-array; indexing reads/writes through it directly.</span>
<span class="tok-kw">const</span> b_pos = g.<span class="tok-fn">bind</span>(.pos);
<span class="tok-kw">const</span> b_prev = g.<span class="tok-fn">bind</span>(.prev);
<span class="tok-kw">const</span> b_vel = g.<span class="tok-fn">bind</span>(.vel);
<span class="tok-kw">const</span> b_delta = g.<span class="tok-fn">bind</span>(.delta);
<span class="tok-kw">const</span> b_density = g.<span class="tok-fn">bind</span>(.density);
<span class="tok-kw">const</span> b_grid_counts = g.<span class="tok-fn">bind</span>(.grid_counts);
<span class="tok-kw">const</span> b_grid_data = g.<span class="tok-fn">bind</span>(.grid_data);
<span class="tok-kw">const</span> b_grid_data_pos = g.<span class="tok-fn">bind</span>(.grid_data_pos);

<span class="tok-comment">// ---- Tiled-density (Stage 2b) shared-memory scaffolding --------------------</span>
<span class="tok-comment">// One workgroup per grid cell; the workgroup cooperatively loads its 3x3</span>
<span class="tok-comment">// neighbourhood into a workgroup-shared tile ONCE, then every center particle</span>
<span class="tok-comment">// reads neighbours from the tile instead of re-reading global memory ~N_cell</span>
<span class="tok-comment">// times. `densityTiled` is an A/B alternative to `density` (toggle on host);</span>
<span class="tok-comment">// the per-particle `density` stays the default and the oracle.</span>
<span class="tok-kw">const</span> fluid_wg_size: u32 = <span class="tok-num">256</span>; <span class="tok-comment">// MUST equal config.workgroup</span>
<span class="tok-kw">const</span> tile_cap: u32 = <span class="tok-num">9</span> * max_per_cell; <span class="tok-comment">// 3x3 cells, each up to max_per_cell</span>
<span class="tok-kw">const</span> neighbour_offsets = [<span class="tok-num">9</span>][<span class="tok-num">2</span>]i32{
    .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, -<span class="tok-num">1</span> },
    .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span> },  .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },  .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> },
    .{ -<span class="tok-num">1</span>, <span class="tok-num">1</span> },  .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> },  .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> },
};
<span class="tok-kw">const</span> dtile_idx = k.<span class="tok-fn">shared</span>(u32, tile_cap, <span class="tok-str">"dtile_idx"</span>);
<span class="tok-kw">const</span> dtile_px = k.<span class="tok-fn">shared</span>(f32, tile_cap, <span class="tok-str">"dtile_px"</span>);
<span class="tok-kw">const</span> dtile_py = k.<span class="tok-fn">shared</span>(f32, tile_cap, <span class="tok-str">"dtile_py"</span>);

<span class="tok-comment">/// Per CELL (dispatch count = grid_cells): zero this cell's particle count.</span>
<span class="tok-comment">/// Must run BEFORE the per-particle buildGrid each substep (the atomic</span>
<span class="tok-comment">/// slot-claim accumulates into grid_counts, so it needs a clean start).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">clearGrid</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> cell: u32 = c.id;
    <span class="tok-kw">if</span> (cell &gt;= c.params.n_cols * c.params.n_rows) {
        <span class="tok-kw">return</span>;
    }
    k.<span class="tok-fn">atomicStore</span>(b_grid_counts, cell, <span class="tok-num">0</span>);
}

<span class="tok-comment">/// Per PARTICLE (dispatch count = particle count): each particle claims a slot</span>
<span class="tok-comment">/// in its cell via `atomicAdd` and writes its index there. O(N) - the parallel</span>
<span class="tok-comment">/// grid build that replaces the O(cellsxN) single-writer scan. The cell is</span>
<span class="tok-comment">/// computed the SAME way the neighbour passes look it up (floor(pos/h) clamped</span>
<span class="tok-comment">/// to the grid), so a particle lands in the cell its neighbours will search.</span>
<span class="tok-comment">/// Requires `clearGrid` to have zeroed grid_counts this substep.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">buildGrid</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> pos: Vec2 = b_pos[i];
    <span class="tok-kw">const</span> max_cx: f32 = <span class="tok-fn">float</span>(c.params.n_cols - <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> max_cy: f32 = <span class="tok-fn">float</span>(c.params.n_rows - <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> cx: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(<span class="tok-builtin">@floor</span>(pos[<span class="tok-num">0</span>] / c.params.h), <span class="tok-num">0.0</span>, max_cx));
    <span class="tok-kw">const</span> cy: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(<span class="tok-builtin">@floor</span>(pos[<span class="tok-num">1</span>] / c.params.h), <span class="tok-num">0.0</span>, max_cy));
    <span class="tok-kw">const</span> cell: u32 = cx + cy * c.params.n_cols;
    <span class="tok-comment">// Claim a slot: atomicAdd returns the count BEFORE the increment, which is</span>
    <span class="tok-comment">// this particle's unique index in the cell. Overflow past max_per_cell is</span>
    <span class="tok-comment">// dropped (the neighbour passes also clamp the read count to max_per_cell).</span>
    <span class="tok-kw">const</span> slot: u32 = k.<span class="tok-fn">atomicAdd</span>(b_grid_counts, cell, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (slot &lt; max_per_cell) {
        b_grid_data[cell * max_per_cell + slot] = i;
        <span class="tok-comment">// Pos-in-grid: stash the binning position in the slot so the neighbour</span>
        <span class="tok-comment">// passes can read it contiguously (no b_pos[j] random indirection).</span>
        b_grid_data_pos[cell * max_per_cell + slot] = pos;
    }
}

<span class="tok-comment">/// Per particle: gravity + the (signed) mouse impulse with linear falloff.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">gravityMouse</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">var</span> v: Vec2 = b_vel[i];
    v[<span class="tok-num">1</span>] = v[<span class="tok-num">1</span>] + c.params.gravity_y * c.params.dt;
    <span class="tok-kw">const</span> to_p: Vec2 = b_pos[i] - Vec2{ c.params.mouse_x, c.params.mouse_y };
    <span class="tok-kw">const</span> d: f32 = <span class="tok-fn">length</span>(to_p);
    <span class="tok-kw">if</span> (d &gt;= <span class="tok-num">0.5</span> <span class="tok-kw">and</span> d &lt; c.params.mouse_radius <span class="tok-kw">and</span> c.params.mouse_force != <span class="tok-num">0.0</span>) {
        <span class="tok-kw">const</span> falloff: f32 = <span class="tok-num">1.0</span> - d / c.params.mouse_radius;
        v = v + to_p * <span class="tok-fn">splat2</span>(c.params.mouse_force * falloff / d);
    }
    b_vel[i] = v;
}

<span class="tok-comment">/// Per particle: collision-style viscosity (t1178 redesign), gather form. Acts</span>
<span class="tok-comment">/// ONLY on approaching pairs (closing speed u &gt; 0); separating pairs get nothing.</span>
<span class="tok-comment">/// The impulse is QUADRATIC in u, then CLAMPED so it can at most bring the pair's</span>
<span class="tok-comment">/// radial relative motion to rest (u' = u - J &gt;= 0) - never a bounce, strictly</span>
<span class="tok-comment">/// dissipative, momentum-conserving (1/2 each). Distance weight is 1 inside h/2,</span>
<span class="tok-comment">/// ramping linearly to 0 at h. Runs pre-predict on the STALE grid (last frame's</span>
<span class="tok-comment">/// bins); the soft rim weight (-&gt;0 at h) absorbs the slight stale-grid drift.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">viscosity</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> my_pos: Vec2 = b_pos[i];
    <span class="tok-kw">var</span> my_vel: Vec2 = b_vel[i];
    <span class="tok-kw">const</span> ccx: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">0</span>] / c.params.h);
    <span class="tok-kw">const</span> ccy: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">1</span>] / c.params.h);
    <span class="tok-kw">var</span> dy: i32 = -<span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (dy &lt;= <span class="tok-num">1</span>) : (dy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> dx: i32 = -<span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (dx &lt;= <span class="tok-num">1</span>) : (dx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> nx: i32 = ccx + dx;
            <span class="tok-kw">const</span> ny: i32 = ccy + dy;
            <span class="tok-kw">if</span> (nx &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> ny &lt; <span class="tok-num">0</span>) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> unx: u32 = <span class="tok-builtin">@intCast</span>(nx);
            <span class="tok-kw">const</span> uny: u32 = <span class="tok-builtin">@intCast</span>(ny);
            <span class="tok-kw">if</span> (unx &gt;= c.params.n_cols <span class="tok-kw">or</span> uny &gt;= c.params.n_rows) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> cell: u32 = unx + uny * c.params.n_cols;
            <span class="tok-kw">const</span> raw_count: u32 = k.<span class="tok-fn">atomicLoad</span>(b_grid_counts, cell);
            <span class="tok-kw">const</span> in_cell: u32 = <span class="tok-kw">if</span> (raw_count &lt; max_per_cell) raw_count <span class="tok-kw">else</span> max_per_cell;
            <span class="tok-kw">var</span> s: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (s &lt; in_cell) : (s += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> j: u32 = b_grid_data[cell * max_per_cell + s];
                <span class="tok-kw">if</span> (j == i) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> sep: Vec2 = b_pos[j] - my_pos; <span class="tok-comment">// points i -&gt; j</span>
                <span class="tok-kw">const</span> dist: f32 = <span class="tok-fn">length</span>(sep);
                <span class="tok-kw">if</span> (dist &lt; <span class="tok-num">0.1</span> <span class="tok-kw">or</span> dist &gt;= c.params.h) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> n: Vec2 = sep * <span class="tok-fn">splat2</span>(<span class="tok-num">1.0</span> / dist);
                <span class="tok-comment">// closing (penetrating) speed: &gt; 0 &lt;=&gt; the pair is approaching</span>
                <span class="tok-kw">const</span> u: f32 = <span class="tok-fn">dot</span>(my_vel - b_vel[j], n);
                <span class="tok-kw">if</span> (u &lt;= <span class="tok-num">0.0</span>) {
                    <span class="tok-kw">continue</span>; <span class="tok-comment">// separating -&gt; no viscosity</span>
                }
                <span class="tok-comment">// distance weight: 1 inside h/2, linear -&gt; 0 at h</span>
                <span class="tok-kw">const</span> w_lin: f32 = <span class="tok-num">2.0</span> * (<span class="tok-num">1.0</span> - dist / c.params.h);
                <span class="tok-kw">const</span> w: f32 = <span class="tok-kw">if</span> (w_lin &lt; <span class="tok-num">1.0</span>) w_lin <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
                <span class="tok-comment">// quadratic in u, then clamp to u so the pair AT MOST stops</span>
                <span class="tok-comment">// (u' = u - imp &gt;= 0): never bounce, strictly dissipative; 1/2 each.</span>
                <span class="tok-kw">const</span> imp_raw: f32 = c.params.visc_beta * w * u * u;
                <span class="tok-kw">const</span> imp: f32 = <span class="tok-kw">if</span> (imp_raw &lt; u) imp_raw <span class="tok-kw">else</span> u;
                my_vel = my_vel - n * <span class="tok-fn">splat2</span>(<span class="tok-num">0.5</span> * imp);
            }
        }
    }
    b_vel[i] = my_vel;
}

<span class="tok-comment">/// Per particle: save prev, advance by vel*dt (the prediction half of</span>
<span class="tok-comment">/// Clavet's prediction-relaxation).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">predict</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> p: Vec2 = b_pos[i];
    b_prev[i] = p;
    b_pos[i] = p + b_vel[i] * <span class="tok-fn">splat2</span>(c.params.dt);
}

<span class="tok-kw">inline</span> <span class="tok-kw">fn</span> <span class="tok-fn">densityCore</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>()), <span class="tok-kw">comptime</span> pig: bool) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> my_pos: Vec2 = b_pos[i];
    <span class="tok-kw">var</span> rho: f32 = <span class="tok-num">0.0</span>;
    <span class="tok-kw">var</span> rho_near: f32 = <span class="tok-num">0.0</span>;
    <span class="tok-kw">const</span> ccx: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">0</span>] / c.params.h);
    <span class="tok-kw">const</span> ccy: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">1</span>] / c.params.h);
    <span class="tok-kw">var</span> dy: i32 = -<span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (dy &lt;= <span class="tok-num">1</span>) : (dy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> dx: i32 = -<span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (dx &lt;= <span class="tok-num">1</span>) : (dx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> nx: i32 = ccx + dx;
            <span class="tok-kw">const</span> ny: i32 = ccy + dy;
            <span class="tok-kw">if</span> (nx &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> ny &lt; <span class="tok-num">0</span>) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> unx: u32 = <span class="tok-builtin">@intCast</span>(nx);
            <span class="tok-kw">const</span> uny: u32 = <span class="tok-builtin">@intCast</span>(ny);
            <span class="tok-kw">if</span> (unx &gt;= c.params.n_cols <span class="tok-kw">or</span> uny &gt;= c.params.n_rows) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> cell: u32 = unx + uny * c.params.n_cols;
            <span class="tok-kw">const</span> raw_count: u32 = k.<span class="tok-fn">atomicLoad</span>(b_grid_counts, cell);
            <span class="tok-kw">const</span> in_cell: u32 = <span class="tok-kw">if</span> (raw_count &lt; max_per_cell) raw_count <span class="tok-kw">else</span> max_per_cell;
            <span class="tok-kw">var</span> s: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (s &lt; in_cell) : (s += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> j: u32 = b_grid_data[cell * max_per_cell + s];
                <span class="tok-kw">if</span> (j == i) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> npos: Vec2 = <span class="tok-kw">if</span> (pig) b_grid_data_pos[cell * max_per_cell + s] <span class="tok-kw">else</span> b_pos[j];
                <span class="tok-kw">const</span> sep: Vec2 = npos - my_pos;
                <span class="tok-kw">const</span> d2: f32 = <span class="tok-fn">dot</span>(sep, sep);
                <span class="tok-kw">if</span> (d2 &lt; c.params.h * c.params.h) {
                    <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(d2);
                    <span class="tok-kw">const</span> omq: f32 = <span class="tok-num">1.0</span> - dist / c.params.h;
                    rho += omq * omq;
                    rho_near += omq * omq * omq;
                }
            }
        }
    }
    b_density[i] = .{ rho, rho_near };
}

<span class="tok-comment">/// Per particle: rho = sum(1-q)^2, rho_near = sum(1-q)^3 over the 3x3 neighbourhood.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">density</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-fn">densityCore</span>(c, false);
}

<span class="tok-comment">/// Pos-in-grid variant of `density`: reads neighbour positions from</span>
<span class="tok-comment">/// grid_data_pos (contiguous per cell) instead of b_pos[j] (random). Same math.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">densityPig</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-fn">densityCore</span>(c, true);
}

<span class="tok-comment">/// Cooperatively load `cell`'s 3x3 neighbourhood (index + position) into the</span>
<span class="tok-comment">/// shared tile; return tile_len. `noinline` so spv2wgsl keeps it a SEPARATE</span>
<span class="tok-comment">/// WGSL function - its cell-dependent `if (in_bounds)` branches then stay</span>
<span class="tok-comment">/// inside it and do NOT enclose the workgroupBarrier that `densityTiled`</span>
<span class="tok-comment">/// issues after the call (Tint rejects a barrier inside control flow that</span>
<span class="tok-comment">/// depends on a c.id-derived cell index; the helper keeps the barrier at the</span>
<span class="tok-comment">/// kernel's top level). fluid_wg_size &gt;= max_per_cell, so each lane loads</span>
<span class="tok-comment">/// exactly slot `lid` of each cell - straight-line, no inner loop.</span>
<span class="tok-kw">noinline</span> <span class="tok-kw">fn</span> <span class="tok-fn">loadDensityTile</span>(cell: u32, lid: u32, cols: u32, rows: u32) u32 {
    <span class="tok-kw">const</span> cx: i32 = <span class="tok-builtin">@intCast</span>(cell % cols);
    <span class="tok-kw">const</span> cy: i32 = <span class="tok-builtin">@intCast</span>(cell / cols);
    <span class="tok-kw">var</span> off: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (neighbour_offsets) |d| {
        <span class="tok-kw">const</span> nx: i32 = cx + d[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> ny: i32 = cy + d[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> in_bounds: bool = nx &gt;= <span class="tok-num">0</span> <span class="tok-kw">and</span> ny &gt;= <span class="tok-num">0</span> <span class="tok-kw">and</span>
            nx &lt; <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(cols)) <span class="tok-kw">and</span> ny &lt; <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(rows));
        <span class="tok-kw">if</span> (in_bounds) {
            <span class="tok-kw">const</span> ncell: u32 = <span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(nx)) + <span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(ny)) * cols;
            <span class="tok-kw">const</span> raw: u32 = k.<span class="tok-fn">atomicLoad</span>(b_grid_counts, ncell);
            <span class="tok-kw">const</span> cnt: u32 = <span class="tok-kw">if</span> (raw &lt; max_per_cell) raw <span class="tok-kw">else</span> max_per_cell;
            <span class="tok-kw">if</span> (lid &lt; cnt) {
                <span class="tok-kw">const</span> dst: u32 = off + lid;
                <span class="tok-kw">if</span> (dst &lt; tile_cap) {
                    <span class="tok-kw">const</span> idx: u32 = b_grid_data[ncell * max_per_cell + lid];
                    dtile_idx[dst] = idx;
                    dtile_px[dst] = b_pos[idx][<span class="tok-num">0</span>];
                    dtile_py[dst] = b_pos[idx][<span class="tok-num">1</span>];
                }
            }
            off += cnt;
        }
    }
    <span class="tok-kw">return</span> <span class="tok-kw">if</span> (off &lt; tile_cap) off <span class="tok-kw">else</span> tile_cap;
}

<span class="tok-comment">/// A/B alternative to `density`: one workgroup per cell, shared-memory tile.</span>
<span class="tok-comment">/// Same double-density math, same neighbour set, ~N_cell-fold fewer global</span>
<span class="tok-comment">/// reads of b_pos (load the 3x3 region once, gather from the tile). Dispatch</span>
<span class="tok-comment">/// per-cell: host sets count = grid_cells * fluid_wg_size. The CPU branch is</span>
<span class="tok-comment">/// the per-particle global gather (identical to `density`) so the oracle test</span>
<span class="tok-comment">/// can compare them; only the GPU branch is the tiled path.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">densityTiled</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">if</span> (k.is_gpu) {
        <span class="tok-kw">const</span> cell: u32 = c.id / fluid_wg_size;
        <span class="tok-kw">const</span> lid: u32 = c.id % fluid_wg_size;
        <span class="tok-kw">const</span> tile_len: u32 = <span class="tok-fn">loadDensityTile</span>(cell, lid, c.params.n_cols, c.params.n_rows);
        k.<span class="tok-fn">workgroupBarrier</span>();
        <span class="tok-kw">const</span> raw: u32 = k.<span class="tok-fn">atomicLoad</span>(b_grid_counts, cell);
        <span class="tok-kw">const</span> cnt: u32 = <span class="tok-kw">if</span> (raw &lt; max_per_cell) raw <span class="tok-kw">else</span> max_per_cell;
        <span class="tok-kw">if</span> (lid &lt; cnt) {
            <span class="tok-kw">const</span> i: u32 = b_grid_data[cell * max_per_cell + lid];
            <span class="tok-kw">const</span> mx: f32 = b_pos[i][<span class="tok-num">0</span>];
            <span class="tok-kw">const</span> my: f32 = b_pos[i][<span class="tok-num">1</span>];
            <span class="tok-kw">var</span> rho: f32 = <span class="tok-num">0.0</span>;
            <span class="tok-kw">var</span> rho_near: f32 = <span class="tok-num">0.0</span>;
            <span class="tok-kw">var</span> t: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (t &lt; tile_len) : (t += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> j: u32 = dtile_idx[t];
                <span class="tok-kw">if</span> (j != i) {
                    <span class="tok-kw">const</span> sx: f32 = dtile_px[t] - mx;
                    <span class="tok-kw">const</span> sy: f32 = dtile_py[t] - my;
                    <span class="tok-kw">const</span> d2: f32 = sx * sx + sy * sy;
                    <span class="tok-kw">if</span> (d2 &lt; c.params.h * c.params.h) {
                        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(d2);
                        <span class="tok-kw">const</span> omq: f32 = <span class="tok-num">1.0</span> - dist / c.params.h;
                        rho += omq * omq;
                        rho_near += omq * omq * omq;
                    }
                }
            }
            b_density[i] = .{ rho, rho_near };
        }
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">const</span> i: u32 = c.id;
        <span class="tok-kw">if</span> (i &gt;= c.params.count) {
            <span class="tok-kw">return</span>;
        }
        <span class="tok-kw">const</span> my_pos: Vec2 = b_pos[i];
        <span class="tok-kw">var</span> rho: f32 = <span class="tok-num">0.0</span>;
        <span class="tok-kw">var</span> rho_near: f32 = <span class="tok-num">0.0</span>;
        <span class="tok-kw">const</span> ccx: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">0</span>] / c.params.h);
        <span class="tok-kw">const</span> ccy: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">1</span>] / c.params.h);
        <span class="tok-kw">var</span> dy: i32 = -<span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (dy &lt;= <span class="tok-num">1</span>) : (dy += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> dx: i32 = -<span class="tok-num">1</span>;
            <span class="tok-kw">while</span> (dx &lt;= <span class="tok-num">1</span>) : (dx += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> nx: i32 = ccx + dx;
                <span class="tok-kw">const</span> ny: i32 = ccy + dy;
                <span class="tok-kw">if</span> (nx &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> ny &lt; <span class="tok-num">0</span>) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> unx: u32 = <span class="tok-builtin">@intCast</span>(nx);
                <span class="tok-kw">const</span> uny: u32 = <span class="tok-builtin">@intCast</span>(ny);
                <span class="tok-kw">if</span> (unx &gt;= c.params.n_cols <span class="tok-kw">or</span> uny &gt;= c.params.n_rows) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> cell: u32 = unx + uny * c.params.n_cols;
                <span class="tok-kw">const</span> raw_count: u32 = k.<span class="tok-fn">atomicLoad</span>(b_grid_counts, cell);
                <span class="tok-kw">const</span> in_cell: u32 = <span class="tok-kw">if</span> (raw_count &lt; max_per_cell) raw_count <span class="tok-kw">else</span> max_per_cell;
                <span class="tok-kw">var</span> s: u32 = <span class="tok-num">0</span>;
                <span class="tok-kw">while</span> (s &lt; in_cell) : (s += <span class="tok-num">1</span>) {
                    <span class="tok-kw">const</span> j: u32 = b_grid_data[cell * max_per_cell + s];
                    <span class="tok-kw">if</span> (j == i) {
                        <span class="tok-kw">continue</span>;
                    }
                    <span class="tok-kw">const</span> sep: Vec2 = b_pos[j] - my_pos;
                    <span class="tok-kw">const</span> d2: f32 = <span class="tok-fn">dot</span>(sep, sep);
                    <span class="tok-kw">if</span> (d2 &lt; c.params.h * c.params.h) {
                        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(d2);
                        <span class="tok-kw">const</span> omq: f32 = <span class="tok-num">1.0</span> - dist / c.params.h;
                        rho += omq * omq;
                        rho_near += omq * omq * omq;
                    }
                }
            }
        }
        b_density[i] = .{ rho, rho_near };
    }
}

<span class="tok-kw">inline</span> <span class="tok-kw">fn</span> <span class="tok-fn">forceCore</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>()), <span class="tok-kw">comptime</span> pig: bool) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> my_pos: Vec2 = b_pos[i];
    <span class="tok-kw">const</span> my_d: Vec2 = b_density[i];
    <span class="tok-kw">const</span> my_press: f32 = c.params.k_far * (my_d[<span class="tok-num">0</span>] - c.params.r0);
    <span class="tok-kw">const</span> my_near: f32 = c.params.k_near * my_d[<span class="tok-num">1</span>];
    <span class="tok-kw">var</span> corr: Vec2 = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.0</span> };
    <span class="tok-comment">// Pressure-only (Clavet double-density relaxation). Viscosity is now a</span>
    <span class="tok-comment">// SEPARATE pre-predict pass (`viscosity`) on the stale grid - moving it out</span>
    <span class="tok-comment">// of here restores the paper's apply-viscosity-then-predict ordering, which</span>
    <span class="tok-comment">// is more stable (and lets the sim take a larger dt).</span>
    <span class="tok-kw">const</span> ccx: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">0</span>] / c.params.h);
    <span class="tok-kw">const</span> ccy: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">1</span>] / c.params.h);
    <span class="tok-kw">var</span> dy: i32 = -<span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (dy &lt;= <span class="tok-num">1</span>) : (dy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> dx: i32 = -<span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (dx &lt;= <span class="tok-num">1</span>) : (dx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> nx: i32 = ccx + dx;
            <span class="tok-kw">const</span> ny: i32 = ccy + dy;
            <span class="tok-kw">if</span> (nx &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> ny &lt; <span class="tok-num">0</span>) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> unx: u32 = <span class="tok-builtin">@intCast</span>(nx);
            <span class="tok-kw">const</span> uny: u32 = <span class="tok-builtin">@intCast</span>(ny);
            <span class="tok-kw">if</span> (unx &gt;= c.params.n_cols <span class="tok-kw">or</span> uny &gt;= c.params.n_rows) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> cell: u32 = unx + uny * c.params.n_cols;
            <span class="tok-kw">const</span> raw_count: u32 = k.<span class="tok-fn">atomicLoad</span>(b_grid_counts, cell);
            <span class="tok-kw">const</span> in_cell: u32 = <span class="tok-kw">if</span> (raw_count &lt; max_per_cell) raw_count <span class="tok-kw">else</span> max_per_cell;
            <span class="tok-kw">var</span> s: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (s &lt; in_cell) : (s += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> j: u32 = b_grid_data[cell * max_per_cell + s];
                <span class="tok-kw">if</span> (j == i) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> npos: Vec2 = <span class="tok-kw">if</span> (pig) b_grid_data_pos[cell * max_per_cell + s] <span class="tok-kw">else</span> b_pos[j];
                <span class="tok-kw">const</span> rel: Vec2 = npos - my_pos;
                <span class="tok-kw">const</span> d2: f32 = <span class="tok-fn">dot</span>(rel, rel);
                <span class="tok-kw">if</span> (d2 &gt;= c.params.h * c.params.h) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(d2);
                <span class="tok-comment">// Co-location fallback: antisymmetric cardinal direction so</span>
                <span class="tok-comment">// the pair always separates instead of NaN-ing.</span>
                <span class="tok-kw">var</span> dir: Vec2 = undefined;
                <span class="tok-kw">if</span> (dist &gt; <span class="tok-num">0.5</span>) {
                    dir = rel * <span class="tok-fn">splat2</span>(<span class="tok-num">1.0</span> / dist);
                } <span class="tok-kw">else</span> {
                    dir = .{ <span class="tok-kw">if</span> (i &lt; j) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> -<span class="tok-num">1.0</span>, <span class="tok-num">0.0</span> };
                }
                <span class="tok-kw">const</span> omq: f32 = <span class="tok-num">1.0</span> - dist / c.params.h;
                <span class="tok-kw">const</span> jd: Vec2 = b_density[j];
                <span class="tok-kw">const</span> j_press: f32 = c.params.k_far * (jd[<span class="tok-num">0</span>] - c.params.r0);
                <span class="tok-kw">const</span> j_near: f32 = c.params.k_near * jd[<span class="tok-num">1</span>];
                <span class="tok-kw">const</span> disp: f32 = <span class="tok-num">0.5</span> * c.params.dt * c.params.dt *
                    ((my_press + j_press) * omq + (my_near + j_near) * omq * omq);
                corr = corr - dir * <span class="tok-fn">splat2</span>(disp);
            }
        }
    }
    b_delta[i] = corr;
}

<span class="tok-comment">/// Per particle: the double-density displacement (Clavet Alg. 2, symmetric</span>
<span class="tok-comment">/// gather - sum both pressures, write only your own delta; no atomics).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">force</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-fn">forceCore</span>(c, false);
}

<span class="tok-comment">/// Pos-in-grid variant of `force`: reads neighbour positions from grid_data_pos</span>
<span class="tok-comment">/// (contiguous) instead of b_pos[j] (random). Neighbour density/velocity reads</span>
<span class="tok-comment">/// stay scattered (not in the grid), so this coalesces 1 of force's 3 reads.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">forcePig</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-fn">forceCore</span>(c, true);
}

<span class="tok-comment">/// Per particle: apply the correction, clamp to the domain, recompute</span>
<span class="tok-comment">/// velocity from displacement (absorbing every position edit), speed-cap.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">applyAndFinalize</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">var</span> p: Vec2 = b_pos[i] + b_delta[i];
    <span class="tok-comment">// ---- Boundary handling (corner-explosion fix) ----</span>
    <span class="tok-comment">// A naive independent-axis clamp drives every corner particle onto the</span>
    <span class="tok-comment">// EXACT corner point (both axes pinned), so several particles overlap at</span>
    <span class="tok-comment">// dist~0 -&gt; the near-density term (1-r/h)^3 spikes -&gt; explosive repulsion.</span>
    <span class="tok-comment">// Instead: a SOFT inward push that ramps up over a margin band (so density</span>
    <span class="tok-comment">// stays smooth near walls), plus a hard safety clamp with a tiny</span>
    <span class="tok-comment">// index-derived jitter ALONG each wall to break exact coincidence in the</span>
    <span class="tok-comment">// worst case. The jitter is sub-particle-radius so it doesn't perturb the</span>
    <span class="tok-comment">// bulk fluid.</span>
    <span class="tok-kw">const</span> band: f32 = c.params.h; <span class="tok-comment">// push starts one interaction radius from a wall</span>
    <span class="tok-kw">const</span> push: f32 = <span class="tok-num">0.25</span>; <span class="tok-comment">// fraction of the overshoot corrected per substep</span>
    <span class="tok-comment">// Left / right walls.</span>
    <span class="tok-kw">if</span> (p[<span class="tok-num">0</span>] &lt; band) {
        p[<span class="tok-num">0</span>] += (band - p[<span class="tok-num">0</span>]) * push;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (p[<span class="tok-num">0</span>] &gt; c.params.dom_w - band) {
        p[<span class="tok-num">0</span>] -= (p[<span class="tok-num">0</span>] - (c.params.dom_w - band)) * push;
    }
    <span class="tok-comment">// Top / bottom walls.</span>
    <span class="tok-kw">if</span> (p[<span class="tok-num">1</span>] &lt; band) {
        p[<span class="tok-num">1</span>] += (band - p[<span class="tok-num">1</span>]) * push;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (p[<span class="tok-num">1</span>] &gt; c.params.dom_h - band) {
        p[<span class="tok-num">1</span>] -= (p[<span class="tok-num">1</span>] - (c.params.dom_h - band)) * push;
    }
    <span class="tok-comment">// Hard safety clamp with a small jitter parallel to each wall, so two</span>
    <span class="tok-comment">// particles forced to the same wall/corner do not land on one point.</span>
    <span class="tok-kw">const</span> margin: f32 = <span class="tok-num">1.5</span>;
    <span class="tok-kw">const</span> jitter: f32 = <span class="tok-fn">float</span>(i % <span class="tok-num">7</span>) * <span class="tok-num">0.3</span>; <span class="tok-comment">// 0..1.8 px, sub-radius</span>
    <span class="tok-kw">const</span> lo_x: f32 = margin + jitter;
    <span class="tok-kw">const</span> hi_x: f32 = c.params.dom_w - margin - jitter;
    <span class="tok-kw">const</span> lo_y: f32 = margin + jitter;
    <span class="tok-kw">const</span> hi_y: f32 = c.params.dom_h - margin - jitter;
    p[<span class="tok-num">0</span>] = <span class="tok-fn">clamp</span>(p[<span class="tok-num">0</span>], lo_x, hi_x);
    p[<span class="tok-num">1</span>] = <span class="tok-fn">clamp</span>(p[<span class="tok-num">1</span>], lo_y, hi_y);
    b_pos[i] = p;
    <span class="tok-kw">var</span> v: Vec2 = (p - b_prev[i]) * <span class="tok-fn">splat2</span>(<span class="tok-num">1.0</span> / c.params.dt);
    <span class="tok-kw">const</span> speed: f32 = <span class="tok-fn">length</span>(v);
    <span class="tok-kw">const</span> max_speed: f32 = <span class="tok-num">40.0</span>;
    <span class="tok-kw">if</span> (speed &gt; max_speed) {
        v = v * <span class="tok-fn">splat2</span>(max_speed / speed);
    }
    b_vel[i] = v;
}

<span class="tok-comment">/// Simple-mode kernel (the "simple" UI toggle): gravity + integrate + wall</span>
<span class="tok-comment">/// bounce on a single particle's own four floats - no grid, no neighbours, no</span>
<span class="tok-comment">/// cross-particle reads. A non-SPH sanity mode; if even this misbehaves the</span>
<span class="tok-comment">/// fault is in the primitive dispatch/storage path, not the fluid math.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">fallBounceLean</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">var</span> p: Vec2 = b_pos[i];
    <span class="tok-kw">var</span> v: Vec2 = b_vel[i];
    v[<span class="tok-num">1</span>] = v[<span class="tok-num">1</span>] + c.params.gravity_y * c.params.dt;
    p = p + v * <span class="tok-fn">splat2</span>(c.params.dt);
    <span class="tok-kw">const</span> r: f32 = <span class="tok-num">5.5</span>;
    <span class="tok-kw">if</span> (p[<span class="tok-num">0</span>] &lt; r) {
        p[<span class="tok-num">0</span>] = r;
        v[<span class="tok-num">0</span>] = -v[<span class="tok-num">0</span>] * <span class="tok-num">0.85</span>;
    }
    <span class="tok-kw">if</span> (p[<span class="tok-num">0</span>] &gt; c.params.dom_w - r) {
        p[<span class="tok-num">0</span>] = c.params.dom_w - r;
        v[<span class="tok-num">0</span>] = -v[<span class="tok-num">0</span>] * <span class="tok-num">0.85</span>;
    }
    <span class="tok-kw">if</span> (p[<span class="tok-num">1</span>] &lt; r) {
        p[<span class="tok-num">1</span>] = r;
        v[<span class="tok-num">1</span>] = -v[<span class="tok-num">1</span>] * <span class="tok-num">0.85</span>;
    }
    <span class="tok-kw">if</span> (p[<span class="tok-num">1</span>] &gt; c.params.dom_h - r) {
        p[<span class="tok-num">1</span>] = c.params.dom_h - r;
        v[<span class="tok-num">1</span>] = -v[<span class="tok-num">1</span>] * <span class="tok-num">0.85</span>;
    }
    b_pos[i] = p;
    b_vel[i] = v;
}

<span class="tok-comment">// CPU oracle for the per-particle atomic grid build. The CPU twin runs the</span>
<span class="tok-comment">// REAL @atomicRmw (kompute's atomicAdd on the native target), so this verifies</span>
<span class="tok-comment">// the parallel buildGrid algorithm independent of the GPU: clearGrid zeroes the</span>
<span class="tok-comment">// counts, buildGrid claims a slot per particle, and the resulting grid must be</span>
<span class="tok-comment">// well-formed (counts sum to N, no overflow, every particle in its own cell).</span>
<span class="tok-comment">// Run on demand:</span>
<span class="tok-comment">//   zig test --dep fluid_kernels --dep zm -Mroot=&lt;this file via a shim&gt; ...</span>
<span class="tok-comment">// (also typechecked as part of the example compile.)</span>
<span class="tok-kw">test</span> <span class="tok-str">"buildGrid per-particle CPU oracle: grid well-formed"</span> {
    <span class="tok-kw">const</span> N: u32 = <span class="tok-num">2000</span>;
    <span class="tok-kw">const</span> h: f32 = interact_radius;
    <span class="tok-kw">const</span> params: Params = .{
        .count = N,
        .dt = <span class="tok-num">1.0</span>,
        .h = h,
        .r0 = <span class="tok-num">10.0</span>,
        .k_far = <span class="tok-num">0.004</span>,
        .k_near = <span class="tok-num">0.01</span>,
        .gravity_y = <span class="tok-num">0.05</span>,
        .visc_beta = <span class="tok-num">0.1</span>,
        .mouse_x = <span class="tok-num">0</span>,
        .mouse_y = <span class="tok-num">0</span>,
        .mouse_force = <span class="tok-num">0</span>,
        .mouse_radius = <span class="tok-num">100</span>,
        .dom_w = domain_w,
        .dom_h = domain_h,
        .n_cols = grid_cols,
        .n_rows = grid_rows,
    };
    <span class="tok-kw">var</span> rng: std.Random.DefaultPrng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0xC0FFEE</span>);
    <span class="tok-kw">const</span> r: std.Random = rng.<span class="tok-fn">random</span>();
    <span class="tok-kw">var</span> p: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (p &lt; N) : (p += <span class="tok-num">1</span>) {
        g.B.pos[p] = .{ r.<span class="tok-fn">float</span>(f32) * domain_w, r.<span class="tok-fn">float</span>(f32) * domain_h };
    }
    <span class="tok-kw">var</span> cell: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (cell &lt; grid_cols * grid_rows) : (cell += <span class="tok-num">1</span>) {
        <span class="tok-fn">clearGrid</span>(.{ .id = cell, .params = params });
    }
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; N) : (i += <span class="tok-num">1</span>) {
        <span class="tok-fn">buildGrid</span>(.{ .id = i, .params = params });
    }
    <span class="tok-kw">var</span> total: u32 = <span class="tok-num">0</span>;
    cell = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (cell &lt; grid_cols * grid_rows) : (cell += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> cnt: u32 = g.B.grid_counts[cell];
        <span class="tok-kw">try</span> <span class="tok-fn">expect</span>(cnt &lt;= max_per_cell);
        total += cnt;
    }
    <span class="tok-kw">try</span> <span class="tok-fn">expectEqual</span>(N, total);
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; N) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> pos: Vec2 = g.B.pos[i];
        <span class="tok-kw">const</span> mcx: f32 = <span class="tok-fn">float</span>(grid_cols - <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> mcy: f32 = <span class="tok-fn">float</span>(grid_rows - <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> cx: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(<span class="tok-builtin">@floor</span>(pos[<span class="tok-num">0</span>] / h), <span class="tok-num">0.0</span>, mcx));
        <span class="tok-kw">const</span> cy: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(<span class="tok-builtin">@floor</span>(pos[<span class="tok-num">1</span>] / h), <span class="tok-num">0.0</span>, mcy));
        <span class="tok-kw">const</span> c: u32 = cx + cy * grid_cols;
        <span class="tok-kw">const</span> cnt: u32 = g.B.grid_counts[c];
        <span class="tok-kw">var</span> found: bool = false;
        <span class="tok-kw">var</span> s: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (s &lt; cnt) : (s += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (g.B.grid_data[c * max_per_cell + s] == i) {
                found = true;
                <span class="tok-kw">break</span>;
            }
        }
        <span class="tok-kw">try</span> <span class="tok-fn">expect</span>(found);
    }
}

<span class="tok-comment">// densityTiled's CPU branch is the per-particle global gather (the same</span>
<span class="tok-comment">// neighbour set as `density`), so on the CPU the two MUST produce identical</span>
<span class="tok-comment">// b_density. This guards the CPU oracle path (the GPU tiled path is proven</span>
<span class="tok-comment">// separately by the tile_smoke device test + naga). Build a grid, run</span>
<span class="tok-comment">// `density` for every particle, snapshot, then run `densityTiled` and compare.</span>
<span class="tok-kw">test</span> <span class="tok-str">"densityTiled CPU oracle matches density"</span> {

        .r0 = <span class="tok-num">10.0</span>,
        .k_far = <span class="tok-num">0.004</span>,
        .k_near = <span class="tok-num">0.01</span>,
        .gravity_y = <span class="tok-num">0.05</span>,
        .visc_beta = <span class="tok-num">0.1</span>,
        .mouse_x = <span class="tok-num">0</span>,
        .mouse_y = <span class="tok-num">0</span>,
        .mouse_force = <span class="tok-num">0</span>,
        .mouse_radius = <span class="tok-num">100</span>,
        .dom_w = domain_w,
        .dom_h = domain_h,
        .n_cols = grid_cols,
        .n_rows = grid_rows,
    };
    <span class="tok-kw">var</span> rng: std.Random.DefaultPrng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0xBADF00D</span>);
    <span class="tok-kw">const</span> r: std.Random = rng.<span class="tok-fn">random</span>();
    <span class="tok-kw">var</span> p: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (p &lt; N) : (p += <span class="tok-num">1</span>) {
        g.B.pos[p] = .{ r.<span class="tok-fn">float</span>(f32) * domain_w, r.<span class="tok-fn">float</span>(f32) * domain_h };
    }
    <span class="tok-kw">var</span> cell: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (cell &lt; grid_cols * grid_rows) : (cell += <span class="tok-num">1</span>) {
        <span class="tok-fn">clearGrid</span>(.{ .id = cell, .params = params });
    }
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;

    i = <span class="tok-num">0</span>;

        <span class="tok-fn">density</span>(.{ .id = i, .params = params });
    }
    <span class="tok-kw">var</span> ref: [num_particles]Vec2 = undefined;
    i = <span class="tok-num">0</span>;

        ref[i] = g.B.density[i];
    }
    <span class="tok-comment">// Candidate: densityTiled (CPU branch).</span>
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; N) : (i += <span class="tok-num">1</span>) {
