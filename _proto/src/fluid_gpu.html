<h1>fluid_gpu</h1>
<figure class="code src-file" data-path="examples/fluid_gpu/fluid_gpu.zig" data-lines="883"><figcaption><span>examples/fluid_gpu/fluid_gpu.zig</span><span>883 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! fluid_gpu - 20,000-particle Clavet fluid, ENTIRELY on the GPU.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The arc closes: examples/sph_fluid_2d ported the algorithm to a CPU</span>
<span class="tok-comment">//! loop because the GL backend had no compute. This is the same paper running</span>
<span class="tok-comment">//! where it belongs - seven kompute kernels (fluid_kernels.zig), each</span>
<span class="tok-comment">//! translated once to its own WGSL module (spv2wgsl --entry, the t1178</span>
<span class="tok-comment">//! multi-kernel path), dispatched through ONE `z.Compute` pipe, rendered</span>
<span class="tok-comment">//! zero-copy by `z.FluidDiscs` straight from the compute storage buffer.</span>
<span class="tok-comment">//! Positions never visit the CPU.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Per frame: 1 substep x 7 dispatches (gravityMouse -&gt; buildGrid -&gt;</span>
<span class="tok-comment">//! viscosity -&gt; predict -&gt; buildGrid -&gt; density -&gt; force -&gt; applyAndFinalize),</span>
<span class="tok-comment">//! then one instanced draw of N SDF discs coloured by density.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Controls: drag = push, shift+drag (or the toggle) = pull; sliders for the</span>
<span class="tok-comment">//! paper's four knobs; reset = dam-break.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float64 = zm.float64;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> fk = <span class="tok-builtin">@import</span>(<span class="tok-str">"fluid_kernels.zig"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> buildGrid_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"buildGrid_wgsl"</span>);
<span class="tok-kw">const</span> clearGrid_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"clearGrid_wgsl"</span>);
<span class="tok-kw">const</span> gravityMouse_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"gravityMouse_wgsl"</span>);
<span class="tok-kw">const</span> viscosity_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"viscosity_wgsl"</span>);
<span class="tok-kw">const</span> predict_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"predict_wgsl"</span>);
<span class="tok-kw">const</span> density_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"density_wgsl"</span>);
<span class="tok-kw">const</span> densityTiled_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"densityTiled_wgsl"</span>);
<span class="tok-kw">const</span> densityPig_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"densityPig_wgsl"</span>);
<span class="tok-kw">const</span> force_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"force_wgsl"</span>);
<span class="tok-kw">const</span> forcePig_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"forcePig_wgsl"</span>);
<span class="tok-kw">const</span> applyAndFinalize_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"applyAndFinalize_wgsl"</span>);
<span class="tok-kw">const</span> fallBounceLean_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"fallBounceLean_wgsl"</span>);

<span class="tok-kw">const</span> substeps: u32 = <span class="tok-num">1</span>;
<span class="tok-comment">/// Sim-pixel radius of a rendered disc (the reference's RENDER_RADIUS).</span>
<span class="tok-kw">const</span> mouse_radius: f32 = <span class="tok-num">90.0</span>;

<span class="tok-comment">/// t1178 HANDROLLED: the working hand-written JS demo's exact WebGPU shape,</span>
<span class="tok-comment">/// reproduced through zimr's bridge - hand WGSL, SEPARATE runtime-sized</span>
<span class="tok-comment">/// buffers per array, separate bindings. Same device, same submit pattern;</span>
<span class="tok-comment">/// only the binding/struct shape differs from kompute's megastruct. If this</span>
<span class="tok-comment">/// is stable at 20000 where the megastruct explodes at ~1000, the megastruct</span>
<span class="tok-comment">/// is convicted and the kompute refactor direction is proven.</span>
<span class="tok-kw">const</span> handrolled_wgsl =
    <span class="tok-str">\\struct P {</span>
    <span class="tok-str">\\    count: u32, dt: f32, gravity: f32, dom_w: f32,</span>
    <span class="tok-str">\\    dom_h: f32, pad0: f32, pad1: f32, pad2: f32,</span>
    <span class="tok-str">\\};</span>
    <span class="tok-str">\\@group(0) @binding(0) var&lt;uniform&gt; params: P;</span>
    <span class="tok-str">\\@group(0) @binding(1) var&lt;storage, read_write&gt; positions: array&lt;vec2&lt;f32&gt;&gt;;</span>
    <span class="tok-str">\\@group(0) @binding(2) var&lt;storage, read_write&gt; velocities: array&lt;vec2&lt;f32&gt;&gt;;</span>
    <span class="tok-str">\\@compute @workgroup_size(64)</span>
    <span class="tok-str">\\fn bounce(@builtin(global_invocation_id) gid: vec3&lt;u32&gt;) {</span>
    <span class="tok-str">\\    let i = gid.x;</span>
    <span class="tok-str">\\    if (i &gt;= params.count) { return; }</span>
    <span class="tok-str">\\    var p = positions[i];</span>
    <span class="tok-str">\\    var v = velocities[i];</span>
    <span class="tok-str">\\    v.y = v.y + params.gravity * params.dt;</span>
    <span class="tok-str">\\    p = p + v * params.dt;</span>
    <span class="tok-str">\\    let r = 5.5;</span>
    <span class="tok-str">\\    if (p.x &lt; r) { p.x = r; v.x = -v.x * 0.85; }</span>
    <span class="tok-str">\\    if (p.x &gt; params.dom_w - r) { p.x = params.dom_w - r; v.x = -v.x * 0.85; }</span>
    <span class="tok-str">\\    if (p.y &lt; r) { p.y = r; v.y = -v.y * 0.85; }</span>
    <span class="tok-str">\\    if (p.y &gt; params.dom_h - r) { p.y = params.dom_h - r; v.y = -v.y * 0.85; }</span>
    <span class="tok-str">\\    positions[i] = p;</span>
    <span class="tok-str">\\    velocities[i] = v;</span>
    <span class="tok-str">\\}</span>
;

<span class="tok-kw">const</span> HandP = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    count: u32,
    dt: f32,
    gravity: f32,
    dom_w: f32,
    dom_h: f32,
    pad0: f32 = <span class="tok-num">0</span>,
    pad1: f32 = <span class="tok-num">0</span>,
    pad2: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">const</span> Handrolled = <span class="tok-kw">struct</span> {
    pos_buf: z.wgpu.BufferHandle,
    vel_buf: z.wgpu.BufferHandle,
    uni_buf: z.wgpu.BufferHandle,
    pipeline: z.wgpu.ComputePipelineHandle,
    bind_group: z.wgpu.BindGroupHandle,
    queue: z.wgpu.QueueHandle,
    dev: z.wgpu.DeviceHandle,

    <span class="tok-kw">fn</span> <span class="tok-fn">init</span>(
        gpa: Allocator,
        dev: z.wgpu.DeviceHandle,
        queue: z.wgpu.QueueHandle,
    ) !Handrolled {
        <span class="tok-kw">const</span> n_bytes: u32 = fk.num_particles * <span class="tok-num">8</span>;
        <span class="tok-kw">const</span> pos_buf: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(dev, .{
            .size = n_bytes,
            .usage = .{ .storage = true, .copy_src = true, .copy_dst = true },
            .label = <span class="tok-str">"hand_positions"</span>,
        });
        <span class="tok-kw">const</span> vel_buf: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(dev, .{
            .size = n_bytes,
            .usage = .{ .storage = true, .copy_dst = true },
            .label = <span class="tok-str">"hand_velocities"</span>,
        });
        <span class="tok-kw">const</span> uni_buf: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(dev, .{
            .size = <span class="tok-builtin">@sizeOf</span>(HandP),
            .usage = .{ .uniform = true, .copy_dst = true },
            .label = <span class="tok-str">"hand_params"</span>,
        });
        <span class="tok-kw">const</span> layout_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
            .{
                .binding = <span class="tok-num">0</span>,
                .visibility = .{ .compute = true },
                .resource = .{ .uniform_buffer = .{ .min_size = <span class="tok-builtin">@sizeOf</span>(HandP) } },
            },
            .{
                .binding = <span class="tok-num">1</span>,
                .visibility = .{ .compute = true },
                .resource = .{ .storage_buffer = .{ .read_only = false, .min_size = n_bytes } },
            },
            .{
                .binding = <span class="tok-num">2</span>,
                .visibility = .{ .compute = true },
                .resource = .{ .storage_buffer = .{ .read_only = false, .min_size = n_bytes } },
            },
        };
        <span class="tok-kw">const</span> bgl_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;layout_entries);
        <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(bgl_blob);
        <span class="tok-kw">const</span> bgl: z.wgpu.BindGroupLayoutHandle = z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(dev, bgl_blob, <span class="tok-str">"hand_bgl"</span>);
        <span class="tok-kw">const</span> pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(dev, &amp;.{bgl}, <span class="tok-str">"hand_pl"</span>);
        <span class="tok-kw">const</span> module: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(dev, handrolled_wgsl, <span class="tok-str">"hand_bounce"</span>);
        <span class="tok-kw">const</span> pipeline: z.wgpu.ComputePipelineHandle = z.wgpu.<span class="tok-fn">createComputePipeline</span>(
            dev,
            pl,
            module,
            <span class="tok-str">"bounce"</span>,
            <span class="tok-str">"hand_pipeline"</span>,
        );
        <span class="tok-kw">const</span> bg_entries = [_]z.gpu.BindGroupEntry{
            .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = uni_buf } } },
            .{ .binding = <span class="tok-num">1</span>, .resource = .{ .buffer = .{ .handle = pos_buf } } },
            .{ .binding = <span class="tok-num">2</span>, .resource = .{ .buffer = .{ .handle = vel_buf } } },
        };
        <span class="tok-kw">const</span> bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;bg_entries);
        <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(bg_blob);
        <span class="tok-kw">const</span> bind_group: z.wgpu.BindGroupHandle = z.wgpu.<span class="tok-fn">createBindGroup</span>(dev, bgl, bg_blob, <span class="tok-str">"hand_bg"</span>);
        <span class="tok-comment">// Build-only handles: the pipeline + bind group retain them internally,</span>
        <span class="tok-comment">// so release the source handles now (explicit ownership, no leak).</span>
        z.wgpu.<span class="tok-fn">destroyShaderModule</span>(module);
        z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(pl);
        z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgl);
        <span class="tok-kw">return</span> .{
            .pos_buf = pos_buf,
            .vel_buf = vel_buf,
            .uni_buf = uni_buf,
            .pipeline = pipeline,
            .bind_group = bind_group,
            .queue = queue,
            .dev = dev,
        };
    }

    <span class="tok-comment">/// Free the three buffers, the compute pipeline, and the bind group this</span>
    <span class="tok-comment">/// owns. The example calls this from its `deinit` - managed memory means</span>
    <span class="tok-comment">/// every handle has a named owner that releases it.</span>
    <span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(h: *Handrolled) void {
        z.wgpu.<span class="tok-fn">destroyComputePipeline</span>(h.pipeline);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(h.bind_group);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(h.pos_buf);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(h.vel_buf);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(h.uni_buf);
    }

    <span class="tok-comment">/// One dispatch, encoded and submitted exactly like the JS demo's frame.</span>
    <span class="tok-kw">fn</span> <span class="tok-fn">step</span>(h: *<span class="tok-kw">const</span> Handrolled, count: u32, p: HandP) void {
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(h.queue, h.uni_buf, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;p));
        <span class="tok-kw">const</span> enc: z.wgpu.CommandEncoderHandle = z.wgpu.<span class="tok-fn">createCommandEncoder</span>(h.dev);
        <span class="tok-kw">const</span> pass: z.wgpu.ComputePassEncoderHandle = z.compute_pass.<span class="tok-fn">begin</span>(enc);
        z.compute_pass.<span class="tok-fn">setPipeline</span>(pass, h.pipeline);
        z.compute_pass.<span class="tok-fn">setBindGroup</span>(pass, <span class="tok-num">0</span>, h.bind_group);
        z.compute_pass.<span class="tok-fn">dispatchWorkgroups</span>(pass, .{ .x = (count + <span class="tok-num">63</span>) / <span class="tok-num">64</span> });
        z.compute_pass.<span class="tok-fn">end</span>(pass);
        <span class="tok-kw">const</span> cmd: z.wgpu.CommandBufferHandle = z.wgpu.<span class="tok-fn">finishCommandEncoder</span>(enc);
        z.wgpu.<span class="tok-fn">queueSubmit</span>(h.queue, cmd);
    }
};

    <span class="tok-comment">/// t1178: drive the hand-rolled (JS-shaped) compute instead of kompute.</span>
    handrolled_mode: bool = false,
    hand: Handrolled = undefined,
    mirror_buf: z.wgpu.BufferHandle = .invalid,
    discs_mirror: z.FluidDiscs = undefined,
    adapter_buf: [<span class="tok-num">192</span>]u8 = undefined,
    adapter_len: usize = <span class="tok-num">0</span>,
    en_gravity: bool = true,
    en_grid: bool = true,
    en_viscosity: bool = true,
    en_predict: bool = true,

    <span class="tok-comment">// OFF by default - the per-particle path is the proven 9.4ms baseline.</span>

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.pipe.<span class="tok-fn">deinit</span>();
    s.discs.<span class="tok-fn">deinit</span>();
    s.discs_mirror.<span class="tok-fn">deinit</span>();
    s.hand.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">if</span> (s.mirror_buf != .invalid) {
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.mirror_buf);

<span class="tok-comment">/// Dam-break: a dense block in the left third, jittered so columns don't</span>
<span class="tok-comment">/// lock. Velocities start at zero - gravity does the rest.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">spawnDamBreak</span>(
    pipe: *z.<span class="tok-fn">Compute</span>(fk),
    scratch: []Vec2,
    hand: *<span class="tok-kw">const</span> Handrolled,
    mirror_buf: z.wgpu.BufferHandle,
) void {
    <span class="tok-kw">var</span> prng: std.Random.DefaultPrng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0xf1a1d</span>);
    <span class="tok-kw">const</span> rng: std.Random = prng.<span class="tok-fn">random</span>();
    <span class="tok-comment">// CULPRIT EXPERIMENT (t1178 hunt): a packed disk at domain center with</span>
    <span class="tok-comment">// the PRESSURE pipeline enabled (grid+density+force+predict+apply) and</span>
    <span class="tok-comment">// gravity+viscosity off. Correct physics = a radially SYMMETRIC</span>
    <span class="tok-comment">// explosion that settles into an even spread. Any corner-drift or</span>
    <span class="tok-comment">// asymmetry convicts the grid-loop kernels on this GPU. (Ground-truth</span>
    <span class="tok-comment">// static render already verified: spawn/upload/mapping all correct.)</span>
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; fk.num_particles) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> ang: f32 = rng.<span class="tok-fn">float</span>(f32) * <span class="tok-num">6.2831853</span>;
        <span class="tok-kw">const</span> rad: f32 = <span class="tok-num">220.0</span> * <span class="tok-builtin">@sqrt</span>(rng.<span class="tok-fn">float</span>(f32));
        scratch[i] = .{
            fk.domain_w * <span class="tok-num">0.5</span> + <span class="tok-builtin">@cos</span>(ang) * rad,
            fk.domain_h * <span class="tok-num">0.5</span> + <span class="tok-builtin">@sin</span>(ang) * rad,
        };
    }
    pipe.<span class="tok-fn">upload</span>(.pos, scratch[<span class="tok-num">0</span>..fk.num_particles]);
    <span class="tok-builtin">@memcpy</span>(fk.g.B.pos[<span class="tok-num">0</span>..fk.num_particles], scratch[<span class="tok-num">0</span>..fk.num_particles]);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(hand.queue, hand.pos_buf, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(scratch[<span class="tok-num">0</span>..fk.num_particles]));
    <span class="tok-kw">for</span> (scratch[<span class="tok-num">0</span>..fk.num_particles], <span class="tok-num">0</span>..) |*v, vi| {
        <span class="tok-comment">// small deterministic per-particle kick so the bounce reads on screen</span>
        <span class="tok-kw">const</span> a: f32 = <span class="tok-fn">float</span>(vi % <span class="tok-num">628</span>) * <span class="tok-num">0.01</span>;
        v.* = .{ <span class="tok-builtin">@cos</span>(a) * <span class="tok-num">2.0</span>, <span class="tok-builtin">@sin</span>(a) * <span class="tok-num">1.0</span> };
    }
    pipe.<span class="tok-fn">upload</span>(.vel, scratch[<span class="tok-num">0</span>..fk.num_particles]);
    <span class="tok-builtin">@memcpy</span>(fk.g.B.vel[<span class="tok-num">0</span>..fk.num_particles], scratch[<span class="tok-num">0</span>..fk.num_particles]);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(hand.queue, hand.vel_buf, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(scratch[<span class="tok-num">0</span>..fk.num_particles]));
    pipe.<span class="tok-fn">upload</span>(.delta, scratch[<span class="tok-num">0</span>..fk.num_particles]);
    <span class="tok-comment">// Lean kernel never writes density: fill it bright ONCE here so the</span>
    <span class="tok-comment">// colour reach-in renders visibly (and any 12345 seen later in pos is</span>
    <span class="tok-comment">// unambiguous corruption, not this fill - this writes density only).</span>
    <span class="tok-kw">for</span> (scratch[<span class="tok-num">0</span>..fk.num_particles]) |*v| {
        v.* = .{ <span class="tok-num">600.0</span>, <span class="tok-num">1.0</span> };
    }
    pipe.<span class="tok-fn">upload</span>(.density, scratch[<span class="tok-num">0</span>..fk.num_particles]);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(
        hand.queue,
        mirror_buf,
        <span class="tok-builtin">@offsetOf</span>(fk.Buffers, <span class="tok-str">"density"</span>),
        std.mem.<span class="tok-fn">sliceAsBytes</span>(scratch[<span class="tok-num">0</span>..fk.num_particles]),
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);

    <span class="tok-kw">var</span> pipe: z.<span class="tok-fn">Compute</span>(fk) = <span class="tok-kw">try</span> z.<span class="tok-fn">Compute</span>(fk).<span class="tok-fn">initGpu</span>(
        gpa,
        f.gpu.device,
        f.gpu.queue,
        &amp;.{
            .{ .name = <span class="tok-str">"buildGrid"</span>, .wgsl = buildGrid_wgsl },
            .{ .name = <span class="tok-str">"clearGrid"</span>, .wgsl = clearGrid_wgsl },
            .{ .name = <span class="tok-str">"gravityMouse"</span>, .wgsl = gravityMouse_wgsl },
            .{ .name = <span class="tok-str">"viscosity"</span>, .wgsl = viscosity_wgsl },
            .{ .name = <span class="tok-str">"predict"</span>, .wgsl = predict_wgsl },
            .{ .name = <span class="tok-str">"density"</span>, .wgsl = density_wgsl },
            .{ .name = <span class="tok-str">"densityTiled"</span>, .wgsl = densityTiled_wgsl },
            .{ .name = <span class="tok-str">"densityPig"</span>, .wgsl = densityPig_wgsl },
            .{ .name = <span class="tok-str">"force"</span>, .wgsl = force_wgsl },
            .{ .name = <span class="tok-str">"forcePig"</span>, .wgsl = forcePig_wgsl },
            .{ .name = <span class="tok-str">"applyAndFinalize"</span>, .wgsl = applyAndFinalize_wgsl },
            .{ .name = <span class="tok-str">"fallBounceLean"</span>, .wgsl = fallBounceLean_wgsl },
        },
    );

    <span class="tok-comment">// Variable-length fields slice to num_particles on readback: the diagnostics</span>
    <span class="tok-comment">// scan and the decoupled-render mirror both want the full buffer. The live</span>
    <span class="tok-comment">// slider only sets per-call dispatch width + the disc draw count, not the</span>
    <span class="tok-comment">// readback length, so this stays at capacity.</span>
    pipe.element_count = fk.num_particles;

    <span class="tok-kw">const</span> scratch: []Vec2 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec2, fk.num_particles);
    <span class="tok-kw">const</span> prev_stat_pos: []Vec2 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec2, fk.num_particles);
    <span class="tok-builtin">@memset</span>(prev_stat_pos, .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> });
    <span class="tok-kw">const</span> hand: Handrolled = <span class="tok-kw">try</span> Handrolled.<span class="tok-fn">init</span>(gpa, f.gpu.device, f.gpu.queue);
    <span class="tok-kw">const</span> mirror_buf_h: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(fk.Buffers),
        .usage = .{ .storage = true, .copy_dst = true },
        .label = <span class="tok-str">"fluid_mirror"</span>,
    });
    <span class="tok-fn">spawnDamBreak</span>(&amp;pipe, scratch, &amp;hand, mirror_buf_h);

    <span class="tok-kw">const</span> n_bytes: u64 = fk.num_particles * <span class="tok-num">8</span>;
    <span class="tok-kw">const</span> discs: z.FluidDiscs = <span class="tok-kw">try</span> z.FluidDiscs.<span class="tok-fn">init</span>(
        f.gpu,
        gpa,
        f.gpu.device,
        f.gpu.queue,
        f.gpu.backbuffer_format,
        f.gpu.depth_format <span class="tok-kw">orelse</span> .undefined_,
        .{ .handle = pipe.<span class="tok-fn">fieldBuffer</span>(.pos).?, .size = n_bytes },
        .{ .handle = pipe.<span class="tok-fn">fieldBuffer</span>(.density).?, .size = n_bytes },
        fk.domain_w,
        fk.domain_h,
    );
    <span class="tok-comment">// Decoupled-render twin buffer was created earlier (before spawn) so the</span>
    <span class="tok-comment">// spawn-time density fill can target it.</span>
    <span class="tok-kw">const</span> mirror_buf: z.wgpu.BufferHandle = mirror_buf_h;
    <span class="tok-comment">// Spawn + kick into the hand-rolled buffers (CPU fills scratch below for</span>
    <span class="tok-comment">// kompute; reuse the same data here).</span>
    <span class="tok-kw">const</span> discs_mirror: z.FluidDiscs = <span class="tok-kw">try</span> z.FluidDiscs.<span class="tok-fn">init</span>(
        f.gpu,
        gpa,
        f.gpu.device,
        f.gpu.queue,
        f.gpu.backbuffer_format,
        f.gpu.depth_format <span class="tok-kw">orelse</span> .undefined_,
        .{ .handle = mirror_buf, .offset = <span class="tok-builtin">@offsetOf</span>(fk.Buffers, <span class="tok-str">"pos"</span>), .size = n_bytes },
        .{ .handle = mirror_buf, .offset = <span class="tok-builtin">@offsetOf</span>(fk.Buffers, <span class="tok-str">"density"</span>), .size = n_bytes },
        fk.domain_w,
        fk.domain_h,
    );

    s.* = .{
        .font = font,
        .pipe = pipe,
        .discs = discs,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .mirror_buf = mirror_buf,
        .discs_mirror = discs_mirror,
        .hand = hand,
        .scratch = scratch,
        .prev_stat_pos = prev_stat_pos,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// ---- Average-FPS benchmark (the baseline figure we're trying to beat) ----</span>
    <span class="tok-comment">// dt is the real frame delta; guard the first frame / pauses where it's 0.</span>
    <span class="tok-kw">const</span> dt: f32 = f.time.delta_time;
    <span class="tok-kw">if</span> (dt &gt; <span class="tok-num">0.0</span>) {
        <span class="tok-kw">const</span> inst_fps: f32 = <span class="tok-num">1.0</span> / dt;
        <span class="tok-comment">// EMA with ~0.1 weight: smooth but responsive.</span>
        s.fps_ema = <span class="tok-kw">if</span> (s.fps_ema == <span class="tok-num">0</span>) inst_fps <span class="tok-kw">else</span> s.fps_ema * <span class="tok-num">0.9</span> + inst_fps * <span class="tok-num">0.1</span>;
        <span class="tok-kw">const</span> inst_ms: f32 = dt * <span class="tok-num">1000.0</span>;
        s.ms_frame = <span class="tok-kw">if</span> (s.ms_frame == <span class="tok-num">0</span>) inst_ms <span class="tok-kw">else</span> s.ms_frame * <span class="tok-num">0.9</span> + inst_ms * <span class="tok-num">0.1</span>;
        <span class="tok-comment">// Windowed average: accumulate, publish every fps_window_secs.</span>
        s.fps_accum_time += dt;
        s.fps_accum_frames += <span class="tok-num">1</span>;
        <span class="tok-kw">if</span> (inst_fps &lt; s.fps_min_accum) {
            s.fps_min_accum = inst_fps;
        }
        <span class="tok-kw">const</span> fps_window_secs: f32 = <span class="tok-num">0.5</span>;
        <span class="tok-kw">if</span> (s.fps_accum_time &gt;= fps_window_secs) {
            s.fps_avg = <span class="tok-fn">float</span>(s.fps_accum_frames) / s.fps_accum_time;
            s.fps_min = s.fps_min_accum;
            s.fps_accum_time = <span class="tok-num">0</span>;
            s.fps_accum_frames = <span class="tok-num">0</span>;
            s.fps_min_accum = <span class="tok-num">1e9</span>;
        }
    }

    <span class="tok-comment">// ---- Input -&gt; mouse force (logical px -&gt; sim px via the renderer's fit) ----</span>
    <span class="tok-kw">const</span> lw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> lh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> mraw: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> mp_arr: [<span class="tok-num">2</span>]f32 = s.discs.<span class="tok-fn">simFromLogical</span>(lw, lh, .{ mraw[<span class="tok-num">0</span>], mraw[<span class="tok-num">1</span>] });
    <span class="tok-kw">const</span> mp: Vec2 = .{ mp_arr[<span class="tok-num">0</span>], mp_arr[<span class="tok-num">1</span>] };
    <span class="tok-kw">const</span> pressing: bool = z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left);
    <span class="tok-kw">const</span> attract: bool = s.attract_toggle <span class="tok-kw">or</span>
        z.<span class="tok-fn">isKeyDown</span>(f.input, .left_shift) <span class="tok-kw">or</span>
        z.<span class="tok-fn">isKeyDown</span>(f.input, .right_shift);
    <span class="tok-kw">const</span> signed_force: f32 = <span class="tok-kw">if</span> (!pressing)
        <span class="tok-num">0.0</span>
    <span class="tok-kw">else</span> <span class="tok-kw">if</span> (attract)
        -s.mouse_force_mag
    <span class="tok-kw">else</span>
        s.mouse_force_mag;

    <span class="tok-comment">// ---- Substeps: 8 dispatches each, all on-device ----</span>
    <span class="tok-kw">const</span> live_count: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(s.sim_count_f, <span class="tok-num">1</span>, <span class="tok-fn">float</span>(fk.num_particles)));
    <span class="tok-comment">// Compute this frame's GPU sim params ONCE, before the batch: a batch writes</span>
    <span class="tok-comment">// the uniform a single time at beginBatch, so params must be final by then</span>
    <span class="tok-comment">// (endBatch asserts no mid-batch change). The simple SWEEP path and the full-</span>
    <span class="tok-comment">// physics path are mutually exclusive (s.simple_mode) and differ only in</span>
    <span class="tok-comment">// dispatch width + gravity.</span>
    <span class="tok-kw">const</span> sim_params: fk.Params = .{
        .count = <span class="tok-kw">if</span> (s.simple_mode) live_count <span class="tok-kw">else</span> fk.num_particles,
        .dt = <span class="tok-num">1.0</span>,
        .h = fk.interact_radius,
        .r0 = s.rest_density,
        .k_far = s.k_far,
        .k_near = s.k_near,
        .gravity_y = <span class="tok-kw">if</span> (s.simple_mode) <span class="tok-num">0.12</span> <span class="tok-kw">else</span> s.gravity_y,
        .visc_beta = s.visc_beta,
        .mouse_x = mp[<span class="tok-num">0</span>],
        .mouse_y = mp[<span class="tok-num">1</span>],
        .mouse_force = signed_force,
        .mouse_radius = mouse_radius,
        .dom_w = fk.domain_w,
        .dom_h = fk.domain_h,
        .n_cols = fk.grid_cols,
        .n_rows = fk.grid_rows,
    };
    s.pipe.params = sim_params; <span class="tok-comment">// non-batch mode reads this per dispatch</span>
    <span class="tok-kw">if</span> (!s.paused <span class="tok-kw">and</span> s.batch_mode) {
        s.pipe.<span class="tok-fn">beginBatch</span>(sim_params);
    }
    <span class="tok-kw">if</span> (!s.paused <span class="tok-kw">and</span> s.simple_mode <span class="tok-kw">and</span> s.cpu_kernels) {
        <span class="tok-comment">// ---- CPU twin: the literal kernel fn, looped, then ONE upload ----</span>
        <span class="tok-kw">const</span> cpu_params: fk.Params = .{
            .count = fk.num_particles,
            .dt = <span class="tok-num">1.0</span>,
            .h = fk.interact_radius,
            .r0 = s.rest_density,
            .k_far = s.k_far,
            .k_near = s.k_near,
            .gravity_y = <span class="tok-num">0.12</span>,
            .visc_beta = s.visc_beta,
            .mouse_x = mp[<span class="tok-num">0</span>],
            .mouse_y = mp[<span class="tok-num">1</span>],
            .mouse_force = signed_force,
            .mouse_radius = mouse_radius,
            .dom_w = fk.domain_w,
            .dom_h = fk.domain_h,
            .n_cols = fk.grid_cols,
            .n_rows = fk.grid_rows,
        };
        <span class="tok-kw">var</span> ss: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (ss &lt; substeps) : (ss += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> id: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (id &lt; fk.num_particles) : (id += <span class="tok-num">1</span>) {
                fk.<span class="tok-fn">fallBounceLean</span>(.{ .id = id, .params = cpu_params });
            }
        }
        s.pipe.<span class="tok-fn">upload</span>(.pos, fk.g.B.pos[<span class="tok-num">0</span>..fk.num_particles]);
        s.pipe.<span class="tok-fn">upload</span>(.density, fk.g.B.density[<span class="tok-num">0</span>..fk.num_particles]);
    }
    <span class="tok-kw">if</span> (!s.paused <span class="tok-kw">and</span> s.handrolled_mode) {
        <span class="tok-comment">// The JS demo's frame, byte for byte: uniform write + dispatch per</span>
        <span class="tok-comment">// substep, separate buffers, hand WGSL.</span>
        <span class="tok-kw">var</span> hs: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (hs &lt; substeps) : (hs += <span class="tok-num">1</span>) {
            s.hand.<span class="tok-fn">step</span>(live_count, .{
                .count = live_count,
                .dt = <span class="tok-num">1.0</span>,
                .gravity = <span class="tok-num">0.12</span>,
                .dom_w = fk.domain_w,
                .dom_h = fk.domain_h,
            });
        }
    }
    <span class="tok-kw">var</span> step: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (!s.paused <span class="tok-kw">and</span> !s.handrolled_mode <span class="tok-kw">and</span> s.simple_mode <span class="tok-kw">and</span> !s.cpu_kernels <span class="tok-kw">and</span> step &lt; substeps) : (step += <span class="tok-num">1</span>) {
        <span class="tok-comment">// t1178 SWEEP: dispatch width follows the slider; buffer constant.</span>
        s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"fallBounceLean"</span>, live_count);
    }
    s.frame_no += <span class="tok-num">1</span>;
    <span class="tok-comment">// The benchmark multiplier scales the substep count at runtime so we can</span>
    <span class="tok-comment">// push the GPU past the vsync cap and read a real ms/substep number.</span>
    <span class="tok-kw">const</span> bench_n: u32 = <span class="tok-fn">clamp</span>(s.bench_mult, <span class="tok-builtin">@as</span>(u32, <span class="tok-num">1</span>), <span class="tok-builtin">@as</span>(u32, <span class="tok-num">5</span>));
    <span class="tok-kw">while</span> (!s.paused <span class="tok-kw">and</span> !s.simple_mode <span class="tok-kw">and</span> step &lt; substeps * bench_n) : (step += <span class="tok-num">1</span>) {
        <span class="tok-comment">// Clavet ordering (t1178): gravity+mouse -&gt; viscosity -&gt; predict, as THREE</span>
        <span class="tok-comment">// dispatches. Viscosity runs on the STALE grid still in the buffer from</span>
        <span class="tok-comment">// last frame's build (a damping term tolerates the drift), BEFORE predict</span>
        <span class="tok-comment">// and BEFORE the rebuild - so the grid is still built only ONCE per frame</span>
        <span class="tok-comment">// (below, on the predicted positions density+force need). Splitting</span>
        <span class="tok-comment">// viscosity out of `force` and applying it pre-predict is more stable,</span>
        <span class="tok-comment">// which lets dt grow.</span>
        <span class="tok-kw">if</span> (s.en_gravity) {
            s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"gravityMouse"</span>, fk.num_particles);
        }
        <span class="tok-kw">if</span> (s.en_viscosity) {
            s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"viscosity"</span>, fk.num_particles);
        }
        <span class="tok-kw">if</span> (s.en_predict) {
            s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"predict"</span>, fk.num_particles);
        }
        <span class="tok-kw">if</span> (s.en_grid) {
            <span class="tok-comment">// clearGrid zeroes the per-cell counts (per cell); buildGrid then</span>
            <span class="tok-comment">// claims slots per PARTICLE via atomicAdd (O(N), the parallel</span>
            <span class="tok-comment">// build that replaced the O(cellsxN) single-writer scan).</span>
            s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"clearGrid"</span>, fk.grid_cells);
            s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"buildGrid"</span>, fk.num_particles);
        }
        <span class="tok-kw">if</span> (s.en_density) {
            <span class="tok-kw">if</span> (s.tiled_density) {
                <span class="tok-comment">// One workgroup per cell: dispatch grid_cells * wg threads, so</span>
                <span class="tok-comment">// each workgroup (wg lanes) owns exactly one cell. (No count to</span>
                <span class="tok-comment">// restore now - each run states its own width.)</span>
                s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"densityTiled"</span>, fk.grid_cells * fk.config.workgroup);
            } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.pos_in_grid) {
                s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"densityPig"</span>, fk.num_particles);
            } <span class="tok-kw">else</span> {
                s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"density"</span>, fk.num_particles);
            }
        }
        <span class="tok-kw">if</span> (s.en_force) {
            <span class="tok-kw">if</span> (s.pos_in_grid) {
                s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"forcePig"</span>, fk.num_particles);
            } <span class="tok-kw">else</span> {
                s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"force"</span>, fk.num_particles);
            }
        }
        <span class="tok-kw">if</span> (s.en_apply) {
            s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"applyAndFinalize"</span>, fk.num_particles);
        }
    }
    <span class="tok-kw">if</span> (!s.paused <span class="tok-kw">and</span> s.batch_mode) {
        s.pipe.<span class="tok-fn">endBatch</span>();
    }

    <span class="tok-comment">// ---- Diagnostics readback (centroid/bbox/rho/frozen) - GATED + THROTTLED.</span>
    <span class="tok-comment">// readLatest() copies EVERY GPU buffer to staging + submits + maps (a</span>
    <span class="tok-comment">// blocking GPU sync), and the CPU scans 20k elements. Doing all THREE</span>
    <span class="tok-comment">// readbacks every frame (for stats only visible in the `diagnostics` panel)</span>
    <span class="tok-comment">// pinned the GPU and - critically - added ~3 GPU stalls/frame that inflate</span>
    <span class="tok-comment">// ms_frame and distort the per-particle-vs-tiled A/B (the stalls hit the two</span>
    <span class="tok-comment">// dispatch patterns differently). So only pay for it when the panel is open</span>
    <span class="tok-comment">// AND only once every `diag_every` frames; the stat_* fields persist between</span>
    <span class="tok-comment">// samples, so the panel still updates (~1x/sec) without taxing every frame.</span>
    <span class="tok-comment">// Measure perf with the panel CLOSED for the cleanest number regardless.</span>
    <span class="tok-kw">const</span> diag_every: u32 = <span class="tok-num">30</span>;
    <span class="tok-kw">if</span> (s.show_diag <span class="tok-kw">and</span> s.frame_no % diag_every == <span class="tok-num">0</span>) {
        <span class="tok-kw">if</span> (s.pipe.<span class="tok-fn">readLatest</span>(.pos)) |pos_now| {
            <span class="tok-kw">var</span> cx: f64 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> cy: f64 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> mn: Vec2 = .{ <span class="tok-num">1e9</span>, <span class="tok-num">1e9</span> };
            <span class="tok-kw">var</span> mx: Vec2 = .{ -<span class="tok-num">1e9</span>, -<span class="tok-num">1e9</span> };
            <span class="tok-kw">var</span> frozen: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (pos_now, <span class="tok-num">0</span>..) |p, i| {
                cx += p[<span class="tok-num">0</span>];
                cy += p[<span class="tok-num">1</span>];
                mn = .{ <span class="tok-builtin">@min</span>(mn[<span class="tok-num">0</span>], p[<span class="tok-num">0</span>]), <span class="tok-builtin">@min</span>(mn[<span class="tok-num">1</span>], p[<span class="tok-num">1</span>]) };
                mx = .{ <span class="tok-builtin">@max</span>(mx[<span class="tok-num">0</span>], p[<span class="tok-num">0</span>]), <span class="tok-builtin">@max</span>(mx[<span class="tok-num">1</span>], p[<span class="tok-num">1</span>]) };
                <span class="tok-kw">const</span> dp: Vec2 = p - s.prev_stat_pos[i];
                <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(dp[<span class="tok-num">0</span>]) + <span class="tok-builtin">@abs</span>(dp[<span class="tok-num">1</span>]) &lt; <span class="tok-num">0.01</span>) {
                    frozen += <span class="tok-num">1</span>;
                }
                s.prev_stat_pos[i] = p;
            }
            <span class="tok-kw">const</span> fnn: f64 = <span class="tok-fn">float64</span>(fk.num_particles);
            s.stat_centroid = .{ <span class="tok-builtin">@floatCast</span>(cx / fnn), <span class="tok-builtin">@floatCast</span>(cy / fnn) };
            s.stat_min = mn;
            s.stat_max = mx;
            s.stat_frozen_pct = <span class="tok-num">100.0</span> * <span class="tok-fn">float</span>(frozen) / <span class="tok-fn">float</span>(fk.num_particles);
        }
        <span class="tok-kw">if</span> (s.pipe.<span class="tok-fn">readLatest</span>(.density)) |d_now| {
            <span class="tok-kw">var</span> rs: f64 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> rns: f64 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (d_now) |d| {
                rs += d[<span class="tok-num">0</span>];
                rns += d[<span class="tok-num">1</span>];
            }
            s.stat_rho = <span class="tok-builtin">@floatCast</span>(rs / <span class="tok-fn">float64</span>(fk.num_particles));
            s.stat_rho_near = <span class="tok-builtin">@floatCast</span>(rns / <span class="tok-fn">float64</span>(fk.num_particles));
        }
        <span class="tok-kw">if</span> (s.pipe.<span class="tok-fn">readLatest</span>(.grid_counts)) |gc| {
            <span class="tok-kw">var</span> cmax: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> nonempty: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> capped: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> total: u64 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (gc) |cnt| {
                <span class="tok-kw">if</span> (cnt &gt; cmax) {
                    cmax = cnt;
                }
                <span class="tok-kw">if</span> (cnt &gt; <span class="tok-num">0</span>) {
                    nonempty += <span class="tok-num">1</span>;
                    total += cnt;
                }
                <span class="tok-kw">if</span> (cnt &gt;= fk.max_per_cell) {
                    capped += <span class="tok-num">1</span>;
                }
            }
            s.stat_cell_max = cmax;
            s.stat_cells_capped = capped;
            <span class="tok-kw">const</span> ne_f: f32 = <span class="tok-fn">float</span>(nonempty);
            <span class="tok-kw">const</span> tot_f: f32 = <span class="tok-fn">float</span>(total);
            s.stat_cell_avg = <span class="tok-kw">if</span> (nonempty &gt; <span class="tok-num">0</span>) tot_f / ne_f <span class="tok-kw">else</span> <span class="tok-num">0</span>;
        }
    }

    <span class="tok-comment">// ---- Pre-discs marker kept minimal: the FPS/ms readout now lives in the</span>
    <span class="tok-comment">// pinned control panel (always visible), so the old top-left headline was</span>
    <span class="tok-comment">// both redundant and occluded by the panel - removed. ----</span>

    <span class="tok-comment">// ---- Render: clear + N discs (BACKGROUND) + reference geometry + UI ----</span>
    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">1</span>, .g = <span class="tok-num">3</span>, .b = <span class="tok-num">8</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-comment">// Discs FIRST so the 2D overlays + UI compose ON TOP of the fluid. The</span>
    <span class="tok-comment">// DrawPoints pass discipline (flushBatch -&gt; disc draw -&gt; renderer.bindForPass)</span>
    <span class="tok-comment">// restores the 2D pipeline + bind group, so subsequent 2D draws are valid.</span>
    <span class="tok-kw">if</span> (s.handrolled_mode) {
        <span class="tok-kw">const</span> enc: z.wgpu.CommandEncoderHandle = z.wgpu.<span class="tok-fn">createCommandEncoder</span>(f.gpu.device);
        z.wgpu.<span class="tok-fn">copyBufferToBuffer</span>(enc, s.hand.pos_buf, <span class="tok-num">0</span>, s.mirror_buf, <span class="tok-num">0</span>, fk.num_particles * <span class="tok-num">8</span>);
        <span class="tok-kw">const</span> cmd: z.wgpu.CommandBufferHandle = z.wgpu.<span class="tok-fn">finishCommandEncoder</span>(enc);
        z.wgpu.<span class="tok-fn">queueSubmit</span>(f.gpu.queue, cmd);
        s.discs_mirror.<span class="tok-fn">draw</span>(f.gl, live_count, lw, lh, .{ .radius_px = <span class="tok-num">8.0</span>, .density_scale = <span class="tok-num">1.0</span> / <span class="tok-num">24.0</span> });
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.decoupled) {
        <span class="tok-kw">if</span> (s.pipe.<span class="tok-fn">readLatest</span>(.pos)) |pm| {
            z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.mirror_buf, <span class="tok-builtin">@offsetOf</span>(fk.Buffers, <span class="tok-str">"pos"</span>), std.mem.<span class="tok-fn">sliceAsBytes</span>(pm));
        }
        <span class="tok-kw">if</span> (s.pipe.<span class="tok-fn">readLatest</span>(.density)) |dm| {
            <span class="tok-kw">const</span> off: usize = <span class="tok-builtin">@offsetOf</span>(fk.Buffers, <span class="tok-str">"density"</span>);

    <span class="tok-comment">// Reopen a fresh 2D pass after the discs' custom pass so the border and UI</span>
    <span class="tok-comment">// compose ON TOP (the disc pass leaves pipeline/pass state the 2D</span>
    <span class="tok-comment">// batch can't recover from on the Adreno - the source of the old</span>
    <span class="tok-comment">// "discs must be drawn last" workaround).</span>

    <span class="tok-kw">const</span> blind: bool = s.frame_no &lt; <span class="tok-num">300</span>;
    <span class="tok-kw">const</span> so: [<span class="tok-num">2</span>][<span class="tok-num">2</span>]f32 = s.discs.<span class="tok-fn">fitScaleOffset</span>(lw, lh);

    f.gl.<span class="tok-fn">rect</span>(

    <span class="tok-comment">// ---- Controls ----</span>

            _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"attract"</span>, &amp;s.attract_toggle);

            <span class="tok-comment">// ---- Advanced (collapsed) ----</span>
            <span class="tok-kw">if</span> (u.<span class="tok-fn">collapsingHeader</span>(<span class="tok-str">"advanced"</span>, &amp;s.show_advanced)) {
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"k far"</span>, &amp;s.k_far, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">0.02</span>, .fmt = <span class="tok-str">"{d:.4}"</span> });
                _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"k near"</span>, &amp;s.k_near, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">0.06</span>, .fmt = <span class="tok-str">"{d:.4}"</span> });

                _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"gravity"</span>, &amp;s.en_gravity);

    }
    s.ui_host.<span class="tok-fn">render</span>(f);

}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
