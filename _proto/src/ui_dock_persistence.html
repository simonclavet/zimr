<h1>ui_dock_persistence</h1>
<figure class="code src-file" data-path="examples/ui_dock_persistence/ui_dock_persistence.zig" data-lines="195"><figcaption><span>examples/ui_dock_persistence/ui_dock_persistence.zig</span><span>195 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_dock_persistence.zig - dock layout persistence demo.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Three docked windows + a Counter that survives across refreshes</span>
<span class="tok-comment">// independently of the layout.  Proves the persistence pipeline</span>
<span class="tok-comment">// works end-to-end:</span>
<span class="tok-comment">//   1. First load   : default 3-column layout (Tools | Viewport | Notes).</span>
<span class="tok-comment">//   2. Drag a tab   : Notes can be dragged to a new spot.</span>
<span class="tok-comment">//   3. F5 refresh   : layout returns where you left it.</span>
<span class="tok-comment">//   4. Clear button : localStorage cleared; next refresh starts fresh.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The save cadence is 60 frames (~1s at 60fps).  If you drag a</span>
<span class="tok-comment">// tab and refresh too fast, the save may not have flushed yet.</span>
<span class="tok-comment">// Wait ~2 seconds before refreshing to be safe.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What this exercises (zimr machinery, no new features):</span>
<span class="tok-comment">//   - `UiContext.persistence_key` - opt-in identifier under which</span>
<span class="tok-comment">//     localStorage stores the .zon payload.</span>
<span class="tok-comment">//   - `tryAutoLoad` on first frame, `tryAutoSave` every 60 frames</span>
<span class="tok-comment">//     in endFrame.  See `src/ui_persistence.zig`.</span>
<span class="tok-comment">//   - Dock-tree persistence (turn 334): the split tree, leaf</span>
<span class="tok-comment">//     window assignments, and size_ref locks all serialize.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Phone-friendly setup matches `ui_dock_basic`: `.responsive`</span>
<span class="tok-comment">// scale, font_size = 16, dimensions derived from viewport so</span>
<span class="tok-comment">// rotation reflows correctly.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    <span class="tok-comment">// The counter is a non-layout piece of state that lets the</span>
    <span class="tok-comment">// user verify the demo is responsive across refreshes (you</span>
    <span class="tok-comment">// can see the dock layout restored AND a fresh counter).</span>
    counter: i32 = <span class="tok-num">0</span>,

    <span class="tok-comment">// Layout-build gate.  Set to true after the first successful</span>
    <span class="tok-comment">// dockBuilder pass.  Reset when the user clicks "Clear layout</span>
    <span class="tok-comment">// and restart" - next frame rebuilds defaults from scratch.</span>
    layout_built: bool = false,
    root: ui.Id = <span class="tok-num">0</span>,

    <span class="tok-comment">// Visible status string for "did clear succeed" feedback.</span>
    clear_status_buf: [<span class="tok-num">128</span>]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    clear_status_len: usize = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };

    <span class="tok-comment">// The key under which our state is persisted.  The JS layer</span>
    <span class="tok-comment">// adds a "zimr_" prefix -&gt; localStorage key becomes</span>
    <span class="tok-comment">// "zimr_dock_persistence_demo".</span>
    s.ui_host.ctx.persistence_key = <span class="tok-str">"dock_persistence_demo"</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">const</span> sw: f32 = <span class="tok-fn">float</span>(f.window.screen_width);
    <span class="tok-kw">const</span> sh: f32 = <span class="tok-fn">float</span>(f.window.screen_height);
    <span class="tok-kw">const</span> margin: f32 = <span class="tok-num">8</span>;

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Host"</span>, .{
        .initial_pos = .{ margin, margin },
        .initial_size = .{ sw - <span class="tok-num">2</span> * margin, sh - <span class="tok-num">2</span> * margin },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag tabs to rearrange. Refresh → layout returns."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Counter (always survives): {d}"</span>, .{s.counter});

        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"+1"</span>, .{})) {
            s.counter += <span class="tok-num">1</span>;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Reset counter"</span>, .{})) {
            s.counter = <span class="tok-num">0</span>;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Clear layout and restart"</span>, .{})) {
            <span class="tok-comment">// True "start fresh" requires three things, in order:</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">//   1. Drop the localStorage entry so the NEXT page load</span>
            <span class="tok-comment">//      sees no persisted state.</span>
            <span class="tok-comment">//   2. Null the persistence_key so this session's future</span>
            <span class="tok-comment">//      auto-save cycles (every 60 frames, in endFrame)</span>
            <span class="tok-comment">//      don't write the LIVE in-memory state (which may</span>
            <span class="tok-comment">//      include dragged-out windows) right back over the</span>
            <span class="tok-comment">//      cleared entry.  Without this, the dock tree resets</span>
            <span class="tok-comment">//      visually but the very next save undoes the Clear.</span>
            <span class="tok-comment">//   3. Tear down the dock tree and flip `layout_built` so</span>
            <span class="tok-comment">//      the next frame rebuilds defaults.</span>
            <span class="tok-comment">//</span>
            <span class="tok-comment">// Idempotent: if the user clicks twice in a row the</span>
            <span class="tok-comment">// `orelse` skips the work the second time (no key to</span>
            <span class="tok-comment">// remove, save is already disabled).</span>
            <span class="tok-kw">if</span> (s.ui_host.ctx.persistence_key) |key| {
                <span class="tok-kw">const</span> status: i32 = z.dom.<span class="tok-fn">persistence_remove</span>(key);
                <span class="tok-kw">const</span> msg: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">switch</span> (status) {
                    <span class="tok-num">0</span> =&gt; <span class="tok-str">"Cleared. Refresh page to start truly fresh."</span>,
                    <span class="tok-num">2</span> =&gt; <span class="tok-str">"localStorage unavailable (host build?)."</span>,
                    <span class="tok-kw">else</span> =&gt; <span class="tok-str">"Unknown status."</span>,
                };
                <span class="tok-kw">const</span> copy_n: usize = <span class="tok-builtin">@min</span>(msg.len, s.clear_status_buf.len);
                <span class="tok-builtin">@memcpy</span>(s.clear_status_buf[<span class="tok-num">0</span>..copy_n], msg[<span class="tok-num">0</span>..copy_n]);
                s.clear_status_len = copy_n;

                s.ui_host.ctx.persistence_key = null;
                u.<span class="tok-fn">dockBuilderRemoveNode</span>(s.root);
                s.layout_built = false;
            }
        }

        <span class="tok-kw">if</span> (s.clear_status_len &gt; <span class="tok-num">0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{s.clear_status_buf[<span class="tok-num">0</span>..s.clear_status_len]});
        }
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// The dockspace fills the remaining content area.  Sized</span>
        <span class="tok-comment">// to leave room for the controls above + a small bottom</span>
        <span class="tok-comment">// gutter; precise content-region math arrives in P6 of</span>
        <span class="tok-comment">// the v7 plan.</span>
        <span class="tok-kw">const</span> dockspace_size: Vec2 = .{
            sw - <span class="tok-num">2</span> * margin - <span class="tok-num">24</span>,
            sh - <span class="tok-num">2</span> * margin - <span class="tok-num">200</span>,
        };
        s.root = u.<span class="tok-fn">dockSpace</span>(<span class="tok-str">"MainDock"</span>, dockspace_size, .{});

        <span class="tok-kw">if</span> (!s.layout_built <span class="tok-kw">and</span> s.root != <span class="tok-num">0</span>) {
            <span class="tok-kw">const</span> left_split: ui.SplitResult =
                u.<span class="tok-fn">dockBuilderSplitNode</span>(s.root, .left, <span class="tok-num">0.30</span>);
            <span class="tok-kw">if</span> (left_split.a != <span class="tok-num">0</span> <span class="tok-kw">and</span> left_split.b != <span class="tok-num">0</span>) {
                <span class="tok-kw">const</span> right_split: ui.SplitResult =
                    u.<span class="tok-fn">dockBuilderSplitNode</span>(left_split.b, .right, <span class="tok-num">0.40</span>);
                <span class="tok-kw">if</span> (right_split.a != <span class="tok-num">0</span> <span class="tok-kw">and</span> right_split.b != <span class="tok-num">0</span>) {
                    u.<span class="tok-fn">dockBuilderDockWindow</span>(<span class="tok-str">"Tools"</span>, left_split.a);
                    u.<span class="tok-fn">dockBuilderDockWindow</span>(<span class="tok-str">"Viewport"</span>, right_split.a);
                    u.<span class="tok-fn">dockBuilderDockWindow</span>(<span class="tok-str">"Notes"</span>, right_split.b);

                    u.<span class="tok-fn">dockBuilderSetCentralNode</span>(right_split.a);
                    u.<span class="tok-fn">dockBuilderFinish</span>(s.root);
                    s.layout_built = true;
                }
            }
        }
    }

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Tools"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Toolbox panel."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag this tab to a new dock node."</span>, .{});
    }

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Viewport"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Central viewport."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Tabs and trees would live here."</span>, .{});
    }

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Notes"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Free-form notes."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Refresh the page to see this layout persist."</span>, .{});
    }
}
