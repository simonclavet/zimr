<h1>ui_clipper</h1>
<figure class="code src-file" data-path="examples/ui_clipper/ui_clipper.zig" data-lines="196"><figcaption><span>examples/ui_clipper/ui_clipper.zig</span><span>196 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_clipper.zig - Phase A2 of the imgui-parity arc.</span>
<span class="tok-comment">// Demonstrates `ui.clipper(count, height)` - virtualized list</span>
<span class="tok-comment">// rendering.  Renders a 100,000-row log at O(visible) per frame</span>
<span class="tok-comment">// instead of O(count); about 30-50 rows actually submit each</span>
<span class="tok-comment">// frame regardless of total count.</span>
<span class="tok-comment">// Background: imgui's `ImGuiListClipper` is the canonical pattern</span>
<span class="tok-comment">// for any list view that exceeds the viewport.  A 100k-row list</span>
<span class="tok-comment">// without a clipper would submit 100k text widgets per frame</span>
<span class="tok-comment">// even though only ~30 are visible.  With the clipper, only the</span>
<span class="tok-comment">// visible range submits; the cursor advances over the rest</span>
<span class="tok-comment">// arithmetically so the scrollbar reflects the full range.</span>
<span class="tok-comment">// What this demo shows:</span>
<span class="tok-comment">//   - 100,000 deterministic log rows (no per-row allocation; the</span>
<span class="tok-comment">//     row "data" is computed on the fly from the row index).</span>
<span class="tok-comment">//   - Hovering ANY visible row colors it.</span>
<span class="tok-comment">//   - HUD reports actual rows submitted this frame and the</span>
<span class="tok-comment">//     visible window - proves the O(visible) claim.</span>
<span class="tok-comment">//   - Toggle clipper on/off to see the perf difference (turn OFF</span>
<span class="tok-comment">//     and watch frame time spike - even though zimr is fast,</span>
<span class="tok-comment">//     submitting 100k text widgets is noticeable).</span>
<span class="tok-comment">// Caveat: the demo uses a FIXED row height.  The clipper API</span>
<span class="tok-comment">// requires the caller to supply the row's rendered height.  For</span>
<span class="tok-comment">// the simple text rows below, that's `style.font_size +</span>
<span class="tok-comment">// style.item_spacing.y`.  For variable-height rows the imgui</span>
<span class="tok-comment">// idiom is "measure on first frame, virtualize on the rest"</span>
<span class="tok-comment">// not implemented in A2.  See `imgui-parity-plan.md` for the</span>
<span class="tok-comment">// roadmap.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    use_clipper: bool = true,
    row_count: i32 = <span class="tok-num">100_000</span>,
    last_frame_rows_submitted: usize = <span class="tok-num">0</span>,
    last_visible_start: usize = <span class="tok-num">0</span>,
    last_visible_end: usize = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .font = font, .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font) };
}

<span class="tok-comment">/// Format row `i` into the provided buffer.  Deterministic from</span>
<span class="tok-comment">/// the index - no allocation, no per-row state.  In a real app</span>
<span class="tok-comment">/// the row content would come from a backing store (file, db,</span>
<span class="tok-comment">/// network buffer); the point is that the clipper only reads</span>
<span class="tok-comment">/// data for visible rows.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">rowText</span>(buf: []u8, i: usize) []<span class="tok-kw">const</span> u8 {
    <span class="tok-kw">const</span> subsystems: [<span class="tok-num">10</span>][]<span class="tok-kw">const</span> u8 = .{
        <span class="tok-str">"net"</span>,
        <span class="tok-str">"auth"</span>,
        <span class="tok-str">"db"</span>,
        <span class="tok-str">"cache"</span>,
        <span class="tok-str">"ws"</span>,
        <span class="tok-str">"ipc"</span>,
        <span class="tok-str">"render"</span>,
        <span class="tok-str">"physics"</span>,
        <span class="tok-str">"scheduler"</span>,
        <span class="tok-str">"fs"</span>,
    };
    <span class="tok-kw">const</span> subjects: [<span class="tok-num">8</span>][]<span class="tok-kw">const</span> u8 = .{ <span class="tok-str">"connection"</span>, <span class="tok-str">"request"</span>, <span class="tok-str">"frame"</span>, <span class="tok-str">"session"</span>, <span class="tok-str">"tick"</span>, <span class="tok-str">"packet"</span>, <span class="tok-str">"query"</span>, <span class="tok-str">"job"</span> };
    <span class="tok-kw">const</span> verbs: [<span class="tok-num">8</span>][]<span class="tok-kw">const</span> u8 = .{
        <span class="tok-str">"completed"</span>,
        <span class="tok-str">"queued"</span>,
        <span class="tok-str">"retried"</span>,
        <span class="tok-str">"dropped"</span>,
        <span class="tok-str">"ack'd"</span>,
        <span class="tok-str">"expired"</span>,
        <span class="tok-str">"renewed"</span>,
        <span class="tok-str">"deferred"</span>,
    };
    <span class="tok-kw">const</span> sub: []<span class="tok-kw">const</span> u8 = subsystems[i % subsystems.len];
    <span class="tok-kw">const</span> subj: []<span class="tok-kw">const</span> u8 = subjects[(i / <span class="tok-num">10</span>) % subjects.len];
    <span class="tok-kw">const</span> verb: []<span class="tok-kw">const</span> u8 = verbs[(i / <span class="tok-num">7</span>) % verbs.len];
    <span class="tok-kw">const</span> written: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(buf, <span class="tok-str">"[{d:0&gt;6}] {s}: {s} {s} ({s}ms)"</span>, .{
        i,
        sub,
        subj,
        verb,
        <span class="tok-kw">if</span> (i &amp; <span class="tok-num">1</span> == <span class="tok-num">0</span>) <span class="tok-str">"&lt;1"</span> <span class="tok-kw">else</span> <span class="tok-str">"12.3"</span>,
    }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span> buf[<span class="tok-num">0</span>..<span class="tok-num">0</span>];
    <span class="tok-kw">return</span> written;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"100,000-row virtualized log"</span>, .{
        .initial_pos = .{ <span class="tok-num">20</span>, <span class="tok-num">20</span> },
        .initial_size = .{ <span class="tok-num">920</span>, <span class="tok-num">600</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Phase A2 - ImGuiListClipper virtualization."</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"100,000 rows; only ~30 actually submitted to the UI per frame."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"use clipper (turn OFF to see frame time spike)"</span>, &amp;s.use_clipper);
        _ = u.<span class="tok-fn">drag</span>(<span class="tok-str">"row count"</span>, &amp;s.row_count, .{ .speed = <span class="tok-num">100</span>, .min = <span class="tok-num">1</span>, .max = <span class="tok-num">100_000</span>, .fmt = <span class="tok-str">"{d}"</span> });

        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// HUD: actual rows submitted last frame (zero-cost</span>
        <span class="tok-comment">// proof of virtualization).</span>
        u.<span class="tok-fn">labelText</span>(<span class="tok-str">"rows in dataset"</span>, <span class="tok-str">"{d}"</span>, .{s.row_count});
        u.<span class="tok-fn">labelText</span>(<span class="tok-str">"rows submitted last frame"</span>, <span class="tok-str">"{d}"</span>, .{s.last_frame_rows_submitted});
        u.<span class="tok-fn">labelText</span>(<span class="tok-str">"visible window"</span>, <span class="tok-str">"[{d} .. {d})"</span>, .{ s.last_visible_start, s.last_visible_end });
        u.<span class="tok-fn">text</span>(
            <span class="tok-str">"frame: {d:.2}ms  |  fps: {d:.0}"</span>,
            .{ f.time.delta_time * <span class="tok-num">1000</span>, <span class="tok-kw">if</span> (f.time.delta_time &gt; <span class="tok-num">0</span>) <span class="tok-num">1.0</span> / f.time.delta_time <span class="tok-kw">else</span> <span class="tok-num">0</span> },
        );

        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// The scrollable child where the rows live.  Using</span>
        <span class="tok-comment">// beginChild gives us a bounded viewport that the</span>
        <span class="tok-comment">// clipper can read from `ctx.child_stack`.</span>
        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginChild</span>(<span class="tok-str">"log-region"</span>, .{ <span class="tok-num">0</span>, <span class="tok-num">380</span> }, .{ .border = true })) {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">endChild</span>();

            <span class="tok-comment">// Item height: font_size + item_spacing.y matches the</span>
            <span class="tok-comment">// height produced by `u.text(...)`.  Verified by</span>
            <span class="tok-comment">// inspecting `text()`'s call to advanceLayout.</span>
            <span class="tok-kw">const</span> style: ui.Style = s.ui_host.ctx.style;
            <span class="tok-kw">const</span> item_height: f32 = style.font_size + style.item_spacing[<span class="tok-num">1</span>];
            <span class="tok-kw">const</span> n: usize = <span class="tok-builtin">@intCast</span>(s.row_count);

            <span class="tok-kw">var</span> submitted: usize = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> vs: usize = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> ve: usize = <span class="tok-num">0</span>;

            <span class="tok-kw">if</span> (s.use_clipper) {
                <span class="tok-comment">// ---- Virtualized path ----</span>
                <span class="tok-kw">var</span> clip: ui.Clipper = u.<span class="tok-fn">clipper</span>(n, item_height);
                <span class="tok-kw">while</span> (clip.<span class="tok-fn">step</span>()) |range| {
                    vs = range.start;
                    ve = range.end;
                    <span class="tok-kw">var</span> buf: [<span class="tok-num">128</span>]u8 = undefined;
                    <span class="tok-kw">var</span> i: usize = range.start;
                    <span class="tok-kw">while</span> (i &lt; range.end) : (i += <span class="tok-num">1</span>) {
                        <span class="tok-kw">const</span> t: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">rowText</span>(&amp;buf, i);
                        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{t});
                        submitted += <span class="tok-num">1</span>;
                    }
                }
            } <span class="tok-kw">else</span> {
                <span class="tok-comment">// ---- Naive path: submit every row ----</span>
                <span class="tok-kw">var</span> buf: [<span class="tok-num">128</span>]u8 = undefined;
                <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
                <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
                    <span class="tok-kw">const</span> t: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">rowText</span>(&amp;buf, i);
                    u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{t});
                    submitted += <span class="tok-num">1</span>;
                }
                vs = <span class="tok-num">0</span>;
                ve = n;
            }

            s.last_frame_rows_submitted = submitted;
            s.last_visible_start = vs;
            s.last_visible_end = ve;
        }

        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Wheel-scroll over the log to navigate.  The scrollbar reflects the full 100k range."</span>, .{});
    }
}

            .title = <span class="tok-str">"zimr - ui_clipper (Phase A2: 100k-row virtualization)"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">640</span>,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,

};
