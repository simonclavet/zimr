<h1>textures_framebuffer_rendering</h1>
<figure class="code src-file" data-path="examples/textures_framebuffer_rendering/textures_framebuffer_rendering.zig" data-lines="324"><figcaption><span>examples/textures_framebuffer_rendering/textures_framebuffer_rendering.zig</span><span>324 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! textures_framebuffer_rendering - port of raylib's</span>
<span class="tok-comment">//! `examples/textures/textures_framebuffer_rendering.c` (Jack Boakes, 2/4).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The sample's subject is the RENDER TEXTURE itself: one world drawn twice, into</span>
<span class="tok-comment">//! two framebuffers, composited side by side - plus a cropped ZOOM of one of them</span>
<span class="tok-comment">//! sampled straight back out of its own framebuffer.</span>
<span class="tok-comment">//!   * OBSERVER pane - the world, plus a wire prism showing exactly where the</span>
<span class="tok-comment">//!     other camera is and what it can see (its frustum, unprojected).</span>
<span class="tok-comment">//!   * SUBJECT pane - the same world through that camera.</span>
<span class="tok-comment">//!   * The viewfinder - a `capture_px` square of the SUBJECT framebuffer, drawn</span>
<span class="tok-comment">//!     magnified over the corner. That is one `gl.texture(dst, rt, .{ .source })`</span>
<span class="tok-comment">//!     call: a sub-rectangle of a texture we rendered ourselves this same frame.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! WHERE THIS DEPARTS FROM RAYLIB (and why):</span>
<span class="tok-comment">//!   * raylib drives the observer with WASD+mouse and the subject with</span>
<span class="tok-comment">//!     CAMERA_ORBITAL. A phone has neither. Here BOTH cameras are `z.OrbitCamera`s</span>
<span class="tok-comment">//!     and the pane you touch is the one you steer - drag the top pane to fly the</span>
<span class="tok-comment">//!     observer, drag the bottom pane to AIM the subject and watch its green</span>
<span class="tok-comment">//!     frustum swing round in the pane above. The pane is latched on press, so a</span>
<span class="tok-comment">//!     drag that crosses the divider keeps steering the camera it started on.</span>
<span class="tok-comment">//!   * The split follows the device: stacked on a portrait phone, side-by-side on</span>
<span class="tok-comment">//!     a landscape screen. Each framebuffer is exactly its pane's size in BACKING</span>
<span class="tok-comment">//!     pixels, so the 3D is never stretched and the zoom is never resampled twice.</span>
<span class="tok-comment">//!   * raylib passes a NEGATIVE source height (`-texture.height`) everywhere here,</span>
<span class="tok-comment">//!     because a GL render texture arrives upside down. zimr's do not, so the</span>
<span class="tok-comment">//!     source rects are plain positive pixels - except the `mirror` toggle, which</span>
<span class="tok-comment">//!     flips the viewfinder on purpose to show that the negative-extent rule works.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Leak-clean (`.memory = .managed`): both render textures and the UI host are</span>
<span class="tok-comment">//! freed in `deinit`, and the twice-lifecycle smoke census must come back FLAT.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> inverse = zm.inverse;
<span class="tok-kw">const</span> length3 = zm.length3;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> mulMatVec = zm.mulMatVec;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> pointVec = zm.pointVec;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> vec4 = zm.vec4;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> c = z.colors;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    ui_host: z.UiHost,
    <span class="tok-comment">/// The camera we LOOK THROUGH in the bottom pane (and see drawn in the top).</span>
    subject: z.OrbitCamera,
    <span class="tok-comment">/// The camera that watches the subject.</span>
    observer: z.OrbitCamera,
    rt_observer: z.RenderTexture = .{},
    rt_subject: z.RenderTexture = .{},
    auto_orbit: bool = true,
    mirror: bool = false,
    capture_px: f32 = <span class="tok-num">128</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.* = .{
        .font = font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .subject = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">8.0</span>),
        .observer = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">18.0</span>),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.rt_observer.<span class="tok-fn">deinit</span>();
    s.rt_subject.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Both framebuffers are one pane in BACKING pixels - half the surface on the</span>
<span class="tok-comment">/// split axis, full on the other. Recreated only when that size actually</span>
<span class="tok-comment">/// changes (rotation, resize), never per frame.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> portrait: bool = backing.height &gt;= backing.width;
    <span class="tok-kw">const</span> w: u32 = <span class="tok-kw">if</span> (portrait) <span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>) <span class="tok-kw">else</span> <span class="tok-builtin">@max</span>(backing.width / <span class="tok-num">2</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> h: u32 = <span class="tok-kw">if</span> (portrait) <span class="tok-builtin">@max</span>(backing.height / <span class="tok-num">2</span>, <span class="tok-num">1</span>) <span class="tok-kw">else</span> <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt_observer.color != .invalid <span class="tok-kw">and</span> s.rt_observer.width == w <span class="tok-kw">and</span> s.rt_observer.height == h) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.rt_observer.color != .invalid) {
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt_observer);
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt_subject);
    }
    s.rt_observer = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(w), <span class="tok-builtin">@intCast</span>(h));
    s.rt_subject = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(w), <span class="tok-builtin">@intCast</span>(h));
}

<span class="tok-comment">/// The shared world: raylib's gold cube on a grid, plus a few satellites so the</span>
<span class="tok-comment">/// subject camera (and the magnified crop) always has something to frame.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawWorld</span>(f: *z.Frame) void {
    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">10</span>, <span class="tok-num">1.0</span>);
    z.<span class="tok-fn">drawCube</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">2</span>, <span class="tok-num">2</span>, <span class="tok-num">2</span>), .color = c.gold });
    z.<span class="tok-fn">drawCubeWires</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">2</span>, <span class="tok-num">2</span>, <span class="tok-num">2</span>), .color = c.pink_400 });
    z.<span class="tok-fn">drawSphere</span>(f.gl, <span class="tok-fn">pointVec</span>(-<span class="tok-num">3</span>, <span class="tok-num">0.6</span>, <span class="tok-num">2</span>), .{ .radius = <span class="tok-num">0.6</span>, .rings = <span class="tok-num">10</span>, .slices = <span class="tok-num">14</span>, .color = c.emerald_400 });
    z.<span class="tok-fn">drawSphere</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">3</span>, <span class="tok-num">0.6</span>, -<span class="tok-num">2</span>), .{ .radius = <span class="tok-num">0.6</span>, .rings = <span class="tok-num">10</span>, .slices = <span class="tok-num">14</span>, .color = c.sky_300 });
    z.<span class="tok-fn">drawCube</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">2.5</span>, <span class="tok-num">0.4</span>, <span class="tok-num">2.5</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">0.8</span>, <span class="tok-num">0.8</span>, <span class="tok-num">0.8</span>), .color = c.violet_400 });
    z.<span class="tok-fn">drawCube</span>(f.gl, <span class="tok-fn">pointVec</span>(-<span class="tok-num">2.5</span>, <span class="tok-num">0.4</span>, -<span class="tok-num">2.5</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">0.8</span>, <span class="tok-num">0.8</span>, <span class="tok-num">0.8</span>), .color = c.amber_500 });
}

<span class="tok-comment">/// raylib's `DrawCameraPrism`: the subject camera's frustum, unprojected into</span>
<span class="tok-comment">/// world space and drawn as wires in the OBSERVER's pane.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The trick is that the far plane is deliberately built at the camera's TARGET</span>
<span class="tok-comment">/// distance (`far = |position - target|`), so the prism is sliced exactly where</span>
<span class="tok-comment">/// the subject is looking instead of running off to z_far. Take the four far-plane</span>
<span class="tok-comment">/// NDC corners `(+/-1, +/-1, 1)`, push them through the INVERSE view-projection, and</span>
<span class="tok-comment">/// the perspective divide hands back the four world-space corners of what that</span>
<span class="tok-comment">/// camera can see. z = 1 is the far plane in WebGPU's 0..1 clip space just as it</span>
<span class="tok-comment">/// is in GL's -1..1, so raylib's corner list ports across unchanged.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawCameraPrism</span>(f: *z.Frame, cam: Camera3D, aspect: f32, color: Color) void {
    <span class="tok-kw">const</span> far: f32 = <span class="tok-builtin">@max</span>(<span class="tok-fn">length3</span>(cam.position - cam.target), <span class="tok-num">0.1</span>);
    <span class="tok-kw">const</span> proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(cam.fovy_deg * pi / <span class="tok-num">180.0</span>, aspect, <span class="tok-num">0.05</span>, far);
    <span class="tok-kw">const</span> view_proj: Mat = <span class="tok-fn">mulMat</span>(proj, cam.<span class="tok-fn">viewMatrix</span>());
    <span class="tok-kw">const</span> inv: Mat = <span class="tok-fn">inverse</span>(view_proj);

    <span class="tok-kw">const</span> ndc: [<span class="tok-num">4</span>]Vec = .{
        <span class="tok-fn">vec4</span>(-<span class="tok-num">1</span>, -<span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>), <span class="tok-comment">// bottom-left</span>
        <span class="tok-fn">vec4</span>(<span class="tok-num">1</span>, -<span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>), <span class="tok-comment">// bottom-right</span>
        <span class="tok-fn">vec4</span>(<span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>), <span class="tok-comment">// top-right</span>
        <span class="tok-fn">vec4</span>(-<span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>), <span class="tok-comment">// top-left</span>
    };
    <span class="tok-kw">var</span> corner: [<span class="tok-num">4</span>]Vec = undefined;
    <span class="tok-kw">for</span> (ndc, <span class="tok-num">0</span>..) |p, i| {
        <span class="tok-kw">const</span> h: Vec = <span class="tok-fn">mulMatVec</span>(inv, p);
        <span class="tok-kw">const</span> w: f32 = <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(h[<span class="tok-num">3</span>]) &lt; <span class="tok-num">1e-6</span>) <span class="tok-num">1e-6</span> <span class="tok-kw">else</span> h[<span class="tok-num">3</span>];
        corner[i] = <span class="tok-fn">pointVec</span>(h[<span class="tok-num">0</span>] / w, h[<span class="tok-num">1</span>] / w, h[<span class="tok-num">2</span>] / w);
    }

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |i| {
        z.<span class="tok-fn">drawLine3D</span>(f.gl, corner[i], corner[(i + <span class="tok-num">1</span>) % <span class="tok-num">4</span>], color); <span class="tok-comment">// the far plane</span>
        z.<span class="tok-fn">drawLine3D</span>(f.gl, cam.position, corner[i], color); <span class="tok-comment">// and the four eye rays</span>
    }
}

<span class="tok-comment">/// The two viewports, in logical coords: stacked on a portrait phone, side by</span>
<span class="tok-comment">/// side on a landscape screen. These rects are BOTH the compositor's layout and</span>
<span class="tok-comment">/// each camera's `region` - one source of truth, so what you see is what you</span>
<span class="tok-comment">/// steer.</span>
<span class="tok-kw">const</span> Layout = <span class="tok-kw">struct</span> {
    observer: z.Rectangle,
    subject: z.Rectangle,
    portrait: bool,
};

<span class="tok-kw">fn</span> <span class="tok-fn">layoutFor</span>(vw: f32, vh: f32) Layout {
    <span class="tok-kw">const</span> portrait: bool = vh &gt;= vw;
    <span class="tok-kw">const</span> pane_w: f32 = <span class="tok-kw">if</span> (portrait) vw <span class="tok-kw">else</span> vw * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> pane_h: f32 = <span class="tok-kw">if</span> (portrait) vh * <span class="tok-num">0.5</span> <span class="tok-kw">else</span> vh;
    <span class="tok-kw">const</span> second_x: f32 = <span class="tok-kw">if</span> (portrait) <span class="tok-num">0</span> <span class="tok-kw">else</span> pane_w;
    <span class="tok-kw">const</span> second_y: f32 = <span class="tok-kw">if</span> (portrait) pane_h <span class="tok-kw">else</span> <span class="tok-num">0</span>;
    <span class="tok-kw">return</span> .{
        .observer = .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = pane_w, .height = pane_h },
        .subject = .{ .x = second_x, .y = second_y, .width = pane_w, .height = pane_h },
        .portrait = portrait,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> lay: Layout = <span class="tok-fn">layoutFor</span>(vw, vh);
    <span class="tok-kw">const</span> rt_w: f32 = <span class="tok-fn">float</span>(s.rt_subject.width);
    <span class="tok-kw">const</span> rt_h: f32 = <span class="tok-fn">float</span>(s.rt_subject.height);
    <span class="tok-kw">const</span> aspect: f32 = rt_w / <span class="tok-builtin">@max</span>(rt_h, <span class="tok-num">1</span>);

    <span class="tok-comment">// Each camera is handed ITS pane as `region`: the engine then routes a drag</span>
    <span class="tok-comment">// (pointer) or a pinch (the midpoint of the two fingers) to whichever camera</span>
    <span class="tok-comment">// owns the viewport the gesture began in, and latches it for the gesture's</span>
    <span class="tok-comment">// life. No pane bookkeeping in the app.</span>
    <span class="tok-kw">const</span> observer_opts: z.OrbitOptions = .{
        .min_distance = <span class="tok-num">6.0</span>,
        .max_distance = <span class="tok-num">60.0</span>,
        .region = lay.observer,
    };
    <span class="tok-kw">const</span> subject_opts: z.OrbitOptions = .{
        .min_distance = <span class="tok-num">3.0</span>,
        .max_distance = <span class="tok-num">24.0</span>,
        .fovy_deg = <span class="tok-num">45</span>,
        .region = lay.subject,
    };

    <span class="tok-comment">// ORDER (forced, and worth understanding): `manages_own_frame` means the</span>
    <span class="tok-comment">// offscreen passes run BEFORE the screen pass opens - that is the whole</span>
    <span class="tok-comment">// tile-based-GPU point. But `UiHost.begin` asserts an OPEN draw frame (the UI</span>
    <span class="tok-comment">// is built into it), and the camera must not steal a drag that belongs to the</span>
    <span class="tok-comment">// UI panel. So input can only be read AFTER `beginDrawing`, i.e. after the</span>
    <span class="tok-comment">// framebuffers are already drawn. The cameras therefore render from the state</span>
    <span class="tok-comment">// last frame's input left them in, and this frame's drag lands next frame -</span>
    <span class="tok-comment">// one frame of lag, invisible at 60fps, and exactly what cel_shading does.</span>
    <span class="tok-kw">const</span> cam_observer: Camera3D = s.observer.<span class="tok-fn">camera</span>(observer_opts);
    <span class="tok-kw">const</span> cam_subject: Camera3D = s.subject.<span class="tok-fn">camera</span>(subject_opts);

    <span class="tok-comment">// ---- framebuffer 1: what the observer sees (including the subject) ----</span>
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt_observer, .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">255</span> });
    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam_observer);
    <span class="tok-fn">drawWorld</span>(f);
    <span class="tok-fn">drawCameraPrism</span>(f, cam_subject, aspect, c.emerald_400);
    z.<span class="tok-fn">endMode3D</span>(f.gl);
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">12</span>, <span class="tok-num">10</span> }, <span class="tok-str">"OBSERVER"</span>, .{ .size = <span class="tok-num">20</span>, .color = c.white, .font = &amp;s.font });
    z.<span class="tok-fn">endTextureMode</span>(f.gl);

    <span class="tok-comment">// ---- framebuffer 2: what the subject sees, with the capture box marked ----</span>
    <span class="tok-kw">const</span> cap: f32 = <span class="tok-builtin">@min</span>(s.capture_px, <span class="tok-builtin">@min</span>(rt_w, rt_h));
    <span class="tok-kw">const</span> cap_x: f32 = (rt_w - cap) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> cap_y: f32 = (rt_h - cap) * <span class="tok-num">0.5</span>;
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt_subject, .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">255</span> });
    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam_subject);
    <span class="tok-fn">drawWorld</span>(f);
    z.<span class="tok-fn">endMode3D</span>(f.gl);
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = cap_x, .y = cap_y, .width = cap, .height = cap },
        .{ .color = c.emerald_400, .outline = <span class="tok-num">2.0</span> },
    );
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">12</span>, <span class="tok-num">10</span> }, <span class="tok-str">"SUBJECT"</span>, .{ .size = <span class="tok-num">20</span>, .color = c.white, .font = &amp;s.font });
    z.<span class="tok-fn">endTextureMode</span>(f.gl);

    <span class="tok-comment">// ---- composite ----</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-kw">const</span> obs: z.Rectangle = lay.observer;
    <span class="tok-kw">const</span> sub: z.Rectangle = lay.subject;
    f.gl.<span class="tok-fn">texture</span>(obs, s.rt_observer.<span class="tok-fn">asTexture</span>(), .{ .tint = c.white });
    f.gl.<span class="tok-fn">texture</span>(sub, s.rt_subject.<span class="tok-fn">asTexture</span>(), .{ .tint = c.white });

    <span class="tok-comment">// THE POINT OF THE SAMPLE: a sub-rectangle of a texture we rendered this</span>
    <span class="tok-comment">// frame, magnified. `.source` is in the framebuffer's own PIXELS; a negative</span>
    <span class="tok-comment">// width mirrors it (raylib's rule, and how a GL render texture gets flipped).</span>
    <span class="tok-kw">const</span> view_px: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">160</span>, sub.width * <span class="tok-num">0.42</span>);
    <span class="tok-kw">const</span> vx: f32 = sub.x + sub.width - view_px - <span class="tok-num">14</span>;
    <span class="tok-kw">const</span> vy: f32 = sub.y + <span class="tok-num">14</span>;
    <span class="tok-kw">const</span> src_w: f32 = <span class="tok-kw">if</span> (s.mirror) -cap <span class="tok-kw">else</span> cap;
    <span class="tok-kw">const</span> src_x: f32 = <span class="tok-kw">if</span> (s.mirror) cap_x + cap <span class="tok-kw">else</span> cap_x;
    f.gl.<span class="tok-fn">texture</span>(
        .{ .x = vx, .y = vy, .width = view_px, .height = view_px },
        s.rt_subject.<span class="tok-fn">asTexture</span>(),
        .{ .source = .{ .x = src_x, .y = cap_y, .width = src_w, .height = cap }, .tint = c.white },
    );
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = vx, .y = vy, .width = view_px, .height = view_px },
        .{ .color = c.black, .outline = <span class="tok-num">2.0</span> },
    );

    <span class="tok-comment">// the split divider</span>
    <span class="tok-kw">if</span> (lay.portrait) {
        f.gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">0</span>, .y = sub.y - <span class="tok-num">1.5</span>, .width = vw, .height = <span class="tok-num">3</span> }, .{ .color = c.white });
    } <span class="tok-kw">else</span> {
        f.gl.<span class="tok-fn">rect</span>(.{ .x = sub.x - <span class="tok-num">1.5</span>, .y = <span class="tok-num">0</span>, .width = <span class="tok-num">3</span>, .height = vh }, .{ .color = c.white });
    }

    <span class="tok-kw">const</span> hint: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"drag or pinch a pane to steer THAT camera"</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">14</span>, <span class="tok-num">40</span> }, hint, .{ .size = <span class="tok-num">18</span>, .color = common.palette.ink_dim, .font = &amp;s.font });
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"two render textures - one world, two cameras, a cropped viewfinder"</span>);

    <span class="tok-comment">// ---- UI (inside the open frame), then input ----</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">300</span>, vw - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">150</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">142</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"framebuffers"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"reset both"</span>, .{})) {
            s.subject = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">8.0</span>);
            s.observer = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">18.0</span>);
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"auto-orbit"</span>, &amp;s.auto_orbit);
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"mirror viewfinder"</span>, &amp;s.mirror);
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"capture px"</span>, &amp;s.capture_px, .{ .min = <span class="tok-num">48</span>, .max = <span class="tok-num">320</span> });
    }

    <span class="tok-comment">// Both controllers see every gesture; each takes only the ones that BEGAN in</span>
    <span class="tok-comment">// its own `region` - pointer for a drag, MIDPOINT OF THE TWO FINGERS for a</span>
    <span class="tok-comment">// pinch. No pane bookkeeping here: that is the controller's job now.</span>
    <span class="tok-comment">// Auto-orbit yields while a gesture owns the subject pane.</span>
    <span class="tok-kw">const</span> ui_owns: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    _ = s.observer.<span class="tok-fn">update</span>(f, ui_owns, observer_opts);
    <span class="tok-kw">if</span> (s.auto_orbit <span class="tok-kw">and</span> !s.subject.owns_gesture) {
        s.subject.yaw += f.time.delta_time * <span class="tok-num">0.45</span>;
    }
    _ = s.subject.<span class="tok-fn">update</span>(f, ui_owns, subject_opts);

    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - textures framebuffer rendering"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Offscreen render textures are drawn BEFORE the screen pass opens</span>
    <span class="tok-comment">// (tile-based-GPU safe), so the app owns its own begin/endDrawing.</span>
    .manages_own_frame = true,
    .memory = .managed,
};
