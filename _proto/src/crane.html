<body class="src-page">
<h1>crane</h1>
<figure class="code src-file" data-path="examples/crane/crane.zig" data-lines="334"><figcaption><span>examples/crane/crane.zig</span><span>334 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! crane - moving a swinging load and arriving with it still.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Two identical gantry cranes get the same job: carry the payload to the flag and stop. The</span>
<span class="tok-comment">//! near one runs a position PD on the trolley; the far one plans. Same acceleration limit, same</span>
<span class="tok-comment">//! cable, same target.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** WATCH THE TROLLEY, NOT THE LOAD --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The planner **decelerates early and briefly runs backwards** near the end. That looks like a</span>
<span class="tok-comment">//! mistake and it is the entire trick:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!     x_ddot = a          theta_ddot = -(g/L)*sin theta - (a/L)*cos theta</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Accelerating forward swings the payload BACKWARD. So to arrest a load that is already</span>
<span class="tok-comment">//! swinging you have to accelerate INTO it - and by then the trolley is already at the flag, so</span>
<span class="tok-comment">//! a controller that only watches trolley POSITION has nothing left to say. It arrives, and the</span>
<span class="tok-comment">//! load keeps swinging.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- *** MEASURED, SAME LIMIT, SAME TRAVEL --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!     controller     final x   |angle|   |rate|   peak |vel|   residual swing</span>
<span class="tok-comment">//!     position PD      9.994    0.1348   0.3129       2.077           0.2217</span>
<span class="tok-comment">//!     MPC             10.000    0.0001   0.0001       3.258           0.0002</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! **A thousandfold less residual swing.** The PD leaves the load swinging through 12.7 degrees.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! * AND THE PLANNER SPENDS RAIL SPEED TO GET IT: 3.26 m/s against 2.08. Speed is a STATE limit</span>
<span class="tok-comment">//! and `boxQP` bounds controls only, so there is no constraint to write - the cost weight is the</span>
<span class="tok-comment">//! whole brake. The readout shows peak speed for exactly that reason.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * THE PLAN IS AN APPROXIMATION AND THE SIMULATION IS NOT --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The planner uses the small-angle model; the crane is stepped with the real `sin`/`cos`. That</span>
<span class="tok-comment">//! is what real MPC does, and it makes "does the linearisation hold?" something you can watch</span>
<span class="tok-comment">//! rather than something this comment claims.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> mpc = z.robot_mpc;
<span class="tok-kw">const</span> ui = z.ui;

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> identity = zm.identity;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> mulMat = zm.mulMat;

<span class="tok-kw">const</span> sim_timestep: f32 = <span class="tok-num">0.02</span>;
<span class="tok-kw">const</span> horizon_knots: u32 = <span class="tok-num">100</span>;
<span class="tok-kw">const</span> body: mpc.CraneModel = .{ .cable = <span class="tok-num">3.0</span>, .gravity = <span class="tok-num">9.81</span> };

<span class="tok-kw">const</span> background: Color = .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> rail_colour: Color = .{ .r = <span class="tok-num">70</span>, .g = <span class="tok-num">78</span>, .b = <span class="tok-num">96</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> trolley_colour: Color = .{ .r = <span class="tok-num">148</span>, .g = <span class="tok-num">156</span>, .b = <span class="tok-num">172</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> cable_colour: Color = .{ .r = <span class="tok-num">108</span>, .g = <span class="tok-num">116</span>, .b = <span class="tok-num">132</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> load_still: Color = .{ .r = <span class="tok-num">89</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">153</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> load_swinging: Color = .{ .r = <span class="tok-num">226</span>, .g = <span class="tok-num">106</span>, .b = <span class="tok-num">154</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> flag_colour: Color = .{ .r = <span class="tok-num">237</span>, .g = <span class="tok-num">184</span>, .b = <span class="tok-num">89</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> trail_colour: Color = .{ .r = <span class="tok-num">107</span>, .g = <span class="tok-num">158</span>, .b = <span class="tok-num">219</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> trail_length: usize = <span class="tok-num">220</span>;

<span class="tok-comment">/// One crane: its state, and whichever controller drives it.</span>
<span class="tok-kw">const</span> Crane = <span class="tok-kw">struct</span> {
    state: [mpc.crane_state_dim]f32,
    plan: mpc.CranePlan,
    planned: bool,
    <span class="tok-comment">/// Last commanded trolley acceleration, for the readout and the arrow.</span>
    accel: f32,
    peak_speed: f32,
    <span class="tok-comment">/// Where the payload has been, so the path is visible rather than remembered.</span>
    trail: [trail_length]Vec,
    trail_count: usize,
    trail_next: usize,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    pd: Crane,
    planner: Crane,
    target: f32,
    accel_limit: f32,
    running: bool,
    accumulator: f32,

    cam: z.OrbitCamera,
    font: z.Font,
    ui_host: z.UiHost,
    cube: z.Mesh,
    sphere: z.Mesh,
    transform: [<span class="tok-num">1</span>]Mat,
};

<span class="tok-comment">// Cost weights over `[x, x_dot, theta, theta_dot]`.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// * THE SWING TERMS CARRY REAL WEIGHT ALONG THE WAY, not only at the end. Penalising the swing</span>
<span class="tok-comment">// solely at the terminal knot lets the plan fling the load and promise to sort it out later,</span>
<span class="tok-comment">// which it then cannot do inside the acceleration limit.</span>
<span class="tok-kw">const</span> state_weight = [_]f32{ <span class="tok-num">4.0</span>, <span class="tok-num">2.0</span>, <span class="tok-num">60.0</span>, <span class="tok-num">60.0</span> };
<span class="tok-kw">const</span> control_weight = [_]f32{<span class="tok-num">0.5</span>};
<span class="tok-kw">const</span> terminal_weight = [_]f32{ <span class="tok-num">400.0</span>, <span class="tok-num">200.0</span>, <span class="tok-num">2000.0</span>, <span class="tok-num">2000.0</span> };

<span class="tok-kw">fn</span> <span class="tok-fn">weights</span>() mpc.Weights {
    <span class="tok-kw">return</span> .{ .state = &amp;state_weight, .control = &amp;control_weight, .terminal = &amp;terminal_weight };
}

<span class="tok-kw">fn</span> <span class="tok-fn">makeCrane</span>(gpa: Allocator, planned: bool) !Crane {
    <span class="tok-kw">const</span> plan: mpc.CranePlan = <span class="tok-kw">try</span> mpc.CranePlan.<span class="tok-fn">init</span>(gpa, horizon_knots);
    <span class="tok-builtin">@memset</span>(plan.ctrl, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(plan.reference, <span class="tok-num">0</span>);
    <span class="tok-kw">return</span> .{
        .state = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
        .plan = plan,
        .planned = planned,
        .accel = <span class="tok-num">0</span>,
        .peak_speed = <span class="tok-num">0</span>,
        .trail = <span class="tok-builtin">@splat</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>)),
        .trail_count = <span class="tok-num">0</span>,
        .trail_next = <span class="tok-num">0</span>,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.gpa = gpa;
    s.pd = <span class="tok-kw">try</span> <span class="tok-fn">makeCrane</span>(gpa, false);
    s.planner = <span class="tok-kw">try</span> <span class="tok-fn">makeCrane</span>(gpa, true);
    s.target = <span class="tok-num">10.0</span>;
    s.accel_limit = <span class="tok-num">1.2</span>;
    s.running = true;
    s.accumulator = <span class="tok-num">0</span>;

    s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">5</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0</span>), <span class="tok-num">14.0</span>);
    s.font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font);
    s.cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    s.sphere = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">14</span>, <span class="tok-num">12</span>);
    s.transform = .{<span class="tok-fn">identity</span>()};
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.sphere);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cube);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    s.planner.plan.<span class="tok-fn">deinit</span>();
    s.pd.plan.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">resetAll</span>(s: *State) void {
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (.{ &amp;s.pd, &amp;s.planner }) |c| {
        c.state = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>);
        c.accel = <span class="tok-num">0</span>;
        c.peak_speed = <span class="tok-num">0</span>;
        c.trail_count = <span class="tok-num">0</span>;
        c.trail_next = <span class="tok-num">0</span>;
        <span class="tok-comment">// * AND THE PLAN, NOT ONLY THE CRANE. `solveCrane` warm-starts from `plan.ctrl`; leaving</span>
        <span class="tok-comment">// the last run's commands there means the first tick after a reset applies them.</span>
        <span class="tok-builtin">@memset</span>(c.plan.ctrl, <span class="tok-num">0</span>);
    }
    s.accumulator = <span class="tok-num">0</span>;
}

<span class="tok-comment">/// Where the payload hangs, given the trolley and the cable angle.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">payloadAt</span>(state: [mpc.crane_state_dim]f32, depth: f32) Vec {
    <span class="tok-kw">const</span> angle: f32 = state[mpc.crane_angle_offset];
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(
        state[mpc.crane_pos_offset] + body.cable * <span class="tok-builtin">@sin</span>(angle),
        depth - body.cable * <span class="tok-builtin">@cos</span>(angle),
        <span class="tok-num">0</span>,
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">advance</span>(s: *State, c: *Crane, depth: f32) void {
    <span class="tok-kw">if</span> (c.planned) {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..c.plan.horizon + <span class="tok-num">1</span>) |k| {
            c.plan.reference[k * mpc.crane_state_dim + mpc.crane_pos_offset] = s.target;
        }
        _ = mpc.<span class="tok-fn">solveCrane</span>(body, &amp;c.plan, &amp;c.state, <span class="tok-fn">weights</span>(), s.accel_limit, sim_timestep, <span class="tok-num">3</span>);
        c.accel = c.plan.ctrl[<span class="tok-num">0</span>];
    } <span class="tok-kw">else</span> {
        <span class="tok-comment">// * A POSITION PD, WHICH IS THE HONEST BASELINE. It sees the trolley and nothing else -</span>
        <span class="tok-comment">// no term in it refers to the payload, because there is nowhere sensible to put one.</span>
        <span class="tok-kw">const</span> err: f32 = s.target - c.state[mpc.crane_pos_offset];
        c.accel = <span class="tok-fn">clamp</span>(
            <span class="tok-num">0.35</span> * err - <span class="tok-num">1.2</span> * c.state[mpc.crane_vel_offset],
            -s.accel_limit,
            s.accel_limit,
        );
    }

    <span class="tok-kw">const</span> u = [_]f32{c.accel};
    <span class="tok-comment">// * THE REAL DYNAMICS, NOT THE PLANNED ONE.</span>
    c.state = mpc.<span class="tok-fn">craneStep</span>(body, &amp;c.state, &amp;u, sim_timestep, false);
    c.peak_speed = <span class="tok-builtin">@max</span>(c.peak_speed, <span class="tok-builtin">@abs</span>(c.state[mpc.crane_vel_offset]));

    c.trail[c.trail_next] = <span class="tok-fn">payloadAt</span>(c.state, depth);
    c.trail_next = (c.trail_next + <span class="tok-num">1</span>) % trail_length;
    c.trail_count = <span class="tok-builtin">@min</span>(c.trail_count + <span class="tok-num">1</span>, trail_length);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">const</span> captured: bool = <span class="tok-fn">drawPanel</span>(u, s, f.window.<span class="tok-fn">widthf</span>(), f.window.<span class="tok-fn">heightf</span>());

    <span class="tok-kw">if</span> (s.running) {
        s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
        <span class="tok-kw">while</span> (s.accumulator &gt;= sim_timestep) : (s.accumulator -= sim_timestep) {
            <span class="tok-fn">advance</span>(s, &amp;s.pd, <span class="tok-num">5.0</span>);
            <span class="tok-fn">advance</span>(s, &amp;s.planner, <span class="tok-num">5.0</span>);
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, background);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, captured, .{ .min_distance = <span class="tok-num">6.0</span>, .max_distance = <span class="tok-num">30.0</span> });
    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    <span class="tok-fn">drawCrane</span>(s, gl, &amp;s.pd, -<span class="tok-num">2.2</span>);
    <span class="tok-fn">drawCrane</span>(s, gl, &amp;s.planner, <span class="tok-num">2.2</span>);
    z.<span class="tok-fn">endMode3D</span>(gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawCrane</span>(s: *State, gl: *z.WgpuGl, c: *<span class="tok-kw">const</span> Crane, depth: f32) void {
    <span class="tok-kw">const</span> rail_y: f32 = <span class="tok-num">5.0</span>;

    <span class="tok-comment">// The rail, and the flag marking the target.</span>
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">translation</span>(s.target * <span class="tok-num">0.5</span>, rail_y + <span class="tok-num">0.15</span>, depth),
        <span class="tok-fn">scaling</span>(s.target + <span class="tok-num">6.0</span>, <span class="tok-num">0.12</span>, <span class="tok-num">0.3</span>),
    );
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, rail_colour);
    z.<span class="tok-fn">drawLine3D</span>(gl, <span class="tok-fn">vec</span>(s.target, rail_y, depth), <span class="tok-fn">vec</span>(s.target, rail_y - body.cable - <span class="tok-num">0.6</span>, depth), flag_colour);

    <span class="tok-comment">// The trolley, and an arrow for the acceleration it is being given.</span>
    <span class="tok-kw">const</span> trolley: Vec = <span class="tok-fn">vec</span>(c.state[mpc.crane_pos_offset], rail_y, depth);
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(trolley[<span class="tok-num">0</span>], trolley[<span class="tok-num">1</span>], trolley[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.7</span>, <span class="tok-num">0.35</span>, <span class="tok-num">0.5</span>));
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, trolley_colour);
    z.<span class="tok-fn">drawLine3D</span>(gl, trolley, trolley + <span class="tok-fn">vec</span>(c.accel * <span class="tok-num">1.2</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), flag_colour);

    <span class="tok-comment">// Cable and payload. The load turns green once it has genuinely stopped swinging.</span>
    <span class="tok-kw">const</span> load: Vec = <span class="tok-fn">payloadAt</span>(c.state, rail_y);
    z.<span class="tok-fn">drawLine3D</span>(gl, trolley, load, cable_colour);
    <span class="tok-kw">const</span> still: bool = <span class="tok-builtin">@abs</span>(c.state[mpc.crane_angle_offset]) &lt; <span class="tok-num">0.02</span> <span class="tok-kw">and</span>
        <span class="tok-builtin">@abs</span>(c.state[mpc.crane_rate_offset]) &lt; <span class="tok-num">0.02</span>;
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(load[<span class="tok-num">0</span>], load[<span class="tok-num">1</span>], load[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.45</span>, <span class="tok-num">0.45</span>, <span class="tok-num">0.45</span>));
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, <span class="tok-kw">if</span> (still) load_still <span class="tok-kw">else</span> load_swinging);

    <span class="tok-comment">// * THE PAYLOAD'S PATH, which is the comparison drawn: one arrives and stops, the other</span>
    <span class="tok-comment">// keeps drawing arcs long after the trolley has parked.</span>
    <span class="tok-kw">if</span> (c.trail_count &gt; <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> start: usize = <span class="tok-kw">if</span> (c.trail_count &lt; trail_length) <span class="tok-num">0</span> <span class="tok-kw">else</span> c.trail_next;
        <span class="tok-kw">for</span> (<span class="tok-num">1</span>..c.trail_count) |i| {
            <span class="tok-kw">const</span> a: Vec = c.trail[(start + i - <span class="tok-num">1</span>) % trail_length];
            <span class="tok-kw">const</span> b: Vec = c.trail[(start + i) % trail_length];
            z.<span class="tok-fn">drawLine3D</span>(gl, a, b, trail_colour);
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(u: ui.Ui, s: *State, viewport_w: f32, viewport_h: f32) bool {
    <span class="tok-comment">// * THE HEIGHT IS NO LONGER NEEDED: the window sizes to its content, so nothing here has to</span>
    <span class="tok-comment">// know how tall the viewport is. Kept in the signature because every example shares it.</span>
    _ = viewport_h;
    <span class="tok-kw">const</span> captured: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    <span class="tok-kw">const</span> narrow: bool = ui.Ui.<span class="tok-fn">isNarrow</span>(viewport_w);
    <span class="tok-comment">// * AUTO-SIZED, AND NARROW ON A PHONE. These panels asked for 70-80% of the viewport height,</span>
    <span class="tok-comment">// which on a phone left the thing the demo is ABOUT as a sliver at the bottom. Letting the</span>
    <span class="tok-comment">// window size to its content keeps it as small as it can be, and capping the width stops it</span>
    <span class="tok-comment">// spanning the screen.</span>
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-kw">if</span> (narrow) <span class="tok-builtin">@min</span>(viewport_w - <span class="tok-num">16</span>, <span class="tok-num">340.0</span>) <span class="tok-kw">else</span> <span class="tok-builtin">@min</span>(<span class="tok-num">380.0</span>, viewport_w * <span class="tok-num">0.32</span>);

    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">0</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"carrying a swinging load"</span>, .{ .flags = .{ .always_auto_resize = true } })) |window| {
        <span class="tok-kw">defer</span> window.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"same target, same accel limit."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"one plans, one does not."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-fn">report</span>(u, <span class="tok-str">"PD  "</span>, &amp;s.pd);
        <span class="tok-fn">report</span>(u, <span class="tok-str">"MPC "</span>, &amp;s.planner);
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"target m"</span>, &amp;s.target, .{ .min = <span class="tok-num">3.0</span>, .max = <span class="tok-num">18.0</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"accel limit"</span>, &amp;s.accel_limit, .{ .min = <span class="tok-num">0.3</span>, .max = <span class="tok-num">3.0</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"RESET"</span>, .{})) {
            <span class="tok-fn">resetAll</span>(s);
        }
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"run"</span>, &amp;s.running);
        u.<span class="tok-fn">separator</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"watch the MPC trolley slow early and"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  briefly reverse — that is it pushing"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  INTO the swing to kill it."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"green load = genuinely stopped"</span>, .{});
    }
    <span class="tok-kw">return</span> captured;
}

<span class="tok-kw">fn</span> <span class="tok-fn">report</span>(u: ui.Ui, label: []<span class="tok-kw">const</span> u8, c: *<span class="tok-kw">const</span> Crane) void {
    u.<span class="tok-fn">text</span>(<span class="tok-str">"{s} x {d:&gt;6.2}  swing {d:&gt;7.4} rad"</span>, .{
        label,
        c.state[mpc.crane_pos_offset],
        c.state[mpc.crane_angle_offset],
    });
    u.<span class="tok-fn">text</span>(<span class="tok-str">"     peak speed {d:&gt;5.2} m/s   accel {d:&gt;6.2}"</span>, .{ c.peak_speed, c.accel });
}

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - carrying a swinging load"</span>,
            .width = <span class="tok-num">940</span>,
            .height = <span class="tok-num">620</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
