<h1>ui_custom_rendering</h1>
<figure class="code src-file" data-path="examples/ui_custom_rendering/ui_custom_rendering.zig" data-lines="377"><figcaption><span>examples/ui_custom_rendering/ui_custom_rendering.zig</span><span>377 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_custom_rendering.zig - DrawList primitives showcase.</span>
<span class="tok-comment">// Mirrors imgui's "Custom Rendering" demo section.  The window has</span>
<span class="tok-comment">// a fixed-size canvas region; we record arbitrary primitives into</span>
<span class="tok-comment">// the window's draw list and they get rendered with the rest of the</span>
<span class="tok-comment">// UI in proper clip-rect order.</span>
<span class="tok-comment">// The point of this demo: show every Phase 0a DrawList primitive in</span>
<span class="tok-comment">// one place, driven by live sliders.  Useful both as a primitive</span>
<span class="tok-comment">// gallery and as the answer to "how do I draw arbitrary stuff</span>
<span class="tok-comment">// inside a window?".</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> radFromDeg = zm.radFromDeg;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> screen_w: i32 = <span class="tok-num">900</span>;
<span class="tok-kw">const</span> screen_h: i32 = <span class="tok-num">600</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    <span class="tok-comment">// Tunables, exposed as sliders.</span>
    line_thickness: f32 = <span class="tok-num">2.0</span>,
    polyline_thickness: f32 = <span class="tok-num">2.0</span>,
    triangle_thickness: f32 = <span class="tok-num">2.0</span>,
    circle_radius: f32 = <span class="tok-num">28.0</span>,
    circle_thickness: f32 = <span class="tok-num">2.0</span>,
    circle_segments: i32 = <span class="tok-num">0</span>, <span class="tok-comment">// 0 = auto</span>
    ngon_sides: i32 = <span class="tok-num">6</span>,
    ngon_radius: f32 = <span class="tok-num">28.0</span>,
    ngon_rotation_deg: f32 = <span class="tok-num">0.0</span>,
    ngon_thickness: f32 = <span class="tok-num">2.0</span>,
    ellipse_radius_h: f32 = <span class="tok-num">38.0</span>,
    ellipse_radius_v: f32 = <span class="tok-num">22.0</span>,
    bezier_thickness: f32 = <span class="tok-num">2.5</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
}

<span class="tok-kw">fn</span> <span class="tok-fn">pack</span>(c: Color) u32 {
    <span class="tok-comment">// Same packing as UI's internal `packColor` - RGBA little-endian.</span>
    <span class="tok-kw">return</span> (<span class="tok-builtin">@as</span>(u32, c.a) &lt;&lt; <span class="tok-num">24</span>) | (<span class="tok-builtin">@as</span>(u32, c.b) &lt;&lt; <span class="tok-num">16</span>) | (<span class="tok-builtin">@as</span>(u32, c.g) &lt;&lt; <span class="tok-num">8</span>) | <span class="tok-builtin">@as</span>(u32, c.r);
}

<span class="tok-comment">/// Small caption beneath each primitive cell.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">labelCell</span>(
    dl: *ui.DrawList,
    gpa: Allocator,
    s: []<span class="tok-kw">const</span> u8,
    pos: Vec2,
) void {
    dl.<span class="tok-fn">addText</span>(gpa, null, s, pos, <span class="tok-num">11</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">200</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">200</span>, .a = <span class="tok-num">255</span> }));
}

<span class="tok-comment">/// Pull the active window's draw list and record one of every</span>
<span class="tok-comment">/// primitive at a known canvas position.  The layout is a single</span>
<span class="tok-comment">/// row of fixed-size cells, each a 90x90 patch.  Cells advance</span>
<span class="tok-comment">/// horizontally; if we run out of width we wrap to the next row.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawPrimitivesCanvas</span>(u: ui.Ui, s: *<span class="tok-kw">const</span> State) void {
    <span class="tok-kw">const</span> dl: *ui.DrawList = u.<span class="tok-fn">getDrawList</span>() <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">const</span> gpa: Allocator = u.<span class="tok-fn">drawListAllocator</span>();

    <span class="tok-comment">// Reserve a 600x200 vertical strip in the window's content area.</span>
    <span class="tok-comment">// `dummy` advances the layout cursor; we read the screen pos</span>
    <span class="tok-comment">// before that so we know where to draw.</span>
    <span class="tok-kw">const</span> origin: Vec2 = u.<span class="tok-fn">getCursorScreenPos</span>();
    u.<span class="tok-fn">dummy</span>(.{ <span class="tok-num">600</span>, <span class="tok-num">220</span> });

    <span class="tok-comment">// ColorU32 helpers - pre-pack a few we'll reuse.</span>
    <span class="tok-kw">const</span> red: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">239</span>, .g = <span class="tok-num">68</span>, .b = <span class="tok-num">68</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> sky: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">56</span>, .g = <span class="tok-num">189</span>, .b = <span class="tok-num">248</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> amber: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">245</span>, .g = <span class="tok-num">158</span>, .b = <span class="tok-num">11</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> lime: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">132</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">22</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> violet: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">168</span>, .g = <span class="tok-num">85</span>, .b = <span class="tok-num">247</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> cyan: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">34</span>, .g = <span class="tok-num">211</span>, .b = <span class="tok-num">238</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> pink: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">236</span>, .g = <span class="tok-num">72</span>, .b = <span class="tok-num">153</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> white: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">240</span>, .b = <span class="tok-num">240</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-comment">// Cell layout.</span>
    <span class="tok-kw">const</span> cell_w: f32 = <span class="tok-num">95</span>;
    <span class="tok-kw">const</span> cell_h: f32 = <span class="tok-num">100</span>;
    <span class="tok-kw">const</span> margin: f32 = <span class="tok-num">5</span>;
    <span class="tok-kw">const</span> cols: usize = <span class="tok-num">6</span>;

    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">const</span> cell = <span class="tok-kw">struct</span> {
        <span class="tok-kw">const</span> CellPos = <span class="tok-kw">struct</span> { x: f32, y: f32, cx: f32, cy: f32 };

        <span class="tok-kw">fn</span> <span class="tok-fn">at</span>(
            o: Vec2,
            w: f32,
            h: f32,
            idx: usize,
            c: usize,
        ) CellPos {
            <span class="tok-kw">const</span> col_i: f32 = <span class="tok-fn">float</span>(idx % c);
            <span class="tok-kw">const</span> row_i: f32 = <span class="tok-fn">float</span>(idx / c);
            <span class="tok-kw">const</span> x: f32 = o[<span class="tok-num">0</span>] + col_i * w;
            <span class="tok-kw">const</span> y: f32 = o[<span class="tok-num">1</span>] + row_i * h;
            <span class="tok-kw">return</span> .{ .x = x, .y = y, .cx = x + w * <span class="tok-num">0.5</span>, .cy = y + h * <span class="tok-num">0.5</span> };
        }
    };

    <span class="tok-comment">// 1. line</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addLine</span>(
            gpa,
            .{ p.x + margin, p.y + margin },
            .{ p.x + cell_w - margin, p.y + cell_h - margin },
            red,
            s.line_thickness,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"line"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 2. polyline (open)</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        <span class="tok-kw">var</span> pts: [<span class="tok-num">5</span>]Vec2 = .{
            .{ p.x + <span class="tok-num">10</span>, p.y + cell_h - <span class="tok-num">15</span> },
            .{ p.x + <span class="tok-num">25</span>, p.y + <span class="tok-num">30</span> },
            .{ p.x + <span class="tok-num">45</span>, p.y + <span class="tok-num">55</span> },
            .{ p.x + <span class="tok-num">65</span>, p.y + <span class="tok-num">20</span> },
            .{ p.x + cell_w - <span class="tok-num">10</span>, p.y + cell_h - <span class="tok-num">15</span> },
        };
        dl.<span class="tok-fn">addPolyline</span>(gpa, pts[<span class="tok-num">0</span>..], sky, s.polyline_thickness, false);
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"polyline"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 3. triangle outline</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addTriangle</span>(
            gpa,
            .{ p.cx, p.y + <span class="tok-num">15</span> },
            .{ p.x + <span class="tok-num">15</span>, p.y + cell_h - <span class="tok-num">20</span> },
            .{ p.x + cell_w - <span class="tok-num">15</span>, p.y + cell_h - <span class="tok-num">20</span> },
            amber,
            s.triangle_thickness,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"triangle"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 4. triangle_filled</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addTriangleFilled</span>(
            gpa,
            .{ p.cx, p.y + <span class="tok-num">15</span> },
            .{ p.x + <span class="tok-num">15</span>, p.y + cell_h - <span class="tok-num">20</span> },
            .{ p.x + cell_w - <span class="tok-num">15</span>, p.y + cell_h - <span class="tok-num">20</span> },
            lime,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"tri filled"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 5. quad_filled</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addQuadFilled</span>(
            gpa,
            .{ p.cx, p.y + <span class="tok-num">12</span> },
            .{ p.x + cell_w - <span class="tok-num">15</span>, p.cy },
            .{ p.cx, p.y + cell_h - <span class="tok-num">20</span> },
            .{ p.x + <span class="tok-num">15</span>, p.cy },
            violet,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"quad"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 6. circle (outline)</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        <span class="tok-kw">const</span> segs: u32 = <span class="tok-builtin">@intCast</span>(s.circle_segments);
        dl.<span class="tok-fn">addCircle</span>(
            gpa,
            .{ p.cx, p.cy - <span class="tok-num">5</span> },
            s.circle_radius,
            cyan,
            s.circle_thickness,
            segs,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"circle"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 7. circle_filled</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        <span class="tok-kw">const</span> segs: u32 = <span class="tok-builtin">@intCast</span>(s.circle_segments);
        dl.<span class="tok-fn">addCircleFilled</span>(
            gpa,
            .{ p.cx, p.cy - <span class="tok-num">5</span> },
            s.circle_radius,
            pink,
            segs,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"circ filled"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 8. ngon (outline)</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addNgon</span>(
            gpa,
            .{ p.cx, p.cy - <span class="tok-num">5</span> },
            s.ngon_radius,
            <span class="tok-builtin">@intCast</span>(s.ngon_sides),
            <span class="tok-fn">radFromDeg</span>(s.ngon_rotation_deg),
            white,
            s.ngon_thickness,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"ngon"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 9. ngon_filled</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addNgonFilled</span>(
            gpa,
            .{ p.cx, p.cy - <span class="tok-num">5</span> },
            s.ngon_radius,
            <span class="tok-builtin">@intCast</span>(s.ngon_sides),
            <span class="tok-fn">radFromDeg</span>(s.ngon_rotation_deg),
            amber,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"ngon fill"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 10. bezier_cubic</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addBezierCubic</span>(
            gpa,
            .{ p.x + <span class="tok-num">10</span>, p.y + cell_h - <span class="tok-num">20</span> },
            .{ p.x + <span class="tok-num">25</span>, p.y + <span class="tok-num">10</span> },
            .{ p.x + cell_w - <span class="tok-num">25</span>, p.y + cell_h - <span class="tok-num">10</span> },
            .{ p.x + cell_w - <span class="tok-num">10</span>, p.y + <span class="tok-num">15</span> },
            sky,
            s.bezier_thickness,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"bezier"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 11. ellipse (outline)</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addEllipse</span>(
            gpa,
            .{ p.cx, p.cy - <span class="tok-num">5</span> },
            s.ellipse_radius_h,
            s.ellipse_radius_v,
            cyan,
            <span class="tok-num">1</span>,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"ellipse"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 12. ellipse_filled</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addEllipseFilled</span>(
            gpa,
            .{ p.cx, p.cy - <span class="tok-num">5</span> },
            s.ellipse_radius_h,
            s.ellipse_radius_v,
            violet,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"ell filled"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 13. rect_filled_multi_color (gradient)</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        dl.<span class="tok-fn">addRectFilledMultiColor</span>(
            gpa,
            .{ .x = p.x + <span class="tok-num">10</span>, .y = p.y + <span class="tok-num">10</span>, .width = cell_w - <span class="tok-num">20</span>, .height = cell_h - <span class="tok-num">30</span> },
            red,
            amber,
            lime,
            sky,
        );
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"gradient"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }

    <span class="tok-comment">// 14. polyline (closed) - bonus, shows `closed = true` path</span>
    {
        <span class="tok-kw">const</span> p: cell.CellPos = cell.<span class="tok-fn">at</span>(origin, cell_w, cell_h, i, cols);
        <span class="tok-kw">var</span> pts: [<span class="tok-num">5</span>]Vec2 = .{
            .{ p.cx, p.y + <span class="tok-num">14</span> },
            .{ p.x + cell_w - <span class="tok-num">15</span>, p.cy - <span class="tok-num">5</span> },
            .{ p.x + cell_w - <span class="tok-num">25</span>, p.y + cell_h - <span class="tok-num">25</span> },
            .{ p.x + <span class="tok-num">25</span>, p.y + cell_h - <span class="tok-num">25</span> },
            .{ p.x + <span class="tok-num">15</span>, p.cy - <span class="tok-num">5</span> },
        };
        dl.<span class="tok-fn">addPolyline</span>(gpa, pts[<span class="tok-num">0</span>..], lime, s.polyline_thickness, true);
        <span class="tok-fn">labelCell</span>(dl, gpa, <span class="tok-str">"polyline ⟲"</span>, .{ p.x, p.y + cell_h - <span class="tok-num">14</span> });
        i += <span class="tok-num">1</span>;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"DrawList primitives"</span>, .{
        .initial_pos = .{ <span class="tok-num">20</span>, <span class="tok-num">20</span> },
        .initial_size = .{ <span class="tok-num">860</span>, <span class="tok-num">560</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Every Phase 0a primitive, drawn inline via getDrawList()."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-fn">drawPrimitivesCanvas</span>(u, s);

        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Tuning"</span>, .{});
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"line thickness"</span>, &amp;s.line_thickness, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">10</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"polyline thickness"</span>, &amp;s.polyline_thickness, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">10</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"triangle thickness"</span>, &amp;s.triangle_thickness, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">10</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"circle radius"</span>, &amp;s.circle_radius, .{ .min = <span class="tok-num">4</span>, .max = <span class="tok-num">80</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"circle thickness"</span>, &amp;s.circle_thickness, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">10</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"circle segments (0 = auto)"</span>, &amp;s.circle_segments, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">128</span>, .fmt = <span class="tok-str">"{d}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"ngon sides"</span>, &amp;s.ngon_sides, .{ .min = <span class="tok-num">3</span>, .max = <span class="tok-num">12</span>, .fmt = <span class="tok-str">"{d}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"ngon radius"</span>, &amp;s.ngon_radius, .{ .min = <span class="tok-num">4</span>, .max = <span class="tok-num">80</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"ngon rotation"</span>, &amp;s.ngon_rotation_deg, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">360</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"ngon thickness"</span>, &amp;s.ngon_thickness, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">10</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"ellipse radius H"</span>, &amp;s.ellipse_radius_h, .{ .min = <span class="tok-num">6</span>, .max = <span class="tok-num">80</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"ellipse radius V"</span>, &amp;s.ellipse_radius_v, .{ .min = <span class="tok-num">6</span>, .max = <span class="tok-num">80</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"bezier thickness"</span>, &amp;s.bezier_thickness, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">8</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - UI custom rendering"</span>,
            .width = screen_w,
            .height = screen_h,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
};
