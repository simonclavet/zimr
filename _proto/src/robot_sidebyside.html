<h1>robot_sidebyside</h1>
<figure class="code src-file" data-path="examples/robot_sidebyside/robot_sidebyside.zig" data-lines="483"><figcaption><span>examples/robot_sidebyside/robot_sidebyside.zig</span><span>483 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! robot_sidebyside - the same double pendulum, simulated two ways.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! * THIS IS THE ARGUMENT FOR THE WHOLE PORT, ON ONE SCREEN.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! LEFT: zimrphysics. Two rigid bodies, each carrying a full pose in world space, held</span>
<span class="tok-comment">//! together by revolute constraints that a solver enforces every step.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! RIGHT: robot.zig. Two numbers. The joints are not enforced - they are the coordinates,</span>
<span class="tok-comment">//! so there is nothing to violate.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Both start from the same state, with the same masses, at the same timestep. The readout</span>
<span class="tok-comment">//! measures how far each engine's joints have come apart: the distance between the two</span>
<span class="tok-comment">//! points that a joint says must coincide. On the right it is **exactly zero, forever**,</span>
<span class="tok-comment">//! and no amount of speed or stiffness changes that. On the left it is a small number that</span>
<span class="tok-comment">//! wanders, and grows when you make the problem harder.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- BE FAIR TO THE LEFT --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! zimrphysics is not losing. It is doing something different, and doing it well: for a</span>
<span class="tok-comment">//! thousand loose crates, maximal coordinates are the right model, they parallelise, and a</span>
<span class="tok-comment">//! millimetre of joint error is invisible. What this demo shows is a SPECIFIC TRADE, not a</span>
<span class="tok-comment">//! verdict - and the trade only matters when error accumulates down a chain, which is</span>
<span class="tok-comment">//! exactly what a robot arm is. A millimetre at the shoulder is centimetres at the hand.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Standard wgpu example contract: a `pub const app: z.AppSpec(State)`.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> zp = z.zimrphysics;
<span class="tok-kw">const</span> rbt = z.robot;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> vec2 = zm.vec2;
<span class="tok-kw">const</span> rotate = zm.rotate;
<span class="tok-kw">const</span> length3 = zm.length3;
<span class="tok-kw">const</span> float = zm.float;

<span class="tok-comment">// ---- One set of numbers, used to build BOTH models ----</span>
<span class="tok-comment">// Shared deliberately: if the two engines were given even slightly different masses or</span>
<span class="tok-comment">// lengths the comparison would be meaningless, and the difference would be invisible.</span>
<span class="tok-kw">const</span> upper_half: f32 = <span class="tok-num">0.22</span>;
<span class="tok-kw">const</span> lower_half: f32 = <span class="tok-num">0.18</span>;
<span class="tok-kw">const</span> link_radius: f32 = <span class="tok-num">0.045</span>;
<span class="tok-kw">const</span> density: f32 = <span class="tok-num">1000.0</span>;
<span class="tok-kw">const</span> timestep: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">240.0</span>;
<span class="tok-comment">/// Both start here, well away from vertical so the motion is vigorous.</span>
<span class="tok-kw">const</span> start_shoulder: f32 = <span class="tok-num">2.3</span>;
<span class="tok-kw">const</span> start_elbow: f32 = -<span class="tok-num">1.5</span>;

<span class="tok-kw">const</span> Pendulum = rbt.<span class="tok-fn">Spec</span>(.{
    .bodies = &amp;.{
        .{
            .name = <span class="tok-str">"upper"</span>,
            .joints = &amp;.{.{ .name = <span class="tok-str">"shoulder"</span>, .kind = .hinge, .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), .armature = <span class="tok-num">0</span> }},
            .geoms = &amp;.{.{
                .shape = .{ .capsule = .{ .half_height = upper_half, .radius = link_radius } },
                .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -upper_half, <span class="tok-num">0</span>),
                .density = density,
            }},
        },
        .{
            .name = <span class="tok-str">"lower"</span>,
            .parent = <span class="tok-str">"upper"</span>,
            .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * upper_half, <span class="tok-num">0</span>),
            .joints = &amp;.{.{ .name = <span class="tok-str">"elbow"</span>, .kind = .hinge, .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), .armature = <span class="tok-num">0</span> }},
            .geoms = &amp;.{.{
                .shape = .{ .capsule = .{ .half_height = lower_half, .radius = link_radius } },
                .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -lower_half, <span class="tok-num">0</span>),
                .density = density,
            }},
        },
    },
    .options = .{ .timestep = timestep },
});

<span class="tok-kw">const</span> bg: Color = .{ .r = <span class="tok-num">31</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">14</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> panel: Color = .{ .r = <span class="tok-num">51</span>, .g = <span class="tok-num">34</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> maximal: Color = .{ .r = <span class="tok-num">211</span>, .g = <span class="tok-num">95</span>, .b = <span class="tok-num">51</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> generalized: Color = .{ .r = <span class="tok-num">79</span>, .g = <span class="tok-num">179</span>, .b = <span class="tok-num">165</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> text_col: Color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">230</span>, .b = <span class="tok-num">210</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> dim_col: Color = .{ .r = <span class="tok-num">168</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">132</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> alarm: Color = .{ .r = <span class="tok-num">232</span>, .g = <span class="tok-num">120</span>, .b = <span class="tok-num">92</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    font: z.Font,

    <span class="tok-comment">// ---- right: generalized coordinates ----</span>
    model: rbt.Model,
    data: rbt.Data,

    <span class="tok-comment">// ---- left: maximal coordinates ----</span>
    world: zp.World,
    upper: zp.BodyHandle,
    lower: zp.BodyHandle,

    accumulator: f32,
    elapsed: f32,
    <span class="tok-comment">/// Worst joint-anchor error seen on each side since the last reset. The WORST rather</span>
    <span class="tok-comment">/// than the current, because the instantaneous value flickers and the honest question</span>
    <span class="tok-comment">/// is how bad it ever gets.</span>
    worst_maximal: f32,
    worst_generalized: f32,

    <span class="tok-kw">fn</span> <span class="tok-fn">reset</span>(self: *State) !void {
        self.data.<span class="tok-fn">reset</span>(&amp;self.model);
        self.data.<span class="tok-fn">setJointPos</span>(&amp;self.model, Pendulum.Joint.shoulder, start_shoulder);
        self.data.<span class="tok-fn">setJointPos</span>(&amp;self.model, Pendulum.Joint.elbow, start_elbow);
        rbt.<span class="tok-fn">forward</span>(&amp;self.model, &amp;self.data);

        <span class="tok-comment">// Place the maximal bodies at exactly where the generalized model says its links</span>
        <span class="tok-comment">// are. Deriving the left side's initial pose FROM the right side is the only way to</span>
        <span class="tok-comment">// be sure both start from the same configuration rather than from two independent</span>
        <span class="tok-comment">// transcriptions of the same intent.</span>
        <span class="tok-kw">try</span> self.<span class="tok-fn">placeBody</span>(self.upper, <span class="tok-num">1</span>);
        <span class="tok-kw">try</span> self.<span class="tok-fn">placeBody</span>(self.lower, <span class="tok-num">2</span>);

        self.accumulator = <span class="tok-num">0</span>;
        self.elapsed = <span class="tok-num">0</span>;
        self.worst_maximal = <span class="tok-num">0</span>;
        self.worst_generalized = <span class="tok-num">0</span>;
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">placeBody</span>(self: *State, handle: zp.BodyHandle, link: u32) !void {
        <span class="tok-kw">const</span> idx: zp.BodyIndex = handle.<span class="tok-fn">index</span>();
        <span class="tok-comment">// The robot's body origin is the link's top; the physics body's shape is centred on</span>
        <span class="tok-comment">// its own origin, so offset by half a link down the link's own axis.</span>
        <span class="tok-kw">const</span> half: f32 = <span class="tok-kw">if</span> (link == <span class="tok-num">1</span>) upper_half <span class="tok-kw">else</span> lower_half;
        <span class="tok-kw">const</span> centre: Vec = self.data.body_xpos[link] +
            <span class="tok-fn">rotate</span>(self.data.body_xrot[link], <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -half, <span class="tok-num">0</span>));
        <span class="tok-kw">try</span> self.world.<span class="tok-fn">setTransform</span>(self.gpa, idx, centre, self.data.body_xrot[link]);
        <span class="tok-kw">try</span> self.world.<span class="tok-fn">setLinearVelocity</span>(self.gpa, handle, zm.vec_zero);
        <span class="tok-kw">try</span> self.world.<span class="tok-fn">setAngularVelocity</span>(self.gpa, handle, zm.vec_zero);
    }
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{
        .gpa = gpa,
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .model = <span class="tok-kw">try</span> Pendulum.<span class="tok-fn">build</span>(gpa),
        .data = undefined,
        .world = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, <span class="tok-num">16</span>),
        .upper = undefined,
        .lower = undefined,
        .accumulator = <span class="tok-num">0</span>,
        .elapsed = <span class="tok-num">0</span>,
        .worst_maximal = <span class="tok-num">0</span>,
        .worst_generalized = <span class="tok-num">0</span>,
    };
    s.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;s.model);
    s.world.gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">9.81</span>, <span class="tok-num">0</span>);

    <span class="tok-kw">const</span> upper_shape: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .capsule = .{ .half_height = upper_half, .radius = link_radius },
    });
    <span class="tok-kw">const</span> lower_shape: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .capsule = .{ .half_height = lower_half, .radius = link_radius },
    });
    s.upper = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{
        .shape = upper_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -upper_half, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = density,
        <span class="tok-comment">// The links must not collide with each other - they overlap at the joint by</span>
        <span class="tok-comment">// construction, and a contact there would be an artefact of the discretisation</span>
        <span class="tok-comment">// rather than physics. A shared group is how zimrphysics says "same assembly".</span>
        .group_id = <span class="tok-num">1</span>,
    });
    s.lower = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{
        .shape = lower_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * upper_half - lower_half, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = density,
        .group_id = <span class="tok-num">1</span>,
    });

    <span class="tok-comment">// An immovable anchor for the shoulder. zimrphysics has no implicit world body, so the</span>
    <span class="tok-comment">// pivot has to be a real static body - which is itself a small illustration of the</span>
    <span class="tok-comment">// difference: on the generalized side the world is body 0 and needs no representation.</span>
    <span class="tok-kw">const</span> anchor_shape: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{ .sphere = .{ .radius = <span class="tok-num">0.01</span> } });
    <span class="tok-kw">const</span> anchor: zp.BodyHandle = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{
        .shape = anchor_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
        .group_id = <span class="tok-num">1</span>,
    });

    <span class="tok-comment">// The two revolute joints, at exactly the anchors the generalized model uses.</span>
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createRevoluteJoint</span>(&amp;s.world, anchor, s.upper, .{
        .anchor = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
    });
    <span class="tok-kw">try</span> zp.<span class="tok-fn">createRevoluteJoint</span>(&amp;s.world, s.upper, s.lower, .{
        .anchor = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * upper_half, <span class="tok-num">0</span>),
        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
    });

    <span class="tok-kw">try</span> s.<span class="tok-fn">reset</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.world.<span class="tok-fn">deinit</span>(gpa);
    s.data.<span class="tok-fn">deinit</span>();
    s.model.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-comment">/// The same measurement on the generalized side.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Reads the elbow twice - once as the parent's far end, once as the child's origin - and</span>
<span class="tok-comment">/// returns the distance between them, exactly as the maximal version does. The answer is</span>
<span class="tok-comment">/// structurally zero, because `kinematics` computes the child's origin FROM the parent's</span>
<span class="tok-comment">/// pose, so the two expressions are the same number by construction.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Computed rather than printed as a constant. A hardcoded zero would be a claim; this is a</span>
<span class="tok-comment">/// measurement that happens to be zero, and if a future change to `kinematics` ever broke</span>
<span class="tok-comment">/// the property, this readout would say so.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">generalizedJointError</span>(s: *<span class="tok-kw">const</span> State) f32 {
    <span class="tok-kw">const</span> from_parent: Vec = s.data.body_xpos[<span class="tok-num">1</span>] +
        <span class="tok-fn">rotate</span>(s.data.body_xrot[<span class="tok-num">1</span>], <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * upper_half, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> from_child: Vec = s.data.body_xpos[<span class="tok-num">2</span>];
    <span class="tok-kw">return</span> <span class="tok-fn">length3</span>(from_parent - from_child);
}

<span class="tok-comment">/// How far apart the two points a joint says must coincide have actually drifted.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// For the maximal side this is a real measurement: each body carries an independent pose,</span>
<span class="tok-comment">/// and the constraint holds them together only to the solver's tolerance. For the</span>
<span class="tok-comment">/// generalized side it is a formality - the shared point is computed once from the parent</span>
<span class="tok-comment">/// and inherited by the child, so it cannot differ from itself. Measuring both the same way</span>
<span class="tok-comment">/// is the point: the number on the right is zero because of what it IS, not because it was</span>
<span class="tok-comment">/// specially handled.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">maximalJointError</span>(s: *<span class="tok-kw">const</span> State) f32 {
    <span class="tok-kw">const</span> upper: *<span class="tok-kw">const</span> zp.Body = &amp;s.world.bodies.data[s.upper.<span class="tok-fn">index</span>()];
    <span class="tok-kw">const</span> lower: *<span class="tok-kw">const</span> zp.Body = &amp;s.world.bodies.data[s.lower.<span class="tok-fn">index</span>()];
    <span class="tok-comment">// The elbow, as each body believes it to be.</span>
    <span class="tok-kw">const</span> from_upper: Vec = upper.com_pos + <span class="tok-fn">rotate</span>(upper.rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -upper_half, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> from_lower: Vec = lower.com_pos + <span class="tok-fn">rotate</span>(lower.rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, lower_half, <span class="tok-num">0</span>));
    <span class="tok-kw">return</span> <span class="tok-fn">length3</span>(from_upper - from_lower);
}

<span class="tok-comment">/// How much to scale text and spacing for this viewport.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * NOT A COSMETIC KNOB. A standalone build renders into a canvas at DEVICE resolution: a</span>
<span class="tok-comment">/// phone whose CSS width is 400 gives a canvas around 1080 pixels wide, so a font asked for</span>
<span class="tok-comment">/// at 13 "pixels" arrives about four CSS pixels tall and is genuinely unreadable. The in-app</span>
<span class="tok-comment">/// viewer hides this by rendering smaller; open the same file in a browser full-screen and</span>
<span class="tok-comment">/// the labels vanish.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Scaling against the viewport's SMALLER dimension is resolution-independent - it makes a</span>
<span class="tok-comment">/// glyph a fixed fraction of the screen rather than a fixed count of pixels - and gives sane</span>
<span class="tok-comment">/// results on a desktop window and a phone alike, without needing the device pixel ratio,</span>
<span class="tok-comment">/// which is not exposed here.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">uiScale</span>(w: f32, h: f32) f32 {
    <span class="tok-kw">return</span> <span class="tok-builtin">@max</span>(<span class="tok-num">1.0</span>, <span class="tok-builtin">@min</span>(w, h) / <span class="tok-num">450.0</span>);
}

<span class="tok-comment">/// Where each panel sits and how big it is.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Side by side when the window is wide, STACKED when it is tall. A phone in portrait is</span>
<span class="tok-comment">/// roughly 1:2, and forcing two panels across it leaves each one narrower than the pendulum</span>
<span class="tok-comment">/// is long - so the arms overrun the divider and the two readouts collide. Choosing the</span>
<span class="tok-comment">/// axis from the aspect ratio costs one branch and is the difference between a demo that</span>
<span class="tok-comment">/// reads on the device it is looked at on and one that does not.</span>
<span class="tok-kw">const</span> Layout = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// Panel centres in pixels, and the metres-to-pixels scale they share.</span>
    origin: [<span class="tok-num">2</span>]Vec2,
    scale: f32,
    <span class="tok-comment">/// Where each panel's readout line goes.</span>
    label: [<span class="tok-num">2</span>]Vec2,
    stacked: bool,

    <span class="tok-kw">fn</span> <span class="tok-fn">fit</span>(w: f32, h: f32) Layout {
        <span class="tok-kw">const</span> ui: f32 = <span class="tok-fn">uiScale</span>(w, h);
        <span class="tok-kw">const</span> top: f32 = <span class="tok-num">112</span> * ui; <span class="tok-comment">// headroom for the title block</span>
        <span class="tok-kw">const</span> bottom: f32 = <span class="tok-num">80</span> * ui; <span class="tok-comment">// the reset button and clock</span>
        <span class="tok-kw">const</span> usable_h: f32 = <span class="tok-builtin">@max</span>(h - top - bottom, <span class="tok-num">120</span>);
        <span class="tok-kw">const</span> stacked: bool = h &gt; w * <span class="tok-num">1.15</span>;
        <span class="tok-comment">// The pendulum reaches `reach` metres from its pivot, and hangs DOWNWARD, so what</span>
        <span class="tok-comment">// must fit is the half-width sideways and the full reach below.</span>
        <span class="tok-kw">const</span> reach: f32 = <span class="tok-num">2.0</span> * (upper_half + lower_half);
        <span class="tok-kw">if</span> (stacked) {
            <span class="tok-kw">const</span> cell: f32 = usable_h * <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> scale: f32 = <span class="tok-builtin">@min</span>(w * <span class="tok-num">0.42</span>, cell * <span class="tok-num">0.40</span>) / reach;
            <span class="tok-kw">return</span> .{
                .origin = .{
                    <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.5</span>, top + cell * <span class="tok-num">0.32</span>),
                    <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.5</span>, top + cell + cell * <span class="tok-num">0.32</span>),
                },
                .scale = scale,
                .label = .{
                    <span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, top + cell * <span class="tok-num">0.94</span>),
                    <span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, top + cell + cell * <span class="tok-num">0.94</span>),
                },
                .stacked = true,
            };
        }
        <span class="tok-kw">const</span> scale: f32 = <span class="tok-builtin">@min</span>(w * <span class="tok-num">0.20</span>, usable_h * <span class="tok-num">0.34</span>) / reach;
        <span class="tok-kw">return</span> .{
            .origin = .{ <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.27</span>, top + usable_h * <span class="tok-num">0.30</span>), <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.73</span>, top + usable_h * <span class="tok-num">0.30</span>) },
            .scale = scale,
            .label = .{ <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.04</span>, top - <span class="tok-num">14</span> * ui), <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.52</span>, top - <span class="tok-num">14</span> * ui) },
            .stacked = false,
        };
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">toScreen</span>(self: Layout, side: usize, p: Vec2) Vec2 {
        <span class="tok-kw">const</span> o: Vec2 = self.origin[side];
        <span class="tok-kw">return</span> <span class="tok-fn">vec2</span>(o[<span class="tok-num">0</span>] + p[<span class="tok-num">0</span>] * self.scale, o[<span class="tok-num">1</span>] - p[<span class="tok-num">1</span>] * self.scale);
    }
};

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> w: f32 = <span class="tok-fn">float</span>(f.window.screen_width);
    <span class="tok-kw">const</span> h: f32 = <span class="tok-fn">float</span>(f.window.screen_height);

    s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
    <span class="tok-kw">while</span> (s.accumulator &gt;= timestep) : (s.accumulator -= timestep) {
        zp.<span class="tok-fn">step</span>(&amp;s.world, timestep) <span class="tok-kw">catch</span> |err| {
            zm.<span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"zimrphysics step failed: {t}"</span>, .{err});
        };
        rbt.<span class="tok-fn">step</span>(&amp;s.model, &amp;s.data);
        s.elapsed += timestep;
        s.worst_maximal = <span class="tok-builtin">@max</span>(s.worst_maximal, <span class="tok-fn">maximalJointError</span>(s));
        s.worst_generalized = <span class="tok-builtin">@max</span>(s.worst_generalized, <span class="tok-fn">generalizedJointError</span>(s));
    }
    rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;s.data);

    z.<span class="tok-fn">clearViewport</span>(f, bg);
    <span class="tok-kw">const</span> ui: f32 = <span class="tok-fn">uiScale</span>(w, h);
    <span class="tok-kw">const</span> layout: Layout = .<span class="tok-fn">fit</span>(w, h);
    <span class="tok-comment">// The divider runs across the split, whichever way it goes.</span>
    <span class="tok-kw">if</span> (layout.stacked) {
        <span class="tok-kw">const</span> mid: f32 = (layout.origin[<span class="tok-num">0</span>][<span class="tok-num">1</span>] + layout.origin[<span class="tok-num">1</span>][<span class="tok-num">1</span>]) * <span class="tok-num">0.5</span> + <span class="tok-num">20</span>;
        gl.<span class="tok-fn">line</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">20</span>, mid), <span class="tok-fn">vec2</span>(w - <span class="tok-num">20</span>, mid), .{ .color = panel, .thickness = <span class="tok-num">2</span> * ui });
    } <span class="tok-kw">else</span> {
        gl.<span class="tok-fn">line</span>(<span class="tok-fn">vec2</span>(w * <span class="tok-num">0.5</span>, <span class="tok-num">104</span> * ui), <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.5</span>, h - <span class="tok-num">62</span> * ui), .{ .color = panel, .thickness = <span class="tok-num">2</span> * ui });
    }

    <span class="tok-comment">// ---- left: maximal ----</span>
    {
        <span class="tok-kw">const</span> upper: *<span class="tok-kw">const</span> zp.Body = &amp;s.world.bodies.data[s.upper.<span class="tok-fn">index</span>()];
        <span class="tok-kw">const</span> lower: *<span class="tok-kw">const</span> zp.Body = &amp;s.world.bodies.data[s.lower.<span class="tok-fn">index</span>()];
        <span class="tok-kw">const</span> pivot: Vec = upper.com_pos + <span class="tok-fn">rotate</span>(upper.rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, upper_half, <span class="tok-num">0</span>));
        <span class="tok-kw">const</span> elbow: Vec = upper.com_pos + <span class="tok-fn">rotate</span>(upper.rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -upper_half, <span class="tok-num">0</span>));
        <span class="tok-kw">const</span> elbow_b: Vec = lower.com_pos + <span class="tok-fn">rotate</span>(lower.rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, lower_half, <span class="tok-num">0</span>));
        <span class="tok-kw">const</span> tip: Vec = lower.com_pos + <span class="tok-fn">rotate</span>(lower.rot, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -lower_half, <span class="tok-num">0</span>));
        <span class="tok-comment">// Drawn as TWO separate links from each body's own pose, deliberately. Where they</span>
        <span class="tok-comment">// fail to meet is the joint error, visible as a kink at the elbow - the readout's</span>
        <span class="tok-comment">// number, made geometric.</span>
        gl.<span class="tok-fn">line</span>(
            layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">0</span>, <span class="tok-fn">vec2</span>(pivot[<span class="tok-num">0</span>], pivot[<span class="tok-num">1</span>])),
            layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">0</span>, <span class="tok-fn">vec2</span>(elbow[<span class="tok-num">0</span>], elbow[<span class="tok-num">1</span>])),
            .{ .color = maximal, .thickness = <span class="tok-num">9</span> * ui },
        );
        gl.<span class="tok-fn">line</span>(
            layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">0</span>, <span class="tok-fn">vec2</span>(elbow_b[<span class="tok-num">0</span>], elbow_b[<span class="tok-num">1</span>])),
            layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">0</span>, <span class="tok-fn">vec2</span>(tip[<span class="tok-num">0</span>], tip[<span class="tok-num">1</span>])),
            .{ .color = maximal, .thickness = <span class="tok-num">9</span> * ui },
        );
        gl.<span class="tok-fn">circle</span>(layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">0</span>, <span class="tok-fn">vec2</span>(tip[<span class="tok-num">0</span>], tip[<span class="tok-num">1</span>])), <span class="tok-num">6</span> * ui, .{ .color = maximal });
        gl.<span class="tok-fn">circle</span>(layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">0</span>, <span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>)), <span class="tok-num">6</span> * ui, .{ .color = dim_col });
    }

    <span class="tok-comment">// ---- right: generalized ----</span>
    {
        <span class="tok-kw">const</span> elbow: Vec = s.data.body_xpos[<span class="tok-num">2</span>];
        <span class="tok-kw">const</span> tip: Vec = s.data.body_xpos[<span class="tok-num">2</span>] + <span class="tok-fn">rotate</span>(s.data.body_xrot[<span class="tok-num">2</span>], <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * lower_half, <span class="tok-num">0</span>));
        gl.<span class="tok-fn">line</span>(
            layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">1</span>, <span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>)),
            layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">1</span>, <span class="tok-fn">vec2</span>(elbow[<span class="tok-num">0</span>], elbow[<span class="tok-num">1</span>])),
            .{ .color = generalized, .thickness = <span class="tok-num">9</span> * ui },
        );
        gl.<span class="tok-fn">line</span>(
            layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">1</span>, <span class="tok-fn">vec2</span>(elbow[<span class="tok-num">0</span>], elbow[<span class="tok-num">1</span>])),
            layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">1</span>, <span class="tok-fn">vec2</span>(tip[<span class="tok-num">0</span>], tip[<span class="tok-num">1</span>])),
            .{ .color = generalized, .thickness = <span class="tok-num">9</span> * ui },
        );
        gl.<span class="tok-fn">circle</span>(layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">1</span>, <span class="tok-fn">vec2</span>(tip[<span class="tok-num">0</span>], tip[<span class="tok-num">1</span>])), <span class="tok-num">6</span> * ui, .{ .color = generalized });
        gl.<span class="tok-fn">circle</span>(layout.<span class="tok-fn">toScreen</span>(<span class="tok-num">1</span>, <span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>)), <span class="tok-num">6</span> * ui, .{ .color = dim_col });
    }

    <span class="tok-comment">// ---- the readout, which is the actual content ----</span>
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">30</span> * ui),
        <span class="tok-str">"the same pendulum, twice"</span>,
        .{ .size = <span class="tok-num">20</span> * ui, .color = text_col, .font = &amp;s.font },
    );
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">56</span> * ui),
        <span class="tok-str">"compare the JOINT ERROR, not the pose"</span>,
        .{ .size = <span class="tok-num">13</span> * ui, .color = text_col, .font = &amp;s.font },
    );
    <span class="tok-comment">// * Said outright, because without it the demo looks like it is failing. A double</span>
    <span class="tok-comment">// pendulum is CHAOTIC: any difference between two simulations - and there will always be</span>
    <span class="tok-comment">// one, since the two engines discretise differently - is amplified exponentially, so</span>
    <span class="tok-comment">// within seconds the arms are in visibly different poses. That is correct rather than a</span>
    <span class="tok-comment">// discrepancy to fix. The claim this demo makes is about how far each engine's own</span>
    <span class="tok-comment">// joints have come apart, which is a property of the METHOD and not of the trajectory.</span>
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">80</span> * ui),
        <span class="tok-str">"they drift apart - chaos amplifies any difference. expected."</span>,
        .{ .size = <span class="tok-num">11</span> * ui, .color = dim_col, .font = &amp;s.font },
    );

    <span class="tok-kw">var</span> buf: [<span class="tok-num">128</span>]u8 = undefined;
    <span class="tok-kw">const</span> maximal_now: f32 = <span class="tok-fn">maximalJointError</span>(s);
    <span class="tok-kw">const</span> left_line: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf,
        <span class="tok-str">"ENFORCED by a solver: error {d:.6} m  (worst {d:.6})"</span>,
        .{ maximal_now, s.worst_maximal },
    ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    <span class="tok-kw">const</span> left_col: Color = <span class="tok-kw">if</span> (s.worst_maximal &gt; <span class="tok-num">1.0e-4</span>) alarm <span class="tok-kw">else</span> maximal;
    gl.<span class="tok-fn">text</span>(layout.label[<span class="tok-num">0</span>], left_line, .{ .size = <span class="tok-num">12</span> * ui, .color = left_col, .font = &amp;s.font });

    <span class="tok-kw">var</span> buf2: [<span class="tok-num">128</span>]u8 = undefined;
    <span class="tok-comment">// Not a stored number: recomputed the same way as the left, so the zero is earned.</span>
    <span class="tok-kw">const</span> right_line: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf2,
        <span class="tok-str">"ARE the coordinates: error {d:.6} m  (worst {d:.6})"</span>,
        .{ <span class="tok-fn">generalizedJointError</span>(s), s.worst_generalized },
    ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    gl.<span class="tok-fn">text</span>(layout.label[<span class="tok-num">1</span>], right_line, .{ .size = <span class="tok-num">12</span> * ui, .color = generalized, .font = &amp;s.font });

    <span class="tok-kw">var</span> buf3: [<span class="tok-num">96</span>]u8 = undefined;
    <span class="tok-kw">const</span> clock: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf3, <span class="tok-str">"t = {d:.1} s"</span>, .{s.elapsed}) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    gl.<span class="tok-fn">text</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, h - <span class="tok-num">64</span> * ui), clock, .{ .size = <span class="tok-num">12</span> * ui, .color = dim_col, .font = &amp;s.font });

    <span class="tok-kw">const</span> reset_box: z.Rectangle = .{
        .x = <span class="tok-num">16</span> * ui,
        .y = h - <span class="tok-num">52</span> * ui,
        .width = <span class="tok-num">180</span> * ui,
        .height = <span class="tok-num">42</span> * ui,
    };
    gl.<span class="tok-fn">rect</span>(reset_box, .{ .color = panel });
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(reset_box.x + <span class="tok-num">14</span> * ui, reset_box.y + <span class="tok-num">28</span> * ui),
        <span class="tok-str">"re-throw both"</span>,
        .{ .size = <span class="tok-num">14</span> * ui, .color = text_col, .font = &amp;s.font },
    );
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        <span class="tok-kw">const</span> p: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
        <span class="tok-kw">if</span> (p[<span class="tok-num">0</span>] &gt;= reset_box.x <span class="tok-kw">and</span> p[<span class="tok-num">0</span>] &lt;= reset_box.x + reset_box.width <span class="tok-kw">and</span>
            p[<span class="tok-num">1</span>] &gt;= reset_box.y <span class="tok-kw">and</span> p[<span class="tok-num">1</span>] &lt;= reset_box.y + reset_box.height)
        {
            s.<span class="tok-fn">reset</span>() <span class="tok-kw">catch</span> |err| {
                zm.<span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"reset failed: {t}"</span>, .{err});
            };
        }
    }
}
