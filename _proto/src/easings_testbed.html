<h1>easings_testbed</h1>
<figure class="code src-file" data-path="examples/easings_testbed/easings_testbed.zig" data-lines="332"><figcaption><span>examples/easings_testbed/easings_testbed.zig</span><span>332 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/easings_testbed.zig - interactive testbed for trying</span>
<span class="tok-comment">// every easing curve on a 2D ball trajectory.</span>
<span class="tok-comment">// Port of raylib's `examples/shapes/shapes_easings_testbed.c` (*3,</span>
<span class="tok-comment">// ~247 LOC).  Pick an easing for X, pick another for Y, hit ENTER,</span>
<span class="tok-comment">// watch a ball traverse the screen with the chosen curves.</span>
<span class="tok-comment">// raylib's original used a typedef'd function table with the</span>
<span class="tok-comment">// 4-arg `Ease(t, b, c, d)` signature.  We do the same idea with</span>
<span class="tok-comment">// Zig's first-class function pointers + the [0,1]-form curves</span>
<span class="tok-comment">// from `src/easings.zig`, which means the lerp lives at the</span>
<span class="tok-comment">// call site instead of inside every easing fn.</span>
<span class="tok-comment">// raylib also exposes four `Linear*` aliases (None, In, Out, InOut)</span>
<span class="tok-comment">// that are all the identity function.  We collapse them to one</span>
<span class="tok-comment">// `Linear`; the testbed simply has one fewer entry.</span>
<span class="tok-comment">// Controls:</span>
<span class="tok-comment">//   &lt;-  -&gt;    cycle the X-axis easing (wraps; "None" is the last entry)</span>
<span class="tok-comment">//   ^  v    cycle the Y-axis easing (wraps)</span>
<span class="tok-comment">//   ENTER   play/pause the ball's motion</span>
<span class="tok-comment">//   SPACE   restart from frame 0 (also fires automatically when</span>
<span class="tok-comment">//           you change a setting)</span>
<span class="tok-comment">//   T       toggle bounded-time mode (default ON; OFF lets t keep</span>
<span class="tok-comment">//           growing past the duration so you can watch what the</span>
<span class="tok-comment">//           curve does extrapolating into the future)</span>
<span class="tok-comment">//   Q  W    decrease / increase the duration by 20 frames</span>
<span class="tok-comment">//   A  S    decrease / increase the duration by 2 frames (fine)</span>
<span class="tok-comment">// The ball traverses from (100, 100) to (700, 400) over `d` frames.</span>
<span class="tok-comment">// HUD shows the current easing names + (t, d) values.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;

<span class="tok-kw">const</span> screen_w: i32 = <span class="tok-num">800</span>;
<span class="tok-kw">const</span> screen_h: i32 = <span class="tok-num">450</span>;
<span class="tok-kw">const</span> font_size: i32 = <span class="tok-num">20</span>;
<span class="tok-kw">const</span> d_step: f32 = <span class="tok-num">20</span>;
<span class="tok-kw">const</span> d_step_fine: f32 = <span class="tok-num">2</span>;
<span class="tok-kw">const</span> d_min: f32 = <span class="tok-num">1</span>;
<span class="tok-kw">const</span> d_max: f32 = <span class="tok-num">10000</span>;
<span class="tok-kw">const</span> ball_radius: f32 = <span class="tok-num">16</span>;
<span class="tok-kw">const</span> ball_start: Vec2 = .{ <span class="tok-num">100</span>, <span class="tok-num">100</span> };
<span class="tok-kw">const</span> ball_end: Vec2 = .{ <span class="tok-num">700</span>, <span class="tok-num">400</span> };

<span class="tok-kw">const</span> c = Color;

<span class="tok-kw">const</span> EaseFn = *<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (f32) f32;

<span class="tok-kw">const</span> EaseEntry = <span class="tok-kw">struct</span> {
    name: []<span class="tok-kw">const</span> u8,
    func: EaseFn,
};

<span class="tok-comment">/// No-easing identity used for the "None" entry - the ball stays</span>
<span class="tok-comment">/// at the start position on this axis.  Implemented as a static</span>
<span class="tok-comment">/// fn so we can put a pointer to it in the table.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">noEase</span>(_: f32) f32 {
    <span class="tok-kw">return</span> <span class="tok-num">0</span>;
}

<span class="tok-comment">// Function table.  Order matches raylib's source (modulo the</span>
<span class="tok-comment">// collapsed Linear aliases).  Last entry is the "None" sentinel</span>
<span class="tok-comment">// that pins the axis to its start value.</span>
<span class="tok-kw">const</span> easings_table = [_]EaseEntry{
    .{ .name = <span class="tok-str">"Linear"</span>, .func = z.easeLinear },
    .{ .name = <span class="tok-str">"SineIn"</span>, .func = z.easeSineIn },
    .{ .name = <span class="tok-str">"SineOut"</span>, .func = z.easeSineOut },
    .{ .name = <span class="tok-str">"SineInOut"</span>, .func = z.easeSineInOut },
    .{ .name = <span class="tok-str">"CircIn"</span>, .func = z.easeCircIn },
    .{ .name = <span class="tok-str">"CircOut"</span>, .func = z.easeCircOut },
    .{ .name = <span class="tok-str">"CircInOut"</span>, .func = z.easeCircInOut },
    .{ .name = <span class="tok-str">"CubicIn"</span>, .func = z.easeCubicIn },
    .{ .name = <span class="tok-str">"CubicOut"</span>, .func = z.easeCubicOut },
    .{ .name = <span class="tok-str">"CubicInOut"</span>, .func = z.easeCubicInOut },
    .{ .name = <span class="tok-str">"QuadIn"</span>, .func = z.easeQuadIn },
    .{ .name = <span class="tok-str">"QuadOut"</span>, .func = z.easeQuadOut },
    .{ .name = <span class="tok-str">"QuadInOut"</span>, .func = z.easeQuadInOut },
    .{ .name = <span class="tok-str">"ExpoIn"</span>, .func = z.easeExpoIn },
    .{ .name = <span class="tok-str">"ExpoOut"</span>, .func = z.easeExpoOut },
    .{ .name = <span class="tok-str">"ExpoInOut"</span>, .func = z.easeExpoInOut },
    .{ .name = <span class="tok-str">"BackIn"</span>, .func = z.easeBackIn },
    .{ .name = <span class="tok-str">"BackOut"</span>, .func = z.easeBackOut },
    .{ .name = <span class="tok-str">"BackInOut"</span>, .func = z.easeBackInOut },
    .{ .name = <span class="tok-str">"BounceOut"</span>, .func = z.easeBounceOut },
    .{ .name = <span class="tok-str">"BounceIn"</span>, .func = z.easeBounceIn },
    .{ .name = <span class="tok-str">"BounceInOut"</span>, .func = z.easeBounceInOut },
    .{ .name = <span class="tok-str">"ElasticIn"</span>, .func = z.easeElasticIn },
    .{ .name = <span class="tok-str">"ElasticOut"</span>, .func = z.easeElasticOut },
    .{ .name = <span class="tok-str">"ElasticInOut"</span>, .func = z.easeElasticInOut },
    .{ .name = <span class="tok-str">"None"</span>, .func = noEase },
};

<span class="tok-kw">const</span> easing_none_idx: usize = easings_table.len - <span class="tok-num">1</span>;

<span class="tok-comment">/// Names of every easing in `easings_table`, for the combo box. Built at</span>
<span class="tok-comment">/// comptime so the panel and the table can never drift.</span>
<span class="tok-kw">const</span> easing_names: [easings_table.len][]<span class="tok-kw">const</span> u8 = blk: {
    <span class="tok-kw">var</span> names: [easings_table.len][]<span class="tok-kw">const</span> u8 = undefined;
    <span class="tok-kw">for</span> (easings_table, <span class="tok-num">0</span>..) |e, i| {
        names[i] = e.name;
    }
    <span class="tok-kw">break</span> :blk names;
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    ui_host: z.UiHost,
    <span class="tok-comment">/// Owned shapes-texture state. id=1 -&gt; rlgl's internal 1x1 white pixel.</span>
    <span class="tok-comment">/// Owned default-font cache. Populated by `loadFontFromTtfBytes` below.</span>
    frame_count: usize = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Current animation time in frames (matches raylib's `t`).</span>
    t: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Total animation duration in frames.</span>
    duration: f32 = <span class="tok-num">300</span>,
    <span class="tok-comment">/// True = animation halts at t == duration; False = t keeps</span>
    <span class="tok-comment">/// growing forever.</span>
    bounded_t: bool = true,
    <span class="tok-comment">/// True = paused (waiting for ENTER).  Default true so the</span>
    <span class="tok-comment">/// user sees the start state before motion begins.</span>
    paused: bool = false,
    <span class="tok-comment">/// Indices into `easings_table` for the X-axis and Y-axis curves.</span>
    ease_x: usize = <span class="tok-num">0</span>, <span class="tok-comment">// Linear (was None - gives an immediately visible demo)</span>
    ease_y: usize = <span class="tok-num">23</span>, <span class="tok-comment">// ElasticOut</span>
    <span class="tok-comment">/// Current ball position (lerped per frame).</span>
    ball: Vec2 = ball_start,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">28</span>);
    s.* = .{ .font = font, .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font) };
}

<span class="tok-comment">/// Draw one line of bottom-of-screen help text in the testbed's</span>
<span class="tok-comment">/// shared style (left-aligned at x=20, light grey, font_size).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawHelpLine</span>(
    f: *z.Frame,
    font: z.Font,
    msg: []<span class="tok-kw">const</span> u8,
    y: f32,
) void {
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">20</span>, y }, msg, .{ .size = font_size, .color = c.darkgray, .font = &amp;font });
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    state.frame_count += <span class="tok-num">1</span>;
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-builtin">@floatCast</span>(f.time.delta_time);
    <span class="tok-kw">const</span> tick: f32 = dt * <span class="tok-num">60.0</span>;

    <span class="tok-comment">// ---- Input - settings that trigger a restart</span>
    <span class="tok-kw">var</span> triggered_restart: bool = false;

    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .t)) {
        state.bounded_t = !state.bounded_t;
        triggered_restart = true;
    }

    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .right)) {
        state.ease_x = (state.ease_x + <span class="tok-num">1</span>) % easings_table.len;
        triggered_restart = true;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .left)) {
        state.ease_x = <span class="tok-kw">if</span> (state.ease_x == <span class="tok-num">0</span>) easing_none_idx <span class="tok-kw">else</span> state.ease_x - <span class="tok-num">1</span>;
        triggered_restart = true;
    }

    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .down)) {
        state.ease_y = (state.ease_y + <span class="tok-num">1</span>) % easings_table.len;
        triggered_restart = true;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .up)) {
        state.ease_y = <span class="tok-kw">if</span> (state.ease_y == <span class="tok-num">0</span>) easing_none_idx <span class="tok-kw">else</span> state.ease_y - <span class="tok-num">1</span>;
        triggered_restart = true;
    }

    <span class="tok-comment">// Duration controls: Q/W coarse (20 frames), A/S fine (2 frames).</span>
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .w) <span class="tok-kw">and</span> state.duration &lt; d_max - d_step) {
        state.duration += d_step;
        triggered_restart = true;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .q) <span class="tok-kw">and</span> state.duration &gt; d_min + d_step) {
        state.duration -= d_step;
        triggered_restart = true;
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyDown</span>(f.input, .s) <span class="tok-kw">and</span> state.duration &lt; d_max - d_step_fine) {
        state.duration += d_step_fine;
        triggered_restart = true;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyDown</span>(f.input, .a) <span class="tok-kw">and</span> state.duration &gt; d_min + d_step_fine) {
        state.duration -= d_step_fine;
        triggered_restart = true;
    }

    <span class="tok-comment">// SPACE = restart; ENTER on already-finished bounded-mode also restarts.</span>
    <span class="tok-kw">const</span> space_restart: bool = z.<span class="tok-fn">isKeyPressed</span>(f.input, .space);
    <span class="tok-kw">const</span> enter_at_end: bool =
        z.<span class="tok-fn">isKeyPressed</span>(f.input, .enter) <span class="tok-kw">and</span> state.bounded_t <span class="tok-kw">and</span> state.t &gt;= state.duration;

    <span class="tok-kw">if</span> (triggered_restart <span class="tok-kw">or</span> space_restart <span class="tok-kw">or</span> enter_at_end) {
        state.t = <span class="tok-num">0</span>;
        state.ball = ball_start;
        state.paused = true;
    }

    <span class="tok-comment">// ENTER toggles play/pause.</span>
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .enter) <span class="tok-kw">and</span> !enter_at_end) {
        state.paused = !state.paused;
    }

    <span class="tok-comment">// ---- Update - advance the animation if running</span>
    <span class="tok-kw">const</span> should_advance: bool = blk: {
        <span class="tok-kw">if</span> (state.paused) {
            <span class="tok-kw">break</span> :blk false;
        }
        <span class="tok-comment">// Bounded mode halts at t == duration; unbounded keeps growing.</span>
        <span class="tok-kw">if</span> (state.bounded_t <span class="tok-kw">and</span> state.t &gt;= state.duration) {
            <span class="tok-kw">break</span> :blk false;
        }
        <span class="tok-kw">break</span> :blk true;
    };

    <span class="tok-kw">if</span> (should_advance) {
        <span class="tok-kw">const</span> t01: f32 = <span class="tok-fn">clamp</span>(state.t / state.duration, <span class="tok-num">0</span>, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> ease_x: EaseFn = easings_table[state.ease_x].func;
        <span class="tok-kw">const</span> ease_y: EaseFn = easings_table[state.ease_y].func;
        state.ball[<span class="tok-num">0</span>] = ball_start[<span class="tok-num">0</span>] + <span class="tok-fn">ease_x</span>(t01) * (ball_end[<span class="tok-num">0</span>] - ball_start[<span class="tok-num">0</span>]);
        state.ball[<span class="tok-num">1</span>] = ball_start[<span class="tok-num">1</span>] + <span class="tok-fn">ease_y</span>(t01) * (ball_end[<span class="tok-num">1</span>] - ball_start[<span class="tok-num">1</span>]);
        state.t += tick;
    }

    <span class="tok-comment">// ---- Render ----------------------------------------------------------</span>
    z.<span class="tok-fn">clearViewport</span>(f, c.raywhite);

    <span class="tok-comment">// Top-left info block.</span>
    <span class="tok-kw">var</span> buf: [<span class="tok-num">128</span>]u8 = undefined;
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">20</span>, font_size },
        <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"Easing x: {s}"</span>, .{easings_table[state.ease_x].name}) <span class="tok-kw">catch</span> <span class="tok-str">"x"</span>,
        .{ .size = font_size, .color = c.darkgray, .font = &amp;state.font },
    );
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">20</span>, font_size * <span class="tok-num">2</span> },
        <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"Easing y: {s}"</span>, .{easings_table[state.ease_y].name}) <span class="tok-kw">catch</span> <span class="tok-str">"y"</span>,
        .{ .size = font_size, .color = c.darkgray, .font = &amp;state.font },
    );
    <span class="tok-kw">const</span> bound_marker: u8 = <span class="tok-kw">if</span> (state.bounded_t) <span class="tok-str">'b'</span> <span class="tok-kw">else</span> <span class="tok-str">'u'</span>;
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">20</span>, font_size * <span class="tok-num">3</span> },
        <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"t ({c}) = {d:.2}   d = {d:.2}"</span>, .{ bound_marker, state.t, state.duration }) <span class="tok-kw">catch</span> <span class="tok-str">"t"</span>,
        .{ .size = font_size, .color = c.darkgray, .font = &amp;state.font },
    );

    <span class="tok-comment">// Bottom help text.  Stacked from the bottom so the most</span>
    <span class="tok-comment">// useful line (LEFT/RIGHT) is closest to the action area.</span>
    <span class="tok-kw">const</span> bottom_line_y: i32 = screen_h - font_size * <span class="tok-num">2</span>;
    <span class="tok-fn">drawHelpLine</span>(
        f,
        state.font,
        <span class="tok-str">"Use ENTER to play or pause movement, use SPACE to restart"</span>,
        <span class="tok-fn">float</span>(bottom_line_y),
    );
    <span class="tok-fn">drawHelpLine</span>(
        f,
        state.font,
        <span class="tok-str">"Use Q and W or A and S keys to change duration"</span>,
        <span class="tok-fn">float</span>(bottom_line_y - font_size),
    );
    <span class="tok-fn">drawHelpLine</span>(
        f,
        state.font,
        <span class="tok-str">"Use LEFT or RIGHT keys to choose easing for the x axis"</span>,
        <span class="tok-fn">float</span>(bottom_line_y - font_size * <span class="tok-num">2</span>),
    );
    <span class="tok-fn">drawHelpLine</span>(
        f,
        state.font,
        <span class="tok-str">"Use UP or DOWN keys to choose easing for the y axis"</span>,
        <span class="tok-fn">float</span>(bottom_line_y - font_size * <span class="tok-num">3</span>),
    );

    f.gl.<span class="tok-fn">circle</span>(state.ball, ball_radius, .{ .color = c.maroon, .segments = <span class="tok-num">16</span> });

    <span class="tok-comment">// Touch controls: the keyboard shortcuts (arrows/Q/W/A/S/ENTER/SPACE) still</span>
    <span class="tok-comment">// work on desktop; this panel gives phones a way to drive the testbed.</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = state.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Easings"</span>, .{ .initial_pos = .{ <span class="tok-num">14</span>, <span class="tok-num">14</span> }, .initial_size = .{ <span class="tok-num">250</span>, <span class="tok-num">230</span> } })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        <span class="tok-kw">var</span> ix: i32 = <span class="tok-builtin">@intCast</span>(state.ease_x);
        <span class="tok-kw">if</span> (u.<span class="tok-fn">combo</span>(<span class="tok-str">"X axis"</span>, &amp;ix, &amp;easing_names, .{})) {
            state.ease_x = <span class="tok-builtin">@intCast</span>(ix);
        }
        <span class="tok-kw">var</span> iy: i32 = <span class="tok-builtin">@intCast</span>(state.ease_y);
        <span class="tok-kw">if</span> (u.<span class="tok-fn">combo</span>(<span class="tok-str">"Y axis"</span>, &amp;iy, &amp;easing_names, .{})) {
            state.ease_y = <span class="tok-builtin">@intCast</span>(iy);
        }
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"duration"</span>, &amp;state.duration, .{ .min = <span class="tok-num">30</span>, .max = <span class="tok-num">600</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-kw">if</span> (state.paused) <span class="tok-str">"play"</span> <span class="tok-kw">else</span> <span class="tok-str">"pause"</span>, .{})) {
            state.paused = !state.paused;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"restart"</span>, .{})) {
            state.t = <span class="tok-num">0</span>;
            state.ball = ball_start;
        }
    }
    state.ui_host.<span class="tok-fn">render</span>(f);

    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// User-owned framework integration point.  See `examples/basic.zig`</span>
<span class="tok-comment">/// for the canonical comment block; this declaration is the</span>
<span class="tok-comment">/// AppBridge pattern's required convention.</span>
<span class="tok-comment">/// Descriptor-only: the runner (standalone) or a launcher drives this.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - easings testbed"</span>,
            .width = screen_w,
            .height = screen_h,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
