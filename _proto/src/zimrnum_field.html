<h1>zimrnum_field</h1>
<figure class="code src-file" data-path="examples/zimrnum_field/zimrnum_field.zig" data-lines="858"><figcaption><span>examples/zimrnum_field/zimrnum_field.zig</span><span>858 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! zimrnum_field - a scalar field built with zimrnum, computed twice, drawn three times.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- *** WHAT THIS EXAMPLE IS FOR --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! To use zimrnum the way an application would, not the way a test does. It builds a 64x64 field</span>
<span class="tok-comment">//! out of tensors - noise plus a broadcast row ramp - evaluates it through `zn.add` and `zn.mul`</span>
<span class="tok-comment">//! on the CPU and through the same operations on the GPU, and draws BOTH heatmaps plus their</span>
<span class="tok-comment">//! difference. A wrong GPU result is not a number in a log; it is a visibly different picture.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! ** THE DENSIFY STEP IS SHOWN, NOT HIDDEN. The GPU kernel takes flat buffers with a count -</span>
<span class="tok-comment">//! no shape, no strides. `zn.broadcastTo` produces a stride-0 VIEW, which cannot be bound. So the</span>
<span class="tok-comment">//! host materialises the ramp into a dense tensor first, with `zn.add` against a zero field, and</span>
<span class="tok-comment">//! that line is the whole difference between what the two backends can accept.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! * Inputs come from `zn.Rng`, which is counter-based: both backends see identical values</span>
<span class="tok-comment">//! without either sending them to the other, and the field is reproducible from one seed.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-comment">// House form: bind the zm name once at file scope rather than qualifying it in a body.</span>
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> floatEps = zm.floatEps;
<span class="tok-kw">const</span> zn = <span class="tok-builtin">@import</span>(<span class="tok-str">"zn"</span>);
<span class="tok-comment">// The sweep's table, its CPU reference and the comparison now live in the engine:</span>
<span class="tok-comment">// `src/gpu/zn_conformance.zig`. This file keeps the rendering and nothing else.</span>
<span class="tok-kw">const</span> conf = <span class="tok-builtin">@import</span>(<span class="tok-str">"zn_conformance"</span>);
<span class="tok-kw">const</span> Tn = conf.Tn;
<span class="tok-kw">const</span> Kind = conf.Kind;
<span class="tok-kw">const</span> Case = conf.Case;
<span class="tok-kw">const</span> cases = conf.cases;
<span class="tok-kw">const</span> Comparison = conf.Comparison;
<span class="tok-kw">const</span> compare = conf.compare;
<span class="tok-kw">const</span> side = conf.side;
<span class="tok-kw">const</span> count = conf.count;
<span class="tok-kw">const</span> learning_rate = conf.learning_rate;
<span class="tok-kw">const</span> layernorm_epsilon = conf.layernorm_epsilon;
<span class="tok-kw">const</span> elu_alpha = conf.elu_alpha;
<span class="tok-kw">const</span> momentum = conf.momentum;
<span class="tok-kw">const</span> huber_delta = conf.huber_delta;
<span class="tok-kw">const</span> clamp_lo = conf.clamp_lo;
<span class="tok-kw">const</span> clamp_hi = conf.clamp_hi;
<span class="tok-kw">const</span> zn_binary = <span class="tok-builtin">@import</span>(<span class="tok-str">"zn_binary"</span>);
<span class="tok-kw">const</span> zn_matmul = <span class="tok-builtin">@import</span>(<span class="tok-str">"zn_matmul"</span>);
<span class="tok-kw">const</span> zn_unary = <span class="tok-builtin">@import</span>(<span class="tok-str">"zn_unary"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-comment">// One WGSL per ENTRY, not per kernel file - the build names each embed after its entry.</span>
<span class="tok-comment">/// -- *** THE PIPELINE TABLE IS DERIVED, NOT WRITTEN --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// A kernel used to be named in four places: the file's install call, `build.zig`'s `.entries`,</span>
<span class="tok-comment">/// an `@embedFile` here, and a pipeline entry here. Four lists to keep in agreement by hand, and</span>
<span class="tok-comment">/// eleven kernels in, that was the thing slowing the port down.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Now each kernel file carries `pub const kernels`, and this builds the host table from it. The</span>
<span class="tok-comment">/// entry name and its WGSL cannot disagree, because the same string produces both.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** IT IS ALSO THE DRIFT GATE, AND IT COSTS NOTHING. `@embedFile(name ++ "_wgsl")` only</span>
<span class="tok-comment">/// resolves if `build.zig` generated that WGSL. Add an entry to a kernel file and forget the</span>
<span class="tok-comment">/// build, and the failure is a compile error naming the missing file - not a shader that is</span>
<span class="tok-comment">/// absent at runtime on a device you are not holding.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pipelineEntries</span>(<span class="tok-kw">comptime</span> M: type) [M.kernels.len]z.<span class="tok-fn">Compute</span>(M).KernelWgsl {
    <span class="tok-kw">var</span> table: [M.kernels.len]z.<span class="tok-fn">Compute</span>(M).KernelWgsl = undefined;
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (M.kernels, <span class="tok-num">0</span>..) |name, i| {
        table[i] = .{ .name = name, .wgsl = <span class="tok-builtin">@embedFile</span>(name ++ <span class="tok-str">"_wgsl"</span>) };
    }
    <span class="tok-kw">return</span> table;
}

<span class="tok-kw">const</span> rerun_size: <span class="tok-kw">struct</span> { w: f32, h: f32 } = .{ .w = <span class="tok-num">124</span>, .h = <span class="tok-num">26</span> };

<span class="tok-comment">// -- *** THE COVERAGE GATE --</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Every kernel entry must be exercised by exactly one row, and every row must name a kernel that</span>
<span class="tok-comment">// exists. Without this the sweep's green says something about the rows someone REMEMBERED to add,</span>
<span class="tok-comment">// not about the kernel set - and `sub` and `div` sat on the CPU for six turns with no kernel</span>
<span class="tok-comment">// precisely because nothing was watching.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// ** IT IS A COMPILE ERROR, NOT A TEST. A kernel added without a row cannot build, so the gap</span>
<span class="tok-comment">// cannot survive to a device. `build.zig`'s drift gate already covers the other edge (a kernel</span>
<span class="tok-comment">// with no WGSL fails to embed), so the three lists - kernel file, build entries, sweep rows -</span>
<span class="tok-comment">// are now pinned to each other in both directions.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// * WHAT THIS DOES NOT COVER, stated so it is not mistaken for more than it is: it pins</span>
<span class="tok-comment">// KERNEL &lt;-&gt; ROW. It cannot pin OP &lt;-&gt; KERNEL - a `zimrnum` function with no GPU kernel at all is</span>
<span class="tok-comment">// still invisible here, because zimrnum has no device dispatch of its own yet. That gate belongs</span>
<span class="tok-comment">// with the dispatch seam, and section 10.3 debt 11 stays open until then.</span>
<span class="tok-kw">comptime</span> {
    <span class="tok-comment">// -- *** EVERY BUFFER A KERNEL READS MUST BE ONE THE HOST UPLOADS --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `where_pick` read its selector from `c` and nothing uploaded it. The headless twin test</span>
    <span class="tok-comment">// filled `c` by hand and passed; the sweep never did, and the device failed the row with the</span>
    <span class="tok-comment">// input data instead of a 0/1 mask. **A buffer the host never writes is invisible to every</span>
    <span class="tok-comment">// check that runs on the host**, because the host's own test fills it as part of being a</span>
    <span class="tok-comment">// test.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * So: this file must contain an `upload` call for every field of every pipeline's `Buffers`</span>
    <span class="tok-comment">// that is not the output. Checked by searching this file's own source, which is crude and is</span>
    <span class="tok-comment">// exactly as strong as it needs to be - the failure it prevents is a missing line.</span>
    <span class="tok-comment">// * The quota is generous because the search walks this whole file; a comptime string scan</span>
    <span class="tok-comment">// over 60 KB is thousands of branches and the default stops well short.</span>
    <span class="tok-builtin">@setEvalBranchQuota</span>(<span class="tok-num">2_000_000</span>);
    <span class="tok-kw">const</span> source: []<span class="tok-kw">const</span> u8 = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"zimrnum_field.zig"</span>);
    <span class="tok-kw">for</span> (.{ <span class="tok-str">"a"</span>, <span class="tok-str">"b"</span>, <span class="tok-str">"c"</span> }) |field| {
        <span class="tok-kw">const</span> needle: []<span class="tok-kw">const</span> u8 = <span class="tok-str">".upload(."</span> ++ field ++ <span class="tok-str">","</span>;
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">indexOf</span>(u8, source, needle) == null) {
            <span class="tok-builtin">@compileError</span>(<span class="tok-str">"zn_binary buffer `"</span> ++ field ++ <span class="tok-str">"` is never uploaded by the host"</span>);
        }
    }
    <span class="tok-kw">for</span> (.{<span class="tok-str">"x"</span>}) |field| {
        <span class="tok-kw">const</span> needle: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"pipe_un.upload(."</span> ++ field ++ <span class="tok-str">","</span>;
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">indexOf</span>(u8, source, needle) == null) {
            <span class="tok-builtin">@compileError</span>(<span class="tok-str">"zn_unary buffer `"</span> ++ field ++ <span class="tok-str">"` is never uploaded by the host"</span>);
        }
    }
}

<span class="tok-kw">comptime</span> {
    <span class="tok-comment">// 23 rows x 22 entries of string comparison overruns the default quota; the check is O(n*m)</span>
    <span class="tok-comment">// and n and m both grow with the port, so raise it once here rather than per addition.</span>
    <span class="tok-builtin">@setEvalBranchQuota</span>(<span class="tok-num">200_000</span>);
    <span class="tok-kw">for</span> (cases) |c| {
        <span class="tok-kw">const</span> names: []<span class="tok-kw">const</span> [:<span class="tok-num">0</span>]<span class="tok-kw">const</span> u8 = <span class="tok-kw">switch</span> (c.kind) {
            .binary =&gt; &amp;zn_binary.kernels,
            .unary =&gt; &amp;zn_unary.kernels,
            .matmul =&gt; &amp;zn_matmul.kernels,
        };
        <span class="tok-kw">var</span> found: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (names) |name| {
            <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, name, c.entry)) {
                found += <span class="tok-num">1</span>;
            }
        }
        <span class="tok-kw">if</span> (found != <span class="tok-num">1</span>) {
            <span class="tok-builtin">@compileError</span>(<span class="tok-str">"sweep row '"</span> ++ c.label ++ <span class="tok-str">"' names entry '"</span> ++ c.entry ++
                <span class="tok-str">"', which its kernel file does not export"</span>);
        }
    }
    <span class="tok-fn">coverEvery</span>(zn_binary.kernels, .binary);
    <span class="tok-fn">coverEvery</span>(zn_unary.kernels, .unary);
    <span class="tok-fn">coverEvery</span>(zn_matmul.kernels, .matmul);
}

<span class="tok-comment">/// Assert every entry of one kernel file is exercised by exactly one row.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">coverEvery</span>(<span class="tok-kw">comptime</span> names: <span class="tok-kw">anytype</span>, <span class="tok-kw">comptime</span> kind: Kind) void {
    <span class="tok-kw">for</span> (names) |name| {
        <span class="tok-kw">var</span> rows: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (cases) |c| {
            <span class="tok-kw">if</span> (c.kind == kind <span class="tok-kw">and</span> std.mem.<span class="tok-fn">eql</span>(u8, name, c.entry)) {
                rows += <span class="tok-num">1</span>;
            }
        }
        <span class="tok-kw">if</span> (rows == <span class="tok-num">0</span>) {
            <span class="tok-builtin">@compileError</span>(<span class="tok-str">"kernel entry '"</span> ++ name ++ <span class="tok-str">"' has no row in the sweep: it is built, "</span> ++
                <span class="tok-str">"shipped, and never compared against zimrnum"</span>);
        }
        <span class="tok-comment">// ONE KERNEL MAY HAVE SEVERAL ROWS, AND THAT IS NOW THE POINT</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// This used to require exactly one, on the reasoning that two rows for one kernel is a</span>
        <span class="tok-comment">// copy-paste slip. It is not: the same kernel on a DIFFERENT INPUT FIELD is a different</span>
        <span class="tok-comment">// question, and asking it is how the `tanh` cancellation bug would have been caught years</span>
        <span class="tok-comment">// earlier. A duplicate row costs three frames; a missing row costs a kernel nobody checks.</span>
        <span class="tok-comment">// The bar is "at least one", and the asymmetry is deliberate.</span>
    }
}

<span class="tok-comment">/// One operation's verdict, filled in as the page walks the list.</span>
<span class="tok-kw">const</span> Result = <span class="tok-kw">struct</span> {
    done: bool = false,
    worst: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// The largest reference magnitude in the row, which is what `ulps` scales against.</span>
    peak: f32 = <span class="tok-num">0</span>,
    checked: u32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    pipe: z.<span class="tok-fn">Compute</span>(zn_binary),
    pipe_mm: z.<span class="tok-fn">Compute</span>(zn_matmul),
    pipe_un: z.<span class="tok-fn">Compute</span>(zn_unary),

    <span class="tok-comment">/// The two dense operands both backends see.</span>
    field_a: []f32,
    field_b: []f32,
    <span class="tok-comment">/// `|field_a| + 0.5`: strictly positive, for the rows whose operation needs it.</span>
    field_p: []f32,
    <span class="tok-comment">/// `tanh(noise)`, so every value lies strictly inside (-1, 1) - the domain of `atanh`.</span>
    field_u: []f32,
    <span class="tok-comment">/// The `where` row's selector, `greater(a, b)`, which the kernel reads from buffer `c`.</span>
    field_c: []f32,
    <span class="tok-comment">/// A narrow band of magnitudes near 1e-6, both signs. Narrow because the sweep's bar is</span>
    <span class="tok-comment">/// `ulps * peak`: a field spanning decades takes its bar from its largest element and stops</span>
    <span class="tok-comment">/// testing the small ones at all.</span>
    field_t: []f32,
    <span class="tok-comment">/// -- *** ALL FOUR CPU REFERENCES, COMPUTED ONCE --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// The inputs never change, so each operation's answer is fixed. Computing them up front</span>
    <span class="tok-comment">/// removes the bug that produced `FAIL add worst 23.9`: the sweep used to rebuild `cpu_out`</span>
    <span class="tok-comment">/// the instant it advanced, while `readLatest` still held the PREVIOUS dispatch's data - so</span>
    <span class="tok-comment">/// operation N's GPU result was compared against operation N+1's reference. Nothing was wrong</span>
    <span class="tok-comment">/// with either kernel.</span>
    cpu_ref: [cases.len][]f32,
    cpu_out: []f32,
    gpu_out: []f32,

    <span class="tok-comment">/// The operation being measured. It ADVANCES ON ITS OWN - no tapping. A round trip to a</span>
    <span class="tok-comment">/// phone costs minutes, so one screenshot has to answer every question.</span>
    <span class="tok-comment">/// Index into `cases`. It advances on its own - no tapping.</span>
    op: usize = <span class="tok-num">0</span>,
    dispatched: bool = false,
    <span class="tok-comment">/// Frames to let the queue settle before a readback is believed. `readLatest` returns the</span>
    <span class="tok-comment">/// most recent COMPLETED transfer, which is the previous operation's until this one lands;</span>
    <span class="tok-comment">/// consuming it early is what mismatched the rows.</span>
    settle: u32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// The dispatch this row is waiting on, or null before it has been dispatched.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Set from `readGeneration().submitted` AFTER the dispatch, so it names this row's work.</span>
    <span class="tok-comment">/// The row retires when `mirrored` reaches it.</span>
    await_generation: ?u64 = null,
    results: [cases.len]Result = <span class="tok-builtin">@splat</span>(.{}),
    <span class="tok-comment">/// Whether a failure has already claimed the heatmaps.</span>
    holding: bool = false,
    <span class="tok-comment">/// Where the re-run button was drawn last frame. The hit test reads this rather than a</span>
    <span class="tok-comment">/// constant, so the two can never disagree.</span>
    rerun: z.Rectangle = .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = <span class="tok-num">0</span>, .height = <span class="tok-num">0</span> },
    <span class="tok-comment">/// -- *** THE PAGE HAS TO SCROLL, AND SORTING ALONE IS NOT ENOUGH --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Forty-eight rows plus three heatmaps already exceed a phone screen, and the port is headed</span>
    <span class="tok-comment">/// past a hundred. Two changes, because they solve different halves:</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// ** **Failures sort to the top**, so the rows that matter are visible without touching</span>
    <span class="tok-comment">/// anything - which is what a screenshot needs.</span>
    <span class="tok-comment">/// * **Drag or wheel scrolls**, for reading the rest.</span>
    scroll: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// True between a press that began outside the button and the release that ends it. A drag</span>
    <span class="tok-comment">/// with no beginning cannot tell a finger arriving from a finger moving.</span>
    dragging: bool = false,
    <span class="tok-comment">/// Where the finger went down, and what `scroll` was at that moment. The pair is what lets</span>
    <span class="tok-comment">/// the drag be absolute instead of a sum of per-frame deltas.</span>
    drag_from: f32 = <span class="tok-num">0</span>,
    scroll_from: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Total drawn height, so the scroll can be clamped to content that actually exists rather</span>
    <span class="tok-comment">/// than to a guess.</span>
    content_height: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    gpa.<span class="tok-fn">free</span>(s.field_a);
    gpa.<span class="tok-fn">free</span>(s.field_b);
    gpa.<span class="tok-fn">free</span>(s.field_p);
    gpa.<span class="tok-fn">free</span>(s.field_u);
    gpa.<span class="tok-fn">free</span>(s.field_c);
    gpa.<span class="tok-fn">free</span>(s.field_t);
    <span class="tok-kw">for</span> (s.cpu_ref) |r| {
        gpa.<span class="tok-fn">free</span>(r);
    }
    gpa.<span class="tok-fn">free</span>(s.cpu_out);
    gpa.<span class="tok-fn">free</span>(s.gpu_out);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.pipe.<span class="tok-fn">deinit</span>();
    s.pipe_mm.<span class="tok-fn">deinit</span>();
    s.pipe_un.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Build the two operands with zimrnum, then every operation's reference answer.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * Called ONCE. The inputs are fixed, so the four answers are fixed, and recomputing one of</span>
<span class="tok-comment">/// them mid-sweep is what let a stale readback be judged against the wrong reference.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildFields</span>(s: *State) !void {
    <span class="tok-kw">const</span> shape = [_]usize{ side, side };
    <span class="tok-kw">const</span> a: zn.<span class="tok-fn">Tensor</span>(f32) = <span class="tok-kw">try</span> zn.<span class="tok-fn">Tensor</span>(f32).<span class="tok-fn">fromSlice</span>(s.field_a, &amp;shape);
    <span class="tok-kw">const</span> b: zn.<span class="tok-fn">Tensor</span>(f32) = <span class="tok-kw">try</span> zn.<span class="tok-fn">Tensor</span>(f32).<span class="tok-fn">fromSlice</span>(s.field_b, &amp;shape);

    <span class="tok-comment">// Operand A: noise. Two labels off one seed, so nothing has to be coordinated.</span>
    <span class="tok-kw">const</span> rng: zn.Rng = zn.Rng.<span class="tok-fn">init</span>(<span class="tok-num">20260904</span>);
    rng.<span class="tok-fn">split</span>(<span class="tok-num">0</span>).<span class="tok-fn">fillNormal</span>(f32, s.field_a);

    <span class="tok-comment">// Operand B: a single row ramp, stretched down the field. `broadcastTo` makes that a view</span>
    <span class="tok-comment">// with a stride of 0 on the row axis - no storage, no copy.</span>
    <span class="tok-kw">var</span> ramp_row: [side]f32 = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..side) |i| {
        ramp_row[i] = <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(i))) / <span class="tok-fn">float</span>(side) * <span class="tok-num">2.0</span> - <span class="tok-num">1.0</span>;
    }
    <span class="tok-kw">const</span> row: zn.<span class="tok-fn">Tensor</span>(f32) = <span class="tok-kw">try</span> zn.<span class="tok-fn">Tensor</span>(f32).<span class="tok-fn">fromSlice</span>(&amp;ramp_row, &amp;.{ <span class="tok-num">1</span>, side });
    <span class="tok-kw">const</span> stretched: zn.<span class="tok-fn">Tensor</span>(f32) = <span class="tok-kw">try</span> row.<span class="tok-fn">broadcastTo</span>(&amp;shape);

    <span class="tok-comment">// ** MATERIALISE IT. The stretched view is fine for the CPU walk and cannot be bound to a</span>
    <span class="tok-comment">// kernel, which takes a dense buffer. Adding it to a zeroed field is the densify step.</span>
    b.<span class="tok-fn">fill</span>(<span class="tok-num">0.0</span>);
    <span class="tok-kw">try</span> zn.<span class="tok-fn">add</span>(f32, b, b, stretched);

    <span class="tok-comment">// * `|a| + 0.5`, so `log` is defined too - a plain `|a|` would still hit zero and give -inf.</span>
    <span class="tok-kw">for</span> (s.field_p, s.field_a) |*slot, x| {
        slot.* = <span class="tok-builtin">@abs</span>(x) + <span class="tok-num">0.5</span>;
    }
    <span class="tok-comment">// * `tanh` maps the whole real line into (-1, 1) exactly, so this field is inside the domain</span>
    <span class="tok-comment">// of `atanh` by construction rather than by clamping - and it still spans most of the range.</span>
    <span class="tok-kw">for</span> (s.field_u, s.field_a) |*slot, x| {
        slot.* = zm.<span class="tok-fn">tanh</span>(x);
    }
    <span class="tok-comment">// Eight decades of magnitude below 1, alternating sign. Spread by index rather than drawn,</span>
    <span class="tok-comment">// so the smallest values are guaranteed present rather than merely likely.</span>
    <span class="tok-comment">// A NARROW BAND. THE FIRST VERSION SPANNED EIGHT DECADES AND WAS USELESS.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The sweep compares the worst ABSOLUTE difference against a bar of `ulps * peak`, where peak</span>
    <span class="tok-comment">// is the largest reference value in the row. Spread a field over eight decades and the peak</span>
    <span class="tok-comment">// comes from the largest element, so the bar sits far above anything the smallest elements</span>
    <span class="tok-comment">// could fail. Measured on the exact bug these rows were added for - the old `tanh`, which</span>
    <span class="tok-comment">// returns 0 where the answer is x:</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//     eight decades:  peak 9.97e-2  worst 1.92e-8  bar 4.75e-8   MISSED</span>
    <span class="tok-comment">//     band near 1e-6: peak 1.79e-6  worst 2.67e-8  bar 8.52e-13  CAUGHT</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// **The rows would not have caught the bug they exist for.** A band keeps every value inside</span>
    <span class="tok-comment">// one decade, so the peak IS the scale of the field and the bar means something at that</span>
    <span class="tok-comment">// scale. One band tests one scale; 1e-6 is where a cancelling f32 formula has lost most of</span>
    <span class="tok-comment">// its digits without yet collapsing to zero.</span>
    <span class="tok-kw">for</span> (s.field_t, <span class="tok-num">0</span>..) |*slot, i| {
        <span class="tok-kw">const</span> step: f32 = <span class="tok-builtin">@floatFromInt</span>(i % <span class="tok-num">8</span>);
        <span class="tok-kw">const</span> jitter: f32 = <span class="tok-num">1.0</span> + <span class="tok-num">0.9</span> * step / <span class="tok-num">8.0</span>;
        <span class="tok-kw">const</span> magnitude: f32 = <span class="tok-num">1.0e-6</span> * jitter;
        slot.* = <span class="tok-kw">if</span> (i % <span class="tok-num">2</span> == <span class="tok-num">0</span>) magnitude <span class="tok-kw">else</span> -magnitude;
    }

    <span class="tok-kw">const</span> positive: Tn = <span class="tok-kw">try</span> Tn.<span class="tok-fn">fromSlice</span>(s.field_p, &amp;shape);
    <span class="tok-kw">const</span> unit: Tn = <span class="tok-kw">try</span> Tn.<span class="tok-fn">fromSlice</span>(s.field_u, &amp;shape);
    <span class="tok-kw">const</span> tiny: Tn = <span class="tok-kw">try</span> Tn.<span class="tok-fn">fromSlice</span>(s.field_t, &amp;shape);
    <span class="tok-kw">for</span> (s.cpu_ref, cases) |slot, c| {
        <span class="tok-kw">const</span> src: Tn = <span class="tok-kw">switch</span> (c.input) {
            .noise =&gt; a,
            .positive =&gt; positive,
            .unit =&gt; unit,
            .tiny =&gt; tiny,
        };
        <span class="tok-kw">const</span> out: Tn = <span class="tok-kw">try</span> Tn.<span class="tok-fn">fromSlice</span>(slot, &amp;shape);
        <span class="tok-comment">// Zeroed first: a reduction writes only `out_len` values, and the rest of the reference</span>
        <span class="tok-comment">// would otherwise be whatever the allocator handed over - visible in the heatmap even</span>
        <span class="tok-comment">// though the verdict ignores it.</span>
        out.<span class="tok-fn">fill</span>(<span class="tok-num">0</span>);
        <span class="tok-kw">try</span> c.<span class="tok-fn">cpu</span>(out, src, b);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">16</span>);

    <span class="tok-kw">var</span> pipe: z.<span class="tok-fn">Compute</span>(zn_binary) = <span class="tok-kw">try</span> z.<span class="tok-fn">Compute</span>(zn_binary).<span class="tok-fn">initGpu</span>(
        gpa,
        f.gpu.device,
        f.gpu.queue,
        &amp;<span class="tok-fn">pipelineEntries</span>(zn_binary),
    );
    pipe.element_count = count;
    <span class="tok-comment">// Row-major strides for `bcast_add`: `a` is a full field, `b` is its first row stretched</span>
    <span class="tok-comment">// down - `b_row = 0` is the broadcast, exactly as `broadcastTo` does it on the CPU.</span>
    pipe.params = .{
        .count = count,
        .scalar = learning_rate,
        .cols = side,
        .delta = huber_delta,
        .momentum = momentum,
        .a_row = side,
        <span class="tok-comment">//  is the only row that uses it; every other leaves each element alone.</span>
        .repeat_count = <span class="tok-num">2</span>,
        .a_col = <span class="tok-num">1</span>,
        .b_row = <span class="tok-num">0</span>,
        .b_col = <span class="tok-num">1</span>,
        <span class="tok-comment">// Their own fields, not the strides above: see the note in zn_binary.</span>
        .slice_start = side / <span class="tok-num">2</span>,
        .left_columns = side / <span class="tok-num">2</span>,
    };

    <span class="tok-kw">var</span> pipe_mm: z.<span class="tok-fn">Compute</span>(zn_matmul) = <span class="tok-kw">try</span> z.<span class="tok-fn">Compute</span>(zn_matmul).<span class="tok-fn">initGpu</span>(
        gpa,
        f.gpu.device,
        f.gpu.queue,
        &amp;<span class="tok-fn">pipelineEntries</span>(zn_matmul),
    );
    pipe_mm.element_count = count;
    <span class="tok-comment">// (64, 64) @ (64, 64). The tiled entry needs the same thread count: 4x4 tiles of 256 lanes.</span>
    pipe_mm.params = .{ .m = side, .n = side, .kdim = side };

    <span class="tok-kw">var</span> pipe_un: z.<span class="tok-fn">Compute</span>(zn_unary) = <span class="tok-kw">try</span> z.<span class="tok-fn">Compute</span>(zn_unary).<span class="tok-fn">initGpu</span>(
        gpa,
        f.gpu.device,
        f.gpu.queue,
        &amp;<span class="tok-fn">pipelineEntries</span>(zn_unary),
    );
    pipe_un.element_count = count;
    pipe_un.params = .{
        .count = count,
        .scalar = learning_rate,
        .cols = side,
        .epsilon = layernorm_epsilon,
        .lo = clamp_lo,
        .hi = clamp_hi,
        .alpha = elu_alpha,
        .pool = <span class="tok-num">2</span>,
    };

    s.* = .{
        .font = font,
        .pipe = pipe,
        .pipe_mm = pipe_mm,
        .pipe_un = pipe_un,
        .field_a = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, count),
        .field_b = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, count),
        .field_p = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, count),
        .field_u = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, count),
        .field_c = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, count),
        .field_t = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, count),
        <span class="tok-comment">// Filled by the loop below: one reference per `cases` entry, so the count follows</span>
        <span class="tok-comment">// the table and cannot drift from it.</span>
        .cpu_ref = undefined,
        .cpu_out = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, count),
        .gpu_out = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, count),
    };
    <span class="tok-kw">for</span> (&amp;s.cpu_ref) |*slot| {
        slot.* = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, count);
    }
    <span class="tok-kw">try</span> <span class="tok-fn">buildFields</span>(s);
    s.pipe.<span class="tok-fn">upload</span>(.a, s.field_a);
    s.pipe.<span class="tok-fn">upload</span>(.b, s.field_b);
    <span class="tok-comment">// -- *** THE MASK THE `where` KERNEL READS --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `where_pick` reads its selector from the `c` buffer, and **nothing was uploading it**. The</span>
    <span class="tok-comment">// headless twin test filled `c` by hand and passed; the sweep never did, so on the device the</span>
    <span class="tok-comment">// kernel selected from an empty buffer and the row failed with a worst of 4.2 - the input</span>
    <span class="tok-comment">// data itself, not a 0/1 mask.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * A buffer a kernel READS but the host never WRITES is invisible to every check that runs</span>
    <span class="tok-comment">// on the host, because the host's own twin test fills it as part of the test. The device is</span>
    <span class="tok-comment">// the only thing that can see it, and it did.</span>
    <span class="tok-kw">for</span> (s.field_c, s.field_a, s.field_b) |*slot, x, y| {
        slot.* = <span class="tok-kw">if</span> (x &gt; y) <span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-num">0</span>;
    }
    s.pipe.<span class="tok-fn">upload</span>(.c, s.field_c);
    s.pipe_mm.<span class="tok-fn">upload</span>(.a, s.field_a);
    s.pipe_mm.<span class="tok-fn">upload</span>(.b, s.field_b);
    s.pipe_un.<span class="tok-fn">upload</span>(.x, s.field_a);
}

<span class="tok-comment">/// The bar this row is judged against: its absolute allowance plus `ulps` units in the last place</span>
<span class="tok-comment">/// of its own peak magnitude.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">barFor</span>(c: Case, peak: f32) f32 {
    <span class="tok-kw">return</span> c.tol + c.ulps * peak * <span class="tok-fn">floatEps</span>(f32);
}

<span class="tok-comment">/// One cell of a heatmap: blue below zero, red above, brightness with magnitude.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">heat</span>(v: f32) Color {
    <span class="tok-comment">// ** ZERO MUST BE NEUTRAL. The first version returned dark red at v == 0, so a difference</span>
    <span class="tok-comment">// panel that was exactly zero everywhere rendered as a solid red block - the same picture a</span>
    <span class="tok-comment">// uniformly small POSITIVE error would give. The whole point of the third panel is to tell</span>
    <span class="tok-comment">// those apart, so the saturation now falls to nothing as the magnitude does.</span>
    <span class="tok-kw">const</span> m: f32 = <span class="tok-builtin">@min</span>(<span class="tok-builtin">@abs</span>(v) / <span class="tok-num">3.0</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> hue: f32 = <span class="tok-kw">if</span> (v &lt; <span class="tok-num">0</span>) <span class="tok-num">220.0</span> <span class="tok-kw">else</span> <span class="tok-num">12.0</span>;
    <span class="tok-kw">return</span> z.<span class="tok-fn">colorFromHSV</span>(hue, <span class="tok-num">0.85</span> * m, <span class="tok-num">0.10</span> + <span class="tok-num">0.75</span> * m);
}

<span class="tok-comment">/// Draw `data` as a heatmap, one rect per BLOCK of `block`x`block` elements.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** WHY IT DOWNSAMPLES, AND WHY BY MAGNITUDE --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Three 64x64 panels is 12 288 rects a frame, and with the UI's glyphs on top that overflowed</span>
<span class="tok-comment">/// the vertex ring: `flushBatch` asserts rather than corrupt, so the page panicked in the smoke</span>
<span class="tok-comment">/// runner. Sampling every other element would fix the count and lose the point - a single wrong</span>
<span class="tok-comment">/// element could fall in a skipped position, and the difference panel exists precisely to show</span>
<span class="tok-comment">/// one wrong element.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// So each block is represented by its LARGEST-MAGNITUDE member, sign kept. An outlier anywhere</span>
<span class="tok-comment">/// in a block survives to the screen; only the fine texture of agreeing values is lost, and that</span>
<span class="tok-comment">/// texture was never the information.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawField</span>(
    f: *z.Frame,
    data: []<span class="tok-kw">const</span> f32,
    x0: f32,
    y0: f32,
    cell: f32,
    gain: f32,
) void {
    <span class="tok-kw">const</span> block: usize = <span class="tok-num">2</span>;
    <span class="tok-kw">const</span> cells: usize = side / block;
    <span class="tok-kw">var</span> row: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (row &lt; cells) : (row += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> col: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (col &lt; cells) : (col += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> peak: f32 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..block) |dr| {
                <span class="tok-kw">for</span> (<span class="tok-num">0</span>..block) |dc| {
                    <span class="tok-kw">const</span> v: f32 = data[(row * block + dr) * side + (col * block + dc)];
                    <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(v) &gt; <span class="tok-builtin">@abs</span>(peak)) {
                        peak = v;
                    }
                }
            }
            f.gl.<span class="tok-fn">rect</span>(.{
                .x = x0 + <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(col))) * cell,
                .y = y0 + <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(row))) * cell,
                .width = cell,
                .height = cell,
            }, .{ .color = <span class="tok-fn">heat</span>(peak * gain) });
        }
    }
}

<span class="tok-comment">/// One pipeline's dispatch counters, in a type all three can be read into.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The three pipelines are different `Compute(M)` instantiations, so each has its own</span>
<span class="tok-comment">/// `Generation` type even though the fields match. A local struct is what lets one variable</span>
<span class="tok-comment">/// hold the answer from whichever pipeline this row uses.</span>
<span class="tok-kw">const</span> Gen = <span class="tok-kw">struct</span> { submitted: u64, mirrored: u64 };

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// Tapping anywhere switches the operation; both backends recompute from the same inputs.</span>
    <span class="tok-comment">// -- *** A BUTTON, NOT THE WHOLE SCREEN --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Tapping anywhere used to re-run the sweep, which meant every scroll, every stray touch and</span>
    <span class="tok-comment">// every attempt to read a number restarted the measurement. A verifier that discards its</span>
    <span class="tok-comment">// result when you look at it is a verifier you cannot read.</span>
    <span class="tok-kw">const</span> mouse: zm.Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> over: bool = mouse[<span class="tok-num">0</span>] &gt;= s.rerun.x <span class="tok-kw">and</span> mouse[<span class="tok-num">0</span>] &lt;= s.rerun.x + s.rerun.width <span class="tok-kw">and</span>
        mouse[<span class="tok-num">1</span>] &gt;= s.rerun.y <span class="tok-kw">and</span> mouse[<span class="tok-num">1</span>] &lt;= s.rerun.y + s.rerun.height;
    <span class="tok-comment">// Wheel, and vertical drag anywhere outside the button. Clamped to real content: scrolling</span>
    <span class="tok-comment">// past the end leaves a reader staring at nothing and wondering if the page broke.</span>
    s.scroll -= z.<span class="tok-fn">getMouseWheelMove</span>(f.input) * <span class="tok-num">40.0</span>;

    <span class="tok-comment">// -- *** A DRAG ANCHORS ON THE PRESS FRAME, AND THAT FRAME'S DELTA IS DISCARDED --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// This used to apply `getMouseDelta` on every frame the button was down, including the frame</span>
    <span class="tok-comment">// it went down on. With a mouse that is harmless - the pointer was already where you clicked,</span>
    <span class="tok-comment">// so the delta is nearly zero. **With a finger it is the bug**: the pointer TELEPORTS from</span>
    <span class="tok-comment">// wherever it last was to wherever you touched, and that entire jump arrives as one frame's</span>
    <span class="tok-comment">// delta. Touching the bottom of the page to start scrolling flung it by the distance from the</span>
    <span class="tok-comment">// last touch point, which reads as the page popping out from under you.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * So a drag has a beginning: the press frame sets `dragging` and contributes NOTHING, and</span>
    <span class="tok-comment">// only later frames move the page. The page now stays exactly where it was until the finger</span>
    <span class="tok-comment">// actually moves, which is what every other scrolling surface does.</span>
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        s.dragging = !over;
        s.drag_from = mouse[<span class="tok-num">1</span>];
        s.scroll_from = s.scroll;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.dragging <span class="tok-kw">and</span> z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left)) {
        <span class="tok-comment">// ** ABSOLUTE, NOT ACCUMULATED. `scroll = scroll_at_press - (moved since press)` makes</span>
        <span class="tok-comment">// the content track the finger exactly: the pixel under it at the press stays under it,</span>
        <span class="tok-comment">// and no per-frame delta is ever added, so a dropped or doubled frame cannot make the</span>
        <span class="tok-comment">// page drift away from the finger over a long drag.</span>
        s.scroll = s.scroll_from - (mouse[<span class="tok-num">1</span>] - s.drag_from);
    }
    <span class="tok-kw">if</span> (!z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left)) {
        s.dragging = false;
    }
    <span class="tok-kw">const</span> limit: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, s.content_height - f.window.<span class="tok-fn">heightf</span>() + <span class="tok-num">20.0</span>);
    s.scroll = <span class="tok-fn">clamp</span>(s.scroll, <span class="tok-num">0.0</span>, limit);

    <span class="tok-kw">if</span> (over <span class="tok-kw">and</span> z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        s.results = <span class="tok-builtin">@splat</span>(.{});
        s.op = <span class="tok-num">0</span>;
        s.holding = false;
        s.dispatched = false;
    }
    <span class="tok-kw">if</span> (false) {
        s.op += <span class="tok-num">1</span>;
        <span class="tok-comment">// Rebuilding cannot fail - the shapes are fixed and no allocation happens - but a</span>
        <span class="tok-comment">// swallowed error would leave the panels showing a stale field with nothing to say so.</span>
        s.dispatched = false;
    }

    <span class="tok-kw">if</span> (!s.dispatched) {
        s.dispatched = true;
        <span class="tok-comment">// -- *** THREE FRAMES, BECAUSE THE DEVICE MEASURED THE QUEUE AT THREE --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The previous version waited ONE frame and detected staleness by comparing the readback</span>
        <span class="tok-comment">// against the PREVIOUS row's output. **That was wrong, and the device proved it**: with a</span>
        <span class="tok-comment">// three-deep queue the readback is row N-3's data, which does not match row N-1's</span>
        <span class="tok-comment">// reference either - so it was accepted as fresh and compared against row N. Two rows</span>
        <span class="tok-comment">// failed with worst errors of 9.8 and 4.2, which for 0/1 masks can only be another row's</span>
        <span class="tok-comment">// data.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// ** A staleness test that compares against ONE previous row can only catch a lag of</span>
        <span class="tok-comment">// exactly one. Catching a lag of three needs either a comparison against the last three -</span>
        <span class="tok-comment">// which is three chances to collide with a legitimately identical output - or a label</span>
        <span class="tok-comment">// travelling with the data, which the sweep has no spare buffer element for.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * So: three frames, matched to the depth `zimrnum_train` measured. 86 rows x 3 is about</span>
        <span class="tok-comment">// **2.2 s at 120 Hz**, a little over the two-second budget. Correctness first; the budget</span>
        <span class="tok-comment">// is bought back by splitting the sweep when it next grows, not by reading early.</span>
        <span class="tok-comment">// *** SIX, NOT THREE - AND THE DEVICE RAISED IT TWICE NOW.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Three was matched to the queue depth `zimrnum_train` measured. It held for 86 rows and</span>
        <span class="tok-comment">// then failed again at 91: `bcast add (bias)` came back **inf** and `tanh grad` **3.84**,</span>
        <span class="tok-comment">// against bars of zero. Both twins are EXACT on the host, so the kernels and the</span>
        <span class="tok-comment">// reference agree and neither number is a perturbation of the right answer - they are</span>
        <span class="tok-comment">// another row's data, the same signature as the 9.8 and 4.2 recorded above.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The depth is not a constant of the hardware; it moves with row count, with what else</span>
        <span class="tok-comment">// the browser is doing, and with the build. **A number that has been wrong twice should</span>
        <span class="tok-comment">// be set from the budget, not from the last measurement.** Six frames is 91 x 6 = 546</span>
        <span class="tok-comment">// frames, 4.6 s at 120 Hz, inside the six-second budget - so the whole margin available</span>
        <span class="tok-comment">// is spent on being sure, which is what the budget was raised for.</span>
        <span class="tok-comment">// WAIT FOR THIS DISPATCH, NOT FOR SIX FRAMES</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The six above was set from the time budget rather than measured, and its own comment</span>
        <span class="tok-comment">// said so - because there was no way to ask which dispatch a readback belonged to.</span>
        <span class="tok-comment">// `readGeneration` answers that now, so the wait is exact: record the submission count</span>
        <span class="tok-comment">// after dispatching and retire the row when the mirror reaches it.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Never early, never longer than necessary, and it does not move with row count or with</span>
        <span class="tok-comment">// what else the browser is doing - which is what made the old number wrong twice.</span>
        s.settle = <span class="tok-num">0</span>;
        s.await_generation = null;
        <span class="tok-comment">// `run` takes the entry name at comptime, so the branch selects the CALL, not a string.</span>
        <span class="tok-comment">// * `run` takes the entry name at COMPTIME, so the selection is an `inline for` over</span>
        <span class="tok-comment">// the table rather than a runtime lookup - the loop is unrolled and each arm passes a</span>
        <span class="tok-comment">// literal.</span>
        <span class="tok-comment">// ** THE DEVICE MUST SEE THE SAME INPUT THE REFERENCE DID. Uploading per dispatch is</span>
        <span class="tok-comment">// 16 KB of traffic on a row that already reads 4096 elements - nothing - and it removes</span>
        <span class="tok-comment">// the possibility of the two sides being compared on different data, which is the bug</span>
        <span class="tok-comment">// that produced `FAIL add worst 23.9` earlier in this port.</span>
        <span class="tok-kw">switch</span> (cases[s.op].input) {
            .noise =&gt; s.pipe_un.<span class="tok-fn">upload</span>(.x, s.field_a),
            .positive =&gt; s.pipe_un.<span class="tok-fn">upload</span>(.x, s.field_p),
            .unit =&gt; s.pipe_un.<span class="tok-fn">upload</span>(.x, s.field_u),
            .tiny =&gt; s.pipe_un.<span class="tok-fn">upload</span>(.x, s.field_t),
        }
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (cases, <span class="tok-num">0</span>..) |c, i| {
            <span class="tok-kw">if</span> (i == s.op) {
                <span class="tok-kw">switch</span> (c.kind) {
                    .binary =&gt; {
                        s.pipe.<span class="tok-fn">run</span>(c.entry, c.threads);
                        s.await_generation = s.pipe.<span class="tok-fn">readGeneration</span>().submitted;
                    },
                    .unary =&gt; {
                        s.pipe_un.<span class="tok-fn">run</span>(c.entry, c.threads);
                        s.await_generation = s.pipe_un.<span class="tok-fn">readGeneration</span>().submitted;
                    },
                    .matmul =&gt; {
                        s.pipe_mm.<span class="tok-fn">run</span>(c.entry, c.threads);
                        s.await_generation = s.pipe_mm.<span class="tok-fn">readGeneration</span>().submitted;
                    },
                }
            }
        }
    }
    <span class="tok-comment">// Frame-delayed readback: last frame's mapped data, so the queue is never stalled. Whichever</span>
    <span class="tok-comment">// pipeline is live for this mode is the one asked.</span>
    <span class="tok-kw">const</span> readback: ?[]<span class="tok-kw">const</span> f32 = <span class="tok-kw">switch</span> (cases[s.op].kind) {
        .binary =&gt; s.pipe.<span class="tok-fn">readLatest</span>(.out),
        .unary =&gt; s.pipe_un.<span class="tok-fn">readLatest</span>(.out),
        .matmul =&gt; s.pipe_mm.<span class="tok-fn">readLatest</span>(.out),
    };
    <span class="tok-comment">// THE ROW RETIRES WHEN THE MIRROR REACHES ITS OWN DISPATCH</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `readback` being non-null means SOME copy landed; the generation says whose. Comparing</span>
    <span class="tok-comment">// them is what removes the guess - a row that has not been dispatched yet</span>
    <span class="tok-comment">// (`await_generation == null`) and one whose data has not arrived both wait, and neither</span>
    <span class="tok-comment">// waits a frame longer than it has to.</span>
    <span class="tok-comment">// The three pipelines are different `Compute(M)` instantiations, so their `Generation`</span>
    <span class="tok-comment">// types are distinct even though the fields match. Reading the fields out separately is</span>
    <span class="tok-comment">// what lets one variable hold the answer from any of them.</span>
    <span class="tok-kw">const</span> generation: Gen = <span class="tok-kw">switch</span> (cases[s.op].kind) {
        .binary =&gt; blk: {
            <span class="tok-kw">const</span> g: <span class="tok-builtin">@TypeOf</span>(s.pipe).Generation = s.pipe.<span class="tok-fn">readGeneration</span>();
            <span class="tok-kw">break</span> :blk Gen{ .submitted = g.submitted, .mirrored = g.mirrored };
        },
        .unary =&gt; blk: {
            <span class="tok-kw">const</span> g: <span class="tok-builtin">@TypeOf</span>(s.pipe_un).Generation = s.pipe_un.<span class="tok-fn">readGeneration</span>();
            <span class="tok-kw">break</span> :blk Gen{ .submitted = g.submitted, .mirrored = g.mirrored };
        },
        .matmul =&gt; blk: {
            <span class="tok-kw">const</span> g: <span class="tok-builtin">@TypeOf</span>(s.pipe_mm).Generation = s.pipe_mm.<span class="tok-fn">readGeneration</span>();
            <span class="tok-kw">break</span> :blk Gen{ .submitted = g.submitted, .mirrored = g.mirrored };
        },
    };
    <span class="tok-kw">const</span> arrived: bool = <span class="tok-kw">if</span> (s.await_generation) |wanted|
        generation.mirrored &gt;= wanted
    <span class="tok-kw">else</span>
        false;
    <span class="tok-kw">if</span> (s.settle &gt; <span class="tok-num">0</span>) {
        s.settle -= <span class="tok-num">1</span>;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (!arrived) {
        <span class="tok-comment">// Still in flight. Nothing to do but let the next frame poll again.</span>
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (readback) |out| {
        <span class="tok-kw">const</span> n: usize = <span class="tok-builtin">@min</span>(out.len, s.gpu_out.len);
        <span class="tok-builtin">@memcpy</span>(s.gpu_out[<span class="tok-num">0</span>..n], out[<span class="tok-num">0</span>..n]);
        <span class="tok-kw">const</span> reference: []<span class="tok-kw">const</span> f32 = s.cpu_ref[s.op];
        <span class="tok-builtin">@memcpy</span>(s.cpu_out[<span class="tok-num">0</span>..n], reference[<span class="tok-num">0</span>..n]);
        <span class="tok-comment">// Only the values this row actually produces.</span>
        <span class="tok-kw">const</span> judged: usize = <span class="tok-builtin">@min</span>(n, cases[s.op].out_len);
        <span class="tok-kw">const</span> cmp: Comparison = <span class="tok-fn">compare</span>(s.gpu_out[<span class="tok-num">0</span>..judged], reference[<span class="tok-num">0</span>..judged]);
        <span class="tok-kw">const</span> worst: f32 = cmp.worst;
        s.results[s.op] = .{ .done = true, .worst = worst, .peak = cmp.peak, .checked = <span class="tok-builtin">@intCast</span>(judged) };

        <span class="tok-comment">// The FIRST failure keeps the heatmaps, so the picture explains the number.</span>
        <span class="tok-kw">if</span> (worst &gt; <span class="tok-fn">barFor</span>(cases[s.op], cmp.peak) <span class="tok-kw">or</span> judged != cases[s.op].out_len) {
            s.holding = true;
        }
        <span class="tok-kw">if</span> (!s.results[s.results.len - <span class="tok-num">1</span>].done) {
            s.op += <span class="tok-num">1</span>;
            s.dispatched = false;
            <span class="tok-kw">if</span> (s.holding) {
                <span class="tok-comment">// Keep the failing picture on screen: re-dispatch but do not overwrite it.</span>
                s.holding = true;
            }
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, z.colors.slate_900);

    <span class="tok-kw">var</span> passing: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> finished: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (s.results, <span class="tok-num">0</span>..) |r, i| {
        <span class="tok-kw">if</span> (!r.done) {
            <span class="tok-kw">continue</span>;
        }
        finished += <span class="tok-num">1</span>;
        <span class="tok-kw">if</span> (r.worst &lt;= <span class="tok-fn">barFor</span>(cases[i], r.peak) <span class="tok-kw">and</span> r.checked == cases[i].out_len) {
            passing += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">const</span> all_done: bool = finished == s.results.len;

    <span class="tok-comment">// -- *** PLAIN TEXT ROWS, NOT A UI TABLE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The `ui.zig` version worked and Simon prefers this one. It is also the honest fit: this</span>
    <span class="tok-comment">// page is read as a SCREENSHOT, so scrolling, column sizing and a frozen header buy nothing,</span>
    <span class="tok-comment">// while the UI library cost ~400 KB of standalone and an extra frame-ordering contract to get</span>
    <span class="tok-comment">// wrong - which it duly was, twice. Text rows have no such contract.</span>
    <span class="tok-kw">var</span> y: f32 = <span class="tok-num">10</span> - s.scroll;
    <span class="tok-kw">if</span> (!all_done) {
        <span class="tok-fn">textRow</span>(f, s, &amp;y, z.colors.amber_400, <span class="tok-num">16</span>, <span class="tok-str">"zimrnum GPU sweep - {d}/{d} measured"</span>, .{
            finished,
            s.results.len,
        });
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (passing == s.results.len) {
        <span class="tok-fn">textRow</span>(f, s, &amp;y, z.colors.emerald_400, <span class="tok-num">16</span>, <span class="tok-str">"ALL PASS - {d}/{d} agree with zimrnum"</span>, .{
            passing,
            s.results.len,
        });
    } <span class="tok-kw">else</span> {
        <span class="tok-fn">textRow</span>(f, s, &amp;y, z.colors.red_400, <span class="tok-num">16</span>, <span class="tok-str">"{d}/{d} PASS - failures marked XX"</span>, .{
            passing,
            s.results.len,
        });
    }
    <span class="tok-fn">textRow</span>(f, s, &amp;y, z.colors.slate_500, <span class="tok-num">12</span>, <span class="tok-str">"     operation           worst |cpu-gpu|  bar"</span>, .{});

    <span class="tok-comment">// ** Two passes: everything that FAILED, then everything else. A reader opening this page</span>
    <span class="tok-comment">// wants the exception, and at forty-eight rows the exception was below the fold.</span>
    <span class="tok-kw">var</span> pass_index: u8 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (pass_index &lt; <span class="tok-num">2</span>) : (pass_index += <span class="tok-num">1</span>) {
        <span class="tok-kw">for</span> (s.results, cases) |r, c| {
            <span class="tok-kw">const</span> failed: bool = r.done <span class="tok-kw">and</span>
                (r.worst &gt; <span class="tok-fn">barFor</span>(c, r.peak) <span class="tok-kw">or</span> r.checked != c.out_len);
            <span class="tok-kw">if</span> ((pass_index == <span class="tok-num">0</span>) != failed) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">if</span> (!r.done) {
                <span class="tok-fn">textRow</span>(f, s, &amp;y, z.colors.slate_600, <span class="tok-num">12</span>, <span class="tok-str">" ..  {s}"</span>, .{c.label});
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> bar: f32 = <span class="tok-fn">barFor</span>(c, r.peak);
            <span class="tok-kw">const</span> ok: bool = !failed;
            <span class="tok-kw">const</span> tint: Color = <span class="tok-kw">if</span> (ok) z.colors.emerald_400 <span class="tok-kw">else</span> z.colors.red_400;
            <span class="tok-comment">// * The bar is printed WITH the deviation, because a verdict a reader cannot check is a</span>
            <span class="tok-comment">// verdict they learn to ignore - and for the rows that scale by ULP it is not a constant.</span>
            <span class="tok-fn">textRow</span>(f, s, &amp;y, tint, <span class="tok-num">12</span>, <span class="tok-str">" {s}  {s: &lt;18} {d: &lt;15} {d}"</span>, .{
                <span class="tok-kw">if</span> (ok) <span class="tok-str">"OK"</span> <span class="tok-kw">else</span> <span class="tok-str">"XX"</span>,
                c.label,
                r.worst,
                bar,
            });
        }
    }

    <span class="tok-kw">const</span> sw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> cell: f32 = <span class="tok-builtin">@min</span>((sw - <span class="tok-num">80.0</span>) / <span class="tok-fn">float</span>((side / <span class="tok-num">2</span>) * <span class="tok-num">3</span>), <span class="tok-num">5.0</span>);
    <span class="tok-kw">const</span> panel: f32 = <span class="tok-fn">float</span>(side / <span class="tok-num">2</span>) * cell;
    <span class="tok-kw">const</span> top: f32 = y + <span class="tok-num">8</span>;
    <span class="tok-fn">drawField</span>(f, s.cpu_out, <span class="tok-num">20</span>, top, cell, <span class="tok-num">1.0</span>);
    <span class="tok-fn">drawField</span>(f, s.gpu_out, <span class="tok-num">40</span> + panel, top, cell, <span class="tok-num">1.0</span>);
    <span class="tok-kw">var</span> diff: [count]f32 = undefined;
    <span class="tok-kw">for</span> (s.cpu_out, s.gpu_out, <span class="tok-num">0</span>..) |cv, gv, i| {
        diff[i] = cv - gv;
    }
    <span class="tok-fn">drawField</span>(f, &amp;diff, <span class="tok-num">60</span> + panel * <span class="tok-num">2</span>, top, cell, <span class="tok-num">1000.0</span>);

    <span class="tok-comment">// The button, drawn last so nothing overlaps it. Deliberately away from the table: the rows</span>
    <span class="tok-comment">// are what a reader reaches for, and a control under a finger is a control pressed by</span>
    <span class="tok-comment">// accident.</span>
    <span class="tok-kw">var</span> cap: f32 = top + panel + <span class="tok-num">4</span>;
    <span class="tok-fn">caption</span>(f, s, <span class="tok-num">20</span>, &amp;cap, <span class="tok-str">"CPU"</span>);
    <span class="tok-fn">caption</span>(f, s, <span class="tok-num">40</span> + panel, &amp;cap, <span class="tok-str">"GPU"</span>);
    <span class="tok-fn">caption</span>(f, s, <span class="tok-num">60</span> + panel * <span class="tok-num">2</span>, &amp;cap, <span class="tok-str">"diff x1000"</span>);

    <span class="tok-comment">// Placed BELOW the heatmaps, from the layout rather than a guess, and recorded for next</span>
    <span class="tok-comment">// frame's hit test. Away from the rows, because a control under a finger is a control</span>
    <span class="tok-comment">// pressed by accident - which is why tapping anywhere used to restart the measurement every</span>
    <span class="tok-comment">// time someone tried to read it.</span>
    s.rerun = .{ .x = <span class="tok-num">20</span>, .y = cap + <span class="tok-num">6</span>, .width = rerun_size.w, .height = rerun_size.h };
    <span class="tok-comment">// Recorded from the layout, so the scroll limit follows the content instead of a constant</span>
    <span class="tok-comment">// that goes stale the next time a row is added.</span>
    s.content_height = s.rerun.y + s.rerun.height + s.scroll;
    f.gl.<span class="tok-fn">rect</span>(s.rerun, .{ .color = <span class="tok-kw">if</span> (over) z.colors.slate_600 <span class="tok-kw">else</span> z.colors.slate_700 });
    f.gl.<span class="tok-fn">rect</span>(s.rerun, .{ .color = z.colors.slate_400, .outline = <span class="tok-num">1</span> });
    f.gl.<span class="tok-fn">text</span>(
        .{ s.rerun.x + <span class="tok-num">16</span>, s.rerun.y + <span class="tok-num">7</span> },
        <span class="tok-str">"re-run sweep"</span>,
        .{ .size = <span class="tok-num">13</span>, .color = z.colors.slate_100, .font = &amp;s.font },
    );
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// The only hand-drawn text left: three labels under the heatmaps, which sit outside the UI</span>
<span class="tok-comment">/// window on purpose.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">textRow</span>(
    f: *z.Frame,
    s: *State,
    y: *f32,
    color: Color,
    size: f32,
    <span class="tok-kw">comptime</span> fmt: []<span class="tok-kw">const</span> u8,
    args: <span class="tok-kw">anytype</span>,
) void {
    <span class="tok-kw">var</span> buf: [<span class="tok-num">160</span>]u8 = undefined;
    <span class="tok-kw">const</span> text: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf, fmt, args) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">12</span>, y.* }, text, .{ .size = size, .color = color, .font = &amp;s.font });
    y.* += size + <span class="tok-num">4</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">caption</span>(
    f: *z.Frame,
    s: *State,
    x: f32,
    y: *f32,
    text: []<span class="tok-kw">const</span> u8,
) void {
    f.gl.<span class="tok-fn">text</span>(.{ x, y.* }, text, .{ .size = <span class="tok-num">13</span>, .color = z.colors.slate_400, .font = &amp;s.font });
}

<span class="tok-comment">/// Descriptor-only: the standalone runner or the launcher drives this.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - zimrnum field"</span>,
            .width = <span class="tok-num">900</span>,
            .height = <span class="tok-num">460</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
