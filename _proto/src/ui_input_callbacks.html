<h1>ui_input_callbacks</h1>
<figure class="code src-file" data-path="examples/ui_input_callbacks/ui_input_callbacks.zig" data-lines="244"><figcaption><span>examples/ui_input_callbacks/ui_input_callbacks.zig</span><span>244 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_input_callbacks.zig - Phase A4 of the imgui-parity arc.</span>
<span class="tok-comment">// Demonstrates the `InputTextOpts` callback slots - the imgui-</span>
<span class="tok-comment">// parity equivalent of `ImGuiInputTextCallbackData` adapted to</span>
<span class="tok-comment">// zimr's caller-owned-buffer model.  Four widgets, one per</span>
<span class="tok-comment">// callback type:</span>
<span class="tok-comment">//   - **Decimal-only** - `char_filter` callback rejects every</span>
<span class="tok-comment">//     non-digit codepoint.  Type letters; nothing appears.</span>
<span class="tok-comment">//   - **Password mask** - `edit` callback maintains a parallel</span>
<span class="tok-comment">//     "what to display" buffer where every char is replaced with</span>
<span class="tok-comment">//     '*'.  Real characters stored in the actual buffer.</span>
<span class="tok-comment">//   - **Autocomplete** - `completion` callback (Tab key) looks at</span>
<span class="tok-comment">//     the current buffer prefix and replaces it with the matching</span>
<span class="tok-comment">//     dictionary entry.  Try typing "imm" then Tab.</span>
<span class="tok-comment">//   - **Command history** - `history` callback (Up/Down arrows)</span>
<span class="tok-comment">//     scrolls through a fixed list of past commands.</span>
<span class="tok-comment">// What this exercises that A1-A3 didn't: the callback dispatch</span>
<span class="tok-comment">// pipeline.  The same `InputTextCallback` signature carries</span>
<span class="tok-comment">// CharFilter, Completion, History, and Edit events - the slot</span>
<span class="tok-comment">// the callback is wired into determines which event delivers</span>
<span class="tok-comment">// it.  Caller state flows through `InputTextOpts.user_data`</span>
<span class="tok-comment">// (an opaque pointer, cast typed inside each callback).</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> startsWith = std.mem.startsWith;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-comment">// Callback state - one struct per widget.  These are the typed</span>
<span class="tok-comment">// targets the `user_data` pointers cast back to.</span>
<span class="tok-kw">const</span> PasswordState = <span class="tok-kw">struct</span> {
    mask: [<span class="tok-num">64</span>]u8 = std.mem.<span class="tok-fn">zeroes</span>([<span class="tok-num">64</span>]u8),
    mask_len: usize = <span class="tok-num">0</span>,
    show_plaintext: bool = false,
};

<span class="tok-kw">const</span> Dictionary = <span class="tok-kw">struct</span> {
    words: []<span class="tok-kw">const</span> []<span class="tok-kw">const</span> u8,
};

<span class="tok-kw">const</span> History = <span class="tok-kw">struct</span> {
    entries: [<span class="tok-num">8</span>][]<span class="tok-kw">const</span> u8 = .{
        <span class="tok-str">"git status"</span>,
        <span class="tok-str">"git log --oneline -10"</span>,
        <span class="tok-str">"git checkout main"</span>,
        <span class="tok-str">"zig build smoke-test"</span>,
        <span class="tok-str">"zig fmt --check src/"</span>,
        <span class="tok-str">"grep -rnE 'TODO' src/"</span>,
        <span class="tok-str">"ls -la zig-out/web/"</span>,
        <span class="tok-str">"python3 scripts/build_standalone.py basic"</span>,
    },
    cursor: usize = <span class="tok-num">0</span>,
};

<span class="tok-comment">// Callbacks.  Each receives an `*InputTextCallbackData` whose</span>
<span class="tok-comment">// `event` field tells it which slot fired.  `data.user_data` is</span>
<span class="tok-comment">// the opaque pointer set via `InputTextOpts.user_data`.</span>
<span class="tok-comment">/// Drop non-digit codepoints.  Stateless - no `user_data` needed.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">decimalFilter</span>(data: *ui.InputTextCallbackData) void {
    <span class="tok-kw">const</span> cp: u32 = data.event_char;
    <span class="tok-kw">const</span> is_digit: bool = cp &gt;= <span class="tok-str">'0'</span> <span class="tok-kw">and</span> cp &lt;= <span class="tok-str">'9'</span>;
    <span class="tok-kw">if</span> (!is_digit) {
        data.event_char = <span class="tok-num">0</span>;
    }
}

<span class="tok-comment">/// After every edit, refresh the mask buffer from the real buffer.</span>
<span class="tok-comment">/// One '*' per real char.  The display field then shows the mask.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">passwordEdit</span>(data: *ui.InputTextCallbackData) void {
    <span class="tok-kw">const</span> state: *PasswordState = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(data.user_data.?));
    <span class="tok-kw">const</span> real_len: usize = data.buf_len.*;
    <span class="tok-kw">const</span> n: usize = <span class="tok-builtin">@min</span>(real_len, state.mask.len);
    <span class="tok-builtin">@memset</span>(state.mask[<span class="tok-num">0</span>..n], <span class="tok-str">'*'</span>);
    state.mask_len = n;
}

<span class="tok-comment">/// Tab pressed in single-line.  Find the longest dictionary word</span>
<span class="tok-comment">/// that starts with the current buffer; if found, replace the</span>
<span class="tok-comment">/// buffer with that word.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">autocompleteTab</span>(data: *ui.InputTextCallbackData) void {
    <span class="tok-kw">const</span> dict: *<span class="tok-kw">const</span> Dictionary = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(data.user_data.?));
    <span class="tok-kw">const</span> current: []<span class="tok-kw">const</span> u8 = data.buf[<span class="tok-num">0</span>..data.buf_len.*];
    <span class="tok-kw">if</span> (current.len == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">for</span> (dict.words) |w| {
        <span class="tok-kw">if</span> (w.len &lt; current.len) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> prefix_match: bool = <span class="tok-fn">startsWith</span>(u8, w, current);
        <span class="tok-kw">if</span> (prefix_match) {
            _ = data.<span class="tok-fn">setBuffer</span>(w);
            <span class="tok-kw">return</span>;
        }
    }
}

<span class="tok-comment">/// Up / Down arrow in single-line.  Replace buffer with the prior</span>
<span class="tok-comment">/// (or next) history entry.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">historyArrow</span>(data: *ui.InputTextCallbackData) void {
    <span class="tok-kw">const</span> hist: *History = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(data.user_data.?));
    <span class="tok-kw">switch</span> (data.history_dir) {
        .up =&gt; {
            <span class="tok-kw">if</span> (hist.cursor &gt; <span class="tok-num">0</span>) {
                hist.cursor -= <span class="tok-num">1</span>;
            }
        },
        .down =&gt; {
            <span class="tok-kw">if</span> (hist.cursor + <span class="tok-num">1</span> &lt; hist.entries.len) {
                hist.cursor += <span class="tok-num">1</span>;
            }
        },
    }
    _ = data.<span class="tok-fn">setBuffer</span>(hist.entries[hist.cursor]);
}

<span class="tok-comment">// App state.</span>
<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    <span class="tok-comment">// Decimal-only field.</span>
    age_buf: [<span class="tok-num">16</span>]u8 = std.mem.<span class="tok-fn">zeroes</span>([<span class="tok-num">16</span>]u8),
    age_len: usize = <span class="tok-num">0</span>,

    <span class="tok-comment">// Password field.</span>
    pwd_buf: [<span class="tok-num">64</span>]u8 = std.mem.<span class="tok-fn">zeroes</span>([<span class="tok-num">64</span>]u8),
    pwd_len: usize = <span class="tok-num">0</span>,
    pwd_state: PasswordState = .{},

    <span class="tok-comment">// Autocomplete.</span>
    auto_buf: [<span class="tok-num">64</span>]u8 = std.mem.<span class="tok-fn">zeroes</span>([<span class="tok-num">64</span>]u8),
    auto_len: usize = <span class="tok-num">0</span>,

    <span class="tok-comment">// History.</span>
    hist_buf: [<span class="tok-num">64</span>]u8 = std.mem.<span class="tok-fn">zeroes</span>([<span class="tok-num">64</span>]u8),
    hist_len: usize = <span class="tok-num">0</span>,
    history: History = .{},
};

<span class="tok-comment">// Dictionary lives at module scope as a `const` (not `var`), so</span>
<span class="tok-comment">// it satisfies Rule 9 - no module-level mutable globals.</span>
<span class="tok-kw">const</span> dict_words = [_][]<span class="tok-kw">const</span> u8{
    <span class="tok-str">"immediate"</span>,  <span class="tok-str">"imgui"</span>,       <span class="tok-str">"implement"</span>, <span class="tok-str">"implicit"</span>, <span class="tok-str">"import"</span>,
    <span class="tok-str">"improve"</span>,    <span class="tok-str">"include"</span>,     <span class="tok-str">"increment"</span>, <span class="tok-str">"indent"</span>,   <span class="tok-str">"index"</span>,
    <span class="tok-str">"initialize"</span>, <span class="tok-str">"input"</span>,       <span class="tok-str">"insert"</span>,    <span class="tok-str">"inspect"</span>,  <span class="tok-str">"install"</span>,
    <span class="tok-str">"instance"</span>,   <span class="tok-str">"instantiate"</span>, <span class="tok-str">"integer"</span>,   <span class="tok-str">"interact"</span>, <span class="tok-str">"interface"</span>,
};
<span class="tok-kw">const</span> dictionary = Dictionary{ .words = &amp;dict_words };

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"inputText callbacks"</span>, .{
        .initial_pos = .{ <span class="tok-num">20</span>, <span class="tok-num">20</span> },
        .initial_size = .{ <span class="tok-num">680</span>, <span class="tok-num">560</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Phase A4 - InputTextCallbackData."</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Four widgets, one per callback slot."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// ---- Decimal-only (char_filter)</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"1. CharFilter - type anything; only digits pass through:"</span>, .{});
        _ = u.<span class="tok-fn">inputText</span>(<span class="tok-str">"Age"</span>, &amp;s.age_buf, &amp;s.age_len, .{
            .width = <span class="tok-num">200</span>,
            .char_filter = decimalFilter,
        });
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"(buffer: \"{s}\")"</span>, .{s.age_buf[<span class="tok-num">0</span>..s.age_len]});

        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// ---- Password mask (edit)</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"2. Edit - buffer holds the real chars, display shows '*':"</span>, .{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"show plaintext"</span>, &amp;s.pwd_state.show_plaintext);
        _ = u.<span class="tok-fn">inputText</span>(<span class="tok-str">"Password"</span>, &amp;s.pwd_buf, &amp;s.pwd_len, .{
            .width = <span class="tok-num">240</span>,
            .edit = passwordEdit,
            .user_data = &amp;s.pwd_state,
        });
        <span class="tok-kw">if</span> (s.pwd_state.show_plaintext) {
            u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"(plaintext: \"{s}\")"</span>, .{s.pwd_buf[<span class="tok-num">0</span>..s.pwd_len]});
        } <span class="tok-kw">else</span> {
            u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"(masked: \"{s}\")"</span>, .{s.pwd_state.mask[<span class="tok-num">0</span>..s.pwd_state.mask_len]});
        }

        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// ---- Autocomplete (completion)</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"3. Completion - type a prefix, press Tab.  Try \"imm\":"</span>, .{});
        _ = u.<span class="tok-fn">inputText</span>(<span class="tok-str">"Word"</span>, &amp;s.auto_buf, &amp;s.auto_len, .{
            .width = <span class="tok-num">320</span>,
            .completion = autocompleteTab,
            .user_data = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@constCast</span>(&amp;dictionary)),
        });
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Dictionary: {d} words starting with i-..."</span>, .{dict_words.len});

        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// ---- History (history)</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"4. History - Up/Down arrows scroll through prior commands:"</span>, .{});
        _ = u.<span class="tok-fn">inputText</span>(<span class="tok-str">"Command"</span>, &amp;s.hist_buf, &amp;s.hist_len, .{
            .width = <span class="tok-num">460</span>,
            .history = historyArrow,
            .user_data = &amp;s.history,
        });
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"(cursor: {d} of {d})"</span>, .{ s.history.cursor + <span class="tok-num">1</span>, s.history.entries.len });

        u.<span class="tok-fn">separator</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Implementation notes:"</span>, .{});
        u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"Each slot is an optional InputTextCallback pointer on InputTextOpts."</span>, .{});
        u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"CharFilter + Edit fire in both inputText and inputTextMultiline."</span>, .{});
        u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"Completion (Tab) + History (Up/Down) fire only in single-line."</span>, .{});
        u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"user_data is opaque; caller casts to whatever typed state they need."</span>, .{});
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - ui_input_callbacks (Phase A4)"</span>,
            .width = <span class="tok-num">720</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,
