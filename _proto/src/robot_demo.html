<style>
:root{
  /* two surfaces, one ink */
  --bg:#0a0a0a;          /* the page */
  --panel:#141414;       /* anything set apart: code, callout, device side */
  --panel-2:#1b1b1b;     /* a panel on a panel (figcaption, summary) */
  --fg:#e8e8e8;          /* body text */
  --dim:#9aa0a8;         /* secondary text, captions */
  --faint:#6b7280;       /* labels, line numbers, table headers */
  --rule:#262626;        /* every border in the document */
  --link:#82d8ef;
  /* tokens — the one set, shared by the Zig and WGSL highlighters */
  --tok-comment:#6b7a8c;
  --tok-kw:#c792ea;
  --tok-fn:#82d8ef;
  --tok-str:#9ad08a;
  --tok-num:#f5a35e;
  --tok-type:#6fb6ff;
  --tok-builtin:#e9a23b;
  /* one font: mono, from whatever ships on the device. No download. */
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --maxw:860px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{

}

.tok-comment{color:var(--tok-comment);font-style:italic;}

/* a captioned code block: <figure class="code"><figcaption>… */

}

/* folds — pure CSS, no JS. The summary text is just the name; the prose
   comes from ::before, which is zimrnum-tutorial's trick and a good one. */
details{border:1px solid var(--rule);border-radius:3px;margin:.5em 0;background:var(--panel);}
details[open]{background:var(--bg);}

  cursor:pointer;padding:.4em .8em;color:var(--dim);font-size:.9em;
  list-style:none;user-select:none;
}

.src-fold>summary::after{content:" \\2014 source";color:var(--faint);}
/* callouts — one box, a coloured left rule says which kind */

img,svg,canvas,video{max-width:100%;height:auto;}

}

}
.zn-source{margin:.6em 0 1.4em;}
.lesson{margin:2em 0;}
.lesson-title{font-weight:700;color:#fff;}
.lesson-goal{color:var(--dim);}
/* page furniture: the landing page and the tutorials' own scaffolding */
.blog-container,.wrap,.max{max-width:var(--maxw);margin:0 auto;}
.title{font-size:1.8rem;margin:0 0 .2em;}
.subtitle,.lede,.sub{

}

.fn{margin:1.1em 0;}

.sketch{color:var(--dim);}
.pane{border:1px solid var(--rule);border-radius:3px;margin:1.1em 0;}
.pane-head{

}
.cell{padding:.5em .8em;}

.g-item{

.g-main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.g-bar{

}

@media(max-width:700px){

.tut{

@media(max-width:700px){body{font-size:14px;padding:1.4rem .8rem 4rem;}pre{font-size:12px;}}

<h1>robot_demo</h1>
<figure class="code src-file" data-path="examples/robot_demo/robot_demo.zig" data-lines="288"><figcaption><span>examples/robot_demo/robot_demo.zig</span><span>288 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! robot_demo - a scene table for `src/robot.zig`, in the shape of the 2D physics demo.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The host knows nothing about any individual scene: it steps whatever `scenes.zig` hands</span>
<span class="tok-comment">//! it, draws the links from the engine's own body poses, and renders a HUD. Adding a scene</span>
<span class="tok-comment">//! is adding a row to that table.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Every scene is planar (hinges about Z), so this draws in 2D with no camera. The engine</span>
<span class="tok-comment">//! is fully 3D; the demo is 2D because that is what reads on a phone.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Standard wgpu example contract: a `pub const app: z.AppSpec(State)`.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> rbt = z.robot;
<span class="tok-kw">const</span> scenes = <span class="tok-builtin">@import</span>(<span class="tok-str">"scenes.zig"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> vec2 = zm.vec2;
<span class="tok-kw">const</span> rotate = zm.rotate;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> assertUnreachable = zm.assertUnreachable;

<span class="tok-comment">/// Scale text and chrome with the viewport.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// A standalone build renders at DEVICE resolution - a phone reporting a CSS width of 400</span>
<span class="tok-comment">/// gives a canvas near 1080 wide - so a fixed 13-pixel font arrives about four CSS pixels</span>
<span class="tok-comment">/// tall. Readable in the in-app viewer, invisible in a browser full-screen. Scaling against</span>
<span class="tok-comment">/// the smaller dimension makes a glyph a fixed fraction of the screen instead.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">uiScale</span>(w: f32, h: f32) f32 {
    <span class="tok-kw">return</span> <span class="tok-builtin">@max</span>(<span class="tok-num">1.0</span>, <span class="tok-builtin">@min</span>(w, h) / <span class="tok-num">450.0</span>);
}

<span class="tok-comment">/// The scene picker's strip along the bottom, before scaling.</span>
<span class="tok-kw">const</span> picker_h: f32 = <span class="tok-num">108</span>;
<span class="tok-comment">/// Where the pivot sits within the world area, as a fraction of its height. Leaves room</span>
<span class="tok-comment">/// above for the HUD and below for a full downward swing.</span>
<span class="tok-kw">const</span> origin_y_frac: f32 = <span class="tok-num">0.30</span>;
<span class="tok-comment">/// Fraction of the world area a scene's full reach should occupy. Under 1 so a mechanism</span>
<span class="tok-comment">/// swinging sideways still has margin.</span>
<span class="tok-kw">const</span> fill: f32 = <span class="tok-num">0.62</span>;

<span class="tok-kw">const</span> bg: Color = .{ .r = <span class="tok-num">31</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">14</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> panel: Color = .{ .r = <span class="tok-num">51</span>, .g = <span class="tok-num">34</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> panel_on: Color = .{ .r = <span class="tok-num">88</span>, .g = <span class="tok-num">52</span>, .b = <span class="tok-num">32</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> accent: Color = .{ .r = <span class="tok-num">211</span>, .g = <span class="tok-num">95</span>, .b = <span class="tok-num">51</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> accent2: Color = .{ .r = <span class="tok-num">79</span>, .g = <span class="tok-num">179</span>, .b = <span class="tok-num">165</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> trail_col: Color = .{ .r = <span class="tok-num">79</span>, .g = <span class="tok-num">179</span>, .b = <span class="tok-num">165</span>, .a = <span class="tok-num">80</span> };
<span class="tok-kw">const</span> text_col: Color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">230</span>, .b = <span class="tok-num">210</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> dim_col: Color = .{ .r = <span class="tok-num">168</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">132</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> target_col: Color = .{ .r = <span class="tok-num">232</span>, .g = <span class="tok-num">196</span>, .b = <span class="tok-num">92</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> trail_len: usize = <span class="tok-num">200</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    font: z.Font,
    index: usize,
    live: scenes.Live,
    trail: [trail_len]Vec2,
    trail_n: usize,
    accumulator: f32,
    <span class="tok-comment">/// Live drag target, in world metres.</span>
    target: Vec2,
    pointing: bool,

    <span class="tok-kw">fn</span> <span class="tok-fn">load</span>(self: *State, index: usize) !void {
        self.live.<span class="tok-fn">deinit</span>(self.gpa);
        self.index = index;
        self.live = <span class="tok-kw">try</span> scenes.all[index].<span class="tok-fn">build</span>(self.gpa);
        self.trail_n = <span class="tok-num">0</span>;
        self.accumulator = <span class="tok-num">0</span>;
        self.pointing = false;
    }
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{
        .gpa = gpa,
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .index = <span class="tok-num">0</span>,
        .live = <span class="tok-kw">try</span> scenes.all[<span class="tok-num">0</span>].<span class="tok-fn">build</span>(gpa),
        .trail = <span class="tok-builtin">@splat</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>)),
        .trail_n = <span class="tok-num">0</span>,
        .accumulator = <span class="tok-num">0</span>,
        .target = <span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, -<span class="tok-num">0.5</span>),
        .pointing = false,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.live.<span class="tok-fn">deinit</span>(gpa);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-comment">/// How the world maps onto the screen, recomputed each frame so the view survives a</span>
<span class="tok-comment">/// resize, a rotation, and a viewport squashed by an on-screen keyboard.</span>
<span class="tok-kw">const</span> View = <span class="tok-kw">struct</span> {
    origin: Vec2,
    scale: f32,

    <span class="tok-comment">/// Fit `reach` metres into the space above the picker, in both axes.</span>
    <span class="tok-kw">fn</span> <span class="tok-fn">fit</span>(w: f32, h: f32, reach: f32) View {
        <span class="tok-kw">const</span> world_h: f32 = <span class="tok-builtin">@max</span>(h - picker_h * <span class="tok-fn">uiScale</span>(w, h), <span class="tok-num">80</span>);
        <span class="tok-kw">const</span> oy: f32 = world_h * origin_y_frac;
        <span class="tok-comment">// Vertically the mechanism hangs DOWN from the pivot, so the space that matters is</span>
        <span class="tok-comment">// what is below it. Horizontally it can swing either way, so it is the half-width.</span>
        <span class="tok-kw">const</span> room: f32 = <span class="tok-builtin">@min</span>(world_h - oy, w * <span class="tok-num">0.5</span>);
        <span class="tok-kw">return</span> .{ .origin = <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.5</span>, oy), .scale = room * fill / <span class="tok-builtin">@max</span>(reach, <span class="tok-num">0.01</span>) };
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">toScreen</span>(self: View, p: Vec2) Vec2 {
        <span class="tok-kw">return</span> <span class="tok-fn">vec2</span>(self.origin[<span class="tok-num">0</span>] + p[<span class="tok-num">0</span>] * self.scale, self.origin[<span class="tok-num">1</span>] - p[<span class="tok-num">1</span>] * self.scale);
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">toWorld</span>(self: View, p: Vec2) Vec2 {
        <span class="tok-kw">return</span> <span class="tok-fn">vec2</span>((p[<span class="tok-num">0</span>] - self.origin[<span class="tok-num">0</span>]) / self.scale, (self.origin[<span class="tok-num">1</span>] - p[<span class="tok-num">1</span>]) / self.scale);
    }
};

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> w: f32 = <span class="tok-fn">float</span>(f.window.screen_width);
    <span class="tok-kw">const</span> h: f32 = <span class="tok-fn">float</span>(f.window.screen_height);
    <span class="tok-kw">const</span> scene: scenes.Scene = scenes.all[s.index];
    <span class="tok-kw">const</span> m: *rbt.Model = &amp;s.live.model;
    <span class="tok-kw">const</span> d: *rbt.Data = &amp;s.live.data;

    <span class="tok-comment">// ---- input ----</span>
    <span class="tok-kw">const</span> mouse: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> held: bool = z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left);
    <span class="tok-kw">const</span> view: View = .<span class="tok-fn">fit</span>(w, h, scene.reach);
    <span class="tok-comment">// The bottom strip is the scene picker; everything above it is the world.</span>
    <span class="tok-kw">const</span> ui: f32 = <span class="tok-fn">uiScale</span>(w, h);
    <span class="tok-kw">const</span> picker_top: f32 = h - picker_h * ui;
    <span class="tok-kw">const</span> in_world: bool = mouse[<span class="tok-num">1</span>] &lt; picker_top;
    s.pointing = held <span class="tok-kw">and</span> in_world;
    <span class="tok-kw">if</span> (s.pointing) {
        s.target = view.<span class="tok-fn">toWorld</span>(mouse);
    }

    <span class="tok-comment">// ---- step, at a fixed rate independent of frame rate ----</span>
    <span class="tok-kw">const</span> dt: f32 = m.opt.timestep;
    s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
    <span class="tok-kw">while</span> (s.accumulator &gt;= dt) : (s.accumulator -= dt) {
        <span class="tok-comment">// A controller belongs between "state is known" and "forces are committed", so the</span>
        <span class="tok-comment">// hook runs against a forward pass and then the step re-runs it. That costs one</span>
        <span class="tok-comment">// extra evaluation and keeps the control law honest about what it can see.</span>
        rbt.<span class="tok-fn">forward</span>(m, d);
        <span class="tok-builtin">@memset</span>(d.applied_force, <span class="tok-num">0</span>);
        <span class="tok-kw">if</span> (scene.control) |hook| {
            <span class="tok-fn">hook</span>(&amp;s.live, .{ .target = s.target, .pointing = s.pointing, .elapsed = s.live.elapsed });
        }
        rbt.<span class="tok-fn">step</span>(m, d);
        s.live.elapsed += dt;
    }
    rbt.<span class="tok-fn">forward</span>(m, d);

    <span class="tok-comment">// ---- draw ----</span>
    z.<span class="tok-fn">clearViewport</span>(f, bg);

    <span class="tok-comment">// Trail of the scene's nominated tip.</span>
    <span class="tok-kw">if</span> (scene.tip) |tip| {
        <span class="tok-kw">const</span> p: Vec = d.body_xpos[tip.body] + <span class="tok-fn">rotate</span>(d.body_xrot[tip.body], tip.local);
        s.trail[s.trail_n % trail_len] = <span class="tok-fn">vec2</span>(p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>]);
        s.trail_n += <span class="tok-num">1</span>;
        <span class="tok-kw">const</span> shown: usize = <span class="tok-builtin">@min</span>(s.trail_n, trail_len);
        <span class="tok-kw">const</span> oldest: usize = <span class="tok-kw">if</span> (s.trail_n &gt; trail_len) s.trail_n - trail_len <span class="tok-kw">else</span> <span class="tok-num">0</span>;
        <span class="tok-kw">var</span> k: usize = <span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (k &lt; shown) : (k += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> a: Vec2 = s.trail[(oldest + k - <span class="tok-num">1</span>) % trail_len];
            <span class="tok-kw">const</span> b: Vec2 = s.trail[(oldest + k) % trail_len];
            gl.<span class="tok-fn">line</span>(view.<span class="tok-fn">toScreen</span>(a), view.<span class="tok-fn">toScreen</span>(b), .{ .color = trail_col, .thickness = <span class="tok-num">2</span> * ui });
        }
    }

    <span class="tok-comment">// The mechanism itself, drawn from the engine's body poses. Body 0 is the world, so</span>
    <span class="tok-comment">// each real body's link runs from its parent's origin to its own.</span>
    <span class="tok-kw">var</span> bi: u32 = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (bi &lt; m.nbody) : (bi += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> parent: u32 = m.body_parent[bi];
        <span class="tok-kw">const</span> a: Vec = d.body_xpos[parent];
        <span class="tok-kw">const</span> b: Vec = d.body_xpos[bi];
        <span class="tok-kw">const</span> col: Color = <span class="tok-kw">if</span> (bi % <span class="tok-num">2</span> == <span class="tok-num">1</span>) accent <span class="tok-kw">else</span> accent2;
        gl.<span class="tok-fn">line</span>(
            view.<span class="tok-fn">toScreen</span>(<span class="tok-fn">vec2</span>(a[<span class="tok-num">0</span>], a[<span class="tok-num">1</span>])),
            view.<span class="tok-fn">toScreen</span>(<span class="tok-fn">vec2</span>(b[<span class="tok-num">0</span>], b[<span class="tok-num">1</span>])),
            .{ .color = col, .thickness = <span class="tok-num">9</span> * ui },
        );
        gl.<span class="tok-fn">circle</span>(view.<span class="tok-fn">toScreen</span>(<span class="tok-fn">vec2</span>(b[<span class="tok-num">0</span>], b[<span class="tok-num">1</span>])), <span class="tok-num">6</span>, .{ .color = col });
    }
    <span class="tok-comment">// The far end of the last link, which no body origin marks.</span>
    <span class="tok-kw">if</span> (scene.tip) |tip| {
        <span class="tok-kw">const</span> p: Vec = d.body_xpos[tip.body] + <span class="tok-fn">rotate</span>(d.body_xrot[tip.body], tip.local);
        <span class="tok-kw">const</span> last: Vec = d.body_xpos[tip.body];
        <span class="tok-kw">const</span> col: Color = <span class="tok-kw">if</span> (tip.body % <span class="tok-num">2</span> == <span class="tok-num">1</span>) accent <span class="tok-kw">else</span> accent2;
        gl.<span class="tok-fn">line</span>(
            view.<span class="tok-fn">toScreen</span>(<span class="tok-fn">vec2</span>(last[<span class="tok-num">0</span>], last[<span class="tok-num">1</span>])),
            view.<span class="tok-fn">toScreen</span>(<span class="tok-fn">vec2</span>(p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>])),
            .{ .color = col, .thickness = <span class="tok-num">9</span> * ui },
        );
        gl.<span class="tok-fn">circle</span>(view.<span class="tok-fn">toScreen</span>(<span class="tok-fn">vec2</span>(p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>])), <span class="tok-num">7</span>, .{ .color = col });
    }
    gl.<span class="tok-fn">circle</span>(view.<span class="tok-fn">toScreen</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>)), <span class="tok-num">7</span>, .{ .color = dim_col });

    <span class="tok-kw">if</span> (s.pointing) {
        gl.<span class="tok-fn">circle</span>(view.<span class="tok-fn">toScreen</span>(s.target), <span class="tok-num">9</span> * ui, .{ .color = target_col, .outline = <span class="tok-num">2</span> });
    }

    <span class="tok-comment">// ---- HUD ----</span>
    <span class="tok-kw">var</span> buf: [<span class="tok-num">160</span>]u8 = undefined;
    <span class="tok-kw">const</span> title: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"{s} / {s}"</span>, .{ scene.category, scene.name }) <span class="tok-kw">catch</span> scene.name;
    gl.<span class="tok-fn">text</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">26</span> * ui), title, .{ .size = <span class="tok-num">18</span> * ui, .color = text_col, .font = &amp;s.font });
    gl.<span class="tok-fn">text</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">48</span> * ui), scene.blurb, .{ .size = <span class="tok-num">13</span> * ui, .color = dim_col, .font = &amp;s.font });

    <span class="tok-kw">var</span> buf2: [<span class="tok-num">160</span>]u8 = undefined;
    <span class="tok-kw">const</span> stats: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf2,
        <span class="tok-str">"nv {d}  nu {d}  constraints {d}  solver {d} it  energy {d:.2} J"</span>,
        .{ m.nv, m.nu, d.constraint_count, d.solver_iterations, rbt.<span class="tok-fn">energy</span>(m, d) },
    ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    gl.<span class="tok-fn">text</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">70</span> * ui), stats, .{ .size = <span class="tok-num">13</span> * ui, .color = dim_col, .font = &amp;s.font });

    <span class="tok-comment">// A scene's own readout, if it has one: the numbers that scene is actually about.</span>
    <span class="tok-kw">if</span> (scene.readout) |readout| {
        <span class="tok-kw">var</span> buf3: [<span class="tok-num">160</span>]u8 = undefined;
        gl.<span class="tok-fn">text</span>(
            <span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">92</span> * ui),
            <span class="tok-fn">readout</span>(&amp;s.live, &amp;buf3),
            .{ .size = <span class="tok-num">13</span> * ui, .color = accent2, .font = &amp;s.font },
        );
    }

    <span class="tok-comment">// ---- scene picker: one cell per scene, wrapped ----</span>
    <span class="tok-kw">const</span> cols: usize = <span class="tok-num">4</span>;
    <span class="tok-kw">const</span> cell_w: f32 = (w - <span class="tok-num">24</span> * ui) / <span class="tok-fn">float</span>(cols);
    <span class="tok-kw">const</span> cell_h: f32 = <span class="tok-num">30</span> * ui;
    <span class="tok-kw">const</span> clicked: bool = z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left);
    <span class="tok-kw">for</span> (scenes.all, <span class="tok-num">0</span>..) |sc, i| {
        <span class="tok-kw">const</span> col_i: f32 = <span class="tok-fn">float</span>(i % cols);
        <span class="tok-kw">const</span> row_i: f32 = <span class="tok-fn">float</span>(i / cols);
        <span class="tok-kw">const</span> r: z.Rectangle = .{
            .x = <span class="tok-num">12</span> * ui + col_i * cell_w,
            .y = picker_top + <span class="tok-num">6</span> * ui + row_i * (cell_h + <span class="tok-num">6</span> * ui),
            .width = cell_w - <span class="tok-num">6</span> * ui,
            .height = cell_h,
        };
        gl.<span class="tok-fn">rect</span>(r, .{ .color = <span class="tok-kw">if</span> (i == s.index) panel_on <span class="tok-kw">else</span> panel });
        gl.<span class="tok-fn">text</span>(
            <span class="tok-fn">vec2</span>(r.x + <span class="tok-num">7</span> * ui, r.y + cell_h * <span class="tok-num">0.68</span>),
            sc.name,
            .{ .size = <span class="tok-num">11</span> * ui, .color = <span class="tok-kw">if</span> (i == s.index) text_col <span class="tok-kw">else</span> dim_col, .font = &amp;s.font },
        );
        <span class="tok-kw">const</span> hit: bool = mouse[<span class="tok-num">0</span>] &gt;= r.x <span class="tok-kw">and</span> mouse[<span class="tok-num">0</span>] &lt;= r.x + r.width <span class="tok-kw">and</span>
            mouse[<span class="tok-num">1</span>] &gt;= r.y <span class="tok-kw">and</span> mouse[<span class="tok-num">1</span>] &lt;= r.y + r.height;
        <span class="tok-kw">if</span> (clicked <span class="tok-kw">and</span> hit <span class="tok-kw">and</span> i != s.index) {
            s.<span class="tok-fn">load</span>(i) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"scene build failed"</span>, .{});
        }
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{

        .window = .{

<span class="tok-comment">//!</span>
<span class="tok-comment">//! Same shape as `examples/zimrphysics2d_demo/scenes.zig`: one table, one row per scene,</span>
<span class="tok-comment">//! and the host knows nothing about any individual scene. Adding a scene is adding a row.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Every scene is PLANAR - hinges about Z, so the machine swings in the screen plane and</span>
<span class="tok-comment">//! the host can draw it in 2D with no camera. That is not a limitation of the engine (it</span>
<span class="tok-comment">//! is fully 3D); it is what makes the demo readable on a phone.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A scene owns a `robot.Model` and a `robot.Data`. It may install a `control` hook, which</span>
<span class="tok-comment">//! runs once per frame BEFORE the physics - the same position in the pipeline a real</span>
<span class="tok-comment">//! controller occupies, between "everything derived from state is known" and "no force has</span>
<span class="tok-comment">//! been committed yet".</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> rbt = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>).robot;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> dot3 = zm.dot3;
<span class="tok-kw">const</span> splat = zm.splat;

<span class="tok-comment">/// What a scene's control hook can see. Deliberately small: a target the user is dragging,</span>
<span class="tok-comment">/// and the clock. A scene that needs more probably wants to be a different demo.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Input = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// Where the user is pointing, in world metres. Only meaningful while `pointing`.</span>
    target: Vec2,
    pointing: bool,
    <span class="tok-comment">/// Seconds since this scene was (re)started.</span>
    elapsed: f32,
};

<span class="tok-comment">/// A live scene: the model, its state, and scratch the control hook may use.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Live = <span class="tok-kw">struct</span> {
    model: rbt.Model,
    data: rbt.Data,
    <span class="tok-comment">/// Jacobian scratch, sized to the model. Allocated once so a control hook running at</span>
    <span class="tok-comment">/// 240 Hz never touches an allocator.</span>
    jac_p: []Vec,
    jac_r: []Vec,
    elapsed: f32,

    <span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(self: *Live, gpa: Allocator) void {
        gpa.<span class="tok-fn">free</span>(self.jac_p);
        gpa.<span class="tok-fn">free</span>(self.jac_r);
        self.data.<span class="tok-fn">deinit</span>();
        self.model.<span class="tok-fn">deinit</span>();
    }
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Scene = <span class="tok-kw">struct</span> {
    category: []<span class="tok-kw">const</span> u8,
    name: []<span class="tok-kw">const</span> u8,
    <span class="tok-comment">/// One line under the title, explaining what to look at.</span>
    blurb: []<span class="tok-kw">const</span> u8,
    build: *<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (gpa: Allocator) anyerror!Live,
    <span class="tok-comment">/// Optional per-frame hook, run before the physics.</span>
    control: ?*<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (live: *Live, in: Input) void = null,
    <span class="tok-comment">/// Which body/offset the tip marker and trail follow. Null draws no trail.</span>
    tip: ?<span class="tok-kw">struct</span> { body: u32, local: Vec } = null,
    <span class="tok-comment">/// Optional live readout, drawn under the blurb. Lets a scene surface the numbers it is</span>
    <span class="tok-comment">/// actually about - an IMU's reading, a tendon's length - rather than leaving the</span>
    <span class="tok-comment">/// interesting quantity invisible inside `Data`.</span>
    readout: ?*<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (live: *<span class="tok-kw">const</span> Live, buf: []u8) []<span class="tok-kw">const</span> u8 = null,
    <span class="tok-comment">/// Farthest the mechanism can reach from the origin, in metres. The host scales the</span>
    <span class="tok-comment">/// view to fit it, so a three-link chain and a two-link arm both fill the screen</span>
    <span class="tok-comment">/// instead of one being tiny and the other running off the bottom.</span>
    reach: f32,
};

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Model builders. Each returns a fresh Live; the host owns exactly one at a time.</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-comment">/// A chain of `n` identical links hanging along -Y, hinged about Z. Covers the whole</span>
<span class="tok-comment">/// Basics category: one link is a pendulum, two is chaos, three is more chaos.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">Chain</span>(<span class="tok-kw">comptime</span> n: usize, <span class="tok-kw">comptime</span> armature: f32) type {
    <span class="tok-kw">return</span> <span class="tok-kw">struct</span> {
        <span class="tok-kw">const</span> half: f32 = <span class="tok-num">0.22</span>;
        <span class="tok-kw">const</span> spec = blk: {
            <span class="tok-kw">var</span> bodies: [n]rbt.BodySpec = undefined;
            <span class="tok-kw">for</span> (&amp;bodies, <span class="tok-num">0</span>..) |*b, i| {
                b.* = .{
                    .name = std.fmt.<span class="tok-fn">comptimePrint</span>(<span class="tok-str">"link{d}"</span>, .{i}),
                    .parent = <span class="tok-kw">if</span> (i == <span class="tok-num">0</span>) null <span class="tok-kw">else</span> std.fmt.<span class="tok-fn">comptimePrint</span>(<span class="tok-str">"link{d}"</span>, .{i - <span class="tok-num">1</span>}),
                    .pos = <span class="tok-kw">if</span> (i == <span class="tok-num">0</span>) <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>) <span class="tok-kw">else</span> <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * half, <span class="tok-num">0</span>),
                    .joints = &amp;.{.{
                        .name = std.fmt.<span class="tok-fn">comptimePrint</span>(<span class="tok-str">"j{d}"</span>, .{i}),
                        .kind = .hinge,
                        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
                        .armature = armature,
                    }},
                    .geoms = &amp;.{.{
                        .shape = .{ .capsule = .{ .half_height = half, .radius = <span class="tok-num">0.035</span> } },
                        .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -half, <span class="tok-num">0</span>),
                    }},
                };
            }
            <span class="tok-kw">const</span> frozen = bodies;
            <span class="tok-kw">break</span> :blk rbt.ModelSpec{ .bodies = &amp;frozen, .options = .{ .timestep = <span class="tok-num">1.0</span> / <span class="tok-num">240.0</span> } };
        };
        <span class="tok-kw">const</span> Model = rbt.<span class="tok-fn">Spec</span>(spec);

        <span class="tok-kw">fn</span> <span class="tok-fn">build</span>(gpa: Allocator) anyerror!Live {
            <span class="tok-kw">var</span> live: Live = .{
                .model = <span class="tok-kw">try</span> Model.<span class="tok-fn">build</span>(gpa),
                .data = undefined,
                .jac_p = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, Model.nv),
                .jac_r = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, Model.nv),
                .elapsed = <span class="tok-num">0</span>,
            };
            live.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;live.model);
            <span class="tok-comment">// Start off vertical, or nothing interesting happens.</span>
            live.data.pos[<span class="tok-num">0</span>] = <span class="tok-num">2.3</span>;
            <span class="tok-kw">if</span> (Model.nv &gt; <span class="tok-num">1</span>) {
                live.data.pos[<span class="tok-num">1</span>] = -<span class="tok-num">1.5</span>;
            }
            <span class="tok-kw">return</span> live;
        }
    };
}

<span class="tok-comment">/// A two-link arm with a site at its tip.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// TWO models, not one, and the difference matters: an arm with motors is a different</span>
<span class="tok-comment">/// machine from an arm without. A position servo is ALWAYS acting - leave its control at</span>
<span class="tok-comment">/// zero and it drives the joint to zero with all its gain, which silently overrules any</span>
<span class="tok-comment">/// other controller you layer on top. So the Kinematics scenes get an unactuated arm and</span>
<span class="tok-comment">/// drive it with joint forces, and the Actuators scenes get the servos.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">ArmSpec</span>(<span class="tok-kw">comptime</span> actuated: bool) rbt.ModelSpec {
    <span class="tok-kw">const</span> servos: []<span class="tok-kw">const</span> rbt.ActuatorSpec = <span class="tok-kw">if</span> (actuated) &amp;.{
        .{
            .name = <span class="tok-str">"shoulder_servo"</span>,
            .on = .{ .joint = .{ .name = <span class="tok-str">"shoulder"</span> } },
            .kind = .{ .position = .{ .kp = <span class="tok-num">24</span>, .kv = <span class="tok-num">2.4</span> } },
            .ctrl_range = .{ -pi, pi },
        },
        .{
            .name = <span class="tok-str">"elbow_servo"</span>,
            .on = .{ .joint = .{ .name = <span class="tok-str">"elbow"</span> } },
            .kind = .{ .position = .{ .kp = <span class="tok-num">14</span>, .kv = <span class="tok-num">1.4</span> } },
            .ctrl_range = .{ -pi, pi },
        },
    } <span class="tok-kw">else</span> &amp;.{};

    <span class="tok-kw">return</span> .{
        .bodies = &amp;.{
            .{
                .name = <span class="tok-str">"upper"</span>,
                .joints = &amp;.{.{
                    .name = <span class="tok-str">"shoulder"</span>,
                    .kind = .hinge,
                    .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
                    .armature = <span class="tok-num">0.002</span>,
                    .damping = <span class="tok-num">0.02</span>,
                }},
                .geoms = &amp;.{.{
                    .shape = .{ .capsule = .{ .half_height = Arm.upper, .radius = <span class="tok-num">0.045</span> } },
                    .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -Arm.upper, <span class="tok-num">0</span>),
                }},
            },
            .{
                .name = <span class="tok-str">"lower"</span>,
                .parent = <span class="tok-str">"upper"</span>,
                .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * Arm.upper, <span class="tok-num">0</span>),
                .joints = &amp;.{.{
                    .name = <span class="tok-str">"elbow"</span>,
                    .kind = .hinge,
                    .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
                    .armature = <span class="tok-num">0.002</span>,
                    .damping = <span class="tok-num">0.02</span>,
                }},
                .geoms = &amp;.{.{
                    .shape = .{ .capsule = .{ .half_height = Arm.lower, .radius = <span class="tok-num">0.035</span> } },
                    .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -Arm.lower, <span class="tok-num">0</span>),
                }},
                .sites = &amp;.{.{ .name = <span class="tok-str">"tip"</span>, .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * Arm.lower, <span class="tok-num">0</span>) }},
            },
        },
        .actuators = servos,
        .options = .{ .timestep = <span class="tok-num">1.0</span> / <span class="tok-num">240.0</span> },
    };
}

<span class="tok-kw">const</span> Arm = <span class="tok-kw">struct</span> {
    <span class="tok-kw">const</span> upper: f32 = <span class="tok-num">0.26</span>;
    <span class="tok-kw">const</span> lower: f32 = <span class="tok-num">0.22</span>;
    <span class="tok-kw">const</span> reach: f32 = <span class="tok-num">2.0</span> * upper + <span class="tok-num">2.0</span> * lower;
    <span class="tok-kw">const</span> tip_local: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * lower, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> tip_body: u32 = <span class="tok-num">2</span>;

    <span class="tok-kw">const</span> Free = rbt.<span class="tok-fn">Spec</span>(<span class="tok-fn">ArmSpec</span>(false));
    <span class="tok-kw">const</span> Servo = rbt.<span class="tok-fn">Spec</span>(<span class="tok-fn">ArmSpec</span>(true));

    <span class="tok-kw">fn</span> <span class="tok-fn">make</span>(<span class="tok-kw">comptime</span> M: type, gpa: Allocator) anyerror!Live {
        <span class="tok-kw">var</span> live: Live = .{
            .model = <span class="tok-kw">try</span> M.<span class="tok-fn">build</span>(gpa),
            .data = undefined,
            .jac_p = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, M.nv),
            .jac_r = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, M.nv),
            .elapsed = <span class="tok-num">0</span>,
        };
        live.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;live.model);
        live.data.pos[<span class="tok-num">0</span>] = <span class="tok-num">0.6</span>;
        live.data.pos[<span class="tok-num">1</span>] = -<span class="tok-num">1.0</span>;
        <span class="tok-kw">return</span> live;
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">buildFree</span>(gpa: Allocator) anyerror!Live {
        <span class="tok-kw">return</span> <span class="tok-fn">make</span>(Free, gpa);
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">buildServo</span>(gpa: Allocator) anyerror!Live {
        <span class="tok-kw">return</span> <span class="tok-fn">make</span>(Servo, gpa);
    }
};

<span class="tok-comment">/// A two-link arm whose joints have travel LIMITS, so the soft constraint solver is what</span>
<span class="tok-comment">/// stops it rather than the geometry running out.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The ranges deliberately stop short of the arm's gravity equilibrium, so gravity presses</span>
<span class="tok-comment">/// steadily into a limit instead of the arm settling somewhere the constraint never</span>
<span class="tok-comment">/// engages. `soft` widens the impedance ramp and lengthens the time constant, which is</span>
<span class="tok-comment">/// visible as the arm sinking further past its stop and easing into it rather than</span>
<span class="tok-comment">/// catching - the same model, one parameter apart.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">LimitedArm</span>(<span class="tok-kw">comptime</span> soft: bool) type {
    <span class="tok-kw">return</span> <span class="tok-kw">struct</span> {
        <span class="tok-kw">const</span> softness: rbt.Softness = <span class="tok-kw">if</span> (soft)
            .{ .time_const_s = <span class="tok-num">0.15</span>, .damp_ratio = <span class="tok-num">1.0</span> }
        <span class="tok-kw">else</span>
            .{ .time_const_s = <span class="tok-num">0.02</span>, .damp_ratio = <span class="tok-num">1.0</span> };
        <span class="tok-kw">const</span> impedance: rbt.Impedance = <span class="tok-kw">if</span> (soft)
            .{ .min = <span class="tok-num">0.5</span>, .max = <span class="tok-num">0.8</span>, .width = <span class="tok-num">0.25</span>, .midpoint = <span class="tok-num">0.5</span>, .power = <span class="tok-num">2</span> }
        <span class="tok-kw">else</span>
            .{};

        <span class="tok-kw">const</span> Model = rbt.<span class="tok-fn">Spec</span>(.{
            .bodies = &amp;.{
                .{
                    .name = <span class="tok-str">"upper"</span>,
                    .joints = &amp;.{.{
                        .name = <span class="tok-str">"shoulder"</span>,
                        .kind = .hinge,
                        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
                        .armature = <span class="tok-num">0.002</span>,
                        .damping = <span class="tok-num">0.05</span>,
                        .range = .{ <span class="tok-num">0.5</span>, <span class="tok-num">2.3</span> },
                        .limit_softness = softness,
                        .limit_impedance = impedance,
                    }},
                    .geoms = &amp;.{.{
                        .shape = .{ .capsule = .{ .half_height = Arm.upper, .radius = <span class="tok-num">0.045</span> } },
                        .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -Arm.upper, <span class="tok-num">0</span>),
                    }},
                },
                .{
                    .name = <span class="tok-str">"lower"</span>,
                    .parent = <span class="tok-str">"upper"</span>,
                    .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * Arm.upper, <span class="tok-num">0</span>),
                    .joints = &amp;.{.{
                        .name = <span class="tok-str">"elbow"</span>,
                        .kind = .hinge,
                        .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
                        .armature = <span class="tok-num">0.002</span>,
                        .damping = <span class="tok-num">0.05</span>,
                        .range = .{ -<span class="tok-num">2.2</span>, -<span class="tok-num">0.4</span> },
                        .limit_softness = softness,
                        .limit_impedance = impedance,
                    }},
                    .geoms = &amp;.{.{
                        .shape = .{ .capsule = .{ .half_height = Arm.lower, .radius = <span class="tok-num">0.035</span> } },
                        .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -Arm.lower, <span class="tok-num">0</span>),
                    }},
                    .sites = &amp;.{.{ .name = <span class="tok-str">"tip"</span>, .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * Arm.lower, <span class="tok-num">0</span>) }},
                },
            },
            .options = .{ .timestep = <span class="tok-num">1.0</span> / <span class="tok-num">240.0</span> },
        });

        <span class="tok-kw">fn</span> <span class="tok-fn">build</span>(gpa: Allocator) anyerror!Live {
            <span class="tok-kw">var</span> live: Live = .{
                .model = <span class="tok-kw">try</span> Model.<span class="tok-fn">build</span>(gpa),
                .data = undefined,
                .jac_p = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, Model.nv),
                .jac_r = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, Model.nv),
                .elapsed = <span class="tok-num">0</span>,
            };
            live.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;live.model);
            live.data.pos[<span class="tok-num">0</span>] = <span class="tok-num">2.0</span>;
            live.data.pos[<span class="tok-num">1</span>] = -<span class="tok-num">1.6</span>;
            <span class="tok-kw">return</span> live;
        }
    };
}

<span class="tok-kw">const</span> LimitStiff = <span class="tok-fn">LimitedArm</span>(false);
<span class="tok-kw">const</span> LimitSoft = <span class="tok-fn">LimitedArm</span>(true);

<span class="tok-comment">/// A pendulum wearing an inertial measurement unit at its tip.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The instrument is the point of the scene. An accelerometer does not measure coordinate</span>
<span class="tok-comment">/// acceleration - it measures PROPER acceleration, the force per unit mass its case applies</span>
<span class="tok-comment">/// to the proof mass. So one at rest reads 9.81 upward and one in free fall reads zero,</span>
<span class="tok-comment">/// which is exactly backwards from the intuition most people start with.</span>
<span class="tok-kw">const</span> Imu = <span class="tok-kw">struct</span> {
    <span class="tok-kw">const</span> half: f32 = <span class="tok-num">0.3</span>;
    <span class="tok-kw">const</span> Model = rbt.<span class="tok-fn">Spec</span>(.{
        .bodies = &amp;.{.{
            .name = <span class="tok-str">"link"</span>,
            .joints = &amp;.{.{
                .name = <span class="tok-str">"j"</span>,
                .kind = .hinge,
                .axis = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
                .armature = <span class="tok-num">0.002</span>,
                .damping = <span class="tok-num">0.01</span>,
            }},
            .geoms = &amp;.{.{
                .shape = .{ .capsule = .{ .half_height = half, .radius = <span class="tok-num">0.04</span> } },
                .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -half, <span class="tok-num">0</span>),
            }},
            .sites = &amp;.{.{ .name = <span class="tok-str">"imu"</span>, .pos = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * half, <span class="tok-num">0</span>) }},
        }},
        .sensors = &amp;.{
            .{ .name = <span class="tok-str">"acc"</span>, .kind = .accelerometer, .target = <span class="tok-str">"imu"</span> },
            .{ .name = <span class="tok-str">"gyro"</span>, .kind = .gyro, .target = <span class="tok-str">"imu"</span> },
            .{ .name = <span class="tok-str">"vel"</span>, .kind = .velocimeter, .target = <span class="tok-str">"imu"</span> },
        },
        .options = .{ .timestep = <span class="tok-num">1.0</span> / <span class="tok-num">240.0</span> },
    });

    <span class="tok-kw">const</span> tip_local: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * half, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> reach: f32 = <span class="tok-num">2.0</span> * half;

    <span class="tok-kw">fn</span> <span class="tok-fn">build</span>(gpa: Allocator) anyerror!Live {
        <span class="tok-kw">var</span> live: Live = .{
            .model = <span class="tok-kw">try</span> Model.<span class="tok-fn">build</span>(gpa),
            .data = undefined,
            .jac_p = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, Model.nv),
            .jac_r = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, Model.nv),
            .elapsed = <span class="tok-num">0</span>,
        };
        live.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;live.model);
        live.data.pos[<span class="tok-num">0</span>] = <span class="tok-num">2.4</span>; <span class="tok-comment">// well up, so it swings hard through the bottom</span>
        <span class="tok-kw">return</span> live;
    }

    <span class="tok-comment">/// The instrument's own reading, in its own frame - which is what makes it an</span>
    <span class="tok-comment">/// instrument rather than a derived quantity.</span>
    <span class="tok-kw">fn</span> <span class="tok-fn">readout</span>(live: *<span class="tok-kw">const</span> Live, buf: []u8) []<span class="tok-kw">const</span> u8 {
        <span class="tok-kw">const</span> sensor: []<span class="tok-kw">const</span> f32 = live.data.sensor_data;
        <span class="tok-kw">const</span> magnitude: f32 = <span class="tok-builtin">@sqrt</span>(sensor[<span class="tok-num">0</span>] * sensor[<span class="tok-num">0</span>] + sensor[<span class="tok-num">1</span>] * sensor[<span class="tok-num">1</span>] + sensor[<span class="tok-num">2</span>] * sensor[<span class="tok-num">2</span>]);
        <span class="tok-kw">return</span> <span class="tok-fn">bufPrint</span>(
            buf,
            <span class="tok-str">"accel |a| {d:.2} m/s2   gyro {d:.2} rad/s   speed {d:.2} m/s"</span>,
            .{ magnitude, sensor[<span class="tok-num">5</span>], <span class="tok-builtin">@abs</span>(sensor[<span class="tok-num">7</span>]) },
        ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    }
};

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Control hooks.</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-comment">/// Free fall: nothing to control. Present so the table reads uniformly.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">noControl</span>(_: *Live, _: Input) void {}

<span class="tok-comment">/// No controller, but dragging pushes the tip - so you can drive the arm into its limits</span>
<span class="tok-comment">/// and feel the constraint push back rather than watching it settle.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">dragOnly</span>(live: *Live, in: Input) void {
    <span class="tok-kw">if</span> (!in.pointing) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;live.model;
    <span class="tok-kw">const</span> d: *rbt.Data = &amp;live.data;
    <span class="tok-kw">const</span> tip: Vec = d.site_xpos[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> pull: Vec = (<span class="tok-fn">vec</span>(in.target[<span class="tok-num">0</span>], in.target[<span class="tok-num">1</span>], <span class="tok-num">0</span>) - tip) * <span class="tok-fn">splat</span>(<span class="tok-num">25.0</span>);
    rbt.<span class="tok-fn">applyForceAtPoint</span>(m, d, Arm.tip_body, tip, pull, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), live.jac_p, live.jac_r, d.applied_force);
}

<span class="tok-comment">/// Cancel gravity exactly. `bias_force` IS the force needed to hold still, so applying it</span>
<span class="tok-comment">/// leaves the arm weightless - it stays wherever you leave it, in any pose.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// This is the cheapest genuinely useful thing an engine like this does, and it needs no</span>
<span class="tok-comment">/// tuning, no gains and no target: it is inverse dynamics evaluated at zero acceleration.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">gravityCompensation</span>(live: *Live, in: Input) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;live.model;
    <span class="tok-kw">const</span> d: *rbt.Data = &amp;live.data;
    <span class="tok-builtin">@memcpy</span>(d.applied_force, d.bias_force);
    <span class="tok-kw">if</span> (!in.pointing) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-comment">// Drag applies a real force AT THE TIP, mapped into joint torques by the Jacobian</span>
    <span class="tok-comment">// transpose. With gravity cancelled and almost no damping the arm keeps whatever motion</span>
    <span class="tok-comment">// you give it, which is what "weightless" should look and feel like.</span>
    <span class="tok-kw">const</span> tip: Vec = d.site_xpos[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> pull: Vec = (<span class="tok-fn">vec</span>(in.target[<span class="tok-num">0</span>], in.target[<span class="tok-num">1</span>], <span class="tok-num">0</span>) - tip) * <span class="tok-fn">splat</span>(<span class="tok-num">12.0</span>);
    rbt.<span class="tok-fn">applyForceAtPoint</span>(m, d, Arm.tip_body, tip, pull, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), live.jac_p, live.jac_r, d.applied_force);
}

<span class="tok-comment">/// Jacobian-transpose reach: pull the tip toward the target.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The whole algorithm is `tau = J^T*(target - tip)`. It works because the transpose converts</span>
<span class="tok-comment">/// a task-space pull into the joint torques that produce it - no matrix inverse, no</span>
<span class="tok-comment">/// iteration, and it degrades gracefully at singularities instead of blowing up the way an</span>
<span class="tok-comment">/// inverse-Jacobian method does.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">reachToTarget</span>(live: *Live, in: Input) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;live.model;
    <span class="tok-kw">const</span> d: *rbt.Data = &amp;live.data;
    <span class="tok-comment">// Gravity compensation first, so the arm is weightless and the reach is the only force</span>
    <span class="tok-comment">// acting. Without it you would be watching a tug-of-war rather than a controller.</span>
    <span class="tok-builtin">@memcpy</span>(d.applied_force, d.bias_force);
    <span class="tok-kw">if</span> (!in.pointing) {
        <span class="tok-kw">return</span>;
    }

    <span class="tok-kw">const</span> tip: Vec = d.site_xpos[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> target: Vec = <span class="tok-fn">vec</span>(in.target[<span class="tok-num">0</span>], in.target[<span class="tok-num">1</span>], <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> err: Vec = target - tip;
    <span class="tok-kw">const</span> gain: f32 = <span class="tok-num">40.0</span>;

    rbt.<span class="tok-fn">jacSite</span>(m, d, <span class="tok-builtin">@as</span>(u32, <span class="tok-num">0</span>), live.jac_p, null);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.nv) |i| {
        d.applied_force[i] += gain * <span class="tok-fn">dot3</span>(live.jac_p[i], err);
        <span class="tok-comment">// A little joint damping, or the arm rings: the transpose controller has no notion</span>
        <span class="tok-comment">// of velocity and will happily oscillate forever around its target.</span>
        d.applied_force[i] -= <span class="tok-num">1.2</span> * d.vel[i];
    }
}

<span class="tok-comment">/// Drive both servos with a slow sweep, so the position actuators are visibly commanded</span>
<span class="tok-comment">/// rather than merely holding.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">servoSweep</span>(live: *Live, in: Input) void {
    <span class="tok-kw">const</span> s: f32 = <span class="tok-builtin">@sin</span>(in.elapsed * <span class="tok-num">0.9</span>);
    <span class="tok-kw">const</span> c: f32 = <span class="tok-builtin">@cos</span>(in.elapsed * <span class="tok-num">0.6</span>);
    live.data.ctrl[<span class="tok-num">0</span>] = <span class="tok-num">0.9</span> * s;
    live.data.ctrl[<span class="tok-num">1</span>] = -<span class="tok-num">1.1</span> * c;
}

<span class="tok-comment">/// Hold a fixed pose against gravity using ONLY the servos - no gravity compensation. The</span>
<span class="tok-comment">/// steady-state droop is the point: a finite-gain servo settles where its restoring torque</span>
<span class="tok-comment">/// balances the load, and that error is a real property of proportional control.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">servoHold</span>(live: *Live, _: Input) void {
    live.data.ctrl[<span class="tok-num">0</span>] = <span class="tok-num">1.2</span>;
    live.data.ctrl[<span class="tok-num">1</span>] = -<span class="tok-num">0.8</span>;
}
