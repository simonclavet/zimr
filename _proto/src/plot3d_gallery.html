<style>

.g-item{

<span class="tok-comment">//! A tabbed gallery of zimr's 3D plotting (the ImPlot3D port), reproducing the</span>
<span class="tok-comment">//! plots from ImPlot3D's README: a line + scatter pair (f(x)/g(x)), a warm</span>
<span class="tok-comment">//! "wave surface", a correlated scatter cloud (Data 1 / Data 2), a wireframe</span>
<span class="tok-comment">//! sphere, a solid mesh, and the filled-vs-open marker matrix with rotated</span>
<span class="tok-comment">//! text. It mirrors plot_demo's tabbed shell, but each tab drives</span>
<span class="tok-comment">//! `z.plot3d` (CPU projection + painter's-algorithm depth sort over ui.zig)</span>
<span class="tok-comment">//! instead of the 2D plot_ui.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Note: ImPlot3D's README renders a rubber-duck OBJ for its mesh example. That</span>
<span class="tok-comment">//! asset is not bundled here, so the "Mesh" tab generates a torus to show the</span>
<span class="tok-comment">//! same thing the duck does - an arbitrary solid triangle mesh, shaded.</span>

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// File-scope binds (lint: no qualified zm.* in bodies).</span>
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> pi = zm.pi;

<span class="tok-kw">const</span> screen_w: i32 = <span class="tok-num">980</span>;

<span class="tok-comment">// ---- data sizes ----------------------------------------------------------</span>
<span class="tok-kw">const</span> spring_n: usize = <span class="tok-num">480</span>; <span class="tok-comment">// f(x): a coiled spring (line)</span>
<span class="tok-kw">const</span> gx_n: usize = <span class="tok-num">28</span>; <span class="tok-comment">// g(x): rising parabola (scatter)</span>
<span class="tok-kw">const</span> grid_n: usize = <span class="tok-num">40</span>; <span class="tok-comment">// wave surface is grid_n x grid_n vertices</span>
<span class="tok-kw">const</span> surf_n: usize = grid_n * grid_n;
<span class="tok-kw">const</span> cloud1_n: usize = <span class="tok-num">220</span>; <span class="tok-comment">// Data 1 (diagonal cloud)</span>
<span class="tok-kw">const</span> cloud2_n: usize = <span class="tok-num">90</span>; <span class="tok-comment">// Data 2 (cross streak)</span>

<span class="tok-comment">// sphere mesh (wireframe): (stacks+1) x (slices+1) vertices.</span>

<span class="tok-kw">const</span> sph_slices: usize = <span class="tok-num">22</span>;
<span class="tok-kw">const</span> sph_vtx_cap: usize = (sph_stacks + <span class="tok-num">1</span>) * (sph_slices + <span class="tok-num">1</span>);

<span class="tok-kw">const</span> tor_idx_n: usize = tor_rings * tor_sides * <span class="tok-num">6</span>;

<span class="tok-comment">// ---- colors (zm.Color via p3.rgbaF; 0..1 sRGB floats) --------------------</span>
<span class="tok-kw">const</span> blue: Color = p3.<span class="tok-fn">rgbaF</span>(<span class="tok-num">0.30</span>, <span class="tok-num">0.55</span>, <span class="tok-num">0.95</span>, <span class="tok-num">1</span>);

<span class="tok-comment">/// Fill a torus: `rings` major segments, `sides` minor segments. Wraps both</span>
<span class="tok-comment">/// rings of indices so the surface is closed.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">genTorus</span>(
    out_v: []p3.Point3,
    out_i: []u32,
    big_r: f32,
    small_r: f32,
    rings: usize,
    sides: usize,
) void {
    <span class="tok-kw">var</span> vi: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..rings) |ri| {
        <span class="tok-kw">const</span> a: f32 = <span class="tok-num">2.0</span> * pi * <span class="tok-fn">float</span>(ri) / <span class="tok-fn">float</span>(rings);
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..sides) |si| {
            <span class="tok-kw">const</span> b: f32 = <span class="tok-num">2.0</span> * pi * <span class="tok-fn">float</span>(si) / <span class="tok-fn">float</span>(sides);
            <span class="tok-kw">const</span> rim: f32 = big_r + small_r * <span class="tok-builtin">@cos</span>(b);
            out_v[vi] = p3.<span class="tok-fn">point3</span>(rim * <span class="tok-builtin">@cos</span>(a), rim * <span class="tok-builtin">@sin</span>(a), small_r * <span class="tok-builtin">@sin</span>(b));
            vi += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">var</span> ii: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..rings) |ri| {
        <span class="tok-kw">const</span> rn: usize = (ri + <span class="tok-num">1</span>) % rings;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..sides) |si| {
            <span class="tok-kw">const</span> sn: usize = (si + <span class="tok-num">1</span>) % sides;
            <span class="tok-kw">const</span> v00: u32 = <span class="tok-builtin">@intCast</span>(ri * sides + si);
            <span class="tok-kw">const</span> v10: u32 = <span class="tok-builtin">@intCast</span>(rn * sides + si);
            <span class="tok-kw">const</span> v11: u32 = <span class="tok-builtin">@intCast</span>(rn * sides + sn);
            <span class="tok-kw">const</span> v01: u32 = <span class="tok-builtin">@intCast</span>(ri * sides + sn);
            out_i[ii + <span class="tok-num">0</span>] = v00;
            out_i[ii + <span class="tok-num">1</span>] = v10;
            out_i[ii + <span class="tok-num">2</span>] = v11;
            out_i[ii + <span class="tok-num">3</span>] = v00;
            out_i[ii + <span class="tok-num">4</span>] = v11;
            out_i[ii + <span class="tok-num">5</span>] = v01;
            ii += <span class="tok-num">6</span>;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">28</span>);
    s.* = .{
        .font = font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .ctx = p3.<span class="tok-fn">createContext</span>(gpa),
    };

    <span class="tok-comment">// f(x): a horizontal coiled spring (nine turns) along x.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..spring_n) |i| {
        <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(spring_n - <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> ang: f32 = t * <span class="tok-num">9.0</span> * <span class="tok-num">2.0</span> * pi;
        s.spring_x[i] = t;
        s.spring_y[i] = <span class="tok-num">0.30</span> * <span class="tok-builtin">@sin</span>(ang);
        s.spring_z[i] = <span class="tok-num">0.30</span> * <span class="tok-builtin">@cos</span>(ang);
    }
    <span class="tok-comment">// g(x): a rising parabola sampled as markers.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..gx_n) |i| {
        <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(gx_n - <span class="tok-num">1</span>);
        s.gx_x[i] = t;
        s.gx_y[i] = <span class="tok-num">0</span>;
        s.gx_z[i] = t * t;
    }

    <span class="tok-comment">// Wave surface: radial z = cos(r), giving a central peak, a trough ring,</span>
    <span class="tok-comment">// and rising corners (domain chosen so the corners reach the next crest).</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..grid_n) |j| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..grid_n) |i| {
            <span class="tok-kw">const</span> fx: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(grid_n - <span class="tok-num">1</span>);
            <span class="tok-kw">const</span> fy: f32 = <span class="tok-fn">float</span>(j) / <span class="tok-fn">float</span>(grid_n - <span class="tok-num">1</span>);
            <span class="tok-kw">const</span> xv: f32 = -<span class="tok-num">4.6</span> + <span class="tok-num">9.2</span> * fx;
            <span class="tok-kw">const</span> yv: f32 = -<span class="tok-num">4.6</span> + <span class="tok-num">9.2</span> * fy;
            <span class="tok-kw">const</span> r: f32 = <span class="tok-builtin">@sqrt</span>(xv * xv + yv * yv);
            <span class="tok-kw">const</span> idx: usize = j * grid_n + i;
            s.surf_x[idx] = xv;
            s.surf_y[idx] = yv;
            s.surf_z[idx] = <span class="tok-num">0.85</span> * <span class="tok-builtin">@cos</span>(r);
        }
    }

    <span class="tok-kw">var</span> prng: std.Random.DefaultPrng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0x9E3779B97F4A7C15</span>);
    <span class="tok-kw">const</span> rnd: std.Random = prng.<span class="tok-fn">random</span>();
    <span class="tok-comment">// Data 1: a noisy main-diagonal cloud.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..cloud1_n) |i| {
        <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(cloud1_n - <span class="tok-num">1</span>);
        s.c1x[i] = t + rnd.<span class="tok-fn">floatNorm</span>(f32) * <span class="tok-num">0.05</span>;
        s.c1y[i] = t + rnd.<span class="tok-fn">floatNorm</span>(f32) * <span class="tok-num">0.05</span>;
        s.c1z[i] = t + rnd.<span class="tok-fn">floatNorm</span>(f32) * <span class="tok-num">0.05</span>;
    }
    <span class="tok-comment">// Data 2: a tight cluster crossing the diagonal near the centre.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..cloud2_n) |i| {
        <span class="tok-kw">const</span> u: f32 = rnd.<span class="tok-fn">float</span>(f32) * <span class="tok-num">2.0</span> - <span class="tok-num">1.0</span>;
        s.c2x[i] = <span class="tok-num">0.5</span> + u * <span class="tok-num">0.32</span> + rnd.<span class="tok-fn">floatNorm</span>(f32) * <span class="tok-num">0.03</span>;
        s.c2y[i] = <span class="tok-num">0.5</span> - u * <span class="tok-num">0.04</span> + rnd.<span class="tok-fn">floatNorm</span>(f32) * <span class="tok-num">0.05</span>;
        s.c2z[i] = <span class="tok-num">0.5</span> + rnd.<span class="tok-fn">floatNorm</span>(f32) * <span class="tok-num">0.05</span>;
    }

    <span class="tok-comment">// Wireframe sphere mesh.</span>
    <span class="tok-kw">const</span> sc: p3.SphereCounts = p3.<span class="tok-fn">genSphere</span>(<span class="tok-num">1.0</span>, sph_stacks, sph_slices, s.sph_v[<span class="tok-num">0</span>..], s.sph_i[<span class="tok-num">0</span>..]);
    s.sph_vn = sc.vtx;
    s.sph_in = sc.idx;

    <span class="tok-comment">// Solid torus mesh (the duck stand-in).</span>
    <span class="tok-fn">genTorus</span>(s.tor_v[<span class="tok-num">0</span>..], s.tor_i[<span class="tok-num">0</span>..], <span class="tok-num">0.70</span>, <span class="tok-num">0.30</span>, tor_rings, tor_sides);
}

            <span class="tok-kw">const</span> yy: f32 = <span class="tok-num">1.2</span> - <span class="tok-fn">float</span>(i) * <span class="tok-num">0.26</span>;
            <span class="tok-kw">const</span> col: Color = marker_cols[i];

            <span class="tok-kw">const</span> xl: [<span class="tok-num">2</span>]f32 = .{ -<span class="tok-num">1.4</span>, -<span class="tok-num">0.8</span> };
            <span class="tok-kw">const</span> xr: [<span class="tok-num">2</span>]f32 = .{ <span class="tok-num">0.8</span>, <span class="tok-num">1.4</span> };
