<h1>robot_contact</h1>
<figure class="code src-file" data-path="examples/robot_contact/robot_contact.zig" data-lines="474"><figcaption><span>examples/robot_contact/robot_contact.zig</span><span>474 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! robot_contact - a robot arm that touches the world.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The scene phase 7 was written for, and the first one where both engines have to agree</span>
<span class="tok-comment">//! about something. An actuated two-link arm sweeps across a table; a crate sits on the</span>
<span class="tok-comment">//! table waiting to be hit.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- WHAT IS ACTUALLY HAPPENING, WHICH IS TWO SIMULATIONS AT ONCE --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! robot.zig owns the arm. It has no collision detector and never will: contacts arrive as</span>
<span class="tok-comment">//! an INPUT, exactly the way controls do.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! zimrphysics owns the table and the crate, and also holds a KINEMATIC PROXY for each of</span>
<span class="tok-comment">//! the arm's geoms - bodies it steers to wherever the arm's own kinematics put them. That</span>
<span class="tok-comment">//! is what lets the crate see the arm at all: a body outside the broad phase does not exist</span>
<span class="tok-comment">//! as far as the world's solver is concerned.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Each step: steer the proxies, step the world, harvest the contacts its listener recorded,</span>
<span class="tok-comment">//! hand them to the arm as `robot.Contact` values, step the arm.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- THE APPROXIMATION, IN PLAIN SIGHT --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The two solvers do not negotiate. zimrphysics resolves crate-against-arm treating the arm</span>
<span class="tok-comment">//! as immovable; robot.zig resolves the same contact treating the crate as immovable. Both</span>
<span class="tok-comment">//! feel it, neither knows the other's answer. That is right when the arm is much heavier</span>
<span class="tok-comment">//! than what it touches - a real arm bolted to a bench - and it is why the crate here is</span>
<span class="tok-comment">//! light. section 4h of the plan works through what it costs and what the fix would be; the short</span>
<span class="tok-comment">//! version is that the load the arm feels depends on the ratio of two contact stiffnesses,</span>
<span class="tok-comment">//! which is a coupling with no physical meaning.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Everything is locked to the XY plane so the whole thing can be drawn honestly in 2D.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

            .kind = .{ .position = .{ .kp = <span class="tok-num">60</span>, .kv = <span class="tok-num">6</span> } },

        .{
            .name = <span class="tok-str">"elbow_servo"</span>,
            .on = .{ .joint = .{ .name = <span class="tok-str">"elbow"</span> } },
            .kind = .{ .position = .{ .kp = <span class="tok-num">30</span>, .kv = <span class="tok-num">3</span> } },
            .ctrl_range = .{ -pi, pi },
        },
    },
    .options = .{ .timestep = timestep, .max_contacts = <span class="tok-num">24</span> },
});

<span class="tok-kw">const</span> bg: Color = .{ .r = <span class="tok-num">31</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">14</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> panel: Color = .{ .r = <span class="tok-num">51</span>, .g = <span class="tok-num">34</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> arm_col: Color = .{ .r = <span class="tok-num">79</span>, .g = <span class="tok-num">179</span>, .b = <span class="tok-num">165</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> crate_col: Color = .{ .r = <span class="tok-num">211</span>, .g = <span class="tok-num">95</span>, .b = <span class="tok-num">51</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> table_col: Color = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">92</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> text_col: Color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">230</span>, .b = <span class="tok-num">210</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> dim_col: Color = .{ .r = <span class="tok-num">168</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">132</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> hit_col: Color = .{ .r = <span class="tok-num">232</span>, .g = <span class="tok-num">196</span>, .b = <span class="tok-num">92</span>, .a = <span class="tok-num">255</span> };

<span class="tok-comment">/// Scale text and chrome with the viewport - a standalone renders at device resolution, so</span>
<span class="tok-comment">/// fixed pixel sizes are unreadable on a phone. See the note in `robot_sidebyside`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">uiScale</span>(w: f32, h: f32) f32 {
    <span class="tok-kw">return</span> <span class="tok-builtin">@max</span>(<span class="tok-num">1.0</span>, <span class="tok-builtin">@min</span>(w, h) / <span class="tok-num">450.0</span>);
}

<span class="tok-comment">/// Closed-form inverse kinematics for this two-link planar arm.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * WHY THIS EXISTS, and it is the fix for a scene that did not work. The first version</span>
<span class="tok-comment">/// picked the sweep's joint angles BY GUESSING - interpolate the shoulder from 1.9 to 0.4,</span>
<span class="tok-comment">/// the elbow from -1.2 to -0.7, and hope the hand goes somewhere useful. It did not: the</span>
<span class="tok-comment">/// arm straightened, drove its own tip into the table, and spent the whole sweep fighting a</span>
<span class="tok-comment">/// contact it should never have made. It never reached the crate at all.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The lesson generalises past this demo. **Joint angles are the wrong space to author a</span>
<span class="tok-comment">/// motion in.** What the task is about is where the HAND goes; the angles are whatever</span>
<span class="tok-comment">/// achieves that, and a human cannot reliably guess them for even two links. So the path is</span>
<span class="tok-comment">/// specified in Cartesian coordinates - sweep the tip along a horizontal line at crate</span>
<span class="tok-comment">/// height - and the angles are solved for.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// That is also what a real robot does: a planner works in task space, inverse kinematics</span>
<span class="tok-comment">/// turns the path into joint targets, and the servos chase those. Doing it that way here</span>
<span class="tok-comment">/// keeps the scene a demonstration of position servos rather than becoming an animation.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- THE GEOMETRY --</span>
<span class="tok-comment">/// At `q = 0` a link points along -Y, so rotating by `q` about +Z gives the direction</span>
<span class="tok-comment">/// `(sin q, -cos q)` - which is the unit vector at angle `q - pi/2` in the usual convention.</span>
<span class="tok-comment">/// Writing `a_1 = q_1 - pi/2`, the standard two-link solution applies unchanged:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///     cos q_2 = (r^2 - L_1^2 - L_2^2) / (2 L_1 L_2)</span>
<span class="tok-comment">///     a_1     = atan2(y, x) - atan2(L_2 sin q_2, L_1 + L_2 cos q_2)</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// and `q_1 = a_1 + pi/2`. Two solutions exist - elbow up and elbow down - and the sign of</span>
<span class="tok-comment">/// `q_2` picks between them; this scene wants elbow-up so the arm reaches over the crate</span>
<span class="tok-comment">/// rather than under the table.</span>
<span class="tok-kw">const</span> Ik = <span class="tok-kw">struct</span> {
    <span class="tok-kw">const</span> l1: f32 = <span class="tok-num">2.0</span> * upper_half;
    <span class="tok-kw">const</span> l2: f32 = <span class="tok-num">2.0</span> * lower_half;

    <span class="tok-comment">/// Joint angles that put the tip at `target`, or null if it is out of reach.</span>
    <span class="tok-kw">fn</span> <span class="tok-fn">solve</span>(target: Vec2) ?[<span class="tok-num">2</span>]f32 {
        <span class="tok-kw">const</span> x: f32 = target[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> y: f32 = target[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> r_squared: f32 = x * x + y * y;
        <span class="tok-kw">const</span> r: f32 = <span class="tok-builtin">@sqrt</span>(r_squared);
        <span class="tok-comment">// Unreachable if beyond the arm's span or inside the hole it cannot fold into.</span>
        <span class="tok-kw">if</span> (r &gt; l1 + l2 - <span class="tok-num">1.0e-3</span> <span class="tok-kw">or</span> r &lt; <span class="tok-builtin">@abs</span>(l1 - l2) + <span class="tok-num">1.0e-3</span>) {
            <span class="tok-kw">return</span> null;
        }
        <span class="tok-kw">const</span> cos_q2: f32 = <span class="tok-fn">clamp</span>((r_squared - l1 * l1 - l2 * l2) / (<span class="tok-num">2.0</span> * l1 * l2), -<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
        <span class="tok-comment">// Negative: elbow up, so the arm arches over the crate.</span>
        <span class="tok-kw">const</span> q2: f32 = -<span class="tok-fn">acosRad</span>(cos_q2);
        <span class="tok-kw">const</span> a1: f32 = <span class="tok-fn">atan2Rad</span>(y, x) - <span class="tok-fn">atan2Rad</span>(l2 * <span class="tok-builtin">@sin</span>(q2), l1 + l2 * <span class="tok-builtin">@cos</span>(q2));
        <span class="tok-kw">return</span> .{ a1 + pi * <span class="tok-num">0.5</span>, q2 };
    }
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    font: z.Font,
    model: rbt.Model,
    data: rbt.Data,
    world: zp.World,
    bridge: bridge_mod.Bridge,
    crate: zp.BodyHandle,
    accumulator: f32,
    elapsed: f32,
    <span class="tok-comment">/// Peak contact force the arm has felt, so a brief tap leaves a trace.</span>
    peak_force: f32,
    sweeping: bool,
    <span class="tok-comment">/// Where the tip is being commanded to, drawn so the servos' lag is visible.</span>
    target: Vec2,

    <span class="tok-kw">fn</span> <span class="tok-fn">placeCrate</span>(self: *State) !void {
        <span class="tok-kw">try</span> self.world.<span class="tok-fn">setTransform</span>(
            self.gpa,
            self.crate.<span class="tok-fn">index</span>(),
            <span class="tok-fn">vec</span>(<span class="tok-num">0.33</span>, table_top + crate_half, <span class="tok-num">0</span>),
            quat_identity,
        );
        <span class="tok-kw">try</span> self.world.<span class="tok-fn">setLinearVelocity</span>(self.gpa, self.crate, vec_zero);
        <span class="tok-kw">try</span> self.world.<span class="tok-fn">setAngularVelocity</span>(self.gpa, self.crate, vec_zero);
    }
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{
        .gpa = gpa,
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .model = <span class="tok-kw">try</span> Arm.<span class="tok-fn">build</span>(gpa),
        .data = undefined,
        .world = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, <span class="tok-num">32</span>),
        .bridge = undefined,
        .crate = undefined,
        .accumulator = <span class="tok-num">0</span>,
        .elapsed = <span class="tok-num">0</span>,
        .peak_force = <span class="tok-num">0</span>,
        .sweeping = false,
        .target = <span class="tok-fn">vec2</span>(<span class="tok-num">0.62</span>, table_top + crate_half),
    };
    s.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;s.model);
    s.world.gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">9.81</span>, <span class="tok-num">0</span>);

    <span class="tok-comment">// The table. STATIC, which is what a table is - and which only works because a robot</span>
    <span class="tok-comment">// proxy opts into `report_immovable_contacts`. Without that flag zimrphysics drops any</span>
    <span class="tok-comment">// pair where neither body can respond, so the arm would pass straight through.</span>
    <span class="tok-kw">const</span> table_shape: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">0.6</span>, <span class="tok-num">0.03</span>, <span class="tok-num">0.3</span>), .convex_radius = <span class="tok-num">0.005</span> },
    });
    _ = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{
        .shape = table_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0.25</span>, table_top - <span class="tok-num">0.03</span>, <span class="tok-num">0</span>),
        .motion_type = .static,
    });

    <span class="tok-comment">// The crate. Light, deliberately: the one-way coupling is right when the arm is much</span>
    <span class="tok-comment">// heavier than what it pushes, and wrong when it is not.</span>
    <span class="tok-kw">const</span> crate_shape: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">splat</span>(crate_half), .convex_radius = <span class="tok-num">0.004</span> },
    });
    s.crate = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{
        .shape = crate_shape,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0.33</span>, table_top + crate_half, <span class="tok-num">0</span>),
        .motion_type = .dynamic,
        .density = <span class="tok-num">300</span>,
        <span class="tok-comment">// Locked to the XY plane so the scene can be drawn in 2D without lying about it.</span>
        .allowed_dofs = zp.AllowedDofs.plane_2d,
    });

    <span class="tok-comment">// Start exactly where the sweep begins, so the first frame is not a lunge.</span>
    <span class="tok-kw">const</span> start: [<span class="tok-num">2</span>]f32 = Ik.<span class="tok-fn">solve</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">0.62</span>, table_top + crate_half)) <span class="tok-kw">orelse</span> .{ <span class="tok-num">1.9</span>, -<span class="tok-num">1.2</span> };
    s.data.<span class="tok-fn">setJointPos</span>(&amp;s.model, Arm.Joint.shoulder, start[<span class="tok-num">0</span>]);
    s.data.<span class="tok-fn">setJointPos</span>(&amp;s.model, Arm.Joint.elbow, start[<span class="tok-num">1</span>]);
    rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;s.data);

    <span class="tok-comment">// The bridge must be created AFTER the arm's kinematics have run once, or the proxies</span>
    <span class="tok-comment">// are all born at the origin and the first step sees a huge spurious sweep.</span>
    s.bridge = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, &amp;s.world, &amp;s.model, &amp;s.data, <span class="tok-num">32</span>);
    s.bridge.<span class="tok-fn">listen</span>(&amp;s.world);
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.bridge.<span class="tok-fn">deinit</span>(&amp;s.world);
    s.world.<span class="tok-fn">deinit</span>(gpa);
    s.data.<span class="tok-fn">deinit</span>();
    s.model.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> w: f32 = <span class="tok-fn">float</span>(f.window.screen_width);
    <span class="tok-kw">const</span> h: f32 = <span class="tok-fn">float</span>(f.window.screen_height);
    <span class="tok-kw">const</span> ui: f32 = <span class="tok-fn">uiScale</span>(w, h);

    <span class="tok-comment">// ---- the sweep, as a commanded pose rather than a torque ----</span>
    <span class="tok-comment">// Two position servos and a target that moves: the arm decides its own torques, which</span>
    <span class="tok-comment">// is what makes it a robot rather than an animation.</span>
    <span class="tok-comment">// The tip travels a horizontal line at the crate's mid-height, right to left, passing</span>
    <span class="tok-comment">// straight through where the crate is sitting. Above the table by enough that the arm</span>
    <span class="tok-comment">// never touches it - the only thing it should hit is the crate.</span>
    <span class="tok-kw">const</span> sweep_y: f32 = table_top + crate_half;
    <span class="tok-kw">const</span> sweep_from: f32 = <span class="tok-num">0.62</span>;
    <span class="tok-kw">const</span> sweep_to: f32 = <span class="tok-num">0.10</span>;
    <span class="tok-kw">const</span> progress: f32 = <span class="tok-kw">if</span> (s.sweeping) <span class="tok-builtin">@min</span>(s.elapsed / <span class="tok-num">2.5</span>, <span class="tok-num">1.0</span>) <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
    <span class="tok-kw">const</span> target: Vec2 = <span class="tok-fn">vec2</span>(sweep_from + (sweep_to - sweep_from) * progress, sweep_y);
    s.target = target;
    <span class="tok-kw">if</span> (Ik.<span class="tok-fn">solve</span>(target)) |angles| {
        s.data.ctrl[<span class="tok-num">0</span>] = angles[<span class="tok-num">0</span>];
        s.data.ctrl[<span class="tok-num">1</span>] = angles[<span class="tok-num">1</span>];
    }

    s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
    <span class="tok-kw">while</span> (s.accumulator &gt;= timestep) : (s.accumulator -= timestep) {
        <span class="tok-comment">// * The seam, in four lines and a fixed order.</span>
        s.bridge.<span class="tok-fn">sync</span>(&amp;s.world, &amp;s.model, &amp;s.data) <span class="tok-kw">catch</span> |err| {
            <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"proxy sync failed: {t}"</span>, .{err});
        };
        zp.<span class="tok-fn">step</span>(&amp;s.world, timestep) <span class="tok-kw">catch</span> |err| {
            <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"world step failed: {t}"</span>, .{err});
        };
        s.bridge.<span class="tok-fn">harvest</span>(&amp;s.data);
        rbt.<span class="tok-fn">step</span>(&amp;s.model, &amp;s.data);
        <span class="tok-kw">if</span> (s.sweeping) {
            s.elapsed += timestep;
        }
    }
    rbt.<span class="tok-fn">forward</span>(&amp;s.model, &amp;s.data);

    <span class="tok-kw">var</span> total_force: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.constraint_count) |row| {
        total_force += s.data.constraint_force[row];
    }
    s.peak_force = <span class="tok-builtin">@max</span>(s.peak_force, total_force);

    <span class="tok-comment">// ---- draw ----</span>
    z.<span class="tok-fn">clearViewport</span>(f, bg);
    <span class="tok-kw">const</span> scale: f32 = <span class="tok-builtin">@min</span>(w * <span class="tok-num">0.62</span>, (h - <span class="tok-num">210</span> * ui) * <span class="tok-num">0.62</span>) / <span class="tok-num">0.9</span>;
    <span class="tok-kw">const</span> origin: Vec2 = <span class="tok-fn">vec2</span>(w * <span class="tok-num">0.34</span>, h * <span class="tok-num">0.42</span>);
    <span class="tok-kw">const</span> toScreen = <span class="tok-kw">struct</span> {
        <span class="tok-kw">fn</span> <span class="tok-fn">go</span>(o: Vec2, sc: f32, p: Vec2) Vec2 {
            <span class="tok-kw">return</span> <span class="tok-fn">vec2</span>(o[<span class="tok-num">0</span>] + p[<span class="tok-num">0</span>] * sc, o[<span class="tok-num">1</span>] - p[<span class="tok-num">1</span>] * sc);
        }
    }.go;

    <span class="tok-comment">// Table.</span>
    gl.<span class="tok-fn">line</span>(
        <span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(-<span class="tok-num">0.35</span>, table_top)),
        <span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(<span class="tok-num">0.85</span>, table_top)),
        .{ .color = table_col, .thickness = <span class="tok-num">5</span> * ui },
    );

    <span class="tok-comment">// Crate, drawn from its actual pose so a tumble reads as a tumble.</span>
    {
        <span class="tok-kw">const</span> body: *<span class="tok-kw">const</span> zp.Body = &amp;s.world.bodies.data[s.crate.<span class="tok-fn">index</span>()];
        <span class="tok-kw">const</span> corners = [_]Vec{
            <span class="tok-fn">vec</span>(-crate_half, -crate_half, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(crate_half, -crate_half, <span class="tok-num">0</span>),
            <span class="tok-fn">vec</span>(crate_half, crate_half, <span class="tok-num">0</span>),   <span class="tok-fn">vec</span>(-crate_half, crate_half, <span class="tok-num">0</span>),
        };
        <span class="tok-kw">var</span> previous: Vec = body.com_pos + <span class="tok-fn">rotate</span>(body.rot, corners[<span class="tok-num">3</span>]);
        <span class="tok-kw">for</span> (corners) |corner| {
            <span class="tok-kw">const</span> p: Vec = body.com_pos + <span class="tok-fn">rotate</span>(body.rot, corner);
            gl.<span class="tok-fn">line</span>(
                <span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(previous[<span class="tok-num">0</span>], previous[<span class="tok-num">1</span>])),
                <span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>])),
                .{ .color = crate_col, .thickness = <span class="tok-num">4</span> * ui },
            );
            previous = p;
        }
    }

    <span class="tok-comment">// Arm.</span>
    {
        <span class="tok-kw">const</span> elbow: Vec = s.data.body_xpos[<span class="tok-num">2</span>];
        <span class="tok-kw">const</span> tip: Vec = elbow + <span class="tok-fn">rotate</span>(s.data.body_xrot[<span class="tok-num">2</span>], <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">2.0</span> * lower_half, <span class="tok-num">0</span>));
        gl.<span class="tok-fn">line</span>(
            <span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>)),
            <span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(elbow[<span class="tok-num">0</span>], elbow[<span class="tok-num">1</span>])),
            .{ .color = arm_col, .thickness = <span class="tok-num">10</span> * ui },
        );
        gl.<span class="tok-fn">line</span>(
            <span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(elbow[<span class="tok-num">0</span>], elbow[<span class="tok-num">1</span>])),
            <span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(tip[<span class="tok-num">0</span>], tip[<span class="tok-num">1</span>])),
            .{ .color = arm_col, .thickness = <span class="tok-num">8</span> * ui },
        );
        gl.<span class="tok-fn">circle</span>(<span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>)), <span class="tok-num">7</span> * ui, .{ .color = dim_col });
        gl.<span class="tok-fn">circle</span>(<span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(tip[<span class="tok-num">0</span>], tip[<span class="tok-num">1</span>])), <span class="tok-num">6</span> * ui, .{ .color = arm_col });
    }

    <span class="tok-comment">// Where the tip is COMMANDED to be. The gap between this and the actual tip is the</span>
    <span class="tok-comment">// servo's tracking error - which grows exactly when the arm meets the crate, because a</span>
    <span class="tok-comment">// finite-gain servo trades position for force.</span>
    gl.<span class="tok-fn">circle</span>(
        <span class="tok-fn">toScreen</span>(origin, scale, s.target),
        <span class="tok-num">7</span> * ui,
        .{ .color = dim_col, .outline = <span class="tok-num">2</span> * ui },
    );

    <span class="tok-comment">// Every contact the arm is currently feeling, at the point it acts.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.contact_count) |ci| {
        <span class="tok-kw">const</span> c: rbt.Contact = s.data.contacts[ci];
        <span class="tok-kw">if</span> (c.distance &gt;= <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        gl.<span class="tok-fn">circle</span>(
            <span class="tok-fn">toScreen</span>(origin, scale, <span class="tok-fn">vec2</span>(c.position[<span class="tok-num">0</span>], c.position[<span class="tok-num">1</span>])),
            <span class="tok-num">5</span> * ui,
            .{ .color = hit_col },
        );
    }

    <span class="tok-comment">// ---- readout ----</span>
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">30</span> * ui),
        <span class="tok-str">"an arm that touches the world"</span>,
        .{ .size = <span class="tok-num">20</span> * ui, .color = text_col, .font = &amp;s.font },
    );
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">56</span> * ui),
        <span class="tok-str">"robot.zig owns the arm - zimrphysics owns the table and crate"</span>,
        .{ .size = <span class="tok-num">12</span> * ui, .color = dim_col, .font = &amp;s.font },
    );

    <span class="tok-kw">var</span> buf: [<span class="tok-num">160</span>]u8 = undefined;
    <span class="tok-kw">const</span> line: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf,
        <span class="tok-str">"contacts {d}  rows {d}  solver {d} it  force {d:.1} N  peak {d:.1} N"</span>,
        .{ s.data.contact_count, s.data.constraint_count, s.data.solver_iterations, total_force, s.peak_force },
    ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    <span class="tok-kw">const</span> col: Color = <span class="tok-kw">if</span> (s.data.constraint_count &gt; <span class="tok-num">0</span>) hit_col <span class="tok-kw">else</span> dim_col;
    gl.<span class="tok-fn">text</span>(<span class="tok-fn">vec2</span>(<span class="tok-num">16</span> * ui, <span class="tok-num">80</span> * ui), line, .{ .size = <span class="tok-num">12</span> * ui, .color = col, .font = &amp;s.font });

    <span class="tok-comment">// ---- controls ----</span>
    <span class="tok-kw">const</span> sweep_box: z.Rectangle = .{ .x = <span class="tok-num">16</span> * ui, .y = h - <span class="tok-num">54</span> * ui, .width = <span class="tok-num">150</span> * ui, .height = <span class="tok-num">42</span> * ui };
    <span class="tok-kw">const</span> reset_box: z.Rectangle = .{ .x = <span class="tok-num">180</span> * ui, .y = h - <span class="tok-num">54</span> * ui, .width = <span class="tok-num">150</span> * ui, .height = <span class="tok-num">42</span> * ui };
    gl.<span class="tok-fn">rect</span>(sweep_box, .{ .color = panel });
    gl.<span class="tok-fn">rect</span>(reset_box, .{ .color = panel });
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(sweep_box.x + <span class="tok-num">16</span> * ui, sweep_box.y + <span class="tok-num">28</span> * ui),
        <span class="tok-kw">if</span> (s.sweeping) <span class="tok-str">"sweeping"</span> <span class="tok-kw">else</span> <span class="tok-str">"sweep"</span>,
        .{ .size = <span class="tok-num">14</span> * ui, .color = <span class="tok-kw">if</span> (s.sweeping) hit_col <span class="tok-kw">else</span> text_col, .font = &amp;s.font },
    );
    gl.<span class="tok-fn">text</span>(
        <span class="tok-fn">vec2</span>(reset_box.x + <span class="tok-num">16</span> * ui, reset_box.y + <span class="tok-num">28</span> * ui),
        <span class="tok-str">"reset crate"</span>,
        .{ .size = <span class="tok-num">14</span> * ui, .color = text_col, .font = &amp;s.font },
    );

    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        <span class="tok-kw">const</span> p: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
        <span class="tok-kw">if</span> (<span class="tok-fn">inside</span>(p, sweep_box)) {
            s.sweeping = !s.sweeping;
            <span class="tok-kw">if</span> (s.sweeping) {
                s.elapsed = <span class="tok-num">0</span>;
            }
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (<span class="tok-fn">inside</span>(p, reset_box)) {
            s.<span class="tok-fn">placeCrate</span>() <span class="tok-kw">catch</span> |err| {
                <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"crate reset failed: {t}"</span>, .{err});
            };
            s.peak_force = <span class="tok-num">0</span>;
            s.sweeping = false;
            s.elapsed = <span class="tok-num">0</span>;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">inside</span>(p: Vec2, r: z.Rectangle) bool {
    <span class="tok-kw">return</span> p[<span class="tok-num">0</span>] &gt;= r.x <span class="tok-kw">and</span> p[<span class="tok-num">0</span>] &lt;= r.x + r.width <span class="tok-kw">and</span> p[<span class="tok-num">1</span>] &gt;= r.y <span class="tok-kw">and</span> p[<span class="tok-num">1</span>] &lt;= r.y + r.height;
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - robot contact"</span>,
            .width = <span class="tok-num">760</span>,
            .height = <span class="tok-num">620</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
