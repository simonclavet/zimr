<figure class="code src-file" data-path="examples/srcrec_dstrec/srcrec_dstrec.zig" data-lines="241"><figcaption><span>examples/srcrec_dstrec/srcrec_dstrec.zig</span><span>241 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! srcrec_dstrec - the source-rectangle / destination-rectangle mapping. A 6-frame sprite sheet is</span>
<span class="tok-comment">//! generated procedurally into an Image and uploaded once; drawTextureRec then maps ONE frame's</span>
<span class="tok-comment">//! source sub-rect (normalised UVs frame/6 .. (frame+1)/6) onto a destination rectangle on screen,</span>
<span class="tok-comment">//! scaling it to fit. The sheet is shown small up top with the active frame boxed. Tap to cycle the</span>
<span class="tok-comment">//! source frame; drag the big sprite to move the destination. It rotates about its centre via the</span>
<span class="tok-comment">//! new WgpuTexture drawTextureRotated. From raylib textures_srcrec_dstrec.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> sinRad = zm.sinRad;
<span class="tok-kw">const</span> cosRad = zm.cosRad;
<span class="tok-kw">const</span> tau = zm.tau;
<span class="tok-kw">const</span> distance = zm.distance;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> radFromDeg = zm.radFromDeg;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> frames: usize = <span class="tok-num">6</span>;
<span class="tok-kw">const</span> frame_w: usize = <span class="tok-num">96</span>;
<span class="tok-kw">const</span> frame_h: usize = <span class="tok-num">112</span>;
<span class="tok-kw">const</span> sheet_w: usize = frame_w * frames;
<span class="tok-kw">const</span> sheet_h: usize = frame_h;

<span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    img: z.Image,
    tex: z.WgpuTexture,
    selected: usize = <span class="tok-num">0</span>,
    dst_center: Vec2 = .{ <span class="tok-num">400</span>, <span class="tok-num">260</span> },
    t: f32 = <span class="tok-num">0</span>,
    press: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    dragged: bool = false,
    placed: bool = false,
    gpa: Allocator,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    z.<span class="tok-fn">unloadImage</span>(gpa, s.img);
    s.tex.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">// ---- CPU rasterisers writing straight into the RGBA8 Image buffer ----</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pset</span>(px: [*]Color, x: i32, y: i32, c: Color) void {
    <span class="tok-kw">if</span> (x &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> y &lt; <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> xu: usize = <span class="tok-builtin">@intCast</span>(x);
    <span class="tok-kw">const</span> yu: usize = <span class="tok-builtin">@intCast</span>(y);
    <span class="tok-kw">if</span> (xu &gt;= sheet_w <span class="tok-kw">or</span> yu &gt;= sheet_h) {
        <span class="tok-kw">return</span>;
    }
    px[yu * sheet_w + xu] = c;
}

<span class="tok-kw">fn</span> <span class="tok-fn">fillRect</span>(
    px: [*]Color,
    x0: i32,
    y0: i32,
    w: i32,
    h: i32,
    c: Color,
) void {
    <span class="tok-kw">var</span> yy: i32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (yy &lt; h) : (yy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> xx: i32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (xx &lt; w) : (xx += <span class="tok-num">1</span>) {
            <span class="tok-fn">pset</span>(px, x0 + xx, y0 + yy, c);
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">fillCircle</span>(
    px: [*]Color,
    cx: i32,
    cy: i32,
    r: i32,
    c: Color,
) void {
    <span class="tok-kw">var</span> dy: i32 = -r;
    <span class="tok-kw">while</span> (dy &lt;= r) : (dy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> dx: i32 = -r;
        <span class="tok-kw">while</span> (dx &lt;= r) : (dx += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (dx * dx + dy * dy &lt;= r * r) {
                <span class="tok-fn">pset</span>(px, cx + dx, cy + dy, c);
            }
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">buildSheet</span>(px: [*]Color) void {
    <span class="tok-kw">var</span> fi: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (fi &lt; frames) : (fi += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x0: i32 = <span class="tok-builtin">@intCast</span>(fi * frame_w);
        <span class="tok-kw">const</span> cx: i32 = x0 + <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(frame_w / <span class="tok-num">2</span>));
        <span class="tok-kw">const</span> cy: i32 = <span class="tok-builtin">@intCast</span>(frame_h / <span class="tok-num">2</span>);
        <span class="tok-comment">// a hue tile per frame so frames read distinctly in the sheet</span>
        <span class="tok-fn">fillRect</span>(px, x0, <span class="tok-num">0</span>, <span class="tok-builtin">@intCast</span>(frame_w), <span class="tok-builtin">@intCast</span>(frame_h), z.<span class="tok-fn">colorFromHSV</span>(<span class="tok-fn">float</span>(fi) * <span class="tok-num">60.0</span>, <span class="tok-num">0.45</span>, <span class="tok-num">0.80</span>));
        <span class="tok-comment">// a 6-dot spinner track; the active dot (== fi) is bright + large</span>
        <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (j &lt; frames) : (j += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> ang: f32 = <span class="tok-fn">float</span>(j) / <span class="tok-fn">float</span>(frames) * tau;
            <span class="tok-kw">const</span> offx: i32 = <span class="tok-builtin">@round</span>(<span class="tok-fn">cosRad</span>(ang) * <span class="tok-num">30.0</span>);
            <span class="tok-kw">const</span> offy: i32 = <span class="tok-builtin">@round</span>(<span class="tok-fn">sinRad</span>(ang) * <span class="tok-num">30.0</span>);
            <span class="tok-kw">const</span> ox: i32 = cx + offx;
            <span class="tok-kw">const</span> oy: i32 = cy - offy;
            <span class="tok-kw">if</span> (j == fi) {
                <span class="tok-fn">fillCircle</span>(px, ox, oy, <span class="tok-num">11</span>, white);
            } <span class="tok-kw">else</span> {
                <span class="tok-fn">fillCircle</span>(px, ox, oy, <span class="tok-num">5</span>, .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">90</span> });
            }
        }
        <span class="tok-fn">fillCircle</span>(px, cx, cy, <span class="tok-num">9</span>, .{ .r = <span class="tok-num">30</span>, .g = <span class="tok-num">30</span>, .b = <span class="tok-num">40</span>, .a = <span class="tok-num">255</span> });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">genImageColor</span>(
        gpa,
        <span class="tok-builtin">@intCast</span>(sheet_w),
        <span class="tok-builtin">@intCast</span>(sheet_h),
        .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">0</span> },
    );
    <span class="tok-kw">const</span> px: [*]Color = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(img.data.?));
    <span class="tok-fn">buildSheet</span>(px);
    <span class="tok-kw">const</span> tex: z.WgpuTexture = z.<span class="tok-fn">loadTextureFromImage</span>(f.gl, img);
    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>),
        .img = img,
        .tex = tex,
        .gpa = gpa,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> gl = f.gl;
    s.t += f.time.delta_time;
    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-kw">if</span> (!s.placed) {
        s.dst_center = .{ w * <span class="tok-num">0.5</span>, h * <span class="tok-num">0.56</span> };
        s.placed = true;
    }

    <span class="tok-comment">// --- input: drag moves the destination, tap cycles the source frame ---</span>
    <span class="tok-kw">const</span> m: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        s.press = m;
        s.dragged = false;
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> <span class="tok-fn">distance</span>(m, s.press) &gt; <span class="tok-num">8.0</span>) {
        s.dragged = true;
        s.dst_center = m;
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonReleased</span>(f.input, .left) <span class="tok-kw">and</span> !s.dragged) {
        s.selected = (s.selected + <span class="tok-num">1</span>) % frames;
    }

    <span class="tok-comment">// --- the big selected frame: source sub-rect -&gt; destination rect, rotated about its centre ---</span>
    <span class="tok-kw">const</span> aspect: f32 = <span class="tok-fn">float</span>(frame_w) / <span class="tok-fn">float</span>(frame_h);
    <span class="tok-kw">const</span> dh: f32 = <span class="tok-builtin">@min</span>(w, h) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> dw: f32 = dh * aspect;
    <span class="tok-kw">const</span> rotation_rad: f32 = <span class="tok-fn">radFromDeg</span>(s.t * <span class="tok-num">40.0</span>); <span class="tok-comment">// 40 deg/sec, converted to radians at the UI layer</span>
    <span class="tok-kw">const</span> source: z.Rectangle = .{
        .x = <span class="tok-fn">float</span>(s.selected * frame_w),
        .y = <span class="tok-num">0</span>,
        .width = <span class="tok-fn">float</span>(frame_w),
        .height = <span class="tok-fn">float</span>(frame_h),
    };
    <span class="tok-kw">const</span> dest: z.Rectangle = .{
        .x = s.dst_center[<span class="tok-num">0</span>],
        .y = s.dst_center[<span class="tok-num">1</span>],
        .width = dw,
        .height = dh,
    };

    <span class="tok-comment">// crosshair through the destination centre (the rotation pivot)</span>
    gl.<span class="tok-fn">line</span>(.{ s.dst_center[<span class="tok-num">0</span>], <span class="tok-num">0</span> }, .{ s.dst_center[<span class="tok-num">0</span>], h }, .{ .color = common.palette.ink_dim, .thickness = <span class="tok-num">1.0</span> });
    gl.<span class="tok-fn">line</span>(.{ <span class="tok-num">0</span>, s.dst_center[<span class="tok-num">1</span>] }, .{ w, s.dst_center[<span class="tok-num">1</span>] }, .{ .color = common.palette.ink_dim, .thickness = <span class="tok-num">1.0</span> });

    gl.<span class="tok-fn">texture</span>(dest, s.tex, .{
        .source = source,
        .origin = .{ dw * <span class="tok-num">0.5</span>, dh * <span class="tok-num">0.5</span> },
        .rotation_rad = rotation_rad,
        .tint = white,
    });

    <span class="tok-fn">drawSheetStrip</span>(f, s, w);

    <span class="tok-kw">var</span> buf: [<span class="tok-num">40</span>]u8 = undefined;
    <span class="tok-kw">const</span> label: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf,
        <span class="tok-str">"frame {d}/{d} - tap to cycle, drag to move"</span>,
        .{ s.selected + <span class="tok-num">1</span>, frames },
    ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    common.<span class="tok-fn">caption</span>(gl, s.font, label);
    z.<span class="tok-fn">endDrawing</span>(gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawSheetStrip</span>(f: *z.Frame, s: *State, w: f32) void {
    <span class="tok-kw">const</span> gl = f.gl;
    <span class="tok-kw">const</span> pad: f32 = <span class="tok-num">10.0</span>;
    <span class="tok-kw">const</span> tw: f32 = <span class="tok-builtin">@min</span>(w - <span class="tok-num">2.0</span> * pad, <span class="tok-num">360.0</span>);
    <span class="tok-kw">const</span> th: f32 = tw * <span class="tok-fn">float</span>(sheet_h) / <span class="tok-fn">float</span>(sheet_w);
    <span class="tok-kw">const</span> tx: f32 = (w - tw) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> ty: f32 = pad;
    gl.<span class="tok-fn">texture</span>(.{ .x = tx, .y = ty, .width = tw, .height = th }, s.tex, .{ .tint = white });
    gl.<span class="tok-fn">rect</span>(.{ .x = tx, .y = ty, .width = tw, .height = th }, .{ .color = common.palette.ink_dim, .outline = <span class="tok-num">1.0</span> });
    <span class="tok-comment">// box the active frame</span>
    <span class="tok-kw">const</span> fw: f32 = tw / <span class="tok-fn">float</span>(frames);
    gl.<span class="tok-fn">rect</span>(
        .{ .x = tx + <span class="tok-fn">float</span>(s.selected) * fw, .y = ty, .width = fw, .height = th },
        .{ .color = common.palette.accent, .outline = <span class="tok-num">1.0</span> },
    );
}

<span class="tok-comment">/// Descriptor-only: the runner (standalone) or a launcher drives this.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - srcrec dstrec"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
