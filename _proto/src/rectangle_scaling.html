<h1>rectangle_scaling</h1>
<figure class="code src-file" data-path="examples/rectangle_scaling/rectangle_scaling.zig" data-lines="103"><figcaption><span>examples/rectangle_scaling/rectangle_scaling.zig</span><span>103 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! rectangle_scaling - drag the bottom-right handle to live-resize a rectangle. Three</span>
<span class="tok-comment">//! states: idle, ready (pointer over the handle -&gt; outline + corner marker appear), and</span>
<span class="tok-comment">//! dragging (the corner tracks the pointer until release). Ported from raylib</span>
<span class="tok-comment">//! shapes_rectangle_scaling; touch-draggable on mobile. Themed with the shared scaffold.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> handle_size: f32 = <span class="tok-num">16</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    rec: z.Rectangle = .{ .x = <span class="tok-num">120</span>, .y = <span class="tok-num">120</span>, .width = <span class="tok-num">240</span>, .height = <span class="tok-num">120</span> },
    ready: bool = false,
    dragging: bool = false,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{ .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>) };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> mouse: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);

    <span class="tok-kw">const</span> handle: z.Rectangle = .{
        .x = s.rec.x + s.rec.width - handle_size,
        .y = s.rec.y + s.rec.height - handle_size,
        .width = handle_size,
        .height = handle_size,
    };
    <span class="tok-kw">if</span> (z.<span class="tok-fn">checkCollisionPointRec</span>(mouse, handle)) {
        s.ready = true;
        <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
            s.dragging = true;
        }
    } <span class="tok-kw">else</span> {
        s.ready = false;
    }
    <span class="tok-kw">if</span> (s.dragging) {
        s.ready = true;
        <span class="tok-comment">// NOT `clamp`: `@max(lo, @min(hi, v))` applies the UPPER bound first, and `clamp` applies</span>
        <span class="tok-comment">// the lower first. They agree only while lo &lt;= hi, and here they need not - drag the rect</span>
        <span class="tok-comment">// near the right edge and `w - s.rec.x` falls BELOW `handle_size`. The current form then</span>
        <span class="tok-comment">// yields `handle_size`, keeping the rect grabbable; `clamp` would yield the smaller upper</span>
        <span class="tok-comment">// bound and the handle would vanish.</span>
        <span class="tok-comment">// lint:off clamp-pattern: bounds can invert - see above</span>
        s.rec.width = <span class="tok-builtin">@max</span>(handle_size, <span class="tok-builtin">@min</span>(mouse[<span class="tok-num">0</span>] - s.rec.x, w - s.rec.x));
        <span class="tok-comment">// lint:off clamp-pattern: same as the width above</span>
        s.rec.height = <span class="tok-builtin">@max</span>(handle_size, <span class="tok-builtin">@min</span>(mouse[<span class="tok-num">1</span>] - s.rec.y, h - s.rec.y));
        <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonReleased</span>(f.input, .left)) {
            s.dragging = false;
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);
    common.<span class="tok-fn">backdrop</span>(f.gl, w, h);

    f.gl.<span class="tok-fn">rect</span>(s.rec, .{ .color = common.palette.accent.<span class="tok-fn">fade</span>(<span class="tok-num">0.45</span>) });
    <span class="tok-kw">if</span> (s.ready) {
        f.gl.<span class="tok-fn">rect</span>(
            .{ .x = s.rec.x, .y = s.rec.y, .width = s.rec.width, .height = s.rec.height },
            .{ .color = common.palette.accent2, .outline = <span class="tok-num">1.0</span> },
        );
        <span class="tok-kw">const</span> bx: f32 = s.rec.x + s.rec.width;
        <span class="tok-kw">const</span> by: f32 = s.rec.y + s.rec.height;
        f.gl.<span class="tok-fn">triangle</span>(
            .{ bx - handle_size, by },
            .{ bx, by },
            .{ bx, by - handle_size },
            .{ .color = common.palette.accent2 },
        );
    }

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"rectangle scaling: drag the bottom-right corner"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// Descriptor-only: the runner (standalone) or a launcher drives this.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - rectangle scaling"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
