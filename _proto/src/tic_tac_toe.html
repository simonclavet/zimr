<h1>tic_tac_toe</h1>
<figure class="code src-file" data-path="examples/tic_tac_toe/tic_tac_toe.zig" data-lines="270"><figcaption><span>examples/tic_tac_toe/tic_tac_toe.zig</span><span>270 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! tic_tac_toe - two players share the screen and tap a cell to claim it. X is drawn</span>
<span class="tok-comment">//! as two crossing bars, O as a ring (a filled disc with a background-coloured disc</span>
<span class="tok-comment">//! punched out of it), the board as four bars. Nothing here but 2D shapes: no</span>
<span class="tok-comment">//! textures, no font work beyond the caption, no AI. Tap anywhere once somebody has</span>
<span class="tok-comment">//! won (or the board fills) to start a new game.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">/// What one square holds. An enum makes the three states the only three states --</span>
<span class="tok-comment">/// you cannot store a 4 by accident -- and each carries its own draw colour.</span>
<span class="tok-kw">const</span> Cell = <span class="tok-kw">enum</span> {
    empty,
    x,
    o,

    <span class="tok-kw">fn</span> <span class="tok-fn">color</span>(self: Cell) Color {
        <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (self) {
            .empty =&gt; bg_col,
            .x =&gt; x_col,
            .o =&gt; o_col,
        };
    }

    <span class="tok-comment">/// The other player. `.empty` has no opponent, so this is only called on x/o.</span>
    <span class="tok-kw">fn</span> <span class="tok-fn">other</span>(self: Cell) Cell {
        <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (self) {
            .x =&gt; .o,
            .o =&gt; .x,
            .empty =&gt; .empty,
        };
    }
};

<span class="tok-comment">/// Board geometry for the CURRENT window: a square centred in whatever space we</span>
<span class="tok-comment">/// get, sized off the shorter side so it fits portrait phones and wide desktops</span>
<span class="tok-comment">/// alike. Recomputed every frame -- nothing about the layout is baked in.</span>
<span class="tok-kw">const</span> Layout = <span class="tok-kw">struct</span> {
    x: f32,
    y: f32,
    cell: f32,

    <span class="tok-kw">fn</span> <span class="tok-fn">of</span>(f: *z.Frame) Layout {
        <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
        <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
        <span class="tok-kw">const</span> side: f32 = <span class="tok-builtin">@min</span>(w, h) * <span class="tok-num">0.78</span>;
        <span class="tok-kw">return</span> .{
            .x = (w - side) / <span class="tok-num">2.0</span>,
            .y = (h - side) / <span class="tok-num">2.0</span>,
            .cell = side / <span class="tok-num">3.0</span>,
        };
    }
};

<span class="tok-kw">const</span> bg_col: Color = .{ .r = <span class="tok-num">20</span>, .g = <span class="tok-num">24</span>, .b = <span class="tok-num">34</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> grid_col: Color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">100</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> x_col: Color = .{ .r = <span class="tok-num">236</span>, .g = <span class="tok-num">72</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> o_col: Color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">190</span>, .b = <span class="tok-num">235</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> win_col: Color = .{ .r = <span class="tok-num">250</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> };

<span class="tok-comment">/// The eight ways to make three in a row, as board indices.</span>
<span class="tok-kw">const</span> win_lines = [<span class="tok-num">8</span>][<span class="tok-num">3</span>]usize{
    .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span> }, .{ <span class="tok-num">3</span>, <span class="tok-num">4</span>, <span class="tok-num">5</span> }, .{ <span class="tok-num">6</span>, <span class="tok-num">7</span>, <span class="tok-num">8</span> }, <span class="tok-comment">// rows</span>
    .{ <span class="tok-num">0</span>, <span class="tok-num">3</span>, <span class="tok-num">6</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">4</span>, <span class="tok-num">7</span> }, .{ <span class="tok-num">2</span>, <span class="tok-num">5</span>, <span class="tok-num">8</span> }, <span class="tok-comment">// columns</span>
    .{ <span class="tok-num">0</span>, <span class="tok-num">4</span>, <span class="tok-num">8</span> }, .{ <span class="tok-num">2</span>, <span class="tok-num">4</span>, <span class="tok-num">6</span> }, <span class="tok-comment">// diagonals</span>
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    board: [<span class="tok-num">9</span>]Cell = <span class="tok-builtin">@splat</span>(.empty),
    turn: Cell = .x,
    <span class="tok-comment">/// The winning triple's index into win_lines, set once someone wins.</span>
    win_line: ?usize = null,
    full: bool = false,

    <span class="tok-kw">fn</span> <span class="tok-fn">winner</span>(self: State) ?Cell {
        <span class="tok-kw">if</span> (self.win_line) |li| {
            <span class="tok-kw">return</span> self.board[win_lines[li][<span class="tok-num">0</span>]];
        }
        <span class="tok-kw">return</span> null;
    }

    <span class="tok-comment">/// The one line of text shown along the bottom, for whatever the game is doing.</span>
    <span class="tok-kw">fn</span> <span class="tok-fn">status</span>(self: State) []<span class="tok-kw">const</span> u8 {
        <span class="tok-kw">if</span> (self.<span class="tok-fn">winner</span>()) |w| {
            <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (w) {
                .x =&gt; <span class="tok-str">"X wins - tap to play again"</span>,
                .o =&gt; <span class="tok-str">"O wins - tap to play again"</span>,
                .empty =&gt; <span class="tok-kw">unreachable</span>,
            };
        }
        <span class="tok-kw">if</span> (self.full) {
            <span class="tok-kw">return</span> <span class="tok-str">"draw - tap to play again"</span>;
        }
        <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (self.turn) {
            .x =&gt; <span class="tok-str">"tic tac toe - X to play"</span>,
            .o =&gt; <span class="tok-str">"tic tac toe - O to play"</span>,
            .empty =&gt; <span class="tok-kw">unreachable</span>,
        };
    }
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{ .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>) };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">reset</span>(s: *State) void {
    s.board = <span class="tok-builtin">@splat</span>(.empty);
    s.turn = .x;
    s.win_line = null;
    s.full = false;
}

<span class="tok-comment">/// Which cell the point falls in, or null when it is outside the board.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">cellAt</span>(lay: Layout, p: Vec2) ?usize {
    <span class="tok-kw">const</span> side: f32 = lay.cell * <span class="tok-num">3.0</span>;
    <span class="tok-kw">if</span> (p[<span class="tok-num">0</span>] &lt; lay.x <span class="tok-kw">or</span> p[<span class="tok-num">0</span>] &gt;= lay.x + side) {
        <span class="tok-kw">return</span> null;
    }
    <span class="tok-kw">if</span> (p[<span class="tok-num">1</span>] &lt; lay.y <span class="tok-kw">or</span> p[<span class="tok-num">1</span>] &gt;= lay.y + side) {
        <span class="tok-kw">return</span> null;
    }
    <span class="tok-comment">// Plain comparisons rather than a float-&gt;int cast: only three bands each way.</span>
    <span class="tok-kw">const</span> fx: f32 = (p[<span class="tok-num">0</span>] - lay.x) / lay.cell;
    <span class="tok-kw">const</span> fy: f32 = (p[<span class="tok-num">1</span>] - lay.y) / lay.cell;
    <span class="tok-kw">const</span> col: usize = <span class="tok-kw">if</span> (fx &lt; <span class="tok-num">1.0</span>) <span class="tok-num">0</span> <span class="tok-kw">else</span> <span class="tok-kw">if</span> (fx &lt; <span class="tok-num">2.0</span>) <span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-num">2</span>;
    <span class="tok-kw">const</span> row: usize = <span class="tok-kw">if</span> (fy &lt; <span class="tok-num">1.0</span>) <span class="tok-num">0</span> <span class="tok-kw">else</span> <span class="tok-kw">if</span> (fy &lt; <span class="tok-num">2.0</span>) <span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-num">2</span>;
    <span class="tok-kw">return</span> row * <span class="tok-num">3</span> + col;
}

<span class="tok-comment">/// Marks the winning line, or the full board, if either just happened.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">scoreBoard</span>(s: *State) void {
    <span class="tok-kw">for</span> (win_lines, <span class="tok-num">0</span>..) |line, i| {
        <span class="tok-kw">const</span> a: Cell = s.board[line[<span class="tok-num">0</span>]];
        <span class="tok-kw">if</span> (a == .empty) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">if</span> (a == s.board[line[<span class="tok-num">1</span>]] <span class="tok-kw">and</span> a == s.board[line[<span class="tok-num">2</span>]]) {
            s.win_line = i;
            <span class="tok-kw">return</span>;
        }
    }
    <span class="tok-kw">for</span> (s.board) |cell| {
        <span class="tok-kw">if</span> (cell == .empty) {
            <span class="tok-kw">return</span>;
        }
    }
    s.full = true;
}

<span class="tok-kw">fn</span> <span class="tok-fn">cellCenter</span>(lay: Layout, i: usize) Vec2 {
    <span class="tok-kw">const</span> col: f32 = <span class="tok-builtin">@floatFromInt</span>(i % <span class="tok-num">3</span>);
    <span class="tok-kw">const</span> row: f32 = <span class="tok-builtin">@floatFromInt</span>(i / <span class="tok-num">3</span>);
    <span class="tok-kw">return</span> .{
        lay.x + (col + <span class="tok-num">0.5</span>) * lay.cell,
        lay.y + (row + <span class="tok-num">0.5</span>) * lay.cell,
    };
}

<span class="tok-comment">/// A bar between two points, drawn as a rotated rectangle via the line helper.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawX</span>(
    gl: *z.WgpuGl,
    c: Vec2,
    r: f32,
    t: f32,
) void {
    gl.<span class="tok-fn">line</span>(.{ c[<span class="tok-num">0</span>] - r, c[<span class="tok-num">1</span>] - r }, .{ c[<span class="tok-num">0</span>] + r, c[<span class="tok-num">1</span>] + r }, .{ .color = x_col, .thickness = t });
    gl.<span class="tok-fn">line</span>(.{ c[<span class="tok-num">0</span>] - r, c[<span class="tok-num">1</span>] + r }, .{ c[<span class="tok-num">0</span>] + r, c[<span class="tok-num">1</span>] - r }, .{ .color = x_col, .thickness = t });
}

<span class="tok-comment">/// A ring: a filled disc with a background-coloured disc punched out of it.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawO</span>(
    gl: *z.WgpuGl,
    c: Vec2,
    r: f32,
    t: f32,
) void {
    gl.<span class="tok-fn">circle</span>(c, r, .{ .color = o_col, .segments = <span class="tok-num">48</span> });
    gl.<span class="tok-fn">circle</span>(c, r - t, .{ .color = bg_col, .segments = <span class="tok-num">48</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> lay: Layout = Layout.<span class="tok-fn">of</span>(f);
    <span class="tok-kw">const</span> thick: f32 = <span class="tok-builtin">@max</span>(<span class="tok-num">3.0</span>, lay.cell * <span class="tok-num">0.09</span>);
    <span class="tok-kw">const</span> over: bool = s.<span class="tok-fn">winner</span>() != null <span class="tok-kw">or</span> s.full;
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
        <span class="tok-kw">if</span> (over) {
            <span class="tok-fn">reset</span>(s);
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (<span class="tok-fn">cellAt</span>(lay, mp)) |i| {
            <span class="tok-kw">if</span> (s.board[i] == .empty) {
                s.board[i] = s.turn;
                s.turn = s.turn.<span class="tok-fn">other</span>();
                <span class="tok-fn">scoreBoard</span>(s);
            }
        }
    }

    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = f.window.<span class="tok-fn">widthf</span>(), .height = f.window.<span class="tok-fn">heightf</span>() },
        .{ .color = bg_col },
    );

    <span class="tok-comment">// Board: two vertical bars and two horizontal bars.</span>
    <span class="tok-kw">var</span> k: usize = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (k &lt; <span class="tok-num">3</span>) : (k += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> off: f32 = <span class="tok-fn">float</span>(k) * lay.cell;
        <span class="tok-kw">const</span> side: f32 = lay.cell * <span class="tok-num">3.0</span>;
        f.gl.<span class="tok-fn">line</span>(
            .{ lay.x + off, lay.y },
            .{ lay.x + off, lay.y + side },
            .{ .color = grid_col, .thickness = thick * <span class="tok-num">0.5</span> },
        );
        f.gl.<span class="tok-fn">line</span>(
            .{ lay.x, lay.y + off },
            .{ lay.x + side, lay.y + off },
            .{ .color = grid_col, .thickness = thick * <span class="tok-num">0.5</span> },
        );
    }

    <span class="tok-kw">for</span> (s.board, <span class="tok-num">0</span>..) |cell, i| {
        <span class="tok-kw">const</span> c: Vec2 = <span class="tok-fn">cellCenter</span>(lay, i);
        <span class="tok-kw">switch</span> (cell) {
            .empty =&gt; {},
            .x =&gt; <span class="tok-fn">drawX</span>(f.gl, c, lay.cell * <span class="tok-num">0.28</span>, thick),
            .o =&gt; <span class="tok-fn">drawO</span>(f.gl, c, lay.cell * <span class="tok-num">0.30</span>, thick),
        }
    }

    <span class="tok-comment">// Strike through the winning triple.</span>
    <span class="tok-kw">if</span> (s.win_line) |li| {
        <span class="tok-kw">const</span> line: [<span class="tok-num">3</span>]usize = win_lines[li];
        f.gl.<span class="tok-fn">line</span>(
            <span class="tok-fn">cellCenter</span>(lay, line[<span class="tok-num">0</span>]),
            <span class="tok-fn">cellCenter</span>(lay, line[<span class="tok-num">2</span>]),
            .{ .color = win_col, .thickness = thick },
        );
    }

    common.<span class="tok-fn">caption</span>(f.gl, s.font, s.<span class="tok-fn">status</span>());
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// Descriptor-only: the runner (standalone) or a launcher drives this.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - tic tac toe"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
