<span class="tok-comment">//</span>
<span class="tok-comment">// Visual + interactive smoke test for every InputText flag added</span>
<span class="tok-comment">// in turns 439 (P9.1 char filters) and 440 (P9.2 behavior flags).</span>
<span class="tok-comment">// One card per flag (or pair-of-flags-that-compose-naturally).</span>
<span class="tok-comment">// Each card:</span>
<span class="tok-comment">//   - Has a tap-to-focus inputText</span>
<span class="tok-comment">//   - Renders a live readout BELOW the field showing the buffer</span>
<span class="tok-comment">//     content, length, and the function's return value</span>
<span class="tok-comment">//   - States in plain English what the field is supposed to do</span>
<span class="tok-comment">//     ("type letters - they should become uppercase," etc.)</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Why: turns 439-440 added 10 flags across two layers:</span>
<span class="tok-comment">//   - 5 char filters (chars_decimal/hex/scientific/uppercase/no_blank)</span>
<span class="tok-comment">//   - 5 behavior flags (enter_returns_true/escape_clears/</span>
<span class="tok-comment">//     password_mask/read_only/allow_tab_input)</span>
<span class="tok-comment">// Host-path unit tests cover the wasm-side edit engine.  The</span>
<span class="tok-comment">// WEB-PATH wiring (4 new JS bindings, refactored showOverlayInput,</span>
<span class="tok-comment">// extended keydown listener in zimr.ts) has NO coverage outside</span>
<span class="tok-comment">// the JS bundle compiling.  This example exists to surface any</span>
<span class="tok-comment">// browser-side regressions the moment they appear - the same</span>
<span class="tok-comment">// methodology that found 4 engine bugs in turn 437b.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// How to use:</span>
<span class="tok-comment">//   build_standalone.py ui_input_flags_zoo_phone</span>
<span class="tok-comment">//   open the html in a phone browser</span>
<span class="tok-comment">//   tap each field, type characters, watch the readout</span>
<span class="tok-comment">// If a readout doesn't match the expected text in the card label,</span>
<span class="tok-comment">// there's a bug.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,

    <span class="tok-comment">// Buffers, one per card.  64 bytes is generous for phone-typed</span>
    <span class="tok-comment">// content; the password card uses one too even though its content</span>
    <span class="tok-comment">// is short.  Independent buffers so each field's state is</span>
    <span class="tok-comment">// observable in isolation.</span>
    buf_decimal: [<span class="tok-num">64</span>]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    len_decimal: usize = <span class="tok-num">0</span>,

    buf_no_blank: [<span class="tok-num">64</span>]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    len_no_blank: usize = <span class="tok-num">0</span>,

    buf_password: [<span class="tok-num">64</span>]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    len_password: usize = <span class="tok-num">0</span>,

    len_search: usize = <span class="tok-num">0</span>,

    last_true_search: u32 = <span class="tok-num">0</span>,

}

<span class="tok-comment">/// Escape `\n` -&gt; `\\n` and `\t` -&gt; `\\t` so a buffer with newlines</span>
<span class="tok-comment">/// or tabs renders as a single line in the readout.  Without</span>
<span class="tok-comment">/// this, `{s}` formatting expands newlines into real line breaks,</span>
<span class="tok-comment">/// making the readout span multiple lines and overlap the next</span>
<span class="tok-comment">/// widget below (the layout system sized the readout for one</span>
<span class="tok-comment">/// line).  Caller provides scratch space &gt;= 2x buffer length.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">escapeForReadout</span>(in: []<span class="tok-kw">const</span> u8, scratch: []u8) []<span class="tok-kw">const</span> u8 {
    <span class="tok-kw">var</span> w: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (in) |c| {
        <span class="tok-kw">if</span> (w &gt;= scratch.len) {
            <span class="tok-kw">break</span>;
        }
        <span class="tok-kw">switch</span> (c) {
            <span class="tok-str">'\n'</span> =&gt; {
                <span class="tok-kw">if</span> (w + <span class="tok-num">2</span> &gt; scratch.len) {
                    <span class="tok-kw">break</span>;
                }
                scratch[w] = <span class="tok-str">'\\'</span>;
                scratch[w + <span class="tok-num">1</span>] = <span class="tok-str">'n'</span>;
                w += <span class="tok-num">2</span>;
            },
            <span class="tok-str">'\t'</span> =&gt; {
                <span class="tok-kw">if</span> (w + <span class="tok-num">2</span> &gt; scratch.len) {
                    <span class="tok-kw">break</span>;
                }
                scratch[w] = <span class="tok-str">'\\'</span>;
                scratch[w + <span class="tok-num">1</span>] = <span class="tok-str">'t'</span>;
                w += <span class="tok-num">2</span>;
            },
            <span class="tok-kw">else</span> =&gt; {
                scratch[w] = c;
                w += <span class="tok-num">1</span>;
            },
        }
    }
    <span class="tok-kw">return</span> scratch[<span class="tok-num">0</span>..w];
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font), .font = font };
    <span class="tok-comment">// The password field starts with content so the masking is</span>
    <span class="tok-comment">// immediately visible at first paint.</span>
    <span class="tok-kw">const</span> seed: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"hunter2"</span>;
    <span class="tok-builtin">@memcpy</span>(s.buf_password[<span class="tok-num">0</span>..seed.len], seed);
    s.len_password = seed.len;
    <span class="tok-comment">// The read-only field has content the user can see but cannot</span>
    <span class="tok-comment">// edit - verifies the gate works.</span>
    <span class="tok-kw">const</span> rseed: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"id-7f3a"</span>;
    <span class="tok-builtin">@memcpy</span>(s.buf_readonly[<span class="tok-num">0</span>..rseed.len], rseed);
    s.len_readonly = rseed.len;
}

<span class="tok-comment">/// Render one card: label-with-expectation, the inputText, and a</span>
<span class="tok-comment">/// readout line.  Keeps the visual structure consistent so the</span>
<span class="tok-comment">/// user's eye can scan a long page quickly.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">card</span>(
    u: ui.Ui,
    label: []<span class="tok-kw">const</span> u8,
    expect: []<span class="tok-kw">const</span> u8,
    buf: []u8,
    len: *usize,
    opts: ui.InputTextOpts,
) bool {
    u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xE0E0E0FF</span>), <span class="tok-str">"{s}"</span>, .{label});
    u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"expect: {s}"</span>, .{expect});
    <span class="tok-kw">const</span> changed: bool = u.<span class="tok-fn">inputText</span>(label, buf, len, opts);
    <span class="tok-comment">// Readout: show what the buffer holds and its length.  This is</span>
    <span class="tok-comment">// what makes the example a bug-hunter - every keypress the user</span>
    <span class="tok-comment">// makes is reflected here, and any discrepancy with the</span>
    <span class="tok-comment">// `expect:` line above is a bug.</span>
    u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x60D0FFFF</span>), <span class="tok-str">"buf=\"{s}\" len={d}"</span>, .{ buf[<span class="tok-num">0</span>..len.*], len.* });
    u.<span class="tok-fn">spacing</span>();
    <span class="tok-kw">return</span> changed;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    s.frame +%= <span class="tok-num">1</span>;

    <span class="tok-kw">const</span> fw: f32 = <span class="tok-fn">float</span>(f.window.screen_width);
    <span class="tok-kw">const</span> fh: f32 = <span class="tok-fn">float</span>(f.window.screen_height);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw, fh }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"zoo"</span>, .{
        .flags = .{
            .no_title_bar = true,
            .no_resize = true,
            .no_move = true,
            .no_collapse = true,
        },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xFFFFFFFF</span>), <span class="tok-str">"input flags zoo"</span>, .{});
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"tap each field, type, watch the blue readout."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// ---- P9.1 char filters</span>

        _ = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"chars_decimal"</span>,
            <span class="tok-str">"digits + . + - (no letters)"</span>,
            &amp;s.buf_decimal,
            &amp;s.len_decimal,
            .{ .chars_decimal = true, .input_mode = .decimal },
        );

        _ = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"chars_hexadecimal"</span>,
            <span class="tok-str">"0-9 a-f A-F only (no g, no .)"</span>,
            &amp;s.buf_hex,
            &amp;s.len_hex,
            .{ .chars_hexadecimal = true },
        );

        _ = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"chars_scientific"</span>,
            <span class="tok-str">"digits + . + - + e/E (1.5e-3 ok, x rejected)"</span>,
            &amp;s.buf_scientific,
            &amp;s.len_scientific,
            .{ .chars_scientific = true, .input_mode = .decimal },
        );

        _ = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"chars_uppercase"</span>,
            <span class="tok-str">"lowercase letters become uppercase (a -&gt; A)"</span>,
            &amp;s.buf_uppercase,
            &amp;s.len_uppercase,
            .{ .chars_uppercase = true },
        );

        _ = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"chars_no_blank"</span>,
            <span class="tok-str">"space + tab rejected; type 'a b' yields 'ab'"</span>,
            &amp;s.buf_no_blank,
            &amp;s.len_no_blank,
            .{ .chars_no_blank = true },
        );

        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// ---- P9.2 behavior flags</span>

        _ = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"password_mask"</span>,
            <span class="tok-str">"seed=hunter2, rendered as *******"</span>,
            &amp;s.buf_password,
            &amp;s.len_password,
            .{ .password_mask = true },
        );

        _ = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"read_only"</span>,
            <span class="tok-str">"id-7f3a — cannot type / cannot backspace"</span>,
            &amp;s.buf_readonly,
            &amp;s.len_readonly,
            .{ .read_only = true },
        );

        <span class="tok-comment">// For enter_returns_true: bump last_true_search whenever</span>
        <span class="tok-comment">// the widget returns true.  Caller should observe the</span>
        <span class="tok-comment">// counter ONLY when Enter is pressed (or focus drops on</span>
        <span class="tok-comment">// web), not on every keystroke.</span>
        <span class="tok-kw">const</span> search_committed: bool = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"enter_returns_true"</span>,
            <span class="tok-str">"type chars (counter stable); press Enter (counter++)"</span>,
            &amp;s.buf_search,
            &amp;s.len_search,
            .{ .enter_returns_true = true },
        );
        <span class="tok-kw">if</span> (search_committed) {
            s.last_true_search = s.frame;
        }
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xFFB060FF</span>), <span class="tok-str">"  last commit at frame {d} (now {d})"</span>, .{
            s.last_true_search,
            s.frame,
        });
        u.<span class="tok-fn">spacing</span>();

        <span class="tok-comment">// For escape_clears: type something, press Escape, buffer</span>
        <span class="tok-comment">// should clear.  Pair with enter_returns_true so the user</span>
        <span class="tok-comment">// can also verify that Esc is NOT counted as a commit on</span>
        <span class="tok-comment">// host (counter stays put) but the buffer does clear.</span>
        <span class="tok-kw">const</span> cancel_committed: bool = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"enter_returns_true + escape_clears"</span>,
            <span class="tok-str">"type chars; Esc clears AND defocuses; commit counter unchanged"</span>,
            &amp;s.buf_cancel,
            &amp;s.len_cancel,
            .{ .enter_returns_true = true, .escape_clears = true },
        );
        <span class="tok-kw">if</span> (cancel_committed) {
            s.last_true_cancel = s.frame;
        }
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xFFB060FF</span>), <span class="tok-str">"  last commit at frame {d}"</span>, .{s.last_true_cancel});
        u.<span class="tok-fn">spacing</span>();

        _ = <span class="tok-fn">card</span>(
            u,
            <span class="tok-str">"allow_tab_input"</span>,
            <span class="tok-str">"press Tab — should insert \\t (visible as gap)"</span>,
            &amp;s.buf_tabbed,
            &amp;s.len_tabbed,
            .{ .allow_tab_input = true },
        );

        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xFFFFFFFF</span>), <span class="tok-str">"multiline (textarea overlay)"</span>, .{});
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"tap to open native textarea with soft keyboard."</span>, .{});
        u.<span class="tok-fn">spacing</span>();

        <span class="tok-comment">// ---- Multiline cards (turn 441b)</span>

        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xE0E0E0FF</span>), <span class="tok-str">"default multiline"</span>, .{});
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"expect: Enter inserts newline; multi-line input works"</span>, .{});
        _ = u.<span class="tok-fn">inputTextMultiline</span>(<span class="tok-str">"notes"</span>, &amp;s.buf_notes, &amp;s.len_notes, .{ <span class="tok-num">380</span>, <span class="tok-num">100</span> }, .{});
        <span class="tok-kw">var</span> scratch_notes: [<span class="tok-num">600</span>]u8 = undefined;
        <span class="tok-kw">const</span> esc_notes: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">escapeForReadout</span>(s.buf_notes[<span class="tok-num">0</span>..s.len_notes], &amp;scratch_notes);
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x60D0FFFF</span>), <span class="tok-str">"buf=\"{s}\"  len={d}"</span>, .{ esc_notes, s.len_notes });
        u.<span class="tok-fn">spacing</span>();

        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xE0E0E0FF</span>), <span class="tok-str">"chat box: ctrl_enter_for_newline + enter_returns_true"</span>, .{});
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"expect: Enter commits (counter++); Ctrl+Enter inserts \\n"</span>, .{});
        <span class="tok-kw">const</span> chat_committed: bool = u.<span class="tok-fn">inputTextMultiline</span>(<span class="tok-str">"chat"</span>, &amp;s.buf_chat, &amp;s.len_chat, .{ <span class="tok-num">380</span>, <span class="tok-num">100</span> }, .{
            .enter_returns_true = true,
            .ctrl_enter_for_newline = true,
        });
        <span class="tok-kw">if</span> (chat_committed) {
            s.last_true_chat = s.frame;
        }
        <span class="tok-kw">var</span> scratch_chat: [<span class="tok-num">600</span>]u8 = undefined;
        <span class="tok-kw">const</span> esc_chat: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">escapeForReadout</span>(s.buf_chat[<span class="tok-num">0</span>..s.len_chat], &amp;scratch_chat);
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x60D0FFFF</span>), <span class="tok-str">"buf=\"{s}\"  len={d}"</span>, .{ esc_chat, s.len_chat });
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xFFB060FF</span>), <span class="tok-str">"  last commit at frame {d} (now {d})"</span>, .{ s.last_true_chat, s.frame });
        u.<span class="tok-fn">spacing</span>();

        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0xE0E0E0FF</span>), <span class="tok-str">"code editor: allow_tab_input multiline"</span>, .{});
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"expect: Tab inserts \\t; doesn't lose focus"</span>, .{});
        _ = u.<span class="tok-fn">inputTextMultiline</span>(<span class="tok-str">"code"</span>, &amp;s.buf_code, &amp;s.len_code, .{ <span class="tok-num">380</span>, <span class="tok-num">100</span> }, .{
            .allow_tab_input = true,
        });
        <span class="tok-kw">var</span> scratch_code: [<span class="tok-num">600</span>]u8 = undefined;
        <span class="tok-kw">const</span> esc_code: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">escapeForReadout</span>(s.buf_code[<span class="tok-num">0</span>..s.len_code], &amp;scratch_code);
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x60D0FFFF</span>), <span class="tok-str">"buf=\"{s}\"  len={d}"</span>, .{ esc_code, s.len_code });
        u.<span class="tok-fn">spacing</span>();

        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"if a field rejects what it should accept"</span>, .{});
        u.<span class="tok-fn">textColored</span>(Color.<span class="tok-fn">hex</span>(<span class="tok-num">0x909090FF</span>), <span class="tok-str">"or accepts what it should reject — it's a bug."</span>, .{});
    }
}
