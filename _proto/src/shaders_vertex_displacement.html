<span class="tok-comment">//! vertex texture fetch. A flat grid is pushed into a living, lit 3D surface by</span>

<span class="tok-comment">//! (the height plus two neighbours), from which the surface normal is computed</span>
<span class="tok-comment">//! in the vertex stage too. The heightfield is one static texture; scrolling the</span>
<span class="tok-comment">//! vertex-stage lookup by time animates it into moving swells. Lit with a</span>
<span class="tok-comment">//! height-graded colour + specular glint, depth-tested, orbited with the phone</span>
<span class="tok-comment">//! camera.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! This replaces the earlier CPU fallback - its premise, "zimr's vertex stage</span>
<span class="tok-comment">//! doesn't sample textures", no longer holds now that vertex texture fetch works.</span>

<span class="tok-kw">const</span> verts_side: usize = grid_n + <span class="tok-num">1</span>;

<span class="tok-kw">const</span> index_count: usize = grid_n * grid_n * <span class="tok-num">6</span>;

    <span class="tok-kw">const</span> verts: []f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vertex_count * <span class="tok-num">4</span>);

    gz = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (gz &lt; grid_n) : (gz += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> gx: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (gx &lt; grid_n) : (gx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> a: u16 = <span class="tok-builtin">@intCast</span>(gz * verts_side + gx);
            <span class="tok-kw">const</span> b: u16 = <span class="tok-builtin">@intCast</span>(gz * verts_side + gx + <span class="tok-num">1</span>);
            <span class="tok-kw">const</span> c: u16 = <span class="tok-builtin">@intCast</span>((gz + <span class="tok-num">1</span>) * verts_side + gx + <span class="tok-num">1</span>);
            <span class="tok-kw">const</span> d: u16 = <span class="tok-builtin">@intCast</span>((gz + <span class="tok-num">1</span>) * verts_side + gx);
            idx[n + <span class="tok-num">0</span>] = a;
            idx[n + <span class="tok-num">1</span>] = b;
            idx[n + <span class="tok-num">2</span>] = c;
            idx[n + <span class="tok-num">3</span>] = a;
            idx[n + <span class="tok-num">4</span>] = c;
            idx[n + <span class="tok-num">5</span>] = d;
            n += <span class="tok-num">6</span>;
        }
    }

    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = verts.len * <span class="tok-builtin">@sizeOf</span>(f32),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"vdisp_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(verts));

    <span class="tok-kw">const</span> ibo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = idx.len * <span class="tok-builtin">@sizeOf</span>(u16),
        .usage = .{ .index = true, .copy_dst = true },
        .label = <span class="tok-str">"vdisp_ibo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, ibo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(idx));

    <span class="tok-comment">// Perlin heightfield. MIRROR_REPEAT addressing (not clamp) so the vertex</span>
    <span class="tok-comment">// shader can sample at uv*freq &gt; 1 - and once scrolling pushes the lookup</span>
    <span class="tok-comment">// past 1 - and have the noise wrap instead of smearing the texture's edge</span>
    <span class="tok-comment">// texels into flat / 1D-striped regions. Mirror (not plain repeat) keeps the</span>
    <span class="tok-comment">// height continuous across the wrap since genImagePerlinNoise isn't tileable.</span>
    <span class="tok-comment">// Linear filtering keeps the surface smooth. loadTextureFromImage would give</span>
    <span class="tok-comment">// a clamp + nearest sampler, so build the texture directly.</span>
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">genImagePerlinNoise</span>(gpa, <span class="tok-num">256</span>, <span class="tok-num">256</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">6.0</span>);
    <span class="tok-kw">const</span> iw: u32 = <span class="tok-builtin">@intCast</span>(img.width);
    <span class="tok-kw">const</span> ih: u32 = <span class="tok-builtin">@intCast</span>(img.height);
    <span class="tok-kw">const</span> pixels: []<span class="tok-kw">const</span> u8 = <span class="tok-builtin">@as</span>([*]<span class="tok-kw">const</span> u8, <span class="tok-builtin">@ptrCast</span>(img.data.?))[<span class="tok-num">0</span> .. iw * ih * <span class="tok-num">4</span>];
    <span class="tok-kw">const</span> tex: z.WgpuTexture = z.WgpuTexture.<span class="tok-fn">createFromPixels</span>(f.gpu.device, f.gpu.queue, .{
        .width = iw,
        .height = ih,
        .pixels = pixels,
        .mag_filter_linear = true,
        .min_filter_linear = true,
        .address_mode = .mirror_repeat,
        .label = <span class="tok-str">"heightfield"</span>,
    });
    z.<span class="tok-fn">unloadImage</span>(gpa, img);

    <span class="tok-kw">const</span> shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(vs_io, fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = vs_wgsl,
        .fs_wgsl_source = fs_wgsl,
        .vertex_buffer_layouts = &amp;.{z.shader.<span class="tok-fn">vertexLayout</span>(vs_io)},
        .depth_state = .less_equal,
        .initial_ubo = .{ .mvp = <span class="tok-fn">identity</span>(), .wave = .{ <span class="tok-num">0</span>, amplitude, frequency, texel }, .cam = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
        .textures = .{ .height = tex },
        .label = <span class="tok-str">"shaders_vertex_displacement"</span>,
    });

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson, <span class="tok-num">22</span>),
        .cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">19.0</span>),
        .shader = shader,
        .vbo = vbo,
        .ibo = ibo,
        .tex = tex,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> aspect: f32 = f.window.<span class="tok-fn">widthf</span>() / <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, false, .{ .min_distance = <span class="tok-num">9.0</span>, .max_distance = <span class="tok-num">40.0</span> });
    <span class="tok-kw">const</span> mvp: [<span class="tok-num">4</span>]Vec = cam.<span class="tok-fn">viewProj</span>(aspect, <span class="tok-num">0.1</span>, <span class="tok-num">120.0</span>);
    <span class="tok-kw">const</span> slope: f32 = amplitude / (texel * plane_size);

    s.shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{
        .mvp = mvp,
        .wave = .{ f.time.time, amplitude, frequency, texel },
        .cam = .{ cam.position[<span class="tok-num">0</span>], cam.position[<span class="tok-num">1</span>], cam.position[<span class="tok-num">2</span>], slope },
    });

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">6</span>, .g = <span class="tok-num">10</span>, .b = <span class="tok-num">18</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    <span class="tok-comment">// Bracket the custom pipeline draw so the 2D immediate batch (the clear quad</span>
    <span class="tok-comment">// plus the text below) always flushes under the 2D pipeline, never ours -</span>
    <span class="tok-comment">// our vertex-visible sampler sits at the batch's reserved group 1. See the</span>
    <span class="tok-comment">// guard in gpu_iface.flushBatch and the note on LoadedShader.bindForDraw.</span>
    f.gl.<span class="tok-fn">flushBeforeMaterialSwap</span>();
    s.shader.<span class="tok-fn">bindForDraw</span>(ps);
    s.shader.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, vertex_count * <span class="tok-num">4</span> * <span class="tok-builtin">@sizeOf</span>(f32));
    s.shader.<span class="tok-fn">setIndex</span>(ps, s.ibo, .uint16, index_count * <span class="tok-builtin">@sizeOf</span>(u16));
    s.shader.<span class="tok-fn">drawIndexed</span>(ps, <span class="tok-builtin">@intCast</span>(index_count), <span class="tok-num">1</span>);
    f.gl.<span class="tok-fn">renderer</span>().<span class="tok-fn">bindForPass</span>(ps);

    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">16</span> }, <span class="tok-str">"Vertex Displacement"</span>, .{ .size = <span class="tok-num">24</span>, .color = common.palette.ink, .font = &amp;s.font });
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, <span class="tok-num">46</span> },
        <span class="tok-str">"a Perlin heightfield sampled in the VERTEX SHADER; normals computed there too"</span>,
        .{ .size = <span class="tok-num">14</span>, .color = common.palette.ink_dim, .font = &amp;s.font },
    );
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"GPU vertex texture fetch - drag to orbit, pinch/wheel to zoom"</span>);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - shaders - vertex displacement (GPU heightfield)"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};

<figure class="code src-file" data-path="examples/shaders_vertex_displacement_fs.zig" data-lines="60"><figcaption><span>examples/shaders_vertex_displacement_fs.zig</span><span>60 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/shaders_vertex_displacement_fs.zig - lights the displaced surface:</span>
<span class="tok-comment">//! Lambert diffuse over a height-graded colour (deep trough -&gt; mid water -&gt;</span>
<span class="tok-comment">//! bright crest), plus a Blinn specular glint. The normal it shades with was</span>
<span class="tok-comment">//! computed in the vertex shader from the heightfield samples.</span>
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> dot = zm.dot;
<span class="tok-kw">const</span> normalize = zm.normalize;
<span class="tok-kw">const</span> smoothstep = zm.smoothstep;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"shaders_vertex_displacement_fs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"shaders_vertex_displacement_fs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(void);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-comment">/// Element-wise linear blend a + (b - a) * t (the DSL has no vector `mix`).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">mixVec3</span>(a: Vec3, b: Vec3, t: f32) Vec3 {
    <span class="tok-kw">return</span> .{ a[<span class="tok-num">0</span>] + (b[<span class="tok-num">0</span>] - a[<span class="tok-num">0</span>]) * t, a[<span class="tok-num">1</span>] + (b[<span class="tok-num">1</span>] - a[<span class="tok-num">1</span>]) * t, a[<span class="tok-num">2</span>] + (b[<span class="tok-num">2</span>] - a[<span class="tok-num">2</span>]) * t };
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;
    <span class="tok-kw">const</span> nrm: Vec3 = <span class="tok-fn">normalize</span>(Vec3{ io_in.frag_normal[<span class="tok-num">0</span>], io_in.frag_normal[<span class="tok-num">1</span>], io_in.frag_normal[<span class="tok-num">2</span>] });
    <span class="tok-kw">const</span> light_dir: Vec3 = <span class="tok-fn">normalize</span>(Vec3{ <span class="tok-num">0.45</span>, <span class="tok-num">0.80</span>, <span class="tok-num">0.40</span> });
    <span class="tok-kw">const</span> n_dot_l: f32 = <span class="tok-builtin">@max</span>(<span class="tok-fn">dot</span>(nrm, light_dir), <span class="tok-num">0.0</span>);
    <span class="tok-kw">const</span> ambient: f32 = <span class="tok-num">0.28</span>;
    <span class="tok-kw">const</span> diffuse: f32 = ambient + (<span class="tok-num">1.0</span> - ambient) * n_dot_l;

    <span class="tok-comment">// Height-banded colour: deep trough -&gt; mid water -&gt; bright crest.</span>
    <span class="tok-kw">const</span> h: f32 = io_in.frag_world[<span class="tok-num">3</span>];
    <span class="tok-kw">const</span> deep: Vec3 = .{ <span class="tok-num">0.03</span>, <span class="tok-num">0.10</span>, <span class="tok-num">0.32</span> };
    <span class="tok-kw">const</span> midc: Vec3 = .{ <span class="tok-num">0.06</span>, <span class="tok-num">0.42</span>, <span class="tok-num">0.66</span> };
    <span class="tok-kw">const</span> crest: Vec3 = .{ <span class="tok-num">0.82</span>, <span class="tok-num">0.94</span>, <span class="tok-num">1.00</span> };
    <span class="tok-kw">const</span> c1: Vec3 = <span class="tok-fn">mixVec3</span>(deep, midc, <span class="tok-fn">smoothstep</span>(<span class="tok-num">0.25</span>, <span class="tok-num">0.55</span>, h));
    <span class="tok-kw">const</span> base: Vec3 = <span class="tok-fn">mixVec3</span>(c1, crest, <span class="tok-fn">smoothstep</span>(<span class="tok-num">0.62</span>, <span class="tok-num">0.90</span>, h));

    <span class="tok-comment">// Blinn specular glint. Exponent 32 via five squarings - the DSL has no pow().</span>
    <span class="tok-kw">const</span> view: Vec3 = <span class="tok-fn">normalize</span>(Vec3{ io_in.frag_view[<span class="tok-num">0</span>], io_in.frag_view[<span class="tok-num">1</span>], io_in.frag_view[<span class="tok-num">2</span>] });
    <span class="tok-kw">const</span> half: Vec3 = <span class="tok-fn">normalize</span>(Vec3{ light_dir[<span class="tok-num">0</span>] + view[<span class="tok-num">0</span>], light_dir[<span class="tok-num">1</span>] + view[<span class="tok-num">1</span>], light_dir[<span class="tok-num">2</span>] + view[<span class="tok-num">2</span>] });
    <span class="tok-kw">var</span> spec: f32 = <span class="tok-builtin">@max</span>(<span class="tok-fn">dot</span>(nrm, half), <span class="tok-num">0.0</span>);
    spec = spec * spec;
    spec = spec * spec;
    spec = spec * spec;
    spec = spec * spec;
    spec = spec * spec;
    <span class="tok-kw">const</span> glint: f32 = spec * <span class="tok-num">0.55</span>;

    out.final_color = .{
        base[<span class="tok-num">0</span>] * diffuse + glint,
        base[<span class="tok-num">1</span>] * diffuse + glint,
        base[<span class="tok-num">2</span>] * diffuse + glint,
        <span class="tok-num">1.0</span>,
    };
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_io;
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Inputs = <span class="tok-kw">struct</span> {

<figure class="code src-file" data-path="examples/shaders_vertex_displacement_vs.zig" data-lines="75"><figcaption><span>examples/shaders_vertex_displacement_vs.zig</span><span>75 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/shaders_vertex_displacement_vs.zig - the vertex shader that turns a</span>
<span class="tok-comment">//! flat grid into a living surface by sampling a Perlin heightfield IN THE</span>
<span class="tok-comment">//! VERTEX STAGE. `heightLevel` is the explicit-LOD accessor (-&gt;</span>
<span class="tok-comment">//! textureSampleLevel), which needs no derivatives and is legal in the vertex</span>
<span class="tok-comment">//! stage. Three heights per vertex (the vertex plus two neighbours) give the</span>
<span class="tok-comment">//! world-space surface normal, so the surface is lit, not merely displaced.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The three fetches are factored into `heightAt`. That is allowed because</span>
<span class="tok-comment">//! `heightLevel` is explicit-LOD (uniformity-exempt); the `sampler-in-helper`</span>
<span class="tok-comment">//! lint only forbids implicit-LOD samples in helpers (a fragment-stage rule).</span>
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> normalize = zm.normalize;
<span class="tok-kw">const</span> mulMatPoint = zm.mulMatPoint;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"shaders_vertex_displacement_vs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"shaders_vertex_displacement_vs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_io.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-comment">/// Height at `uv`: two octaves of the heightfield, scrolled in different</span>
<span class="tok-comment">/// directions by time `t` - scrolling a static texture is what animates the</span>
<span class="tok-comment">/// swells. The `repeat` sampler tiles the noise, so `uv * freq` may exceed 1.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">heightAt</span>(io_in: Io, uv: Vec2, t: f32, freq: f32) f32 {
    <span class="tok-kw">const</span> uv1: Vec2 = .{ uv[<span class="tok-num">0</span>] * freq + t * <span class="tok-num">0.030</span>, uv[<span class="tok-num">1</span>] * freq + t * <span class="tok-num">0.021</span> };
    <span class="tok-kw">const</span> uv2: Vec2 = .{ uv[<span class="tok-num">0</span>] * freq * <span class="tok-num">2.03</span> - t * <span class="tok-num">0.017</span>, uv[<span class="tok-num">1</span>] * freq * <span class="tok-num">2.03</span> + t * <span class="tok-num">0.034</span> };
    <span class="tok-kw">const</span> s1: Vec = io_in.<span class="tok-fn">heightLevel</span>(uv1, <span class="tok-num">0.0</span>);
    <span class="tok-kw">const</span> s2: Vec = io_in.<span class="tok-fn">heightLevel</span>(uv2, <span class="tok-num">0.0</span>);
    <span class="tok-kw">return</span> s1[<span class="tok-num">0</span>] * <span class="tok-num">0.65</span> + s2[<span class="tok-num">0</span>] * <span class="tok-num">0.35</span>;
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;
    <span class="tok-kw">const</span> uv: Vec2 = io_in.vertex_uv;
    <span class="tok-kw">const</span> t: f32 = io_in.u.wave[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> amp: f32 = io_in.u.wave[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> freq: f32 = io_in.u.wave[<span class="tok-num">2</span>];
    <span class="tok-kw">const</span> texel: f32 = io_in.u.wave[<span class="tok-num">3</span>];
    <span class="tok-kw">const</span> slope: f32 = io_in.u.cam[<span class="tok-num">3</span>];

    <span class="tok-kw">const</span> h0: f32 = <span class="tok-fn">heightAt</span>(io_in, uv, t, freq);
    <span class="tok-kw">const</span> hx: f32 = <span class="tok-fn">heightAt</span>(io_in, .{ uv[<span class="tok-num">0</span>] + texel, uv[<span class="tok-num">1</span>] }, t, freq);
    <span class="tok-kw">const</span> hz: f32 = <span class="tok-fn">heightAt</span>(io_in, .{ uv[<span class="tok-num">0</span>], uv[<span class="tok-num">1</span>] + texel }, t, freq);

    <span class="tok-kw">const</span> world_x: f32 = io_in.vertex_position[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> world_z: f32 = io_in.vertex_position[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> world_y: f32 = h0 * amp;
    <span class="tok-kw">const</span> wp: Vec3 = .{ world_x, world_y, world_z };

    <span class="tok-comment">// The surface is y = h(x,z); its normal is normalize(-dy/dx, 1, -dy/dz).</span>
    <span class="tok-comment">// `slope` folds amplitude and the uv-&gt;world scale so the finite differences</span>
    <span class="tok-comment">// read as true world slopes.</span>
    <span class="tok-kw">const</span> dydx: f32 = (hx - h0) * slope;
    <span class="tok-kw">const</span> dydz: f32 = (hz - h0) * slope;
    <span class="tok-kw">const</span> nrm: Vec3 = <span class="tok-fn">normalize</span>(Vec3{ -dydx, <span class="tok-num">1.0</span>, -dydz });

    <span class="tok-kw">const</span> view: Vec3 = <span class="tok-fn">normalize</span>(Vec3{
        io_in.u.cam[<span class="tok-num">0</span>] - world_x,
        io_in.u.cam[<span class="tok-num">1</span>] - world_y,
        io_in.u.cam[<span class="tok-num">2</span>] - world_z,
    });

    out.position = <span class="tok-fn">mulMatPoint</span>(io_in.u.mvp, wp);
    out.frag_normal = .{ nrm[<span class="tok-num">0</span>], nrm[<span class="tok-num">1</span>], nrm[<span class="tok-num">2</span>], <span class="tok-num">0.0</span> };
    out.frag_world = .{ world_x, world_y, world_z, h0 };
    out.frag_view = .{ view[<span class="tok-num">0</span>], view[<span class="tok-num">1</span>], view[<span class="tok-num">2</span>], <span class="tok-num">0.0</span> };
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_io;
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Ubo = <span class="tok-kw">struct</span> {
    mvp: [<span class="tok-num">4</span>]Vec, <span class="tok-comment">// view*projection (model is identity - grid is world-space)</span>

    height: shader.<span class="tok-fn">Sampler2D</span>(.albedo, .{ .stages = .{ .vertex = true, .fragment = false } }),
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Outputs = <span class="tok-kw">struct</span> {
