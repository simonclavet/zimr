<figure class="code src-file" data-path="examples/zimrphysics2d_demo/zimrphysics2d_demo.zig" data-lines="631"><figcaption><span>examples/zimrphysics2d_demo/zimrphysics2d_demo.zig</span><span>631 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! zimrphysics2d_demo - a box2d-style testbed for the `zimrphysics2d` engine.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The world is the single source of truth: each frame we step the solver on a fixed</span>
<span class="tok-comment">//! timestep, then hand the whole world to `phys.draw`, which fires the DebugDraw</span>
<span class="tok-comment">//! callbacks in render.zig to push batched geometry into the UI's background draw</span>
<span class="tok-comment">//! list. A small control window switches scenes, pauses, zooms, and toggles the</span>
<span class="tok-comment">//! joint / AABB / contact decoration layers.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Drawing path rationale: see render.zig. One DebugDraw-&gt;DrawList adapter covers</span>
<span class="tok-comment">//! every shape/joint/contact the engine emits, so scenes never write rendering code.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> assertUnreachable = zm.assertUnreachable;
<span class="tok-kw">const</span> float64 = zm.float64;
<span class="tok-kw">const</span> builtin = <span class="tok-builtin">@import</span>(<span class="tok-str">"builtin"</span>);
<span class="tok-kw">const</span> ui = z.ui_real;
<span class="tok-kw">const</span> render = <span class="tok-builtin">@import</span>(<span class="tok-str">"render.zig"</span>);
<span class="tok-kw">const</span> scenes = <span class="tok-builtin">@import</span>(<span class="tok-str">"scenes.zig"</span>);

<span class="tok-kw">const</span> phys = z.zimrphysics2d;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Rot2 = zm.Rot2;
<span class="tok-kw">const</span> Transform2 = zm.Transform2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> transformPoint2 = zm.transformPoint2;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> backdrop: Color = .{ .r = <span class="tok-num">17</span>, .g = <span class="tok-num">24</span>, .b = <span class="tok-num">39</span>, .a = <span class="tok-num">255</span> }; <span class="tok-comment">// slate-900</span>
<span class="tok-kw">const</span> leash_color: Color = .{ .r = <span class="tok-num">250</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">21</span>, .a = <span class="tok-num">255</span> }; <span class="tok-comment">// amber drag line</span>
<span class="tok-kw">const</span> world_capacity: u32 = <span class="tok-num">2048</span>;
<span class="tok-kw">const</span> fixed_dt: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">60.0</span>;
<span class="tok-comment">// Determinism|SnapShot loop: capture a checkpoint at this sub-step, restore it at the later one</span>
<span class="tok-comment">// (then rewind the counter to the capture point so the snap-back repeats). Mirrors box2d's 50/150.</span>
<span class="tok-kw">const</span> snapshot_capture_step: u32 = <span class="tok-num">50</span>;
<span class="tok-kw">const</span> snapshot_restore_step: u32 = <span class="tok-num">200</span>;

<span class="tok-comment">// -- Pointer dragging: box2d v3.1's mouse-pick, a soft motor joint between the</span>
<span class="tok-comment">// picked body and a movable anchor. The anchor *owns* the joint, so releasing is</span>
<span class="tok-comment">// just destroyBody(anchor) - the joint is torn down with it.</span>

<span class="tok-comment">/// An active drag. `anchor` is a static body parked at the pointer; the motor joint</span>
<span class="tok-comment">/// (held by the anchor) pulls the picked body's grabbed point toward it.</span>
<span class="tok-kw">const</span> Drag = <span class="tok-kw">struct</span> {
    anchor: phys.BodyHandle,
    picked: usize, <span class="tok-comment">// BodyIndex of the grabbed body (for the leash visual)</span>
    grab_local: Vec2, <span class="tok-comment">// grabbed point in the picked body's local frame</span>
};

<span class="tok-comment">/// World point -&gt; a body's local frame (inverse rigid transform: R(-theta)*(w - p)).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">invTransformPoint</span>(xf: Transform2, w: Vec2) Vec2 {
    <span class="tok-kw">const</span> dx: f32 = w[<span class="tok-num">0</span>] - xf.p[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> dy: f32 = w[<span class="tok-num">1</span>] - xf.p[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> lx: f32 = xf.q.cosine * dx + xf.q.sine * dy;
    <span class="tok-kw">const</span> ly: f32 = -xf.q.sine * dx + xf.q.cosine * dy;
    <span class="tok-kw">return</span> .{ lx, ly };
}

<span class="tok-comment">/// Squared distance from a point to a segment, for capsule hit-testing.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pointSegDist2</span>(p: Vec2, q1: Vec2, q2: Vec2) f32 {
    <span class="tok-kw">const</span> ex: f32 = q2[<span class="tok-num">0</span>] - q1[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> ey: f32 = q2[<span class="tok-num">1</span>] - q1[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> len2: f32 = ex * ex + ey * ey;
    <span class="tok-kw">var</span> t: f32 = <span class="tok-num">0.0</span>;
    <span class="tok-kw">if</span> (len2 &gt; <span class="tok-num">1.0e-9</span>) {
        t = <span class="tok-fn">clamp</span>(((p[<span class="tok-num">0</span>] - q1[<span class="tok-num">0</span>]) * ex + (p[<span class="tok-num">1</span>] - q1[<span class="tok-num">1</span>]) * ey) / len2, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>);
    }
    <span class="tok-kw">const</span> cx: f32 = q1[<span class="tok-num">0</span>] + t * ex;
    <span class="tok-kw">const</span> cy: f32 = q1[<span class="tok-num">1</span>] + t * ey;
    <span class="tok-kw">const</span> dx: f32 = p[<span class="tok-num">0</span>] - cx;
    <span class="tok-kw">const</span> dy: f32 = p[<span class="tok-num">1</span>] - cy;
    <span class="tok-kw">return</span> dx * dx + dy * dy;
}

<span class="tok-comment">/// Exact point-in-shape test (local-space), so overlapping boxes pick cleanly.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pointInGeom</span>(geom: phys.Geometry, xf: Transform2, world_pt: Vec2) bool {
    <span class="tok-kw">const</span> local: Vec2 = <span class="tok-fn">invTransformPoint</span>(xf, world_pt);
    <span class="tok-kw">switch</span> (geom) {
        .circle =&gt; |c| {
            <span class="tok-kw">const</span> dx: f32 = local[<span class="tok-num">0</span>] - c.center[<span class="tok-num">0</span>];
            <span class="tok-kw">const</span> dy: f32 = local[<span class="tok-num">1</span>] - c.center[<span class="tok-num">1</span>];
            <span class="tok-kw">return</span> dx * dx + dy * dy &lt;= c.radius * c.radius;
        },
        .polygon =&gt; |p| {
            <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (i &lt; p.count) : (i += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> dvx: f32 = local[<span class="tok-num">0</span>] - p.vertices[i][<span class="tok-num">0</span>];
                <span class="tok-kw">const</span> dvy: f32 = local[<span class="tok-num">1</span>] - p.vertices[i][<span class="tok-num">1</span>];
                <span class="tok-kw">const</span> dist: f32 = p.normals[i][<span class="tok-num">0</span>] * dvx + p.normals[i][<span class="tok-num">1</span>] * dvy;
                <span class="tok-kw">if</span> (dist &gt; p.radius) {
                    <span class="tok-kw">return</span> false;
                }
            }
            <span class="tok-kw">return</span> true;
        },
        .capsule =&gt; |c| {
            <span class="tok-kw">return</span> <span class="tok-fn">pointSegDist2</span>(local, c.center1, c.center2) &lt;= c.radius * c.radius;
        },
        <span class="tok-kw">else</span> =&gt; {
            <span class="tok-kw">return</span> false;
        },
    }
}

<span class="tok-kw">const</span> PickCtx = <span class="tok-kw">struct</span> {
    world: *phys.World,
    point: Vec2,
    best: ?usize = null,
    best_d2: f32 = <span class="tok-num">0</span>,
};

<span class="tok-comment">/// overlapAabb visitor: keep the nearest dynamic body whose shape contains the point.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pickCallback</span>(shape: phys.ShapeIndex, cptr: *anyopaque) bool {
    <span class="tok-kw">const</span> pc: *PickCtx = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(cptr));
    <span class="tok-kw">const</span> s: *<span class="tok-kw">const</span> phys.Shape = &amp;pc.world.shapes.data[shape];
    <span class="tok-kw">const</span> bi: usize = s.body;
    <span class="tok-kw">const</span> b: *<span class="tok-kw">const</span> phys.Body = &amp;pc.world.bodies.data[bi];
    <span class="tok-kw">if</span> (b.motion_type != .dynamic) {
        <span class="tok-kw">return</span> true;
    }
    <span class="tok-kw">if</span> (!<span class="tok-fn">pointInGeom</span>(s.geom, b.transform, pc.point)) {
        <span class="tok-kw">return</span> true;
    }
    <span class="tok-kw">const</span> dx: f32 = b.center[<span class="tok-num">0</span>] - pc.point[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> dy: f32 = b.center[<span class="tok-num">1</span>] - pc.point[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> d2: f32 = dx * dx + dy * dy;
    <span class="tok-kw">if</span> (pc.best == null <span class="tok-kw">or</span> d2 &lt; pc.best_d2) {
        pc.best = bi;
        pc.best_d2 = d2;
    }
    <span class="tok-kw">return</span> true; <span class="tok-comment">// scan all overlaps, then take the nearest</span>
}

<span class="tok-comment">/// Grab whatever dynamic body sits under `world_pt`, if any.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">beginDrag</span>(s: *State, world_pt: Vec2) void {
    <span class="tok-kw">const</span> eps: f32 = <span class="tok-num">0.01</span>;
    <span class="tok-kw">const</span> box: phys.Aabb2 = .{
        .lower = .{ world_pt[<span class="tok-num">0</span>] - eps, world_pt[<span class="tok-num">1</span>] - eps },
        .upper = .{ world_pt[<span class="tok-num">0</span>] + eps, world_pt[<span class="tok-num">1</span>] + eps },
    };
    <span class="tok-kw">var</span> pc: PickCtx = .{ .world = &amp;s.world, .point = world_pt };
    phys.<span class="tok-fn">overlapAabb</span>(&amp;s.world, box, .{}, pickCallback, &amp;pc);
    <span class="tok-kw">const</span> bi: usize = pc.best <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;

    <span class="tok-kw">const</span> anchor: phys.BodyHandle = phys.<span class="tok-fn">createBody</span>(&amp;s.world, .{
        .motion_type = .static,
        .position = world_pt,
    }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">const</span> b: *<span class="tok-kw">const</span> phys.Body = &amp;s.world.bodies.data[bi];
    <span class="tok-kw">const</span> grab_local: Vec2 = <span class="tok-fn">invTransformPoint</span>(b.transform, world_pt);
    <span class="tok-kw">const</span> mass: f32 = <span class="tok-kw">if</span> (b.mass &gt; <span class="tok-num">0.0</span>) b.mass <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
    <span class="tok-comment">// Index-only handle: createJoint consumes body handles via `.index()` and stores</span>
    <span class="tok-comment">// a BodyIndex, so a packed handle is the correct, complete input here.</span>
    <span class="tok-kw">const</span> picked: phys.BodyHandle = phys.BodyHandle.<span class="tok-fn">pack</span>(<span class="tok-builtin">@intCast</span>(bi), <span class="tok-num">0</span>);
    _ = phys.<span class="tok-fn">createMotorJoint</span>(&amp;s.world, .{
        .base = .{
            .body_a = anchor,
            .body_b = picked,
            .local_frame_a = Transform2.identity,
            .local_frame_b = .{ .p = grab_local, .q = Rot2.identity },
        },
        .linear_hertz = <span class="tok-num">6.0</span>,
        .linear_damping_ratio = <span class="tok-num">0.7</span>,
        .max_spring_force = <span class="tok-num">1000.0</span> * mass,
    }) <span class="tok-kw">catch</span> {
        phys.<span class="tok-fn">destroyBody</span>(&amp;s.world, anchor);
        <span class="tok-kw">return</span>;
    };
    s.drag = .{ .anchor = anchor, .picked = bi, .grab_local = grab_local };
}

<span class="tok-kw">fn</span> <span class="tok-fn">endDrag</span>(s: *State) void {
    <span class="tok-kw">if</span> (s.drag) |dg| {
        phys.<span class="tok-fn">destroyBody</span>(&amp;s.world, dg.anchor); <span class="tok-comment">// frees the owned motor joint too</span>
        s.drag = null;
    }
}

<span class="tok-comment">/// Wraps a child allocator and tracks live bytes of everything allocated through it. Both the</span>
<span class="tok-comment">/// physics world AND the UI host are routed through it, so the "heap" HUD line is the demo's whole</span>
<span class="tok-comment">/// tracked Zig-heap footprint - no per-subsystem blind spot (the UI path being untracked is what</span>
<span class="tok-comment">/// let the zimr404 frame-arena leak hide). The "wasm total" HUD line is the ground-truth global</span>
<span class="tok-comment">/// (every page, incl. untracked GPU/interop); a climb there with this flat localises a leak.</span>
<span class="tok-comment">/// Heap-allocated (initState) so its self-pointer stays stable regardless of where State lives.</span>
<span class="tok-kw">const</span> CountingAllocator = <span class="tok-kw">struct</span> {
    child: Allocator,
    bytes: usize = <span class="tok-num">0</span>,
    peak: usize = <span class="tok-num">0</span>,

    <span class="tok-kw">fn</span> <span class="tok-fn">allocator</span>(self: *CountingAllocator) Allocator {
        <span class="tok-kw">return</span> .{ .ptr = self, .vtable = &amp;vtable };
    }
    <span class="tok-kw">const</span> vtable: Allocator.VTable = .{
        .alloc = allocImpl,
        .resize = resizeImpl,
        .remap = remapImpl,
        .free = freeImpl,
    };
    <span class="tok-kw">fn</span> <span class="tok-fn">bump</span>(self: *CountingAllocator) void {
        <span class="tok-kw">if</span> (self.bytes &gt; self.peak) {
            self.peak = self.bytes;
        }
    }
    <span class="tok-kw">fn</span> <span class="tok-fn">allocImpl</span>(
        ctx: *anyopaque,
        len: usize,
        alignment: std.mem.Alignment,
        ret_addr: usize,
    ) ?[*]u8 {
        <span class="tok-kw">const</span> self: *CountingAllocator = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(ctx));
        <span class="tok-kw">const</span> p: [*]u8 = self.child.vtable.<span class="tok-fn">alloc</span>(self.child.ptr, len, alignment, ret_addr) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> null;
        self.bytes += len;
        self.<span class="tok-fn">bump</span>();
        <span class="tok-kw">return</span> p;
    }
    <span class="tok-kw">fn</span> <span class="tok-fn">resizeImpl</span>(
        ctx: *anyopaque,
        buf: []u8,
        alignment: std.mem.Alignment,
        new_len: usize,
        ret_addr: usize,
    ) bool {
        <span class="tok-kw">const</span> self: *CountingAllocator = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(ctx));
        <span class="tok-kw">if</span> (self.child.vtable.<span class="tok-fn">resize</span>(self.child.ptr, buf, alignment, new_len, ret_addr) == false) {
            <span class="tok-kw">return</span> false;
        }
        self.bytes = self.bytes + new_len - buf.len;
        self.<span class="tok-fn">bump</span>();
        <span class="tok-kw">return</span> true;
    }
    <span class="tok-kw">fn</span> <span class="tok-fn">remapImpl</span>(
        ctx: *anyopaque,
        buf: []u8,
        alignment: std.mem.Alignment,
        new_len: usize,
        ret_addr: usize,
    ) ?[*]u8 {
        <span class="tok-kw">const</span> self: *CountingAllocator = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(ctx));
        <span class="tok-kw">const</span> p: ?[*]u8 = self.child.vtable.<span class="tok-fn">remap</span>(self.child.ptr, buf, alignment, new_len, ret_addr);
        <span class="tok-kw">if</span> (p != null) {
            self.bytes = self.bytes + new_len - buf.len;
            self.<span class="tok-fn">bump</span>();
        }
        <span class="tok-kw">return</span> p;
    }
    <span class="tok-kw">fn</span> <span class="tok-fn">freeImpl</span>(
        ctx: *anyopaque,
        buf: []u8,
        alignment: std.mem.Alignment,
        ret_addr: usize,
    ) void {
        <span class="tok-kw">const</span> self: *CountingAllocator = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(ctx));
        self.child.vtable.<span class="tok-fn">free</span>(self.child.ptr, buf, alignment, ret_addr);
        self.bytes -= buf.len;
    }
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    mem: *CountingAllocator,
    ui_host: z.UiHost,
    font: z.Font,
    world: phys.World,
    cam: render.Camera2D = .{ .flip_y = true },
    current_scene: usize = <span class="tok-num">0</span>,
    cat_index: usize = <span class="tok-num">0</span>,
    scene_state: scenes.SceneState = .{},
    time: f32 = <span class="tok-num">0</span>,
    phys_accum: f32 = <span class="tok-num">0</span>,
    paused: bool = false,
    draw_joints: bool = false,
    draw_aabbs: bool = false,
    draw_contacts: bool = false,
    drag: ?Drag = null,
    <span class="tok-comment">// On-screen control-button held state (set during UI build, read by `control` scenes).</span>
    btn: scenes.SceneInput = .{},
    <span class="tok-comment">// Smoothed perf readout (exponential moving averages over recent frames).</span>
    perf_frame_ms: f32 = <span class="tok-num">0</span>,
    perf_phys_ms: f32 = <span class="tok-num">0</span>,
    perf_draw_ms: f32 = <span class="tok-num">0</span>,
    perf_substeps: u32 = <span class="tok-num">0</span>,
    <span class="tok-comment">// World snapshot for the Determinism|SnapShot scene (host-driven capture/restore loop).</span>
    snap: ?phys.WorldSnapshot = null,
};

<span class="tok-kw">fn</span> <span class="tok-fn">loadScene</span>(s: *State, idx: usize) !void {
    s.drag = null; <span class="tok-comment">// old anchor/joint die with the old world</span>
    <span class="tok-kw">if</span> (s.snap) |*sn| {
        sn.<span class="tok-fn">deinit</span>(s.mem.<span class="tok-fn">allocator</span>());
        s.snap = null;
    }
    s.world.<span class="tok-fn">deinit</span>(s.mem.<span class="tok-fn">allocator</span>());
    s.world = <span class="tok-kw">try</span> phys.World.<span class="tok-fn">init</span>(s.mem.<span class="tok-fn">allocator</span>(), world_capacity);
    s.world.settings.gravity = .{ <span class="tok-num">0</span>, -<span class="tok-num">10</span> };
    s.current_scene = idx;
    s.cat_index = scenes.<span class="tok-fn">categoryIndex</span>(scenes.list[idx].category);
    s.phys_accum = <span class="tok-num">0</span>;
    s.scene_state = .{};
    s.btn = .{};
    <span class="tok-kw">const</span> sc: scenes.Scene = scenes.list[idx];
    <span class="tok-kw">if</span> (sc.build_s) |f| {
        <span class="tok-kw">try</span> <span class="tok-fn">f</span>(&amp;s.world, &amp;s.scene_state);
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (sc.build) |f| {
        <span class="tok-kw">try</span> <span class="tok-fn">f</span>(&amp;s.world);
    }
    <span class="tok-comment">// Per-scene camera framing (default when the scene gives no hint).</span>
    <span class="tok-kw">if</span> (scenes.list[idx].cam) |ch| {
        s.cam.target = ch.target;
        s.cam.zoom = ch.ppm;
    } <span class="tok-kw">else</span> {
        s.cam.target = .{ <span class="tok-num">0</span>, <span class="tok-num">4.5</span> };
        s.cam.zoom = <span class="tok-num">34</span>;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    <span class="tok-kw">const</span> mem: *CountingAllocator = <span class="tok-kw">try</span> gpa.<span class="tok-fn">create</span>(CountingAllocator);
    mem.* = .{ .child = gpa };
    <span class="tok-kw">var</span> world: phys.World = <span class="tok-kw">try</span> phys.World.<span class="tok-fn">init</span>(mem.<span class="tok-fn">allocator</span>(), world_capacity);
    world.settings.gravity = .{ <span class="tok-num">0</span>, -<span class="tok-num">10</span> };
    <span class="tok-kw">try</span> scenes.list[<span class="tok-num">0</span>].build.?(&amp;world);
    s.* = .{
        .gpa = gpa,
        .mem = mem,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(mem.<span class="tok-fn">allocator</span>(), font),
        .font = font,
        .world = world,
        .cam = .{ .target = .{ <span class="tok-num">0</span>, <span class="tok-num">4.5</span> }, .zoom = <span class="tok-num">34</span>, .flip_y = true },
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    <span class="tok-kw">if</span> (s.snap) |*sn| {
        sn.<span class="tok-fn">deinit</span>(s.mem.<span class="tok-fn">allocator</span>());
        s.snap = null;
    }
    s.world.<span class="tok-fn">deinit</span>(s.mem.<span class="tok-fn">allocator</span>());
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">destroy</span>(s.mem);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, backdrop);
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    s.cam.offset = .{ f.window.<span class="tok-fn">widthf</span>() * <span class="tok-num">0.5</span>, f.window.<span class="tok-fn">heightf</span>() * <span class="tok-num">0.5</span> };

    <span class="tok-comment">// Pointer drag (mouse or primary touch). Resolve the pointer in world space, then</span>
    <span class="tok-comment">// begin / move / end the soft drag *before* stepping so the solver sees the new</span>
    <span class="tok-comment">// target this frame. wantCaptureMouse() keeps clicks on the UI from grabbing.</span>
    <span class="tok-kw">const</span> pointer_world: Vec2 = s.cam.<span class="tok-fn">screenToWorld</span>(z.<span class="tok-fn">getMousePosition</span>(f.input));
    <span class="tok-kw">if</span> (s.drag != null) {
        <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left)) {
            phys.<span class="tok-fn">setTransform</span>(&amp;s.world, s.drag.?.anchor, pointer_world, Rot2.identity) <span class="tok-kw">catch</span>
                <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
        } <span class="tok-kw">else</span> {
            <span class="tok-fn">endDrag</span>(s);
        }
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left) <span class="tok-kw">and</span> !u.<span class="tok-fn">wantCaptureMouse</span>()) {
        <span class="tok-fn">beginDrag</span>(s, pointer_world);
    }

    <span class="tok-comment">// Fixed-timestep accumulator: box2d's TGS-Soft solver wants a constant dt, so we</span>
    <span class="tok-comment">// owe the solver real seconds and pay them off in 1/60 chunks (capped so a long</span>
    <span class="tok-comment">// stall can't spiral the loop).</span>
    <span class="tok-kw">if</span> (!s.paused) {
        <span class="tok-kw">const</span> phys_t0: f64 = z.wgpu.<span class="tok-fn">nowMs</span>();
        <span class="tok-comment">// Interactive scenes read input once per frame (not per sub-step) so impulse</span>
        <span class="tok-comment">// actions like jump fire exactly once per press. Input = on-screen buttons OR keys.</span>
        <span class="tok-kw">const</span> sc_ctl: scenes.Scene = scenes.list[s.current_scene];
        <span class="tok-kw">if</span> (sc_ctl.control) |hook| {
            <span class="tok-kw">const</span> in: scenes.SceneInput = .{
                .left = s.btn.left <span class="tok-kw">or</span> z.<span class="tok-fn">isKeyDown</span>(f.input, .left),
                .right = s.btn.right <span class="tok-kw">or</span> z.<span class="tok-fn">isKeyDown</span>(f.input, .right),
                .up = s.btn.up <span class="tok-kw">or</span> z.<span class="tok-fn">isKeyDown</span>(f.input, .up),
                .down = s.btn.down <span class="tok-kw">or</span> z.<span class="tok-fn">isKeyDown</span>(f.input, .down),
                .action = s.btn.action <span class="tok-kw">or</span> z.<span class="tok-fn">isKeyDown</span>(f.input, .space),
            };
            <span class="tok-fn">hook</span>(&amp;s.world, &amp;s.scene_state, in);
        }
        <span class="tok-kw">var</span> steps_run: u32 = <span class="tok-num">0</span>;
        <span class="tok-comment">// Spiral-of-death guard: cap how much sim time a single frame may demand. Above ~30fps the</span>
        <span class="tok-comment">// frame's real dt is under this cap and the sim runs real-time; once a frame takes longer</span>
        <span class="tok-comment">// than 1/30s the surplus is dropped and the world runs in slow motion instead of trying to</span>
        <span class="tok-comment">// catch up (which would only fall further behind). 1/30s of sim is at most two fixed steps.</span>
        <span class="tok-kw">const</span> max_frame_dt: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">30.0</span>;
        s.phys_accum += <span class="tok-fn">clamp</span>(f.time.delta_time, <span class="tok-num">0.0</span>, max_frame_dt);
        <span class="tok-kw">var</span> guard: u32 = <span class="tok-num">0</span>;
        <span class="tok-comment">// 1/30s of sim time is at most two fixed 1/60 steps, so two is also the hard substep cap:</span>
        <span class="tok-comment">// once a frame can't be served in two steps the world slows down rather than spiraling.</span>
        <span class="tok-kw">while</span> (s.phys_accum &gt;= fixed_dt <span class="tok-kw">and</span> guard &lt; <span class="tok-num">2</span>) : (guard += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> sc: scenes.Scene = scenes.list[s.current_scene];
            <span class="tok-kw">if</span> (sc.update_s) |hook| {
                <span class="tok-fn">hook</span>(&amp;s.world, &amp;s.scene_state);
            } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (sc.update) |hook| {
                <span class="tok-fn">hook</span>(&amp;s.world);
            }
            phys.<span class="tok-fn">step</span>(&amp;s.world, fixed_dt) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
            s.phys_accum -= fixed_dt;
            steps_run += <span class="tok-num">1</span>;

            <span class="tok-comment">// Determinism|SnapShot: capture a checkpoint once the scene has begun to settle,</span>
            <span class="tok-comment">// then restore it on a loop so the world visibly snaps back to the captured frame.</span>
            <span class="tok-kw">if</span> (sc.auto_snapshot) {
                s.scene_state.u[<span class="tok-num">0</span>] += <span class="tok-num">1</span>;
                <span class="tok-kw">const</span> tick: u32 = s.scene_state.u[<span class="tok-num">0</span>];
                <span class="tok-kw">if</span> (tick == snapshot_capture_step <span class="tok-kw">and</span> s.snap == null) {
                    s.snap = phys.<span class="tok-fn">snapshot</span>(&amp;s.world, s.mem.<span class="tok-fn">allocator</span>()) <span class="tok-kw">catch</span> null;
                } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (tick &gt;= snapshot_restore_step) {
                    <span class="tok-kw">if</span> (s.snap) |*sn| {
                        phys.<span class="tok-fn">restore</span>(&amp;s.world, s.mem.<span class="tok-fn">allocator</span>(), sn) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
                    }

                }
            }
        }

    <span class="tok-comment">// Draw the world under the UI via the DebugDraw-&gt;DrawList adapter.</span>

    phys.<span class="tok-fn">draw</span>(&amp;s.world, &amp;dd) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
    s.perf_draw_ms += (<span class="tok-builtin">@as</span>(f32, <span class="tok-builtin">@floatCast</span>(z.wgpu.<span class="tok-fn">nowMs</span>() - draw_t0)) - s.perf_draw_ms) * <span class="tok-num">0.15</span>;
    s.perf_frame_ms += (f.time.delta_time * <span class="tok-num">1000.0</span> - s.perf_frame_ms) * <span class="tok-num">0.15</span>;

    <span class="tok-comment">// Drag leash: a line from the grabbed point on the body to the pointer.</span>
    <span class="tok-kw">if</span> (s.drag) |dg| {
        <span class="tok-kw">const</span> b: *<span class="tok-kw">const</span> phys.Body = &amp;s.world.bodies.data[dg.picked];
        <span class="tok-kw">const</span> grab_world: Vec2 = <span class="tok-fn">transformPoint2</span>(b.transform, dg.grab_local);

        <span class="tok-kw">const</span> p_px: Vec2 = s.cam.<span class="tok-fn">worldToScreen</span>(pointer_world);
        bg.<span class="tok-fn">addLine</span>(a_px, p_px, leash_color, <span class="tok-num">2</span>);
        bg.<span class="tok-fn">addCircleFilled</span>(a_px, <span class="tok-num">4</span>, leash_color);
        bg.<span class="tok-fn">addCircleFilled</span>(p_px, <span class="tok-num">5</span>, leash_color);
    }

    <span class="tok-comment">// Collision-lab visualiser: if the active scene has a `lab` fn, run it (the world</span>
    <span class="tok-comment">// is static; the pointer is the probe). Drawn on top of the geometry.</span>
    <span class="tok-kw">if</span> (scenes.list[s.current_scene].lab) |labfn| {

        <span class="tok-kw">var</span> lab_ctx: render.LabCtx = .{

    <span class="tok-comment">// Control window.</span>
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"zimrphysics2d"</span>, .{
        .initial_pos = .{ <span class="tok-num">16</span>, <span class="tok-num">16</span> },

    })) |win| {
        <span class="tok-kw">defer</span> win.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Scene {d}/{d}"</span>, .{ s.current_scene + <span class="tok-num">1</span>, scenes.list.len });
        <span class="tok-comment">// Live perf readout - the device is the only honest profiler for the wasm build.</span>

            <span class="tok-kw">const</span> n: usize = z.profiler.<span class="tok-fn">aggregate</span>(&amp;stats);
            <span class="tok-kw">for</span> (stats[<span class="tok-num">0</span>..n]) |st| {

        u.<span class="tok-fn">text</span>(<span class="tok-str">"heap {d} KB  peak {d} KB"</span>, .{ s.mem.bytes / <span class="tok-num">1024</span>, s.mem.peak / <span class="tok-num">1024</span> });
        <span class="tok-comment">// Total wasm linear memory (everything, not just the world) - climbs toward the cap if</span>

        <span class="tok-comment">// Prev/Next walk the whole list and cross category boundaries automatically</span>

        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"&lt; Prev"</span>, nav)) {

        }

        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"reset scene"</span>, .{})) {
            <span class="tok-fn">loadScene</span>(s, s.current_scene) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});

    <span class="tok-comment">// Big on-screen control pad for interactive scenes - a separate window anchored to the</span>
    <span class="tok-comment">// bottom-centre of the canvas (outside the main panel) so it's thumb-reachable on a phone.</span>

        u.<span class="tok-fn">setNextWindowSize</span>(.{ win_w, win_h }, .{});

            u.<span class="tok-fn">sameLine</span>(.{});

            u.<span class="tok-fn">sameLine</span>(.{});

    }

<figure class="code src-file" data-path="examples/zimrphysics2d_demo/render.zig" data-lines="322"><figcaption><span>examples/zimrphysics2d_demo/render.zig</span><span>322 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! render.zig - visualize a `zimrphysics2d` World by adapting the engine's</span>
<span class="tok-comment">//! box2d-faithful DebugDraw callbacks into zimr's batched `ui.DrawList`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Why this shape: the engine already walks the world (`phys.draw`) and fires one</span>
<span class="tok-comment">//! callback per primitive - every shape, joint, contact, and AABB it can emit. We</span>
<span class="tok-comment">//! supply ~10 small callbacks that push into a DrawList; the demo never switches on</span>
<span class="tok-comment">//! shape type, so any new primitive the engine learns to draw lights up here for</span>
<span class="tok-comment">//! free. ImDrawList batches all of it into a handful of GPU draw calls, so "draw the</span>
<span class="tok-comment">//! whole world" is a couple of vertex buffers, not a draw call per body.</span>

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> phys = z.zimrphysics2d;

<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Transform2 = zm.Transform2;
<span class="tok-kw">const</span> transformPoint2 = zm.transformPoint2;
<span class="tok-kw">const</span> rotateVec2 = zm.rotateVec2;

<span class="tok-comment">/// World(metres) -&gt; screen(pixels). Physics is Y-up; the screen is Y-down, so the</span>
<span class="tok-comment">/// vertical axis flips. `target` is the world point parked at the screen centre and</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Camera2D = zm.Camera2D;

<span class="tok-comment">/// Forwarded to every DebugDraw callback through `DebugDraw.context`.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> DrawCtx = <span class="tok-kw">struct</span> {
    dl: ui.DrawListHandle,
    cam: Camera2D,
};

<span class="tok-comment">/// Context handed to a scene's optional `lab` fn each frame: the world to query, a draw</span>
<span class="tok-comment">/// list + camera, and the pointer as an interactive probe. Draw helpers take WORLD coords.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> LabCtx = <span class="tok-kw">struct</span> {
    world: *phys.World,
    dl: ui.DrawListHandle,
    cam: Camera2D,
    pointer: Vec2,
    pointer_down: bool,
    time: f32,

    <span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">line</span>(
        self: LabCtx,
        a: Vec2,
        b: Vec2,
        col: Color,
        thick: f32,
    ) void {
        self.dl.<span class="tok-fn">addLine</span>(self.cam.<span class="tok-fn">worldToScreen</span>(a), self.cam.<span class="tok-fn">worldToScreen</span>(b), col, thick);
    }

    <span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">mark</span>(self: LabCtx, p: Vec2, r_px: f32, col: Color) void {
        self.dl.<span class="tok-fn">addCircleFilled</span>(self.cam.<span class="tok-fn">worldToScreen</span>(p), r_px, col);
    }

    <span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">ring</span>(
        self: LabCtx,
        c: Vec2,
        r_world: f32,
        col: Color,
        thick: f32,
    ) void {
        self.dl.<span class="tok-fn">addCircle</span>(self.cam.<span class="tok-fn">worldToScreen</span>(c), r_world * self.cam.zoom, col, thick);
    }

    <span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">rect</span>(
        self: LabCtx,
        lo: Vec2,
        hi: Vec2,
        col: Color,
        thick: f32,
    ) void {
        self.<span class="tok-fn">line</span>(.{ lo[<span class="tok-num">0</span>], lo[<span class="tok-num">1</span>] }, .{ hi[<span class="tok-num">0</span>], lo[<span class="tok-num">1</span>] }, col, thick);
        self.<span class="tok-fn">line</span>(.{ hi[<span class="tok-num">0</span>], lo[<span class="tok-num">1</span>] }, .{ hi[<span class="tok-num">0</span>], hi[<span class="tok-num">1</span>] }, col, thick);
        self.<span class="tok-fn">line</span>(.{ hi[<span class="tok-num">0</span>], hi[<span class="tok-num">1</span>] }, .{ lo[<span class="tok-num">0</span>], hi[<span class="tok-num">1</span>] }, col, thick);
        self.<span class="tok-fn">line</span>(.{ lo[<span class="tok-num">0</span>], hi[<span class="tok-num">1</span>] }, .{ lo[<span class="tok-num">0</span>], lo[<span class="tok-num">1</span>] }, col, thick);
    }

    <span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">arrow</span>(
        self: LabCtx,
        a: Vec2,
        b: Vec2,
        col: Color,
        thick: f32,
    ) void {
        self.<span class="tok-fn">line</span>(a, b, col, thick);
        <span class="tok-kw">const</span> dx: f32 = b[<span class="tok-num">0</span>] - a[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = b[<span class="tok-num">1</span>] - a[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> mag: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (mag &lt; <span class="tok-num">1.0e-4</span>) {
            <span class="tok-kw">return</span>;
        }
        <span class="tok-kw">const</span> ux: f32 = dx / mag;
        <span class="tok-kw">const</span> uy: f32 = dy / mag;
        <span class="tok-kw">const</span> hl: f32 = <span class="tok-num">0.3</span>;
        <span class="tok-kw">const</span> hw: f32 = <span class="tok-num">0.16</span>;
        <span class="tok-kw">const</span> bx: f32 = b[<span class="tok-num">0</span>] - ux * hl;
        <span class="tok-kw">const</span> by: f32 = b[<span class="tok-num">1</span>] - uy * hl;
        self.<span class="tok-fn">line</span>(.{ b[<span class="tok-num">0</span>], b[<span class="tok-num">1</span>] }, .{ bx - uy * hw, by + ux * hw }, col, thick);
        self.<span class="tok-fn">line</span>(.{ b[<span class="tok-num">0</span>], b[<span class="tok-num">1</span>] }, .{ bx + uy * hw, by - ux * hw }, col, thick);
    }
};

<span class="tok-kw">fn</span> <span class="tok-fn">ctxOf</span>(p: *anyopaque) *DrawCtx {
    <span class="tok-kw">return</span> <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(p));
}

<span class="tok-comment">/// 0xRRGGBB -&gt; opaque colour. box2d hands us 24-bit hex (b2HexColor).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">hex</span>(c: phys.HexColor) Color {
    <span class="tok-kw">const</span> r: u8 = <span class="tok-builtin">@intCast</span>((c &gt;&gt; <span class="tok-num">16</span>) &amp; <span class="tok-num">0xFF</span>);
    <span class="tok-kw">const</span> g: u8 = <span class="tok-builtin">@intCast</span>((c &gt;&gt; <span class="tok-num">8</span>) &amp; <span class="tok-num">0xFF</span>);
    <span class="tok-kw">const</span> b: u8 = <span class="tok-builtin">@intCast</span>(c &amp; <span class="tok-num">0xFF</span>);
    <span class="tok-kw">return</span> .{ .r = r, .g = g, .b = b, .a = <span class="tok-num">255</span> };
}

<span class="tok-kw">fn</span> <span class="tok-fn">withAlpha</span>(c: Color, a: u8) Color {
    <span class="tok-kw">return</span> .{ .r = c.r, .g = c.g, .b = c.b, .a = a };
}

<span class="tok-kw">const</span> fill_alpha: u8 = <span class="tok-num">200</span>;
<span class="tok-kw">const</span> edge_thickness: f32 = <span class="tok-num">1.5</span>;

<span class="tok-kw">fn</span> <span class="tok-fn">drawSolidPolygon</span>(
    transform: Transform2,
    vertices: []<span class="tok-kw">const</span> Vec2,
    radius: f32,
    color: phys.HexColor,
    ctx: *anyopaque,
) void {
    _ = radius;
    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);
    <span class="tok-kw">var</span> buf: [phys.max_polygon_vertices]Vec2 = undefined;
    <span class="tok-kw">const</span> n: usize = vertices.len;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        buf[i] = c.cam.<span class="tok-fn">worldToScreen</span>(<span class="tok-fn">transformPoint2</span>(transform, vertices[i]));
    }
    <span class="tok-kw">const</span> edge: Color = <span class="tok-fn">hex</span>(color);
    c.dl.<span class="tok-fn">addPolygon</span>(buf[<span class="tok-num">0</span>..n], <span class="tok-fn">withAlpha</span>(edge, fill_alpha));
    c.dl.<span class="tok-fn">addPolyline</span>(buf[<span class="tok-num">0</span>..n], edge, edge_thickness, true);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPolygon</span>(
    transform: Transform2,
    vertices: []<span class="tok-kw">const</span> Vec2,
    color: phys.HexColor,
    ctx: *anyopaque,
) void {
    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);
    <span class="tok-kw">var</span> buf: [phys.max_polygon_vertices]Vec2 = undefined;
    <span class="tok-kw">const</span> n: usize = vertices.len;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        buf[i] = c.cam.<span class="tok-fn">worldToScreen</span>(<span class="tok-fn">transformPoint2</span>(transform, vertices[i]));
    }
    c.dl.<span class="tok-fn">addPolyline</span>(buf[<span class="tok-num">0</span>..n], <span class="tok-fn">hex</span>(color), edge_thickness, true);

<span class="tok-kw">fn</span> <span class="tok-fn">drawSolidCircle</span>(
    transform: Transform2,
    center: Vec2,
    radius: f32,
    color: phys.HexColor,
    ctx: *anyopaque,
) void {
    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);
    <span class="tok-kw">const</span> world_center: Vec2 = <span class="tok-fn">transformPoint2</span>(transform, center);
    <span class="tok-kw">const</span> screen_center: Vec2 = c.cam.<span class="tok-fn">worldToScreen</span>(world_center);
    <span class="tok-kw">const</span> r_px: f32 = radius * c.cam.zoom;
    <span class="tok-kw">const</span> edge: Color = <span class="tok-fn">hex</span>(color);
    c.dl.<span class="tok-fn">addCircleFilled</span>(screen_center, r_px, <span class="tok-fn">withAlpha</span>(edge, fill_alpha));
    c.dl.<span class="tok-fn">addCircle</span>(screen_center, r_px, edge, edge_thickness);
    <span class="tok-comment">// A spoke to the rim along the body's local +x, so spin is legible.</span>
    <span class="tok-kw">const</span> rim: Vec2 = world_center + <span class="tok-fn">rotateVec2</span>(transform.q, .{ radius, <span class="tok-num">0.0</span> });
    c.dl.<span class="tok-fn">addLine</span>(screen_center, c.cam.<span class="tok-fn">worldToScreen</span>(rim), edge, edge_thickness);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawCircle</span>(
    center: Vec2,
    radius: f32,
    color: phys.HexColor,
    ctx: *anyopaque,

    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);

    c.dl.<span class="tok-fn">addCircle</span>(screen_center, radius * c.cam.zoom, <span class="tok-fn">hex</span>(color), edge_thickness);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawSolidCapsule</span>(
    p1: Vec2,
    p2: Vec2,
    radius: f32,
    color: phys.HexColor,
    ctx: *anyopaque,
) void {
    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);
    <span class="tok-kw">const</span> r_px: f32 = radius * c.cam.zoom;
    <span class="tok-kw">const</span> edge: Color = <span class="tok-fn">hex</span>(color);
    <span class="tok-kw">const</span> fill: Color = <span class="tok-fn">withAlpha</span>(edge, fill_alpha);
    <span class="tok-kw">const</span> s1: Vec2 = c.cam.<span class="tok-fn">worldToScreen</span>(p1);
    <span class="tok-kw">const</span> s2: Vec2 = c.cam.<span class="tok-fn">worldToScreen</span>(p2);
    <span class="tok-comment">// Stadium = two end discs + the body rectangle. Offset each endpoint by the</span>
    <span class="tok-comment">// screen-space normal x r to get the rectangle's four corners.</span>
    <span class="tok-kw">const</span> d: Vec2 = .{ s2[<span class="tok-num">0</span>] - s1[<span class="tok-num">0</span>], s2[<span class="tok-num">1</span>] - s1[<span class="tok-num">1</span>] };
    <span class="tok-kw">const</span> len_px: f32 = <span class="tok-builtin">@sqrt</span>(d[<span class="tok-num">0</span>] * d[<span class="tok-num">0</span>] + d[<span class="tok-num">1</span>] * d[<span class="tok-num">1</span>]);
    <span class="tok-kw">const</span> inv: f32 = <span class="tok-kw">if</span> (len_px &gt; <span class="tok-num">1.0e-6</span>) <span class="tok-num">1.0</span> / len_px <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
    <span class="tok-kw">const</span> nrm: Vec2 = .{ -d[<span class="tok-num">1</span>] * inv * r_px, d[<span class="tok-num">0</span>] * inv * r_px };
    <span class="tok-kw">const</span> a: Vec2 = .{ s1[<span class="tok-num">0</span>] + nrm[<span class="tok-num">0</span>], s1[<span class="tok-num">1</span>] + nrm[<span class="tok-num">1</span>] };
    <span class="tok-kw">const</span> b: Vec2 = .{ s2[<span class="tok-num">0</span>] + nrm[<span class="tok-num">0</span>], s2[<span class="tok-num">1</span>] + nrm[<span class="tok-num">1</span>] };
    <span class="tok-kw">const</span> e: Vec2 = .{ s2[<span class="tok-num">0</span>] - nrm[<span class="tok-num">0</span>], s2[<span class="tok-num">1</span>] - nrm[<span class="tok-num">1</span>] };
    <span class="tok-kw">const</span> g: Vec2 = .{ s1[<span class="tok-num">0</span>] - nrm[<span class="tok-num">0</span>], s1[<span class="tok-num">1</span>] - nrm[<span class="tok-num">1</span>] };
    c.dl.<span class="tok-fn">addCircleFilled</span>(s1, r_px, fill);
    c.dl.<span class="tok-fn">addCircleFilled</span>(s2, r_px, fill);
    c.dl.<span class="tok-fn">addQuadFilled</span>(a, b, e, g, fill);
    c.dl.<span class="tok-fn">addLine</span>(a, b, edge, edge_thickness);
    c.dl.<span class="tok-fn">addLine</span>(g, e, edge, edge_thickness);
    c.dl.<span class="tok-fn">addCircle</span>(s1, r_px, edge, edge_thickness);
    c.dl.<span class="tok-fn">addCircle</span>(s2, r_px, edge, edge_thickness);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawLine</span>(
    p1: Vec2,
    p2: Vec2,
    color: phys.HexColor,
    ctx: *anyopaque,
) void {
    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);
    c.dl.<span class="tok-fn">addLine</span>(c.cam.<span class="tok-fn">worldToScreen</span>(p1), c.cam.<span class="tok-fn">worldToScreen</span>(p2), <span class="tok-fn">hex</span>(color), edge_thickness);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPoint</span>(
    p: Vec2,
    size: f32,
    color: phys.HexColor,
    ctx: *anyopaque,
) void {
    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);
    <span class="tok-comment">// `size` is already in pixels (box2d convention). Draw a small filled SQUARE rather than a</span>
    <span class="tok-comment">// tessellated circle: drawPoly emits each circle as N quads (a 12-gon = 48 verts / 72 indices),</span>
    <span class="tok-comment">// and a dense scene's contact overlay has tens of thousands of points - Benchmark|Barrel 2.4</span>
    <span class="tok-comment">// peaks at ~26K manifold points, which as circles is ~1.4M verts and overruns the 2D ring. A</span>
    <span class="tok-comment">// square is 4 verts / 6 indices (~12x cheaper) and reads the same at debug-dot sizes.</span>
    <span class="tok-kw">const</span> sp: Vec2 = c.cam.<span class="tok-fn">worldToScreen</span>(p);
    <span class="tok-kw">const</span> h: f32 = size * <span class="tok-num">0.5</span>;
    c.dl.<span class="tok-fn">addRectFilled</span>(
        .{ .x = sp[<span class="tok-num">0</span>] - h, .y = sp[<span class="tok-num">1</span>] - h, .width = size, .height = size },
        <span class="tok-fn">hex</span>(color),
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawTransform</span>(
    transform: Transform2,
    ctx: *anyopaque,
) void {
    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);
    <span class="tok-kw">const</span> axis_len: f32 = <span class="tok-num">0.4</span>;
    <span class="tok-kw">const</span> origin: Vec2 = c.cam.<span class="tok-fn">worldToScreen</span>(transform.p);
    <span class="tok-kw">const</span> xend: Vec2 = transform.p + <span class="tok-fn">rotateVec2</span>(transform.q, .{ axis_len, <span class="tok-num">0.0</span> });
    <span class="tok-kw">const</span> yend: Vec2 = transform.p + <span class="tok-fn">rotateVec2</span>(transform.q, .{ <span class="tok-num">0.0</span>, axis_len });
    <span class="tok-kw">const</span> x_col: Color = .{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">60</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-kw">const</span> y_col: Color = .{ .r = <span class="tok-num">60</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> };
    c.dl.<span class="tok-fn">addLine</span>(origin, c.cam.<span class="tok-fn">worldToScreen</span>(xend), x_col, edge_thickness);
    c.dl.<span class="tok-fn">addLine</span>(origin, c.cam.<span class="tok-fn">worldToScreen</span>(yend), y_col, edge_thickness);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawString</span>(
    p: Vec2,
    s: []<span class="tok-kw">const</span> u8,
    color: phys.HexColor,

    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);
    c.dl.<span class="tok-fn">addText</span>(s, c.cam.<span class="tok-fn">worldToScreen</span>(p), <span class="tok-num">13</span>, <span class="tok-fn">hex</span>(color));
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawAabb</span>(
    aabb: phys.Aabb2,
    color: phys.HexColor,
    ctx: *anyopaque,

    <span class="tok-kw">const</span> c: *DrawCtx = <span class="tok-fn">ctxOf</span>(ctx);

    <span class="tok-kw">const</span> pts: [<span class="tok-num">4</span>]Vec2 = .{

}

<span class="tok-comment">/// Scratch state a scene may carry across frames (handles created in build, used in update).</span>
<span class="tok-comment">/// Generic slots keep the Scene API uniform without a typed payload per scene.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> SceneState = <span class="tok-kw">struct</span> {

    joint: [<span class="tok-num">8</span>]phys.JointHandle = undefined,
    u: [<span class="tok-num">4</span>]u32 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    f: [<span class="tok-num">4</span>]f32 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
};

<span class="tok-comment">/// Abstract player input for the interactive scenes, mapped by the host from both the</span>
<span class="tok-comment">/// on-screen button cluster (phone) and the arrow keys + space (keyboard). A scene reads</span>
<span class="tok-comment">/// whichever fields it cares about. Held state: true for every frame the control is down.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> SceneInput = <span class="tok-kw">struct</span> {
    left: bool = false,
    right: bool = false,
    up: bool = false,
    down: bool = false,
    action: bool = false,
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Scene = <span class="tok-kw">struct</span> {
    category: []<span class="tok-kw">const</span> u8,
    name: []<span class="tok-kw">const</span> u8,
    <span class="tok-comment">/// Stateless build (most scenes). Provide exactly one of `build` or `build_s`.</span>
    build: ?*<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (world: *phys.World) anyerror!void = null,
    <span class="tok-comment">/// Stateful build: may stash handles/counters in `st` for `update_s`.</span>
    build_s: ?*<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (world: *phys.World, st: *SceneState) anyerror!void = null,
    update: ?*<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (world: *phys.World) void = null,
    update_s: ?*<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (world: *phys.World, st: *SceneState) void = null,
    <span class="tok-comment">/// Interactive per-frame hook: like `update_s` but also receives player input. Runs once</span>
    <span class="tok-comment">/// per frame (not per sub-step) so impulse actions like jump fire once per press.</span>
    control: ?*<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (world: *phys.World, st: *SceneState, in: SceneInput) void = null,
    <span class="tok-comment">/// Collision-lab visualiser: queries the world and draws, with the pointer as a probe.</span>
    lab: ?*<span class="tok-kw">const</span> <span class="tok-kw">fn</span> (ctx: *render.LabCtx) void = null,
    <span class="tok-comment">/// Drive the world snapshot/restore demo: the host captures a checkpoint a little way in</span>
    <span class="tok-comment">/// and restores it on a loop, so the world visibly jumps back. box2d Determinism|SnapShot.</span>
    auto_snapshot: bool = false,
    cam: ?CamHint = null,
};

<span class="tok-kw">const</span> Body = <span class="tok-kw">struct</span> {
    x: f32 = <span class="tok-num">0</span>,
    y: f32 = <span class="tok-num">0</span>,
    motion: MotionType = .dynamic,
    angle: f32 = <span class="tok-num">0</span>,
    vx: f32 = <span class="tok-num">0</span>,
    vy: f32 = <span class="tok-num">0</span>,
    w: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// angular velocity</span>
    bullet: bool = false,
    gravity_scale: f32 = <span class="tok-num">1</span>,
    lock_x: bool = false, <span class="tok-comment">// freeze world-x translation</span>
    lock_y: bool = false, <span class="tok-comment">// freeze world-y translation</span>
    lock_rot: bool = false, <span class="tok-comment">// freeze rotation</span>
    no_sleep: bool = false, <span class="tok-comment">// keep awake even at rest (motor-driven bodies need this)</span>
};

<span class="tok-kw">fn</span> <span class="tok-fn">addBody</span>(world: *phys.World, b: Body) !BodyHandle {
    <span class="tok-kw">return</span> phys.<span class="tok-fn">createBody</span>(world, .{
        .motion_type = b.motion,
        .position = .{ b.x, b.y },
        .rotation = Rot2.<span class="tok-fn">fromAngle</span>(b.angle),
        .linear_velocity = .{ b.vx, b.vy },
        .angular_velocity = b.w,
        .gravity_scale = b.gravity_scale,
        .enable_sleep = !b.no_sleep,
        .motion_quality = <span class="tok-kw">if</span> (b.bullet) .linear_cast <span class="tok-kw">else</span> .discrete,
        .allowed_dofs = .{
            .translation_x = !b.lock_x,
            .translation_y = !b.lock_y,
            .rotation_z = !b.lock_rot,
        },
    });
}

<span class="tok-kw">const</span> Box = <span class="tok-kw">struct</span> {
    hw: f32 = <span class="tok-num">0.5</span>,
    hh: f32 = <span class="tok-num">0.5</span>,
    round: f32 = <span class="tok-num">0</span>,
    density: f32 = <span class="tok-num">1</span>,
    friction: f32 = <span class="tok-num">0.6</span>,
    restitution: f32 = <span class="tok-num">0</span>,
    tangent_speed: f32 = <span class="tok-num">0</span>,
    rolling: f32 = <span class="tok-num">0</span>,
    hit_events: bool = false,
    filter: phys.Filter = .{},
};

<span class="tok-kw">fn</span> <span class="tok-fn">attachBox</span>(
    world: *phys.World,
    h: BodyHandle,
    s: Box,
) !void {
    <span class="tok-kw">const</span> poly: phys.Polygon = <span class="tok-kw">if</span> (s.round &gt; <span class="tok-num">0</span>)
        phys.<span class="tok-fn">makeRoundedBox</span>(s.hw, s.hh, s.round)
    <span class="tok-kw">else</span>
        phys.<span class="tok-fn">makeBox</span>(s.hw, s.hh);
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, h, .{
        .geom = .{ .polygon = poly },
        .density = s.density,
        .enable_hit_events = s.hit_events,
        .filter = s.filter,
        .material = .{
            .friction = s.friction,
            .restitution = s.restitution,
            .tangent_speed = s.tangent_speed,
            .rolling_resistance = s.rolling,
        },
    });
}

<span class="tok-kw">const</span> Ball = <span class="tok-kw">struct</span> {

<span class="tok-kw">fn</span> <span class="tok-fn">attachCircle</span>(

<span class="tok-comment">/// Attach a sensor circle (no collision; emits sensor begin/end vs solid visitors).</span>

<span class="tok-comment">/// A BodyIndex -&gt; live-enough BodyHandle (createJoint/force paths consume `.index()` only).</span>

<span class="tok-kw">const</span> Cap = <span class="tok-kw">struct</span> {
    half_len: f32 = <span class="tok-num">0.5</span>,
    r: f32 = <span class="tok-num">0.3</span>,

<span class="tok-kw">fn</span> <span class="tok-fn">attachCapsule</span>(
    world: *phys.World,

    <span class="tok-kw">const</span> c1: Vec2 = <span class="tok-kw">if</span> (s.horizontal) .{ -s.half_len, <span class="tok-num">0</span> } <span class="tok-kw">else</span> .{ <span class="tok-num">0</span>, -s.half_len };
    <span class="tok-kw">const</span> c2: Vec2 = <span class="tok-kw">if</span> (s.horizontal) .{ s.half_len, <span class="tok-num">0</span> } <span class="tok-kw">else</span> .{ <span class="tok-num">0</span>, s.half_len };
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, h, .{

<span class="tok-kw">fn</span> <span class="tok-fn">groundBox</span>(
    world: *phys.World,
    half_w: f32,
    half_h: f32,
) !BodyHandle {
    <span class="tok-kw">const</span> g: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{

<span class="tok-kw">fn</span> <span class="tok-fn">groundSegment</span>(world: *phys.World, half_w: f32) !BodyHandle {

<span class="tok-comment">/// Attach an axis-aligned box offset from the body origin (compound parts, walls).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">attachOffsetBox</span>(
    world: *phys.World,

<span class="tok-comment">/// Attach a box at body-local `center`, rotated by `angle` radians, with explicit friction -</span>
<span class="tok-comment">/// the analogue of box2d v2's `SetAsBox(hw, hh, center, angle)`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">attachRotBox</span>(
    world: *phys.World,
    h: BodyHandle,
    hw: f32,
    hh: f32,
    center: Vec2,
    angle: f32,
    density: f32,
    friction: f32,
) !void {

    });

<span class="tok-comment">/// A hollow static box (floor/ceiling/2 walls) centred at the origin.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">arena</span>(
    world: *phys.World,
    half: f32,
    thick: f32,
) !BodyHandle {
    <span class="tok-kw">const</span> g: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, g, half, thick, .{ <span class="tok-num">0</span>, -half }, <span class="tok-num">1</span>);
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, g, half, thick, .{ <span class="tok-num">0</span>, half }, <span class="tok-num">1</span>);
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, g, thick, half, .{ -half, <span class="tok-num">0</span> }, <span class="tok-num">1</span>);
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, g, thick, half, .{ half, <span class="tok-num">0</span> }, <span class="tok-num">1</span>);
    <span class="tok-kw">return</span> g;
}

<span class="tok-comment">/// World point -&gt; a body's local frame (R(-theta)*(p - origin)).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">worldToLocal</span>(
    world: *phys.World,
    h: BodyHandle,
    p: Vec2,
) Vec2 {
    <span class="tok-kw">const</span> xf: Transform2 = world.bodies.data[h.<span class="tok-fn">index</span>()].transform;
    <span class="tok-kw">const</span> dx: f32 = p[<span class="tok-num">0</span>] - xf.p[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> dy: f32 = p[<span class="tok-num">1</span>] - xf.p[<span class="tok-num">1</span>];
    <span class="tok-kw">return</span> .{ xf.q.cosine * dx + xf.q.sine * dy, -xf.q.sine * dx + xf.q.cosine * dy };
}

<span class="tok-kw">const</span> Rev = <span class="tok-kw">struct</span> {
    anchor: Vec2,
    motor: bool = false,
    speed: f32 = <span class="tok-num">0</span>,
    torque: f32 = <span class="tok-num">0</span>,

    lo: f32 = <span class="tok-num">0</span>,
    hi: f32 = <span class="tok-num">0</span>,

};

<span class="tok-kw">fn</span> <span class="tok-fn">pinRevolute</span>(

) !void {
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
        .base = .{
            .body_a = a,
            .body_b = b,
            .local_frame_a = .{ .p = <span class="tok-fn">worldToLocal</span>(world, a, r.anchor), .q = Rot2.identity },
            .local_frame_b = .{ .p = <span class="tok-fn">worldToLocal</span>(world, b, r.anchor), .q = Rot2.identity },
            .collide_connected = r.collide,
        },
        .enable_motor = r.motor,
        .motor_speed = r.speed,
        .max_motor_torque = r.torque,
        .enable_limit = r.limit,
        .lower_angle = r.lo,
        .upper_angle = r.hi,
    });
}

<span class="tok-comment">// The joint axis is local_frame_a's x-axis (engine: axis = rotateVec2(frame_a.q, {1,0})).</span>
<span class="tok-comment">// Bodies anchored here are unrotated, so the axis rotation is the same in world and local.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pinPrismatic</span>(

<span class="tok-comment">/// Attach a convex polygon built from a point cloud (for arch voussoirs etc.).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">attachHull</span>(
    world: *phys.World,
    h: BodyHandle,
    pts: []<span class="tok-kw">const</span> Vec2,
    density: f32,
) !void {
    <span class="tok-kw">const</span> hull: phys.Hull = phys.<span class="tok-fn">computeHull</span>(pts);

        .geom = .{ .polygon = phys.<span class="tok-fn">makePolygon</span>(hull, <span class="tok-num">0</span>) },

}

<span class="tok-comment">// ---- Robustness ----</span>

<span class="tok-kw">fn</span> <span class="tok-fn">robustHighMass1</span>(world: *phys.World) !void {
    <span class="tok-comment">// Three pyramids of unit boxes, each capped by a heavy box (density 100/200/300)</span>
    <span class="tok-comment">// resting on one box - a high mass-ratio stability stress test.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">50</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> extent: f32 = <span class="tok-num">1.0</span>;
    <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; <span class="tok-num">3</span>) : (j += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fj: f32 = <span class="tok-fn">float</span>(j);
        <span class="tok-kw">const</span> offset: f32 = -<span class="tok-num">20.0</span> * extent + <span class="tok-num">2.0</span> * <span class="tok-num">11.0</span> * extent * fj; <span class="tok-comment">// 2*(count+1), count=10</span>
        <span class="tok-kw">var</span> count: i32 = <span class="tok-num">10</span>;
        <span class="tok-kw">var</span> y: f32 = extent;
        <span class="tok-kw">while</span> (count &gt; <span class="tok-num">0</span>) : (count -= <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> fc: f32 = <span class="tok-fn">float</span>(count);
            <span class="tok-kw">var</span> i: i32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (i &lt; count) : (i += <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> coeff: f32 = <span class="tok-fn">float</span>(i) - <span class="tok-num">0.5</span> * fc;
                <span class="tok-kw">const</span> yy: f32 = <span class="tok-kw">if</span> (count == <span class="tok-num">1</span>) y + <span class="tok-num">2.0</span> <span class="tok-kw">else</span> y;
                <span class="tok-kw">const</span> dens: f32 = <span class="tok-kw">if</span> (count == <span class="tok-num">1</span>) (fj + <span class="tok-num">1.0</span>) * <span class="tok-num">100.0</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
                <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">2.0</span> * coeff * extent + offset, .y = yy });
                <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = extent, .hh = extent, .density = dens });
            }
            y += <span class="tok-num">2.0</span> * extent;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">robustHighMass2</span>(world: *phys.World) !void {
    <span class="tok-comment">// A big heavy box (20x20) resting on two tiny boxes.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">50</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> a: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">9</span>, .y = <span class="tok-num">0.5</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, a, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">9</span>, .y = <span class="tok-num">0.5</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> big: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">26</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, big, .{ .hw = <span class="tok-num">10</span>, .hh = <span class="tok-num">10</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">robustHighMass3</span>(world: *phys.World) !void {
    <span class="tok-comment">// A big box resting on two small triangles.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">50</span>, <span class="tok-num">1</span>);

    <span class="tok-kw">const</span> a: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">9</span>, .y = <span class="tok-num">0.5</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachHull</span>(world, a, &amp;tri, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">9</span>, .y = <span class="tok-num">0.5</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachHull</span>(world, b, &amp;tri, <span class="tok-num">1.0</span>);

    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, big, .{ .hw = <span class="tok-num">10</span>, .hh = <span class="tok-num">10</span> });

<span class="tok-kw">fn</span> <span class="tok-fn">robustOverlap</span>(world: *phys.World) !void {
    <span class="tok-comment">// A small pyramid whose boxes start 25% overlapped; the solver pushes them apart.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">40</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> base_count: i32 = <span class="tok-num">4</span>;
    <span class="tok-kw">const</span> extent: f32 = <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> fraction: f32 = <span class="tok-num">0.75</span>; <span class="tok-comment">// 1 - 0.25 overlap</span>
    <span class="tok-kw">var</span> y: f32 = extent;
    <span class="tok-kw">var</span> i: i32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; base_count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> x: f32 = fraction * extent * <span class="tok-fn">float</span>(i - base_count);
        <span class="tok-kw">var</span> jj: i32 = i;
        <span class="tok-kw">while</span> (jj &lt; base_count) : (jj += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y });
            <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = extent, .hh = extent });
            x += <span class="tok-num">2.0</span> * fraction * extent;
        }
        y += <span class="tok-num">2.0</span> * fraction * extent;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">robustTinyPyramid</span>(world: *phys.World) !void {
    <span class="tok-comment">// A 30-row pyramid of 2.5 cm squares - small-scale stacking robustness.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">5</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> base_count: i32 = <span class="tok-num">30</span>;
    <span class="tok-kw">const</span> extent: f32 = <span class="tok-num">0.025</span>;
    <span class="tok-kw">var</span> i: i32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; base_count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> y: f32 = (<span class="tok-num">2.0</span> * fi + <span class="tok-num">1.0</span>) * extent;
        <span class="tok-kw">var</span> jj: i32 = i;
        <span class="tok-kw">while</span> (jj &lt; base_count) : (jj += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> fj: f32 = <span class="tok-fn">float</span>(jj);
            <span class="tok-kw">const</span> bc: f32 = <span class="tok-fn">float</span>(base_count);
            <span class="tok-kw">const</span> x: f32 = (fi + <span class="tok-num">1.0</span>) * extent + <span class="tok-num">2.0</span> * (fj - fi) * extent - bc * extent;
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y });
            <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = extent, .hh = extent });
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">bodyBad</span>(world: *phys.World) !void {

    <span class="tok-comment">// step "for science" - omitted; our Scene.update hook is stateless.)</span>

    <span class="tok-kw">const</span> bad: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">3</span>, .angle = <span class="tok-num">0.25</span> * pi, .w = <span class="tok-num">0.5</span> });

    <span class="tok-kw">try</span> <span class="tok-fn">attachCapsule</span>(world, normal, .{ .half_len = <span class="tok-num">1</span>, .r = <span class="tok-num">1</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">bodyMixedLocks</span>(world: *phys.World) !void {
    <span class="tok-comment">// Boxes with assorted motion locks: a static reference, two free, then angular-z locked,</span>
    <span class="tok-comment">// linear-x locked, linear-y + angular-z locked, and a fully-locked dynamic body.</span>

    <span class="tok-kw">const</span> f1: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">1</span>, .y = <span class="tok-num">1</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, f1, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> f2: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">1</span>, .y = <span class="tok-num">3</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, f2, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> az: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">1</span>, .y = <span class="tok-num">1</span>, .lock_rot = true });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, az, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> lx: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">2</span>, .y = <span class="tok-num">2</span>, .lock_x = true });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, lx, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> lyz: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">1</span>, .y = <span class="tok-num">2.5</span>, .lock_y = true, .lock_rot = true });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, lyz, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> locked: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{
        .x = <span class="tok-num">0</span>,
        .y = <span class="tok-num">1</span>,
        .lock_x = true,

    });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, locked, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });

<span class="tok-kw">fn</span> <span class="tok-fn">bodyWakeTouching</span>(world: *phys.World) !void {

<span class="tok-kw">fn</span> <span class="tok-fn">continuousSpecSliver</span>(world: *phys.World) !void {

<span class="tok-kw">fn</span> <span class="tok-fn">continuousSpecGhost</span>(world: *phys.World) !void {

    <span class="tok-kw">const</span> ledge: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0.9</span>, .motion = .static });

    <span class="tok-kw">const</span> v: f32 = <span class="tok-num">0.1</span> * <span class="tok-num">1.25</span> * <span class="tok-num">60.0</span>; <span class="tok-comment">// 0.1 * 1.25 * hertz(60)</span>
    <span class="tok-kw">const</span> sq: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0.015</span>, .y = <span class="tok-num">2.515</span>, .vx = v, .vy = -v, .gravity_scale = <span class="tok-num">0</span> });
