<span class="tok-kw">fn</span> <span class="tok-fn">continuousGhostBumps</span>(world: *phys.World) !void {
    <span class="tok-comment">// box2d Continuous|Ghost Bumps: a closed-loop chain track whose internal vertices carry ghost</span>
    <span class="tok-comment">// edges, so a shape sliding across a segment junction never catches on a phantom corner. The</span>
    <span class="tok-comment">// 20-point loop and the dropped circle are ported point-for-point from the box2d sample; the</span>
    <span class="tok-comment">// smooth glide around the bowl is the visible proof that ghost-vertex handling is working.</span>
    <span class="tok-kw">const</span> g: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });

    <span class="tok-kw">const</span> m: f32 = <span class="tok-num">1.0</span> / <span class="tok-builtin">@sqrt</span>(<span class="tok-num">2.0</span>);
    <span class="tok-kw">const</span> mm: f32 = <span class="tok-num">2.0</span> * (<span class="tok-builtin">@sqrt</span>(<span class="tok-num">2.0</span>) - <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> hx: f32 = <span class="tok-num">4.0</span>;
    <span class="tok-kw">const</span> hy: f32 = <span class="tok-num">0.25</span>;

    <span class="tok-comment">// Per-vertex offsets from the previous point (box2d builds the loop as a running b2Add chain).</span>
    <span class="tok-kw">const</span> deltas: [<span class="tok-num">19</span>][<span class="tok-num">2</span>]f32 = .{
        .{ -<span class="tok-num">2.0</span> * hx * m, <span class="tok-num">2.0</span> * hx * m },
        .{ -<span class="tok-num">2.0</span> * hx * m, <span class="tok-num">2.0</span> * hx * m },
        .{ -<span class="tok-num">2.0</span> * hx * m, <span class="tok-num">2.0</span> * hx * m },
        .{ -<span class="tok-num">2.0</span> * hy * m, -<span class="tok-num">2.0</span> * hy * m },
        .{ <span class="tok-num">2.0</span> * hx * m, -<span class="tok-num">2.0</span> * hx * m },
        .{ <span class="tok-num">2.0</span> * hx * m, -<span class="tok-num">2.0</span> * hx * m },
        .{ <span class="tok-num">2.0</span> * hx * m + <span class="tok-num">2.0</span> * hy * (<span class="tok-num">1.0</span> - m), -<span class="tok-num">2.0</span> * hx * m - <span class="tok-num">2.0</span> * hy * (<span class="tok-num">1.0</span> - m) },
        .{ <span class="tok-num">2.0</span> * hx + hy * mm, <span class="tok-num">0.0</span> },
        .{ <span class="tok-num">2.0</span> * hx, <span class="tok-num">0.0</span> },
        .{ <span class="tok-num">2.0</span> * hx + hy * mm, <span class="tok-num">0.0</span> },
        .{ <span class="tok-num">2.0</span> * hx * m + <span class="tok-num">2.0</span> * hy * (<span class="tok-num">1.0</span> - m), <span class="tok-num">2.0</span> * hx * m + <span class="tok-num">2.0</span> * hy * (<span class="tok-num">1.0</span> - m) },
        .{ <span class="tok-num">2.0</span> * hx * m, <span class="tok-num">2.0</span> * hx * m },
        .{ <span class="tok-num">2.0</span> * hx * m, <span class="tok-num">2.0</span> * hx * m },
        .{ -<span class="tok-num">2.0</span> * hy * m, <span class="tok-num">2.0</span> * hy * m },
        .{ -<span class="tok-num">2.0</span> * hx * m, -<span class="tok-num">2.0</span> * hx * m },
        .{ -<span class="tok-num">2.0</span> * hx * m, -<span class="tok-num">2.0</span> * hx * m },
        .{ -<span class="tok-num">2.0</span> * hx * m, -<span class="tok-num">2.0</span> * hx * m },
        .{ -<span class="tok-num">2.0</span> * hx, <span class="tok-num">0.0</span> },
        .{ -<span class="tok-num">2.0</span> * hx, <span class="tok-num">0.0</span> },
    };

    <span class="tok-kw">var</span> pts: [<span class="tok-num">20</span>]Vec2 = undefined;
    <span class="tok-kw">var</span> x: f32 = -<span class="tok-num">3.0</span> * hx;
    <span class="tok-kw">var</span> y: f32 = hy;
    pts[<span class="tok-num">0</span>] = .{ x, y };
    <span class="tok-kw">for</span> (deltas, <span class="tok-num">1</span>..) |d, i| {
        x += d[<span class="tok-num">0</span>];
        y += d[<span class="tok-num">1</span>];
        pts[i] = .{ x, y };
    }

    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createChain</span>(world, g, .{
        .points = &amp;pts,
        .is_loop = true,
        .material = .{ .friction = <span class="tok-num">0.2</span> },
    });

    <span class="tok-comment">// Drop a circle into the bowl; gravity walks it around the loop, riding over the chain's</span>
    <span class="tok-comment">// internal vertices rather than snagging on them.</span>
    <span class="tok-kw">const</span> ball: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">28.0</span>, .y = <span class="tok-num">18.0</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, ball, .{ .r = <span class="tok-num">0.5</span>, .density = <span class="tok-num">1.0</span>, .friction = <span class="tok-num">0.2</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">stackArch</span>(world: *phys.World) !void {
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">40</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> n: usize = <span class="tok-num">11</span>;
    <span class="tok-kw">const</span> ri: f32 = <span class="tok-num">4.0</span>;
    <span class="tok-kw">const</span> ro: f32 = <span class="tok-num">5.4</span>;
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-num">1.0</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> a0: f32 = pi * <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(n);
        <span class="tok-kw">const</span> a1: f32 = pi * <span class="tok-fn">float</span>(i + <span class="tok-num">1</span>) / <span class="tok-fn">float</span>(n);
        <span class="tok-kw">const</span> o0x: f32 = ro * <span class="tok-builtin">@cos</span>(a0);
        <span class="tok-kw">const</span> o0y: f32 = cy + ro * <span class="tok-builtin">@sin</span>(a0);
        <span class="tok-kw">const</span> o1x: f32 = ro * <span class="tok-builtin">@cos</span>(a1);
        <span class="tok-kw">const</span> o1y: f32 = cy + ro * <span class="tok-builtin">@sin</span>(a1);
        <span class="tok-kw">const</span> i1x: f32 = ri * <span class="tok-builtin">@cos</span>(a1);
        <span class="tok-kw">const</span> i1y: f32 = cy + ri * <span class="tok-builtin">@sin</span>(a1);
        <span class="tok-kw">const</span> i0x: f32 = ri * <span class="tok-builtin">@cos</span>(a0);
        <span class="tok-kw">const</span> i0y: f32 = cy + ri * <span class="tok-builtin">@sin</span>(a0);
        <span class="tok-kw">const</span> mx: f32 = (o0x + o1x + i1x + i0x) * <span class="tok-num">0.25</span>;
        <span class="tok-kw">const</span> my: f32 = (o0y + o1y + i1y + i0y) * <span class="tok-num">0.25</span>;
        <span class="tok-kw">const</span> stone: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = mx, .y = my });
        <span class="tok-kw">const</span> local: [<span class="tok-num">4</span>]Vec2 = .{
            .{ o0x - mx, o0y - my },
            .{ o1x - mx, o1y - my },
            .{ i1x - mx, i1y - my },
            .{ i0x - mx, i0y - my },
        };
        <span class="tok-kw">try</span> <span class="tok-fn">attachHull</span>(world, stone, &amp;local, <span class="tok-num">1.0</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">stackCardHouse</span>(world: *phys.World) !void {

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkBarrel24</span>(world: *phys.World) !void {
    <span class="tok-comment">// box2d Benchmark|Barrel 2.4: a tall U-shaped bin (floor + two 90 deg-rotated walls) packed with a</span>
    <span class="tok-comment">// 26 x (5*26) grid of unit cubes - the classic v2.4-era stress arrangement. Ported 1:1.</span>
    <span class="tok-kw">const</span> ground_size: f32 = <span class="tok-num">25.0</span>;

    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, bin_floor, .{ .hw = ground_size, .hh = <span class="tok-num">1.2</span> });

        .x = ground_size,
        .y = <span class="tok-num">2.0</span> * ground_size,

        .motion = .static,
    });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, right_wall, .{ .hw = <span class="tok-num">2.0</span> * ground_size, .hh = <span class="tok-num">1.2</span> });

    <span class="tok-kw">const</span> left_wall: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{
        .x = -ground_size,
        .y = <span class="tok-num">2.0</span> * ground_size,
        .angle = <span class="tok-num">0.5</span> * pi,
        .motion = .static,
    });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, left_wall, .{ .hw = <span class="tok-num">2.0</span> * ground_size, .hh = <span class="tok-num">1.2</span> });

    <span class="tok-kw">const</span> num: usize = <span class="tok-num">26</span>;
    <span class="tok-kw">const</span> rad: f32 = <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> shift: f32 = rad * <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> center_x: f32 = shift * <span class="tok-fn">float</span>(num) / <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> center_y: f32 = shift / <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> num_j: usize = <span class="tok-num">5</span> * num;

    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;

        <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">float</span>(i) * shift - center_x;
        <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (j &lt; num_j) : (j += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> y: f32 = <span class="tok-fn">float</span>(j) * shift + center_y + <span class="tok-num">2.0</span>;
            <span class="tok-kw">const</span> cube: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y });
            <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, cube, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span>, .density = <span class="tok-num">1.0</span>, .friction = <span class="tok-num">0.5</span> });
        }
    }
}

        <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, drum, t, half, .{ -half, <span class="tok-num">0</span> }, <span class="tok-num">5</span>);
        <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, drum, t, half, .{ half, <span class="tok-num">0</span> }, <span class="tok-num">5</span>);
        <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (i &lt; <span class="tok-num">24</span>) : (i += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> fx: f32 = cx - <span class="tok-num">1.5</span> + <span class="tok-fn">float</span>(i % <span class="tok-num">6</span>) * <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> fy: f32 = <span class="tok-num">6.5</span> + <span class="tok-fn">float</span>(i / <span class="tok-num">6</span>) * <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> gb: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = fx, .y = fy });
            <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, gb, .{ .hw = <span class="tok-num">0.18</span>, .hh = <span class="tok-num">0.18</span> });
        }
    }
}

<span class="tok-comment">// ================================================================================</span>
<span class="tok-comment">// Wave 3 - event-driven scenes (read getContactEvents/getSensorEvents/getBodyEvents</span>
<span class="tok-comment">// in a per-frame update hook and react). Visualisation is the engine's debug draw.</span>
<span class="tok-comment">// ================================================================================</span>

<span class="tok-kw">const</span> tag_platform: u64 = <span class="tok-num">1</span>;
<span class="tok-kw">const</span> tag_player: u64 = <span class="tok-num">2</span>;

<span class="tok-kw">fn</span> <span class="tok-fn">platformerPreSolve</span>(
    shape_a: u32,
    shape_b: u32,
    point: Vec2,
    normal: Vec2,
    ctx: ?*anyopaque,
) bool {
    _ = point;
    <span class="tok-comment">// One-way platform: keep the contact only when the player sits above the platform (so it lands),</span>
    <span class="tok-comment">// and disable it when the player is rising from below (so it passes through). The manifold normal</span>
    <span class="tok-comment">// points from shape_a to shape_b; orient it to point from platform toward player. ctx is the world,</span>
    <span class="tok-comment">// used to read the shapes' role tags.</span>
    <span class="tok-kw">const</span> world: *phys.World = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(ctx.?));
    <span class="tok-kw">const</span> ud_a: u64 = world.shapes.data[shape_a].user_data;
    <span class="tok-kw">const</span> ud_b: u64 = world.shapes.data[shape_b].user_data;
    <span class="tok-kw">var</span> sign: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (ud_a == tag_platform <span class="tok-kw">and</span> ud_b == tag_player) {
        sign = <span class="tok-num">1.0</span>;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (ud_b == tag_platform <span class="tok-kw">and</span> ud_a == tag_player) {
        sign = -<span class="tok-num">1.0</span>;
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">return</span> true; <span class="tok-comment">// not a platform/player pair -&gt; ordinary solid contact</span>
    }
    <span class="tok-kw">return</span> sign * normal[<span class="tok-num">1</span>] &gt; <span class="tok-num">0.95</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventsPlatformer</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-comment">// box2d Events|Platformer: jump-through (one-way) platforms via a pre-solve veto. box2d drives the</span>
    <span class="tok-comment">// player with the keyboard; here it auto-jumps on a timer so the one-way behaviour is visible - the</span>
    <span class="tok-comment">// player rises straight through each platform and lands on top coming back down.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundSegment</span>(world, <span class="tok-num">20</span>);

    <span class="tok-kw">const</span> heights = [_]f32{ <span class="tok-num">4.0</span>, <span class="tok-num">8.0</span> };
    <span class="tok-kw">for</span> (heights) |y| {
        <span class="tok-kw">const</span> plat: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = y, .motion = .static });
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, plat, .{
            .geom = .{ .polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">3.0</span>, <span class="tok-num">0.25</span>) },
            .enable_pre_solve = true,
            .user_data = tag_platform,
        });
    }

    <span class="tok-kw">const</span> player: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">1</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, player, .{
        .geom = .{ .capsule = .{ .center1 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .center2 = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .radius = <span class="tok-num">0.5</span> } },
        .enable_pre_solve = true,
        .user_data = tag_player,
    });

    phys.<span class="tok-fn">setPreSolveCallback</span>(world, platformerPreSolve, world);
    st.body[<span class="tok-num">0</span>] = player;
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventsPlatformerUpdate</span>(world: *phys.World, st: *SceneState) void {
    st.u[<span class="tok-num">0</span>] += <span class="tok-num">1</span>;
    <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] &lt; <span class="tok-num">150</span>) {
        <span class="tok-kw">return</span>;
    }
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>;
    phys.<span class="tok-fn">setLinearVelocity</span>(world, st.body[<span class="tok-num">0</span>], .{ <span class="tok-num">0</span>, <span class="tok-num">11</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventsPersistentContact</span>(world: *phys.World) !void {
    <span class="tok-comment">// box2d Events|Persistent Contact: a ball rolls in a smooth bowl, keeping a contact alive across many</span>
    <span class="tok-comment">// steps. The lab reads each live touching contact's manifold (getContactData) and draws the contact</span>
    <span class="tok-comment">// point and its accumulated normal impulse.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .motion = .static });
    <span class="tok-kw">const</span> pts = [_]Vec2{
        .{ -<span class="tok-num">10</span>, <span class="tok-num">5</span> },
        .{ -<span class="tok-num">7</span>, <span class="tok-num">2</span> },
        .{ -<span class="tok-num">4</span>, <span class="tok-num">0.5</span> },
        .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .{ <span class="tok-num">4</span>, <span class="tok-num">0.5</span> },
        .{ <span class="tok-num">7</span>, <span class="tok-num">2</span> },
        .{ <span class="tok-num">10</span>, <span class="tok-num">5</span> },
    };
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createChain</span>(world, ground, .{ .points = &amp;pts, .is_loop = false });

    <span class="tok-kw">const</span> ball: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">6</span>, .y = <span class="tok-num">3</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, ball, .{ .cx = <span class="tok-num">0</span>, .cy = <span class="tok-num">0</span>, .r = <span class="tok-num">0.5</span>, .restitution = <span class="tok-num">0.1</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventsPersistentContactLab</span>(ctx: *render.LabCtx) void {
    <span class="tok-kw">const</span> n: u32 = phys.<span class="tok-fn">liveContactCount</span>(ctx.world);
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> cid: u32 = phys.<span class="tok-fn">liveContactId</span>(ctx.world, i);
        <span class="tok-kw">if</span> (phys.<span class="tok-fn">isContactTouching</span>(ctx.world, cid) == false) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> data: phys.ContactData = phys.<span class="tok-fn">getContactData</span>(ctx.world, cid);
        <span class="tok-kw">var</span> k: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (k &lt; data.point_count) : (k += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> p1: Vec2 = data.points[k].point;
            <span class="tok-comment">// Scale the impulse vector up so the (small) supporting impulse is visible.</span>
            <span class="tok-kw">const</span> scale: f32 = <span class="tok-num">4.0</span>;
            <span class="tok-kw">const</span> imp: f32 = data.points[k].normal_impulse * scale;
            <span class="tok-kw">const</span> p2: Vec2 = .{ p1[<span class="tok-num">0</span>] + data.normal[<span class="tok-num">0</span>] * imp, p1[<span class="tok-num">1</span>] + data.normal[<span class="tok-num">1</span>] * imp };
            ctx.<span class="tok-fn">line</span>(p1, p2, c_red, <span class="tok-num">2</span>);
            ctx.<span class="tok-fn">mark</span>(p1, <span class="tok-num">5.0</span>, c_red);
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventCircleImpulse</span>(world: *phys.World) !void {
    _ = <span class="tok-kw">try</span> <span class="tok-fn">arena</span>(world, <span class="tok-num">12</span>, <span class="tok-num">0.5</span>);
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">60</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = -<span class="tok-num">8.0</span> + <span class="tok-fn">float</span>(i % <span class="tok-num">12</span>) * <span class="tok-num">1.4</span>;
        <span class="tok-kw">const</span> y: f32 = -<span class="tok-num">6.0</span> + <span class="tok-fn">float</span>(i / <span class="tok-num">12</span>) * <span class="tok-num">1.4</span>;
        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, b, .{ .r = <span class="tok-num">0.35</span>, .restitution = <span class="tok-num">0.3</span>, .hit_events = true });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventCircleImpulseUpdate</span>(world: *phys.World) void {
    <span class="tok-kw">const</span> ev: phys.ContactEvents = phys.<span class="tok-fn">getContactEvents</span>(world);
    <span class="tok-kw">for</span> (ev.hit) |h| {
        <span class="tok-kw">if</span> (h.approach_speed &lt; <span class="tok-num">3.0</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> ia: usize = <span class="tok-fn">shapeBodyIndex</span>(world, h.shape_a);
        <span class="tok-kw">const</span> ib: usize = <span class="tok-fn">shapeBodyIndex</span>(world, h.shape_b);
        <span class="tok-kw">const</span> kx: f32 = h.normal[<span class="tok-num">0</span>] * <span class="tok-num">0.25</span>;
        <span class="tok-kw">const</span> ky: f32 = h.normal[<span class="tok-num">1</span>] * <span class="tok-num">0.25</span>;
        phys.<span class="tok-fn">applyLinearImpulseToCenter</span>(world, <span class="tok-fn">bodyHandleOf</span>(ia), .{ -kx, -ky }, true);
        phys.<span class="tok-fn">applyLinearImpulseToCenter</span>(world, <span class="tok-fn">bodyHandleOf</span>(ib), .{ kx, ky }, true);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventContact</span>(world: *phys.World) !void {
    _ = <span class="tok-kw">try</span> <span class="tok-fn">arena</span>(world, <span class="tok-num">12</span>, <span class="tok-num">0.5</span>);
    <span class="tok-kw">const</span> bumpers: [<span class="tok-num">5</span>]Vec2 = .{ .{ -<span class="tok-num">5</span>, -<span class="tok-num">2</span> }, .{ <span class="tok-num">5</span>, -<span class="tok-num">2</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">2</span> }, .{ -<span class="tok-num">3</span>, <span class="tok-num">5</span> }, .{ <span class="tok-num">3</span>, <span class="tok-num">5</span> } };
    <span class="tok-kw">for</span> (bumpers) |p| {
        <span class="tok-kw">const</span> bp: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static, .position = p });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, bp, .{ .r = <span class="tok-num">0.8</span> });
    }
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">16</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">6.0</span> + <span class="tok-fn">float</span>(i) * <span class="tok-num">0.8</span>, .y = <span class="tok-num">9</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, b, .{ .r = <span class="tok-num">0.3</span>, .restitution = <span class="tok-num">0.5</span> });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventContactUpdate</span>(world: *phys.World) void {
    <span class="tok-kw">const</span> ev: phys.ContactEvents = phys.<span class="tok-fn">getContactEvents</span>(world);
    <span class="tok-kw">for</span> (ev.begin) |bg| {
        <span class="tok-kw">const</span> ia: usize = <span class="tok-fn">shapeBodyIndex</span>(world, bg.shape_a);
        <span class="tok-kw">const</span> ib: usize = <span class="tok-fn">shapeBodyIndex</span>(world, bg.shape_b);
        <span class="tok-kw">const</span> a_dyn: bool = world.bodies.data[ia].motion_type == .dynamic;
        <span class="tok-kw">const</span> b_dyn: bool = world.bodies.data[ib].motion_type == .dynamic;
        <span class="tok-kw">if</span> (a_dyn == b_dyn) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> dyn_i: usize = <span class="tok-kw">if</span> (a_dyn) ia <span class="tok-kw">else</span> ib;
        <span class="tok-kw">const</span> stat_i: usize = <span class="tok-kw">if</span> (a_dyn) ib <span class="tok-kw">else</span> ia;
        <span class="tok-kw">const</span> dc: Vec2 = world.bodies.data[dyn_i].center;
        <span class="tok-kw">const</span> sc: Vec2 = world.bodies.data[stat_i].center;
        <span class="tok-kw">const</span> dx: f32 = dc[<span class="tok-num">0</span>] - sc[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = dc[<span class="tok-num">1</span>] - sc[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> d2: f32 = dx * dx + dy * dy;
        <span class="tok-kw">if</span> (d2 &lt; <span class="tok-num">0.0001</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> inv: f32 = <span class="tok-num">1.0</span> / <span class="tok-builtin">@sqrt</span>(d2);
        phys.<span class="tok-fn">applyLinearImpulseToCenter</span>(world, <span class="tok-fn">bodyHandleOf</span>(dyn_i), .{ dx * inv * <span class="tok-num">2.5</span>, dy * inv * <span class="tok-num">2.5</span> }, true);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventSensorTypes</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-comment">// box2d Events|Sensor Types: a sensor on each of a static, kinematic, and dynamic body, plus a</span>
    <span class="tok-comment">// filtered ground, exercising sensor begin/end detection across every body type. The kinematic</span>
    <span class="tok-comment">// sensor bobs up and down (see update); balls rain down through all three to trip them.</span>
    <span class="tok-kw">const</span> cat_ground: u64 = <span class="tok-num">0x1</span>;
    <span class="tok-kw">const</span> cat_sensor: u64 = <span class="tok-num">0x2</span>;
    <span class="tok-kw">const</span> cat_default: u64 = <span class="tok-num">0x4</span>;

    <span class="tok-comment">// Ground floor + two side walls; collides only with DEFAULT so the sensors pass through it.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .motion = .static });
    <span class="tok-kw">const</span> segs: [<span class="tok-num">3</span>][<span class="tok-num">2</span>]Vec2 = .{
        .{ .{ -<span class="tok-num">6</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">6</span>, <span class="tok-num">0</span> } },
        .{ .{ -<span class="tok-num">6</span>, <span class="tok-num">0</span> }, .{ -<span class="tok-num">6</span>, <span class="tok-num">4</span> } },
        .{ .{ <span class="tok-num">6</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">6</span>, <span class="tok-num">4</span> } },
    };
    <span class="tok-kw">for</span> (segs) |s| {
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
            .geom = .{ .segment = .{ .point1 = s[<span class="tok-num">0</span>], .point2 = s[<span class="tok-num">1</span>] } },
            .filter = .{ .category = cat_ground, .mask = cat_default },
        });
    }

    <span class="tok-comment">// Static sensor.</span>
    <span class="tok-kw">const</span> stat: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">3</span>, .y = <span class="tok-num">0.8</span>, .motion = .static });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, stat, .{
        .geom = .{ .polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>) },
        .is_sensor = true,
        .density = <span class="tok-num">0</span>,
        .filter = .{ .category = cat_sensor },
    });

    <span class="tok-comment">// Kinematic sensor - bobs up and down (update). Stash the handle for the update hook.</span>
    <span class="tok-kw">const</span> kin: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .motion = .kinematic, .vy = <span class="tok-num">1</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, kin, .{
        .geom = .{ .polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>) },
        .is_sensor = true,
        .density = <span class="tok-num">0</span>,
        .filter = .{ .category = cat_sensor },
    });
    st.body[<span class="tok-num">0</span>] = kin;

    <span class="tok-comment">// Dynamic sensor - a sensor box plus a real solid box so the body is physical.</span>
    <span class="tok-kw">const</span> dyn: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">3</span>, .y = <span class="tok-num">1</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, dyn, .{
        .geom = .{ .polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>) },
        .is_sensor = true,
        .density = <span class="tok-num">0</span>,
        .filter = .{ .category = cat_sensor },
    });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, dyn, .{ .hw = <span class="tok-num">0.8</span>, .hh = <span class="tok-num">0.8</span>, .filter = .{ .category = cat_default } });

    <span class="tok-comment">// Balls (DEFAULT, but masked to be seen by every sensor) rain down through the three sensors.</span>
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">6</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fx: f32 = -<span class="tok-num">5.0</span> + <span class="tok-fn">float</span>(i) * <span class="tok-num">2.0</span>;
        <span class="tok-kw">const</span> ball: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = fx, .y = <span class="tok-num">6.0</span> });
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ball, .{

<span class="tok-kw">fn</span> <span class="tok-fn">eventSensorTypesUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-comment">// Reverse the kinematic sensor at the ends of its travel so it sweeps the falling balls.</span>

}

<span class="tok-kw">fn</span> <span class="tok-fn">launchSensorBullet</span>(world: *phys.World) !BodyHandle {

<span class="tok-kw">fn</span> <span class="tok-fn">eventSensorHits</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-comment">// box2d Events|Sensor Hits: a fast bullet repeatedly tunnel-tests three sensors - a static</span>
    <span class="tok-comment">// tripwire segment, a kinematic tripwire drifting right, and a dynamic capsule riding a motorised</span>
    <span class="tok-comment">// prismatic. Even at ~250 m/s the CCD bullet trips every sensor's begin event. box2d fires the</span>
    <span class="tok-comment">// bullet on a key; here the launch is automated on a timer, destroying the prior bullet each time.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .motion = .static });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ -<span class="tok-num">10</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">10</span>, <span class="tok-num">0</span> } } },
    });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ <span class="tok-num">10</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">10</span>, <span class="tok-num">10</span> } } },
    });

    <span class="tok-comment">// Static sensor: a vertical tripwire segment.</span>
    <span class="tok-kw">const</span> stat: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">4</span>, .y = <span class="tok-num">1</span>, .motion = .static });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, stat, .{
        .geom = .{ .segment = .{ .point1 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">0</span>, <span class="tok-num">10</span> } } },
        .is_sensor = true,
        .density = <span class="tok-num">0</span>,
    });

    <span class="tok-comment">// Kinematic sensor: same tripwire, drifting slowly to the right.</span>
    <span class="tok-kw">const</span> kin: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">1</span>, .motion = .kinematic, .vx = <span class="tok-num">0.5</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, kin, .{
        .geom = .{ .segment = .{ .point1 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">0</span>, <span class="tok-num">10</span> } } },
        .is_sensor = true,
        .density = <span class="tok-num">0</span>,
    });

    <span class="tok-comment">// Dynamic sensor: an upright capsule sensor slid back and forth by a motorised prismatic joint.</span>
    <span class="tok-kw">const</span> dyn: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">4</span>, .y = <span class="tok-num">1</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, dyn, .{
        .geom = .{ .capsule = .{ .center1 = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .center2 = .{ <span class="tok-num">0</span>, <span class="tok-num">9</span> }, .radius = <span class="tok-num">0.1</span> } },
        .is_sensor = true,
        .density = <span class="tok-num">1</span>,
    });
    <span class="tok-kw">try</span> <span class="tok-fn">pinPrismatic</span>(world, ground, dyn, .{
        .anchor = .{ <span class="tok-num">4</span>, <span class="tok-num">7</span> },
        .axis_angle = <span class="tok-num">0</span>,
        .motor = true,
        .speed = <span class="tok-num">0.5</span>,
        .force = <span class="tok-num">1000</span>,
    });

    st.body[<span class="tok-num">0</span>] = <span class="tok-kw">try</span> <span class="tok-fn">launchSensorBullet</span>(world);
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventSensorHitsUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-comment">// Relaunch on a timer; launch the fresh bullet first, then retire the previous one so a failed</span>
    <span class="tok-comment">// spawn can never leave a dangling handle to double-free.</span>
    st.u[<span class="tok-num">0</span>] += <span class="tok-num">1</span>;
    <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] &gt;= <span class="tok-num">150</span>) {
        st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>;
        <span class="tok-kw">const</span> old: BodyHandle = st.body[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> fresh: BodyHandle = <span class="tok-fn">launchSensorBullet</span>(world) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
        phys.<span class="tok-fn">destroyBody</span>(world, old);
        st.body[<span class="tok-num">0</span>] = fresh;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventBodyMoveUpdate</span>(world: *phys.World) void {

<span class="tok-comment">/// box2d's "Projectile Event": a bullet is auto-fired at a stack of rounded boxes every couple of</span>
<span class="tok-comment">/// seconds; on its first contact it detonates a small explosion at the impact point and is removed.</span>
<span class="tok-comment">/// The original fires on mouse-drag - here it loops autonomously. Exercises bullet bodies, contact</span>
<span class="tok-comment">/// events, world.explode, and runtime body destruction, all driven from the scene-state slot.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">eventProjectile</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ <span class="tok-num">10</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">10</span>, <span class="tok-num">20</span> } } },
    });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ -<span class="tok-num">30</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">30</span>, <span class="tok-num">0</span> } } },
    });
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">8</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> shift: f32 = <span class="tok-kw">if</span> (i % <span class="tok-num">2</span> == <span class="tok-num">0</span>) -<span class="tok-num">0.01</span> <span class="tok-kw">else</span> <span class="tok-num">0.01</span>;
        <span class="tok-kw">const</span> y: f32 = <span class="tok-num">0.5</span> + <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">8</span> + shift, .y = y });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">0.45</span>, .hh = <span class="tok-num">0.45</span>, .round = <span class="tok-num">0.05</span> });
    }
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>; <span class="tok-comment">// 1 while a projectile is in flight</span>
    st.u[<span class="tok-num">1</span>] = <span class="tok-num">140</span>; <span class="tok-comment">// step counter, primed so the first shot fires shortly after entry</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventProjectileUpdate</span>(world: *phys.World, st: *SceneState) void {
    st.u[<span class="tok-num">1</span>] += <span class="tok-num">1</span>;
    <span class="tok-kw">if</span> (st.u[<span class="tok-num">1</span>] &gt;= <span class="tok-num">160</span>) {
        st.u[<span class="tok-num">1</span>] = <span class="tok-num">0</span>;
        <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] == <span class="tok-num">1</span>) {
            phys.<span class="tok-fn">destroyBody</span>(world, st.body[<span class="tok-num">0</span>]);
            st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>;
        }

}

<span class="tok-kw">fn</span> <span class="tok-fn">labRayCastLab</span>(ctx: *render.LabCtx) void {

<span class="tok-kw">fn</span> <span class="tok-fn">labShapeCastLab</span>(ctx: *render.LabCtx) void {
    <span class="tok-kw">const</span> origin: Vec2 = .{ -<span class="tok-num">9</span>, -<span class="tok-num">6</span> };
    <span class="tok-kw">const</span> r: f32 = <span class="tok-num">0.6</span>;
    <span class="tok-kw">const</span> pt: [<span class="tok-num">1</span>]Vec2 = .{.{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }};

        ctx.<span class="tok-fn">line</span>(origin, ctr, c_dim, <span class="tok-num">1</span>);

        ctx.<span class="tok-fn">mark</span>(cr.point, <span class="tok-num">5</span>, c_red);
        <span class="tok-kw">const</span> tip: Vec2 = .{ cr.point[<span class="tok-num">0</span>] + cr.normal[<span class="tok-num">0</span>] * <span class="tok-num">1.3</span>, cr.point[<span class="tok-num">1</span>] + cr.normal[<span class="tok-num">1</span>] * <span class="tok-num">1.3</span> };

<span class="tok-kw">fn</span> <span class="tok-fn">labOverlapLab</span>(ctx: *render.LabCtx) void {

<span class="tok-kw">fn</span> <span class="tok-fn">labConvexHullLab</span>(ctx: *render.LabCtx) void {
    <span class="tok-kw">var</span> pts: [<span class="tok-num">12</span>]Vec2 = undefined;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">11</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> a: f32 = ctx.time * <span class="tok-num">0.3</span> + fi * <span class="tok-num">0.61</span>;
        <span class="tok-kw">const</span> rr: f32 = <span class="tok-num">2.0</span> + <span class="tok-builtin">@sin</span>(ctx.time + fi) * <span class="tok-num">1.4</span>;
        pts[i] = .{ <span class="tok-builtin">@cos</span>(a) * rr, <span class="tok-builtin">@sin</span>(a) * rr * <span class="tok-num">0.8</span> + <span class="tok-num">1.0</span> };
    }
    pts[<span class="tok-num">11</span>] = ctx.pointer;
    <span class="tok-kw">for</span> (pts) |p| {

    }
    <span class="tok-kw">const</span> hull: phys.Hull = phys.<span class="tok-fn">computeHull</span>(&amp;pts);
    <span class="tok-kw">var</span> j: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; hull.count) : (j += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> a2: Vec2 = hull.points[j];
        <span class="tok-kw">const</span> b2: Vec2 = hull.points[(j + <span class="tok-num">1</span>) % hull.count];
        ctx.<span class="tok-fn">line</span>(a2, b2, c_green, <span class="tok-num">2</span>);
        ctx.<span class="tok-fn">mark</span>(a2, <span class="tok-num">4</span>, c_amber);
    }
    ctx.<span class="tok-fn">mark</span>(ctx.pointer, <span class="tok-num">5</span>, c_red);
}
