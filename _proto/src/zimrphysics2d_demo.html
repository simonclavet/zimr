<span class="tok-kw">fn</span> <span class="tok-fn">continuousPixelImperfect</span>(world: *phys.World) !void {
    <span class="tok-comment">// Box2D collision is not pixel-perfect: a rounded "ball" descends (gravity off) onto a</span>
    <span class="tok-comment">// static block; positions drift sub-pixel.</span>
    <span class="tok-kw">const</span> ppm: f32 = <span class="tok-num">30.0</span>;
    <span class="tok-kw">const</span> block: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">175.0</span> / ppm, .y = <span class="tok-num">150.0</span> / ppm, .motion = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, block, .{ .hw = <span class="tok-num">20.0</span> / ppm, .hh = <span class="tok-num">10.0</span> / ppm, .friction = <span class="tok-num">0</span> });
    <span class="tok-kw">const</span> ball: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{
        .x = <span class="tok-num">200.0</span> / ppm,
        .y = <span class="tok-num">275.0</span> / ppm,
        .vy = -<span class="tok-num">5</span>,
        .gravity_scale = <span class="tok-num">0</span>,
        .lock_rot = true,
    });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, ball, .{ .hw = <span class="tok-num">4.0</span> / ppm, .hh = <span class="tok-num">4.0</span> / ppm, .round = <span class="tok-num">0.9</span> / ppm, .friction = <span class="tok-num">0</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">continuousRestitutionThreshold</span>(world: *phys.World) !void {
    <span class="tok-comment">// With the restitution threshold at 0.1 m/s, a slow ball striking a tilted block barely bounces.</span>
    world.settings.restitution_threshold = <span class="tok-num">0.1</span>;
    <span class="tok-kw">const</span> ppm: f32 = <span class="tok-num">30.0</span>;
    <span class="tok-kw">const</span> block: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{
        .x = <span class="tok-num">205.0</span> / ppm,
        .y = <span class="tok-num">120.0</span> / ppm,
        .motion = .static,
        .angle = <span class="tok-num">70.0</span> * pi / <span class="tok-num">180.0</span>,
    });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, block, .{ .hw = <span class="tok-num">50.0</span> / ppm, .hh = <span class="tok-num">5.0</span> / ppm, .friction = <span class="tok-num">0</span> });
    <span class="tok-kw">const</span> ball: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">200.0</span> / ppm, .y = <span class="tok-num">250.0</span> / ppm, .vy = -<span class="tok-num">2.9</span>, .lock_rot = true });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, ball, .{ .r = <span class="tok-num">5.0</span> / ppm, .friction = <span class="tok-num">0</span>, .restitution = <span class="tok-num">1</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">continuousChainSlide</span>(world: *phys.World) !void {
    <span class="tok-comment">// A fast circle (100 m/s) slides inside a closed chain loop - CCD against a chain, no ghosts.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">var</span> pts: [<span class="tok-num">80</span>]Vec2 = undefined;
    <span class="tok-kw">const</span> w: f32 = <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> h: f32 = <span class="tok-num">1.0</span>;
    <span class="tok-kw">var</span> x: f32 = <span class="tok-num">20.0</span>;
    <span class="tok-kw">var</span> y: f32 = <span class="tok-num">0.0</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">20</span>) : (i += <span class="tok-num">1</span>) {
        pts[i] = .{ x, y };
        x -= w;
    }
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">40</span>) : (i += <span class="tok-num">1</span>) {
        pts[i] = .{ x, y };
        y += h;
    }
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">60</span>) : (i += <span class="tok-num">1</span>) {
        pts[i] = .{ x, y };
        x += w;
    }
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">80</span>) : (i += <span class="tok-num">1</span>) {
        pts[i] = .{ x, y };
        y -= h;
    }
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createChain</span>(world, ground, .{ .points = &amp;pts, .is_loop = true });
    <span class="tok-kw">const</span> ball: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">19.5</span>, .y = <span class="tok-num">0.5</span>, .vx = <span class="tok-num">100</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, ball, .{ .r = <span class="tok-num">0.5</span>, .friction = <span class="tok-num">0</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">continuousSegmentSlide</span>(world: *phys.World) !void {
    <span class="tok-comment">// A fast circle slides along a segment floor and slams into a vertical segment wall.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ -<span class="tok-num">40</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">40</span>, <span class="tok-num">0</span> } } },
    });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ <span class="tok-num">40</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">40</span>, <span class="tok-num">10</span> } } },
    });
    <span class="tok-kw">const</span> ball: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">20</span>, .y = <span class="tok-num">0.7</span>, .vx = <span class="tok-num">100</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, ball, .{ .r = <span class="tok-num">0.5</span> });
}

<span class="tok-comment">// ---- Joints ----</span>

<span class="tok-kw">fn</span> <span class="tok-fn">jointsUserConstraint</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-comment">// box2d Joints|User Constraint: a soft "cable" constraint built entirely in the update hook from</span>
    <span class="tok-comment">// public body accessors - no engine joint. Two cables anchored at a fixed point pull a falling box,</span>
    <span class="tok-comment">// computed as a TGS soft constraint and applied by setting the box's velocity each step.</span>
    <span class="tok-kw">const</span> box: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{
        .motion_type = .dynamic,
        .position = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .linear_damping = <span class="tok-num">0.2</span>,
        .angular_damping = <span class="tok-num">0.5</span>,
        .enable_sleep = false,
    });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, box, .{
        .geom = .{ .polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">1.0</span>, <span class="tok-num">0.5</span>) },
        .density = <span class="tok-num">20.0</span>,
    });
    st.body[<span class="tok-num">0</span>] = box;
}

<span class="tok-kw">fn</span> <span class="tok-fn">jointsUserConstraintUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-kw">const</span> box: BodyHandle = st.body[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">60.0</span>;
    <span class="tok-kw">const</span> hertz: f32 = <span class="tok-num">3.0</span>;
    <span class="tok-kw">const</span> zeta: f32 = <span class="tok-num">0.7</span>;
    <span class="tok-kw">const</span> max_force: f32 = <span class="tok-num">1000.0</span>;
    <span class="tok-kw">const</span> omega: f32 = <span class="tok-num">2.0</span> * pi * hertz;
    <span class="tok-kw">const</span> sigma: f32 = <span class="tok-num">2.0</span> * zeta + dt * omega;
    <span class="tok-kw">const</span> s: f32 = dt * omega * sigma;
    <span class="tok-kw">const</span> impulse_coef: f32 = <span class="tok-num">1.0</span> / (<span class="tok-num">1.0</span> + s);
    <span class="tok-kw">const</span> mass_coef: f32 = s * impulse_coef;
    <span class="tok-kw">const</span> bias_coef: f32 = omega / sigma;

    <span class="tok-kw">const</span> mass: f32 = phys.<span class="tok-fn">getMass</span>(world, box);
    <span class="tok-kw">const</span> inv_mass: f32 = <span class="tok-kw">if</span> (mass &lt; <span class="tok-num">0.0001</span>) <span class="tok-num">0.0</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span> / mass;
    <span class="tok-kw">const</span> inertia: f32 = phys.<span class="tok-fn">getRotationalInertia</span>(world, box);
    <span class="tok-kw">const</span> inv_i: f32 = <span class="tok-kw">if</span> (inertia &lt; <span class="tok-num">0.0001</span>) <span class="tok-num">0.0</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span> / inertia;

    <span class="tok-kw">var</span> v_b: Vec2 = phys.<span class="tok-fn">getLinearVelocity</span>(world, box);
    <span class="tok-kw">var</span> omega_b: f32 = phys.<span class="tok-fn">getAngularVelocity</span>(world, box);
    <span class="tok-kw">const</span> p_b: Vec2 = phys.<span class="tok-fn">getWorldCenterOfMass</span>(world, box);

    <span class="tok-kw">const</span> anchor_a: Vec2 = .{ <span class="tok-num">3.0</span>, <span class="tok-num">0.0</span> };
    <span class="tok-kw">const</span> local_anchors = [_]Vec2{ .{ <span class="tok-num">1.0</span>, -<span class="tok-num">0.5</span> }, .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.5</span> } };
    <span class="tok-kw">for</span> (local_anchors) |la| {
        <span class="tok-kw">const</span> anchor_b: Vec2 = phys.<span class="tok-fn">getWorldPoint</span>(world, box, la);
        <span class="tok-kw">const</span> delta: Vec2 = anchor_b - anchor_a;
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(delta[<span class="tok-num">0</span>] * delta[<span class="tok-num">0</span>] + delta[<span class="tok-num">1</span>] * delta[<span class="tok-num">1</span>]);
        <span class="tok-kw">const</span> slack: f32 = <span class="tok-num">1.0</span>;
        <span class="tok-kw">const</span> c: f32 = dist - slack;
        <span class="tok-kw">if</span> (c &lt; <span class="tok-num">0.0</span> <span class="tok-kw">or</span> dist &lt; <span class="tok-num">0.001</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> axis: Vec2 = .{ delta[<span class="tok-num">0</span>] / dist, delta[<span class="tok-num">1</span>] / dist };
        <span class="tok-kw">const</span> r_b: Vec2 = anchor_b - p_b;
        <span class="tok-kw">const</span> jb: f32 = r_b[<span class="tok-num">0</span>] * axis[<span class="tok-num">1</span>] - r_b[<span class="tok-num">1</span>] * axis[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> k: f32 = inv_mass + jb * inv_i * jb;
        <span class="tok-kw">const</span> inv_k: f32 = <span class="tok-kw">if</span> (k &lt; <span class="tok-num">0.0001</span>) <span class="tok-num">0.0</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span> / k;
        <span class="tok-kw">const</span> cdot: f32 = v_b[<span class="tok-num">0</span>] * axis[<span class="tok-num">0</span>] + v_b[<span class="tok-num">1</span>] * axis[<span class="tok-num">1</span>] + jb * omega_b;
        <span class="tok-kw">const</span> impulse: f32 = -mass_coef * inv_k * (cdot + bias_coef * c);
        <span class="tok-kw">const</span> applied: f32 = <span class="tok-fn">clamp</span>(impulse, -max_force * dt, <span class="tok-num">0.0</span>);
        v_b = .{ v_b[<span class="tok-num">0</span>] + axis[<span class="tok-num">0</span>] * inv_mass * applied, v_b[<span class="tok-num">1</span>] + axis[<span class="tok-num">1</span>] * inv_mass * applied };
        omega_b += applied * inv_i * jb;
    }
    phys.<span class="tok-fn">setLinearVelocity</span>(world, box, v_b);
    phys.<span class="tok-fn">setAngularVelocity</span>(world, box, omega_b);
}

<span class="tok-kw">fn</span> <span class="tok-fn">jointFilter</span>(world: *phys.World) !void {
    <span class="tok-comment">// A filter joint disables collision between two specific bodies (more targeted than shape</span>
    <span class="tok-comment">// filters): the two boxes can overlap while still landing on the ground.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundSegment</span>(world, <span class="tok-num">20</span>);
    <span class="tok-kw">const</span> a: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">4</span>, .y = <span class="tok-num">2</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, a, .{ .hw = <span class="tok-num">2</span>, .hh = <span class="tok-num">2</span> });
    <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">4</span>, .y = <span class="tok-num">2</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">2</span>, .hh = <span class="tok-num">2</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createFilterJoint</span>(world, .{ .body_a = a, .body_b = b });
}

<span class="tok-kw">fn</span> <span class="tok-fn">jointTopDownFriction</span>(world: *phys.World) !void {
    <span class="tok-comment">// Top-down view (gravity off): each body is tied to the static frame by a motor joint with</span>
    <span class="tok-comment">// a small max force/torque, acting as friction. A 10x10 grid of mixed bouncy shapes in an arena.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">const</span> walls = [<span class="tok-num">4</span>][<span class="tok-num">2</span>]Vec2{
        .{ .{ -<span class="tok-num">10</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">10</span>, <span class="tok-num">0</span> } },
        .{ .{ -<span class="tok-num">10</span>, <span class="tok-num">0</span> }, .{ -<span class="tok-num">10</span>, <span class="tok-num">20</span> } },
        .{ .{ <span class="tok-num">10</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">10</span>, <span class="tok-num">20</span> } },
        .{ .{ -<span class="tok-num">10</span>, <span class="tok-num">20</span> }, .{ <span class="tok-num">10</span>, <span class="tok-num">20</span> } },
    };
    <span class="tok-kw">for</span> (walls) |seg| {
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
            .geom = .{ .segment = .{ .point1 = seg[<span class="tok-num">0</span>], .point2 = seg[<span class="tok-num">1</span>] } },
        });
    }
    <span class="tok-kw">var</span> y: f32 = <span class="tok-num">15</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">10</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> x: f32 = -<span class="tok-num">5</span>;
        <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (j &lt; <span class="tok-num">10</span>) : (j += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y, .gravity_scale = <span class="tok-num">0</span> });
            <span class="tok-kw">const</span> rem: usize = (<span class="tok-num">10</span> * i + j) % <span class="tok-num">4</span>;
            <span class="tok-kw">if</span> (rem == <span class="tok-num">0</span>) {
                <span class="tok-kw">try</span> <span class="tok-fn">attachCapsule</span>(world, b, .{ .half_len = <span class="tok-num">0.25</span>, .r = <span class="tok-num">0.25</span>, .horizontal = true, .restitution = <span class="tok-num">0.8</span> });
            } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (rem == <span class="tok-num">1</span>) {
                <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, b, .{ .r = <span class="tok-num">0.35</span>, .restitution = <span class="tok-num">0.8</span> });
            } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (rem == <span class="tok-num">2</span>) {
                <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">0.35</span>, .hh = <span class="tok-num">0.35</span>, .restitution = <span class="tok-num">0.8</span> });
            } <span class="tok-kw">else</span> {
                <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">0.35</span>, .hh = <span class="tok-num">0.35</span>, .round = <span class="tok-num">0.1</span>, .restitution = <span class="tok-num">0.8</span> });
            }
            _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createMotorJoint</span>(world, .{
                .base = .{ .body_a = ground, .body_b = b, .collide_connected = true },
                .max_velocity_force = <span class="tok-num">10</span>,
                .max_velocity_torque = <span class="tok-num">10</span>,
            });
            x += <span class="tok-num">1</span>;
        }
        y -= <span class="tok-num">1</span>;
    }
}

<span class="tok-comment">// ---- Shapes (stateful) ----</span>

<span class="tok-kw">fn</span> <span class="tok-fn">shapesRecreateStaticBuild</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-comment">// Each step the static ground is destroyed and recreated from scratch - exercises rebuilding</span>
    <span class="tok-comment">// a static body every frame under a resting dynamic box without it falling through.</span>
    <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">1</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">1</span>, .hh = <span class="tok-num">1</span> });
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>; <span class="tok-comment">// no ground created yet</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">shapesRecreateStaticUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] == <span class="tok-num">1</span>) {
        phys.<span class="tok-fn">destroyBody</span>(world, st.body[<span class="tok-num">0</span>]);
    }
    <span class="tok-kw">const</span> g: BodyHandle = phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    _ = phys.<span class="tok-fn">createShape</span>(world, g, .{
        .geom = .{ .segment = .{ .point1 = .{ -<span class="tok-num">10</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">10</span>, <span class="tok-num">0</span> } } },
    }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    st.body[<span class="tok-num">0</span>] = g;
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">jointScaleRagdoll</span>(world: *phys.World) !void {
    <span class="tok-comment">// The same ragdoll built at several scales, demonstrating scale-invariant joint behaviour.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">40</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> scales = [<span class="tok-num">4</span>]f32{ <span class="tok-num">0.5</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.5</span>, <span class="tok-num">2.0</span> };
    <span class="tok-kw">const</span> xs = [<span class="tok-num">4</span>]f32{ -<span class="tok-num">7.5</span>, -<span class="tok-num">3.0</span>, <span class="tok-num">1.5</span>, <span class="tok-num">7.0</span> };
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">4</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">try</span> <span class="tok-fn">makeRagdoll</span>(world, xs[i], <span class="tok-num">3.0</span> + scales[i] * <span class="tok-num">1.5</span>, scales[i]);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">continuousBounceHumans</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-comment">// A box arena with bouncy walls + a very bouncy centre circle. Ragdolls spawn one every two</span>
    <span class="tok-comment">// seconds and tumble as gravity sweeps around the compass (handled in the update hook).</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">const</span> walls = [<span class="tok-num">4</span>][<span class="tok-num">2</span>]Vec2{
        .{ .{ -<span class="tok-num">10</span>, -<span class="tok-num">10</span> }, .{ <span class="tok-num">10</span>, -<span class="tok-num">10</span> } },
        .{ .{ <span class="tok-num">10</span>, -<span class="tok-num">10</span> }, .{ <span class="tok-num">10</span>, <span class="tok-num">10</span> } },

<span class="tok-kw">fn</span> <span class="tok-fn">continuousBounceHumansUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">60.0</span>;
    <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] &lt; <span class="tok-num">5</span> <span class="tok-kw">and</span> st.f[<span class="tok-num">0</span>] &lt;= <span class="tok-num">0</span>) {
        <span class="tok-fn">makeRagdoll</span>(world, <span class="tok-num">0</span>, <span class="tok-num">5</span>, <span class="tok-num">1</span>) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
        st.u[<span class="tok-num">0</span>] += <span class="tok-num">1</span>;
        st.f[<span class="tok-num">0</span>] = <span class="tok-num">2.0</span>;
    }
    st.f[<span class="tok-num">1</span>] += dt;
    st.f[<span class="tok-num">0</span>] -= dt;
    <span class="tok-kw">const</span> t: f32 = st.f[<span class="tok-num">1</span>];
    world.settings.gravity = .{ <span class="tok-num">10.0</span> * <span class="tok-builtin">@sin</span>(<span class="tok-num">0.5</span> * t), <span class="tok-num">10.0</span> * <span class="tok-builtin">@cos</span>(t) };
}

<span class="tok-kw">fn</span> <span class="tok-fn">jointBreakable</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-comment">// Four boxes of increasing mass pinned to the ground by revolute joints, above a floor.</span>
    <span class="tok-comment">// The update hook reads each joint's constraint force (~ the weight it holds) and destroys</span>
    <span class="tok-comment">// the joint once it passes a threshold, so the heavier boxes break free and drop while the</span>
    <span class="tok-comment">// lighter ones keep hanging. Demonstrates getConstraintForce + destroyJoint. (box2d's version</span>
    <span class="tok-comment">// cycles joint types behind a live force slider.)</span>
    <span class="tok-kw">const</span> g: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, g, <span class="tok-num">40</span>, <span class="tok-num">0.5</span>, .{ <span class="tok-num">0</span>, -<span class="tok-num">0.5</span> }, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> dens = [<span class="tok-num">4</span>]f32{ <span class="tok-num">2</span>, <span class="tok-num">6</span>, <span class="tok-num">12</span>, <span class="tok-num">20</span> };
    <span class="tok-kw">const</span> xs = [<span class="tok-num">4</span>]f32{ -<span class="tok-num">9</span>, -<span class="tok-num">3</span>, <span class="tok-num">3</span>, <span class="tok-num">9</span> };
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">4</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> box: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = xs[i], .y = <span class="tok-num">7</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, box, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span>, .density = dens[i] });
        st.body[i] = box;
        st.joint[i] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
            .base = .{
                .body_a = g,
                .body_b = box,
                .local_frame_a = .{ .p = .{ xs[i], <span class="tok-num">7</span> }, .q = Rot2.identity },
                .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
            },
        });
        st.u[i] = <span class="tok-num">0</span>;
    }
    st.f[<span class="tok-num">0</span>] = <span class="tok-num">80</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">jointBreakableUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-kw">const</span> bf2: f32 = st.f[<span class="tok-num">0</span>] * st.f[<span class="tok-num">0</span>];
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">4</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (st.u[i] != <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> force: Vec2 = phys.<span class="tok-fn">getConstraintForce</span>(world, st.joint[i]);
        <span class="tok-kw">if</span> (force[<span class="tok-num">0</span>] * force[<span class="tok-num">0</span>] + force[<span class="tok-num">1</span>] * force[<span class="tok-num">1</span>] &gt; bf2) {
            phys.<span class="tok-fn">destroyJoint</span>(world, st.joint[i]);
            st.u[i] = <span class="tok-num">1</span>;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">jointMotionLocks</span>(world: *phys.World) !void {
    <span class="tok-comment">// A gallery of six rotation-locked boxes (angular DOF locked), one per joint type, showing how</span>
    <span class="tok-comment">// each joint holds a locked body: distance, motor, prismatic, revolute, weld, wheel. (box2d adds</span>

    <span class="tok-kw">try</span> <span class="tok-fn">pinDistance</span>(world, g, b, .{ .pa = .{ x, y + <span class="tok-num">3</span> }, .pb = .{ x, y + <span class="tok-num">1</span> }, .length = <span class="tok-num">2</span> });
    x += <span class="tok-num">5</span>;

    x += <span class="tok-num">5</span>;

    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">1</span>, .hh = <span class="tok-num">1</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">pinPrismatic</span>(world, g, b, .{ .anchor = .{ x - <span class="tok-num">1</span>, y } });
    x += <span class="tok-num">5</span>;
    b = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y, .lock_rot = true });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">1</span>, .hh = <span class="tok-num">1</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">pinRevolute</span>(world, g, b, .{ .anchor = .{ x - <span class="tok-num">1</span>, y } });
    x += <span class="tok-num">5</span>;
    b = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y, .lock_rot = true });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">1</span>, .hh = <span class="tok-num">1</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">pinWeld</span>(world, g, b, .{ x - <span class="tok-num">1</span>, y });
    x += <span class="tok-num">5</span>;

    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">1</span>, .hh = <span class="tok-num">1</span> });

<span class="tok-kw">fn</span> <span class="tok-fn">jointScissorLift</span>(world: *phys.World) !void {
    <span class="tok-comment">// A scissor lift: three stacked levels of crossed capsule links pinned with stiff revolute</span>
    <span class="tok-comment">// joints (+ a no-spring wheel joint on one side per level so the X can expand horizontally),</span>
    <span class="tok-comment">// topped by a platform. A sprung distance-joint strut holds it up. (box2d puts a live motor on</span>
    <span class="tok-comment">// that strut to raise/lower; our static version rests at the sprung height.) 8 substeps for the</span>
    <span class="tok-comment">// stiff joints.</span>
    world.settings.sub_step_count = <span class="tok-num">8</span>;
    <span class="tok-kw">const</span> ch: f32 = <span class="tok-num">240</span>;
    <span class="tok-kw">const</span> cd: f32 = <span class="tok-num">20</span>;
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ -<span class="tok-num">20</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">20</span>, <span class="tok-num">0</span> } } },
    });
    <span class="tok-kw">var</span> base1: BodyHandle = ground;
    <span class="tok-kw">var</span> base2: BodyHandle = ground;
    <span class="tok-kw">var</span> anchor1: Vec2 = .{ -<span class="tok-num">2.5</span>, <span class="tok-num">0.2</span> };
    <span class="tok-kw">var</span> anchor2: Vec2 = .{ <span class="tok-num">2.5</span>, <span class="tok-num">0.2</span> };
    <span class="tok-kw">var</span> y: f32 = <span class="tok-num">0.5</span>;
    <span class="tok-kw">var</span> link1: BodyHandle = ground;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">3</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> a: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = y, .angle = <span class="tok-num">0.15</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCapsule</span>(world, a, .{ .half_len = <span class="tok-num">2.5</span>, .r = <span class="tok-num">0.15</span>, .horizontal = true });
        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = y, .angle = -<span class="tok-num">0.15</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCapsule</span>(world, b, .{ .half_len = <span class="tok-num">2.5</span>, .r = <span class="tok-num">0.15</span>, .horizontal = true });
        <span class="tok-kw">if</span> (i == <span class="tok-num">1</span>) {
            link1 = b;
        }
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{ .base = .{
            .body_a = base1,
            .body_b = a,
            .local_frame_a = .{ .p = anchor1, .q = Rot2.identity },
            .local_frame_b = .{ .p = .{ -<span class="tok-num">2.5</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
            .collide_connected = i == <span class="tok-num">0</span>,
            .constraint_hertz = ch,
            .constraint_damping_ratio = cd,
        } });
        <span class="tok-kw">if</span> (i == <span class="tok-num">0</span>) {
            _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createWheelJoint</span>(world, .{
                .base = .{
                    .body_a = base2,
                    .body_b = b,
                    .local_frame_a = .{ .p = anchor2, .q = Rot2.identity },
                    .local_frame_b = .{ .p = .{ <span class="tok-num">2.5</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
                    .collide_connected = true,
                    .constraint_hertz = ch,
                    .constraint_damping_ratio = cd,
                },
                .enable_spring = false,
            });
        } <span class="tok-kw">else</span> {
            _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{ .base = .{
                .body_a = base2,
                .body_b = b,
                .local_frame_a = .{ .p = anchor2, .q = Rot2.identity },
                .local_frame_b = .{ .p = .{ <span class="tok-num">2.5</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
                .collide_connected = false,
                .constraint_hertz = ch,
                .constraint_damping_ratio = cd,
            } });
        }
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{ .base = .{
            .body_a = a,
            .body_b = b,
            .local_frame_a = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
            .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
            .collide_connected = false,
            .constraint_hertz = ch,
            .constraint_damping_ratio = cd,
        } });
        base1 = b;
        base2 = a;
        anchor1 = .{ -<span class="tok-num">2.5</span>, <span class="tok-num">0</span> };
        anchor2 = .{ <span class="tok-num">2.5</span>, <span class="tok-num">0</span> };
        y += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">const</span> platform: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = y });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, platform, .{ .hw = <span class="tok-num">3</span>, .hh = <span class="tok-num">0.2</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{ .base = .{
        .body_a = platform,
        .body_b = base1,
        .local_frame_a = .{ .p = .{ -<span class="tok-num">2.5</span>, -<span class="tok-num">0.4</span> }, .q = Rot2.identity },
        .local_frame_b = .{ .p = anchor1, .q = Rot2.identity },
        .collide_connected = true,
        .constraint_hertz = ch,
        .constraint_damping_ratio = cd,
    } });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createWheelJoint</span>(world, .{
        .base = .{
            .body_a = platform,
            .body_b = base2,
            .local_frame_a = .{ .p = .{ <span class="tok-num">2.5</span>, -<span class="tok-num">0.4</span> }, .q = Rot2.identity },
            .local_frame_b = .{ .p = anchor2, .q = Rot2.identity },
            .collide_connected = true,
            .constraint_hertz = ch,
            .constraint_damping_ratio = cd,
        },
        .enable_spring = false,
    });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createDistanceJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = link1,
            .local_frame_a = .{ .p = .{ -<span class="tok-num">2.5</span>, <span class="tok-num">0.2</span> }, .q = Rot2.identity },
            .local_frame_b = .{ .p = .{ <span class="tok-num">0.5</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
        },
        .enable_spring = true,
        .min_length = <span class="tok-num">0.2</span>,

    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkLargeCompounds</span>(world: *phys.World) !void {
    <span class="tok-comment">// box2d Benchmark|Large Compounds: many compound bodies, each assembled from several shapes with the</span>
    <span class="tok-comment">// mass solve deferred (ShapeDef.update_body_mass=false) and applied once via applyMassFromShapes - O(N)</span>
    <span class="tok-comment">// per body instead of O(N^2). Here a modest grid of plus-shaped compounds drops into a wide bin.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">16</span>, <span class="tok-num">1</span>);

    <span class="tok-kw">const</span> offsets = [_]Vec2{ .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> }, .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> }, .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span> } };
    <span class="tok-kw">var</span> row: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (row &lt; <span class="tok-num">5</span>) : (row += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> col: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (col &lt; <span class="tok-num">5</span>) : (col += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> x: f32 = -<span class="tok-num">8.0</span> + <span class="tok-fn">float</span>(col) * <span class="tok-num">4.0</span>;
            <span class="tok-kw">const</span> y: f32 = <span class="tok-num">4.0</span> + <span class="tok-fn">float</span>(row) * <span class="tok-num">3.0</span>;
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y });
            <span class="tok-kw">for</span> (offsets) |off| {
                _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, b, .{
                    .geom = .{ .polygon = phys.<span class="tok-fn">makeOffsetBox</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, off, Rot2.identity) },
                    .density = <span class="tok-num">1.0</span>,
                    .update_body_mass = false,
                });
            }
            phys.<span class="tok-fn">applyMassFromShapes</span>(world, b);
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkSmash</span>(world: *phys.World) !void {

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkJunkyard</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-comment">// A junkyard: a box-walled bucket, a pile of small pentagons raining in, and a kinematic pusher</span>
    <span class="tok-comment">// that sweeps side to side (update hook drives its velocity). (box2d rains ~8000 pieces; we use</span>
    <span class="tok-comment">// fewer for the phone.)</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">var</span> x: f32 = -<span class="tok-num">40</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">81</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">0.55</span>, <span class="tok-num">0.5</span>, .{ x, <span class="tok-num">0</span> }, <span class="tok-num">1</span>);
        x += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">var</span> y: f32 = <span class="tok-num">1</span>;
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">30</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">0.5</span>, <span class="tok-num">0.55</span>, .{ -<span class="tok-num">40</span>, y }, <span class="tok-num">1</span>);
        <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">0.5</span>, <span class="tok-num">0.55</span>, .{ <span class="tok-num">40</span>, y }, <span class="tok-num">1</span>);
        y += <span class="tok-num">1</span>;
    }
    <span class="tok-comment">// Pentagon prototype (Fibonacci-sphere of 5 points, radius 0.25).</span>
    <span class="tok-kw">const</span> golden: f32 = pi * <span class="tok-num">1.2360680</span>;
    <span class="tok-kw">var</span> pts: [<span class="tok-num">5</span>]Vec2 = undefined;
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">5</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> th: f32 = golden * <span class="tok-fn">float</span>(i);
        pts[i] = .{ <span class="tok-num">0.25</span> * <span class="tok-builtin">@cos</span>(th), <span class="tok-num">0.25</span> * <span class="tok-builtin">@sin</span>(th) };
    }
    <span class="tok-kw">var</span> side: f32 = -<span class="tok-num">0.1</span>;
    <span class="tok-kw">var</span> c: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (c &lt; <span class="tok-num">60</span>) : (c += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> r: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (r &lt; <span class="tok-num">8</span>) : (r += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> px: f32 = <span class="tok-num">1.5</span> * (<span class="tok-num">2.0</span> * <span class="tok-fn">float</span>(c) - <span class="tok-num">60.0</span>) * <span class="tok-num">0.25</span>;
            <span class="tok-kw">const</span> py: f32 = <span class="tok-num">4.0</span> * <span class="tok-fn">float</span>(r) * <span class="tok-num">0.25</span> + <span class="tok-num">15.0</span>;
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = px + side, .y = py });
            <span class="tok-kw">try</span> <span class="tok-fn">attachHull</span>(world, b, &amp;pts, <span class="tok-num">1</span>);
            side = -side;
        }
    }
    <span class="tok-kw">const</span> pusher: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .kinematic });
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, pusher, <span class="tok-num">2</span>, <span class="tok-num">4</span>, .{ <span class="tok-num">0</span>, <span class="tok-num">4</span> }, <span class="tok-num">1</span>);
    st.body[<span class="tok-num">0</span>] = pusher;
    st.f[<span class="tok-num">0</span>] = <span class="tok-num">0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkJunkyardUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">60.0</span>;
    st.f[<span class="tok-num">0</span>] += dt;
    <span class="tok-kw">const</span> vx: f32 = <span class="tok-num">6.0</span> * <span class="tok-builtin">@cos</span>(<span class="tok-num">0.2</span> * st.f[<span class="tok-num">0</span>]);

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkSleep</span>(world: *phys.World) !void {
    <span class="tok-comment">// A tall triangular pyramid of boxes that settles and goes to sleep. (box2d base 100; reduced</span>
    <span class="tok-comment">// for the phone.)</span>
    <span class="tok-kw">const</span> count: usize = <span class="tok-num">30</span>;
    <span class="tok-kw">const</span> shift: f32 = <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> centerx: f32 = shift * <span class="tok-fn">float</span>(count) / <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> centery: f32 = shift / <span class="tok-num">2.0</span> + <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">40</span>, <span class="tok-num">1</span>, .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, <span class="tok-num">1</span>);
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> y: f32 = fi * shift + centery;
        <span class="tok-kw">var</span> j: usize = i;
        <span class="tok-kw">while</span> (j &lt; count) : (j += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> fj: f32 = <span class="tok-fn">float</span>(j);
            <span class="tok-kw">const</span> x: f32 = <span class="tok-num">0.5</span> * fi * shift + (fj - fi) * shift - centerx;
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y });
            <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span>, .friction = <span class="tok-num">0.5</span> });
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkKinematic</span>(world: *phys.World) !void {
    <span class="tok-comment">// One large kinematic body - a grid of square shapes - spinning slowly; a broadphase stress</span>
    <span class="tok-comment">// test. (box2d uses a wider grid; reduced for the phone.)</span>
    <span class="tok-kw">const</span> body: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .motion = .kinematic, .w = <span class="tok-num">1.0</span> });

<span class="tok-comment">/// A static U-shaped bin: a floor plus two side walls, centred on the origin. Returns the ground</span>
<span class="tok-comment">/// body. box2d's benchmark bins are built from ~280 little boxes; three large boxes read identically</span>
<span class="tok-comment">/// for our purposes and leave more of the body pool for the dynamic payload.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">benchBin</span>(
    world: *phys.World,
    half_w: f32,
    wall_h: f32,
) !BodyHandle {
    <span class="tok-kw">const</span> g: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, g, half_w, <span class="tok-num">0.5</span>, .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, <span class="tok-num">1</span>);
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, g, <span class="tok-num">0.5</span>, wall_h, .{ -half_w - <span class="tok-num">0.5</span>, wall_h }, <span class="tok-num">1</span>);
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, g, <span class="tok-num">0.5</span>, wall_h, .{ half_w + <span class="tok-num">0.5</span>, wall_h }, <span class="tok-num">1</span>);
    <span class="tok-kw">return</span> g;
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkCompounds</span>(world: *phys.World) !void {
    <span class="tok-comment">// A grid of two-triangle compound bodies dropped into a bin - box2d's compound-collision</span>
    <span class="tok-comment">// benchmark (3000 bodies there; reduced for the phone). Each body carries a left and right</span>
    <span class="tok-comment">// triangle hull that together read as a hollow wedge.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">benchBin</span>(world, <span class="tok-num">15</span>, <span class="tok-num">20</span>);

    <span class="tok-kw">const</span> left_pts = [<span class="tok-num">3</span>]Vec2{ .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">0.5</span>, <span class="tok-num">1</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">2</span> } };
    <span class="tok-kw">const</span> right_pts = [<span class="tok-num">3</span>]Vec2{ .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> }, .{ -<span class="tok-num">0.5</span>, <span class="tok-num">1</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">2</span> } };
    <span class="tok-kw">const</span> left: phys.Polygon = phys.<span class="tok-fn">makePolygon</span>(phys.<span class="tok-fn">computeHull</span>(&amp;left_pts), <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> right: phys.Polygon = phys.<span class="tok-fn">makePolygon</span>(phys.<span class="tok-fn">computeHull</span>(&amp;right_pts), <span class="tok-num">0</span>);

    <span class="tok-kw">const</span> columns: usize = <span class="tok-num">14</span>;
    <span class="tok-kw">const</span> rows: usize = <span class="tok-num">14</span>;
    <span class="tok-kw">const</span> shift: f32 = <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> extray: f32 = <span class="tok-num">0.25</span>;
    <span class="tok-kw">const</span> centerx: f32 = shift * <span class="tok-fn">float</span>(columns) / <span class="tok-num">2.0</span> - <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> centery: f32 = <span class="tok-num">1.15</span> / <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> y_start: f32 = <span class="tok-num">5.0</span>;
    <span class="tok-kw">var</span> side: f32 = <span class="tok-num">0.25</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; columns) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">float</span>(i) * shift - centerx;
        <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (j &lt; rows) : (j += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> y: f32 = <span class="tok-fn">float</span>(j) * (shift + extray) + centery + y_start;
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x + side, .y = y });
            side = -side;
            _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, b, .{
                .geom = .{ .polygon = left },
                .density = <span class="tok-num">1</span>,
                .material = .{ .friction = <span class="tok-num">0.5</span> },
            });
            _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, b, .{
                .geom = .{ .polygon = right },
                .density = <span class="tok-num">1</span>,
                .material = .{ .friction = <span class="tok-num">0.5</span> },
            });
        }
    }
}

<span class="tok-comment">/// A cheap deterministic hash -&gt; [0,1), so the barrel's mixed shapes vary without an RNG.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">hash01</span>(n: f32) f32 {
    <span class="tok-kw">const</span> h: f32 = <span class="tok-builtin">@sin</span>(n * <span class="tok-num">12.9898</span>) * <span class="tok-num">43758.5453</span>;
    <span class="tok-kw">return</span> h - <span class="tok-builtin">@floor</span>(h);
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkBarrel</span>(world: *phys.World) !void {
    <span class="tok-comment">// A bin packed with a grid of mixed shapes - circles, capsules, rounded boxes, and wedges -</span>
    <span class="tok-comment">// box2d's "Barrel" benchmark in its mixed-shape mode. Sizes vary deterministically per index.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">benchBin</span>(world, <span class="tok-num">11</span>, <span class="tok-num">22</span>);

    <span class="tok-kw">const</span> wedge_pts = [<span class="tok-num">3</span>]Vec2{ .{ -<span class="tok-num">0.1</span>, -<span class="tok-num">0.5</span> }, .{ <span class="tok-num">0.1</span>, -<span class="tok-num">0.5</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">0.5</span> } };
    <span class="tok-kw">const</span> wedge: phys.Polygon = phys.<span class="tok-fn">makePolygon</span>(phys.<span class="tok-fn">computeHull</span>(&amp;wedge_pts), <span class="tok-num">0</span>);

    <span class="tok-kw">const</span> columns: usize = <span class="tok-num">14</span>;
    <span class="tok-kw">const</span> rows: usize = <span class="tok-num">22</span>;
    <span class="tok-kw">const</span> shift: f32 = <span class="tok-num">1.15</span>;
    <span class="tok-kw">const</span> centerx: f32 = shift * <span class="tok-fn">float</span>(columns) / <span class="tok-num">2.0</span>;
    <span class="tok-kw">var</span> index: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; columns) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">float</span>(i) * shift - centerx;
        <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (j &lt; rows) : (j += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> y: f32 = <span class="tok-num">1.0</span> + <span class="tok-fn">float</span>(j) * <span class="tok-num">1.3</span>;
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y });
            <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(index);
            <span class="tok-kw">const</span> r: f32 = <span class="tok-fn">hash01</span>(fi);
            <span class="tok-kw">switch</span> (index % <span class="tok-num">4</span>) {
                <span class="tok-num">0</span> =&gt; <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, b, .{
                    .r = <span class="tok-num">0.25</span> + <span class="tok-num">0.5</span> * r,
                    .density = <span class="tok-num">1</span>,
                    .friction = <span class="tok-num">0.5</span>,
                    .rolling = <span class="tok-num">0.2</span>,
                }),
                <span class="tok-num">1</span> =&gt; <span class="tok-kw">try</span> <span class="tok-fn">attachCapsule</span>(world, b, .{
                    .half_len = <span class="tok-num">0.125</span> + <span class="tok-num">0.375</span> * r,
                    .r = <span class="tok-num">0.25</span> + <span class="tok-num">0.25</span> * <span class="tok-fn">hash01</span>(fi + <span class="tok-num">7</span>),
                    .density = <span class="tok-num">1</span>,
                    .friction = <span class="tok-num">0.5</span>,
                }),
                <span class="tok-num">2</span> =&gt; <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{
                    .hw = <span class="tok-num">0.1</span> + <span class="tok-num">0.4</span> * r,
                    .hh = <span class="tok-num">0.5</span> + <span class="tok-num">0.25</span> * <span class="tok-fn">hash01</span>(fi + <span class="tok-num">3</span>),
                    .round = <span class="tok-num">0.25</span> * <span class="tok-fn">hash01</span>(fi + <span class="tok-num">5</span>),
                    .density = <span class="tok-num">1</span>,
                    .friction = <span class="tok-num">0.5</span>,
                }),
                <span class="tok-kw">else</span> =&gt; _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, b, .{
                    .geom = .{ .polygon = wedge },
                    .density = <span class="tok-num">1</span>,
                    .material = .{ .friction = <span class="tok-num">0.5</span> },
                }),
            }
            index += <span class="tok-num">1</span>;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">labShapeDistance</span>(ctx: *render.LabCtx) void {
    <span class="tok-comment">// GJK distance between a fixed box A at the origin and a box B that follows the pointer:</span>
    <span class="tok-comment">// draws the two closest points and the segment between them (collapses when overlapping).</span>
    <span class="tok-kw">const</span> a_pts = [<span class="tok-num">4</span>]Vec2{ .{ -<span class="tok-num">1.5</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1.5</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1.5</span>, <span class="tok-num">1</span> }, .{ -<span class="tok-num">1.5</span>, <span class="tok-num">1</span> } };

    <span class="tok-kw">var</span> cache: phys.SimplexCache = phys.SimplexCache.empty;

    ctx.<span class="tok-fn">rect</span>(
        .{ ctx.pointer[<span class="tok-num">0</span>] - <span class="tok-num">0.8</span>, ctx.pointer[<span class="tok-num">1</span>] - <span class="tok-num">0.6</span> },
        .{ ctx.pointer[<span class="tok-num">0</span>] + <span class="tok-num">0.8</span>, ctx.pointer[<span class="tok-num">1</span>] + <span class="tok-num">0.6</span> },

    );
    ctx.<span class="tok-fn">line</span>(out.point_a, out.point_b, c_green, <span class="tok-num">2</span>);
    ctx.<span class="tok-fn">mark</span>(out.point_a, <span class="tok-num">5</span>, c_red);
    ctx.<span class="tok-fn">mark</span>(out.point_b, <span class="tok-num">5</span>, c_red);

<span class="tok-kw">fn</span> <span class="tok-fn">labManifold</span>(ctx: *render.LabCtx) void {
    <span class="tok-comment">// Contact manifold between a fixed box A at the origin and a slowly rotating box B at the</span>
    <span class="tok-comment">// pointer: draws the manifold points and the contact normal (pointing A -&gt; B).</span>
    <span class="tok-kw">const</span> a: phys.Polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">1.5</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> b: phys.Polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">1.0</span>, <span class="tok-num">0.8</span>);
    <span class="tok-kw">const</span> ang: f32 = ctx.time * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> ca: f32 = <span class="tok-builtin">@cos</span>(ang);
    <span class="tok-kw">const</span> sa: f32 = <span class="tok-builtin">@sin</span>(ang);
    <span class="tok-kw">const</span> xf: phys.Transform2 = .{ .p = ctx.pointer, .q = Rot2.<span class="tok-fn">fromAngle</span>(ang) };
    <span class="tok-kw">const</span> m: phys.LocalManifold = phys.<span class="tok-fn">collidePolygons</span>(a, b, xf);
    ctx.<span class="tok-fn">rect</span>(.{ -<span class="tok-num">1.5</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1.5</span>, <span class="tok-num">1</span> }, c_dim, <span class="tok-num">1.5</span>);
    <span class="tok-kw">const</span> bx = [<span class="tok-num">4</span>]Vec2{ .{ -<span class="tok-num">1</span>, -<span class="tok-num">0.8</span> }, .{ <span class="tok-num">1</span>, -<span class="tok-num">0.8</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">0.8</span> }, .{ -<span class="tok-num">1</span>, <span class="tok-num">0.8</span> } };
    <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (k &lt; <span class="tok-num">4</span>) : (k += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> p0: Vec2 = bx[k];
        <span class="tok-kw">const</span> p1: Vec2 = bx[(k + <span class="tok-num">1</span>) % <span class="tok-num">4</span>];
        <span class="tok-kw">const</span> w0: Vec2 = .{ ctx.pointer[<span class="tok-num">0</span>] + ca * p0[<span class="tok-num">0</span>] - sa * p0[<span class="tok-num">1</span>], ctx.pointer[<span class="tok-num">1</span>] + sa * p0[<span class="tok-num">0</span>] + ca * p0[<span class="tok-num">1</span>] };
        <span class="tok-kw">const</span> w1: Vec2 = .{ ctx.pointer[<span class="tok-num">0</span>] + ca * p1[<span class="tok-num">0</span>] - sa * p1[<span class="tok-num">1</span>], ctx.pointer[<span class="tok-num">1</span>] + sa * p1[<span class="tok-num">0</span>] + ca * p1[<span class="tok-num">1</span>] };
        ctx.<span class="tok-fn">line</span>(w0, w1, c_amber, <span class="tok-num">1.5</span>);
    }
    <span class="tok-kw">const</span> cnt: usize = m.count;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; cnt) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> p: Vec2 = m.points[i].point;
        ctx.<span class="tok-fn">mark</span>(p, <span class="tok-num">5</span>, c_red);
        <span class="tok-kw">const</span> tip: Vec2 = .{ p[<span class="tok-num">0</span>] + m.normal[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>] + m.normal[<span class="tok-num">1</span>] };
        ctx.<span class="tok-fn">arrow</span>(p, tip, c_green, <span class="tok-num">2</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">labCastWorldLab</span>(ctx: *render.LabCtx) void {
    <span class="tok-comment">// A full fan of rays cast from a point against the whole world; each ray stops at its closest</span>
    <span class="tok-comment">// hit, and the fan rotates slowly. (box2d's Cast World stress-tests many world ray casts.)</span>
    <span class="tok-kw">const</span> origin: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span> };
    <span class="tok-kw">const</span> n: usize = <span class="tok-num">32</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> frac: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(n);
        <span class="tok-kw">const</span> ang: f32 = frac * <span class="tok-num">2.0</span> * pi + ctx.time * <span class="tok-num">0.2</span>;
        <span class="tok-kw">const</span> dir: Vec2 = .{ <span class="tok-builtin">@cos</span>(ang) * <span class="tok-num">20.0</span>, <span class="tok-builtin">@sin</span>(ang) * <span class="tok-num">20.0</span> };
        <span class="tok-kw">const</span> hit: ?phys.RayResult = phys.<span class="tok-fn">castRayClosest</span>(ctx.world, origin, dir, .{});
        <span class="tok-kw">if</span> (hit) |rr| {
            ctx.<span class="tok-fn">line</span>(origin, rr.point, c_amber, <span class="tok-num">1</span>);
            ctx.<span class="tok-fn">mark</span>(rr.point, <span class="tok-num">3</span>, c_red);
        } <span class="tok-kw">else</span> {
            ctx.<span class="tok-fn">line</span>(origin, .{ origin[<span class="tok-num">0</span>] + dir[<span class="tok-num">0</span>], origin[<span class="tok-num">1</span>] + dir[<span class="tok-num">1</span>] }, c_dim, <span class="tok-num">1</span>);
        }
    }
    ctx.<span class="tok-fn">mark</span>(origin, <span class="tok-num">5</span>, c_green);
}

<span class="tok-kw">fn</span> <span class="tok-fn">labTimeOfImpactLab</span>(ctx: *render.LabCtx) void {
