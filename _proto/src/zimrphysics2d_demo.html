<span class="tok-comment">// Tiny deterministic LCG used to scatter benchmark fields reproducibly (no global rng state).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">rngNext</span>(seed: *u32) f32 {
    seed.* = seed.* *% <span class="tok-num">1664525</span> +% <span class="tok-num">1013904223</span>;
    <span class="tok-kw">const</span> bits: u32 = seed.* &gt;&gt; <span class="tok-num">8</span>;
    <span class="tok-kw">return</span> <span class="tok-fn">float</span>(bits) / <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(u32, <span class="tok-num">1</span>) &lt;&lt; <span class="tok-num">24</span>);
}

<span class="tok-kw">fn</span> <span class="tok-fn">rngRange</span>(
    seed: *u32,
    lo: f32,
    hi: f32,
) f32 {
    <span class="tok-kw">return</span> lo + (hi - lo) * <span class="tok-fn">rngNext</span>(seed);
}

<span class="tok-comment">// box2d Benchmark|Cast, scaled for the device (the original is a 1000x1000 grid of ~100k boxes</span>
<span class="tok-comment">// with 10k rays/frame for desktop timing). A scattered field of small static boxes that</span>
<span class="tok-comment">// benchmarkCastLab sweeps a 360-degree ray fan across, exercising castRayClosest ~200x/frame.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkCast</span>(world: *phys.World) !void {
    <span class="tok-kw">var</span> seed: u32 = <span class="tok-num">1234</span>;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">240</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, -<span class="tok-num">13</span>, <span class="tok-num">13</span>);
        <span class="tok-kw">const</span> y: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, -<span class="tok-num">13</span>, <span class="tok-num">13</span>);
        <span class="tok-kw">const</span> hw: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, <span class="tok-num">0.18</span>, <span class="tok-num">0.7</span>);
        <span class="tok-kw">const</span> hh: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, <span class="tok-num">0.18</span>, <span class="tok-num">0.7</span>);
        <span class="tok-kw">const</span> ang: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, <span class="tok-num">0</span>, pi);
        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y, .angle = ang, .motion = .static });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = hw, .hh = hh });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkCastLab</span>(ctx: *render.LabCtx) void {
    <span class="tok-kw">const</span> n: u32 = <span class="tok-num">200</span>;
    <span class="tok-kw">const</span> origin: Vec2 = .{ <span class="tok-num">3.0</span> * <span class="tok-builtin">@cos</span>(ctx.time * <span class="tok-num">0.6</span>), <span class="tok-num">3.0</span> * <span class="tok-builtin">@sin</span>(ctx.time * <span class="tok-num">0.6</span>) };
    <span class="tok-kw">var</span> k: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (k &lt; n) : (k += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> a: f32 = (<span class="tok-fn">float</span>(k) / <span class="tok-fn">float</span>(n)) * <span class="tok-num">2.0</span> * pi;
        <span class="tok-kw">const</span> dir: Vec2 = .{ <span class="tok-num">30.0</span> * <span class="tok-builtin">@cos</span>(a), <span class="tok-num">30.0</span> * <span class="tok-builtin">@sin</span>(a) };
        <span class="tok-kw">const</span> hit: ?phys.RayResult = phys.<span class="tok-fn">castRayClosest</span>(ctx.world, origin, dir, .{});
        <span class="tok-kw">if</span> (hit) |rr| {
            ctx.<span class="tok-fn">line</span>(origin, rr.point, c_amber, <span class="tok-num">1</span>);
            ctx.<span class="tok-fn">mark</span>(rr.point, <span class="tok-num">2</span>, c_red);
        }
    }
    ctx.<span class="tok-fn">mark</span>(origin, <span class="tok-num">4</span>, c_green);
}

<span class="tok-comment">// box2d Benchmark|Shape Distance, scaled: a probe box (follows the pointer) vs a ring of fixed</span>
<span class="tok-comment">// boxes; recomputes the GJK distance to every box each frame and draws the closest-point segment.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkShapeDistanceLab</span>(ctx: *render.LabCtx) void {
    <span class="tok-kw">const</span> b_pts = [<span class="tok-num">4</span>]Vec2{ .{ -<span class="tok-num">0.6</span>, -<span class="tok-num">0.45</span> }, .{ <span class="tok-num">0.6</span>, -<span class="tok-num">0.45</span> }, .{ <span class="tok-num">0.6</span>, <span class="tok-num">0.45</span> }, .{ -<span class="tok-num">0.6</span>, <span class="tok-num">0.45</span> } };
    <span class="tok-kw">const</span> n: u32 = <span class="tok-num">48</span>;
    <span class="tok-kw">var</span> k: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (k &lt; n) : (k += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> a: f32 = (<span class="tok-fn">float</span>(k) / <span class="tok-fn">float</span>(n)) * <span class="tok-num">2.0</span> * pi;
        <span class="tok-kw">const</span> cx: f32 = <span class="tok-num">9.0</span> * <span class="tok-builtin">@cos</span>(a);
        <span class="tok-kw">const</span> cy: f32 = <span class="tok-num">9.0</span> * <span class="tok-builtin">@sin</span>(a);
        <span class="tok-kw">const</span> a_pts = [<span class="tok-num">4</span>]Vec2{
            .{ cx - <span class="tok-num">0.5</span>, cy - <span class="tok-num">0.5</span> },
            .{ cx + <span class="tok-num">0.5</span>, cy - <span class="tok-num">0.5</span> },
            .{ cx + <span class="tok-num">0.5</span>, cy + <span class="tok-num">0.5</span> },
            .{ cx - <span class="tok-num">0.5</span>, cy + <span class="tok-num">0.5</span> },
        };
        <span class="tok-kw">const</span> input: phys.DistanceInput = .{
            .proxy_a = phys.<span class="tok-fn">makeProxy</span>(&amp;a_pts, <span class="tok-num">0</span>),
            .proxy_b = phys.<span class="tok-fn">makeProxy</span>(&amp;b_pts, <span class="tok-num">0</span>),
            .transform = .{ .p = ctx.pointer, .q = Rot2.identity },
            .use_radii = false,
        };
        <span class="tok-kw">var</span> cache: phys.SimplexCache = phys.SimplexCache.empty;
        <span class="tok-kw">const</span> out: phys.DistanceOutput = phys.<span class="tok-fn">shapeDistance</span>(&amp;input, &amp;cache);
        ctx.<span class="tok-fn">rect</span>(.{ cx - <span class="tok-num">0.5</span>, cy - <span class="tok-num">0.5</span> }, .{ cx + <span class="tok-num">0.5</span>, cy + <span class="tok-num">0.5</span> }, c_dim, <span class="tok-num">1.0</span>);
        ctx.<span class="tok-fn">line</span>(out.point_a, out.point_b, c_green, <span class="tok-num">1.5</span>);
    }
    ctx.<span class="tok-fn">rect</span>(
        .{ ctx.pointer[<span class="tok-num">0</span>] - <span class="tok-num">0.6</span>, ctx.pointer[<span class="tok-num">1</span>] - <span class="tok-num">0.45</span> },
        .{ ctx.pointer[<span class="tok-num">0</span>] + <span class="tok-num">0.6</span>, ctx.pointer[<span class="tok-num">1</span>] + <span class="tok-num">0.45</span> },
        c_amber,
        <span class="tok-num">1.5</span>,
    );
}

<span class="tok-comment">// box2d Benchmark|CreateDestroy rebuilds a 100-row pyramid every frame to time the create/destroy</span>
<span class="tok-comment">// paths. A scene here can only track a few handles, so we churn a small cluster instead: every</span>
<span class="tok-comment">// ~0.45s the four boxes are destroyed and respawned at the top (they fall in between) - the same</span>
<span class="tok-comment">// create/destroy exercise, device-sized.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkCreateDestroy</span>(world: *phys.World, st: *SceneState) !void {
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">14</span>, <span class="tok-num">1</span>);
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>; <span class="tok-comment">// 0 = nothing spawned yet, 1 = cluster live</span>
    st.f[<span class="tok-num">0</span>] = <span class="tok-num">0</span>; <span class="tok-comment">// cycle timer</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkCreateDestroyUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">60.0</span>;
    st.f[<span class="tok-num">0</span>] += dt;
    <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] == <span class="tok-num">1</span> <span class="tok-kw">and</span> st.f[<span class="tok-num">0</span>] &lt; <span class="tok-num">0.45</span>) {
        <span class="tok-kw">return</span>;
    }
    st.f[<span class="tok-num">0</span>] = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] == <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> d: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (d &lt; <span class="tok-num">4</span>) : (d += <span class="tok-num">1</span>) {
            phys.<span class="tok-fn">destroyBody</span>(world, st.body[d]);
        }
    }
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">4</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> col: f32 = <span class="tok-fn">float</span>(i % <span class="tok-num">2</span>);
        <span class="tok-kw">const</span> row: f32 = <span class="tok-fn">float</span>(i / <span class="tok-num">2</span>);
        st.body[i] = <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">0.6</span> + col * <span class="tok-num">1.2</span>, .y = <span class="tok-num">11.0</span> + row * <span class="tok-num">1.2</span> }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
        <span class="tok-fn">attachBox</span>(world, st.body[i], .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    }
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">1</span>;
}

<span class="tok-comment">// box2d Collision|Dynamic Tree visualizes the broad-phase AABB tree (the original packs ~1e6 proxies</span>
<span class="tok-comment">// into a standalone tree). Here we draw the LIVE world tree over a bin of falling boxes: a pile that</span>
<span class="tok-comment">// keeps moving makes the tree restructure, so the internal node boxes (dim) shift around the leaves.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">collisionDynamicTree</span>(world: *phys.World) !void {
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">14</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> lw: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">13</span>, .y = <span class="tok-num">6</span>, .motion = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, lw, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">7</span> });
    <span class="tok-kw">const</span> rw: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">13</span>, .y = <span class="tok-num">6</span>, .motion = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, rw, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">7</span> });
    <span class="tok-kw">var</span> seed: u32 = <span class="tok-num">7</span>;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">48</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, -<span class="tok-num">11</span>, <span class="tok-num">11</span>);
        <span class="tok-kw">const</span> y: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, <span class="tok-num">3</span>, <span class="tok-num">16</span>);
        <span class="tok-kw">const</span> ang: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, <span class="tok-num">0</span>, pi);
        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y, .angle = ang });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-fn">rngRange</span>(&amp;seed, <span class="tok-num">0.3</span>, <span class="tok-num">0.6</span>), .hh = <span class="tok-fn">rngRange</span>(&amp;seed, <span class="tok-num">0.3</span>, <span class="tok-num">0.6</span>) });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawTreeNode</span>(
    ctx: *render.LabCtx,
    tree: *<span class="tok-kw">const</span> phys.DynamicTree,
    idx: i32,
) void {
    <span class="tok-kw">if</span> (idx &lt; <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> node: phys.TreeNode = tree.nodes.items[<span class="tok-builtin">@intCast</span>(idx)];
    <span class="tok-kw">if</span> (node.child1 &lt; <span class="tok-num">0</span>) {
        ctx.<span class="tok-fn">rect</span>(node.aabb.lower, node.aabb.upper, c_green, <span class="tok-num">1.5</span>);
    } <span class="tok-kw">else</span> {
        ctx.<span class="tok-fn">rect</span>(node.aabb.lower, node.aabb.upper, c_dim, <span class="tok-num">1.0</span>);
        <span class="tok-fn">drawTreeNode</span>(ctx, tree, node.child1);
        <span class="tok-fn">drawTreeNode</span>(ctx, tree, node.child2);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">collisionDynamicTreeLab</span>(ctx: *render.LabCtx) void {
    <span class="tok-kw">const</span> di: usize = <span class="tok-builtin">@backingInt</span>(phys.MotionType.dynamic);
    <span class="tok-kw">const</span> tree: *<span class="tok-kw">const</span> phys.DynamicTree = &amp;ctx.world.broadphase.trees[di];
    <span class="tok-fn">drawTreeNode</span>(ctx, tree, tree.root);
}

<span class="tok-comment">// box2d Benchmark|Sensor stress-tests thousands of sensor shapes with falling sensor bodies. Scaled</span>
<span class="tok-comment">// here to a readable grid: a static field of sensor boxes that dynamic balls fall straight through</span>
<span class="tok-comment">// (sensors don't collide), and benchmarkSensorLab flashes each cell as a sensor BEGIN event fires.</span>
<span class="tok-kw">const</span> sensor_cols: u32 = <span class="tok-num">9</span>;
<span class="tok-kw">const</span> sensor_rows: u32 = <span class="tok-num">3</span>;
<span class="tok-kw">const</span> sensor_half: f32 = <span class="tok-num">0.55</span>;
<span class="tok-kw">const</span> sensor_dx: f32 = <span class="tok-num">2.4</span>;
<span class="tok-kw">const</span> sensor_y0: f32 = <span class="tok-num">5.0</span>;
<span class="tok-kw">const</span> sensor_dy: f32 = <span class="tok-num">2.6</span>;

<span class="tok-kw">fn</span> <span class="tok-fn">sensorCellCenter</span>(i: u32) Vec2 {
    <span class="tok-kw">const</span> col: f32 = <span class="tok-fn">float</span>(i % sensor_cols);
    <span class="tok-kw">const</span> row: f32 = <span class="tok-fn">float</span>(i / sensor_cols);
    <span class="tok-kw">const</span> x: f32 = (col - <span class="tok-fn">float</span>(sensor_cols - <span class="tok-num">1</span>) * <span class="tok-num">0.5</span>) * sensor_dx;
    <span class="tok-kw">const</span> y: f32 = sensor_y0 + row * sensor_dy;
    <span class="tok-kw">return</span> .{ x, y };
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkSensor</span>(world: *phys.World, st: *SceneState) !void {
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">14</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> grid: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .motion = .static });
    <span class="tok-kw">const</span> total: u32 = sensor_cols * sensor_rows;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; total) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> c: Vec2 = <span class="tok-fn">sensorCellCenter</span>(i);
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, grid, .{
            .geom = .{ .polygon = phys.<span class="tok-fn">makeOffsetBox</span>(sensor_half, sensor_half, c, Rot2.identity) },
            .is_sensor = true,
            .enable_sensor_events = true,
            .user_data = i,
        });
    }
    <span class="tok-kw">var</span> b: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (b &lt; <span class="tok-num">4</span>) : (b += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> col: f32 = <span class="tok-fn">float</span>(<span class="tok-num">1</span> + b * <span class="tok-num">2</span>);
        <span class="tok-kw">const</span> cx: f32 = (col - <span class="tok-fn">float</span>(sensor_cols - <span class="tok-num">1</span>) * <span class="tok-num">0.5</span>) * sensor_dx;
        st.body[b] = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{
            .x = cx,
            .y = <span class="tok-num">12.0</span> + <span class="tok-fn">float</span>(b) * <span class="tok-num">1.5</span>,
            .gravity_scale = <span class="tok-num">0.4</span>,
        });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, st.body[b], .{ .r = <span class="tok-num">0.45</span> });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkSensorUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-kw">var</span> b: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (b &lt; <span class="tok-num">4</span>) : (b += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> p: Vec2 = phys.<span class="tok-fn">getPosition</span>(world, st.body[b]);
        <span class="tok-kw">if</span> (p[<span class="tok-num">1</span>] &lt; <span class="tok-num">1.5</span>) {
            phys.<span class="tok-fn">setTransform</span>(world, st.body[b], .{ p[<span class="tok-num">0</span>], <span class="tok-num">13.0</span> }, Rot2.identity) <span class="tok-kw">catch</span>
                <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkSensorLab</span>(ctx: *render.LabCtx) void {
    <span class="tok-kw">const</span> total: u32 = sensor_cols * sensor_rows;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; total) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> c: Vec2 = <span class="tok-fn">sensorCellCenter</span>(i);
        ctx.<span class="tok-fn">rect</span>(.{ c[<span class="tok-num">0</span>] - sensor_half, c[<span class="tok-num">1</span>] - sensor_half }, .{ c[<span class="tok-num">0</span>] + sensor_half, c[<span class="tok-num">1</span>] + sensor_half }, c_dim, <span class="tok-num">1.0</span>);
    }
    <span class="tok-kw">const</span> ev: phys.SensorEvents = phys.<span class="tok-fn">getSensorEvents</span>(ctx.world);
    <span class="tok-kw">for</span> (ev.begin) |e| {
        <span class="tok-kw">const</span> idx: u32 = <span class="tok-builtin">@intCast</span>(ctx.world.shapes.data[e.sensor_shape].user_data);
        <span class="tok-kw">const</span> c: Vec2 = <span class="tok-fn">sensorCellCenter</span>(idx);
        ctx.<span class="tok-fn">rect</span>(
            .{ c[<span class="tok-num">0</span>] - sensor_half, c[<span class="tok-num">1</span>] - sensor_half },
            .{ c[<span class="tok-num">0</span>] + sensor_half, c[<span class="tok-num">1</span>] + sensor_half },
            c_green,
            <span class="tok-num">2.5</span>,
        );
        ctx.<span class="tok-fn">mark</span>(c, <span class="tok-num">6</span>, c_amber);
    }
}

<span class="tok-comment">// box2d Joints|Gear Lift: two toothed gears that physically MESH (driver + limited follower), the</span>
<span class="tok-comment">// follower winding a 40-link chain that lifts a door. box2d v3 has no gear joint - the gearing is</span>
<span class="tok-comment">// real tooth-on-tooth collision, so the geometry is reproduced with box2d's exact numbers (gear1</span>
<span class="tok-comment">// teeth sit at r+tooth_hh, gear2 at r+tooth_hw, which is what makes them interlock). The SVG-path</span>
<span class="tok-comment">// frame is replaced with a simple floor; update_s cycles gear1's motor so the door rises and lowers.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">jointsGearLift</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-kw">const</span> gear_radius: f32 = <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> tooth_hw: f32 = <span class="tok-num">0.09</span>;
    <span class="tok-kw">const</span> tooth_hh: f32 = <span class="tok-num">0.06</span>;
    <span class="tok-kw">const</span> tooth_r: f32 = <span class="tok-num">0.03</span>;
    <span class="tok-kw">const</span> link_hl: f32 = <span class="tok-num">0.07</span>;
    <span class="tok-kw">const</span> link_r: f32 = <span class="tok-num">0.05</span>;
    <span class="tok-kw">const</span> link_count: u32 = <span class="tok-num">40</span>;
    <span class="tok-kw">const</span> door_hh: f32 = <span class="tok-num">1.5</span>;
    <span class="tok-kw">const</span> gp1: Vec2 = .{ -<span class="tok-num">4.25</span>, <span class="tok-num">9.75</span> };
    <span class="tok-kw">const</span> gp2: Vec2 = .{ -<span class="tok-num">2.25</span>, <span class="tok-num">10.75</span> };
    <span class="tok-kw">const</span> link_attach: Vec2 = .{ gp2[<span class="tok-num">0</span>] + gear_radius + <span class="tok-num">2.0</span> * tooth_hw + tooth_r, gp2[<span class="tok-num">1</span>] };
    <span class="tok-kw">const</span> chain_len: f32 = <span class="tok-num">2.0</span> * <span class="tok-fn">float</span>(link_count) * link_hl + door_hh;
    <span class="tok-kw">const</span> door_pos: Vec2 = .{ link_attach[<span class="tok-num">0</span>], link_attach[<span class="tok-num">1</span>] - chain_len };
    <span class="tok-kw">const</span> da: f32 = <span class="tok-num">2.0</span> * pi / <span class="tok-num">16.0</span>;

    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .motion = .static });
    <span class="tok-kw">const</span> floor_body: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">1.0</span>, .y = <span class="tok-num">1.5</span>, .motion = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, floor_body, .{ .hw = <span class="tok-num">5</span>, .hh = <span class="tok-num">0.5</span> });

    <span class="tok-comment">// gear 1 (driver): circle + 16 radial teeth at r + tooth_hh.</span>
    <span class="tok-kw">const</span> gear1: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = gp1[<span class="tok-num">0</span>], .y = gp1[<span class="tok-num">1</span>] });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, gear1, .{ .r = gear_radius, .friction = <span class="tok-num">0.1</span> });
    <span class="tok-kw">var</span> k1: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (k1 &lt; <span class="tok-num">16</span>) : (k1 += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> rot: Rot2 = Rot2.<span class="tok-fn">fromAngle</span>(<span class="tok-fn">float</span>(k1) * da);
        <span class="tok-kw">const</span> center: Vec2 = <span class="tok-fn">rotateVec2</span>(rot, .{ gear_radius + tooth_hh, <span class="tok-num">0</span> });
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, gear1, .{
            .geom = .{ .polygon = phys.<span class="tok-fn">makeOffsetRoundedBox</span>(tooth_hw, tooth_hh, center, rot, tooth_r) },
            .material = .{ .friction = <span class="tok-num">0.1</span> },
        });
    }
    st.joint[<span class="tok-num">0</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = gear1,
            .local_frame_a = .{ .p = gp1, .q = Rot2.identity },
            .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
        },
        .enable_motor = true,
        .motor_speed = <span class="tok-num">1.5</span>,
        .max_motor_torque = <span class="tok-num">80.0</span>,
    });

    <span class="tok-comment">// gear 2 (follower): circle + 16 teeth at r + tooth_hw; limited revolute with a rotated frame.</span>
    <span class="tok-kw">const</span> gear2: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = gp2[<span class="tok-num">0</span>], .y = gp2[<span class="tok-num">1</span>] });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, gear2, .{ .r = gear_radius, .friction = <span class="tok-num">0.1</span> });
    <span class="tok-kw">var</span> k2: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (k2 &lt; <span class="tok-num">16</span>) : (k2 += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> rot: Rot2 = Rot2.<span class="tok-fn">fromAngle</span>(<span class="tok-fn">float</span>(k2) * da);
        <span class="tok-kw">const</span> center: Vec2 = <span class="tok-fn">rotateVec2</span>(rot, .{ gear_radius + tooth_hw, <span class="tok-num">0</span> });
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, gear2, .{
            .geom = .{ .polygon = phys.<span class="tok-fn">makeOffsetRoundedBox</span>(tooth_hw, tooth_hh, center, rot, tooth_r) },
            .material = .{ .friction = <span class="tok-num">0.1</span> },
        });
    }
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = gear2,
            .local_frame_a = .{ .p = gp2, .q = Rot2.<span class="tok-fn">fromAngle</span>(<span class="tok-num">0.25</span> * pi) },
            .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
        },
        .enable_motor = true,
        .max_motor_torque = <span class="tok-num">0.5</span>,
        .enable_limit = true,
        .lower_angle = -<span class="tok-num">0.3</span> * pi,
        .upper_angle = <span class="tok-num">0.8</span> * pi,
    });

    <span class="tok-comment">// 40-link capsule chain from gear2's rim down to the door.</span>
    <span class="tok-kw">var</span> pos: Vec2 = .{ link_attach[<span class="tok-num">0</span>], link_attach[<span class="tok-num">1</span>] - link_hl };
    <span class="tok-kw">var</span> prev: BodyHandle = gear2;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; link_count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> link: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = pos[<span class="tok-num">0</span>], .y = pos[<span class="tok-num">1</span>] });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCapsule</span>(world, link, .{ .half_len = link_hl, .r = link_r, .density = <span class="tok-num">2</span> });
        <span class="tok-kw">const</span> pivot: Vec2 = .{ pos[<span class="tok-num">0</span>], pos[<span class="tok-num">1</span>] + link_hl };
        <span class="tok-kw">try</span> <span class="tok-fn">pinRevolute</span>(world, prev, link, .{ .anchor = pivot, .motor = true, .torque = <span class="tok-num">0.05</span> });
        pos[<span class="tok-num">1</span>] -= <span class="tok-num">2.0</span> * link_hl;
        prev = link;
    }

    <span class="tok-comment">// door: box, revolute to the last link at its top + a vertical prismatic to ground.</span>
    <span class="tok-kw">const</span> door: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = door_pos[<span class="tok-num">0</span>], .y = door_pos[<span class="tok-num">1</span>] });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, door, .{ .hw = <span class="tok-num">0.15</span>, .hh = door_hh, .friction = <span class="tok-num">0.1</span> });
    <span class="tok-kw">const</span> door_top: Vec2 = .{ door_pos[<span class="tok-num">0</span>], door_pos[<span class="tok-num">1</span>] + door_hh };
    <span class="tok-kw">try</span> <span class="tok-fn">pinRevolute</span>(world, prev, door, .{ .anchor = door_top, .motor = true, .torque = <span class="tok-num">0.05</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">pinPrismatic</span>(world, ground, door, .{ .anchor = door_pos, .axis_angle = <span class="tok-num">0.5</span> * pi, .motor = true, .force = <span class="tok-num">0.2</span> });

    <span class="tok-comment">// a small pile of balls for the door to nudge as it cycles.</span>
    <span class="tok-kw">var</span> seed: u32 = <span class="tok-num">5</span>;
    <span class="tok-kw">var</span> b: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (b &lt; <span class="tok-num">16</span>) : (b += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> bx: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, -<span class="tok-num">3.5</span>, <span class="tok-num">1.0</span>);
        <span class="tok-kw">const</span> by: f32 = <span class="tok-fn">rngRange</span>(&amp;seed, <span class="tok-num">2.5</span>, <span class="tok-num">6.0</span>);
        <span class="tok-kw">const</span> ball: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = bx, .y = by });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, ball, .{ .r = <span class="tok-num">0.22</span>, .rolling = <span class="tok-num">0.3</span> });
    }

    st.f[<span class="tok-num">0</span>] = <span class="tok-num">0</span>; <span class="tok-comment">// cycle timer</span>
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">1</span>; <span class="tok-comment">// 1 = winding (lift), 0 = unwinding (lower)</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">jointsGearLiftUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">60.0</span>;
    st.f[<span class="tok-num">0</span>] += dt;
    <span class="tok-kw">if</span> (st.f[<span class="tok-num">0</span>] &gt;= <span class="tok-num">5.0</span>) {
        st.f[<span class="tok-num">0</span>] = <span class="tok-num">0</span>;
        st.u[<span class="tok-num">0</span>] = <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] == <span class="tok-num">1</span>) <span class="tok-num">0</span> <span class="tok-kw">else</span> <span class="tok-num">1</span>;
        <span class="tok-kw">const</span> speed: f32 = <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] == <span class="tok-num">1</span>) <span class="tok-num">1.5</span> <span class="tok-kw">else</span> -<span class="tok-num">1.5</span>;
        phys.<span class="tok-fn">revoluteSetMotorSpeed</span>(world, st.joint[<span class="tok-num">0</span>], speed);
    }
}

<span class="tok-comment">// box2d Character|Mover: a player-controlled upright capsule on stepped terrain. Left/right set</span>
<span class="tok-comment">// horizontal velocity, up jumps when grounded (edge-triggered so one press = one jump). Grounded is</span>
<span class="tok-comment">// a short ray straight down from the capsule centre. A dynamic capsule (not the kinematic mover API)</span>
<span class="tok-comment">// keeps it simple and lets it shove the loose crates around.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">characterMover</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .motion = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">9</span>, <span class="tok-num">0.5</span>, .{ <span class="tok-num">0</span>, -<span class="tok-num">0.5</span> }, <span class="tok-num">1</span>); <span class="tok-comment">// floor</span>
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">1.0</span>, <span class="tok-num">0.4</span>, .{ <span class="tok-num">3.0</span>, <span class="tok-num">0.4</span> }, <span class="tok-num">1</span>); <span class="tok-comment">// step 1</span>
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">1.0</span>, <span class="tok-num">0.4</span>, .{ <span class="tok-num">5.0</span>, <span class="tok-num">1.2</span> }, <span class="tok-num">1</span>); <span class="tok-comment">// step 2</span>
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">1.0</span>, <span class="tok-num">0.4</span>, .{ <span class="tok-num">7.0</span>, <span class="tok-num">2.0</span> }, <span class="tok-num">1</span>); <span class="tok-comment">// step 3</span>
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">1.5</span>, <span class="tok-num">0.3</span>, .{ -<span class="tok-num">5.0</span>, <span class="tok-num">2.5</span> }, <span class="tok-num">1</span>); <span class="tok-comment">// floating ledge</span>
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">0.4</span>, <span class="tok-num">4</span>, .{ -<span class="tok-num">9</span>, <span class="tok-num">3</span> }, <span class="tok-num">1</span>); <span class="tok-comment">// left wall</span>
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">0.4</span>, <span class="tok-num">4</span>, .{ <span class="tok-num">9</span>, <span class="tok-num">3</span> }, <span class="tok-num">1</span>); <span class="tok-comment">// right wall</span>
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">3</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fx: f32 = -<span class="tok-num">2.0</span> + <span class="tok-fn">float</span>(i) * <span class="tok-num">0.7</span>;
        <span class="tok-kw">const</span> crate: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = fx, .y = <span class="tok-num">1.0</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, crate, .{ .hw = <span class="tok-num">0.3</span>, .hh = <span class="tok-num">0.3</span>, .friction = <span class="tok-num">0.5</span> });
    }
    <span class="tok-kw">const</span> char: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">6</span>, .y = <span class="tok-num">1.5</span>, .lock_rot = true });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCapsule</span>(world, char, .{ .half_len = <span class="tok-num">0.4</span>, .r = <span class="tok-num">0.35</span>, .density = <span class="tok-num">1.2</span>, .friction = <span class="tok-num">0.3</span> });
    st.body[<span class="tok-num">0</span>] = char;
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>; <span class="tok-comment">// previous up-button state, for jump edge detection</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">characterMoverControl</span>(world: *phys.World, st: *SceneState, in: SceneInput) void {
    <span class="tok-kw">const</span> char: BodyHandle = st.body[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> move_speed: f32 = <span class="tok-num">6.0</span>;
    <span class="tok-kw">const</span> jump_speed: f32 = <span class="tok-num">9.5</span>;
    <span class="tok-kw">const</span> reach: f32 = <span class="tok-num">0.93</span>; <span class="tok-comment">// half_len 0.4 + r 0.35 + 0.18 skin</span>
    <span class="tok-kw">const</span> pos: Vec2 = phys.<span class="tok-fn">getPosition</span>(world, char);
    <span class="tok-kw">const</span> vel: Vec2 = phys.<span class="tok-fn">getLinearVelocity</span>(world, char);
    <span class="tok-kw">var</span> vx: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (in.right) {
        vx += move_speed;
    }
    <span class="tok-kw">if</span> (in.left) {
        vx -= move_speed;
    }
    <span class="tok-kw">const</span> grounded: bool = phys.<span class="tok-fn">castRayClosest</span>(world, pos, .{ <span class="tok-num">0</span>, -reach }, .{}) != null;
    <span class="tok-kw">const</span> up_edge: bool = in.up <span class="tok-kw">and</span> (st.u[<span class="tok-num">0</span>] == <span class="tok-num">0</span>);
    st.u[<span class="tok-num">0</span>] = <span class="tok-kw">if</span> (in.up) <span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> vy: f32 = vel[<span class="tok-num">1</span>];
    <span class="tok-kw">if</span> (up_edge <span class="tok-kw">and</span> grounded <span class="tok-kw">and</span> vy &lt;= <span class="tok-num">1.0</span>) {
        vy = jump_speed;
    }
    phys.<span class="tok-fn">setLinearVelocity</span>(world, char, .{ vx, vy });
}

<span class="tok-comment">// box2d Continuous|Pinball: a chain-loop funnel with two centre-pivot flipper boxes (revolute +</span>
<span class="tok-comment">// motor + angle limit), two free-spinning "+" spinners, two bouncy bumpers, and a BULLET ball so it</span>
<span class="tok-comment">// can't tunnel the thin chain at speed (the point of the Continuous category). box2d flips both on one</span>
<span class="tok-comment">// key; here `action`/O flips both, and left/right flip the matching flipper independently.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pinballSpinner</span>(
    world: *phys.World,
    ground: BodyHandle,
    at: Vec2,
) !void {
    <span class="tok-kw">const</span> sp: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = at[<span class="tok-num">0</span>], .y = at[<span class="tok-num">1</span>] });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, sp, .{ .geom = .{ .polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">1.5</span>, <span class="tok-num">0.125</span>) } });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, sp, .{ .geom = .{ .polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">0.125</span>, <span class="tok-num">1.5</span>) } });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = sp,
            .local_frame_a = .{ .p = at, .q = Rot2.identity },
            .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
        },
        .enable_motor = true,
        .max_motor_torque = <span class="tok-num">0.1</span>,
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">continuousPinball</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .motion = .static });
    <span class="tok-kw">const</span> pts: [<span class="tok-num">5</span>]Vec2 = .{ .{ -<span class="tok-num">8</span>, <span class="tok-num">6</span> }, .{ -<span class="tok-num">8</span>, <span class="tok-num">20</span> }, .{ <span class="tok-num">8</span>, <span class="tok-num">20</span> }, .{ <span class="tok-num">8</span>, <span class="tok-num">6</span> }, .{ <span class="tok-num">0</span>, -<span class="tok-num">2</span> } };
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createChain</span>(world, ground, .{ .points = &amp;pts, .is_loop = true });

    <span class="tok-kw">const</span> lf: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">2</span>, .y = <span class="tok-num">0</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, lf, .{ .hw = <span class="tok-num">1.75</span>, .hh = <span class="tok-num">0.2</span> });
    st.joint[<span class="tok-num">0</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = lf,
            .local_frame_a = .{ .p = .{ -<span class="tok-num">2</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
            .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
        },
        .enable_motor = true,
        .max_motor_torque = <span class="tok-num">1000</span>,
        .enable_limit = true,
        .lower_angle = -<span class="tok-num">30.0</span> * pi / <span class="tok-num">180.0</span>,
        .upper_angle = <span class="tok-num">5.0</span> * pi / <span class="tok-num">180.0</span>,
    });
    <span class="tok-kw">const</span> rf: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">2</span>, .y = <span class="tok-num">0</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, rf, .{ .hw = <span class="tok-num">1.75</span>, .hh = <span class="tok-num">0.2</span> });
    st.joint[<span class="tok-num">1</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = rf,
            .local_frame_a = .{ .p = .{ <span class="tok-num">2</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
            .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },

    <span class="tok-kw">try</span> <span class="tok-fn">pinballSpinner</span>(world, ground, .{ -<span class="tok-num">4</span>, <span class="tok-num">17</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">pinballSpinner</span>(world, ground, .{ <span class="tok-num">4</span>, <span class="tok-num">8</span> });

    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, bump1, .{ .r = <span class="tok-num">1</span>, .restitution = <span class="tok-num">1.5</span> });
    <span class="tok-kw">const</span> bump2: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">4</span>, .y = <span class="tok-num">17</span>, .motion = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, bump2, .{ .r = <span class="tok-num">1</span>, .restitution = <span class="tok-num">1.5</span> });

<span class="tok-kw">fn</span> <span class="tok-fn">continuousPinballControl</span>(
    world: *phys.World,
    st: *SceneState,
    in: SceneInput,
) void {
    <span class="tok-kw">const</span> flip: bool = in.action;
    <span class="tok-kw">const</span> left_up: bool = flip <span class="tok-kw">or</span> in.left;
    <span class="tok-kw">const</span> right_up: bool = flip <span class="tok-kw">or</span> in.right;
    <span class="tok-kw">const</span> lspeed: f32 = <span class="tok-kw">if</span> (left_up) <span class="tok-num">20.0</span> <span class="tok-kw">else</span> -<span class="tok-num">10.0</span>;
    <span class="tok-kw">const</span> rspeed: f32 = <span class="tok-kw">if</span> (right_up) -<span class="tok-num">20.0</span> <span class="tok-kw">else</span> <span class="tok-num">10.0</span>;
    phys.<span class="tok-fn">revoluteSetMotorSpeed</span>(world, st.joint[<span class="tok-num">0</span>], lspeed);
    phys.<span class="tok-fn">revoluteSetMotorSpeed</span>(world, st.joint[<span class="tok-num">1</span>], rspeed);
    <span class="tok-kw">const</span> bp: Vec2 = phys.<span class="tok-fn">getPosition</span>(world, st.body[<span class="tok-num">0</span>]);
    <span class="tok-kw">if</span> (bp[<span class="tok-num">1</span>] &lt; -<span class="tok-num">6.0</span>) {
        phys.<span class="tok-fn">setTransform</span>(world, st.body[<span class="tok-num">0</span>], .{ <span class="tok-num">1</span>, <span class="tok-num">15</span> }, Rot2.identity) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
        phys.<span class="tok-fn">setLinearVelocity</span>(world, st.body[<span class="tok-num">0</span>], .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> });
    }
}

<span class="tok-comment">// box2d Robustness|Cart: a deliberately punishing setup - a 1000-density chassis riding on two tiny</span>
<span class="tok-comment">// 0.1 m wheels under hot gravity (-22). box2d leaves the wheels passive (it's a solver stress test with</span>
<span class="tok-comment">// tuning sliders); here the wheel revolutes get motors so left/right drives the cart along the ground,</span>
<span class="tok-comment">// which also shows the joints holding the heavy chassis together while it rolls.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">robustnessCart</span>(world: *phys.World, st: *SceneState) !void {
    world.settings.gravity = .{ <span class="tok-num">0</span>, -<span class="tok-num">22</span> };

    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = -<span class="tok-num">1</span>, .motion = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, ground, .{ .hw = <span class="tok-num">20</span>, .hh = <span class="tok-num">1</span>, .friction = <span class="tok-num">0.9</span> });

    <span class="tok-kw">const</span> y_base: f32 = <span class="tok-num">2.0</span>;
    <span class="tok-kw">const</span> chassis: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = y_base });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, chassis, .{
        .geom = .{ .polygon = phys.<span class="tok-fn">makeOffsetBox</span>(<span class="tok-num">1.0</span>, <span class="tok-num">0.25</span>, .{ <span class="tok-num">0</span>, <span class="tok-num">0.25</span> }, Rot2.identity) },
        .density = <span class="tok-num">1000</span>,
        .material = .{ .friction = <span class="tok-num">0.6</span> },
    });

    <span class="tok-kw">const</span> w1: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">0.9</span>, .y = y_base - <span class="tok-num">0.15</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, w1, .{ .r = <span class="tok-num">0.1</span>, .density = <span class="tok-num">50</span>, .friction = <span class="tok-num">0.9</span>, .rolling = <span class="tok-num">0.02</span> });
    st.joint[<span class="tok-num">0</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
        .base = .{
            .body_a = chassis,
            .body_b = w1,
            .local_frame_a = .{ .p = .{ -<span class="tok-num">0.9</span>, -<span class="tok-num">0.15</span> }, .q = Rot2.identity },
            .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
        },
        .enable_motor = true,
        .max_motor_torque = <span class="tok-num">120</span>,
    });
    <span class="tok-kw">const</span> w2: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0.9</span>, .y = y_base - <span class="tok-num">0.15</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, w2, .{ .r = <span class="tok-num">0.1</span>, .density = <span class="tok-num">50</span>, .friction = <span class="tok-num">0.9</span>, .rolling = <span class="tok-num">0.02</span> });
    st.joint[<span class="tok-num">1</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
        .base = .{
            .body_a = chassis,
            .body_b = w2,
            .local_frame_a = .{ .p = .{ <span class="tok-num">0.9</span>, -<span class="tok-num">0.15</span> }, .q = Rot2.identity },
            .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .q = Rot2.identity },
        },
        .enable_motor = true,
        .max_motor_torque = <span class="tok-num">120</span>,
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">robustnessCartControl</span>(
    world: *phys.World,
    st: *SceneState,
    in: SceneInput,
) void {
    <span class="tok-comment">// Wheels spin clockwise (negative omega) to roll right; motor_speed 0 at rest brakes the wheels.</span>
    <span class="tok-kw">var</span> speed: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (in.right) {
        speed -= <span class="tok-num">30.0</span>;
    }
    <span class="tok-kw">if</span> (in.left) {
        speed += <span class="tok-num">30.0</span>;
    }
    phys.<span class="tok-fn">revoluteSetMotorSpeed</span>(world, st.joint[<span class="tok-num">0</span>], speed);
    phys.<span class="tok-fn">revoluteSetMotorSpeed</span>(world, st.joint[<span class="tok-num">1</span>], speed);
}

<span class="tok-comment">// box2d Events|Joint: six 1x1 boxes, each hung from the ground by a DIFFERENT joint type (distance,</span>
<span class="tok-comment">// motor, prismatic, revolute, weld, wheel). Every joint carries a force/torque threshold and a</span>
<span class="tok-comment">// user_data = its index. Drag a box hard (existing pointer drag) and when the joint force/torque</span>
<span class="tok-comment">// exceeds the threshold, getJointEvents reports it and update_s destroys that joint - the box drops.</span>
<span class="tok-comment">// box2d uses 20000 N thresholds, but the demo's drag tops out near 1000*mass (~4 kN here), so those</span>
<span class="tok-comment">// would never break; lowered to 2.5 kN / 1.5 kN.m so a firm yank breaks a joint while gravity (~40 N)</span>
<span class="tok-comment">// and gentle drags hold.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">ejBox</span>(
    world: *phys.World,
    px: f32,
    y0: f32,
) !BodyHandle {
    <span class="tok-kw">const</span> box: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = px, .y = y0, .no_sleep = true });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, box, .{ .hw = <span class="tok-num">1</span>, .hh = <span class="tok-num">1</span> });
    <span class="tok-kw">return</span> box;
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventsJoint</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .motion = .static });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ -<span class="tok-num">40</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">40</span>, <span class="tok-num">0</span> } } },
    });
    <span class="tok-kw">const</span> ft: f32 = <span class="tok-num">2500</span>;
    <span class="tok-kw">const</span> tt: f32 = <span class="tok-num">1500</span>;
    <span class="tok-kw">const</span> y0: f32 = <span class="tok-num">10</span>;

    <span class="tok-comment">// 0: distance joint (box hangs 2 m below an anchor point).</span>
    <span class="tok-kw">const</span> b0: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">ejBox</span>(world, -<span class="tok-num">12.5</span>, y0);
    <span class="tok-kw">const</span> piv1: Vec2 = .{ -<span class="tok-num">12.5</span>, y0 + <span class="tok-num">3</span> };
    <span class="tok-kw">const</span> piv2: Vec2 = .{ -<span class="tok-num">12.5</span>, y0 + <span class="tok-num">1</span> };
    st.joint[<span class="tok-num">0</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createDistanceJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = b0,
            .local_frame_a = .{ .p = piv1, .q = Rot2.identity },
            .local_frame_b = .{ .p = <span class="tok-fn">worldToLocal</span>(world, b0, piv2), .q = Rot2.identity },
            .force_threshold = ft,
            .torque_threshold = tt,
            .collide_connected = true,
            .user_data = <span class="tok-num">0</span>,
        },
        .length = <span class="tok-num">2</span>,
    });

    <span class="tok-comment">// 1: motor joint (holds the box at its start position).</span>
    <span class="tok-kw">const</span> b1: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">ejBox</span>(world, -<span class="tok-num">7.5</span>, y0);
    st.joint[<span class="tok-num">1</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createMotorJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = b1,
            .local_frame_a = .{ .p = .{ -<span class="tok-num">7.5</span>, y0 }, .q = Rot2.identity },
            .force_threshold = ft,
            .torque_threshold = tt,
            .collide_connected = true,
            .user_data = <span class="tok-num">1</span>,
        },
        .max_velocity_force = <span class="tok-num">1000</span>,
        .max_velocity_torque = <span class="tok-num">20</span>,
    });

    <span class="tok-comment">// 2: prismatic joint (slides along the world x axis).</span>
    <span class="tok-kw">const</span> b2: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">ejBox</span>(world, -<span class="tok-num">2.5</span>, y0);
    <span class="tok-kw">const</span> p2: Vec2 = .{ -<span class="tok-num">3.5</span>, y0 };
    st.joint[<span class="tok-num">2</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createPrismaticJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = b2,
            .local_frame_a = .{ .p = p2, .q = Rot2.identity },
            .local_frame_b = .{ .p = <span class="tok-fn">worldToLocal</span>(world, b2, p2), .q = Rot2.identity },
            .force_threshold = ft,
            .torque_threshold = tt,
            .collide_connected = true,
            .user_data = <span class="tok-num">2</span>,
        },
    });

    <span class="tok-comment">// 3: revolute joint (box swings about the pivot).</span>
    <span class="tok-kw">const</span> b3: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">ejBox</span>(world, <span class="tok-num">2.5</span>, y0);
    <span class="tok-kw">const</span> p3: Vec2 = .{ <span class="tok-num">1.5</span>, y0 };
    st.joint[<span class="tok-num">3</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = b3,
            .local_frame_a = .{ .p = p3, .q = Rot2.identity },
            .local_frame_b = .{ .p = <span class="tok-fn">worldToLocal</span>(world, b3, p3), .q = Rot2.identity },
            .force_threshold = ft,
            .torque_threshold = tt,
            .collide_connected = true,
            .user_data = <span class="tok-num">3</span>,
        },
    });

    <span class="tok-comment">// 4: weld joint (rigid, soft angular).</span>
    <span class="tok-kw">const</span> b4: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">ejBox</span>(world, <span class="tok-num">7.5</span>, y0);
    <span class="tok-kw">const</span> p4: Vec2 = .{ <span class="tok-num">6.5</span>, y0 };
    st.joint[<span class="tok-num">4</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createWeldJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = b4,
            .local_frame_a = .{ .p = p4, .q = Rot2.identity },
            .local_frame_b = .{ .p = <span class="tok-fn">worldToLocal</span>(world, b4, p4), .q = Rot2.identity },
            .force_threshold = ft,
            .torque_threshold = tt,
            .collide_connected = true,
            .user_data = <span class="tok-num">4</span>,
        },
        .angular_hertz = <span class="tok-num">2</span>,
        .angular_damping_ratio = <span class="tok-num">0.5</span>,
    });

    <span class="tok-comment">// 5: wheel joint (sprung suspension along the axis, with a motor + limit).</span>
    <span class="tok-kw">const</span> b5: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">ejBox</span>(world, <span class="tok-num">12.5</span>, y0);
    <span class="tok-kw">const</span> p5: Vec2 = .{ <span class="tok-num">11.5</span>, y0 };
    st.joint[<span class="tok-num">5</span>] = <span class="tok-kw">try</span> phys.<span class="tok-fn">createWheelJoint</span>(world, .{
        .base = .{
            .body_a = ground,
            .body_b = b5,
            .local_frame_a = .{ .p = p5, .q = Rot2.identity },
            .local_frame_b = .{ .p = <span class="tok-fn">worldToLocal</span>(world, b5, p5), .q = Rot2.identity },
            .force_threshold = ft,
            .torque_threshold = tt,
            .collide_connected = true,
            .user_data = <span class="tok-num">5</span>,
        },
        .hertz = <span class="tok-num">1</span>,
        .damping_ratio = <span class="tok-num">0.7</span>,
        .enable_limit = true,
        .lower_translation = -<span class="tok-num">1</span>,
        .upper_translation = <span class="tok-num">1</span>,
        .enable_motor = true,
        .max_motor_torque = <span class="tok-num">10</span>,
        .motor_speed = <span class="tok-num">1</span>,
    });

    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>; <span class="tok-comment">// bitmask of joints already destroyed</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">eventsJointUpdate</span>(world: *phys.World, st: *SceneState) void {
    <span class="tok-kw">const</span> events: []<span class="tok-kw">const</span> phys.JointEvent = phys.<span class="tok-fn">getJointEvents</span>(world);
    <span class="tok-kw">for</span> (events) |ev| {
        <span class="tok-kw">const</span> i: usize = <span class="tok-builtin">@intCast</span>(ev.user_data);
        <span class="tok-kw">if</span> (i &gt;= <span class="tok-num">6</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> sh: u5 = <span class="tok-builtin">@intCast</span>(i);
        <span class="tok-kw">const</span> bit: u32 = <span class="tok-builtin">@as</span>(u32, <span class="tok-num">1</span>) &lt;&lt; sh;
        <span class="tok-kw">if</span> ((st.u[<span class="tok-num">0</span>] &amp; bit) != <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        st.u[<span class="tok-num">0</span>] |= bit;
        phys.<span class="tok-fn">destroyJoint</span>(world, st.joint[i]);
    }
}

<span class="tok-comment">/// Unique category names, in list order - drives the scene picker's category dropdown.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> categories = blk: {
    <span class="tok-builtin">@setEvalBranchQuota</span>(<span class="tok-num">20000</span>);
    <span class="tok-kw">var</span> buf: [list.len][]<span class="tok-kw">const</span> u8 = undefined;
    <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (list) |sc| {
        <span class="tok-kw">var</span> found: bool = false;
        <span class="tok-kw">for</span> (buf[<span class="tok-num">0</span>..n]) |c| {
            <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, c, sc.category)) {
                found = true;
            }
        }
        <span class="tok-kw">if</span> (!found) {
            buf[n] = sc.category;
            n += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">break</span> :blk buf[<span class="tok-num">0</span>..n].*;
};

<span class="tok-comment">/// Index into `categories` for a category name (0 if absent).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">categoryIndex</span>(name: []<span class="tok-kw">const</span> u8) usize {
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; categories.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, categories[i], name)) {
            <span class="tok-kw">return</span> i;
        }
    }
    <span class="tok-kw">return</span> <span class="tok-num">0</span>;
}

<span class="tok-comment">/// First scene index in a category (0 if none) - used when the category changes.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">firstInCategory</span>(cat: usize) usize {
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; list.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, list[i].category, categories[cat])) {
            <span class="tok-kw">return</span> i;
        }
    }
    <span class="tok-kw">return</span> <span class="tok-num">0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">stackPyramid</span>(world: *phys.World) !void {

<span class="tok-kw">fn</span> <span class="tok-fn">bodySleep</span>(world: *phys.World) !void {

<span class="tok-kw">fn</span> <span class="tok-fn">customFilterShouldCollide</span>(
    a: u32,
    b: u32,
    ctx: ?*anyopaque,
) bool {
    <span class="tok-comment">// Collide only when both shapes share parity (both odd or both even index). ctx is the world,</span>
    <span class="tok-comment">// so we can read each shape's user_data (its 1-based index).</span>
    <span class="tok-kw">const</span> world: *phys.World = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(ctx.?));
    <span class="tok-kw">const</span> ud_a: u64 = world.shapes.data[a].user_data;
    <span class="tok-kw">const</span> ud_b: u64 = world.shapes.data[b].user_data;
    <span class="tok-kw">if</span> (ud_a == <span class="tok-num">0</span> <span class="tok-kw">or</span> ud_b == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> true;
    }
    <span class="tok-kw">return</span> ((ud_a &amp; <span class="tok-num">1</span>) + (ud_b &amp; <span class="tok-num">1</span>)) != <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">shapesCustomFilter</span>(world: *phys.World) !void {

    <span class="tok-comment">// collide only when they share parity, so odd/even neighbours interpenetrate while same-parity</span>
    <span class="tok-comment">// ones stack. Each shape's user_data carries its 1-based index, read back in the callback.</span>
    phys.<span class="tok-fn">setCustomFilterCallback</span>(world, customFilterShouldCollide, world);

    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;

        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = <span class="tok-num">5</span> });
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, b, .{
            .geom = .{ .polygon = phys.<span class="tok-fn">makeBox</span>(<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>) },
            .enable_custom_filtering = true,

<span class="tok-kw">fn</span> <span class="tok-fn">shapeFilter</span>(world: *phys.World) !void {
    <span class="tok-comment">// box2d "Filter": collision categories + masks. The LEFT column shares one category and</span>
    <span class="tok-comment">// masks only the ground, so its boxes fall THROUGH each other and pile flat. The RIGHT</span>
    <span class="tok-comment">// column gives each box its own category (masking the other two), so they collide + stack.</span>
    <span class="tok-kw">const</span> ground_bit: u64 = <span class="tok-num">0x0001</span>; <span class="tok-comment">// groundBox uses the default category (bit 0)</span>
    <span class="tok-kw">const</span> t1: u64 = <span class="tok-num">0x0002</span>;
    <span class="tok-kw">const</span> t2: u64 = <span class="tok-num">0x0004</span>;
    <span class="tok-kw">const</span> t3: u64 = <span class="tok-num">0x0008</span>;

    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundBox</span>(world, <span class="tok-num">40</span>, <span class="tok-num">1</span>);

    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">3</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">3</span>, .y = <span class="tok-num">2</span> + fi * <span class="tok-num">2.0</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">0.6</span>, .hh = <span class="tok-num">0.6</span>, .filter = .{ .category = t1, .mask = ground_bit } });
    }

    <span class="tok-kw">const</span> cats = [_]u64{ t1, t2, t3 };
    <span class="tok-kw">const</span> masks = [_]u64{ ground_bit | t2 | t3, ground_bit | t1 | t3, ground_bit | t1 | t2 };
    i = <span class="tok-num">0</span>;

    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> j: usize = (i + <span class="tok-num">1</span>) % n;
        <span class="tok-kw">const</span> xa: f32 = world.bodies.data[nodes[i].<span class="tok-fn">index</span>()].transform.p[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> ya: f32 = world.bodies.data[nodes[i].<span class="tok-fn">index</span>()].transform.p[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> xb: f32 = world.bodies.data[nodes[j].<span class="tok-fn">index</span>()].transform.p[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> yb: f32 = world.bodies.data[nodes[j].<span class="tok-fn">index</span>()].transform.p[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> len: f32 = <span class="tok-builtin">@sqrt</span>((xb - xa) * (xb - xa) + (yb - ya) * (yb - ya));
        <span class="tok-kw">try</span> <span class="tok-fn">pinDistance</span>(world, nodes[i], nodes[j], .{
            .pa = .{ xa, ya },
            .pb = .{ xb, yb },
            .length = len,
            .hertz = <span class="tok-num">5.0</span>,
            .damping = <span class="tok-num">0.5</span>,
        });
        <span class="tok-comment">// A spoke to the opposite node keeps the ring from collapsing.</span>
        <span class="tok-kw">const</span> k: usize = (i + n / <span class="tok-num">2</span>) % n;
        <span class="tok-kw">const</span> xk: f32 = world.bodies.data[nodes[k].<span class="tok-fn">index</span>()].transform.p[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> yk: f32 = world.bodies.data[nodes[k].<span class="tok-fn">index</span>()].transform.p[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dlen: f32 = <span class="tok-builtin">@sqrt</span>((xk - xa) * (xk - xa) + (yk - ya) * (yk - ya));
        <span class="tok-kw">try</span> <span class="tok-fn">pinDistance</span>(world, nodes[i], nodes[k], .{
            .pa = .{ xa, ya },
            .pb = .{ xk, yk },
            .length = dlen,
            .hertz = <span class="tok-num">3.0</span>,
            .damping = <span class="tok-num">0.5</span>,
        });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">worldTiles</span>(world: *phys.World) !void {
    <span class="tok-comment">// A big static tile floor, then a pyramid on top.</span>
    <span class="tok-kw">const</span> g: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">const</span> tiles: usize = <span class="tok-num">20</span>;
    <span class="tok-kw">var</span> t: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (t &lt; tiles) : (t += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = -<span class="tok-num">19.0</span> + <span class="tok-fn">float</span>(t) * <span class="tok-num">2.0</span>;
        <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, g, <span class="tok-num">1.0</span>, <span class="tok-num">0.5</span>, .{ x, <span class="tok-num">0</span> }, <span class="tok-num">1</span>);
    }
    <span class="tok-kw">const</span> count: usize = <span class="tok-num">10</span>;
    <span class="tok-kw">var</span> row: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (row &lt; count) : (row += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> in_row: usize = count - row;
        <span class="tok-kw">var</span> c: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (c &lt; in_row) : (c += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> x: f32 = -<span class="tok-fn">float</span>(in_row) * <span class="tok-num">0.5</span> + <span class="tok-fn">float</span>(c) + <span class="tok-num">0.5</span>;
            <span class="tok-kw">const</span> y: f32 = <span class="tok-num">1.0</span> + <span class="tok-fn">float</span>(row) * <span class="tok-num">1.0</span>;
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y });
            <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
        }
    }
}

<span class="tok-comment">/// Build a ragdoll (torso/head/2 arms/2 legs joined by limited revolute joints) centred at</span>
<span class="tok-comment">/// (cx, cy), uniformly scaled by `s`. Used by the ragdoll scenes (Scale Ragdoll, Bounce Humans).</span>
<span class="tok-comment">/// A faithful port of the classic CS296 (IIT Bombay) "dominos" Rube Goldberg machine, the</span>
<span class="tok-comment">/// teaching showcase built on box2d v2. A cannon fires a ball along the top shelf; the recoil</span>
<span class="tok-comment">/// nudges a second ball; balls cascade down angled shelves through revolving planks, topple a</span>
<span class="tok-comment">/// row of dominoes into a heavy ball, and a hanging toothbrush on a *pulley* hauls an open box</span>
<span class="tok-comment">/// up on the far side. It exercises the new pulley joint alongside revolute hinges, see-saws,</span>
<span class="tok-comment">/// and dense contact. The whole chain reaction is kicked off by one ball's initial velocity.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildDominos</span>(world: *phys.World) !void {
    world.settings.sub_step_count = <span class="tok-num">8</span>; <span class="tok-comment">// stiff revolute + pulley chain wants extra sub-steps</span>

    <span class="tok-comment">// Ground.</span>
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundSegment</span>(world, <span class="tok-num">90</span>);

    <span class="tok-comment">// Top horizontal shelf the cannon ball rolls along.</span>
    {
        <span class="tok-kw">const</span> h: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">32</span>, .motion = .static });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, h, .{ .hw = <span class="tok-num">23</span>, .hh = <span class="tok-num">0.25</span> });
    }

    <span class="tok-comment">// The cannon shot: a ball launched up and to the right.</span>
    {
        <span class="tok-kw">const</span> h: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">3</span>, .y = <span class="tok-num">35</span>, .vx = <span class="tok-num">17</span>, .vy = <span class="tok-num">15</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, h, .{ .r = <span class="tok-num">1</span>, .density = <span class="tok-num">5</span>, .friction = <span class="tok-num">0</span>, .restitution = <span class="tok-num">0.02</span> });
    }

    <span class="tok-comment">// The cannon body: a wheel plus two angled barrel walls, given a recoil velocity.</span>
    {
        <span class="tok-kw">const</span> h: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">33</span>, .vx = -<span class="tok-num">5</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, h, .{ .r = <span class="tok-num">1.5</span>, .density = <span class="tok-num">2.5</span>, .friction = <span class="tok-num">1</span> });
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, h, .{
            .geom = .{ .polygon = phys.<span class="tok-fn">makeOffsetBox</span>(<span class="tok-num">4</span>, <span class="tok-num">0.25</span>, .{ <span class="tok-num">0.7</span>, <span class="tok-num">3.5</span> }, Rot2.<span class="tok-fn">fromAngle</span>(pi / <span class="tok-num">4.0</span>)) },
            .density = <span class="tok-num">15</span>,
            .material = .{ .friction = <span class="tok-num">1</span> },
        });
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, h, .{
            .geom = .{ .polygon = phys.<span class="tok-fn">makeOffsetBox</span>(<span class="tok-num">3.5</span>, <span class="tok-num">0.25</span>, .{ <span class="tok-num">4</span>, <span class="tok-num">2</span> }, Rot2.<span class="tok-fn">fromAngle</span>(pi / <span class="tok-num">4.0</span>)) },
            .density = <span class="tok-num">15</span>,
            .material = .{ .friction = <span class="tok-num">1</span> },
        });
    }

    <span class="tok-comment">// The ball nudged by the cannon's recoil.</span>
    {
        <span class="tok-kw">const</span> h: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">4.5</span>, .y = <span class="tok-num">33</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, h, .{ .r = <span class="tok-num">1</span>, .density = <span class="tok-num">9</span>, .friction = <span class="tok-num">0.1</span>, .restitution = <span class="tok-num">0.3</span> });
    }

    <span class="tok-comment">// Right side's angled and vertical shelves.</span>
    {
        <span class="tok-kw">const</span> h: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">55</span>, .y = <span class="tok-num">30</span>, .angle = pi / <span class="tok-num">18.0</span>, .motion = .static });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, h, .{ .hw = <span class="tok-num">5</span>, .hh = <span class="tok-num">0.25</span> });
    }
    {
        <span class="tok-kw">const</span> h: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">60</span>, .y = <span class="tok-num">33</span>, .angle = pi / <span class="tok-num">2.0</span>, .motion = .static });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, h, .{ .hw = <span class="tok-num">2</span>, .hh = <span class="tok-num">0.25</span> });
    }
    {
        <span class="tok-kw">const</span> h: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">45</span>, .y = <span class="tok-num">28</span>, .motion = .static });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, h, .{ .hw = <span class="tok-num">3</span>, .hh = <span class="tok-num">0.25</span> });
    }

    <span class="tok-comment">// Right revolving plank 1: pivots at its base on a static hinge post.</span>

    <span class="tok-kw">const</span> head: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = cx, .y = cy + <span class="tok-num">1.3</span> * s });

        .anchor = .{ cx, cy + <span class="tok-num">0.9</span> * s },

        .lo = -<span class="tok-num">0.4</span>,
        .hi = <span class="tok-num">0.4</span>,
