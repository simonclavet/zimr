    <span class="tok-kw">const</span> a_pts = [<span class="tok-num">4</span>]Vec2{ .{ -<span class="tok-num">0.6</span>, -<span class="tok-num">0.6</span> }, .{ <span class="tok-num">0.6</span>, -<span class="tok-num">0.6</span> }, .{ <span class="tok-num">0.6</span>, <span class="tok-num">0.6</span> }, .{ -<span class="tok-num">0.6</span>, <span class="tok-num">0.6</span> } };
    <span class="tok-kw">const</span> b_pts = [<span class="tok-num">4</span>]Vec2{ .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> }, .{ -<span class="tok-num">1</span>, <span class="tok-num">1</span> } };
    <span class="tok-kw">const</span> h: f32 = ctx.pointer[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> sweep_a: phys.Sweep2 = .{
        .local_center = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .c1 = .{ -<span class="tok-num">8</span>, h },
        .c2 = .{ <span class="tok-num">8</span>, h },
        .q1 = Rot2.identity,
        .q2 = Rot2.identity,
    };
    <span class="tok-kw">const</span> sweep_b: phys.Sweep2 = .{
        .local_center = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .c1 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .c2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .q1 = Rot2.identity,
        .q2 = Rot2.identity,
    };
    <span class="tok-kw">const</span> input: phys.TOIInput = .{
        .proxy_a = phys.<span class="tok-fn">makeProxy</span>(&amp;a_pts, <span class="tok-num">0</span>),
        .proxy_b = phys.<span class="tok-fn">makeProxy</span>(&amp;b_pts, <span class="tok-num">0</span>),
        .sweep_a = sweep_a,
        .sweep_b = sweep_b,
        .max_fraction = <span class="tok-num">1</span>,
    };
    <span class="tok-kw">const</span> out: phys.TOIOutput = phys.<span class="tok-fn">timeOfImpact</span>(&amp;input);
    ctx.<span class="tok-fn">rect</span>(.{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> }, c_amber, <span class="tok-num">1.5</span>);
    ctx.<span class="tok-fn">rect</span>(.{ -<span class="tok-num">8.6</span>, h - <span class="tok-num">0.6</span> }, .{ -<span class="tok-num">7.4</span>, h + <span class="tok-num">0.6</span> }, c_dim, <span class="tok-num">1</span>);
    ctx.<span class="tok-fn">rect</span>(.{ <span class="tok-num">7.4</span>, h - <span class="tok-num">0.6</span> }, .{ <span class="tok-num">8.6</span>, h + <span class="tok-num">0.6</span> }, c_dim, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (out.state == .hit <span class="tok-kw">or</span> out.state == .overlapped) {
        <span class="tok-kw">const</span> ax: f32 = -<span class="tok-num">8.0</span> + <span class="tok-num">16.0</span> * out.fraction;
        ctx.<span class="tok-fn">rect</span>(
            .{ ax - <span class="tok-num">0.6</span>, h - <span class="tok-num">0.6</span> },
            .{ ax + <span class="tok-num">0.6</span>, h + <span class="tok-num">0.6</span> },
            c_green,
            <span class="tok-num">2</span>,
        );
        ctx.<span class="tok-fn">mark</span>(out.point, <span class="tok-num">5</span>, c_red);
    }
}

<span class="tok-comment">// ---- Shapes (chains / conveyor) ----</span>

<span class="tok-kw">fn</span> <span class="tok-fn">shapesTangentSpeed</span>(world: *phys.World) !void {
    <span class="tok-comment">// A conveyor belt split into sections of increasing tangent speed (the surface material drags</span>
    <span class="tok-comment">// contacting bodies along the tangent); a ball on each section is carried at a different speed.</span>
    <span class="tok-comment">// (box2d uses an SVG-path loop track; we use a flat segmented belt with end walls.)</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">const</span> seg_w: f32 = <span class="tok-num">5.0</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">7</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x0: f32 = -<span class="tok-num">17.5</span> + <span class="tok-fn">float</span>(i) * seg_w;
        <span class="tok-kw">const</span> ts: f32 = -<span class="tok-num">10.0</span> - <span class="tok-fn">float</span>(i) * <span class="tok-num">10.0</span>;
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
            .geom = .{ .segment = .{ .point1 = .{ x0, <span class="tok-num">0</span> }, .point2 = .{ x0 + seg_w, <span class="tok-num">0</span> } } },
            .material = .{ .friction = <span class="tok-num">0.6</span>, .tangent_speed = ts },
        });
        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x0 + seg_w * <span class="tok-num">0.5</span>, .y = <span class="tok-num">1.5</span> });
        <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, b, .{ .r = <span class="tok-num">0.5</span>, .friction = <span class="tok-num">0.6</span>, .rolling = <span class="tok-num">0.3</span> });
    }
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ -<span class="tok-num">17.5</span>, <span class="tok-num">0</span> }, .point2 = .{ -<span class="tok-num">17.5</span>, <span class="tok-num">4</span> } } },
    });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ <span class="tok-num">17.5</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">17.5</span>, <span class="tok-num">4</span> } } },
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">shapesChainSegment</span>(world: *phys.World) !void {
    <span class="tok-comment">// A smooth chain terrain (ghost-linked segments) shaped as a sine wave, with a ball that rolls</span>
    <span class="tok-comment">// along it without catching on the segment joins.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">const</span> n: usize = <span class="tok-num">25</span>;
    <span class="tok-kw">var</span> pts: [<span class="tok-num">25</span>]Vec2 = undefined;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = <span class="tok-num">25.0</span> - <span class="tok-num">50.0</span> * <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(n - <span class="tok-num">1</span>);
        pts[i] = .{ x, <span class="tok-num">1.5</span> * <span class="tok-builtin">@sin</span>(<span class="tok-num">0.18</span> * x) };
    }
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createChain</span>(world, ground, .{ .points = &amp;pts, .is_loop = false });
    <span class="tok-kw">const</span> ball: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">18</span>, .y = <span class="tok-num">5</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, ball, .{ .r = <span class="tok-num">0.5</span>, .rolling = <span class="tok-num">0.1</span> });
}

<span class="tok-kw">fn</span> <span class="tok-fn">shapesChainLink</span>(world: *phys.World) !void {
    <span class="tok-comment">// Two open chains forming a thin channel; a circle, capsule, and box dropped in slide along it.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">const</span> p1 = [<span class="tok-num">6</span>]Vec2{ .{ <span class="tok-num">40</span>, <span class="tok-num">1</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .{ -<span class="tok-num">40</span>, <span class="tok-num">0</span> }, .{ -<span class="tok-num">40</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">40</span>, -<span class="tok-num">1</span> } };
    <span class="tok-kw">const</span> p2 = [<span class="tok-num">6</span>]Vec2{ .{ -<span class="tok-num">40</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">40</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">40</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }, .{ -<span class="tok-num">40</span>, <span class="tok-num">0</span> } };
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createChain</span>(world, ground, .{ .points = &amp;p1, .is_loop = false });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createChain</span>(world, ground, .{ .points = &amp;p2, .is_loop = false });
    <span class="tok-kw">const</span> c: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">5</span>, .y = <span class="tok-num">2</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, c, .{ .r = <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> cap: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">2</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCapsule</span>(world, cap, .{ .half_len = <span class="tok-num">0.5</span>, .r = <span class="tok-num">0.25</span>, .horizontal = true });
    <span class="tok-kw">const</span> box: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">5</span>, .y = <span class="tok-num">2</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, box, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
}

<span class="tok-comment">// ---- Determinism / Robustness ----</span>

<span class="tok-kw">fn</span> <span class="tok-fn">determinismFallingHinges</span>(world: *phys.World) !void {
    <span class="tok-comment">// 4 columns of small rounded boxes, each odd box hinged to the even one below by a limited</span>
    <span class="tok-comment">// revolute joint; the leaning columns topple and settle. (box2d uses this as a determinism test</span>
    <span class="tok-comment">// that hashes the settled state; we just show the mechanism.)</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachOffsetBox</span>(world, ground, <span class="tok-num">40</span>, <span class="tok-num">1</span>, .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span> }, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> h: f32 = <span class="tok-num">0.25</span>;
    <span class="tok-kw">const</span> r: f32 = <span class="tok-num">0.025</span>;
    <span class="tok-kw">const</span> offset: f32 = <span class="tok-num">0.4</span> * h;
    <span class="tok-kw">const</span> dx: f32 = <span class="tok-num">10.0</span> * h;
    <span class="tok-kw">const</span> x_base: f32 = -<span class="tok-num">0.5</span> * dx * <span class="tok-num">3.0</span>;
    <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; <span class="tok-num">4</span>) : (j += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> x: f32 = x_base + <span class="tok-fn">float</span>(j) * dx;
        <span class="tok-kw">var</span> prev: BodyHandle = ground;
        <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (i &lt; <span class="tok-num">20</span>) : (i += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
            <span class="tok-kw">const</span> px: f32 = x + offset * fi;
            <span class="tok-kw">const</span> py: f32 = h + <span class="tok-num">2.0</span> * h * fi;
            <span class="tok-kw">const</span> ang: f32 = <span class="tok-kw">if</span> (i &amp; <span class="tok-num">1</span> == <span class="tok-num">0</span>) -<span class="tok-num">0.1</span> <span class="tok-kw">else</span> <span class="tok-num">0.1</span>;
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = px, .y = py, .angle = ang });
            <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = h - r, .hh = h - r, .round = r });
            <span class="tok-kw">if</span> (i &amp; <span class="tok-num">1</span> == <span class="tok-num">0</span>) {
                prev = b;
            } <span class="tok-kw">else</span> {
                <span class="tok-kw">const</span> py_prev: f32 = h + <span class="tok-num">2.0</span> * h * (fi - <span class="tok-num">1.0</span>);
                <span class="tok-kw">try</span> <span class="tok-fn">pinRevolute</span>(world, prev, b, .{
                    .anchor = .{ px, (py + py_prev) * <span class="tok-num">0.5</span> },
                    .limit = true,
                    .lo = -<span class="tok-num">0.1</span> * pi,
                    .hi = <span class="tok-num">0.2</span> * pi,
                });
            }
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">robustnessMultiplePrismatic</span>(world: *phys.World) !void {
    <span class="tok-comment">// A tower of 6 boxes chained by stiff, limited prismatic joints (default horizontal axis) - a</span>
    <span class="tok-comment">// robustness test of stacked prismatic constraints.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">var</span> prev: BodyHandle = ground;
    <span class="tok-kw">var</span> fa: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">6</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> y: f32 = <span class="tok-num">0.6</span> + <span class="tok-num">1.2</span> * <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = y });
        <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, b, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">0.5</span> });
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createPrismaticJoint</span>(world, .{
            .base = .{
                .body_a = prev,
                .body_b = b,
                .local_frame_a = .{ .p = fa, .q = Rot2.identity },
                .local_frame_b = .{ .p = .{ <span class="tok-num">0</span>, -<span class="tok-num">0.6</span> }, .q = Rot2.identity },
                .constraint_hertz = <span class="tok-num">240</span>,
            },
            .enable_limit = true,
            .lower_translation = -<span class="tok-num">6</span>,
            .upper_translation = <span class="tok-num">6</span>,
        });
        prev = b;
        fa = .{ <span class="tok-num">0</span>, <span class="tok-num">0.6</span> };
    }
}

<span class="tok-comment">// ---- Showcase ----</span>

<span class="tok-comment">/// The CS296 "Dominos" Rube Goldberg machine (Erin Catto's classic, as used in the IIT-Bombay</span>
<span class="tok-comment">/// CS296 lab). A cannon-shot ball at top-left kicks off a cascade that runs the length of the</span>
<span class="tok-comment">/// scene: cannon recoil, a staircase of revolving flaps and balls down the right, a domino run,</span>
<span class="tok-comment">/// a weight balance, a pulley raising a toothbrush, a centre see-saw platform, and a basin at</span>
<span class="tok-comment">/// the bottom-left. Originally box2d v2 (b2EdgeShape / SetAsBox-with-offset / b2PulleyJointDef);</span>
<span class="tok-comment">/// ported faithfully to our v3-style API, with the pulley joint reintroduced for this scene.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">showcaseDominos</span>(world: *phys.World) !void {
    world.settings.sub_step_count = <span class="tok-num">8</span>; <span class="tok-comment">// many stacked joints + the pulley want extra sub-steps</span>

    <span class="tok-comment">// Ground edge spanning the whole machine.</span>
    <span class="tok-kw">const</span> ground: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, ground, .{
        .geom = .{ .segment = .{ .point1 = .{ -<span class="tok-num">90</span>, <span class="tok-num">0</span> }, .point2 = .{ <span class="tok-num">90</span>, <span class="tok-num">0</span> } } },
    });

    <span class="tok-comment">// Top horizontal shelf.</span>
    <span class="tok-kw">const</span> top: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static, .position = .{ <span class="tok-num">0</span>, <span class="tok-num">32</span> } });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, top, .{ .hw = <span class="tok-num">23</span>, .hh = <span class="tok-num">0.25</span>, .friction = <span class="tok-num">0.2</span> });

    <span class="tok-comment">// The cannon shot - launched up and to the right.</span>
    <span class="tok-kw">const</span> shot: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">3</span>, .y = <span class="tok-num">35</span>, .vx = <span class="tok-num">17</span>, .vy = <span class="tok-num">15</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, shot, .{ .r = <span class="tok-num">1</span>, .density = <span class="tok-num">5</span>, .friction = <span class="tok-num">0</span>, .restitution = <span class="tok-num">0.02</span> });

    <span class="tok-comment">// The cannon: a wheel plus two heavy angled barrel walls; recoils to the left on launch.</span>
    <span class="tok-kw">const</span> cannon: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">33</span>, .vx = -<span class="tok-num">5</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, cannon, .{ .r = <span class="tok-num">1.5</span>, .density = <span class="tok-num">2.5</span>, .friction = <span class="tok-num">1</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachRotBox</span>(world, cannon, <span class="tok-num">4.0</span>, <span class="tok-num">0.25</span>, .{ <span class="tok-num">0.7</span>, <span class="tok-num">3.5</span> }, pi / <span class="tok-num">4.0</span>, <span class="tok-num">15</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">try</span> <span class="tok-fn">attachRotBox</span>(world, cannon, <span class="tok-num">3.5</span>, <span class="tok-num">0.25</span>, .{ <span class="tok-num">4.0</span>, <span class="tok-num">2.0</span> }, pi / <span class="tok-num">4.0</span>, <span class="tok-num">15</span>, <span class="tok-num">1</span>);

    <span class="tok-comment">// The ball waiting to be struck by the recoiling cannon.</span>
    <span class="tok-kw">const</span> recoil: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">4.5</span>, .y = <span class="tok-num">33</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, recoil, .{ .r = <span class="tok-num">1</span>, .density = <span class="tok-num">9</span>, .friction = <span class="tok-num">0.1</span>, .restitution = <span class="tok-num">0.3</span> });

    <span class="tok-comment">// Right side: angular shelf, vertical shelf, then a descending staircase.</span>
    <span class="tok-kw">const</span> ang_shelf: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static });
    <span class="tok-kw">try</span> <span class="tok-fn">attachRotBox</span>(world, ang_shelf, <span class="tok-num">5.0</span>, <span class="tok-num">0.25</span>, .{ <span class="tok-num">55</span>, <span class="tok-num">30</span> }, pi / <span class="tok-num">18.0</span>, <span class="tok-num">0</span>, <span class="tok-num">0.2</span>);

    <span class="tok-kw">const</span> v_shelf: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{
        .motion_type = .static,
        .position = .{ <span class="tok-num">60</span>, <span class="tok-num">33</span> },
        .rotation = Rot2.<span class="tok-fn">fromAngle</span>(pi / <span class="tok-num">2.0</span>),
    });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, v_shelf, .{ .hw = <span class="tok-num">2</span>, .hh = <span class="tok-num">0.25</span>, .friction = <span class="tok-num">0.2</span> });

    <span class="tok-kw">const</span> r_shelf1: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static, .position = .{ <span class="tok-num">45</span>, <span class="tok-num">28</span> } });

    <span class="tok-kw">const</span> obstruction: BodyHandle = <span class="tok-kw">try</span> phys.<span class="tok-fn">createBody</span>(world, .{ .motion_type = .static, .position = .{ <span class="tok-num">35</span>, <span class="tok-num">24</span> } });

    <span class="tok-comment">// Centre see-saw platform pivoting on a static hinge post; a heavy bead lands on it.</span>
    <span class="tok-kw">const</span> platform: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">1</span>, .y = <span class="tok-num">12.5</span> });

    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createRevoluteJoint</span>(world, .{ .base = .{

    <span class="tok-kw">const</span> bead: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">1</span>, .y = <span class="tok-num">16</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, bead, .{ .r = <span class="tok-num">0.3</span>, .density = <span class="tok-num">2</span>, .friction = <span class="tok-num">0</span>, .restitution = <span class="tok-num">0</span> });

    <span class="tok-kw">try</span> <span class="tok-fn">attachHull</span>(world, saw_wedge, &amp;.{ .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">0</span>, <span class="tok-num">3</span> } }, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> saw_plank: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">35</span>, .y = <span class="tok-num">3</span> });

    <span class="tok-kw">const</span> stop_box: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">43</span>, .y = <span class="tok-num">0.5</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, stop_box, .{ .hw = <span class="tok-num">1</span>, .hh = <span class="tok-num">1.5</span>, .density = <span class="tok-num">0.01</span>, .friction = <span class="tok-num">0.2</span> });

    });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, basin, .{
        .geom = .{ .segment = .{ .point1 = .{ -<span class="tok-num">9</span>, <span class="tok-num">3</span> }, .point2 = .{ -<span class="tok-num">9</span>, <span class="tok-num">0</span> } } },

<span class="tok-comment">// ================================================================================</span>
<span class="tok-comment">// Benchmark - Washer (spinning ring drum)</span>
<span class="tok-comment">// ================================================================================</span>

<span class="tok-comment">// A kinematic "washer" ring spun slowly: 36 wedge polygons (between r1..r2) plus 4 inner spokes</span>
<span class="tok-comment">// (r0..r1), churning a grid of small dynamic squares that fall into it. box2d CreateWasher uses a</span>
<span class="tok-comment">// 90x90 grid (8100 squares); the physics + growable pools handle that fine (~70ms/step on device),</span>
<span class="tok-comment">// but the debug-draw vertex ring (gpu_iface.vbo_ring_vertices = 262144) overflows past ~8000 bodies</span>
<span class="tok-comment">// and the demo's 60Hz fixed step can't keep real-time at 70ms/step. So the shipped grid is 62x62</span>
<span class="tok-comment">// (~3844 squares) - under the vertex ring, and deliberately large so the broad-phase cost (the</span>
<span class="tok-comment">// dominant term once the pile densifies) is visible in the perf overlay. The growability proof</span>
<span class="tok-comment">// lives in the host harnesses; this scene is tuned to be playable.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">benchmarkWasher</span>(world: *phys.World) !void {
    <span class="tok-kw">const</span> r0: f32 = <span class="tok-num">14</span>;
    <span class="tok-kw">const</span> r1: f32 = <span class="tok-num">16</span>;
    <span class="tok-kw">const</span> r2: f32 = <span class="tok-num">18</span>;
    <span class="tok-kw">const</span> motor_speed: f32 = (pi / <span class="tok-num">180.0</span>) * <span class="tok-num">25.0</span>; <span class="tok-comment">// 25 deg/s</span>
    <span class="tok-kw">const</span> drum: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{
        .motion = .kinematic,
        .x = <span class="tok-num">0</span>,
        .y = <span class="tok-num">10</span>,
        .w = motor_speed,
        .vx = <span class="tok-num">0.001</span>,
        .vy = -<span class="tok-num">0.002</span>,
    });
    <span class="tok-kw">const</span> seg: Rot2 = Rot2.<span class="tok-fn">fromAngle</span>(pi / <span class="tok-num">18.0</span>); <span class="tok-comment">// 10 deg per wedge</span>
    <span class="tok-kw">const</span> qo: Rot2 = Rot2.<span class="tok-fn">fromAngle</span>(<span class="tok-num">0.1</span> * (pi / <span class="tok-num">18.0</span>));
    <span class="tok-kw">const</span> qo_inv: Rot2 = qo.<span class="tok-fn">invert</span>();
    <span class="tok-kw">var</span> dir_a: Vec2 = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> };
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; <span class="tok-num">36</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> dir_b: Vec2 = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> };
        <span class="tok-kw">if</span> (i != <span class="tok-num">35</span>) {
            dir_b = <span class="tok-fn">rotateVec2</span>(seg, dir_a);
        }
        <span class="tok-kw">const</span> a1: Vec2 = <span class="tok-fn">rotateVec2</span>(qo_inv, dir_a);
        <span class="tok-kw">const</span> a2: Vec2 = <span class="tok-fn">rotateVec2</span>(qo, dir_b);
        <span class="tok-kw">const</span> ring = [_]Vec2{
            a1 * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(r1)),
            a1 * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(r2)),
            a2 * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(r1)),
            a2 * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(r2)),
        };
        <span class="tok-kw">const</span> ring_hull: phys.Hull = phys.<span class="tok-fn">computeHull</span>(&amp;ring);
        _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, drum, .{ .geom = .{ .polygon = phys.<span class="tok-fn">makePolygon</span>(ring_hull, <span class="tok-num">0</span>) } });
        <span class="tok-kw">if</span> (i % <span class="tok-num">9</span> == <span class="tok-num">0</span>) {
            <span class="tok-kw">const</span> spoke = [_]Vec2{
                dir_a * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(r0)),
                dir_a * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(r1)),
                dir_b * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(r0)),
                dir_b * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(r1)),
            };
            <span class="tok-kw">const</span> spoke_hull: phys.Hull = phys.<span class="tok-fn">computeHull</span>(&amp;spoke);
            _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, drum, .{ .geom = .{ .polygon = phys.<span class="tok-fn">makePolygon</span>(spoke_hull, <span class="tok-num">0</span>) } });
        }
        dir_a = dir_b;
    }
    <span class="tok-kw">const</span> grid_count: usize = <span class="tok-num">62</span>;
    <span class="tok-kw">const</span> a: f32 = <span class="tok-num">0.1</span>;
    <span class="tok-kw">const</span> cell: phys.Polygon = phys.<span class="tok-fn">makeSquare</span>(a);
    <span class="tok-kw">const</span> gc_f: f32 = <span class="tok-fn">float</span>(grid_count);
    <span class="tok-kw">var</span> y: f32 = -<span class="tok-num">1.1</span> * a * gc_f + <span class="tok-num">10.0</span>;
    <span class="tok-kw">var</span> gi: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (gi &lt; grid_count) : (gi += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> x: f32 = -<span class="tok-num">1.1</span> * a * gc_f;
        <span class="tok-kw">var</span> gj: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (gj &lt; grid_count) : (gj += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> b: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = x, .y = y });
            _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, b, .{
                .geom = .{ .polygon = cell },
                .density = <span class="tok-num">1</span>,
                .enable_hit_events = true,
            });
            x += <span class="tok-num">2.1</span> * a;
        }
        y += <span class="tok-num">2.1</span> * a;
    }
}

<span class="tok-comment">// A near-degenerate sliver triangle - three almost-collinear points sitting far from the body</span>
<span class="tok-comment">// origin - dropped onto a segment. Stresses hull centroid and the "bad Steiner point" inertia path.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">issuesDisable</span>(world: *phys.World, st: *SceneState) !void {
    <span class="tok-comment">// box2d Issues|Disable: a dynamic "attachment" arm jointed to a static platform by a motorised</span>
    <span class="tok-comment">// revolute. box2d toggles b2Body_Disable/Enable on the arm via a checkbox; here it is automated</span>
    <span class="tok-comment">// on a timer - the swinging arm vanishes from the sim and reappears, its joint going inactive and</span>
    <span class="tok-comment">// restoring cleanly (the crash this scene originally guarded against).</span>
    <span class="tok-kw">const</span> attach: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">2</span>, .y = <span class="tok-num">3</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, attach, .{ .hw = <span class="tok-num">0.5</span>, .hh = <span class="tok-num">2.0</span> });

    <span class="tok-kw">const</span> platform: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">4</span>, .y = <span class="tok-num">5</span>, .motion = .static });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createShape</span>(world, platform, .{
        .geom = .{ .polygon = phys.<span class="tok-fn">makeOffsetBox</span>(<span class="tok-num">0.5</span>, <span class="tok-num">4.0</span>, .{ <span class="tok-num">4</span>, <span class="tok-num">0</span> }, Rot2.<span class="tok-fn">fromAngle</span>(<span class="tok-num">0.5</span> * pi)) },
    });

    <span class="tok-kw">try</span> <span class="tok-fn">pinRevolute</span>(world, attach, platform, .{
        .anchor = .{ -<span class="tok-num">2</span>, <span class="tok-num">5</span> },
        .motor = true,
        .torque = <span class="tok-num">50</span>,
        .speed = <span class="tok-num">0.6</span>,
    });

    st.body[<span class="tok-num">0</span>] = attach;
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>; <span class="tok-comment">// frame counter</span>
    st.u[<span class="tok-num">1</span>] = <span class="tok-num">0</span>; <span class="tok-comment">// 0 = enabled, 1 = disabled</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">issuesDisableUpdate</span>(world: *phys.World, st: *SceneState) void {
    st.u[<span class="tok-num">0</span>] += <span class="tok-num">1</span>;
    <span class="tok-kw">if</span> (st.u[<span class="tok-num">0</span>] &lt; <span class="tok-num">100</span>) {
        <span class="tok-kw">return</span>;
    }
    st.u[<span class="tok-num">0</span>] = <span class="tok-num">0</span>;
    <span class="tok-kw">const</span> attach: BodyHandle = st.body[<span class="tok-num">0</span>];
    <span class="tok-kw">if</span> (st.u[<span class="tok-num">1</span>] == <span class="tok-num">0</span>) {
        phys.<span class="tok-fn">disableBody</span>(world, attach);
        st.u[<span class="tok-num">1</span>] = <span class="tok-num">1</span>;
    } <span class="tok-kw">else</span> {
        phys.<span class="tok-fn">enableBody</span>(world, attach) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
        st.u[<span class="tok-num">1</span>] = <span class="tok-num">0</span>;
    }
}

<span class="tok-comment">// A light centre mass between two heavy circles on stiff spring-prismatics - a solver stress test</span>
<span class="tok-comment">// that jitters (diverges) when the middle mass is too small or the sub-step count too low.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">issuesUnstablePrismatic</span>(world: *phys.World) !void {
    _ = <span class="tok-kw">try</span> <span class="tok-fn">groundSegment</span>(world, <span class="tok-num">100</span>);
    <span class="tok-kw">const</span> center: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">3</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, center, .{ .r = <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> left: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = -<span class="tok-num">3.5</span>, .y = <span class="tok-num">3</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, left, .{ .r = <span class="tok-num">2</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createPrismaticJoint</span>(world, .{
        .base = .{ .body_a = center, .body_b = left },
        .enable_spring = true,
        .hertz = <span class="tok-num">10</span>,
        .damping_ratio = <span class="tok-num">2</span>,
        .target_translation = -<span class="tok-num">3</span>,
    });
    <span class="tok-kw">const</span> right: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = <span class="tok-num">3.5</span>, .y = <span class="tok-num">3</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachCircle</span>(world, right, .{ .r = <span class="tok-num">2</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createPrismaticJoint</span>(world, .{
        .base = .{ .body_a = center, .body_b = right },
        .enable_spring = true,
        .hertz = <span class="tok-num">10</span>,
        .damping_ratio = <span class="tok-num">2</span>,
        .target_translation = <span class="tok-num">3</span>,
    });
}

<span class="tok-comment">// One arm of the windmill: a box welded to the central disc with a stiff base constraint.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">weldRotor</span>(
    world: *phys.World,
    center: BodyHandle,
    pos: Vec2,
    hw: f32,
    hh: f32,
    frame_a: Vec2,
    frame_b: Vec2,
) !void {
    <span class="tok-kw">const</span> body: BodyHandle = <span class="tok-kw">try</span> <span class="tok-fn">addBody</span>(world, .{ .x = pos[<span class="tok-num">0</span>], .y = pos[<span class="tok-num">1</span>], .gravity_scale = <span class="tok-num">0</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">attachBox</span>(world, body, .{ .hw = hw, .hh = hh, .friction = <span class="tok-num">0.1</span> });
    _ = <span class="tok-kw">try</span> phys.<span class="tok-fn">createWeldJoint</span>(world, .{ .base = .{
        .body_a = center,
        .body_b = body,
        .local_frame_a = .{ .p = frame_a, .q = Rot2.identity },
        .local_frame_b = .{ .p = frame_b, .q = Rot2.identity },
        .constraint_hertz = <span class="tok-num">30</span>,
    } });
}

<span class="tok-comment">// Four box rotors rigidly welded around a gravity-free central disc with a stiff constraint hertz -</span>

    <span class="tok-kw">try</span> <span class="tok-fn">weldRotor</span>(world, center, .{ <span class="tok-num">10</span>, <span class="tok-num">20</span> }, <span class="tok-num">4</span>, <span class="tok-num">5</span>, .{ <span class="tok-num">0</span>, <span class="tok-num">5</span> }, .{ <span class="tok-num">0</span>, -<span class="tok-num">5</span> });
    <span class="tok-kw">try</span> <span class="tok-fn">weldRotor</span>(world, center, .{ <span class="tok-num">0</span>, <span class="tok-num">10</span> }, <span class="tok-num">5</span>, <span class="tok-num">4</span>, .{ -<span class="tok-num">5</span>, <span class="tok-num">0</span> }, .{ <span class="tok-num">5</span>, <span class="tok-num">0</span> });
