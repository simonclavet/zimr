<h1>split_screen</h1>
<figure class="code src-file" data-path="examples/split_screen/split_screen.zig" data-lines="227"><figcaption><span>examples/split_screen/split_screen.zig</span><span>227 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! split_screen - port of the GL `split_screen`: two players, one</span>
<span class="tok-comment">//! world, two perspectives.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The original was the architecture test for the (GL-era) Scene renderer's</span>
<span class="tok-comment">//! per-camera fog: two cameras orbiting inside two different fog spheres,</span>
<span class="tok-comment">//! each rendered into its half of the canvas, picking up "its" fog with no</span>
<span class="tok-comment">//! split-screen awareness in the renderer.  That Scene system dies with the</span>
<span class="tok-comment">//! GL path; this port keeps the demo's ESSENCE on the wgpu idioms:</span>
<span class="tok-comment">//!   - ONE world (immediate-3D primitives + the two zone spheres), drawn</span>
<span class="tok-comment">//!     TWICE per frame with two cameras - each into its own RenderTexture</span>
<span class="tok-comment">//!     (the helmet's RTT pattern), composited side by side.</span>
<span class="tok-comment">//!   - Per-camera ATMOSPHERE computed in app code: whichever zone sphere a</span>
<span class="tok-comment">//!     camera is inside tints that camera's half (a translucent overlay in</span>
<span class="tok-comment">//!     the RTT's own 2D space).  Same story - one world, two views, two</span>
<span class="tok-comment">//!     atmospheres - without renderer special-casing.</span>
<span class="tok-comment">//!   - The engine learned `App.target_size` for this port: `beginMode3D`</span>
<span class="tok-comment">//!     inside `beginTextureMode` now uses the RTT's aspect, so a half-width</span>
<span class="tok-comment">//!     viewport renders undistorted.</span>
<span class="tok-comment">//! The halves track the live canvas (backing size / 2 each), so rotation</span>
<span class="tok-comment">//! and resize stay correct - the t1168 fullscreen rules.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> length3 = zm.length3;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> pointVec = zm.pointVec;
<span class="tok-kw">const</span> tau = zm.tau;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> c = z.colors;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// The two atmosphere zones: a blue one on the left of the world, an amber</span>
<span class="tok-comment">// one on the right.  Each camera orbits INSIDE its zone, so by construction</span>
<span class="tok-comment">// each half always shows that zone's tint (cross over and it would switch -</span>
<span class="tok-comment">// same "exercise for the reader" as the original).</span>
<span class="tok-kw">const</span> zone_blue_center: Vec = <span class="tok-fn">pointVec</span>(-<span class="tok-num">4</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>);
<span class="tok-kw">const</span> zone_amber_center: Vec = <span class="tok-fn">pointVec</span>(<span class="tok-num">4</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>);
<span class="tok-kw">const</span> zone_radius: f32 = <span class="tok-num">3.4</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    rt_left: z.RenderTexture = .{},
    rt_right: z.RenderTexture = .{},
    angle: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.rt_left.<span class="tok-fn">deinit</span>();
    s.rt_right.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.* = .{ .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>) };
}

<span class="tok-comment">/// Keep each half's render texture at half the surface BACKING width x</span>
<span class="tok-comment">/// full backing height (pixel-perfect at any orientation; recreated only</span>
<span class="tok-comment">/// when the size actually changes).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> half_w: u32 = <span class="tok-builtin">@max</span>(backing.width / <span class="tok-num">2</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> full_h: u32 = <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt_left.color == .invalid <span class="tok-kw">or</span> s.rt_left.width != half_w <span class="tok-kw">or</span> s.rt_left.height != full_h) {
        <span class="tok-kw">if</span> (s.rt_left.color != .invalid) {
            z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt_left);
            z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt_right);
        }
        s.rt_left = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(half_w), <span class="tok-builtin">@intCast</span>(full_h));
        s.rt_right = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(half_w), <span class="tok-builtin">@intCast</span>(full_h));
    }
}

<span class="tok-comment">/// Three orthogonal great circles approximating a wire sphere.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawZoneRings</span>(f: *z.Frame, center: Vec, radius: f32, color: Color) void {
    <span class="tok-kw">const</span> segs: usize = <span class="tok-num">28</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; segs) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> a0: f32 = <span class="tok-fn">float</span>(i) / segs * tau;
        <span class="tok-kw">const</span> a1: f32 = <span class="tok-fn">float</span>(i + <span class="tok-num">1</span>) / segs * tau;
        <span class="tok-kw">const</span> c0: f32 = <span class="tok-builtin">@cos</span>(a0) * radius;
        <span class="tok-kw">const</span> s0: f32 = <span class="tok-builtin">@sin</span>(a0) * radius;
        <span class="tok-kw">const</span> c1: f32 = <span class="tok-builtin">@cos</span>(a1) * radius;
        <span class="tok-kw">const</span> s1: f32 = <span class="tok-builtin">@sin</span>(a1) * radius;
        <span class="tok-comment">// XZ ring (horizon), XY ring, YZ ring.</span>
        z.<span class="tok-fn">drawLine3D</span>(f.gl, center + <span class="tok-fn">vec</span>(c0, <span class="tok-num">0</span>, s0), center + <span class="tok-fn">vec</span>(c1, <span class="tok-num">0</span>, s1), color);
        z.<span class="tok-fn">drawLine3D</span>(f.gl, center + <span class="tok-fn">vec</span>(c0, s0, <span class="tok-num">0</span>), center + <span class="tok-fn">vec</span>(c1, s1, <span class="tok-num">0</span>), color);
        z.<span class="tok-fn">drawLine3D</span>(f.gl, center + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, c0, s0), center + <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, c1, s1), color);
    }
}

<span class="tok-comment">/// The shared world - drawn identically for both cameras.  A ground grid,</span>
<span class="tok-comment">/// a small scatter of primitives, and the two zone spheres as wireframes so</span>
<span class="tok-comment">/// each player can SEE the atmosphere volumes.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawWorld</span>(f: *z.Frame) void {
    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">20</span>, <span class="tok-num">1.0</span>);

    z.<span class="tok-fn">drawCube</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.6</span>, <span class="tok-num">0</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">1.2</span>, <span class="tok-num">1.2</span>, <span class="tok-num">1.2</span>), .color = c.slate_400 });
    z.<span class="tok-fn">drawCubeWires</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.6</span>, <span class="tok-num">0</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">1.2</span>, <span class="tok-num">1.2</span>, <span class="tok-num">1.2</span>), .color = c.slate_200 });
    z.<span class="tok-fn">drawSphere</span>(f.gl, <span class="tok-fn">pointVec</span>(-<span class="tok-num">2</span>, <span class="tok-num">0.7</span>, <span class="tok-num">2</span>), .{ .radius = <span class="tok-num">0.7</span>, .rings = <span class="tok-num">12</span>, .slices = <span class="tok-num">16</span>, .color = c.rose_400 });
    z.<span class="tok-fn">drawSphere</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">2</span>, <span class="tok-num">0.7</span>, -<span class="tok-num">2</span>), .{ .radius = <span class="tok-num">0.7</span>, .rings = <span class="tok-num">12</span>, .slices = <span class="tok-num">16</span>, .color = c.emerald_400 });
    z.<span class="tok-fn">drawCylinderBetween</span>(f.gl, <span class="tok-fn">pointVec</span>(-<span class="tok-num">1.5</span>, <span class="tok-num">0</span>, -<span class="tok-num">2.5</span>), <span class="tok-fn">pointVec</span>(-<span class="tok-num">1.5</span>, <span class="tok-num">1.6</span>, -<span class="tok-num">2.5</span>), <span class="tok-num">0.4</span>, <span class="tok-num">0.4</span>, <span class="tok-num">14</span>, c.violet_400);
    z.<span class="tok-fn">drawCylinderBetween</span>(f.gl, <span class="tok-fn">pointVec</span>(<span class="tok-num">1.5</span>, <span class="tok-num">0</span>, <span class="tok-num">2.5</span>), <span class="tok-fn">pointVec</span>(<span class="tok-num">1.5</span>, <span class="tok-num">2.0</span>, <span class="tok-num">2.5</span>), <span class="tok-num">0.5</span>, <span class="tok-num">0.0</span>, <span class="tok-num">14</span>, c.amber_500);

    <span class="tok-comment">// The atmosphere volumes, visible from inside and out (three orthogonal</span>
    <span class="tok-comment">// rings each - the wgpu immediate set has no drawSphereWires yet).</span>
    <span class="tok-fn">drawZoneRings</span>(f, zone_blue_center, zone_radius, c.sky_300);
    <span class="tok-fn">drawZoneRings</span>(f, zone_amber_center, zone_radius, c.amber_300);
}

<span class="tok-comment">/// Whichever zone sphere `pos` is inside picks the half's atmosphere tint</span>
<span class="tok-comment">/// (alpha-blended overlay); outside both = no tint.  The original's</span>
<span class="tok-comment">/// per-camera fog picker, reborn as twelve lines of app code.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">atmosphereTint</span>(pos: Vec) ?Color {
    <span class="tok-kw">if</span> (<span class="tok-fn">length3</span>(pos - zone_blue_center) &lt; zone_radius) {
        <span class="tok-kw">return</span> .{ .r = <span class="tok-num">70</span>, .g = <span class="tok-num">120</span>, .b = <span class="tok-num">220</span>, .a = <span class="tok-num">64</span> };
    }
    <span class="tok-kw">if</span> (<span class="tok-fn">length3</span>(pos - zone_amber_center) &lt; zone_radius) {
        <span class="tok-kw">return</span> .{ .r = <span class="tok-num">230</span>, .g = <span class="tok-num">160</span>, .b = <span class="tok-num">40</span>, .a = <span class="tok-num">64</span> };
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-comment">/// Render the shared world from `cam` into `rt`, then overlay that</span>
<span class="tok-comment">/// camera's atmosphere tint in the RTT's own 2D space.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">renderView</span>(f: *z.Frame, rt: z.RenderTexture, cam: Camera3D) void {
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, rt, .{ .r = <span class="tok-num">10</span>, .g = <span class="tok-num">12</span>, .b = <span class="tok-num">20</span>, .a = <span class="tok-num">255</span> });
    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam);
    <span class="tok-fn">drawWorld</span>(f);
    z.<span class="tok-fn">endMode3D</span>(f.gl);
    <span class="tok-kw">if</span> (<span class="tok-fn">atmosphereTint</span>(cam.position)) |tint| {
        <span class="tok-kw">const</span> rtw: f32 = <span class="tok-fn">float</span>(rt.width);
        <span class="tok-kw">const</span> rth: f32 = <span class="tok-fn">float</span>(rt.height);
        f.gl.<span class="tok-fn">rect</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = rtw, .height = rth }, .{ .color = tint });
    }
    z.<span class="tok-fn">endTextureMode</span>(f.gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    s.angle += f.time.delta_time * <span class="tok-num">24.0</span>;
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);

    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing).</span>
    <span class="tok-comment">// Each camera orbits INSIDE its own zone at radius 2, looking across</span>
    <span class="tok-comment">// the world at the other zone's center - so each half frames the whole</span>
    <span class="tok-comment">// scene from its side.</span>
    <span class="tok-kw">const</span> rad: f32 = s.angle * pi / <span class="tok-num">180.0</span>;
    <span class="tok-kw">const</span> cam_left: Camera3D = .{
        .position = <span class="tok-fn">pointVec</span>(
            zone_blue_center[<span class="tok-num">0</span>] + <span class="tok-builtin">@cos</span>(rad) * <span class="tok-num">2.0</span>,
            <span class="tok-num">1.6</span>,
            zone_blue_center[<span class="tok-num">2</span>] + <span class="tok-builtin">@sin</span>(rad) * <span class="tok-num">2.0</span>,
        ),
        .target = zone_amber_center,
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = <span class="tok-num">55</span>,
        .projection = <span class="tok-num">0</span>,
    };
    <span class="tok-kw">const</span> cam_right: Camera3D = .{
        .position = <span class="tok-fn">pointVec</span>(
            zone_amber_center[<span class="tok-num">0</span>] + <span class="tok-builtin">@cos</span>(-rad) * <span class="tok-num">2.0</span>,
            <span class="tok-num">1.6</span>,
            zone_amber_center[<span class="tok-num">2</span>] + <span class="tok-builtin">@sin</span>(-rad) * <span class="tok-num">2.0</span>,
        ),
        .target = zone_blue_center,
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = <span class="tok-num">55</span>,
        .projection = <span class="tok-num">0</span>,
    };

    <span class="tok-fn">renderView</span>(f, s.rt_left, cam_left);
    <span class="tok-fn">renderView</span>(f, s.rt_right, cam_right);

    <span class="tok-comment">// SCREEN PASS: open once, clear, then composite.</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-comment">// Composite the two halves + divider + labels.</span>
    <span class="tok-kw">const</span> half: f32 = vw * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = half, .height = vh }, s.rt_left.<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    f.gl.<span class="tok-fn">texture</span>(.{ .x = half, .y = <span class="tok-num">0</span>, .width = half, .height = vh }, s.rt_right.<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    f.gl.<span class="tok-fn">rect</span>(.{ .x = half - <span class="tok-num">1.5</span>, .y = <span class="tok-num">0</span>, .width = <span class="tok-num">3</span>, .height = vh }, .{ .color = white });

    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, <span class="tok-num">14</span> },
        <span class="tok-str">"P1 - blue zone"</span>,
        .{ .size = <span class="tok-num">22</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
    f.gl.<span class="tok-fn">text</span>(
        .{ vw - <span class="tok-num">188</span>, <span class="tok-num">14</span> },
        <span class="tok-str">"P2 - amber zone"</span>,
        .{ .size = <span class="tok-num">22</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"one world, two cameras, two render textures - per-camera atmosphere"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// Descriptor-only: the runner (standalone) or a launcher drives this.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - split screen: two cameras, one world"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Offscreen render-textures drawn before the screen opens (tile-based-GPU</span>
    <span class="tok-comment">// safe); owns its own begin/endDrawing.</span>
    .manages_own_frame = true,
};
