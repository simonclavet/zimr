<h1>pipeline_instancing</h1>
<figure class="code src-file" data-path="examples/pipeline_instancing/pipeline_instancing.zig" data-lines="204"><figcaption><span>examples/pipeline_instancing/pipeline_instancing.zig</span><span>204 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! pipeline_instancing - increment 4 of the custom-pipeline API</span>
<span class="tok-comment">//! (`src/notes/webgpu_control.md`). Ported from raygpu's `pipeline_instancing.cpp`:</span>
<span class="tok-comment">//! ONE draw call paints a whole grid of triangles, each fed its own offset and</span>
<span class="tok-comment">//! colour from INSTANCE-rate vertex buffers.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The new material is `step_mode = .instance` on a vertex-buffer layout: slot 0</span>
<span class="tok-comment">//! advances per VERTEX (the shared triangle shape), slots 1 and 2 advance per</span>
<span class="tok-comment">//! INSTANCE (a position offset and a colour). `drawArrays(vertex_count,</span>
<span class="tok-comment">//! instance_count)` then replays the 3-vertex triangle `instance_count` times,</span>
<span class="tok-comment">//! and the GPU pulls a fresh offset+colour for each. The offset buffer is</span>
<span class="tok-comment">//! re-uploaded every frame so the grid ripples on a sine wave - dynamic</span>
<span class="tok-comment">//! per-instance data, the raygpu demo's trick.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Builds straight on vao_multibuffer: same multi-buffer layout, one slot just</span>
<span class="tok-comment">//! switched to instance rate. A UBO carries the aspect-correct scale.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Build:  zig build wgpu-pipeline-instancing</span>
<span class="tok-comment">//! Device: zig build wgpu-pipeline-instancing-standalone -Dmode=release</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"instancing_vs_io.zig"</span>);
<span class="tok-kw">const</span> fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_fs_io.zig"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// Build-generated WGSL (Zig shader -&gt; SPIR-V -&gt; spv2wgsl). The fragment stage</span>
<span class="tok-comment">// is shared with pipeline_uniforms (pure colour pass-through), so we reuse its</span>
<span class="tok-comment">// generated WGSL rather than authoring a duplicate.</span>
<span class="tok-kw">const</span> vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"instancing_vs.wgsl"</span>);
<span class="tok-kw">const</span> fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pipeline_uniforms_fs.wgsl"</span>);

<span class="tok-kw">const</span> cols: usize = <span class="tok-num">14</span>;
<span class="tok-kw">const</span> rows: usize = <span class="tok-num">9</span>;
<span class="tok-kw">const</span> inst_count: usize = cols * rows;

<span class="tok-kw">const</span> Pos = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> { x: f32, y: f32 };
<span class="tok-kw">const</span> Off = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> { x: f32, y: f32 };
<span class="tok-kw">const</span> Col = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> { r: f32, g: f32, b: f32 };

<span class="tok-comment">/// The shared per-vertex shape: one small upward triangle around the origin.</span>
<span class="tok-kw">const</span> tri_h: f32 = <span class="tok-num">0.05</span>;
<span class="tok-kw">const</span> tri = [_]Pos{
    .{ .x = <span class="tok-num">0.0</span>, .y = tri_h },
    .{ .x = -tri_h * <span class="tok-num">0.87</span>, .y = -tri_h * <span class="tok-num">0.5</span> },
    .{ .x = tri_h * <span class="tok-num">0.87</span>, .y = -tri_h * <span class="tok-num">0.5</span> },
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io),
    vbo: z.wgpu.BufferHandle,
    offset_vbo: z.wgpu.BufferHandle,
    color_vbo: z.wgpu.BufferHandle,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.shader.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.offset_vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.color_vbo);
}

<span class="tok-kw">fn</span> <span class="tok-fn">aspectMat</span>(sx: f32, sy: f32) [<span class="tok-num">4</span>]<span class="tok-builtin">@Vector</span>(<span class="tok-num">4</span>, f32) {
    <span class="tok-kw">return</span> .{
        .{ sx, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .{ <span class="tok-num">0</span>, sy, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> },
        .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> },
    };
}

<span class="tok-comment">/// Grid cell -&gt; base NDC position (before the per-frame wave).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">cellPos</span>(cx: usize, ry: usize) Off {
    <span class="tok-kw">const</span> fx: f32 = <span class="tok-fn">float</span>(cx) / <span class="tok-fn">float</span>(cols - <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> fy: f32 = <span class="tok-fn">float</span>(ry) / <span class="tok-fn">float</span>(rows - <span class="tok-num">1</span>);
    <span class="tok-kw">return</span> .{ .x = (fx - <span class="tok-num">0.5</span>) * <span class="tok-num">1.7</span>, .y = (fy - <span class="tok-num">0.5</span>) * <span class="tok-num">1.5</span> };
}

<span class="tok-kw">fn</span> <span class="tok-fn">makeBuffer</span>(f: *z.Frame, bytes: []<span class="tok-kw">const</span> u8, label: []<span class="tok-kw">const</span> u8) z.wgpu.BufferHandle {
    <span class="tok-kw">const</span> buf: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = bytes.len,
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = label,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, buf, <span class="tok-num">0</span>, bytes);
    <span class="tok-kw">return</span> buf;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = <span class="tok-fn">makeBuffer</span>(f, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;tri), <span class="tok-str">"inst_tri_vbo"</span>);

    <span class="tok-comment">// Per-instance colours: a 2D gradient across the grid. Uploaded once.</span>
    <span class="tok-kw">var</span> colors: [inst_count]Col = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..rows) |ry| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..cols) |cx| {
            <span class="tok-kw">const</span> fx: f32 = <span class="tok-fn">float</span>(cx) / <span class="tok-fn">float</span>(cols - <span class="tok-num">1</span>);
            <span class="tok-kw">const</span> fy: f32 = <span class="tok-fn">float</span>(ry) / <span class="tok-fn">float</span>(rows - <span class="tok-num">1</span>);
            colors[ry * cols + cx] = .{ .r = <span class="tok-num">0.25</span> + <span class="tok-num">0.75</span> * fx, .g = <span class="tok-num">0.3</span> + <span class="tok-num">0.7</span> * fy, .b = <span class="tok-num">0.3</span> + <span class="tok-num">0.7</span> * (<span class="tok-num">1.0</span> - fx) };
        }
    }
    <span class="tok-kw">const</span> color_vbo: z.wgpu.BufferHandle = <span class="tok-fn">makeBuffer</span>(f, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;colors), <span class="tok-str">"inst_color_vbo"</span>);

    <span class="tok-comment">// Per-instance offsets: seeded with the base grid; re-uploaded each frame.</span>
    <span class="tok-kw">var</span> offsets: [inst_count]Off = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..rows) |ry| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..cols) |cx| {
            offsets[ry * cols + cx] = <span class="tok-fn">cellPos</span>(cx, ry);
        }
    }
    <span class="tok-kw">const</span> offset_vbo: z.wgpu.BufferHandle = <span class="tok-fn">makeBuffer</span>(f, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;offsets), <span class="tok-str">"inst_offset_vbo"</span>);

    <span class="tok-comment">// Three buffer layouts: slot 0 per-VERTEX, slots 1 &amp; 2 per-INSTANCE. The</span>
    <span class="tok-comment">// schema can't express step rate, so instanced layouts are hand-built and</span>
    <span class="tok-comment">// passed to loadShaderVF (rather than the derived `z.shader.vertexLayout`).</span>
    <span class="tok-kw">const</span> vert_layout: z.VertexLayout = .{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(Pos),
        .step_mode = .vertex,
        .attributes = &amp;.{.{ .format = .float32x2, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> }},
    };
    <span class="tok-kw">const</span> offset_layout: z.VertexLayout = .{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(Off),
        .step_mode = .instance,
        .attributes = &amp;.{.{ .format = .float32x2, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">1</span> }},
    };
    <span class="tok-kw">const</span> color_layout: z.VertexLayout = .{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(Col),
        .step_mode = .instance,
        .attributes = &amp;.{.{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">2</span> }},
    };

    <span class="tok-comment">// The UBO (group 0) is owned by the shader's Resources; pushUbo rewrites it</span>
    <span class="tok-comment">// each frame. No hand-wired bind group / layout - loadShaderVF builds them.</span>
    <span class="tok-kw">const</span> shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(vs_io, fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = vs_wgsl,
        .fs_wgsl_source = fs_wgsl,
        .label = <span class="tok-str">"pipeline_instancing"</span>,
        .vertex_buffer_layouts = &amp;.{ vert_layout, offset_layout, color_layout },
        .initial_ubo = .{ .transform = <span class="tok-fn">aspectMat</span>(<span class="tok-num">1</span>, <span class="tok-num">1</span>) },
    });

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>),
        .shader = shader,
        .vbo = vbo,
        .offset_vbo = offset_vbo,
        .color_vbo = color_vbo,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> aspect: f32 = w / <span class="tok-builtin">@max</span>(h, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> sx: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span> / aspect;
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) aspect <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
    s.shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .transform = <span class="tok-fn">aspectMat</span>(sx, sy) });

    <span class="tok-comment">// Animate the per-instance offsets: a travelling sine wave in Y. Dynamic</span>
    <span class="tok-comment">// per-instance data, re-uploaded each frame.</span>
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">var</span> offsets: [inst_count]Off = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..rows) |ry| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..cols) |cx| {
            <span class="tok-kw">const</span> base: Off = <span class="tok-fn">cellPos</span>(cx, ry);
            <span class="tok-kw">const</span> wave: f32 = <span class="tok-builtin">@sin</span>(t * <span class="tok-num">1.8</span> + base.x * <span class="tok-num">4.0</span>) * <span class="tok-num">0.045</span>;
            offsets[ry * cols + cx] = .{ .x = base.x, .y = base.y + wave };
        }
    }
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.offset_vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;offsets));

    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    s.shader.<span class="tok-fn">bindForDraw</span>(ps);
    s.shader.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(tri)));
    s.shader.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">1</span>, s.offset_vbo, <span class="tok-builtin">@sizeOf</span>([inst_count]Off));
    s.shader.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">2</span>, s.color_vbo, <span class="tok-builtin">@sizeOf</span>([inst_count]Col));
    s.shader.<span class="tok-fn">draw</span>(ps, tri.len, inst_count);

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"pipeline_instancing: one draw call, 126 triangles (per-instance offset + colour)"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - pipeline instancing"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.039</span>, .g = <span class="tok-num">0.047</span>, .b = <span class="tok-num">0.071</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
</code></pre></figure>
<figure class="code src-file" data-path="examples/instancing_vs.zig" data-lines="36"><figcaption><span>examples/instancing_vs.zig</span><span>36 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/instancing_vs.zig - instancing vertex shader body.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Adds the per-instance offset to the per-vertex triangle position, transforms</span>
<span class="tok-comment">//! by the UBO's 4x4 aspect matrix, and passes the per-instance colour through.</span>
<span class="tok-comment">//! One draw call replays the 3-vertex triangle `instance_count` times; the</span>
<span class="tok-comment">//! offset/colour attributes advance once per instance (step mode set host-side).</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> mulMatPoint = zm.mulMatPoint;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"instancing_vs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"instancing_vs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_io.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-comment">// Per-vertex shape + per-instance placement, on the z=0 plane.</span>
    <span class="tok-kw">const</span> p: Vec2 = io_in.vertex_position;
    <span class="tok-kw">const</span> off: Vec2 = io_in.instance_offset;
    <span class="tok-kw">const</span> world: Vec3 = .{ p[<span class="tok-num">0</span>] + off[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>] + off[<span class="tok-num">1</span>], <span class="tok-num">0.0</span> };
    out.position = <span class="tok-fn">mulMatPoint</span>(io_in.u.transform, world);

    <span class="tok-kw">const</span> c: Vec3 = io_in.instance_color;
    out.frag_color = .{ c[<span class="tok-num">0</span>], c[<span class="tok-num">1</span>], c[<span class="tok-num">2</span>], <span class="tok-num">1.0</span> };

    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_io;
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
</code></pre></figure>
<figure class="code src-file" data-path="examples/instancing_vs_io.zig" data-lines="40"><figcaption><span>examples/instancing_vs_io.zig</span><span>40 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/instancing_vs_io.zig - typed interface for the instancing vertex</span>
<span class="tok-comment">//! shader. Companion to `instancing_vs.zig`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Demonstrates INSTANCED drawing with a multi-buffer vertex layout: one buffer</span>
<span class="tok-comment">//! holds the per-vertex triangle shape (slot 0), two more hold per-instance data</span>
<span class="tok-comment">//! (offset @1, colour @2). The three `Attributes` declare only the @locations;</span>
<span class="tok-comment">//! the per-vertex-vs-per-instance step modes live in the hand-built</span>
<span class="tok-comment">//! `vertex_buffer_layouts` the host passes to `loadShaderVF` (the schema can't</span>
<span class="tok-comment">//! express step rate, so instanced layouts are built by hand - see the example).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The `Ubo` (a 4x4 transform for aspect-correction) is declared here in the</span>
<span class="tok-comment">//! vertex schema, so the codegen binds it at @group(0) and `loadShaderVF` routes</span>
<span class="tok-comment">//! it automatically. The fragment stage is shared with `pipeline_uniforms_fs`</span>
<span class="tok-comment">//! (pure colour pass-through), so this file only defines the vertex side.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> shader = <span class="tok-builtin">@import</span>(<span class="tok-str">"shader_interface"</span>);

<span class="tok-comment">/// Vertex attributes across THREE buffers (step rate set host-side):</span>
<span class="tok-comment">///   - `vertex_position` (slot 0, per-vertex): the shared triangle shape.</span>
<span class="tok-comment">///   - `instance_offset`  (slot 1, per-instance): where to place each copy.</span>
<span class="tok-comment">///   - `instance_color`   (slot 2, per-instance): each copy's colour.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Attributes = <span class="tok-kw">struct</span> {
    vertex_position: shader.<span class="tok-fn">Attr</span>(.vec2, <span class="tok-num">0</span>),
    instance_offset: shader.<span class="tok-fn">Attr</span>(.vec2, <span class="tok-num">1</span>),
    instance_color: shader.<span class="tok-fn">Attr</span>(.vec3, <span class="tok-num">2</span>),
};

<span class="tok-comment">/// Single uniform block (group 0, binding 0): a 4x4 aspect-correction transform,</span>
<span class="tok-comment">/// rewritten by the host each frame. mat4 == [4]Vec (std140 rows).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Ubo = <span class="tok-kw">struct</span> {
    transform: [<span class="tok-num">4</span>]Vec,
};

<span class="tok-comment">/// Varying to the fragment stage - the interpolated colour. Matches</span>
<span class="tok-comment">/// `pipeline_uniforms_fs_io.Inputs` field-for-field (structural reuse).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Outputs = <span class="tok-kw">struct</span> {
    frag_color: Vec,
};
</code></pre></figure>
<figure class="code src-file" data-path="examples/pipeline_uniforms_fs.zig" data-lines="19"><figcaption><span>examples/pipeline_uniforms_fs.zig</span><span>19 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/pipeline_uniforms_fs.zig - pipeline_uniforms fragment shader body.</span>
<span class="tok-comment">//! Emits the interpolated colour straight through.</span>

<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_fs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_fs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(void);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {

    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_io;
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
