<style>
:root{

  --bg:#0a0a0a;          /* the page */

  --panel-2:#1b1b1b;     /* a panel on a panel (figcaption, summary) */
  --fg:#e8e8e8;          /* body text */

  --faint:#6b7280;       /* labels, line numbers, table headers */

  --link:#82d8ef;
  /* tokens — the one set, shared by the Zig and WGSL highlighters */

  --tok-kw:#c792ea;
  --tok-fn:#82d8ef;
  --tok-str:#9ad08a;
  --tok-num:#f5a35e;
  --tok-type:#6fb6ff;
  --tok-builtin:#e9a23b;

  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;

}

em,i{color:var(--dim);font-style:italic;}

pre{

  overflow-x:auto;font-size:13px;line-height:1.6;
}

pre code{background:none;padding:0;border:0;font-size:inherit;color:var(--fg);}
code{background:var(--panel);padding:.1em .35em;border-radius:2px;font-size:.92em;color:#fff;}
.tok-comment{color:var(--tok-comment);font-style:italic;}
.tok-kw{color:var(--tok-kw);}
.tok-fn{color:var(--tok-fn);}

.tok-num{color:var(--tok-num);}
.tok-type{color:var(--tok-type);}
.tok-builtin{color:var(--tok-builtin);}
/* a captioned code block: <figure class="code"><figcaption>… */
figure{margin:1.3em 0;}
figure.code{margin:1.3em 0;}
figure.code figcaption{
  background:var(--panel-2);border:1px solid var(--rule);border-bottom:0;

  display:flex;justify-content:space-between;gap:1em;
}
figure.code figcaption .lang{color:var(--dim);text-transform:uppercase;letter-spacing:.16em;}
figure.code pre{margin:0;border-radius:0 0 3px 3px;}
/* folds — pure CSS, no JS. The summary text is just the name; the prose
   comes from ::before, which is zimrnum-tutorial's trick and a good one. */
details{border:1px solid var(--rule);border-radius:3px;margin:.5em 0;background:var(--panel);}
details[open]{background:var(--bg);}
summary{
  cursor:pointer;padding:.4em .8em;color:var(--dim);font-size:.9em;
  list-style:none;user-select:none;
}
summary::-webkit-details-marker{display:none;}
summary::before{content:"\\25b8\\00a0";color:var(--faint);}
details[open]>summary::before{content:"\\25be\\00a0";}
summary:hover{color:var(--fg);}
details>pre{margin:0;border:0;border-top:1px solid var(--rule);border-radius:0;}
.src-fold>summary::after{content:" \\2014 source";color:var(--faint);}
/* callouts — one box, a coloured left rule says which kind */
.note,.warn,.good,.bad{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left-width:3px;border-radius:3px;
}
.note{border-left-color:var(--tok-fn);}
.warn{border-left-color:var(--tok-builtin);}
.good{border-left-color:var(--tok-str);}
.bad{border-left-color:#e0555f;}
/* tables */
table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:13px;}
th,td{border:1px solid var(--rule);padding:.45em .7em;text-align:left;vertical-align:top;}
th{color:var(--faint);font-weight:700;background:var(--panel);}
/* the CPU/GPU split: two surfaces, same two colours as everything else */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:1.3em 0;}
.split>*{min-width:0;}
.split-cpu,.split-gpu{border:1px solid var(--rule);border-radius:3px;padding:2px;}
.split-cpu{background:var(--bg);}
.split-gpu{background:var(--panel);}
.split-cpu>pre,.split-gpu>pre{margin:0;border:0;background:none;}
.split h4,.split .lab{

  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--rule);
}
@media(max-width:700px){.split{grid-template-columns:1fr;}}
/* media */
img,svg,canvas,video{max-width:100%;height:auto;}
iframe{max-width:100%;border:1px solid var(--rule);border-radius:3px;background:#000;}
/* a live demo embedded in a page: the full column, 16:9. Without a size the
   frame is the browser default 300x150 and the app boots that small. */
.demo-embed{margin:1.6em 0;}
.demo-embed iframe{display:block;width:100%;aspect-ratio:16/9;}
.demo-embed figcaption{color:var(--dim);font-size:.9em;margin-top:.5em;}
/* Inline marks the pages already use, mapped onto the SAME token colours
   rather than given colours of their own — cheatsheet's signature rows,
   the reference tables, and the two semantic marks that carry teaching
   weight in shader-authoring (`hazard` = the hand-counted integer, and the
   old/new path contrast). One palette, reused. */
.sig{margin:1.2em 0 .2em;padding-top:.8em;border-top:1px solid var(--rule);}
.k{color:var(--tok-kw);}
.nm{color:var(--tok-fn);font-weight:700;}
.ns{color:var(--faint);}
.eq{color:var(--dim);}
.doc{color:var(--dim);margin:.2em 0 .6em;}
.num,.n{color:var(--tok-num);}
.host,.lab,.lang,.path,.tag,.stage,.sec-num,.lesson-num{
  color:var(--faint);font-size:.85em;letter-spacing:.12em;text-transform:uppercase;
}
.anchor{border:0;color:var(--faint);opacity:0;padding-left:.4em;}
h1:hover .anchor,h2:hover .anchor,h3:hover .anchor{opacity:1;}
.chip{
  display:inline-block;padding:.05em .5em;margin:0 .15em;border:1px solid var(--rule);
  border-radius:2px;color:var(--dim);font-size:.82em;
}
.chip.on{color:var(--fg);border-color:var(--tok-fn);}
.hazard{color:#e0555f;font-weight:700;}
.hl-old{color:var(--tok-builtin);}
.hl-new{color:var(--tok-fn);}
.yes,.good-mark{color:var(--tok-str);}
.callout{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-fn);border-radius:3px;
}
.zn-source{margin:.6em 0 1.4em;}
.lesson{margin:2em 0;}
.lesson-title{font-weight:700;color:#fff;}
.lesson-goal{color:var(--dim);}
/* page furniture: the landing page and the tutorials' own scaffolding */
.blog-container,.wrap,.max{max-width:var(--maxw);margin:0 auto;}
.title{font-size:1.8rem;margin:0 0 .2em;}
.subtitle,.lede,.sub{
  border:0;font-size:1rem;font-weight:400;color:var(--dim);
  margin:0 0 1.6em;line-height:1.6;
}
.eyebrow{color:var(--faint);font-size:.85em;letter-spacing:.14em;text-transform:uppercase;}
.toplinks{
  display:flex;flex-wrap:wrap;gap:.1em 1.1em;margin:0 0 2em;
  padding:.9em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);

}
.toplinks a{border:0;color:var(--dim);}
.toplinks a:hover,.toplinks a.offsite{color:var(--link);}
.wip-warning{

  color:var(--dim);font-size:.9em;
}
.wip-warning strong{display:block;color:var(--tok-builtin);margin-bottom:.2em;}
/* cheatsheet: one declaration per .fn row */
.fn{margin:1.1em 0;}
.what,.body{color:var(--dim);}
.sketch{color:var(--dim);}
.pane{border:1px solid var(--rule);border-radius:3px;margin:1.1em 0;}
.pane-head{
  padding:5px 11px;background:var(--panel-2);border-bottom:1px solid var(--rule);
  color:var(--faint);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
}
.cell{padding:.5em .8em;}
.swatch{display:inline-block;width:.9em;height:.9em;border:1px solid var(--rule);vertical-align:-1px;}
.old,.meh{color:var(--tok-builtin);}
.new,.win{color:var(--tok-str);}

}
/* The examples gallery (index.html): the list of examples on the left, the
   selected one running in a frame that fills the rest. On a phone the list
   is a drawer over the example, under the bar. `list-open` shows the list. */
body.gallery{
  max-width:none;margin:0;padding:0;height:100vh;height:100dvh;overflow:hidden;
  display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);
  color-scheme:dark;
}
body.gallery.list-open{grid-template-columns:minmax(240px,25%) 1fr;}
.gallery a{border:0;}
.g-side{display:none;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--rule);}
.list-open .g-side{display:flex;}
.g-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 1em;padding:.7em 1em .6em;font-size:.85em;}
.g-head a{color:var(--dim);}
.g-head a:hover{color:var(--link);}
.g-head .g-logo{margin-right:auto;font-size:1.1rem;font-weight:700;color:var(--fg);white-space:nowrap;}
.g-filters{display:flex;flex-wrap:wrap;gap:.4em;padding:0 1em;}
.g-filters input,.g-filters select{
  min-width:0;padding:.35em .5em;background:var(--panel);color:var(--fg);

}
.g-filters input{flex:1 1 10em;}
.g-filters select{flex:1 1 auto;}
.g-filters input:focus,.g-filters select:focus{outline:none;border-color:var(--tok-fn);}
.g-count{padding:.45em 1em;color:var(--faint);font-size:.75em;border-bottom:1px solid var(--rule);}
.g-list{flex:1;overflow-y:auto;padding-bottom:3em;font-size:13px;}
.g-group{
  position:sticky;top:0;padding:.8em 1em .3em;background:var(--bg);
  color:var(--faint);font-size:.8em;letter-spacing:.14em;text-transform:uppercase;
}
/* scroll-margin: scrolled into view, a row clears the sticky module heading */
.g-item{
  display:flex;justify-content:space-between;gap:.6em;padding:.15em 1em;
  color:var(--dim);border-left:2px solid transparent;scroll-margin-top:2.4em;
}
.g-item:hover{color:var(--fg);background:var(--panel);}
.g-item.on{color:#fff;background:var(--panel-2);border-left-color:var(--tok-fn);}
.g-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-stars{color:var(--faint);font-size:.8em;white-space:nowrap;}
.g-none{padding:1em;color:var(--faint);}
.g-main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.g-bar{
  flex:none;display:flex;align-items:center;gap:.4em;height:44px;padding:0 .6em;
  border-bottom:1px solid var(--rule);white-space:nowrap;
}
.g-btn{
  flex:none;width:30px;height:30px;padding:0;background:var(--panel);color:var(--dim);
  border:1px solid var(--rule);border-radius:3px;font:inherit;cursor:pointer;
}
.g-btn:hover{color:var(--fg);border-color:var(--tok-fn);}
.g-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding-left:.4em;}
.g-desc{margin-left:.6em;color:var(--dim);font-size:.9em;}
.g-open{flex:none;padding:0 .4em;font-size:.9em;}
.g-stage{flex:1;position:relative;min-height:0;}
.g-stage iframe{position:absolute;inset:0;width:100%;height:100%;max-width:none;border:0;border-radius:0;}
.g-intro{max-width:36em;margin:12vh auto 0;padding:0 1.5em;}
@media(max-width:700px){
  body.gallery.list-open{grid-template-columns:1fr;}
  .g-side{position:fixed;inset:44px 0 0 0;z-index:1;border-right:0;}
  .g-item{padding:.45em 1em;}
  .g-desc{display:none;}
}
/* A tutorial pointer, sitting directly under the heading whose subject it
   covers rather than pooled in a list at the foot of the page. */
.tut{
  margin:.2em 0 1.3em;padding:.55em .9em;background:var(--panel);

}

.tut-index{list-style:none;padding-left:0;}

.tut-index a{border:0;}
/* `.reveal` was animated in by the JS that docfmt replaced; without a rule
   it is simply visible, which is the correct end state. */
@media(max-width:700px){body{font-size:14px;padding:1.4rem .8rem 4rem;}pre{font-size:12px;}}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {

<span class="tok-kw">fn</span> <span class="tok-fn">rngNext</span>(state: *u64) f64 {
    state.* = state.* *% <span class="tok-num">6364136223846793005</span> +% <span class="tok-num">1442695040888963407</span>;
    <span class="tok-kw">const</span> top: u64 = state.* &gt;&gt; <span class="tok-num">40</span>; <span class="tok-comment">// 24 high bits</span>
    <span class="tok-kw">return</span> <span class="tok-fn">float64</span>(top) / <span class="tok-fn">float64</span>(<span class="tok-builtin">@as</span>(u64, <span class="tok-num">1</span>) &lt;&lt; <span class="tok-num">24</span>);
}

<span class="tok-comment">/// Approx N(0,1) via the sum of 12 uniforms (central-limit). Deterministic.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">gauss</span>(state: *u64) f64 {
    <span class="tok-kw">var</span> sum: f64 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (k &lt; <span class="tok-num">12</span>) : (k += <span class="tok-num">1</span>) {
        sum += <span class="tok-fn">rngNext</span>(state);
    }
    <span class="tok-kw">return</span> sum - <span class="tok-num">6.0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .font = font, .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font) };

    <span class="tok-comment">// Checkerboard texture for the Image tab: built once, uploaded to the GPU,</span>
    <span class="tok-comment">// and registered to a draw-list id we keep in State.</span>
    <span class="tok-kw">const</span> checker: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">genImageChecked</span>(
        gpa,
        <span class="tok-num">64</span>,
        <span class="tok-num">64</span>,
        <span class="tok-num">8</span>,
        <span class="tok-num">8</span>,
        .{ .r = <span class="tok-num">60</span>, .g = <span class="tok-num">70</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> },
        .{ .r = <span class="tok-num">230</span>, .g = <span class="tok-num">220</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> },
    );

    z.<span class="tok-fn">unloadImage</span>(gpa, checker);
    s.img_tex = f.gl.<span class="tok-fn">renderer</span>().<span class="tok-fn">registerOwnedTexture</span>(tex);

    <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; n_marker_pts) : (j += <span class="tok-num">1</span>) {
        s.mxs[j] = <span class="tok-fn">float64</span>(j) + <span class="tok-num">1.0</span>;
    }
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; markers.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (k &lt; n_marker_pts) : (k += <span class="tok-num">1</span>) {

    <span class="tok-kw">var</span> b: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (b &lt; n_coarse) : (b += <span class="tok-num">1</span>) {

        s.cys[b] = <span class="tok-num">1.0</span> + <span class="tok-fn">float64</span>((b * <span class="tok-num">7</span> + <span class="tok-num">3</span>) % <span class="tok-num">6</span>) * <span class="tok-num">0.5</span>;
        s.stem_ys[b] = <span class="tok-builtin">@sin</span>(t * <span class="tok-num">0.7</span>) * <span class="tok-num">2.0</span>;
        s.cerr[b] = <span class="tok-num">0.25</span> + <span class="tok-num">0.12</span> * <span class="tok-fn">float64</span>(b % <span class="tok-num">3</span>);
        s.cneg[b] = <span class="tok-num">0.2</span> + <span class="tok-num">0.1</span> * <span class="tok-fn">float64</span>(b % <span class="tok-num">2</span>);
        s.cpos[b] = <span class="tok-num">0.5</span> + <span class="tok-num">0.1</span> * <span class="tok-fn">float64</span>((b + <span class="tok-num">1</span>) % <span class="tok-num">3</span>);
    }

    <span class="tok-kw">var</span> m: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (m &lt; n) : (m += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> t: f64 = <span class="tok-fn">float64</span>(m) / <span class="tok-builtin">@as</span>(f64, n - <span class="tok-num">1</span>) * <span class="tok-num">12.0</span>;
        s.sxs[m] = t;
        s.area[m] = <span class="tok-builtin">@sin</span>(t * <span class="tok-num">0.8</span>) * <span class="tok-num">1.5</span> + <span class="tok-num">2.5</span>;
    }

    s.hxs = .{ <span class="tok-num">0</span>, <span class="tok-builtin">@floatFromInt</span>(hm_cols) };
    s.hys = .{ <span class="tok-num">0</span>, <span class="tok-builtin">@floatFromInt</span>(hm_rows) };

    <span class="tok-comment">// 1D histogram: gaussian samples binned over [-4, 4].</span>
    <span class="tok-kw">var</span> rng: u64 = <span class="tok-num">0x9e3779b97f4a7c15</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..hist_n) |hi| {

    }
    z.plot.<span class="tok-fn">histogramBins</span>(&amp;s.samp, &amp;s.hist_counts, -<span class="tok-num">4.0</span>, <span class="tok-num">4.0</span>);
    <span class="tok-kw">const</span> bf: f64 = <span class="tok-fn">float64</span>(hist_bins);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..hist_bins) |bi| {
        s.hist_centers[bi] = -<span class="tok-num">4.0</span> + <span class="tok-num">8.0</span> * (<span class="tok-fn">float64</span>(bi) + <span class="tok-num">0.5</span>) / bf;
    }

    <span class="tok-comment">// 2D histogram: independent gaussian x/y, binned over [-3,3]^2.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..h2_n) |pi| {
        s.sx[pi] = <span class="tok-fn">gauss</span>(&amp;rng);
        s.sy[pi] = <span class="tok-fn">gauss</span>(&amp;rng);
    }
    z.plot.<span class="tok-fn">histogramBins2D</span>(&amp;s.sx, &amp;s.sy, &amp;s.h2vals, h2_cols, h2_rows, -<span class="tok-num">3.0</span>, <span class="tok-num">3.0</span>, -<span class="tok-num">3.0</span>, <span class="tok-num">3.0</span>);
    s.h2x = .{ -<span class="tok-num">3</span>, <span class="tok-num">3</span> };
    s.h2y = .{ -<span class="tok-num">3</span>, <span class="tok-num">3</span> };
    <span class="tok-kw">var</span> mx: f64 = <span class="tok-num">1</span>;
    <span class="tok-kw">for</span> (s.h2vals) |v| {
        <span class="tok-kw">if</span> (v &gt; mx) {
            mx = v;
        }
    }
    s.h2max = mx;

    <span class="tok-comment">// Bar groups: 3 items x 5 groups (item-major). Track stacked-sum max.</span>
    <span class="tok-kw">const</span> bgv = [_]f64{
        <span class="tok-num">2.0</span>, <span class="tok-num">3.0</span>, <span class="tok-num">1.5</span>, <span class="tok-num">4.0</span>, <span class="tok-num">2.5</span>, <span class="tok-comment">// item 0 across groups</span>
        <span class="tok-num">1.0</span>, <span class="tok-num">2.0</span>, <span class="tok-num">3.0</span>, <span class="tok-num">1.5</span>, <span class="tok-num">2.0</span>, <span class="tok-comment">// item 1</span>
        <span class="tok-num">2.5</span>, <span class="tok-num">1.0</span>, <span class="tok-num">2.0</span>, <span class="tok-num">2.5</span>, <span class="tok-num">3.0</span>, <span class="tok-comment">// item 2</span>
    };
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..bg_items * bg_groups) |k| {
        s.bg_vals[k] = bgv[k];
    }
    <span class="tok-kw">var</span> bgmax: f64 = <span class="tok-num">1</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..bg_groups) |g| {
        <span class="tok-kw">var</span> sum: f64 = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..bg_items) |it| {
            sum += s.bg_vals[it * bg_groups + g];
        }
        <span class="tok-kw">if</span> (sum &gt; bgmax) {
            bgmax = sum;
        }
    }
    s.bg_x = .{ -<span class="tok-num">0.6</span>, <span class="tok-fn">float64</span>(bg_groups) - <span class="tok-num">0.4</span> };
    s.bg_y = .{ <span class="tok-num">0</span>, bgmax * <span class="tok-num">1.05</span> };

    <span class="tok-comment">// Horizontal bars: position 0 has value 0 so the x=0 baseline is in frame.</span>
    <span class="tok-kw">const</span> hbv = [_]f64{ <span class="tok-num">0</span>, <span class="tok-num">2.0</span>, <span class="tok-num">4.0</span>, <span class="tok-num">1.5</span>, <span class="tok-num">5.0</span>, <span class="tok-num">3.0</span> };
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..hb_n) |k| {
        s.hb_pos[k] = <span class="tok-builtin">@floatFromInt</span>(k);
        s.hb_vals[k] = hbv[k];
    }

    <span class="tok-comment">// Time series: a 2-day diurnal "temperature" curve over epoch seconds.</span>
    <span class="tok-kw">const</span> t0: f64 = <span class="tok-num">1704067200</span>; <span class="tok-comment">// 2024-01-01 00:00 UTC</span>
    <span class="tok-kw">const</span> tspan: f64 = <span class="tok-num">2.0</span> * <span class="tok-num">86400.0</span>;
    <span class="tok-kw">var</span> tseed: u64 = <span class="tok-num">99</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |k| {
        <span class="tok-kw">const</span> fr: f64 = <span class="tok-fn">float64</span>(k) / <span class="tok-builtin">@as</span>(f64, n - <span class="tok-num">1</span>);

        <span class="tok-comment">// Two turns across the span, started a quarter turn back so it opens at the trough.</span>
        <span class="tok-kw">const</span> diurnal: f64 = <span class="tok-num">15.0</span> + <span class="tok-num">8.0</span> * <span class="tok-fn">sinTurns</span>(fr * <span class="tok-num">2.0</span> - <span class="tok-num">0.25</span>);

    <span class="tok-comment">// Symlog series: a saturating curve crossing zero, spanning +/-1000.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |k| {
        <span class="tok-kw">const</span> fr: f64 = <span class="tok-fn">float64</span>(k) / <span class="tok-builtin">@as</span>(f64, n - <span class="tok-num">1</span>);
        s.sym_x[k] = fr * <span class="tok-num">10.0</span>;

    }

    <span class="tok-comment">// Axis-config series: x in [0,1] (percent), y a 0..120 swing.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |k| {
        <span class="tok-kw">const</span> fr: f64 = <span class="tok-fn">float64</span>(k) / <span class="tok-builtin">@as</span>(f64, n - <span class="tok-num">1</span>);

    <span class="tok-kw">var</span> bseed: u64 = <span class="tok-num">99</span>;

        s.bub_y[k] = <span class="tok-num">1.0</span> + <span class="tok-fn">rngNext</span>(&amp;bseed) * <span class="tok-num">8.0</span>;
        s.bub_sz[k] = <span class="tok-num">2.0</span> + <span class="tok-fn">rngNext</span>(&amp;bseed) * <span class="tok-num">90.0</span>;
    }

    <span class="tok-kw">var</span> cseed: u64 = <span class="tok-num">1234</span>;
    <span class="tok-kw">var</span> price: f64 = <span class="tok-num">100</span>;

        <span class="tok-kw">const</span> o: f64 = price;
        <span class="tok-kw">const</span> c: f64 = o + (<span class="tok-fn">rngNext</span>(&amp;cseed) - <span class="tok-num">0.5</span>) * <span class="tok-num">9.0</span>;
        <span class="tok-kw">const</span> wig: f64 = <span class="tok-fn">rngNext</span>(&amp;cseed) * <span class="tok-num">4.0</span>;
        s.c_o[k] = o;
        s.c_c[k] = c;
        s.c_h[k] = <span class="tok-builtin">@max</span>(o, c) + wig;
        s.c_l[k] = <span class="tok-builtin">@min</span>(o, c) - wig;

    <span class="tok-kw">var</span> dseed: u64 = <span class="tok-num">555</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">64</span>) |k| {
        s.dig_x[k] = <span class="tok-builtin">@floatFromInt</span>(k);
        s.dig_y[k] = <span class="tok-kw">if</span> (<span class="tok-fn">rngNext</span>(&amp;dseed) &gt; <span class="tok-num">0.5</span>) <span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-num">0</span>;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">regen</span>(s: *State) void {
    <span class="tok-kw">const</span> phase: f64 = <span class="tok-kw">if</span> (s.animate) <span class="tok-fn">float64</span>(s.frame_count) * <span class="tok-num">0.03</span> <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; n) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> t: f64 = <span class="tok-fn">float64</span>(i) / <span class="tok-builtin">@as</span>(f64, n - <span class="tok-num">1</span>) * <span class="tok-num">10.0</span>;
        s.xs[i] = t;
        s.sine[i] = <span class="tok-builtin">@sin</span>(t + phase);
        s.cosw[i] = <span class="tok-builtin">@cos</span>(t * <span class="tok-num">0.7</span> + phase) * <span class="tok-num">0.8</span>;
        <span class="tok-kw">const</span> env: f64 = <span class="tok-num">0.35</span> + <span class="tok-num">0.25</span> * <span class="tok-builtin">@sin</span>(t * <span class="tok-num">0.5</span>);
        s.band_hi[i] = s.sine[i] + env;
        s.band_lo[i] = s.sine[i] - env;
        s.d1[i] = <span class="tok-num">50.0</span> + <span class="tok-num">40.0</span> * <span class="tok-builtin">@sin</span>(t + phase);
        s.d2[i] = <span class="tok-num">0.5</span> + <span class="tok-num">0.45</span> * <span class="tok-builtin">@cos</span>(t * <span class="tok-num">0.7</span> + phase);
    }
    <span class="tok-kw">var</span> r: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (r &lt; hm_rows) : (r += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> c: usize = <span class="tok-num">0</span>;

        <span class="tok-kw">const</span> cols: usize = <span class="tok-num">4</span>;

        <span class="tok-kw">const</span> cw: f32 = avail / <span class="tok-fn">float</span>(cols) - <span class="tok-num">6</span>;
