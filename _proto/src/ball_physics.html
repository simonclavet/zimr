<body class="src-page">
<h1>ball_physics</h1>
<figure class="code src-file" data-path="examples/ball_physics/ball_physics.zig" data-lines="312"><figcaption><span>examples/ball_physics/ball_physics.zig</span><span>312 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ball_physics.zig - toss bouncy balls around in a box.</span>
<span class="tok-comment">// Up to 5000 balls.  Each ball has position, velocity, radius,</span>
<span class="tok-comment">// friction, elasticity.  Walls reflect with the elasticity factor;</span>
<span class="tok-comment">// every frame the velocity is scaled by friction and gravity adds</span>
<span class="tok-comment">// to the Y component.</span>
<span class="tok-comment">// You can grab a ball with LMB on bare canvas (top-most-first hit</span>
<span class="tok-comment">// test) and drag it; releasing imparts the apparent drag velocity</span>
<span class="tok-comment">// to the ball.  RMB on bare canvas spawns a new ball at the cursor</span>
<span class="tok-comment">// with random size, colour, and starting speed.</span>
<span class="tok-comment">// The "Physics" panel exposes gravity, friction, elasticity,</span>
<span class="tok-comment">// spawn-burst count, and a "Shake" button.  Spawning the random</span>
<span class="tok-comment">// burst is more useful than the old hold-CTRL-RMB stream - one</span>
<span class="tok-comment">// click plops down N balls at the mouse.</span>
<span class="tok-comment">// We skip raylib's window-shake behaviour (`GetWindowPosition()`</span>
<span class="tok-comment">// is a desktop-only API).  Shake-via-button works the same way.</span>
<span class="tok-comment">// Ball-ball collisions are intentionally not handled - the</span>
<span class="tok-comment">// raylib original doesn't have them either, and the soft pile-up</span>
<span class="tok-comment">// at the bottom of the box is visually correct without them.</span>
<span class="tok-comment">// Ported from raylib's `shapes_ball_physics.c`.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> ArrayList = std.ArrayList;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> c = Color;

<span class="tok-kw">const</span> screen_w: i32 = <span class="tok-num">800</span>;
<span class="tok-kw">const</span> screen_h: i32 = <span class="tok-num">450</span>;
<span class="tok-kw">const</span> max_balls: usize = <span class="tok-num">5000</span>;

<span class="tok-kw">const</span> Ball = <span class="tok-kw">struct</span> {
    position: Vec2,
    speed: Vec2,
    prev_position: Vec2,
    radius: f32,
    color: Color,
    grabbed: bool,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    scratch: std.heap.ArenaAllocator,
    rng: std.Random.DefaultPrng,
    gpa: Allocator,
    ui_host: z.UiHost,
    font: z.Font,

    balls: <span class="tok-fn">ArrayList</span>(Ball) = .empty,
    <span class="tok-comment">/// Index of the grabbed ball (or null).  Stored as an index</span>
    <span class="tok-comment">/// not a pointer so that pushing new balls into the list</span>
    <span class="tok-comment">/// (which might reallocate in principle) doesn't invalidate</span>
    <span class="tok-comment">/// the reference.  In practice the list's capacity is reserved</span>
    <span class="tok-comment">/// to `max_balls` at init so growth never happens - but indexing</span>
    <span class="tok-comment">/// stays index-based to keep the spawn path obviously correct.</span>
    grabbed: ?usize = null,
    press_offset: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },

    <span class="tok-comment">// ---- UI-bound parameters -----------------------------------------------</span>
    gravity: f32 = <span class="tok-num">100</span>,
    <span class="tok-comment">/// Per-step velocity damping.  1.0 = lossless; default 0.99</span>
    <span class="tok-comment">/// matches raylib.  Applied to every ball every frame, so this</span>
    <span class="tok-comment">/// is global rather than per-ball.</span>
    friction: f32 = <span class="tok-num">0.99</span>,
    <span class="tok-comment">/// Wall-bounce coefficient.  1.0 = perfect rebound.</span>
    elasticity: f32 = <span class="tok-num">0.9</span>,
    <span class="tok-comment">/// Number of balls to spawn when the "Burst" button fires.</span>
    burst_count: i32 = <span class="tok-num">20</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.balls.<span class="tok-fn">deinit</span>(gpa);
    s.scratch.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(
    gpa: Allocator,
    f: *z.Frame,
    s: *State,
) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">28</span>);
    s.* = .{
        .scratch = std.heap.ArenaAllocator.<span class="tok-fn">init</span>(gpa),
        .rng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0xBA11_C0DE</span>),
        .gpa = gpa,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .font = font,
    };
    <span class="tok-comment">// Reserve full capacity up front so the per-frame spawn path</span>
    <span class="tok-comment">// never reallocates - a 5000-element realloc in the middle of a</span>
    <span class="tok-comment">// burst would chunk the framerate.</span>
    <span class="tok-kw">try</span> s.balls.<span class="tok-fn">ensureTotalCapacity</span>(gpa, max_balls);
    <span class="tok-comment">// Seed with one big blue ball at center, matches the raylib</span>
    <span class="tok-comment">// original - gives the user something to grab at startup.</span>
    <span class="tok-kw">try</span> s.balls.<span class="tok-fn">append</span>(gpa, .{
        .position = .{ <span class="tok-builtin">@as</span>(f32, screen_w) / <span class="tok-num">2.0</span>, <span class="tok-builtin">@as</span>(f32, screen_h) / <span class="tok-num">2.0</span> },
        .speed = .{ <span class="tok-num">200</span>, <span class="tok-num">200</span> },
        .prev_position = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .radius = <span class="tok-num">40</span>,
        .color = c.blue,
        .grabbed = false,
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">randomSpeed</span>(rand: std.Random) f32 {
    <span class="tok-kw">return</span> <span class="tok-builtin">@floatFromInt</span>(rand.<span class="tok-fn">intRangeAtMost</span>(i32, -<span class="tok-num">300</span>, <span class="tok-num">300</span>));
}

<span class="tok-kw">fn</span> <span class="tok-fn">randomU8</span>(rand: std.Random) u8 {
    <span class="tok-kw">return</span> rand.<span class="tok-fn">intRangeAtMost</span>(u8, <span class="tok-num">0</span>, <span class="tok-num">255</span>);
}

<span class="tok-kw">fn</span> <span class="tok-fn">spawnBallAt</span>(state: *State, at: Vec2) void {
    <span class="tok-kw">if</span> (state.balls.items.len &gt;= max_balls) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> rand: std.Random = state.rng.<span class="tok-fn">random</span>();
    <span class="tok-comment">// `ensureTotalCapacity(max_balls)` already ran in initState, so</span>
    <span class="tok-comment">// appendAssumeCapacity is correct here - we just checked the cap</span>
    <span class="tok-comment">// above, and the reserved capacity never shrinks.</span>
    state.balls.<span class="tok-fn">appendAssumeCapacity</span>(.{
        .position = at,
        .speed = .{ <span class="tok-fn">randomSpeed</span>(rand), <span class="tok-fn">randomSpeed</span>(rand) },
        .prev_position = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        .radius = <span class="tok-num">20.0</span> + <span class="tok-fn">float</span>(rand.<span class="tok-fn">intRangeAtMost</span>(i32, <span class="tok-num">0</span>, <span class="tok-num">30</span>)),
        .color = .{ .r = <span class="tok-fn">randomU8</span>(rand), .g = <span class="tok-fn">randomU8</span>(rand), .b = <span class="tok-fn">randomU8</span>(rand), .a = <span class="tok-num">255</span> },
        .grabbed = false,
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">shakeAll</span>(state: *State) void {
    <span class="tok-kw">const</span> rand: std.Random = state.rng.<span class="tok-fn">random</span>();
    <span class="tok-kw">for</span> (state.balls.items) |*b| {
        <span class="tok-kw">if</span> (b.grabbed) {
            <span class="tok-kw">continue</span>;
        }
        b.speed = .{
            <span class="tok-fn">float</span>(rand.<span class="tok-fn">intRangeAtMost</span>(i32, -<span class="tok-num">2000</span>, <span class="tok-num">2000</span>)),
            <span class="tok-fn">float</span>(rand.<span class="tok-fn">intRangeAtMost</span>(i32, -<span class="tok-num">2000</span>, <span class="tok-num">2000</span>)),
        };
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawUiPanel</span>(f: *z.Frame, s: *State) bool {
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Physics"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"LMB grab / throw, RMB spawn"</span>, .{});
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"Gravity"</span>, &amp;s.gravity, .{ .min = -<span class="tok-num">500</span>, .max = <span class="tok-num">1500</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"Friction"</span>, &amp;s.friction, .{ .min = <span class="tok-num">0.80</span>, .max = <span class="tok-num">1.0</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"Elasticity"</span>, &amp;s.elasticity, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">1.0</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });

        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"Burst count"</span>, &amp;s.burst_count, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">200</span>, .fmt = <span class="tok-str">"{d}"</span> });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Burst at cursor"</span>, .{})) {
            <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
            <span class="tok-kw">var</span> i: i32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (i &lt; s.burst_count) : (i += <span class="tok-num">1</span>) {
                <span class="tok-fn">spawnBallAt</span>(s, .{ mp[<span class="tok-num">0</span>], mp[<span class="tok-num">1</span>] });
            }
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Shake"</span>, .{})) {
            <span class="tok-fn">shakeAll</span>(s);
        }

        u.<span class="tok-fn">separator</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Balls: {d} / {d}"</span>, .{ s.balls.items.len, max_balls });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Clear"</span>, .{})) {
            s.balls.<span class="tok-fn">clearRetainingCapacity</span>();
            s.grabbed = null;
        }
    }

    <span class="tok-kw">return</span> u.<span class="tok-fn">wantCaptureMouse</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    _ = state.scratch.<span class="tok-fn">reset</span>(.retain_capacity);

    <span class="tok-kw">const</span> ui_capture_mouse: bool = <span class="tok-fn">drawUiPanel</span>(f, state);

    <span class="tok-kw">const</span> dt: f32 = f.time.delta_time;
    <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> mouse: Vec2 = .{ mp[<span class="tok-num">0</span>], mp[<span class="tok-num">1</span>] };
    <span class="tok-comment">// Live canvas dims for the physics box.  Under `.responsive`</span>
    <span class="tok-comment">// mode (set in `main`) these track CSS-pixel resizes every</span>
    <span class="tok-comment">// frame - the simulation box is exactly the window, no aspect-</span>
    <span class="tok-comment">// ratio enforcement.  UI is absolute-pixel under `.responsive`</span>
    <span class="tok-comment">// so the Physics panel keeps its physical size.  The</span>
    <span class="tok-comment">// `screen_w` / `screen_h` consts at the top of this file are</span>
    <span class="tok-comment">// only the initial-size hint passed to the window config.</span>
    <span class="tok-kw">const</span> box_w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> box_h: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-comment">// ---- Grab ---------------------------------------------------------------</span>
    <span class="tok-comment">// Iterate top-most-spawned to bottom so the youngest ball</span>
    <span class="tok-comment">// wins overlapping hits - same visual layering as the</span>
    <span class="tok-comment">// rendering order.  Skip canvas mouse input when the UI is</span>
    <span class="tok-comment">// hovered so panel clicks don't grab balls.</span>
    <span class="tok-kw">if</span> (!ui_capture_mouse <span class="tok-kw">and</span> z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        <span class="tok-kw">const</span> items: []Ball = state.balls.items;
        <span class="tok-kw">var</span> i: usize = items.len;
        <span class="tok-kw">while</span> (i &gt; <span class="tok-num">0</span>) {
            i -= <span class="tok-num">1</span>;
            <span class="tok-kw">const</span> b: *Ball = &amp;items[i];
            <span class="tok-kw">const</span> dx: f32 = mouse[<span class="tok-num">0</span>] - b.position[<span class="tok-num">0</span>];
            <span class="tok-kw">const</span> dy: f32 = mouse[<span class="tok-num">1</span>] - b.position[<span class="tok-num">1</span>];
            <span class="tok-kw">if</span> (<span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy) &lt;= b.radius) {
                state.press_offset = .{ dx, dy };
                state.grabbed = i;
                b.grabbed = true;
                <span class="tok-kw">break</span>;
            }
        }
    }

    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonReleased</span>(f.input, .left)) {
        <span class="tok-kw">if</span> (state.grabbed) |idx| {
            state.balls.items[idx].grabbed = false;
            state.grabbed = null;
        }
    }

    <span class="tok-comment">// ---- Spawn (RMB single shot) -------------------------------------------</span>
    <span class="tok-kw">if</span> (!ui_capture_mouse <span class="tok-kw">and</span> z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .right)) {
        <span class="tok-fn">spawnBallAt</span>(state, mouse);
    }

    <span class="tok-comment">// ---- Step balls --------------------------------------------------------</span>
    <span class="tok-kw">for</span> (state.balls.items) |*b| {
        <span class="tok-kw">if</span> (!b.grabbed) {
            b.position[<span class="tok-num">0</span>] += b.speed[<span class="tok-num">0</span>] * dt;
            b.position[<span class="tok-num">1</span>] += b.speed[<span class="tok-num">1</span>] * dt;

            <span class="tok-comment">// Walls: reposition to the edge and reflect velocity</span>
            <span class="tok-comment">// with the elasticity factor.  Without the</span>
            <span class="tok-comment">// reposition, fast-moving balls would tunnel through.</span>
            <span class="tok-kw">if</span> (b.position[<span class="tok-num">0</span>] + b.radius &gt;= box_w) {
                b.position[<span class="tok-num">0</span>] = box_w - b.radius;
                b.speed[<span class="tok-num">0</span>] = -b.speed[<span class="tok-num">0</span>] * state.elasticity;
            } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (b.position[<span class="tok-num">0</span>] - b.radius &lt;= <span class="tok-num">0</span>) {
                b.position[<span class="tok-num">0</span>] = b.radius;
                b.speed[<span class="tok-num">0</span>] = -b.speed[<span class="tok-num">0</span>] * state.elasticity;
            }
            <span class="tok-kw">if</span> (b.position[<span class="tok-num">1</span>] + b.radius &gt;= box_h) {
                b.position[<span class="tok-num">1</span>] = box_h - b.radius;
                b.speed[<span class="tok-num">1</span>] = -b.speed[<span class="tok-num">1</span>] * state.elasticity;
            } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (b.position[<span class="tok-num">1</span>] - b.radius &lt;= <span class="tok-num">0</span>) {
                b.position[<span class="tok-num">1</span>] = b.radius;
                b.speed[<span class="tok-num">1</span>] = -b.speed[<span class="tok-num">1</span>] * state.elasticity;
            }

            b.speed[<span class="tok-num">0</span>] *= state.friction;
            b.speed[<span class="tok-num">1</span>] = b.speed[<span class="tok-num">1</span>] * state.friction + state.gravity;
        } <span class="tok-kw">else</span> {
            <span class="tok-comment">// Grabbed ball tracks the cursor with the offset</span>
            <span class="tok-comment">// captured at grab time.  Derive a "throw" velocity</span>
            <span class="tok-comment">// from the per-frame position delta so releasing the</span>
            <span class="tok-comment">// ball mid-swing imparts realistic momentum.</span>
            b.position[<span class="tok-num">0</span>] = mouse[<span class="tok-num">0</span>] - state.press_offset[<span class="tok-num">0</span>];
            b.position[<span class="tok-num">1</span>] = mouse[<span class="tok-num">1</span>] - state.press_offset[<span class="tok-num">1</span>];
            <span class="tok-kw">if</span> (dt &gt; <span class="tok-num">0</span>) {
                b.speed[<span class="tok-num">0</span>] = (b.position[<span class="tok-num">0</span>] - b.prev_position[<span class="tok-num">0</span>]) / dt;
                b.speed[<span class="tok-num">1</span>] = (b.position[<span class="tok-num">1</span>] - b.prev_position[<span class="tok-num">1</span>]) / dt;
            }
            b.prev_position = b.position;
        }
    }

    <span class="tok-comment">// ---- Render ------------------------------------------------------------</span>

    z.<span class="tok-fn">clearViewport</span>(f, c.raywhite);

    <span class="tok-kw">for</span> (state.balls.items) |b| {
        f.gl.<span class="tok-fn">circle</span>(b.position, b.radius, .{ .color = b.color, .segments = <span class="tok-num">16</span> });
        f.gl.<span class="tok-fn">circle</span>(b.position, b.radius, .{ .color = c.black, .outline = <span class="tok-num">1</span> });
    }

    state.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// User-owned framework integration point.  See `examples/basic.zig`</span>
<span class="tok-comment">/// for the canonical comment block; this declaration is the</span>
<span class="tok-comment">/// AppBridge pattern's required convention.</span>
<span class="tok-comment">/// Descriptor-only: the runner (standalone) or a launcher drives this.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - ball physics"</span>,
            .width = screen_w,
            .height = screen_h,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
