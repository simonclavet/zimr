<h1>ui_mouse_drag</h1>
<figure class="code src-file" data-path="examples/ui_mouse_drag/ui_mouse_drag.zig" data-lines="216"><figcaption><span>examples/ui_mouse_drag/ui_mouse_drag.zig</span><span>216 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/ui_mouse_drag.zig - B1 capstone.</span>
<span class="tok-comment">// Demonstrates the new mouse cursor + drag helpers added in</span>
<span class="tok-comment">// `imgui-parity` Phase B1:</span>
<span class="tok-comment">//   - `u.setMouseCursor(cursor)` - change the CSS cursor when</span>
<span class="tok-comment">//     hovering specific widgets.</span>
<span class="tok-comment">//   - `u.isMouseDragging(.left, -1)` - distinguish click from</span>
<span class="tok-comment">//     drag with imgui's default 6 px threshold.</span>
<span class="tok-comment">//   - `u.getMouseDragDelta(.left, -1)` + `resetMouseDragDelta`</span>
<span class="tok-comment">//     consume per-frame delta to move a widget around.</span>
<span class="tok-comment">//   - `u.isMouseHoveringRect(x0, y0, x1, y1)` - hit-test</span>
<span class="tok-comment">//     arbitrary rectangles outside the standard widget pipeline.</span>
<span class="tok-comment">// Layout:</span>
<span class="tok-comment">//   - Top row: six colored zones labeled with cursor names.  Hover</span>
<span class="tok-comment">//     each to see the canvas cursor change.</span>
<span class="tok-comment">//   - Middle: a square that follows your mouse while you drag it.</span>
<span class="tok-comment">//     Drag from elsewhere does nothing - the threshold + hover</span>
<span class="tok-comment">//     check gate engagement.</span>
<span class="tok-comment">//   - Bottom: live readout of mouse pos, button state, drag state.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> ui = z.ui_real;

<span class="tok-kw">const</span> Color = zm.Color;

<span class="tok-kw">const</span> CursorZone = <span class="tok-kw">struct</span> {
    label: []<span class="tok-kw">const</span> u8,
    cursor: ui.MouseCursor,
    color: Color,
};

<span class="tok-kw">const</span> cursor_zones = [_]CursorZone{
    .{ .label = <span class="tok-str">"default"</span>, .cursor = .default, .color = .{ .r = <span class="tok-num">71</span>, .g = <span class="tok-num">85</span>, .b = <span class="tok-num">105</span>, .a = <span class="tok-num">255</span> } },
    .{ .label = <span class="tok-str">"pointing_hand"</span>, .cursor = .pointing_hand, .color = .{ .r = <span class="tok-num">14</span>, .g = <span class="tok-num">165</span>, .b = <span class="tok-num">233</span>, .a = <span class="tok-num">255</span> } },
    .{ .label = <span class="tok-str">"ibeam"</span>, .cursor = .ibeam, .color = .{ .r = <span class="tok-num">168</span>, .g = <span class="tok-num">85</span>, .b = <span class="tok-num">247</span>, .a = <span class="tok-num">255</span> } },
    .{ .label = <span class="tok-str">"crosshair"</span>, .cursor = .crosshair, .color = .{ .r = <span class="tok-num">244</span>, .g = <span class="tok-num">114</span>, .b = <span class="tok-num">182</span>, .a = <span class="tok-num">255</span> } },
    .{ .label = <span class="tok-str">"resize_ew"</span>, .cursor = .resize_ew, .color = .{ .r = <span class="tok-num">251</span>, .g = <span class="tok-num">146</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> } },
    .{ .label = <span class="tok-str">"resize_ns"</span>, .cursor = .resize_ns, .color = .{ .r = <span class="tok-num">132</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">22</span>, .a = <span class="tok-num">255</span> } },
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    <span class="tok-comment">// Position of the draggable square.  Stays put except while the</span>
    <span class="tok-comment">// user is dragging it; the runtime never touches it.</span>
    draggable_pos: Vec2 = .{ <span class="tok-num">80</span>, <span class="tok-num">220</span> },
    <span class="tok-comment">// While true, this frame's mouse-drag delta is being consumed by</span>
    <span class="tok-comment">// the draggable.  Latched on mouse-down inside the rect, cleared</span>
    <span class="tok-comment">// on mouse-up.  Without this gate, releasing-and-reclicking</span>
    <span class="tok-comment">// anywhere on the canvas would teleport the square.</span>
    dragging_square: bool = false,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .font = font,
    };
}

<span class="tok-comment">/// Brighten a color by `amount` (0-255), clamping each channel at 255.</span>
<span class="tok-comment">/// Used for hover-highlight feedback.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">brightenColor</span>(c: Color, amount: u8) Color {
    <span class="tok-kw">return</span> .{
        .r = <span class="tok-kw">if</span> (<span class="tok-builtin">@as</span>(u16, c.r) + amount &gt; <span class="tok-num">255</span>) <span class="tok-num">255</span> <span class="tok-kw">else</span> c.r + amount,
        .g = <span class="tok-kw">if</span> (<span class="tok-builtin">@as</span>(u16, c.g) + amount &gt; <span class="tok-num">255</span>) <span class="tok-num">255</span> <span class="tok-kw">else</span> c.g + amount,
        .b = <span class="tok-kw">if</span> (<span class="tok-builtin">@as</span>(u16, c.b) + amount &gt; <span class="tok-num">255</span>) <span class="tok-num">255</span> <span class="tok-kw">else</span> c.b + amount,
        .a = c.a,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">15</span>, .g = <span class="tok-num">23</span>, .b = <span class="tok-num">42</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-kw">const</span> sw: i32 = <span class="tok-builtin">@intCast</span>(f.window.screen_width);
    <span class="tok-kw">const</span> sh: f32 = <span class="tok-fn">float</span>(f.window.screen_height);

    <span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">241</span>, .g = <span class="tok-num">245</span>, .b = <span class="tok-num">249</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-kw">const</span> dim: Color = .{ .r = <span class="tok-num">148</span>, .g = <span class="tok-num">163</span>, .b = <span class="tok-num">184</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-kw">const</span> accent: Color = .{ .r = <span class="tok-num">245</span>, .g = <span class="tok-num">158</span>, .b = <span class="tok-num">11</span>, .a = <span class="tok-num">255</span> };

    <span class="tok-comment">// Header.</span>
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">24</span>, <span class="tok-num">22</span> }, <span class="tok-str">"mouse cursor + drag helpers"</span>, .{ .size = <span class="tok-num">20</span>, .color = white, .font = &amp;s.font });
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">24</span>, <span class="tok-num">54</span> },
        <span class="tok-str">"hover the zones to change cursor; drag the orange square to move it."</span>,
        .{ .size = <span class="tok-num">12</span>, .color = dim, .font = &amp;s.font },
    );

    <span class="tok-comment">// Top row: cursor zones.  Hover-test each rect; the FIRST hit</span>
    <span class="tok-comment">// wins (in case zones overlap - they don't here but the pattern</span>
    <span class="tok-comment">// is correct).  Set cursor to .default when nothing claims it.</span>
    <span class="tok-kw">const</span> zone_y: f32 = <span class="tok-num">90</span>;
    <span class="tok-kw">const</span> zone_h: f32 = <span class="tok-num">80</span>;
    <span class="tok-kw">const</span> zone_count: i32 = <span class="tok-builtin">@intCast</span>(cursor_zones.len);
    <span class="tok-kw">const</span> total_pad: i32 = <span class="tok-num">48</span> + <span class="tok-num">8</span> * (zone_count - <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> zone_w: i32 = <span class="tok-builtin">@divFloor</span>(sw - total_pad, zone_count);
    <span class="tok-kw">var</span> cursor_for_this_frame: z.MouseCursor = .default;

    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; cursor_zones.len) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> zone: CursorZone = cursor_zones[i];
        <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">float</span>(<span class="tok-num">24</span> + <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(i)) * (zone_w + <span class="tok-num">8</span>));
        <span class="tok-kw">const</span> w: f32 = <span class="tok-fn">float</span>(zone_w);
        <span class="tok-kw">const</span> rect: z.Rectangle = .{ .x = x, .y = zone_y, .width = w, .height = zone_h };

        <span class="tok-kw">const</span> hovered: bool = u.<span class="tok-fn">isMouseHoveringRect</span>(rect.x, rect.y, rect.x + rect.width, rect.y + rect.height);
        <span class="tok-kw">const</span> fill: Color = <span class="tok-kw">if</span> (hovered) <span class="tok-fn">brightenColor</span>(zone.color, <span class="tok-num">30</span>) <span class="tok-kw">else</span> zone.color;
        f.gl.<span class="tok-fn">rect</span>(rect, .{ .color = fill });

        <span class="tok-kw">if</span> (hovered) {
            cursor_for_this_frame = zone.cursor;
        }

        <span class="tok-comment">// Centred label.  Atkinson at 12 px ~ 7 px advance per char;</span>
        <span class="tok-comment">// crude but adequate for this demo.</span>
        <span class="tok-kw">const</span> label_w: i32 = <span class="tok-builtin">@intCast</span>(zone.label.len * <span class="tok-num">7</span>);
        <span class="tok-kw">const</span> lx: f32 = x + <span class="tok-fn">float</span>(<span class="tok-builtin">@divFloor</span>(zone_w - label_w, <span class="tok-num">2</span>));
        <span class="tok-kw">const</span> ly: f32 = zone_y + <span class="tok-num">32</span>;
        f.gl.<span class="tok-fn">text</span>(.{ lx, ly }, zone.label, .{ .size = <span class="tok-num">12</span>, .color = white, .font = &amp;s.font });
    }

    <span class="tok-comment">// Middle: draggable square.  Hit-test with isMouseHoveringRect;</span>
    <span class="tok-comment">// latch the dragging state on left-press inside the rect, clear</span>
    <span class="tok-comment">// it on left-release.  Consume the per-frame delta and reset</span>
    <span class="tok-comment">// the anchor so subsequent deltas are incremental.</span>
    <span class="tok-kw">const</span> square_size: f32 = <span class="tok-num">64</span>;
    <span class="tok-kw">const</span> sx: f32 = s.draggable_pos[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> sy: f32 = s.draggable_pos[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> square_rect: z.Rectangle = .{ .x = sx, .y = sy, .width = square_size, .height = square_size };
    <span class="tok-kw">const</span> square_hovered: bool = u.<span class="tok-fn">isMouseHoveringRect</span>(sx, sy, sx + square_size, sy + square_size);

    <span class="tok-kw">if</span> (square_hovered <span class="tok-kw">and</span> !s.dragging_square) {
        cursor_for_this_frame = .resize_all;
    }

    <span class="tok-kw">if</span> (f.input.mouse.current_button[<span class="tok-num">0</span>] != <span class="tok-num">0</span> <span class="tok-kw">and</span> square_hovered <span class="tok-kw">and</span> !s.dragging_square) {
        <span class="tok-comment">// Rising edge of a left-press inside the square - capture it.</span>
        s.dragging_square = true;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (f.input.mouse.current_button[<span class="tok-num">0</span>] == <span class="tok-num">0</span>) {
        <span class="tok-comment">// Released - drop the latch.</span>
        s.dragging_square = false;
    }

    <span class="tok-kw">if</span> (s.dragging_square) {
        cursor_for_this_frame = .resize_all;
        <span class="tok-kw">const</span> d: Vec2 = u.<span class="tok-fn">getMouseDragDelta</span>(.left, -<span class="tok-num">1</span>);
        <span class="tok-kw">if</span> (d[<span class="tok-num">0</span>] != <span class="tok-num">0</span> <span class="tok-kw">or</span> d[<span class="tok-num">1</span>] != <span class="tok-num">0</span>) {
            s.draggable_pos[<span class="tok-num">0</span>] += d[<span class="tok-num">0</span>];
            s.draggable_pos[<span class="tok-num">1</span>] += d[<span class="tok-num">1</span>];
            u.<span class="tok-fn">resetMouseDragDelta</span>(.left);
        }
    }

    f.gl.<span class="tok-fn">rect</span>(square_rect, .{ .color = accent });
    f.gl.<span class="tok-fn">text</span>(.{ sx + <span class="tok-num">8</span>, sy + <span class="tok-num">26</span> }, <span class="tok-str">"drag me"</span>, .{ .size = <span class="tok-num">12</span>, .color = white, .font = &amp;s.font });

    <span class="tok-comment">// Apply the chosen cursor exactly once at the end of the frame.</span>
    <span class="tok-comment">// Doing it here (rather than inside each hover branch) means</span>
    <span class="tok-comment">// the LAST claimant wins, which works because we walk zones</span>
    <span class="tok-comment">// -&gt; square in source-order top-to-bottom - the visual stacking</span>
    <span class="tok-comment">// order users expect.</span>
    u.<span class="tok-fn">setMouseCursor</span>(cursor_for_this_frame);

    <span class="tok-comment">// Bottom: live readout.</span>
    <span class="tok-kw">var</span> buf: [<span class="tok-num">128</span>]u8 = undefined;
    <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> lmb: bool = f.input.mouse.current_button[<span class="tok-num">0</span>] != <span class="tok-num">0</span>;
    <span class="tok-kw">const</span> dragging: bool = u.<span class="tok-fn">isMouseDragging</span>(.left, -<span class="tok-num">1</span>);
    <span class="tok-kw">const</span> d: Vec2 = u.<span class="tok-fn">getMouseDragDelta</span>(.left, -<span class="tok-num">1</span>);

    <span class="tok-kw">const</span> line1: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"mouse: ({d:.0}, {d:.0})  left: {s}  dragging: {s}"</span>, .{
        mp[<span class="tok-num">0</span>],
        mp[<span class="tok-num">1</span>],
        <span class="tok-kw">if</span> (lmb) <span class="tok-str">"DOWN"</span> <span class="tok-kw">else</span> <span class="tok-str">"up"</span>,
        <span class="tok-kw">if</span> (dragging) <span class="tok-str">"YES"</span> <span class="tok-kw">else</span> <span class="tok-str">"no"</span>,
    }) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">24</span>, sh - <span class="tok-num">56</span> }, line1, .{ .size = <span class="tok-num">12</span>, .color = dim, .font = &amp;s.font });

    <span class="tok-kw">var</span> buf2: [<span class="tok-num">128</span>]u8 = undefined;
    <span class="tok-kw">const</span> line2: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf2, <span class="tok-str">"drag delta: ({d:.1}, {d:.1})  square: ({d:.0}, {d:.0})"</span>, .{
        d[<span class="tok-num">0</span>],
        d[<span class="tok-num">1</span>],
        s.draggable_pos[<span class="tok-num">0</span>],
        s.draggable_pos[<span class="tok-num">1</span>],
    }) <span class="tok-kw">catch</span> <span class="tok-str">"?"</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">24</span>, sh - <span class="tok-num">36</span> }, line2, .{ .size = <span class="tok-num">12</span>, .color = dim, .font = &amp;s.font });
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - ui mouse drag (B1 capstone)"</span>,
            .width = <span class="tok-num">720</span>,
            .height = <span class="tok-num">480</span>,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
};
