<h1>fluid_sort</h1>
<figure class="code src-file" data-path="examples/fluid_sort/fluid_sort.zig" data-lines="945"><figcaption><span>examples/fluid_sort/fluid_sort.zig</span><span>945 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! fluid_sort - 20,000-particle Clavet fluid on the GPU, neighbour grid</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The arc closes: examples/sph_fluid_2d ported the algorithm to a CPU</span>
<span class="tok-comment">//! loop because the GL backend had no compute. This is the same paper running</span>
<span class="tok-comment">//! where it belongs - eleven kompute kernels (sort_kernels.zig), each</span>
<span class="tok-comment">//! translated once to its own WGSL module (spv2wgsl --entry, the multi-kernel</span>
<span class="tok-comment">//! path), dispatched through ONE `z.Compute` pipe, rendered zero-copy by</span>
<span class="tok-comment">//! `z.FluidDiscs` straight from the compute storage buffer.</span>
<span class="tok-comment">//! Positions never visit the CPU.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Per substep: gravityMouse -&gt; viscosity -&gt; predict -&gt; [counting sort:</span>
<span class="tok-comment">//! clearGrid -&gt; countGrid -&gt; prefixSum -&gt; scatter -&gt; copyback] -&gt; density -&gt; force</span>
<span class="tok-comment">//! -&gt; applyAndFinalize, then one instanced draw of N SDF discs coloured by</span>
<span class="tok-comment">//! density. The sort reorders pos/vel/prev into cell order so the neighbour</span>
<span class="tok-comment">//! passes read contiguous (coalesced) memory - ~3x the per-particle grid.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Controls: drag = push, shift+drag (or the attract toggle) = pull; sliders</span>
<span class="tok-comment">//! for the paper's four knobs; reset = re-spawn the centre disk.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float64 = zm.float64;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> length = zm.length;
<span class="tok-kw">const</span> splat2 = zm.splat2;
<span class="tok-kw">const</span> fk = <span class="tok-builtin">@import</span>(<span class="tok-str">"sort_kernels.zig"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">/// The per-kernel WGSL table, built straight from the kernel manifest</span>
<span class="tok-comment">/// (`fk.kernels`) - one `@embedFile` per entry, no hand-kept list to drift out</span>
<span class="tok-comment">/// of sync with the kernel file. Each `&lt;name&gt;_wgsl` module is generated by the</span>
<span class="tok-comment">/// build's compute pipeline (`spv2wgsl --entry &lt;name&gt;` over the one SPIR-V</span>
<span class="tok-comment">/// module). A name in `fk.kernels` with no generated module is a compile error</span>
<span class="tok-comment">/// right at the `@embedFile` below - exactly the drift we want caught at build</span>
<span class="tok-comment">/// time rather than as a runtime "kernel not registered".</span>
<span class="tok-kw">const</span> Pipe = z.<span class="tok-fn">Compute</span>(fk);
<span class="tok-kw">const</span> kernel_wgsls: [fk.kernels.len]Pipe.KernelWgsl = blk: {
    <span class="tok-kw">var</span> arr: [fk.kernels.len]Pipe.KernelWgsl = undefined;
    <span class="tok-kw">for</span> (fk.kernels, <span class="tok-num">0</span>..) |name, i| {
        arr[i] = .{ .name = name, .wgsl = <span class="tok-builtin">@embedFile</span>(name ++ <span class="tok-str">"_wgsl"</span>) };
    }
    <span class="tok-kw">break</span> :blk arr;
};

<span class="tok-kw">const</span> substeps: u32 = <span class="tok-num">1</span>;

<span class="tok-comment">// THE DEFAULTS, IN ONE PLACE. These must equal the `State` field initialisers below (this</span>
<span class="tok-comment">// Zig cannot read struct defaults reflectively, and `State{}` is not constructible because</span>
<span class="tok-comment">// `font` has none). They are also `fluid_gpu`'s values - that is what makes the two demos a</span>
<span class="tok-comment">// controlled comparison. The DEFAULTS button restores them and the diagnostics panel names</span>
<span class="tok-comment">// any knob that has drifted off them.</span>
<span class="tok-kw">const</span> def_g_force: f32 = <span class="tok-num">0.0099</span>; <span class="tok-comment">// x 9.8 m/s^2 == fluid_gpu's flat gravity_y of 0.097</span>
<span class="tok-kw">const</span> def_rest_density: f32 = <span class="tok-num">15.39</span>;
<span class="tok-kw">const</span> def_visc_beta: f32 = <span class="tok-num">0.017</span>;
<span class="tok-kw">const</span> def_k_far: f32 = <span class="tok-num">0.009</span>;
<span class="tok-kw">const</span> def_k_near: f32 = <span class="tok-num">0.028</span>;
<span class="tok-kw">const</span> def_wall_normal: f32 = <span class="tok-num">1.0</span>;
<span class="tok-kw">const</span> def_wall_tangent: f32 = <span class="tok-num">0.0</span>;
<span class="tok-kw">const</span> def_mouse_force: f32 = <span class="tok-num">3.0</span>;
<span class="tok-kw">const</span> def_phone_gravity: bool = false;
<span class="tok-comment">/// Sim-pixel radius of a rendered disc (the reference's RENDER_RADIUS).</span>
<span class="tok-kw">const</span> mouse_radius: f32 = <span class="tok-num">90.0</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    pipe: z.<span class="tok-fn">Compute</span>(fk),
    <span class="tok-comment">/// THE SAME KERNELS, RUN AS PLAIN ZIG. kompute compiles one source for two targets, so</span>
    <span class="tok-comment">/// this is the only way to ask "is the transpiler lying?" about the PHYSICS kernels.</span>
    <span class="tok-comment">/// `sort_smoke` proved the sort and the neighbour walk are bit-correct on the GPU - it</span>
    <span class="tok-comment">/// never tested density/force/apply. Toggle this on at a low particle count: if the</span>
    <span class="tok-comment">/// fluid pools on the CPU and sprays on the GPU, the fault is in the toolchain, and the</span>
    <span class="tok-comment">/// kernel that differs is the one to look at.</span>
    cpu_pipe: z.<span class="tok-fn">Compute</span>(fk),
    cpu_sim: bool = false,
    discs: z.FluidDiscs,
    ui_host: z.UiHost,
    <span class="tok-comment">/// Persistent spawn/reset scratch (reset re-seeds through the same</span>
    <span class="tok-comment">/// upload path; 20k x 8B is cheap to keep).</span>
    scratch: []Vec2,
    <span class="tok-comment">// The paper's knobs (uploaded into Params each frame).</span>
    k_far: f32 = def_k_far,
    k_near: f32 = def_k_near,
    <span class="tok-comment">// rho 0, the rest/desired density: pressure is k_far*(rho - rho 0). Higher = the</span>
    <span class="tok-comment">// fluid wants to pack denser (more cohesive); lower = it expands.</span>
    rest_density: f32 = def_rest_density,
    <span class="tok-comment">/// One gain mapping the phone's effective gravity (m/s^2, from the</span>
    <span class="tok-comment">/// accelerometer) -&gt; sim acceleration. ~0.01 reproduces "normal" gravity held</span>
    <span class="tok-comment">/// upright; this is DOUBLE that, for a punchier default. With phone gravity</span>
    <span class="tok-comment">/// off it just scales the straight-down 1g fallback.</span>
    <span class="tok-comment">/// MATCHED TO `fluid_gpu`, which applies a flat `gravity_y = 0.097`. Here gravity is a</span>
    <span class="tok-comment">/// SCALE on the device's 9.8 m/s^2 vector, so the same downward acceleration needs</span>
    <span class="tok-comment">/// 0.097 / 9.8 = 0.0099. (At the old 0.02 this demo pulled twice as hard as the other.)</span>
    g_force: f32 = def_g_force,
    <span class="tok-comment">/// On -&gt; gravity comes from the phone's proper-acceleration vector: tilt steers</span>
    <span class="tok-comment">/// it, shaking sloshes it, flat = float (zero-g), free-fall = weightless. Off</span>
    <span class="tok-comment">/// -&gt; plain straight-down gravity. Needs an https/localhost origin for sensor</span>
    <span class="tok-comment">/// data (else it falls back to straight down regardless).</span>
    <span class="tok-comment">/// OFF by default, to match `fluid_gpu`, which uses a flat constant gravity.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// With this ON, gravity comes from the ACCELEROMETER - and `getDeviceGravity` maps</span>
    <span class="tok-comment">/// only the x,y components into the canvas plane, so a phone held flat (or just tilted</span>
    <span class="tok-comment">/// back to read) has almost no in-plane gravity: the fluid is in FREE FALL and expands</span>
    <span class="tok-comment">/// to fill the box with no free surface. That is the feature working correctly, but it</span>
    <span class="tok-comment">/// made the demo look catastrophically broken next to `fluid_gpu` and sent a long hunt</span>
    <span class="tok-comment">/// after a physics bug that did not exist. Tilt-gravity is a great demo - it just</span>
    <span class="tok-comment">/// cannot be the DEFAULT when this example's whole purpose is to be a controlled</span>
    <span class="tok-comment">/// comparison against a constant-gravity twin.</span>
    phone_gravity: bool = def_phone_gravity,
    <span class="tok-comment">/// Wall-contact damping (proportion of velocity removed at the boundary).</span>
    <span class="tok-comment">/// normal_damp = into-wall component (1.0 = fully inelastic, the realistic</span>
    <span class="tok-comment">/// default); tangent_damp = along-wall friction - kept at 0 now that the</span>
    <span class="tok-comment">/// co-location shear (the real cause of the corner jets) is fixed, so the</span>
    <span class="tok-comment">/// walls are frictionless and the fix stands on its own. Crank it to compare.</span>
    wall_normal_damp: f32 = def_wall_normal,
    wall_tangent_damp: f32 = def_wall_tangent,
    visc_beta: f32 = def_visc_beta,
    mouse_force_mag: f32 = def_mouse_force,
    attract_toggle: bool = false,
    paused: bool = false,
    <span class="tok-comment">/// Batch every substep's dispatches into ONE compute pass / submit</span>
    <span class="tok-comment">/// (vs a submit per dispatch). On by default - fewer submits is faster.</span>
    batch_mode: bool = true,
    <span class="tok-comment">/// How many particles to DRAW (the sim always runs the full count). Below</span>
    <span class="tok-comment">/// the max this shows the first-N in cell order - i.e. the top rows, since</span>
    <span class="tok-comment">/// the sort puts the lowest-numbered cells first. Handy for eyeballing the</span>
    <span class="tok-comment">/// sort, not a perf knob.</span>
    sim_count_f: f32 = <span class="tok-num">20000</span>,
    adapter_buf: [<span class="tok-num">192</span>]u8 = undefined,
    adapter_len: usize = <span class="tok-num">0</span>,
    en_gravity: bool = true,
    en_grid: bool = true,
    en_viscosity: bool = true,
    en_predict: bool = true,
    en_density: bool = true,
    <span class="tok-comment">// One-shot: prime the counting sort (build cell_start + sort the spawn</span>
    <span class="tok-comment">// layout) before the first substep, so frame 1's viscosity reads a valid</span>
    <span class="tok-comment">// grid instead of an uninitialised one.</span>
    sort_primed: bool = false,
    en_force: bool = true,
    en_apply: bool = true,
    <span class="tok-comment">/// DIAGNOSTIC PROBE (temporary): particle 0's position and the bbox of all of them,</span>
    <span class="tok-comment">/// read back unconditionally. The discs render nothing while the sim reports 8 ms/sub,</span>
    <span class="tok-comment">/// so the one question worth answering is whether the POSITIONS are sane. If they are,</span>
    <span class="tok-comment">/// the compute is fine and the disc pipeline is at fault; if they are NaN or collapsed,</span>
    <span class="tok-comment">/// it is the other way round.</span>
    probe_p0: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    probe_min: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    probe_max: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    probe_nan: u32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// The effective gravity handed to the kernels this frame (see the diagnostics panel).</span>
    dbg_gravity: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    probe_pos1: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    <span class="tok-comment">/// RAW first entries of each buffer. Statistics have now sent me down three dead</span>
    <span class="tok-comment">/// ends; the actual bytes will not.</span>
    probe_gc: [<span class="tok-num">4</span>]u32 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    probe_cs: [<span class="tok-num">4</span>]u32 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    probe_den: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    probe_pos2: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    <span class="tok-comment">/// How many Params fields the SHADER disagrees with the HOST about, and the name of the</span>
    <span class="tok-comment">/// first one. Three of twenty have ever been verified; this checks all of them.</span>
    param_bad: u32 = <span class="tok-num">0</span>,
    param_first: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"-"</span>,
    param_host: f32 = <span class="tok-num">0</span>,
    param_gpu: f32 = <span class="tok-num">0</span>,
    stat_rho: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Mean rho_near. When `rho` sits BELOW rest density the far-pressure term is</span>
    <span class="tok-comment">/// ATTRACTIVE, so the near term is the only thing left that can hold the fluid open -</span>
    <span class="tok-comment">/// which makes this the number that decides whether the expansion is even physical.</span>
    stat_rho_near: f32 = <span class="tok-num">0</span>,
    stat_frozen_pct: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">// Grid occupancy (from grid_counts readback, diagnostics only): the</span>
    <span class="tok-comment">// fullest cell, the mean over non-empty cells, and how many cells exceed</span>
    <span class="tok-comment">// the old max_per_cell figure. The counting sort is UNCAPPED, so this no</span>
    <span class="tok-comment">// longer means dropped neighbours - it's just a density gauge for tuning.</span>
    stat_cell_max: u32 = <span class="tok-num">0</span>,
    stat_cell_avg: f32 = <span class="tok-num">0</span>,
    stat_cells_capped: u32 = <span class="tok-num">0</span>,
    frame_no: u32 = <span class="tok-num">0</span>,
    prev_stat_pos: []Vec2,

    <span class="tok-comment">// ---- Average-FPS benchmark readout (the baseline-to-beat) ----</span>
    <span class="tok-comment">// A STABLE windowed average recomputed every `fps_window_secs` so the</span>
    <span class="tok-comment">// displayed value doesn't jitter while you read it; accum/frames build the</span>
    <span class="tok-comment">// next window.</span>
    fps_avg: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// published windowed average (the headline number)</span>
    fps_accum_time: f32 = <span class="tok-num">0</span>, <span class="tok-comment">// seconds accumulated in the current window</span>
    fps_accum_frames: u32 = <span class="tok-num">0</span>,

    <span class="tok-comment">// ---- Vsync-independent benchmark ----</span>
    <span class="tok-comment">// Run `bench_mult` sim substeps per displayed frame (1..5). Bump it until</span>
    <span class="tok-comment">// FPS drops below the refresh cap (frame time past vsync =&gt; compute-bound),</span>
    <span class="tok-comment">// then ms/substep is the real, vsync-independent throughput figure to</span>
    <span class="tok-comment">// compare before/after a change. ms_frame is the EMA of the whole frame.</span>
    bench_mult: u32 = <span class="tok-num">3</span>,
    ms_frame: f32 = <span class="tok-num">0</span>,

    <span class="tok-comment">// Collapsing-section open state (closed by default - clean main view).</span>
    show_advanced: bool = false,
    show_diag: bool = false,
    <span class="tok-comment">// The whole control panel is collapsed by default: just a small menu toggle</span>
    <span class="tok-comment">// floats in the corner so the fluid is unobstructed until you want a knob.</span>
    panel_open: bool = false,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.pipe.<span class="tok-fn">deinit</span>();
    s.cpu_pipe.<span class="tok-fn">deinit</span>();
    s.discs.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.scratch);
    gpa.<span class="tok-fn">free</span>(s.prev_stat_pos);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-comment">/// Spawn the initial state: a packed disk at domain centre, jittered so the</span>
<span class="tok-comment">/// columns don't lock, plus a small deterministic per-particle kick. Uploaded</span>
<span class="tok-comment">/// straight into the compute buffers; gravity does the rest. reset() re-runs it.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">spawnDamBreak</span>(pipe: *z.<span class="tok-fn">Compute</span>(fk), scratch: []Vec2) void {
    <span class="tok-kw">var</span> prng: std.Random.DefaultPrng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0xf1a1d</span>);
    <span class="tok-kw">const</span> rng: std.Random = prng.<span class="tok-fn">random</span>();
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; fk.num_particles) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> ang: f32 = rng.<span class="tok-fn">float</span>(f32) * <span class="tok-num">6.2831853</span>;
        <span class="tok-kw">const</span> rad: f32 = <span class="tok-num">220.0</span> * <span class="tok-builtin">@sqrt</span>(rng.<span class="tok-fn">float</span>(f32));
        scratch[i] = .{
            fk.domain_w * <span class="tok-num">0.5</span> + <span class="tok-builtin">@cos</span>(ang) * rad,
            fk.domain_h * <span class="tok-num">0.5</span> + <span class="tok-builtin">@sin</span>(ang) * rad,
        };
    }
    pipe.<span class="tok-fn">upload</span>(.pos, scratch[<span class="tok-num">0</span>..fk.num_particles]);
    <span class="tok-builtin">@memcpy</span>(fk.g.B.pos[<span class="tok-num">0</span>..fk.num_particles], scratch[<span class="tok-num">0</span>..fk.num_particles]);
    <span class="tok-kw">for</span> (scratch[<span class="tok-num">0</span>..fk.num_particles], <span class="tok-num">0</span>..) |*v, vi| {
        <span class="tok-comment">// small deterministic per-particle kick so motion reads on screen</span>
        <span class="tok-kw">const</span> a: f32 = <span class="tok-fn">float</span>(vi % <span class="tok-num">628</span>) * <span class="tok-num">0.01</span>;
        v.* = .{ <span class="tok-builtin">@cos</span>(a) * <span class="tok-num">2.0</span>, <span class="tok-builtin">@sin</span>(a) * <span class="tok-num">1.0</span> };
    }
    pipe.<span class="tok-fn">upload</span>(.vel, scratch[<span class="tok-num">0</span>..fk.num_particles]);
    <span class="tok-builtin">@memcpy</span>(fk.g.B.vel[<span class="tok-num">0</span>..fk.num_particles], scratch[<span class="tok-num">0</span>..fk.num_particles]);
    pipe.<span class="tok-fn">upload</span>(.delta, scratch[<span class="tok-num">0</span>..fk.num_particles]);
    <span class="tok-comment">// Seed density bright so the colour reach-in renders before the first pass.</span>
    <span class="tok-kw">for</span> (scratch[<span class="tok-num">0</span>..fk.num_particles]) |*v| {
        v.* = .{ <span class="tok-num">600.0</span>, <span class="tok-num">1.0</span> };
    }
    pipe.<span class="tok-fn">upload</span>(.density, scratch[<span class="tok-num">0</span>..fk.num_particles]);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);

    <span class="tok-kw">var</span> pipe: z.<span class="tok-fn">Compute</span>(fk) = <span class="tok-kw">try</span> z.<span class="tok-fn">Compute</span>(fk).<span class="tok-fn">initGpu</span>(
        gpa,
        f.gpu.device,
        f.gpu.queue,
        &amp;kernel_wgsls,
    );

    <span class="tok-comment">// Variable-length fields slice to this many elements on readback (the live</span>
    <span class="tok-comment">// particle count). Dispatch widths are passed per call to `run(name, n)`;</span>
    <span class="tok-comment">// this field is ONLY the readback length, set once here.</span>
    pipe.element_count = fk.num_particles;

    <span class="tok-kw">const</span> scratch: []Vec2 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec2, fk.num_particles);
    <span class="tok-kw">const</span> prev_stat_pos: []Vec2 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec2, fk.num_particles);
    <span class="tok-builtin">@memset</span>(prev_stat_pos, .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> });
    <span class="tok-kw">var</span> cpu_pipe: z.<span class="tok-fn">Compute</span>(fk) = z.<span class="tok-fn">Compute</span>(fk).<span class="tok-fn">initCpu</span>();
    cpu_pipe.element_count = fk.num_particles;

    <span class="tok-fn">spawnDamBreak</span>(&amp;pipe, scratch);
    <span class="tok-fn">spawnDamBreak</span>(&amp;cpu_pipe, scratch);

    <span class="tok-kw">const</span> n_bytes: u64 = fk.num_particles * <span class="tok-num">8</span>;
    <span class="tok-kw">const</span> discs: z.FluidDiscs = <span class="tok-kw">try</span> z.FluidDiscs.<span class="tok-fn">init</span>(
        f.gpu,
        gpa,
        f.gpu.device,
        f.gpu.queue,
        f.gpu.backbuffer_format,
        f.gpu.depth_format <span class="tok-kw">orelse</span> .undefined_,
        .{ .handle = pipe.<span class="tok-fn">fieldBuffer</span>(.pos).?, .size = n_bytes },
        .{ .handle = pipe.<span class="tok-fn">fieldBuffer</span>(.density).?, .size = n_bytes },
        fk.domain_w,
        fk.domain_h,
    );

    s.* = .{
        .font = font,
        .pipe = pipe,
        .cpu_pipe = cpu_pipe,
        .discs = discs,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .scratch = scratch,
        .prev_stat_pos = prev_stat_pos,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// ---- Average-FPS benchmark (the baseline figure we're trying to beat) ----</span>
    <span class="tok-comment">// dt is the real frame delta; guard the first frame / pauses where it's 0.</span>
    <span class="tok-kw">const</span> dt: f32 = f.time.delta_time;
    <span class="tok-kw">if</span> (dt &gt; <span class="tok-num">0.0</span>) {
        <span class="tok-kw">const</span> inst_ms: f32 = dt * <span class="tok-num">1000.0</span>;
        s.ms_frame = <span class="tok-kw">if</span> (s.ms_frame == <span class="tok-num">0</span>) inst_ms <span class="tok-kw">else</span> s.ms_frame * <span class="tok-num">0.9</span> + inst_ms * <span class="tok-num">0.1</span>;
        <span class="tok-comment">// Windowed average: accumulate frames, publish every fps_window_secs so</span>
        <span class="tok-comment">// the headline number stays stable while you read it.</span>
        s.fps_accum_time += dt;
        s.fps_accum_frames += <span class="tok-num">1</span>;
        <span class="tok-kw">const</span> fps_window_secs: f32 = <span class="tok-num">0.5</span>;
        <span class="tok-kw">if</span> (s.fps_accum_time &gt;= fps_window_secs) {
            s.fps_avg = <span class="tok-fn">float</span>(s.fps_accum_frames) / s.fps_accum_time;
            s.fps_accum_time = <span class="tok-num">0</span>;
            s.fps_accum_frames = <span class="tok-num">0</span>;
        }
    }

    <span class="tok-comment">// ---- Input -&gt; mouse force (logical px -&gt; sim px via the renderer's fit) ----</span>
    <span class="tok-kw">const</span> lw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> lh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> mraw: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> mp_arr: [<span class="tok-num">2</span>]f32 = s.discs.<span class="tok-fn">simFromLogical</span>(lw, lh, .{ mraw[<span class="tok-num">0</span>], mraw[<span class="tok-num">1</span>] });
    <span class="tok-kw">const</span> mp: Vec2 = .{ mp_arr[<span class="tok-num">0</span>], mp_arr[<span class="tok-num">1</span>] };
    <span class="tok-kw">const</span> pressing: bool = z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left);
    <span class="tok-kw">const</span> attract: bool = s.attract_toggle <span class="tok-kw">or</span>
        z.<span class="tok-fn">isKeyDown</span>(f.input, .left_shift) <span class="tok-kw">or</span>
        z.<span class="tok-fn">isKeyDown</span>(f.input, .right_shift);
    <span class="tok-kw">const</span> signed_force: f32 = <span class="tok-kw">if</span> (!pressing)
        <span class="tok-num">0.0</span>
    <span class="tok-kw">else</span> <span class="tok-kw">if</span> (attract)
        -s.mouse_force_mag
    <span class="tok-kw">else</span>
        s.mouse_force_mag;

    <span class="tok-comment">// ---- Gravity: ONE effective-gravity vector from the phone (Einstein) ----</span>
    <span class="tok-comment">// getDeviceGravity returns -(proper acceleration) in canvas m/s^2: it already</span>
    <span class="tok-comment">// contains gravity AND motion, so tilt, shake, flat-float and free-fall all</span>
    <span class="tok-comment">// come from this single vector. g_force scales m/s^2 -&gt; sim units. With phone</span>
    <span class="tok-comment">// gravity off it returns plain (0, 9.8), i.e. classic straight-down gravity.</span>
    <span class="tok-kw">const</span> eff_g: Vec2 = <span class="tok-kw">if</span> (s.phone_gravity) z.<span class="tok-fn">getDeviceGravity</span>(f.input) <span class="tok-kw">else</span> Vec2{ <span class="tok-num">0</span>, <span class="tok-num">9.8</span> };
    <span class="tok-kw">const</span> accel_vec: Vec2 = eff_g * <span class="tok-fn">splat2</span>(s.g_force);
    s.dbg_gravity = accel_vec;

    <span class="tok-comment">// ---- Substeps: 11 dispatches each, all on-device ----</span>
    <span class="tok-comment">// Compute this frame's sim params ONCE, before opening the batch: a batch</span>
    <span class="tok-comment">// writes the uniform a single time at beginBatch, so params must be final by</span>
    <span class="tok-comment">// then (endBatch asserts they don't change mid-batch). The same values drive</span>
    <span class="tok-comment">// the one-time priming sort and every substep below.</span>
    <span class="tok-kw">const</span> live_count: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(s.sim_count_f, <span class="tok-num">1</span>, <span class="tok-fn">float</span>(fk.num_particles)));

    <span class="tok-kw">const</span> sim_params: fk.Params = .{
        <span class="tok-comment">// THE LIVE COUNT, not the buffer capacity. This used to be `fk.num_particles`, so</span>
        <span class="tok-comment">// the count slider changed only how many discs were DRAWN while the sim always ran</span>
        <span class="tok-comment">// all 20000 - and because the counting sort orders particles by cell</span>
        <span class="tok-comment">// (`cell = cx + cy*n_cols`), the first N slots are the particles in the LOWEST cell</span>
        <span class="tok-comment">// ids, i.e. the TOP ROWS of the domain. Asking for 1000 particles therefore rendered</span>
        <span class="tok-comment">// a thin band along the ceiling: a spatial slice, not a subset. In `fluid_gpu` there</span>
        <span class="tok-comment">// is no reorder, so the same mistake looked harmless.</span>
        .count = live_count,
        .dt = <span class="tok-num">1.0</span>,
        .h = fk.interact_radius,
        .r0 = s.rest_density,
        .k_far = s.k_far,
        .k_near = s.k_near,
        .gravity_x = accel_vec[<span class="tok-num">0</span>],
        .gravity_y = accel_vec[<span class="tok-num">1</span>],
        .visc_beta = s.visc_beta,
        .mouse_x = mp[<span class="tok-num">0</span>],
        .mouse_y = mp[<span class="tok-num">1</span>],
        .mouse_force = signed_force,
        .mouse_radius = mouse_radius,
        .dom_w = fk.domain_w,
        .dom_h = fk.domain_h,
        .n_cols = fk.grid_cols,
        .n_rows = fk.grid_rows,
        .wall_normal_damp = s.wall_normal_damp,
        .wall_tangent_damp = s.wall_tangent_damp,
    };
    <span class="tok-comment">// ONE pointer decides which backend the whole substep loop runs on. Everything below</span>
    <span class="tok-comment">// dispatches through `pipe`, so the CPU and GPU paths cannot drift apart.</span>
    <span class="tok-kw">const</span> pipe: *z.<span class="tok-fn">Compute</span>(fk) = <span class="tok-kw">if</span> (s.cpu_sim) &amp;s.cpu_pipe <span class="tok-kw">else</span> &amp;s.pipe;
    pipe.params = sim_params; <span class="tok-comment">// non-batch mode reads this per dispatch</span>
    <span class="tok-comment">// Echo the uniform back out of the shader every frame, so the panel can prove - not</span>
    <span class="tok-comment">// assume - that what the host wrote is what the kernel reads.</span>
    pipe.<span class="tok-fn">run</span>(<span class="tok-str">"paramEcho"</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (!s.paused <span class="tok-kw">and</span> s.batch_mode <span class="tok-kw">and</span> !s.cpu_sim) {
        pipe.<span class="tok-fn">beginBatch</span>(sim_params);
    }
    <span class="tok-kw">var</span> step: u32 = <span class="tok-num">0</span>;
    s.frame_no += <span class="tok-num">1</span>;
    <span class="tok-comment">// The benchmark multiplier scales the substep count at runtime so we can</span>
    <span class="tok-comment">// push the GPU past the vsync cap and read a real ms/substep number.</span>
    <span class="tok-kw">const</span> bench_n: u32 = <span class="tok-fn">clamp</span>(s.bench_mult, <span class="tok-builtin">@as</span>(u32, <span class="tok-num">1</span>), <span class="tok-builtin">@as</span>(u32, <span class="tok-num">5</span>));
    <span class="tok-kw">if</span> (!s.paused <span class="tok-kw">and</span> !s.sort_primed) {
        <span class="tok-comment">// Prime the counting sort once: build cell_start + reorder the spawn</span>
        <span class="tok-comment">// layout so the very first substep's viscosity (which runs BEFORE that</span>
        <span class="tok-comment">// substep's own rebuild) reads a valid grid, not an uninitialised one.</span>
        pipe.<span class="tok-fn">run</span>(<span class="tok-str">"clearGrid"</span>, fk.grid_cells);
        pipe.<span class="tok-fn">run</span>(<span class="tok-str">"countGrid"</span>, live_count);
        pipe.<span class="tok-fn">run</span>(<span class="tok-str">"prefixSum"</span>, <span class="tok-num">1</span>);
        pipe.<span class="tok-fn">run</span>(<span class="tok-str">"scatter"</span>, live_count);
        pipe.<span class="tok-fn">run</span>(<span class="tok-str">"copyback"</span>, live_count);
        s.sort_primed = true;
    }
    <span class="tok-kw">while</span> (!s.paused <span class="tok-kw">and</span> step &lt; substeps * bench_n) : (step += <span class="tok-num">1</span>) {
        <span class="tok-comment">// Clavet ordering: gravity+mouse -&gt; viscosity -&gt; predict, as three</span>
        <span class="tok-comment">// dispatches. Viscosity runs on the STALE grid still in the buffer from</span>
        <span class="tok-comment">// last frame's build (a damping term tolerates the drift), BEFORE predict</span>
        <span class="tok-comment">// and BEFORE the rebuild - so the grid is still built only ONCE per frame</span>
        <span class="tok-comment">// (below, on the predicted positions density+force need). Applying</span>
        <span class="tok-comment">// viscosity pre-predict (rather than fused into force) is more stable,</span>
        <span class="tok-comment">// which lets dt grow.</span>
        <span class="tok-kw">if</span> (s.en_gravity) {
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"gravityMouse"</span>, live_count);
        }
        <span class="tok-kw">if</span> (s.en_viscosity) {
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"viscosity"</span>, live_count);
        }
        <span class="tok-kw">if</span> (s.en_predict) {
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"predict"</span>, live_count);
        }
        <span class="tok-kw">if</span> (s.en_grid) {
            <span class="tok-comment">// Spatial counting sort: clearGrid (per cell) -&gt; countGrid (per</span>
            <span class="tok-comment">// particle) -&gt; prefixSum (ONE invocation) -&gt; scatter -&gt; copyback. After</span>
            <span class="tok-comment">// this pos/vel/prev are in CELL ORDER, so each cell's particles occupy</span>
            <span class="tok-comment">// the contiguous range [cell_start[c], cell_start[c+1]) and the</span>
            <span class="tok-comment">// neighbour passes read coalesced. grid_counts is reused as the</span>
            <span class="tok-comment">// per-cell scatter cursor (prefixSum zeroes it after the scan).</span>
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"clearGrid"</span>, fk.grid_cells);
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"countGrid"</span>, live_count);
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"prefixSum"</span>, <span class="tok-num">1</span>);
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"scatter"</span>, live_count);
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"copyback"</span>, live_count);
        }
        <span class="tok-kw">if</span> (s.en_density) {
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"density"</span>, live_count);
        }
        <span class="tok-kw">if</span> (s.en_force) {
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"force"</span>, live_count);
        }
        <span class="tok-kw">if</span> (s.en_apply) {
            pipe.<span class="tok-fn">run</span>(<span class="tok-str">"applyAndFinalize"</span>, live_count);
        }
    }
    <span class="tok-kw">if</span> (!s.paused <span class="tok-kw">and</span> s.batch_mode <span class="tok-kw">and</span> !s.cpu_sim) {
        pipe.<span class="tok-fn">endBatch</span>();
    }

    <span class="tok-comment">// The discs bind GPU buffers, so a CPU-run sim has to be mirrored across before it can</span>
    <span class="tok-comment">// be drawn. `readLatest` on `.cpu` is a direct read of the module globals - free.</span>
    <span class="tok-kw">if</span> (s.cpu_sim) {
        <span class="tok-kw">if</span> (s.cpu_pipe.<span class="tok-fn">readLatest</span>(.pos)) |p| {
            s.pipe.<span class="tok-fn">upload</span>(.pos, p);
        }
        <span class="tok-kw">if</span> (s.cpu_pipe.<span class="tok-fn">readLatest</span>(.density)) |d| {
            s.pipe.<span class="tok-fn">upload</span>(.density, d);
        }
    }

    <span class="tok-comment">// ---- Diagnostics readback (centroid/bbox/rho/frozen) - GATED + THROTTLED.</span>
    <span class="tok-comment">// readLatest() copies EVERY GPU buffer to staging + submits + maps (a</span>
    <span class="tok-comment">// blocking GPU sync), and the CPU scans 20k elements. Doing all THREE</span>
    <span class="tok-comment">// readbacks every frame (for stats only visible in the `diagnostics` panel)</span>
    <span class="tok-comment">// pinned the GPU and - critically - added ~3 GPU stalls/frame that inflate</span>
    <span class="tok-comment">// ms_frame and distort the ms/sub reading. So only pay for it when the panel</span>
    <span class="tok-comment">// is open AND only once every `diag_every` frames; the stat_* fields persist</span>
    <span class="tok-comment">// between samples, so the panel still updates (~1x/sec) without taxing every</span>
    <span class="tok-comment">// frame. Measure perf with the panel CLOSED for the cleanest number.</span>
    <span class="tok-comment">// The probe: unconditional, throttled. One readback every 30 frames is cheap and it</span>
    <span class="tok-comment">// answers the only question that matters right now.</span>
    <span class="tok-kw">if</span> (s.frame_no % <span class="tok-num">30</span> == <span class="tok-num">0</span>) {
        <span class="tok-kw">if</span> (pipe.<span class="tok-fn">readLatest</span>(.pos)) |pos_now| {
            <span class="tok-kw">var</span> mn: Vec2 = .{ <span class="tok-num">1e30</span>, <span class="tok-num">1e30</span> };
            <span class="tok-kw">var</span> mx: Vec2 = .{ -<span class="tok-num">1e30</span>, -<span class="tok-num">1e30</span> };
            <span class="tok-kw">var</span> nan_n: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (pos_now) |p| {
                <span class="tok-kw">if</span> (p[<span class="tok-num">0</span>] != p[<span class="tok-num">0</span>] <span class="tok-kw">or</span> p[<span class="tok-num">1</span>] != p[<span class="tok-num">1</span>]) {
                    nan_n += <span class="tok-num">1</span>;
                    <span class="tok-kw">continue</span>;
                }
                mn = <span class="tok-builtin">@min</span>(mn, p);
                mx = <span class="tok-builtin">@max</span>(mx, p);
            }
            s.probe_p0 = pos_now[<span class="tok-num">0</span>];
            s.probe_pos1 = pos_now[<span class="tok-num">1</span>];
            s.probe_min = mn;
            s.probe_max = mx;
            s.probe_nan = nan_n;
        }
        <span class="tok-kw">if</span> (pipe.<span class="tok-fn">readLatest</span>(.grid_counts)) |gc| {
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |i| {
                s.probe_gc[i] = gc[i];
            }
        }
        <span class="tok-kw">if</span> (pipe.<span class="tok-fn">readLatest</span>(.cell_start)) |cs| {
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">4</span>) |i| {
                s.probe_cs[i] = cs[i];
            }
        }
        <span class="tok-kw">if</span> (pipe.<span class="tok-fn">readLatest</span>(.density)) |d| {
            s.probe_den = d[<span class="tok-num">0</span>];
        }
        <span class="tok-kw">if</span> (pipe.<span class="tok-fn">readLatest</span>(.scratch)) |sc| {
            s.probe_pos2 = sc[<span class="tok-num">0</span>];

            <span class="tok-comment">// WHAT THE SHADER ACTUALLY SEES, field by field, against what the host sent.</span>
            <span class="tok-kw">const</span> b: usize = fk.echo_base;
            <span class="tok-kw">if</span> (sc.len &gt; b + <span class="tok-num">9</span>) {
                <span class="tok-kw">const</span> Pair = <span class="tok-kw">struct</span> { name: []<span class="tok-kw">const</span> u8, host: f32, gpu: f32 };
                <span class="tok-kw">const</span> checks = [_]Pair{
                    .{ .name = <span class="tok-str">"count"</span>, .host = <span class="tok-fn">float</span>(sim_params.count), .gpu = sc[b + <span class="tok-num">0</span>][<span class="tok-num">0</span>] },
                    .{ .name = <span class="tok-str">"dt"</span>, .host = sim_params.dt, .gpu = sc[b + <span class="tok-num">0</span>][<span class="tok-num">1</span>] },
                    .{ .name = <span class="tok-str">"h"</span>, .host = sim_params.h, .gpu = sc[b + <span class="tok-num">1</span>][<span class="tok-num">0</span>] },
                    .{ .name = <span class="tok-str">"r0"</span>, .host = sim_params.r0, .gpu = sc[b + <span class="tok-num">1</span>][<span class="tok-num">1</span>] },
                    .{ .name = <span class="tok-str">"k_far"</span>, .host = sim_params.k_far, .gpu = sc[b + <span class="tok-num">2</span>][<span class="tok-num">0</span>] },
                    .{ .name = <span class="tok-str">"k_near"</span>, .host = sim_params.k_near, .gpu = sc[b + <span class="tok-num">2</span>][<span class="tok-num">1</span>] },
                    .{ .name = <span class="tok-str">"grav_x"</span>, .host = sim_params.gravity_x, .gpu = sc[b + <span class="tok-num">3</span>][<span class="tok-num">0</span>] },
                    .{ .name = <span class="tok-str">"grav_y"</span>, .host = sim_params.gravity_y, .gpu = sc[b + <span class="tok-num">3</span>][<span class="tok-num">1</span>] },
                    .{ .name = <span class="tok-str">"visc"</span>, .host = sim_params.visc_beta, .gpu = sc[b + <span class="tok-num">4</span>][<span class="tok-num">0</span>] },
                    .{ .name = <span class="tok-str">"mouse_x"</span>, .host = sim_params.mouse_x, .gpu = sc[b + <span class="tok-num">4</span>][<span class="tok-num">1</span>] },
                    .{ .name = <span class="tok-str">"mouse_y"</span>, .host = sim_params.mouse_y, .gpu = sc[b + <span class="tok-num">5</span>][<span class="tok-num">0</span>] },
                    .{ .name = <span class="tok-str">"mouse_f"</span>, .host = sim_params.mouse_force, .gpu = sc[b + <span class="tok-num">5</span>][<span class="tok-num">1</span>] },
                    .{ .name = <span class="tok-str">"mouse_r"</span>, .host = sim_params.mouse_radius, .gpu = sc[b + <span class="tok-num">6</span>][<span class="tok-num">0</span>] },
                    .{ .name = <span class="tok-str">"dom_w"</span>, .host = sim_params.dom_w, .gpu = sc[b + <span class="tok-num">6</span>][<span class="tok-num">1</span>] },
                    .{ .name = <span class="tok-str">"dom_h"</span>, .host = sim_params.dom_h, .gpu = sc[b + <span class="tok-num">7</span>][<span class="tok-num">0</span>] },
                    .{ .name = <span class="tok-str">"n_cols"</span>, .host = <span class="tok-fn">float</span>(sim_params.n_cols), .gpu = sc[b + <span class="tok-num">7</span>][<span class="tok-num">1</span>] },
                    .{ .name = <span class="tok-str">"n_rows"</span>, .host = <span class="tok-fn">float</span>(sim_params.n_rows), .gpu = sc[b + <span class="tok-num">8</span>][<span class="tok-num">0</span>] },
                    .{ .name = <span class="tok-str">"wall_n"</span>, .host = sim_params.wall_normal_damp, .gpu = sc[b + <span class="tok-num">8</span>][<span class="tok-num">1</span>] },
                    .{ .name = <span class="tok-str">"wall_t"</span>, .host = sim_params.wall_tangent_damp, .gpu = sc[b + <span class="tok-num">9</span>][<span class="tok-num">0</span>] },
                };
                <span class="tok-kw">var</span> bad: u32 = <span class="tok-num">0</span>;
                <span class="tok-kw">var</span> first: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"-"</span>;
                <span class="tok-kw">var</span> fh: f32 = <span class="tok-num">0</span>;
                <span class="tok-kw">var</span> fg: f32 = <span class="tok-num">0</span>;
                <span class="tok-kw">for</span> (checks) |c2| {
                    <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(c2.host - c2.gpu) &gt; <span class="tok-builtin">@max</span>(<span class="tok-builtin">@abs</span>(c2.host) * <span class="tok-num">0.001</span>, <span class="tok-num">0.0001</span>)) {
                        <span class="tok-kw">if</span> (bad == <span class="tok-num">0</span>) {
                            first = c2.name;
                            fh = c2.host;
                            fg = c2.gpu;
                        }
                        bad += <span class="tok-num">1</span>;
                    }
                }
                s.param_bad = bad;
                s.param_first = first;
                s.param_host = fh;
                s.param_gpu = fg;
            }
        }
    }

    <span class="tok-kw">const</span> diag_every: u32 = <span class="tok-num">30</span>;
    <span class="tok-kw">if</span> (s.show_diag <span class="tok-kw">and</span> s.frame_no % diag_every == <span class="tok-num">0</span>) {
        <span class="tok-kw">if</span> (pipe.<span class="tok-fn">readLatest</span>(.pos)) |pos_all| {
            <span class="tok-kw">const</span> pos_now: []<span class="tok-kw">const</span> Vec2 = pos_all[<span class="tok-num">0</span>..<span class="tok-builtin">@min</span>(live_count, pos_all.len)];
            <span class="tok-kw">var</span> frozen: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (pos_now, <span class="tok-num">0</span>..) |p, i| {
                <span class="tok-kw">const</span> dp: Vec2 = p - s.prev_stat_pos[i];
                <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(dp[<span class="tok-num">0</span>]) + <span class="tok-builtin">@abs</span>(dp[<span class="tok-num">1</span>]) &lt; <span class="tok-num">0.01</span>) {
                    frozen += <span class="tok-num">1</span>;
                }
                s.prev_stat_pos[i] = p;
            }
            s.stat_frozen_pct = <span class="tok-num">100.0</span> * <span class="tok-fn">float</span>(frozen) / <span class="tok-fn">float</span>(live_count);
        }
        <span class="tok-kw">if</span> (pipe.<span class="tok-fn">readLatest</span>(.density)) |d_all| {
            <span class="tok-kw">const</span> d_now: []<span class="tok-kw">const</span> Vec2 = d_all[<span class="tok-num">0</span>..<span class="tok-builtin">@min</span>(live_count, d_all.len)];
            <span class="tok-kw">var</span> rs: f64 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> rns: f64 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (d_now) |d| {
                rs += d[<span class="tok-num">0</span>];
                rns += d[<span class="tok-num">1</span>];
            }
            s.stat_rho = <span class="tok-builtin">@floatCast</span>(rs / <span class="tok-fn">float64</span>(live_count));
            s.stat_rho_near = <span class="tok-builtin">@floatCast</span>(rns / <span class="tok-fn">float64</span>(live_count));
        }
        <span class="tok-kw">if</span> (pipe.<span class="tok-fn">readLatest</span>(.grid_counts)) |gc| {
            <span class="tok-kw">var</span> cmax: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> nonempty: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> capped: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> total: u64 = <span class="tok-num">0</span>;
            <span class="tok-kw">for</span> (gc) |cnt| {
                <span class="tok-kw">if</span> (cnt &gt; cmax) {
                    cmax = cnt;
                }
                <span class="tok-kw">if</span> (cnt &gt; <span class="tok-num">0</span>) {
                    nonempty += <span class="tok-num">1</span>;
                    total += cnt;
                }
                <span class="tok-kw">if</span> (cnt &gt;= fk.max_per_cell) {
                    capped += <span class="tok-num">1</span>;
                }
            }
            s.stat_cell_max = cmax;
            s.stat_cells_capped = capped;
            <span class="tok-kw">const</span> ne_f: f32 = <span class="tok-fn">float</span>(nonempty);
            <span class="tok-kw">const</span> tot_f: f32 = <span class="tok-fn">float</span>(total);
            s.stat_cell_avg = <span class="tok-kw">if</span> (nonempty &gt; <span class="tok-num">0</span>) tot_f / ne_f <span class="tok-kw">else</span> <span class="tok-num">0</span>;
        }
    }

    <span class="tok-comment">// ---- Pre-discs marker kept minimal: the FPS/ms readout now lives in the</span>
    <span class="tok-comment">// pinned control panel (always visible), so the old top-left headline was</span>
    <span class="tok-comment">// both redundant and occluded by the panel - removed. ----</span>

    <span class="tok-comment">// ---- Render: clear + N discs (BACKGROUND) + reference geometry + UI ----</span>
    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">1</span>, .g = <span class="tok-num">3</span>, .b = <span class="tok-num">8</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-comment">// Discs FIRST so the 2D overlays + UI compose ON TOP of the fluid. The</span>
    <span class="tok-comment">// DrawPoints pass discipline (flushBatch -&gt; disc draw -&gt; renderer.bindForPass)</span>
    <span class="tok-comment">// restores the 2D pipeline + bind group, so subsequent 2D draws are valid.</span>
    <span class="tok-comment">// Zero-copy: the discs read positions straight from the compute buffer.</span>
    s.discs.<span class="tok-fn">draw</span>(f.gl, live_count, lw, lh, .{ .radius_px = <span class="tok-num">8.0</span>, .density_scale = <span class="tok-num">1.0</span> / <span class="tok-num">24.0</span> });
    <span class="tok-comment">// Reopen a fresh 2D pass after the discs' custom pass so the border and UI</span>
    <span class="tok-comment">// compose ON TOP (the disc pass leaves pipeline/pass state the 2D</span>
    <span class="tok-comment">// batch can't recover from on the Adreno - the source of the old</span>
    <span class="tok-comment">// "discs must be drawn last" workaround).</span>
    z.<span class="tok-fn">reopenOverlayPass</span>(f.gl);

    <span class="tok-kw">const</span> blind: bool = s.frame_no &lt; <span class="tok-num">300</span>;
    <span class="tok-kw">const</span> so: [<span class="tok-num">2</span>][<span class="tok-num">2</span>]f32 = s.discs.<span class="tok-fn">fitScaleOffset</span>(lw, lh);
    <span class="tok-kw">const</span> sc: f32 = so[<span class="tok-num">0</span>][<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> ox: f32 = so[<span class="tok-num">1</span>][<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> oy: f32 = so[<span class="tok-num">1</span>][<span class="tok-num">1</span>];
    <span class="tok-comment">// Domain border (2D layer, logical coords): where FluidDiscs SHOULD map.</span>
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = ox, .y = oy, .width = fk.domain_w * sc, .height = fk.domain_h * sc },
        .{ .color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> }, .outline = <span class="tok-num">2.0</span> },
    );
    <span class="tok-kw">if</span> (blind) {
        <span class="tok-kw">const</span> badge_pos: Vec2 = .{ ox + fk.domain_w * sc - <span class="tok-num">30.0</span> * sc, oy + <span class="tok-num">18.0</span> * sc };
        f.gl.<span class="tok-fn">rect</span>(
            .{ .x = badge_pos[<span class="tok-num">0</span>], .y = badge_pos[<span class="tok-num">1</span>], .width = <span class="tok-num">22.0</span> * sc, .height = <span class="tok-num">22.0</span> * sc },
            .{ .color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">240</span>, .b = <span class="tok-num">240</span>, .a = <span class="tok-num">255</span> } },
        );
    }

    <span class="tok-comment">// ---- Controls ----</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-comment">// Phone strategy: a SMALL always-visible bar (fps + a menu toggle) floats at</span>
    <span class="tok-comment">// the top-left so the fluid is unobstructed. Tapping menu opens the full</span>
    <span class="tok-comment">// control panel; tapping x collapses it. Font is sized to the logical</span>
    <span class="tok-comment">// width so nothing clips on a narrow canvas. lw/lh = logical CSS px.</span>
    <span class="tok-kw">const</span> ui_w: f32 = lw * <span class="tok-num">0.5</span>;
    <span class="tok-comment">// 30% smaller than the previous sizing: cap 34-&gt;24, and the divisor tracks</span>
    <span class="tok-comment">// the (now half-width) panel so text still fits.</span>

                <span class="tok-comment">// The one link never measured: what the HOST holds at write time. Every</span>
                <span class="tok-comment">// other layer has now been verified to agree on n_cols living at byte 60</span>
                <span class="tok-comment">// (Zig extern, SPIR-V OpMemberDecorate Offset, WGSL). So either the host</span>
                <span class="tok-comment">// value is not what the literal says, or the write drops it.</span>
                u.<span class="tok-fn">text</span>(<span class="tok-str">"HOST: n_cols={d} n_rows={d}"</span>, .{ s.pipe.params.n_cols, s.pipe.params.n_rows });
                u.<span class="tok-fn">text</span>(<span class="tok-str">"cs {d} {d} {d} {d}"</span>, .{ s.probe_cs[<span class="tok-num">0</span>], s.probe_cs[<span class="tok-num">1</span>], s.probe_cs[<span class="tok-num">2</span>], s.probe_cs[<span class="tok-num">3</span>] });
                u.<span class="tok-fn">text</span>(<span class="tok-str">"den ({d:.2},{d:.2})  pos2 ({d:.1},{d:.1})"</span>, .{
                    s.probe_den[<span class="tok-num">0</span>], s.probe_den[<span class="tok-num">1</span>], s.probe_pos2[<span class="tok-num">0</span>], s.probe_pos2[<span class="tok-num">1</span>],
                });
                u.<span class="tok-fn">text</span>(<span class="tok-str">"p1 ({d:.1},{d:.1})  ncols {d} nrows {d}"</span>, .{
                    s.probe_pos1[<span class="tok-num">0</span>], s.probe_pos1[<span class="tok-num">1</span>], fk.grid_cols, fk.grid_rows,
                });
                u.<span class="tok-fn">text</span>(<span class="tok-str">"buffers {d} (WebGPU max 8)  cells {d}"</span>, .{

                u.<span class="tok-fn">text</span>(<span class="tok-str">"cellmax {d} avg {d:.1} cap {d}"</span>, .{ s.stat_cell_max, s.stat_cell_avg, s.stat_cells_capped });
                _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"gravity"</span>, &amp;s.en_gravity);
