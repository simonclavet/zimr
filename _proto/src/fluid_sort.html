<figure class="code src-file" data-path="examples/fluid_sort/sort_kernels.zig" data-lines="720"><figcaption><span>examples/fluid_sort/sort_kernels.zig</span><span>720 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! sort_kernels.zig - the GPU fluid with a SPATIAL COUNTING SORT (t1178).</span>
<span class="tok-comment">//! Same Clavet double-density-relaxation SPH as fluid_gpu, but the</span>
<span class="tok-comment">//! neighbour grid is a counting sort instead of per-cell slot arrays:</span>
<span class="tok-comment">//!   clearGrid -&gt; countGrid -&gt; prefixSum -&gt; scatter -&gt; copyback</span>
<span class="tok-comment">//! reorders pos/vel/prev into CELL ORDER each frame, so the density / force /</span>
<span class="tok-comment">//! viscosity neighbour loops read CONTIGUOUS memory (b_pos[cell_start[c]..[c+1]])</span>
<span class="tok-comment">//! and coalesce across the warp - the win the random b_pos[grid_data[..]] gather</span>
<span class="tok-comment">//! could never give. There is no max_per_cell cap either (ranges are exact), so</span>
<span class="tok-comment">//! dense regions never drop neighbours. Particles are indistinguishable, so the</span>
<span class="tok-comment">//! sorted order simply BECOMES the canonical order for the next frame (no</span>
<span class="tok-comment">//! unsort). grid_counts is reused as the per-cell scatter cursor (prefixSum</span>
<span class="tok-comment">//! zeroes it after reading the counts into cell_start).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Per-substep order:</span>
<span class="tok-comment">//!   gravityMouse -&gt; viscosity (STALE sort) -&gt; predict</span>
<span class="tok-comment">//!   -&gt; clearGrid -&gt; countGrid -&gt; prefixSum -&gt; scatter -&gt; copyback (FRESH sort)</span>
<span class="tok-comment">//!   -&gt; density -&gt; force -&gt; applyAndFinalize</span>
<span class="tok-kw">const</span> k = <span class="tok-builtin">@import</span>(<span class="tok-str">"kompute"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> dot = zm.dot;
<span class="tok-kw">const</span> length = zm.length;
<span class="tok-kw">const</span> splat2 = zm.splat2;
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> expect = std.testing.expect;
<span class="tok-kw">const</span> expectApproxEqAbs = std.testing.expectApproxEqAbs;
<span class="tok-kw">const</span> expectEqual = std.testing.expectEqual;

<span class="tok-comment">/// MATCHED TO `fluid_gpu` so the two are directly comparable: same particle count, same</span>
<span class="tok-comment">/// interaction radius, same domain, same spawn, same physics constants. The ONLY thing</span>
<span class="tok-comment">/// that differs between the demos is the neighbour-finding strategy - a counting sort that</span>
<span class="tok-comment">/// reorders particles into cell order (here) versus per-cell bucket lists (fluid_gpu).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> num_particles: u32 = <span class="tok-num">20000</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> domain_w: f32 = <span class="tok-num">900.0</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> domain_h: f32 = <span class="tok-num">600.0</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> interact_radius: f32 = <span class="tok-num">22.0</span>;
<span class="tok-comment">// Retained for host diagnostics only; the counting sort itself is uncapped.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> max_per_cell: u32 = <span class="tok-num">64</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> grid_cols: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@ceil</span>(domain_w / interact_radius) + <span class="tok-num">2</span>);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> grid_rows: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@ceil</span>(domain_h / interact_radius) + <span class="tok-num">2</span>);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> grid_cells: u32 = grid_cols * grid_rows;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> config = k.Config{ .max = num_particles, .workgroup = <span class="tok-num">256</span> };

<span class="tok-comment">/// One storage buffer, the whole sim state. `pos` is FIRST: the renderer reads</span>
<span class="tok-comment">/// positions at offset 0 by instance_index (the DrawPoints contract).</span>
<span class="tok-comment">// Plain struct (not extern): Zig 1245 bans @Vector fields in extern structs on</span>
<span class="tok-comment">// CPU targets. The GPU binds each field by name via @extern on the SPIR-V target</span>
<span class="tok-comment">// (vectors legal there); the CPU twin (`g.B`) just needs the arrays for the</span>
<span class="tok-comment">// reference kernels. Per-field binding means struct layout is never used for the</span>
<span class="tok-comment">// GPU storage buffers, so dropping `extern` changes nothing on either side.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Buffers = <span class="tok-kw">struct</span> {
    pos: [num_particles]Vec2,
    prev: [num_particles]Vec2,
    vel: [num_particles]Vec2,
    delta: [num_particles]Vec2,
    <span class="tok-comment">/// (rho, rho_near) per particle - also read by the renderer for colour.</span>
    density: [num_particles]Vec2,
    <span class="tok-comment">/// Per-cell particle count (atomic). countGrid accumulates it; prefixSum</span>
    <span class="tok-comment">/// consumes it into cell_start and ZEROES it so scatter can reuse it as the</span>
    <span class="tok-comment">/// per-cell write cursor.</span>
    grid_counts: [grid_cells]u32,
    <span class="tok-comment">/// Exclusive prefix sum of grid_counts, +1 sentinel: cell c's particles</span>
    <span class="tok-comment">/// occupy sorted slots [cell_start[c], cell_start[c+1]); cell_start[cells]=N.</span>
    cell_start: [grid_cells + <span class="tok-num">1</span>]u32,
    <span class="tok-comment">/// Scatter scratch - scatter writes the cell-sorted pos/vel/prev here, then</span>
    <span class="tok-comment">/// copyback copies them back so pos/vel/prev are canonical (= sorted).</span>
    <span class="tok-comment">/// ONE scratch buffer for the counting sort's reorder, holding pos, vel and prev</span>
    <span class="tok-comment">/// back-to-back: `[0..N)` = pos2, `[N..2N)` = vel2, `[2N..3N)` = prev2.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// This used to be THREE separate buffers, which put the module at TEN - and WebGPU</span>
    <span class="tok-comment">/// guarantees only EIGHT storage buffers per shader stage. Bindings past the eighth</span>
    <span class="tok-comment">/// silently do not bind: the writes vanish with no error and the kernel runs on happily,</span>
    <span class="tok-comment">/// which is exactly how this fluid came to fill its box while its twin `fluid_gpu`</span>
    <span class="tok-comment">/// (which sits at exactly eight) worked perfectly. Packing them costs one multiply-add</span>
    <span class="tok-comment">/// and buys the module back under the ceiling. `Compute.initGpu` now refuses to compile</span>
    <span class="tok-comment">/// a module over the limit, so this can never be silently re-introduced.</span>
    <span class="tok-comment">/// ...plus 16 spare Vec2 at the tail, which `paramEcho` uses to write back every field</span>
    <span class="tok-comment">/// of `Params` AS THE SHADER ACTUALLY SEES IT. No new buffer: the module is at WebGPU's</span>
    <span class="tok-comment">/// hard ceiling of 8.</span>
    scratch: [<span class="tok-num">3</span> * num_particles + <span class="tok-num">16</span>]Vec2,
};

<span class="tok-comment">/// Scalar-field uniform (array pads break uniform layout). 16 x 4B = 64B.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Params = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    count: u32,
    dt: f32,
    h: f32,
    r0: f32,
    k_far: f32,
    k_near: f32,
    gravity_x: f32,
    gravity_y: f32,
    visc_beta: f32,
    mouse_x: f32,
    mouse_y: f32,
    <span class="tok-comment">/// Signed: &gt;0 repels, &lt;0 attracts, 0 idle.</span>
    mouse_force: f32,
    mouse_radius: f32,
    dom_w: f32,
    dom_h: f32,
    n_cols: u32,
    n_rows: u32,
    <span class="tok-comment">/// Wall-contact damping (proportion of velocity REMOVED at the boundary).</span>
    <span class="tok-comment">/// normal = the into-wall component; tangential = the along-wall component.</span>
    <span class="tok-comment">/// 0 = frictionless/elastic-ish, 1 = fully killed. Live-tunable for tuning.</span>
    wall_normal_damp: f32 = <span class="tok-num">0</span>,
    wall_tangent_damp: f32 = <span class="tok-num">0</span>,
    <span class="tok-comment">// std140 padding: 19 scalar fields = 76 B; a WGSL uniform block rounds its</span>
    <span class="tok-comment">// size up to a 16-B multiple -&gt; 80 B. One trailing pad gets us there. (The</span>
    <span class="tok-comment">// Compute(M) `@sizeOf(Params) % 16` comptime check enforces this.)</span>
    _pad0: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> g = k.<span class="tok-fn">Globals</span>(<span class="tok-builtin">@This</span>());
<span class="tok-kw">const</span> b_pos = g.<span class="tok-fn">bind</span>(.pos);
<span class="tok-kw">const</span> b_prev = g.<span class="tok-fn">bind</span>(.prev);
<span class="tok-kw">const</span> b_vel = g.<span class="tok-fn">bind</span>(.vel);
<span class="tok-kw">const</span> b_delta = g.<span class="tok-fn">bind</span>(.delta);
<span class="tok-kw">const</span> b_density = g.<span class="tok-fn">bind</span>(.density);
<span class="tok-kw">const</span> b_grid_counts = g.<span class="tok-fn">bind</span>(.grid_counts);
<span class="tok-kw">const</span> b_cell_start = g.<span class="tok-fn">bind</span>(.cell_start);
<span class="tok-kw">const</span> b_scratch = g.<span class="tok-fn">bind</span>(.scratch);

<span class="tok-comment">/// Bin a position to its grid cell, clamped to the grid (matching the centre</span>
<span class="tok-comment">/// cell the neighbour search derives). countGrid and scatter MUST agree, so</span>
<span class="tok-comment">/// both go through here.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">cellOf</span>(pos: Vec2, n_cols: u32, n_rows: u32, h: f32) u32 {
    <span class="tok-kw">const</span> max_cx: f32 = <span class="tok-fn">float</span>(n_cols - <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> max_cy: f32 = <span class="tok-fn">float</span>(n_rows - <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> cx: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(<span class="tok-builtin">@floor</span>(pos[<span class="tok-num">0</span>] / h), <span class="tok-num">0.0</span>, max_cx));
    <span class="tok-kw">const</span> cy: u32 = <span class="tok-builtin">@trunc</span>(<span class="tok-fn">clamp</span>(<span class="tok-builtin">@floor</span>(pos[<span class="tok-num">1</span>] / h), <span class="tok-num">0.0</span>, max_cy));
    <span class="tok-kw">return</span> cx + cy * n_cols;
}

<span class="tok-comment">/// Per CELL (dispatch count = grid_cells): zero this cell's count before</span>
<span class="tok-comment">/// countGrid accumulates into it.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">clearGrid</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> cell: u32 = c.id;
    <span class="tok-kw">if</span> (cell &gt;= c.params.n_cols * c.params.n_rows) {
        <span class="tok-kw">return</span>;
    }
    k.<span class="tok-fn">atomicStore</span>(b_grid_counts, cell, <span class="tok-num">0</span>);
}

<span class="tok-comment">/// Per PARTICLE: count this particle into its cell (the counting pass). The</span>
<span class="tok-comment">/// atomicAdd result is unused - we only want the final per-cell totals.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">countGrid</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> cell: u32 = <span class="tok-fn">cellOf</span>(b_pos[i], c.params.n_cols, c.params.n_rows, c.params.h);
    _ = k.<span class="tok-fn">atomicAdd</span>(b_grid_counts, cell, <span class="tok-num">1</span>);
}

<span class="tok-comment">/// SINGLE invocation (dispatch count = 1): serial exclusive prefix sum of</span>
<span class="tok-comment">/// grid_counts into cell_start, zeroing grid_counts as we go so scatter can</span>
<span class="tok-comment">/// reuse it as the per-cell write cursor. cell count (~1.3k) is tiny next to N.</span>
<span class="tok-comment">/// !! BROKEN ON GPU - spv2wgsl mis-structurizes this loop. See `src/notes/claude.md`.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// This is the ONLY kernel in the tree with a real runtime loop (every other neighbour</span>
<span class="tok-comment">/// walk is an `inline for` and unrolls), and it is the only one that trips the bug.</span>
<span class="tok-comment">/// spv2wgsl emits two OpPhi variables DECLARED, READ, and NEVER ASSIGNED:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///     var phi26853: u32;              // never written</span>
<span class="tok-comment">///     let _26845: bool = 72u == 72u;  // computed, then discarded</span>
<span class="tok-comment">///     phi26855 = phi26853;            // reads the zero-init</span>
<span class="tok-comment">///     let _26859: bool = phi26855 == 41u;   // -&gt; false -&gt; loop breaks immediately</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// WGSL zero-initialises them, so the loop exits on its first iteration, `cell_start`</span>
<span class="tok-comment">/// stays all zeroes, `scatter` piles every particle into slot 0, and `copyback` writes</span>
<span class="tok-comment">/// those zeros back into `pos`. That is the whole "fluid stuck in the corner" bug.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Neither `@setRuntimeSafety(false)` nor changing the loop form (while-with-continue-</span>
<span class="tok-comment">/// expression vs manual increment) changes it - both still emit 2 unassigned phis. The</span>
<span class="tok-comment">/// fix belongs in spv2wgsl's phi/default-exit handling (`applyDefaultToShortestExit`).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">prefixSum</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">if</span> (c.id != <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> cells: u32 = c.params.n_cols * c.params.n_rows;
    <span class="tok-kw">var</span> acc: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> cell: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (cell &lt; cells) : (cell += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> cnt: u32 = k.<span class="tok-fn">atomicLoad</span>(b_grid_counts, cell);
        b_cell_start[cell] = acc;
        acc += cnt;
        k.<span class="tok-fn">atomicStore</span>(b_grid_counts, cell, <span class="tok-num">0</span>);
    }
    b_cell_start[cells] = acc;
}

<span class="tok-comment">/// Per PARTICLE: claim a slot in this particle's cell (atomicAdd on the reused</span>
<span class="tok-comment">/// grid_counts cursor) and write its pos/vel/prev into the cell-sorted scratch</span>
<span class="tok-comment">/// at cell_start[cell] + slot.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">scatter</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> cell: u32 = <span class="tok-fn">cellOf</span>(b_pos[i], c.params.n_cols, c.params.n_rows, c.params.h);
    <span class="tok-kw">const</span> slot: u32 = k.<span class="tok-fn">atomicAdd</span>(b_grid_counts, cell, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> dest: u32 = b_cell_start[cell] + slot;
    b_scratch[dest] = b_pos[i];
    b_scratch[num_particles + dest] = b_vel[i];
    b_scratch[<span class="tok-num">2</span> * num_particles + dest] = b_prev[i];
}

<span class="tok-comment">/// Per PARTICLE: copy the cell-sorted scratch back so pos/vel/prev ARE the</span>
<span class="tok-comment">/// sorted order - the canonical arrays for the rest of this frame and the next.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">copyback</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    b_pos[i] = b_scratch[i];
    b_vel[i] = b_scratch[num_particles + i];
    b_prev[i] = b_scratch[<span class="tok-num">2</span> * num_particles + i];
}

<span class="tok-comment">/// Per particle: gravity + the (signed) mouse impulse with linear falloff.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">gravityMouse</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">var</span> v: Vec2 = b_vel[i];
    <span class="tok-comment">// Gravity is a VECTOR now (was y-only): the host points it via the phone's</span>
    <span class="tok-comment">// accelerometer (tilt) while the slider sets its magnitude. With tilt off</span>
    <span class="tok-comment">// the host sends (0, mag), so this stays identical to the old y-only pull.</span>
    v[<span class="tok-num">0</span>] = v[<span class="tok-num">0</span>] + c.params.gravity_x * c.params.dt;
    v[<span class="tok-num">1</span>] = v[<span class="tok-num">1</span>] + c.params.gravity_y * c.params.dt;
    <span class="tok-kw">const</span> to_p: Vec2 = b_pos[i] - Vec2{ c.params.mouse_x, c.params.mouse_y };
    <span class="tok-kw">const</span> d: f32 = <span class="tok-fn">length</span>(to_p);
    <span class="tok-kw">if</span> (d &gt;= <span class="tok-num">0.5</span> <span class="tok-kw">and</span> d &lt; c.params.mouse_radius <span class="tok-kw">and</span> c.params.mouse_force != <span class="tok-num">0.0</span>) {
        <span class="tok-kw">const</span> falloff: f32 = <span class="tok-num">1.0</span> - d / c.params.mouse_radius;
        v = v + to_p * <span class="tok-fn">splat2</span>(c.params.mouse_force * falloff / d);
    }
    b_vel[i] = v;
}

<span class="tok-comment">/// Per particle: collision-style viscosity (t1178). Acts ONLY on approaching</span>
<span class="tok-comment">/// pairs (closing speed u &gt; 0); the impulse is QUADRATIC in u, then CLAMPED so</span>
<span class="tok-comment">/// it can at most bring the pair's radial motion to rest (u' = u - imp &gt;= 0):</span>
<span class="tok-comment">/// never a bounce, strictly dissipative, 1/2 each. Weight 1 inside h/2, linear to</span>
<span class="tok-comment">/// 0 at h. Reads the STALE sort (last frame's cell_start + the still-sorted</span>
<span class="tok-comment">/// pos) - it runs before predict and the reorder.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">viscosity</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> my_pos: Vec2 = b_pos[i];
    <span class="tok-kw">var</span> my_vel: Vec2 = b_vel[i];
    <span class="tok-kw">const</span> ccx: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">0</span>] / c.params.h);
    <span class="tok-kw">const</span> ccy: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">1</span>] / c.params.h);
    <span class="tok-kw">var</span> dy: i32 = -<span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (dy &lt;= <span class="tok-num">1</span>) : (dy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> dx: i32 = -<span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (dx &lt;= <span class="tok-num">1</span>) : (dx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> nx: i32 = ccx + dx;
            <span class="tok-kw">const</span> ny: i32 = ccy + dy;
            <span class="tok-kw">if</span> (nx &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> ny &lt; <span class="tok-num">0</span>) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> unx: u32 = <span class="tok-builtin">@intCast</span>(nx);
            <span class="tok-kw">const</span> uny: u32 = <span class="tok-builtin">@intCast</span>(ny);
            <span class="tok-kw">if</span> (unx &gt;= c.params.n_cols <span class="tok-kw">or</span> uny &gt;= c.params.n_rows) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> cell: u32 = unx + uny * c.params.n_cols;
            <span class="tok-kw">const</span> start: u32 = b_cell_start[cell];
            <span class="tok-comment">// Capped to match `fluid_gpu` - see the note in `density`.</span>
            <span class="tok-kw">const</span> end_raw: u32 = b_cell_start[cell + <span class="tok-num">1</span>];
            <span class="tok-kw">const</span> end: u32 = <span class="tok-kw">if</span> (end_raw - start &gt; max_per_cell) start + max_per_cell <span class="tok-kw">else</span> end_raw;
            <span class="tok-kw">var</span> kk: u32 = start;
            <span class="tok-kw">while</span> (kk &lt; end) : (kk += <span class="tok-num">1</span>) {
                <span class="tok-kw">if</span> (kk == i) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> sep: Vec2 = b_pos[kk] - my_pos;
                <span class="tok-kw">const</span> dist: f32 = <span class="tok-fn">length</span>(sep);
                <span class="tok-kw">if</span> (dist &lt; <span class="tok-num">0.1</span> <span class="tok-kw">or</span> dist &gt;= c.params.h) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> n: Vec2 = sep * <span class="tok-fn">splat2</span>(<span class="tok-num">1.0</span> / dist);
                <span class="tok-kw">const</span> u: f32 = <span class="tok-fn">dot</span>(my_vel - b_vel[kk], n);
                <span class="tok-kw">if</span> (u &lt;= <span class="tok-num">0.0</span>) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> w_lin: f32 = <span class="tok-num">2.0</span> * (<span class="tok-num">1.0</span> - dist / c.params.h);
                <span class="tok-kw">const</span> w: f32 = <span class="tok-kw">if</span> (w_lin &lt; <span class="tok-num">1.0</span>) w_lin <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
                <span class="tok-kw">const</span> imp_raw: f32 = c.params.visc_beta * w * u * u;
                <span class="tok-kw">const</span> imp: f32 = <span class="tok-kw">if</span> (imp_raw &lt; u) imp_raw <span class="tok-kw">else</span> u;
                my_vel = my_vel - n * <span class="tok-fn">splat2</span>(<span class="tok-num">0.5</span> * imp);
            }
        }
    }
    b_vel[i] = my_vel;
}

<span class="tok-comment">/// Per particle: save prev, advance by vel*dt (the prediction half of Clavet's</span>
<span class="tok-comment">/// prediction-relaxation).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">predict</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> p: Vec2 = b_pos[i];
    b_prev[i] = p;
    b_pos[i] = p + b_vel[i] * <span class="tok-fn">splat2</span>(c.params.dt);
}

<span class="tok-comment">/// Per particle: rho = sum(1-q)^2, rho_near = sum(1-q)^3 over the 3x3 neighbourhood,</span>
<span class="tok-comment">/// iterating each cell's CONTIGUOUS sorted range [cell_start[c], cell_start[c+1]).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">density</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> my_pos: Vec2 = b_pos[i];
    <span class="tok-kw">var</span> rho: f32 = <span class="tok-num">0.0</span>;
    <span class="tok-kw">var</span> rho_near: f32 = <span class="tok-num">0.0</span>;
    <span class="tok-kw">const</span> ccx: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">0</span>] / c.params.h);
    <span class="tok-kw">const</span> ccy: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">1</span>] / c.params.h);
    <span class="tok-kw">var</span> dy: i32 = -<span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (dy &lt;= <span class="tok-num">1</span>) : (dy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> dx: i32 = -<span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (dx &lt;= <span class="tok-num">1</span>) : (dx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> nx: i32 = ccx + dx;
            <span class="tok-kw">const</span> ny: i32 = ccy + dy;
            <span class="tok-kw">if</span> (nx &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> ny &lt; <span class="tok-num">0</span>) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> unx: u32 = <span class="tok-builtin">@intCast</span>(nx);
            <span class="tok-kw">const</span> uny: u32 = <span class="tok-builtin">@intCast</span>(ny);
            <span class="tok-kw">if</span> (unx &gt;= c.params.n_cols <span class="tok-kw">or</span> uny &gt;= c.params.n_rows) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> cell: u32 = unx + uny * c.params.n_cols;
            <span class="tok-kw">const</span> start: u32 = b_cell_start[cell];
            <span class="tok-comment">// CAP THE CELL, exactly as `fluid_gpu` does. Its bucket lists hold at most</span>
            <span class="tok-comment">// `max_per_cell` indices and silently drop the overflow, so it never sees more</span>
            <span class="tok-comment">// than 64 neighbours from one cell. This walk used to read the WHOLE range -</span>
            <span class="tok-comment">// and with cellmax running 74..97 that is ~30 extra neighbours per dense cell</span>
            <span class="tok-comment">// that the twin never counts. rho comes out systematically higher from the SAME</span>
            <span class="tok-comment">// configuration, and `rest_density = 15.39` was tuned against the capped number.</span>
            <span class="tok-comment">// Two demos cannot be a controlled comparison while one of them silently counts</span>
            <span class="tok-comment">// a different neighbourhood.</span>
            <span class="tok-kw">const</span> end_raw: u32 = b_cell_start[cell + <span class="tok-num">1</span>];
            <span class="tok-kw">const</span> end: u32 = <span class="tok-kw">if</span> (end_raw - start &gt; max_per_cell) start + max_per_cell <span class="tok-kw">else</span> end_raw;
            <span class="tok-kw">var</span> kk: u32 = start;
            <span class="tok-kw">while</span> (kk &lt; end) : (kk += <span class="tok-num">1</span>) {
                <span class="tok-kw">if</span> (kk == i) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> sep: Vec2 = b_pos[kk] - my_pos;
                <span class="tok-kw">const</span> d2: f32 = <span class="tok-fn">dot</span>(sep, sep);
                <span class="tok-kw">if</span> (d2 &lt; c.params.h * c.params.h) {
                    <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(d2);
                    <span class="tok-kw">const</span> omq: f32 = <span class="tok-num">1.0</span> - dist / c.params.h;
                    rho += omq * omq;
                    rho_near += omq * omq * omq;
                }
            }
        }
    }
    b_density[i] = .{ rho, rho_near };
}

<span class="tok-comment">/// Per particle: pressure-only double-density displacement (viscosity is the</span>
<span class="tok-comment">/// separate pre-predict pass). Reads neighbour pos + density from the CONTIGUOUS</span>
<span class="tok-comment">/// sorted ranges.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">force</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> my_pos: Vec2 = b_pos[i];
    <span class="tok-kw">const</span> my_d: Vec2 = b_density[i];
    <span class="tok-kw">const</span> my_press: f32 = c.params.k_far * (my_d[<span class="tok-num">0</span>] - c.params.r0);
    <span class="tok-kw">const</span> my_near: f32 = c.params.k_near * my_d[<span class="tok-num">1</span>];
    <span class="tok-kw">var</span> corr: Vec2 = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.0</span> };
    <span class="tok-kw">const</span> ccx: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">0</span>] / c.params.h);
    <span class="tok-kw">const</span> ccy: i32 = <span class="tok-builtin">@floor</span>(my_pos[<span class="tok-num">1</span>] / c.params.h);
    <span class="tok-kw">var</span> dy: i32 = -<span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (dy &lt;= <span class="tok-num">1</span>) : (dy += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> dx: i32 = -<span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (dx &lt;= <span class="tok-num">1</span>) : (dx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> nx: i32 = ccx + dx;
            <span class="tok-kw">const</span> ny: i32 = ccy + dy;
            <span class="tok-kw">if</span> (nx &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> ny &lt; <span class="tok-num">0</span>) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> unx: u32 = <span class="tok-builtin">@intCast</span>(nx);
            <span class="tok-kw">const</span> uny: u32 = <span class="tok-builtin">@intCast</span>(ny);
            <span class="tok-kw">if</span> (unx &gt;= c.params.n_cols <span class="tok-kw">or</span> uny &gt;= c.params.n_rows) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> cell: u32 = unx + uny * c.params.n_cols;
            <span class="tok-kw">const</span> start: u32 = b_cell_start[cell];
            <span class="tok-comment">// Capped to match `fluid_gpu` - see the note in `density`.</span>
            <span class="tok-kw">const</span> end_raw: u32 = b_cell_start[cell + <span class="tok-num">1</span>];
            <span class="tok-kw">const</span> end: u32 = <span class="tok-kw">if</span> (end_raw - start &gt; max_per_cell) start + max_per_cell <span class="tok-kw">else</span> end_raw;
            <span class="tok-kw">var</span> kk: u32 = start;
            <span class="tok-kw">while</span> (kk &lt; end) : (kk += <span class="tok-num">1</span>) {
                <span class="tok-kw">if</span> (kk == i) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> rel: Vec2 = b_pos[kk] - my_pos;
                <span class="tok-kw">const</span> d2: f32 = <span class="tok-fn">dot</span>(rel, rel);
                <span class="tok-kw">if</span> (d2 &gt;= c.params.h * c.params.h) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(d2);
                <span class="tok-kw">var</span> dir: Vec2 = undefined;
                <span class="tok-kw">if</span> (dist &gt; <span class="tok-num">0.5</span>) {
                    dir = rel * <span class="tok-fn">splat2</span>(<span class="tok-num">1.0</span> / dist);
                } <span class="tok-kw">else</span> {
                    <span class="tok-comment">// Co-location fallback (particles at ~the same point). THE BUG</span>
                    <span class="tok-comment">// this replaces: a FIXED +/-x axis whose sign was `i &lt; kk`. But i,</span>
                    <span class="tok-comment">// kk are sorted SLOTS, and the sort key is cell = cx + cy*n_cols,</span>
                    <span class="tok-comment">// so slot grows with ROW (cy). For a vertically-stacked</span>
                    <span class="tok-comment">// coincident pair the lower row always has the lower slot -&gt;</span>
                    <span class="tok-comment">// always pushed -x, upper row +x. That is a systematic shear</span>
                    <span class="tok-comment">// (v_x grows with y) which funnels particles into the (0,0) and</span>
                    <span class="tok-comment">// (W,H) corners - the bottom-left / top-right ejections. Fix:</span>
                    <span class="tok-comment">// pick a pair-CONSISTENT pseudo-random direction (seed is</span>
                    <span class="tok-comment">// symmetric in i,kk), signed by `i &lt; kk` so it stays</span>
                    <span class="tok-comment">// antisymmetric (momentum-conserving) but has NO axis bias.</span>
                    <span class="tok-kw">const</span> seed: u32 = (i +% kk) *% <span class="tok-num">2654435761</span>;
                    <span class="tok-kw">const</span> ang: f32 = <span class="tok-fn">float</span>(seed % <span class="tok-num">6283</span>) * <span class="tok-num">0.001</span>;
                    <span class="tok-kw">const</span> sgn: f32 = <span class="tok-kw">if</span> (i &lt; kk) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> -<span class="tok-num">1.0</span>;
                    dir = .{ <span class="tok-builtin">@cos</span>(ang) * sgn, <span class="tok-builtin">@sin</span>(ang) * sgn };
                }
                <span class="tok-kw">const</span> omq: f32 = <span class="tok-num">1.0</span> - dist / c.params.h;
                <span class="tok-kw">const</span> jd: Vec2 = b_density[kk];
                <span class="tok-kw">const</span> j_press: f32 = c.params.k_far * (jd[<span class="tok-num">0</span>] - c.params.r0);
                <span class="tok-kw">const</span> j_near: f32 = c.params.k_near * jd[<span class="tok-num">1</span>];
                <span class="tok-kw">const</span> disp: f32 = <span class="tok-num">0.5</span> * c.params.dt * c.params.dt *
                    ((my_press + j_press) * omq + (my_near + j_near) * omq * omq);
                corr = corr - dir * <span class="tok-fn">splat2</span>(disp);
            }
        }
    }
    <span class="tok-comment">// NO CORRECTION CLAMP - `fluid_gpu` has none, and this is meant to be its twin.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// There WAS one here (|corr| bounded to h/2), added to stop a rho_near spike in a</span>
    <span class="tok-comment">// corner flinging a particle across the domain. But it also silently changes the</span>
    <span class="tok-comment">// pressure solve wherever the correction is large, which is exactly where the fluid</span>
    <span class="tok-comment">// is deciding how to compress - and with `h` raised from 10 to 22 the clamp bites in</span>
    <span class="tok-comment">// places it never used to. Two demos cannot be compared while one of them quietly</span>
    <span class="tok-comment">// truncates its own pressure. The wall clamp and the 40 px/s speed cap in</span>
    <span class="tok-comment">// `applyAndFinalize` already bound the runaway this was guarding against.</span>
    b_delta[i] = corr;
}

<span class="tok-comment">/// Per particle: derive velocity from the PHYSICS step, then resolve the domain</span>
<span class="tok-comment">/// boundary. Velocity is taken BEFORE any boundary position edit (so clamps/pushes</span>
<span class="tok-comment">/// can't pump energy in - the corner-jet fix), then a wall contact removes a</span>
<span class="tok-comment">/// tunable proportion of the normal and tangential velocity (diagnostic knobs).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">applyAndFinalize</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">const</span> i: u32 = c.id;
    <span class="tok-kw">if</span> (i &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-comment">// Physics result for this substep: predicted position + the pressure</span>
    <span class="tok-comment">// correction. Velocity is read from THIS, before any boundary edit, so a</span>
    <span class="tok-comment">// position correction can never leak into velocity.</span>
    <span class="tok-comment">// POSITION FIRST, VELOCITY FROM THE FINAL POSITION.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// This is position-based dynamics: the walls are CONSTRAINTS, so the velocity has to be</span>
    <span class="tok-comment">// derived from the position that survives them - `v = (p_final - p_prev) / dt`. It used</span>
    <span class="tok-comment">// to be taken from `p_phys`, BEFORE the wall band and the clamp. That made the wall band</span>
    <span class="tok-comment">// a free teleport: it shoved a particle inward every substep and left its velocity</span>
    <span class="tok-comment">// untouched, so the particle paid nothing for the displacement. An energy pump running</span>
    <span class="tok-comment">// along all four walls. The fluid inflated until it filled the box (rho 11.5 against a</span>
    <span class="tok-comment">// rest density of 15.39) and flung particles clean through the boundary - `cellmax 97`</span>
    <span class="tok-comment">// against an average of 16.7, because `cellOf` clamps every out-of-bounds particle into</span>
    <span class="tok-comment">// cell 0. `fluid_gpu`, which computes v after its clamp, showed none of it (cap 0).</span>
    <span class="tok-kw">var</span> p: Vec2 = b_pos[i] + b_delta[i];
    <span class="tok-comment">// (Re-added) soft inward repulsion over a margin band. POSITION-ONLY: it</span>
    <span class="tok-comment">// edits p, never v - and since predict makes next frame's b_pos = b_prev +</span>
    <span class="tok-comment">// vel*dt, the b_prev cancels in the velocity formula, so this can never pump.</span>
    <span class="tok-kw">const</span> band: f32 = c.params.h;
    <span class="tok-kw">const</span> push: f32 = <span class="tok-num">0.25</span>;
    <span class="tok-kw">if</span> (p[<span class="tok-num">0</span>] &lt; band) {
        p[<span class="tok-num">0</span>] += (band - p[<span class="tok-num">0</span>]) * push;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (p[<span class="tok-num">0</span>] &gt; c.params.dom_w - band) {
        p[<span class="tok-num">0</span>] -= (p[<span class="tok-num">0</span>] - (c.params.dom_w - band)) * push;
    }
    <span class="tok-kw">if</span> (p[<span class="tok-num">1</span>] &lt; band) {
        p[<span class="tok-num">1</span>] += (band - p[<span class="tok-num">1</span>]) * push;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (p[<span class="tok-num">1</span>] &gt; c.params.dom_h - band) {
        p[<span class="tok-num">1</span>] -= (p[<span class="tok-num">1</span>] - (c.params.dom_h - band)) * push;
    }
    <span class="tok-comment">// Hard clamp + per-axis jitter (different x/y bases -&gt; 2D scatter, not a</span>
    <span class="tok-comment">// diagonal line). Position-only.</span>
    <span class="tok-kw">const</span> margin: f32 = <span class="tok-num">1.5</span>;
    <span class="tok-kw">const</span> jx: f32 = <span class="tok-fn">float</span>(i % <span class="tok-num">7</span>) * <span class="tok-num">0.4</span>;
    <span class="tok-kw">const</span> jy: f32 = <span class="tok-fn">float</span>((i / <span class="tok-num">7</span>) % <span class="tok-num">7</span>) * <span class="tok-num">0.4</span>;
    <span class="tok-kw">const</span> lo_x: f32 = margin + jx;
    <span class="tok-kw">const</span> hi_x: f32 = c.params.dom_w - margin - jx;
    <span class="tok-kw">const</span> lo_y: f32 = margin + jy;
    <span class="tok-kw">const</span> hi_y: f32 = c.params.dom_h - margin - jy;
    <span class="tok-kw">const</span> hit_x_lo: bool = p[<span class="tok-num">0</span>] &lt; lo_x;
    <span class="tok-kw">const</span> hit_x_hi: bool = p[<span class="tok-num">0</span>] &gt; hi_x;
    <span class="tok-kw">const</span> hit_y_lo: bool = p[<span class="tok-num">1</span>] &lt; lo_y;
    <span class="tok-kw">const</span> hit_y_hi: bool = p[<span class="tok-num">1</span>] &gt; hi_y;
    <span class="tok-kw">if</span> (hit_x_lo) {
        p[<span class="tok-num">0</span>] = lo_x;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (hit_x_hi) {
        p[<span class="tok-num">0</span>] = hi_x;
    }
    <span class="tok-kw">if</span> (hit_y_lo) {
        p[<span class="tok-num">1</span>] = lo_y;
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (hit_y_hi) {
        p[<span class="tok-num">1</span>] = hi_y;
    }
    <span class="tok-comment">// Wall-contact damping (the experiment): remove a proportion of the into-wall</span>
    <span class="tok-comment">// NORMAL velocity and the along-wall TANGENTIAL velocity. keep = 1 - damp.</span>
    <span class="tok-comment">// The constraint has been applied; NOW the velocity follows from the motion the particle</span>
    <span class="tok-comment">// actually made. A particle stopped by a wall gets a small v here by construction, so</span>
    <span class="tok-comment">// the explicit damping below only shapes what the constraint already resolved.</span>
    <span class="tok-kw">var</span> v: Vec2 = (p - b_prev[i]) * <span class="tok-fn">splat2</span>(<span class="tok-num">1.0</span> / c.params.dt);
    <span class="tok-kw">const</span> kn: f32 = <span class="tok-num">1.0</span> - c.params.wall_normal_damp;
    <span class="tok-kw">const</span> kt: f32 = <span class="tok-num">1.0</span> - c.params.wall_tangent_damp;
    <span class="tok-kw">const</span> hit_x: bool = hit_x_lo <span class="tok-kw">or</span> hit_x_hi;
    <span class="tok-kw">const</span> hit_y: bool = hit_y_lo <span class="tok-kw">or</span> hit_y_hi;
    <span class="tok-comment">// Normal = the axis that hit; damp only the INTO-wall direction.</span>
    <span class="tok-kw">if</span> (hit_x_lo <span class="tok-kw">and</span> v[<span class="tok-num">0</span>] &lt; <span class="tok-num">0.0</span>) {
        v[<span class="tok-num">0</span>] = v[<span class="tok-num">0</span>] * kn;
    }
    <span class="tok-kw">if</span> (hit_x_hi <span class="tok-kw">and</span> v[<span class="tok-num">0</span>] &gt; <span class="tok-num">0.0</span>) {
        v[<span class="tok-num">0</span>] = v[<span class="tok-num">0</span>] * kn;
    }
    <span class="tok-kw">if</span> (hit_y_lo <span class="tok-kw">and</span> v[<span class="tok-num">1</span>] &lt; <span class="tok-num">0.0</span>) {
        v[<span class="tok-num">1</span>] = v[<span class="tok-num">1</span>] * kn;
    }
    <span class="tok-kw">if</span> (hit_y_hi <span class="tok-kw">and</span> v[<span class="tok-num">1</span>] &gt; <span class="tok-num">0.0</span>) {
        v[<span class="tok-num">1</span>] = v[<span class="tok-num">1</span>] * kn;
    }
    <span class="tok-comment">// Tangential = the perpendicular axis; damp it on any wall touch (friction).</span>
    <span class="tok-comment">// At a corner both components get hit, which is fine (strong corner bleed).</span>
    <span class="tok-kw">if</span> (hit_x) {
        v[<span class="tok-num">1</span>] = v[<span class="tok-num">1</span>] * kt;
    }
    <span class="tok-kw">if</span> (hit_y) {
        v[<span class="tok-num">0</span>] = v[<span class="tok-num">0</span>] * kt;
    }
    b_pos[i] = p;
    <span class="tok-kw">const</span> speed: f32 = <span class="tok-fn">length</span>(v);
    <span class="tok-kw">const</span> max_speed: f32 = <span class="tok-num">40.0</span>;
    <span class="tok-kw">if</span> (speed &gt; max_speed) {
        v = v * <span class="tok-fn">splat2</span>(max_speed / speed);
    }
    b_vel[i] = v;
}

<span class="tok-comment">/// The kernel manifest: every `@compute` entry this module exports, in pipeline</span>
<span class="tok-comment">/// order. This single list drives BOTH sides of the dual-shape build:</span>
<span class="tok-comment">///   - GPU: `installKernels(@This())` (below) exports one SPIR-V entry per name.</span>
<span class="tok-comment">///   - host: `fluid_sort.zig` loops this list to `@embedFile` each kernel's</span>
<span class="tok-comment">///     generated WGSL and hand it to `Compute(fk).initGpu` - no hand-kept array.</span>
<span class="tok-comment">/// So a typo or a missing kernel surfaces as a compile error (a `@embedFile` of</span>
<span class="tok-comment">/// a `&lt;name&gt;_wgsl` module the build never generated), never a silent runtime</span>
<span class="tok-comment">/// "kernel not registered". Add a kernel = add its fn above + its name here.</span>
<span class="tok-comment">/// Where `paramEcho` writes. Past everything the sort touches.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> echo_base: u32 = <span class="tok-num">3</span> * num_particles;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> kernels = [_][:<span class="tok-num">0</span>]<span class="tok-kw">const</span> u8{
    <span class="tok-str">"paramEcho"</span>,
    <span class="tok-str">"clearGrid"</span>,
    <span class="tok-str">"countGrid"</span>,
    <span class="tok-str">"prefixSum"</span>,
    <span class="tok-str">"scatter"</span>,
    <span class="tok-str">"copyback"</span>,
    <span class="tok-str">"gravityMouse"</span>,
    <span class="tok-str">"viscosity"</span>,
    <span class="tok-str">"predict"</span>,
    <span class="tok-str">"density"</span>,
    <span class="tok-str">"force"</span>,
    <span class="tok-str">"applyAndFinalize"</span>,
};

<span class="tok-comment">/// ECHO THE UNIFORM BACK OUT, exactly as the shader reads it.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Only THREE of the 20 Params fields have ever been verified to arrive (`count`, `n_cols`,</span>
<span class="tok-comment">/// `n_rows`) - and one of those was silently arriving as ZERO for who knows how long, from a</span>
<span class="tok-comment">/// whole-struct copy out of the uniform address space that dropped a member. Nothing has</span>
<span class="tok-comment">/// ever checked the other seventeen. A single wrong `h`, `r0` or `dt` would produce exactly</span>
<span class="tok-comment">/// what we are looking at: a fluid whose kernels are all provably correct and which still</span>
<span class="tok-comment">/// will not settle.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">paramEcho</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">if</span> (c.id != <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> b: u32 = echo_base;
    b_scratch[b + <span class="tok-num">0</span>] = .{ <span class="tok-fn">float</span>(c.params.count), c.params.dt };
    b_scratch[b + <span class="tok-num">1</span>] = .{ c.params.h, c.params.r0 };
    b_scratch[b + <span class="tok-num">2</span>] = .{ c.params.k_far, c.params.k_near };
    b_scratch[b + <span class="tok-num">3</span>] = .{ c.params.gravity_x, c.params.gravity_y };
    b_scratch[b + <span class="tok-num">4</span>] = .{ c.params.visc_beta, c.params.mouse_x };
    b_scratch[b + <span class="tok-num">5</span>] = .{ c.params.mouse_y, c.params.mouse_force };
    b_scratch[b + <span class="tok-num">6</span>] = .{ c.params.mouse_radius, c.params.dom_w };
    b_scratch[b + <span class="tok-num">7</span>] = .{ c.params.dom_h, <span class="tok-fn">float</span>(c.params.n_cols) };
    b_scratch[b + <span class="tok-num">8</span>] = .{ <span class="tok-fn">float</span>(c.params.n_rows), c.params.wall_normal_damp };
    b_scratch[b + <span class="tok-num">9</span>] = .{ c.params.wall_tangent_damp, <span class="tok-num">0.0</span> };
}

<span class="tok-kw">comptime</span> {
    k.<span class="tok-fn">installKernels</span>(<span class="tok-builtin">@This</span>());
}

<span class="tok-comment">// CPU oracle for the counting sort. The CPU twin runs the REAL @atomicRmw, so</span>
<span class="tok-comment">// this verifies the whole sort pipeline (count -&gt; prefix -&gt; scatter -&gt; copyback)</span>
<span class="tok-comment">// independent of the GPU: every particle must land in its own cell's contiguous</span>
<span class="tok-comment">// range, the ranges must tile [0, N), and density computed over the sorted grid</span>
<span class="tok-comment">// must match a brute-force O(N^2) density (the 3x3 of h-sized cells contains</span>
<span class="tok-comment">// every neighbour within h).</span>
<span class="tok-kw">test</span> <span class="tok-str">"counting sort: every particle in its cell range; density matches brute force"</span> {
    <span class="tok-kw">const</span> N: u32 = <span class="tok-num">2000</span>;
    <span class="tok-kw">const</span> h: f32 = interact_radius;
    <span class="tok-kw">const</span> params: Params = .{
        .count = N,
        .dt = <span class="tok-num">1.0</span>,
        .h = h,
        .r0 = <span class="tok-num">15.39</span>,
        .k_far = <span class="tok-num">0.009</span>,
        .k_near = <span class="tok-num">0.028</span>,
        .gravity_y = <span class="tok-num">0.097</span>,
        .visc_beta = <span class="tok-num">0.017</span>,
        .mouse_x = <span class="tok-num">0</span>,
        .mouse_y = <span class="tok-num">0</span>,
        .mouse_force = <span class="tok-num">0</span>,
        .mouse_radius = <span class="tok-num">90</span>,
        .dom_w = domain_w,
        .dom_h = domain_h,
        .n_cols = grid_cols,
        .n_rows = grid_rows,
    };
    <span class="tok-kw">var</span> rng: std.Random.DefaultPrng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0xC0FFEE</span>);
    <span class="tok-kw">const</span> r: std.Random = rng.<span class="tok-fn">random</span>();
    <span class="tok-kw">var</span> p: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (p &lt; N) : (p += <span class="tok-num">1</span>) {
        g.B.pos[p] = .{ r.<span class="tok-fn">float</span>(f32) * domain_w, r.<span class="tok-fn">float</span>(f32) * domain_h };
        <span class="tok-comment">// Distinctive per-particle encodings of pos so the post-sort check can</span>
        <span class="tok-comment">// catch a scatter/copyback that desyncs the arrays (a zero-velocity</span>
        <span class="tok-comment">// spawn would hide exactly that bug).</span>
        g.B.vel[p] = .{ g.B.pos[p][<span class="tok-num">0</span>] * <span class="tok-num">0.5</span>, g.B.pos[p][<span class="tok-num">1</span>] * <span class="tok-num">0.25</span> };
        g.B.prev[p] = .{ g.B.pos[p][<span class="tok-num">0</span>] + <span class="tok-num">7.0</span>, g.B.pos[p][<span class="tok-num">1</span>] - <span class="tok-num">3.0</span> };
    }
    <span class="tok-kw">const</span> cells: u32 = grid_cols * grid_rows;
    <span class="tok-kw">var</span> cell: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (cell &lt; cells) : (cell += <span class="tok-num">1</span>) {
        <span class="tok-fn">clearGrid</span>(.{ .id = cell, .params = params });
    }
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; N) : (i += <span class="tok-num">1</span>) {
        <span class="tok-fn">countGrid</span>(.{ .id = i, .params = params });
    }
    <span class="tok-fn">prefixSum</span>(.{ .id = <span class="tok-num">0</span>, .params = params });
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; N) : (i += <span class="tok-num">1</span>) {
        <span class="tok-fn">scatter</span>(.{ .id = i, .params = params });
    }
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; N) : (i += <span class="tok-num">1</span>) {
        <span class="tok-fn">copyback</span>(.{ .id = i, .params = params });
    }
    <span class="tok-comment">// Sentinel == N, ranges tile [0, N) and each particle sits in its cell.</span>
    <span class="tok-kw">try</span> <span class="tok-fn">expectEqual</span>(N, g.B.cell_start[cells]);
    <span class="tok-kw">var</span> seen: u32 = <span class="tok-num">0</span>;
    cell = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (cell &lt; cells) : (cell += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> start: u32 = g.B.cell_start[cell];
        <span class="tok-kw">const</span> end: u32 = g.B.cell_start[cell + <span class="tok-num">1</span>];
        <span class="tok-kw">try</span> <span class="tok-fn">expect</span>(end &gt;= start);
        <span class="tok-kw">var</span> kk: u32 = start;
        <span class="tok-kw">while</span> (kk &lt; end) : (kk += <span class="tok-num">1</span>) {
            <span class="tok-kw">try</span> <span class="tok-fn">expectEqual</span>(cell, <span class="tok-fn">cellOf</span>(g.B.pos[kk], grid_cols, grid_rows, h));
            <span class="tok-comment">// pos/vel/prev must stay synced through the sort (same particle).</span>
            <span class="tok-kw">try</span> <span class="tok-fn">expectEqual</span>(g.B.pos[kk][<span class="tok-num">0</span>] * <span class="tok-num">0.5</span>, g.B.vel[kk][<span class="tok-num">0</span>]);
            <span class="tok-kw">try</span> <span class="tok-fn">expectEqual</span>(g.B.pos[kk][<span class="tok-num">1</span>] * <span class="tok-num">0.25</span>, g.B.vel[kk][<span class="tok-num">1</span>]);
            <span class="tok-kw">try</span> <span class="tok-fn">expectEqual</span>(g.B.pos[kk][<span class="tok-num">0</span>] + <span class="tok-num">7.0</span>, g.B.prev[kk][<span class="tok-num">0</span>]);
            <span class="tok-kw">try</span> <span class="tok-fn">expectEqual</span>(g.B.pos[kk][<span class="tok-num">1</span>] - <span class="tok-num">3.0</span>, g.B.prev[kk][<span class="tok-num">1</span>]);
            seen += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">try</span> <span class="tok-fn">expectEqual</span>(N, seen);
    <span class="tok-comment">// density over the sorted grid must equal brute force.</span>
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; N) : (i += <span class="tok-num">1</span>) {
        <span class="tok-fn">density</span>(.{ .id = i, .params = params });
    }
    i = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; N) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> rho: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">var</span> rho_near: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">var</span> jj: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (jj &lt; N) : (jj += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (jj == i) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> sep: Vec2 = g.B.pos[jj] - g.B.pos[i];
            <span class="tok-kw">const</span> d2: f32 = <span class="tok-fn">dot</span>(sep, sep);
            <span class="tok-kw">if</span> (d2 &lt; h * h) {
                <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(d2);
                <span class="tok-kw">const</span> omq: f32 = <span class="tok-num">1.0</span> - dist / h;
                rho += omq * omq;
                rho_near += omq * omq * omq;
            }
        }
        <span class="tok-kw">try</span> <span class="tok-fn">expectApproxEqAbs</span>(rho, g.B.density[i][<span class="tok-num">0</span>], <span class="tok-num">1e-2</span>);
        <span class="tok-kw">try</span> <span class="tok-fn">expectApproxEqAbs</span>(rho_near, g.B.density[i][<span class="tok-num">1</span>], <span class="tok-num">1e-2</span>);
    }
}
