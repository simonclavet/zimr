<h1>directional_billboard</h1>
<figure class="code src-file" data-path="examples/directional_billboard/directional_billboard.zig" data-lines="251"><figcaption><span>examples/directional_billboard/directional_billboard.zig</span><span>251 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! directional_billboard - raylib's `models_directional_billboard`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A character sprite that (a) always faces the camera as a flat billboard</span>
<span class="tok-comment">//! and (b) picks its frame from a sprite ATLAS by the camera's angle around</span>
<span class="tok-comment">//! it - an 8-direction sprite, like the enemies in Doom: orbit the scene</span>
<span class="tok-comment">//! and you see the robot's front, side, back, etc. A second axis of the</span>
<span class="tok-comment">//! atlas is a 4-frame walk cycle advancing over time.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! raylib loads `skillbot.png`; standalones can't fetch external files, so</span>
<span class="tok-comment">//! the atlas here is generated procedurally (8 rows x 4 columns of a little</span>
<span class="tok-comment">//! directional robot). The engine addition this drove is a source-rect +</span>
<span class="tok-comment">//! anchor billboard (`z.drawBillboardRec`, raylib's `DrawBillboardPro`), so</span>
<span class="tok-comment">//! a billboard can frame one atlas cell and plant its feet on the ground.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> sinTurns = zm.sinTurns;

<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> pointVec = zm.pointVec;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> atan2Rad = zm.atan2Rad;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> dirs: u32 = <span class="tok-num">8</span>; <span class="tok-comment">// atlas rows: 8 view directions</span>
<span class="tok-kw">const</span> anims: u32 = <span class="tok-num">4</span>; <span class="tok-comment">// atlas columns: 4 walk-cycle frames</span>
<span class="tok-kw">const</span> cell: u32 = <span class="tok-num">32</span>; <span class="tok-comment">// pixels per atlas cell</span>

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    ui_host: z.UiHost,
    cam: z.OrbitCamera,
    atlas: z.WgpuTexture,
    anim: u32 = <span class="tok-num">0</span>,
    anim_timer: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.atlas.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> <span class="tok-fn">makeAtlas</span>(gpa);
    <span class="tok-kw">const</span> atlas: z.WgpuTexture = z.<span class="tok-fn">loadTextureFromImage</span>(f.gl, img);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadImage</span>(gpa, img);
    <span class="tok-kw">var</span> cam: z.OrbitCamera = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>), <span class="tok-num">4.0</span>);
    cam.yaw = <span class="tok-num">0.8</span>;
    cam.pitch = <span class="tok-num">0.35</span>;
    s.* = .{
        .font = font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .cam = cam,
        .atlas = atlas,
    };
}

<span class="tok-comment">/// Build the 4x8 procedural sprite atlas: for each (direction, frame) cell,</span>
<span class="tok-comment">/// draw a simple robot whose body orientation and a walk-bob depend on the cell.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">makeAtlas</span>(gpa: Allocator) !z.Image {
    <span class="tok-kw">const</span> w: u32 = anims * cell;
    <span class="tok-kw">const</span> h: u32 = dirs * cell;
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">genImageColor</span>(gpa, <span class="tok-builtin">@intCast</span>(w), <span class="tok-builtin">@intCast</span>(h), .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">0</span> });
    <span class="tok-kw">const</span> px: [*]u8 = <span class="tok-builtin">@ptrCast</span>(img.data.?);

    <span class="tok-kw">var</span> d: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (d &lt; dirs) : (d += <span class="tok-num">1</span>) {
        <span class="tok-comment">// Facing angle for this row (0 = toward viewer, sweeping around).</span>
        <span class="tok-kw">const</span> facing: f32 = <span class="tok-num">2.0</span> * pi * <span class="tok-fn">float</span>(d) / <span class="tok-fn">float</span>(dirs);
        <span class="tok-comment">// How much we see the "front" of the robot (1 = front, -1 = back).</span>
        <span class="tok-kw">const</span> frontness: f32 = <span class="tok-builtin">@cos</span>(facing);
        <span class="tok-kw">var</span> a: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (a &lt; anims) : (a += <span class="tok-num">1</span>) {
            <span class="tok-comment">// Walk bob: legs swing, body lifts a touch, per frame.</span>
            <span class="tok-kw">const</span> swing: f32 = <span class="tok-fn">sinTurns</span>(<span class="tok-fn">float</span>(a) / <span class="tok-fn">float</span>(anims));
            <span class="tok-fn">paintRobot</span>(px, w, a * cell, d * cell, frontness, swing);
        }
    }
    <span class="tok-kw">return</span> img;
}

<span class="tok-comment">/// Paint one robot cell at pixel offset (ox, oy). `frontness` in [-1,1] shades</span>
<span class="tok-comment">/// the "face" (front) brighter than the "back"; `swing` in [-1,1] offsets legs.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">paintRobot</span>(
    px: [*]u8,
    atlas_w: u32,
    ox: u32,
    oy: u32,
    frontness: f32,
    swing: f32,
) void {
    <span class="tok-kw">const</span> cf: f32 = <span class="tok-fn">float</span>(cell);
    <span class="tok-kw">var</span> y: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (y &lt; cell) : (y += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> x: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (x &lt; cell) : (x += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> u: f32 = (<span class="tok-fn">float</span>(x) + <span class="tok-num">0.5</span>) / cf; <span class="tok-comment">// 0..1 across</span>
            <span class="tok-kw">const</span> v: f32 = (<span class="tok-fn">float</span>(y) + <span class="tok-num">0.5</span>) / cf; <span class="tok-comment">// 0..1 down</span>
            <span class="tok-kw">var</span> col: ?[<span class="tok-num">3</span>]u8 = null;

            <span class="tok-comment">// Head: circle near the top-center.</span>
            <span class="tok-kw">if</span> (<span class="tok-fn">inDisc</span>(u, v, <span class="tok-num">0.5</span>, <span class="tok-num">0.28</span>, <span class="tok-num">0.16</span>)) {
                <span class="tok-kw">const</span> shade: u8 = <span class="tok-builtin">@round</span>(<span class="tok-num">150.0</span> + <span class="tok-num">60.0</span> * <span class="tok-fn">clamp</span>(frontness, -<span class="tok-num">1</span>, <span class="tok-num">1</span>));
                col = .{ shade, shade, <span class="tok-builtin">@min</span>(<span class="tok-builtin">@as</span>(u8, <span class="tok-num">255</span>), shade + <span class="tok-num">40</span>) };
                <span class="tok-comment">// A darker visor band only on front-ish views.</span>
                <span class="tok-kw">if</span> (frontness &gt; <span class="tok-num">0.2</span> <span class="tok-kw">and</span> v &gt; <span class="tok-num">0.24</span> <span class="tok-kw">and</span> v &lt; <span class="tok-num">0.30</span>) {
                    col = .{ <span class="tok-num">30</span>, <span class="tok-num">40</span>, <span class="tok-num">60</span> };
                }
            }
            <span class="tok-comment">// Body: rounded rectangle in the middle.</span>
            <span class="tok-kw">else</span> <span class="tok-kw">if</span> (u &gt; <span class="tok-num">0.34</span> <span class="tok-kw">and</span> u &lt; <span class="tok-num">0.66</span> <span class="tok-kw">and</span> v &gt; <span class="tok-num">0.42</span> <span class="tok-kw">and</span> v &lt; <span class="tok-num">0.72</span>) {
                <span class="tok-kw">const</span> shade: u8 = <span class="tok-builtin">@round</span>(<span class="tok-num">90.0</span> + <span class="tok-num">70.0</span> * <span class="tok-fn">clamp</span>(<span class="tok-num">0.5</span> + <span class="tok-num">0.5</span> * frontness, <span class="tok-num">0</span>, <span class="tok-num">1</span>));
                col = .{ shade, <span class="tok-builtin">@min</span>(<span class="tok-builtin">@as</span>(u8, <span class="tok-num">255</span>), shade + <span class="tok-num">30</span>), <span class="tok-num">200</span> };
            }
            <span class="tok-comment">// Legs: two bars at the bottom, offset by the walk swing.</span>
            <span class="tok-kw">else</span> <span class="tok-kw">if</span> (v &gt; <span class="tok-num">0.72</span> <span class="tok-kw">and</span> v &lt; <span class="tok-num">0.95</span>) {
                <span class="tok-kw">const</span> off: f32 = <span class="tok-num">0.05</span> * swing;
                <span class="tok-kw">const</span> left: bool = u &gt; <span class="tok-num">0.38</span> + off <span class="tok-kw">and</span> u &lt; <span class="tok-num">0.48</span> + off;
                <span class="tok-kw">const</span> right: bool = u &gt; <span class="tok-num">0.52</span> - off <span class="tok-kw">and</span> u &lt; <span class="tok-num">0.62</span> - off;
                <span class="tok-kw">if</span> (left <span class="tok-kw">or</span> right) {
                    col = .{ <span class="tok-num">70</span>, <span class="tok-num">80</span>, <span class="tok-num">110</span> };
                }
            }

            <span class="tok-kw">if</span> (col) |c| {
                <span class="tok-kw">const</span> gx: u32 = ox + x;
                <span class="tok-kw">const</span> gy: u32 = oy + y;
                <span class="tok-kw">const</span> i: usize = (<span class="tok-builtin">@as</span>(usize, gy) * atlas_w + gx) * <span class="tok-num">4</span>;
                px[i + <span class="tok-num">0</span>] = c[<span class="tok-num">0</span>];
                px[i + <span class="tok-num">1</span>] = c[<span class="tok-num">1</span>];
                px[i + <span class="tok-num">2</span>] = c[<span class="tok-num">2</span>];
                px[i + <span class="tok-num">3</span>] = <span class="tok-num">255</span>;
            }
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">inDisc</span>(u: f32, v: f32, cx: f32, cy: f32, r: f32) bool {
    <span class="tok-kw">const</span> dx: f32 = u - cx;
    <span class="tok-kw">const</span> dy: f32 = v - cy;
    <span class="tok-kw">return</span> dx * dx + dy * dy &lt;= r * r;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, common.palette.bg);

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, u.<span class="tok-fn">wantCaptureMouse</span>(), .{
        .min_distance = <span class="tok-num">2.0</span>,
        .max_distance = <span class="tok-num">14.0</span>,
        .fovy_deg = <span class="tok-num">45.0</span>,
    });

    <span class="tok-comment">// ---- advance the walk-cycle frame ----</span>
    s.anim_timer += <span class="tok-builtin">@floatCast</span>(f.time.delta_time);
    <span class="tok-kw">if</span> (s.anim_timer &gt; <span class="tok-num">0.16</span>) {
        s.anim_timer = <span class="tok-num">0</span>;
        s.anim = (s.anim + <span class="tok-num">1</span>) % anims;
    }

    <span class="tok-comment">// ---- pick the DIRECTION row from the camera's angle around the sprite ----</span>
    <span class="tok-kw">const</span> cp: Vec = cam.position;
    <span class="tok-comment">// Angle of the camera in the ground plane, relative to +X.</span>
    <span class="tok-kw">const</span> view_ang: f32 = <span class="tok-fn">atan2Rad</span>(cp[<span class="tok-num">2</span>], cp[<span class="tok-num">0</span>]);
    <span class="tok-comment">// Map to [0, dirs) and round to the nearest row.</span>
    <span class="tok-kw">var</span> dir_f: f32 = view_ang / (<span class="tok-num">2.0</span> * pi) * <span class="tok-fn">float</span>(dirs);
    dir_f = <span class="tok-builtin">@mod</span>(dir_f + <span class="tok-fn">float</span>(dirs), <span class="tok-fn">float</span>(dirs));
    <span class="tok-comment">// Round to the nearest row, then wrap: @round of a value near dirs-0.5 can</span>
    <span class="tok-comment">// land on `dirs` itself, which is one past the last row.</span>
    <span class="tok-kw">const</span> dir_rounded: u32 = <span class="tok-builtin">@round</span>(<span class="tok-builtin">@mod</span>(dir_f, <span class="tok-fn">float</span>(dirs)));
    <span class="tok-kw">const</span> dir: u32 = dir_rounded % dirs;

    <span class="tok-comment">// ---- camera basis for the billboard quad ----</span>
    <span class="tok-kw">const</span> ct: Vec = cam.target;
    <span class="tok-kw">const</span> fwd: [<span class="tok-num">3</span>]f32 = <span class="tok-fn">norm3</span>(.{ ct[<span class="tok-num">0</span>] - cp[<span class="tok-num">0</span>], ct[<span class="tok-num">1</span>] - cp[<span class="tok-num">1</span>], ct[<span class="tok-num">2</span>] - cp[<span class="tok-num">2</span>] });
    <span class="tok-kw">const</span> right: [<span class="tok-num">3</span>]f32 = <span class="tok-fn">norm3</span>(<span class="tok-fn">cross3</span>(fwd, .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> }));
    <span class="tok-kw">const</span> bup: [<span class="tok-num">3</span>]f32 = <span class="tok-fn">cross3</span>(right, fwd);

    <span class="tok-comment">// ---- UV sub-rect of the chosen atlas cell ----</span>
    <span class="tok-kw">const</span> uv_min: [<span class="tok-num">2</span>]f32 = .{ <span class="tok-fn">float</span>(s.anim) / <span class="tok-fn">float</span>(anims), <span class="tok-fn">float</span>(dir) / <span class="tok-fn">float</span>(dirs) };
    <span class="tok-kw">const</span> uv_max: [<span class="tok-num">2</span>]f32 = .{ <span class="tok-fn">float</span>(s.anim + <span class="tok-num">1</span>) / <span class="tok-fn">float</span>(anims), <span class="tok-fn">float</span>(dir + <span class="tok-num">1</span>) / <span class="tok-fn">float</span>(dirs) };

    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam);
    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">10</span>, <span class="tok-num">1.0</span>);
    <span class="tok-comment">// Feet on the ground: anchor {0.5, 0} plants the bottom edge on y=0.</span>
    z.<span class="tok-fn">drawBillboardRec</span>(
        f.gl,
        s.atlas,
        right,
        bup,
        <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-num">1.5</span>,
        <span class="tok-num">1.5</span>,
        uv_min,
        uv_max,
        .{ <span class="tok-num">0.5</span>, <span class="tok-num">0.0</span> },
        .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> },
    );
    z.<span class="tok-fn">endMode3D</span>(f.gl);

    <span class="tok-comment">// ---- HUD ----</span>
    <span class="tok-kw">var</span> buf: [<span class="tok-num">64</span>]u8 = undefined;
    <span class="tok-kw">const</span> hud: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"direction row: {d}   walk frame: {d}"</span>, .{ dir, s.anim }) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">14</span>, <span class="tok-num">42</span> }, hud, .{ .size = <span class="tok-num">18</span>, .color = common.palette.ink_dim, .font = &amp;s.font });
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"WebGPU 3D - directional billboard (orbit to see other sides)"</span>);
    s.ui_host.<span class="tok-fn">render</span>(f);
}

<span class="tok-kw">fn</span> <span class="tok-fn">norm3</span>(v: [<span class="tok-num">3</span>]f32) [<span class="tok-num">3</span>]f32 {
    <span class="tok-kw">const</span> l: f32 = <span class="tok-builtin">@sqrt</span>(v[<span class="tok-num">0</span>] * v[<span class="tok-num">0</span>] + v[<span class="tok-num">1</span>] * v[<span class="tok-num">1</span>] + v[<span class="tok-num">2</span>] * v[<span class="tok-num">2</span>]);
    <span class="tok-kw">if</span> (l &lt; <span class="tok-num">1.0e-6</span>) {
        <span class="tok-kw">return</span> .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> };
    }
    <span class="tok-kw">return</span> .{ v[<span class="tok-num">0</span>] / l, v[<span class="tok-num">1</span>] / l, v[<span class="tok-num">2</span>] / l };
}

<span class="tok-kw">fn</span> <span class="tok-fn">cross3</span>(a: [<span class="tok-num">3</span>]f32, b: [<span class="tok-num">3</span>]f32) [<span class="tok-num">3</span>]f32 {
    <span class="tok-kw">return</span> .{
        a[<span class="tok-num">1</span>] * b[<span class="tok-num">2</span>] - a[<span class="tok-num">2</span>] * b[<span class="tok-num">1</span>],
        a[<span class="tok-num">2</span>] * b[<span class="tok-num">0</span>] - a[<span class="tok-num">0</span>] * b[<span class="tok-num">2</span>],
        a[<span class="tok-num">0</span>] * b[<span class="tok-num">1</span>] - a[<span class="tok-num">1</span>] * b[<span class="tok-num">0</span>],
    };
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - directional billboard"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },

    .init = initState,

    .deinit = deinit,

};
