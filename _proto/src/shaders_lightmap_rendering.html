<h1>shaders_lightmap_rendering</h1>
<figure class="code src-file" data-path="examples/shaders_lightmap_rendering/shaders_lightmap_rendering.zig" data-lines="529"><figcaption><span>examples/shaders_lightmap_rendering/shaders_lightmap_rendering.zig</span><span>529 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! shaders_lightmap_rendering - port of raylib's lightmap demo, expanded into a</span>
<span class="tok-comment">//! proper "why lightmaps exist" showcase: a STATIC scene lit by ~30 coloured</span>
<span class="tok-comment">//! point lights whose lighting - including the SHADOWS the static cubes cast on</span>
<span class="tok-comment">//! the floor - is BAKED into a texture once at load, then sampled for free at</span>
<span class="tok-comment">//! runtime. Runtime lighting cost: one texture fetch. Zero lights are evaluated</span>
<span class="tok-comment">//! per frame.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The floor still demonstrates the engine's uv2 path (the reason this example</span>
<span class="tok-comment">//! exists): a ground quad carries pos + uv + uv2 (the reserved texcoord2 attr at</span>
<span class="tok-comment">//! location 5); the primary uv tiles a subtle checker, the second uv2 samples</span>
<span class="tok-comment">//! the baked lightmap, and the fragment shader multiplies them -</span>
<span class="tok-comment">//! base(uv) x lightmap(uv2). The static cubes are drawn with the ordinary 3D</span>
<span class="tok-comment">//! immediate path in the SAME pass (shared depth), each tinted by the baked</span>
<span class="tok-comment">//! light sampled at its position - so a cube sitting in a red pool glows red.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The bake (`bakeLightmapPixels`) is the star: for every lightmap texel it sums</span>
<span class="tok-comment">//! all lights with distance falloff AND ray-marches each texel-&gt;light segment</span>
<span class="tok-comment">//! against every cube AABB to carve out shadows. That's the expensive</span>
<span class="tok-comment">//! precomputation a real lightmapper does offline; here it runs once at init.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> pointVec = zm.pointVec;
<span class="tok-kw">const</span> f32x4 = zm.f32x4;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> identity = zm.identity;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> si = <span class="tok-builtin">@import</span>(<span class="tok-str">"shader_interface"</span>);

<span class="tok-kw">const</span> vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"lightmap_vs_io.zig"</span>);
<span class="tok-kw">const</span> vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"lightmap_vs.wgsl"</span>);
<span class="tok-kw">const</span> fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"lightmap_fs.wgsl"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">/// Merged schema for `loadShader` (VS uniform + FS samplers can't both go</span>
<span class="tok-comment">/// through `loadShaderVF`; see cube_demo). Mirrors lightmap_vs_io.Ubo +</span>
<span class="tok-comment">/// lightmap_fs_io.Samplers so the generated WGSL's binding slots line up.</span>
<span class="tok-kw">const</span> LightmapSchema = <span class="tok-kw">struct</span> {
    <span class="tok-kw">pub</span> <span class="tok-kw">const</span> Ubo = <span class="tok-kw">struct</span> {
        mvp: [<span class="tok-num">4</span>]Vec = .{
            .{ <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
            .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
            .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> },
            .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> },
        },
    };
    <span class="tok-kw">pub</span> <span class="tok-kw">const</span> Samplers = <span class="tok-kw">struct</span> {
        base: si.<span class="tok-fn">Sampler2D</span>(.albedo, .{}),
        lightmap: si.<span class="tok-fn">Sampler2D</span>(.emission, .{}),
    };
};

<span class="tok-kw">const</span> plane_half: f32 = <span class="tok-num">4.0</span>; <span class="tok-comment">// floor spans [-4, 4] -&gt; 8x8 units</span>
<span class="tok-kw">const</span> base_tiles: f32 = <span class="tok-num">8.0</span>; <span class="tok-comment">// subtle checker repeats 8x across the floor</span>
<span class="tok-kw">const</span> tex_dim: u32 = <span class="tok-num">256</span>; <span class="tok-comment">// lightmap resolution</span>
<span class="tok-kw">const</span> num_lights: usize = <span class="tok-num">30</span>;
<span class="tok-kw">const</span> num_cubes: usize = <span class="tok-num">11</span>;
<span class="tok-kw">const</span> ambient: Vec = <span class="tok-fn">f32x4</span>(<span class="tok-num">0.05</span>, <span class="tok-num">0.06</span>, <span class="tok-num">0.10</span>, <span class="tok-num">0</span>); <span class="tok-comment">// dark cool ambient floor</span>

<span class="tok-kw">const</span> Light = <span class="tok-kw">struct</span> {
    pos: Vec,
    color: Vec, <span class="tok-comment">// rgb in xyz</span>
    intensity: f32,
};

<span class="tok-kw">const</span> Cube = <span class="tok-kw">struct</span> {
    center: Vec, <span class="tok-comment">// some sit on the floor (center.y = half.y), some float above</span>
    half: Vec, <span class="tok-comment">// half-extents</span>
    face_tint: [<span class="tok-num">6</span>]Vec, <span class="tok-comment">// baked light colour per face (+X,-X,+Y,-Y,+Z,-Z)</span>
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    shader: z.shader.<span class="tok-fn">LoadedShader</span>(LightmapSchema),
    vbo: z.wgpu.BufferHandle,
    ibo: z.wgpu.BufferHandle,
    base_tex: z.WgpuTexture,
    lightmap_tex: z.WgpuTexture,
    cam: z.OrbitCamera,
    cubes: [num_cubes]Cube,
};

<span class="tok-comment">/// Tiny deterministic LCG so the scene is identical every run (and headlessly</span>
<span class="tok-comment">/// reproducible) without pulling in the RNG machinery.</span>
<span class="tok-kw">const</span> Rng = <span class="tok-kw">struct</span> {
    state: u32 = <span class="tok-num">0x1234567</span>,
    <span class="tok-kw">fn</span> <span class="tok-fn">next</span>(self: *Rng) f32 {

<span class="tok-comment">/// Slab test: does the segment origin-&gt;(origin + dir*max_t) pierce the AABB?</span>
<span class="tok-kw">fn</span> <span class="tok-fn">segmentHitsAabb</span>(
    origin: Vec,
    dir: Vec,
    max_t: f32,
    c_min: Vec,
    c_max: Vec,
) bool {
    <span class="tok-kw">var</span> t0: f32 = <span class="tok-num">0.0</span>;
    <span class="tok-kw">var</span> t1: f32 = max_t;
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">3</span>) |axis| {
        <span class="tok-kw">const</span> d: f32 = dir[axis];
        <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(d) &lt; <span class="tok-num">1e-6</span>) {
            <span class="tok-kw">if</span> (origin[axis] &lt; c_min[axis] <span class="tok-kw">or</span> origin[axis] &gt; c_max[axis]) {
                <span class="tok-kw">return</span> false;
            }
        } <span class="tok-kw">else</span> {
            <span class="tok-kw">const</span> inv: f32 = <span class="tok-num">1.0</span> / d;
            <span class="tok-kw">var</span> ta: f32 = (c_min[axis] - origin[axis]) * inv;
            <span class="tok-kw">var</span> tb: f32 = (c_max[axis] - origin[axis]) * inv;
            <span class="tok-kw">if</span> (ta &gt; tb) {
                <span class="tok-kw">const</span> tmp: f32 = ta;
                ta = tb;
                tb = tmp;
            }
            <span class="tok-kw">if</span> (ta &gt; t0) {
                t0 = ta;
            }
            <span class="tok-kw">if</span> (tb &lt; t1) {
                t1 = tb;
            }
            <span class="tok-kw">if</span> (t0 &gt; t1) {
                <span class="tok-kw">return</span> false;
            }
        }
    }
    <span class="tok-kw">return</span> true;
}

<span class="tok-comment">/// Accumulate all lights at a world point, with distance falloff and - if</span>

<span class="tok-comment">/// per-texel work the bake repeats hundreds of thousands of times.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">lightAt</span>(
    world: Vec,
    lights: []<span class="tok-kw">const</span> Light,
    cubes: []<span class="tok-kw">const</span> Cube,
    occlude: bool,
    skip: i32,
) Vec {
    <span class="tok-kw">var</span> acc: Vec = ambient;

        <span class="tok-kw">if</span> (dist &lt; <span class="tok-num">1e-4</span>) {

        }
        <span class="tok-kw">const</span> dir: Vec = lv / <span class="tok-fn">splat</span>(dist);
        <span class="tok-kw">const</span> atten: f32 = lt.intensity / (<span class="tok-num">0.4</span> + <span class="tok-num">0.25</span> * dist * dist);
        <span class="tok-kw">var</span> shadow: f32 = <span class="tok-num">1.0</span>;
        <span class="tok-kw">if</span> (occlude) {
            <span class="tok-kw">const</span> origin: Vec = world + dir * <span class="tok-fn">splat</span>(<span class="tok-num">0.02</span>); <span class="tok-comment">// nudge off the surface</span>
            <span class="tok-kw">var</span> ci: usize = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (ci &lt; cubes.len) : (ci += <span class="tok-num">1</span>) {
                <span class="tok-kw">if</span> (<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(ci)) == skip) {
                    <span class="tok-kw">continue</span>;

                <span class="tok-kw">const</span> cmin: Vec = cubes[ci].center - cubes[ci].half;
                <span class="tok-kw">const</span> cmax: Vec = cubes[ci].center + cubes[ci].half;
                <span class="tok-kw">if</span> (<span class="tok-fn">segmentHitsAabb</span>(origin, dir, dist - <span class="tok-num">0.04</span>, cmin, cmax)) {

    <span class="tok-comment">// past 1.0 in every channel and clamps to white, washing out all colour;</span>
    <span class="tok-comment">// acc/(acc+1) compresses to [0,1) while preserving hue, so a spot dominated</span>
    <span class="tok-comment">// by a red light stays red instead of saturating to white.</span>
    <span class="tok-kw">return</span> acc / (acc + <span class="tok-fn">splat</span>(<span class="tok-num">1.0</span>));

<span class="tok-comment">/// Baked colour for one cube face: sum only the lights on this face's side (so</span>

        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(lv[<span class="tok-num">0</span>] * lv[<span class="tok-num">0</span>] + lv[<span class="tok-num">1</span>] * lv[<span class="tok-num">1</span>] + lv[<span class="tok-num">2</span>] * lv[<span class="tok-num">2</span>]);
        <span class="tok-kw">if</span> (dist &lt; <span class="tok-num">1e-4</span>) {

            <span class="tok-kw">continue</span>; <span class="tok-comment">// light behind this face</span>
        }
        <span class="tok-kw">const</span> atten: f32 = lt.intensity / (<span class="tok-num">0.4</span> + <span class="tok-num">0.25</span> * dist * dist);

<span class="tok-comment">/// Draw a cube as 6 flat-shaded faces, each with its baked colour, via the</span>

        <span class="tok-kw">const</span> t: Vec = cube.face_tint[fi];
        <span class="tok-kw">const</span> r: u8 = <span class="tok-fn">toU8</span>(t[<span class="tok-num">0</span>]);
        <span class="tok-kw">const</span> g: u8 = <span class="tok-fn">toU8</span>(t[<span class="tok-num">1</span>]);
        <span class="tok-kw">const</span> b: u8 = <span class="tok-fn">toU8</span>(t[<span class="tok-num">2</span>]);
        <span class="tok-kw">const</span> c0: Vec = cube.center + cube_faces[fi].corners[<span class="tok-num">0</span>] * cube.half;
        <span class="tok-kw">const</span> c1: Vec = cube.center + cube_faces[fi].corners[<span class="tok-num">1</span>] * cube.half;
        <span class="tok-kw">const</span> c2: Vec = cube.center + cube_faces[fi].corners[<span class="tok-num">2</span>] * cube.half;
        <span class="tok-kw">const</span> c3: Vec = cube.center + cube_faces[fi].corners[<span class="tok-num">3</span>] * cube.half;
        z.<span class="tok-fn">drawTriangle3D</span>(gl, c0, c1, c2, .{ .r = r, .g = g, .b = b, .a = <span class="tok-num">255</span> });
        z.<span class="tok-fn">drawTriangle3D</span>(gl, c0, c2, c3, .{ .r = r, .g = g, .b = b, .a = <span class="tok-num">255</span> });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">toU8</span>(x: f32) u8 {
    <span class="tok-kw">const</span> c: f32 = <span class="tok-kw">if</span> (x &lt; <span class="tok-num">0</span>) <span class="tok-num">0</span> <span class="tok-kw">else</span> <span class="tok-kw">if</span> (x &gt; <span class="tok-num">1</span>) <span class="tok-num">1</span> <span class="tok-kw">else</span> x;
    <span class="tok-kw">return</span> <span class="tok-builtin">@round</span>(c * <span class="tok-num">255.0</span>);
}

<span class="tok-comment">/// A near-white checker so the baked light colour dominates the look.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">makeBasePixels</span>(gpa: Allocator) ![]u8 {
    <span class="tok-kw">const</span> px: []u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u8, tex_dim * tex_dim * <span class="tok-num">4</span>);
    <span class="tok-kw">const</span> cell: u32 = tex_dim / <span class="tok-num">8</span>;
    <span class="tok-kw">var</span> y: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (y &lt; tex_dim) : (y += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> x: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (x &lt; tex_dim) : (x += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> light_cell: bool = ((x / cell) + (y / cell)) % <span class="tok-num">2</span> == <span class="tok-num">0</span>;
            <span class="tok-kw">const</span> i: usize = (y * tex_dim + x) * <span class="tok-num">4</span>;
            <span class="tok-kw">const</span> v: u8 = <span class="tok-kw">if</span> (light_cell) <span class="tok-num">225</span> <span class="tok-kw">else</span> <span class="tok-num">190</span>;
            px[i] = v;
            px[i + <span class="tok-num">1</span>] = v;
            px[i + <span class="tok-num">2</span>] = v;
            px[i + <span class="tok-num">3</span>] = <span class="tok-num">255</span>;
        }
    }
    <span class="tok-kw">return</span> px;
}

<span class="tok-comment">/// THE BAKE: every texel = summed many-light lighting + cube shadows. Expensive,</span>
<span class="tok-comment">/// done once. Returns the pixels; caller owns them.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">bakeLightmapPixels</span>(
    gpa: Allocator,
    lights: []<span class="tok-kw">const</span> Light,
    cubes: []<span class="tok-kw">const</span> Cube,
) ![]u8 {
    <span class="tok-kw">const</span> px: []u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u8, tex_dim * tex_dim * <span class="tok-num">4</span>);
    <span class="tok-kw">const</span> dimf: f32 = <span class="tok-fn">float</span>(tex_dim - <span class="tok-num">1</span>);
    <span class="tok-kw">var</span> ty: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (ty &lt; tex_dim) : (ty += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> v: f32 = <span class="tok-fn">float</span>(ty) / dimf;
        <span class="tok-kw">const</span> wz: f32 = -plane_half + <span class="tok-num">2.0</span> * plane_half * v;
        <span class="tok-kw">var</span> tx: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (tx &lt; tex_dim) : (tx += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> u: f32 = <span class="tok-fn">float</span>(tx) / dimf;
            <span class="tok-kw">const</span> wx: f32 = -plane_half + <span class="tok-num">2.0</span> * plane_half * u;
            <span class="tok-kw">const</span> world: Vec = <span class="tok-fn">f32x4</span>(wx, <span class="tok-num">0.0</span>, wz, <span class="tok-num">0</span>);
            <span class="tok-kw">const</span> lit: Vec = <span class="tok-fn">lightAt</span>(world, lights, cubes, true, -<span class="tok-num">1</span>);
            <span class="tok-kw">const</span> i: usize = (ty * tex_dim + tx) * <span class="tok-num">4</span>;
            px[i] = <span class="tok-fn">toU8</span>(lit[<span class="tok-num">0</span>]);
            px[i + <span class="tok-num">1</span>] = <span class="tok-fn">toU8</span>(lit[<span class="tok-num">1</span>]);
            px[i + <span class="tok-num">2</span>] = <span class="tok-fn">toU8</span>(lit[<span class="tok-num">2</span>]);
            px[i + <span class="tok-num">3</span>] = <span class="tok-num">255</span>;
        }
    }
    <span class="tok-kw">return</span> px;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> lights: [num_lights]Light = <span class="tok-fn">buildLights</span>();
    <span class="tok-kw">var</span> cubes: [num_cubes]Cube = <span class="tok-fn">buildCubes</span>();
    <span class="tok-comment">// Bake 6 per-face colours per cube (each shadowed by the OTHER cubes) - the</span>
    <span class="tok-comment">// face-level cube-on-cube shadowing.</span>
    <span class="tok-kw">var</span> ci: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (ci &lt; num_cubes) : (ci += <span class="tok-num">1</span>) {
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">6</span>) |fi| {
            <span class="tok-kw">const</span> fc: Vec = cubes[ci].center + cube_faces[fi].n * cubes[ci].half;
            cubes[ci].face_tint[fi] = <span class="tok-fn">faceColor</span>(fc, cube_faces[fi].n, &amp;lights, &amp;cubes, <span class="tok-builtin">@intCast</span>(ci));
        }
    }

    <span class="tok-comment">// Ground quad: pos(3), uv(2), uv2(2). uv tiles the checker; uv2 spans 0..1.</span>
    <span class="tok-kw">const</span> h: f32 = plane_half;
    <span class="tok-kw">const</span> t: f32 = base_tiles;
    <span class="tok-kw">const</span> verts = [_]f32{
        -h, <span class="tok-num">0</span>, -h, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>,
        h,  <span class="tok-num">0</span>, -h, t, <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>,
        h,  <span class="tok-num">0</span>, h,  t, t, <span class="tok-num">1</span>, <span class="tok-num">1</span>,
        -h, <span class="tok-num">0</span>, h,  <span class="tok-num">0</span>, t, <span class="tok-num">0</span>, <span class="tok-num">1</span>,
    };
    <span class="tok-kw">const</span> idx = [_]u16{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span> };
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = verts.len * <span class="tok-builtin">@sizeOf</span>(f32),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"lightmap_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(verts[<span class="tok-num">0</span>..]));
    <span class="tok-kw">const</span> ibo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = idx.len * <span class="tok-builtin">@sizeOf</span>(u16),
        .usage = .{ .index = true, .copy_dst = true },
        .label = <span class="tok-str">"lightmap_ibo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, ibo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(idx[<span class="tok-num">0</span>..]));

    <span class="tok-kw">const</span> base_px: []u8 = <span class="tok-kw">try</span> <span class="tok-fn">makeBasePixels</span>(gpa);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(base_px);
    <span class="tok-kw">const</span> base_tex: z.WgpuTexture = z.WgpuTexture.<span class="tok-fn">createFromPixels</span>(f.gpu.device, f.gpu.queue, .{
        .width = tex_dim,
        .height = tex_dim,
        .pixels = base_px,
        .mag_filter_linear = true,
        .min_filter_linear = true,
        .address_mode = .repeat,
        .label = <span class="tok-str">"lightmap_base"</span>,
    });

    <span class="tok-kw">const</span> lm_px: []u8 = <span class="tok-kw">try</span> <span class="tok-fn">bakeLightmapPixels</span>(gpa, &amp;lights, &amp;cubes);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(lm_px);
    <span class="tok-kw">const</span> lightmap_tex: z.WgpuTexture = z.WgpuTexture.<span class="tok-fn">createFromPixels</span>(f.gpu.device, f.gpu.queue, .{
        .width = tex_dim,
        .height = tex_dim,
        .pixels = lm_px,
        .mag_filter_linear = true,
        .min_filter_linear = true,
        .address_mode = .clamp_to_edge,
        .label = <span class="tok-str">"lightmap_baked"</span>,
    });

    <span class="tok-kw">const</span> shader: z.shader.<span class="tok-fn">LoadedShader</span>(LightmapSchema) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShader</span>(LightmapSchema, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = vs_wgsl,
        .fs_wgsl_source = fs_wgsl,
        .vertex_buffer_layouts = &amp;.{z.shader.<span class="tok-fn">vertexLayout</span>(vs_io)},
        .depth_state = .less_equal,
        .initial_ubo = .{ .mvp = <span class="tok-fn">identity</span>() },
        .textures = .{ .base = base_tex, .lightmap = lightmap_tex },
        .label = <span class="tok-str">"shaders_lightmap_rendering"</span>,
    });

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .shader = shader,
        .vbo = vbo,
        .ibo = ibo,
        .base_tex = base_tex,
        .lightmap_tex = lightmap_tex,
        .cam = .{ .target = <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.3</span>, <span class="tok-num">0</span>), .distance = <span class="tok-num">11.0</span>, .pitch = <span class="tok-num">0.5</span>, .yaw = <span class="tok-num">0.7</span> },
        .cubes = cubes,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.shader.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.ibo);
    s.base_tex.<span class="tok-fn">deinit</span>();
    s.lightmap_tex.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> aspect: f32 = f.window.<span class="tok-fn">widthf</span>() / <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, false, .{ .fovy_deg = <span class="tok-num">50</span> });
    <span class="tok-comment">// ONE view_proj shared by the custom floor pipeline AND the immediate cubes.</span>
    <span class="tok-comment">// beginMode3D builds its own with near/far 0.01/1000; if the floor used a</span>
    <span class="tok-comment">// different near/far its depth values wouldn't be comparable to the cubes'</span>
    <span class="tok-comment">// and the floor would paint over them. So compute it once (matching those</span>
    <span class="tok-comment">// planes) and feed the cubes the SAME matrix via beginMode3DMatrix.</span>
    <span class="tok-kw">const</span> vp: [<span class="tok-num">4</span>]Vec = cam.<span class="tok-fn">viewProj</span>(aspect, <span class="tok-num">0.01</span>, <span class="tok-num">1000.0</span>);
    s.shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .mvp = vp });

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">6</span>, .g = <span class="tok-num">7</span>, .b = <span class="tok-num">12</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-comment">// 1. the lit floor - custom uv2 pipeline, bracketed inside f.gl's pass.</span>
    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    f.gl.<span class="tok-fn">flushBeforeMaterialSwap</span>();
    s.shader.<span class="tok-fn">bindForDraw</span>(ps);
    s.shader.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, <span class="tok-num">4</span> * <span class="tok-num">7</span> * <span class="tok-builtin">@sizeOf</span>(f32));
    s.shader.<span class="tok-fn">setIndex</span>(ps, s.ibo, .uint16, <span class="tok-num">6</span> * <span class="tok-builtin">@sizeOf</span>(u16));
    s.shader.<span class="tok-fn">drawIndexed</span>(ps, <span class="tok-num">6</span>, <span class="tok-num">1</span>);
    f.gl.<span class="tok-fn">renderer</span>().<span class="tok-fn">bindForPass</span>(ps);

    <span class="tok-comment">// 2. the static cubes - ordinary 3D immediate path, SAME pass + depth + the</span>
    <span class="tok-comment">//    SAME view_proj as the floor. Each is tinted by the baked light at its</span>
    <span class="tok-comment">//    position.</span>
    z.<span class="tok-fn">beginMode3DMatrix</span>(f.gl, vp);
    <span class="tok-kw">for</span> (s.cubes) |cube| {
        <span class="tok-fn">drawLitCube</span>(f.gl, cube);
    }
    z.<span class="tok-fn">endMode3D</span>(f.gl);

    <span class="tok-comment">// 3. HUD.</span>
    <span class="tok-kw">var</span> buf: [<span class="tok-num">96</span>]u8 = undefined;
    <span class="tok-kw">const</span> line: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(
        &amp;buf,
        <span class="tok-str">"{d} coloured lights + baked shadows from {d} static cubes"</span>,
        .{ num_lights, num_cubes },
    ) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">16</span> }, <span class="tok-str">"lightmap: baked many-light scene"</span>, .{
        .size = <span class="tok-num">24</span>,
        .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> },
        .font = &amp;s.font,
    });
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">16</span>, <span class="tok-num">46</span> }, line, .{
        .size = <span class="tok-num">16</span>,
        .color = .{ .r = <span class="tok-num">170</span>, .g = <span class="tok-num">180</span>, .b = <span class="tok-num">200</span>, .a = <span class="tok-num">255</span> },
        .font = &amp;s.font,
    });
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"runtime lighting cost: 1 texture fetch, 0 lights - it's all in the lightmap"</span>);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - lightmap rendering"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .update = update,
    .deinit = deinit,
};

<span class="tok-comment">//! sampled with the (possibly tiled) primary uv; the lightmap with the second</span>
<span class="tok-comment">//! uv set, so precomputed lighting modulates the surface independently of how</span>

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {

<figure class="code src-file" data-path="examples/lightmap_vs.zig" data-lines="24"><figcaption><span>examples/lightmap_vs.zig</span><span>24 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! lightmap_vs.zig - transform the plane by MVP and pass BOTH uv sets through</span>
<span class="tok-comment">//! to the fragment stage (base uv + lightmap uv2).</span>
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> mulMatPoint = zm.mulMatPoint;
