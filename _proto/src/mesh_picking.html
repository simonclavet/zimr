<h1>mesh_picking</h1>
<figure class="code src-file" data-path="examples/mesh_picking/mesh_picking.zig" data-lines="690"><figcaption><span>examples/mesh_picking/mesh_picking.zig</span><span>690 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! mesh_picking - raylib's `models_mesh_picking`, the zimr way.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Tap anything: the tap becomes a world-space ray</span>
<span class="tok-comment">//! (`getScreenToWorldRay`, new this port), and the ray is tested</span>
<span class="tok-comment">//! against each object with the collision routine that fits it - the</span>
<span class="tok-comment">//! ground through `getRayCollisionQuad`, the cube through</span>
<span class="tok-comment">//! `getRayCollisionBox` (its AABB), the sphere analytically through</span>
<span class="tok-comment">//! `getRayCollisionSphere`, and the spinning torus through the real</span>
<span class="tok-comment">//! thing, `getRayCollisionMesh`, which walks the triangles with the</span>
<span class="tok-comment">//! torus's live model matrix so the hit is exact WHILE it rotates.</span>
<span class="tok-comment">//! Closest hit wins; the winner glows, a small marker cube sits on the</span>
<span class="tok-comment">//! hit point, and the panel reports what you hit and how far away.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Phone-first: raylib picks on hover, which fingers don't have.  Here</span>
<span class="tok-comment">//! a PICK is a tap - press and release with less than a knuckle of</span>
<span class="tok-comment">//! drag - so the one-finger orbit and pinch zoom keep working.</span>
<span class="tok-comment">//! Rendering is the shared forward stack: `gbuffer_vs` + `fog_fs` at</span>
<span class="tok-comment">//! density 0 (plain Lambert), one pipeline for everything including</span>
<span class="tok-comment">//! the marker.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> rotationY = zm.rotationY;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-kw">const</span> mat_vs = z.deferred_shaders.gbuffer_vs;
<span class="tok-kw">const</span> mat_fs = z.fog_shader; <span class="tok-comment">// density 0 = plain lambert+blinn</span>

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> gbuffer_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"gbuffer_vs.wgsl"</span>);
<span class="tok-kw">const</span> fog_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"fog_fs.wgsl"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> VsUbo = <span class="tok-builtin">@FieldType</span>(mat_vs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> FsUbo = <span class="tok-builtin">@FieldType</span>(mat_fs.Io, <span class="tok-str">"u"</span>);

<span class="tok-kw">const</span> bg_clear: Color = .{ .r = <span class="tok-num">24</span>, .g = <span class="tok-num">26</span>, .b = <span class="tok-num">32</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> sun_dir: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0.4</span>, <span class="tok-num">0.85</span>, <span class="tok-num">0.5</span> };
<span class="tok-kw">const</span> fovy_rad: f32 = <span class="tok-num">0.8</span>;

<span class="tok-comment">/// Which pickable a draw slot is; the marker rides along as a slot too.</span>
<span class="tok-kw">const</span> Pickable = <span class="tok-kw">enum</span> { ground, cube, sphere, torus, marker };
<span class="tok-kw">const</span> pick_names = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"ground"</span>, <span class="tok-str">"cube"</span>, <span class="tok-str">"sphere"</span>, <span class="tok-str">"torus"</span>, <span class="tok-str">"-"</span> };

<span class="tok-kw">const</span> cube_center: [<span class="tok-num">3</span>]f32 = .{ -<span class="tok-num">1.6</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.2</span> };
<span class="tok-kw">const</span> cube_half: f32 = <span class="tok-num">0.5</span>;
<span class="tok-kw">const</span> sphere_center: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">1.6</span>, <span class="tok-num">0.62</span>, <span class="tok-num">0.3</span> };
<span class="tok-kw">const</span> sphere_radius: f32 = <span class="tok-num">0.62</span>;
<span class="tok-kw">const</span> torus_center: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.55</span>, -<span class="tok-num">1.6</span> };

<span class="tok-kw">const</span> MeshVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    position: [<span class="tok-num">3</span>]f32,
    normal: [<span class="tok-num">3</span>]f32,
};

<span class="tok-kw">const</span> up_n: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> };
<span class="tok-kw">const</span> ground_half: f32 = <span class="tok-num">4.0</span>;
<span class="tok-kw">const</span> ground_verts = [_]MeshVertex{
    .{ .position = .{ -ground_half, <span class="tok-num">0</span>, -ground_half }, .normal = up_n },
    .{ .position = .{ ground_half, <span class="tok-num">0</span>, -ground_half }, .normal = up_n },
    .{ .position = .{ ground_half, <span class="tok-num">0</span>, ground_half }, .normal = up_n },
    .{ .position = .{ -ground_half, <span class="tok-num">0</span>, ground_half }, .normal = up_n },
};
<span class="tok-kw">const</span> ground_indices = [_]u32{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span> };

<span class="tok-comment">/// A generated mesh uploaded to the GPU (interleaved pos+normal + u32 ibo).</span>
<span class="tok-kw">const</span> GpuMesh = <span class="tok-kw">struct</span> {
    vbo: z.wgpu.BufferHandle,
    ibo: z.wgpu.BufferHandle,
    vbo_bytes: u64,
    ibo_bytes: u64,
    icount: u32,
};

<span class="tok-kw">fn</span> <span class="tok-fn">uploadMesh</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    queue: z.wgpu.QueueHandle,
    mesh: z.Mesh,
    label: []<span class="tok-kw">const</span> u8,
) !GpuMesh {
    <span class="tok-kw">const</span> vcount: usize = <span class="tok-builtin">@intCast</span>(mesh.vertexCount);
    <span class="tok-kw">const</span> verts: []MeshVertex = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(MeshVertex, vcount);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(verts);
    <span class="tok-kw">for</span> (verts, <span class="tok-num">0</span>..) |*v, i| {
        v.* = .{
            .position = .{ mesh.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>], mesh.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>], mesh.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] },
            .normal = .{ mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>], mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>], mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] },
        };
    }
    <span class="tok-kw">const</span> icount: usize = <span class="tok-builtin">@as</span>(usize, <span class="tok-builtin">@intCast</span>(mesh.triangleCount)) * <span class="tok-num">3</span>;
    <span class="tok-kw">const</span> indices: []u32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(u32, icount);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(indices);
    <span class="tok-kw">if</span> (mesh.indices != null) {
        <span class="tok-kw">for</span> (indices, <span class="tok-num">0</span>..) |*ix, i| {
            ix.* = mesh.indices[i];
        }
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">for</span> (indices, <span class="tok-num">0</span>..) |*ix, i| {
            ix.* = <span class="tok-builtin">@intCast</span>(i);
        }
    }
    <span class="tok-kw">return</span> .{
        .vbo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(verts),
            .{ .vertex = true, .copy_dst = true },
            label,
        ),
        .ibo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(indices),
            .{ .index = true, .copy_dst = true },
            label,
        ),
        .vbo_bytes = verts.len * <span class="tok-builtin">@sizeOf</span>(MeshVertex),
        .ibo_bytes = indices.len * <span class="tok-builtin">@sizeOf</span>(u32),
        .icount = <span class="tok-builtin">@intCast</span>(icount),
    };
}

<span class="tok-kw">const</span> Obj = <span class="tok-kw">struct</span> {
    mesh: GpuMesh,
    vs_ubo: z.wgpu.BufferHandle,
    g0_bg: z.wgpu.BindGroupHandle,
    fs_ubo: z.wgpu.BufferHandle,
    g2_bg: z.wgpu.BindGroupHandle,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    pipeline: z.wgpu.RenderPipelineHandle,
    empty_bg: z.wgpu.BindGroupHandle,
    objs: [<span class="tok-num">5</span>]Obj, <span class="tok-comment">// ground, cube, sphere, torus, marker</span>

    <span class="tok-comment">// The torus's CPU-side triangles STAY resident - getRayCollisionMesh</span>
    <span class="tok-comment">// walks them on every tap (the GPU copy can't be read back cheaply).</span>
    torus_cpu: z.Mesh,

    rt: z.RenderTexture,
    ui_host: z.UiHost,
    font: z.Font,

    picked: Pickable = .marker, <span class="tok-comment">// .marker doubles as "nothing yet"</span>
    hit_point: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    hit_distance: f32 = <span class="tok-num">0</span>,

    <span class="tok-comment">// Tap detection: press position + accumulated drag.</span>
    press_pos: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    pressed: bool = false,
    drag_total: f32 = <span class="tok-num">0</span>,

    cam_yaw: f32 = <span class="tok-num">0.7</span>,
    cam_pitch: f32 = <span class="tok-num">0.5</span>,
    cam_dist: f32 = <span class="tok-num">8.0</span>,
    dragging: bool = false,
    prev_pinch: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    <span class="tok-comment">// objs 0-3 own unique meshes; obj 4 (the marker) reuses obj 1 (cube)'s mesh</span>
    <span class="tok-comment">// handles, so freeing all five would double-free - free the four unique ones.</span>
    <span class="tok-kw">for</span> (s.objs[<span class="tok-num">0</span>..<span class="tok-num">4</span>]) |obj| {
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(obj.mesh.vbo);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(obj.mesh.ibo);
    }
    <span class="tok-comment">// Every obj has its OWN per-object UBOs + bind groups (built in the loop).</span>
    <span class="tok-kw">for</span> (&amp;s.objs) |*obj| {
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(obj.vs_ubo);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(obj.fs_ubo);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(obj.g0_bg);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(obj.g2_bg);
    }
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.pipeline);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.empty_bg);
    s.rt.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.torus_cpu);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">uniformLayout</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    min_size: u64,
    vis: z.wgpu.ShaderStage,
    label: []<span class="tok-kw">const</span> u8,
) !z.wgpu.BindGroupLayoutHandle {
    <span class="tok-kw">const</span> entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{ .binding = <span class="tok-num">0</span>, .visibility = vis, .resource = .{ .uniform_buffer = .{ .min_size = min_size } } },
    };
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    <span class="tok-kw">return</span> z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, blob, label);
}

<span class="tok-kw">fn</span> <span class="tok-fn">uniformBindGroup</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    bgl: z.wgpu.BindGroupLayoutHandle,
    buffer: z.wgpu.BufferHandle,
    size: u64,
    label: []<span class="tok-kw">const</span> u8,
) !z.wgpu.BindGroupHandle {
    <span class="tok-kw">const</span> entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = buffer, .size = size } } },
    };
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    <span class="tok-kw">return</span> z.wgpu.<span class="tok-fn">createBindGroup</span>(device, bgl, blob, label);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> queue: z.wgpu.QueueHandle = f.gpu.queue;

    <span class="tok-comment">// ---- geometry: two hand-rolled, two generated ----</span>
    <span class="tok-kw">const</span> ground: GpuMesh = .{
        .vbo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(ground_verts[<span class="tok-num">0</span>..]),
            .{ .vertex = true, .copy_dst = true },
            <span class="tok-str">"pick_ground_vbo"</span>,
        ),
        .ibo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(ground_indices[<span class="tok-num">0</span>..]),
            .{ .index = true, .copy_dst = true },
            <span class="tok-str">"pick_ground_ibo"</span>,
        ),
        .vbo_bytes = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(ground_verts)),
        .ibo_bytes = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(ground_indices)),
        .icount = ground_indices.len,
    };
    <span class="tok-kw">const</span> cube: GpuMesh = .{
        .vbo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_verts[<span class="tok-num">0</span>..]),
            .{ .vertex = true, .copy_dst = true },
            <span class="tok-str">"pick_cube_vbo"</span>,
        ),
        .ibo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
            device,
            queue,
            std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_indices[<span class="tok-num">0</span>..]),
            .{ .index = true, .copy_dst = true },
            <span class="tok-str">"pick_cube_ibo"</span>,
        ),
        .vbo_bytes = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_verts)),
        .ibo_bytes = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_indices)),
        .icount = cube_indices.len,
    };
    <span class="tok-kw">const</span> sphere_cpu: z.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">24</span>, <span class="tok-num">20</span>);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadMesh</span>(gpa, sphere_cpu);
    <span class="tok-kw">const</span> sphere: GpuMesh = <span class="tok-kw">try</span> <span class="tok-fn">uploadMesh</span>(gpa, device, queue, sphere_cpu, <span class="tok-str">"pick_sphere"</span>);
    <span class="tok-comment">// Torus CPU mesh outlives init - it's the pick target.</span>
    <span class="tok-kw">const</span> torus_cpu: z.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshTorus</span>(gpa, <span class="tok-num">0.35</span>, <span class="tok-num">1.0</span>, <span class="tok-num">14</span>, <span class="tok-num">28</span>);
    <span class="tok-kw">const</span> torus: GpuMesh = <span class="tok-kw">try</span> <span class="tok-fn">uploadMesh</span>(gpa, device, queue, torus_cpu, <span class="tok-str">"pick_torus"</span>);

    <span class="tok-comment">// ---- one pipeline for everything ----</span>
    <span class="tok-kw">const</span> g0_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(VsUbo), .{ .vertex = true }, <span class="tok-str">"pick_g0"</span>);
    <span class="tok-kw">const</span> g2_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(FsUbo), .{ .fragment = true }, <span class="tok-str">"pick_g2"</span>);
    <span class="tok-kw">const</span> empty_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_blob);
    <span class="tok-kw">const</span> empty_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, empty_blob, <span class="tok-str">"pick_empty"</span>);
    <span class="tok-kw">const</span> empty_bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_bg_blob);
    <span class="tok-kw">const</span> empty_bg: z.wgpu.BindGroupHandle =
        z.wgpu.<span class="tok-fn">createBindGroup</span>(device, empty_bgl, empty_bg_blob, <span class="tok-str">"pick_empty_bg"</span>);
    <span class="tok-kw">const</span> pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ g0_bgl, empty_bgl, g2_bgl },
        <span class="tok-str">"pick_pl"</span>,
    );
    <span class="tok-kw">const</span> vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, gbuffer_vs_wgsl, <span class="tok-str">"gbuffer_vs"</span>);
    <span class="tok-kw">const</span> fs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, fog_fs_wgsl, <span class="tok-str">"fog_fs"</span>);
    <span class="tok-kw">const</span> combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less,
        .none, <span class="tok-comment">// torus interior shows through its hole - keep both faces</span>
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{.{
            .array_stride = <span class="tok-builtin">@sizeOf</span>(MeshVertex),
            .step_mode = .vertex,
            .attributes = &amp;.{
                .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
                .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
            },
        }},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pipe_blob);
    <span class="tok-kw">const</span> pipeline: z.wgpu.RenderPipelineHandle =
        z.wgpu.<span class="tok-fn">createRenderPipeline</span>(device, pl, vs_mod, fs_mod, pipe_blob, <span class="tok-str">"pick_pipe"</span>);

    <span class="tok-kw">var</span> objs: [<span class="tok-num">5</span>]Obj = undefined;
    <span class="tok-kw">const</span> meshes = [<span class="tok-num">5</span>]GpuMesh{ ground, cube, sphere, torus, cube };
    <span class="tok-kw">for</span> (&amp;objs, meshes) |*obj, gm| {
        <span class="tok-kw">const</span> vs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = <span class="tok-builtin">@sizeOf</span>(VsUbo),
            .usage = .{ .uniform = true, .copy_dst = true },
        });
        <span class="tok-kw">const</span> fs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = <span class="tok-builtin">@sizeOf</span>(FsUbo),
            .usage = .{ .uniform = true, .copy_dst = true },
        });
        obj.* = .{
            .mesh = gm,
            .vs_ubo = vs_ubo,
            .g0_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, g0_bgl, vs_ubo, <span class="tok-builtin">@sizeOf</span>(VsUbo), <span class="tok-str">"pick_g0_bg"</span>),
            .fs_ubo = fs_ubo,
            .g2_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, g2_bgl, fs_ubo, <span class="tok-builtin">@sizeOf</span>(FsUbo), <span class="tok-str">"pick_g2_bg"</span>),
        };
    }

    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.* = .{
        .gpa = gpa,
        .pipeline = pipeline,
        .empty_bg = empty_bg,
        .objs = objs,
        .torus_cpu = torus_cpu,
        .rt = .{},
        .font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
    };

    <span class="tok-comment">// Build-only intermediates: the pipeline + per-obj bind groups have</span>
    <span class="tok-comment">// internalized these, so the layouts and modules can be released now.</span>
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(fs_mod);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(pl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(g0_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(g2_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(empty_bgl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> bw: u32 = <span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> bh: u32 = <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt.color != .invalid <span class="tok-kw">and</span> s.rt.width == bw <span class="tok-kw">and</span> s.rt.height == bh) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.rt.color != .invalid) {
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt);
    }
    s.rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(bw), <span class="tok-builtin">@intCast</span>(bh));
}

<span class="tok-comment">/// Cast the tap and race all four pickables; closest hit wins.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">pick</span>(
    s: *State,
    tap: Vec2,
    cam: zm.Camera3D,
    vw: f32,
    vh: f32,
    torus_model: Mat,
) void {
    <span class="tok-kw">const</span> ray: zm.Ray = z.<span class="tok-fn">getScreenToWorldRay</span>(tap, cam, vw, vh);

    <span class="tok-kw">var</span> best: Pickable = .marker;
    <span class="tok-kw">var</span> best_hit: zm.RayCollision = .{
        .hit = false,
        .distance = <span class="tok-num">1.0e30</span>,
        .point = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .normal = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
    };

    <span class="tok-kw">const</span> candidates = [<span class="tok-num">4</span>]<span class="tok-kw">struct</span> { which: Pickable, c: zm.RayCollision }{
        .{ .which = .ground, .c = z.<span class="tok-fn">getRayCollisionQuad</span>(
            ray,
            <span class="tok-fn">vec</span>(-ground_half, <span class="tok-num">0</span>, -ground_half),
            <span class="tok-fn">vec</span>(-ground_half, <span class="tok-num">0</span>, ground_half),
            <span class="tok-fn">vec</span>(ground_half, <span class="tok-num">0</span>, ground_half),
            <span class="tok-fn">vec</span>(ground_half, <span class="tok-num">0</span>, -ground_half),
        ) },
        .{ .which = .cube, .c = z.<span class="tok-fn">getRayCollisionBox</span>(ray, .{
            .min = <span class="tok-fn">vec</span>(cube_center[<span class="tok-num">0</span>] - cube_half, cube_center[<span class="tok-num">1</span>] - cube_half, cube_center[<span class="tok-num">2</span>] - cube_half),
            .max = <span class="tok-fn">vec</span>(cube_center[<span class="tok-num">0</span>] + cube_half, cube_center[<span class="tok-num">1</span>] + cube_half, cube_center[<span class="tok-num">2</span>] + cube_half),
        }) },
        .{ .which = .sphere, .c = z.<span class="tok-fn">getRayCollisionSphere</span>(
            ray,
            <span class="tok-fn">vec</span>(sphere_center[<span class="tok-num">0</span>], sphere_center[<span class="tok-num">1</span>], sphere_center[<span class="tok-num">2</span>]),
            sphere_radius,
        ) },
        .{ .which = .torus, .c = z.<span class="tok-fn">getRayCollisionMesh</span>(ray, s.torus_cpu, torus_model) },
    };
    <span class="tok-kw">for</span> (candidates) |cand| {
        <span class="tok-kw">if</span> (cand.c.hit <span class="tok-kw">and</span> cand.c.distance &lt; best_hit.distance) {
            best_hit = cand.c;
            best = cand.which;
        }
    }

    s.picked = best;
    <span class="tok-kw">if</span> (best != .marker) {
        s.hit_point = .{ best_hit.point[<span class="tok-num">0</span>], best_hit.point[<span class="tok-num">1</span>], best_hit.point[<span class="tok-num">2</span>] };
        s.hit_distance = best_hit.distance;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(
    f: *z.Frame,
    s: *State,
    ui_wants_mouse: bool,
    cam: zm.Camera3D,
    vw: f32,
    vh: f32,
    torus_model: Mat,
) void {
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> dx: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (s.prev_pinch &gt; <span class="tok-num">0</span>) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - (dist - s.prev_pinch) * <span class="tok-num">0.02</span>, <span class="tok-num">4.0</span>, <span class="tok-num">16.0</span>);
        }
        s.prev_pinch = dist;
        s.pressed = false; <span class="tok-comment">// a pinch is never a tap</span>
        <span class="tok-kw">return</span>;
    }
    s.prev_pinch = <span class="tok-num">0</span>;

    <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !ui_wants_mouse) {
        <span class="tok-kw">if</span> (s.dragging) {
            <span class="tok-kw">const</span> d: Vec2 = z.<span class="tok-fn">getMouseDelta</span>(f.input);
            s.cam_yaw -= d[<span class="tok-num">0</span>] * <span class="tok-num">0.008</span>;
            s.cam_pitch = <span class="tok-fn">clamp</span>(s.cam_pitch + d[<span class="tok-num">1</span>] * <span class="tok-num">0.008</span>, <span class="tok-num">0.05</span>, <span class="tok-num">1.4</span>);
            s.drag_total += <span class="tok-builtin">@abs</span>(d[<span class="tok-num">0</span>]) + <span class="tok-builtin">@abs</span>(d[<span class="tok-num">1</span>]);
        } <span class="tok-kw">else</span> {
            s.press_pos = mp;
            s.drag_total = <span class="tok-num">0</span>;
            s.pressed = true;
        }
        s.dragging = true;
    } <span class="tok-kw">else</span> {
        <span class="tok-comment">// Release: a press that never turned into a real drag is a TAP.</span>
        <span class="tok-kw">if</span> (s.dragging <span class="tok-kw">and</span> s.pressed <span class="tok-kw">and</span> s.drag_total &lt; <span class="tok-num">10.0</span>) {
            <span class="tok-fn">pick</span>(s, s.press_pos, cam, vw, vh, torus_model);
        }
        s.dragging = false;
        s.pressed = false;
    }
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span>) {
        s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - wheel * <span class="tok-num">0.5</span>, <span class="tok-num">4.0</span>, <span class="tok-num">16.0</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">writeObj</span>(
    f: *z.Frame,
    obj: *Obj,
    model: Mat,
    normal_mat: Mat,
    cam_vp: Mat,
    cam_eye: Vec,
    color: [<span class="tok-num">4</span>]f32,
) void {
    <span class="tok-kw">var</span> vs_io: mat_vs.Io = undefined;
    vs_io.u = .{ .mvp = <span class="tok-fn">mulMat</span>(cam_vp, model), .model = model, .normal_matrix = normal_mat };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.vs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;vs_io.u));
    <span class="tok-kw">var</span> fs_io: mat_fs.Io = undefined;
    fs_io.u = .{
        .base_color = color,
        .view_pos = .{ cam_eye[<span class="tok-num">0</span>], cam_eye[<span class="tok-num">1</span>], cam_eye[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .light_dir = .{ sun_dir[<span class="tok-num">0</span>], sun_dir[<span class="tok-num">1</span>], sun_dir[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .fog_color = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> },
        .params = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.fs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;fs_io.u));
}

<span class="tok-comment">/// Base color, brightened when this slot is the picked one.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">tint</span>(base: [<span class="tok-num">4</span>]f32, hot: bool) [<span class="tok-num">4</span>]f32 {
    <span class="tok-kw">if</span> (!hot) {
        <span class="tok-kw">return</span> base;
    }
    <span class="tok-kw">return</span> .{
        <span class="tok-builtin">@min</span>(base[<span class="tok-num">0</span>] * <span class="tok-num">1.5</span> + <span class="tok-num">0.15</span>, <span class="tok-num">1.0</span>),
        <span class="tok-builtin">@min</span>(base[<span class="tok-num">1</span>] * <span class="tok-num">1.5</span> + <span class="tok-num">0.15</span>, <span class="tok-num">1.0</span>),
        <span class="tok-builtin">@min</span>(base[<span class="tok-num">2</span>] * <span class="tok-num">1.5</span> + <span class="tok-num">0.15</span>, <span class="tok-num">1.0</span>),
        <span class="tok-num">1.0</span>,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing).</span>
    <span class="tok-comment">// Uses last-frame pick/camera state (1-frame lag, imperceptible); the UI</span>
    <span class="tok-comment">// below updates it for next frame.</span>
    <span class="tok-comment">// ---- camera (both the render matrices and the picking Camera3D) ----</span>
    <span class="tok-kw">const</span> cam_target: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(s.cam_pitch);
    <span class="tok-kw">const</span> sp: f32 = <span class="tok-builtin">@sin</span>(s.cam_pitch);
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-builtin">@cos</span>(s.cam_yaw);
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-builtin">@sin</span>(s.cam_yaw);
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(
        cam_target[<span class="tok-num">0</span>] + s.cam_dist * cp * sy,
        cam_target[<span class="tok-num">1</span>] + s.cam_dist * sp,
        cam_target[<span class="tok-num">2</span>] + s.cam_dist * cp * cy,
    );
    <span class="tok-kw">const</span> cam_view: Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, cam_target, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> cam_proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(fovy_rad, vw / vh, <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>);
    <span class="tok-kw">const</span> cam_vp: Mat = <span class="tok-fn">mulMat</span>(cam_proj, cam_view);
    <span class="tok-kw">const</span> cam3d: zm.Camera3D = .{
        .position = cam_eye,
        .target = cam_target,
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = fovy_rad * <span class="tok-num">180.0</span> / pi,
    };

    <span class="tok-comment">// The torus spins; its model matrix feeds BOTH the draw and the pick.</span>
    <span class="tok-kw">const</span> torus_spin: Mat = <span class="tok-fn">rotationY</span>(t * <span class="tok-num">0.6</span>);
    <span class="tok-kw">const</span> torus_model: Mat = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">translation</span>(torus_center[<span class="tok-num">0</span>], torus_center[<span class="tok-num">1</span>], torus_center[<span class="tok-num">2</span>]),
        torus_spin,
    );

    <span class="tok-comment">// ---- uniforms ----</span>
    <span class="tok-kw">const</span> idm: Mat = zm.<span class="tok-fn">identity</span>();
    <span class="tok-fn">writeObj</span>(f, &amp;s.objs[<span class="tok-num">0</span>], idm, idm, cam_vp, cam_eye, <span class="tok-fn">tint</span>(.{ <span class="tok-num">0.5</span>, <span class="tok-num">0.52</span>, <span class="tok-num">0.56</span>, <span class="tok-num">1</span> }, s.picked == .ground));
    <span class="tok-kw">const</span> cube_model: Mat = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">translation</span>(cube_center[<span class="tok-num">0</span>], cube_center[<span class="tok-num">1</span>], cube_center[<span class="tok-num">2</span>]),
        <span class="tok-fn">scaling</span>(cube_half, cube_half, cube_half),
    );
    <span class="tok-fn">writeObj</span>(f, &amp;s.objs[<span class="tok-num">1</span>], cube_model, idm, cam_vp, cam_eye, <span class="tok-fn">tint</span>(.{ <span class="tok-num">0.85</span>, <span class="tok-num">0.45</span>, <span class="tok-num">0.3</span>, <span class="tok-num">1</span> }, s.picked == .cube));
    <span class="tok-kw">const</span> sphere_model: Mat = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">translation</span>(sphere_center[<span class="tok-num">0</span>], sphere_center[<span class="tok-num">1</span>], sphere_center[<span class="tok-num">2</span>]),
        <span class="tok-fn">scaling</span>(sphere_radius, sphere_radius, sphere_radius),
    );
    <span class="tok-fn">writeObj</span>(f, &amp;s.objs[<span class="tok-num">2</span>], sphere_model, idm, cam_vp, cam_eye, <span class="tok-fn">tint</span>(.{ <span class="tok-num">0.35</span>, <span class="tok-num">0.65</span>, <span class="tok-num">0.9</span>, <span class="tok-num">1</span> }, s.picked == .sphere));
    <span class="tok-kw">const</span> torus_hot: bool = s.picked == .torus;
    <span class="tok-fn">writeObj</span>(f, &amp;s.objs[<span class="tok-num">3</span>], torus_model, torus_spin, cam_vp, cam_eye, <span class="tok-fn">tint</span>(.{ <span class="tok-num">0.55</span>, <span class="tok-num">0.85</span>, <span class="tok-num">0.45</span>, <span class="tok-num">1</span> }, torus_hot));
    <span class="tok-comment">// The marker: a tiny white cube parked on the hit point.</span>
    <span class="tok-kw">const</span> marker_model: Mat = <span class="tok-fn">mulMat</span>(
        <span class="tok-fn">translation</span>(s.hit_point[<span class="tok-num">0</span>], s.hit_point[<span class="tok-num">1</span>], s.hit_point[<span class="tok-num">2</span>]),
        <span class="tok-fn">scaling</span>(<span class="tok-num">0.07</span>, <span class="tok-num">0.07</span>, <span class="tok-num">0.07</span>),
    );
    <span class="tok-fn">writeObj</span>(f, &amp;s.objs[<span class="tok-num">4</span>], marker_model, idm, cam_vp, cam_eye, .{ <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span> });

    <span class="tok-comment">// ---- the pass ----</span>
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.rt, bg_clear);
    <span class="tok-kw">const</span> pa: *z.PassState = f.gl.pass;
    Backend.<span class="tok-fn">setPipeline</span>(pa, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">1</span>, s.empty_bg);
    <span class="tok-kw">const</span> draw_count: usize = <span class="tok-kw">if</span> (s.picked == .marker) <span class="tok-num">4</span> <span class="tok-kw">else</span> <span class="tok-num">5</span>; <span class="tok-comment">// no marker before first pick</span>
    <span class="tok-kw">for</span> (s.objs[<span class="tok-num">0</span>..draw_count]) |*obj| {
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">0</span>, obj.g0_bg);
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">2</span>, obj.g2_bg);
        z.render_pass.<span class="tok-fn">setVertexBuffer</span>(pa.pass, .{
            .slot = <span class="tok-num">0</span>,
            .buffer = obj.mesh.vbo,
            .offset = <span class="tok-num">0</span>,
            .size = obj.mesh.vbo_bytes,
        });
        z.render_pass.<span class="tok-fn">setIndexBuffer</span>(pa.pass, .{
            .buffer = obj.mesh.ibo,
            .format = .uint32,
            .offset = <span class="tok-num">0</span>,
            .size = obj.mesh.ibo_bytes,
        });
        z.render_pass.<span class="tok-fn">drawIndexed</span>(pa.pass, .{
            .index_count = obj.mesh.icount,
            .instance_count = <span class="tok-num">1</span>,
            .first_index = <span class="tok-num">0</span>,
            .base_vertex = <span class="tok-num">0</span>,
            .first_instance = <span class="tok-num">0</span>,
        });
    }
    z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);

    <span class="tok-comment">// ---- SCREEN PASS: open once, composite the RTT, then the UI. ----</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, bg_clear);
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh }, s.rt.<span class="tok-fn">asTexture</span>(), .{ .tint = white });

    <span class="tok-comment">// ---- UI + input (tap picks, drag orbits) ----</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">300</span>, vw - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">118</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">110</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"mesh picking"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"tap an object to pick it"</span>, .{});
        <span class="tok-kw">if</span> (s.picked == .marker) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"picked: nothing yet"</span>, .{});
        } <span class="tok-kw">else</span> {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"picked: {s}  ({d:.2} away)"</span>, .{ pick_names[<span class="tok-builtin">@backingInt</span>(s.picked)], s.hit_distance });
        }
    }
    <span class="tok-fn">handleInput</span>(f, s, u.<span class="tok-fn">wantCaptureMouse</span>(), cam3d, vw, vh, torus_model);
    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - mesh picking (tap to pick)"</span>,

            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },

    .init = initState,

    <span class="tok-comment">// safe); owns its own begin/endDrawing.</span>

};
