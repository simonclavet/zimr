<h1>geno_dance</h1>
<figure class="code src-file" data-path="examples/geno_dance/geno_dance.zig" data-lines="4281"><figcaption><span>examples/geno_dance/geno_dance.zig</span><span>4281 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/geno_dance - two skinned characters from FBX, side by side.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The payoff of the mocap arc, and the smallest program that shows the pipeline is general</span>
<span class="tok-comment">//! rather than tuned to one file:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   Geno.fbx      + dance1_20s.bvh   75+21 bones, 1 mesh,  10 s, motion BORROWED</span>
<span class="tok-comment">//!   Drop_Kick.fbx (Mixamo)           65 bones,    2 meshes, 2.9 s, motion its OWN take</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! They share nothing - bone count, naming, mesh count, frame rate, and even how the motion</span>
<span class="tok-comment">//! arrives all differ - yet both go through one `loadFbxModel` and one skinning path.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * NO RETARGETING FOR GENO, AND THAT IS MEASURED --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Geno and `dance1_subject2` come from the same production and their skeletons agree exactly:</span>
<span class="tok-comment">//! 96 bones, identical names, identical order - verified index by index, not inferred from the</span>
<span class="tok-comment">//! names lining up. `skeletonsMatch` re-checks it at load and says so in the UI, because the</span>
<span class="tok-comment">//! day it stops being true the mesh should complain rather than deform quietly wrongly.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * WHERE THE MATRIX MATH LIVES --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Not here. `draw3d.poseSkinMatrices` and `draw3d.skinMeshCpu` own it, and their docs carry</span>
<span class="tok-comment">//! the two zm conventions that are easy to invert and invisible in a bind pose - `mulMat`'s</span>
<span class="tok-comment">//! argument order, and `vec` being a DIRECTION whose lane 3 is zero. This file does not import</span>
<span class="tok-comment">//! a single matrix function; getting them wrong is no longer something an example can do.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> translationV = zm.translationV;
<span class="tok-kw">const</span> matFromQuat = zm.matFromQuat;
<span class="tok-kw">const</span> radFromDeg = zm.radFromDeg;
<span class="tok-kw">const</span> normalize3 = zm.normalize3;
<span class="tok-kw">const</span> acosRad = zm.acosRad;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> assertf = zm.assertf;
<span class="tok-kw">const</span> ui = z.ui_real;
<span class="tok-kw">const</span> mjcf = z.mjcf;
<span class="tok-kw">const</span> d3 = z.draw3d;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Quat = zm.Quat;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">/// Character one: mesh, skin weights, and the rig its clusters were bound to. Its own take is</span>
<span class="tok-comment">/// only a bind pose, so its motion comes from the BVH below.</span>
<span class="tok-kw">const</span> geno_fbx = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"Geno.fbx"</span>);
<span class="tok-comment">/// Ten seconds of `dance1_subject2` - the same production as Geno, and the reason no</span>
<span class="tok-comment">/// retargeting is needed: 96 bones, same names, same order.</span>
<span class="tok-kw">const</span> dance_bvh = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"dance1_20s.bvh"</span>);
<span class="tok-comment">/// Character two: a Mixamo export that is SELF-CONTAINED - two skinned meshes, a 65-joint</span>
<span class="tok-comment">/// `mixamorig:` skeleton, and its own animation in its second take.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * It shares nothing with Geno: different bone count, different naming, different mesh</span>
<span class="tok-comment">/// count, different frame rate, and its motion arrives by a different route. Standing them</span>
<span class="tok-comment">/// side by side is the demo AND the proof that none of this is tuned to one file.</span>
<span class="tok-kw">const</span> mixamo_fbx = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"Drop_Kick.fbx"</span>);

<span class="tok-comment">/// *** GENO'S T-POSE, AND WHY IT IS A SEPARATE FILE.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Retargeting aligns two skeletons by their REFERENCE POSE, and the correction is only right</span>
<span class="tok-comment">/// when both references depict the SAME PHYSICAL CONFIGURATION. They did not:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///   * Geno's FBX bind pose is an **A-POSE** - measured, hand at (49.4, 102.6, -4.9), hip</span>
<span class="tok-comment">///     height, arms down.</span>
<span class="tok-comment">///   * Mixamo's FBX bind pose is a **T-POSE** - arms out at shoulder height.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// So `conjugate(mixamo_T) * geno_A` put Geno in its A-REST whenever Mixamo sat in its T-rest,</span>
<span class="tok-comment">/// and every arm carried a constant ~45-degree droop through the whole clip.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// GenoView ships `Geno_stance.bvh` for exactly this: the SAME 75-joint skeleton in a T-pose.</span>
<span class="tok-comment">/// Its rotation channels are identical to `Geno_bind.bvh`'s and only the positions differ,</span>
<span class="tok-comment">/// which is what makes it a genuinely separate artifact rather than something derivable.</span>
<span class="tok-kw">const</span> geno_tpose_bvh = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"Geno_stance.bvh"</span>);

<span class="tok-kw">const</span> screen_w: i32 = <span class="tok-num">1000</span>;
<span class="tok-kw">const</span> screen_h: i32 = <span class="tok-num">760</span>;

<span class="tok-comment">/// * EVERYTHING IS METRES FROM THE LOADER ONWARD. The captures and Geno are authored in</span>
<span class="tok-comment">/// centimetres; `LoadFbxModelOptions.scale` and `scaleBvhSkeletalClip` convert once at load, so</span>
<span class="tok-comment">/// no draw call, no shadow matrix and no AO radius ever carries a unit conversion.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** THE SCENE WAS ALREADY METRIC - `ground_extent`, `light_extent`, `capsule_radius` and the</span>
<span class="tok-comment">/// SSAO radius are all in metres and always were, because the old draw-time 0.01 converted</span>
<span class="tok-comment">/// before they were applied. This finishes a convention rather than introducing one.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * And it is what section 13 needs: `robot.zig` speaks metres, and a ragdoll synthesized from a</span>
<span class="tok-comment">/// centimetre skeleton would get inertias off by a factor of 10^6.</span>
<span class="tok-kw">const</span> cm_to_m: f32 = <span class="tok-num">0.01</span>;

<span class="tok-comment">/// The robot's hip height at rest, MEASURED from `humanoid.xml` rather than guessed - an earlier</span>
<span class="tok-comment">/// hardcoded 0.9 was 8.5% off and skewed every target for the whole arc.</span>
<span class="tok-kw">const</span> robot_hip_height_m: f32 = <span class="tok-num">0.830</span>;

<span class="tok-comment">// -- *** `robot_height_m` AND `robot_total_bone_length_m` ARE GONE --</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Both were introduced as scale anchors and both were wrong for the same underlying reason:</span>
<span class="tok-comment">// **they measured the WHOLE robot against the WHOLE capture**, and the two are not the same</span>
<span class="tok-comment">// anatomy - 65-78 capture joints, including fingers and a five-link spine, against 18 mapped</span>
<span class="tok-comment">// bodies.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// ** `captureScale` now sums only MAPPED PAIRS, so it needs no whole-body constant at all: both</span>
<span class="tok-comment">// sides are measured from the same correspondence, in the same loop. **A constant that has to be</span>
<span class="tok-comment">// kept in step with a model is a constant that will drift** - this one deleted itself by making</span>
<span class="tok-comment">// the question local.</span>

<span class="tok-comment">/// The scale taking this capture's units to the robot's metres - from the LIBRARY.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** THE LAST FOUR BUGS ALL LIVED IN THIS CONVERSION --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The scale, the anchor, the units and the anatomy mismatch were every one of them here, in the</span>
<span class="tok-comment">/// example, where no test could reach them. **`robot.captureScale` now owns it**, with its three</span>
<span class="tok-comment">/// properties - pose-invariant, unit-cancelling, anatomy-matched - asserted in the harness rather</span>
<span class="tok-comment">/// than argued for in a comment.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">captureScale</span>(s: *<span class="tok-kw">const</span> State, source: *<span class="tok-kw">const</span> Character) f32 {
    <span class="tok-kw">return</span> z.robot.<span class="tok-fn">captureScale</span>(&amp;s.robot.model, .{
        .positions = source.positions[<span class="tok-num">0</span>..source.<span class="tok-fn">boneCount</span>()],
        .rotations = source.rotations[<span class="tok-num">0</span>..source.<span class="tok-fn">boneCount</span>()],
        .parents = source.target_parents[<span class="tok-num">0</span>..source.<span class="tok-fn">boneCount</span>()],
        .human_of_body = s.human_of_body,
    });
}

<span class="tok-comment">/// The floor is a large CUBE sunk so only its top face shows. `drawCubeTexture` takes a single</span>
<span class="tok-comment">/// uniform size, so a thin slab is not available - and a sunken cube is better anyway: the</span>
<span class="tok-comment">/// shadow pass in section 12a-2 wants a receiver with real thickness, not a zero-height plane.</span>
<span class="tok-kw">const</span> ground_extent: f32 = <span class="tok-num">8.0</span>;
<span class="tok-kw">const</span> ground_light: Color = .{ .r = <span class="tok-num">205</span>, .g = <span class="tok-num">205</span>, .b = <span class="tok-num">205</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> ground_dark: Color = .{ .r = <span class="tok-num">170</span>, .g = <span class="tok-num">170</span>, .b = <span class="tok-num">170</span>, .a = <span class="tok-num">255</span> };

<span class="tok-comment">/// The sun's direction, from yaw and pitch.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * EXPOSED AS SLIDERS SO THE NORMALS CAN BE AUDITED. A fixed light hides normal errors: a</span>
<span class="tok-comment">/// facet with a wrong normal just looks like a slightly odd shade and nothing contradicts it.</span>
<span class="tok-comment">/// SWEEPING the light makes the error obvious - correct normals shade smoothly and</span>
<span class="tok-comment">/// continuously as the light moves, while a bad patch pops, stays flat, or lights in the wrong</span>
<span class="tok-comment">/// direction. It is the cheapest normal debugger there is, and unlike a normals-as-colour view</span>
<span class="tok-comment">/// it needs no new shader.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Pitch is measured DOWN from the horizon, so 0 grazes the ground and 90 is directly overhead.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">lightDirFrom</span>(yaw_deg: f32, pitch_deg: f32) Vec {
    <span class="tok-kw">const</span> yaw: f32 = yaw_deg * (pi / <span class="tok-num">180.0</span>);
    <span class="tok-kw">const</span> pitch: f32 = pitch_deg * (pi / <span class="tok-num">180.0</span>);
    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(pitch);
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(-<span class="tok-builtin">@sin</span>(yaw) * cp, -<span class="tok-builtin">@sin</span>(pitch), -<span class="tok-builtin">@cos</span>(yaw) * cp);
}
<span class="tok-comment">/// How far back along the light the camera sits, and how much it covers. Big enough to hold</span>
<span class="tok-comment">/// both characters and the ground they stand on.</span>
<span class="tok-kw">const</span> light_distance: f32 = <span class="tok-num">6.0</span>;
<span class="tok-comment">/// Half-width of the light's orthographic box, in world units.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * SIZED TO THE CASTERS, AND THE BOX FOLLOWS THEM. Tightening this to 1.6 spent the map's</span>
<span class="tok-comment">/// resolution well but clipped the dance: `dance1` travels, so a box centred on the origin</span>
<span class="tok-comment">/// loses the character the moment it steps away - visible as a shadow that simply stops.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `lightTarget` re-centres the box on the characters' midpoint every frame, which is the</span>
<span class="tok-comment">/// standard fix for a directional map and cheaper than widening: following keeps the texel</span>
<span class="tok-comment">/// density, widening throws it away.</span>
<span class="tok-kw">const</span> light_extent: f32 = <span class="tok-num">2.6</span>;
<span class="tok-kw">const</span> light_near: f32 = <span class="tok-num">0.1</span>;
<span class="tok-kw">const</span> light_far: f32 = <span class="tok-num">30.0</span>;

<span class="tok-kw">const</span> shadow_map_size: u32 = <span class="tok-num">1024</span>;
<span class="tok-comment">/// G-buffer resolution. Square and fixed - see `initGbuffer`.</span>
<span class="tok-kw">const</span> gbuffer_size: u32 = <span class="tok-num">1024</span>;

<span class="tok-comment">// -- Host mirrors of the two `lit_shadow` uniform blocks --</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// These MUST match `lit_shadow_vs_io.Ubo` / `lit_shadow_fs_io.Ubo` field for field: the layout</span>
<span class="tok-comment">// is the wire contract between this file and the generated WGSL, and a mismatch shows up as</span>
<span class="tok-comment">// garbage transforms rather than a compile error.</span>

<span class="tok-comment">/// `lit_shadow_vs_io.Ubo` - group 0.</span>
<span class="tok-kw">const</span> LitVsUbo = <span class="tok-kw">struct</span> {
    mvp: [<span class="tok-num">4</span>]Vec,
    light_vp: [<span class="tok-num">4</span>]Vec,
    normal_matrix: [<span class="tok-num">4</span>]Vec,
};

<span class="tok-comment">/// `lit_shadow_fs_io.Ubo` - group 2. `params` is {bias_slope, bias_min, 0, 0}; the defaults</span>
<span class="tok-comment">/// in the shader's schema are tuned for an f16 depth map.</span>
<span class="tok-kw">const</span> LitFsUbo = <span class="tok-kw">struct</span> {
    light_dir: Vec,
    base_color: Vec,
    params: Vec,
};

<span class="tok-comment">/// `ssao_fs_io.Ubo` - group 2 of the AO pass.</span>
<span class="tok-kw">const</span> SsaoUbo = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// Camera view matrix: occlusion is measured in VIEW space so `radius` means a fixed</span>
    <span class="tok-comment">/// distance from the camera rather than something that drifts as the scene moves.</span>
    view: [<span class="tok-num">4</span>]Vec,
    <span class="tok-comment">/// {radius, bias, intensity, unused}</span>
    params: Vec,
    <span class="tok-comment">/// {turns, inv_width, inv_height, unused}</span>
    spiral: Vec,
};

<span class="tok-comment">/// `ssao_blur_fs_io.Ubo` - one pipeline, two passes, the axis switched by uniform.</span>
<span class="tok-kw">const</span> SsaoBlurUbo = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// {texel_x, texel_y, axis_x, axis_y}</span>
    step: Vec,
    <span class="tok-comment">/// {position_falloff, normal_power, 0, 0}</span>
    weights: Vec,
};

<span class="tok-kw">const</span> ssao_blur_ubo_bytes: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(SsaoBlurUbo);
<span class="tok-kw">const</span> ssao_blur_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"ssao_blur_fs.wgsl"</span>);
<span class="tok-kw">const</span> ssao_ubo_bytes: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(SsaoUbo);
<span class="tok-kw">const</span> ssao_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"ssao_fs.wgsl"</span>);
<span class="tok-comment">/// * The AO pass reuses the DEFERRED SHADING vertex stage - same fullscreen quad, same UV</span>
<span class="tok-comment">/// flip. `ssao_common_io` says so; shipping a second copy would be a second thing to keep in</span>
<span class="tok-comment">/// step for no gain.</span>
<span class="tok-kw">const</span> fullscreen_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"deferred_shading_vs.wgsl"</span>);

<span class="tok-comment">/// The fullscreen triangle pair, in NDC.</span>
<span class="tok-kw">const</span> fullscreen_verts = [_][<span class="tok-num">2</span>]f32{
    .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> },
    .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> },  .{ -<span class="tok-num">1</span>, <span class="tok-num">1</span> },
};

<span class="tok-comment">/// `gbuffer_vs_io.Ubo` - the geometry prepass, group 0.</span>
<span class="tok-kw">const</span> GbufVsUbo = <span class="tok-kw">struct</span> {
    mvp: [<span class="tok-num">4</span>]Vec,
    model: [<span class="tok-num">4</span>]Vec,
    normal_matrix: [<span class="tok-num">4</span>]Vec,
};

<span class="tok-comment">/// `gbuffer_fs_io.Ubo` - group 2. Only the albedo matters to SSAO, which reads position and</span>
<span class="tok-comment">/// normal, but the shader writes all three attachments regardless.</span>
<span class="tok-kw">const</span> GbufFsUbo = <span class="tok-kw">struct</span> {
    albedo_spec: Vec,
};

<span class="tok-kw">const</span> gbuf_vs_bytes: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(GbufVsUbo);
<span class="tok-kw">const</span> gbuf_fs_bytes: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(GbufFsUbo);
<span class="tok-kw">const</span> gbuffer_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"gbuffer_vs.wgsl"</span>);
<span class="tok-kw">const</span> gbuffer_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"gbuffer_fs.wgsl"</span>);

<span class="tok-comment">/// `depth_vs_io.Ubo` - the light pass writes NDC depth to the red channel.</span>
<span class="tok-kw">const</span> DepthUbo = <span class="tok-kw">struct</span> {
    mvp: [<span class="tok-num">4</span>]Vec,
    <span class="tok-comment">/// {cam_near, cam_far, viz_near, viz_far} - only the first two matter in shadow mode.</span>
    params: Vec,
    <span class="tok-comment">/// 0 = raw `ndc_z*0.5+0.5`, which is exactly what `lit_shadow_fs` compares against.</span>
    mode: i32,
    pad0: i32 = <span class="tok-num">0</span>,
    pad1: i32 = <span class="tok-num">0</span>,
    pad2: i32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">const</span> depth_ubo_bytes: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(DepthUbo);
<span class="tok-kw">const</span> depth_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"depth_vs.wgsl"</span>);
<span class="tok-kw">const</span> depth_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"depth_fs.wgsl"</span>);
<span class="tok-kw">const</span> lit_vs_bytes: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(LitVsUbo);
<span class="tok-kw">const</span> lit_fs_bytes: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(LitFsUbo);
<span class="tok-kw">const</span> lit_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"lit_shadow_vs.wgsl"</span>);
<span class="tok-kw">const</span> lit_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"lit_shadow_fs.wgsl"</span>);

<span class="tok-comment">/// The ground as the shadow pipeline sees it: position then normal, 24-byte stride - the same</span>
<span class="tok-comment">/// layout `Cube3D`'s `MeshVertex` uses, so the characters can join this pass unchanged later.</span>
<span class="tok-kw">const</span> GroundVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    pos: [<span class="tok-num">3</span>]f32,
    normal: [<span class="tok-num">3</span>]f32,
};

<span class="tok-comment">/// GenoView tints the character raylib's ORANGE against the grey floor, as linear rgb for the</span>
<span class="tok-comment">/// shader's `base_color` (255,161,0 scaled to 0..1).</span>
<span class="tok-kw">const</span> character_albedo: Vec = .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.63</span>, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span> };
<span class="tok-comment">/// The floor's albedo - flat until section 12e brings the checker back through the G-buffer.</span>
<span class="tok-kw">const</span> ground_albedo: Vec = .{ <span class="tok-num">0.72</span>, <span class="tok-num">0.72</span>, <span class="tok-num">0.74</span>, <span class="tok-num">1.0</span> };

<span class="tok-comment">/// One skinned figure: its model, whatever clip drives it, and the per-frame scratch.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The clip is a SEPARATE field rather than always `model.clip` because the two characters get</span>
<span class="tok-comment">/// their motion differently - Geno borrows a BVH, the Mixamo rig uses its own take - and the</span>
<span class="tok-comment">/// update loop should not care which.</span>
<span class="tok-kw">const</span> Character = <span class="tok-kw">struct</span> {
    model: d3.FbxModel,
    <span class="tok-comment">/// The clip actually played. May be `model.clip` or an external one.</span>
    clip: d3.BvhSkeletalClip,
    <span class="tok-comment">/// True when `clip` is external and this struct must free it.</span>
    owns_clip: bool,
    <span class="tok-comment">/// Where this figure stands, so two of them do not occupy the same space.</span>
    offset: Vec,

    <span class="tok-comment">// -- * RETARGETING: this character can be driven by ANOTHER character's clip --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `source_character` indexes `State.characters`. When it points at this character, the clip</span>
    <span class="tok-comment">// plays natively and nothing is retargeted. When it points elsewhere, that character's clip</span>
    <span class="tok-comment">// becomes the SOURCE and the map below carries its motion across.</span>
    source_character: usize,
    <span class="tok-comment">/// `source_of_target[j]` is the SOURCE joint feeding this character's joint j, or</span>
    <span class="tok-comment">/// `codecs.bvh.no_source`. Rebuilt whenever `source_character` changes.</span>
    source_of_target: []i32,
    <span class="tok-comment">/// How many of this character's joints found a source. Zero means the map is wrong, and</span>
    <span class="tok-comment">/// the UI says so rather than showing a rest pose and letting it look like a solver bug.</span>
    mapped_joint_count: usize,
    <span class="tok-comment">/// This character's own parent indices, cached as plain `i32` because that is what</span>
    <span class="tok-comment">/// `codecs.bvh.retargetRotations` takes.</span>
    target_parents: []i32,
    <span class="tok-comment">/// * Per-joint correction for the two rigs disagreeing about REST. Measured: LAFAN1's</span>
    <span class="tok-comment">/// leg bones point (0,-1,0) at rest while Mixamo's point (0,+1,0) - dot = -1.000 - so an</span>
    <span class="tok-comment">/// uncorrected copy bends the legs backwards. Derived, not authored; see</span>
    <span class="tok-comment">/// `codecs.bvh.restAlignmentOffsets`.</span>
    rest_alignment: []Quat,
    <span class="tok-comment">/// This skeleton's own rest orientations, recovered from its bone directions.</span>
    rest_orientations: []Quat,
    <span class="tok-comment">/// World positions at the T-pose, for bone directions. Zeroed when no T-pose file exists.</span>
    rest_positions: []Vec,
    <span class="tok-comment">/// Scratch for one retargeted frame. Sized to the LARGEST skeleton in the scene, because</span>
    <span class="tok-comment">/// the source may have more joints than this character does.</span>
    source_positions: []Vec,
    source_global_rotations: []Quat,
    retargeted_local_rotations: []Quat,
    retargeted_global_rotations: []Quat,
    <span class="tok-comment">/// Distance from the floor to this skeleton's root at rest, used to scale root travel</span>
    <span class="tok-comment">/// between characters of different size.</span>
    hip_height: f32,
    label: []<span class="tok-kw">const</span> u8,

    skin: []Mat,
    positions: []Vec,
    rotations: []Quat,
    <span class="tok-comment">/// * THE REST POSE, KEPT SEPARATELY - one array per mesh, and it must be.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// `updateMeshBuffer` writes into `mesh.vertices` itself, so the mesh's own array stops</span>
    <span class="tok-comment">/// being the rest pose after the first upload. Skinning from it would feed each frame's</span>
    <span class="tok-comment">/// output back in as the next frame's input: the figure inflates into a fan of triangles</span>
    <span class="tok-comment">/// and keeps drifting even with playback PAUSED, because the source keeps changing.</span>
    <span class="tok-comment">/// `examples/skinned_mesh` keeps `base_positions` for the same reason.</span>
    base_positions: [][]f32,
    skinned: [][]f32,
    <span class="tok-comment">/// The REST normals, kept for the same reason as `base_positions`: skinning writes into</span>
    <span class="tok-comment">/// `mesh.normals`, so reading the rest pose from there would compound each frame.</span>
    base_normals: [][]f32,
    skinned_normals: [][]f32,

    <span class="tok-kw">fn</span> <span class="tok-fn">boneCount</span>(self: *<span class="tok-kw">const</span> Character) usize {
        <span class="tok-kw">return</span> self.model.clip.<span class="tok-fn">boneCount</span>();
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">duration</span>(self: *<span class="tok-kw">const</span> Character) f32 {
        <span class="tok-kw">return</span> <span class="tok-fn">float</span>(<span class="tok-builtin">@max</span>(self.clip.animation.keyframeCount, <span class="tok-num">0</span>)) * self.clip.frame_time;
    }

    <span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(self: *Character, gpa: Allocator) void {
        <span class="tok-kw">for</span> (self.base_positions) |b| {
            gpa.<span class="tok-fn">free</span>(b);
        }
        <span class="tok-kw">for</span> (self.skinned) |b| {
            gpa.<span class="tok-fn">free</span>(b);
        }
        <span class="tok-kw">for</span> (self.base_normals) |b| {
            gpa.<span class="tok-fn">free</span>(b);
        }
        <span class="tok-kw">for</span> (self.skinned_normals) |b| {
            gpa.<span class="tok-fn">free</span>(b);
        }
        gpa.<span class="tok-fn">free</span>(self.base_normals);
        gpa.<span class="tok-fn">free</span>(self.skinned_normals);
        gpa.<span class="tok-fn">free</span>(self.base_positions);
        gpa.<span class="tok-fn">free</span>(self.skinned);
        gpa.<span class="tok-fn">free</span>(self.rotations);
        gpa.<span class="tok-fn">free</span>(self.source_of_target);
        gpa.<span class="tok-fn">free</span>(self.target_parents);
        gpa.<span class="tok-fn">free</span>(self.rest_alignment);
        gpa.<span class="tok-fn">free</span>(self.rest_orientations);
        gpa.<span class="tok-fn">free</span>(self.rest_positions);
        gpa.<span class="tok-fn">free</span>(self.source_positions);
        gpa.<span class="tok-fn">free</span>(self.source_global_rotations);
        gpa.<span class="tok-fn">free</span>(self.retargeted_local_rotations);
        gpa.<span class="tok-fn">free</span>(self.retargeted_global_rotations);
        gpa.<span class="tok-fn">free</span>(self.positions);
        gpa.<span class="tok-fn">free</span>(self.skin);
        <span class="tok-kw">if</span> (self.owns_clip) {
            d3.<span class="tok-fn">unloadBvhSkeletalClip</span>(gpa, self.clip);
        }
        d3.<span class="tok-fn">unloadFbxModel</span>(gpa, self.model);
    }
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    cam: z.OrbitCamera,
    gpa: Allocator,

    characters: [<span class="tok-num">2</span>]Character,
    <span class="tok-comment">/// The checkered floor, as a flattened textured box - GenoView's ground is a plane, but a</span>
    <span class="tok-comment">/// box gives the shadow pass something with thickness to receive onto later (section 12a).</span>
    ground: z.WgpuTexture,
    <span class="tok-comment">/// The shadow-receiving ground: its own pipeline, buffers and bind groups.</span>
    ground_pipeline: z.wgpu.RenderPipelineHandle,
    ground_vbo: z.wgpu.BufferHandle,
    ground_ibo: z.wgpu.BufferHandle,
    ground_index_count: u32,
    ground_vs_ubo: z.wgpu.BufferHandle,
    ground_fs_ubo: z.wgpu.BufferHandle,
    ground_g0: z.wgpu.BindGroupHandle,
    ground_g1: z.wgpu.BindGroupHandle,
    ground_g2: z.wgpu.BindGroupHandle,
    <span class="tok-comment">/// Layouts are kept only so `deinit` can release them - the leak checker counts every</span>
    <span class="tok-comment">/// bind-group layout and pipeline layout, not just the buffers.</span>
    ground_bgls: [<span class="tok-num">3</span>]z.wgpu.BindGroupLayoutHandle,
    ground_pl: z.wgpu.PipelineLayoutHandle,

    <span class="tok-comment">/// The light pass's depth pipeline. One UBO per character, because each has its own model</span>
    <span class="tok-comment">/// matrix and a UBO cannot change between draws in a pass.</span>
    depth_pipeline: z.wgpu.RenderPipelineHandle,
    depth_pl: z.wgpu.PipelineLayoutHandle,
    depth_bgl: z.wgpu.BindGroupLayoutHandle,
    depth_ubos: [<span class="tok-num">2</span>]z.wgpu.BufferHandle,
    depth_bgs: [<span class="tok-num">2</span>]z.wgpu.BindGroupHandle,

    <span class="tok-comment">/// Per-character `lit_shadow` uniforms, so the characters go through the SAME pipeline as</span>
    <span class="tok-comment">/// the ground and therefore receive shadows - including their own.</span>
    char_vs_ubos: [<span class="tok-num">2</span>]z.wgpu.BufferHandle,
    char_fs_ubos: [<span class="tok-num">2</span>]z.wgpu.BufferHandle,
    char_g0: [<span class="tok-num">2</span>]z.wgpu.BindGroupHandle,
    char_g2: [<span class="tok-num">2</span>]z.wgpu.BindGroupHandle,

    <span class="tok-comment">/// -- * THE G-BUFFER: world position, world normal, albedo --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// Three attachments filled by ONE geometry walk via `beginTextureModeMrtRaw`. Only the</span>
    <span class="tok-comment">/// first carries depth - one scene, one depth test.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * POSITION AND NORMAL ARE rgba16-FLOAT, NOT rgba8. SSAO measures distances between</span>
    <span class="tok-comment">/// sampled positions; at 8 bits per channel those distances quantise into terraces and the</span>
    <span class="tok-comment">/// occlusion estimator reads the steps as geometry. The albedo target stays rgba8 because</span>
    <span class="tok-comment">/// colour genuinely only needs 8 bits.</span>
    gbuf_pos: z.RenderTexture,
    gbuf_normal: z.RenderTexture,
    gbuf_albedo: z.RenderTexture,
    gbuf_pipeline: z.wgpu.RenderPipelineHandle,
    gbuf_pl: z.wgpu.PipelineLayoutHandle,
    gbuf_bgls: [<span class="tok-num">2</span>]z.wgpu.BindGroupLayoutHandle,
    <span class="tok-comment">/// One set per drawable: two characters plus the ground.</span>
    gbuf_vs_ubos: [<span class="tok-num">3</span>]z.wgpu.BufferHandle,
    gbuf_fs_ubos: [<span class="tok-num">3</span>]z.wgpu.BufferHandle,
    gbuf_g0: [<span class="tok-num">3</span>]z.wgpu.BindGroupHandle,
    gbuf_g2: [<span class="tok-num">3</span>]z.wgpu.BindGroupHandle,

    <span class="tok-comment">/// The ambient-occlusion factor, one channel's worth in an rgba8 target.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * rgba8 IS ENOUGH HERE, unlike the G-buffer. AO is a 0..1 coverage number that gets</span>
    <span class="tok-comment">/// multiplied into a colour; 256 levels is finer than the eye resolves in shading. The</span>
    <span class="tok-comment">/// G-buffer needed f16 because it stores POSITIONS, whose differences drive the estimator.</span>
    ssao_rt: z.RenderTexture,
    ssao_pipeline: z.wgpu.RenderPipelineHandle,
    ssao_pl: z.wgpu.PipelineLayoutHandle,
    ssao_bgls: [<span class="tok-num">2</span>]z.wgpu.BindGroupLayoutHandle,
    ssao_ubo: z.wgpu.BufferHandle,
    ssao_g1: z.wgpu.BindGroupHandle,
    ssao_g2: z.wgpu.BindGroupHandle,
    ssao_sampler: z.wgpu.SamplerHandle,
    <span class="tok-comment">/// The blur's scratch target. Pass 1 writes `ssao_rt` -&gt; `ssao_blur_rt` (horizontal),</span>
    <span class="tok-comment">/// pass 2 writes back `ssao_blur_rt` -&gt; `ssao_rt` (vertical), so the composite keeps</span>
    <span class="tok-comment">/// reading `ssao_rt` and nothing downstream has to know a blur happened.</span>
    ssao_blur_rt: z.RenderTexture,
    ssao_blur_pipeline: z.wgpu.RenderPipelineHandle,
    ssao_blur_pl: z.wgpu.PipelineLayoutHandle,
    ssao_blur_bgls: [<span class="tok-num">2</span>]z.wgpu.BindGroupLayoutHandle,
    <span class="tok-comment">/// One UBO per pass - a uniform cannot change between draws inside a pass, and these are</span>
    <span class="tok-comment">/// separate passes, but separate buffers also keep the two axes independently inspectable.</span>
    ssao_blur_ubos: [<span class="tok-num">2</span>]z.wgpu.BufferHandle,
    ssao_blur_g2: [<span class="tok-num">2</span>]z.wgpu.BindGroupHandle,
    <span class="tok-comment">/// Bind group reading `ssao_rt` (for the horizontal pass) and one reading `ssao_blur_rt`.</span>
    ssao_blur_g1: [<span class="tok-num">2</span>]z.wgpu.BindGroupHandle,
    fullscreen_vbo: z.wgpu.BufferHandle,

    <span class="tok-comment">/// The shadow map: rgba16-FLOAT colour plus its own depth attachment.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * NOT `loadRenderTexture`, WHICH GIVES rgba8 - 256 depth levels. The default bias in</span>
    <span class="tok-comment">/// `lit_shadow_fs_io` is tuned for an f16 map; against an 8-bit one it is roughly EIGHT</span>
    <span class="tok-comment">/// TIMES too small, and the result is enormous smooth bands of false self-shadow across</span>
    <span class="tok-comment">/// the body and head. That is what the device showed, and `shadowmap`'s own comment</span>
    <span class="tok-comment">/// predicts it: "a float colour target stores the light-view depth at ~16-bit precision</span>
    <span class="tok-comment">/// (vs 256 levels for rgba8), which is what lets the shadow bias drop low enough to avoid</span>
    <span class="tok-comment">/// both acne and peter-panning."</span>
    light_view: z.RenderTexture,
    <span class="tok-comment">/// * NEAREST, NOT LINEAR. Linear filtering blends depths ACROSS SILHOUETTE EDGES, and a</span>
    <span class="tok-comment">/// blended depth is a distance to nothing - the comparison against it is meaningless.</span>
    <span class="tok-comment">/// `loadRenderTexture`'s sampler is linear, which was the second half of the same bug.</span>
    shadow_sampler: z.wgpu.SamplerHandle,

    play_time: f32 = <span class="tok-num">0</span>,
    playing: bool = true,
    <span class="tok-comment">/// * ON by default, with the mesh off: the skeleton is what the robot is being COMPARED to,</span>
    <span class="tok-comment">/// so both need to be visible without touching a control.</span>
    show_skeleton: bool = true,
    <span class="tok-comment">/// Draw every body's and joint's local frame as red/green/blue axes.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// ** Off by default - it is a diagnostic view, and on a 78-joint skeleton it is a lot of</span>
    <span class="tok-comment">/// lines. **On when a frame is suspected**, which in this project has been most of the time.</span>
    show_transforms: bool = false,
    <span class="tok-comment">/// How long to draw those axes, in metres.</span>
    axis_length: f32 = <span class="tok-num">0.08</span>,
    <span class="tok-comment">/// ** OFF by default, because the robot is drawn OVERLAID on the character and a solid mesh</span>
    <span class="tok-comment">/// hides it completely. Every screenshot of this example so far has begun by toggling this</span>
    <span class="tok-comment">/// off - **a default that has to be undone before anything can be seen is the wrong</span>
    <span class="tok-comment">/// default.** The skeleton still draws, so the comparison is immediate.</span>
    show_mesh: bool = false,
    show_ground: bool = true,
    show_light_view: bool = true,
    show_ao: bool = true,
    <span class="tok-comment">// -- * THE ROBOT: `humanoid.xml` driven by the same retarget as the characters --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// 16 bodies against a capture's 96 joints, hinges instead of ball joints, and a tree that</span>
    <span class="tok-comment">// roots at the TORSO with the pelvis hanging below it. All three are handled by machinery</span>
    <span class="tok-comment">// the characters already needed: the global-space retarget copes with the inverted tree,</span>
    <span class="tok-comment">// and `fitBodyRotation` decomposes each desired rotation across whatever DOF a body has.</span>
    robot_doc: z.codecs.xml.Document,
    robot_spec: mjcf.Robot,
    robot: z.robot_mjcf.Imported,
    robot_data: z.robot.Data,
    <span class="tok-comment">/// The robot's rest orientations, from its own `qpos0` - which is measurably a T-POSE.</span>
    robot_reference: []Quat,
    <span class="tok-comment">/// Which capture joint drives each robot body, from `robot.lafan_to_humanoid`.</span>
    human_of_body: []i32,
    robot_parents: []i32,
    robot_rest_alignment: []Quat,
    robot_local: []Quat,
    robot_global: []Quat,
    <span class="tok-comment">/// Body positions converted to the scene's Y-UP frame, filled once per pose.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// ** `robot_mjcf.build` keeps MJCF models Z-UP ON PURPOSE - its acceptance test is</span>
    <span class="tok-comment">/// agreement with MuJoCo body for body, and a frame conversion inside it would turn any</span>
    <span class="tok-comment">/// disagreement into two possible explanations (robot_mjcf.zig:33). So the robot arrives</span>
    <span class="tok-comment">/// standing along +Z, and in a Y-up scene that reads as LYING FLAT ON THE GROUND.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * The conversion happens ONCE HERE, where robot data enters the scene - not at draw</span>
    <span class="tok-comment">/// time. That is the "one-line root rotation" robot_mjcf.zig:39 anticipates its callers</span>
    <span class="tok-comment">/// applying, and it keeps every downstream user (drawing, and later contact or shadows)</span>
    <span class="tok-comment">/// reading Y-up like the rest of zimr.</span>
    robot_positions_y_up: []Vec,
    <span class="tok-comment">/// Per-joint motion relative to the T-pose, re-expressed in the robot's Z-up frame.</span>
    source_delta_z_up: []Quat,
    <span class="tok-comment">/// Position pull per body, from the match table. Zero means orientation only.</span>
    <span class="tok-comment">/// The human-side bone-direction reference the robot pairing uses, kept so `poseRobot` can</span>
    <span class="tok-comment">/// build its motion delta against the SAME reference the alignment was built from.</span>
    robot_human_reference: []Quat,
    <span class="tok-comment">/// Axis correspondence per body: `robot_bone_dir * conj(human_bone_dir)`.</span>
    robot_axis_map: []Quat,
    robot_desired_global: []Quat,
    <span class="tok-comment">/// `i -&gt; i` and all-identity, so `retargetRotations` can do the global-to-local walk with</span>
    <span class="tok-comment">/// the correspondence already folded into the input.</span>
    robot_identity_map: []i32,
    robot_identity_alignment: []Quat,
    robot_position_weights: []f32,
    robot_rotation_weights: []f32,
    <span class="tok-comment">/// Per-body rotation taking the HUMAN's rest bone direction onto the ROBOT's. Identity</span>
    <span class="tok-comment">/// where the two already agree, which the measurement says is torso and both legs.</span>
    robot_limb_correction: []Quat,
    <span class="tok-comment">/// * The ported twist offsets - see `src/notes/twist_port_plan.md`. `robot_twist[b]` maps</span>
    <span class="tok-comment">/// the robot's rest bone direction onto the capture's; `robot_parent_twist[b]` is the twist</span>
    <span class="tok-comment">/// of `b`'s parent, undone so a chain does not accumulate it.</span>
    robot_rest_world: []Vec,
    robot_rest_rotations: []Quat,
    <span class="tok-comment">/// The robot's body positions at `qpos0`, kept for the rest-pose comparison.</span>
    robot_rest_xpos: []Vec,
    <span class="tok-comment">/// The solved T-pose configuration, so it can be restored without re-solving.</span>
    robot_tpose_qpos: []f32,
    <span class="tok-comment">/// The robot's body orientations at the solved T-pose, needed to place its geoms.</span>
    robot_rest_xrot: []Quat,
    <span class="tok-comment">/// The robot's body POSITIONS in the solved rest pose, for the leaf correspondence check.</span>
    robot_rest_body_pos: []Vec,
    <span class="tok-comment">/// Each 1-DOF body's bend at the SOLVED rest pose, in radians - the offset a hinge</span>
    <span class="tok-comment">/// coordinate is measured from.</span>
    robot_rest_flexion: []f32,
    <span class="tok-comment">/// Point-cloud samples, built once when the robot map changes.</span>
    robot_samples: []z.robot.PointSample,
    robot_sample_count: usize = <span class="tok-num">0</span>,
    <span class="tok-comment">/// How many robot bodies the match table resolved. **Zero means the robot is hidden and the</span>
    <span class="tok-comment">/// cause is the TABLE**, which looked like a rendering bug for two turns.</span>
    robot_mapped_count: usize = <span class="tok-num">0</span>,
    <span class="tok-comment">/// How many frames `poseRobot` has actually completed. **Zero with the robot visible means</span>
    <span class="tok-comment">/// the pose function is not being reached**, which draws every body at the origin.</span>
    robot_posed_frames: usize = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Mean and worst world distance from a robot body to its capture joint, and which body is</span>
    <span class="tok-comment">/// worst. **The metric that matches what the eye integrates**; angle metrics are blind to a</span>
    <span class="tok-comment">/// figure standing in the wrong place.</span>
    robot_visual_mean: f32 = -<span class="tok-num">1</span>,
    robot_visual_worst: f32 = -<span class="tok-num">1</span>,
    robot_visual_worst_name: []<span class="tok-kw">const</span> u8 = <span class="tok-str">""</span>,
    <span class="tok-comment">/// How far to pull targets from the RETARGETED skeleton (0) toward the capture's own world</span>
    <span class="tok-comment">/// joints (1).</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// -- *** THE DIAL BETWEEN SHAPE AND PLACE --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// At 0 every target is built from the ROBOT's own bone lengths, so it is exactly reachable</span>
    <span class="tok-comment">/// and the chain accumulates away from the capture. At 1 the targets ARE the capture's</span>
    <span class="tok-comment">/// joints, so the figure stands where the dancer stands but a mismatched limb cannot reach.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// ** **1.0 is right when the proportions match** - `humanoid_flex2.xml` is Geno-shaped, and</span>
    <span class="tok-comment">/// swept 0/0.5/1.0 the highest value won on every bone. **A robot whose proportions do NOT</span>
    <span class="tok-comment">/// match wants a lower value**, which is the case this dial exists for and the one that was</span>
    <span class="tok-comment">/// previously a hardcoded constant.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * Exposed because the readout beside it now reports `fit` and `worst`, so the trade can be</span>
    <span class="tok-comment">/// judged on the capture it applies to rather than inferred from a different one.</span>
    robot_position_pull: f32 = <span class="tok-num">1.0</span>,
    <span class="tok-comment">/// Load the STOCK `humanoid.xml` instead of the Geno-shaped `humanoid_flex2.xml`.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// ** `flex2` was built FOR Geno: arms shortened 20%, spine split matched, a third shoulder</span>
    <span class="tok-comment">/// axis. **Running a Mixamo capture on the stock model is the honest generalisation test** -</span>
    <span class="tok-comment">/// nothing about it was tuned for either.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * Read ONCE, in `initRobot`. Changing it mid-session does nothing, which is why there is</span>
    <span class="tok-comment">/// no checkbox for it: reloading the robot means rebuilding the model, data, tasks, scratch,</span>
    <span class="tok-comment">/// samples and rest pose.</span>
    robot_use_stock: bool = false,
    <span class="tok-comment">/// Last frame's configuration, for the posture term.</span>
    robot_previous_qpos: []f32,
    robot_has_previous: bool = false,
    <span class="tok-comment">/// Draw the robot's actual GEOMS, not just capsules between body origins.</span>
    show_robot_geoms: bool = true,
    <span class="tok-comment">/// True once the map and the solved T-pose exist - the comparison view depends on both.</span>
    robot_ready: bool = false,
    robot_twist: []Quat,
    robot_parent_twist: []Quat,
    robot_tasks: []z.robot.IkTask,
    robot_ik_scratch: []f32,
    <span class="tok-comment">/// * Live, because the right count is a measurement. Zero disables the IK stage entirely,</span>
    <span class="tok-comment">/// which is the A/B that says whether it is helping.</span>
    <span class="tok-comment">/// * HIGHER THAN BEFORE, because the IK now does ALL the work: there is no analytic fit</span>
    <span class="tok-comment">/// supplying a warm start, and each frame begins from the rest configuration. GMR warm-</span>
    <span class="tok-comment">/// starts from the previous frame and converges in a handful; starting from rest costs more</span>
    <span class="tok-comment">/// steps and buys a frame that cannot inherit the previous one's error.</span>
    <span class="tok-comment">/// ** MUST MATCH A RADIO VALUE. It was 30 while the radios offered 0 and 20, so NEITHER</span>
    <span class="tok-comment">/// showed as selected and the UI could not tell you what was running. A default that no</span>
    <span class="tok-comment">/// control can display is a silent state.</span>
    robot_ik_iterations: i32 = <span class="tok-num">20</span>,
    robot_ik_damping: f32 = <span class="tok-num">1.0</span>,
    <span class="tok-comment">/// Draw the robot on top of the character it follows, rather than beside it.</span>
    robot_overlay: bool = true,
    <span class="tok-comment">/// Show both rest poses instead of the animation, for inspecting what the twists are built</span>
    <span class="tok-comment">/// from.</span>
    show_tpose_compare: bool = false,
    <span class="tok-comment">/// X offset between the two rest poses. Zero superimposes them.</span>
    tpose_offset: f32 = <span class="tok-num">1.2</span>,
    <span class="tok-comment">/// * How many mapped bodies take part. 1 is the TORSO ALONE - the smallest thing that can</span>
    <span class="tok-comment">/// be checked, and the one every previous attempt skipped straight past.</span>
    <span class="tok-comment">/// * All sixteen by default now that the formula is settled. The 1/2/4/8 steps remain, so</span>
    <span class="tok-comment">/// a future problem can be bisected the same way this one finally was.</span>
    <span class="tok-comment">/// Which candidate orientation formula to use - see `poseRobot`. Selectable because</span>
    <span class="tok-comment">/// deriving the right one has cost more rounds than trying them will.</span>
    <span class="tok-comment">/// *  (mode 2) is the best measured candidate now that one-hinge joints BEND rather</span>
    <span class="tok-comment">/// than aim: +0.151 against -0.231 and -0.196 for the other two. Still far from +1.0, so</span>
    <span class="tok-comment">/// this is the current best, not a solution.</span>
    robot_orientation_mode: i32 = <span class="tok-num">2</span>,
    <span class="tok-comment">/// Degrees of yaw about the robot's up axis, correcting the two skeletons' FACING.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// -- *** WHY A YAW, AND WHY A QUARTER TURN - both facings MEASURED --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">///     LAFAN1    LeftToeBase offset (Y-up)   = (0, 0, 15.26)      character faces +Z</span>
    <span class="tok-comment">///     humanoid  foot geom fromto (Z-up)     = -.07 -&gt; +.14 in x   robot faces +X</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// ** **The two skeletons are a quarter turn apart, and nothing else differs.** That is the</span>
    <span class="tok-comment">/// whole correction - one number shared by every bone - and it is why the per-joint rest</span>
    <span class="tok-comment">/// alignments this arc built were machinery for a problem that does not exist.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * **-90, NOT +90, AND THE DERIVATION SAYS OTHERWISE.** Mapping Y-up to Z-up as</span>
    <span class="tok-comment">/// `(x, y, z) -&gt; (x, -z, y)` sends the human's +Z forward to -Y, and taking -Y to +X is</span>
    <span class="tok-comment">/// +90 about Z on paper. The device says -90. So one of two sign conventions is opposite to</span>
    <span class="tok-comment">/// my assumption - the handedness of that map, or zm's rotation sense.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// ** **THE MEASURED VALUE IS AUTHORITATIVE AND THE DISCREPANCY IS RECORDED RATHER THAN</span>
    <span class="tok-comment">/// SMOOTHED OVER.** A derivation that disagrees with the device is a derivation with a bug</span>
    <span class="tok-comment">/// in it, and writing "+90 by symmetry" over a working -90 would bury a real inconsistency</span>
    <span class="tok-comment">/// for the next person to trip on.</span>
    robot_facing_yaw: f32 = -<span class="tok-num">90.0</span>,
    <span class="tok-comment">/// ** REMOVED, DELIBERATELY. Two attempts at a "rest check" were both VACUOUS -</span>
    <span class="tok-comment">/// `qmul(q, conj(q))` and `qmul(c, conj(c))` are identity for ANY input, so both read</span>
    <span class="tok-comment">/// 0.0000 on device while proving nothing. A third guess would have been worse than none.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * A real one has to compare against something EXTERNAL: solve with the human at its</span>
    <span class="tok-comment">/// T-pose and assert the robot ends up STANDING - head above pelvis above feet. That needs</span>
    <span class="tok-comment">/// its own solve and belongs in a test, not in the frame loop.</span>
    robot_rest_check_removed: void = {},
    <span class="tok-comment">/// Mean unrepresentable angle across mapped bodies - the honest quality number, shown in</span>
    <span class="tok-comment">/// the UI so a MODEL limit never gets mistaken for a bug.</span>
    robot_mean_residual: f32 = <span class="tok-num">0</span>,
    show_robot: bool = true,
    robot_dirty: bool = true,
    <span class="tok-comment">/// Which character's clip drives the robot.</span>
    <span class="tok-comment">/// Which character's animation the robot follows. **1 = the Mixamo drop kick**, index 0 being</span>
    <span class="tok-comment">/// Geno's dance.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// -- *** DEFAULT TO THE CASE THAT FAILS --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// This defaulted to the drop kick (index 1) so the least-tested path would be on screen.</span>
    <span class="tok-comment">/// **But the drop kick WORKS and Geno's dance does not** - so the default was hiding the</span>
    <span class="tok-comment">/// broken case behind a working one, and every screenshot needed a manual toggle first.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * A default should show the thing most likely to be wrong. **Right now that is the</span>
    <span class="tok-comment">/// dance**, whose targets collapsed to a 0.42 m ball while the drop kick's were fine.</span>
    robot_source: usize = <span class="tok-num">0</span>,

    <span class="tok-comment">/// Set when a source selection changes, so the name maps rebuild once rather than per frame.</span>
    retarget_dirty: bool = true,
    <span class="tok-comment">/// * REST ALIGNMENT ON/OFF, so the correction can be judged against its absence.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// It is unambiguously right for limbs - LAFAN1's leg bones point (0,-1,0) at rest and</span>
    <span class="tok-comment">/// Mixamo's point (0,+1,0), and without the correction the legs bend backwards. It is</span>
    <span class="tok-comment">/// LESS clearly right for hands and feet, whose rest direction is derived from a THUMB and</span>
    <span class="tok-comment">/// a TOE respectively, and those disagree by ~72 and 90 degrees between the two rigs:</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">///     LeftFoot   src(0,0,1)          dst(0,1,0)             dot = 0.000</span>
    <span class="tok-comment">///     LeftHand   src(0.50,0.69,0.52) dst(-0.68,0.62,0.40)   dot = 0.296</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// A toggle is honest here: the limb fix is verified and the extremity behaviour is not,</span>
    <span class="tok-comment">/// so both are visible side by side rather than one being assumed.</span>
    align_rest: bool = true,
    <span class="tok-comment">/// Which offscreen target the corner inset shows: 0 shadow map, 1 G-buffer position,</span>
    <span class="tok-comment">/// 2 G-buffer normal, 3 G-buffer albedo.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * EVERY STAGE INSPECTABLE ON ITS OWN. section 12's method, and the reason the earlier</span>
    <span class="tok-comment">/// inverted-shadow and flat-grey bugs were findable at all: a six-pass pipeline where only</span>
    <span class="tok-comment">/// the final image can be seen is a pipeline where any one stage can be silently wrong.</span>
    debug_view: i32 = <span class="tok-num">4</span>,
    <span class="tok-comment">/// Bone thickness in world units. A human forearm is ~4 cm at this scale; the default</span>
    <span class="tok-comment">/// reads clearly without swallowing the joints.</span>
    capsule_radius: f32 = <span class="tok-num">0.018</span>,
    <span class="tok-comment">/// Sun direction. Defaults reproduce the original fixed `(-0.5, -1.0, -0.4)`.</span>
    light_yaw: f32 = <span class="tok-num">51.0</span>,
    light_pitch: f32 = <span class="tok-num">57.0</span>,
    <span class="tok-comment">/// Shadow-compare bias, {slope, min}. * EXPOSED AS SLIDERS because the right values depend</span>
    <span class="tok-comment">/// on the DEPTH MAP'S PRECISION and on how grazing the light is - and because self-shadow</span>
    <span class="tok-comment">/// acne on a curved character is far pickier than a flat floor ever was. The defaults are</span>
    <span class="tok-comment">/// `lit_shadow_fs_io`'s, tuned for an f16 map.</span>
    <span class="tok-comment">/// SSAO knobs, live so the effect can be dialled against the render.</span>
    ssao_radius: f32 = <span class="tok-num">0.5</span>,
    ssao_bias: f32 = <span class="tok-num">0.025</span>,
    ssao_intensity: f32 = <span class="tok-num">0.15</span>,
    blur_ao: bool = true,
    <span class="tok-comment">/// Squared world distance is multiplied by this before the exponential - larger rejects</span>
    <span class="tok-comment">/// neighbours sooner, preserving edges at the cost of leaving more noise.</span>
    blur_falloff: f32 = <span class="tok-num">8.0</span>,
    <span class="tok-comment">/// Exponent on the normal-alignment term; larger keeps creases crisper.</span>
    blur_normal_power: f32 = <span class="tok-num">8.0</span>,
    shadow_bias_slope: f32 = <span class="tok-num">0.0025</span>,
    shadow_bias_min: f32 = <span class="tok-num">0.0008</span>,
    status: [<span class="tok-num">96</span>]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    status_len: usize = <span class="tok-num">0</span>,

    <span class="tok-comment">/// The facing correction as a quaternion, about the robot's up axis.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * Z IS UP IN THE ROBOT'S FRAME, so the yaw is about Z - not about Y, which is up for the</span>
    <span class="tok-comment">/// character side. Getting that wrong would tip the robot rather than turn it.</span>
    <span class="tok-kw">fn</span> <span class="tok-fn">robotFacingYaw</span>(self: *<span class="tok-kw">const</span> State) Quat {
        <span class="tok-kw">return</span> zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), <span class="tok-fn">radFromDeg</span>(self.robot_facing_yaw));
    }
};

<span class="tok-comment">/// A joint's world matrix from a sampled pose: rotate, then translate.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * `mulMat(a, b)` APPLIES **b FIRST, THEN a** in zm - the opposite of reading it</span>
<span class="tok-comment">/// left-to-right, and the opposite of raylib's `MatrixMultiply`. So "rotate then translate" is</span>
<span class="tok-comment">/// `mulMat(translation, rotation)`, not the other way round. Pinned by a test in `draw3d`</span>
<span class="tok-comment">/// (`zm: mulMat and mulMatVec compose in the order the skinning path assumes`), because the</span>
<span class="tok-comment">/// The inverse of a rotation-plus-translation matrix, computed as a rigid inverse rather than a</span>
<span class="tok-comment">/// general one: transpose the rotation block, then negate the translation through it.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * Exact here and cheaper than a general inverse, BUT it assumes no scale - which holds</span>
<span class="tok-comment">/// because BVH carries only rotation and translation, and `fromFbx` writes exactly those</span>
<span class="tok-kw">fn</span> <span class="tok-fn">setStatus</span>(s: *State, <span class="tok-kw">comptime</span> fmt: []<span class="tok-kw">const</span> u8, args: <span class="tok-kw">anytype</span>) void {
    <span class="tok-kw">const</span> written: []u8 = <span class="tok-fn">bufPrint</span>(&amp;s.status, fmt, args) <span class="tok-kw">catch</span> {
        s.status_len = <span class="tok-num">0</span>;
        <span class="tok-kw">return</span>;
    };
    s.status_len = written.len;
}

<span class="tok-comment">/// * The example's central claim, checked rather than trusted.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">skeletonsMatch</span>(a: d3.BvhSkeletalClip, b: d3.BvhSkeletalClip) bool {
    <span class="tok-kw">if</span> (a.<span class="tok-fn">boneCount</span>() != b.<span class="tok-fn">boneCount</span>()) {
        <span class="tok-kw">return</span> false;
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..a.<span class="tok-fn">boneCount</span>()) |j| {
        <span class="tok-kw">if</span> (!std.mem.<span class="tok-fn">eql</span>(u8, a.<span class="tok-fn">boneName</span>(j), b.<span class="tok-fn">boneName</span>(j))) {
            <span class="tok-kw">return</span> false;
        }
    }
    <span class="tok-kw">return</span> true;
}

<span class="tok-comment">/// Build a character from FBX bytes, optionally driven by an external clip.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">makeCharacter</span>(
    gpa: Allocator,
    fbx_bytes: []<span class="tok-kw">const</span> u8,
    external: ?d3.BvhSkeletalClip,
    offset: Vec,
    label: []<span class="tok-kw">const</span> u8,
    recompute_normals: bool,
    self_index: usize,
    <span class="tok-comment">/// A BVH holding this skeleton in a T-POSE, or null to use the FBX bind pose. Supply one</span>
    <span class="tok-comment">/// when the bind is NOT a T-pose - Geno's is an A-pose, and mixing an A reference with a</span>
    <span class="tok-comment">/// T reference droops every arm by the difference.</span>
    tpose_bvh: ?[]<span class="tok-kw">const</span> u8,
) !Character {
    <span class="tok-comment">// * Retarget scratch is sized to the LARGEST skeleton any character in this scene has,</span>
    <span class="tok-comment">// not to this one's. A 78-joint Mixamo rig driven by a 96-joint capture reads 96 source</span>
    <span class="tok-comment">// rotations, and sizing to 78 would overrun.</span>
    <span class="tok-kw">const</span> max_scene_joint_count: usize = <span class="tok-num">128</span>;
    <span class="tok-kw">const</span> model: d3.FbxModel = <span class="tok-kw">try</span> d3.<span class="tok-fn">loadFbxModel</span>(gpa, fbx_bytes, .{
        .recompute_normals = recompute_normals,
        .scale = cm_to_m,
    });
    <span class="tok-kw">errdefer</span> d3.<span class="tok-fn">unloadFbxModel</span>(gpa, model);

    <span class="tok-kw">const</span> n: usize = model.clip.<span class="tok-fn">boneCount</span>();
    <span class="tok-kw">const</span> skin: []Mat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Mat, n);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(skin);
    <span class="tok-kw">const</span> positions: []Vec = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, n);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(positions);
    <span class="tok-kw">const</span> rotations: []Quat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, n);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(rotations);

    <span class="tok-comment">// Retarget scratch. Sized to this character's own joint count; the source may have more or</span>
    <span class="tok-comment">// fewer, which is exactly what the map exists to bridge.</span>
    <span class="tok-kw">const</span> source_of_target: []i32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(i32, n);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(source_of_target);
    <span class="tok-kw">const</span> target_parents: []i32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(i32, n);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(target_parents);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |joint| {
        target_parents[joint] = model.clip.skeleton.bones[joint].parent;
    }
    <span class="tok-kw">const</span> rest_alignment: []Quat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, n);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(rest_alignment);
    <span class="tok-kw">for</span> (rest_alignment) |*correction| {
        correction.* = zm.quat_identity;
    }
    <span class="tok-kw">const</span> rest_orientations: []Quat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, n);
    <span class="tok-comment">// * T-pose world POSITIONS, kept because the twist offsets need bone DIRECTIONS and the</span>
    <span class="tok-comment">// `bindPose` is Geno's A-POSE - a different pose entirely.</span>
    <span class="tok-kw">const</span> rest_positions: []Vec = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, n);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(rest_orientations);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(rest_positions);
    <span class="tok-comment">// -- *** THE REFERENCE POSE: BIND ORIENTATIONS, NOT DERIVED ONES --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Every character here comes from an FBX, and an FBX states each joint's true world</span>
    <span class="tok-comment">// orientation at bind in its skin clusters' `TransformLink`. That is a REAL pose, unlike</span>
    <span class="tok-comment">// one inferred from bone directions - Mixamo's offsets sit in rotated local frames, so</span>
    <span class="tok-comment">// FK-ing them with identity rotations puts the hand straight up above the shoulder and the</span>
    <span class="tok-comment">// foot ABOVE the hips.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * Deriving is kept as the fallback for a skeleton with no bind data (a bare BVH), where</span>
    <span class="tok-comment">// rest rotations genuinely are identity and the derivation holds.</span>
    <span class="tok-kw">if</span> (tpose_bvh) |tpose_bytes| {
        <span class="tok-kw">try</span> <span class="tok-fn">referenceOrientationsFromTPoseBvh</span>(
            gpa,
            tpose_bytes,
            model.clip,
            rest_orientations,
            rest_positions,
        );
    } <span class="tok-kw">else</span> {
        d3.<span class="tok-fn">fbxBindOrientations</span>(model, rest_orientations);
        <span class="tok-comment">// * No T-pose file: fall back to the FBX bind's own world positions, which for a Mixamo</span>
        <span class="tok-comment">// rig IS a T-pose.</span>
        <span class="tok-kw">const</span> bind_pose: [*]z.types.Transform =
            <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(model.clip.skeleton.bindPose));
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |joint| {
            <span class="tok-kw">const</span> parent: i32 = target_parents[joint];
            rest_positions[joint] = <span class="tok-kw">if</span> (parent &lt; <span class="tok-num">0</span>)
                bind_pose[joint].translation
            <span class="tok-kw">else</span>
                rest_positions[<span class="tok-builtin">@intCast</span>(parent)] +
                    zm.<span class="tok-fn">rotate</span>(rest_orientations[<span class="tok-builtin">@intCast</span>(parent)], bind_pose[joint].translation);
        }
    }
    <span class="tok-kw">if</span> (tpose_bvh == null) {
        <span class="tok-kw">var</span> bind_is_present: bool = false;
        <span class="tok-kw">for</span> (rest_orientations[<span class="tok-num">0</span>..n]) |orientation| {
            <span class="tok-kw">const</span> is_identity: bool = <span class="tok-builtin">@abs</span>(<span class="tok-builtin">@abs</span>(orientation[<span class="tok-num">3</span>]) - <span class="tok-num">1.0</span>) &lt; <span class="tok-num">1.0e-4</span>;
            <span class="tok-kw">if</span> (!is_identity) {
                bind_is_present = true;
                <span class="tok-kw">break</span>;
            }
        }
        <span class="tok-kw">if</span> (!bind_is_present) {
            <span class="tok-kw">const</span> rest_offsets: []Vec = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, n);
            <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(rest_offsets);
            <span class="tok-kw">const</span> rest_pose: [*]z.types.Transform =
                <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(model.clip.skeleton.bindPose));
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |joint| {
                rest_offsets[joint] = rest_pose[joint].translation;
            }
            z.codecs.bvh.<span class="tok-fn">restBoneOrientations</span>(target_parents, rest_offsets, rest_orientations);
        }
    }
    <span class="tok-kw">const</span> source_positions: []Vec = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, max_scene_joint_count);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(source_positions);
    <span class="tok-kw">const</span> source_global_rotations: []Quat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, max_scene_joint_count);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(source_global_rotations);
    <span class="tok-kw">const</span> retargeted_local_rotations: []Quat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, n);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(retargeted_local_rotations);
    <span class="tok-kw">const</span> retargeted_global_rotations: []Quat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, n);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(retargeted_global_rotations);

    <span class="tok-kw">const</span> mesh_count: usize = <span class="tok-builtin">@intCast</span>(model.model.meshCount);
    <span class="tok-kw">const</span> base: [][]f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>([]f32, mesh_count);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(base);
    <span class="tok-kw">const</span> skinned: [][]f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>([]f32, mesh_count);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(skinned);
    <span class="tok-kw">const</span> base_n: [][]f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>([]f32, mesh_count);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(base_n);
    <span class="tok-kw">const</span> skinned_n: [][]f32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>([]f32, mesh_count);
    <span class="tok-kw">errdefer</span> gpa.<span class="tok-fn">free</span>(skinned_n);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..mesh_count) |m| {
        <span class="tok-kw">const</span> mesh: z.Mesh = model.model.meshes[m];
        <span class="tok-kw">const</span> vc: usize = <span class="tok-builtin">@intCast</span>(mesh.vertexCount);
        base[m] = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vc * <span class="tok-num">3</span>);
        <span class="tok-builtin">@memcpy</span>(base[m], mesh.vertices[<span class="tok-num">0</span> .. vc * <span class="tok-num">3</span>]);
        skinned[m] = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vc * <span class="tok-num">3</span>);
        base_n[m] = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vc * <span class="tok-num">3</span>);
        <span class="tok-builtin">@memcpy</span>(base_n[m], mesh.normals[<span class="tok-num">0</span> .. vc * <span class="tok-num">3</span>]);
        skinned_n[m] = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, vc * <span class="tok-num">3</span>);
    }

    <span class="tok-kw">return</span> .{
        .model = model,
        .clip = external <span class="tok-kw">orelse</span> model.clip,
        .owns_clip = external != null,
        .offset = offset,
        .label = label,
        <span class="tok-comment">// Starts playing its own clip: no retarget until the UI asks for one.</span>
        .source_character = self_index,
        .source_of_target = source_of_target,
        .mapped_joint_count = <span class="tok-num">0</span>,
        .target_parents = target_parents,
        .rest_alignment = rest_alignment,
        .rest_orientations = rest_orientations,
        .rest_positions = rest_positions,
        .source_positions = source_positions,
        .source_global_rotations = source_global_rotations,
        .retargeted_local_rotations = retargeted_local_rotations,
        .retargeted_global_rotations = retargeted_global_rotations,
        .hip_height = <span class="tok-fn">rootHeightAtRest</span>(model.clip),
        .skin = skin,
        .positions = positions,
        .rotations = rotations,
        .base_positions = base,
        .skinned = skinned,
        .base_normals = base_n,
        .skinned_normals = skinned_n,
    };
}

<span class="tok-comment">/// Build the ground plane and everything needed to draw it with `lit_shadow`.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- * WHY THE GROUND GETS ITS OWN PIPELINE --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `drawCubeTexture` and `drawMeshInstanced` both bind pipelines the engine owns</span>
<span class="tok-comment">/// (`cube3d_fs`), which know nothing about a shadow map. Receiving a shadow means running</span>
<span class="tok-comment">/// `lit_shadow_fs`, and that means building the pipeline here: shader modules, three bind-group</span>
<span class="tok-comment">/// layouts, a pipeline layout, two UBOs and a sampler. `examples/shadowmap` is large mostly</span>
<span class="tok-comment">/// because of this scaffolding, and there is no shortcut around it.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The plane is a static mesh, so its buffers are created ONCE with `createBufferInit` rather</span>
<span class="tok-comment">/// than going through the retained registry - that registry exists for meshes the engine draws,</span>
<span class="tok-comment">/// and this one is drawn by hand.</span>
<span class="tok-comment">/// Build the G-buffer targets and the prepass pipeline.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * SIZED TO THE SHADOW MAP, NOT THE WINDOW. A G-buffer normally matches the backbuffer, but</span>
<span class="tok-comment">/// that means rebuilding it on every resize - and SSAO at HALF resolution is the standard</span>
<span class="tok-comment">/// trade (the plan's adversarial point 3 flagged attachment memory on mobile). A fixed square</span>
<span class="tok-comment">/// keeps this phase simple and the memory bounded; matching the window is a later refinement</span>
<span class="tok-comment">/// once the AO is known to be correct.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">initGbuffer</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> dim: u32 = gbuffer_size;

    s.gbuf_pos = z.RenderTexture.<span class="tok-fn">create</span>(device, .{
        .width = dim,
        .height = dim,
        .format = .rgba16_float,
        .with_depth = true,
        .depth_format = .depth24_plus,
        .label = <span class="tok-str">"gd_gbuf_pos"</span>,
    });
    s.gbuf_normal = z.RenderTexture.<span class="tok-fn">create</span>(device, .{
        .width = dim,
        .height = dim,
        .format = .rgba16_float,
        .label = <span class="tok-str">"gd_gbuf_normal"</span>,
    });
    s.gbuf_albedo = z.RenderTexture.<span class="tok-fn">create</span>(device, .{
        .width = dim,
        .height = dim,
        .format = .rgba8_unorm,
        .label = <span class="tok-str">"gd_gbuf_albedo"</span>,
    });

    s.gbuf_bgls[<span class="tok-num">0</span>] =
