        <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroupLayout</span>(gpa, device, gbuf_vs_bytes, .{ .vertex = true }, <span class="tok-str">"gd_gbuf_g0"</span>);
    s.gbuf_bgls[<span class="tok-num">1</span>] =
        <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroupLayout</span>(gpa, device, gbuf_fs_bytes, .{ .fragment = true }, <span class="tok-str">"gd_gbuf_g2"</span>);
    <span class="tok-comment">// gbuffer_vs/fs use groups 0 and 2; group 1 is empty but must still exist in the layout.</span>
    <span class="tok-kw">const</span> empty_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, &amp;.{}, <span class="tok-str">"gd_gbuf_empty"</span>);
    s.gbuf_pl = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ s.gbuf_bgls[<span class="tok-num">0</span>], empty_bgl, s.gbuf_bgls[<span class="tok-num">1</span>] },
        <span class="tok-str">"gd_gbuf_pl"</span>,
    );

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.gbuf_vs_ubos.len) |i| {
        s.gbuf_vs_ubos[i] = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = gbuf_vs_bytes,
            .usage = .{ .uniform = true, .copy_dst = true },
            .label = <span class="tok-str">"gd_gbuf_vs_ubo"</span>,
        });
        s.gbuf_fs_ubos[i] = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = gbuf_fs_bytes,
            .usage = .{ .uniform = true, .copy_dst = true },
            .label = <span class="tok-str">"gd_gbuf_fs_ubo"</span>,
        });
        s.gbuf_g0[i] = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroup</span>(
            gpa,
            device,
            s.gbuf_bgls[<span class="tok-num">0</span>],
            s.gbuf_vs_ubos[i],
            gbuf_vs_bytes,
            <span class="tok-str">"gd_gbuf_g0_bg"</span>,
        );
        s.gbuf_g2[i] = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroup</span>(
            gpa,
            device,
            s.gbuf_bgls[<span class="tok-num">1</span>],
            s.gbuf_fs_ubos[i],
            gbuf_fs_bytes,
            <span class="tok-str">"gd_gbuf_g2_bg"</span>,
        );
    }

    <span class="tok-kw">const</span> vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, gbuffer_vs_wgsl, <span class="tok-str">"gbuffer_vs"</span>);
    <span class="tok-kw">const</span> fs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, gbuffer_fs_wgsl, <span class="tok-str">"gbuffer_fs"</span>);
    <span class="tok-kw">const</span> layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(GroundVertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
            .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
        },
    };
    <span class="tok-kw">const</span> combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none, <span class="tok-comment">// no blend - a G-buffer stores data, not colour to mix</span>
        .less,
        .none,
        .rgba16_float, <span class="tok-comment">// location 0: world position</span>
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = combo,
        <span class="tok-comment">// * The MRT tail: locations 1 and 2. Their formats must match the render textures</span>
        <span class="tok-comment">// bound at those slots or pipeline creation is rejected.</span>
        .extra_color_formats = &amp;.{ .rgba16_float, .rgba8_unorm },
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    s.gbuf_pipeline =
        z.wgpu.<span class="tok-fn">createRenderPipeline</span>(device, s.gbuf_pl, vs_mod, fs_mod, blob, <span class="tok-str">"gd_gbuf_pipe"</span>);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(fs_mod);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(empty_bgl);
}

<span class="tok-comment">/// Build the SSAO target, sampler, pipeline and bind groups.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">initSsao</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;

    s.ssao_rt = z.RenderTexture.<span class="tok-fn">create</span>(device, .{
        .width = gbuffer_size,
        .height = gbuffer_size,
        .format = .rgba8_unorm,
        <span class="tok-comment">// * Depth attachment even though a fullscreen quad needs no depth TEST: the pipeline's</span>
        <span class="tok-comment">// state combo must name a depth format, and it has to match the pass's attachments.</span>
        <span class="tok-comment">// `deferred_render`'s shading pass does the same and notes why the test still passes -</span>
        <span class="tok-comment">// the quad sits at z=0 against a cleared depth of 1.0.</span>
        .with_depth = true,
        .depth_format = .depth24_plus,
        .label = <span class="tok-str">"gd_ssao_rt"</span>,
    });
    <span class="tok-comment">// * NEAREST. A FILTERED world position is a point on no surface, and the occlusion test</span>
    <span class="tok-comment">// against it is meaningless - the same reason the shadow map wants nearest, and the second</span>
    <span class="tok-comment">// half of the bug that made the shadows band.</span>
    s.ssao_sampler = z.wgpu.<span class="tok-fn">createSampler</span>(device, .{
        .mag_filter_linear = false,
        .min_filter_linear = false,
        .address_mode = .clamp_to_edge,
    });

    <span class="tok-kw">const</span> g1_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{ .binding = <span class="tok-num">0</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">1</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
        .{ .binding = <span class="tok-num">2</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">3</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
    };
    <span class="tok-kw">const</span> g1_layout_blob: []<span class="tok-kw">const</span> u8 =
        <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g1_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_layout_blob);
    s.ssao_bgls[<span class="tok-num">0</span>] = z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g1_layout_blob, <span class="tok-str">"gd_ssao_g1"</span>);
    <span class="tok-kw">const</span> g1_binds = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .texture_view = s.gbuf_pos.color_view } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .sampler = s.ssao_sampler } },
        .{ .binding = <span class="tok-num">2</span>, .resource = .{ .texture_view = s.gbuf_normal.color_view } },
        .{ .binding = <span class="tok-num">3</span>, .resource = .{ .sampler = s.ssao_sampler } },
    };
    <span class="tok-kw">const</span> g1_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;g1_binds);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_blob);
    s.ssao_g1 = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, s.ssao_bgls[<span class="tok-num">0</span>], g1_blob, <span class="tok-str">"gd_ssao_g1_bg"</span>);

    s.ssao_bgls[<span class="tok-num">1</span>] = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroupLayout</span>(
        gpa,
        device,
        ssao_ubo_bytes,
        .{ .fragment = true },
        <span class="tok-str">"gd_ssao_g2"</span>,
    );
    s.ssao_ubo = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = ssao_ubo_bytes,
        .usage = .{ .uniform = true, .copy_dst = true },
        .label = <span class="tok-str">"gd_ssao_ubo"</span>,
    });
    s.ssao_g2 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroup</span>(
        gpa,
        device,
        s.ssao_bgls[<span class="tok-num">1</span>],
        s.ssao_ubo,
        ssao_ubo_bytes,
        <span class="tok-str">"gd_ssao_g2_bg"</span>,
    );

    <span class="tok-kw">const</span> empty_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, &amp;.{}, <span class="tok-str">"gd_ssao_empty"</span>);
    s.ssao_pl = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ empty_bgl, s.ssao_bgls[<span class="tok-num">0</span>], s.ssao_bgls[<span class="tok-num">1</span>] },
        <span class="tok-str">"gd_ssao_pl"</span>,
    );

    s.fullscreen_vbo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        f.gpu.queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(fullscreen_verts[<span class="tok-num">0</span>..]),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"gd_fullscreen_vbo"</span>,
    );

    <span class="tok-kw">const</span> vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, fullscreen_vs_wgsl, <span class="tok-str">"deferred_shading_vs"</span>);
    <span class="tok-kw">const</span> fs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, ssao_fs_wgsl, <span class="tok-str">"ssao_fs"</span>);
    <span class="tok-kw">const</span> ndc_layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>([<span class="tok-num">2</span>]f32),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x2, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
        },
    };
    <span class="tok-kw">const</span> combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less, <span class="tok-comment">// quad at z=0 against cleared depth 1.0 - always passes</span>
        .none,
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{ndc_layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    s.ssao_pipeline =
        z.wgpu.<span class="tok-fn">createRenderPipeline</span>(device, s.ssao_pl, vs_mod, fs_mod, blob, <span class="tok-str">"gd_ssao_pipe"</span>);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(fs_mod);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(empty_bgl);
}

<span class="tok-comment">/// Build the bilateral blur's target, pipeline and the two bind-group pairs.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">initSsaoBlur</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;

    s.ssao_blur_rt = z.RenderTexture.<span class="tok-fn">create</span>(device, .{
        .width = gbuffer_size,
        .height = gbuffer_size,
        .format = .rgba8_unorm,
        .with_depth = true,
        .depth_format = .depth24_plus,
        .label = <span class="tok-str">"gd_ssao_blur_rt"</span>,
    });

    <span class="tok-comment">// Three texture+sampler pairs: the AO source, plus the two G-buffer channels that tell the</span>
    <span class="tok-comment">// blur where the edges are.</span>
    <span class="tok-kw">const</span> g1_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{ .binding = <span class="tok-num">0</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">1</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
        .{ .binding = <span class="tok-num">2</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">3</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
        .{ .binding = <span class="tok-num">4</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">5</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
    };
    <span class="tok-kw">const</span> g1_layout_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g1_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_layout_blob);
    s.ssao_blur_bgls[<span class="tok-num">0</span>] = z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g1_layout_blob, <span class="tok-str">"gd_blur_g1"</span>);

    <span class="tok-comment">// Two bind groups differing ONLY in which texture is the source - the ping and the pong.</span>
    <span class="tok-kw">const</span> sources = [_]z.wgpu.TextureViewHandle{ s.ssao_rt.color_view, s.ssao_blur_rt.color_view };
    <span class="tok-kw">for</span> (sources, <span class="tok-num">0</span>..) |src_view, i| {
        <span class="tok-kw">const</span> binds = [_]z.gpu.BindGroupEntry{
            .{ .binding = <span class="tok-num">0</span>, .resource = .{ .texture_view = src_view } },
            .{ .binding = <span class="tok-num">1</span>, .resource = .{ .sampler = s.ssao_sampler } },
            .{ .binding = <span class="tok-num">2</span>, .resource = .{ .texture_view = s.gbuf_pos.color_view } },
            .{ .binding = <span class="tok-num">3</span>, .resource = .{ .sampler = s.ssao_sampler } },
            .{ .binding = <span class="tok-num">4</span>, .resource = .{ .texture_view = s.gbuf_normal.color_view } },
            .{ .binding = <span class="tok-num">5</span>, .resource = .{ .sampler = s.ssao_sampler } },
        };
        <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;binds);
        <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
        s.ssao_blur_g1[i] = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, s.ssao_blur_bgls[<span class="tok-num">0</span>], blob, <span class="tok-str">"gd_blur_g1_bg"</span>);
    }

    s.ssao_blur_bgls[<span class="tok-num">1</span>] = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroupLayout</span>(
        gpa,
        device,
        ssao_blur_ubo_bytes,
        .{ .fragment = true },
        <span class="tok-str">"gd_blur_g2"</span>,
    );
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.ssao_blur_ubos.len) |i| {
        s.ssao_blur_ubos[i] = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = ssao_blur_ubo_bytes,
            .usage = .{ .uniform = true, .copy_dst = true },
            .label = <span class="tok-str">"gd_blur_ubo"</span>,
        });
        s.ssao_blur_g2[i] = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroup</span>(
            gpa,
            device,
            s.ssao_blur_bgls[<span class="tok-num">1</span>],
            s.ssao_blur_ubos[i],
            ssao_blur_ubo_bytes,
            <span class="tok-str">"gd_blur_g2_bg"</span>,
        );
    }

    <span class="tok-kw">const</span> empty_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, &amp;.{}, <span class="tok-str">"gd_blur_empty"</span>);
    s.ssao_blur_pl = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ empty_bgl, s.ssao_blur_bgls[<span class="tok-num">0</span>], s.ssao_blur_bgls[<span class="tok-num">1</span>] },
        <span class="tok-str">"gd_blur_pl"</span>,
    );
    <span class="tok-kw">const</span> vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, fullscreen_vs_wgsl, <span class="tok-str">"deferred_shading_vs"</span>);
    <span class="tok-kw">const</span> fs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, ssao_blur_fs_wgsl, <span class="tok-str">"ssao_blur_fs"</span>);
    <span class="tok-kw">const</span> ndc_layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>([<span class="tok-num">2</span>]f32),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x2, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
        },
    };
    <span class="tok-kw">const</span> combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less,
        .none,
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{ndc_layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    s.ssao_blur_pipeline =
        z.wgpu.<span class="tok-fn">createRenderPipeline</span>(device, s.ssao_blur_pl, vs_mod, fs_mod, blob, <span class="tok-str">"gd_blur_pipe"</span>);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(fs_mod);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(empty_bgl);
}

<span class="tok-comment">/// One axis of the bilateral blur.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * SEPARABLE: two 7-tap passes give the reach of a 49-tap square for 14 samples. The</span>
<span class="tok-comment">/// bilateral weights are not strictly separable in theory, but the error is invisible against</span>
<span class="tok-comment">/// the noise this exists to remove - the standard trade every SSAO blur makes.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawSsaoBlurPass</span>(s: *State, f: *z.Frame, pass_index: usize) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> target: z.RenderTexture = <span class="tok-kw">if</span> (pass_index == <span class="tok-num">0</span>) s.ssao_blur_rt <span class="tok-kw">else</span> s.ssao_rt;
    z.<span class="tok-fn">beginTextureModeRaw</span>(gl, target, .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> ps: *z.PassState = gl.pass;
    ps.queue = f.gpu.queue;

    <span class="tok-kw">const</span> texel: f32 = <span class="tok-num">1.0</span> / <span class="tok-fn">float</span>(gbuffer_size);
    <span class="tok-kw">const</span> ubo: SsaoBlurUbo = .{
        .step = <span class="tok-kw">if</span> (pass_index == <span class="tok-num">0</span>)
            .{ texel, texel, <span class="tok-num">1</span>, <span class="tok-num">0</span> }
        <span class="tok-kw">else</span>
            .{ texel, texel, <span class="tok-num">0</span>, <span class="tok-num">1</span> },
        .weights = .{ s.blur_falloff, s.blur_normal_power, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    <span class="tok-kw">const</span> bytes: [z.shader.<span class="tok-fn">wireSizeOf</span>(SsaoBlurUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(SsaoBlurUbo, &amp;ubo);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.ssao_blur_ubos[pass_index], <span class="tok-num">0</span>, &amp;bytes);

    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    Backend.<span class="tok-fn">setPipeline</span>(ps, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.ssao_blur_pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">1</span>, s.ssao_blur_g1[pass_index]);
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">2</span>, s.ssao_blur_g2[pass_index]);
    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(ps.pass, .{
        .slot = <span class="tok-num">0</span>,
        .buffer = s.fullscreen_vbo,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(fullscreen_verts)),
    });
    z.render_pass.<span class="tok-fn">draw</span>(ps.pass, .{
        .vertex_count = <span class="tok-num">6</span>,
        .instance_count = <span class="tok-num">1</span>,
        .first_vertex = <span class="tok-num">0</span>,
        .first_instance = <span class="tok-num">0</span>,
    });
    z.<span class="tok-fn">endTextureModeRaw</span>(gl);
}

<span class="tok-comment">/// Run the AO pass over the G-buffer.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawSsao</span>(s: *State, f: *z.Frame, view: Mat) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    z.<span class="tok-fn">beginTextureModeRaw</span>(gl, s.ssao_rt, .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> ps: *z.PassState = gl.pass;
    ps.queue = f.gpu.queue;
    <span class="tok-kw">const</span> inv_dim: f32 = <span class="tok-num">1.0</span> / <span class="tok-fn">float</span>(gbuffer_size);
    <span class="tok-kw">const</span> ubo: SsaoUbo = .{
        .view = view,
        .params = .{ s.ssao_radius, s.ssao_bias, s.ssao_intensity, <span class="tok-num">0</span> },
        <span class="tok-comment">// 7 turns: coprime with the 9 samples, so the spiral does not collapse into spokes.</span>
        .spiral = .{ <span class="tok-num">7.0</span>, inv_dim, inv_dim, <span class="tok-num">0</span> },
    };
    <span class="tok-kw">const</span> bytes: [z.shader.<span class="tok-fn">wireSizeOf</span>(SsaoUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(SsaoUbo, &amp;ubo);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.ssao_ubo, <span class="tok-num">0</span>, &amp;bytes);

    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    Backend.<span class="tok-fn">setPipeline</span>(ps, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.ssao_pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">1</span>, s.ssao_g1);
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">2</span>, s.ssao_g2);
    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(ps.pass, .{
        .slot = <span class="tok-num">0</span>,
        .buffer = s.fullscreen_vbo,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(fullscreen_verts)),
    });
    z.render_pass.<span class="tok-fn">draw</span>(ps.pass, .{
        .vertex_count = <span class="tok-num">6</span>,
        .instance_count = <span class="tok-num">1</span>,
        .first_vertex = <span class="tok-num">0</span>,
        .first_instance = <span class="tok-num">0</span>,
    });
    z.<span class="tok-fn">endTextureModeRaw</span>(gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initGround</span>(
    gpa: Allocator,
    f: *z.Frame,
    s: *State,
    shadow_rt: z.RenderTexture,
) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> queue: z.wgpu.QueueHandle = f.gpu.queue;

    <span class="tok-kw">var</span> plane: z.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshPlane</span>(gpa, ground_extent * <span class="tok-num">2.0</span>, ground_extent * <span class="tok-num">2.0</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadMesh</span>(gpa, plane);
    <span class="tok-kw">const</span> vcount: usize = <span class="tok-builtin">@intCast</span>(plane.vertexCount);
    <span class="tok-kw">const</span> icount: usize = <span class="tok-builtin">@intCast</span>(plane.triangleCount * <span class="tok-num">3</span>);

    <span class="tok-comment">// Interleave into the pos+normal layout the shadow pipeline declares.</span>
    <span class="tok-kw">const</span> verts: []GroundVertex = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(GroundVertex, vcount);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(verts);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..vcount) |i| {
        verts[i] = .{
            .pos = .{
                plane.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>],
                plane.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>],
                plane.vertices[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>],
            },
            .normal = <span class="tok-kw">if</span> (plane.normals != null)
                .{ plane.normals[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>], plane.normals[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>], plane.normals[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>] }
            <span class="tok-kw">else</span>
                .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> },
        };
    }
    s.ground_vbo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(verts),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"gd_ground_vbo"</span>,
    );
    s.ground_ibo = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(plane.indices[<span class="tok-num">0</span>..icount]),
        .{ .index = true, .copy_dst = true },
        <span class="tok-str">"gd_ground_ibo"</span>,
    );
    s.ground_index_count = <span class="tok-builtin">@intCast</span>(icount);

    <span class="tok-comment">// ---- bind-group layouts: VS uniforms at 0, samplers at 1, FS uniforms at 2 ----</span>
    <span class="tok-kw">const</span> g0_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroupLayout</span>(gpa, device, lit_vs_bytes, .{ .vertex = true }, <span class="tok-str">"gd_lit_g0"</span>);
    <span class="tok-kw">const</span> g2_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroupLayout</span>(gpa, device, lit_fs_bytes, .{ .fragment = true }, <span class="tok-str">"gd_lit_g2"</span>);

    <span class="tok-kw">const</span> g1_layout_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{ .binding = <span class="tok-num">0</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">1</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
    };
    <span class="tok-kw">const</span> g1_layout_blob: []<span class="tok-kw">const</span> u8 =
        <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g1_layout_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_layout_blob);
    <span class="tok-kw">const</span> g1_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g1_layout_blob, <span class="tok-str">"gd_lit_g1"</span>);
    <span class="tok-kw">const</span> g1_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .texture_view = shadow_rt.color_view } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .sampler = s.shadow_sampler } },
    };
    <span class="tok-kw">const</span> g1_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;g1_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_blob);
    s.ground_g1 = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, g1_bgl, g1_blob, <span class="tok-str">"gd_lit_g1_bg"</span>);

    <span class="tok-comment">// ---- the two uniform buffers, rewritten every frame ----</span>
    s.ground_vs_ubo = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = lit_vs_bytes,
        .usage = .{ .uniform = true, .copy_dst = true },
        .label = <span class="tok-str">"gd_lit_vs_ubo"</span>,
    });
    s.ground_fs_ubo = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = lit_fs_bytes,
        .usage = .{ .uniform = true, .copy_dst = true },
        .label = <span class="tok-str">"gd_lit_fs_ubo"</span>,
    });
    s.ground_g0 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroup</span>(gpa, device, g0_bgl, s.ground_vs_ubo, lit_vs_bytes, <span class="tok-str">"gd_g0_bg"</span>);
    s.ground_g2 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroup</span>(gpa, device, g2_bgl, s.ground_fs_ubo, lit_fs_bytes, <span class="tok-str">"gd_g2_bg"</span>);

    <span class="tok-comment">// ---- the pipeline ----</span>
    <span class="tok-kw">const</span> bgls = [_]z.wgpu.BindGroupLayoutHandle{ g0_bgl, g1_bgl, g2_bgl };
    <span class="tok-kw">const</span> pl: z.wgpu.PipelineLayoutHandle =
        z.wgpu.<span class="tok-fn">createPipelineLayout</span>(device, bgls[<span class="tok-num">0</span>..], <span class="tok-str">"gd_lit_pl"</span>);
    s.ground_bgls = bgls;
    s.ground_pl = pl;
    <span class="tok-kw">const</span> vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, lit_vs_wgsl, <span class="tok-str">"lit_shadow_vs"</span>);
    <span class="tok-kw">const</span> fs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, lit_fs_wgsl, <span class="tok-str">"lit_shadow_fs"</span>);
    <span class="tok-kw">const</span> layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(GroundVertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
            .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
        },
    };
    <span class="tok-comment">// * The state combo must match the SCREEN pass's attachments exactly - format, depth</span>
    <span class="tok-comment">// format and sample count. A mismatch is rejected at pipeline creation, which is the good</span>
    <span class="tok-comment">// case; the bad case is a silently incompatible pass.</span>
    <span class="tok-kw">const</span> combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .alpha,
        .less,
        .none,
        f.gpu.backbuffer_format,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    s.ground_pipeline =
        z.wgpu.<span class="tok-fn">createRenderPipeline</span>(device, pl, vs_mod, fs_mod, blob, <span class="tok-str">"gd_lit_pipe"</span>);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(fs_mod);

    <span class="tok-comment">// -- * THE LIGHT PASS NEEDS A REAL DEPTH MAP, NOT A MASK --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The mask was the cheap first step and it produced an INVERTED shadow, because</span>
    <span class="tok-comment">// `lit_shadow_fs` does a DEPTH COMPARISON: it reads the map as a distance-from-light and</span>
    <span class="tok-comment">// shadows a fragment whose own distance is greater. Feeding it white-on-black meant the</span>
    <span class="tok-comment">// empty parts of the map (0.0 = "very near") shadowed the whole frustum footprint, while</span>
    <span class="tok-comment">// the silhouettes (1.0 = "very far") came out lit - a dark square with a bright figure in</span>
    <span class="tok-comment">// it, exactly what the device showed.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `depth_vs/fs` in `mode = 0` writes `ndc_z*0.5+0.5`, which is precisely the quantity</span>
    <span class="tok-comment">// `lit_shadow_fs` expects. The two shaders are a matched pair; substituting for either</span>
    <span class="tok-comment">// half is what went wrong.</span>
    s.depth_bgl = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroupLayout</span>(gpa, device, depth_ubo_bytes, .{ .vertex = true }, <span class="tok-str">"gd_depth_bgl"</span>);
    <span class="tok-kw">const</span> depth_bgls = [_]z.wgpu.BindGroupLayoutHandle{s.depth_bgl};
    s.depth_pl = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(device, depth_bgls[<span class="tok-num">0</span>..], <span class="tok-str">"gd_depth_pl"</span>);
    <span class="tok-kw">const</span> dvs: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, depth_vs_wgsl, <span class="tok-str">"depth_vs"</span>);
    <span class="tok-kw">const</span> dfs: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, depth_fs_wgsl, <span class="tok-str">"depth_fs"</span>);
    <span class="tok-comment">// The depth pass reads POSITION ONLY, but the stride must still match the character VBOs</span>
    <span class="tok-comment">// it draws from - those are pos+normal.</span>
    <span class="tok-kw">const</span> depth_layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(GroundVertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
        },
    };
    <span class="tok-kw">const</span> depth_combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less,
        .none,
        .rgba16_float,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> depth_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{depth_layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = depth_combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(depth_blob);
    s.depth_pipeline =
        z.wgpu.<span class="tok-fn">createRenderPipeline</span>(device, s.depth_pl, dvs, dfs, depth_blob, <span class="tok-str">"gd_depth_pipe"</span>);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(dvs);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(dfs);

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.char_vs_ubos.len) |i| {
        s.char_vs_ubos[i] = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = lit_vs_bytes,
            .usage = .{ .uniform = true, .copy_dst = true },
            .label = <span class="tok-str">"gd_char_vs_ubo"</span>,
        });
        s.char_fs_ubos[i] = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = lit_fs_bytes,
            .usage = .{ .uniform = true, .copy_dst = true },
            .label = <span class="tok-str">"gd_char_fs_ubo"</span>,
        });
        s.char_g0[i] =
            <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroup</span>(gpa, device, g0_bgl, s.char_vs_ubos[i], lit_vs_bytes, <span class="tok-str">"gd_char_g0"</span>);
        s.char_g2[i] =
            <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroup</span>(gpa, device, g2_bgl, s.char_fs_ubos[i], lit_fs_bytes, <span class="tok-str">"gd_char_g2"</span>);
    }

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.depth_ubos.len) |i| {
        s.depth_ubos[i] = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = depth_ubo_bytes,
            .usage = .{ .uniform = true, .copy_dst = true },
            .label = <span class="tok-str">"gd_depth_ubo"</span>,
        });
        s.depth_bgs[i] = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">uniformBindGroup</span>(
            gpa,
            device,
            s.depth_bgl,
            s.depth_ubos[i],
            depth_ubo_bytes,
            <span class="tok-str">"gd_depth_bg"</span>,
        );
    }
}

        .gpa = gpa,

        .ground_pipeline = undefined,

        .ground_ibo = undefined,
        .ground_index_count = <span class="tok-num">0</span>,
        .ground_vs_ubo = undefined,
        .ground_fs_ubo = undefined,
        .ground_g0 = undefined,
        .ground_g1 = undefined,
        .ground_g2 = undefined,
        .ground_bgls = undefined,
        .ground_pl = undefined,
        .depth_pipeline = undefined,
        .depth_pl = undefined,
        .depth_bgl = undefined,
        .depth_ubos = undefined,
        .depth_bgs = undefined,
        .char_vs_ubos = undefined,
        .char_fs_ubos = undefined,
        .char_g0 = undefined,
        .char_g2 = undefined,

        .robot_samples = undefined,
        .robot_previous_qpos = undefined,
        .robot_twist = undefined,
        .robot_parent_twist = undefined,
        .robot_limb_correction = undefined,
        .robot_tasks = undefined,
        .robot_ik_scratch = undefined,
        .fullscreen_vbo = undefined,
        .characters = .{
            <span class="tok-comment">// * Geno needs its normals rebuilt: 52.6% of the file's oppose their triangle's</span>
            <span class="tok-comment">// winding, which renders as dark banding down the limbs. Mixamo's are clean, so</span>
            <span class="tok-comment">// it keeps its authored normals - see `draw3d.computeMeshNormals`.</span>
            <span class="tok-kw">try</span> <span class="tok-fn">makeCharacter</span>(gpa, geno_fbx, dance, <span class="tok-fn">vec</span>(-<span class="tok-num">0.7</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-str">"Geno + dance1"</span>, true, <span class="tok-num">0</span>, geno_tpose_bvh),
            <span class="tok-comment">// Mixamo's FBX bind pose IS a T-pose, so no separate file is needed.</span>
            <span class="tok-kw">try</span> <span class="tok-fn">makeCharacter</span>(gpa, mixamo_fbx, null, <span class="tok-fn">vec</span>(<span class="tok-num">0.7</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-str">"Mixamo Drop_Kick"</span>, false, <span class="tok-num">1</span>, null),
        },
    };

    <span class="tok-kw">try</span> <span class="tok-fn">initGround</span>(gpa, f, s, light_view);
    <span class="tok-kw">try</span> <span class="tok-fn">initRobot</span>(gpa, s);
    <span class="tok-kw">try</span> <span class="tok-fn">initGbuffer</span>(gpa, f, s);
    <span class="tok-kw">try</span> <span class="tok-fn">initSsao</span>(gpa, f, s);
    <span class="tok-kw">try</span> <span class="tok-fn">initSsaoBlur</span>(gpa, f, s);

    <span class="tok-comment">// * The characters are drawn ONLY by custom pipelines from here on, and the engine's</span>
    <span class="tok-comment">// upload is lazy behind `drawMeshInstanced` - so ask for it explicitly or the buffers</span>
    <span class="tok-comment">// never exist and both passes silently draw nothing.</span>
    <span class="tok-kw">for</span> (&amp;s.characters) |*c| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-builtin">@intCast</span>(c.model.model.meshCount)) |m| {
            _ = z.<span class="tok-fn">uploadMeshGpu</span>(f.gl, <span class="tok-builtin">@ptrCast</span>(&amp;c.model.model.meshes[m]));
        }
    }

    <span class="tok-kw">if</span> (<span class="tok-fn">skeletonsMatch</span>(s.characters[<span class="tok-num">0</span>].model.clip, dance)) {
        <span class="tok-fn">setStatus</span>(s, <span class="tok-str">"{d} + {d} bones"</span>, .{
            s.characters[<span class="tok-num">0</span>].<span class="tok-fn">boneCount</span>(),
            s.characters[<span class="tok-num">1</span>].<span class="tok-fn">boneCount</span>(),
        });
    } <span class="tok-kw">else</span> {
        <span class="tok-fn">setStatus</span>(s, <span class="tok-str">"SKELETON MISMATCH on Geno"</span>, .{});
    }
}

<span class="tok-comment">/// Pose one character at `time` and deform every mesh it owns.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The matrix work lives in `draw3d` - see `poseSkinMatrices`, which documents the two zm</span>
<span class="tok-comment">/// conventions (argument order, and direction-vs-point vectors) that a hand-rolled version has</span>
<span class="tok-comment">/// to get right. This function is only the loop over meshes.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">poseCharacter</span>(
    character: *Character,
    source: *<span class="tok-kw">const</span> Character,
    source_is_self: bool,
    gl: *z.WgpuGl,
    time: f32,
) void {
    <span class="tok-kw">const</span> source_frame_count: usize = <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@max</span>(source.clip.animation.keyframeCount, <span class="tok-num">0</span>));
    <span class="tok-kw">if</span> (source_frame_count == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">var</span> frame: usize = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@max</span>(time / source.clip.frame_time, <span class="tok-num">0</span>));
    <span class="tok-kw">if</span> (frame &gt;= source_frame_count) {
        frame = frame % source_frame_count;
    }

    <span class="tok-comment">// * PASSED IN, NOT INFERRED. Deriving this from `mapped_joint_count == 0` would conflate</span>
    <span class="tok-comment">// "not retargeting" with "the name map found nothing" - and the second is a bug the UI</span>
    <span class="tok-comment">// needs to report, not a case to silently fall back from.</span>
    <span class="tok-kw">if</span> (source_is_self) {
        <span class="tok-comment">// Native playback: the clip and the skeleton are the same rig, so the poses go</span>
        <span class="tok-comment">// straight to the skin matrices.</span>
        d3.<span class="tok-fn">poseSkinMatrices</span>(
            source.clip,
            character.model.inverse_bind,
            frame,
            character.positions,
            character.rotations,
            character.skin,
        );
    } <span class="tok-kw">else</span> {
        <span class="tok-fn">poseCharacterRetargeted</span>(character, source, frame);
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-builtin">@intCast</span>(character.model.model.meshCount)) |mesh_index| {
        d3.<span class="tok-fn">skinMeshCpu</span>(
            character.model.model.meshes[mesh_index],
            character.base_positions[mesh_index],
            character.base_normals[mesh_index],
            character.skin,
            character.skinned[mesh_index],
            character.skinned_normals[mesh_index],
        );
        z.<span class="tok-fn">updateMeshGpu</span>(gl, character.model.model.meshes[mesh_index]);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">var</span> longest: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (&amp;s.characters) |*c| {
        longest = <span class="tok-builtin">@max</span>(longest, c.<span class="tok-fn">duration</span>());
    }

    <span class="tok-kw">if</span> (s.playing <span class="tok-kw">and</span> longest &gt; <span class="tok-num">0</span>) {
        s.play_time += f.time.delta_time;
        <span class="tok-kw">if</span> (s.play_time &gt;= longest) {
            s.play_time = <span class="tok-num">0</span>;
        }
    }

    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-comment">// Pose and upload every character ONCE, before any pass draws them.</span>
    <span class="tok-comment">// Rebuild the name maps only when a selection changed - mapping is a string compare per</span>
    <span class="tok-comment">// joint pair and has no business running every frame.</span>
    <span class="tok-kw">if</span> (s.retarget_dirty) {
        s.retarget_dirty = false;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.characters.len) |character_index| {
            <span class="tok-kw">const</span> source_index: usize = s.characters[character_index].source_character;
            <span class="tok-kw">if</span> (source_index == character_index) {
                s.characters[character_index].mapped_joint_count = <span class="tok-num">0</span>;
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-comment">// * A FAILED MAP MUST NOT LOOK LIKE A FAILED RETARGET. The only way this errors</span>
            <span class="tok-comment">// is allocation, and swallowing it would leave a stale map driving the character -</span>
            <span class="tok-comment">// indistinguishable on screen from a solver bug. Report it and fall back to the</span>
            <span class="tok-comment">// character's own clip, which is visibly correct rather than subtly wrong.</span>
            <span class="tok-fn">refreshRetargetMap</span>(
                s.gpa,
                &amp;s.characters[character_index],
                &amp;s.characters[source_index],
                s.align_rest,
            ) <span class="tok-kw">catch</span> {
                <span class="tok-fn">setStatus</span>(s, <span class="tok-str">"retarget map failed (out of memory)"</span>, .{});
                s.characters[character_index].source_character = character_index;
                s.characters[character_index].mapped_joint_count = <span class="tok-num">0</span>;
            };
        }
    }

    <span class="tok-kw">if</span> (s.robot_dirty) {
        s.robot_dirty = false;
        <span class="tok-comment">// -- *** INVALIDATE THE SAMPLE CACHE WHEN THE SOURCE CHANGES --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// `buildPointSamples` runs only when `robot_sample_count == 0`, and each sample stores a</span>
        <span class="tok-comment">// JOINT INDEX into the source skeleton. **Switching from Geno to the Mixamo drop kick</span>
        <span class="tok-comment">// would have kept samples pointing at Geno's indices** - a different skeleton with a</span>
        <span class="tok-comment">// different joint order, so every target would read the wrong joint.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// ** It would not crash: the indices are in range for both. **It would just retarget to</span>
        <span class="tok-comment">// the wrong bones**, which is the quietest failure mode this project has, and the fifth</span>
        <span class="tok-comment">// time a cache has outlived the thing it was built from.</span>
        s.robot_sample_count = <span class="tok-num">0</span>;
        s.robot_has_previous = false;
        <span class="tok-fn">refreshRobotMap</span>(s) <span class="tok-kw">catch</span> {
            <span class="tok-fn">setStatus</span>(s, <span class="tok-str">"robot map failed (out of memory)"</span>, .{});
            s.show_robot = false;
        };
    }

    <span class="tok-comment">// * Poses are computed against whichever character's clip drives each one, so the source</span>
    <span class="tok-comment">// is looked up here rather than assumed to be self.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.characters.len) |character_index| {
        <span class="tok-kw">const</span> source_index: usize = s.characters[character_index].source_character;
        <span class="tok-kw">const</span> source: *<span class="tok-kw">const</span> Character = &amp;s.characters[source_index];
        <span class="tok-kw">const</span> clip_duration: f32 = source.<span class="tok-fn">duration</span>();
        <span class="tok-kw">const</span> time_in_clip: f32 = <span class="tok-kw">if</span> (clip_duration &gt; <span class="tok-num">0</span>)
            <span class="tok-builtin">@mod</span>(s.play_time, clip_duration)
        <span class="tok-kw">else</span>
            <span class="tok-num">0</span>;
        <span class="tok-fn">poseCharacter</span>(
            &amp;s.characters[character_index],
            source,
            source_index == character_index,
            gl,
            time_in_clip,
        );
    }

    <span class="tok-kw">if</span> (s.show_robot) {
        <span class="tok-kw">const</span> robot_source: *<span class="tok-kw">const</span> Character = &amp;s.characters[s.robot_source];
        <span class="tok-kw">const</span> robot_frames: usize = <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@max</span>(robot_source.clip.animation.keyframeCount, <span class="tok-num">0</span>));
        <span class="tok-kw">if</span> (robot_frames &gt; <span class="tok-num">0</span>) {
            <span class="tok-kw">const</span> clip_duration: f32 = robot_source.<span class="tok-fn">duration</span>();
            <span class="tok-kw">const</span> time_in_clip: f32 = <span class="tok-kw">if</span> (clip_duration &gt; <span class="tok-num">0</span>)
                <span class="tok-builtin">@mod</span>(s.play_time, clip_duration)
            <span class="tok-kw">else</span>
                <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> frame: usize = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@max</span>(time_in_clip / robot_source.clip.frame_time, <span class="tok-num">0</span>));
            <span class="tok-kw">if</span> (frame &gt;= robot_frames) {
                frame = frame % robot_frames;
            }
            <span class="tok-fn">poseRobot</span>(s, frame);
        }
    }

    <span class="tok-comment">// ONE light camera, used by BOTH the light pass and the ground's shadow lookup. Deriving</span>
    <span class="tok-comment">// it twice is how a shadow ends up projected from a slightly different place than it was</span>
    <span class="tok-comment">// rendered from.</span>
    <span class="tok-kw">const</span> light_dir: Vec = <span class="tok-fn">lightDirFrom</span>(s.light_yaw, s.light_pitch);
    <span class="tok-kw">const</span> focus: Vec = <span class="tok-fn">lightTarget</span>(s);
    <span class="tok-kw">const</span> light_cam: Camera3D = .{
        .position = focus - light_dir * <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(light_distance)),
        .target = focus,
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = light_extent * <span class="tok-num">2.0</span>,
        .projection = <span class="tok-builtin">@backingInt</span>(zm.CameraProjection.orthographic),
    };
    <span class="tok-kw">const</span> light_cam_vp: Mat = <span class="tok-fn">mulMat</span>(
        light_cam.<span class="tok-fn">projMatrix</span>(<span class="tok-num">1.0</span>, light_near, light_far),
        light_cam.<span class="tok-fn">viewMatrix</span>(),
    );

    <span class="tok-comment">// -- * PASS 1: THE SCENE FROM THE LIGHT --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Step one of the shadow map, and deliberately ONLY step one: this renders the ordinary</span>
    <span class="tok-comment">// * ALWAYS RUNS NOW - the ground samples this every frame, so it is no longer gated on</span>
    <span class="tok-comment">// the debug toggle. The toggle only controls whether the result is also SHOWN.</span>
    <span class="tok-comment">// -- ** EVERY OFFSCREEN PASS RUNS BEFORE `clearViewport` OPENS THE SCREEN PASS --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `beginTextureModeRaw` / `beginTextureModeMrtRaw` check `drawing_active`: if the screen</span>
    <span class="tok-comment">// pass is already open they FLUSH THE 2D BATCH, end the pass, render offscreen, then</span>
    <span class="tok-comment">// reopen. That flush is the bug - pending UI vertices get drawn under the OFFSCREEN</span>
    <span class="tok-comment">// pass's projection (a 1024-square ortho, not the window's), so the panel lands at the</span>
    <span class="tok-comment">// wrong place, and then draws again correctly when the batch is flushed for real. Two</span>
    <span class="tok-comment">// panels, side by side, exactly as seen.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * The camera update is hoisted above the passes for this: it only needs `u`, and it was</span>
    <span class="tok-comment">// the sole reason the G-buffer pass had drifted below `clearViewport`. The comment there</span>
    <span class="tok-comment">// claimed "before the screen pass opens" while the code did the opposite - a comment</span>
    <span class="tok-comment">// asserting an ordering the code does not enforce is worse than none.</span>
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, u.<span class="tok-fn">wantCaptureMouse</span>(), .{
        .min_distance = <span class="tok-num">0.6</span>,
        .max_distance = <span class="tok-num">14.0</span>,
    });
    <span class="tok-kw">const</span> view_aspect: f32 = blk: {
        <span class="tok-kw">const</span> gh: f32 = f.window.<span class="tok-fn">heightf</span>();
        <span class="tok-kw">break</span> :blk <span class="tok-kw">if</span> (gh &gt; <span class="tok-num">0</span>) f.window.<span class="tok-fn">widthf</span>() / gh <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
    };
    <span class="tok-kw">const</span> cam_vp: Mat = <span class="tok-fn">mulMat</span>(cam.<span class="tok-fn">projMatrix</span>(view_aspect, <span class="tok-num">0.01</span>, <span class="tok-num">1000.0</span>), cam.<span class="tok-fn">viewMatrix</span>());

    <span class="tok-fn">drawLightDepth</span>(s, f, light_cam_vp);
    <span class="tok-fn">drawGbuffer</span>(s, f, cam_vp);
    <span class="tok-comment">// * AO CONSUMES THE G-BUFFER, so it must come after - and before the screen opens.</span>
    <span class="tok-fn">drawSsao</span>(s, f, cam.<span class="tok-fn">viewMatrix</span>());
    <span class="tok-kw">if</span> (s.blur_ao) {
        <span class="tok-comment">// Horizontal into the scratch, vertical back into `ssao_rt` - so the composite and the</span>
        <span class="tok-comment">// debug inset both keep reading one texture regardless of whether blurring is on.</span>
        <span class="tok-fn">drawSsaoBlurPass</span>(s, f, <span class="tok-num">0</span>);
        <span class="tok-fn">drawSsaoBlurPass</span>(s, f, <span class="tok-num">1</span>);
    }

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">26</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-comment">// * THE 3D BLOCK ALWAYS OPENS, even when it draws nothing. `beginMode3D` is what puts the</span>
    <span class="tok-comment">// pass into the depth-tested 3D state the custom pipelines below rely on; making it</span>
    <span class="tok-comment">// conditional would mean the shadowed geometry renders differently depending on whether a</span>
    <span class="tok-comment">// debug gizmo happens to be enabled. `drawScene` returns immediately when there is no</span>
    <span class="tok-comment">// skeleton to draw, so the cost of always opening it is a state change, not geometry.</span>
    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    <span class="tok-fn">drawScene</span>(s, gl);
    z.<span class="tok-fn">endMode3D</span>(gl);

    <span class="tok-comment">// -- * THE LIT PASS: ground and characters, ONE pipeline, both receiving --</span>
    {
        <span class="tok-kw">if</span> (s.show_ground) {
            <span class="tok-fn">drawShadowedGround</span>(s, f, cam_vp, light_cam_vp, light_dir);
        }
        <span class="tok-kw">if</span> (s.show_mesh) {
            <span class="tok-fn">drawCharactersLit</span>(s, f, cam_vp, light_cam_vp, light_dir);
        }
        <span class="tok-comment">// * Hand the pass back once, after ALL foreign-pipeline work - not per draw.</span>
        gl.<span class="tok-fn">renderer</span>().<span class="tok-fn">bindForPass</span>(gl.pass);
    }

    <span class="tok-comment">// -- * COMPOSITE: MULTIPLY THE AO OVER THE LIT IMAGE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * NO NEW SHADER. AO is a 0..1 factor and the composite is `lit *= ao`, which is exactly</span>
    <span class="tok-comment">// what a MULTIPLY-blended fullscreen quad does. The engine's 2D pipeline already carries a</span>
    <span class="tok-comment">// `.multiply` variant, so this is one textured draw between the lit geometry and the UI.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// GenoView instead feeds AO into its lighting shader, separating `ssaoData.r` (ambient)</span>
    <span class="tok-comment">// from `.g` (sun). That is better - it lets AO darken only the SKY term while leaving</span>
    <span class="tok-comment">// direct sunlight alone - and it is what section 12e will do once a lighting pass exists. A flat</span>
    <span class="tok-comment">// multiply darkens everything including lit surfaces, which reads slightly heavy.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * ORDER: after the 3D, BEFORE the UI. The UI is not part of the scene and must not be</span>
    <span class="tok-comment">// multiplied by an occlusion factor computed from scene geometry.</span>
    <span class="tok-kw">if</span> (s.show_ao) {
        <span class="tok-kw">const</span> cw: f32 = f.window.<span class="tok-fn">widthf</span>();
        <span class="tok-kw">const</span> ch: f32 = f.window.<span class="tok-fn">heightf</span>();
        z.<span class="tok-fn">beginBlendMode</span>(gl, .multiply);
        gl.<span class="tok-fn">texture</span>(
            .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = cw, .height = ch },
            s.ssao_rt.<span class="tok-fn">asTexture</span>(),
            .{},
        );
        z.<span class="tok-fn">endBlendMode</span>(gl);
    }

    <span class="tok-kw">if</span> (s.show_light_view) {
        <span class="tok-comment">// The light's view, bottom-right. section 12a-4 replaces its contents with linear depth.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * SIZED AND PLACED FROM THE LIVE WINDOW, NOT THE CONFIGURED `screen_w`. The window</span>
        <span class="tok-comment">// constant is what the app ASKS for; on a phone the canvas is whatever fits, so</span>
        <span class="tok-comment">// anchoring to 1000 put this inset off the right edge and it simply never appeared.</span>
        <span class="tok-comment">// `f.window.widthf()` is the actual size - `examples/render_texture` uses it for the</span>
        <span class="tok-comment">// same reason.</span>
        <span class="tok-kw">const</span> view_w: f32 = f.window.<span class="tok-fn">widthf</span>();
        <span class="tok-kw">const</span> view_h: f32 = f.window.<span class="tok-fn">heightf</span>();
        <span class="tok-kw">const</span> size: f32 = <span class="tok-builtin">@min</span>(view_w, view_h) * <span class="tok-num">0.28</span>;
        <span class="tok-kw">const</span> shown: z.WgpuTexture = <span class="tok-kw">switch</span> (s.debug_view) {
            <span class="tok-num">1</span> =&gt; s.gbuf_pos.<span class="tok-fn">asTexture</span>(),
            <span class="tok-num">2</span> =&gt; s.gbuf_normal.<span class="tok-fn">asTexture</span>(),
            <span class="tok-num">3</span> =&gt; s.gbuf_albedo.<span class="tok-fn">asTexture</span>(),
            <span class="tok-num">4</span> =&gt; s.ssao_rt.<span class="tok-fn">asTexture</span>(),
            <span class="tok-kw">else</span> =&gt; s.light_view.<span class="tok-fn">asTexture</span>(),
        };
        f.gl.<span class="tok-fn">texture</span>(
            .{
                .x = view_w - size - <span class="tok-num">12.0</span>,
                .y = view_h - size - <span class="tok-num">12.0</span>,
                .width = size,
                .height = size,
            },
            shown,
            .{},
        );
    }

    <span class="tok-fn">drawPanel</span>(s, u, longest);
}

<span class="tok-comment">/// Everything that casts or receives - drawn identically from the camera and from the light,</span>
<span class="tok-comment">/// because a shadow map that renders a DIFFERENT scene than the one it shades is the classic</span>
<span class="tok-comment">/// way to get shadows that do not line up.</span>
<span class="tok-comment">/// Where the light box should be centred: the midpoint of the characters' hips, lifted to</span>
<span class="tok-comment">/// chest height so the box covers a jump as well as a step.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * Uses the ROOT joint rather than a bounding box - the root is one already-computed vector</span>
<span class="tok-comment">/// per character, and a directional box only needs to be roughly right to keep the subject</span>
<span class="tok-comment">/// inside it.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">lightTarget</span>(s: *State) Vec {
    <span class="tok-kw">var</span> sum: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">for</span> (&amp;s.characters) |*c| {
        sum += c.positions[<span class="tok-num">0</span>] + c.offset;
    }
    <span class="tok-kw">var</span> mid: Vec = sum / <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(<span class="tok-fn">float</span>(s.characters.len)));
    mid[<span class="tok-num">1</span>] = <span class="tok-num">0.9</span>;
    <span class="tok-kw">return</span> mid;
}

<span class="tok-comment">/// Load `humanoid.xml` and prepare everything the retarget needs from the robot side.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">initRobot</span>(gpa: Allocator, s: *State) !void {
    <span class="tok-comment">// -- *** `humanoid_flex2.xml` - the Geno-matched model --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// *** On top of flex 1: BALL joints where the robot was limited (elbow, knee, ankle) and a</span>
    <span class="tok-comment">// TOE BONE, which Geno has and the robot did not. **Geno's animation is ROTATIONS on a fixed</span>
    <span class="tok-comment">// skeleton, so matching it exactly needs 3 rotational DOF per joint and matching bone</span>
    <span class="tok-comment">// lengths - not 6.** Translation would let the robot express more than the capture itself</span>
    <span class="tok-comment">// can, and would let bones detach.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// ** The toe matters because the whole foot was ONE rigid segment: it could not flatten its</span>
    <span class="tok-comment">// sole while pointing its toe, which is what a foot does at every push-off. Measured: sole</span>
    <span class="tok-comment">// tilt 13-51 deg -&gt; 5-21, forearm 4.7 -&gt; 3.7.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Every difference from stock is a measurement: arms shortened 20% (bones were 1.24-1.29x</span>
    <span class="tok-comment">// the capture's, now 0.99-1.03), ONE shoulder axis added per arm (21 -&gt; 23 DOF), shoulder</span>
    <span class="tok-comment">// span narrowed (the torso was wider than Geno's and skewed to compensate), feet pitched</span>
    <span class="tok-comment">// 24.6 degrees (Geno's ankle-to-toe is that far below horizontal; the sole was flat), and</span>
    <span class="tok-comment">// the joint ranges widened where the solve was pinned.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// *** Measured against flex 1: forearm 11.2 -&gt; 4.7 deg, torso axis 9.0 -&gt; 6.8, worst</span>
    <span class="tok-comment">// single-frame pop **59 -&gt; 14** (from 155 with the original six-mechanism pipeline).</span>
    <span class="tok-comment">// ** Either model, chosen at runtime. **The generalisation test - a Geno-shaped robot versus</span>
    <span class="tok-comment">// a stock one, on a Mixamo capture - should be one click, not a rebuild**, because a test</span>
    <span class="tok-comment">// that requires a rebuild is a test nobody runs.</span>
    s.robot_doc = <span class="tok-kw">try</span> z.codecs.xml.<span class="tok-fn">parse</span>(gpa, <span class="tok-kw">if</span> (s.robot_use_stock)
        <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"humanoid.xml"</span>)
    <span class="tok-kw">else</span>
        <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"humanoid_flex2.xml"</span>), null);
    s.robot_spec = <span class="tok-kw">try</span> mjcf.<span class="tok-fn">readRobot</span>(gpa, &amp;s.robot_doc);
    s.robot = <span class="tok-kw">try</span> z.robot_mjcf.<span class="tok-fn">build</span>(gpa, &amp;s.robot_spec, .{});
    s.robot_data = <span class="tok-kw">try</span> z.robot.Data.<span class="tok-fn">init</span>(gpa, &amp;s.robot.model);

    <span class="tok-kw">const</span> body_count: usize = s.robot.model.nbody;
    s.robot_reference = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    s.human_of_body = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(i32, body_count);
    s.robot_parents = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(i32, body_count);
    s.robot_rest_alignment = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    s.robot_local = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    s.robot_global = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    s.robot_positions_y_up = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, body_count);
    <span class="tok-comment">// Sized to the largest skeleton that can drive the robot, not to the robot.</span>
    s.source_delta_z_up = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, <span class="tok-num">128</span>);
    s.robot_human_reference = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, <span class="tok-num">128</span>);
    s.robot_axis_map = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    s.robot_desired_global = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    s.robot_identity_map = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(i32, body_count);
    s.robot_identity_alignment = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..body_count) |body| {
        s.robot_identity_map[body] = <span class="tok-builtin">@intCast</span>(body);
        s.robot_identity_alignment[body] = zm.quat_identity;
    }
    s.robot_position_weights = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, body_count);
    s.robot_rotation_weights = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, body_count);
    s.robot_rest_world = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, <span class="tok-num">128</span>);
    s.robot_rest_rotations = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, <span class="tok-num">128</span>);
    s.robot_rest_xpos = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, body_count);
    s.robot_tpose_qpos = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.robot.model.nq);
    s.robot_rest_xrot = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    s.robot_rest_body_pos = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, body_count);
    s.robot_rest_flexion = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, body_count);
    <span class="tok-builtin">@memset</span>(s.robot_rest_flexion, <span class="tok-num">0</span>);
    s.robot_samples = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(z.robot.PointSample, <span class="tok-num">256</span>);
    s.robot_previous_qpos = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.robot.model.nq);
    s.robot_twist = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    s.robot_parent_twist = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    s.robot_limb_correction = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, body_count);
    <span class="tok-kw">for</span> (s.robot_limb_correction) |*correction| {
        correction.* = zm.quat_identity;
    }
    <span class="tok-comment">// *** ONE TASK PER SAMPLE, NOT PER BODY. The point cloud puts up to four samples on a body,</span>
    <span class="tok-comment">// so a body-sized task array silently truncated 43 samples to 17 - **two thirds of the robot</span>
    <span class="tok-comment">// had no targets and simply stayed at rest.** `@min(count, tasks.len)` made it a quiet clamp</span>
    <span class="tok-comment">// rather than a crash.</span>
    s.robot_tasks = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(z.robot.IkTask, <span class="tok-num">256</span>);
    s.robot_ik_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, z.robot.<span class="tok-fn">ikScratchSize</span>(s.robot.model.nv));
    <span class="tok-builtin">@memset</span>(s.robot_position_weights, <span class="tok-num">0</span>);

    <span class="tok-comment">// -- *** BONE DIRECTIONS, NOT BODY FRAMES --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `referenceOrientationsFromRest` reads `body_xrot` at `qpos0` - the body FRAME. For</span>
    <span class="tok-comment">// `humanoid.xml` that is IDENTITY FOR EVERY BODY, because the file declares no rotation</span>
    <span class="tok-comment">// anywhere; its bone directions live in the POSITION OFFSETS (`lower_arm_left` sits at</span>
    <span class="tok-comment">// `.18 .18 -.18`). Aligning that identity against a real human T-pose rotation turned every</span>
    <span class="tok-comment">// robot bone, which is what the device showed.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * Both sides now answer the SAME QUESTION - which way does this bone point at rest -</span>
    <span class="tok-comment">// through the same shortest-arc-from-+Y construction. See claude.md: two references must</span>
    <span class="tok-comment">// match in KIND, not just in pose.</span>
    z.robot.<span class="tok-fn">referenceOrientationsFromBoneDirections</span>(&amp;s.robot.model, s.robot_reference);

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..body_count) |body| {
        s.robot_parents[body] = <span class="tok-kw">if</span> (body == <span class="tok-num">0</span>) -<span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-builtin">@intCast</span>(s.robot.model.body_parent[body]);
        s.robot_rest_alignment[body] = zm.quat_identity;
    }
}

<span class="tok-comment">/// The character's rest orientations expressed as BONE DIRECTIONS, to pair with the robot's.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** The character keeps its own `rest_orientations` (from a real T-pose or the FBX bind) for</span>
<span class="tok-comment">/// character-to-character retargeting, where both sides are real orientations. Pairing with the</span>
<span class="tok-comment">/// ROBOT needs a different KIND of reference - bone directions - because that is all the robot</span>
<span class="tok-comment">/// has. **The rule is that the two sides must match, not that any one construction is correct.**</span>
<span class="tok-kw">fn</span> <span class="tok-fn">characterBoneDirections</span>(
    gpa: Allocator,
    character: *<span class="tok-kw">const</span> Character,
    out_orientations: []Quat,
) !void {
    <span class="tok-kw">const</span> joint_count: usize = character.<span class="tok-fn">boneCount</span>();
    <span class="tok-kw">const</span> rest_offsets: []Vec = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, joint_count);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(rest_offsets);
    <span class="tok-kw">const</span> rest_pose: [*]z.types.Transform =
        <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(character.model.clip.skeleton.bindPose));
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..joint_count) |joint| {
        rest_offsets[joint] = rest_pose[joint].translation;
    }
    z.codecs.bvh.<span class="tok-fn">restBoneOrientations</span>(
        character.target_parents[<span class="tok-num">0</span>..joint_count],
        rest_offsets,
        out_orientations[<span class="tok-num">0</span>..joint_count],
    );
}

<span class="tok-comment">/// The chains the twist offsets are computed along, parent to child.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** Each body appears in EXACTLY ONE chain. The torso previously headed all three upper-body</span>
<span class="tok-comment">/// chains, so its twist was computed three times and whichever ran last silently won. Arms start</span>
<span class="tok-comment">/// at `upper_arm_*` and inherit the torso's twist through `parent_twist`, which is what that</span>
<span class="tok-comment">/// term is for.</span>
<span class="tok-kw">const</span> robot_twist_chains = [_][]<span class="tok-kw">const</span> []<span class="tok-kw">const</span> u8{
    &amp;.{ <span class="tok-str">"torso"</span>, <span class="tok-str">"head"</span> },
    &amp;.{ <span class="tok-str">"torso"</span>, <span class="tok-str">"waist_lower"</span>, <span class="tok-str">"pelvis"</span> },
    &amp;.{ <span class="tok-str">"upper_arm_right"</span>, <span class="tok-str">"lower_arm_right"</span>, <span class="tok-str">"hand_right"</span> },
    &amp;.{ <span class="tok-str">"upper_arm_left"</span>, <span class="tok-str">"lower_arm_left"</span>, <span class="tok-str">"hand_left"</span> },
    &amp;.{ <span class="tok-str">"pelvis"</span>, <span class="tok-str">"thigh_right"</span>, <span class="tok-str">"shin_right"</span>, <span class="tok-str">"foot_right"</span> },
    &amp;.{ <span class="tok-str">"pelvis"</span>, <span class="tok-str">"thigh_left"</span>, <span class="tok-str">"shin_left"</span>, <span class="tok-str">"foot_left"</span> },
};

<span class="tok-comment">/// Build the robot's twist offsets, via the SHARED library implementation.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// *** The body of this used to live here AND in the scorecard harness, and the two copies</span>
<span class="tok-comment">/// drifted four ways before a screenshot caught it. `z.robot.computeTwistChainOffsets` is now</span>
<span class="tok-comment">/// the single implementation; this function only prepares its inputs.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">refreshRobotTwists</span>(
    s: *State,
    source: *<span class="tok-kw">const</span> Character,
    source_joint_count: usize,
) void {
