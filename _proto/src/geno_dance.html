    <span class="tok-comment">// * The source's T-pose world positions, converted to the robot's frame once here so the</span>
    <span class="tok-comment">// shared builder needs no knowledge of either skeleton's up-axis convention.</span>
    <span class="tok-comment">// -- *** SCALED TO THE ROBOT'S SIZE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Geno's rest positions are in CENTIMETRES (hips near 85) and the robot works in METRES</span>
    <span class="tok-comment">// (hips near 0.83). **The twist offsets never noticed, because directions are normalised -</span>
    <span class="tok-comment">// but `solveRobotTPose` uses these as POSITIONS**, and a 100x target is not a T-pose, it is</span>
    <span class="tok-comment">// a request to reach the next room.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * A units mismatch that is invisible to one consumer and fatal to another is exactly what</span>
    <span class="tok-comment">// sharing a buffer between them invites.</span>
    <span class="tok-kw">const</span> rest_robot_frame: []Vec = s.robot_rest_world[<span class="tok-num">0</span>..source_joint_count];
    <span class="tok-comment">// -- *** THE SCALE FROM ONE QUANTITY, IN ITS OWN UNITS --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The old form was `cm_to_m * robot_hip / source.hip_height`, pairing `rest_positions`</span>
    <span class="tok-comment">// (assumed CENTIMETRES) with `hip_height` (assumed METRES). **Two fields, two unit</span>
    <span class="tok-comment">// assumptions, and a different capture can honour neither** - the Mixamo drop kick left the</span>
    <span class="tok-comment">// robot standing in its rest pose while the character danced.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// *** Measuring the source's height FROM `rest_positions` removes both assumptions: the</span>
    <span class="tok-comment">// ratio is between two lengths, one of which is in whatever unit that array uses, so the</span>
    <span class="tok-comment">// unit cancels. **A scale derived from one quantity cannot disagree with itself.**</span>
    <span class="tok-kw">const</span> rest_scale: f32 = <span class="tok-fn">captureScale</span>(s, source);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..source_joint_count) |joint| {
        <span class="tok-kw">const</span> y_up: Vec = source.rest_positions[joint] * <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(rest_scale));
        rest_robot_frame[joint] = <span class="tok-fn">vec</span>(y_up[<span class="tok-num">0</span>], -y_up[<span class="tok-num">2</span>], y_up[<span class="tok-num">1</span>]);
    }

    <span class="tok-comment">// * The T-pose rotations in the robot's frame too - the SOURCE's rest local frame is not</span>
    <span class="tok-comment">// world (Spine3 carries four spine joints' accumulated rotation), so the twist must divide</span>
    <span class="tok-comment">// it out. Passing `null` would silently make the example a different algorithm from the</span>
    <span class="tok-comment">// measured one, which is the divergence this extraction exists to prevent.</span>
    <span class="tok-kw">const</span> rest_rotations: []Quat = s.robot_rest_rotations[<span class="tok-num">0</span>..source_joint_count];
    <span class="tok-kw">const</span> y_to_z: Quat = zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">1.5707963</span>);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..source_joint_count) |joint| {
        rest_rotations[joint] = zm.<span class="tok-fn">qmul</span>(
            zm.<span class="tok-fn">qmul</span>(y_to_z, source.rest_orientations[joint]),
            zm.<span class="tok-fn">conjugate</span>(y_to_z),
        );
    }

    <span class="tok-comment">// -- *** SOLVE THE ROBOT INTO GENO'S T-POSE, AND USE THAT AS ITS REFERENCE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// **`humanoid.xml`'s `qpos0` IS NOT A T-POSE.** Seen side by side, Geno stands with arms</span>
    <span class="tok-comment">// straight out while the robot folds its arms up into a triangle. Every twist offset has</span>
    <span class="tok-comment">// been `shortestArc(robot rest bone -&gt; geno rest bone)` between two DIFFERENT POSES - which</span>
    <span class="tok-comment">// is the rule this arc has broken four times, and this is its root instance.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// ** So stop treating `qpos0` as the reference and BUILD one: IK the robot onto Geno's</span>
    <span class="tok-comment">// T-pose joint positions, and take the resulting configuration as its rest. Both sides then</span>
    <span class="tok-comment">// depict the same physical pose because the robot's was DERIVED from the character's.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * This uses the solver that already exists and is tested. It runs once per source change,</span>
    <span class="tok-comment">// not per frame.</span>
    <span class="tok-comment">// -- *** A SANITY BOUND ON THE SCALED REST POSE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// A units mismatch here has now produced a T-pose 100x too SMALL (targets unreachable) and</span>
    <span class="tok-comment">// one 100x too LARGE (a figure the size of a building). Both compiled, both passed lint, and</span>
    <span class="tok-comment">// both needed a screenshot to notice.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * A human-scaled skeleton spans roughly two metres. Anything past four is a units bug, and</span>
    <span class="tok-comment">// saying so on screen beats rendering it.</span>
    <span class="tok-kw">var</span> rest_span: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..source_joint_count) |joint| {
        <span class="tok-kw">const</span> p: Vec = rest_robot_frame[joint];
        rest_span = <span class="tok-builtin">@max</span>(rest_span, <span class="tok-builtin">@abs</span>(p[<span class="tok-num">0</span>]));
        rest_span = <span class="tok-builtin">@max</span>(rest_span, <span class="tok-builtin">@abs</span>(p[<span class="tok-num">1</span>]));
        rest_span = <span class="tok-builtin">@max</span>(rest_span, <span class="tok-builtin">@abs</span>(p[<span class="tok-num">2</span>]));
    }
    <span class="tok-kw">if</span> (rest_span &gt; <span class="tok-num">4.0</span> <span class="tok-kw">or</span> rest_span &lt; <span class="tok-num">0.2</span>) {
        <span class="tok-fn">setStatus</span>(s, <span class="tok-str">"rest pose spans {d:.2} m — units mismatch, T-pose not built"</span>, .{rest_span});
        s.robot_ready = false;
        <span class="tok-kw">return</span>;
    }

    <span class="tok-fn">solveRobotTPose</span>(s, rest_robot_frame, source.target_parents[<span class="tok-num">0</span>..source_joint_count]);
    s.robot_ready = true;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.robot.model.nbody) |body| {
        s.robot_rest_xpos[body] = s.robot_data.body_xpos[body];
        s.robot_rest_xrot[body] = s.robot_data.body_xrot[body];
        <span class="tok-comment">// * The POSITIONS too: the leaf correspondence self-check needs both halves of the rest</span>
        <span class="tok-comment">// pose, and keeping only the rotations is why it could not run here.</span>
        s.robot_rest_body_pos[body] = s.robot_data.body_xpos[body];
    }
    <span class="tok-comment">// * Each hinge's bend at THIS rest pose, so a flexion can be written as an offset from it.</span>
    <span class="tok-builtin">@memset</span>(s.robot_rest_flexion, <span class="tok-num">0</span>);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.robot.model.nbody) |body| {
        <span class="tok-kw">if</span> (s.robot.model.body_jnt_num[body] != <span class="tok-num">1</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> parent: u32 = s.robot.model.body_parent[body];
        <span class="tok-kw">if</span> (parent == <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">var</span> child: ?usize = null;
        <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot.model.nbody) |candidate| {
            <span class="tok-kw">if</span> (s.robot.model.body_parent[candidate] == body) {
                child = candidate;
                <span class="tok-kw">break</span>;
            }
        }
        <span class="tok-kw">const</span> tip: usize = child <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
        <span class="tok-kw">const</span> upper: Vec = s.robot_rest_xpos[body] - s.robot_rest_xpos[parent];
        <span class="tok-kw">const</span> lower: Vec = s.robot_rest_xpos[tip] - s.robot_rest_xpos[body];
        <span class="tok-kw">const</span> upper_len: f32 = <span class="tok-builtin">@sqrt</span>(upper[<span class="tok-num">0</span>] * upper[<span class="tok-num">0</span>] + upper[<span class="tok-num">1</span>] * upper[<span class="tok-num">1</span>] + upper[<span class="tok-num">2</span>] * upper[<span class="tok-num">2</span>]);
        <span class="tok-kw">const</span> lower_len: f32 = <span class="tok-builtin">@sqrt</span>(lower[<span class="tok-num">0</span>] * lower[<span class="tok-num">0</span>] + lower[<span class="tok-num">1</span>] * lower[<span class="tok-num">1</span>] + lower[<span class="tok-num">2</span>] * lower[<span class="tok-num">2</span>]);
        <span class="tok-kw">if</span> (upper_len &lt; <span class="tok-num">1.0e-6</span> <span class="tok-kw">or</span> lower_len &lt; <span class="tok-num">1.0e-6</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> cosine: f32 = <span class="tok-fn">clamp</span>(
            (upper[<span class="tok-num">0</span>] * lower[<span class="tok-num">0</span>] + upper[<span class="tok-num">1</span>] * lower[<span class="tok-num">1</span>] + upper[<span class="tok-num">2</span>] * lower[<span class="tok-num">2</span>]) /
                (upper_len * lower_len),
            -<span class="tok-num">1.0</span>,
            <span class="tok-num">1.0</span>,
        );
        s.robot_rest_flexion[body] = <span class="tok-fn">acosRad</span>(cosine);
    }

    z.robot.<span class="tok-fn">computeTwistChainOffsets</span>(
        &amp;s.robot.model,
        &amp;s.robot_data,
        s.robot.names,
        s.human_of_body,
        rest_robot_frame,
        rest_rotations,
        &amp;robot_twist_chains,
        <span class="tok-comment">// * OFF: enabling it measures WORSE across six of seven stages - see</span>
        <span class="tok-comment">// `src/notes/twist_port_plan.md` section 21.</span>
        null,
        <span class="tok-comment">// * THE SOLVED T-POSE, not `qpos0` - both references now depict the same physical pose.</span>
        s.robot_tpose_qpos,
        s.robot_twist,
        s.robot_parent_twist,
    );

    <span class="tok-comment">// ** THE TORSO'S REFERENCE BONE IS REPLACED AFTERWARDS. Its chain bone `torso -&gt; head` is</span>
    <span class="tok-comment">// VERTICAL, and a shortest arc between two vertical bones cannot encode YAW - which is the</span>
    <span class="tok-comment">// axis the two skeletons actually differ about. Shoulder-to-shoulder is horizontal and sees</span>
    <span class="tok-comment">// it exactly.</span>
    <span class="tok-kw">if</span> (<span class="tok-fn">findBody</span>(s, <span class="tok-str">"torso"</span>)) |torso| {
        <span class="tok-kw">if</span> (<span class="tok-fn">shoulderAxes</span>(s, rest_robot_frame)) |axes| {
            s.robot_twist[torso] =
                z.robot.<span class="tok-fn">computeTwistOffset</span>(axes.robot, axes.human, zm.quat_identity);
            <span class="tok-comment">// Children of the torso inherit the corrected value.</span>
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.robot.model.nbody) |body| {
                <span class="tok-kw">if</span> (s.robot.model.body_parent[body] == torso) {
                    s.robot_parent_twist[body] = s.robot_twist[torso];
                }
            }
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">findBody</span>(s: *<span class="tok-kw">const</span> State, wanted: []<span class="tok-kw">const</span> u8) ?usize {
    <span class="tok-kw">for</span> (s.robot.names, <span class="tok-num">0</span>..) |name, index| {
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, name, wanted)) {
            <span class="tok-kw">return</span> index;
        }
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-comment">/// Rebuild the robot's joint map and rest alignment for whichever character now drives it.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">refreshRobotMap</span>(s: *State) !void {
    <span class="tok-kw">const</span> source: *<span class="tok-kw">const</span> Character = &amp;s.characters[s.robot_source];
    <span class="tok-kw">const</span> source_joint_count: usize = source.<span class="tok-fn">boneCount</span>();

    <span class="tok-kw">const</span> source_names: [][]<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> s.gpa.<span class="tok-fn">alloc</span>([]<span class="tok-kw">const</span> u8, source_joint_count);
    <span class="tok-kw">defer</span> s.gpa.<span class="tok-fn">free</span>(source_names);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..source_joint_count) |joint| {
        source_names[joint] = source.clip.<span class="tok-fn">boneName</span>(joint);
    }

    <span class="tok-comment">// * An unknown body name is an ERROR, not a stiff limb that looks like a solver bug.</span>
    z.robot.<span class="tok-fn">resolveMatchTable</span>(
        &amp;z.robot.lafan_to_humanoid,
        s.robot.names,
        source_names,
        s.human_of_body,
    ) <span class="tok-kw">catch</span> {
        <span class="tok-fn">setStatus</span>(s, <span class="tok-str">"robot match table failed to resolve"</span>, .{});
        s.show_robot = false;
        <span class="tok-kw">return</span>;
    };

    <span class="tok-comment">// * The human side of the ROBOT pairing uses bone directions too - see</span>
    <span class="tok-comment">// `characterBoneDirections`. Both sides, same question, same construction.</span>
    <span class="tok-kw">const</span> source_bone_directions: []Quat = <span class="tok-kw">try</span> s.gpa.<span class="tok-fn">alloc</span>(Quat, source_joint_count);
    <span class="tok-kw">defer</span> s.gpa.<span class="tok-fn">free</span>(source_bone_directions);
    <span class="tok-kw">try</span> <span class="tok-fn">characterBoneDirections</span>(s.gpa, source, source_bone_directions);

    z.codecs.bvh.<span class="tok-fn">restAlignmentOffsets</span>(
        s.human_of_body,
        source_bone_directions,
        s.robot_reference,
        s.robot_rest_alignment,
    );
    <span class="tok-builtin">@memcpy</span>(s.robot_human_reference[<span class="tok-num">0</span>..source_joint_count], source_bone_directions);

    <span class="tok-comment">// -- *** THE PER-LIMB CORRECTION, MEASURED FROM THE TWO REST POSES --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// For every mapped body: the rotation taking the HUMAN's rest bone direction onto the</span>
    <span class="tok-comment">// ROBOT's. Identity where they already agree - which the measurement says is the torso and</span>
    <span class="tok-comment">// both legs - and roughly 55 degrees on the arms, where the robot rests diagonally and the</span>
    <span class="tok-comment">// human rests straight out.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * Derived, not authored. This is GMR's `rot_offset` column, and the reason theirs varies</span>
    <span class="tok-comment">// per limb GROUP is exactly this: a robot's arm convention and its leg convention differ.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.robot.model.nbody) |body| {
        s.robot_limb_correction[body] = zm.quat_identity;
        <span class="tok-kw">const</span> human_joint: i32 = s.human_of_body[body];
        <span class="tok-kw">if</span> (human_joint &lt; <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> joint: usize = <span class="tok-builtin">@intCast</span>(human_joint);

        <span class="tok-comment">// The robot's rest bone: its first child's offset, which at `qpos0` is also its world</span>
        <span class="tok-comment">// direction because `humanoid.xml` declares no body rotations.</span>
        <span class="tok-kw">var</span> robot_child: ?usize = null;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.robot.model.nbody) |candidate| {
            <span class="tok-kw">if</span> (candidate != <span class="tok-num">0</span> <span class="tok-kw">and</span> s.robot.model.body_parent[candidate] == body) {
                robot_child = candidate;
                <span class="tok-kw">break</span>;
            }
        }
        <span class="tok-kw">const</span> robot_tip: usize = robot_child <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
        <span class="tok-kw">const</span> robot_dir: Vec = <span class="tok-fn">normalize3</span>(s.robot.model.body_pos[robot_tip]);

        <span class="tok-comment">// The human's rest bone, from its own rest offsets, through the position conversion.</span>
        <span class="tok-kw">var</span> human_child: ?usize = null;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..source_joint_count) |candidate| {
            <span class="tok-kw">if</span> (source.target_parents[candidate] == <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(joint))) {
                human_child = candidate;
                <span class="tok-kw">break</span>;
            }
        }
        <span class="tok-kw">const</span> human_tip: usize = human_child <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
        <span class="tok-kw">const</span> rest_pose: [*]z.types.Transform =
            <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(source.model.clip.skeleton.bindPose));
        <span class="tok-kw">const</span> human_bone_y_up: Vec = rest_pose[human_tip].translation;
        <span class="tok-kw">const</span> human_length: f32 = <span class="tok-builtin">@sqrt</span>(human_bone_y_up[<span class="tok-num">0</span>] * human_bone_y_up[<span class="tok-num">0</span>] +
            human_bone_y_up[<span class="tok-num">1</span>] * human_bone_y_up[<span class="tok-num">1</span>] + human_bone_y_up[<span class="tok-num">2</span>] * human_bone_y_up[<span class="tok-num">2</span>]);
        <span class="tok-kw">if</span> (human_length &lt; <span class="tok-num">1.0e-6</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> human_unit: Vec = human_bone_y_up / <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(human_length));
        <span class="tok-kw">const</span> human_dir: Vec = <span class="tok-fn">vec</span>(human_unit[<span class="tok-num">0</span>], -human_unit[<span class="tok-num">2</span>], human_unit[<span class="tok-num">1</span>]);

        s.robot_limb_correction[body] = <span class="tok-fn">shortestArcBetween</span>(human_dir, robot_dir);
    }

    <span class="tok-fn">refreshRobotTwists</span>(s, source, source_joint_count);

    <span class="tok-comment">// The table's position weights, indexed by body so `poseRobot` needs no name lookup.</span>
    <span class="tok-builtin">@memset</span>(s.robot_position_weights, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.robot_rotation_weights, <span class="tok-num">0</span>);
    <span class="tok-kw">for</span> (z.robot.lafan_to_humanoid) |row| {
        <span class="tok-kw">for</span> (s.robot.names, <span class="tok-num">0</span>..) |name, body| {
            <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, name, row.robot_body)) {
                s.robot_position_weights[body] = row.position_weight;
                s.robot_rotation_weights[body] = row.rotation_weight;
                <span class="tok-kw">break</span>;
            }
        }
    }
}

<span class="tok-comment">/// Drive the robot from one frame of its source character's clip.</span>
<span class="tok-comment">/// Drive the robot from one frame of its source character's clip.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** GMR'S DESIGN, AFTER THREE FAILED ATTEMPTS AT SOMETHING ELSE --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// GMR sets each robot body a full SE3 target - POSITION AND ORIENTATION, both in WORLD space,</span>
<span class="tok-comment">/// taken straight from the human's corrected pose - and solves every task at once. **It never</span>
<span class="tok-comment">/// computes per-joint local rotations and never decomposes anything.**</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** Decomposing was the fatal flaw in the three attempts before this one. Computing</span>
<span class="tok-comment">/// `local = conj(parent_DESIRED_global) * desired_global` assumes the parent REACHES its desired</span>
<span class="tok-comment">/// orientation - but `humanoid.xml`'s knee is one hinge and cannot, so every child was solved</span>
<span class="tok-comment">/// against a parent that was wrong and the error compounded down the chain. That is where 89</span>
<span class="tok-comment">/// degrees of residual came from: not one joint's honest shortfall, but accumulated</span>
<span class="tok-comment">/// inconsistency.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * A solver has no such problem. When a parent falls short it compensates with the child,</span>
<span class="tok-comment">/// because it optimises every joint against every target together.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">poseRobot</span>(s: *State, frame: usize) void {
    <span class="tok-kw">const</span> source: *<span class="tok-kw">const</span> Character = &amp;s.characters[s.robot_source];
    <span class="tok-kw">const</span> source_joint_count: usize = source.<span class="tok-fn">boneCount</span>();

    <span class="tok-comment">// The source's world pose for this frame.</span>
    d3.<span class="tok-fn">bvhForwardKinematics</span>(
        source.clip,
        frame,
        source.positions[<span class="tok-num">0</span>..source_joint_count],
        source.rotations[<span class="tok-num">0</span>..source_joint_count],
    );

    <span class="tok-kw">const</span> y_up_to_z_up: Quat = zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">1.5707963</span>);
    <span class="tok-kw">const</span> z_up_to_y_up: Quat = zm.<span class="tok-fn">conjugate</span>(y_up_to_z_up);

    <span class="tok-kw">const</span> source_root_y_up: Vec = source.positions[<span class="tok-num">0</span>];
    <span class="tok-comment">// -- *** MEASURED, NOT GUESSED --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//     ROBOT  height 1.445 m   hips 0.830   shoulder 1.315</span>
    <span class="tok-comment">//     HUMAN  height 165.0 cm  hips  84.4   shoulder  136.7</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// ** A HARDCODED 0.9 here gave 0.9/84.4 = 0.01066 against a measured hip ratio of 0.00983</span>
    <span class="tok-comment">// - **8.5% too large**, so every target sat further out than the robot could reach, on</span>
    <span class="tok-comment">// every frame, for this entire arc. A guessed constant next to real geometry is a bug</span>
    <span class="tok-comment">// waiting for someone to measure it.</span>
    <span class="tok-comment">// *** THE SAME UNIT-FREE RATIO AS THE REST SCALE. Two scales derived from different</span>
    <span class="tok-comment">// quantities can disagree, and a per-frame scale that disagrees with the rest scale puts</span>
    <span class="tok-comment">// every target in a different world from the offsets measured against the rest pose.</span>
    <span class="tok-comment">// **One derivation, used twice.**</span>
    <span class="tok-kw">const</span> scale: f32 = <span class="tok-fn">captureScale</span>(s, source);
    <span class="tok-kw">const</span> root_z_up: Vec = <span class="tok-fn">vec</span>(
        source_root_y_up[<span class="tok-num">0</span>] * scale,
        -source_root_y_up[<span class="tok-num">2</span>] * scale,
        source_root_y_up[<span class="tok-num">1</span>] * scale,
    );

    <span class="tok-comment">// -- *** THE TORSO IS PLACED DIRECTLY, NOT SOLVED --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// It is the ROOT body and carries the free joint, so its position AND orientation are</span>
    <span class="tok-comment">// WRITABLE - six DOF, no chain above it, nothing to compete with. **If the torso alone does</span>
    <span class="tok-comment">// not land on the human's torso, no amount of IK below it can help**, and every previous</span>
    <span class="tok-comment">// attempt was solving sixteen bodies without ever checking one.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * So: place the torso exactly, draw it, and only then add bones. IK becomes what it</span>
    <span class="tok-comment">// should be - a refinement for the joints that CANNOT be placed directly - rather than the</span>
    <span class="tok-comment">// thing being asked to rescue a wrong frame.</span>

    <span class="tok-comment">// * Start from the REST configuration each frame rather than from the previous frame's</span>
    <span class="tok-comment">// answer. A solver warm-started from a pose that was itself wrong inherits the error, and</span>
    <span class="tok-comment">// debugging a drifting sequence is far harder than debugging a single frame.</span>
    <span class="tok-builtin">@memcpy</span>(s.robot_data.pos, s.robot.model.qpos0);
    <span class="tok-kw">if</span> (s.robot.model.njnt &gt; <span class="tok-num">0</span> <span class="tok-kw">and</span> s.robot.model.jnt_type[<span class="tok-num">0</span>] == .free) {
        <span class="tok-kw">const</span> root_qpos: usize = s.robot.model.jnt_qpos_adr[<span class="tok-num">0</span>];
        s.robot_data.pos[root_qpos + <span class="tok-num">0</span>] = root_z_up[<span class="tok-num">0</span>];
        s.robot_data.pos[root_qpos + <span class="tok-num">1</span>] = root_z_up[<span class="tok-num">1</span>];
        s.robot_data.pos[root_qpos + <span class="tok-num">2</span>] = root_z_up[<span class="tok-num">2</span>];
    }
    z.robot.<span class="tok-fn">kinematics</span>(&amp;s.robot.model, &amp;s.robot_data);
    z.robot.<span class="tok-fn">comPos</span>(&amp;s.robot.model, &amp;s.robot_data);

    <span class="tok-comment">// -- *** THE INPUTS THE LIBRARY WANTS --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// What follows converts a `Character` into the two arrays `robot.solvePointCloud` consumes:</span>
    <span class="tok-comment">// the capture's joint positions and rotations, in the robot's Z-up frame at the robot's</span>
    <span class="tok-comment">// scale. **That conversion is the example's only remaining job in the retarget.**</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// ** The comments that stood here described `poseFromRetarget` and a 270-line duplicate loop</span>
    <span class="tok-comment">// - both accurate when written, both long superseded by the point-cloud solve. **A comment</span>
    <span class="tok-comment">// naming the wrong function is how three of this session's misdiagnoses started**: it reads</span>
    <span class="tok-comment">// as documentation and behaves as misdirection.</span>

    <span class="tok-kw">var</span> positions_robot: [<span class="tok-num">128</span>]Vec = undefined;
    <span class="tok-kw">var</span> rotations_robot: [<span class="tok-num">128</span>]Quat = undefined;
    <span class="tok-kw">const</span> joint_count: usize = <span class="tok-builtin">@min</span>(source_joint_count, positions_robot.len);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..joint_count) |joint| {
        <span class="tok-kw">const</span> p_y: Vec = (source.positions[joint] - source_root_y_up) * <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(scale));
        positions_robot[joint] = root_z_up + <span class="tok-fn">vec</span>(p_y[<span class="tok-num">0</span>], -p_y[<span class="tok-num">2</span>], p_y[<span class="tok-num">1</span>]);
        rotations_robot[joint] = zm.<span class="tok-fn">qmul</span>(
            zm.<span class="tok-fn">qmul</span>(y_up_to_z_up, source.rotations[joint]),
            z_up_to_y_up,
        );
    }

    <span class="tok-comment">// *** ONE POINT-CLOUD SOLVE, replacing the six sequential mechanisms. See</span>
    <span class="tok-comment">// `solvePointCloud` for the measurements and `src/notes/retarget_formulation.md` for why</span>
    <span class="tok-comment">// matching points subsumes position, direction, twist, bend plane and swivel at once.</span>
    <span class="tok-comment">// -- *** ONE LIBRARY CALL --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Samples built once and cached; the retargeted skeleton rebuilt each frame because it</span>
    <span class="tok-comment">// follows the capture's directions. **Both come from `src/robot.zig`, so the harness measures</span>
    <span class="tok-comment">// the code that ships** rather than a copy of it.</span>
    <span class="tok-kw">if</span> (s.robot_sample_count == <span class="tok-num">0</span>) {
        <span class="tok-fn">refreshPointSamples</span>(s, source);
    }
    <span class="tok-kw">var</span> retargeted: [<span class="tok-num">64</span>]Vec = undefined;
    <span class="tok-fn">buildRetargetedSkeleton</span>(s, positions_robot[<span class="tok-num">0</span>..joint_count], &amp;retargeted);
    z.robot.<span class="tok-fn">solvePointCloud</span>(
        &amp;s.robot.model,
        &amp;s.robot_data,
        s.robot_samples[<span class="tok-num">0</span>..s.robot_sample_count],
        .{
            .positions = positions_robot[<span class="tok-num">0</span>..joint_count],
            .rotations = rotations_robot[<span class="tok-num">0</span>..joint_count],
            .retargeted = retargeted[<span class="tok-num">0</span>..s.robot.model.nbody],
            .root_world = <span class="tok-fn">rootBodyWorldPosition</span>(s, positions_robot[<span class="tok-num">0</span>..joint_count]),
            .position_pull = s.robot_position_pull,
            .previous_qpos = <span class="tok-kw">if</span> (s.robot_has_previous) s.robot_previous_qpos <span class="tok-kw">else</span> null,
            .posture_weight = <span class="tok-num">0.15</span>,
            .scratch = s.robot_ik_scratch,
            .tasks = s.robot_tasks,
        },
    );
    <span class="tok-builtin">@memcpy</span>(s.robot_previous_qpos, s.robot_data.pos[<span class="tok-num">0</span>..s.robot.model.nq]);
    s.robot_has_previous = true;
    <span class="tok-fn">recordRobotFit</span>(s, positions_robot[<span class="tok-num">0</span>..joint_count]);

    <span class="tok-kw">const</span> task_count: usize = <span class="tok-num">0</span>;

    <span class="tok-comment">// -- *** THE RIGHT ARM: A MASKED, LIMITED 3-DOF SOLVE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Targets built from the capture's DIRECTIONS at the ROBOT's own bone lengths, so both are</span>
    <span class="tok-comment">// exactly reachable and both bones point where the character's do. Masked to the arm's own</span>
    <span class="tok-comment">// DOF - an unmasked hand task translates the whole robot, which is cheaper than bending an</span>
    <span class="tok-comment">// arm and wrecks the torso. Limits enforced, because without them the solver returns poses</span>
    <span class="tok-comment">// the robot cannot hold (measured: a shoulder at -118 against a range of [-85, 60]).</span>
    <span class="tok-comment">// -- ** THE FOUR PER-LIMB CHAIN SOLVES ARE GONE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// They ran AFTER the pose loop and overrode it, and each was a separate masked solve whose</span>
    <span class="tok-comment">// targets were built on where the stage before it was SUPPOSED to have put things - the</span>
    <span class="tok-comment">// foot's aim was 4 degrees wrong for exactly that reason. **The single point-cloud solve</span>
    <span class="tok-comment">// subsumes all four**: nothing is downstream of anything, so nothing inherits another</span>
    <span class="tok-comment">// stage's error.</span>

    <span class="tok-comment">// -- * (superseded) THE LEGS DO **NOT** GET THE CHAIN SOLVE --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">//                  existing path      chain solve</span>
    <span class="tok-comment">//     thigh          12.5 deg         28-43 deg      WORSE</span>
    <span class="tok-comment">//     shin/knee       6.6 deg         27-53 deg      MUCH WORSE</span>
    <span class="tok-comment">//     hip at limit       -            2 of 4 frames</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// *** The construction that fixed the arm makes the legs worse by a factor of three. The</span>
    <span class="tok-comment">// arm needed it because a 2-DOF shoulder pinned against a [-85,60] patch could not aim at</span>
    <span class="tok-comment">// all; **the legs were already the best part of the retarget** (knee 6.6 deg) through the</span>
    <span class="tok-comment">// twist-offset path, and a chain of exactly-reachable targets over-constrains a 4-DOF leg</span>
    <span class="tok-comment">// where it rescued a 3-DOF arm.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// ** "It worked for the arm" is not a reason. The same code, the same targets, the same</span>
    <span class="tok-comment">// mask - opposite outcomes, because the two limbs are not the same mechanism. **Measured</span>
    <span class="tok-comment">// before shipping, and left off.**</span>

    <span class="tok-comment">// * GMR's stopping rule: iterate while the error is still falling. From rest that is more</span>
    <span class="tok-comment">// steps than from a warm start, which is the price of not inheriting last frame's error.</span>
    <span class="tok-comment">// Every body has been posed; `comPos` is what the solver additionally needs.</span>
    z.robot.<span class="tok-fn">comPos</span>(&amp;s.robot.model, &amp;s.robot_data);

    <span class="tok-kw">const</span> iteration_budget: usize = <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@max</span>(s.robot_ik_iterations, <span class="tok-num">0</span>));
    <span class="tok-kw">var</span> previous_error: f32 = <span class="tok-num">1.0e9</span>;
    <span class="tok-kw">var</span> final_error: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..iteration_budget) |_| {
        final_error = z.robot.<span class="tok-fn">ikStep</span>(
            &amp;s.robot.model,
            &amp;s.robot_data,
            s.robot_tasks[<span class="tok-num">0</span>..task_count],
            .{ .damping = s.robot_ik_damping },
            s.robot_ik_scratch,
        );
        z.robot.<span class="tok-fn">kinematics</span>(&amp;s.robot.model, &amp;s.robot_data);
        z.robot.<span class="tok-fn">comPos</span>(&amp;s.robot.model, &amp;s.robot_data);
        <span class="tok-kw">if</span> (previous_error - final_error &lt; <span class="tok-num">0.0005</span>) {
            <span class="tok-kw">break</span>;
        }
        previous_error = final_error;
    }
    <span class="tok-comment">// * The reported number is now the SOLVER's residual error, not a per-joint rotation</span>
    <span class="tok-comment">// shortfall - it measures how far the robot ended from the targets it was given, which is</span>
    <span class="tok-comment">// the thing a viewer actually wants to know.</span>
    <span class="tok-comment">// * Zero tasks or zero iterations means the number is MEANINGLESS, not zero - reporting a</span>
    <span class="tok-comment">// stale 0.000 with the solver off is how `ik error` read perfect while nothing had run.</span>
    s.robot_mean_residual = <span class="tok-kw">if</span> (task_count &gt; <span class="tok-num">0</span> <span class="tok-kw">and</span> iteration_budget &gt; <span class="tok-num">0</span>)
        final_error / <span class="tok-fn">float</span>(task_count)
    <span class="tok-kw">else</span>
        -<span class="tok-num">1.0</span>;

    <span class="tok-comment">// -- *** A COLLAPSED ROBOT MEANS THIS FUNCTION NEVER RAN --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `robot_positions_y_up` starts zeroed, so if `poseRobot` is skipped every body draws at the</span>
    <span class="tok-comment">// origin and the geoms pile into a ball. **That looks like a solver failure and is not one**</span>
    <span class="tok-comment">// - it is the pose function not being reached at all, which has happened when the match</span>
    <span class="tok-comment">// table failed to resolve and `show_robot` was cleared.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * The readout beside the robot checkbox distinguishes them: `bodies 0/18` means the TABLE</span>
    <span class="tok-comment">// failed; `bodies 18/18` with a ball on screen means this loop did not run.</span>
    s.robot_posed_frames +|= <span class="tok-num">1</span>;

    <span class="tok-comment">// * Z-UP -&gt; Y-UP for display, once, at the boundary.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.robot.model.nbody) |body| {
        <span class="tok-kw">const</span> z_up: Vec = s.robot_data.body_xpos[body];
        s.robot_positions_y_up[body] = <span class="tok-fn">vec</span>(z_up[<span class="tok-num">0</span>], z_up[<span class="tok-num">2</span>], -z_up[<span class="tok-num">1</span>]);
    }
}

<span class="tok-comment">/// The shoulder-to-shoulder axis on both skeletons, at rest - a HORIZONTAL reference the</span>
<span class="tok-comment">/// vertical spine bone cannot provide.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">shoulderAxes</span>(s: *State, rest_world: []<span class="tok-kw">const</span> Vec) ?<span class="tok-kw">struct</span> { robot: Vec, human: Vec } {
    <span class="tok-kw">var</span> rl: ?usize = null;
    <span class="tok-kw">var</span> rr: ?usize = null;
    <span class="tok-kw">for</span> (s.robot.names, <span class="tok-num">0</span>..) |n, i| {
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, n, <span class="tok-str">"upper_arm_left"</span>)) {
            rl = i;
        }
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, n, <span class="tok-str">"upper_arm_right"</span>)) {
            rr = i;
        }
    }
    <span class="tok-kw">const</span> left: usize = rl <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> null;
    <span class="tok-kw">const</span> right: usize = rr <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> null;
    <span class="tok-kw">const</span> hl: i32 = s.human_of_body[left];
    <span class="tok-kw">const</span> hr: i32 = s.human_of_body[right];
    <span class="tok-kw">if</span> (hl &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> hr &lt; <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> null;
    }

    <span class="tok-kw">const</span> robot_axis: Vec = s.robot_data.body_xpos[left] - s.robot_data.body_xpos[right];
    <span class="tok-comment">// * Already in the robot's frame - converted once by the caller.</span>
    <span class="tok-kw">const</span> human_y_up: Vec = rest_world[<span class="tok-builtin">@intCast</span>(hl)] - rest_world[<span class="tok-builtin">@intCast</span>(hr)];
    <span class="tok-kw">const</span> robot_len: f32 = <span class="tok-builtin">@sqrt</span>(robot_axis[<span class="tok-num">0</span>] * robot_axis[<span class="tok-num">0</span>] +
        robot_axis[<span class="tok-num">1</span>] * robot_axis[<span class="tok-num">1</span>] + robot_axis[<span class="tok-num">2</span>] * robot_axis[<span class="tok-num">2</span>]);
    <span class="tok-kw">const</span> human_len: f32 = <span class="tok-builtin">@sqrt</span>(human_y_up[<span class="tok-num">0</span>] * human_y_up[<span class="tok-num">0</span>] +
        human_y_up[<span class="tok-num">1</span>] * human_y_up[<span class="tok-num">1</span>] + human_y_up[<span class="tok-num">2</span>] * human_y_up[<span class="tok-num">2</span>]);
    <span class="tok-kw">if</span> (robot_len &lt; <span class="tok-num">1.0e-6</span> <span class="tok-kw">or</span> human_len &lt; <span class="tok-num">1.0e-6</span>) {
        <span class="tok-kw">return</span> null;
    }
    <span class="tok-kw">return</span> .{
        .robot = robot_axis / <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(robot_len)),
        .human = human_y_up / <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(human_len)),
    };
}

<span class="tok-comment">/// Pose the robot into the character's T-pose, so both references depict the SAME pose.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * Thin wrapper over the SHARED solver - the example and the harness call one implementation.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">solveRobotTPose</span>(
    s: *State,
    rest_robot_frame: []<span class="tok-kw">const</span> Vec,
    human_parents: []<span class="tok-kw">const</span> i32,
) void {
    <span class="tok-kw">var</span> pelvis_body: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (s.robot.names, <span class="tok-num">0</span>..) |n, i| {
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, n, <span class="tok-str">"pelvis"</span>)) {
            pelvis_body = i;
        }
    }
    z.robot.<span class="tok-fn">solveRestPoseFromSource</span>(
        &amp;s.robot.model,
        &amp;s.robot_data,
        s.human_of_body,
        rest_robot_frame,
        human_parents,
        pelvis_body,
        s.robot_tasks,
        s.robot_ik_scratch,
        s.robot_tpose_qpos,
    );
}

<span class="tok-comment">/// Draw both rest poses side by side, or superimposed, with their joint frames.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** THE REST POSES ARE WHAT EVERY TWIST OFFSET IS BUILT FROM --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Each `R_twist` is `shortestArc(robot rest bone -&gt; source rest bone)`. **If those two rest</span>
<span class="tok-comment">/// poses do not relate the way the code assumes, every twist is wrong and no amount of</span>
<span class="tok-comment">/// per-frame work recovers it** - and until now the rest poses have only ever been inspected</span>
<span class="tok-comment">/// through numbers.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * The offset slider superimposes them: at zero, a robot bone that does not lie along its</span>
<span class="tok-comment">/// character bone IS the error in that bone's twist, visible directly.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** Joint FRAMES are drawn too, not just bones. A bone shows direction; the twist offsets also</span>
<span class="tok-comment">/// depend on rotation ABOUT that direction, which a capsule cannot show and which has already</span>
<span class="tok-comment">/// cost this arc a quarter turn at the torso.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawTposeComparison</span>(s: *State, gl: *z.WgpuGl) void {
    <span class="tok-kw">const</span> source: *<span class="tok-kw">const</span> Character = &amp;s.characters[s.robot_source];
    <span class="tok-comment">// * The SAME scale the T-pose solve used, or the two figures are different sizes and</span>
    <span class="tok-comment">// superimposing them compares nothing.</span>
    <span class="tok-kw">const</span> draw_scale: f32 = cm_to_m * <span class="tok-kw">if</span> (source.hip_height &gt; <span class="tok-num">0.01</span>)
        <span class="tok-comment">// ** `hip_height` IS ALREADY IN METRES while `rest_positions` are in CENTIMETRES.</span>
        <span class="tok-comment">// Multiplying it by `cm_to_m` here as well divided by a hundredth and drew a T-pose the</span>
        <span class="tok-comment">// size of a building. **Two quantities from the same struct in different units is the</span>
        <span class="tok-comment">// trap**; the conversion belongs on the positions only.</span>
        robot_hip_height_m / source.hip_height
    <span class="tok-kw">else</span>
        <span class="tok-num">1.0</span>;
    <span class="tok-kw">if</span> (!s.robot_ready) {
        <span class="tok-comment">// * Nothing to draw yet. Saying so beats an empty scene that reads as "the robot has no</span>
        <span class="tok-comment">// T-pose" when it means "this view has no data".</span>
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> joint_count: usize = source.<span class="tok-fn">boneCount</span>();
    <span class="tok-kw">const</span> shift: Vec = <span class="tok-fn">vec</span>(s.tpose_offset, <span class="tok-num">0</span>, <span class="tok-num">0</span>);

    <span class="tok-comment">// -- The CHARACTER's T-pose --</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..joint_count) |joint| {
        <span class="tok-kw">const</span> parent: i32 = source.target_parents[joint];
        <span class="tok-kw">if</span> (parent &lt; <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> from: Vec = source.rest_positions[<span class="tok-builtin">@intCast</span>(parent)] * <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(draw_scale));
        <span class="tok-kw">const</span> to: Vec = source.rest_positions[joint] * <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(draw_scale));
        <span class="tok-fn">drawBoneSegment</span>(gl, from, to, Color{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> }, <span class="tok-num">0.012</span>);
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..joint_count) |joint| {
        <span class="tok-kw">const</span> at: Vec = source.rest_positions[joint] * <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(draw_scale));
        <span class="tok-fn">drawJointFrame</span>(gl, at, source.rest_orientations[joint], <span class="tok-num">0.05</span>);
    }

    <span class="tok-comment">// -- The ROBOT's rest pose, in Y-up for display --</span>
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot.model.nbody) |body| {
        <span class="tok-kw">const</span> parent: u32 = s.robot.model.body_parent[body];
        <span class="tok-kw">if</span> (parent == <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> child_z: Vec = s.robot_rest_xpos[body];
        <span class="tok-kw">const</span> parent_z: Vec = s.robot_rest_xpos[parent];
        <span class="tok-kw">const</span> from: Vec = <span class="tok-fn">vec</span>(parent_z[<span class="tok-num">0</span>], parent_z[<span class="tok-num">2</span>], -parent_z[<span class="tok-num">1</span>]) + shift;
        <span class="tok-kw">const</span> to: Vec = <span class="tok-fn">vec</span>(child_z[<span class="tok-num">0</span>], child_z[<span class="tok-num">2</span>], -child_z[<span class="tok-num">1</span>]) + shift;
        <span class="tok-fn">drawBoneSegment</span>(gl, from, to, Color{ .r = <span class="tok-num">150</span>, .g = <span class="tok-num">240</span>, .b = <span class="tok-num">140</span>, .a = <span class="tok-num">255</span> }, <span class="tok-num">0.016</span>);
    }
    <span class="tok-comment">// ** THE ROBOT HAS NO TOE. `foot_left`/`foot_right` are LEAF bodies at the ankle and the</span>
    <span class="tok-comment">// foot's shape is a GEOM, not a body - so where Geno draws a foot bone there is nothing on</span>
    <span class="tok-comment">// the robot to match it. **That is the model, not a missing bone**, and the comparison is</span>
    <span class="tok-comment">// honest about it rather than looking broken.</span>
    <span class="tok-kw">if</span> (s.show_robot_geoms) {
        <span class="tok-fn">drawRobotGeoms</span>(
            s,
            gl,
            s.robot_rest_xpos,
            s.robot_rest_xrot,
            shift,
            .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">210</span>, .b = <span class="tok-num">120</span>, .a = <span class="tok-num">255</span> },
        );
    }

    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot.model.nbody) |body| {
        <span class="tok-kw">const</span> p_z: Vec = s.robot_rest_xpos[body];
        <span class="tok-comment">// * `humanoid.xml` declares no body rotations, so every rest frame is IDENTITY - the</span>
        <span class="tok-comment">// triads all point the same way, and seeing that is itself the point: it is why the</span>
        <span class="tok-comment">// robot side needs no local-frame division and the source side does.</span>
        <span class="tok-fn">drawJointFrame</span>(gl, <span class="tok-fn">vec</span>(p_z[<span class="tok-num">0</span>], p_z[<span class="tok-num">2</span>], -p_z[<span class="tok-num">1</span>]) + shift, zm.quat_identity, <span class="tok-num">0.06</span>);
    }
}

<span class="tok-comment">/// Draw a robot's actual GEOMS at the poses in `xpos`/`xrot`.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** THE GEOMS ARE THE ROBOT'S REAL SHAPE --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Capsules drawn between body ORIGINS are a proxy: they show the kinematic tree, not the</span>
<span class="tok-comment">/// figure. **The foot is the clearest case - `foot_left` is a leaf body at the ankle with no</span>
<span class="tok-comment">/// child, so the tree view drew nothing there and it read as "no feet"**, when the foot exists</span>
<span class="tok-comment">/// perfectly well as a geom.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * Each geom sits at `geom_pos`/`geom_rot` in its body's LOCAL frame, so its world placement</span>
<span class="tok-comment">/// is the body's transform composed with that.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawRobotGeoms</span>(
    s: *State,
    gl: *z.WgpuGl,
    xpos: []<span class="tok-kw">const</span> Vec,
    xrot: []<span class="tok-kw">const</span> Quat,
    shift: Vec,
    color: Color,
) void {
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.robot.model.geom_shape.len) |geom| {
        <span class="tok-kw">const</span> body: u32 = s.robot.model.geom_body[geom];
        <span class="tok-kw">if</span> (body &gt;= xpos.len) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> body_position: Vec = xpos[body];
        <span class="tok-kw">const</span> body_rotation: Quat = xrot[body];
        <span class="tok-kw">const</span> local_position: Vec = s.robot.model.geom_pos[geom];
        <span class="tok-kw">const</span> world_z_up: Vec = body_position + zm.<span class="tok-fn">rotate</span>(body_rotation, local_position);
        <span class="tok-kw">const</span> world_rotation: Quat = zm.<span class="tok-fn">qmul</span>(body_rotation, s.robot.model.geom_rot[geom]);

        <span class="tok-comment">// * Z-up to Y-up for display, the same conversion the rest of the view uses.</span>
        <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">vec</span>(world_z_up[<span class="tok-num">0</span>], world_z_up[<span class="tok-num">2</span>], -world_z_up[<span class="tok-num">1</span>]) + shift;

        <span class="tok-kw">switch</span> (s.robot.model.geom_shape[geom]) {
            .sphere =&gt; |sphere| {
                z.<span class="tok-fn">drawSphere</span>(gl, at, .{ .radius = sphere.radius, .rings = <span class="tok-num">6</span>, .slices = <span class="tok-num">8</span>, .color = color });
            },
            <span class="tok-comment">// * Separate arms:  and  are distinct payload types even though</span>
            <span class="tok-comment">// their fields match, so one capture cannot serve both.</span>
            .capsule =&gt; |segment| {
                <span class="tok-kw">const</span> axis_z_up: Vec =
                    zm.<span class="tok-fn">rotate</span>(world_rotation, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, segment.half_height, <span class="tok-num">0</span>));
                <span class="tok-kw">const</span> axis: Vec = <span class="tok-fn">vec</span>(axis_z_up[<span class="tok-num">0</span>], axis_z_up[<span class="tok-num">2</span>], -axis_z_up[<span class="tok-num">1</span>]);
                z.<span class="tok-fn">drawCapsule</span>(gl, at - axis, at + axis, segment.radius, <span class="tok-num">8</span>, <span class="tok-num">4</span>, color);
            },
            .cylinder =&gt; |segment| {
                <span class="tok-comment">// * zimr's capsule runs along LOCAL Y, not MuJoCo's Z - noted in `GeomShape`</span>
                <span class="tok-comment">// and easy to get backwards, which would draw every limb across the body.</span>
                <span class="tok-kw">const</span> axis_z_up: Vec =
                    zm.<span class="tok-fn">rotate</span>(world_rotation, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, segment.half_height, <span class="tok-num">0</span>));
                <span class="tok-kw">const</span> axis: Vec = <span class="tok-fn">vec</span>(axis_z_up[<span class="tok-num">0</span>], axis_z_up[<span class="tok-num">2</span>], -axis_z_up[<span class="tok-num">1</span>]);
                z.<span class="tok-fn">drawCapsule</span>(gl, at - axis, at + axis, segment.radius, <span class="tok-num">8</span>, <span class="tok-num">4</span>, color);
            },
            <span class="tok-kw">else</span> =&gt; {
                <span class="tok-comment">// Boxes and meshes: a sphere at the centre is enough to show it is there.</span>
                z.<span class="tok-fn">drawSphere</span>(gl, at, .{ .radius = <span class="tok-num">0.03</span>, .rings = <span class="tok-num">4</span>, .slices = <span class="tok-num">6</span>, .color = color });
            },
        }
    }
}

<span class="tok-comment">/// A short capsule between two points, skipped when they coincide.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawBoneSegment</span>(
    gl: *z.WgpuGl,
    from: Vec,
    to: Vec,
    color: Color,
    radius: f32,
) void {
    <span class="tok-kw">const</span> bone: Vec = to - from;
    <span class="tok-kw">const</span> length_squared: f32 = bone[<span class="tok-num">0</span>] * bone[<span class="tok-num">0</span>] + bone[<span class="tok-num">1</span>] * bone[<span class="tok-num">1</span>] + bone[<span class="tok-num">2</span>] * bone[<span class="tok-num">2</span>];
    <span class="tok-kw">if</span> (length_squared &lt; <span class="tok-num">1.0e-9</span>) {
        <span class="tok-kw">return</span>;
    }
    z.<span class="tok-fn">drawCapsule</span>(gl, from, to, radius, <span class="tok-num">6</span>, <span class="tok-num">4</span>, color);
}

<span class="tok-comment">/// Three short lines along a joint's own axes: red X, green Y, blue Z.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawJointFrame</span>(gl: *z.WgpuGl, at: Vec, rotation: Quat, size: f32) void {
    <span class="tok-kw">const</span> axes = [<span class="tok-num">3</span>]Vec{ <span class="tok-fn">vec</span>(size, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, size, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, size) };
    <span class="tok-kw">const</span> colors = [<span class="tok-num">3</span>]Color{
        .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">70</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> },
        .{ .r = <span class="tok-num">70</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> },
        .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">140</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> },
    };
    <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (axes, colors) |axis, color| {
        z.<span class="tok-fn">drawLine3D</span>(gl, at, at + zm.<span class="tok-fn">rotate</span>(rotation, axis), color);
    }
}

<span class="tok-comment">/// Draw the robot as capsules between each body and its parent - the same shape the character</span>
<span class="tok-comment">/// skeletons use, so the three are directly comparable.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawRobotCapsules</span>(s: *State, gl: *z.WgpuGl, color: Color, radius: f32) void {
    <span class="tok-comment">// -- *** OVERLAY: DRAW THE ROBOT ON TOP OF THE CHARACTER IT IS FOLLOWING --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Side by side, judging the retarget means mentally aligning two figures a couple of metres</span>
    <span class="tok-comment">// apart - and capsules against a skinned mesh make that harder still. **Overlaid, every</span>
    <span class="tok-comment">// discrepancy is the visible gap between a capsule and the limb it should lie along.**</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * The source character's own root offset is subtracted so the two share an origin; the</span>
    <span class="tok-comment">// toggle keeps the side-by-side view for when the robot alone is what matters.</span>
    <span class="tok-kw">const</span> stand: Vec = <span class="tok-kw">if</span> (s.robot_overlay)
        s.characters[s.robot_source].offset
    <span class="tok-kw">else</span>
        <span class="tok-fn">vec</span>(<span class="tok-num">2.1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-comment">// ** The ROBOT's frames matter most: a foot pitched the wrong way, a head target driven into</span>
    <span class="tok-comment">// the ground and a 90-degree rest convention were all invisible orientation errors on these</span>
    <span class="tok-comment">// bodies. **Drawn in the same Y-up display frame as the capsules**, so the two skeletons'</span>
    <span class="tok-comment">// axes can be compared directly.</span>
    <span class="tok-kw">if</span> (s.show_transforms) {
        <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot.model.nbody) |body| {
            <span class="tok-kw">const</span> z_up: Quat = s.robot_data.body_xrot[body];
            <span class="tok-fn">drawTransformAxes</span>(
                gl,
                s.robot_positions_y_up[body] + stand,
                <span class="tok-comment">// * The robot solves in Z-up and this view is Y-up, the same conversion the</span>
                <span class="tok-comment">// positions get one line below. **An axis drawn in the wrong up-convention would</span>
                <span class="tok-comment">// be a diagnostic that lies**, which is worse than none.</span>
                zm.<span class="tok-fn">qmul</span>(zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), -<span class="tok-num">1.5707963</span>), z_up),
                s.axis_length,
            );
        }
    }

    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot.model.nbody) |body| {
        <span class="tok-kw">const</span> position: Vec = s.robot_positions_y_up[body] + stand;
        <span class="tok-kw">const</span> parent: u32 = s.robot.model.body_parent[body];
        <span class="tok-kw">if</span> (parent == <span class="tok-num">0</span>) {
            z.<span class="tok-fn">drawSphere</span>(gl, position, .{
                .radius = radius * <span class="tok-num">1.6</span>,
                .rings = <span class="tok-num">6</span>,
                .slices = <span class="tok-num">8</span>,
                .color = color,
            });
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> parent_position: Vec = s.robot_positions_y_up[parent] + stand;
        <span class="tok-kw">const</span> bone: Vec = position - parent_position;
        <span class="tok-kw">const</span> length_squared: f32 = bone[<span class="tok-num">0</span>] * bone[<span class="tok-num">0</span>] + bone[<span class="tok-num">1</span>] * bone[<span class="tok-num">1</span>] + bone[<span class="tok-num">2</span>] * bone[<span class="tok-num">2</span>];
        <span class="tok-kw">if</span> (length_squared &lt; <span class="tok-num">1.0e-9</span>) {
            <span class="tok-kw">continue</span>;
        }
        z.<span class="tok-fn">drawCapsule</span>(gl, parent_position, position, radius, <span class="tok-num">8</span>, <span class="tok-num">4</span>, color);
    }
}

<span class="tok-comment">/// Read a T-pose BVH and produce this skeleton's reference orientations from it.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- * WHY THE POSE HAS TO BE FORWARD-KINEMATIC'D --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// A BVH stores LOCAL rotations per joint. The reference a retarget needs is each joint's WORLD</span>
<span class="tok-comment">/// orientation, so the hierarchy has to be walked and rotations accumulated - the same</span>
<span class="tok-comment">/// accumulation the retarget itself does, applied once at load.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * Joints are matched BY NAME rather than by index. The T-pose file and the FBX describe the</span>
<span class="tok-comment">/// same skeleton, but nothing guarantees the two loaders emit them in the same order, and a</span>
<span class="tok-comment">/// silent index mismatch would rotate the wrong joints.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">referenceOrientationsFromTPoseBvh</span>(
    gpa: Allocator,
    tpose_bytes: []<span class="tok-kw">const</span> u8,
    target_clip: d3.BvhSkeletalClip,
    out_reference_orientations: []Quat,
    <span class="tok-comment">/// * World POSITIONS from the same T-pose, matched by name. The twist offsets need bone</span>
    <span class="tok-comment">/// DIRECTIONS, and taking them from the character's `bindPose` instead uses **Geno's</span>
    <span class="tok-comment">/// A-POSE** - the mistake this arc has now made in four separate places.</span>
    out_reference_positions: ?[]Vec,
) !void {
    <span class="tok-kw">var</span> tpose: z.codecs.bvh.Data = <span class="tok-kw">try</span> z.codecs.bvh.<span class="tok-fn">parse</span>(gpa, tpose_bytes, null);
    <span class="tok-kw">defer</span> tpose.<span class="tok-fn">deinit</span>();

    <span class="tok-kw">const</span> pose_joint_count: usize = tpose.joints.len;
    <span class="tok-kw">const</span> target_joint_count: usize = target_clip.<span class="tok-fn">boneCount</span>();

    <span class="tok-comment">// Decode frame 0's rotation channels into local rotations.</span>
    <span class="tok-kw">const</span> pose_local_rotations: []Quat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, pose_joint_count);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pose_local_rotations);
    <span class="tok-kw">const</span> first_frame: []<span class="tok-kw">const</span> f32 = tpose.motion[<span class="tok-num">0</span>..tpose.channel_count];
    <span class="tok-kw">var</span> channel_cursor: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (tpose.joints, <span class="tok-num">0</span>..) |joint, index| {
        <span class="tok-kw">const</span> joint_values: []<span class="tok-kw">const</span> f32 = first_frame[channel_cursor..][<span class="tok-num">0</span>..joint.channels.len];
        channel_cursor += joint.channels.len;
        pose_local_rotations[index] = <span class="tok-fn">quatFromBvhChannels</span>(joint.channels, joint_values);
    }

    <span class="tok-comment">// Accumulate into world positions too, when asked: the same walk, one extra term.</span>
    <span class="tok-kw">const</span> pose_world_positions: []Vec = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, pose_joint_count);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pose_world_positions);

    <span class="tok-comment">// Accumulate into world orientations.</span>
    <span class="tok-kw">const</span> pose_global_rotations: []Quat = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Quat, pose_joint_count);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pose_global_rotations);
    <span class="tok-kw">for</span> (tpose.joints, <span class="tok-num">0</span>..) |joint, index| {
        <span class="tok-kw">const</span> offset: Vec = <span class="tok-fn">vec</span>(joint.offset[<span class="tok-num">0</span>], joint.offset[<span class="tok-num">1</span>], joint.offset[<span class="tok-num">2</span>]);
        <span class="tok-kw">if</span> (joint.parent &lt; <span class="tok-num">0</span>) {
            pose_global_rotations[index] = pose_local_rotations[index];
            pose_world_positions[index] = offset;
        } <span class="tok-kw">else</span> {
            <span class="tok-kw">const</span> parent: usize = <span class="tok-builtin">@intCast</span>(joint.parent);
            pose_global_rotations[index] =
                zm.<span class="tok-fn">qmul</span>(pose_global_rotations[parent], pose_local_rotations[index]);
            <span class="tok-comment">// * ROTATED by the parent's world orientation. Accumulating raw offsets - which is</span>
            <span class="tok-comment">// what the `bindPose` path did - is only correct when every rest rotation is</span>
            <span class="tok-comment">// identity, and Geno's A-pose bind is emphatically not.</span>
            pose_world_positions[index] =
                pose_world_positions[parent] + zm.<span class="tok-fn">rotate</span>(pose_global_rotations[parent], offset);
        }
    }

    <span class="tok-comment">// Match by name, so a joint the T-pose file lacks keeps identity rather than borrowing</span>
    <span class="tok-comment">// whichever joint happens to share its index.</span>
    <span class="tok-kw">const</span> pose_names: [][]<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>([]<span class="tok-kw">const</span> u8, pose_joint_count);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pose_names);
    <span class="tok-kw">for</span> (tpose.joints, <span class="tok-num">0</span>..) |joint, index| {
        pose_names[index] = joint.name;
    }
    <span class="tok-kw">const</span> target_names: [][]<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>([]<span class="tok-kw">const</span> u8, target_joint_count);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(target_names);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..target_joint_count) |joint| {
        target_names[joint] = target_clip.<span class="tok-fn">boneName</span>(joint);
    }
    <span class="tok-kw">const</span> pose_of_target: []i32 =
        <span class="tok-kw">try</span> z.codecs.bvh.<span class="tok-fn">mapJointsByName</span>(gpa, pose_names, target_names, .{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pose_of_target);

    <span class="tok-kw">if</span> (out_reference_positions) |out_positions| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..target_joint_count) |target_joint| {
            <span class="tok-kw">const</span> matched: i32 = pose_of_target[target_joint];
            out_positions[target_joint] = <span class="tok-kw">if</span> (matched &lt; <span class="tok-num">0</span>)
                <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>)
            <span class="tok-kw">else</span>
                pose_world_positions[<span class="tok-builtin">@intCast</span>(matched)];
        }
    }

    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..target_joint_count) |target_joint| {
        <span class="tok-kw">const</span> matched_pose_joint: i32 = pose_of_target[target_joint];
        out_reference_orientations[target_joint] = <span class="tok-kw">if</span> (matched_pose_joint == z.codecs.bvh.no_source)
            zm.quat_identity
        <span class="tok-kw">else</span>
            pose_global_rotations[<span class="tok-builtin">@intCast</span>(matched_pose_joint)];
    }
}

<span class="tok-comment">/// Euler channels to a quaternion, in the order the BVH header declares them.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * BVH applies rotation channels IN THE ORDER LISTED, which for these files is ZYX. Assuming</span>
<span class="tok-comment">/// XYZ bends every joint about the wrong axis first.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">quatFromBvhChannels</span>(channels: []<span class="tok-kw">const</span> z.codecs.bvh.Channel, values: []<span class="tok-kw">const</span> f32) Quat {
    <span class="tok-kw">var</span> rotation: Quat = zm.quat_identity;
    <span class="tok-kw">for</span> (channels, <span class="tok-num">0</span>..) |channel, index| {
        <span class="tok-kw">const</span> angle_radians: f32 = <span class="tok-fn">radFromDeg</span>(values[index]);
        <span class="tok-kw">const</span> axis: ?Vec = <span class="tok-kw">switch</span> (channel) {
            .x_rotation =&gt; <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
            .y_rotation =&gt; <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
            .z_rotation =&gt; <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
            <span class="tok-kw">else</span> =&gt; null,
        };
        <span class="tok-kw">if</span> (axis) |rotation_axis| {
            rotation = zm.<span class="tok-fn">qmul</span>(rotation, zm.<span class="tok-fn">quatFromAxisAngle</span>(rotation_axis, angle_radians));
        }
    }
    <span class="tok-kw">return</span> rotation;
}

<span class="tok-comment">// -- ** `solveArmChain` and `ArmNames` DELETED --</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// A masked, joint-limited two-target solve per limb, run after the pose loop. It was the best of</span>
<span class="tok-comment">// the six mechanisms and it is still a special case of the point cloud: two of its targets are</span>
<span class="tok-comment">// two of the samples, and its mask is unnecessary once nothing runs afterwards to be protected</span>
<span class="tok-comment">// from. **~90 lines, and the seam it lived in is gone with it.**</span>

<span class="tok-kw">fn</span> <span class="tok-fn">boneLength</span>(v: Vec) f32 {
    <span class="tok-kw">return</span> <span class="tok-builtin">@sqrt</span>(v[<span class="tok-num">0</span>] * v[<span class="tok-num">0</span>] + v[<span class="tok-num">1</span>] * v[<span class="tok-num">1</span>] + v[<span class="tok-num">2</span>] * v[<span class="tok-num">2</span>]);
}

<span class="tok-comment">/// The shortest rotation taking `from` onto `to`, both unit vectors.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * Shortest because twist about the resulting axis is unobservable in a direction - picking</span>
<span class="tok-comment">/// the twist-free rotation is the honest default rather than an arbitrary choice.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">shortestArcBetween</span>(from: Vec, to: Vec) Quat {
    <span class="tok-kw">const</span> alignment: f32 = from[<span class="tok-num">0</span>] * to[<span class="tok-num">0</span>] + from[<span class="tok-num">1</span>] * to[<span class="tok-num">1</span>] + from[<span class="tok-num">2</span>] * to[<span class="tok-num">2</span>];
    <span class="tok-kw">if</span> (alignment &gt; <span class="tok-num">0.99999</span>) {
        <span class="tok-kw">return</span> zm.quat_identity;
    }
    <span class="tok-kw">if</span> (alignment &lt; -<span class="tok-num">0.99999</span>) {
        <span class="tok-comment">// Exactly opposed: no unique axis, so any perpendicular will do.</span>
        <span class="tok-kw">const</span> helper: Vec = <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(from[<span class="tok-num">0</span>]) &lt; <span class="tok-num">0.9</span>) <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>) <span class="tok-kw">else</span> <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> axis: Vec = <span class="tok-fn">normalize3</span>(<span class="tok-fn">vec</span>(
            from[<span class="tok-num">1</span>] * helper[<span class="tok-num">2</span>] - from[<span class="tok-num">2</span>] * helper[<span class="tok-num">1</span>],
            from[<span class="tok-num">2</span>] * helper[<span class="tok-num">0</span>] - from[<span class="tok-num">0</span>] * helper[<span class="tok-num">2</span>],
            from[<span class="tok-num">0</span>] * helper[<span class="tok-num">1</span>] - from[<span class="tok-num">1</span>] * helper[<span class="tok-num">0</span>],
        ));
        <span class="tok-kw">return</span> zm.<span class="tok-fn">quatFromAxisAngle</span>(axis, <span class="tok-num">3.14159265</span>);
    }
    <span class="tok-kw">const</span> axis: Vec = <span class="tok-fn">normalize3</span>(<span class="tok-fn">vec</span>(
        from[<span class="tok-num">1</span>] * to[<span class="tok-num">2</span>] - from[<span class="tok-num">2</span>] * to[<span class="tok-num">1</span>],
        from[<span class="tok-num">2</span>] * to[<span class="tok-num">0</span>] - from[<span class="tok-num">0</span>] * to[<span class="tok-num">2</span>],
        from[<span class="tok-num">0</span>] * to[<span class="tok-num">1</span>] - from[<span class="tok-num">1</span>] * to[<span class="tok-num">0</span>],
    ));
    <span class="tok-kw">return</span> zm.<span class="tok-fn">quatFromAxisAngle</span>(axis, <span class="tok-fn">acosRad</span>(<span class="tok-fn">clamp</span>(alignment, -<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>)));
}

<span class="tok-comment">/// The root's height above the floor at rest - the scale reference for root travel.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * HIP HEIGHT, NOT TOTAL HEIGHT. What has to match between two characters is how far the</span>
<span class="tok-comment">/// root moves relative to LEG LENGTH: two figures of equal standing height but different legs</span>
<span class="tok-comment">/// take different strides. See `codecs.bvh.scaleRootPosition`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">rootHeightAtRest</span>(clip: d3.BvhSkeletalClip) f32 {
    <span class="tok-kw">const</span> rest_pose: [*]z.types.Transform = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(clip.skeleton.bindPose <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> <span class="tok-num">1.0</span>));
    <span class="tok-kw">const</span> root_translation: Vec = rest_pose[<span class="tok-num">0</span>].translation;
    <span class="tok-kw">const</span> height: f32 = <span class="tok-builtin">@abs</span>(root_translation[<span class="tok-num">1</span>]);
    <span class="tok-comment">// A skeleton whose root sits at the origin tells us nothing; fall back to a sane figure</span>
    <span class="tok-comment">// rather than dividing by zero later.</span>
    <span class="tok-kw">return</span> <span class="tok-kw">if</span> (height &gt; <span class="tok-num">0.01</span>) height <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
}

<span class="tok-comment">/// Rebuild `source_of_target` for whatever clip currently drives this character.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">refreshRetargetMap</span>(
    gpa: Allocator,
    character: *Character,
    source: *<span class="tok-kw">const</span> Character,
    align_rest_poses: bool,
) !void {
    <span class="tok-kw">const</span> target_joint_count: usize = character.<span class="tok-fn">boneCount</span>();
    <span class="tok-kw">const</span> source_joint_count: usize = source.<span class="tok-fn">boneCount</span>();

    <span class="tok-kw">const</span> target_names: [][]<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>([]<span class="tok-kw">const</span> u8, target_joint_count);
