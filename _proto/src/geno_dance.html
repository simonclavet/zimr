    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(target_names);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..target_joint_count) |joint| {
        target_names[joint] = character.model.clip.<span class="tok-fn">boneName</span>(joint);
    }
    <span class="tok-kw">const</span> source_names: [][]<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>([]<span class="tok-kw">const</span> u8, source_joint_count);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(source_names);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..source_joint_count) |joint| {
        source_names[joint] = source.clip.<span class="tok-fn">boneName</span>(joint);
    }

    <span class="tok-kw">const</span> map: []i32 = <span class="tok-kw">try</span> z.codecs.bvh.<span class="tok-fn">mapJointsByName</span>(gpa, source_names, target_names, .{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(map);
    <span class="tok-builtin">@memcpy</span>(character.source_of_target, map);
    character.mapped_joint_count = z.codecs.bvh.<span class="tok-fn">mappedCount</span>(map);

    <span class="tok-comment">// * The rest correction is a property of the PAIR, so it is rebuilt alongside the map.</span>
    <span class="tok-kw">if</span> (align_rest_poses) {
        z.codecs.bvh.<span class="tok-fn">restAlignmentOffsets</span>(
            character.source_of_target[<span class="tok-num">0</span>..target_joint_count],
            source.rest_orientations[<span class="tok-num">0</span>..source_joint_count],
            character.rest_orientations[<span class="tok-num">0</span>..target_joint_count],
            character.rest_alignment[<span class="tok-num">0</span>..target_joint_count],
        );
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">for</span> (character.rest_alignment[<span class="tok-num">0</span>..target_joint_count]) |*correction| {
            correction.* = zm.quat_identity;
        }
    }
}

<span class="tok-comment">/// Pose a character from ANOTHER character's clip.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- * THREE STEPS, EACH ALREADY VERIFIED ON ITS OWN --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///   1. Sample the SOURCE clip and accumulate its GLOBAL rotations.</span>
<span class="tok-comment">///   2. `retargetRotations` turns those into local rotations on the TARGET's hierarchy. It</span>
<span class="tok-comment">///      works in global space, so a joint the target lacks is absorbed automatically.</span>
<span class="tok-comment">///   3. `bvhForwardKinematicsFromRotations` walks the TARGET's OWN rest offsets, so the motion</span>
<span class="tok-comment">///      lands on the target's proportions rather than the source's.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** STEP 3 MUST NOT USE `bvhForwardKinematics`. That one reads the frame's stored</span>
<span class="tok-comment">/// TRANSLATIONS, which encode the SOURCE's bone lengths - using it here would give the target</span>
<span class="tok-comment">/// the source's skeleton and quietly defeat the retarget.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">poseCharacterRetargeted</span>(
    character: *Character,
    source: *<span class="tok-kw">const</span> Character,
    frame: usize,
) void {
    <span class="tok-kw">const</span> source_joint_count: usize = source.<span class="tok-fn">boneCount</span>();
    <span class="tok-kw">const</span> target_joint_count: usize = character.<span class="tok-fn">boneCount</span>();

    <span class="tok-comment">// Step 1 - the source's pose in world space. Scratch is sized to the largest skeleton in</span>
    <span class="tok-comment">// the scene, so a source with more joints than the target still fits.</span>
    d3.<span class="tok-fn">bvhForwardKinematics</span>(
        source.clip,
        frame,
        character.source_positions[<span class="tok-num">0</span>..source_joint_count],
        character.source_global_rotations[<span class="tok-num">0</span>..source_joint_count],
    );

    <span class="tok-comment">// Step 2 - the source's orientations, expressed on the target's hierarchy.</span>
    z.codecs.bvh.<span class="tok-fn">retargetRotations</span>(
        character.target_parents[<span class="tok-num">0</span>..target_joint_count],
        character.source_of_target[<span class="tok-num">0</span>..target_joint_count],
        character.source_global_rotations[<span class="tok-num">0</span>..source_joint_count],
        character.rest_alignment[<span class="tok-num">0</span>..target_joint_count],
        character.retargeted_local_rotations[<span class="tok-num">0</span>..target_joint_count],
        character.retargeted_global_rotations[<span class="tok-num">0</span>..target_joint_count],
    );

    <span class="tok-comment">// The root travels as far as the source's root did, scaled for the size difference.</span>
    <span class="tok-kw">const</span> source_root_position: Vec = character.source_positions[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> scaled_root_position: Vec = z.codecs.bvh.<span class="tok-fn">scaleRootPosition</span>(
        source_root_position,
        source.hip_height,
        character.hip_height,
    );

    <span class="tok-comment">// Step 3 - the target's own bones, driven by the retargeted rotations.</span>
    d3.<span class="tok-fn">bvhForwardKinematicsFromRotations</span>(
        character.model.clip,
        scaled_root_position,
        character.retargeted_local_rotations[<span class="tok-num">0</span>..target_joint_count],
        character.positions,
        character.rotations,
    );

    <span class="tok-comment">// Skin matrices from the posed skeleton, exactly as the native path does.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..target_joint_count) |joint| {
        <span class="tok-kw">const</span> joint_world: Mat = <span class="tok-fn">mulMat</span>(
            <span class="tok-fn">translationV</span>(character.positions[joint]),
            <span class="tok-fn">matFromQuat</span>(character.rotations[joint]),
        );
        character.skin[joint] = <span class="tok-fn">mulMat</span>(joint_world, character.model.inverse_bind[joint]);
    }
}

<span class="tok-comment">/// One character's world placement.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">placementOf</span>(c: *<span class="tok-kw">const</span> Character) Mat {
    <span class="tok-kw">return</span> <span class="tok-fn">translationV</span>(c.offset);
}

<span class="tok-comment">/// Draw every character through the `lit_shadow` pipeline - which is what makes them RECEIVE</span>
<span class="tok-comment">/// shadows, including their own.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * SELF-SHADOWING IS NOT A SEPARATE FEATURE. The depth map already contains the characters</span>
<span class="tok-comment">/// (they are the casters), and `lit_shadow_fs` shadows any fragment whose light-space depth is</span>
<span class="tok-comment">/// greater than the map's. Drawing the characters with the receiving shader is the whole of</span>
<span class="tok-comment">/// it: an arm now darkens the chest behind it because the arm is nearer the light.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// The cost is that they leave the engine's batch entirely - no more `drawMeshInstanced`, so</span>
<span class="tok-comment">/// `uploadMeshGpu` at init is what puts their vertices on the GPU.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawCharactersLit</span>(
    s: *State,
    f: *z.Frame,
    cam_vp: Mat,
    light_vp: Mat,
    light_dir: Vec,
) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> ps: *z.PassState = gl.pass;
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    Backend.<span class="tok-fn">setPipeline</span>(ps, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.ground_pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">1</span>, s.ground_g1);

    <span class="tok-kw">for</span> (&amp;s.characters, <span class="tok-num">0</span>..) |*c, ci| {
        <span class="tok-kw">const</span> model: Mat = <span class="tok-fn">placementOf</span>(c);
        <span class="tok-kw">const</span> vs: LitVsUbo = .{
            .mvp = <span class="tok-fn">mulMat</span>(cam_vp, model),
            .light_vp = <span class="tok-fn">mulMat</span>(light_vp, model),
            <span class="tok-comment">// Uniform scale plus translation: the rotation block is identity, so the inverse</span>
            <span class="tok-comment">// transpose is too. A non-uniform scale would need the real thing.</span>
            .normal_matrix = zm.<span class="tok-fn">identity</span>(),
        };
        <span class="tok-kw">const</span> fs: LitFsUbo = .{
            .light_dir = -<span class="tok-fn">normalize3</span>(light_dir),
            .base_color = character_albedo,
            .params = .{ s.shadow_bias_slope, s.shadow_bias_min, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        };
        <span class="tok-kw">const</span> vb: [z.shader.<span class="tok-fn">wireSizeOf</span>(LitVsUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(LitVsUbo, &amp;vs);
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.char_vs_ubos[ci], <span class="tok-num">0</span>, &amp;vb);
        <span class="tok-kw">const</span> fb: [z.shader.<span class="tok-fn">wireSizeOf</span>(LitFsUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(LitFsUbo, &amp;fs);
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.char_fs_ubos[ci], <span class="tok-num">0</span>, &amp;fb);
        Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">0</span>, s.char_g0[ci]);
        Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">2</span>, s.char_g2[ci]);

        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-builtin">@intCast</span>(c.model.model.meshCount)) |m| {
            <span class="tok-kw">const</span> buf: z.MeshGpu = z.<span class="tok-fn">meshGpuBuffers</span>(gl, c.model.model.meshes[m]) <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
            <span class="tok-fn">drawIndexedBuffers</span>(ps, buf);
        }
    }
}

<span class="tok-comment">/// Bind one mesh's buffers and issue its indexed draw - the tail every custom pass repeats.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawIndexedBuffers</span>(ps: *z.PassState, buf: z.MeshGpu) void {
    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(ps.pass, .{
        .slot = <span class="tok-num">0</span>,
        .buffer = buf.vbo,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-num">0</span>,
    });
    z.render_pass.<span class="tok-fn">setIndexBuffer</span>(ps.pass, .{
        .buffer = buf.ibo,
        .format = .uint16,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-num">0</span>,
    });
    z.render_pass.<span class="tok-fn">drawIndexed</span>(ps.pass, .{
        .index_count = buf.index_count,
        .instance_count = <span class="tok-num">1</span>,
        .first_index = <span class="tok-num">0</span>,
        .base_vertex = <span class="tok-num">0</span>,
        .first_instance = <span class="tok-num">0</span>,
    });
}

<span class="tok-comment">/// The full scene as the camera sees it: receivers, casters, and the optional bone gizmos.</span>
<span class="tok-comment">/// Render the casters' DEPTH from the light, into the shadow map.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * `beginTextureModeRaw`, NOT `beginTextureMode`. The plain version binds the engine's 2D</span>
<span class="tok-comment">/// (rgba8) pipeline into the pass; this target is the depth pipeline's format, and mixing them</span>
<span class="tok-comment">/// is an attachment mismatch. The raw pair opens the offscreen pass and batches nothing.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * CLEARED TO WHITE = "nothing here, infinitely far". Clearing to black would mean every</span>
<span class="tok-comment">/// untouched texel reads as depth 0 - nearer than anything - and would shadow the entire</span>
<span class="tok-comment">/// frustum. That inversion is exactly what the earlier white-on-black MASK produced.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawLightDepth</span>(s: *State, f: *z.Frame, light_vp: Mat) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    z.<span class="tok-fn">beginTextureModeRaw</span>(gl, s.light_view, .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> ps: *z.PassState = gl.pass;
    ps.queue = f.gpu.queue;
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    Backend.<span class="tok-fn">setPipeline</span>(ps, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.depth_pipeline });

    <span class="tok-kw">for</span> (&amp;s.characters, <span class="tok-num">0</span>..) |*c, ci| {
        <span class="tok-kw">const</span> model: Mat = <span class="tok-fn">placementOf</span>(c);
        <span class="tok-kw">const</span> ubo: DepthUbo = .{
            .mvp = <span class="tok-fn">mulMat</span>(light_vp, model),
            .params = .{ light_near, light_far, <span class="tok-num">0</span>, <span class="tok-num">1</span> },
            <span class="tok-comment">// 0 = raw NDC depth, the form `lit_shadow_fs` compares against.</span>
            .mode = <span class="tok-num">0</span>,
        };
        <span class="tok-kw">const</span> bytes: [z.shader.<span class="tok-fn">wireSizeOf</span>(DepthUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(DepthUbo, &amp;ubo);
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.depth_ubos[ci], <span class="tok-num">0</span>, &amp;bytes);
        Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">0</span>, s.depth_bgs[ci]);

        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-builtin">@intCast</span>(c.model.model.meshCount)) |m| {
            <span class="tok-comment">// * THE SAME VBOs THE CAMERA PASS DRAWS. `meshGpuBuffers` exists for exactly this:</span>
            <span class="tok-comment">// one upload per frame, read by both passes.</span>
            <span class="tok-kw">const</span> gpu_buf: z.MeshGpu = z.<span class="tok-fn">meshGpuBuffers</span>(gl, c.model.model.meshes[m]) <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
            z.render_pass.<span class="tok-fn">setVertexBuffer</span>(ps.pass, .{
                .slot = <span class="tok-num">0</span>,
                .buffer = gpu_buf.vbo,
                .offset = <span class="tok-num">0</span>,
                .size = <span class="tok-num">0</span>,
            });
            z.render_pass.<span class="tok-fn">setIndexBuffer</span>(ps.pass, .{
                .buffer = gpu_buf.ibo,
                .format = .uint16,
                .offset = <span class="tok-num">0</span>,
                .size = <span class="tok-num">0</span>,
            });
            z.render_pass.<span class="tok-fn">drawIndexed</span>(ps.pass, .{
                .index_count = gpu_buf.index_count,
                .instance_count = <span class="tok-num">1</span>,
                .first_index = <span class="tok-num">0</span>,
                .base_vertex = <span class="tok-num">0</span>,
                .first_instance = <span class="tok-num">0</span>,
            });
        }
    }
    z.<span class="tok-fn">endTextureModeRaw</span>(gl);
}

<span class="tok-comment">/// Fill the G-buffer: world position, world normal and albedo, in ONE geometry walk.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THE INPUT SSAO NEEDS. `ssao_fs` reads positions and normals from here; without this pass</span>
<span class="tok-comment">/// there is nothing for it to occlude against. Everything drawn must appear - a caster missing</span>
<span class="tok-comment">/// from the G-buffer casts no ambient occlusion, exactly as a caster missing from the shadow</span>
<span class="tok-comment">/// map casts no shadow.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawGbuffer</span>(s: *State, f: *z.Frame, cam_vp: Mat) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> rts = [_]z.RenderTexture{ s.gbuf_pos, s.gbuf_normal, s.gbuf_albedo };
    <span class="tok-comment">// * CLEARED TO ZERO ALPHA. `ssao_fs` reads alpha as its COVERAGE flag: a pixel the</span>
    <span class="tok-comment">// geometry never touched has a meaningless position, and treating it as a real surface</span>
    <span class="tok-comment">// would let the background occlude the scene.</span>
    z.<span class="tok-fn">beginTextureModeMrtRaw</span>(gl, &amp;rts, .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">0</span> });
    <span class="tok-kw">const</span> ps: *z.PassState = gl.pass;
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    Backend.<span class="tok-fn">setPipeline</span>(ps, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.gbuf_pipeline });

    <span class="tok-comment">// Slot 0/1 are the characters; slot 2 is the ground.</span>
    <span class="tok-kw">for</span> (&amp;s.characters, <span class="tok-num">0</span>..) |*c, ci| {
        <span class="tok-kw">const</span> model: Mat = <span class="tok-fn">placementOf</span>(c);
        <span class="tok-fn">writeGbufUbos</span>(s, f, ci, cam_vp, model, character_albedo);
        Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">0</span>, s.gbuf_g0[ci]);
        Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">2</span>, s.gbuf_g2[ci]);
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-builtin">@intCast</span>(c.model.model.meshCount)) |m| {
            <span class="tok-kw">const</span> buf: z.MeshGpu = z.<span class="tok-fn">meshGpuBuffers</span>(gl, c.model.model.meshes[m]) <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
            <span class="tok-fn">drawIndexedBuffers</span>(ps, buf);
        }
    }

    <span class="tok-fn">writeGbufUbos</span>(s, f, <span class="tok-num">2</span>, cam_vp, zm.<span class="tok-fn">identity</span>(), ground_albedo);
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">0</span>, s.gbuf_g0[<span class="tok-num">2</span>]);
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">2</span>, s.gbuf_g2[<span class="tok-num">2</span>]);
    <span class="tok-fn">drawIndexedBuffers</span>(ps, .{
        .vbo = s.ground_vbo,
        .ibo = s.ground_ibo,
        .index_count = s.ground_index_count,
    });

    z.<span class="tok-fn">endTextureModeRaw</span>(gl);
}

<span class="tok-comment">/// Upload one drawable's G-buffer uniforms.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">writeGbufUbos</span>(
    s: *State,
    f: *z.Frame,
    slot: usize,
    cam_vp: Mat,
    model: Mat,
    albedo: Vec,
) void {
    <span class="tok-kw">const</span> vs: GbufVsUbo = .{
        .mvp = <span class="tok-fn">mulMat</span>(cam_vp, model),
        .model = model,
        <span class="tok-comment">// Uniform scale plus translation, so the inverse transpose is the model matrix itself.</span>
        .normal_matrix = model,
    };
    <span class="tok-kw">const</span> fs: GbufFsUbo = .{ .albedo_spec = albedo };
    <span class="tok-kw">const</span> vb: [z.shader.<span class="tok-fn">wireSizeOf</span>(GbufVsUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(GbufVsUbo, &amp;vs);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.gbuf_vs_ubos[slot], <span class="tok-num">0</span>, &amp;vb);
    <span class="tok-kw">const</span> fb: [z.shader.<span class="tok-fn">wireSizeOf</span>(GbufFsUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(GbufFsUbo, &amp;fs);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.gbuf_fs_ubos[slot], <span class="tok-num">0</span>, &amp;fb);
}

<span class="tok-comment">/// Draw the ground through the `lit_shadow` pipeline, sampling the light pass.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THIS BINDS A FOREIGN PIPELINE INTO THE SCREEN PASS, so the 2D pipeline must be restored</span>
<span class="tok-comment">/// afterwards or the UI draws with the wrong one - the same hazard `renderer_2d.bindForPass`</span>
<span class="tok-comment">/// exists to fix, and the one that produced a black canvas during the wgpu bringup.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawShadowedGround</span>(
    s: *State,
    f: *z.Frame,
    cam_vp: Mat,
    light_vp: Mat,
    light_dir: Vec,
) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> ps: *z.PassState = gl.pass;

    <span class="tok-comment">// The plane sits at the origin with an identity model matrix, so mvp is just the camera's</span>
    <span class="tok-comment">// view-projection and the normal matrix is the identity.</span>
    <span class="tok-kw">const</span> vs: LitVsUbo = .{
        .mvp = cam_vp,
        .light_vp = light_vp,
        .normal_matrix = zm.<span class="tok-fn">identity</span>(),
    };
    <span class="tok-kw">const</span> fs: LitFsUbo = .{
        <span class="tok-comment">// `light_dir` is the direction TO the light, for the Lambert dot.</span>
        .light_dir = -<span class="tok-fn">normalize3</span>(light_dir),
        .base_color = ground_albedo,
        .params = .{ s.shadow_bias_slope, s.shadow_bias_min, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    <span class="tok-kw">const</span> vs_bytes: [z.shader.<span class="tok-fn">wireSizeOf</span>(LitVsUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(LitVsUbo, &amp;vs);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.ground_vs_ubo, <span class="tok-num">0</span>, &amp;vs_bytes);
    <span class="tok-kw">const</span> fs_bytes: [z.shader.<span class="tok-fn">wireSizeOf</span>(LitFsUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(LitFsUbo, &amp;fs);
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.ground_fs_ubo, <span class="tok-num">0</span>, &amp;fs_bytes);

    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    Backend.<span class="tok-fn">setPipeline</span>(ps, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.ground_pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">0</span>, s.ground_g0);
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">1</span>, s.ground_g1);
    Backend.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">2</span>, s.ground_g2);
    <span class="tok-fn">drawIndexedBuffers</span>(ps, .{
        .vbo = s.ground_vbo,
        .ibo = s.ground_ibo,
        .index_count = s.ground_index_count,
    });
}

<span class="tok-comment">/// Draw a body's local frame as three coloured axes: X red, Y green, Z blue.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** THE CONVENTION IS THE POINT --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Half this project's hardest bugs were frames disagreeing invisibly: a foot pitched the wrong</span>
<span class="tok-comment">/// way, a head target 1.5 m into the ground, a scale anchored on the wrong bone, a capture whose</span>
<span class="tok-comment">/// rest orientations differ from the robot's by a constant 90 degrees. **Every one was a</span>
<span class="tok-comment">/// quantity nobody could see.** Three axes per body make orientation a thing you look at rather</span>
<span class="tok-comment">/// than infer from a residual.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * Red/green/blue for X/Y/Z is the near-universal convention; keeping it means the picture</span>
<span class="tok-comment">/// needs no legend.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawTransformAxes</span>(gl: *z.WgpuGl, origin: Vec, rotation: Quat, length: f32) void {
    <span class="tok-kw">const</span> axes = [_]<span class="tok-kw">struct</span> { dir: Vec, color: Color }{
        .{ .dir = <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">70</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> } },
        .{ .dir = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>), .color = .{ .r = <span class="tok-num">80</span>, .g = <span class="tok-num">220</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> } },
        .{ .dir = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>), .color = .{ .r = <span class="tok-num">80</span>, .g = <span class="tok-num">140</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> } },
    };
    <span class="tok-kw">for</span> (axes) |axis| {
        <span class="tok-kw">const</span> tip: Vec = origin + zm.<span class="tok-fn">rotate</span>(rotation, axis.dir * <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(length)));
        z.<span class="tok-fn">drawLine3D</span>(gl, origin, tip, axis.color);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawScene</span>(s: *State, gl: *z.WgpuGl) void {
    <span class="tok-comment">// -- *** DRAW AND POSE MUST AGREE ABOUT WHETHER THE ROBOT EXISTS --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `poseRobot` is gated on `show_robot`; this draw was not. **So with `show_robot` false the</span>
    <span class="tok-comment">// robot was never posed and still drawn** - every body at its zeroed position, which piles</span>
    <span class="tok-comment">// the geoms into a ball at the origin and looks exactly like a solver that has collapsed.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// *** The comment that used to sit here explained why drawing is not gated on</span>
    <span class="tok-comment">// `show_skeleton` - a different flag, and correct. **It was read as covering `show_robot`</span>
    <span class="tok-comment">// too**, which it never did, and that gap survived a dozen turns because a ball at the</span>
    <span class="tok-comment">// origin is a plausible-looking failure of something else entirely.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * Now: no pose, no draw.</span>
    <span class="tok-kw">if</span> (!s.show_robot) {
        <span class="tok-kw">return</span>;
    }

    <span class="tok-comment">// * The ROBOT draws whether or not the SKELETON view is on: it has no mesh, so capsules are</span>
    <span class="tok-comment">// all it has. Returning early on `show_skeleton` would hide it entirely.</span>
    <span class="tok-fn">drawRobot</span>(s, gl);

    <span class="tok-kw">if</span> (!s.show_skeleton) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> bone_colors = [_]Color{
        .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> },
        .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">180</span>, .b = <span class="tok-num">110</span>, .a = <span class="tok-num">255</span> },
    };
    <span class="tok-comment">// * Axes for every character joint, in the same world the capsules are drawn in.</span>
    <span class="tok-kw">if</span> (s.show_transforms) {
        <span class="tok-kw">for</span> (&amp;s.characters) |*c| {
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..c.<span class="tok-fn">boneCount</span>()) |joint| {
                <span class="tok-fn">drawTransformAxes</span>(
                    gl,
                    c.positions[joint] + c.offset,
                    c.rotations[joint],
                    s.axis_length,
                );
            }
        }
    }

    <span class="tok-kw">for</span> (&amp;s.characters, <span class="tok-num">0</span>..) |*c, ci| {
        <span class="tok-fn">drawSkeletonCapsules</span>(c, gl, bone_colors[ci % bone_colors.len], s.capsule_radius);
    }
}

<span class="tok-comment">/// The robot, as capsules.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawRobot</span>(s: *State, gl: *z.WgpuGl) void {
    <span class="tok-kw">if</span> (!s.show_robot) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.show_tpose_compare) {
        <span class="tok-comment">// ** THE COMPARISON NEEDS THE ROBOT'S MAP AND SOLVED T-POSE, which only exist once the</span>
        <span class="tok-comment">// robot is enabled. **The first version drew nothing at all** when the robot checkbox</span>
        <span class="tok-comment">// was off - a blank result that reads as "the robot has no T-pose" rather than "this</span>
        <span class="tok-comment">// view has no data".</span>
        <span class="tok-fn">drawTposeComparison</span>(s, gl);
    } <span class="tok-kw">else</span> {
        <span class="tok-kw">if</span> (s.show_robot_geoms) {
            <span class="tok-comment">// * The robot's real shape, not a tree of body origins - which is what makes an</span>
            <span class="tok-comment">// overlay against the character's mesh a fair comparison rather than a suggestive one.</span>
            <span class="tok-fn">drawRobotGeoms</span>(
                s,
                gl,
                s.robot_data.body_xpos[<span class="tok-num">0</span>..s.robot.model.nbody],
                s.robot_data.body_xrot[<span class="tok-num">0</span>..s.robot.model.nbody],
                <span class="tok-comment">// * The same placement `drawRobotCapsules` uses, so the two views agree.</span>
                <span class="tok-kw">if</span> (s.robot_overlay) s.characters[s.robot_source].offset <span class="tok-kw">else</span> <span class="tok-fn">vec</span>(<span class="tok-num">2.1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
                .{ .r = <span class="tok-num">180</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">160</span>, .a = <span class="tok-num">255</span> },
            );
        } <span class="tok-kw">else</span> {
            <span class="tok-fn">drawRobotCapsules</span>(
                s,
                gl,
                .{ .r = <span class="tok-num">180</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">160</span>, .a = <span class="tok-num">255</span> },
                s.capsule_radius * <span class="tok-num">2.2</span>,
            );
        }
    }
}

<span class="tok-comment">/// Draw a skeleton as CAPSULES - one per bone, from the joint to its parent.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * This is how BVHView and GenoView present a rig, and it reads far better than spheres and</span>
<span class="tok-comment">/// lines: a capsule has THICKNESS, so it occludes correctly against the mesh and against other</span>
<span class="tok-comment">/// bones, and its silhouette shows a limb's direction at a glance. `drawCapsule` already</span>
<span class="tok-comment">/// exists (`wgpu_app.drawCapsule`, raylib parity) - cylinder body plus two spherical caps.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * ROOT AND END SITES ARE DRAWN AS BARE SPHERES. A capsule needs two endpoints; the root has</span>
<span class="tok-comment">/// no parent, and an end site's "bone" is the synthetic stub section 7 adds to give a leaf a</span>
<span class="tok-comment">/// direction. Drawing those as spheres keeps every joint visible without inventing geometry</span>
<span class="tok-comment">/// the skeleton does not have.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Kept as GEOMETRY, deliberately: section 7a's analytical capsule shadows and AO are a different</span>
<span class="tok-comment">/// lighting model, and mixing them into the deferred pipeline of section 12 would mean maintaining</span>
<span class="tok-comment">/// two.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawSkeletonCapsules</span>(c: *Character, gl: *z.WgpuGl, color: Color, radius: f32) void {
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..c.<span class="tok-fn">boneCount</span>()) |j| {
        <span class="tok-kw">const</span> p: Vec = c.positions[j] + c.offset;
        <span class="tok-kw">const</span> parent: i32 = c.clip.skeleton.bones[j].parent;
        <span class="tok-kw">if</span> (parent &lt; <span class="tok-num">0</span>) {
            z.<span class="tok-fn">drawSphere</span>(gl, p, .{ .radius = radius * <span class="tok-num">1.6</span>, .rings = <span class="tok-num">6</span>, .slices = <span class="tok-num">8</span>, .color = color });
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> pp: Vec = c.positions[<span class="tok-builtin">@intCast</span>(parent)] + c.offset;
        <span class="tok-kw">const</span> d: Vec = p - pp;
        <span class="tok-comment">// A zero-length bone would make `drawCapsule` build a degenerate cylinder; end sites</span>
        <span class="tok-comment">// and coincident joints both produce them.</span>
        <span class="tok-kw">if</span> (d[<span class="tok-num">0</span>] * d[<span class="tok-num">0</span>] + d[<span class="tok-num">1</span>] * d[<span class="tok-num">1</span>] + d[<span class="tok-num">2</span>] * d[<span class="tok-num">2</span>] &lt; <span class="tok-num">1.0e-9</span>) {
            z.<span class="tok-fn">drawSphere</span>(gl, p, .{ .radius = radius, .rings = <span class="tok-num">6</span>, .slices = <span class="tok-num">8</span>, .color = color });
            <span class="tok-kw">continue</span>;
        }
        z.<span class="tok-fn">drawCapsule</span>(gl, pp, p, radius, <span class="tok-num">8</span>, <span class="tok-num">4</span>, color);
    }
}

<span class="tok-comment">/// The control panel, split into TABS.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * It had grown to 651 px of content in a 250 px window - the UI lint said so on device, and</span>
<span class="tok-comment">/// every slider needed scrolling to reach. Four tabs put each concern on one screen and let the</span>
<span class="tok-comment">/// window sit small again, which matters on a phone where the panel competes with the scene for</span>
<span class="tok-comment">/// the same pixels.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(s: *State, u: ui.Ui, longest: f32) void {
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"geno + mocap"</span>, .{
        .initial_pos = .{ <span class="tok-num">12</span>, <span class="tok-num">12</span> },
        .initial_size = .{ <span class="tok-num">340</span>, <span class="tok-num">268</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        <span class="tok-comment">// Playback lives ABOVE the tabs: it is the one control wanted from every tab.</span>
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"play"</span>, &amp;s.playing);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"mesh"</span>, &amp;s.show_mesh);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"skeleton"</span>, &amp;s.show_skeleton);
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-comment">// * Next to the skeleton toggle because it is the same kind of thing: a view of the</span>
        <span class="tok-comment">// structure rather than the surface.</span>
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"transforms"</span>, &amp;s.show_transforms);
        <span class="tok-kw">if</span> (s.show_transforms) {
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"axis length"</span>, &amp;s.axis_length, .{ .min = <span class="tok-num">0.01</span>, .max = <span class="tok-num">0.4</span>, .fmt = <span class="tok-str">"{d:.2}m"</span> });
        }
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"time"</span>, &amp;s.play_time, .{ .min = <span class="tok-num">0</span>, .max = longest, .fmt = <span class="tok-str">"{d:.2}s"</span> });

        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabBar</span>(<span class="tok-str">"panel"</span>, .{})) {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">endTabBar</span>();

            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Motion"</span>, null, .{})) {
                <span class="tok-fn">tabMotion</span>(s, u);
                u.<span class="tok-fn">endTabItem</span>();
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Light"</span>, null, .{})) {
                <span class="tok-fn">tabLight</span>(s, u);
                u.<span class="tok-fn">endTabItem</span>();
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"AO"</span>, null, .{})) {
                <span class="tok-fn">tabAmbientOcclusion</span>(s, u);
                u.<span class="tok-fn">endTabItem</span>();
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Debug"</span>, null, .{})) {
                <span class="tok-fn">tabDebug</span>(s, u);
                u.<span class="tok-fn">endTabItem</span>();
            }
        }
    }
}

<span class="tok-comment">/// Who plays whose clip, and how the two rigs are aligned.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">tabMotion</span>(s: *State, u: ui.Ui) void {
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.characters.len) |character_index| {
        <span class="tok-kw">const</span> character: *Character = &amp;s.characters[character_index];
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s} plays:"</span>, .{character.label});

        <span class="tok-comment">// ** EVERY ROW NEEDS ITS OWN ID SCOPE. A widget's identity comes from its LABEL, and</span>
        <span class="tok-comment">// both rows offer the same two character names - without this they share one radio</span>
        <span class="tok-comment">// group and selecting a source for one moves the other's.</span>
        u.<span class="tok-fn">pushIdInt</span>(<span class="tok-builtin">@intCast</span>(character_index));
        <span class="tok-kw">defer</span> u.<span class="tok-fn">popId</span>();

        <span class="tok-kw">var</span> chosen_source: i32 = <span class="tok-builtin">@intCast</span>(character.source_character);
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.characters.len) |candidate_index| {
            <span class="tok-kw">if</span> (u.<span class="tok-fn">radioButton</span>(
                s.characters[candidate_index].label,
                &amp;chosen_source,
                <span class="tok-builtin">@intCast</span>(candidate_index),
            )) {
                character.source_character = <span class="tok-builtin">@intCast</span>(chosen_source);
                s.retarget_dirty = true;
            }
            <span class="tok-kw">if</span> (candidate_index + <span class="tok-num">1</span> &lt; s.characters.len) {
                u.<span class="tok-fn">sameLine</span>(.{});
            }
        }
        <span class="tok-kw">const</span> is_retargeting: bool = character.source_character != character_index;
        <span class="tok-kw">if</span> (is_retargeting) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  mapped {d}/{d} joints"</span>, .{
                character.mapped_joint_count,
                character.<span class="tok-fn">boneCount</span>(),
            });
        }
    }
    u.<span class="tok-fn">separator</span>();
    <span class="tok-kw">if</span> (u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"align rest poses"</span>, &amp;s.align_rest)) {
        s.retarget_dirty = true;
    }

    <span class="tok-comment">// -- * THE ROBOT --</span>
    <span class="tok-comment">// * The label names the file actually embedded. It said `humanoid.xml` for several turns</span>
    <span class="tok-comment">// after the example switched to the flex model - **a UI that lies about which model it is</span>
    <span class="tok-comment">// showing makes every screenshot ambiguous.**</span>
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"robot (humanoid_flex2.xml)"</span>, &amp;s.show_robot);
    <span class="tok-comment">// -- *** A CONTROL THAT CANNOT WORK IS WORSE THAN NO CONTROL --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The model is parsed in `initRobot`, which runs ONCE. Marking `robot_dirty` refreshes the</span>
    <span class="tok-comment">// MAPPING, not the model - so a checkbox here would have looked live and done nothing, and</span>
    <span class="tok-comment">// a screenshot taken after clicking it would have shown flex2 while claiming stock.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// ** **That is the same class as the label that read `humanoid.xml` while embedding</span>
    <span class="tok-comment">// flex2**, and worse: a stale label misleads once, a dead control misleads every time it is</span>
    <span class="tok-comment">// used. Reloading the robot mid-session means rebuilding the model, data, tasks, scratch,</span>
    <span class="tok-comment">// samples and rest pose - real work, not a checkbox.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * Until then the swap is a one-line edit at `initRobot`, and the comment there says so.</span>
    <span class="tok-kw">if</span> (s.show_robot) {
        <span class="tok-comment">// -- *** SAY WHICH CLIP DRIVES THE ROBOT, NOT "robot plays" --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The panel had three separate "X plays:" groups - one per character and one for the</span>
        <span class="tok-comment">// robot - with the same two clip names in each. **Three identical-looking radio pairs,</span>
        <span class="tok-comment">// and nothing said which one moved the blue figure.** "does not follow the dance when I</span>
        <span class="tok-comment">// ask it to" is what that ambiguity looks like from outside.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * The heading now names the thing being driven and the row shows the current choice,</span>
        <span class="tok-comment">// so the answer is readable without experimenting.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"ROBOT is driven by:"</span>, .{});
        <span class="tok-comment">// ** DISTINCT LABELS, not just a distinct ID SCOPE. These rows offered the very same</span>
        <span class="tok-comment">// two character names as the rows above, and relying on `pushIdInt` alone to keep them</span>
        <span class="tok-comment">// apart left the robot's selection unreachable. A label that differs is not something a</span>
        <span class="tok-comment">// later edit can accidentally undo - an id scope is.</span>
        <span class="tok-comment">// * Prefixed so they cannot be confused with the character rows above, which offer the</span>
        <span class="tok-comment">// same two clips for a different purpose.</span>
        <span class="tok-comment">// * ASCII only: the UI font has no glyph for "-&gt;" and rendered it as "?", which made the</span>
        <span class="tok-comment">// labels read as questions. **A label that renders wrong is worse than a plain one.**</span>
        <span class="tok-kw">const</span> robot_choice_labels = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"use Geno dance1"</span>, <span class="tok-str">"use Mixamo drop kick"</span> };
        <span class="tok-kw">var</span> robot_choice: i32 = <span class="tok-builtin">@intCast</span>(s.robot_source);
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.characters.len) |candidate_index| {
            <span class="tok-kw">if</span> (u.<span class="tok-fn">radioButton</span>(
                robot_choice_labels[candidate_index % robot_choice_labels.len],
                &amp;robot_choice,
                <span class="tok-builtin">@intCast</span>(candidate_index),
            )) {
                s.robot_source = <span class="tok-builtin">@intCast</span>(robot_choice);
                s.robot_dirty = true;
            }
            <span class="tok-kw">if</span> (candidate_index + <span class="tok-num">1</span> &lt; s.characters.len) {
                u.<span class="tok-fn">sameLine</span>(.{});
            }
        }
        <span class="tok-comment">// * THE HONEST QUALITY NUMBER, ON SCREEN. A 16-body robot cannot express what 96 human</span>
        <span class="tok-comment">// joints do, and its one-hinge knee cannot follow a human knee's twist. Showing the</span>
        <span class="tok-comment">// mean unrepresentable angle keeps a MODEL LIMIT from reading as a bug.</span>
        <span class="tok-comment">// * THE IK STAGE IS TOGGLEABLE, and off is the A/B that says whether the position</span>
        <span class="tok-comment">// targets are helping rather than assuming they must. Radio buttons rather than a</span>
        <span class="tok-comment">// slider because the interesting question is "none / a few / many", not a fine dial.</span>
        <span class="tok-comment">// * IK stays: it is the one control that still changes the answer, and OFF is the A/B</span>
        <span class="tok-comment">// that shows what the solver contributes - measured, the knee goes 61.6 -&gt; 10.2 deg.</span>
        <span class="tok-comment">// * The overlay is the instrument: a capsule that does not lie along its limb is the</span>
        <span class="tok-comment">// error, directly, with no mental alignment in between.</span>
        <span class="tok-kw">if</span> (u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"T-pose compare"</span>, &amp;s.show_tpose_compare)) {
            <span class="tok-comment">// * Turning the view on enables the robot and forces a rebuild, so it cannot show</span>
            <span class="tok-comment">// an empty scene because of state it silently depends on.</span>
            <span class="tok-kw">if</span> (s.show_tpose_compare) {
                s.show_robot = true;
                s.robot_dirty = true;
            }
        }
        <span class="tok-kw">if</span> (s.show_tpose_compare) {
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"offset"</span>, &amp;s.tpose_offset, .{
                .min = -<span class="tok-num">0.5</span>,
                .max = <span class="tok-num">2.0</span>,
                .fmt = <span class="tok-str">"{d:.2}"</span>,
            });
            <span class="tok-kw">if</span> (s.robot_ready) {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"  orange=geno  green=robot  RGB=XYZ axes"</span>, .{});
                <span class="tok-comment">// * Explaining a real difference beats letting it read as a defect.</span>
                u.<span class="tok-fn">text</span>(<span class="tok-str">"  robot has no toe: its foot is a leaf at the ankle"</span>, .{});
            } <span class="tok-kw">else</span> {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"  building robot rest pose..."</span>, .{});
            }
        }
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"robot geoms (real shape)"</span>, &amp;s.show_robot_geoms);
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"overlay on character"</span>, &amp;s.robot_overlay);
        <span class="tok-kw">if</span> (s.robot_overlay <span class="tok-kw">and</span> s.show_mesh) {
            <span class="tok-comment">// * An opaque mesh hides the capsules inside it, so the overlay reads as nothing at</span>
            <span class="tok-comment">// all. Saying so beats letting someone conclude the robot vanished.</span>
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  (turn OFF mesh to see it)"</span>, .{});
        }
        <span class="tok-comment">// * The shape/place dial, next to the fit readout that judges it.</span>
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"target pull"</span>, &amp;s.robot_position_pull, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">1</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"ik refine:"</span>, .{});
        _ = u.<span class="tok-fn">radioButton</span>(<span class="tok-str">"off"</span>, &amp;s.robot_ik_iterations, <span class="tok-num">0</span>);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">radioButton</span>(<span class="tok-str">"on"</span>, &amp;s.robot_ik_iterations, <span class="tok-num">20</span>);
        <span class="tok-comment">// * Now the SOLVER's residual - how far the robot ended from the targets it was</span>
        <span class="tok-comment">// given - rather than a per-joint rotation shortfall.</span>
        <span class="tok-kw">if</span> (s.robot_mean_residual &lt; <span class="tok-num">0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  ik error --  (solver idle)"</span>, .{});
        } <span class="tok-kw">else</span> {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  ik error {d:.3}"</span>, .{s.robot_mean_residual});
        }

        <span class="tok-comment">// -- *** THE MEASUREMENTS, ON DEVICE --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Every metric in this project lives in the harness, on Geno. **The drop kick exists</span>
        <span class="tok-comment">// only here**, so every diagnosis this session went: screenshot -&gt; guess -&gt; measure</span>
        <span class="tok-comment">// something else in a different program. Six silent failures were found that way, each</span>
        <span class="tok-comment">// costing turns.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// *** These three answer the questions that actually went wrong:</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">//     bodies   an unmapped table hides the robot and looks like a render bug</span>
        <span class="tok-comment">//     samples  a stale cache retargets to the WRONG BONES with no error at all</span>
        <span class="tok-comment">//     visual   mean and WORST world offset - the 10 cm no angle metric could see</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * Cheap: they are read from state the solve already computed.</span>
        <span class="tok-comment">// ** The fit against the clip the robot is ACTUALLY driven by. A large number here with</span>
        <span class="tok-comment">// a plausible-looking figure on screen means the robot is tracking something else.</span>
        <span class="tok-comment">// *** THE SCALE, ON SCREEN. It is a DIVISOR applied to every target, so a wrong one</span>
        <span class="tok-comment">// does not degrade the robot - it collapses it. **Two turns were spent on a ball at the</span>
        <span class="tok-comment">// origin that this one number would have named immediately**, because a scale is not</span>
        <span class="tok-comment">// something a picture shows: a robot 10x too small and a robot at the wrong place look</span>
        <span class="tok-comment">// the same from outside.</span>
        <span class="tok-comment">// -- *** WHERE THE BONES ACTUALLY END UP --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Scale right, bodies mapped, samples built, 21179 frames posed - **and still a ball.**</span>
        <span class="tok-comment">// Every aggregate says the machinery ran; none says WHERE it put anything. A root at the</span>
        <span class="tok-comment">// origin and a root in the right place produce the same counts.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * Root, its target, and the span of the whole robot. **A span near zero is a collapse;</span>
        <span class="tok-comment">// a good span in the wrong place is a placement error** - and those are the two things</span>
        <span class="tok-comment">// that have been confused for three turns.</span>
        {
            <span class="tok-kw">var</span> lo: Vec = .{ <span class="tok-num">1.0e9</span>, <span class="tok-num">1.0e9</span>, <span class="tok-num">1.0e9</span>, <span class="tok-num">0</span> };
            <span class="tok-kw">var</span> hi: Vec = .{ -<span class="tok-num">1.0e9</span>, -<span class="tok-num">1.0e9</span>, -<span class="tok-num">1.0e9</span>, <span class="tok-num">0</span> };
            <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot.model.nbody) |b| {
                <span class="tok-kw">const</span> p: Vec = s.robot_data.body_xpos[b];
                lo = <span class="tok-builtin">@min</span>(lo, p);
                hi = <span class="tok-builtin">@max</span>(hi, p);
            }
            <span class="tok-kw">const</span> span: Vec = hi - lo;
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  robot span {d:.2} x {d:.2} x {d:.2} m"</span>, .{ span[<span class="tok-num">0</span>], span[<span class="tok-num">1</span>], span[<span class="tok-num">2</span>] });
            <span class="tok-kw">const</span> root: Vec = s.robot_data.body_xpos[<span class="tok-num">1</span>];
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  root at {d:.2},{d:.2},{d:.2}"</span>, .{ root[<span class="tok-num">0</span>], root[<span class="tok-num">1</span>], root[<span class="tok-num">2</span>] });
        }

        u.<span class="tok-fn">text</span>(<span class="tok-str">"  capture scale {d:.5}  (hip {d:.3} m)"</span>, .{
            <span class="tok-fn">captureScale</span>(s, &amp;s.characters[s.robot_source]),
            robot_hip_height_m,
        });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  bodies {d}/{d}  samples {d}  posed {d}"</span>, .{
            s.robot_mapped_count,
            s.robot.model.nbody -| <span class="tok-num">1</span>,
            s.robot_sample_count,
            s.robot_posed_frames,
        });
        <span class="tok-kw">if</span> (s.robot_visual_worst &gt;= <span class="tok-num">0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  fit {d:.3} m  worst {d:.3} m {s}"</span>, .{
                s.robot_visual_mean,
                s.robot_visual_worst,
                s.robot_visual_worst_name,
            });
        }
    }
    <span class="tok-kw">if</span> (s.show_skeleton) {
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"bone radius"</span>, &amp;s.capsule_radius, .{
            .min = <span class="tok-num">0.004</span>,
            .max = <span class="tok-num">0.05</span>,
            .fmt = <span class="tok-str">"{d:.3}"</span>,
        });
    }
}

<span class="tok-comment">/// Sun direction and shadow bias.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">tabLight</span>(s: *State, u: ui.Ui) void {
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"ground"</span>, &amp;s.show_ground);
    _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"light yaw"</span>, &amp;s.light_yaw, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">360.0</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
    _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"light pitch"</span>, &amp;s.light_pitch, .{ .min = <span class="tok-num">5.0</span>, .max = <span class="tok-num">89.0</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
    u.<span class="tok-fn">separator</span>();
    _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"bias slope"</span>, &amp;s.shadow_bias_slope, .{
        .min = <span class="tok-num">0.0</span>,
        .max = <span class="tok-num">0.02</span>,
        .fmt = <span class="tok-str">"{d:.4}"</span>,
    });
    _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"bias min"</span>, &amp;s.shadow_bias_min, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">0.01</span>, .fmt = <span class="tok-str">"{d:.4}"</span> });
}

<span class="tok-comment">/// Ambient occlusion and its bilateral blur.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">tabAmbientOcclusion</span>(s: *State, u: ui.Ui) void {
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"ao"</span>, &amp;s.show_ao);
    _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"radius"</span>, &amp;s.ssao_radius, .{ .min = <span class="tok-num">0.05</span>, .max = <span class="tok-num">2.0</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
    _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"bias"</span>, &amp;s.ssao_bias, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">0.2</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
    _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"power"</span>, &amp;s.ssao_intensity, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">1.0</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
    u.<span class="tok-fn">separator</span>();
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"blur"</span>, &amp;s.blur_ao);
    <span class="tok-kw">if</span> (s.blur_ao) {
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"falloff"</span>, &amp;s.blur_falloff, .{ .min = <span class="tok-num">0.5</span>, .max = <span class="tok-num">60.0</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"normal"</span>, &amp;s.blur_normal_power, .{ .min = <span class="tok-num">1.0</span>, .max = <span class="tok-num">32.0</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
    }
}

<span class="tok-comment">/// The offscreen-target inset and the scene's vital statistics.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">tabDebug</span>(s: *State, u: ui.Ui) void {
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"inset"</span>, &amp;s.show_light_view);
    <span class="tok-kw">if</span> (s.show_light_view) {
        _ = u.<span class="tok-fn">radioButton</span>(<span class="tok-str">"shadow"</span>, &amp;s.debug_view, <span class="tok-num">0</span>);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">radioButton</span>(<span class="tok-str">"pos"</span>, &amp;s.debug_view, <span class="tok-num">1</span>);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">radioButton</span>(<span class="tok-str">"nrm"</span>, &amp;s.debug_view, <span class="tok-num">2</span>);
        _ = u.<span class="tok-fn">radioButton</span>(<span class="tok-str">"albedo"</span>, &amp;s.debug_view, <span class="tok-num">3</span>);
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">radioButton</span>(<span class="tok-str">"ao map"</span>, &amp;s.debug_view, <span class="tok-num">4</span>);
    }
    u.<span class="tok-fn">separator</span>();
    <span class="tok-kw">if</span> (s.status_len &gt; <span class="tok-num">0</span>) {
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{s.status[<span class="tok-num">0</span>..s.status_len]});
    }
    <span class="tok-kw">for</span> (&amp;s.characters) |*c| {
        <span class="tok-kw">var</span> vertex_count: i32 = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-builtin">@intCast</span>(c.model.model.meshCount)) |mesh_index| {
            vertex_count += c.model.model.meshes[mesh_index].vertexCount;
        }
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}: {d} bones, {d} verts, {d:.1}s"</span>, .{
            c.label,
            c.<span class="tok-fn">boneCount</span>(),
            vertex_count,
            c.<span class="tok-fn">duration</span>(),
        });
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - geno + mocap"</span>,
            .width = screen_w,
            .height = screen_h,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    .memory = .managed,
};

<span class="tok-comment">/// Where the robot's ROOT body should sit - the position of the capture joint it maps to.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * Not the capture's root. `humanoid.xml`'s root is the TORSO and maps to `Spine3`; the</span>
<span class="tok-comment">/// capture's root is `Hips`, a spine lower.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">rootBodyWorldPosition</span>(s: *<span class="tok-kw">const</span> State, positions: []<span class="tok-kw">const</span> Vec) ?Vec {
    <span class="tok-comment">// ** FROM 1, NOT 0. Body 0 is the WORLD and its parent is also 0, so a scan from zero</span>
    <span class="tok-comment">// matches it first, finds no mapped joint, and returns null - the translation is then never</span>
    <span class="tok-comment">// written and the robot stands at the origin for the whole take. **A sentinel that also</span>
    <span class="tok-comment">// satisfies the predicate is not a sentinel**, which is the second time body/joint 0 has</span>
    <span class="tok-comment">// done this here.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot.model.nbody) |body| {
        <span class="tok-kw">if</span> (s.robot.model.body_parent[body] != <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> human_joint: i32 = s.human_of_body[body];
        <span class="tok-kw">if</span> (human_joint &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> <span class="tok-builtin">@as</span>(usize, <span class="tok-builtin">@intCast</span>(human_joint)) &gt;= positions.len) {
            <span class="tok-kw">return</span> null;
        }
        <span class="tok-kw">return</span> positions[<span class="tok-builtin">@intCast</span>(human_joint)];
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-comment">// -- ** `buildCorePairs` DELETED --</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Two directions determined the torso EXACTLY and the pelvis within 11 degrees - the best result</span>
<span class="tok-comment">// this project had before the point cloud, and the first time the core of the body tracked at</span>
<span class="tok-comment">// all. **It is a special case of three sample points**, which is what a body with two children</span>
<span class="tok-comment">// gets for free. The construction was right; it just did not need to be its own mechanism.</span>

<span class="tok-comment">/// One point on a robot body, and where the capture says it should be.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** THE WHOLE RETARGET IS "MATCH THESE POINTS" --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// One point per body gives POSITION, two give DIRECTION, three give TWIST. The six mechanisms</span>
<span class="tok-comment">/// this example used to run - direction pairs, twist offsets, per-body IK, chain IK, hinge</span>
<span class="tok-comment">/// flexion, ankle aim - are each a special case, and at least eight of this project's bugs lived</span>
<span class="tok-comment">/// in the seams between them.</span>
<span class="tok-comment">// -- *** THE RETARGET LIVES IN `src/robot.zig` NOW --</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// `PointSample`, `buildPointSamples` and `solvePointCloud` were defined HERE, and the harness</span>
<span class="tok-comment">// had its own copy of the same construction. **Seven times an example and a test have</span>
<span class="tok-comment">// re-implemented one stage and drifted** - the twist builder, the rest solve, the task set, the</span>
<span class="tok-comment">// rest-flexion fix, the pose loop, the sample cache, and a posture weight of 0.02 against 0.15.</span>
<span class="tok-comment">// Each was closed on its own; none removed the condition.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// *** **Moving the algorithm into the library removes it.** What remains here is what genuinely</span>
<span class="tok-comment">// belongs to the example: turning a `Character` into the arrays the library wants.</span>

<span class="tok-comment">/// The visual fit: mean and worst world distance from a mapped body to its capture joint.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// ** **The only metric here that can see a translation.** Nine angle metrics could not see the</span>
<span class="tok-comment">/// whole figure standing 10 cm out of place; the worst is reported alongside the mean because</span>
<span class="tok-comment">/// the worst bone is the one that draws the eye and a mean hides it.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">recordRobotFit</span>(s: *State, positions_robot: []<span class="tok-kw">const</span> Vec) void {
    <span class="tok-kw">var</span> sum: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> count: f32 = <span class="tok-num">0</span>;
    s.robot_visual_worst = <span class="tok-num">0</span>;
    s.robot_visual_worst_name = <span class="tok-str">""</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot.model.nbody) |b| {
        <span class="tok-kw">const</span> hb: i32 = s.human_of_body[b];
        <span class="tok-kw">if</span> (hb &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> <span class="tok-builtin">@as</span>(usize, <span class="tok-builtin">@intCast</span>(hb)) &gt;= positions_robot.len) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> d: f32 = <span class="tok-fn">boneLength</span>(s.robot_data.body_xpos[b] - positions_robot[<span class="tok-builtin">@intCast</span>(hb)]);
        sum += d;
        count += <span class="tok-num">1</span>;
        <span class="tok-kw">if</span> (d &gt; s.robot_visual_worst) {
            s.robot_visual_worst = d;
            s.robot_visual_worst_name = s.robot.names[b];
        }
    }
    s.robot_visual_mean = sum / <span class="tok-builtin">@max</span>(count, <span class="tok-num">1</span>);
}

<span class="tok-comment">/// Fill `s.robot_samples` by asking the library, then record what the solve will use.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">refreshPointSamples</span>(s: *State, source: *<span class="tok-kw">const</span> Character) void {
    <span class="tok-kw">const</span> joints: usize = source.<span class="tok-fn">boneCount</span>();
    s.robot_sample_count = z.robot.<span class="tok-fn">buildPointSamples</span>(&amp;s.robot.model, .{
        .human_of_body = s.human_of_body,
        .human_parents = source.target_parents[<span class="tok-num">0</span>..joints],
        .rest_positions = s.robot_rest_world[<span class="tok-num">0</span>..joints],
        .rest_rotations = s.robot_rest_rotations[<span class="tok-num">0</span>..joints],
        .robot_rest_rotations = s.robot_rest_xrot[<span class="tok-num">0</span>..s.robot.model.nbody],
        .body_names = s.robot.names,
        <span class="tok-comment">// * The rest POSITIONS as well as the rotations: `buildPointSamples` checks each leaf's</span>
        <span class="tok-comment">// correspondence against the rest pose and needs both halves of it.</span>
        .rest_positions_robot = s.robot_rest_body_pos[<span class="tok-num">0</span>..s.robot.model.nbody],
    }, s.robot_samples);

    <span class="tok-comment">// * Counted here so the UI reports what the SOLVE uses, not what the table resolved: a body</span>
    <span class="tok-comment">// can be mapped and still receive no samples.</span>
    <span class="tok-kw">var</span> mapped: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot.model.nbody) |b| {
        <span class="tok-kw">if</span> (s.human_of_body[b] &gt;= <span class="tok-num">0</span>) {
            mapped += <span class="tok-num">1</span>;
        }
    }
    s.robot_mapped_count = mapped;
}

<span class="tok-comment">/// Build the retargeted skeleton: the capture's DIRECTIONS at the robot's OWN bone lengths,</span>
<span class="tok-comment">/// placed by best fit rather than by an anchor.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** THE SHAPE FIRST, THE PLACEMENT SECOND --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Anchoring the walk on one body makes that body a single point of failure: the robot's ROOT is</span>
<span class="tok-comment">/// its torso, whose origin is not where the capture's chest joint sits, and the whole figure</span>
<span class="tok-comment">/// inherited that error. **Translating so the MEAN of the mapped joints matches means every body</span>
<span class="tok-comment">/// votes and there is no privileged one to be wrong about.**</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildRetargetedSkeleton</span>(
    s: *State,
    positions_robot: []<span class="tok-kw">const</span> Vec,
    out: []Vec,
) void {
    <span class="tok-kw">const</span> model: *<span class="tok-kw">const</span> z.robot.Model = &amp;s.robot.model;
    <span class="tok-comment">// * Checked, not clamped: a robot with more bodies than `out` holds used to lose its last</span>
    <span class="tok-comment">// bodies' targets without a word.</span>
    <span class="tok-fn">assertf</span>(model.nbody &lt;= out.len, <span class="tok-builtin">@src</span>(), <span class="tok-str">"retargeted skeleton: {d} bodies, room for {d}"</span>, .{
        model.nbody,
        out.len,
    });
    <span class="tok-kw">const</span> limit: usize = model.nbody;
    out[<span class="tok-num">0</span>] = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..limit) |b| {
        <span class="tok-kw">const</span> parent: u32 = model.body_parent[b];
        <span class="tok-kw">const</span> own_length: f32 = <span class="tok-fn">boneLength</span>(model.body_pos[b]);
        <span class="tok-kw">const</span> hb: i32 = s.human_of_body[b];
        <span class="tok-kw">if</span> (parent == <span class="tok-num">0</span>) {
            out[b] = <span class="tok-kw">if</span> (hb &gt;= <span class="tok-num">0</span> <span class="tok-kw">and</span> <span class="tok-builtin">@as</span>(usize, <span class="tok-builtin">@intCast</span>(hb)) &lt; positions_robot.len)
                positions_robot[<span class="tok-builtin">@intCast</span>(hb)]
            <span class="tok-kw">else</span>
                .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> };
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> hp: i32 = s.human_of_body[parent];
        <span class="tok-kw">if</span> (hb &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> hp &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> own_length &lt; <span class="tok-num">1.0e-6</span>) {
            out[b] = out[parent] + model.body_pos[b];
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> bone: Vec = positions_robot[<span class="tok-builtin">@intCast</span>(hb)] - positions_robot[<span class="tok-builtin">@intCast</span>(hp)];
        <span class="tok-kw">if</span> (<span class="tok-fn">boneLength</span>(bone) &lt; <span class="tok-num">1.0e-6</span>) {
            out[b] = out[parent] + model.body_pos[b];
            <span class="tok-kw">continue</span>;
        }
        out[b] = out[parent] + <span class="tok-fn">normalize3</span>(bone) * <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(own_length));
    }

    <span class="tok-kw">var</span> offset: Vec = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    <span class="tok-kw">var</span> counted: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..limit) |b| {
        <span class="tok-kw">const</span> hb: i32 = s.human_of_body[b];
        <span class="tok-kw">if</span> (hb &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> <span class="tok-builtin">@as</span>(usize, <span class="tok-builtin">@intCast</span>(hb)) &gt;= positions_robot.len) {
            <span class="tok-kw">continue</span>;
        }
        offset += positions_robot[<span class="tok-builtin">@intCast</span>(hb)] - out[b];
        counted += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">if</span> (counted &gt; <span class="tok-num">0</span>) {
        <span class="tok-kw">const</span> shift: Vec = offset / <span class="tok-builtin">@as</span>(Vec, <span class="tok-builtin">@splat</span>(counted));
        <span class="tok-kw">for</span> (<span class="tok-num">1</span>..limit) |b| {
            out[b] += shift;
        }
    }
}
