<h1>shapes_top_down_lights</h1>
<figure class="code src-file" data-path="examples/shapes_top_down_lights/shapes_top_down_lights.zig" data-lines="288"><figcaption><span>examples/shapes_top_down_lights/shapes_top_down_lights.zig</span><span>288 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/shapes_top_down_lights.zig - 2D top-down lighting with hard shadows.</span>
<span class="tok-comment">// Ports raylib's `shapes_top_down_lights` (its 4/4-complexity shapes sample).</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// The technique, and why it needs a render texture per light:</span>
<span class="tok-comment">//   1. For each light, render a LIGHT MASK offscreen: a radial gradient (bright</span>
<span class="tok-comment">//      at the light, black at its outer radius) minus the SHADOW VOLUMES cast by</span>
<span class="tok-comment">//      every box between the light and the world.</span>
<span class="tok-comment">//   2. Additively ACCUMULATE those masks into one lightmap. Additive is what</span>
<span class="tok-comment">//      makes two lights brighten each other instead of overwriting - and it's why</span>
<span class="tok-comment">//      each light needs its own mask pass: a shadow belongs to ONE light, so it</span>
<span class="tok-comment">//      must be cut before that light joins the sum.</span>
<span class="tok-comment">//   3. Draw the scene, then MULTIPLY it by the lightmap. Lit -&gt; unchanged;</span>
<span class="tok-comment">//      shadowed (lightmap black) -&gt; black.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// A shadow volume is just the box edge, extended away from the light. Only edges</span>
<span class="tok-comment">// FACING AWAY from the light cast one: for an axis-aligned box that reduces to</span>
<span class="tok-comment">// four cheap comparisons (e.g. the top edge casts only when the light is below</span>
<span class="tok-comment">// it), which is the whole trick that keeps this O(boxes) instead of a raycast.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Engine surface exercised: `beginTextureMode(gl, rt, null)` - the null clear is</span>
<span class="tok-comment">// a LOAD, which is what lets the accumulator survive across per-light passes -</span>
<span class="tok-comment">// plus `beginBlendMode(.additive/.multiply)`, `gl.circleGradient`, and</span>
<span class="tok-comment">// `gl.triangleFan`.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// Leak-clean (`.memory = .managed`): both render textures are freed in `deinit`.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = Color;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> normalize = zm.normalize;
<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> max_boxes: usize = <span class="tok-num">6</span>;
<span class="tok-kw">const</span> max_lights: usize = <span class="tok-num">3</span>;
<span class="tok-comment">/// 4 edges per box, and a box can only ever have 2 facing away - but bound for</span>
<span class="tok-comment">/// the worst case so the buffer can never overflow.</span>
<span class="tok-kw">const</span> max_shadows: usize = max_boxes * <span class="tok-num">4</span>;

<span class="tok-kw">const</span> Light = <span class="tok-kw">struct</span> {
    pos: Vec2,
    radius: f32,
    color: Color,
    on: bool = true,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    ui_host: z.UiHost,
    font: z.Font,
    mask: z.RenderTexture, <span class="tok-comment">// scratch: ONE light's contribution</span>
    accum: z.RenderTexture, <span class="tok-comment">// the summed lightmap</span>
    rt_w: i32,
    rt_h: i32,
    boxes: [max_boxes]z.Rectangle = undefined,
    box_count: usize = <span class="tok-num">0</span>,
    lights: [max_lights]Light = undefined,
    light_count: usize = <span class="tok-num">0</span>,
    show_volumes: bool = false,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">16</span>);

    <span class="tok-comment">// Masks are full-canvas. Sized from the live window: the lightmap is</span>
    <span class="tok-comment">// composited 1:1 over the screen, so any mismatch would misalign it.</span>
    <span class="tok-kw">const</span> w: i32 = <span class="tok-builtin">@trunc</span>(f.window.<span class="tok-fn">widthf</span>());
    <span class="tok-kw">const</span> h: i32 = <span class="tok-builtin">@trunc</span>(f.window.<span class="tok-fn">heightf</span>());

    s.* = .{
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
        .font = font,
        .mask = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, w, h),
        .accum = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, w, h),
        .rt_w = w,
        .rt_h = h,
    };

    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();
    s.boxes[<span class="tok-num">0</span>] = .{ .x = fw * <span class="tok-num">0.12</span>, .y = fh * <span class="tok-num">0.42</span>, .width = <span class="tok-num">70</span>, .height = <span class="tok-num">70</span> };
    s.boxes[<span class="tok-num">1</span>] = .{ .x = fw * <span class="tok-num">0.58</span>, .y = fh * <span class="tok-num">0.38</span>, .width = <span class="tok-num">90</span>, .height = <span class="tok-num">50</span> };
    s.boxes[<span class="tok-num">2</span>] = .{ .x = fw * <span class="tok-num">0.30</span>, .y = fh * <span class="tok-num">0.68</span>, .width = <span class="tok-num">60</span>, .height = <span class="tok-num">90</span> };
    s.boxes[<span class="tok-num">3</span>] = .{ .x = fw * <span class="tok-num">0.70</span>, .y = fh * <span class="tok-num">0.74</span>, .width = <span class="tok-num">80</span>, .height = <span class="tok-num">60</span> };
    s.box_count = <span class="tok-num">4</span>;

    <span class="tok-comment">// Light 0 follows the finger; the others are fixed so their shadows can be</span>
    <span class="tok-comment">// compared against the moving one.</span>
    <span class="tok-kw">const</span> warm: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">236</span>, .b = <span class="tok-num">190</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-kw">const</span> cool: Color = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">190</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-kw">const</span> rose: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">130</span>, .b = <span class="tok-num">150</span>, .a = <span class="tok-num">255</span> };
    s.lights[<span class="tok-num">0</span>] = .{ .pos = .{ fw * <span class="tok-num">0.5</span>, fh * <span class="tok-num">0.30</span> }, .radius = <span class="tok-num">320</span>, .color = warm };
    s.lights[<span class="tok-num">1</span>] = .{ .pos = .{ fw * <span class="tok-num">0.15</span>, fh * <span class="tok-num">0.90</span> }, .radius = <span class="tok-num">240</span>, .color = cool };
    s.lights[<span class="tok-num">2</span>] = .{ .pos = .{ fw * <span class="tok-num">0.88</span>, fh * <span class="tok-num">0.60</span> }, .radius = <span class="tok-num">220</span>, .color = rose };
    s.light_count = <span class="tok-num">3</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    _ = gpa;
    s.mask.<span class="tok-fn">deinit</span>();
    s.accum.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Extend an edge away from the light to form the shadow quad. `sp`/`ep` are the</span>
<span class="tok-comment">/// edge endpoints; each is pushed outward along its own ray from the light, so</span>
<span class="tok-comment">/// the volume diverges exactly like the real penumbra-free shadow would.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">shadowQuad</span>(light: Vec2, sp: Vec2, ep: Vec2, extend: f32) [<span class="tok-num">4</span>]Vec2 {
    <span class="tok-kw">const</span> sv: Vec2 = <span class="tok-fn">normalize</span>(sp - light);
    <span class="tok-kw">const</span> ev: Vec2 = <span class="tok-fn">normalize</span>(ep - light);
    <span class="tok-kw">return</span> .{
        sp,
        ep,
        ep + ev * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(extend)),
        sp + sv * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(extend)),
    };
}

<span class="tok-comment">/// Collect the shadow volumes a box casts from `light`. Only edges facing AWAY</span>
<span class="tok-comment">/// from the light cast: for an axis-aligned box that's four comparisons, no</span>
<span class="tok-comment">/// normals or dot products needed.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">boxShadows</span>(
    light: Vec2,
    b: z.Rectangle,
    extend: f32,
    out: *[max_shadows][<span class="tok-num">4</span>]Vec2,
    n: *usize,
) void {
    <span class="tok-kw">const</span> x0: f32 = b.x;
    <span class="tok-kw">const</span> y0: f32 = b.y;
    <span class="tok-kw">const</span> x1: f32 = b.x + b.width;
    <span class="tok-kw">const</span> y1: f32 = b.y + b.height;

    <span class="tok-comment">// A light INSIDE the box would make every edge face away and flood the</span>
    <span class="tok-comment">// screen with shadow - skip it, as raylib does.</span>
    <span class="tok-kw">if</span> (light[<span class="tok-num">0</span>] &gt; x0 <span class="tok-kw">and</span> light[<span class="tok-num">0</span>] &lt; x1 <span class="tok-kw">and</span> light[<span class="tok-num">1</span>] &gt; y0 <span class="tok-kw">and</span> light[<span class="tok-num">1</span>] &lt; y1) {
        <span class="tok-kw">return</span>;
    }

    <span class="tok-kw">if</span> (light[<span class="tok-num">1</span>] &gt; y0 <span class="tok-kw">and</span> n.* &lt; max_shadows) { <span class="tok-comment">// light below the top edge</span>
        out[n.*] = <span class="tok-fn">shadowQuad</span>(light, .{ x0, y0 }, .{ x1, y0 }, extend);
        n.* += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">if</span> (light[<span class="tok-num">1</span>] &lt; y1 <span class="tok-kw">and</span> n.* &lt; max_shadows) { <span class="tok-comment">// light above the bottom edge</span>
        out[n.*] = <span class="tok-fn">shadowQuad</span>(light, .{ x1, y1 }, .{ x0, y1 }, extend);
        n.* += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">if</span> (light[<span class="tok-num">0</span>] &gt; x0 <span class="tok-kw">and</span> n.* &lt; max_shadows) { <span class="tok-comment">// light right of the left edge</span>
        out[n.*] = <span class="tok-fn">shadowQuad</span>(light, .{ x0, y1 }, .{ x0, y0 }, extend);
        n.* += <span class="tok-num">1</span>;
    }
    <span class="tok-kw">if</span> (light[<span class="tok-num">0</span>] &lt; x1 <span class="tok-kw">and</span> n.* &lt; max_shadows) { <span class="tok-comment">// light left of the right edge</span>
        out[n.*] = <span class="tok-fn">shadowQuad</span>(light, .{ x1, y0 }, .{ x1, y1 }, extend);
        n.* += <span class="tok-num">1</span>;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> full: z.Rectangle = .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = <span class="tok-fn">float</span>(s.rt_w), .height = <span class="tok-fn">float</span>(s.rt_h) };

    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-comment">// Light 0 tracks the finger (but not while it's on the panel).</span>
    <span class="tok-kw">if</span> (!u.<span class="tok-fn">wantCaptureMouse</span>()) {
        s.lights[<span class="tok-num">0</span>].pos = z.<span class="tok-fn">getMousePosition</span>(f.input);
    }

    <span class="tok-comment">// ---- 1. clear the accumulator ------------------------------------------</span>
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.accum, c.black);
    z.<span class="tok-fn">endTextureMode</span>(f.gl);

    <span class="tok-comment">// ---- 2. one masked pass per light, summed into the accumulator ----------</span>
    <span class="tok-kw">var</span> shadows: [max_shadows][<span class="tok-num">4</span>]Vec2 = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.light_count) |i| {
        <span class="tok-kw">const</span> lt: Light = s.lights[i];
        <span class="tok-kw">if</span> (!lt.on) {
            <span class="tok-kw">continue</span>;
        }

        <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.box_count) |bi| {
            <span class="tok-fn">boxShadows</span>(lt.pos, s.boxes[bi], lt.radius * <span class="tok-num">2.0</span>, &amp;shadows, &amp;n);
        }

        z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.mask, c.black);
        <span class="tok-comment">// Radial falloff: the light's color at the centre, black at the rim.</span>
        f.gl.<span class="tok-fn">circleGradient</span>(lt.pos, lt.radius, lt.color, c.black);
        <span class="tok-comment">// Cut the shadows out of THIS light before it joins the sum.</span>
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |k| {
            f.gl.<span class="tok-fn">triangleFan</span>(&amp;shadows[k], .{ .color = c.black });
        }
        z.<span class="tok-fn">endTextureMode</span>(f.gl);

        <span class="tok-comment">// null clear = LOAD: keep what previous lights already contributed.</span>
        z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.accum, null);
        z.<span class="tok-fn">beginBlendMode</span>(f.gl, .additive);
        f.gl.<span class="tok-fn">texture</span>(full, s.mask.<span class="tok-fn">asTexture</span>(), .{});
        z.<span class="tok-fn">endBlendMode</span>(f.gl);
        z.<span class="tok-fn">endTextureMode</span>(f.gl);
    }

    <span class="tok-comment">// ---- 3. scene, then multiply it by the lightmap -------------------------</span>
    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">30</span>, .g = <span class="tok-num">32</span>, .b = <span class="tok-num">40</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-comment">// Floor grid, so the shadow edges have something to fall across.</span>
    <span class="tok-kw">var</span> gx: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (gx &lt; fw) : (gx += <span class="tok-num">40</span>) {
        f.gl.<span class="tok-fn">line</span>(.{ gx, <span class="tok-num">0</span> }, .{ gx, fh }, .{ .color = .{ .r = <span class="tok-num">44</span>, .g = <span class="tok-num">47</span>, .b = <span class="tok-num">58</span>, .a = <span class="tok-num">255</span> } });
    }
    <span class="tok-kw">var</span> gy: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (gy &lt; fh) : (gy += <span class="tok-num">40</span>) {
        f.gl.<span class="tok-fn">line</span>(.{ <span class="tok-num">0</span>, gy }, .{ fw, gy }, .{ .color = .{ .r = <span class="tok-num">44</span>, .g = <span class="tok-num">47</span>, .b = <span class="tok-num">58</span>, .a = <span class="tok-num">255</span> } });
    }
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.box_count) |bi| {
        f.gl.<span class="tok-fn">rect</span>(s.boxes[bi], .{ .color = .{ .r = <span class="tok-num">150</span>, .g = <span class="tok-num">155</span>, .b = <span class="tok-num">170</span>, .a = <span class="tok-num">255</span> } });
        f.gl.<span class="tok-fn">rect</span>(s.boxes[bi], .{ .color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">95</span>, .b = <span class="tok-num">110</span>, .a = <span class="tok-num">255</span> }, .outline = <span class="tok-num">2</span> });
    }

    z.<span class="tok-fn">beginBlendMode</span>(f.gl, .multiply);
    f.gl.<span class="tok-fn">texture</span>(full, s.accum.<span class="tok-fn">asTexture</span>(), .{});
    z.<span class="tok-fn">endBlendMode</span>(f.gl);

    <span class="tok-comment">// Optional: the raw shadow geometry for the moving light, drawn UNLIT on top</span>
    <span class="tok-comment">// so the volumes that produced the darkness are visible as outlines.</span>
    <span class="tok-kw">if</span> (s.show_volumes) {
        <span class="tok-kw">var</span> n: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.box_count) |bi| {
            <span class="tok-fn">boxShadows</span>(s.lights[<span class="tok-num">0</span>].pos, s.boxes[bi], s.lights[<span class="tok-num">0</span>].radius * <span class="tok-num">2.0</span>, &amp;shadows, &amp;n);
        }
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..n) |k| {
            <span class="tok-kw">const</span> q: [<span class="tok-num">4</span>]Vec2 = shadows[k];
            f.gl.<span class="tok-fn">line</span>(q[<span class="tok-num">0</span>], q[<span class="tok-num">3</span>], .{ .color = c.lime, .thickness = <span class="tok-num">1</span> });
            f.gl.<span class="tok-fn">line</span>(q[<span class="tok-num">1</span>], q[<span class="tok-num">2</span>], .{ .color = c.lime, .thickness = <span class="tok-num">1</span> });
        }
    }

    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16.0</span>, <span class="tok-num">210</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Top-down lights"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag: move the warm light."</span>, .{});
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.light_count) |i| {
            <span class="tok-kw">var</span> buf: [<span class="tok-num">24</span>]u8 = undefined;
            <span class="tok-kw">const</span> lbl: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"light {d}"</span>, .{i}) <span class="tok-kw">catch</span> <span class="tok-str">"light"</span>;
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(lbl, .{})) {
                s.lights[i].on = !s.lights[i].on;
            }
            <span class="tok-kw">if</span> (i + <span class="tok-num">1</span> &lt; s.light_count) {
                u.<span class="tok-fn">sameLine</span>(.{});
            }
        }
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-kw">if</span> (s.show_volumes) <span class="tok-str">"Volumes: ON"</span> <span class="tok-kw">else</span> <span class="tok-str">"Volumes: OFF"</span>, .{})) {
            s.show_volumes = !s.show_volumes;
        }
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"radius"</span>, &amp;s.lights[<span class="tok-num">0</span>].radius, .{ .min = <span class="tok-num">120</span>, .max = <span class="tok-num">500</span> });
    }

    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - shapes - top-down lights"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            .scale_mode = .responsive,
            .depth_format = null,
            .clear = .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    .memory = .managed,
};
