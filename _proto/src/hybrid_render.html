<style>
:root{

.title{font-size:1.8rem;margin:0 0 .2em;}

<h1>hybrid_render</h1>
<figure class="code src-file" data-path="examples/hybrid_render/hybrid_render.zig" data-lines="583"><figcaption><span>examples/hybrid_render/hybrid_render.zig</span><span>583 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! hybrid_render - raylib's `shaders_hybrid_rendering`, the zimr way</span>
<span class="tok-comment">//! (and, with the cubes toggled off, `shaders_raymarching_rendering`).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Two rendering methods share one depth buffer inside one pass:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   1. A fullscreen quad whose fragment shader sphere-traces an SDF</span>
<span class="tok-comment">//!      scene (three orbiting metaballs over a checkerboard floor) and</span>
<span class="tok-comment">//!      writes each hit's TRUE depth through the FragDepth builtin -</span>
<span class="tok-comment">//!      projected via the same view-projection the raster pass uses.</span>
<span class="tok-comment">//!   2. Ordinary rasterized cubes (the honest `fog_fs` material at</span>
<span class="tok-comment">//!      density 0) drawn afterwards with a normal depth test.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   The cubes orbit THROUGH the metaball cluster, so every frame shows</span>
<span class="tok-comment">//!   raster geometry slicing in front of and behind marched geometry -</span>
<span class="tok-comment">//!   occlusion across two rendering methods, with zero depth-encoding</span>
<span class="tok-comment">//!   coordination (raylib teaches both shaders a custom near/far</span>
<span class="tok-comment">//!   linearization instead; ours agree by construction).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Checkboxes isolate either method; drag orbits; pinch zooms.</span>

<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> march_fs = z.hybrid_raymarch_shader;
<span class="tok-kw">const</span> mat_vs = z.deferred_shaders.gbuffer_vs;
<span class="tok-kw">const</span> cube_fs = z.fog_shader; <span class="tok-comment">// density 0 == honest lambert+blinn</span>

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> shading_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"deferred_shading_vs.wgsl"</span>);
<span class="tok-kw">const</span> hybrid_raymarch_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"hybrid_raymarch_fs.wgsl"</span>);

<span class="tok-kw">const</span> fog_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"fog_fs.wgsl"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> MarchUbo = <span class="tok-builtin">@FieldType</span>(march_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> VsUbo = <span class="tok-builtin">@FieldType</span>(mat_vs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> CubeUbo = <span class="tok-builtin">@FieldType</span>(cube_fs.Io, <span class="tok-str">"u"</span>);

<span class="tok-kw">const</span> fov_y: f32 = <span class="tok-num">0.9</span>;
<span class="tok-kw">const</span> sun_dir: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0.45</span>, <span class="tok-num">0.75</span>, <span class="tok-num">0.5</span> }; <span class="tok-comment">// matches the marcher's sun</span>

<span class="tok-kw">const</span> cube_count: usize = <span class="tok-num">3</span>;

<span class="tok-comment">/// The cubes orbit through the metaball cluster at staggered phases -</span>
<span class="tok-comment">/// the interpenetration is the demo.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">cubeCenter</span>(i: usize, t: f32) [<span class="tok-num">3</span>]f32 {
    <span class="tok-kw">const</span> phase: f32 = <span class="tok-fn">float</span>(i) * <span class="tok-num">2.0943951</span>;
    <span class="tok-kw">const</span> a: f32 = -t * <span class="tok-num">0.45</span> + phase; <span class="tok-comment">// counter-rotate vs the blobs</span>
    <span class="tok-kw">return</span> .{ <span class="tok-num">1.4</span> * <span class="tok-builtin">@cos</span>(a), <span class="tok-num">1.0</span> + <span class="tok-num">0.3</span> * <span class="tok-builtin">@sin</span>(t * <span class="tok-num">0.8</span> + phase), <span class="tok-num">1.4</span> * <span class="tok-builtin">@sin</span>(a) };
}

<span class="tok-kw">const</span> cube_colors = [cube_count][<span class="tok-num">4</span>]f32{
    .{ <span class="tok-num">0.85</span>, <span class="tok-num">0.75</span>, <span class="tok-num">0.25</span>, <span class="tok-num">1</span> },

<span class="tok-kw">const</span> MeshVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    position: [<span class="tok-num">3</span>]f32,
    normal: [<span class="tok-num">3</span>]f32,
};

        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(c.g2_bg);
    }
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.quad_vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.march_ubo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.cube_vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.cube_ibo);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.empty_bg);

    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.march_pipeline);
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.cube_pipeline);
    s.rt.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">uniformLayout</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    min_size: u64,
    vis: z.wgpu.ShaderStage,
    label: []<span class="tok-kw">const</span> u8,
) !z.wgpu.BindGroupLayoutHandle {
    <span class="tok-kw">const</span> entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{ .binding = <span class="tok-num">0</span>, .visibility = vis, .resource = .{ .uniform_buffer = .{ .min_size = min_size } } },
    };
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    <span class="tok-kw">return</span> z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, blob, label);
}

<span class="tok-kw">fn</span> <span class="tok-fn">uniformBindGroup</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    bgl: z.wgpu.BindGroupLayoutHandle,
    buffer: z.wgpu.BufferHandle,
    size: u64,
    label: []<span class="tok-kw">const</span> u8,
) !z.wgpu.BindGroupHandle {
    <span class="tok-kw">const</span> entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = buffer, .size = size } } },
    };
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    <span class="tok-kw">return</span> z.wgpu.<span class="tok-fn">createBindGroup</span>(device, bgl, blob, label);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> queue: z.wgpu.QueueHandle = f.gpu.queue;

    <span class="tok-kw">const</span> quad_vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(fullscreen_verts[<span class="tok-num">0</span>..]),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"hy_quad"</span>,
    );
    <span class="tok-kw">const</span> cube_vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_verts[<span class="tok-num">0</span>..]),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"hy_cube_vbo"</span>,
    );
    <span class="tok-kw">const</span> cube_ibo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_indices[<span class="tok-num">0</span>..]),
        .{ .index = true, .copy_dst = true },
        <span class="tok-str">"hy_cube_ibo"</span>,
    );

    <span class="tok-comment">// ---- layouts ----</span>
    <span class="tok-kw">const</span> march_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(MarchUbo), .{ .fragment = true }, <span class="tok-str">"hy_march_g2"</span>);
    <span class="tok-kw">const</span> g0_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(VsUbo), .{ .vertex = true }, <span class="tok-str">"hy_g0"</span>);
    <span class="tok-kw">const</span> cube_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(CubeUbo), .{ .fragment = true }, <span class="tok-str">"hy_cube_g2"</span>);
    <span class="tok-kw">const</span> empty_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_blob);
    <span class="tok-kw">const</span> empty_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, empty_blob, <span class="tok-str">"hy_empty"</span>);
    <span class="tok-kw">const</span> empty_bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_bg_blob);
    <span class="tok-kw">const</span> empty_bg: z.wgpu.BindGroupHandle =
        z.wgpu.<span class="tok-fn">createBindGroup</span>(device, empty_bgl, empty_bg_blob, <span class="tok-str">"hy_empty_bg"</span>);

    <span class="tok-comment">// ---- the marcher: fullscreen quad, depth WRITTEN by the FS ----</span>
    <span class="tok-kw">const</span> march_pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ empty_bgl, empty_bgl, march_bgl },
        <span class="tok-str">"hy_march_pl"</span>,
    );
    <span class="tok-kw">const</span> quad_vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, shading_vs_wgsl, <span class="tok-str">"deferred_shading_vs"</span>);
    <span class="tok-kw">const</span> march_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, hybrid_raymarch_fs_wgsl, <span class="tok-str">"hybrid_raymarch_fs"</span>);
    <span class="tok-kw">const</span> march_combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less,
        .none,
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> march_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{.{
            .array_stride = <span class="tok-num">8</span>,
            .step_mode = .vertex,
            .attributes = &amp;.{
                .{ .format = .float32x2, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
            },
        }},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = march_combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(march_blob);
    <span class="tok-kw">const</span> march_pipeline: z.wgpu.RenderPipelineHandle = z.wgpu.<span class="tok-fn">createRenderPipeline</span>(
        device,
        march_pl,
        quad_vs_mod,
        march_mod,
        march_blob,
        <span class="tok-str">"hy_march"</span>,
    );
    <span class="tok-kw">const</span> march_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(MarchUbo),
        .usage = .{ .uniform = true, .copy_dst = true },
    });

    <span class="tok-comment">// ---- the raster cubes: the honest forward material, untouched ----</span>
    <span class="tok-kw">const</span> cube_pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ g0_bgl, empty_bgl, cube_bgl },
        <span class="tok-str">"hy_cube_pl"</span>,
    );
    <span class="tok-kw">const</span> cube_vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, gbuffer_vs_wgsl, <span class="tok-str">"gbuffer_vs"</span>);
    <span class="tok-kw">const</span> cube_fs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, fog_fs_wgsl, <span class="tok-str">"fog_fs"</span>);
    <span class="tok-kw">const</span> cube_combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less,
        .back,
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> cube_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{.{
            .array_stride = <span class="tok-builtin">@sizeOf</span>(MeshVertex),
            .step_mode = .vertex,
            .attributes = &amp;.{
                .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
                .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
            },
        }},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = cube_combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(cube_blob);
    <span class="tok-kw">const</span> cube_pipeline: z.wgpu.RenderPipelineHandle = z.wgpu.<span class="tok-fn">createRenderPipeline</span>(
        device,
        cube_pl,
        cube_vs_mod,
        cube_fs_mod,
        cube_blob,
        <span class="tok-str">"hy_cube"</span>,
    );

    <span class="tok-kw">var</span> cubes: [cube_count]CubeObj = undefined;
    <span class="tok-kw">for</span> (&amp;cubes) |*obj| {
        <span class="tok-kw">const</span> vs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = <span class="tok-builtin">@sizeOf</span>(VsUbo),
            .usage = .{ .uniform = true, .copy_dst = true },
        });
        <span class="tok-kw">const</span> fs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = <span class="tok-builtin">@sizeOf</span>(CubeUbo),
            .usage = .{ .uniform = true, .copy_dst = true },
        });
        obj.* = .{
            .vs_ubo = vs_ubo,
            .g0_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, g0_bgl, vs_ubo, <span class="tok-builtin">@sizeOf</span>(VsUbo), <span class="tok-str">"hy_g0_bg"</span>),
            .fs_ubo = fs_ubo,
            .g2_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, cube_bgl, fs_ubo, <span class="tok-builtin">@sizeOf</span>(CubeUbo), <span class="tok-str">"hy_g2_bg"</span>),
        };
    }

    <span class="tok-kw">const</span> march_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, march_bgl, march_ubo, <span class="tok-builtin">@sizeOf</span>(MarchUbo), <span class="tok-str">"hy_march_bg"</span>);

    <span class="tok-comment">// Build-only intermediates consumed above - release them (pipelines are direct/uncached -&gt; owned).</span>
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(march_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(g0_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(cube_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(empty_bgl);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(march_pl);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(cube_pl);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(quad_vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(march_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(cube_vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(cube_fs_mod);

    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.* = .{
        .gpa = gpa,
        .march_pipeline = march_pipeline,
        .cube_pipeline = cube_pipeline,
        .empty_bg = empty_bg,
        .quad_vbo = quad_vbo,
        .march_ubo = march_ubo,
        .march_bg = march_bg,
        .cube_vbo = cube_vbo,
        .cube_ibo = cube_ibo,
        .cubes = cubes,
        .rt = .{},
        .font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> bw: u32 = <span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> bh: u32 = <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt.color != .invalid <span class="tok-kw">and</span> s.rt.width == bw <span class="tok-kw">and</span> s.rt.height == bh) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.rt.color != .invalid) {
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt);
    }
    s.rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(bw), <span class="tok-builtin">@intCast</span>(bh));
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(f: *z.Frame, s: *State, ui_wants_mouse: bool) void {
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> dx: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (s.prev_pinch &gt; <span class="tok-num">0</span>) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - (dist - s.prev_pinch) * <span class="tok-num">0.02</span>, <span class="tok-num">4.0</span>, <span class="tok-num">16.0</span>);
        }
        s.prev_pinch = dist;
        <span class="tok-kw">return</span>;
    }
    s.prev_pinch = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !ui_wants_mouse) {
        <span class="tok-kw">if</span> (s.dragging) {
            <span class="tok-kw">const</span> d: Vec2 = z.<span class="tok-fn">getMouseDelta</span>(f.input);
            s.cam_yaw -= d[<span class="tok-num">0</span>] * <span class="tok-num">0.008</span>;
            s.cam_pitch = <span class="tok-fn">clamp</span>(s.cam_pitch + d[<span class="tok-num">1</span>] * <span class="tok-num">0.008</span>, <span class="tok-num">0.06</span>, <span class="tok-num">1.35</span>);
        }
        s.dragging = true;
    } <span class="tok-kw">else</span> {
        s.dragging = false;
    }
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span>) {
        s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - wheel * <span class="tok-num">0.5</span>, <span class="tok-num">4.0</span>, <span class="tok-num">16.0</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing; uses</span>
    <span class="tok-comment">// last-frame UI state = 1-frame lag, imperceptible).</span>

    <span class="tok-comment">// ---- ONE camera feeds both methods ----</span>
    <span class="tok-kw">const</span> cam_target: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(s.cam_pitch);
    <span class="tok-kw">const</span> sp: f32 = <span class="tok-builtin">@sin</span>(s.cam_pitch);
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-builtin">@cos</span>(s.cam_yaw);
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-builtin">@sin</span>(s.cam_yaw);
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(
        cam_target[<span class="tok-num">0</span>] + s.cam_dist * cp * sy,
        cam_target[<span class="tok-num">1</span>] + s.cam_dist * sp,
        cam_target[<span class="tok-num">2</span>] + s.cam_dist * cp * cy,
    );
    <span class="tok-kw">const</span> cam_view: Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, cam_target, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> aspect: f32 = vw / vh;
    <span class="tok-kw">const</span> cam_proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(fov_y, aspect, <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>);
    <span class="tok-kw">const</span> cam_vp: Mat = <span class="tok-fn">mulMat</span>(cam_proj, cam_view);

    <span class="tok-comment">// The marcher's ray basis, from the same eye/target the VP uses.</span>
    <span class="tok-comment">// (zm.cross is Vec4-wide, zmath heritage - ride w = 0 through it.)</span>
    <span class="tok-kw">const</span> fwd3: Vec = <span class="tok-fn">normalize</span>(cam_target - cam_eye);
    <span class="tok-kw">const</span> right3: Vec = <span class="tok-fn">normalize</span>(<span class="tok-fn">cross</span>(fwd3, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>)));
    <span class="tok-kw">const</span> up3: Vec = <span class="tok-fn">normalize</span>(<span class="tok-fn">cross</span>(right3, fwd3));

    <span class="tok-kw">var</span> march_io: march_fs.Io = undefined;
    march_io.u = .{
        .vp = cam_vp,
        .view_pos = .{ cam_eye[<span class="tok-num">0</span>], cam_eye[<span class="tok-num">1</span>], cam_eye[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .cam_right = .{ right3[<span class="tok-num">0</span>], right3[<span class="tok-num">1</span>], right3[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .cam_up = .{ up3[<span class="tok-num">0</span>], up3[<span class="tok-num">1</span>], up3[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .cam_fwd = .{ fwd3[<span class="tok-num">0</span>], fwd3[<span class="tok-num">1</span>], fwd3[<span class="tok-num">2</span>], <span class="tok-builtin">@tan</span>(fov_y * <span class="tok-num">0.5</span>) },
        .params = .{ aspect, t, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.march_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;march_io.u));

    <span class="tok-kw">for</span> (&amp;s.cubes, cube_colors, <span class="tok-num">0</span>..) |*obj, color, i| {
        <span class="tok-kw">const</span> c: [<span class="tok-num">3</span>]f32 = <span class="tok-fn">cubeCenter</span>(i, t);
        <span class="tok-kw">const</span> spin: Mat = <span class="tok-fn">rotationY</span>(t * <span class="tok-num">0.6</span> + <span class="tok-fn">float</span>(i));
        <span class="tok-kw">const</span> model: Mat = <span class="tok-fn">mulMat</span>(
            <span class="tok-fn">translation</span>(c[<span class="tok-num">0</span>], c[<span class="tok-num">1</span>], c[<span class="tok-num">2</span>]),
            <span class="tok-fn">mulMat</span>(spin, <span class="tok-fn">scaling</span>(<span class="tok-num">0.45</span>, <span class="tok-num">0.45</span>, <span class="tok-num">0.45</span>)),
        );
        <span class="tok-kw">var</span> vs_io: mat_vs.Io = undefined;
        vs_io.u = .{ .mvp = <span class="tok-fn">mulMat</span>(cam_vp, model), .model = model, .normal_matrix = spin };
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.vs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;vs_io.u));

        <span class="tok-kw">var</span> fs_io: cube_fs.Io = undefined;
        fs_io.u = .{
            .base_color = color,
            .view_pos = .{ cam_eye[<span class="tok-num">0</span>], cam_eye[<span class="tok-num">1</span>], cam_eye[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
            .light_dir = .{ sun_dir[<span class="tok-num">0</span>], sun_dir[<span class="tok-num">1</span>], sun_dir[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
            .fog_color = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> },
            .params = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
        };
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.fs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;fs_io.u));
    }

    <span class="tok-comment">// ---- ONE pass, two rendering methods, one depth buffer ----</span>
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.rt, bg_clear);
    <span class="tok-kw">const</span> pa: *z.PassState = f.gl.pass;
    <span class="tok-kw">if</span> (s.show_march) {
        Backend.<span class="tok-fn">setPipeline</span>(pa, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.march_pipeline });
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">0</span>, s.empty_bg);
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">1</span>, s.empty_bg);
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">2</span>, s.march_bg);
        z.render_pass.<span class="tok-fn">setVertexBuffer</span>(pa.pass, .{
            .slot = <span class="tok-num">0</span>,
            .buffer = s.quad_vbo,
            .offset = <span class="tok-num">0</span>,
            .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(fullscreen_verts)),
        });
        z.render_pass.<span class="tok-fn">draw</span>(pa.pass, .{
            .vertex_count = <span class="tok-num">6</span>,
            .instance_count = <span class="tok-num">1</span>,
            .first_vertex = <span class="tok-num">0</span>,
            .first_instance = <span class="tok-num">0</span>,
        });
    }
    <span class="tok-kw">if</span> (s.show_cubes) {
        Backend.<span class="tok-fn">setPipeline</span>(pa, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.cube_pipeline });
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">1</span>, s.empty_bg);
        z.render_pass.<span class="tok-fn">setVertexBuffer</span>(pa.pass, .{
            .slot = <span class="tok-num">0</span>,
            .buffer = s.cube_vbo,
            .offset = <span class="tok-num">0</span>,
            .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_verts)),
        });
        z.render_pass.<span class="tok-fn">setIndexBuffer</span>(pa.pass, .{
            .buffer = s.cube_ibo,
            .format = .uint32,
            .offset = <span class="tok-num">0</span>,
            .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_indices)),
        });
        <span class="tok-kw">for</span> (&amp;s.cubes) |*obj| {
            Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">0</span>, obj.g0_bg);
            Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">2</span>, obj.g2_bg);
            z.render_pass.<span class="tok-fn">drawIndexed</span>(pa.pass, .{
                .index_count = cube_indices.len,
                .instance_count = <span class="tok-num">1</span>,
                .first_index = <span class="tok-num">0</span>,
                .base_vertex = <span class="tok-num">0</span>,
                .first_instance = <span class="tok-num">0</span>,
            });
        }
    }
    z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);

    <span class="tok-comment">// SCREEN PASS: open once, composite, then UI.</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, bg_clear);
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh }, s.rt.<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">300</span>, vw - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">120</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">112</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"hybrid"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"raymarched blobs"</span>, &amp;s.show_march);
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"raster cubes"</span>, &amp;s.show_cubes);
    }
    <span class="tok-fn">handleInput</span>(f, s, u.<span class="tok-fn">wantCaptureMouse</span>());
    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - hybrid raster + raymarch (shared depth)"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Renders offscreen before the screen opens (tile-based-GPU safe); owns</span>
    <span class="tok-comment">// its own begin/endDrawing.</span>
    .manages_own_frame = true,
    .memory = .managed,
};

<figure class="code src-file" data-path="examples/hybrid_render/native_verify.zig" data-lines="121"><figcaption><span>examples/hybrid_render/native_verify.zig</span><span>121 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! native_verify - render the hybrid example's raymarched scene on the</span>
<span class="tok-comment">//! CPU through the same `shaderMain` the wasm compiles to WGSL, dump</span>
<span class="tok-comment">//! `hybrid_verify.png`, and assert the three visual populations exist:</span>
<span class="tok-comment">//! sky, checkerboard floor (two distinct grays), and hot metaball</span>
<span class="tok-comment">//! pixels.  `zig build hybrid-render-verify`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! (The CPU rasterizer reads the FS's `final_color` and ignores its</span>
<span class="tok-comment">//! `frag_depth` - depth agreement with raster geometry is exercised on</span>
<span class="tok-comment">//! the GPU; this harness verifies the marcher LOOKS right first.)</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> cross = zm.cross;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> normalize = zm.normalize;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-kw">const</span> quad_vs = z.deferred_shaders.shading_vs;
<span class="tok-kw">const</span> march_fs = z.hybrid_raymarch_shader;

<span class="tok-kw">const</span> img_w: usize = <span class="tok-num">320</span>;
<span class="tok-kw">const</span> img_h: usize = <span class="tok-num">220</span>;
<span class="tok-kw">const</span> fov_y: f32 = <span class="tok-num">0.9</span>;

<span class="tok-kw">const</span> quad_positions = [_][<span class="tok-num">2</span>]f32{
    .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> },
    .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> }, .{ <span class="tok-num">1</span>, <span class="tok-num">1</span> },  .{ -<span class="tok-num">1</span>, <span class="tok-num">1</span> },
};
<span class="tok-kw">const</span> quad_indices = [_]u32{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span>, <span class="tok-num">4</span>, <span class="tok-num">5</span> };

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">main</span>() !void {
    <span class="tok-kw">const</span> gpa: Allocator = std.heap.page_allocator;
    <span class="tok-kw">var</span> io_threaded: std.Io.Threaded = .<span class="tok-fn">init</span>(gpa, .{});
    <span class="tok-kw">defer</span> io_threaded.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">const</span> io: std.Io = io_threaded.<span class="tok-fn">io</span>();

    <span class="tok-comment">// The example's camera at a frozen, photogenic instant.</span>
    <span class="tok-kw">const</span> t: f32 = <span class="tok-num">1.4</span>;
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">4.6</span>, <span class="tok-num">3.2</span>, <span class="tok-num">4.6</span>);
    <span class="tok-kw">const</span> cam_target: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> aspect: f32 = <span class="tok-fn">float</span>(img_w) / <span class="tok-fn">float</span>(img_h);
    <span class="tok-kw">const</span> view: zm.Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, cam_target, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> proj: zm.Mat = <span class="tok-fn">perspectiveFovRh</span>(fov_y, aspect, <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>);
    <span class="tok-kw">const</span> vp: zm.Mat = <span class="tok-fn">mulMat</span>(proj, view);
    <span class="tok-kw">const</span> fwd: Vec = <span class="tok-fn">normalize</span>(cam_target - cam_eye);
    <span class="tok-kw">const</span> right: Vec = <span class="tok-fn">normalize</span>(<span class="tok-fn">cross</span>(fwd, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>)));
    <span class="tok-kw">const</span> up: Vec = <span class="tok-fn">normalize</span>(<span class="tok-fn">cross</span>(right, fwd));

    <span class="tok-kw">var</span> outs: [<span class="tok-num">6</span>]quad_vs.Out = undefined;
    <span class="tok-kw">var</span> vio: quad_vs.Io = undefined;
    <span class="tok-kw">for</span> (quad_positions, &amp;outs) |p, *o| {
        vio.vertex_ndc_pos = .{ p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>] };
        o.* = quad_vs.<span class="tok-fn">shaderMain</span>(vio);
    }

    <span class="tok-kw">var</span> fio: march_fs.Io = undefined;
    fio.u = .{
        .vp = vp,
        .view_pos = .{ cam_eye[<span class="tok-num">0</span>], cam_eye[<span class="tok-num">1</span>], cam_eye[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .cam_right = .{ right[<span class="tok-num">0</span>], right[<span class="tok-num">1</span>], right[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .cam_up = .{ up[<span class="tok-num">0</span>], up[<span class="tok-num">1</span>], up[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        .cam_fwd = .{ fwd[<span class="tok-num">0</span>], fwd[<span class="tok-num">1</span>], fwd[<span class="tok-num">2</span>], <span class="tok-builtin">@tan</span>(fov_y * <span class="tok-num">0.5</span>) },
        .params = .{ aspect, t, <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    };
    <span class="tok-kw">const</span> connect: <span class="tok-kw">fn</span> (quad_vs.Out, *march_fs.Io) void = z.shader.<span class="tok-fn">autoConnect</span>(quad_vs.Out, march_fs.Io);
    <span class="tok-kw">const</span> img: [img_w * img_h][<span class="tok-num">4</span>]u8 = z.raster_shader.<span class="tok-fn">rasterizeToImage</span>(
        quad_vs,
        march_fs,
        img_w,
        img_h,
        &amp;outs,
        &amp;quad_indices,
        fio,
        connect,
        .{ .front_face = .none, .depth_test = false },
        .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">255</span> },
    );

    <span class="tok-comment">// ---- census: sky / two floor grays / hot blob pixels ----</span>
    <span class="tok-kw">var</span> sky: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> floor_light: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> floor_dark: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> blob: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (img) |px| {
        <span class="tok-kw">const</span> r: i32 = px[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> g: i32 = px[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> b: i32 = px[<span class="tok-num">2</span>];
        <span class="tok-comment">// Order matters: the floor carries a slight blue tint (b = r+7),</span>
        <span class="tok-comment">// so the near-gray tests must run BEFORE the sky test or the</span>
        <span class="tok-comment">// sky bucket eats the whole floor (ask us how we know).</span>
        <span class="tok-kw">if</span> (r &gt; <span class="tok-num">150</span> <span class="tok-kw">and</span> r &gt; g + <span class="tok-num">40</span> <span class="tok-kw">and</span> g &gt; b) {
            blob += <span class="tok-num">1</span>; <span class="tok-comment">// molten orange: r &gt;&gt; g &gt; b</span>
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(r - g) &lt; <span class="tok-num">12</span> <span class="tok-kw">and</span> b - r &lt; <span class="tok-num">20</span> <span class="tok-kw">and</span> r &gt; <span class="tok-num">140</span>) {
            floor_light += <span class="tok-num">1</span>; <span class="tok-comment">// light checker square (near-gray)</span>
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(r - g) &lt; <span class="tok-num">12</span> <span class="tok-kw">and</span> b - r &lt; <span class="tok-num">20</span> <span class="tok-kw">and</span> r &gt; <span class="tok-num">60</span> <span class="tok-kw">and</span> r &lt; <span class="tok-num">130</span>) {
            floor_dark += <span class="tok-num">1</span>; <span class="tok-comment">// dark checker square</span>
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (b &gt; r + <span class="tok-num">20</span> <span class="tok-kw">and</span> b &gt; <span class="tok-num">90</span>) {
            sky += <span class="tok-num">1</span>; <span class="tok-comment">// STRONGLY blue gradient</span>
        }
    }
    std.debug.<span class="tok-fn">print</span>(
        <span class="tok-str">"hybrid_verify: sky {d}, floor light {d}, floor dark {d}, blob {d} (all must be &gt;0)\n"</span>,
        .{ sky, floor_light, floor_dark, blob },
    );

    <span class="tok-kw">const</span> png: []u8 = <span class="tok-kw">try</span> z.codecs.png.<span class="tok-fn">encode</span>(gpa, std.mem.<span class="tok-fn">sliceAsBytes</span>(img[<span class="tok-num">0</span>..]), img_w, img_h);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(png);
    <span class="tok-kw">try</span> std.Io.Dir.<span class="tok-fn">cwd</span>().<span class="tok-fn">writeFile</span>(io, .{ .sub_path = <span class="tok-str">"hybrid_verify.png"</span>, .data = png });
    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"  wrote hybrid_verify.png\n"</span>, .{});

    <span class="tok-kw">if</span> (sky == <span class="tok-num">0</span> <span class="tok-kw">or</span> floor_light == <span class="tok-num">0</span> <span class="tok-kw">or</span> floor_dark == <span class="tok-num">0</span> <span class="tok-kw">or</span> blob == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> <span class="tok-kw">error</span>.HybridLookWrong;
    }
    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"  OK\n"</span>, .{});
}
