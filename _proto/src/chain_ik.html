<h1>chain_ik</h1>
<figure class="code src-file" data-path="examples/chain_ik/chain_ik.zig" data-lines="306"><figcaption><span>examples/chain_ik/chain_ik.zig</span><span>306 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! chain_ik - ten joints for a two-joint job.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A ten-link chain, base pinned, tip chasing a target. The task needs two numbers; the chain</span>
<span class="tok-comment">//! has ten. **The eight left over are the null space**, and what a solver does with them is</span>
<span class="tok-comment">//! usually invisible - in a six-DOF arm a badly conditioned step looks like a small twitch. In a</span>
<span class="tok-comment">//! ten-link chain it looks like the whole thing being flung.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** DRAG THE DAMPING SLIDER, ESPECIALLY NEAR FULL STRETCH --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Damped least squares solves `dq = J^T(J*J^T + lambda^2I)^-1*e`. Near a singularity - the chain</span>
<span class="tok-comment">//! straight out, or folded back - `J*J^T` is ill-conditioned, and a small `lambda` asks for enormous</span>
<span class="tok-comment">//! joint motion to buy a tiny tip motion. Measured across a sweep that crosses the reachable</span>
<span class="tok-comment">//! boundary twice:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!     damping   worst tip error   peak |dq| in one solve</span>
<span class="tok-comment">//!       0.001          0.98 mm            100.07 rad</span>
<span class="tok-comment">//!       0.010          0.89 mm             38.83 rad</span>
<span class="tok-comment">//!       0.050          0.93 mm             11.57 rad</span>
<span class="tok-comment">//!       0.300          1.00 mm              0.75 rad</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! *** **THE ACCURACY IS THE SAME AND THE MOTION SPANS 133x.** A hundred radians in one solve is</span>
<span class="tok-comment">//! sixteen full revolutions of a joint to move a tip by a millimetre. That is the trade damping</span>
<span class="tok-comment">//! makes, and inside the workspace it costs nothing at all.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * AND ZERO DAMPING IS NOT THE NAIVE SOLVER, IT IS NO SOLVER --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! At `lambda = 0` this chain does not move: peak `|dq|` measured **0.000**. `ctl.Ik` declines a</span>
<span class="tok-comment">//! singular solve rather than diverging, which is the right call and means the textbook</span>
<span class="tok-comment">//! "undamped versus damped" comparison is not available here. The honest one is between a</span>
<span class="tok-comment">//! damping too small to condition the problem and one that does - which is the table above.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);

<span class="tok-kw">const</span> rmj = z.robot_mjcf;

<span class="tok-kw">const</span> background: Color = .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> link_colour: Color = .{ .r = <span class="tok-num">148</span>, .g = <span class="tok-num">156</span>, .b = <span class="tok-num">172</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> joint_colour: Color = .{ .r = <span class="tok-num">107</span>, .g = <span class="tok-num">158</span>, .b = <span class="tok-num">219</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> tip_ok: Color = .{ .r = <span class="tok-num">89</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">153</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> tip_far: Color = .{ .r = <span class="tok-num">226</span>, .g = <span class="tok-num">106</span>, .b = <span class="tok-num">154</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    doc: z.codecs.xml.Document,

    previous: []f32,

    damping: f32,
    <span class="tok-comment">/// Where the tip is being sent, in polar terms so a phone can drive it.</span>
    target_radius: f32,
    target_angle: f32,

<span class="tok-kw">fn</span> <span class="tok-fn">targetAt</span>(s: *<span class="tok-kw">const</span> State) Vec {
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(s.target_radius * <span class="tok-builtin">@cos</span>(s.target_angle), <span class="tok-num">0</span>, s.target_radius * <span class="tok-builtin">@sin</span>(s.target_angle));
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.gpa = gpa;
    s.doc = <span class="tok-kw">try</span> z.codecs.xml.<span class="tok-fn">parse</span>(gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"chain.xml"</span>), null);
    s.robot = <span class="tok-kw">try</span> mjcf.<span class="tok-fn">readRobot</span>(gpa, &amp;s.doc);
    s.imported = <span class="tok-kw">try</span> rmj.<span class="tok-fn">build</span>(gpa, &amp;s.robot, .{
        .max_contacts = <span class="tok-num">4</span>,
        .timestep = <span class="tok-num">1.0</span> / <span class="tok-num">240.0</span>,
        .gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
    });
    s.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);
    rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);

    s.tip = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"tip"</span>) <span class="tok-kw">orelse</span> <span class="tok-num">0</span>;
    s.actuation = <span class="tok-kw">try</span> ctl.<span class="tok-fn">limbActuation</span>(gpa, &amp;s.imported.model, s.tip);
    s.ik_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, ctl.Ik.<span class="tok-fn">scratchSize</span>(&amp;s.imported.model));
    s.previous = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.imported.model.nq);

    s.damping = <span class="tok-num">0.05</span>;
    s.target_radius = <span class="tok-num">2.0</span>;
    s.target_angle = <span class="tok-num">0.6</span>;
    s.auto_sweep = true;
    s.sweep_phase = <span class="tok-num">0</span>;
    s.tip_error = <span class="tok-num">0</span>;
    s.last_step = <span class="tok-num">0</span>;
    s.peak_step = <span class="tok-num">0</span>;
    s.reached = false;

    s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-num">8.5</span>);
    s.font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font);
    s.cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    s.sphere = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">14</span>, <span class="tok-num">12</span>);
    s.cylinder = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCylinder</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">12</span>, <span class="tok-num">2</span>);
    s.transform = .{<span class="tok-fn">identity</span>()};
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cylinder);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.sphere);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cube);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.previous);
    gpa.<span class="tok-fn">free</span>(s.ik_scratch);
    s.actuation.<span class="tok-fn">deinit</span>();
    s.data.<span class="tok-fn">deinit</span>();
    s.imported.<span class="tok-fn">deinit</span>();
    s.robot.<span class="tok-fn">deinit</span>();
    s.doc.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">const</span> captured: bool = <span class="tok-fn">drawPanel</span>(u, s, f.window.<span class="tok-fn">widthf</span>(), f.window.<span class="tok-fn">heightf</span>());

    <span class="tok-kw">const</span> model: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">if</span> (s.auto_sweep) {
        <span class="tok-comment">// * THE SWEEP CROSSES THE REACHABLE BOUNDARY AND COMES BACK, because the boundary is</span>
        <span class="tok-comment">// where the conditioning shows. A path that stays comfortably inside proves nothing.</span>
        s.sweep_phase += f.time.delta_time * <span class="tok-num">0.25</span>;
        s.target_radius = <span class="tok-num">1.0</span> + <span class="tok-num">2.4</span> * <span class="tok-builtin">@abs</span>(<span class="tok-builtin">@sin</span>(s.sweep_phase));
        s.target_angle = <span class="tok-num">0.6</span> * <span class="tok-builtin">@sin</span>(s.sweep_phase * <span class="tok-num">6.0</span>);
    }

    <span class="tok-builtin">@memcpy</span>(s.previous, s.data.pos);
    <span class="tok-kw">const</span> result: ctl.Ik.Result = (ctl.Ik{
        .max_iterations = <span class="tok-num">12</span>,
        .damping = s.damping,
        <span class="tok-comment">// * DELIBERATELY LOOSE. A tight `max_step` clamps away the very divergence this example</span>
        <span class="tok-comment">// exists to show, and the comparison would prove nothing.</span>
        .max_step = <span class="tok-num">100.0</span>,
    }).<span class="tok-fn">solve</span>(
        model,
        &amp;s.data,
        s.actuation,
        .{ .body = s.tip, .offset = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .goal = <span class="tok-fn">targetAt</span>(s) },
        s.ik_scratch,
    );
    s.tip_error = result.error_distance;
    s.reached = result.reached;

    <span class="tok-kw">var</span> moved: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..model.nq) |q| {
        moved = <span class="tok-builtin">@max</span>(moved, <span class="tok-builtin">@abs</span>(s.data.pos[q] - s.previous[q]));
    }
    s.last_step = moved;
    s.peak_step = <span class="tok-builtin">@max</span>(s.peak_step, moved);

    z.<span class="tok-fn">clearViewport</span>(f, background);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, captured, .{ .min_distance = <span class="tok-num">4.0</span>, .max_distance = <span class="tok-num">20.0</span> });
    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    z.<span class="tok-fn">drawGrid</span>(gl, <span class="tok-num">14</span>, <span class="tok-num">0.5</span>);
    <span class="tok-fn">drawChain</span>(s, gl);
    z.<span class="tok-fn">endMode3D</span>(gl);
}

<span class="tok-comment">/// The chain lives in the model's x-z plane; the renderer is Y-up, so z maps to depth.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">toRender</span>(at: Vec) Vec {
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(at[<span class="tok-num">0</span>], at[<span class="tok-num">2</span>], <span class="tok-num">0</span>);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawChain</span>(s: *State, gl: *z.WgpuGl) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;

    <span class="tok-comment">// The reachable circle, so "at full stretch" is something you can see rather than infer.</span>
    <span class="tok-kw">var</span> previous_edge: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">3.0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (i &lt;= <span class="tok-num">72</span>) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> a: f32 = <span class="tok-num">2.0</span> * pi * <span class="tok-fn">float</span>(i) / <span class="tok-num">72.0</span>;
        <span class="tok-kw">const</span> edge: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">3.0</span> * <span class="tok-builtin">@cos</span>(a), <span class="tok-num">3.0</span> * <span class="tok-builtin">@sin</span>(a), <span class="tok-num">0</span>);
        z.<span class="tok-fn">drawLine3D</span>(gl, previous_edge, edge, reach_colour);
        previous_edge = edge;
    }

    <span class="tok-comment">// Links, drawn from each body's own frame so what is shown is what the solver produced.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..m.nbody) |b| {
        <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">toRender</span>(s.data.body_xpos[b]);
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(at[<span class="tok-num">0</span>], at[<span class="tok-num">1</span>], at[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.09</span>, <span class="tok-num">0.09</span>, <span class="tok-num">0.09</span>));
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, joint_colour);
        <span class="tok-kw">const</span> parent: u32 = m.body_parent[b];
        <span class="tok-kw">if</span> (parent != rbt.world_body) {
            z.<span class="tok-fn">drawLine3D</span>(gl, <span class="tok-fn">toRender</span>(s.data.body_xpos[parent]), at, link_colour);
        }
    }

    <span class="tok-kw">const</span> tip_at: Vec = <span class="tok-fn">toRender</span>(s.data.body_xpos[s.tip]);
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(tip_at[<span class="tok-num">0</span>], tip_at[<span class="tok-num">1</span>], tip_at[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.14</span>, <span class="tok-num">0.14</span>, <span class="tok-num">0.14</span>));
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, <span class="tok-kw">if</span> (s.reached) tip_ok <span class="tok-kw">else</span> tip_far);

    <span class="tok-kw">const</span> goal: Vec = <span class="tok-fn">toRender</span>(<span class="tok-fn">targetAt</span>(s));
    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(<span class="tok-fn">translation</span>(goal[<span class="tok-num">0</span>], goal[<span class="tok-num">1</span>], goal[<span class="tok-num">2</span>]), <span class="tok-fn">scaling</span>(<span class="tok-num">0.1</span>, <span class="tok-num">0.1</span>, <span class="tok-num">0.1</span>));
    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, target_colour);
    z.<span class="tok-fn">drawLine3D</span>(gl, tip_at, goal, target_colour);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(u: ui.Ui, s: *State, viewport_w: f32, viewport_h: f32) bool {
    <span class="tok-comment">// * THE HEIGHT IS NO LONGER NEEDED: the window sizes to its content, so nothing here has to</span>
    <span class="tok-comment">// know how tall the viewport is. Kept in the signature because every example shares it.</span>
    _ = viewport_h;
    <span class="tok-kw">const</span> captured: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    <span class="tok-kw">const</span> narrow: bool = ui.Ui.<span class="tok-fn">isNarrow</span>(viewport_w);
    <span class="tok-comment">// * AUTO-SIZED, AND NARROW ON A PHONE. These panels asked for 70-80% of the viewport height,</span>
    <span class="tok-comment">// which on a phone left the thing the demo is ABOUT as a sliver at the bottom. Letting the</span>
    <span class="tok-comment">// window size to its content keeps it as small as it can be, and capping the width stops it</span>
    <span class="tok-comment">// spanning the screen.</span>
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-kw">if</span> (narrow) <span class="tok-builtin">@min</span>(viewport_w - <span class="tok-num">16</span>, <span class="tok-num">340.0</span>) <span class="tok-kw">else</span> <span class="tok-builtin">@min</span>(<span class="tok-num">380.0</span>, viewport_w * <span class="tok-num">0.32</span>);

    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">0</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"ten joints for a two-joint job"</span>, .{ .flags = .{ .always_auto_resize = true } })) |window| {
        <span class="tok-kw">defer</span> window.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"tip error {d:&gt;8.5} m   {s}"</span>, .{
            s.tip_error,
            <span class="tok-kw">if</span> (s.reached) <span class="tok-str">"reached"</span> <span class="tok-kw">else</span> <span class="tok-str">"OUT OF REACH"</span>,
        });
        <span class="tok-comment">// * THE JOINT STEP IS THE MEASUREMENT. Tracking accuracy barely moves with damping;</span>
        <span class="tok-comment">// this spans a factor of 133.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"joint step {d:&gt;8.3} rad  (peak {d:&gt;7.2})"</span>, .{ s.last_step, s.peak_step });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"clear peak"</span>, .{})) {
            s.peak_step = <span class="tok-num">0</span>;
        }
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"damping"</span>, &amp;s.damping, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">0.4</span>, .fmt = <span class="tok-str">"{d:.3}"</span> });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"0.001 -&gt; 100 rad steps; 0.30 -&gt; 0.75"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"accuracy is the same either way"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"0.000 does not solve at all — Ik declines"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  a singular system rather than diverging"</span>, .{});
        u.<span class="tok-fn">separator</span>();

        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"sweep across the reach boundary"</span>, &amp;s.auto_sweep);
        <span class="tok-kw">if</span> (!s.auto_sweep) {
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"target radius"</span>, &amp;s.target_radius, .{ .min = <span class="tok-num">0.2</span>, .max = <span class="tok-num">3.6</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"target angle"</span>, &amp;s.target_angle, .{ .min = -<span class="tok-num">3.0</span>, .max = <span class="tok-num">3.0</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        }
        u.<span class="tok-fn">text</span>(<span class="tok-str">"reach is 3.0 m — push past it and watch"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  the chain straighten into a singularity"</span>, .{});
    }
    <span class="tok-kw">return</span> captured;
}

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - ten joints for a two-joint job"</span>,
            .width = <span class="tok-num">900</span>,
            .height = <span class="tok-num">640</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
