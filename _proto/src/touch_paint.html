<h1>touch_paint</h1>
<figure class="code src-file" data-path="examples/touch_paint/touch_paint.zig" data-lines="183"><figcaption><span>examples/touch_paint/touch_paint.zig</span><span>183 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/touch_paint.zig</span>
<span class="tok-comment">// Each touch leaves a colored trail.  Touch ID maps deterministically</span>
<span class="tok-comment">// to a colour so multi-touch gives a rainbow finger-paint effect.</span>
<span class="tok-comment">// Validates the `input.getTouchPosition/Count/PointId` primitives</span>
<span class="tok-comment">// from Steps 23-25 end-to-end.  On desktop without a touch device,</span>
<span class="tok-comment">// you'll see an empty canvas with the HUD only - that's expected.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> allocPrint = std.fmt.allocPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Color = zm.Color;

<span class="tok-kw">const</span> trail_len: usize = <span class="tok-num">200</span>;
<span class="tok-kw">const</span> max_trails: usize = <span class="tok-num">10</span>;

<span class="tok-comment">/// One per-finger trail - a ring buffer of past positions.  We</span>
<span class="tok-comment">/// can't store an arbitrary growing list per frame because we</span>
<span class="tok-comment">/// can't pre-allocate inside `update`; the ring is fixed-size.</span>
<span class="tok-kw">const</span> Trail = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// Browser-assigned touch id this trail belongs to.  -1 = empty.</span>
    id: i32 = -<span class="tok-num">1</span>,
    points: [trail_len]Vec2 = <span class="tok-builtin">@splat</span>(.{ <span class="tok-num">0</span>, <span class="tok-num">0</span> }),
    head: usize = <span class="tok-num">0</span>,
    count: usize = <span class="tok-num">0</span>,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    scratch: std.heap.ArenaAllocator,
    frame_count: usize = <span class="tok-num">0</span>,
    trails: [max_trails]Trail = <span class="tok-builtin">@splat</span>(.{}),
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.scratch.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">32</span>);
    s.* = .{ .font = font, .scratch = std.heap.ArenaAllocator.<span class="tok-fn">init</span>(gpa) };
}

<span class="tok-comment">/// Map a touch ID to a stable color from a small palette.  Same</span>
<span class="tok-comment">/// finger always gets the same color even if it lifts and reattaches.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">colorForId</span>(id: i32) Color {
    <span class="tok-kw">const</span> palette: [<span class="tok-num">8</span>]Color = .{
        z.colors.sky_400,
        z.colors.pink_400,
        z.colors.amber_400,
        z.colors.green_400,
        z.colors.violet_400,
        z.colors.red_400,
        z.colors.emerald_400,
        z.colors.rose_400,
    };
    <span class="tok-kw">const</span> idx: usize = <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@mod</span>(id, <span class="tok-builtin">@as</span>(i32, palette.len)));
    <span class="tok-kw">return</span> palette[idx];
}

<span class="tok-kw">fn</span> <span class="tok-fn">pushPoint</span>(trail: *Trail, p: Vec2) void {
    trail.points[trail.head] = p;
    trail.head = (trail.head + <span class="tok-num">1</span>) % trail_len;
    <span class="tok-kw">if</span> (trail.count &lt; trail_len) {
        trail.count += <span class="tok-num">1</span>;
    }
}

<span class="tok-comment">/// Find or allocate a trail for `id`.  Returns null if no slot</span>
<span class="tok-comment">/// available (shouldn't happen since trails.len == MAX_TOUCH_POINTS).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">trailFor</span>(state: *State, id: i32) ?*Trail {
    <span class="tok-comment">// Existing trail for this id?</span>
    <span class="tok-kw">for</span> (&amp;state.trails) |*t| {
        <span class="tok-kw">if</span> (t.id == id) {
            <span class="tok-kw">return</span> t;
        }
    }
    <span class="tok-comment">// Free slot?</span>
    <span class="tok-kw">for</span> (&amp;state.trails) |*t| {
        <span class="tok-kw">if</span> (t.id == -<span class="tok-num">1</span>) {
            t.* = .{ .id = id };
            <span class="tok-kw">return</span> t;
        }
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    _ = state.scratch.<span class="tok-fn">reset</span>(.retain_capacity);
    state.frame_count += <span class="tok-num">1</span>;

    <span class="tok-comment">// Build a set of currently-active touch ids so we can prune</span>
    <span class="tok-comment">// trails whose finger has lifted.</span>
    <span class="tok-kw">const</span> count: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">var</span> active_ids: [max_trails]i32 = <span class="tok-builtin">@splat</span>(-<span class="tok-num">1</span>);
    <span class="tok-kw">var</span> ai: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> i: i32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-comment">// wgpu touch API is slot-based (no stable getTouchPointId); use the</span>
        <span class="tok-comment">// slot index as the trail id. Trails follow slots, not fingers across sessions.</span>
        <span class="tok-kw">const</span> id: i32 = i;
        <span class="tok-kw">const</span> pos: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, i);
        <span class="tok-kw">if</span> (<span class="tok-fn">trailFor</span>(state, id)) |t| {
            <span class="tok-fn">pushPoint</span>(t, .{ pos[<span class="tok-num">0</span>], pos[<span class="tok-num">1</span>] });
        }
        <span class="tok-kw">if</span> (ai &lt; active_ids.len) {
            active_ids[ai] = id;
            ai += <span class="tok-num">1</span>;
        }
    }

    <span class="tok-comment">// Drop trails whose finger lifted (clear the slot).</span>
    <span class="tok-kw">for</span> (&amp;state.trails) |*t| {
        <span class="tok-kw">if</span> (t.id == -<span class="tok-num">1</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">var</span> found: bool = false;
        <span class="tok-kw">for</span> (active_ids[<span class="tok-num">0</span>..ai]) |aid| {
            <span class="tok-kw">if</span> (aid == t.id) {
                found = true;
                <span class="tok-kw">break</span>;
            }
        }
        <span class="tok-kw">if</span> (!found) {
            t.* = .{};
        }
    }

    <span class="tok-comment">// ---- Render ----</span>
    z.<span class="tok-fn">clearViewport</span>(f, z.colors.slate_950);

    <span class="tok-comment">// Draw each trail as a series of fading dots.</span>
    <span class="tok-kw">for</span> (state.trails) |t| {
        <span class="tok-kw">if</span> (t.id == -<span class="tok-num">1</span>) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> col: Color = <span class="tok-fn">colorForId</span>(t.id);
        <span class="tok-kw">var</span> k: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (k &lt; t.count) : (k += <span class="tok-num">1</span>) {
            <span class="tok-comment">// age 0 = newest, age (count-1) = oldest.</span>
            <span class="tok-kw">const</span> age: usize = (trail_len + t.head - <span class="tok-num">1</span> - k) % trail_len;
            <span class="tok-kw">const</span> idx_in_buffer: usize = (trail_len + t.head - <span class="tok-num">1</span> - k) % trail_len;
            _ = age;
            <span class="tok-kw">const</span> p: Vec2 = t.points[idx_in_buffer];
            <span class="tok-kw">const</span> fade: f32 = <span class="tok-num">1.0</span> - <span class="tok-fn">float</span>(k) / <span class="tok-fn">float</span>(t.count);
            <span class="tok-kw">const</span> radius: f32 = <span class="tok-num">8.0</span> * fade;
            f.gl.<span class="tok-fn">circle</span>(p, radius, .{ .color = col, .segments = <span class="tok-num">16</span> });
        }
    }

    <span class="tok-comment">// HUD</span>
    <span class="tok-kw">const</span> hud: []u8 = <span class="tok-fn">allocPrint</span>(
        state.scratch.<span class="tok-fn">allocator</span>(),
        <span class="tok-str">"touches: {d} / max {d}    frame {d}"</span>,
        .{ count, max_trails, state.frame_count },
    ) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">10</span>, <span class="tok-num">10</span> }, hud, .{ .size = <span class="tok-num">18</span>, .color = z.colors.slate_300, .font = &amp;state.font });
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">10</span>, <span class="tok-num">32</span> },
        <span class="tok-str">"Touch the canvas to paint."</span>,
        .{ .size = <span class="tok-num">14</span>, .color = z.colors.slate_500, .font = &amp;state.font },
    );
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - touch paint"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">450</span>,
            .scale_mode = .responsive,
            .depth_format = null,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
