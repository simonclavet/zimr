<figure class="code src-file" data-path="examples/shadowmap_sw/native_verify.zig" data-lines="114"><figcaption><span>examples/shadowmap_sw/native_verify.zig</span><span>114 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! native_verify - the shadow-map side-by-side's NATIVE gate.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Builds `scene.bakeCorner` twice from the SAME function:</span>
<span class="tok-comment">//!   1. at COMPTIME (the const below) - building this exe IS the corner's</span>
<span class="tok-comment">//!      compile-time-budget gate, and exactly what the wasm app embeds;</span>
<span class="tok-comment">//!   2. at RUNTIME in `main` - instant, and byte-compared against (1), a</span>
<span class="tok-comment">//!      differential that pins the compiler's evaluation of the whole</span>
<span class="tok-comment">//!      two-pass render to the runtime evaluation of the same code.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! It then sanity-checks the images (a real shadow map was written; the lit</span>
<span class="tok-comment">//! image contains both lit and shadowed regions) and dumps them as PNGs for</span>
<span class="tok-comment">//! eyeball verification: `zig build shadowmap-sw-verify`.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> scene = <span class="tok-builtin">@import</span>(<span class="tok-str">"scene.zig"</span>);
<span class="tok-kw">const</span> bunny_proxy = <span class="tok-builtin">@import</span>(<span class="tok-str">"bunny_proxy"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> float = zm.float;

<span class="tok-kw">const</span> sm_res: usize = <span class="tok-num">8</span>;
<span class="tok-kw">const</span> img_w: usize = <span class="tok-num">8</span>;
<span class="tok-kw">const</span> img_h: usize = <span class="tok-num">8</span>;

<span class="tok-comment">/// The comptime bake - the same dimensions the wasm app's corner uses.</span>
<span class="tok-kw">const</span> baked: scene.<span class="tok-fn">CornerBake</span>(sm_res, img_w, img_h) = blk: {
    <span class="tok-builtin">@setEvalBranchQuota</span>(<span class="tok-num">2_000_000_000</span>);
    <span class="tok-kw">break</span> :blk scene.<span class="tok-fn">bakeCorner</span>(sm_res, img_w, img_h);
};

<span class="tok-kw">fn</span> <span class="tok-fn">luminance</span>(c0: u8, c1: u8, c2: u8) f32 {
    <span class="tok-kw">return</span> <span class="tok-num">0.299</span> * <span class="tok-fn">float</span>(c0) + <span class="tok-num">0.587</span> * <span class="tok-fn">float</span>(c1) + <span class="tok-num">0.114</span> * <span class="tok-fn">float</span>(c2);
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">main</span>() !void {
    <span class="tok-kw">const</span> gpa: Allocator = std.heap.page_allocator;
    <span class="tok-kw">var</span> io_threaded: std.Io.Threaded = .<span class="tok-fn">init</span>(gpa, .{});
    <span class="tok-kw">defer</span> io_threaded.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">const</span> io: std.Io = io_threaded.<span class="tok-fn">io</span>();

    <span class="tok-comment">// ---- runtime evaluation of the SAME bake function ----</span>
    <span class="tok-kw">const</span> live: scene.<span class="tok-fn">CornerBake</span>(sm_res, img_w, img_h) = scene.<span class="tok-fn">bakeCorner</span>(sm_res, img_w, img_h);

    <span class="tok-comment">// ---- differential: comptime vs runtime, byte for byte ----</span>
    <span class="tok-kw">var</span> sm_diff: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (baked.shadow_map, live.shadow_map) |a, b| {
        <span class="tok-kw">if</span> (a != b) {
            sm_diff += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">var</span> img_diff: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (baked.image, live.image) |a, b| {
        <span class="tok-kw">if</span> (a != b) {
            img_diff += <span class="tok-num">1</span>;
        }
    }

    <span class="tok-comment">// ---- image sanity: geometry reached the map; shadows + light exist ----</span>
    <span class="tok-kw">var</span> min_red: u8 = <span class="tok-num">255</span>;
    <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; sm_res * sm_res) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">if</span> (baked.shadow_map[i * <span class="tok-num">4</span>] &lt; min_red) {
            min_red = baked.shadow_map[i * <span class="tok-num">4</span>];
        }
    }
    <span class="tok-kw">var</span> shadow_px: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> lit_px: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> j: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (j &lt; img_w * img_h) : (j += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> l: f32 = <span class="tok-fn">luminance</span>(baked.image[j * <span class="tok-num">4</span>], baked.image[j * <span class="tok-num">4</span> + <span class="tok-num">1</span>], baked.image[j * <span class="tok-num">4</span> + <span class="tok-num">2</span>]);
        <span class="tok-kw">if</span> (l &gt;= <span class="tok-num">25</span> <span class="tok-kw">and</span> l &lt;= <span class="tok-num">85</span>) {
            shadow_px += <span class="tok-num">1</span>;
        }
        <span class="tok-kw">if</span> (l &gt;= <span class="tok-num">120</span> <span class="tok-kw">and</span> l &lt;= <span class="tok-num">215</span>) {
            lit_px += <span class="tok-num">1</span>;
        }
    }

    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"shadowmap_sw corner: comptime bake vs runtime render of scene.bakeCorner\n"</span>, .{});
    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"  proxy {d} verts / {d} tris; shadow map {d}x{d}; image {d}x{d}\n"</span>, .{
        bunny_proxy.vertex_count,
        bunny_proxy.indices.len / <span class="tok-num">3</span>,
        sm_res,
        sm_res,
        img_w,
        img_h,
    });
    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"  differential: shadow-map bytes differing {d}, image bytes differing {d}\n"</span>, .{
        sm_diff,
        img_diff,
    });
    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"  shadow-map min red {d} (want &lt;240); lit-band {d} px, shadow-band {d} px (want &gt;0)\n"</span>, .{
        min_red,
        lit_px,
        shadow_px,
    });

    <span class="tok-kw">const</span> lit_png: []u8 = <span class="tok-kw">try</span> z.codecs.png.<span class="tok-fn">encode</span>(gpa, &amp;baked.image, img_w, img_h);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(lit_png);
    <span class="tok-kw">const</span> sm_png: []u8 = <span class="tok-kw">try</span> z.codecs.png.<span class="tok-fn">encode</span>(gpa, &amp;baked.shadow_map, sm_res, sm_res);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(sm_png);
    <span class="tok-kw">try</span> std.Io.Dir.<span class="tok-fn">cwd</span>().<span class="tok-fn">writeFile</span>(io, .{ .sub_path = <span class="tok-str">"corner_lit.png"</span>, .data = lit_png });
    <span class="tok-kw">try</span> std.Io.Dir.<span class="tok-fn">cwd</span>().<span class="tok-fn">writeFile</span>(io, .{ .sub_path = <span class="tok-str">"corner_shadowmap.png"</span>, .data = sm_png });
    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"  wrote corner_lit.png + corner_shadowmap.png\n"</span>, .{});

    <span class="tok-kw">if</span> (sm_diff != <span class="tok-num">0</span> <span class="tok-kw">or</span> img_diff != <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> <span class="tok-kw">error</span>.ComptimeRuntimeMismatch;
    }
    <span class="tok-kw">if</span> (min_red &gt;= <span class="tok-num">240</span> <span class="tok-kw">or</span> shadow_px == <span class="tok-num">0</span> <span class="tok-kw">or</span> lit_px == <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span> <span class="tok-kw">error</span>.CornerLooksWrong;
    }
    std.debug.<span class="tok-fn">print</span>(<span class="tok-str">"  OK\n"</span>, .{});
}
</code></pre></figure>
<figure class="code src-file" data-path="examples/shadowmap_sw/scene.zig" data-lines="481"><figcaption><span>examples/shadowmap_sw/scene.zig</span><span>481 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! scene.zig - THE shared scene of the shadow-map side-by-side.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Everything the three renderers must agree on lives in this one file:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * the GEOMETRY (floor quad, unit cube, and the bunny's placement frame),</span>
<span class="tok-comment">//!   * the ANIMATION (orbiting light, spinning objects - pure functions of t),</span>
<span class="tok-comment">//!   * the UNIFORM BLOCKS (built with the engine shaders' own `Ubo` types, so</span>
<span class="tok-comment">//!     every backend reads bit-identical uniform layouts), and</span>
<span class="tok-comment">//!   * the SOFTWARE TWO-PASS RENDER (vertex loops + per-object draws through</span>
<span class="tok-comment">//!     the REAL engine shaders `depth_vs/fs` + `lit_shadow_vs/fs`).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The GPU half of the app consumes the same geometry/animation/Ubo builders</span>
<span class="tok-comment">//! and runs the same four shader FILES via their WGSL build artifacts.  The</span>
<span class="tok-comment">//! CPU half calls `drawDepth`/`drawLit` per object over a `raster.Context`.</span>
<span class="tok-comment">//! The comptime corner calls `bakeCorner`, whose per-object draws go through</span>
<span class="tok-comment">//! `rasterizeToTarget` - same clear-once-draw-N pass shape, evaluated by the</span>
<span class="tok-comment">//! Zig compiler.  One scene, one animation, one shader source; three</span>
<span class="tok-comment">//! executors.</span>

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> proxy = <span class="tok-builtin">@import</span>(<span class="tok-str">"bunny_proxy"</span>);

<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> identity = zm.identity;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> normalize3 = zm.normalize3;
<span class="tok-kw">const</span> orthographicRh = zm.orthographicRh;
<span class="tok-kw">const</span> rotationY = zm.rotationY;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-comment">/// The engine shadow-shader quartet - the SAME four files the GPU compiles</span>
<span class="tok-comment">/// to WGSL, imported as callable Zig for the software targets.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> shadow = z.shadow_shaders;

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Geometry - position + normal, stride 24; shared verbatim with the GPU</span>
<span class="tok-comment">// vertex buffers (the app uploads these very arrays).</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> SceneVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    position: [<span class="tok-num">3</span>]f32,
    normal: [<span class="tok-num">3</span>]f32,
};

<span class="tok-kw">const</span> up_n: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> };
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> floor_half: f32 = <span class="tok-num">4.0</span>;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> floor_verts = [_]SceneVertex{
    .{ .position = .{ -floor_half, <span class="tok-num">0</span>, -floor_half }, .normal = up_n },
    .{ .position = .{ floor_half, <span class="tok-num">0</span>, -floor_half }, .normal = up_n },
    .{ .position = .{ floor_half, <span class="tok-num">0</span>, floor_half }, .normal = up_n },
    .{ .position = .{ -floor_half, <span class="tok-num">0</span>, floor_half }, .normal = up_n },
};
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> floor_indices = [_]u32{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">0</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span> };

<span class="tok-comment">/// Unit-ish cube (half-extent `cs`) with FLAT per-face normals - shadow</span>
<span class="tok-comment">/// mapping wants honest face normals.  Placements scale it per axis.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> cs: f32 = <span class="tok-num">0.7</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> cube_verts = [_]SceneVertex{
    .{ .position = .{ -cs, -cs, cs }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> } },
    .{ .position = .{ cs, -cs, cs }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> } },
    .{ .position = .{ cs, cs, cs }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> } },
    .{ .position = .{ -cs, cs, cs }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> } },
    .{ .position = .{ cs, -cs, -cs }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">1</span> } },
    .{ .position = .{ -cs, -cs, -cs }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">1</span> } },
    .{ .position = .{ -cs, cs, -cs }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">1</span> } },
    .{ .position = .{ cs, cs, -cs }, .normal = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">1</span> } },
    .{ .position = .{ cs, -cs, cs }, .normal = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ cs, -cs, -cs }, .normal = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ cs, cs, -cs }, .normal = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ cs, cs, cs }, .normal = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -cs, -cs, -cs }, .normal = .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -cs, -cs, cs }, .normal = .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -cs, cs, cs }, .normal = .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -cs, cs, -cs }, .normal = .{ -<span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -cs, cs, cs }, .normal = up_n },
    .{ .position = .{ cs, cs, cs }, .normal = up_n },
    .{ .position = .{ cs, cs, -cs }, .normal = up_n },
    .{ .position = .{ -cs, cs, -cs }, .normal = up_n },
    .{ .position = .{ -cs, -cs, -cs }, .normal = .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ cs, -cs, -cs }, .normal = .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ cs, -cs, cs }, .normal = .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span> } },
    .{ .position = .{ -cs, -cs, cs }, .normal = .{ <span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span> } },
};
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> cube_indices = [_]u32{
    <span class="tok-num">0</span>,  <span class="tok-num">1</span>,  <span class="tok-num">2</span>,  <span class="tok-num">0</span>,  <span class="tok-num">2</span>,  <span class="tok-num">3</span>,
    <span class="tok-num">4</span>,  <span class="tok-num">5</span>,  <span class="tok-num">6</span>,  <span class="tok-num">4</span>,  <span class="tok-num">6</span>,  <span class="tok-num">7</span>,
    <span class="tok-num">8</span>,  <span class="tok-num">9</span>,  <span class="tok-num">10</span>, <span class="tok-num">8</span>,  <span class="tok-num">10</span>, <span class="tok-num">11</span>,
    <span class="tok-num">12</span>, <span class="tok-num">13</span>, <span class="tok-num">14</span>, <span class="tok-num">12</span>, <span class="tok-num">14</span>, <span class="tok-num">15</span>,
    <span class="tok-num">16</span>, <span class="tok-num">17</span>, <span class="tok-num">18</span>, <span class="tok-num">16</span>, <span class="tok-num">18</span>, <span class="tok-num">19</span>,
    <span class="tok-num">20</span>, <span class="tok-num">21</span>, <span class="tok-num">22</span>, <span class="tok-num">20</span>, <span class="tok-num">22</span>, <span class="tok-num">23</span>,
};

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Staging + animation - pure functions of time, shared by all three</span>
<span class="tok-comment">// renderers (the corner freezes them at `corner_time`).</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-comment">/// The four drawables. The two cubes share the cube buffers; each object</span>
<span class="tok-comment">/// gets its own model matrix + color + (on the GPU) uniform buffers.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Object = <span class="tok-kw">enum</span> { floor, pillar, receiver, bunny };
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> objects = [_]Object{ .floor, .pillar, .receiver, .bunny };

<span class="tok-comment">/// Tall slim pillar beside the bunny: as the light orbits behind it, its</span>
<span class="tok-comment">/// shadow stripe sweeps ACROSS the bunny.  Low wide receiver on the other</span>
<span class="tok-comment">/// side: the bunny's silhouette lands on it half an orbit later.  The</span>
<span class="tok-comment">/// bunny's own ears self-shadow its back at grazing light angles.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> pillar_center: Vec3 = .{ <span class="tok-num">2.2</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.3</span> };
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> pillar_half: Vec3 = .{ <span class="tok-num">0.22</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.22</span> };
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> receiver_center: Vec3 = .{ -<span class="tok-num">2.3</span>, <span class="tok-num">0.5</span>, -<span class="tok-num">0.5</span> };
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> receiver_half: Vec3 = .{ <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span> };
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> bunny_spot: Vec3 = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.0</span>, <span class="tok-num">0.2</span> };
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> bunny_target_height: f32 = <span class="tok-num">2.0</span>;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">baseColor</span>(o: Object) [<span class="tok-num">4</span>]f32 {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (o) {
        .floor =&gt; .{ <span class="tok-num">0.80</span>, <span class="tok-num">0.80</span>, <span class="tok-num">0.86</span>, <span class="tok-num">1.0</span> },
        .pillar =&gt; .{ <span class="tok-num">0.55</span>, <span class="tok-num">0.70</span>, <span class="tok-num">0.88</span>, <span class="tok-num">1.0</span> },
        .receiver =&gt; .{ <span class="tok-num">0.62</span>, <span class="tok-num">0.84</span>, <span class="tok-num">0.62</span>, <span class="tok-num">1.0</span> },
        .bunny =&gt; .{ <span class="tok-num">0.87</span>, <span class="tok-num">0.72</span>, <span class="tok-num">0.53</span>, <span class="tok-num">1.0</span> },
    };
}

<span class="tok-comment">/// The bunny's normalization frame - computed from whichever bunny mesh a</span>
<span class="tok-comment">/// backend renders (the FULL 69k-tri OBJ live, the baked proxy at comptime),</span>
<span class="tok-comment">/// so the same placement math seats both identically.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> BunnyFrame = <span class="tok-kw">struct</span> {
    cx: f32,
    min_y: f32,
    cz: f32,
    scale: f32,
};

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">bunnyFrame</span>(mn: [<span class="tok-num">3</span>]f32, mx: [<span class="tok-num">3</span>]f32) BunnyFrame {
    <span class="tok-kw">return</span> .{
        .cx = (mn[<span class="tok-num">0</span>] + mx[<span class="tok-num">0</span>]) * <span class="tok-num">0.5</span>,
        .min_y = mn[<span class="tok-num">1</span>],
        .cz = (mn[<span class="tok-num">2</span>] + mx[<span class="tok-num">2</span>]) * <span class="tok-num">0.5</span>,
        .scale = bunny_target_height / <span class="tok-builtin">@max</span>(mx[<span class="tok-num">1</span>] - mn[<span class="tok-num">1</span>], <span class="tok-num">1.0e-4</span>),
    };
}

<span class="tok-comment">/// Per-object spin about Y (the "rotation" varyings tour: every object's</span>
<span class="tok-comment">/// normal matrix is live).  The floor stays put.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">spinAngle</span>(o: Object, t: f32) f32 {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (o) {
        .floor =&gt; <span class="tok-num">0.0</span>,
        .pillar =&gt; t * <span class="tok-num">0.9</span>,
        .receiver =&gt; -t * <span class="tok-num">0.7</span>,
        .bunny =&gt; t * <span class="tok-num">0.6</span>,
    };
}

<span class="tok-comment">/// Model matrix: place o spin o scale (cubes scale the unit cube to their</span>
<span class="tok-comment">/// half-extents; the bunny additionally re-centers its mesh frame first).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">modelMatrix</span>(o: Object, t: f32, bunny: BunnyFrame) Mat {
    <span class="tok-kw">const</span> spin: Mat = <span class="tok-fn">rotationY</span>(<span class="tok-fn">spinAngle</span>(o, t));
    <span class="tok-kw">switch</span> (o) {
        .floor =&gt; <span class="tok-kw">return</span> <span class="tok-fn">identity</span>(),
        .pillar, .receiver =&gt; {
            <span class="tok-kw">const</span> c: Vec3 = <span class="tok-kw">if</span> (o == .pillar) pillar_center <span class="tok-kw">else</span> receiver_center;
            <span class="tok-kw">const</span> h: Vec3 = <span class="tok-kw">if</span> (o == .pillar) pillar_half <span class="tok-kw">else</span> receiver_half;
            <span class="tok-kw">const</span> scale_it: Mat = <span class="tok-fn">scaling</span>(h[<span class="tok-num">0</span>] / cs, h[<span class="tok-num">1</span>] / cs, h[<span class="tok-num">2</span>] / cs);
            <span class="tok-kw">const</span> place_it: Mat = <span class="tok-fn">translation</span>(c[<span class="tok-num">0</span>], c[<span class="tok-num">1</span>], c[<span class="tok-num">2</span>]);
            <span class="tok-kw">return</span> <span class="tok-fn">mulMat</span>(place_it, <span class="tok-fn">mulMat</span>(spin, scale_it));
        },
        .bunny =&gt; {
            <span class="tok-kw">const</span> center_it: Mat = <span class="tok-fn">translation</span>(-bunny.cx, -bunny.min_y, -bunny.cz);
            <span class="tok-kw">const</span> scale_it: Mat = <span class="tok-fn">scaling</span>(bunny.scale, bunny.scale, bunny.scale);
            <span class="tok-kw">const</span> place_it: Mat = <span class="tok-fn">translation</span>(bunny_spot[<span class="tok-num">0</span>], bunny_spot[<span class="tok-num">1</span>], bunny_spot[<span class="tok-num">2</span>]);
            <span class="tok-kw">return</span> <span class="tok-fn">mulMat</span>(place_it, <span class="tok-fn">mulMat</span>(spin, <span class="tok-fn">mulMat</span>(scale_it, center_it)));
        },
    }
}

<span class="tok-comment">/// Normal matrix - the spin rotation alone.  Correct here even for the</span>
<span class="tok-comment">/// non-uniformly scaled cubes: their face normals are axis-aligned, and a</span>
<span class="tok-comment">/// diagonal scale preserves axis directions, so only the rotation matters.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">normalMatrix</span>(o: Object, t: f32) Mat {
    <span class="tok-kw">return</span> <span class="tok-fn">rotationY</span>(<span class="tok-fn">spinAngle</span>(o, t));
}

<span class="tok-comment">/// The directional light ORBITS the scene: shadows sweep continuously,</span>
<span class="tok-comment">/// the pillar stripe crosses the bunny once per revolution, the bunny's</span>
<span class="tok-comment">/// silhouette walks across the receiver and floor, and the bunny's ears</span>
<span class="tok-comment">/// self-shadow at grazing angles.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> light_orbit_radius: f32 = <span class="tok-num">7.0</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> light_height: f32 = <span class="tok-num">6.5</span>;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> light_speed: f32 = <span class="tok-num">0.45</span>;
<span class="tok-kw">const</span> light_target: Vec = .{ <span class="tok-num">0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> };

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> LightRig = <span class="tok-kw">struct</span> {
    vp: Mat,
    to_light: Vec,
};

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">lightRig</span>(t: f32) LightRig {
    <span class="tok-kw">const</span> a: f32 = t * light_speed + <span class="tok-num">0.35</span>;
    <span class="tok-kw">const</span> eye: Vec = <span class="tok-fn">vec</span>(
        light_target[<span class="tok-num">0</span>] + light_orbit_radius * <span class="tok-builtin">@cos</span>(a),
        light_height,
        light_target[<span class="tok-num">2</span>] + light_orbit_radius * <span class="tok-builtin">@sin</span>(a),
    );
    <span class="tok-kw">const</span> view: Mat = <span class="tok-fn">lookAtRh</span>(eye, light_target, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> projection: Mat = <span class="tok-fn">orthographicRh</span>(<span class="tok-num">13.0</span>, <span class="tok-num">13.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">20.0</span>);
    <span class="tok-kw">return</span> .{ .vp = <span class="tok-fn">mulMat</span>(projection, view), .to_light = <span class="tok-fn">normalize3</span>(eye - light_target) };
}

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Uniform blocks - built with the SHADERS' OWN Ubo types, so all three</span>
<span class="tok-comment">// backends read bit-identical layouts (the GPU uploads these structs</span>
<span class="tok-comment">// verbatim; the software targets pass them straight into `shaderMain`).</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-comment">/// 8-bit shadow-map bias for the SOFTWARE targets (their map is rgba8 -</span>
<span class="tok-comment">/// 256 depth levels - so the compare needs ~8x the slack of the GPU's</span>
<span class="tok-comment">/// rgba16_float map, whose bias is the Ubo default).  Same shader; the</span>
<span class="tok-comment">/// precision difference is data.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> soft_bias: Vec = .{ <span class="tok-num">0.018</span>, <span class="tok-num">0.010</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> };

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">depthUbo</span>(model: Mat, light_vp: Mat) shadow.depth_vs.Io {
    <span class="tok-kw">var</span> io: shadow.depth_vs.Io = undefined;
    io.u = .{ .mvp = <span class="tok-fn">mulMat</span>(light_vp, model), .params = .{ <span class="tok-num">1.0</span>, <span class="tok-num">20.0</span>, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span> }, .mode = <span class="tok-num">0</span> };
    <span class="tok-kw">return</span> io;
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">litVsUbo</span>(
    model: Mat,
    cam_vp: Mat,
    light_vp: Mat,
    normal_mat: Mat,
) shadow.lit_vs.Io {
    <span class="tok-kw">var</span> io: shadow.lit_vs.Io = undefined;
    io.u = .{
        .mvp = <span class="tok-fn">mulMat</span>(cam_vp, model),
        .light_vp = <span class="tok-fn">mulMat</span>(light_vp, model),
        .normal_matrix = normal_mat,
    };
    <span class="tok-kw">return</span> io;
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">litFsUbo</span>(o: Object, to_light: Vec, bias: Vec) shadow.lit_fs.Io {
    <span class="tok-kw">var</span> io: shadow.lit_fs.Io = undefined;
    io.u = .{
        .light_dir = .{ to_light[<span class="tok-num">0</span>], to_light[<span class="tok-num">1</span>], to_light[<span class="tok-num">2</span>], <span class="tok-num">0.0</span> },
        .base_color = <span class="tok-fn">baseColor</span>(o),
        .params = bias,
    };
    <span class="tok-kw">return</span> io;
}

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// Software passes - the vertex loops + per-object draws every software</span>
<span class="tok-comment">// target shares.  `drawDepth`/`drawLit` render one object into a runtime</span>
<span class="tok-comment">// `raster.Context` (the live CPU half); `bakeCorner` runs the SAME loops</span>
<span class="tok-comment">// through `rasterizeToTarget` so the whole two-pass render happens at</span>
<span class="tok-comment">// comptime.  Both are "clear once, draw N objects" - a GPU pass in shape.</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">runDepthVs</span>(
    verts: []<span class="tok-kw">const</span> SceneVertex,
    base_io: shadow.depth_vs.Io,
    outs: []shadow.depth_vs.Out,
) void {
    <span class="tok-kw">var</span> io: shadow.depth_vs.Io = base_io;
    <span class="tok-kw">for</span> (verts, outs) |v, *out| {
        io.vertex_position = .{ v.position[<span class="tok-num">0</span>], v.position[<span class="tok-num">1</span>], v.position[<span class="tok-num">2</span>] };
        out.* = shadow.depth_vs.<span class="tok-fn">shaderMain</span>(io);
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">runLitVs</span>(
    verts: []<span class="tok-kw">const</span> SceneVertex,
    base_io: shadow.lit_vs.Io,
    outs: []shadow.lit_vs.Out,
) void {
    <span class="tok-kw">var</span> io: shadow.lit_vs.Io = base_io;
    <span class="tok-kw">for</span> (verts, outs) |v, *out| {
        io.vertex_position = .{ v.position[<span class="tok-num">0</span>], v.position[<span class="tok-num">1</span>], v.position[<span class="tok-num">2</span>] };
        io.vertex_normal = .{ v.normal[<span class="tok-num">0</span>], v.normal[<span class="tok-num">1</span>], v.normal[<span class="tok-num">2</span>] };
        out.* = shadow.lit_vs.<span class="tok-fn">shaderMain</span>(io);
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> connect_depth: <span class="tok-kw">fn</span> (shadow.depth_vs.Out, *shadow.depth_fs.Io) void =
    z.shader.<span class="tok-fn">autoConnect</span>(shadow.depth_vs.Out, shadow.depth_fs.Io);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> connect_lit: <span class="tok-kw">fn</span> (shadow.lit_vs.Out, *shadow.lit_fs.Io) void =
    z.shader.<span class="tok-fn">autoConnect</span>(shadow.lit_vs.Out, shadow.lit_fs.Io);

<span class="tok-comment">/// Draw one object into the light-view depth pass (runtime Context sink).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">drawDepth</span>(
    ctx: *z.raster.Context,
    verts: []<span class="tok-kw">const</span> SceneVertex,
    indices: []<span class="tok-kw">const</span> u32,
    io: shadow.depth_vs.Io,
    outs: []shadow.depth_vs.Out,
) void {
    <span class="tok-fn">runDepthVs</span>(verts, io, outs[<span class="tok-num">0</span>..verts.len]);
    <span class="tok-kw">const</span> fs_io: shadow.depth_fs.Io = undefined;
    z.raster_shader.<span class="tok-fn">rasterizeTriangles</span>(
        shadow.depth_vs,
        shadow.depth_fs,
        ctx,
        outs[<span class="tok-num">0</span>..verts.len],
        indices,
        fs_io,
        connect_depth,
        .{ .front_face = .none, .depth_test = true },
    );
}

<span class="tok-comment">/// Draw one object into the lit pass, sampling `shadow_map` (runtime sink).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">drawLit</span>(
    ctx: *z.raster.Context,
    verts: []<span class="tok-kw">const</span> SceneVertex,
    indices: []<span class="tok-kw">const</span> u32,
    vs_io: shadow.lit_vs.Io,
    fs_io_in: shadow.lit_fs.Io,
    outs: []shadow.lit_vs.Out,
) void {
    <span class="tok-fn">runLitVs</span>(verts, vs_io, outs[<span class="tok-num">0</span>..verts.len]);
    z.raster_shader.<span class="tok-fn">rasterizeTriangles</span>(
        shadow.lit_vs,
        shadow.lit_fs,
        ctx,
        outs[<span class="tok-num">0</span>..verts.len],
        indices,
        fs_io_in,
        connect_lit,
        .{ .front_face = .none, .depth_test = true },
    );
}

<span class="tok-comment">// ============================================================================</span>
<span class="tok-comment">// The comptime corner - the whole two-pass shadow render as a pure function</span>
<span class="tok-comment">// the COMPILER evaluates.  Same placements, same animation functions (frozen</span>
<span class="tok-comment">// at `corner_time`), same Ubo builders, same engine shaders; the bunny is the</span>
<span class="tok-comment">// build-baked decimated proxy (`mesh_bake` OBJ path) because 69k triangles</span>
<span class="tok-comment">// is past any sane comptime budget while ~700 reads as THE bunny at inset</span>
<span class="tok-comment">// size.  Runtime-callable too - `native_verify.zig` uses that to pin the</span>
<span class="tok-comment">// comptime bake byte-for-byte against a runtime evaluation of this very</span>
<span class="tok-comment">// function.</span>
<span class="tok-comment">// ============================================================================</span>

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> corner_time: f32 = <span class="tok-num">3.6</span>;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">CornerBake</span>(<span class="tok-kw">comptime</span> sm_res: usize, <span class="tok-kw">comptime</span> w: usize, <span class="tok-kw">comptime</span> h: usize) type {
    <span class="tok-kw">return</span> <span class="tok-kw">struct</span> {
        shadow_map: [sm_res * sm_res * <span class="tok-num">4</span>]u8,
        image: [w * h * <span class="tok-num">4</span>]u8,
    };
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">bakeCorner</span>(
    <span class="tok-kw">comptime</span> sm_res: usize,
    <span class="tok-kw">comptime</span> w: usize,
    <span class="tok-kw">comptime</span> h: usize,
) <span class="tok-fn">CornerBake</span>(sm_res, w, h) {
    <span class="tok-comment">// ---- the proxy bunny, flattened + measured (u16 -&gt; u32, [N][3] -&gt; flat) --</span>
    <span class="tok-kw">var</span> bunny_verts: [proxy.vertex_count]SceneVertex = undefined;
    <span class="tok-kw">var</span> mn: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">1.0e30</span>, <span class="tok-num">1.0e30</span>, <span class="tok-num">1.0e30</span> };
    <span class="tok-kw">var</span> mx: [<span class="tok-num">3</span>]f32 = .{ -<span class="tok-num">1.0e30</span>, -<span class="tok-num">1.0e30</span>, -<span class="tok-num">1.0e30</span> };
    <span class="tok-kw">for</span> (proxy.positions, proxy.normals, &amp;bunny_verts) |p, n, *sv| {
        sv.* = .{ .position = p, .normal = n };
        <span class="tok-kw">var</span> a: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (a &lt; <span class="tok-num">3</span>) : (a += <span class="tok-num">1</span>) {
            mn[a] = <span class="tok-builtin">@min</span>(mn[a], p[a]);
            mx[a] = <span class="tok-builtin">@max</span>(mx[a], p[a]);
        }
    }
    <span class="tok-kw">var</span> bunny_idx: [proxy.indices.len]u32 = undefined;
    <span class="tok-kw">for</span> (proxy.indices, &amp;bunny_idx) |i16v, *i32v| {
        i32v.* = i16v;
    }
    <span class="tok-kw">const</span> bunny: BunnyFrame = <span class="tok-fn">bunnyFrame</span>(mn, mx);

    <span class="tok-kw">const</span> t: f32 = corner_time;
    <span class="tok-kw">const</span> rig: LightRig = <span class="tok-fn">lightRig</span>(t);

    <span class="tok-comment">// Frozen corner camera (the live halves orbit; the corner is a still).</span>
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">6.4</span>, <span class="tok-num">4.6</span>, <span class="tok-num">8.0</span>);
    <span class="tok-kw">const</span> cam_view: Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> cam_proj: Mat = zm.<span class="tok-fn">perspectiveFovRh</span>(<span class="tok-num">0.8</span>, <span class="tok-fn">float</span>(w) / <span class="tok-fn">float</span>(h), <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>);
    <span class="tok-kw">const</span> cam_vp: Mat = <span class="tok-fn">mulMat</span>(cam_proj, cam_view);

    <span class="tok-kw">var</span> outs: [proxy.vertex_count]shadow.depth_vs.Out = undefined;
    <span class="tok-kw">var</span> lit_outs: [proxy.vertex_count]shadow.lit_vs.Out = undefined;

    <span class="tok-kw">var</span> bake: <span class="tok-fn">CornerBake</span>(sm_res, w, h) = undefined;

    <span class="tok-comment">// ---- PASS 1: light-view depth, one draw per object into one target ----</span>
    {
        <span class="tok-kw">var</span> img: [sm_res * sm_res][<span class="tok-num">4</span>]u8 = <span class="tok-builtin">@splat</span>(.{ <span class="tok-num">255</span>, <span class="tok-num">255</span>, <span class="tok-num">255</span>, <span class="tok-num">255</span> }); <span class="tok-comment">// clear = far</span>
        <span class="tok-kw">var</span> depth: [sm_res * sm_res]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">1.0</span>);
        <span class="tok-kw">for</span> (objects) |o| {
            <span class="tok-kw">const</span> g: Geometry = <span class="tok-fn">geometryOf</span>(o, &amp;bunny_verts, &amp;bunny_idx);
            <span class="tok-kw">const</span> io: shadow.depth_vs.Io = <span class="tok-fn">depthUbo</span>(<span class="tok-fn">modelMatrix</span>(o, t, bunny), rig.vp);
            <span class="tok-fn">runDepthVs</span>(g.verts, io, outs[<span class="tok-num">0</span>..g.verts.len]);
            <span class="tok-kw">const</span> fs_io: shadow.depth_fs.Io = undefined;
            z.raster_shader.<span class="tok-fn">rasterizeToTarget</span>(
                shadow.depth_vs,
                shadow.depth_fs,
                sm_res,
                sm_res,
                outs[<span class="tok-num">0</span>..g.verts.len],
                g.indices,
                fs_io,
                connect_depth,
                .{ .front_face = .none, .depth_test = true },
                &amp;img,
                &amp;depth,
            );
        }
        bake.shadow_map = <span class="tok-builtin">@bitCast</span>(img);
    }

    <span class="tok-comment">// ---- PASS 2: lit + shadow-tested, sampling pass 1 through the same</span>
    <span class="tok-comment">//      nearest-filtered `TextureRef` the live CPU half binds ----</span>
    {
        <span class="tok-kw">var</span> img: [w * h][<span class="tok-num">4</span>]u8 = <span class="tok-builtin">@splat</span>(.{ <span class="tok-num">12</span>, <span class="tok-num">12</span>, <span class="tok-num">28</span>, <span class="tok-num">255</span> }); <span class="tok-comment">// clear = dark sky</span>
        <span class="tok-kw">var</span> depth: [w * h]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">1.0</span>);
        <span class="tok-kw">for</span> (objects) |o| {
            <span class="tok-kw">const</span> g: Geometry = <span class="tok-fn">geometryOf</span>(o, &amp;bunny_verts, &amp;bunny_idx);
            <span class="tok-kw">const</span> vs_io: shadow.lit_vs.Io = <span class="tok-fn">litVsUbo</span>(
                <span class="tok-fn">modelMatrix</span>(o, t, bunny),
                cam_vp,
                rig.vp,
                <span class="tok-fn">normalMatrix</span>(o, t),
            );
            <span class="tok-kw">var</span> fs_io: shadow.lit_fs.Io = <span class="tok-fn">litFsUbo</span>(o, rig.to_light, soft_bias);
            fs_io._shadow_map = .{
                .pixels = &amp;bake.shadow_map,
                .width = sm_res,
                .height = sm_res,
                .linear = false, <span class="tok-comment">// nearest - depth comparisons must not blend texels</span>
            };
            <span class="tok-fn">runLitVs</span>(g.verts, vs_io, lit_outs[<span class="tok-num">0</span>..g.verts.len]);
            z.raster_shader.<span class="tok-fn">rasterizeToTarget</span>(
                shadow.lit_vs,
                shadow.lit_fs,
                w,
                h,
                lit_outs[<span class="tok-num">0</span>..g.verts.len],
                g.indices,
                fs_io,
                connect_lit,
                .{ .front_face = .none, .depth_test = true },
                &amp;img,
                &amp;depth,
            );
        }
        bake.image = <span class="tok-builtin">@bitCast</span>(img);
    }
    <span class="tok-kw">return</span> bake;
}

<span class="tok-comment">/// One object's geometry - a named pair so every renderer's object loop</span>
<span class="tok-comment">/// reads the same way.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Geometry = <span class="tok-kw">struct</span> {
    verts: []<span class="tok-kw">const</span> SceneVertex,
    indices: []<span class="tok-kw">const</span> u32,
};

<span class="tok-kw">fn</span> <span class="tok-fn">geometryOf</span>(
    o: Object,
    bunny_verts: []<span class="tok-kw">const</span> SceneVertex,
    bunny_idx: []<span class="tok-kw">const</span> u32,
) Geometry {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (o) {
        .floor =&gt; .{ .verts = &amp;floor_verts, .indices = &amp;floor_indices },
        .pillar, .receiver =&gt; .{ .verts = &amp;cube_verts, .indices = &amp;cube_indices },
        .bunny =&gt; .{ .verts = bunny_verts, .indices = bunny_idx },
    };
}
