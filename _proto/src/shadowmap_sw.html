<h1>shadowmap_sw</h1>
<figure class="code src-file" data-path="examples/shadowmap_sw/shadowmap_sw.zig" data-lines="800"><figcaption><span>examples/shadowmap_sw/shadowmap_sw.zig</span><span>800 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! shadowmap_sw - ONE shadow-map shader source, THREE renderers, live.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   - LEFT  (CPU): the software rasterizer runs `depth_vs/fs` +</span>
<span class="tok-comment">//!     `lit_shadow_vs/fs` - the actual engine shader FILES - as plain Zig,</span>
<span class="tok-comment">//!     two passes per frame (light-view depth into an rgba8 map, then the</span>
<span class="tok-comment">//!     lit pass sampling it through a nearest `TextureRef`).</span>
<span class="tok-comment">//!   - RIGHT (GPU): the SAME four files, compiled shadermath -&gt; SPIR-V -&gt;</span>
<span class="tok-comment">//!     WGSL at build time, run as two WebGPU passes (rgba16_float shadow</span>
<span class="tok-comment">//!     RTT + the lit pipeline sampling it).</span>
<span class="tok-comment">//!   - CORNER (COMPTIME): the Zig COMPILER evaluates the same two passes</span>
<span class="tok-comment">//!     over a build-baked decimated bunny proxy (`scene.bakeCorner`) and the</span>
<span class="tok-comment">//!     result ships in the binary as a const - a shadow-mapped still no</span>
<span class="tok-comment">//!     runtime ever rendered.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Everything the renderers agree on - geometry, staging, the orbiting</span>
<span class="tok-comment">//! light, spin animation, uniform-block builders, the software passes -</span>
<span class="tok-comment">//! lives in `scene.zig`.  This file is only the plumbing each backend</span>
<span class="tok-comment">//! needs: GPU pipelines/buffers/bind groups on one side, two</span>
<span class="tok-comment">//! `raster.Context`s on the other, and the helmet-style split-screen</span>
<span class="tok-comment">//! composite (drag the divider; drag empty space to orbit; pinch/wheel to</span>
<span class="tok-comment">//! zoom).  The scene animates - objects spin, the light circles - so every</span>
<span class="tok-comment">//! varying and uniform is exercised live on both halves, while the corner</span>
<span class="tok-comment">//! stays frozen at `scene.corner_time`.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> scene = <span class="tok-builtin">@import</span>(<span class="tok-str">"scene.zig"</span>);

<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Vec2i = zm.Vec2i;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-kw">const</span> shadow = scene.shadow;

<span class="tok-comment">// The app-bridge instance: the one sanctioned wasm entry-point handle.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> depth_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"depth_vs.wgsl"</span>);
<span class="tok-kw">const</span> depth_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"depth_fs.wgsl"</span>);
<span class="tok-kw">const</span> lit_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"lit_shadow_vs.wgsl"</span>);
<span class="tok-kw">const</span> lit_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"lit_shadow_fs.wgsl"</span>);
<span class="tok-kw">const</span> bunny_obj = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"bunny.obj"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// ---- Uniform block types: taken FROM the shader Io schemas, so the GPU</span>
<span class="tok-comment">//      buffers and the software `shaderMain` calls cannot drift. ----</span>
<span class="tok-kw">const</span> DepthUbo = <span class="tok-builtin">@FieldType</span>(shadow.depth_vs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> LitVsUbo = <span class="tok-builtin">@FieldType</span>(shadow.lit_vs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> LitFsUbo = <span class="tok-builtin">@FieldType</span>(shadow.lit_fs.Io, <span class="tok-str">"u"</span>);

<span class="tok-kw">const</span> shadow_rt_size: i32 = <span class="tok-num">1024</span>; <span class="tok-comment">// GPU shadow map (rgba16_float)</span>
<span class="tok-kw">const</span> cpu_shadow_res: usize = <span class="tok-num">144</span>; <span class="tok-comment">// CPU shadow map (rgba8 Context)</span>
<span class="tok-kw">const</span> cpu_pixel_budget: f32 = <span class="tok-num">24_000</span>; <span class="tok-comment">// CPU lit image, shaped to the canvas</span>

<span class="tok-comment">// ---- The comptime corner: baked by the compiler at these dimensions. ----</span>
<span class="tok-kw">const</span> corner_sm: usize = <span class="tok-num">64</span>;
<span class="tok-kw">const</span> corner_w: usize = <span class="tok-num">96</span>;
<span class="tok-kw">const</span> corner_h: usize = <span class="tok-num">72</span>;
<span class="tok-kw">const</span> corner: scene.<span class="tok-fn">CornerBake</span>(corner_sm, corner_w, corner_h) = blk: {
    <span class="tok-builtin">@setEvalBranchQuota</span>(<span class="tok-num">2_000_000_000</span>);
    <span class="tok-kw">break</span> :blk scene.<span class="tok-fn">bakeCorner</span>(corner_sm, corner_w, corner_h);
};

<span class="tok-comment">// One drawable object on the GPU: geometry buffers + a private set of the</span>
<span class="tok-comment">// three uniform blocks (depth / lit-VS / lit-FS) and their bind groups.  The</span>
<span class="tok-comment">// two cubes share buffers but carry their own uniforms - same on the CPU,</span>
<span class="tok-comment">// where the "uniforms" are just the Io structs passed per draw.</span>
<span class="tok-kw">const</span> Obj = <span class="tok-kw">struct</span> {
    vbo: z.wgpu.BufferHandle,
    ibo: z.wgpu.BufferHandle,
    vbo_bytes: u64,
    ibo_bytes: u64,
    icount: u32,

    depth_ubo: z.wgpu.BufferHandle,
    depth_bg: z.wgpu.BindGroupHandle,
    lit_vs_ubo: z.wgpu.BufferHandle,
    lit_g0_bg: z.wgpu.BindGroupHandle,
    lit_fs_ubo: z.wgpu.BufferHandle,
    lit_g2_bg: z.wgpu.BindGroupHandle,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,

    <span class="tok-comment">// ---- GPU half ----</span>
    depth_pipeline: z.wgpu.RenderPipelineHandle,
    lit_pipeline: z.wgpu.RenderPipelineHandle,
    shadow_rt: z.RenderTexture, <span class="tok-comment">// light-view depth (rgba16_float, fixed size)</span>
    lit_g1_bg: z.wgpu.BindGroupHandle, <span class="tok-comment">// shared shadow-map sampler</span>
    floor_vbo: z.wgpu.BufferHandle,
    floor_ibo: z.wgpu.BufferHandle,
    cube_vbo: z.wgpu.BufferHandle,
    cube_ibo: z.wgpu.BufferHandle,
    bunny_vbo: z.wgpu.BufferHandle,
    bunny_ibo: z.wgpu.BufferHandle,
    shadow_sampler: z.wgpu.SamplerHandle,
    rt: z.RenderTexture, <span class="tok-comment">// camera-view target at canvas size</span>
    objs: [scene.objects.len]Obj,

    <span class="tok-comment">// ---- CPU half: the same bunny mesh kept on the CPU + two Contexts ----</span>
    bunny_verts: []scene.SceneVertex,
    bunny_indices: []u32,
    bunny_frame: scene.BunnyFrame,
    depth_outs: []shadow.depth_vs.Out,
    lit_outs: []shadow.lit_vs.Out,
    sm_ctx: z.raster.Context, <span class="tok-comment">// pass 1 target (cpu_shadow_res^2)</span>
    sw: z.raster.Context, <span class="tok-comment">// pass 2 target (canvas-shaped)</span>
    sw_fb: z.CpuFramebuffer,

    <span class="tok-comment">// ---- shared ----</span>
    font: z.Font,
    cam_yaw: f32 = <span class="tok-num">0.7</span>,
    cam_pitch: f32 = <span class="tok-num">0.42</span>,
    cam_dist: f32 = <span class="tok-num">12.0</span>,
    dragging: bool = false,
    prev_pinch: f32 = <span class="tok-num">0</span>,
    divider_frac: f32 = <span class="tok-num">0.5</span>,
    last_mouse: Vec2 = .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> },
    corner_fb: z.CpuFramebuffer, <span class="tok-comment">// the comptime bake, uploaded once</span>
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    gpa.<span class="tok-fn">free</span>(s.bunny_verts);
    gpa.<span class="tok-fn">free</span>(s.bunny_indices);
    gpa.<span class="tok-fn">free</span>(s.depth_outs);
    gpa.<span class="tok-fn">free</span>(s.lit_outs);
    s.sm_ctx.<span class="tok-fn">deinit</span>(gpa);
    s.sw.<span class="tok-fn">deinit</span>(gpa);
    <span class="tok-kw">for</span> (&amp;s.objs) |*o| {
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(o.depth_ubo);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(o.lit_vs_ubo);
        z.wgpu.<span class="tok-fn">destroyBuffer</span>(o.lit_fs_ubo);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(o.depth_bg);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(o.lit_g0_bg);
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(o.lit_g2_bg);
    }
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.floor_vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.floor_ibo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.cube_vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.cube_ibo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.bunny_vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.bunny_ibo);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.lit_g1_bg);
    z.wgpu.<span class="tok-fn">destroySampler</span>(s.shadow_sampler);
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.depth_pipeline);
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.lit_pipeline);
    s.shadow_rt.<span class="tok-fn">deinit</span>();
    s.rt.<span class="tok-fn">deinit</span>();
    s.sw_fb.<span class="tok-fn">deinit</span>();
    s.corner_fb.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">uniformLayout</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    min_size: u64,
    vis: z.wgpu.ShaderStage,
    label: []<span class="tok-kw">const</span> u8,
) !z.wgpu.BindGroupLayoutHandle {
    <span class="tok-kw">const</span> entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{ .binding = <span class="tok-num">0</span>, .visibility = vis, .resource = .{ .uniform_buffer = .{ .min_size = min_size } } },
    };
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    <span class="tok-kw">return</span> z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, blob, label);
}

<span class="tok-kw">fn</span> <span class="tok-fn">uniformBindGroup</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    bgl: z.wgpu.BindGroupLayoutHandle,
    buffer: z.wgpu.BufferHandle,
    size: u64,
    label: []<span class="tok-kw">const</span> u8,
) !z.wgpu.BindGroupHandle {
    <span class="tok-kw">const</span> entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = buffer, .size = size } } },
    };
    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);
    <span class="tok-kw">return</span> z.wgpu.<span class="tok-fn">createBindGroup</span>(device, bgl, blob, label);
}

<span class="tok-kw">const</span> Bgls = <span class="tok-kw">struct</span> {
    depth_g0: z.wgpu.BindGroupLayoutHandle,
    lit_g0: z.wgpu.BindGroupLayoutHandle,
    lit_g2: z.wgpu.BindGroupLayoutHandle,
};

<span class="tok-comment">/// Per-object GPU state: three uniform buffers + bind groups over shared</span>
<span class="tok-comment">/// geometry buffers.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">makeObj</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,
    bgls: Bgls,
    vbo: z.wgpu.BufferHandle,
    ibo: z.wgpu.BufferHandle,
    vbo_bytes: u64,
    ibo_bytes: u64,
    icount: u32,
) !Obj {
    <span class="tok-kw">const</span> depth_sz: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(DepthUbo);
    <span class="tok-kw">const</span> lit_vs_sz: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(LitVsUbo);
    <span class="tok-kw">const</span> lit_fs_sz: u64 = z.shader.<span class="tok-fn">wireSizeOf</span>(LitFsUbo);
    <span class="tok-kw">const</span> depth_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = depth_sz,
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-kw">const</span> lit_vs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = lit_vs_sz,
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-kw">const</span> lit_fs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = lit_fs_sz,
        .usage = .{ .uniform = true, .copy_dst = true },
    });
    <span class="tok-kw">return</span> .{
        .vbo = vbo,
        .ibo = ibo,
        .vbo_bytes = vbo_bytes,
        .ibo_bytes = ibo_bytes,
        .icount = icount,
        .depth_ubo = depth_ubo,
        .depth_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, bgls.depth_g0, depth_ubo, depth_sz, <span class="tok-str">"smsw_depth_bg"</span>),
        .lit_vs_ubo = lit_vs_ubo,
        .lit_g0_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, bgls.lit_g0, lit_vs_ubo, lit_vs_sz, <span class="tok-str">"smsw_g0_bg"</span>),
        .lit_fs_ubo = lit_fs_ubo,
        .lit_g2_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, bgls.lit_g2, lit_fs_ubo, lit_fs_sz, <span class="tok-str">"smsw_g2_bg"</span>),
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> queue: z.wgpu.QueueHandle = f.gpu.queue;

    <span class="tok-comment">// ---- The bunny, parsed ONCE: the same vertex array is uploaded to the</span>
    <span class="tok-comment">//      GPU and kept on the CPU (the corner uses its baked proxy). ----</span>
    <span class="tok-kw">var</span> bunny_data: z.codecs.obj.Data = <span class="tok-kw">try</span> z.codecs.obj.<span class="tok-fn">parse</span>(gpa, bunny_obj);
    <span class="tok-kw">defer</span> bunny_data.<span class="tok-fn">deinit</span>(gpa);
    <span class="tok-kw">const</span> bunny_mesh: z.codecs.obj.Mesh = <span class="tok-kw">try</span> bunny_data.<span class="tok-fn">toMesh</span>(gpa);
    <span class="tok-kw">defer</span> bunny_mesh.<span class="tok-fn">deinit</span>(gpa);

    <span class="tok-kw">const</span> bvc: usize = bunny_mesh.<span class="tok-fn">vertexCount</span>();
    <span class="tok-kw">const</span> bunny_verts: []scene.SceneVertex = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(scene.SceneVertex, bvc);
    <span class="tok-kw">var</span> mn: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">1.0e30</span>, <span class="tok-num">1.0e30</span>, <span class="tok-num">1.0e30</span> };
    <span class="tok-kw">var</span> mx: [<span class="tok-num">3</span>]f32 = .{ -<span class="tok-num">1.0e30</span>, -<span class="tok-num">1.0e30</span>, -<span class="tok-num">1.0e30</span> };
    <span class="tok-kw">for</span> (bunny_verts, <span class="tok-num">0</span>..) |*sv, i| {
        <span class="tok-kw">const</span> p: [<span class="tok-num">3</span>]f32 = .{
            bunny_mesh.positions[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>],
            bunny_mesh.positions[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>],
            bunny_mesh.positions[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>],
        };
        sv.* = .{ .position = p, .normal = .{
            bunny_mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">0</span>],
            bunny_mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">1</span>],
            bunny_mesh.normals[i * <span class="tok-num">3</span> + <span class="tok-num">2</span>],
        } };
        <span class="tok-kw">var</span> a: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (a &lt; <span class="tok-num">3</span>) : (a += <span class="tok-num">1</span>) {
            mn[a] = <span class="tok-builtin">@min</span>(mn[a], p[a]);
            mx[a] = <span class="tok-builtin">@max</span>(mx[a], p[a]);
        }
    }
    <span class="tok-kw">const</span> bunny_indices: []u32 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">dupe</span>(u32, bunny_mesh.indices);

    <span class="tok-comment">// ---- GPU geometry buffers (floor + unit cube + bunny) ----</span>
    <span class="tok-kw">const</span> floor_vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(scene.floor_verts[<span class="tok-num">0</span>..]),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"smsw_floor_vbo"</span>,
    );
    <span class="tok-kw">const</span> floor_ibo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(scene.floor_indices[<span class="tok-num">0</span>..]),
        .{ .index = true, .copy_dst = true },
        <span class="tok-str">"smsw_floor_ibo"</span>,
    );
    <span class="tok-kw">const</span> cube_vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(scene.cube_verts[<span class="tok-num">0</span>..]),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"smsw_cube_vbo"</span>,
    );
    <span class="tok-kw">const</span> cube_ibo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(scene.cube_indices[<span class="tok-num">0</span>..]),
        .{ .index = true, .copy_dst = true },
        <span class="tok-str">"smsw_cube_ibo"</span>,
    );
    <span class="tok-kw">const</span> bunny_vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(bunny_verts),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"smsw_bunny_vbo"</span>,
    );
    <span class="tok-kw">const</span> bunny_ibo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(bunny_indices),
        .{ .index = true, .copy_dst = true },
        <span class="tok-str">"smsw_bunny_ibo"</span>,
    );

    <span class="tok-comment">// ---- GPU shadow map: rgba16_float + NEAREST sampler (linear filtering</span>
    <span class="tok-comment">//      would blend depths across silhouettes and corrupt the compare) ----</span>
    <span class="tok-kw">const</span> shadow_rt: z.RenderTexture = z.RenderTexture.<span class="tok-fn">create</span>(device, .{
        .width = <span class="tok-builtin">@intCast</span>(shadow_rt_size),
        .height = <span class="tok-builtin">@intCast</span>(shadow_rt_size),
        .format = .rgba16_float,
        .with_depth = true,
        .depth_format = .depth24_plus,
        .label = <span class="tok-str">"smsw_shadow_rt"</span>,
    });
    <span class="tok-kw">const</span> shadow_sampler: z.wgpu.SamplerHandle = z.wgpu.<span class="tok-fn">createSampler</span>(device, .{
        .mag_filter_linear = false,
        .min_filter_linear = false,
        .address_mode = .clamp_to_edge,
    });

    <span class="tok-comment">// ---- Vertex layouts: the depth pass reads position only ----</span>
    <span class="tok-kw">const</span> pos_only_layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(scene.SceneVertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
        },
    };
    <span class="tok-kw">const</span> pos_normal_layout = z.gpu.VertexBufferLayout{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(scene.SceneVertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
            .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
        },
    };

    <span class="tok-comment">// ---- Bind-group layouts + the shared shadow-sampler group ----</span>
    <span class="tok-kw">const</span> bgls: Bgls = .{
        .depth_g0 = <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, z.shader.<span class="tok-fn">wireSizeOf</span>(DepthUbo), .{ .vertex = true }, <span class="tok-str">"smsw_depth_g0"</span>),
        .lit_g0 = <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, z.shader.<span class="tok-fn">wireSizeOf</span>(LitVsUbo), .{ .vertex = true }, <span class="tok-str">"smsw_lit_g0"</span>),
        .lit_g2 = <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, z.shader.<span class="tok-fn">wireSizeOf</span>(LitFsUbo), .{ .fragment = true }, <span class="tok-str">"smsw_lit_g2"</span>),
    };
    <span class="tok-kw">const</span> shadow_tex: z.WgpuTexture = shadow_rt.<span class="tok-fn">asTexture</span>();
    <span class="tok-kw">const</span> g1_layout_entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{ .binding = <span class="tok-num">0</span>, .visibility = .{ .fragment = true }, .resource = .{ .texture = .{} } },
        .{ .binding = <span class="tok-num">1</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
    };
    <span class="tok-kw">const</span> g1_layout_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;g1_layout_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_layout_blob);
    <span class="tok-kw">const</span> lit_g1_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, g1_layout_blob, <span class="tok-str">"smsw_lit_g1"</span>);
    <span class="tok-kw">const</span> g1_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .texture_view = shadow_tex.view } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .sampler = shadow_sampler } },
    };
    <span class="tok-kw">const</span> g1_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;g1_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(g1_blob);
    <span class="tok-kw">const</span> lit_g1_bg: z.wgpu.BindGroupHandle = z.wgpu.<span class="tok-fn">createBindGroup</span>(device, lit_g1_bgl, g1_blob, <span class="tok-str">"smsw_lit_g1_bg"</span>);

    <span class="tok-comment">// ---- Depth pass pipeline (targets the rgba16_float shadow RTT) ----</span>
    <span class="tok-kw">const</span> depth_bgls: [<span class="tok-num">1</span>]z.wgpu.BindGroupLayoutHandle = .{bgls.depth_g0};
    <span class="tok-kw">const</span> depth_pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(device, depth_bgls[<span class="tok-num">0</span>..], <span class="tok-str">"smsw_depth_pl"</span>);
    <span class="tok-kw">const</span> depth_vs_mod: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, depth_vs_wgsl, <span class="tok-str">"depth_vs"</span>);
    <span class="tok-kw">const</span> depth_fs_mod: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, depth_fs_wgsl, <span class="tok-str">"depth_fs"</span>);
    <span class="tok-kw">const</span> depth_combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .none,
        .less,
        .none,
        .rgba16_float,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> depth_pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{pos_only_layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = depth_combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(depth_pipe_blob);
    <span class="tok-kw">const</span> depth_pipeline: z.wgpu.RenderPipelineHandle = z.wgpu.<span class="tok-fn">createRenderPipeline</span>(
        device,
        depth_pl,
        depth_vs_mod,
        depth_fs_mod,
        depth_pipe_blob,
        <span class="tok-str">"smsw_depth_pipe"</span>,
    );

    <span class="tok-comment">// ---- Lit pass pipeline (targets the rgba8 camera-view RTT) ----</span>
    <span class="tok-kw">const</span> lit_bgls: [<span class="tok-num">3</span>]z.wgpu.BindGroupLayoutHandle = .{ bgls.lit_g0, lit_g1_bgl, bgls.lit_g2 };
    <span class="tok-kw">const</span> lit_pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(device, lit_bgls[<span class="tok-num">0</span>..], <span class="tok-str">"smsw_lit_pl"</span>);
    <span class="tok-kw">const</span> lit_vs_mod: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, lit_vs_wgsl, <span class="tok-str">"lit_shadow_vs"</span>);
    <span class="tok-kw">const</span> lit_fs_mod: z.wgpu.ShaderModuleHandle = z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, lit_fs_wgsl, <span class="tok-str">"lit_shadow_fs"</span>);
    <span class="tok-comment">// Cull .none: the winding of every caster matches the GPU shadowmap</span>
    <span class="tok-comment">// example, whose back faces are depth-occluded anyway.</span>
    <span class="tok-kw">const</span> lit_combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .triangle_list,
        .alpha,
        .less,
        .none,
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> lit_pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{pos_normal_layout},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = lit_combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(lit_pipe_blob);
    <span class="tok-kw">const</span> lit_pipeline: z.wgpu.RenderPipelineHandle = z.wgpu.<span class="tok-fn">createRenderPipeline</span>(
        device,
        lit_pl,
        lit_vs_mod,
        lit_fs_mod,
        lit_pipe_blob,
        <span class="tok-str">"smsw_lit_pipe"</span>,
    );

    <span class="tok-comment">// ---- Per-object GPU state, in `scene.objects` order ----</span>
    <span class="tok-kw">var</span> objs: [scene.objects.len]Obj = undefined;
    <span class="tok-kw">for</span> (scene.objects, &amp;objs) |o, *slot| {
        <span class="tok-kw">switch</span> (o) {
            .floor =&gt; {
                slot.* = <span class="tok-kw">try</span> <span class="tok-fn">makeObj</span>(
                    gpa,
                    device,
                    bgls,
                    floor_vbo,
                    floor_ibo,
                    <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(scene.floor_verts)),
                    <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(scene.floor_indices)),
                    scene.floor_indices.len,
                );
            },
            .pillar, .receiver =&gt; {
                slot.* = <span class="tok-kw">try</span> <span class="tok-fn">makeObj</span>(
                    gpa,
                    device,
                    bgls,
                    cube_vbo,
                    cube_ibo,
                    <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(scene.cube_verts)),
                    <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(scene.cube_indices)),
                    scene.cube_indices.len,
                );
            },
            .bunny =&gt; {
                slot.* = <span class="tok-kw">try</span> <span class="tok-fn">makeObj</span>(
                    gpa,
                    device,
                    bgls,
                    bunny_vbo,
                    bunny_ibo,
                    bunny_verts.len * <span class="tok-builtin">@sizeOf</span>(scene.SceneVertex),
                    bunny_indices.len * <span class="tok-builtin">@sizeOf</span>(u32),
                    <span class="tok-builtin">@intCast</span>(bunny_indices.len),
                );
            },
        }
    }

    <span class="tok-comment">// ---- CPU half: two Contexts + shared VS-out scratch (bunny-sized) ----</span>
    <span class="tok-kw">const</span> sm_ctx: z.raster.Context = <span class="tok-kw">try</span> z.raster.Context.<span class="tok-fn">init</span>(gpa, cpu_shadow_res, cpu_shadow_res);
    <span class="tok-kw">const</span> sw: z.raster.Context = <span class="tok-kw">try</span> z.raster.Context.<span class="tok-fn">init</span>(gpa, <span class="tok-num">220</span>, <span class="tok-num">124</span>);
    <span class="tok-kw">const</span> sw_fb: z.CpuFramebuffer = z.CpuFramebuffer.<span class="tok-fn">init</span>(device, queue, <span class="tok-num">220</span>, <span class="tok-num">124</span>, sw.<span class="tok-fn">colorBufferBytes</span>(), <span class="tok-str">"smsw_cpu"</span>);

    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgls.depth_g0);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgls.lit_g0);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgls.lit_g2);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(lit_g1_bgl);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(depth_pl);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(lit_pl);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(depth_vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(depth_fs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(lit_vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(lit_fs_mod);

    s.* = .{
        .gpa = gpa,
        .depth_pipeline = depth_pipeline,
        .lit_pipeline = lit_pipeline,
        .shadow_rt = shadow_rt,
        .lit_g1_bg = lit_g1_bg,
        .floor_vbo = floor_vbo,
        .floor_ibo = floor_ibo,
        .cube_vbo = cube_vbo,
        .cube_ibo = cube_ibo,
        .bunny_vbo = bunny_vbo,
        .bunny_ibo = bunny_ibo,
        .shadow_sampler = shadow_sampler,
        .rt = .{},
        .objs = objs,
        .bunny_verts = bunny_verts,
        .bunny_indices = bunny_indices,
        .bunny_frame = scene.<span class="tok-fn">bunnyFrame</span>(mn, mx),
        .depth_outs = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(shadow.depth_vs.Out, bvc),
        .lit_outs = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(shadow.lit_vs.Out, bvc),
        .sm_ctx = sm_ctx,
        .sw = sw,
        .sw_fb = sw_fb,
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>),
        .corner_fb = z.CpuFramebuffer.<span class="tok-fn">init</span>(device, queue, corner_w, corner_h, &amp;corner.image, <span class="tok-str">"smsw_corner"</span>),
    };
}

<span class="tok-comment">/// Keep both halves' targets matched to the LIVE canvas (helmet pattern):</span>
<span class="tok-comment">/// the GPU camera-view RTT at the surface's backing size, the CPU lit</span>
<span class="tok-comment">/// buffer at `cpu_pixel_budget` pixels shaped to the canvas aspect.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> bw: i32 = <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>));
    <span class="tok-kw">const</span> bh: i32 = <span class="tok-builtin">@intCast</span>(<span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>));
    <span class="tok-kw">if</span> (s.rt.color == .invalid <span class="tok-kw">or</span> s.rt.width != backing.width <span class="tok-kw">or</span> s.rt.height != backing.height) {
        <span class="tok-kw">if</span> (s.rt.color != .invalid) {
            z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt);
        }
        s.rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, bw, bh);
    }

    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> aspect: f32 = vw / vh;
    <span class="tok-kw">const</span> want_w: i32 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@max</span>(<span class="tok-builtin">@round</span>(<span class="tok-builtin">@sqrt</span>(cpu_pixel_budget * aspect)), <span class="tok-num">16</span>));
    <span class="tok-kw">const</span> want_h: i32 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@max</span>(<span class="tok-builtin">@round</span>(<span class="tok-fn">float</span>(want_w) / aspect), <span class="tok-num">16</span>));
    <span class="tok-kw">const</span> dims: Vec2i = s.sw.<span class="tok-fn">colorBufferDims</span>();
    <span class="tok-kw">if</span> (dims[<span class="tok-num">0</span>] != want_w <span class="tok-kw">or</span> dims[<span class="tok-num">1</span>] != want_h) {
        s.sw.<span class="tok-fn">resize</span>(s.gpa, want_w, want_h) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
        s.sw_fb.<span class="tok-fn">resize</span>(f.gl, <span class="tok-builtin">@intCast</span>(want_w), <span class="tok-builtin">@intCast</span>(want_h), s.sw.<span class="tok-fn">colorBufferBytes</span>(), <span class="tok-str">"smsw_cpu"</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> dx: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (s.prev_pinch &gt; <span class="tok-num">0</span>) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - (dist - s.prev_pinch) * <span class="tok-num">0.02</span>, <span class="tok-num">6.0</span>, <span class="tok-num">24.0</span>);
        }
        s.prev_pinch = dist;
        <span class="tok-kw">return</span>;
    }
    s.prev_pinch = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left)) {
        <span class="tok-kw">if</span> (s.dragging) {
            <span class="tok-kw">const</span> d: Vec2 = z.<span class="tok-fn">getMouseDelta</span>(f.input);
            s.cam_yaw -= d[<span class="tok-num">0</span>] * <span class="tok-num">0.008</span>;
            s.cam_pitch = <span class="tok-fn">clamp</span>(s.cam_pitch + d[<span class="tok-num">1</span>] * <span class="tok-num">0.008</span>, <span class="tok-num">0.08</span>, <span class="tok-num">1.45</span>);
        }
        s.dragging = true;
    } <span class="tok-kw">else</span> {
        s.dragging = false;
    }
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span>) {
        s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - wheel * <span class="tok-num">0.6</span>, <span class="tok-num">6.0</span>, <span class="tok-num">24.0</span>);
    }
}

<span class="tok-comment">/// GPU per-object uniforms - built by the SAME `scene` Ubo builders the</span>
<span class="tok-comment">/// software targets pass into `shaderMain`, uploaded verbatim.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">writeObjUniforms</span>(
    f: *z.Frame,
    s: *State,
    t: f32,
    cam_vp: Mat,
    rig: scene.LightRig,
) void {
    <span class="tok-kw">for</span> (scene.objects, &amp;s.objs) |o, *obj| {
        <span class="tok-kw">const</span> model: Mat = scene.<span class="tok-fn">modelMatrix</span>(o, t, s.bunny_frame);
        <span class="tok-kw">const</span> depth_io: shadow.depth_vs.Io = scene.<span class="tok-fn">depthUbo</span>(model, rig.vp);
        <span class="tok-kw">const</span> depth_bytes: [z.shader.<span class="tok-fn">wireSizeOf</span>(DepthUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(DepthUbo, &amp;depth_io.u);
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.depth_ubo, <span class="tok-num">0</span>, &amp;depth_bytes);
        <span class="tok-kw">const</span> lit_vs_io: shadow.lit_vs.Io = scene.<span class="tok-fn">litVsUbo</span>(model, cam_vp, rig.vp, scene.<span class="tok-fn">normalMatrix</span>(o, t));
        <span class="tok-kw">const</span> lit_vs_bytes: [z.shader.<span class="tok-fn">wireSizeOf</span>(LitVsUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(LitVsUbo, &amp;lit_vs_io.u);
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.lit_vs_ubo, <span class="tok-num">0</span>, &amp;lit_vs_bytes);
        <span class="tok-comment">// GPU map is rgba16_float -&gt; the Ubo's default (fine) bias.</span>
        <span class="tok-kw">const</span> lit_fs_io: shadow.lit_fs.Io = scene.<span class="tok-fn">litFsUbo</span>(o, rig.to_light, .{ <span class="tok-num">0.0025</span>, <span class="tok-num">0.0008</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> });
        <span class="tok-kw">const</span> lit_fs_bytes: [z.shader.<span class="tok-fn">wireSizeOf</span>(LitFsUbo)]u8 = z.shader.<span class="tok-fn">wireOf</span>(LitFsUbo, &amp;lit_fs_io.u);
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.lit_fs_ubo, <span class="tok-num">0</span>, &amp;lit_fs_bytes);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawMesh</span>(rps: *z.PassState, obj: *<span class="tok-kw">const</span> Obj) void {
    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(rps.pass, .{ .slot = <span class="tok-num">0</span>, .buffer = obj.vbo, .offset = <span class="tok-num">0</span>, .size = obj.vbo_bytes });
    z.render_pass.<span class="tok-fn">setIndexBuffer</span>(rps.pass, .{
        .buffer = obj.ibo,
        .format = .uint32,
        .offset = <span class="tok-num">0</span>,
        .size = obj.ibo_bytes,
    });
    z.render_pass.<span class="tok-fn">drawIndexed</span>(rps.pass, .{
        .index_count = obj.icount,
        .instance_count = <span class="tok-num">1</span>,
        .first_index = <span class="tok-num">0</span>,
        .base_vertex = <span class="tok-num">0</span>,
        .first_instance = <span class="tok-num">0</span>,
    });
}

<span class="tok-comment">/// The CPU frame: the same two passes as the GPU, per-object draws through</span>
<span class="tok-comment">/// the same shader files, over two software Contexts.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">renderCpu</span>(s: *State, t: f32, cam_vp: Mat, rig: scene.LightRig) void {
    <span class="tok-comment">// ---- PASS 1: light-view depth into the rgba8 shadow map ----</span>
    s.sm_ctx.<span class="tok-fn">clearColor</span>(.{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> }); <span class="tok-comment">// far</span>
    s.sm_ctx.<span class="tok-fn">clearDepth</span>(<span class="tok-num">1.0</span>);
    s.sm_ctx.<span class="tok-fn">clear</span>(.{ .color = true, .depth = true });
    <span class="tok-kw">for</span> (scene.objects) |o| {
        <span class="tok-kw">const</span> g: scene.Geometry = <span class="tok-fn">geometryOf</span>(s, o);
        <span class="tok-kw">const</span> io: shadow.depth_vs.Io = scene.<span class="tok-fn">depthUbo</span>(scene.<span class="tok-fn">modelMatrix</span>(o, t, s.bunny_frame), rig.vp);
        scene.<span class="tok-fn">drawDepth</span>(&amp;s.sm_ctx, g.verts, g.indices, io, s.depth_outs);
    }

    <span class="tok-comment">// ---- PASS 2: lit + shadow-tested, sampling pass 1 (nearest) ----</span>
    s.sw.<span class="tok-fn">clearColor</span>(.{ .r = <span class="tok-num">12</span>, .g = <span class="tok-num">12</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">255</span> });
    s.sw.<span class="tok-fn">clearDepth</span>(<span class="tok-num">1.0</span>);
    s.sw.<span class="tok-fn">clear</span>(.{ .color = true, .depth = true });
    <span class="tok-kw">for</span> (scene.objects) |o| {
        <span class="tok-kw">const</span> g: scene.Geometry = <span class="tok-fn">geometryOf</span>(s, o);
        <span class="tok-kw">const</span> vs_io: shadow.lit_vs.Io = scene.<span class="tok-fn">litVsUbo</span>(
            scene.<span class="tok-fn">modelMatrix</span>(o, t, s.bunny_frame),
            cam_vp,
            rig.vp,
            scene.<span class="tok-fn">normalMatrix</span>(o, t),
        );
        <span class="tok-kw">var</span> fs_io: shadow.lit_fs.Io = scene.<span class="tok-fn">litFsUbo</span>(o, rig.to_light, scene.soft_bias);
        fs_io._shadow_map = .{
            .pixels = s.sm_ctx.<span class="tok-fn">colorBufferBytes</span>(),
            .width = cpu_shadow_res,
            .height = cpu_shadow_res,
            .linear = false, <span class="tok-comment">// nearest - depth comparisons must not blend texels</span>
        };
        scene.<span class="tok-fn">drawLit</span>(&amp;s.sw, g.verts, g.indices, vs_io, fs_io, s.lit_outs);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">geometryOf</span>(s: *State, o: scene.Object) scene.Geometry {
    <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (o) {
        .floor =&gt; .{ .verts = &amp;scene.floor_verts, .indices = &amp;scene.floor_indices },
        .pillar, .receiver =&gt; .{ .verts = &amp;scene.cube_verts, .indices = &amp;scene.cube_indices },
        .bunny =&gt; .{ .verts = s.bunny_verts, .indices = s.bunny_indices },
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-fn">handleInput</span>(f, s);
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing).</span>

    <span class="tok-comment">// ---- The shared frame inputs: orbiting light + orbit camera ----</span>
    <span class="tok-kw">const</span> rig: scene.LightRig = scene.<span class="tok-fn">lightRig</span>(t);
    <span class="tok-kw">const</span> cam_target: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(s.cam_pitch);
    <span class="tok-kw">const</span> sp: f32 = <span class="tok-builtin">@sin</span>(s.cam_pitch);
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-builtin">@cos</span>(s.cam_yaw);
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-builtin">@sin</span>(s.cam_yaw);
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(
        cam_target[<span class="tok-num">0</span>] + s.cam_dist * cp * sy,
        cam_target[<span class="tok-num">1</span>] + s.cam_dist * sp,
        cam_target[<span class="tok-num">2</span>] + s.cam_dist * cp * cy,
    );
    <span class="tok-kw">const</span> cam_view: Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, cam_target, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> cam_proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(<span class="tok-num">0.8</span>, vw / <span class="tok-builtin">@max</span>(vh, <span class="tok-num">1.0</span>), <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>);
    <span class="tok-kw">const</span> cam_vp: Mat = <span class="tok-fn">mulMat</span>(cam_proj, cam_view);

    <span class="tok-comment">// ---- CPU: two software passes through the engine shaders ----</span>
    <span class="tok-fn">renderCpu</span>(s, t, cam_vp, rig);
    s.sw_fb.<span class="tok-fn">update</span>(f.gpu.queue, s.sw.<span class="tok-fn">colorBufferBytes</span>());

    <span class="tok-comment">// ---- GPU: the same two passes through the same files (as WGSL) ----</span>
    <span class="tok-fn">writeObjUniforms</span>(f, s, t, cam_vp, rig);
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;

    <span class="tok-comment">// PASS 1: shadow map (light's eye -&gt; rgba16_float RTT). Raw pass: our own</span>
    <span class="tok-comment">// pipeline, so beginTextureMode must not bind the rgba8 2D pipeline here.</span>
    z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.shadow_rt, .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> p1: *z.PassState = f.gl.pass;
    Backend.<span class="tok-fn">setPipeline</span>(p1, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.depth_pipeline });
    <span class="tok-kw">for</span> (&amp;s.objs) |*obj| {
        Backend.<span class="tok-fn">setBindGroup</span>(p1, <span class="tok-num">0</span>, obj.depth_bg);
        <span class="tok-fn">drawMesh</span>(p1, obj);
    }
    z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);

    <span class="tok-comment">// PASS 2: lit scene (camera -&gt; canvas-sized rgba8 RTT), sampling pass 1.</span>
    z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.rt, .{ .r = <span class="tok-num">12</span>, .g = <span class="tok-num">12</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> p2: *z.PassState = f.gl.pass;
    Backend.<span class="tok-fn">setPipeline</span>(p2, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.lit_pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(p2, <span class="tok-num">1</span>, s.lit_g1_bg);
    <span class="tok-kw">for</span> (&amp;s.objs) |*obj| {
        Backend.<span class="tok-fn">setBindGroup</span>(p2, <span class="tok-num">0</span>, obj.lit_g0_bg);
        Backend.<span class="tok-fn">setBindGroup</span>(p2, <span class="tok-num">2</span>, obj.lit_g2_bg);
        <span class="tok-fn">drawMesh</span>(p2, obj);
    }
    z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);

    <span class="tok-comment">// ---- Composite (helmet-style): GPU full-surface, CPU left of the</span>
    <span class="tok-comment">//      divider, comptime corner inset bottom-right ----</span>
    <span class="tok-comment">// SCREEN PASS: open once, composite the GPU result + CPU/comptime insets.</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">8</span>, .g = <span class="tok-num">9</span>, .b = <span class="tok-num">14</span>, .a = <span class="tok-num">255</span> });
    f.gl.<span class="tok-fn">texture</span>(
        .{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh },
        s.rt.<span class="tok-fn">asTexture</span>(),
        .{ .tint = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> } },
    );
    <span class="tok-kw">const</span> m: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> is_first_zero: bool = s.last_mouse[<span class="tok-num">0</span>] &lt; <span class="tok-num">0</span> <span class="tok-kw">and</span> m[<span class="tok-num">0</span>] == <span class="tok-num">0</span> <span class="tok-kw">and</span> m[<span class="tok-num">1</span>] == <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (!is_first_zero <span class="tok-kw">and</span> (m[<span class="tok-num">0</span>] != s.last_mouse[<span class="tok-num">0</span>] <span class="tok-kw">or</span> m[<span class="tok-num">1</span>] != s.last_mouse[<span class="tok-num">1</span>])) {
        s.last_mouse = m;
        s.divider_frac = <span class="tok-fn">clamp</span>(m[<span class="tok-num">0</span>] / vw, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>);
    }
    <span class="tok-kw">const</span> divider_x: f32 = s.divider_frac * vw;
    z.<span class="tok-fn">beginScissorMode</span>(f.gl, <span class="tok-num">0</span>, <span class="tok-num">0</span>, divider_x, vh);
    s.sw_fb.<span class="tok-fn">present</span>(f.gl, <span class="tok-num">0</span>, <span class="tok-num">0</span>, vw, vh);
    z.<span class="tok-fn">endScissorMode</span>(f.gl);
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = divider_x - <span class="tok-num">1.5</span>, .y = <span class="tok-num">0</span>, .width = <span class="tok-num">3</span>, .height = vh },
        .{ .color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> } },
    );

    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, <span class="tok-num">14</span> },
        <span class="tok-str">"CPU lit_shadow_fs"</span>,
        .{ .size = <span class="tok-num">22</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
    f.gl.<span class="tok-fn">text</span>(
        .{ vw - <span class="tok-num">210</span>, <span class="tok-num">14</span> },
        <span class="tok-str">"GPU lit_shadow_fs"</span>,
        .{ .size = <span class="tok-num">22</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );

    <span class="tok-comment">// The comptime corner: baked by the compiler, frozen at scene.corner_time.</span>
    <span class="tok-kw">const</span> inset_h: f32 = <span class="tok-fn">clamp</span>(<span class="tok-builtin">@min</span>(vw, vh) * <span class="tok-num">0.26</span>, <span class="tok-num">72</span>, <span class="tok-num">160</span>);
    <span class="tok-kw">const</span> inset_w: f32 = inset_h * (<span class="tok-fn">float</span>(corner_w) / <span class="tok-fn">float</span>(corner_h));
    <span class="tok-kw">const</span> ix: f32 = vw - inset_w - <span class="tok-num">12</span>;
    <span class="tok-kw">const</span> iy: f32 = vh - inset_h - <span class="tok-num">12</span>;
    s.corner_fb.<span class="tok-fn">present</span>(f.gl, ix, iy, inset_w, inset_h);
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = ix - <span class="tok-num">1</span>, .y = iy - <span class="tok-num">1</span>, .width = inset_w + <span class="tok-num">2</span>, .height = inset_h + <span class="tok-num">2</span> },
        .{ .color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> }, .outline = <span class="tok-num">1.0</span> },
    );
    f.gl.<span class="tok-fn">text</span>(
        .{ ix - <span class="tok-num">60</span>, iy - <span class="tok-num">22</span> },
        <span class="tok-str">"comptime lit_shadow_fs"</span>,
        .{ .size = <span class="tok-num">16</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );

    <span class="tok-comment">// NB: no explicit endDrawing - the runner closes the frame (idempotent),</span>
    <span class="tok-comment">// which lets the launcher overlay its switch pill on this app's frame.</span>

    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - one shadow shader: CPU | GPU | comptime"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            <span class="tok-comment">// 2D pipelines carry depth so loadRenderTexture attaches a depth</span>
            <span class="tok-comment">// buffer the raw lit pass can test against.</span>
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// CPU/GPU/comptime shadow targets rendered offscreen before the screen opens</span>
    <span class="tok-comment">// (tile-based-GPU safe); owns its own begin/endDrawing.</span>
    .manages_own_frame = true,
    .memory = .managed,
};
