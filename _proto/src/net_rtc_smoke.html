<h1>net_rtc_smoke</h1>
<figure class="code src-file" data-path="examples/net_rtc_smoke/net_rtc_smoke.zig" data-lines="356"><figcaption><span>examples/net_rtc_smoke/net_rtc_smoke.zig</span><span>356 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! net_rtc_smoke - the WebRTC half of zimr P2P: two browser tabs open a DIRECT</span>
<span class="tok-comment">//! peer-to-peer data-channel connection, using the signaling server only for</span>
<span class="tok-comment">//! discovery and the SDP/ICE handshake. Once connected, the game data would</span>
<span class="tok-comment">//! flow browser-to-browser with no server in the middle.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Scope: 2 peers / one connection (a full mesh is layer L2's job). This is the</span>
<span class="tok-comment">//! orchestration that L2's net.zig will generalize.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Everything is driven by draining ws.poll + rtc.poll each frame:</span>
<span class="tok-comment">//!   1. Connect to the signaling server, JOIN a room.</span>
<span class="tok-comment">//!   2. Learn peers: WELCOME lists who's already here; JOINED announces arrivals.</span>
<span class="tok-comment">//!   3. Offerer convention (avoids "glare" where both offer at once): the LOWER</span>
<span class="tok-comment">//!      peer id offers to the HIGHER. So on JOINED (a higher id) we offer; on</span>
<span class="tok-comment">//!      WELCOME (existing, lower ids) we create the connection and await theirs.</span>
<span class="tok-comment">//!   4. Ferry the handshake over the relay: our rtc events (offer/answer/ICE)</span>
<span class="tok-comment">//!      go out as `SIGNAL &lt;peer&gt; &lt;kind&gt; &lt;data&gt;`; the peer's come back as</span>
<span class="tok-comment">//!      `FROM &lt;peer&gt; &lt;kind&gt; &lt;data&gt;` and feed rtc.setRemote / rtc.addIce.</span>
<span class="tok-comment">//!   5. When a channel opens we greet on the reliable channel, and show whatever</span>
<span class="tok-comment">//!      arrives. Lots of on-screen logging so failures are diagnosable.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> ui = z.ui_real;
<span class="tok-kw">const</span> ws = z.web.ws;
<span class="tok-kw">const</span> rtc = z.web.rtc;

<span class="tok-kw">const</span> bufPrint = std.fmt.bufPrint;

<span class="tok-kw">const</span> default_room = <span class="tok-str">"zimr-rtc-demo"</span>;
<span class="tok-kw">const</span> max_log = <span class="tok-num">14</span>;
<span class="tok-kw">const</span> sdp_cap = <span class="tok-num">16384</span>; <span class="tok-comment">// SDP offers/answers run a few KB; ICE is tiny</span>

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    font: z.Font,
    ui_host: z.UiHost,

    url_buf: [<span class="tok-num">256</span>]u8,
    url_len: usize,
    room_buf: [<span class="tok-num">64</span>]u8,
    room_len: usize,

    sock: ws.Handle, <span class="tok-comment">// signaling socket, 0 = not connected</span>
    joined: bool,
    my_id: u32,

    peer_id: u32, <span class="tok-comment">// the other peer (0 = none yet; this is a 2-peer demo)</span>
    pc: rtc.Handle, <span class="tok-comment">// the RTC connection (0 = none)</span>
    is_offerer: bool,
    chan_open: [<span class="tok-num">2</span>]bool, <span class="tok-comment">// channel 0 = cursor, 1 = clicks</span>
    rtc_state: [<span class="tok-num">24</span>]u8, <span class="tok-comment">// last connection-state text</span>
    rtc_state_len: usize,

    log: [max_log][<span class="tok-num">192</span>]u8,
    log_len: [max_log]usize,
    log_n: usize,

    ws_buf: [sdp_cap]u8, <span class="tok-comment">// ws.poll inbound (must hold FROM + SDP)</span>
    rtc_buf: [sdp_cap]u8, <span class="tok-comment">// rtc.poll output (must hold SDP)</span>
    send_buf: [sdp_cap]u8, <span class="tok-comment">// building outbound SIGNAL messages</span>
};

<span class="tok-kw">const</span> Split = <span class="tok-kw">struct</span> { tok: []<span class="tok-kw">const</span> u8, rest: []<span class="tok-kw">const</span> u8 };

<span class="tok-comment">// Split "tok rest" on the first space. rest is "" when there's no space.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">splitFirst</span>(s: []<span class="tok-kw">const</span> u8) Split {
    <span class="tok-kw">const</span> sp: usize = std.mem.<span class="tok-fn">indexOfScalar</span>(u8, s, <span class="tok-str">' '</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span> .{ .tok = s, .rest = <span class="tok-str">""</span> };
    <span class="tok-kw">return</span> .{ .tok = s[<span class="tok-num">0</span>..sp], .rest = s[sp + <span class="tok-num">1</span> ..] };
}

<span class="tok-kw">fn</span> <span class="tok-fn">onoff</span>(b: bool) []<span class="tok-kw">const</span> u8 {
    <span class="tok-kw">return</span> <span class="tok-kw">if</span> (b) <span class="tok-str">"OPEN"</span> <span class="tok-kw">else</span> <span class="tok-str">"-"</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">pushLog</span>(s: *State, msg: []<span class="tok-kw">const</span> u8) void {
    <span class="tok-kw">const</span> slot: usize = s.log_n % max_log;
    <span class="tok-kw">const</span> n: usize = <span class="tok-builtin">@min</span>(msg.len, s.log[slot].len);
    <span class="tok-builtin">@memcpy</span>(s.log[slot][<span class="tok-num">0</span>..n], msg[<span class="tok-num">0</span>..n]);
    s.log_len[slot] = n;
    s.log_n += <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">logf</span>(s: *State, <span class="tok-kw">comptime</span> fmt: []<span class="tok-kw">const</span> u8, args: <span class="tok-kw">anytype</span>) void {
    <span class="tok-kw">var</span> b: [<span class="tok-num">192</span>]u8 = undefined;
    <span class="tok-kw">const</span> m: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;b, fmt, args) <span class="tok-kw">catch</span> b[<span class="tok-num">0</span>..<span class="tok-num">0</span>];
    <span class="tok-fn">pushLog</span>(s, m);
}

<span class="tok-kw">fn</span> <span class="tok-fn">setRtcState</span>(s: *State, text: []<span class="tok-kw">const</span> u8) void {
    <span class="tok-kw">const</span> n: usize = <span class="tok-builtin">@min</span>(text.len, s.rtc_state.len);
    <span class="tok-builtin">@memcpy</span>(s.rtc_state[<span class="tok-num">0</span>..n], text[<span class="tok-num">0</span>..n]);
    s.rtc_state_len = n;
}

<span class="tok-comment">// Begin a connection to `peer`; remember whether we're the offerer.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">startPeer</span>(s: *State, peer: u32, offerer: bool) void {
    <span class="tok-kw">if</span> (s.pc != <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>; <span class="tok-comment">// 2-peer demo: we already have a connection</span>
    }
    s.peer_id = peer;
    s.is_offerer = offerer;
    s.chan_open = .{ false, false };
    s.rtc_state_len = <span class="tok-num">0</span>;
    s.pc = rtc.<span class="tok-fn">create</span>();
    <span class="tok-kw">if</span> (offerer) {
        rtc.<span class="tok-fn">createOffer</span>(s.pc);
        <span class="tok-fn">logf</span>(s, <span class="tok-str">"peer {d} joined; I offer (I'm {d})"</span>, .{ peer, s.my_id });
    } <span class="tok-kw">else</span> {
        <span class="tok-fn">logf</span>(s, <span class="tok-str">"peer {d} present; awaiting offer (I'm {d})"</span>, .{ peer, s.my_id });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">teardownPeer</span>(s: *State) void {
    <span class="tok-kw">if</span> (s.pc != <span class="tok-num">0</span>) {
        rtc.<span class="tok-fn">close</span>(s.pc);
        s.pc = <span class="tok-num">0</span>;
    }
    s.peer_id = <span class="tok-num">0</span>;
    s.chan_open = .{ false, false };
    s.rtc_state_len = <span class="tok-num">0</span>;
}

<span class="tok-comment">// Relay a handshake message to our peer: "SIGNAL &lt;peer&gt; &lt;kind&gt; &lt;data&gt;".</span>
<span class="tok-kw">fn</span> <span class="tok-fn">signalPeer</span>(s: *State, kind: []<span class="tok-kw">const</span> u8, data: []<span class="tok-kw">const</span> u8) void {
    <span class="tok-kw">const</span> msg: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;s.send_buf, <span class="tok-str">"SIGNAL {d} {s} {s}"</span>, .{ s.peer_id, kind, data }) <span class="tok-kw">catch</span> {
        <span class="tok-fn">logf</span>(s, <span class="tok-str">"signal too big ({s}, {d}B)"</span>, .{ kind, data.len });
        <span class="tok-kw">return</span>;
    };
    ws.<span class="tok-fn">send</span>(s.sock, msg);
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleWsMessage</span>(s: *State, msg: []<span class="tok-kw">const</span> u8) void {
    <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">startsWith</span>(u8, msg, <span class="tok-str">"WELCOME "</span>)) {
        <span class="tok-comment">// WELCOME &lt;my_id&gt; [existing ids...]. Existing peers joined first (lower</span>
        <span class="tok-comment">// ids), so by convention they offer to us - we create + wait.</span>
        <span class="tok-kw">const</span> a: Split = <span class="tok-fn">splitFirst</span>(msg[<span class="tok-num">8</span>..]);
        s.my_id = std.fmt.<span class="tok-fn">parseInt</span>(u32, a.tok, <span class="tok-num">10</span>) <span class="tok-kw">catch</span> <span class="tok-num">0</span>;
        <span class="tok-fn">logf</span>(s, <span class="tok-str">"joined as peer {d}"</span>, .{s.my_id});
        <span class="tok-kw">if</span> (a.rest.len &gt; <span class="tok-num">0</span>) {
            <span class="tok-kw">const</span> b: Split = <span class="tok-fn">splitFirst</span>(a.rest);
            <span class="tok-kw">const</span> existing: u32 = std.fmt.<span class="tok-fn">parseInt</span>(u32, b.tok, <span class="tok-num">10</span>) <span class="tok-kw">catch</span> <span class="tok-num">0</span>;
            <span class="tok-kw">if</span> (existing != <span class="tok-num">0</span>) {
                <span class="tok-fn">startPeer</span>(s, existing, false); <span class="tok-comment">// we answer</span>
            }
        }
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">startsWith</span>(u8, msg, <span class="tok-str">"JOINED "</span>)) {
        <span class="tok-comment">// A newcomer (higher id) - we offer.</span>
        <span class="tok-kw">const</span> id: u32 = std.fmt.<span class="tok-fn">parseInt</span>(u32, <span class="tok-fn">splitFirst</span>(msg[<span class="tok-num">7</span>..]).tok, <span class="tok-num">10</span>) <span class="tok-kw">catch</span> <span class="tok-num">0</span>;
        <span class="tok-kw">if</span> (id != <span class="tok-num">0</span>) {
            <span class="tok-fn">startPeer</span>(s, id, true); <span class="tok-comment">// we offer</span>
        }
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">startsWith</span>(u8, msg, <span class="tok-str">"LEFT "</span>)) {
        <span class="tok-kw">const</span> id: u32 = std.fmt.<span class="tok-fn">parseInt</span>(u32, <span class="tok-fn">splitFirst</span>(msg[<span class="tok-num">5</span>..]).tok, <span class="tok-num">10</span>) <span class="tok-kw">catch</span> <span class="tok-num">0</span>;
        <span class="tok-kw">if</span> (id == s.peer_id) {
            <span class="tok-fn">logf</span>(s, <span class="tok-str">"peer {d} left"</span>, .{id});
            <span class="tok-fn">teardownPeer</span>(s);
        }
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">startsWith</span>(u8, msg, <span class="tok-str">"FROM "</span>)) {
        <span class="tok-comment">// FROM &lt;from&gt; &lt;kind&gt; &lt;data&gt; - the peer's half of the handshake.</span>
        <span class="tok-kw">const</span> a: Split = <span class="tok-fn">splitFirst</span>(msg[<span class="tok-num">5</span>..]); <span class="tok-comment">// from id</span>
        <span class="tok-kw">const</span> b: Split = <span class="tok-fn">splitFirst</span>(a.rest); <span class="tok-comment">// kind</span>
        <span class="tok-kw">const</span> kind: []<span class="tok-kw">const</span> u8 = b.tok;
        <span class="tok-kw">const</span> data: []<span class="tok-kw">const</span> u8 = b.rest;
        <span class="tok-kw">if</span> (s.pc == <span class="tok-num">0</span>) {
            <span class="tok-kw">return</span>;
        }
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, kind, <span class="tok-str">"offer"</span>)) {
            rtc.<span class="tok-fn">setRemote</span>(s.pc, true, data);
            <span class="tok-fn">logf</span>(s, <span class="tok-str">"got offer ({d}B), answering"</span>, .{data.len});
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, kind, <span class="tok-str">"answer"</span>)) {
            rtc.<span class="tok-fn">setRemote</span>(s.pc, false, data);
            <span class="tok-fn">logf</span>(s, <span class="tok-str">"got answer ({d}B)"</span>, .{data.len});
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, kind, <span class="tok-str">"ice"</span>)) {
            rtc.<span class="tok-fn">addIce</span>(s.pc, data);
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleRtcEvent</span>(s: *State, ev: rtc.Event) void {
    <span class="tok-kw">switch</span> (ev.kind) {
        .local_offer =&gt; {
            <span class="tok-fn">signalPeer</span>(s, <span class="tok-str">"offer"</span>, ev.payload);
            <span class="tok-fn">logf</span>(s, <span class="tok-str">"sent offer ({d}B)"</span>, .{ev.payload.len});
        },
        .local_answer =&gt; {
            <span class="tok-fn">signalPeer</span>(s, <span class="tok-str">"answer"</span>, ev.payload);
            <span class="tok-fn">logf</span>(s, <span class="tok-str">"sent answer ({d}B)"</span>, .{ev.payload.len});
        },
        .local_ice =&gt; {
            <span class="tok-fn">signalPeer</span>(s, <span class="tok-str">"ice"</span>, ev.payload);
        },
        .channel_open =&gt; {
            <span class="tok-kw">if</span> (ev.channel &lt; <span class="tok-num">2</span>) {
                s.chan_open[ev.channel] = true;
            }
            <span class="tok-fn">logf</span>(s, <span class="tok-str">"channel {d} open"</span>, .{ev.channel});
            <span class="tok-kw">if</span> (ev.channel == <span class="tok-num">1</span>) {
                <span class="tok-kw">var</span> g: [<span class="tok-num">64</span>]u8 = undefined;
                <span class="tok-kw">const</span> greet: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;g, <span class="tok-str">"hello from peer {d}"</span>, .{s.my_id}) <span class="tok-kw">catch</span> <span class="tok-str">"hello"</span>;
                rtc.<span class="tok-fn">send</span>(s.pc, <span class="tok-num">1</span>, greet);
            }
        },
        .data =&gt; {
            <span class="tok-fn">logf</span>(s, <span class="tok-str">"peer[ch{d}]: {s}"</span>, .{ ev.channel, ev.payload });
        },
        .state =&gt; {
            <span class="tok-fn">setRtcState</span>(s, ev.payload);
            <span class="tok-fn">logf</span>(s, <span class="tok-str">"rtc state: {s}"</span>, .{ev.payload});
        },
        .none =&gt; {},
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">20</span>);
    s.* = .{
        .gpa = gpa,
        .font = font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .url_buf = undefined,
        .url_len = <span class="tok-num">0</span>,
        .room_buf = undefined,
        .room_len = <span class="tok-num">0</span>,
        .sock = <span class="tok-num">0</span>,
        .joined = false,
        .my_id = <span class="tok-num">0</span>,
        .peer_id = <span class="tok-num">0</span>,
        .pc = <span class="tok-num">0</span>,
        .is_offerer = false,
        .chan_open = .{ false, false },
        .rtc_state = undefined,
        .rtc_state_len = <span class="tok-num">0</span>,
        .log = undefined,
        .log_len = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
        .log_n = <span class="tok-num">0</span>,
        .ws_buf = undefined,
        .rtc_buf = undefined,
        .send_buf = undefined,
    };
    <span class="tok-kw">const</span> origin: []<span class="tok-kw">const</span> u8 = ws.<span class="tok-fn">originUrl</span>(&amp;s.url_buf);
    s.url_len = origin.len;
    <span class="tok-builtin">@memcpy</span>(s.room_buf[<span class="tok-num">0</span>..default_room.len], default_room);

}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    <span class="tok-fn">teardownPeer</span>(s);
    <span class="tok-kw">if</span> (s.sock != <span class="tok-num">0</span>) {
        ws.<span class="tok-fn">close</span>(s.sock);

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// 1. Drive signaling.</span>
    <span class="tok-kw">if</span> (s.sock != <span class="tok-num">0</span>) {
        <span class="tok-kw">const</span> st: ws.State = ws.<span class="tok-fn">state</span>(s.sock);
        <span class="tok-kw">if</span> (st == .open <span class="tok-kw">and</span> !s.joined) {
            <span class="tok-kw">var</span> jb: [<span class="tok-num">96</span>]u8 = undefined;
            <span class="tok-kw">const</span> room: []<span class="tok-kw">const</span> u8 = s.room_buf[<span class="tok-num">0</span>..s.room_len];
            <span class="tok-kw">const</span> jmsg: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;jb, <span class="tok-str">"JOIN {s}"</span>, .{room}) <span class="tok-kw">catch</span> <span class="tok-str">"JOIN zimr-rtc-demo"</span>;
            ws.<span class="tok-fn">send</span>(s.sock, jmsg);
            s.joined = true;
        }
        <span class="tok-kw">if</span> (st == .open) {
            <span class="tok-kw">while</span> (ws.<span class="tok-fn">poll</span>(s.sock, &amp;s.ws_buf)) |m| {
                <span class="tok-fn">handleWsMessage</span>(s, m);
            }
        }
    }
    <span class="tok-comment">// 2. Drive the RTC connection.</span>
    <span class="tok-kw">if</span> (s.pc != <span class="tok-num">0</span>) {
        <span class="tok-kw">while</span> (rtc.<span class="tok-fn">poll</span>(s.pc, &amp;s.rtc_buf)) |ev| {
            <span class="tok-fn">handleRtcEvent</span>(s, ev);
        }
    }

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">14</span>, .g = <span class="tok-num">16</span>, .b = <span class="tok-num">22</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"P2P WebRTC (2 peers)"</span>, .{
        .initial_pos = .{ <span class="tok-num">12</span>, <span class="tok-num">12</span> },
        .initial_size = .{ <span class="tok-num">500</span>, <span class="tok-num">500</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        <span class="tok-kw">if</span> (s.sock == <span class="tok-num">0</span>) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"Signaling server:"</span>, .{});
            _ = u.<span class="tok-fn">inputTextWithHint</span>(<span class="tok-str">"Server URL"</span>, <span class="tok-str">"wss://your-app.onrender.com"</span>, &amp;s.url_buf, &amp;s.url_len, .{});
            _ = u.<span class="tok-fn">inputTextWithHint</span>(<span class="tok-str">"Room"</span>, <span class="tok-str">"room name"</span>, &amp;s.room_buf, &amp;s.room_len, .{});
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Connect"</span>, .{})) {
                <span class="tok-kw">if</span> (s.url_len &gt; <span class="tok-num">0</span>) {
                    s.sock = ws.<span class="tok-fn">open</span>(s.url_buf[<span class="tok-num">0</span>..s.url_len]);
                    s.joined = false;
                    s.my_id = <span class="tok-num">0</span>;
                }
            }
        } <span class="tok-kw">else</span> {
            <span class="tok-kw">const</span> st: ws.State = ws.<span class="tok-fn">state</span>(s.sock);
            <span class="tok-kw">const</span> st_txt: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">switch</span> (st) {
                .connecting =&gt; <span class="tok-str">"connecting"</span>,
                .open =&gt; <span class="tok-str">"open"</span>,
                .closed =&gt; <span class="tok-str">"closed"</span>,
            };
            u.<span class="tok-fn">text</span>(<span class="tok-str">"signaling: {s}    my id: {d}"</span>, .{ st_txt, s.my_id });
            <span class="tok-kw">if</span> (s.peer_id != <span class="tok-num">0</span>) {
                <span class="tok-kw">const</span> role: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.is_offerer) <span class="tok-str">"offerer"</span> <span class="tok-kw">else</span> <span class="tok-str">"answerer"</span>;
                u.<span class="tok-fn">text</span>(<span class="tok-str">"peer: {d}    role: {s}"</span>, .{ s.peer_id, role });
                <span class="tok-kw">const</span> rs: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.rtc_state_len &gt; <span class="tok-num">0</span>) s.rtc_state[<span class="tok-num">0</span>..s.rtc_state_len] <span class="tok-kw">else</span> <span class="tok-str">"negotiating"</span>;
                u.<span class="tok-fn">text</span>(<span class="tok-str">"rtc: {s}"</span>, .{rs});
                u.<span class="tok-fn">text</span>(<span class="tok-str">"ch0 cursor: {s}    ch1 clicks: {s}"</span>, .{ <span class="tok-fn">onoff</span>(s.chan_open[<span class="tok-num">0</span>]), <span class="tok-fn">onoff</span>(s.chan_open[<span class="tok-num">1</span>]) });
                <span class="tok-kw">if</span> (s.chan_open[<span class="tok-num">1</span>]) {
                    <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Send ping on reliable channel"</span>, .{})) {
                        <span class="tok-kw">var</span> mb: [<span class="tok-num">64</span>]u8 = undefined;
                        <span class="tok-kw">const</span> m: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;mb, <span class="tok-str">"ping from {d}"</span>, .{s.my_id}) <span class="tok-kw">catch</span> <span class="tok-str">"ping"</span>;
                        rtc.<span class="tok-fn">send</span>(s.pc, <span class="tok-num">1</span>, m);
                        <span class="tok-fn">logf</span>(s, <span class="tok-str">"-&gt; sent: {s}"</span>, .{m});
                    }
                }
            } <span class="tok-kw">else</span> {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"waiting for another tab in room '{s}'..."</span>, .{s.room_buf[<span class="tok-num">0</span>..s.room_len]});
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Disconnect"</span>, .{})) {
                <span class="tok-fn">teardownPeer</span>(s);
                ws.<span class="tok-fn">close</span>(s.sock);
                s.sock = <span class="tok-num">0</span>;
                s.joined = false;
            }
        }

        u.<span class="tok-fn">text</span>(<span class="tok-str">"--- log ---"</span>, .{});
        <span class="tok-kw">const</span> total: usize = s.log_n;
        <span class="tok-kw">const</span> start: usize = <span class="tok-kw">if</span> (total &gt; max_log) total - max_log <span class="tok-kw">else</span> <span class="tok-num">0</span>;
        <span class="tok-kw">var</span> i: usize = start;
        <span class="tok-kw">while</span> (i &lt; total) : (i += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> slot: usize = i % max_log;
            u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{s.log[slot][<span class="tok-num">0</span>..s.log_len[slot]]});
        }
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
