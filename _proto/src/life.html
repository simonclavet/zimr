<!doctype html>
<html lang="en">
<head>

<title>life — source</title>
<style>
:root{
  /* two surfaces, one ink */
  --bg:#0a0a0a;          /* the page */
  --panel:#141414;       /* anything set apart: code, callout, device side */
  --panel-2:#1b1b1b;     /* a panel on a panel (figcaption, summary) */
  --fg:#e8e8e8;          /* body text */
  --dim:#9aa0a8;         /* secondary text, captions */
  --faint:#6b7280;       /* labels, line numbers, table headers */
  --rule:#262626;        /* every border in the document */
  --link:#82d8ef;
  /* tokens — the one set, shared by the Zig and WGSL highlighters */
  --tok-comment:#6b7a8c;
  --tok-kw:#c792ea;
  --tok-fn:#82d8ef;
  --tok-str:#9ad08a;
  --tok-num:#f5a35e;
  --tok-type:#6fb6ff;
  --tok-builtin:#e9a23b;
  /* one font: mono, from whatever ships on the device. No download. */
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --maxw:860px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0 auto;padding:2.2rem 1.1rem 6rem;max-width:var(--maxw);
  background:var(--bg);color:var(--fg);
  font-family:var(--mono);font-size:15px;line-height:1.65;
}
h1,h2,h3,h4{font-family:var(--mono);font-weight:700;line-height:1.25;margin:2.2em 0 .7em;}
h1{font-size:1.6rem;margin-top:0;}
h2{font-size:1.25rem;border-bottom:1px solid var(--rule);padding-bottom:.35em;}
h3{font-size:1.05rem;}
h4{font-size:.95rem;color:var(--dim);}
p{margin:0 0 1.1em;}
a{color:var(--link);text-decoration:none;border-bottom:1px solid var(--rule);}
a:hover{border-bottom-color:var(--link);}
strong,b{color:#fff;font-weight:700;}
em,i{color:var(--dim);font-style:italic;}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0;}
small,.dim{color:var(--dim);font-size:.87em;}
.faint{color:var(--faint);}
ul,ol{margin:0 0 1.1em;padding-left:1.5em;}
li{margin:.3em 0;}
blockquote{margin:1.2em 0;padding:.1em 0 .1em 1em;border-left:2px solid var(--rule);color:var(--dim);}
/* code */
pre{
  margin:1.1em 0;padding:14px 16px;background:var(--panel);
  border:1px solid var(--rule);border-radius:3px;
  overflow-x:auto;font-size:13px;line-height:1.6;
}
pre,code,kbd,samp{font-family:var(--mono);}
pre code{background:none;padding:0;border:0;font-size:inherit;color:var(--fg);}
code{background:var(--panel);padding:.1em .35em;border-radius:2px;font-size:.92em;color:#fff;}
.tok-comment{color:var(--tok-comment);font-style:italic;}
.tok-kw{color:var(--tok-kw);}
.tok-fn{color:var(--tok-fn);}
.tok-str{color:var(--tok-str);}
.tok-num{color:var(--tok-num);}
.tok-type{color:var(--tok-type);}
.tok-builtin{color:var(--tok-builtin);}
/* a captioned code block: <figure class="code"><figcaption>… */
figure{margin:1.3em 0;}
figure.code{margin:1.3em 0;}
figure.code figcaption{
  background:var(--panel-2);border:1px solid var(--rule);border-bottom:0;
  border-radius:3px 3px 0 0;padding:6px 12px;font-size:11.5px;color:var(--faint);
  display:flex;justify-content:space-between;gap:1em;
}
figure.code figcaption .lang{color:var(--dim);text-transform:uppercase;letter-spacing:.16em;}
figure.code pre{margin:0;border-radius:0 0 3px 3px;}
/* folds — pure CSS, no JS. The summary text is just the name; the prose
   comes from ::before, which is zimrnum-tutorial's trick and a good one. */
details{border:1px solid var(--rule);border-radius:3px;margin:.5em 0;background:var(--panel);}
details[open]{background:var(--bg);}
summary{
  cursor:pointer;padding:.4em .8em;color:var(--dim);font-size:.9em;
  list-style:none;user-select:none;
}
summary::-webkit-details-marker{display:none;}
summary::before{content:"\\25b8\\00a0";color:var(--faint);}
details[open]>summary::before{content:"\\25be\\00a0";}
summary:hover{color:var(--fg);}
details>pre{margin:0;border:0;border-top:1px solid var(--rule);border-radius:0;}
.src-fold>summary::after{content:" \\2014 source";color:var(--faint);}
/* callouts — one box, a coloured left rule says which kind */
.note,.warn,.good,.bad{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left-width:3px;border-radius:3px;
}
.note{border-left-color:var(--tok-fn);}
.warn{border-left-color:var(--tok-builtin);}
.good{border-left-color:var(--tok-str);}
.bad{border-left-color:#e0555f;}
/* tables */
table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:13px;}
th,td{border:1px solid var(--rule);padding:.45em .7em;text-align:left;vertical-align:top;}
th{color:var(--faint);font-weight:700;background:var(--panel);}
/* the CPU/GPU split: two surfaces, same two colours as everything else */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:1.3em 0;}
.split>*{min-width:0;}
.split-cpu,.split-gpu{border:1px solid var(--rule);border-radius:3px;padding:2px;}
.split-cpu{background:var(--bg);}
.split-gpu{background:var(--panel);}
.split-cpu>pre,.split-gpu>pre{margin:0;border:0;background:none;}
.split h4,.split .lab{

  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--rule);
}
@media(max-width:700px){.split{grid-template-columns:1fr;}}
/* media */
img,svg,canvas,video{max-width:100%;height:auto;}
iframe{max-width:100%;border:1px solid var(--rule);border-radius:3px;background:#000;}
/* a live demo embedded in a page: the full column, 16:9. Without a size the
   frame is the browser default 300x150 and the app boots that small. */
.demo-embed{margin:1.6em 0;}
.demo-embed iframe{display:block;width:100%;aspect-ratio:16/9;}
.demo-embed figcaption{color:var(--dim);font-size:.9em;margin-top:.5em;}
/* Inline marks the pages already use, mapped onto the SAME token colours
   rather than given colours of their own — cheatsheet's signature rows,
   the reference tables, and the two semantic marks that carry teaching
   weight in shader-authoring (`hazard` = the hand-counted integer, and the
   old/new path contrast). One palette, reused. */
.sig{margin:1.2em 0 .2em;padding-top:.8em;border-top:1px solid var(--rule);}
.k{color:var(--tok-kw);}
.nm{color:var(--tok-fn);font-weight:700;}
.ns{color:var(--faint);}
.eq{color:var(--dim);}
.doc{color:var(--dim);margin:.2em 0 .6em;}
.num,.n{color:var(--tok-num);}
.host,.lab,.lang,.path,.tag,.stage,.sec-num,.lesson-num{
  color:var(--faint);font-size:.85em;letter-spacing:.12em;text-transform:uppercase;
}
.anchor{border:0;color:var(--faint);opacity:0;padding-left:.4em;}
h1:hover .anchor,h2:hover .anchor,h3:hover .anchor{opacity:1;}
.chip{
  display:inline-block;padding:.05em .5em;margin:0 .15em;border:1px solid var(--rule);
  border-radius:2px;color:var(--dim);font-size:.82em;
}
.chip.on{color:var(--fg);border-color:var(--tok-fn);}
.hazard{color:#e0555f;font-weight:700;}
.hl-old{color:var(--tok-builtin);}
.hl-new{color:var(--tok-fn);}
.yes,.good-mark{color:var(--tok-str);}
.callout{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-fn);border-radius:3px;
}
.zn-source{margin:.6em 0 1.4em;}
.lesson{margin:2em 0;}
.lesson-title{font-weight:700;color:#fff;}
.lesson-goal{color:var(--dim);}
/* page furniture: the landing page and the tutorials' own scaffolding */
.blog-container,.wrap,.max{max-width:var(--maxw);margin:0 auto;}
.title{font-size:1.8rem;margin:0 0 .2em;}
.subtitle,.lede,.sub{
  border:0;font-size:1rem;font-weight:400;color:var(--dim);
  margin:0 0 1.6em;line-height:1.6;
}
.eyebrow{color:var(--faint);font-size:.85em;letter-spacing:.14em;text-transform:uppercase;}
.toplinks{
  display:flex;flex-wrap:wrap;gap:.1em 1.1em;margin:0 0 2em;
  padding:.9em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:.88em;
}
.toplinks a{border:0;color:var(--dim);}
.toplinks a:hover,.toplinks a.offsite{color:var(--link);}
.wip-warning{
  margin:0 0 2em;padding:.8em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-builtin);border-radius:3px;
  color:var(--dim);font-size:.9em;
}
.wip-warning strong{display:block;color:var(--tok-builtin);margin-bottom:.2em;}
/* cheatsheet: one declaration per .fn row */
.fn{margin:1.1em 0;}
.what,.body{color:var(--dim);}
.sketch{color:var(--dim);}
.pane{border:1px solid var(--rule);border-radius:3px;margin:1.1em 0;}
.pane-head{
  padding:5px 11px;background:var(--panel-2);border-bottom:1px solid var(--rule);
  color:var(--faint);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
}
.cell{padding:.5em .8em;}
.swatch{display:inline-block;width:.9em;height:.9em;border:1px solid var(--rule);vertical-align:-1px;}
.old,.meh{color:var(--tok-builtin);}
.new,.win{color:var(--tok-str);}
.crit{
  margin:1.2em 0;padding:.7em 1em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid #e0555f;border-radius:3px;
}
/* The examples gallery (index.html): the list of examples on the left, the
   selected one running in a frame that fills the rest. On a phone the list
   is a drawer over the example, under the bar. `list-open` shows the list. */
body.gallery{
  max-width:none;margin:0;padding:0;height:100vh;height:100dvh;overflow:hidden;
  display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);
  color-scheme:dark;
}
body.gallery.list-open{grid-template-columns:minmax(240px,25%) 1fr;}
.gallery a{border:0;}
.g-side{display:none;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--rule);}
.list-open .g-side{display:flex;}
.g-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 1em;padding:.7em 1em .6em;font-size:.85em;}
.g-head a{color:var(--dim);}
.g-head a:hover{color:var(--link);}
.g-head .g-logo{margin-right:auto;font-size:1.1rem;font-weight:700;color:var(--fg);white-space:nowrap;}
.g-filters{display:flex;flex-wrap:wrap;gap:.4em;padding:0 1em;}
.g-filters input,.g-filters select{
  min-width:0;padding:.35em .5em;background:var(--panel);color:var(--fg);
  border:1px solid var(--rule);border-radius:3px;font:inherit;font-size:.85em;
}
.g-filters input{flex:1 1 10em;}
.g-filters select{flex:1 1 auto;}
.g-filters input:focus,.g-filters select:focus{outline:none;border-color:var(--tok-fn);}
.g-count{padding:.45em 1em;color:var(--faint);font-size:.75em;border-bottom:1px solid var(--rule);}
.g-list{flex:1;overflow-y:auto;padding-bottom:3em;font-size:13px;}
.g-group{
  position:sticky;top:0;padding:.8em 1em .3em;background:var(--bg);
  color:var(--faint);font-size:.8em;letter-spacing:.14em;text-transform:uppercase;
}
/* scroll-margin: scrolled into view, a row clears the sticky module heading */
.g-item{
  display:flex;justify-content:space-between;gap:.6em;padding:.15em 1em;
  color:var(--dim);border-left:2px solid transparent;scroll-margin-top:2.4em;
}
.g-item:hover{color:var(--fg);background:var(--panel);}
.g-item.on{color:#fff;background:var(--panel-2);border-left-color:var(--tok-fn);}
.g-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-stars{color:var(--faint);font-size:.8em;white-space:nowrap;}
.g-none{padding:1em;color:var(--faint);}
.g-main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.g-bar{
  flex:none;display:flex;align-items:center;gap:.4em;height:44px;padding:0 .6em;
  border-bottom:1px solid var(--rule);white-space:nowrap;
}
.g-btn{
  flex:none;width:30px;height:30px;padding:0;background:var(--panel);color:var(--dim);
  border:1px solid var(--rule);border-radius:3px;font:inherit;cursor:pointer;
}
.g-btn:hover{color:var(--fg);border-color:var(--tok-fn);}
.g-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding-left:.4em;}
.g-desc{margin-left:.6em;color:var(--dim);font-size:.9em;}
.g-open{flex:none;padding:0 .4em;font-size:.9em;}
.g-stage{flex:1;position:relative;min-height:0;}
.g-stage iframe{position:absolute;inset:0;width:100%;height:100%;max-width:none;border:0;border-radius:0;}
.g-intro{max-width:36em;margin:12vh auto 0;padding:0 1.5em;}
@media(max-width:700px){
  body.gallery.list-open{grid-template-columns:1fr;}
  .g-side{position:fixed;inset:44px 0 0 0;z-index:1;border-right:0;}
  .g-item{padding:.45em 1em;}
  .g-desc{display:none;}
}
/* A tutorial pointer, sitting directly under the heading whose subject it
   covers rather than pooled in a list at the foot of the page. */
.tut{
  margin:.2em 0 1.3em;padding:.55em .9em;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--tok-fn);border-radius:3px;
  color:var(--dim);font-size:.9em;
}
.tut a{color:var(--link);border:0;font-weight:700;}
.tut-index{list-style:none;padding-left:0;}
.tut-index li{padding:.25em 0;border-bottom:1px solid var(--rule);}
.tut-index a{border:0;}
/* `.reveal` was animated in by the JS that docfmt replaced; without a rule
   it is simply visible, which is the correct end state. */
@media(max-width:700px){body{font-size:14px;padding:1.4rem .8rem 4rem;}pre{font-size:12px;}}

<body class="src-page">
<h1>life</h1>
<figure class="code src-file" data-path="examples/life/life.zig" data-lines="245"><figcaption><span>examples/life/life.zig</span><span>245 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">// examples/life.zig - Conway's Game of Life on an 80x45 grid.</span>
<span class="tok-comment">// A small but substantial demo that exercises shapes + input + text +</span>
<span class="tok-comment">// frame timing in one place.  The generation step is throttled to</span>
<span class="tok-comment">// ~10 Hz so cells are visible; rendering runs at full 60 Hz so the</span>
<span class="tok-comment">// mouse-paint feels responsive between generations.</span>
<span class="tok-comment">// Controls:</span>
<span class="tok-comment">//   left click / drag  toggle cells (paint mode)</span>
<span class="tok-comment">//   space              pause / resume the simulation</span>
<span class="tok-comment">//   c                  clear the grid</span>
<span class="tok-comment">//   r                  randomize (~25% alive density)</span>
<span class="tok-comment">//   1-9                speed control (1 = slow, 9 = fast)</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> allocPrint = std.fmt.allocPrint;
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> pow = zm.pow;

<span class="tok-kw">const</span> grid_w = <span class="tok-num">80</span>;
<span class="tok-kw">const</span> grid_h = <span class="tok-num">45</span>;
<span class="tok-kw">const</span> cell_px = <span class="tok-num">10</span>; <span class="tok-comment">// 10x10 pixels per cell -&gt; 800x450 canvas</span>

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// Owned shapes-texture state. id=1 -&gt; rlgl's internal 1x1 white pixel.</span>
    <span class="tok-comment">/// Owned default-font cache. Populated by `loadFontFromTtfBytes` below.</span>
    font: z.Font,
    ui_host: z.UiHost,
    ui_capturing: bool = false,
    <span class="tok-comment">/// Per-frame scratch arena, reset at top of update by user code.</span>
    scratch: std.heap.ArenaAllocator,
    cur: [grid_w * grid_h]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    next: [grid_w * grid_h]u8 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    generation: usize = <span class="tok-num">0</span>,
    paused: bool = true,
    <span class="tok-comment">/// Throttle the simulation step.  step_interval seconds between</span>
    <span class="tok-comment">/// generations; user-tunable via the 1-9 keys.</span>
    step_interval: f32 = <span class="tok-num">0.10</span>,
    last_step_time: f64 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.scratch.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">idx</span>(x: usize, y: usize) usize {
    <span class="tok-kw">return</span> y * grid_w + x;
}

<span class="tok-comment">/// Place the classic 3-cell glider.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">seedGlider</span>(
    grid: *[grid_w * grid_h]u8,
    x: usize,
    y: usize,
) void {
    grid[<span class="tok-fn">idx</span>(x + <span class="tok-num">1</span>, y)] = <span class="tok-num">1</span>;
    grid[<span class="tok-fn">idx</span>(x + <span class="tok-num">2</span>, y + <span class="tok-num">1</span>)] = <span class="tok-num">1</span>;
    grid[<span class="tok-fn">idx</span>(x, y + <span class="tok-num">2</span>)] = <span class="tok-num">1</span>;
    grid[<span class="tok-fn">idx</span>(x + <span class="tok-num">1</span>, y + <span class="tok-num">2</span>)] = <span class="tok-num">1</span>;
    grid[<span class="tok-fn">idx</span>(x + <span class="tok-num">2</span>, y + <span class="tok-num">2</span>)] = <span class="tok-num">1</span>;
}

<span class="tok-comment">/// Seed with a glider in the top-left so first frame shows movement.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(
    gpa: Allocator,
    f: *z.Frame,
    s: *State,
) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">32</span>);
    s.* = .{ .scratch = std.heap.ArenaAllocator.<span class="tok-fn">init</span>(gpa), .font = font, .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font) };
    <span class="tok-fn">seedGlider</span>(&amp;s.cur, <span class="tok-num">5</span>, <span class="tok-num">5</span>);
}

<span class="tok-comment">/// Advance the grid by one Conway generation.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">step</span>(s: *State) void {
    <span class="tok-kw">var</span> y: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (y &lt; grid_h) : (y += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> x: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (x &lt; grid_w) : (x += <span class="tok-num">1</span>) {
            <span class="tok-comment">// Count live neighbours.  Treat off-grid as dead.</span>
            <span class="tok-kw">var</span> n: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">var</span> dy: i32 = -<span class="tok-num">1</span>;
            <span class="tok-kw">while</span> (dy &lt;= <span class="tok-num">1</span>) : (dy += <span class="tok-num">1</span>) {
                <span class="tok-kw">var</span> dx: i32 = -<span class="tok-num">1</span>;
                <span class="tok-kw">while</span> (dx &lt;= <span class="tok-num">1</span>) : (dx += <span class="tok-num">1</span>) {
                    <span class="tok-kw">if</span> (dx == <span class="tok-num">0</span> <span class="tok-kw">and</span> dy == <span class="tok-num">0</span>) {
                        <span class="tok-kw">continue</span>;
                    }
                    <span class="tok-kw">const</span> nx = <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(x)) + dx;
                    <span class="tok-kw">const</span> ny = <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(y)) + dy;
                    <span class="tok-kw">if</span> (nx &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> nx &gt;= grid_w <span class="tok-kw">or</span> ny &lt; <span class="tok-num">0</span> <span class="tok-kw">or</span> ny &gt;= grid_h) {
                        <span class="tok-kw">continue</span>;
                    }
                    <span class="tok-kw">if</span> (s.cur[<span class="tok-fn">idx</span>(<span class="tok-builtin">@intCast</span>(nx), <span class="tok-builtin">@intCast</span>(ny))] != <span class="tok-num">0</span>) {
                        n += <span class="tok-num">1</span>;
                    }
                }
            }
            <span class="tok-kw">const</span> alive: bool = s.cur[<span class="tok-fn">idx</span>(x, y)] != <span class="tok-num">0</span>;
            <span class="tok-kw">const</span> survives: bool = (alive <span class="tok-kw">and</span> (n == <span class="tok-num">2</span> <span class="tok-kw">or</span> n == <span class="tok-num">3</span>)) <span class="tok-kw">or</span> (!alive <span class="tok-kw">and</span> n == <span class="tok-num">3</span>);
            s.next[<span class="tok-fn">idx</span>(x, y)] = <span class="tok-kw">if</span> (survives) <span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-num">0</span>;
        }
    }
    s.cur = s.next;
    s.generation += <span class="tok-num">1</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, state: *State) void {
    _ = state.scratch.<span class="tok-fn">reset</span>(.retain_capacity);
    <span class="tok-comment">// ---- Input handling ---------------------------------------------------</span>
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .space)) {
        state.paused = !state.paused;
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .c)) {
        state.cur = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>);
        state.generation = <span class="tok-num">0</span>;
    }
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, .r)) {
        <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (i &lt; state.cur.len) : (i += <span class="tok-num">1</span>) {
            state.cur[i] = <span class="tok-kw">if</span> (f.random.<span class="tok-fn">uintLessThan</span>(u32, <span class="tok-num">4</span>) == <span class="tok-num">0</span>) <span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-num">0</span>;
        }
        state.generation = <span class="tok-num">0</span>;
    }
    <span class="tok-comment">// 1-9 = speed control (1 = slow @ 1Hz, 9 = fast @ 60Hz capped).</span>
    <span class="tok-kw">const</span> digit_keys = [_]z.KeyboardKey{
        .one, .two,   .three, .four, .five,
        .six, .seven, .eight, .nine,
    };
    <span class="tok-kw">for</span> (digit_keys, <span class="tok-num">1</span>..) |k, slot_idx| {
        <span class="tok-kw">if</span> (z.<span class="tok-fn">isKeyPressed</span>(f.input, k)) {
            <span class="tok-kw">const</span> slot: f32 = <span class="tok-fn">float</span>(slot_idx);
            <span class="tok-comment">// Slot 1 -&gt; 1.0s, Slot 9 -&gt; 0.016s (60 Hz).  Geometric.</span>
            state.step_interval = <span class="tok-fn">pow</span>(<span class="tok-num">0.5</span>, slot - <span class="tok-num">1</span>) * <span class="tok-num">0.5</span>;
        }
    }
    <span class="tok-comment">// Mouse paint: hold left button to toggle cells under the cursor.</span>
    <span class="tok-comment">// Skip when the UI had the mouse last frame (dragging the panel must not</span>
    <span class="tok-comment">// paint through it). One-frame lag on the hit-test is imperceptible.</span>
    <span class="tok-kw">if</span> (!state.ui_capturing <span class="tok-kw">and</span> z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left)) {
        <span class="tok-kw">const</span> mx: i32 = <span class="tok-builtin">@divFloor</span>(z.<span class="tok-fn">getMouseX</span>(f.input), cell_px);
        <span class="tok-kw">const</span> my: i32 = <span class="tok-builtin">@divFloor</span>(z.<span class="tok-fn">getMouseY</span>(f.input), cell_px);
        <span class="tok-kw">if</span> (mx &gt;= <span class="tok-num">0</span> <span class="tok-kw">and</span> mx &lt; grid_w <span class="tok-kw">and</span> my &gt;= <span class="tok-num">0</span> <span class="tok-kw">and</span> my &lt; grid_h) {
            state.cur[<span class="tok-fn">idx</span>(<span class="tok-builtin">@intCast</span>(mx), <span class="tok-builtin">@intCast</span>(my))] = <span class="tok-num">1</span>;
        }
    }

    <span class="tok-comment">// ---- Simulation step ---------------------------------------------------</span>
    <span class="tok-kw">if</span> (!state.paused) {
        <span class="tok-kw">const</span> t: f32 = <span class="tok-builtin">@floatCast</span>(f.time.time);
        <span class="tok-kw">if</span> (t - state.last_step_time &gt;= state.step_interval) {
            <span class="tok-fn">step</span>(state);
            state.last_step_time = t;
        }
    }

    <span class="tok-comment">// ---- Render ------------------------------------------------------------</span>
    z.<span class="tok-fn">clearViewport</span>(f, z.colors.slate_900);

    <span class="tok-comment">// Live cells as filled rectangles.  Background grid omitted - at</span>
    <span class="tok-comment">// 10px cells a flat dark background reads cleaner than gridlines.</span>
    <span class="tok-kw">var</span> alive_count: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> y: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (y &lt; grid_h) : (y += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> x: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (x &lt; grid_w) : (x += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (state.cur[<span class="tok-fn">idx</span>(x, y)] != <span class="tok-num">0</span>) {
                f.gl.<span class="tok-fn">rect</span>(.{
                    .x = <span class="tok-fn">float</span>(x * cell_px),
                    .y = <span class="tok-fn">float</span>(y * cell_px),
                    .width = <span class="tok-fn">float</span>(cell_px - <span class="tok-num">1</span>),
                    .height = <span class="tok-comment">// 1-pixel gutter for readability</span>
                    <span class="tok-fn">float</span>(cell_px - <span class="tok-num">1</span>),
                }, .{ .color = z.colors.amber_400 });
                alive_count += <span class="tok-num">1</span>;
            }
        }
    }

    <span class="tok-comment">// ---- HUD ---------------------------------------------------------------</span>
    <span class="tok-kw">const</span> hud_color: Color = <span class="tok-kw">if</span> (state.paused) z.colors.sky_300 <span class="tok-kw">else</span> z.colors.white;
    <span class="tok-kw">const</span> hud: []u8 = <span class="tok-fn">allocPrint</span>(state.scratch.<span class="tok-fn">allocator</span>(), <span class="tok-str">"gen {d}   alive {d}   step {d:.3}s   {s}"</span>, .{
        state.generation,
        alive_count,
        state.step_interval,
        <span class="tok-kw">if</span> (state.paused) <span class="tok-str">"[PAUSED]"</span> <span class="tok-kw">else</span> <span class="tok-str">"[running]"</span>,
    }) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, hud, .{ .size = <span class="tok-num">18</span>, .color = hud_color, .font = &amp;state.font });

    <span class="tok-kw">const</span> help: []<span class="tok-kw">const</span> u8 = <span class="tok-str">"tap a cell to paint  -  buttons below"</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">8</span>, grid_h * cell_px - <span class="tok-num">24</span> }, help, .{ .size = <span class="tok-num">14</span>, .color = z.colors.slate_400, .font = &amp;state.font });

    <span class="tok-comment">// ---- Touch-friendly control panel (the keyboard shortcuts still work on</span>
    <span class="tok-comment">// desktop; these give phones a way to pause/clear/seed/speed). ----</span>
    <span class="tok-kw">const</span> ui: z.ui_real.Ui = state.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">if</span> (ui.<span class="tok-fn">window</span>(<span class="tok-str">"Life"</span>, .{ .initial_pos = .{ <span class="tok-num">14</span>, <span class="tok-num">40</span> }, .initial_size = .{ <span class="tok-num">200</span>, <span class="tok-num">210</span> } })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (ui.<span class="tok-fn">button</span>(<span class="tok-kw">if</span> (state.paused) <span class="tok-str">"resume"</span> <span class="tok-kw">else</span> <span class="tok-str">"pause"</span>, .{})) {
            state.paused = !state.paused;
        }
        <span class="tok-kw">if</span> (ui.<span class="tok-fn">button</span>(<span class="tok-str">"clear"</span>, .{})) {
            state.cur = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>);
            state.generation = <span class="tok-num">0</span>;
        }
        <span class="tok-kw">if</span> (ui.<span class="tok-fn">button</span>(<span class="tok-str">"random"</span>, .{})) {
            <span class="tok-kw">var</span> i: usize = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (i &lt; state.cur.len) : (i += <span class="tok-num">1</span>) {
                state.cur[i] = <span class="tok-kw">if</span> (f.random.<span class="tok-fn">uintLessThan</span>(u32, <span class="tok-num">4</span>) == <span class="tok-num">0</span>) <span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-num">0</span>;
            }
            state.generation = <span class="tok-num">0</span>;
        }
        <span class="tok-comment">// Speed slider: maps step interval 1.0s (slow) .. 0.016s (fast).</span>
        <span class="tok-kw">var</span> hz: f32 = <span class="tok-num">1.0</span> / state.step_interval;
        <span class="tok-kw">if</span> (ui.<span class="tok-fn">slider</span>(<span class="tok-str">"speed (hz)"</span>, &amp;hz, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">60</span> })) {
            state.step_interval = <span class="tok-num">1.0</span> / hz;
        }
    }
    state.ui_capturing = ui.<span class="tok-fn">wantCaptureMouse</span>();
    state.ui_host.<span class="tok-fn">render</span>(f);

    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

            .height = grid_h * cell_px,
        },

};
