<h1>pipeline_postprocess</h1>
<figure class="code src-file" data-path="examples/pipeline_postprocess/pipeline_postprocess.zig" data-lines="183"><figcaption><span>examples/pipeline_postprocess/pipeline_postprocess.zig</span><span>183 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! pipeline_postprocess - a pass whose INPUT is a previous pass's output.</span>
<span class="tok-comment">//! Render a spinning gradient triangle into a RenderTexture, then a FULLSCREEN</span>
<span class="tok-comment">//! shader SAMPLES that texture and applies a screen-space effect (chromatic</span>
<span class="tok-comment">//! aberration + vignette). The post-processing / bloom foundation.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! No inline WGSL: every shader is authored in Zig.</span>
<span class="tok-comment">//!   - Scene pass reuses the `pipeline_uniforms` shaders (a vertex-stage mat4</span>
<span class="tok-comment">//!     transform + gradient) rendered into the RT.</span>
<span class="tok-comment">//!   - Post pass = the fullscreen `trivial_vs` + `postprocess_post_fs`,</span>
<span class="tok-comment">//!     which declares a `scene` sampler. That sampler is the FIRST texture bound</span>
<span class="tok-comment">//!     through `z.shader.loadShaderVF` - the unified `Resources` machinery</span>
<span class="tok-comment">//!     builds its bind group; no hand-built pipeline. The texture is supplied by</span>
<span class="tok-comment">//!     name: `.textures = .{ .scene = rt.asTexture() }`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The scene triangle is aspect-corrected for the WINDOW before going into the</span>
<span class="tok-comment">//! square RT, so the full-bleed post pass (square RT stretched to screen) shows</span>
<span class="tok-comment">//! it undistorted.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Build:  zig build wgpu-pipeline-postprocess</span>
<span class="tok-comment">//! Device: zig build wgpu-pipeline-postprocess-standalone -Dmode=release</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> rotationZ = zm.rotationZ;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// Scene pass: reuse the pipeline_uniforms shaders (VS-stage mat4 transform).</span>
<span class="tok-kw">const</span> scene_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pipeline_uniforms_vs.wgsl"</span>);
<span class="tok-kw">const</span> scene_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pipeline_uniforms_fs.wgsl"</span>);
<span class="tok-kw">const</span> scene_vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_vs_io.zig"</span>);
<span class="tok-kw">const</span> scene_fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_fs_io.zig"</span>);

<span class="tok-comment">// Post pass: fullscreen trivial VS + the chromatic/vignette FS (a sampler shader).</span>
<span class="tok-kw">const</span> post_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"trivial_vs.wgsl"</span>);
<span class="tok-kw">const</span> post_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"postprocess_post_fs.wgsl"</span>);
<span class="tok-kw">const</span> post_vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"trivial_vs_io.zig"</span>);
<span class="tok-kw">const</span> post_fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"postprocess_post_fs_io.zig"</span>);

<span class="tok-kw">const</span> rt_size: i32 = <span class="tok-num">720</span>;

<span class="tok-comment">/// Scene vertex: clip-ish position + per-vertex colour (matches the</span>
<span class="tok-comment">/// pipeline_uniforms vertex layout: vec2 @0, vec3 @1).</span>
<span class="tok-kw">const</span> Vertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    x: f32,
    y: f32,
    r: f32,
    g: f32,
    b: f32,
};

<span class="tok-kw">const</span> vertices = [_]Vertex{
    .{ .x = <span class="tok-num">0.0</span>, .y = <span class="tok-num">0.7</span>, .r = <span class="tok-num">1.0</span>, .g = <span class="tok-num">0.2</span>, .b = <span class="tok-num">0.2</span> },
    .{ .x = -<span class="tok-num">0.7</span>, .y = -<span class="tok-num">0.6</span>, .r = <span class="tok-num">0.2</span>, .g = <span class="tok-num">1.0</span>, .b = <span class="tok-num">0.3</span> },
    .{ .x = <span class="tok-num">0.7</span>, .y = -<span class="tok-num">0.6</span>, .r = <span class="tok-num">0.3</span>, .g = <span class="tok-num">0.4</span>, .b = <span class="tok-num">1.0</span> },
};

<span class="tok-comment">/// transform = scale(sx, sy) * rotateZ(angle), in zm row convention so the</span>
<span class="tok-comment">/// shader's `mulMatPoint` matches WGSL `m * vec4(p, 1)`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">transform2d</span>(angle: f32, sx: f32, sy: f32) zm.Mat {
    <span class="tok-kw">return</span> <span class="tok-fn">mulMat</span>(<span class="tok-fn">scaling</span>(sx, sy, <span class="tok-num">1.0</span>), <span class="tok-fn">rotationZ</span>(angle));
}

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    rt: z.RenderTexture,
    vbo: z.wgpu.BufferHandle,
    scene: z.shader.<span class="tok-fn">LoadedShader</span>(scene_vs_io),
    post: z.shader.<span class="tok-fn">LoadedShader</span>(post_fs_io),
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.scene.<span class="tok-fn">deinit</span>();
    s.post.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
    s.rt.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(vertices)),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"scene_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;vertices));

    <span class="tok-kw">const</span> rt: z.RenderTexture = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, rt_size, rt_size);

    <span class="tok-comment">// Scene shader (renders into the RT - pin to the RT's rgba8/no-depth pass).</span>
    <span class="tok-kw">const</span> scene: z.shader.<span class="tok-fn">LoadedShader</span>(scene_vs_io) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(scene_vs_io, scene_fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = scene_vs_wgsl,
        .fs_wgsl_source = scene_fs_wgsl,
        .vertex_buffer_layouts = &amp;.{z.shader.<span class="tok-fn">vertexLayout</span>(scene_vs_io)},
        .initial_ubo = .{ .transform = <span class="tok-fn">transform2d</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>) },
        .color_format = .rgba8_unorm,
        .depth_state = .none,
        .label = <span class="tok-str">"postprocess_scene"</span>,
    });

    <span class="tok-comment">// Post shader: fullscreen, samples the RT. The `scene` sampler is bound by</span>
    <span class="tok-comment">// name from the schema's `Samplers` - the new unified texture path.</span>
    <span class="tok-kw">const</span> post: z.shader.<span class="tok-fn">LoadedShader</span>(post_fs_io) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(post_vs_io, post_fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = post_vs_wgsl,
        .fs_wgsl_source = post_fs_wgsl,
        .textures = .{ .scene = rt.<span class="tok-fn">asTexture</span>() },
        .label = <span class="tok-str">"postprocess_post"</span>,
    });

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>),
        .rt = rt,
        .vbo = vbo,
        .scene = scene,
        .post = post,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// 1) Scene -&gt; render texture. Aspect-correct for the window so the</span>
    <span class="tok-comment">//    full-bleed post pass (square RT stretched to screen) is undistorted.</span>
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> aspect: f32 = w / <span class="tok-builtin">@max</span>(h, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> sx: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span> / aspect;
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) aspect <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
    s.scene.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .transform = <span class="tok-fn">transform2d</span>(f.time.time * <span class="tok-num">0.7</span>, sx, sy) });

    <span class="tok-kw">const</span> scene_bg_clear: zm.Color = .{ .r = <span class="tok-num">14</span>, .g = <span class="tok-num">16</span>, .b = <span class="tok-num">24</span>, .a = <span class="tok-num">255</span> };
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt, scene_bg_clear);
    <span class="tok-kw">const</span> rps: *z.PassState = f.gl.pass;
    s.scene.<span class="tok-fn">bindForDraw</span>(rps);
    s.scene.<span class="tok-fn">setVertex</span>(rps, <span class="tok-num">0</span>, s.vbo, <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(vertices)));
    s.scene.<span class="tok-fn">draw</span>(rps, vertices.len, <span class="tok-num">1</span>);
    z.<span class="tok-fn">endTextureMode</span>(f.gl);

    <span class="tok-comment">// SCREEN PASS: open once (app owns begin/endDrawing).</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);

    <span class="tok-comment">// 2) Post pass: the fullscreen sampler shader reads the RT into the</span>
    <span class="tok-comment">//    backbuffer. drawFullscreenShader routes through the post shader's OWN</span>
    <span class="tok-comment">//    pipeline + bind groups (group-1 RT sampler intact), NOT the 2D batch -</span>
    <span class="tok-comment">//    so the batch's atlas can't clobber the sampler.</span>
    z.<span class="tok-fn">drawFullscreenShader</span>(f.gl, post_fs_io, &amp;s.post);

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"pipeline_postprocess: scene -&gt; texture -&gt; fullscreen sampler (chromatic + vignette)"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    <span class="tok-comment">// Transient GPU-technique demo: render-target/shader teardown leaves</span>
    <span class="tok-comment">// residual engine handles, so opt out of the managed leak gate.</span>
    .memory = .managed,
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - pipeline postprocess"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.0</span>, .g = <span class="tok-num">0.0</span>, .b = <span class="tok-num">0.0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    <span class="tok-comment">// .memory left default (arena): per-lifecycle teardown is balanced (scene +</span>
    <span class="tok-comment">// post + vbo + rt all freed), but the shutdown proof flags 1 residual buffer</span>
    <span class="tok-comment">// from the LoadedShader/rt-sampling path that isn't reachable from State -</span>
    <span class="tok-comment">// deferred rather than guess at an engine-owned handle.</span>
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Offscreen render-texture drawn before the screen opens (tile-based-GPU</span>
    <span class="tok-comment">// safe); owns its own begin/endDrawing.</span>
    .manages_own_frame = true,
};
</code></pre></figure>

<figure class="code src-file" data-path="examples/pipeline_uniforms_vs.zig" data-lines="32"><figcaption><span>examples/pipeline_uniforms_vs.zig</span><span>32 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/pipeline_uniforms_vs.zig - pipeline_uniforms vertex shader body.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Transforms each 2D vertex by the UBO's 4x4 matrix and passes the colour</span>
<span class="tok-comment">//! through. The matrix (host-supplied) spins the triangle and squashes it</span>
<span class="tok-comment">//! aspect-correct, replacing the CPU vertex-rewrite the basic example used.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> mulMatPoint = zm.mulMatPoint;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_vs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_vs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_io.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-comment">// mat4 * vec4(p.xy, 0, 1): treat the 2D vertex as a point on the z=0 plane.</span>
    <span class="tok-kw">const</span> p: Vec3 = .{ io_in.vertex_position[<span class="tok-num">0</span>], io_in.vertex_position[<span class="tok-num">1</span>], <span class="tok-num">0.0</span> };
    out.position = <span class="tok-fn">mulMatPoint</span>(io_in.u.transform, p);

    <span class="tok-kw">const</span> c: Vec3 = io_in.vertex_color;
    out.frag_color = .{ c[<span class="tok-num">0</span>], c[<span class="tok-num">1</span>], c[<span class="tok-num">2</span>], <span class="tok-num">1.0</span> };

    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_io;
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
</code></pre></figure>
<figure class="code src-file" data-path="examples/pipeline_uniforms_vs_io.zig" data-lines="33"><figcaption><span>examples/pipeline_uniforms_vs_io.zig</span><span>33 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/pipeline_uniforms_vs_io.zig - typed interface for the</span>
<span class="tok-comment">//! pipeline_uniforms vertex shader. Companion to `pipeline_uniforms_vs.zig`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Demonstrates a VERTEX-STAGE uniform: the only uniform is a 4x4 transform the</span>
<span class="tok-comment">//! host rewrites every frame, so the triangle spins and stays aspect-correct.</span>
<span class="tok-comment">//! Because the `Ubo` is declared here (the vertex schema), the codegen binds it</span>
<span class="tok-comment">//! at @group(0) and `loadShaderVF` routes it there automatically - the host</span>
<span class="tok-comment">//! never names a group.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> shader = <span class="tok-builtin">@import</span>(<span class="tok-str">"shader_interface"</span>);

<span class="tok-comment">/// Vertex attributes: clip-ish position (the matrix finishes the transform) and</span>
<span class="tok-comment">/// a per-vertex colour. Locations match the interleaved vertex buffer; the</span>
<span class="tok-comment">/// layout is DERIVED from these via `z.shader.vertexLayout`.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Attributes = <span class="tok-kw">struct</span> {
    vertex_position: shader.<span class="tok-fn">Attr</span>(.vec2, <span class="tok-num">0</span>),
    vertex_color: shader.<span class="tok-fn">Attr</span>(.vec3, <span class="tok-num">1</span>),
};

<span class="tok-comment">/// Single uniform block (group 0, binding 0): a 4x4 transform.</span>
<span class="tok-comment">/// mat4 == [4]Vec (std140 rows; uploaded raw, read by the shader as</span>
<span class="tok-comment">/// `mulMatPoint`, which matches WGSL `m * vec4(p, 1)`).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Ubo = <span class="tok-kw">struct</span> {
    transform: [<span class="tok-num">4</span>]Vec,
};

<span class="tok-comment">/// Varying to the fragment stage - the interpolated colour (inlined, not shared,</span>
<span class="tok-comment">/// so the vs/fs io files stay in separate modules; the match is structural).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Outputs = <span class="tok-kw">struct</span> {
    frag_color: Vec,
};
</code></pre></figure>
<figure class="code src-file" data-path="examples/postprocess_post_fs.zig" data-lines="52"><figcaption><span>examples/postprocess_post_fs.zig</span><span>52 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/postprocess_post_fs.zig - fullscreen post-processing fragment</span>
<span class="tok-comment">//! shader for the postprocess demo. Samples the `scene` texture three times at</span>
<span class="tok-comment">//! UV offsets along the radial direction (a chromatic-aberration RGB split),</span>
<span class="tok-comment">//! then darkens toward the edges (vignette).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! This is the FIRST sampler shader to go through `z.shader.loadShaderVF`: the</span>
<span class="tok-comment">//! schema's `Samplers` field drives a bind group built by the unified</span>
<span class="tok-comment">//! `Resources` machinery, with no hand-built pipeline. Same authoring shape as</span>
<span class="tok-comment">//! every other Zig shader - `io.scene(uv)` is the texture read.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Schema (Inputs / Samplers / Outputs) lives in `postprocess_post_fs_io.zig`.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"postprocess_post_fs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"postprocess_post_fs_externs"</span>);

<span class="tok-comment">// IoT(void) - no Ubo; the texture binding is all this stage needs.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(void);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> TextureRef = shader_externs.TextureRef;

<span class="tok-kw">const</span> smoothstep = zm.smoothstep;
<span class="tok-kw">const</span> length = zm.length;

<span class="tok-kw">comptime</span> {
    _ = shader_io;
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-kw">const</span> uv: Vec2 = io_in.frag_tex_coord;
    <span class="tok-kw">const</span> center: Vec2 = .{ <span class="tok-num">0.5</span>, <span class="tok-num">0.5</span> };
    <span class="tok-kw">const</span> dir: Vec2 = uv - center;

    <span class="tok-comment">// Chromatic aberration: pull R outward and B inward along `dir`.</span>
    <span class="tok-kw">const</span> off: Vec2 = dir * <span class="tok-builtin">@as</span>(Vec2, <span class="tok-builtin">@splat</span>(<span class="tok-num">0.008</span>));
    <span class="tok-kw">const</span> r: f32 = io_in.<span class="tok-fn">scene</span>(uv + off)[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> g: f32 = io_in.<span class="tok-fn">scene</span>(uv)[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> b: f32 = io_in.<span class="tok-fn">scene</span>(uv - off)[<span class="tok-num">2</span>];

    <span class="tok-comment">// Vignette: fade toward the edges (edge0 &gt; edge1 -&gt; bright center).</span>
    <span class="tok-kw">const</span> vig: f32 = <span class="tok-fn">smoothstep</span>(<span class="tok-num">0.85</span>, <span class="tok-num">0.30</span>, <span class="tok-fn">length</span>(dir));

    out.final_color = .{ r * vig, g * vig, b * vig, <span class="tok-num">1.0</span> };
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
</code></pre></figure>

<span class="tok-comment">//! `frag_tex_coord` varying. The `scene` sampler is the previous pass's</span>
<span class="tok-comment">//! RenderTexture (bound by name in `desc.textures`).</span>

<span class="tok-comment">/// Final fragment colour.</span>

<figure class="code src-file" data-path="examples/trivial_vs.zig" data-lines="34"><figcaption><span>examples/trivial_vs.zig</span><span>34 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/trivial_vs.zig - minimal vertex shader for the</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

    frag_tex_coord: Vec2,
};
