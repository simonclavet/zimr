<h1>point_rendering</h1>
<figure class="code src-file" data-path="examples/point_rendering/point_rendering.zig" data-lines="379"><figcaption><span>examples/point_rendering/point_rendering.zig</span><span>379 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! point_rendering - raylib's `models_point_rendering`, the zimr way.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A random spherical point cloud (raylib's exact distribution: uniform</span>
<span class="tok-comment">//! theta/phi/radius, so the density bunches toward the core and the</span>
<span class="tok-comment">//! poles - that look is part of the original) with each point coloured</span>
<span class="tok-comment">//! `colorFromHSV(r * 360, 1, 1)`: the hue wraps ten times over the</span>
<span class="tok-comment">//! 10-unit radius, giving the signature rainbow shells.  Rendered as a</span>
<span class="tok-comment">//! single `point_list` draw through the new `points3d_vs` (unlit, one</span>
<span class="tok-comment">//! VP uniform) + the existing `cube3d_fs` passthrough.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! raylib steps the count 1k -&gt; 10M by tens and toggles between a GPU</span>
<span class="tok-comment">//! point-mesh and a CPU `DrawPoint3D` loop (a GL point-mode lesson</span>
<span class="tok-comment">//! with no WebGPU analogue - there is only one honest way to draw</span>
<span class="tok-comment">//! points here).  This port keeps the count stepping (capped at 1M:</span>
<span class="tok-comment">//! one point is 16 bytes, so 1M = a 16MB vertex buffer - the ceiling a</span>
<span class="tok-comment">//! phone should be asked to hold), with live FPS so the cost curve is</span>
<span class="tok-comment">//! still the demo.  The buffer is allocated ONCE at the 1M cap;</span>
<span class="tok-comment">//! stepping the count regenerates points into the same buffer via</span>
<span class="tok-comment">//! `queueWriteBuffer` and changes only the draw's vertex_count - no</span>
<span class="tok-comment">//! per-step allocation churn.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! raylib's yellow wire sphere landmark is here too, translated into</span>
<span class="tok-comment">//! the medium: three great-circle rings of yellow POINTS riding the</span>
<span class="tok-comment">//! same pipeline (r = 1, at the origin, inside the cloud).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Phone-first: slow auto-orbit like raylib's CAMERA_ORBITAL; one</span>
<span class="tok-comment">//! finger drags to take over the orbit, pinch zooms.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-kw">const</span> pts_vs = z.points3d_shader;

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> points3d_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"points3d_vs.wgsl"</span>);
<span class="tok-kw">const</span> cube3d_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"cube3d_fs.wgsl"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> VsUbo = <span class="tok-builtin">@FieldType</span>(pts_vs.Io, <span class="tok-str">"u"</span>);

<span class="tok-kw">const</span> bg_clear: Color = .{ .r = <span class="tok-num">8</span>, .g = <span class="tok-num">8</span>, .b = <span class="tok-num">12</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> fovy_rad: f32 = <span class="tok-num">0.8</span>;

<span class="tok-kw">const</span> min_points: u32 = <span class="tok-num">1_000</span>;
<span class="tok-kw">const</span> max_points: u32 = <span class="tok-num">1_000_000</span>;
<span class="tok-comment">/// Yellow "wire" landmark: 3 rings x ring_segs points, appended after</span>
<span class="tok-comment">/// the cloud in the same buffer.</span>
<span class="tok-kw">const</span> ring_segs: u32 = <span class="tok-num">96</span>;
<span class="tok-kw">const</span> marker_points: u32 = <span class="tok-num">3</span> * ring_segs;

<span class="tok-comment">/// One point: world position + rgba8 colour.  The unorm8x4 attribute</span>
<span class="tok-comment">/// arrives in the shader normalized to [0,1].</span>
<span class="tok-kw">const</span> PointVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    position: [<span class="tok-num">3</span>]f32,
    color: [<span class="tok-num">4</span>]u8,
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    pipeline: z.wgpu.RenderPipelineHandle,
    vbo: z.wgpu.BufferHandle,
    vs_ubo: z.wgpu.BufferHandle,
    g0_bg: z.wgpu.BindGroupHandle,
    scratch: []PointVertex, <span class="tok-comment">// CPU staging for regeneration (max size)</span>

    num_points: u32 = <span class="tok-num">1_000</span>,
    rng: std.Random.DefaultPrng,

    rt: z.RenderTexture,
    ui_host: z.UiHost,

    cam_yaw: f32 = <span class="tok-num">0.8</span>,
    cam_pitch: f32 = <span class="tok-num">0.6</span>,
    cam_dist: f32 = <span class="tok-num">14.0</span>,
    auto_orbit: bool = true,
    dragging: bool = false,
    prev_pinch: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    gpa.<span class="tok-fn">free</span>(s.scratch);
    s.ui_host.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyRenderPipeline</span>(s.pipeline);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vs_ubo);
    z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.g0_bg);
    s.rt.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// raylib's GenMeshPoints, verbatim distribution: uniform theta in</span>
<span class="tok-comment">/// [0,pi], phi in [0,2pi], r in [0,10]; colour = HSV(r*360, 1, 1).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">regenPoints</span>(s: *State, f: *z.Frame) void {
    <span class="tok-kw">const</span> rand: std.Random = s.rng.<span class="tok-fn">random</span>();
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; s.num_points) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> theta: f32 = pi * rand.<span class="tok-fn">float</span>(f32);
        <span class="tok-kw">const</span> phi: f32 = <span class="tok-num">2.0</span> * pi * rand.<span class="tok-fn">float</span>(f32);
        <span class="tok-kw">const</span> r: f32 = <span class="tok-num">10.0</span> * rand.<span class="tok-fn">float</span>(f32);
        <span class="tok-kw">const</span> c: Color = z.<span class="tok-fn">colorFromHSV</span>(r * <span class="tok-num">360.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
        s.scratch[i] = .{
            .position = .{
                r * <span class="tok-builtin">@sin</span>(theta) * <span class="tok-builtin">@cos</span>(phi),
                r * <span class="tok-builtin">@sin</span>(theta) * <span class="tok-builtin">@sin</span>(phi),
                r * <span class="tok-builtin">@cos</span>(theta),
            },
            .color = .{ c.r, c.g, c.b, <span class="tok-num">255</span> },
        };
    }
    <span class="tok-comment">// The landmark rides after the cloud: three unit great circles</span>
    <span class="tok-comment">// (XY, XZ, YZ) of yellow points - raylib's wire sphere, pointified.</span>
    <span class="tok-kw">var</span> m: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (m &lt; marker_points) : (m += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> ring: u32 = m / ring_segs;
        <span class="tok-kw">const</span> a: f32 = <span class="tok-num">2.0</span> * pi * <span class="tok-fn">float</span>(m % ring_segs) / <span class="tok-fn">float</span>(ring_segs);
        <span class="tok-kw">const</span> ca: f32 = <span class="tok-builtin">@cos</span>(a);
        <span class="tok-kw">const</span> sa: f32 = <span class="tok-builtin">@sin</span>(a);
        <span class="tok-kw">const</span> p: [<span class="tok-num">3</span>]f32 = <span class="tok-kw">switch</span> (ring) {
            <span class="tok-num">0</span> =&gt; .{ ca, sa, <span class="tok-num">0</span> },
            <span class="tok-num">1</span> =&gt; .{ ca, <span class="tok-num">0</span>, sa },
            <span class="tok-kw">else</span> =&gt; .{ <span class="tok-num">0</span>, ca, sa },
        };
        s.scratch[s.num_points + m] = .{ .position = p, .color = .{ <span class="tok-num">253</span>, <span class="tok-num">249</span>, <span class="tok-num">0</span>, <span class="tok-num">255</span> } };
    }
    <span class="tok-kw">const</span> used: usize = s.num_points + marker_points;
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(
        f.gpu.queue,
        s.vbo,
        <span class="tok-num">0</span>,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(s.scratch[<span class="tok-num">0</span>..used]),
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;

    <span class="tok-kw">const</span> cap: usize = max_points + marker_points;
    <span class="tok-kw">const</span> scratch: []PointVertex = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(PointVertex, cap);
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = cap * <span class="tok-builtin">@sizeOf</span>(PointVertex),
        .usage = .{ .vertex = true, .copy_dst = true },
    });
    <span class="tok-kw">const</span> vs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(VsUbo),
        .usage = .{ .uniform = true, .copy_dst = true },
    });

    <span class="tok-kw">const</span> entries = [_]z.shader_introspect.BindGroupLayoutEntry{
        .{
            .binding = <span class="tok-num">0</span>,
            .visibility = .{ .vertex = true },
            .resource = .{ .uniform_buffer = .{ .min_size = <span class="tok-builtin">@sizeOf</span>(VsUbo) } },
        },
    };
    <span class="tok-kw">const</span> bgl_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(bgl_blob);
    <span class="tok-kw">const</span> g0_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, bgl_blob, <span class="tok-str">"pts_g0"</span>);
    <span class="tok-kw">const</span> bg_entries = [_]z.gpu.BindGroupEntry{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = vs_ubo, .size = <span class="tok-builtin">@sizeOf</span>(VsUbo) } } },
    };
    <span class="tok-kw">const</span> bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;bg_entries);
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(bg_blob);
    <span class="tok-kw">const</span> g0_bg: z.wgpu.BindGroupHandle =
        z.wgpu.<span class="tok-fn">createBindGroup</span>(device, g0_bgl, bg_blob, <span class="tok-str">"pts_g0_bg"</span>);

    <span class="tok-kw">const</span> pl: z.wgpu.PipelineLayoutHandle =
        z.wgpu.<span class="tok-fn">createPipelineLayout</span>(device, &amp;.{g0_bgl}, <span class="tok-str">"pts_pl"</span>);
    <span class="tok-kw">const</span> vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, points3d_vs_wgsl, <span class="tok-str">"points3d_vs"</span>);
    <span class="tok-kw">const</span> fs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, cube3d_fs_wgsl, <span class="tok-str">"cube3d_fs"</span>);
    <span class="tok-kw">const</span> combo: z.gpu.StateCombo = z.gpu.StateCombo.<span class="tok-fn">fromParts</span>(
        .point_list,
        .none,
        .less,
        .none,
        .rgba8_unorm,
        .depth24_plus,
        <span class="tok-num">1</span>,
    );
    <span class="tok-kw">const</span> pipe_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{.{
            .array_stride = <span class="tok-builtin">@sizeOf</span>(PointVertex),
            .step_mode = .vertex,
            .attributes = &amp;.{
                .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
                .{ .format = .uint8x4_unorm, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
            },
        }},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = combo,
    });
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(pipe_blob);
    <span class="tok-kw">const</span> pipeline: z.wgpu.RenderPipelineHandle =
        z.wgpu.<span class="tok-fn">createRenderPipeline</span>(device, pl, vs_mod, fs_mod, pipe_blob, <span class="tok-str">"pts_pipe"</span>);

    s.* = .{
        .gpa = gpa,
        .pipeline = pipeline,
        .vbo = vbo,
        .vs_ubo = vs_ubo,
        .g0_bg = g0_bg,
        .scratch = scratch,
        .rng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0x9e3779b97f4a7c15</span>),
        .rt = .{},
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>)),
    };
    <span class="tok-fn">regenPoints</span>(s, f);

    <span class="tok-comment">// Build-only intermediates internalized by the pipeline + bind group.</span>
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(fs_mod);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(pl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(g0_bgl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> bw: u32 = <span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> bh: u32 = <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt.color != .invalid <span class="tok-kw">and</span> s.rt.width == bw <span class="tok-kw">and</span> s.rt.height == bh) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.rt.color != .invalid) {
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt);
    }
    s.rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(bw), <span class="tok-builtin">@intCast</span>(bh));
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(f: *z.Frame, s: *State, ui_wants_mouse: bool) void {
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> dx: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (s.prev_pinch &gt; <span class="tok-num">0</span>) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - (dist - s.prev_pinch) * <span class="tok-num">0.04</span>, <span class="tok-num">4.0</span>, <span class="tok-num">30.0</span>);
        }
        s.prev_pinch = dist;
        <span class="tok-kw">return</span>;
    }
    s.prev_pinch = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !ui_wants_mouse) {
        <span class="tok-kw">if</span> (s.dragging) {
            <span class="tok-kw">const</span> d: Vec2 = z.<span class="tok-fn">getMouseDelta</span>(f.input);
            s.cam_yaw -= d[<span class="tok-num">0</span>] * <span class="tok-num">0.008</span>;
            s.cam_pitch = <span class="tok-fn">clamp</span>(s.cam_pitch + d[<span class="tok-num">1</span>] * <span class="tok-num">0.008</span>, -<span class="tok-num">1.4</span>, <span class="tok-num">1.4</span>);
            s.auto_orbit = false; <span class="tok-comment">// a touch takes the wheel</span>
        }
        s.dragging = true;
    } <span class="tok-kw">else</span> {
        s.dragging = false;
    }
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span>) {
        s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - wheel * <span class="tok-num">0.8</span>, <span class="tok-num">4.0</span>, <span class="tok-num">30.0</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-kw">const</span> dt: f32 = <span class="tok-builtin">@floatCast</span>(f.time.delta_time);
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing; uses</span>
    <span class="tok-comment">// last-frame UI state = 1-frame lag, imperceptible).</span>

    <span class="tok-kw">if</span> (s.auto_orbit) {
        s.cam_yaw += dt * <span class="tok-num">0.25</span>; <span class="tok-comment">// raylib's CAMERA_ORBITAL pace</span>
    }

    <span class="tok-comment">// ---- camera + the one uniform ----</span>
    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(s.cam_pitch);
    <span class="tok-kw">const</span> sp: f32 = <span class="tok-builtin">@sin</span>(s.cam_pitch);
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-builtin">@cos</span>(s.cam_yaw);
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-builtin">@sin</span>(s.cam_yaw);
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(
        s.cam_dist * cp * sy,
        s.cam_dist * sp,
        s.cam_dist * cp * cy,
    );
    <span class="tok-kw">const</span> cam_view: Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> cam_proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(fovy_rad, vw / vh, <span class="tok-num">0.1</span>, <span class="tok-num">200.0</span>);
    <span class="tok-kw">var</span> vs_io: pts_vs.Io = undefined;
    vs_io.u = .{ .view_projection = <span class="tok-fn">mulMat</span>(cam_proj, cam_view) };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.vs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;vs_io.u));

    <span class="tok-comment">// ---- one point_list draw for cloud + landmark ----</span>
    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.rt, bg_clear);
    <span class="tok-kw">const</span> pa: *z.PassState = f.gl.pass;
    Backend.<span class="tok-fn">setPipeline</span>(pa, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = s.pipeline });
    Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">0</span>, s.g0_bg);
    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(pa.pass, .{
        .slot = <span class="tok-num">0</span>,
        .buffer = s.vbo,
        .offset = <span class="tok-num">0</span>,
        .size = (<span class="tok-builtin">@as</span>(u64, s.num_points) + marker_points) * <span class="tok-builtin">@sizeOf</span>(PointVertex),
    });
    z.render_pass.<span class="tok-fn">draw</span>(pa.pass, .{
        .vertex_count = s.num_points + marker_points,
        .instance_count = <span class="tok-num">1</span>,
        .first_vertex = <span class="tok-num">0</span>,
        .first_instance = <span class="tok-num">0</span>,
    });
    z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);

    <span class="tok-comment">// SCREEN PASS: open once, composite, then UI.</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, bg_clear);
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh }, s.rt.<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    <span class="tok-comment">// ---- UI ----</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">300</span>, vw - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">148</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">140</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"point rendering"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"points: {d}"</span>, .{s.num_points});
        <span class="tok-kw">const</span> fps: f32 = <span class="tok-kw">if</span> (dt &gt; <span class="tok-num">0.0001</span>) <span class="tok-num">1.0</span> / dt <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
        u.<span class="tok-fn">text</span>(<span class="tok-str">"fps: {d:.0}"</span>, .{fps});
        <span class="tok-kw">var</span> changed: bool = false;
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"x10"</span>, .{})) {
            s.num_points = <span class="tok-builtin">@min</span>(s.num_points * <span class="tok-num">10</span>, max_points);
            changed = true;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"/10"</span>, .{})) {
            s.num_points = <span class="tok-builtin">@max</span>(s.num_points / <span class="tok-num">10</span>, min_points);
            changed = true;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"orbit"</span>, &amp;s.auto_orbit);
        <span class="tok-kw">if</span> (changed) {
            <span class="tok-fn">regenPoints</span>(s, f);
        }
    }
    <span class="tok-fn">handleInput</span>(f, s, u.<span class="tok-fn">wantCaptureMouse</span>());
    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - point rendering (1k to 1M points)"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Renders offscreen before the screen opens (tile-based-GPU safe); owns</span>
    <span class="tok-comment">// its own begin/endDrawing.</span>
    .manages_own_frame = true,
};
