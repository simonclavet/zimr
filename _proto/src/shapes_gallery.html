<figure class="code src-file" data-path="examples/shapes_gallery/shapes_gallery.zig" data-lines="120"><figcaption><span>examples/shapes_gallery/shapes_gallery.zig</span><span>120 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! shapes_gallery - visual check + showcase for the new parametric shape spine</span>
<span class="tok-comment">//! and the mesh-ops toolkit. Renders the eight parametric primitives (sphere,</span>
<span class="tok-comment">//! hemisphere, cylinder, cone, torus, trefoil knot, plane, klein bottle) plus a</span>
<span class="tok-comment">//! COMPOSED shape - a dumbbell built from a cylinder + two spheres with</span>
<span class="tok-comment">//! `meshMerge` and `meshTranslate` - in a grid under an orbit camera. Lit by the</span>
<span class="tok-comment">//! immediate renderer's directional shade, so orientation, winding, and the</span>
<span class="tok-comment">//! welded seam normals are all visible.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> pointVec = zm.pointVec;

<span class="tok-kw">const</span> num: usize = <span class="tok-num">9</span>;

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    models: [num]z.Model,
    cam: z.OrbitCamera,
};

<span class="tok-kw">const</span> positions = [num]Vec{
    <span class="tok-fn">pointVec</span>(-<span class="tok-num">3.9</span>, <span class="tok-num">0</span>, -<span class="tok-num">1.6</span>), <span class="tok-fn">pointVec</span>(-<span class="tok-num">1.3</span>, <span class="tok-num">0</span>, -<span class="tok-num">1.6</span>), <span class="tok-fn">pointVec</span>(<span class="tok-num">1.3</span>, <span class="tok-num">0</span>, -<span class="tok-num">1.6</span>), <span class="tok-fn">pointVec</span>(<span class="tok-num">3.9</span>, <span class="tok-num">0</span>, -<span class="tok-num">1.6</span>),
    <span class="tok-fn">pointVec</span>(-<span class="tok-num">3.9</span>, <span class="tok-num">0</span>, <span class="tok-num">1.6</span>),  <span class="tok-fn">pointVec</span>(-<span class="tok-num">1.3</span>, <span class="tok-num">0</span>, <span class="tok-num">1.6</span>),  <span class="tok-fn">pointVec</span>(<span class="tok-num">1.3</span>, <span class="tok-num">0</span>, <span class="tok-num">1.6</span>),  <span class="tok-fn">pointVec</span>(<span class="tok-num">3.9</span>, <span class="tok-num">0</span>, <span class="tok-num">1.6</span>),
    <span class="tok-fn">pointVec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.75</span>, <span class="tok-num">4.0</span>), <span class="tok-comment">// dumbbell, front centre</span>
};

<span class="tok-kw">const</span> tints = [num][<span class="tok-num">3</span>]u8{
    .{ <span class="tok-num">235</span>, <span class="tok-num">110</span>, <span class="tok-num">90</span> }, <span class="tok-comment">// sphere</span>
    .{ <span class="tok-num">240</span>, <span class="tok-num">175</span>, <span class="tok-num">70</span> }, <span class="tok-comment">// hemisphere</span>
    .{ <span class="tok-num">120</span>, <span class="tok-num">200</span>, <span class="tok-num">110</span> }, <span class="tok-comment">// cylinder</span>
    .{ <span class="tok-num">90</span>, <span class="tok-num">190</span>, <span class="tok-num">200</span> }, <span class="tok-comment">// cone</span>
    .{ <span class="tok-num">110</span>, <span class="tok-num">150</span>, <span class="tok-num">240</span> }, <span class="tok-comment">// torus</span>
    .{ <span class="tok-num">190</span>, <span class="tok-num">130</span>, <span class="tok-num">235</span> }, <span class="tok-comment">// knot</span>
    .{ <span class="tok-num">210</span>, <span class="tok-num">210</span>, <span class="tok-num">220</span> }, <span class="tok-comment">// plane</span>
    .{ <span class="tok-num">240</span>, <span class="tok-num">130</span>, <span class="tok-num">180</span> }, <span class="tok-comment">// klein</span>
    .{ <span class="tok-num">230</span>, <span class="tok-num">205</span>, <span class="tok-num">120</span> }, <span class="tok-comment">// dumbbell (composed)</span>
};

<span class="tok-comment">/// Build a dumbbell = a cylinder bar + two end spheres, via mesh-ops.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildDumbbell</span>(gpa: Allocator) !z.types.Mesh {
    <span class="tok-kw">var</span> bar: z.types.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCylinder</span>(gpa, <span class="tok-num">0.16</span>, <span class="tok-num">1.5</span>, <span class="tok-num">20</span>, <span class="tok-num">2</span>);
    z.<span class="tok-fn">meshTranslate</span>(&amp;bar, <span class="tok-num">0</span>, -<span class="tok-num">0.75</span>, <span class="tok-num">0</span>); <span class="tok-comment">// cylinder spans 0..height -&gt; centre it</span>
    <span class="tok-kw">var</span> ball_a: z.types.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">0.42</span>, <span class="tok-num">20</span>, <span class="tok-num">16</span>);
    z.<span class="tok-fn">meshTranslate</span>(&amp;ball_a, <span class="tok-num">0</span>, <span class="tok-num">0.75</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">var</span> ball_b: z.types.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">0.42</span>, <span class="tok-num">20</span>, <span class="tok-num">16</span>);
    z.<span class="tok-fn">meshTranslate</span>(&amp;ball_b, <span class="tok-num">0</span>, -<span class="tok-num">0.75</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> step1: z.types.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">meshMerge</span>(gpa, bar, ball_a);
    <span class="tok-kw">const</span> dumbbell: z.types.Mesh = <span class="tok-kw">try</span> z.<span class="tok-fn">meshMerge</span>(gpa, step1, ball_b);
    z.<span class="tok-fn">unloadMesh</span>(gpa, bar);
    z.<span class="tok-fn">unloadMesh</span>(gpa, ball_a);
    z.<span class="tok-fn">unloadMesh</span>(gpa, ball_b);
    z.<span class="tok-fn">unloadMesh</span>(gpa, step1);
    <span class="tok-kw">return</span> dumbbell;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">var</span> models: [num]z.Model = undefined;
