<h1>textures_gif_player</h1>
<figure class="code src-file" data-path="examples/textures_gif_player/textures_gif_player.zig" data-lines="251"><figcaption><span>examples/textures_gif_player/textures_gif_player.zig</span><span>251 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! textures_gif_player - port of raylib [textures] example - gif player.</span>
<span class="tok-comment">//! raylib source: examples/textures/textures_gif_player.c (complexity 3/4).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! raylib's original decodes an animated GIF into one big Image (frames</span>
<span class="tok-comment">//! appended in memory), uploads it as a texture, and auto-plays it while</span>
<span class="tok-comment">//! LEFT/RIGHT change a fixed frame delay measured in vsync ticks. That's a</span>
<span class="tok-comment">//! keyboard demo on a desktop; this is the honest phone translation, and it</span>
<span class="tok-comment">//! goes further than the original in three ways a touch UI makes worth doing:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * a FRAME SCRUBBER - drag to any frame; raylib has no seek at all.</span>
<span class="tok-comment">//!   * TIMELINE-ACCURATE playback - each frame is held for its OWN native</span>
<span class="tok-comment">//!     delay (scarfy is a uniform 120 ms, but a real GIF varies per frame),</span>
<span class="tok-comment">//!     scaled by a speed slider, instead of raylib's single tick counter.</span>
<span class="tok-comment">//!   * frame-by-frame STEP buttons + a play/pause + loop toggle, so you can</span>
<span class="tok-comment">//!     inspect the sprite sheet the way an animator would.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The decode is the point: `z.loadGifAnim` runs the new pure-Zig GIF codec</span>
<span class="tok-comment">//! (`codecs.gif`) - LZW + palette + per-frame disposal/transparency</span>
<span class="tok-comment">//! compositing - validated pixel-exact against a reference decoder. Each</span>
<span class="tok-comment">//! frame is a full RGBA8 canvas; playback just uploads the current one into a</span>
<span class="tok-comment">//! single `CpuFramebuffer` (nearest-filtered, so the pixel art stays crisp).</span>
<span class="tok-comment">//! `.memory = .managed`: the decoded frames, the GPU framebuffer, the font</span>
<span class="tok-comment">//! and the UI host are all freed in `deinit`, and the twice-lifecycle smoke</span>
<span class="tok-comment">//! census must come back FLAT.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> c = z.colors;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> scarfy_gif = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"scarfy_run.gif"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    ui_host: z.UiHost,
    anim: z.GifAnim,
    fb: z.CpuFramebuffer,

    playing: bool = true,
    loop: bool = true,
    <span class="tok-comment">/// Playback speed multiplier (1.0 = the GIF's native timing).</span>
    speed: f32 = <span class="tok-num">1.0</span>,
    <span class="tok-comment">/// Current frame index (also the scrubber's bound value).</span>
    current: u32 = <span class="tok-num">0</span>,
    <span class="tok-comment">/// Frame index currently uploaded to `fb`; -1 forces a first upload.</span>
    shown: i32 = -<span class="tok-num">1</span>,
    <span class="tok-comment">/// Wall-clock accumulator (ms) toward the current frame's delay.</span>
    accum_ms: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
    s.anim.<span class="tok-fn">deinit</span>(gpa);
    s.fb.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> anim: z.GifAnim = <span class="tok-kw">try</span> z.<span class="tok-fn">loadGifAnim</span>(gpa, scarfy_gif);
    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>);
    s.* = .{
        .font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
        .anim = anim,
        <span class="tok-comment">// One GPU texture, sized to the GIF canvas, updated per frame.</span>
        .fb = z.CpuFramebuffer.<span class="tok-fn">init</span>(
            f.gpu.device,
            f.gpu.queue,
            anim.width,
            anim.height,
            anim.<span class="tok-fn">frame</span>(<span class="tok-num">0</span>),
            <span class="tok-str">"gif_frame"</span>,
        ),
    };
}

<span class="tok-comment">/// Advance the play head by wall-clock time, honouring each frame's own</span>
<span class="tok-comment">/// native delay. Returns having left `s.current` on the frame to display.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">advance</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">if</span> (!s.playing <span class="tok-kw">or</span> s.anim.frame_count &lt;= <span class="tok-num">1</span>) {
        <span class="tok-kw">return</span>;
    }
    s.accum_ms += f.time.delta_time * <span class="tok-num">1000.0</span> * s.speed;
    <span class="tok-comment">// A while-loop (not an if) so a large dt or high speed can skip frames</span>
    <span class="tok-comment">// instead of falling behind real time.</span>
    <span class="tok-kw">var</span> guard: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (guard &lt; s.anim.frame_count) : (guard += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> hold: f32 = <span class="tok-fn">float</span>(<span class="tok-builtin">@max</span>(s.anim.delays_ms[s.current], <span class="tok-num">1</span>));
        <span class="tok-kw">if</span> (s.accum_ms &lt; hold) {
            <span class="tok-kw">break</span>;
        }
        s.accum_ms -= hold;
        <span class="tok-kw">if</span> (s.current + <span class="tok-num">1</span> &gt;= s.anim.frame_count) {
            <span class="tok-kw">if</span> (s.loop) {
                s.current = <span class="tok-num">0</span>;
            } <span class="tok-kw">else</span> {
                s.current = s.anim.frame_count - <span class="tok-num">1</span>;
                s.playing = false;
                s.accum_ms = <span class="tok-num">0</span>;
                <span class="tok-kw">break</span>;
            }
        } <span class="tok-kw">else</span> {
            s.current += <span class="tok-num">1</span>;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-fn">advance</span>(f, s);

    <span class="tok-comment">// Upload only when the frame actually changed (scrub, step, or play).</span>
    <span class="tok-kw">if</span> (s.shown != <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(s.current))) {
        s.fb.<span class="tok-fn">update</span>(f.gpu.queue, s.anim.<span class="tok-fn">frame</span>(s.current));
        s.shown = <span class="tok-builtin">@intCast</span>(s.current);
    }

    z.<span class="tok-fn">clearViewport</span>(f, .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">20</span>, .b = <span class="tok-num">28</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);

    <span class="tok-comment">// ---- the sprite, centred, scaled up to fit the space above the panel --</span>
    <span class="tok-kw">const</span> panel_h: f32 = <span class="tok-num">250</span>;
    <span class="tok-kw">const</span> avail_h: f32 = fh - panel_h - <span class="tok-num">24</span>;
    <span class="tok-kw">const</span> aw: f32 = <span class="tok-fn">float</span>(s.anim.width);
    <span class="tok-kw">const</span> ah: f32 = <span class="tok-fn">float</span>(s.anim.height);
    <span class="tok-comment">// Integer scale keeps pixel art crisp; at least 1x, and leave a margin.</span>
    <span class="tok-kw">var</span> scale: f32 = <span class="tok-builtin">@min</span>((fw - <span class="tok-num">40</span>) / aw, (avail_h - <span class="tok-num">40</span>) / ah);
    scale = <span class="tok-builtin">@trunc</span>(scale);
    <span class="tok-kw">if</span> (scale &lt; <span class="tok-num">1</span>) {
        scale = <span class="tok-num">1</span>;
    }
    <span class="tok-kw">const</span> dw: f32 = aw * scale;
    <span class="tok-kw">const</span> dh: f32 = ah * scale;
    <span class="tok-kw">const</span> dx: f32 = (fw - dw) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> dy: f32 = <span class="tok-num">16</span> + (avail_h - dh) * <span class="tok-num">0.5</span>;

    <span class="tok-comment">// A checkerboard behind the sprite so the GIF's transparency is visible</span>
    <span class="tok-comment">// (raylib draws it on solid RAYWHITE and you can't tell it's cut out).</span>
    <span class="tok-fn">drawChecker</span>(f.gl, dx, dy, dw, dh);
    s.fb.<span class="tok-fn">present</span>(f.gl, dx, dy, dw, dh);
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = dx - <span class="tok-num">1</span>, .y = dy - <span class="tok-num">1</span>, .width = dw + <span class="tok-num">2</span>, .height = dh + <span class="tok-num">2</span> },
        .{ .color = c.slate_500, .outline = <span class="tok-num">1.0</span> },
    );

    <span class="tok-comment">// ---- control panel ----------------------------------------------------</span>
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, fh - panel_h - <span class="tok-num">8</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ fw - <span class="tok-num">16.0</span>, panel_h }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"GIF player"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"scarfy_run.gif  -  {d}x{d}  -  {d} frames"</span>, .{ s.anim.width, s.anim.height, s.anim.frame_count });
        <span class="tok-comment">// The byte offset raylib's original prints, as a nod to "frames are</span>
        <span class="tok-comment">// just appended in image.data" - here it is the real frame stride.</span>
        <span class="tok-kw">const</span> offset: usize = <span class="tok-builtin">@as</span>(usize, s.current) * <span class="tok-builtin">@as</span>(usize, s.fb.width) * <span class="tok-builtin">@as</span>(usize, s.fb.height) * <span class="tok-num">4</span>;
        u.<span class="tok-fn">text</span>(<span class="tok-str">"current frame {d} / {d}   data offset {d}"</span>, .{ s.current + <span class="tok-num">1</span>, s.anim.frame_count, offset });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"this frame delay: {d} ms"</span>, .{s.anim.delays_ms[s.current]});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-kw">if</span> (s.playing) <span class="tok-str">"Pause"</span> <span class="tok-kw">else</span> <span class="tok-str">"Play"</span>, .{})) {
            s.playing = !s.playing;
            <span class="tok-comment">// Resuming from the last frame with loop off? restart.</span>
            <span class="tok-kw">if</span> (s.playing <span class="tok-kw">and</span> !s.loop <span class="tok-kw">and</span> s.current + <span class="tok-num">1</span> &gt;= s.anim.frame_count) {
                s.current = <span class="tok-num">0</span>;
                s.accum_ms = <span class="tok-num">0</span>;
            }
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"|&lt; prev"</span>, .{})) {
            s.playing = false;
            s.current = <span class="tok-kw">if</span> (s.current == <span class="tok-num">0</span>) s.anim.frame_count - <span class="tok-num">1</span> <span class="tok-kw">else</span> s.current - <span class="tok-num">1</span>;
            s.accum_ms = <span class="tok-num">0</span>;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"next &gt;|"</span>, .{})) {
            s.playing = false;
            s.current = <span class="tok-kw">if</span> (s.current + <span class="tok-num">1</span> &gt;= s.anim.frame_count) <span class="tok-num">0</span> <span class="tok-kw">else</span> s.current + <span class="tok-num">1</span>;
            s.accum_ms = <span class="tok-num">0</span>;
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"loop"</span>, &amp;s.loop);

        <span class="tok-comment">// Frame scrubber: dragging pauses and seeks. `slider` is generic over</span>
        <span class="tok-comment">// *u32, so the bound value IS the frame index - no float round-trip.</span>
        u.<span class="tok-fn">separator</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">slider</span>(<span class="tok-str">"frame"</span>, &amp;s.current, .{ .min = <span class="tok-num">0</span>, .max = s.anim.frame_count - <span class="tok-num">1</span> })) {
            s.playing = false;
            s.accum_ms = <span class="tok-num">0</span>;
        }
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"speed"</span>, &amp;s.speed, .{ .min = <span class="tok-num">0.1</span>, .max = <span class="tok-num">4.0</span> });
    }

    s.ui_host.<span class="tok-fn">render</span>(f);

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"(c) Scarfy sprite by Eiden Marsal - decoded by the pure-Zig GIF codec"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">/// A dim checkerboard so the sprite's transparent cut-out reads as such.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawChecker</span>(
    gl: *z.WgpuGl,
    x: f32,
    y: f32,
    wpx: f32,
    hpx: f32,
) void {
    <span class="tok-kw">const</span> cell: f32 = <span class="tok-num">12</span>;
    <span class="tok-kw">const</span> a: Color = .{ .r = <span class="tok-num">44</span>, .g = <span class="tok-num">48</span>, .b = <span class="tok-num">58</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-kw">const</span> b: Color = .{ .r = <span class="tok-num">34</span>, .g = <span class="tok-num">38</span>, .b = <span class="tok-num">46</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-kw">var</span> yy: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> row: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (yy &lt; hpx) : (yy += cell) {
        <span class="tok-kw">var</span> xx: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">var</span> col: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (xx &lt; wpx) : (xx += cell) {
            <span class="tok-kw">const</span> cw: f32 = <span class="tok-builtin">@min</span>(cell, wpx - xx);
            <span class="tok-kw">const</span> ch: f32 = <span class="tok-builtin">@min</span>(cell, hpx - yy);
            <span class="tok-kw">const</span> on: bool = ((row + col) &amp; <span class="tok-num">1</span>) == <span class="tok-num">0</span>;
            gl.<span class="tok-fn">rect</span>(
                .{ .x = x + xx, .y = y + yy, .width = cw, .height = ch },
                .{ .color = <span class="tok-kw">if</span> (on) a <span class="tok-kw">else</span> b },
            );
            col += <span class="tok-num">1</span>;
        }
        row += <span class="tok-num">1</span>;
    }
}

<span class="tok-comment">/// Descriptor-only: the runner or launcher drives this. No offscreen render</span>
<span class="tok-comment">/// pass, so the runtime owns begin/end (no `manages_own_frame`), exactly like</span>
<span class="tok-comment">/// the other 2D UI examples.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - textures gif player"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">640</span>,
            .scale_mode = .responsive,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
