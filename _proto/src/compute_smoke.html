<h1>compute_smoke</h1>
<figure class="code src-file" data-path="examples/compute_smoke/compute_smoke.zig" data-lines="127"><figcaption><span>examples/compute_smoke/compute_smoke.zig</span><span>127 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! compute_smoke - the GPU compute round-trip, now driven by `z.Compute(M)`</span>
<span class="tok-comment">//! instead of hand-wired wgpu calls. Uploads [0,1,2,...,particle_count-1], runs the `double_it`</span>
<span class="tok-comment">//! kernel (out[i] = in[i]*2) on the GPU, reads it back, draws it as bars (a correct</span>
<span class="tok-comment">//! run = a doubled ascending staircase). Also runs a CPU-backend self-check at</span>
<span class="tok-comment">//! startup over the SAME kernel, demonstrating the runtime CPU/GPU toggle.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> double_it = <span class="tok-builtin">@import</span>(<span class="tok-str">"double_it.zig"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);
<span class="tok-comment">// The compiled WGSL of double_it.zig (built by addComputeImport + spv2wgsl).</span>
<span class="tok-kw">const</span> double_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"double_it_wgsl"</span>);

<span class="tok-kw">const</span> particle_count: u32 = <span class="tok-num">64</span>; <span class="tok-comment">// particles processed (the dispatch count)</span>

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    pipe: z.<span class="tok-fn">Compute</span>(double_it),
    cpu_ok: bool = false,
    dispatched: bool = false,
    result: [particle_count]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>),
    have_result: bool = false,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.pipe.<span class="tok-fn">deinit</span>(); <span class="tok-comment">// compute pipeline + per-field storage/uniform/staging buffers + bind group</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>);

    <span class="tok-comment">// CPU-backend self-check: run the SAME kernel on the CPU and verify doubling.</span>
    <span class="tok-kw">var</span> cpu: z.<span class="tok-fn">Compute</span>(double_it) = z.<span class="tok-fn">Compute</span>(double_it).<span class="tok-fn">initCpu</span>();
    cpu.element_count = <span class="tok-num">5</span>;
    cpu.params = .{ .count = <span class="tok-num">5</span> };
    <span class="tok-kw">const</span> probe = [_]f32{ <span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span>, <span class="tok-num">4</span>, <span class="tok-num">5</span> };
    cpu.<span class="tok-fn">upload</span>(.data, &amp;probe);
    cpu.<span class="tok-fn">run</span>(<span class="tok-str">"double"</span>, <span class="tok-num">5</span>);
    <span class="tok-kw">const</span> cpu_out: []<span class="tok-kw">const</span> f32 = cpu.<span class="tok-fn">readLatest</span>(.data).?;
    <span class="tok-kw">const</span> cpu_ok: bool = cpu_out.len == <span class="tok-num">5</span> <span class="tok-kw">and</span> cpu_out[<span class="tok-num">0</span>] == <span class="tok-num">2.0</span> <span class="tok-kw">and</span> cpu_out[<span class="tok-num">1</span>] == <span class="tok-num">4.0</span> <span class="tok-kw">and</span> cpu_out[<span class="tok-num">4</span>] == <span class="tok-num">10.0</span>;

    <span class="tok-comment">// GPU-backend round-trip via z.Compute (storage/uniform/staging/pipeline derived</span>
    <span class="tok-comment">// from the kernel's schema; the minBindingSize footgun cannot recur).</span>
    <span class="tok-kw">var</span> pipe: z.<span class="tok-fn">Compute</span>(double_it) = <span class="tok-kw">try</span> z.<span class="tok-fn">Compute</span>(double_it).<span class="tok-fn">initGpu</span>(
        gpa,
        f.gpu.device,
        f.gpu.queue,
        &amp;.{.{ .name = <span class="tok-str">"double"</span>, .wgsl = double_wgsl }},
    );
    pipe.element_count = particle_count;
    pipe.params = .{ .count = particle_count };
    <span class="tok-kw">var</span> input: [particle_count]f32 = undefined;
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; particle_count) : (i += <span class="tok-num">1</span>) {
        input[i] = <span class="tok-builtin">@floatFromInt</span>(i);
    }
    pipe.<span class="tok-fn">upload</span>(.data, input[<span class="tok-num">0</span>..]);

    s.* = .{ .font = font, .pipe = pipe, .cpu_ok = cpu_ok };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// One-shot dispatch (the kernel doubles in place, so running it once is enough).</span>
    <span class="tok-kw">if</span> (!s.dispatched) {
        s.dispatched = true;
        s.pipe.<span class="tok-fn">run</span>(<span class="tok-str">"double"</span>, particle_count);
    }
    <span class="tok-comment">// Frame-delayed readback: returns last frame's mapped data, never stalls.</span>
    <span class="tok-kw">if</span> (s.pipe.<span class="tok-fn">readLatest</span>(.data)) |out| {
        <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (i &lt; particle_count <span class="tok-kw">and</span> i &lt; out.len) : (i += <span class="tok-num">1</span>) {
            s.result[i] = out[i];
        }
        s.have_result = true;
    }

    z.<span class="tok-fn">clearViewport</span>(f, z.colors.slate_900);

    <span class="tok-kw">const</span> sw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> sh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> bar_w: f32 = sw / <span class="tok-fn">float</span>(particle_count);
    <span class="tok-kw">const</span> max_val: f32 = <span class="tok-fn">float</span>((particle_count - <span class="tok-num">1</span>) * <span class="tok-num">2</span>);
    <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (i &lt; particle_count) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> v: f32 = s.result[i];
        <span class="tok-kw">const</span> h: f32 = (v / max_val) * (sh * <span class="tok-num">0.8</span>);
        <span class="tok-kw">const</span> x: f32 = <span class="tok-fn">float</span>(i) * bar_w;
        <span class="tok-kw">const</span> hue: f32 = <span class="tok-fn">float</span>(i) / <span class="tok-fn">float</span>(particle_count) * <span class="tok-num">300.0</span>;
        <span class="tok-kw">const</span> col: Color = z.<span class="tok-fn">colorFromHSV</span>(hue, <span class="tok-num">0.7</span>, <span class="tok-num">0.95</span>);
        f.gl.<span class="tok-fn">rect</span>(.{ .x = x, .y = sh - h, .width = bar_w - <span class="tok-num">1</span>, .height = h }, .{ .color = col });
    }

    <span class="tok-kw">const</span> status: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.have_result)
        <span class="tok-str">"GPU via z.Compute: out[i] = i*2 (doubled staircase)"</span>
    <span class="tok-kw">else</span>
        <span class="tok-str">"dispatching..."</span>;
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">10</span>, <span class="tok-num">10</span> }, status, .{ .size = <span class="tok-num">18</span>, .color = z.colors.slate_100, .font = &amp;s.font });
    <span class="tok-kw">const</span> cpu_msg: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.cpu_ok)
        <span class="tok-str">"CPU backend self-check: OK (1,2,3,4,5 -&gt; 2,4,6,8,10)"</span>
    <span class="tok-kw">else</span>
        <span class="tok-str">"CPU backend self-check: FAIL"</span>;
    <span class="tok-kw">const</span> cpu_col: Color = z.<span class="tok-fn">colorFromHSV</span>(<span class="tok-kw">if</span> (s.cpu_ok) <span class="tok-num">120.0</span> <span class="tok-kw">else</span> <span class="tok-num">0.0</span>, <span class="tok-num">0.7</span>, <span class="tok-num">0.95</span>);
    f.gl.<span class="tok-fn">text</span>(.{ <span class="tok-num">10</span>, <span class="tok-num">32</span> }, cpu_msg, .{ .size = <span class="tok-num">14</span>, .color = cpu_col, .font = &amp;s.font });

    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-comment">//! the kompute DSL form. The author writes only config + Buffers + Params + the</span>
<span class="tok-comment">//! kernel fn; `kompute` generates the g-namespace (extern storage/uniform on GPU,</span>
<span class="tok-comment">//! plain var on CPU), the Ctx type, and the spirv_kernel entry.</span>
<span class="tok-kw">const</span> k = <span class="tok-builtin">@import</span>(<span class="tok-str">"kompute"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> config = k.Config{ .max = <span class="tok-num">1024</span>, .workgroup = <span class="tok-num">64</span> };

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Buffers = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    data: [config.max]f32,
};
<span class="tok-comment">// Params is a uniform: keep it 16-byte sized with scalar pads (an array pad like</span>
<span class="tok-comment">// [3]u32 would emit array&lt;u32,3&gt; with stride 4, which WGSL rejects in `uniform`).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Params = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    count: u32,
    _pad0: u32 = <span class="tok-num">0</span>,
    _pad1: u32 = <span class="tok-num">0</span>,
    _pad2: u32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> g = k.<span class="tok-fn">Globals</span>(<span class="tok-builtin">@This</span>());
<span class="tok-kw">const</span> b_data = g.<span class="tok-fn">bind</span>(.data);

<span class="tok-comment">/// The kernel. Identical on CPU and GPU; buffers reached via module-level `b`.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">double</span>(c: k.<span class="tok-fn">Ctx</span>(<span class="tok-builtin">@This</span>())) void {
    <span class="tok-kw">if</span> (c.id &gt;= c.params.count) {
        <span class="tok-kw">return</span>;
    }
    b_data[c.id] = b_data[c.id] * <span class="tok-num">2.0</span>;
}
