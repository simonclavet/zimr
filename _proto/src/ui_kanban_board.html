<span class="tok-comment">// surfaced after kanban example".</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// What each flag does, demonstrated here:</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   - Title column   -&gt; `no_sort = true`.  Click the header,</span>
<span class="tok-comment">//                      nothing happens; visually no sort</span>
<span class="tok-comment">//                      indicator.  Sorting alphabetically by</span>
<span class="tok-comment">//                      task title isn't meaningful in a</span>
<span class="tok-comment">//                      kanban context.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   - Priority col   -&gt; `default_sort = .descending`,</span>
<span class="tok-comment">//                      `no_sort_ascending = true`.  Opens</span>
<span class="tok-comment">//                      sorted high-to-low.  Click again, stays</span>
<span class="tok-comment">//                      descending - can't flip to ascending</span>
<span class="tok-comment">//                      because least-important-at-top is never</span>
<span class="tok-comment">//                      a useful kanban view.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">//   - Age (days) col -&gt; `default_sort = .descending`.  Opens</span>
<span class="tok-comment">//                      oldest-first (staleness = visibility).</span>
<span class="tok-comment">//                      Click freely; both directions allowed.</span>
<span class="tok-comment">//</span>

        .{ .title = <span class="tok-str">"Switch CI to self-hosted"</span>, .priority = <span class="tok-num">3</span>, .age_days = <span class="tok-num">15</span>, .status = .done },

};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);

<span class="tok-comment">/// Compare two cards using the table's current sort spec.  Walks</span>
<span class="tok-comment">/// the spec list in priority order; first column that yields a</span>
<span class="tok-comment">/// definite ordering wins.  Column-index -&gt; field mapping is</span>
<span class="tok-comment">/// hardcoded to match the tableSetupColumn order in update().</span>
<span class="tok-kw">fn</span> <span class="tok-fn">sortCards</span>(
    specs: *<span class="tok-kw">const</span> ui.TableSortSpecs,
    a: Card,
    b: Card,
) bool {
    <span class="tok-kw">for</span> (specs.<span class="tok-fn">items</span>()) |spec| {
        <span class="tok-kw">const</span> ord: i32 = <span class="tok-kw">switch</span> (spec.column_index) {
            <span class="tok-num">0</span> =&gt; <span class="tok-kw">switch</span> (std.mem.<span class="tok-fn">order</span>(u8, a.title, b.title)) {
                .lt =&gt; -<span class="tok-num">1</span>,
                .gt =&gt; <span class="tok-num">1</span>,
                .eq =&gt; <span class="tok-num">0</span>,
            },
            <span class="tok-num">1</span> =&gt; <span class="tok-kw">if</span> (a.priority &lt; b.priority) <span class="tok-builtin">@as</span>(i32, -<span class="tok-num">1</span>) <span class="tok-kw">else</span> <span class="tok-kw">if</span> (a.priority &gt; b.priority) <span class="tok-builtin">@as</span>(i32, <span class="tok-num">1</span>) <span class="tok-kw">else</span> <span class="tok-num">0</span>,
            <span class="tok-num">2</span> =&gt; <span class="tok-kw">if</span> (a.age_days &lt; b.age_days) <span class="tok-builtin">@as</span>(i32, -<span class="tok-num">1</span>) <span class="tok-kw">else</span> <span class="tok-kw">if</span> (a.age_days &gt; b.age_days) <span class="tok-builtin">@as</span>(i32, <span class="tok-num">1</span>) <span class="tok-kw">else</span> <span class="tok-num">0</span>,
            <span class="tok-num">3</span> =&gt; blk: {
                <span class="tok-kw">const</span> ai: i32 = <span class="tok-builtin">@backingInt</span>(a.status);
                <span class="tok-kw">const</span> bi: i32 = <span class="tok-builtin">@backingInt</span>(b.status);
                <span class="tok-kw">break</span> :blk <span class="tok-kw">if</span> (ai &lt; bi) -<span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-kw">if</span> (ai &gt; bi) <span class="tok-num">1</span> <span class="tok-kw">else</span> <span class="tok-num">0</span>;
            },
            <span class="tok-kw">else</span> =&gt; <span class="tok-num">0</span>,
        };
        <span class="tok-kw">if</span> (ord != <span class="tok-num">0</span>) {
            <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (spec.direction) {
                .ascending =&gt; ord &lt; <span class="tok-num">0</span>,
                .descending =&gt; ord &gt; <span class="tok-num">0</span>,
            };
        }
    }
    <span class="tok-kw">return</span> false;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Kanban board (sort flags demo)"</span>, .{
        .initial_pos = .{ <span class="tok-num">20</span>, <span class="tok-num">20</span> },
        .initial_size = .{ <span class="tok-num">860</span>, <span class="tok-num">560</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        u.<span class="tok-fn">text</span>(<span class="tok-str">"Title: no_sort (click does nothing).  "</span> ++
            <span class="tok-str">"Priority: default_sort=desc, no_sort_ascending.  "</span> ++
            <span class="tok-str">"Age: default_sort=desc.  Status: cycles normally."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTable</span>(<span class="tok-str">"kanban"</span>, <span class="tok-num">4</span>, .{ .borders = true })) {
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Title"</span>, .{
                .sizing = .stretch,
                .no_sort = true,
            });
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Priority"</span>, .{
                .sizing = .fixed,
                .width = <span class="tok-num">100</span>,
                .default_sort = .descending,
                .no_sort_ascending = true,
            });
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Age (d)"</span>, .{
                .sizing = .fixed,
                .width = <span class="tok-num">90</span>,
                .default_sort = .descending,
            });
            u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Status"</span>, .{
                .sizing = .fixed,
                .width = <span class="tok-num">110</span>,
            });

            u.<span class="tok-fn">tableHeadersRow</span>();

            <span class="tok-kw">if</span> (u.<span class="tok-fn">tableGetSortSpecs</span>()) |specs| {
                std.mem.<span class="tok-fn">sort</span>(Card, &amp;s.cards, specs, sortCards);
            }

            <span class="tok-kw">for</span> (s.cards) |c| {
                u.<span class="tok-fn">tableNextRow</span>();

                _ = u.<span class="tok-fn">tableNextColumn</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{c.title});

                _ = u.<span class="tok-fn">tableNextColumn</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"P{d}"</span>, .{c.priority});

                _ = u.<span class="tok-fn">tableNextColumn</span>();
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{d}"</span>, .{c.age_days});

                _ = u.<span class="tok-fn">tableNextColumn</span>();
                <span class="tok-comment">// Coloured status text gives the kanban-lane</span>
                <span class="tok-comment">// visual without needing per-lane columns.</span>
                u.<span class="tok-fn">textColored</span>(c.status.<span class="tok-fn">color</span>(), <span class="tok-str">"{s}"</span>, .{c.status.<span class="tok-fn">label</span>()});
            }
            u.<span class="tok-fn">endTable</span>();
        }
    }
}
