    boxes3d: [box_count]p3.BodyHandle = undefined,
};

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">/// A little horizontal scatter per box so the column topples into a natural pile.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">dropX</span>(i: usize) f32 {
    <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
    <span class="tok-kw">return</span> (<span class="tok-builtin">@mod</span>(fi, <span class="tok-num">3.0</span>) - <span class="tok-num">1.0</span>) * <span class="tok-num">0.4</span>;
}

<span class="tok-comment">// ---------------------------------------------------------------------------------------</span>
<span class="tok-comment">// SETUP. The two functions below are written to be as parallel as the engines allow. The</span>
<span class="tok-comment">// `createBody(world, .{ .motion_type, .position })` calls are identical; the only real</span>
<span class="tok-comment">// difference is the shape model - 2D attaches a shape to the body (Box2D), 3D references a</span>
<span class="tok-comment">// shared shape held in a store (Jolt). Both are exactly how each upstream library works.</span>
<span class="tok-comment">// ---------------------------------------------------------------------------------------</span>

<span class="tok-kw">fn</span> <span class="tok-fn">setup2d</span>(world: *p2.World, boxes: *[box_count]p2.BodyHandle) !void {
    <span class="tok-comment">// static ground</span>
    <span class="tok-kw">const</span> ground: p2.BodyHandle = <span class="tok-kw">try</span> p2.<span class="tok-fn">createBody</span>(world, .{
        .motion_type = .static,
        .position = .{ <span class="tok-num">0</span>, ground_y },
    });
    _ = <span class="tok-kw">try</span> p2.<span class="tok-fn">createShape</span>(world, ground, .{ .geom = .{ .polygon = p2.<span class="tok-fn">makeBox</span>(ground_hx, <span class="tok-num">0.5</span>) } });

    <span class="tok-comment">// ten dynamic boxes stacked above the ground, so they fall and pile</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..box_count) |i| {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> body: p2.BodyHandle = <span class="tok-kw">try</span> p2.<span class="tok-fn">createBody</span>(world, .{
            .motion_type = .dynamic,
            .position = .{ <span class="tok-fn">dropX</span>(i), <span class="tok-num">1.0</span> + fi * <span class="tok-num">1.25</span> },
        });
        _ = <span class="tok-kw">try</span> p2.<span class="tok-fn">createShape</span>(world, body, .{ .geom = .{ .polygon = p2.<span class="tok-fn">makeBox</span>(half, half) } });
        boxes[i] = body;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">setup3d</span>(world: *p3.World, boxes: *[box_count]p3.BodyHandle) !void {
    <span class="tok-kw">const</span> gpa: Allocator = world.allocator;
    <span class="tok-kw">const</span> ground_geom: p3.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(ground_hx, <span class="tok-num">0.5</span>, ground_hx), .convex_radius = <span class="tok-num">0.02</span> },
    });
    <span class="tok-kw">const</span> box_geom: p3.ShapeId = <span class="tok-kw">try</span> world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(half, half, half), .convex_radius = <span class="tok-num">0.02</span> },
    });

    <span class="tok-comment">// static ground</span>
    _ = <span class="tok-kw">try</span> p3.<span class="tok-fn">createBody</span>(world, .{
        .motion_type = .static,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, ground_y, <span class="tok-num">0</span>),
        .shape = ground_geom,
    });

    <span class="tok-comment">// ten dynamic boxes stacked above the ground, so they fall and pile</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..box_count) |i| {
        <span class="tok-kw">const</span> fi: f32 = <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> body: p3.BodyHandle = <span class="tok-kw">try</span> p3.<span class="tok-fn">createBody</span>(world, .{
            .motion_type = .dynamic,
            .position = <span class="tok-fn">vec</span>(<span class="tok-fn">dropX</span>(i), <span class="tok-num">1.0</span> + fi * <span class="tok-num">1.25</span>, <span class="tok-fn">dropX</span>(i) * <span class="tok-num">0.5</span>),
            .shape = box_geom,
        });
        boxes[i] = body;
    }
}

<span class="tok-comment">/// Tear both worlds down and rebuild them from scratch (the Reset button).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">resetWorlds</span>(s: *State) void {
    s.world2d.<span class="tok-fn">deinit</span>(s.gpa);
    s.world3d.<span class="tok-fn">deinit</span>(s.gpa);
    s.world2d = p2.World.<span class="tok-fn">init</span>(s.gpa, world_capacity) <span class="tok-kw">catch</span> <span class="tok-builtin">@panic</span>(<span class="tok-str">"reset: 2D world init failed"</span>);
    s.world3d = p3.World.<span class="tok-fn">init</span>(s.gpa, world_capacity) <span class="tok-kw">catch</span> <span class="tok-builtin">@panic</span>(<span class="tok-str">"reset: 3D world init failed"</span>);
    s.world3d.gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">10</span>, <span class="tok-num">0</span>);
    <span class="tok-fn">setup2d</span>(&amp;s.world2d, &amp;s.boxes2d) <span class="tok-kw">catch</span> <span class="tok-builtin">@panic</span>(<span class="tok-str">"reset: 2D setup failed"</span>);
    <span class="tok-fn">setup3d</span>(&amp;s.world3d, &amp;s.boxes3d) <span class="tok-kw">catch</span> <span class="tok-builtin">@panic</span>(<span class="tok-str">"reset: 3D setup failed"</span>);
}

<span class="tok-comment">/// One rotated box corner, taken straight to screen space. `off` is the corner in the body's</span>
<span class="tok-comment">/// local frame; `r` is the body's orientation.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">corner2d</span>(
    cam: Camera2D,
    pos: Vec2,
    r: Rot2,
    off: Vec2,
) Vec2 {
    <span class="tok-kw">const</span> wx: f32 = pos[<span class="tok-num">0</span>] + r.cosine * off[<span class="tok-num">0</span>] - r.sine * off[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> wy: f32 = pos[<span class="tok-num">1</span>] + r.sine * off[<span class="tok-num">0</span>] + r.cosine * off[<span class="tok-num">1</span>];
    <span class="tok-kw">return</span> cam.<span class="tok-fn">worldToScreen</span>(.{ wx, wy });
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.* = .{
        .gpa = gpa,
        .font = font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .world2d = <span class="tok-kw">try</span> p2.World.<span class="tok-fn">init</span>(gpa, world_capacity),
        .world3d = <span class="tok-kw">try</span> p3.World.<span class="tok-fn">init</span>(gpa, world_capacity),
    };
    <span class="tok-comment">// Match gravity exactly across the two worlds (2D already defaults to -10).</span>
    s.world3d.gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">10</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">try</span> <span class="tok-fn">setup2d</span>(&amp;s.world2d, &amp;s.boxes2d);
    <span class="tok-kw">try</span> <span class="tok-fn">setup3d</span>(&amp;s.world3d, &amp;s.boxes3d);
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.world2d.<span class="tok-fn">deinit</span>(gpa);
    s.world3d.<span class="tok-fn">deinit</span>(gpa);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// STEP - identical across the two engines.</span>
    p2.<span class="tok-fn">step</span>(&amp;s.world2d, fixed_dt) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});
    p3.<span class="tok-fn">step</span>(&amp;s.world3d, fixed_dt) <span class="tok-kw">catch</span> <span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"OOM"</span>, .{});

    <span class="tok-kw">const</span> fw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> fh: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-comment">// ---- RIGHT HALF: the 3D world, in perspective. There is no GPU sub-rect viewport (only a</span>
    <span class="tok-comment">// scissor), so beginMode3D would centre world-origin on the *full* screen - i.e. on the divider.</span>
    <span class="tok-comment">// Instead we build the view-projection ourselves and shift clip space into the right half:</span>
    <span class="tok-comment">//   x' = 0.5*x + 0.5*w   maps NDC x in [-1, 1] -&gt; [0, 1] (the right half),</span>
    <span class="tok-comment">// so world-origin lands at the centre of the right half, undistorted at the half-width aspect.</span>
    <span class="tok-kw">const</span> cam: Camera3D = .{
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">4</span>, <span class="tok-num">22</span>),
        .target = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, -<span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = <span class="tok-num">45</span>,
        .projection = <span class="tok-num">0</span>,
    };
    <span class="tok-kw">const</span> fovy_rad: f32 = cam.fovy_deg * (pi / <span class="tok-num">180.0</span>);
    <span class="tok-kw">const</span> proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(fovy_rad, (fw * <span class="tok-num">0.5</span>) / fh, <span class="tok-num">0.01</span>, <span class="tok-num">1000.0</span>);
    <span class="tok-kw">const</span> shift: Mat = .{
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>),
    };
    <span class="tok-kw">const</span> view_proj: Mat = <span class="tok-fn">mulMat</span>(shift, <span class="tok-fn">mulMat</span>(proj, cam.<span class="tok-fn">viewMatrix</span>()));
    z.<span class="tok-fn">beginMode3DMatrix</span>(f.gl, view_proj);
    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">24</span>, <span class="tok-num">1.0</span>);
    z.<span class="tok-fn">drawCube</span>(f.gl, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, ground_y, <span class="tok-num">0</span>), .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">2</span> * ground_hx, <span class="tok-num">1</span>, <span class="tok-num">2</span> * ground_hx), .color = ground_color });
    <span class="tok-kw">for</span> (s.boxes3d, <span class="tok-num">0</span>..) |h, i| {
        <span class="tok-kw">const</span> pos: Vec = p3.<span class="tok-fn">getPosition</span>(&amp;s.world3d, h);
        <span class="tok-kw">const</span> rot: Quat = p3.<span class="tok-fn">getRotation</span>(&amp;s.world3d, h);
        z.<span class="tok-fn">drawCube</span>(f.gl, pos, .{
            .size = <span class="tok-fn">vec</span>(<span class="tok-num">2</span> * half, <span class="tok-num">2</span> * half, <span class="tok-num">2</span> * half),
            .rotation = <span class="tok-fn">matFromQuat</span>(rot),
            .color = palette[i],
        });
    }
    z.<span class="tok-fn">endMode3D</span>(f.gl);

    <span class="tok-comment">// ---- LEFT HALF: the 2D world, drawn flat in screen space like a 2D game ----</span>
    <span class="tok-kw">const</span> bg: ui.DrawListHandle = u.<span class="tok-fn">getBackgroundDrawList</span>();
    <span class="tok-comment">// Opaque backdrop for the 2D half (also masks any 3D that bleeds past the viewport edge).</span>
    bg.<span class="tok-fn">addRectFilled</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = fw * <span class="tok-num">0.5</span>, .height = fh }, panel_color);

    <span class="tok-kw">const</span> ppm: f32 = <span class="tok-builtin">@min</span>((fw * <span class="tok-num">0.5</span>) / (<span class="tok-num">2</span> * ground_hx + <span class="tok-num">2.0</span>), fh / <span class="tok-num">9.0</span>);
    <span class="tok-kw">const</span> cam2d: Camera2D = .{ .target = .{ <span class="tok-num">0</span>, <span class="tok-num">0.5</span> }, .zoom = ppm, .offset = .{ fw * <span class="tok-num">0.25</span>, fh * <span class="tok-num">0.5</span> }, .flip_y = true };

    <span class="tok-comment">// ground slab (axis-aligned filled rect)</span>
    <span class="tok-kw">const</span> g_tl: Vec2 = cam2d.<span class="tok-fn">worldToScreen</span>(.{ -ground_hx, ground_y + <span class="tok-num">0.5</span> });
    <span class="tok-kw">const</span> g_br: Vec2 = cam2d.<span class="tok-fn">worldToScreen</span>(.{ ground_hx, ground_y - <span class="tok-num">0.5</span> });
    bg.<span class="tok-fn">addRectFilled</span>(.{
        .x = g_tl[<span class="tok-num">0</span>],
        .y = g_tl[<span class="tok-num">1</span>],
        .width = g_br[<span class="tok-num">0</span>] - g_tl[<span class="tok-num">0</span>],
        .height = g_br[<span class="tok-num">1</span>] - g_tl[<span class="tok-num">1</span>],
    }, ground_color);

    <span class="tok-comment">// boxes - each a filled, rotated quad (mirrors the 3D loop: get pos, get rot, draw)</span>
    <span class="tok-kw">for</span> (s.boxes2d, <span class="tok-num">0</span>..) |h, i| {
        <span class="tok-kw">const</span> pos: Vec2 = p2.<span class="tok-fn">getPosition</span>(&amp;s.world2d, h);
        <span class="tok-kw">const</span> rot: Rot2 = p2.<span class="tok-fn">getRotation</span>(&amp;s.world2d, h);
        <span class="tok-kw">const</span> q0: Vec2 = <span class="tok-fn">corner2d</span>(cam2d, pos, rot, .{ -half, -half });
        <span class="tok-kw">const</span> q1: Vec2 = <span class="tok-fn">corner2d</span>(cam2d, pos, rot, .{ half, -half });
        <span class="tok-kw">const</span> q2: Vec2 = <span class="tok-fn">corner2d</span>(cam2d, pos, rot, .{ half, half });
        <span class="tok-kw">const</span> q3: Vec2 = <span class="tok-fn">corner2d</span>(cam2d, pos, rot, .{ -half, half });
        bg.<span class="tok-fn">addQuadFilled</span>(q0, q1, q2, q3, palette[i]);
    }

    <span class="tok-comment">// divider between the two halves</span>
    bg.<span class="tok-fn">addLine</span>(.{ fw * <span class="tok-num">0.5</span>, <span class="tok-num">0</span> }, .{ fw * <span class="tok-num">0.5</span>, fh }, divider_color, <span class="tok-num">2.0</span>);

    <span class="tok-comment">// ---- Reset control ----</span>
    <span class="tok-kw">const</span> btn: ui.ButtonOpts = .{ .size = .{ <span class="tok-num">140</span>, <span class="tok-num">30</span> } };
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"controls"</span>, .{
        .initial_pos = .{ fw * <span class="tok-num">0.5</span> - <span class="tok-num">82</span>, <span class="tok-num">10</span> },
        .initial_size = .{ <span class="tok-num">164</span>, <span class="tok-num">56</span> },
        .flags = .{ .no_move = false, .no_resize = true, .no_collapse = true },
    })) |win| {
        <span class="tok-kw">defer</span> win.<span class="tok-fn">close</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Reset both"</span>, btn)) {
            <span class="tok-fn">resetWorlds</span>(s);
        }
    }
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - 2D | 3D physics side by side"</span>,
            .width = <span class="tok-num">1000</span>,
            .height = <span class="tok-num">560</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
