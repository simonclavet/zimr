<h1>voxel</h1>
<figure class="code src-file" data-path="examples/voxel/voxel.zig" data-lines="271"><figcaption><span>examples/voxel/voxel.zig</span><span>271 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! voxel - raylib's `models_basic_voxel`, the zimr way.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! An 8x8x8 solid block of unit cubes.  A crosshair sits locked at</span>
<span class="tok-comment">//! screen center; a tap casts a ray through it (`getScreenToWorldRay`,</span>
<span class="tok-comment">//! this port) and tests every remaining voxel's AABB</span>
<span class="tok-comment">//! (`getRayCollisionBox`) - the CLOSEST hit is removed, Minecraft-style</span>
<span class="tok-comment">//! block-breaking.  Cubes are drawn through the immediate-mode 3D batch</span>
<span class="tok-comment">//! (`drawCube` + `drawCubeWires`), exactly raylib's per-voxel loop, so</span>
<span class="tok-comment">//! the whole field coalesces into a couple of draws.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Phone-first: raylib uses WASD + locked-mouse first-person look.</span>
<span class="tok-comment">//! Here ONE finger drags to look (yaw/pitch), a TAP (press+release</span>
<span class="tok-comment">//! under ~10px) breaks the voxel under the crosshair, and two on-screen</span>
<span class="tok-comment">//! buttons dolly the camera in/out along its facing so you can reach</span>
<span class="tok-comment">//! the far cubes.  "reset" refills the block.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> world: usize = <span class="tok-num">8</span>; <span class="tok-comment">// 8x8x8 voxel field</span>
<span class="tok-kw">const</span> beige: Color = .{ .r = <span class="tok-num">211</span>, .g = <span class="tok-num">176</span>, .b = <span class="tok-num">131</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> wire: Color = .{ .r = <span class="tok-num">30</span>, .g = <span class="tok-num">30</span>, .b = <span class="tok-num">36</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> bg_clear: Color = .{ .r = <span class="tok-num">232</span>, .g = <span class="tok-num">232</span>, .b = <span class="tok-num">236</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> crosshair_red: Color = .{ .r = <span class="tok-num">230</span>, .g = <span class="tok-num">40</span>, .b = <span class="tok-num">40</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    voxels: [world][world][world]bool = undefined,
    remaining: u32 = <span class="tok-num">0</span>,

    ui_host: z.UiHost,
    font: z.Font,

    <span class="tok-comment">// Orbit-style first-person: look angles + a distance so tap-look and</span>
    <span class="tok-comment">// the dolly buttons both feel natural on a phone.</span>
    cam_yaw: f32 = <span class="tok-num">0.9</span>,
    cam_pitch: f32 = <span class="tok-num">0.35</span>,
    cam_dist: f32 = <span class="tok-num">14.0</span>,

    press_pos: Vec2 = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> },
    pressed: bool = false,
    dragging: bool = false,
    drag_total: f32 = <span class="tok-num">0</span>,
    prev_pinch: f32 = <span class="tok-num">0</span>,
};

<span class="tok-kw">fn</span> <span class="tok-fn">fill</span>(s: *State) void {
    <span class="tok-kw">var</span> count: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..world) |x| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..world) |y| {
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..world) |zc| {
                s.voxels[x][y][zc] = true;
                count += <span class="tok-num">1</span>;
            }
        }
    }
    s.remaining = count;
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.* = .{
        .gpa = gpa,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .font = font,
    };
    <span class="tok-fn">fill</span>(s);
}

<span class="tok-comment">/// The field is centered on the origin: voxel (x,y,z) sits at world</span>
<span class="tok-comment">/// (x - c, y - c, z - c) with c = (world-1)/2.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">voxelCenter</span>(x: usize, y: usize, zc: usize) Vec {
    <span class="tok-kw">const</span> c: f32 = <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(world - <span class="tok-num">1</span>))) * <span class="tok-num">0.5</span>;
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(
        <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(x))) - c,
        <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(y))) - c,
        <span class="tok-fn">float</span>(<span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(zc))) - c,
    );
}

<span class="tok-kw">fn</span> <span class="tok-fn">cameraOf</span>(s: *<span class="tok-kw">const</span> State) Camera3D {
    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(s.cam_pitch);
    <span class="tok-kw">const</span> sp: f32 = <span class="tok-builtin">@sin</span>(s.cam_pitch);
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-builtin">@cos</span>(s.cam_yaw);
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-builtin">@sin</span>(s.cam_yaw);
    <span class="tok-kw">const</span> eye: Vec = <span class="tok-fn">vec</span>(s.cam_dist * cp * sy, s.cam_dist * sp, s.cam_dist * cp * cy);
    <span class="tok-kw">return</span> .{
        .position = eye,
        .target = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        .up = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>),
        .fovy_deg = <span class="tok-num">55</span>,
    };
}

<span class="tok-comment">/// Cast a ray through the crosshair (screen center) and remove the</span>
<span class="tok-comment">/// closest still-present voxel it hits.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">breakVoxel</span>(s: *State, cam: Camera3D, vw: f32, vh: f32) void {
    <span class="tok-kw">const</span> center: Vec2 = .{ vw * <span class="tok-num">0.5</span>, vh * <span class="tok-num">0.5</span> };
    <span class="tok-kw">const</span> ray: zm.Ray = z.<span class="tok-fn">getScreenToWorldRay</span>(center, cam, vw, vh);

    <span class="tok-kw">var</span> best_dist: f32 = <span class="tok-num">1.0e30</span>;
    <span class="tok-kw">var</span> hit_x: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> hit_y: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> hit_z: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> found: bool = false;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..world) |x| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..world) |y| {
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..world) |zc| {
                <span class="tok-kw">if</span> (!s.voxels[x][y][zc]) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> ctr: Vec = <span class="tok-fn">voxelCenter</span>(x, y, zc);
                <span class="tok-kw">const</span> col: zm.RayCollision = z.<span class="tok-fn">getRayCollisionBox</span>(ray, .{
                    .min = <span class="tok-fn">vec</span>(ctr[<span class="tok-num">0</span>] - <span class="tok-num">0.5</span>, ctr[<span class="tok-num">1</span>] - <span class="tok-num">0.5</span>, ctr[<span class="tok-num">2</span>] - <span class="tok-num">0.5</span>),
                    .max = <span class="tok-fn">vec</span>(ctr[<span class="tok-num">0</span>] + <span class="tok-num">0.5</span>, ctr[<span class="tok-num">1</span>] + <span class="tok-num">0.5</span>, ctr[<span class="tok-num">2</span>] + <span class="tok-num">0.5</span>),
                });
                <span class="tok-kw">if</span> (col.hit <span class="tok-kw">and</span> col.distance &lt; best_dist) {
                    best_dist = col.distance;
                    hit_x = x;
                    hit_y = y;
                    hit_z = zc;
                    found = true;
                }
            }
        }
    }
    <span class="tok-kw">if</span> (found) {
        s.voxels[hit_x][hit_y][hit_z] = false;
        s.remaining -= <span class="tok-num">1</span>;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(
    f: *z.Frame,
    s: *State,
    ui_wants_mouse: bool,
    cam: Camera3D,
    vw: f32,
    vh: f32,
) void {
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> dx: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (s.prev_pinch &gt; <span class="tok-num">0</span>) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - (dist - s.prev_pinch) * <span class="tok-num">0.03</span>, <span class="tok-num">3.0</span>, <span class="tok-num">24.0</span>);
        }
        s.prev_pinch = dist;
        s.pressed = false;
        <span class="tok-kw">return</span>;
    }
    s.prev_pinch = <span class="tok-num">0</span>;

    <span class="tok-kw">const</span> mp: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !ui_wants_mouse) {
        <span class="tok-kw">if</span> (s.dragging) {
            <span class="tok-kw">const</span> d: Vec2 = z.<span class="tok-fn">getMouseDelta</span>(f.input);
            s.cam_yaw -= d[<span class="tok-num">0</span>] * <span class="tok-num">0.008</span>;
            s.cam_pitch = <span class="tok-fn">clamp</span>(s.cam_pitch + d[<span class="tok-num">1</span>] * <span class="tok-num">0.008</span>, -<span class="tok-num">1.4</span>, <span class="tok-num">1.4</span>);
            s.drag_total += <span class="tok-builtin">@abs</span>(d[<span class="tok-num">0</span>]) + <span class="tok-builtin">@abs</span>(d[<span class="tok-num">1</span>]);
        } <span class="tok-kw">else</span> {
            s.press_pos = mp;
            s.drag_total = <span class="tok-num">0</span>;
            s.pressed = true;
        }
        s.dragging = true;
    } <span class="tok-kw">else</span> {
        <span class="tok-comment">// Release: a press that stayed put is a tap -&gt; break a voxel.</span>
        <span class="tok-kw">if</span> (s.dragging <span class="tok-kw">and</span> s.pressed <span class="tok-kw">and</span> s.drag_total &lt; <span class="tok-num">10.0</span>) {
            <span class="tok-fn">breakVoxel</span>(s, cam, vw, vh);
        }
        s.dragging = false;
        s.pressed = false;
    }
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span>) {
        s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - wheel * <span class="tok-num">0.6</span>, <span class="tok-num">3.0</span>, <span class="tok-num">24.0</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    z.<span class="tok-fn">clearViewport</span>(f, bg_clear);

    <span class="tok-kw">const</span> cam: Camera3D = <span class="tok-fn">cameraOf</span>(s);

    <span class="tok-comment">// ---- UI (dolly + reset); its capture flag gates look/tap ----</span>
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">320</span>, vw - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">128</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">120</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"basic voxel"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"tap the crosshair to break a voxel"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"voxels left: {d}"</span>, .{s.remaining});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"closer"</span>, .{})) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - <span class="tok-num">1.5</span>, <span class="tok-num">3.0</span>, <span class="tok-num">24.0</span>);
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"farther"</span>, .{})) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist + <span class="tok-num">1.5</span>, <span class="tok-num">3.0</span>, <span class="tok-num">24.0</span>);
        }
        u.<span class="tok-fn">sameLine</span>(.{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"reset"</span>, .{})) {
            <span class="tok-fn">fill</span>(s);
        }
    }
    <span class="tok-fn">handleInput</span>(f, s, u.<span class="tok-fn">wantCaptureMouse</span>(), cam, vw, vh);

    <span class="tok-comment">// ---- the 3D scene: grid + every present voxel (solid + wire) ----</span>
    z.<span class="tok-fn">beginMode3D</span>(f.gl, cam);
    z.<span class="tok-fn">drawGrid</span>(f.gl, <span class="tok-num">12</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..world) |x| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..world) |y| {
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..world) |zc| {
                <span class="tok-kw">if</span> (!s.voxels[x][y][zc]) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-kw">const</span> ctr: Vec = <span class="tok-fn">voxelCenter</span>(x, y, zc);
                z.<span class="tok-fn">drawCube</span>(f.gl, ctr, .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>), .color = beige });
                z.<span class="tok-fn">drawCubeWires</span>(f.gl, ctr, .{ .size = <span class="tok-fn">vec</span>(<span class="tok-num">1.001</span>, <span class="tok-num">1.001</span>, <span class="tok-num">1.001</span>), .color = wire });
            }
        }
    }
    z.<span class="tok-fn">endMode3D</span>(f.gl);

    <span class="tok-comment">// ---- 2D crosshair, screen-anchored (drawn after endMode3D) ----</span>
    <span class="tok-kw">const</span> cx: f32 = vw * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> cy: f32 = vh * <span class="tok-num">0.5</span>;
    f.gl.<span class="tok-fn">circle</span>(.{ cx, cy }, <span class="tok-num">5.0</span>, .{ .color = crosshair_red, .segments = <span class="tok-num">20</span> });

    s.ui_host.<span class="tok-fn">render</span>(f);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - basic voxel (tap to break)"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .deinit = deinit,
    .update = update,
};
