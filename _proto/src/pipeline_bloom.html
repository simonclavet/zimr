<h1>pipeline_bloom</h1>
<figure class="code src-file" data-path="examples/pipeline_bloom/pipeline_bloom.zig" data-lines="318"><figcaption><span>examples/pipeline_bloom/pipeline_bloom.zig</span><span>318 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! pipeline_bloom - a full multi-pass BLOOM effect, now entirely on the typed</span>
<span class="tok-comment">//! shader interface (no inline WGSL, no override constants). Five effect passes</span>
<span class="tok-comment">//! across three render textures:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   scene  -&gt; rt_scene         (a field of orbiting, pulsing glowing orbs)</span>
<span class="tok-comment">//!   bright -&gt; rt_a             (keep only pixels above a luminance threshold)</span>
<span class="tok-comment">//!   blurH  -&gt; rt_b, blurV -&gt; rt_a   (separable Gaussian, x4 for a wider glow)</span>
<span class="tok-comment">//!   composite: rt_scene + rt_a -&gt; backbuffer (add the blurred highlights back)</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Every effect pass is a fullscreen shader authored in pure Zig</span>
<span class="tok-comment">//! (`examples/bloom_*.zig`) and compiled to WGSL by the build. Each pass's</span>
<span class="tok-comment">//! per-pass configuration - the bright threshold, the blur direction, the</span>
<span class="tok-comment">//! composite intensity - is a PER-PASS UBO rather than a WGSL `override`</span>
<span class="tok-comment">//! constant. That's the clean fit here (each value is set once at load) and it</span>
<span class="tok-comment">//! needs no spec-constant authoring. The two blur directions are two separate</span>
<span class="tok-comment">//! LoadedShaders with their `dir` baked in at load, which also sidesteps the</span>
<span class="tok-comment">//! "can't update a UBO between draws in one command buffer" hazard.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The scene itself is drawn with the immediate 2D path (radial-gradient</span>
<span class="tok-comment">//! circles straight into rt_scene) - bright glowing cores on near-black, which</span>
<span class="tok-comment">//! is what bloom actually wants: small very-bright regions against darkness.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Build:  zig build pipeline-bloom</span>
<span class="tok-comment">//! Device: zig build pipeline-bloom-standalone -Dmode=release</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> clamp = zm.clamp;

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// The scene is a field of glowing orbs drawn straight into rt_scene with the</span>
<span class="tok-comment">// immediate 2D path (drawCircleGradient - a bright core fading to black, which</span>
<span class="tok-comment">// is exactly the shape of a light source). No scene shader / vertex buffer: the</span>
<span class="tok-comment">// engine's built-in 2D shape shader draws it, and the bloom chain does the rest.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// WHY ORBS, NOT THE OLD GRADIENT TRIANGLE: bloom keeps only pixels whose</span>
<span class="tok-comment">// LUMINANCE clears `bright_thresh`, so it pops only where the scene has small,</span>
<span class="tok-comment">// very bright regions against darkness. A flat mid-bright triangle sits just</span>
<span class="tok-comment">// over the threshold everywhere and blooms as a dull uniform smear. Bright</span>
<span class="tok-comment">// cores on black give crisp, glowing halos - the whole point of the effect.</span>

<span class="tok-comment">// Effect passes - the bloom shaders (examples/bloom_*.zig), wired into this</span>
<span class="tok-comment">// example via the `.shaders` build list. The typed `_io` schemas are imported</span>
<span class="tok-comment">// directly; the `.wgsl` bodies are build artifacts embedded by basename.</span>
<span class="tok-kw">const</span> fullscreen_vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"bloom_fullscreen_vs_io.zig"</span>);
<span class="tok-kw">const</span> bright_fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"bloom_bright_fs_io.zig"</span>);
<span class="tok-kw">const</span> blur_fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"bloom_blur_fs_io.zig"</span>);
<span class="tok-kw">const</span> composite_fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"bloom_composite_fs_io.zig"</span>);
<span class="tok-kw">const</span> fullscreen_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"bloom_fullscreen_vs.wgsl"</span>);
<span class="tok-kw">const</span> bright_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"bloom_bright_fs.wgsl"</span>);
<span class="tok-kw">const</span> blur_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"bloom_blur_fs.wgsl"</span>);
<span class="tok-kw">const</span> composite_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"bloom_composite_fs.wgsl"</span>);

<span class="tok-kw">const</span> rt_size: i32 = <span class="tok-num">512</span>;
<span class="tok-kw">const</span> rt_sizef: f32 = <span class="tok-num">512.0</span>;
<span class="tok-kw">const</span> blur_iters: usize = <span class="tok-num">2</span>;
<span class="tok-kw">const</span> bright_thresh: f32 = <span class="tok-num">0.20</span>;
<span class="tok-kw">const</span> blur_texel: f32 = <span class="tok-num">2.0</span> / <span class="tok-num">512.0</span>;
<span class="tok-kw">const</span> composite_intensity: f32 = <span class="tok-num">4.0</span>;

<span class="tok-kw">const</span> BrightSchema = z.shader.<span class="tok-fn">MaterialSchema</span>(fullscreen_vs_io, bright_fs_io);
<span class="tok-kw">const</span> BlurSchema = z.shader.<span class="tok-fn">MaterialSchema</span>(fullscreen_vs_io, blur_fs_io);
<span class="tok-kw">const</span> CompositeSchema = z.shader.<span class="tok-fn">MaterialSchema</span>(fullscreen_vs_io, composite_fs_io);

<span class="tok-comment">/// One glowing orb: an orbit (radius + angular speed + phase), a core colour</span>
<span class="tok-comment">/// with a WHITE-HOT centre, and a base radius that pulses. Colours are chosen</span>
<span class="tok-comment">/// BRIGHT and high-luminance (not pure saturated hues, which have low luminance</span>
<span class="tok-comment">/// and would barely clear the bright-pass threshold) so each orb blooms hard.</span>
<span class="tok-kw">const</span> Orb = <span class="tok-kw">struct</span> {
    orbit: f32, <span class="tok-comment">// orbit radius as a fraction of the RT half-size</span>
    speed: f32, <span class="tok-comment">// radians/sec around the centre</span>
    phase: f32, <span class="tok-comment">// starting angle</span>
    pulse: f32, <span class="tok-comment">// radians/sec of the size/brightness pulse</span>
    radius: f32, <span class="tok-comment">// base radius in RT pixels</span>
    color: Vec, <span class="tok-comment">// {r,g,b,_} in 0..1 - the halo tint</span>
};

<span class="tok-kw">const</span> orbs = [_]Orb{
    .{ .orbit = <span class="tok-num">0.00</span>, .speed = <span class="tok-num">0.0</span>, .phase = <span class="tok-num">0.0</span>, .pulse = <span class="tok-num">1.3</span>, .radius = <span class="tok-num">56</span>, .color = .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.95</span>, <span class="tok-num">0.85</span>, <span class="tok-num">1</span> } },
    .{ .orbit = <span class="tok-num">0.42</span>, .speed = <span class="tok-num">0.55</span>, .phase = <span class="tok-num">0.0</span>, .pulse = <span class="tok-num">2.1</span>, .radius = <span class="tok-num">11</span>, .color = .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.4</span>, <span class="tok-num">0.7</span>, <span class="tok-num">1</span> } },
    .{ .orbit = <span class="tok-num">0.42</span>, .speed = <span class="tok-num">0.55</span>, .phase = <span class="tok-num">2.09</span>, .pulse = <span class="tok-num">1.7</span>, .radius = <span class="tok-num">44</span>, .color = .{ <span class="tok-num">0.4</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.9</span>, <span class="tok-num">1</span> } },
    .{ .orbit = <span class="tok-num">0.42</span>, .speed = <span class="tok-num">0.55</span>, .phase = <span class="tok-num">4.19</span>, .pulse = <span class="tok-num">2.4</span>, .radius = <span class="tok-num">14</span>, .color = .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.85</span>, <span class="tok-num">0.35</span>, <span class="tok-num">1</span> } },
    .{ .orbit = <span class="tok-num">0.66</span>, .speed = -<span class="tok-num">0.35</span>, .phase = <span class="tok-num">1.0</span>, .pulse = <span class="tok-num">1.9</span>, .radius = <span class="tok-num">50</span>, .color = .{ <span class="tok-num">0.55</span>, <span class="tok-num">0.75</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1</span> } },
    .{ .orbit = <span class="tok-num">0.66</span>, .speed = -<span class="tok-num">0.35</span>, .phase = <span class="tok-num">3.1</span>, .pulse = <span class="tok-num">2.6</span>, .radius = <span class="tok-num">20</span>, .color = .{ <span class="tok-num">0.7</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.5</span>, <span class="tok-num">1</span> } },
    .{ .orbit = <span class="tok-num">0.66</span>, .speed = -<span class="tok-num">0.35</span>, .phase = <span class="tok-num">5.2</span>, .pulse = <span class="tok-num">1.5</span>, .radius = <span class="tok-num">34</span>, .color = .{ <span class="tok-num">1.0</span>, <span class="tok-num">0.6</span>, <span class="tok-num">0.4</span>, <span class="tok-num">1</span> } },
    .{ .orbit = <span class="tok-num">0.84</span>, .speed = <span class="tok-num">0.8</span>, .phase = <span class="tok-num">0.5</span>, .pulse = <span class="tok-num">3.0</span>, .radius = <span class="tok-num">9</span>, .color = .{ <span class="tok-num">0.95</span>, <span class="tok-num">0.7</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1</span> } },
    .{ .orbit = <span class="tok-num">0.84</span>, .speed = <span class="tok-num">0.8</span>, .phase = <span class="tok-num">3.6</span>, .pulse = <span class="tok-num">2.2</span>, .radius = <span class="tok-num">40</span>, .color = .{ <span class="tok-num">0.6</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1</span> } },
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    rt_scene: z.RenderTexture,
    rt_a: z.RenderTexture,
    rt_b: z.RenderTexture,
    bright: z.shader.<span class="tok-fn">LoadedShader</span>(BrightSchema),
    blur_h: z.shader.<span class="tok-fn">LoadedShader</span>(BlurSchema),
    blur_v: z.shader.<span class="tok-fn">LoadedShader</span>(BlurSchema),
    composite: z.shader.<span class="tok-fn">LoadedShader</span>(CompositeSchema),
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.bright.<span class="tok-fn">deinit</span>();
    s.blur_h.<span class="tok-fn">deinit</span>();
    s.blur_v.<span class="tok-fn">deinit</span>();
    s.composite.<span class="tok-fn">deinit</span>();
    s.rt_scene.<span class="tok-fn">deinit</span>();
    s.rt_a.<span class="tok-fn">deinit</span>();
    s.rt_b.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-comment">// Three render textures (rgba8_unorm, no depth) - the scene, and the two</span>
    <span class="tok-comment">// ping-pong blur buffers.</span>
    <span class="tok-kw">const</span> rt_scene: z.RenderTexture = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, rt_size, rt_size);
    <span class="tok-kw">const</span> rt_a: z.RenderTexture = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, rt_size, rt_size);
    <span class="tok-kw">const</span> rt_b: z.RenderTexture = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, rt_size, rt_size);

    <span class="tok-comment">// Bright pass: rt_scene -&gt; rt_a. Keeps luminance above `thresh`.</span>
    <span class="tok-kw">const</span> bright: z.shader.<span class="tok-fn">LoadedShader</span>(BrightSchema) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(fullscreen_vs_io, bright_fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = fullscreen_vs_wgsl,
        .fs_wgsl_source = bright_fs_wgsl,
        .textures = .{ .src = rt_scene.<span class="tok-fn">asTexture</span>() },
        .initial_ubo = .{ .params = .{ bright_thresh, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
        .color_format = .rgba8_unorm,
        .depth_state = .none,
        .label = <span class="tok-str">"bloom_bright"</span>,
    });

    <span class="tok-comment">// Separable blur: TWO shaders sharing one FS, direction baked into each</span>
    <span class="tok-comment">// one's UBO (so no mid-frame UBO update is needed). blur_h reads rt_a and</span>
    <span class="tok-comment">// writes rt_b; blur_v reads rt_b and writes rt_a. Both source textures are</span>
    <span class="tok-comment">// fixed, so the ping-pong is just the alternating render targets.</span>
    <span class="tok-kw">const</span> blur_h: z.shader.<span class="tok-fn">LoadedShader</span>(BlurSchema) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(fullscreen_vs_io, blur_fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = fullscreen_vs_wgsl,
        .fs_wgsl_source = blur_fs_wgsl,
        .textures = .{ .src = rt_a.<span class="tok-fn">asTexture</span>() },
        .initial_ubo = .{ .dir = .{ blur_texel, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
        .color_format = .rgba8_unorm,
        .depth_state = .none,
        .label = <span class="tok-str">"bloom_blur_h"</span>,
    });
    <span class="tok-kw">const</span> blur_v: z.shader.<span class="tok-fn">LoadedShader</span>(BlurSchema) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(fullscreen_vs_io, blur_fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = fullscreen_vs_wgsl,
        .fs_wgsl_source = blur_fs_wgsl,
        .textures = .{ .src = rt_b.<span class="tok-fn">asTexture</span>() },
        .initial_ubo = .{ .dir = .{ <span class="tok-num">0</span>, blur_texel, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
        .color_format = .rgba8_unorm,
        .depth_state = .none,
        .label = <span class="tok-str">"bloom_blur_v"</span>,
    });

    <span class="tok-comment">// Composite: rt_scene + rt_a -&gt; backbuffer. Two textures, bound by schema</span>
    <span class="tok-comment">// field name. Targets the backbuffer, so no explicit color_format.</span>
    <span class="tok-kw">const</span> composite: z.shader.<span class="tok-fn">LoadedShader</span>(CompositeSchema) =
        <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(fullscreen_vs_io, composite_fs_io, .{
            .f = f.gpu,
            .gpa = gpa,
            .vs_wgsl_source = fullscreen_vs_wgsl,
            .fs_wgsl_source = composite_fs_wgsl,
            .textures = .{ .scene = rt_scene.<span class="tok-fn">asTexture</span>(), .bloom = rt_a.<span class="tok-fn">asTexture</span>() },
            .initial_ubo = .{ .params = .{ composite_intensity, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } },
            .depth_state = .none,
            .label = <span class="tok-str">"bloom_composite"</span>,
        });

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>),
        .rt_scene = rt_scene,
        .rt_a = rt_a,
        .rt_b = rt_b,
        .bright = bright,
        .blur_h = blur_h,
        .blur_v = blur_v,
        .composite = composite,
    };
}

<span class="tok-comment">/// Draw the glowing-orb scene into rt_scene. Each orb is a radial gradient</span>
<span class="tok-comment">/// (bright core -&gt; transparent edge) so it reads as a soft light source, with a</span>
<span class="tok-comment">/// small white-hot centre that clears the bright-pass threshold cleanly. The</span>
<span class="tok-comment">/// orbs orbit the centre and pulse in size/brightness.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawScene</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> bg: zm.Color = .{ .r = <span class="tok-num">4</span>, .g = <span class="tok-num">5</span>, .b = <span class="tok-num">10</span>, .a = <span class="tok-num">255</span> };
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt_scene, bg);
    <span class="tok-kw">const</span> cx: f32 = rt_sizef * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> cy: f32 = rt_sizef * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> half: f32 = rt_sizef * <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">for</span> (orbs) |orb| {
        <span class="tok-kw">const</span> ang: f32 = orb.phase + t * orb.speed;
        <span class="tok-kw">const</span> ox: f32 = cx + <span class="tok-builtin">@cos</span>(ang) * orb.orbit * half * <span class="tok-num">0.82</span>;
        <span class="tok-kw">const</span> oy: f32 = cy + <span class="tok-builtin">@sin</span>(ang) * orb.orbit * half * <span class="tok-num">0.82</span>;
        <span class="tok-comment">// Pulse: 0.72..1.0 on size, 0.75..1.0 on brightness.</span>
        <span class="tok-kw">const</span> p: f32 = <span class="tok-num">0.5</span> + <span class="tok-num">0.5</span> * <span class="tok-builtin">@sin</span>(t * orb.pulse + orb.phase);
        <span class="tok-kw">const</span> rad: f32 = orb.radius * (<span class="tok-num">0.72</span> + <span class="tok-num">0.28</span> * p);
        <span class="tok-kw">const</span> bright: f32 = <span class="tok-num">1.15</span> + <span class="tok-num">0.35</span> * p;
        <span class="tok-kw">const</span> inner: zm.Color = <span class="tok-fn">colorScaled</span>(orb.color, bright);
        <span class="tok-kw">const</span> edge: zm.Color = .{ .r = inner.r, .g = inner.g, .b = inner.b, .a = <span class="tok-num">0</span> };
        <span class="tok-comment">// Soft coloured halo (large, faded) then the bright core, then a</span>
        <span class="tok-comment">// white-hot centre that guarantees a clean threshold hit.</span>
        f.gl.<span class="tok-fn">circleGradient</span>(.{ ox, oy }, rad * <span class="tok-num">3.2</span>, <span class="tok-fn">dim</span>(inner, <span class="tok-num">0.9</span>), edge);
        f.gl.<span class="tok-fn">circleGradient</span>(.{ ox, oy }, rad, inner, edge);
        f.gl.<span class="tok-fn">circleGradient</span>(.{ ox, oy }, rad * <span class="tok-num">0.75</span>, <span class="tok-fn">whiteHot</span>(bright), edge);
    }
    z.<span class="tok-fn">endTextureMode</span>(f.gl);
}

<span class="tok-comment">/// A 0..1 float colour scaled by `k`, as an 8-bit Color (clamped).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">colorScaled</span>(c: Vec, k: f32) zm.Color {
    <span class="tok-kw">return</span> .{
        .r = <span class="tok-fn">chan</span>(c[<span class="tok-num">0</span>] * k),
        .g = <span class="tok-fn">chan</span>(c[<span class="tok-num">1</span>] * k),
        .b = <span class="tok-fn">chan</span>(c[<span class="tok-num">2</span>] * k),
        .a = <span class="tok-num">255</span>,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">dim</span>(c: zm.Color, k: f32) zm.Color {
    <span class="tok-kw">return</span> .{
        .r = <span class="tok-fn">chan</span>(<span class="tok-fn">cf</span>(c.r) * k),
        .g = <span class="tok-fn">chan</span>(<span class="tok-fn">cf</span>(c.g) * k),
        .b = <span class="tok-fn">chan</span>(<span class="tok-fn">cf</span>(c.b) * k),
        .a = c.a,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">whiteHot</span>(k: f32) zm.Color {
    <span class="tok-kw">const</span> v: u8 = <span class="tok-fn">chan</span>(k);
    <span class="tok-kw">return</span> .{ .r = v, .g = v, .b = v, .a = <span class="tok-num">255</span> };
}

<span class="tok-kw">fn</span> <span class="tok-fn">cf</span>(v: u8) f32 {
    <span class="tok-kw">return</span> <span class="tok-fn">float</span>(v) / <span class="tok-num">255.0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">chan</span>(v: f32) u8 {
    <span class="tok-kw">const</span> clamped: f32 = <span class="tok-fn">clamp</span>(v, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">return</span> <span class="tok-builtin">@trunc</span>(clamped * <span class="tok-num">255.0</span>);
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> black: zm.Color = .{ .r = <span class="tok-num">0</span>, .g = <span class="tok-num">0</span>, .b = <span class="tok-num">0</span>, .a = <span class="tok-num">255</span> };

    <span class="tok-comment">// Re-push the per-pass UBOs EVERY frame. Setting them only via `initial_ubo`</span>
    <span class="tok-comment">// left them correct for exactly one frame, then they read as zero (intensity</span>
    <span class="tok-comment">// 0 -&gt; no bloom -&gt; "bright for 1 frame then dark"). Pushing each frame keeps</span>
    <span class="tok-comment">// threshold / intensity / blur direction live.</span>
    s.bright.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .params = .{ bright_thresh, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } });
    s.blur_h.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .dir = .{ blur_texel, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } });
    s.blur_v.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .dir = .{ <span class="tok-num">0</span>, blur_texel, <span class="tok-num">0</span>, <span class="tok-num">0</span> } });
    s.composite.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .params = .{ composite_intensity, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> } });

    <span class="tok-comment">// 1) Scene: the glowing orbs -&gt; rt_scene.</span>
    <span class="tok-fn">drawScene</span>(f, s);

    <span class="tok-comment">// 2) Bright-pass: rt_scene -&gt; rt_a.</span>
    z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt_a, black);
    z.<span class="tok-fn">drawFullscreenShader</span>(f.gl, BrightSchema, &amp;s.bright);
    z.<span class="tok-fn">endTextureMode</span>(f.gl);

    <span class="tok-comment">// 3) Separable blur, ping-ponging rt_a &lt;-&gt; rt_b.</span>
    <span class="tok-kw">var</span> iter: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (iter &lt; blur_iters) : (iter += <span class="tok-num">1</span>) {
        z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt_b, black);
        z.<span class="tok-fn">drawFullscreenShader</span>(f.gl, BlurSchema, &amp;s.blur_h);
        z.<span class="tok-fn">endTextureMode</span>(f.gl);
        z.<span class="tok-fn">beginTextureMode</span>(f.gl, s.rt_a, black);
        z.<span class="tok-fn">drawFullscreenShader</span>(f.gl, BlurSchema, &amp;s.blur_v);
        z.<span class="tok-fn">endTextureMode</span>(f.gl);
    }

    <span class="tok-comment">// ---- SCREEN PASS: open once, composite to the backbuffer + caption. ----</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);

    <span class="tok-comment">// 4) Composite scene + blurred highlights -&gt; backbuffer.</span>
    z.<span class="tok-fn">drawFullscreenShader</span>(f.gl, CompositeSchema, &amp;s.composite);

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"pipeline_bloom: glowing orbs -&gt; bright -&gt; separable blur -&gt; composite (typed)"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    <span class="tok-comment">// Transient GPU-technique demo: pipeline setup creates layouts and shader</span>
    <span class="tok-comment">// modules that aren't retained in State, so a leak-tight deinit isn't</span>
    <span class="tok-comment">// practical. Opt out of the managed leak gate rather than fake teardown.</span>
    .memory = .managed,
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - pipeline bloom"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.0</span>, .g = <span class="tok-num">0.0</span>, .b = <span class="tok-num">0.0</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    <span class="tok-comment">// .memory left default (arena): init builds a compute pipeline / multi-pass</span>
    <span class="tok-comment">// chain (mipmap or bloom) whose intermediate handles aren't kept in State,</span>
    <span class="tok-comment">// so a full managed teardown needs added State fields - deferred.</span>
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Scene + bright + blur passes render offscreen before the screen opens</span>
    <span class="tok-comment">// (tile-based-GPU safe); owns its own begin/endDrawing.</span>
    .manages_own_frame = true,
};

<figure class="code src-file" data-path="examples/bloom_blur_fs.zig" data-lines="57"><figcaption><span>examples/bloom_blur_fs.zig</span><span>57 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/bloom_blur_fs.zig - bloom separable-Gaussian blur FS body.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A 5-tap Gaussian along the per-pass `dir` (already scaled by texel size in</span>
<span class="tok-comment">//! the UBO): centre tap plus two symmetric pairs at the standard linear-</span>
<span class="tok-comment">//! sampling offsets. The same compiled shader runs both the horizontal and</span>
<span class="tok-comment">//! vertical passes - only the UBO's `dir` differs. Schema in</span>
<span class="tok-comment">//! `bloom_blur_fs_io.zig`.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"bloom_blur_fs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_externs.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-comment">// 5-tap Gaussian: centre weight + two symmetric pairs, with the standard</span>
<span class="tok-comment">// linear-sampled offsets that fetch two texels per tap.</span>
<span class="tok-comment">//</span>
<span class="tok-comment">// NORMALIZED so w0 + 2*w1 + 2*w2 == 1.0. These are the inner three weights of a</span>
<span class="tok-comment">// 9-tap Gaussian; used as-is (a 5-tap) they summed to ~0.859, so every blur pass</span>
<span class="tok-comment">// lost ~14% brightness - compounding to a much dimmer bloom across the x4 passes.</span>
<span class="tok-comment">// Dividing each by that 0.859 sum restores an energy-preserving blur.</span>
<span class="tok-kw">const</span> w0: f32 = <span class="tok-num">0.264150</span>;
<span class="tok-kw">const</span> w1: f32 = <span class="tok-num">0.226413</span>;
<span class="tok-kw">const</span> w2: f32 = <span class="tok-num">0.141508</span>;
<span class="tok-kw">const</span> o1: f32 = <span class="tok-num">1.3846153</span>;
<span class="tok-kw">const</span> o2: f32 = <span class="tok-num">3.2307692</span>;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-kw">const</span> uv: Vec2 = io_in.v_uv;
    <span class="tok-kw">const</span> d: Vec = io_in.u.dir;
    <span class="tok-kw">const</span> s1: Vec2 = .{ d[<span class="tok-num">0</span>] * o1, d[<span class="tok-num">1</span>] * o1 };
    <span class="tok-kw">const</span> s2: Vec2 = .{ d[<span class="tok-num">0</span>] * o2, d[<span class="tok-num">1</span>] * o2 };

    <span class="tok-comment">// All samples happen here at shaderMain's top (uniform control flow, and the</span>
    <span class="tok-comment">// linter requires samples out of helpers), then are weighted and summed.</span>
    <span class="tok-kw">const</span> c0: Vec = io_in.<span class="tok-fn">src</span>(uv);
    <span class="tok-kw">const</span> cp1: Vec = io_in.<span class="tok-fn">src</span>(.{ uv[<span class="tok-num">0</span>] + s1[<span class="tok-num">0</span>], uv[<span class="tok-num">1</span>] + s1[<span class="tok-num">1</span>] });
    <span class="tok-kw">const</span> cm1: Vec = io_in.<span class="tok-fn">src</span>(.{ uv[<span class="tok-num">0</span>] - s1[<span class="tok-num">0</span>], uv[<span class="tok-num">1</span>] - s1[<span class="tok-num">1</span>] });
    <span class="tok-kw">const</span> cp2: Vec = io_in.<span class="tok-fn">src</span>(.{ uv[<span class="tok-num">0</span>] + s2[<span class="tok-num">0</span>], uv[<span class="tok-num">1</span>] + s2[<span class="tok-num">1</span>] });
    <span class="tok-kw">const</span> cm2: Vec = io_in.<span class="tok-fn">src</span>(.{ uv[<span class="tok-num">0</span>] - s2[<span class="tok-num">0</span>], uv[<span class="tok-num">1</span>] - s2[<span class="tok-num">1</span>] });

    out.final_color = .{
        c0[<span class="tok-num">0</span>] * w0 + (cp1[<span class="tok-num">0</span>] + cm1[<span class="tok-num">0</span>]) * w1 + (cp2[<span class="tok-num">0</span>] + cm2[<span class="tok-num">0</span>]) * w2,
        c0[<span class="tok-num">1</span>] * w0 + (cp1[<span class="tok-num">1</span>] + cm1[<span class="tok-num">1</span>]) * w1 + (cp2[<span class="tok-num">1</span>] + cm2[<span class="tok-num">1</span>]) * w2,
        c0[<span class="tok-num">2</span>] * w0 + (cp1[<span class="tok-num">2</span>] + cm1[<span class="tok-num">2</span>]) * w1 + (cp2[<span class="tok-num">2</span>] + cm2[<span class="tok-num">2</span>]) * w2,
        <span class="tok-num">1.0</span>,
    };
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
</code></pre></figure>
<figure class="code src-file" data-path="examples/bloom_blur_fs_io.zig" data-lines="43"><figcaption><span>examples/bloom_blur_fs_io.zig</span><span>43 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/bloom_blur_fs_io.zig - typed interface for the bloom separable-</span>

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Samplers = <span class="tok-kw">struct</span> {

<span class="tok-comment">/// Stage output - the blurred colour.</span>

<figure class="code src-file" data-path="examples/bloom_bright_fs.zig" data-lines="30"><figcaption><span>examples/bloom_bright_fs.zig</span><span>30 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/bloom_bright_fs.zig - bloom bright-pass FS body.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Keeps only the part of each pixel brighter than `thresh`, remapped so the</span>
<span class="tok-comment">//! threshold maps to black and white stays white (a soft knee). Feeds the blur</span>
<span class="tok-comment">//! passes. Schema in `bloom_bright_fs_io.zig`.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"bloom_bright_fs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_externs.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-kw">const</span> t: Vec = io_in.<span class="tok-fn">src</span>(io_in.v_uv);
    <span class="tok-kw">const</span> c: Vec3 = .{ t[<span class="tok-num">0</span>], t[<span class="tok-num">1</span>], t[<span class="tok-num">2</span>] };
    <span class="tok-kw">const</span> lum: f32 = c[<span class="tok-num">0</span>] * <span class="tok-num">0.299</span> + c[<span class="tok-num">1</span>] * <span class="tok-num">0.587</span> + c[<span class="tok-num">2</span>] * <span class="tok-num">0.114</span>;
    <span class="tok-kw">const</span> thresh: f32 = io_in.u.params[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> keep: f32 = <span class="tok-builtin">@max</span>(lum - thresh, <span class="tok-num">0.0</span>) / <span class="tok-builtin">@max</span>(<span class="tok-num">1.0</span> - thresh, <span class="tok-num">0.001</span>);
    out.final_color = .{ c[<span class="tok-num">0</span>] * keep, c[<span class="tok-num">1</span>] * keep, c[<span class="tok-num">2</span>] * keep, <span class="tok-num">1.0</span> };

    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
</code></pre></figure>

<span class="tok-comment">//!</span>
<span class="tok-comment">//! Adds the blurred bloom highlights back onto the original scene, scaled by</span>
<span class="tok-comment">//! `intensity`. The final tone-mapping-free combine that produces the glow.</span>
<span class="tok-comment">//! Schema in `bloom_composite_fs_io.zig`.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"bloom_composite_fs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_externs.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-kw">const</span> uv = io_in.v_uv;
    <span class="tok-kw">const</span> s: Vec = io_in.<span class="tok-fn">scene</span>(uv);
    <span class="tok-kw">const</span> b: Vec = io_in.<span class="tok-fn">bloom</span>(uv);
    <span class="tok-kw">const</span> intensity: f32 = io_in.u.params[<span class="tok-num">0</span>];

        s[<span class="tok-num">2</span>] + b[<span class="tok-num">2</span>] * intensity,

    <span class="tok-kw">return</span> out;

<span class="tok-kw">comptime</span> {

<figure class="code src-file" data-path="examples/bloom_composite_fs_io.zig" data-lines="47"><figcaption><span>examples/bloom_composite_fs_io.zig</span><span>47 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/bloom_composite_fs_io.zig - typed interface for the bloom</span>
<span class="tok-comment">//! composite pass: adds the blurred highlights back onto the original scene,</span>
<span class="tok-comment">//! scaled by `intensity`. Body in `bloom_composite_fs.zig`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Layout: two source textures + one sampler, all in group 0 (post passes have</span>
<span class="tok-comment">//! no material group). The per-pass UBO takes binding 0; the scene texture is</span>
<span class="tok-comment">//! pinned at binding 1, the bloom texture at binding 2, and they SHARE one</span>
<span class="tok-comment">//! sampler pinned at binding 3. `ubo_group = 0` keeps everything in one bind</span>
<span class="tok-comment">//! group.</span>

<span class="tok-kw">const</span> shader = <span class="tok-builtin">@import</span>(<span class="tok-str">"shader_interface"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> Vec = zm.Vec;

<span class="tok-comment">/// Pin the UBO to group 0 (post passes have no material group).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> ubo_group: u32 = <span class="tok-num">0</span>;

<span class="tok-comment">/// Interpolated screen UV from the shared fullscreen VS (structural varying).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Inputs = <span class="tok-kw">struct</span> {
    v_uv: Vec2,
};

<span class="tok-comment">/// group(0) binding(0): the per-pass composite scalar, padded to a vec4.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Ubo = <span class="tok-kw">struct</span> {
    <span class="tok-comment">/// {intensity, 0, 0, 0} - how strongly the blurred bloom is added back.</span>
    params: Vec,

<span class="tok-comment">/// Two source textures pinned into group 0 after the UBO: the original scene at</span>
<span class="tok-comment">/// binding 1, the blurred bloom at binding 2. Each `Sampler2D` is a texture +</span>

};

<span class="tok-comment">/// Stage output - the final composited colour.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Outputs = <span class="tok-kw">struct</span> {
    final_color: Vec,
};

<span class="tok-comment">//!</span>
<span class="tok-comment">//! Emits the standard oversized covering triangle - NDC corners (-1,-1),</span>
<span class="tok-comment">//! (3,-1), (-1,3) - and derives a [0,1] y-down screen UV for the fragment</span>
<span class="tok-comment">//! stage. Reused by every bloom effect pass (bright, blur, composite). Schema</span>
<span class="tok-comment">//! in `bloom_fullscreen_vs_io.zig`.</span>

<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"bloom_fullscreen_vs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(void);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-kw">const</span> vi: u32 = io_in.<span class="tok-fn">vertex_index</span>();
    <span class="tok-kw">const</span> cx: f32 = <span class="tok-kw">if</span> (vi == <span class="tok-num">1</span>) <span class="tok-num">3.0</span> <span class="tok-kw">else</span> -<span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-kw">if</span> (vi == <span class="tok-num">2</span>) <span class="tok-num">3.0</span> <span class="tok-kw">else</span> -<span class="tok-num">1.0</span>;

    out.position = .{ cx, cy, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span> };
    <span class="tok-comment">// NDC (-1..1, y-up) -&gt; UV (0..1, y-down).</span>
    out.v_uv = .{ (cx + <span class="tok-num">1.0</span>) * <span class="tok-num">0.5</span>, <span class="tok-num">1.0</span> - (cy + <span class="tok-num">1.0</span>) * <span class="tok-num">0.5</span> };

    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
