<h1>rt_sidebyside</h1>
<figure class="code src-file" data-path="examples/rt_sidebyside/rt_sidebyside.zig" data-lines="399"><figcaption><span>examples/rt_sidebyside/rt_sidebyside.zig</span><span>399 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! rt_sidebyside - the rt_fs path tracer on THREE execution targets, side</span>
<span class="tok-comment">//! by side from ONE Zig shader:</span>
<span class="tok-comment">//!   - LEFT  : `rt_fs.shaderMain` dispatched per pixel on the CPU (raster), 1/5 res.</span>
<span class="tok-comment">//!   - RIGHT : the EXACT SAME shaderMain compiled to WGSL, run as a fullscreen</span>
<span class="tok-comment">//!             GPU pass.</span>
<span class="tok-comment">//!   - CORNER: the SAME shaderMain evaluated by the Zig COMPILER (comptime),</span>
<span class="tok-comment">//!             accumulated over a few samples and baked into the binary as a</span>
<span class="tok-comment">//!             const. It cannot move - it is literally read-only data.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! One path tracer. One scatter/PRNG. Three targets. The CPU + GPU halves render</span>
<span class="tok-comment">//! live (1 sample/frame - watch the path-trace grain); the comptime corner is a</span>
<span class="tok-comment">//! clean multi-sample average computed at build time.</span>
<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Vec2i = zm.Vec2i;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> RayCamera = zm.RayCamera;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> vec4 = zm.vec4;

<span class="tok-kw">const</span> shader = <span class="tok-builtin">@import</span>(<span class="tok-str">"rt_fs.zig"</span>);
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"rt_fs_io.zig"</span>);
<span class="tok-kw">const</span> trivial_vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"trivial_vs_io.zig"</span>);

<span class="tok-kw">const</span> fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"rt_fs.wgsl"</span>);
<span class="tok-kw">const</span> trivial_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"trivial_vs.wgsl"</span>);

<span class="tok-kw">const</span> width: u32 = <span class="tok-num">800</span>;
<span class="tok-kw">const</span> height: u32 = <span class="tok-num">450</span>;

<span class="tok-comment">// CPU side at 1/5 res - a per-pixel path trace on the CPU is expensive.</span>
<span class="tok-comment">// sw_w/sw_h are the INITIAL dims; `ensureCpuTarget` reshapes the buffer to</span>
<span class="tok-comment">// the live canvas aspect each frame at this constant pixel budget.</span>
<span class="tok-kw">const</span> sw_w: u32 = width / <span class="tok-num">5</span>;
<span class="tok-kw">const</span> sw_h: u32 = height / <span class="tok-num">5</span>;
<span class="tok-kw">const</span> cpu_pixel_budget: f32 = <span class="tok-fn">float</span>(sw_w * sw_h);

<span class="tok-comment">// Comptime corner: small + few samples to keep the build budget sane.</span>
<span class="tok-kw">const</span> corner_cols: usize = <span class="tok-num">40</span>;
<span class="tok-kw">const</span> corner_rows: usize = <span class="tok-num">24</span>;
<span class="tok-kw">const</span> corner_samples: u32 = <span class="tok-num">4</span>;

<span class="tok-kw">const</span> panel_x: f32 = <span class="tok-num">14</span>;
<span class="tok-kw">const</span> panel_y: f32 = <span class="tok-num">14</span>;
<span class="tok-kw">const</span> panel_w: f32 = <span class="tok-num">340</span>;
<span class="tok-kw">const</span> panel_h: f32 = <span class="tok-num">140</span>;

<span class="tok-comment">// Orbit camera: position derived from yaw/pitch/dist around a fixed target.</span>
<span class="tok-kw">const</span> cam_target: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.3</span>, -<span class="tok-num">1.0</span>);
<span class="tok-kw">const</span> initial_yaw: f32 = <span class="tok-num">0.0</span>;
<span class="tok-kw">const</span> initial_pitch: f32 = <span class="tok-num">0.0935</span>; <span class="tok-comment">// matches the old eye (0, 0.6, 2.2)</span>
<span class="tok-kw">const</span> initial_dist: f32 = <span class="tok-num">3.214</span>;

<span class="tok-comment">// Tuning for the shared `z.OrbitCamera`. Sensitivity + clamps reproduce the</span>
<span class="tok-comment">// hand-rolled feel this example used to have (orbit 0.005 rad/px, dist 1.2..12).</span>
<span class="tok-kw">const</span> orbit_opts: z.OrbitOptions = .{
    .orbit_sensitivity = <span class="tok-num">0.005</span>,
    .min_distance = <span class="tok-num">1.2</span>,
    .max_distance = <span class="tok-num">12.0</span>,
    .min_pitch = -<span class="tok-num">1.5</span>,
    .max_pitch = <span class="tok-num">1.5</span>,
    .fovy_deg = <span class="tok-num">45.0</span>,
};

<span class="tok-comment">/// Build the scene UBO: a Camera3D ray basis (orbit yaw/pitch/dist) + the</span>
<span class="tok-comment">/// RTIOW-ish sphere scene. `frame_seed` varies the per-pixel sampling. The CPU</span>
<span class="tok-comment">/// dispatch, the GPU pass, and the comptime bake all read this same data.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildUbo</span>(
    yaw: f32,
    pitch: f32,
    dist: f32,
    frame_seed: f32,
    res_w: f32,
    res_h: f32,
) shader_io.Ubo {
    <span class="tok-kw">const</span> w_f: f32 = res_w;
    <span class="tok-kw">const</span> h_f: f32 = res_h;

    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(pitch);
    <span class="tok-kw">const</span> eye: Vec = <span class="tok-fn">vec</span>(
        cam_target[<span class="tok-num">0</span>] + dist * cp * <span class="tok-builtin">@sin</span>(yaw),
        cam_target[<span class="tok-num">1</span>] + dist * <span class="tok-builtin">@sin</span>(pitch),
        cam_target[<span class="tok-num">2</span>] + dist * cp * <span class="tok-builtin">@cos</span>(yaw),
    );
    <span class="tok-kw">const</span> cam3d: Camera3D = .{ .position = eye, .target = cam_target, .fovy_deg = <span class="tok-num">45.0</span> };
    <span class="tok-kw">const</span> cam: RayCamera = cam3d.<span class="tok-fn">rayBasis</span>(w_f, h_f);

    <span class="tok-kw">var</span> ubo: shader_io.Ubo = .{
        .cam_origin = cam.origin,
        .px00 = cam.px00,
        .pdu = cam.pdu,
        .pdv = cam.pdv,
        .resolution = .{ w_f, h_f },
        .frame_seed = frame_seed,
        .sphere_count = <span class="tok-num">6</span>,
        .sphere_geom = undefined,
        .sphere_albedo = undefined,
        .sphere_extra = undefined,
    };

    <span class="tok-comment">// geom = (cx,cy,cz,radius); albedo = (r,g,b,material 0=lambert/1=metal/2=glass);</span>
    <span class="tok-comment">// extra = (param,..) - glass IOR / metal fuzz.</span>
    ubo.sphere_geom = .{
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, -<span class="tok-num">100.5</span>, -<span class="tok-num">1</span>, <span class="tok-num">100</span>), <span class="tok-comment">// ground</span>
        <span class="tok-fn">vec4</span>(-<span class="tok-num">0.9</span>, <span class="tok-num">0.0</span>, -<span class="tok-num">1.0</span>, <span class="tok-num">0.5</span>), <span class="tok-comment">// glass</span>
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.0</span>, <span class="tok-num">0.0</span>, -<span class="tok-num">1.0</span>, <span class="tok-num">0.5</span>), <span class="tok-comment">// teal lambertian</span>
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.9</span>, <span class="tok-num">0.0</span>, -<span class="tok-num">1.0</span>, <span class="tok-num">0.5</span>), <span class="tok-comment">// gold metal</span>
        <span class="tok-fn">vec4</span>(-<span class="tok-num">0.25</span>, -<span class="tok-num">0.32</span>, -<span class="tok-num">0.55</span>, <span class="tok-num">0.18</span>), <span class="tok-comment">// chrome mirror</span>
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.35</span>, -<span class="tok-num">0.38</span>, -<span class="tok-num">0.5</span>, <span class="tok-num">0.12</span>), <span class="tok-comment">// small pink</span>
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
    };
    ubo.sphere_albedo = .{
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.55</span>, <span class="tok-num">0.5</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">2</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.2</span>, <span class="tok-num">0.55</span>, <span class="tok-num">0.6</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.8</span>, <span class="tok-num">0.6</span>, <span class="tok-num">0.2</span>, <span class="tok-num">1</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.8</span>, <span class="tok-num">0.8</span>, <span class="tok-num">0.85</span>, <span class="tok-num">1</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.85</span>, <span class="tok-num">0.4</span>, <span class="tok-num">0.45</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
    };
    ubo.sphere_extra = .{
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">1.5</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-comment">// glass IOR</span>
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.18</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), <span class="tok-comment">// gold fuzz</span>
        <span class="tok-fn">vec4</span>(<span class="tok-num">0.0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
        <span class="tok-fn">vec4</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>),
    };
    <span class="tok-kw">return</span> ubo;
}

<span class="tok-comment">// ---- Comptime corner: the SAME shaderMain, run by the Zig COMPILER ----------</span>
<span class="tok-comment">// `corner_samples` rays per pixel are path-traced AT COMPILE TIME and averaged;</span>
<span class="tok-comment">// the result is baked into the binary. Same scene/camera as the live halves.</span>
<span class="tok-kw">const</span> corner_image: [corner_rows * corner_cols]Color = blk: {
    <span class="tok-builtin">@setEvalBranchQuota</span>(<span class="tok-num">2_000_000_000</span>);
    <span class="tok-kw">const</span> base: shader_io.Ubo = <span class="tok-fn">buildUbo</span>(
        initial_yaw,
        initial_pitch,
        initial_dist,
        <span class="tok-num">0</span>,
        <span class="tok-builtin">@floatFromInt</span>(width),
        <span class="tok-builtin">@floatFromInt</span>(height),
    );
    <span class="tok-kw">var</span> img: [corner_rows * corner_cols]Color = undefined;
    <span class="tok-kw">var</span> py: usize = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (py &lt; corner_rows) : (py += <span class="tok-num">1</span>) {
        <span class="tok-kw">var</span> px: usize = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (px &lt; corner_cols) : (px += <span class="tok-num">1</span>) {
            <span class="tok-kw">var</span> acc: Vec = <span class="tok-builtin">@splat</span>(<span class="tok-num">0.0</span>);
            <span class="tok-kw">var</span> sidx: u32 = <span class="tok-num">0</span>;
            <span class="tok-kw">while</span> (sidx &lt; corner_samples) : (sidx += <span class="tok-num">1</span>) {
                <span class="tok-kw">var</span> ubo: shader_io.Ubo = base;
                ubo.frame_seed = <span class="tok-builtin">@floatFromInt</span>(sidx + <span class="tok-num">1</span>);
                <span class="tok-kw">const</span> io: shader.Io = .{
                    .frag_tex_coord = .{
                        (<span class="tok-fn">float</span>(px) + <span class="tok-num">0.5</span>) / <span class="tok-fn">float</span>(corner_cols),
                        <span class="tok-comment">// frag.y=1 is screen-TOP (unified CPU/GPU convention).</span>
                        <span class="tok-num">1.0</span> - (<span class="tok-fn">float</span>(py) + <span class="tok-num">0.5</span>) / <span class="tok-fn">float</span>(corner_rows),
                    },
                    .u = ubo,
                };
                acc += shader.<span class="tok-fn">shaderMain</span>(io).out_color;
            }
            <span class="tok-kw">const</span> inv: f32 = <span class="tok-num">1.0</span> / <span class="tok-fn">float</span>(corner_samples);
            img[py * corner_cols + px] = Color.<span class="tok-fn">fromFloats</span>(acc[<span class="tok-num">0</span>] * inv, acc[<span class="tok-num">1</span>] * inv, acc[<span class="tok-num">2</span>] * inv, <span class="tok-num">1.0</span>);
        }
    }
    <span class="tok-kw">break</span> :blk img;
};

<span class="tok-comment">/// Raw RGBA8 view of the corner - uploaded ONCE to a small texture and</span>
<span class="tok-comment">/// drawn as a single quad (the 960-rect grid this replaces was measurable</span>
<span class="tok-comment">/// per-frame cost; on the helmet's 2304-rect version it was 60-&gt;16 fps).</span>
<span class="tok-kw">const</span> corner_bytes: [corner_rows * corner_cols * <span class="tok-num">4</span>]u8 = blk: {
    <span class="tok-comment">// Zig 1245 forbids @bitCast from a struct; read Color fields directly.</span>
    <span class="tok-builtin">@setEvalBranchQuota</span>(corner_rows * corner_cols * <span class="tok-num">8</span> + <span class="tok-num">1000</span>);
    <span class="tok-kw">var</span> bytes: [corner_rows * corner_cols * <span class="tok-num">4</span>]u8 = undefined;
    <span class="tok-kw">for</span> (corner_image, <span class="tok-num">0</span>..) |c, i| {
        bytes[i * <span class="tok-num">4</span> + <span class="tok-num">0</span>] = c.r;
        bytes[i * <span class="tok-num">4</span> + <span class="tok-num">1</span>] = c.g;
        bytes[i * <span class="tok-num">4</span> + <span class="tok-num">2</span>] = c.b;
        bytes[i * <span class="tok-num">4</span> + <span class="tok-num">3</span>] = c.a;
    }
    <span class="tok-kw">break</span> :blk bytes;
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpu_shader: z.shader.<span class="tok-fn">LoadedShader</span>(shader_io),
    sw: z.raster.Context,
    sw_fb: z.CpuFramebuffer,
    ui_host: z.UiHost,
    gpa: Allocator,
    font: z.Font,
    frame: u32,
    cam: z.OrbitCamera,
    ui_wanted_mouse: bool,
    <span class="tok-comment">/// Splitter as a width FRACTION (rotation-stable); follows the pointer.</span>
    divider_frac: f32,
    last_mouse: Vec2,
    <span class="tok-comment">/// The comptime-baked corner, uploaded once at init.</span>
    corner_fb: z.CpuFramebuffer,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.gpu_shader.<span class="tok-fn">deinit</span>();
    s.sw.<span class="tok-fn">deinit</span>(gpa);
    s.sw_fb.<span class="tok-fn">deinit</span>();
    s.corner_fb.<span class="tok-fn">deinit</span>();
    s.ui_host.<span class="tok-fn">deinit</span>();
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> gpu_shader: z.shader.<span class="tok-fn">LoadedShader</span>(shader_io) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(trivial_vs_io, shader_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = trivial_vs_wgsl,
        .fs_wgsl_source = fs_wgsl,
        .label = <span class="tok-str">"rt_sbs_gpu"</span>,
    });
    <span class="tok-kw">var</span> sw: z.raster.Context = <span class="tok-kw">try</span> z.raster.Context.<span class="tok-fn">init</span>(gpa, <span class="tok-builtin">@intCast</span>(sw_w), <span class="tok-builtin">@intCast</span>(sw_h));
    <span class="tok-kw">const</span> sw_fb: z.CpuFramebuffer = z.CpuFramebuffer.<span class="tok-fn">init</span>(
        f.gpu.device,
        f.gpu.queue,
        sw_w,
        sw_h,
        sw.<span class="tok-fn">colorBufferBytes</span>(),
        <span class="tok-str">"rt_sbs_sw"</span>,
    );
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{
        .gpu_shader = gpu_shader,
        .sw = sw,
        .sw_fb = sw_fb,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font),
        .gpa = gpa,
        .font = font,
        .frame = <span class="tok-num">0</span>,
        .cam = blk: {
            <span class="tok-kw">var</span> c: z.OrbitCamera = z.OrbitCamera.<span class="tok-fn">init</span>(cam_target, initial_dist);
            c.yaw = initial_yaw;
            c.pitch = initial_pitch;
            <span class="tok-kw">break</span> :blk c;
        },
        .ui_wanted_mouse = false,
        .divider_frac = <span class="tok-num">0.5</span>,
        .last_mouse = .{ -<span class="tok-num">1</span>, -<span class="tok-num">1</span> },
        .corner_fb = z.CpuFramebuffer.<span class="tok-fn">init</span>(
            f.gpu.device,
            f.gpu.queue,
            corner_cols,
            corner_rows,
            &amp;corner_bytes,
            <span class="tok-str">"rt_sbs_corner"</span>,
        ),
    };
}

<span class="tok-comment">/// Keep the CPU half at a CONSTANT pixel budget shaped to the live canvas</span>
<span class="tok-comment">/// aspect (the helmet recipe, t1168): rotation never stretches the pixels</span>
<span class="tok-comment">/// and never changes the per-frame CPU cost.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">ensureCpuTarget</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> aspect: f32 = vw / vh;
    <span class="tok-kw">const</span> want_w: i32 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@max</span>(<span class="tok-builtin">@round</span>(<span class="tok-builtin">@sqrt</span>(cpu_pixel_budget * aspect)), <span class="tok-num">16</span>));
    <span class="tok-kw">const</span> want_h: i32 = <span class="tok-builtin">@trunc</span>(<span class="tok-builtin">@max</span>(<span class="tok-builtin">@round</span>(<span class="tok-fn">float</span>(want_w) / aspect), <span class="tok-num">16</span>));
    <span class="tok-kw">const</span> dims: Vec2i = s.sw.<span class="tok-fn">colorBufferDims</span>();
    <span class="tok-kw">if</span> (dims[<span class="tok-num">0</span>] != want_w <span class="tok-kw">or</span> dims[<span class="tok-num">1</span>] != want_h) {
        s.sw.<span class="tok-fn">resize</span>(s.gpa, want_w, want_h) <span class="tok-kw">catch</span> <span class="tok-kw">return</span>;
        s.sw_fb.<span class="tok-fn">resize</span>(f.gl, <span class="tok-builtin">@intCast</span>(want_w), <span class="tok-builtin">@intCast</span>(want_h), s.sw.<span class="tok-fn">colorBufferBytes</span>(), <span class="tok-str">"sbs_sw"</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    s.frame +%= <span class="tok-num">1</span>;
    <span class="tok-fn">ensureCpuTarget</span>(f, s);
    <span class="tok-kw">const</span> vw: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> vh: f32 = f.window.<span class="tok-fn">heightf</span>();

    <span class="tok-comment">// The one call that replaces this example's hand-rolled orbit/pinch/wheel</span>
    <span class="tok-comment">// handler. It reads touch + mouse, skips the first drag frame (no pop), and</span>
    <span class="tok-comment">// clamps distance/pitch. Gated on last frame's wantCaptureMouse (the windows</span>
    <span class="tok-comment">// must be submitted first, which happens below) - one frame of latency is</span>
    <span class="tok-comment">// fine, and OrbitCamera's own first-frame skip covers the resume.</span>
    _ = s.cam.<span class="tok-fn">update</span>(f, s.ui_wanted_mouse, orbit_opts);

    <span class="tok-comment">// The shared scene UBO - both halves read it, so they render the same view.</span>
    <span class="tok-comment">// frame_seed varies per frame: the noise "dances" as it path-traces live.</span>
    <span class="tok-kw">const</span> ubo: shader_io.Ubo = <span class="tok-fn">buildUbo</span>(s.cam.yaw, s.cam.pitch, s.cam.distance, <span class="tok-fn">float</span>(s.frame), vw, vh);

    <span class="tok-comment">// ---- CPU side: dispatch the SAME shaderMain per pixel into raster ---------</span>
    s.sw.<span class="tok-fn">clearColor</span>(.{ .r = <span class="tok-num">8</span>, .g = <span class="tok-num">8</span>, .b = <span class="tok-num">14</span>, .a = <span class="tok-num">255</span> });
    s.sw.<span class="tok-fn">clear</span>(.{ .color = true });
    <span class="tok-kw">const</span> sw_dims: Vec2i = s.sw.<span class="tok-fn">colorBufferDims</span>();
    <span class="tok-kw">const</span> base_io: shader.Io = .{ .frag_tex_coord = undefined, .u = ubo };
    z.raster_shader.<span class="tok-fn">dispatchFragmentShader</span>(&amp;s.sw, shader, base_io, .{
        .x = <span class="tok-num">0</span>,
        .y = <span class="tok-num">0</span>,
        .w = <span class="tok-builtin">@intCast</span>(sw_dims[<span class="tok-num">0</span>]),
        .h = <span class="tok-builtin">@intCast</span>(sw_dims[<span class="tok-num">1</span>]),
    });
    s.sw_fb.<span class="tok-fn">update</span>(f.gpu.queue, s.sw.<span class="tok-fn">colorBufferBytes</span>());

    <span class="tok-comment">// ---- GPU side: the SAME shaderMain as a full-res fullscreen pass --------</span>
    s.gpu_shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, ubo);
    z.<span class="tok-fn">bindFullscreenShader</span>(f.gl, shader_io, &amp;s.gpu_shader);
    z.<span class="tok-fn">drawFullscreenTriangle</span>(f.gl);
    f.gl.<span class="tok-fn">flushBeforeMaterialSwap</span>();

    <span class="tok-comment">// ---- Composite: software (CPU) over the LEFT of the splitter.  The</span>
    <span class="tok-comment">//      divider is a width FRACTION (rotation-stable) that follows the</span>
    <span class="tok-comment">//      pointer - helmet mechanics (t1168) - except while the UI owns</span>
    <span class="tok-comment">//      the mouse (dragging the panel must not sweep the split).</span>
    <span class="tok-kw">const</span> m: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> is_first_zero: bool = s.last_mouse[<span class="tok-num">0</span>] &lt; <span class="tok-num">0</span> <span class="tok-kw">and</span> m[<span class="tok-num">0</span>] == <span class="tok-num">0</span> <span class="tok-kw">and</span> m[<span class="tok-num">1</span>] == <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (!s.ui_wanted_mouse <span class="tok-kw">and</span> !is_first_zero <span class="tok-kw">and</span> (m[<span class="tok-num">0</span>] != s.last_mouse[<span class="tok-num">0</span>] <span class="tok-kw">or</span> m[<span class="tok-num">1</span>] != s.last_mouse[<span class="tok-num">1</span>])) {
        s.last_mouse = m;
        s.divider_frac = <span class="tok-fn">clamp</span>(m[<span class="tok-num">0</span>] / vw, <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>);
    }
    <span class="tok-kw">const</span> divider_x: f32 = s.divider_frac * vw;
    z.<span class="tok-fn">beginScissorMode</span>(f.gl, <span class="tok-num">0</span>, <span class="tok-num">0</span>, divider_x, vh);
    s.sw_fb.<span class="tok-fn">present</span>(f.gl, <span class="tok-num">0</span>, <span class="tok-num">0</span>, vw, vh);
    z.<span class="tok-fn">endScissorMode</span>(f.gl);
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = divider_x - <span class="tok-num">1.5</span>, .y = <span class="tok-num">0</span>, .width = <span class="tok-num">3</span>, .height = vh },
        .{ .color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> } },
    );

    <span class="tok-comment">// ---- UI panel -----------------------------------------------------------</span>
    <span class="tok-kw">const</span> ui: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">if</span> (ui.<span class="tok-fn">window</span>(<span class="tok-str">"Ray tracer"</span>, .{ .initial_pos = .{ panel_x, panel_y }, .initial_size = .{ panel_w, panel_h } })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        ui.<span class="tok-fn">text</span>(<span class="tok-str">"3 targets, ONE shader:"</span>, .{});
        ui.<span class="tok-fn">text</span>(<span class="tok-str">"CPU | GPU | comptime"</span>, .{});
        ui.<span class="tok-fn">text</span>(<span class="tok-str">"drag: orbit, wheel: zoom"</span>, .{});
    }
    <span class="tok-comment">// Windows are submitted now, so wantCaptureMouse is valid - stash it for</span>
    <span class="tok-comment">// next frame's scene-input gate (hovering a window OR an active drag).</span>
    s.ui_wanted_mouse = ui.<span class="tok-fn">wantCaptureMouse</span>();
    s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-comment">// ---- Labels + comptime corner inset (bottom-right): the third target ----</span>
    f.gl.<span class="tok-fn">text</span>(
        .{ <span class="tok-num">16</span>, <span class="tok-num">14</span> },
        <span class="tok-str">"CPU rt_fs"</span>,
        .{ .size = <span class="tok-num">22</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
    f.gl.<span class="tok-fn">text</span>(
        .{ vw - <span class="tok-num">112</span>, <span class="tok-num">14</span> },
        <span class="tok-str">"GPU rt_fs"</span>,
        .{ .size = <span class="tok-num">22</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
    <span class="tok-kw">const</span> inset_w: f32 = <span class="tok-fn">clamp</span>(<span class="tok-builtin">@min</span>(vw, vh) * <span class="tok-num">0.30</span>, <span class="tok-num">84</span>, <span class="tok-num">200</span>);
    <span class="tok-kw">const</span> inset_h: f32 = inset_w * <span class="tok-fn">float</span>(corner_rows) / <span class="tok-fn">float</span>(corner_cols);
    <span class="tok-kw">const</span> ix: f32 = vw - inset_w - <span class="tok-num">12</span>;
    <span class="tok-kw">const</span> iy: f32 = vh - inset_h - <span class="tok-num">12</span>;
    s.corner_fb.<span class="tok-fn">present</span>(f.gl, ix, iy, inset_w, inset_h);
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = ix - <span class="tok-num">1</span>, .y = iy - <span class="tok-num">1</span>, .width = inset_w + <span class="tok-num">2</span>, .height = inset_h + <span class="tok-num">2</span> },
        .{ .color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> }, .outline = <span class="tok-num">1.0</span> },
    );
    f.gl.<span class="tok-fn">text</span>(
        .{ ix, iy - <span class="tok-num">22</span> },
        <span class="tok-str">"comptime rt_fs"</span>,
        .{ .size = <span class="tok-num">16</span>, .color = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">245</span>, .a = <span class="tok-num">255</span> }, .font = &amp;s.font },
    );
}

<figure class="code src-file" data-path="examples/rt_fs.zig" data-lines="249"><figcaption><span>examples/rt_fs.zig</span><span>249 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/rt_fs.zig - a ray-tracing FRAGMENT SHADER.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! One `shaderMain(io) Out` that path-traces the Ubo's sphere scene for the</span>
<span class="tok-comment">//! pixel at `frag_tex_coord`. Compiles three ways (the zimr shader contract):</span>
<span class="tok-comment">//! to WGSL (GPU), to native Zig (raster software dispatcher), and to SPIR-V - so</span>
<span class="tok-comment">//! the SAME shader can drive both halves of a CPU|GPU side-by-side demo.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Constraints that shape the code (SPIR-V / WGSL safe):</span>
<span class="tok-comment">//!   - NO recursion -&gt; the bounce trace is an explicit bounded loop with an</span>
<span class="tok-comment">//!     accumulated attenuation + a running ray.</span>
<span class="tok-comment">//!   - NO dynamic allocation, no pointers into the scene -&gt; spheres come from</span>
<span class="tok-comment">//!     the Ubo's fixed array; the hit search is a bounded loop.</span>
<span class="tok-comment">//!   - A cheap per-pixel PRNG (PCG-ish hash) seeded from pixel coord +</span>
<span class="tok-comment">//!     u.frame_seed gives the diffuse scatter / metal fuzz / dielectric jitter.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> dot3 = zm.dot3;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> int = zm.int;
<span class="tok-kw">const</span> lengthSq3 = zm.lengthSq3;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> pow = zm.pow;
<span class="tok-kw">const</span> reflect3 = zm.reflect3;
<span class="tok-kw">const</span> safeNormalize3 = zm.safeNormalize3;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> vec4 = zm.vec4;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"rt_fs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"rt_fs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_io.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">const</span> max_bounces: u32 = <span class="tok-num">8</span>;
<span class="tok-kw">const</span> max_spheres: u32 = shader_io.max_spheres;

<span class="tok-comment">// ---- tiny PRNG: pure functions threading a u32 state by VALUE ---------------</span>
<span class="tok-comment">// No `*Rng` methods / pointer params: the SPIR-V-&gt;WGSL translator can't lower</span>
<span class="tok-comment">// calls that pass a pointer to a by-value param (out-params are lost). So the</span>
<span class="tok-comment">// RNG is functional - each call takes the state and returns the next state;</span>
<span class="tok-comment">// `randF` also returns a float. Keeps the shader translatable AND identical on</span>
<span class="tok-comment">// the CPU dispatcher.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">hashU32</span>(x_in: u32) u32 {
    <span class="tok-kw">var</span> x: u32 = x_in;
    x ^= x &gt;&gt; <span class="tok-num">16</span>;
    x = x *% <span class="tok-num">0x7feb352d</span>;
    x ^= x &gt;&gt; <span class="tok-num">15</span>;
    x = x *% <span class="tok-num">0x846ca68b</span>;
    x ^= x &gt;&gt; <span class="tok-num">16</span>;
    <span class="tok-kw">return</span> x;
}

<span class="tok-comment">/// Advance the state; the new state is also the raw random bits.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">rngNext</span>(state: u32) u32 {
    <span class="tok-kw">return</span> <span class="tok-fn">hashU32</span>(state);
}

<span class="tok-comment">/// A float in [0,1) from a state word (top 24 bits).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">stateToF</span>(state: u32) f32 {
    <span class="tok-kw">return</span> <span class="tok-fn">float</span>(state &gt;&gt; <span class="tok-num">8</span>) * (<span class="tok-num">1.0</span> / <span class="tok-num">16777216.0</span>);
}

<span class="tok-comment">/// A random unit vector from a state word that has ALREADY been advanced twice</span>
<span class="tok-comment">/// by the caller (s0, s1). No struct return (the translator names struct temps</span>
<span class="tok-comment">/// `result`, which collide when inlined); the caller threads the two states.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">unitVecFrom</span>(s0: u32, s1: u32) Vec {
    <span class="tok-kw">const</span> z_: f32 = <span class="tok-fn">stateToF</span>(s0) * <span class="tok-num">2.0</span> - <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> a: f32 = <span class="tok-fn">stateToF</span>(s1) * <span class="tok-num">2.0</span> * pi;
    <span class="tok-kw">const</span> r: f32 = <span class="tok-builtin">@sqrt</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, <span class="tok-num">1.0</span> - z_ * z_));
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(r * <span class="tok-builtin">@cos</span>(a), r * <span class="tok-builtin">@sin</span>(a), z_);
}

<span class="tok-comment">// ---- ray/sphere intersection ------------------------------------------------</span>
<span class="tok-comment">// Returns t of the nearest hit in (t_min, t_max), or -1 if none.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">hitSphere</span>(
    center: Vec,
    radius: f32,
    ro: Vec,
    rd: Vec,
    t_min: f32,
    t_max: f32,
) f32 {
    <span class="tok-kw">const</span> oc: Vec = center - ro;
    <span class="tok-kw">const</span> a: f32 = <span class="tok-fn">dot3</span>(rd, rd);
    <span class="tok-kw">const</span> h: f32 = <span class="tok-fn">dot3</span>(oc, rd);
    <span class="tok-kw">const</span> c: f32 = <span class="tok-fn">dot3</span>(oc, oc) - radius * radius;
    <span class="tok-kw">const</span> disc: f32 = h * h - a * c;
    <span class="tok-kw">if</span> (disc &lt; <span class="tok-num">0.0</span>) {
        <span class="tok-kw">return</span> -<span class="tok-num">1.0</span>;
    }
    <span class="tok-kw">const</span> sq: f32 = <span class="tok-builtin">@sqrt</span>(disc);
    <span class="tok-kw">var</span> root: f32 = (h - sq) / a;
    <span class="tok-kw">if</span> (root &lt;= t_min <span class="tok-kw">or</span> root &gt;= t_max) {
        root = (h + sq) / a;
        <span class="tok-kw">if</span> (root &lt;= t_min <span class="tok-kw">or</span> root &gt;= t_max) {
            <span class="tok-kw">return</span> -<span class="tok-num">1.0</span>;
        }
    }
    <span class="tok-kw">return</span> root;
}

<span class="tok-kw">fn</span> <span class="tok-fn">skyColor</span>(rd: Vec) Vec {
    <span class="tok-kw">const</span> unit: Vec = <span class="tok-fn">safeNormalize3</span>(rd, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> t: f32 = <span class="tok-num">0.5</span> * (unit[<span class="tok-num">1</span>] + <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> white: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> blue: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0.5</span>, <span class="tok-num">0.7</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">return</span> white * <span class="tok-fn">splat</span>(<span class="tok-num">1.0</span> - t) + blue * <span class="tok-fn">splat</span>(t);
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-comment">// Pixel coordinate (integer-ish) for the RNG seed.</span>
    <span class="tok-kw">const</span> px: f32 = io_in.frag_tex_coord[<span class="tok-num">0</span>] * io_in.u.resolution[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> py: f32 = io_in.frag_tex_coord[<span class="tok-num">1</span>] * io_in.u.resolution[<span class="tok-num">1</span>];
    <span class="tok-kw">const</span> seed: u32 = (<span class="tok-fn">int</span>(u32, px) *% <span class="tok-num">1973</span>) ^
        (<span class="tok-fn">int</span>(u32, py) *% <span class="tok-num">9277</span>) ^
        (<span class="tok-fn">int</span>(u32, io_in.u.frame_seed) *% <span class="tok-num">26699</span>);
    <span class="tok-kw">var</span> rng_state: u32 = <span class="tok-fn">hashU32</span>(seed | <span class="tok-num">1</span>);

    <span class="tok-comment">// Primary ray through this pixel (+ a sub-pixel jitter for AA over frames).</span>
    rng_state = <span class="tok-fn">rngNext</span>(rng_state);
    <span class="tok-kw">const</span> jx: f32 = <span class="tok-fn">stateToF</span>(rng_state) - <span class="tok-num">0.5</span>;
    rng_state = <span class="tok-fn">rngNext</span>(rng_state);
    <span class="tok-kw">const</span> jy: f32 = <span class="tok-fn">stateToF</span>(rng_state) - <span class="tok-num">0.5</span>;
    <span class="tok-kw">const</span> ro0: Vec = io_in.u.cam_origin;
    <span class="tok-kw">const</span> pixel_center: Vec = io_in.u.px00 +
        io_in.u.pdu * <span class="tok-fn">splat</span>(px + jx) +
        io_in.u.pdv * <span class="tok-fn">splat</span>(py + jy);
    <span class="tok-kw">var</span> ro: Vec = ro0;
    <span class="tok-kw">var</span> rd: Vec = <span class="tok-fn">safeNormalize3</span>(pixel_center - ro0, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">1</span>));

    <span class="tok-kw">var</span> attenuation: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    <span class="tok-kw">var</span> color: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0.0</span>, <span class="tok-num">0.0</span>, <span class="tok-num">0.0</span>);

    <span class="tok-kw">const</span> count: u32 = <span class="tok-builtin">@trunc</span>(io_in.u.sphere_count);

    <span class="tok-kw">var</span> bounce: u32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (bounce &lt; max_bounces) : (bounce += <span class="tok-num">1</span>) {
        <span class="tok-comment">// Find nearest sphere hit.</span>
        <span class="tok-kw">var</span> best_t: f32 = <span class="tok-num">1.0e30</span>;
        <span class="tok-kw">const</span> NO_HIT: u32 = <span class="tok-num">0xffffffff</span>;
        <span class="tok-kw">var</span> hit_i: u32 = NO_HIT;
        <span class="tok-kw">var</span> i: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (i &lt; max_spheres) : (i += <span class="tok-num">1</span>) {
            <span class="tok-kw">if</span> (i &gt;= count) {
                <span class="tok-kw">break</span>;
            }
            <span class="tok-kw">const</span> geom: Vec = io_in.u.sphere_geom[i];
            <span class="tok-kw">const</span> radius: f32 = geom[<span class="tok-num">3</span>];
            <span class="tok-kw">if</span> (radius &lt;= <span class="tok-num">0.0</span>) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> center: Vec = <span class="tok-fn">vec</span>(geom[<span class="tok-num">0</span>], geom[<span class="tok-num">1</span>], geom[<span class="tok-num">2</span>]);
            <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">hitSphere</span>(center, radius, ro, rd, <span class="tok-num">0.001</span>, best_t);
            <span class="tok-kw">if</span> (t &gt; <span class="tok-num">0.0</span>) {
                best_t = t;
                hit_i = i;
            }
        }

        <span class="tok-kw">if</span> (hit_i == NO_HIT) {
            <span class="tok-comment">// Miss -&gt; sky, modulated by attenuation so far.</span>
            color = color + attenuation * <span class="tok-fn">skyColor</span>(rd);
            <span class="tok-kw">break</span>;
        }

        <span class="tok-kw">const</span> hi: u32 = hit_i;
        <span class="tok-kw">const</span> geom: Vec = io_in.u.sphere_geom[hi];
        <span class="tok-kw">const</span> center: Vec = <span class="tok-fn">vec</span>(geom[<span class="tok-num">0</span>], geom[<span class="tok-num">1</span>], geom[<span class="tok-num">2</span>]);
        <span class="tok-kw">const</span> radius: f32 = geom[<span class="tok-num">3</span>];
        <span class="tok-kw">const</span> point: Vec = ro + rd * <span class="tok-fn">splat</span>(best_t);
        <span class="tok-kw">var</span> normal: Vec = (point - center) * <span class="tok-fn">splat</span>(<span class="tok-num">1.0</span> / radius);
        <span class="tok-kw">const</span> front_face: bool = <span class="tok-fn">dot3</span>(rd, normal) &lt; <span class="tok-num">0.0</span>;
        <span class="tok-kw">if</span> (!front_face) {
            normal = -normal;
        }
        <span class="tok-kw">const</span> am: Vec = io_in.u.sphere_albedo[hi];
        <span class="tok-kw">const</span> albedo: Vec = <span class="tok-fn">vec</span>(am[<span class="tok-num">0</span>], am[<span class="tok-num">1</span>], am[<span class="tok-num">2</span>]);
        <span class="tok-kw">const</span> mat: f32 = am[<span class="tok-num">3</span>];
        <span class="tok-kw">const</span> param: f32 = io_in.u.sphere_extra[hi][<span class="tok-num">0</span>];

        <span class="tok-kw">if</span> (mat &lt; <span class="tok-num">0.5</span>) {
            <span class="tok-comment">// Lambertian: scatter around the normal.</span>
            <span class="tok-kw">const</span> s0: u32 = <span class="tok-fn">rngNext</span>(rng_state);
            <span class="tok-kw">const</span> s1: u32 = <span class="tok-fn">rngNext</span>(s0);
            rng_state = s1;
            <span class="tok-kw">var</span> dir: Vec = normal + <span class="tok-fn">unitVecFrom</span>(s0, s1);
            <span class="tok-kw">if</span> (<span class="tok-fn">lengthSq3</span>(dir) &lt; <span class="tok-num">1.0e-6</span>) {
                dir = normal;
            }
            ro = point;
            rd = <span class="tok-fn">safeNormalize3</span>(dir, normal);
            attenuation = attenuation * albedo;
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (mat &lt; <span class="tok-num">1.5</span>) {
            <span class="tok-comment">// Metal: reflect with fuzz.</span>
            <span class="tok-kw">const</span> refl: Vec = <span class="tok-fn">reflect3</span>(<span class="tok-fn">safeNormalize3</span>(rd, normal), normal);
            <span class="tok-kw">const</span> m0: u32 = <span class="tok-fn">rngNext</span>(rng_state);
            <span class="tok-kw">const</span> m1: u32 = <span class="tok-fn">rngNext</span>(m0);
            rng_state = m1;
            <span class="tok-kw">const</span> fuzzed: Vec = refl + <span class="tok-fn">unitVecFrom</span>(m0, m1) * <span class="tok-fn">splat</span>(param);
            ro = point;
            rd = <span class="tok-fn">safeNormalize3</span>(fuzzed, normal);
            attenuation = attenuation * albedo;
            <span class="tok-kw">if</span> (<span class="tok-fn">dot3</span>(rd, normal) &lt;= <span class="tok-num">0.0</span>) {
                <span class="tok-comment">// Absorbed (scattered below surface).</span>
                <span class="tok-kw">break</span>;
            }
        } <span class="tok-kw">else</span> {
            <span class="tok-comment">// Dielectric: refract or reflect (Schlick).</span>
            <span class="tok-kw">const</span> ior: f32 = param;
            <span class="tok-kw">const</span> ratio: f32 = <span class="tok-kw">if</span> (front_face) (<span class="tok-num">1.0</span> / ior) <span class="tok-kw">else</span> ior;
            <span class="tok-kw">const</span> unit_dir: Vec = <span class="tok-fn">safeNormalize3</span>(rd, normal);
            <span class="tok-kw">const</span> cos_theta: f32 = <span class="tok-builtin">@min</span>(<span class="tok-fn">dot3</span>(-unit_dir, normal), <span class="tok-num">1.0</span>);
            <span class="tok-kw">const</span> sin_theta: f32 = <span class="tok-builtin">@sqrt</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, <span class="tok-num">1.0</span> - cos_theta * cos_theta));
            <span class="tok-comment">// Schlick reflectance.</span>
            <span class="tok-kw">var</span> r0: f32 = (<span class="tok-num">1.0</span> - ratio) / (<span class="tok-num">1.0</span> + ratio);
            r0 = r0 * r0;
            <span class="tok-kw">const</span> reflectance: f32 = r0 + (<span class="tok-num">1.0</span> - r0) * <span class="tok-fn">pow</span>(<span class="tok-num">1.0</span> - cos_theta, <span class="tok-num">5.0</span>);
            <span class="tok-kw">var</span> new_dir: Vec = undefined;
            rng_state = <span class="tok-fn">rngNext</span>(rng_state);
            <span class="tok-kw">if</span> (ratio * sin_theta &gt; <span class="tok-num">1.0</span> <span class="tok-kw">or</span> reflectance &gt; <span class="tok-fn">stateToF</span>(rng_state)) {
                new_dir = <span class="tok-fn">reflect3</span>(unit_dir, normal);
            } <span class="tok-kw">else</span> {
                <span class="tok-comment">// Refract (Snell).</span>
                <span class="tok-kw">const</span> perp: Vec = (unit_dir + normal * <span class="tok-fn">splat</span>(cos_theta)) * <span class="tok-fn">splat</span>(ratio);
                <span class="tok-kw">const</span> parallel: Vec = normal * <span class="tok-fn">splat</span>(-<span class="tok-builtin">@sqrt</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, <span class="tok-num">1.0</span> - <span class="tok-fn">lengthSq3</span>(perp))));
                new_dir = perp + parallel;
            }
            ro = point;
            rd = <span class="tok-fn">safeNormalize3</span>(new_dir, normal);
            <span class="tok-comment">// glass doesn't tint (attenuation unchanged)</span>
        }
    }

    <span class="tok-comment">// Gamma (sqrt) + clamp to [0,1]. Inline the clamp as min(max(..)) rather</span>
    <span class="tok-comment">// than zm.clamp: clamp's inlined `result` temp collides across the 3 calls</span>
    <span class="tok-comment">// in the WGSL emitter (a translator name-uniquing gap; tracked separately).</span>
    <span class="tok-kw">const</span> cr: f32 = <span class="tok-builtin">@min</span>(<span class="tok-builtin">@max</span>(<span class="tok-builtin">@sqrt</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, color[<span class="tok-num">0</span>])), <span class="tok-num">0.0</span>), <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> cg: f32 = <span class="tok-builtin">@min</span>(<span class="tok-builtin">@max</span>(<span class="tok-builtin">@sqrt</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, color[<span class="tok-num">1</span>])), <span class="tok-num">0.0</span>), <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> cb: f32 = <span class="tok-builtin">@min</span>(<span class="tok-builtin">@max</span>(<span class="tok-builtin">@sqrt</span>(<span class="tok-builtin">@max</span>(<span class="tok-num">0.0</span>, color[<span class="tok-num">2</span>])), <span class="tok-num">0.0</span>), <span class="tok-num">1.0</span>);
    out.out_color = <span class="tok-fn">vec4</span>(cr, cg, cb, <span class="tok-num">1.0</span>);
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
</code></pre></figure>
<figure class="code src-file" data-path="examples/rt_fs_io.zig" data-lines="48"><figcaption><span>examples/rt_fs_io.zig</span><span>48 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/rt_fs_io.zig - schema for the ray-tracing fragment shader.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Declares Inputs / Outputs / Ubo. The SAME `shaderMain` (rt_fs.zig) compiles</span>
<span class="tok-comment">//! to WGSL for the GPU and to native Zig for the raster software dispatcher, so a</span>
<span class="tok-comment">//! side-by-side demo can run one shader on both backends. Everything the trace</span>
<span class="tok-comment">//! needs - camera basis + the sphere scene - lives in the Ubo (fixed-size</span>
<span class="tok-comment">//! arrays, which both WGSL and the raster dispatcher handle).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Materials are encoded compactly: each sphere carries an albedo (rgb), a</span>
<span class="tok-comment">//! radius, a center, and a `mat` scalar selecting lambertian (0) / metal (1) /</span>
<span class="tok-comment">//! dielectric (2), plus a `param` (metal fuzz, or dielectric IOR).</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Inputs = <span class="tok-kw">struct</span> {
    frag_tex_coord: Vec2,
};

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Outputs = <span class="tok-kw">struct</span> {
    out_color: Vec,
};

<span class="tok-comment">/// Max spheres the shader iterates. Fixed (UBO arrays are fixed-size); unused</span>
<span class="tok-comment">/// slots have radius 0 and are skipped.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> max_spheres: u32 = <span class="tok-num">8</span>;

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Ubo = <span class="tok-kw">struct</span> {
    <span class="tok-comment">// Camera basis (precomputed host-side; the shader just rebuilds rays).</span>
    cam_origin: Vec, <span class="tok-comment">// xyz eye, w unused</span>
    px00: Vec, <span class="tok-comment">// center of the top-left pixel (world)</span>
    pdu: Vec, <span class="tok-comment">// one pixel right (world)</span>
    pdv: Vec, <span class="tok-comment">// one pixel down (world)</span>

    resolution: Vec2, <span class="tok-comment">// render target px (x,y)</span>
    frame_seed: f32, <span class="tok-comment">// changes per frame to vary sampling</span>
    sphere_count: f32, <span class="tok-comment">// active spheres (&lt;= max_spheres)</span>

    <span class="tok-comment">// Scene as FLAT vec4 arrays (the shader codegen supports [N]@Vector(4,f32)</span>
    <span class="tok-comment">// but NOT [N]struct). Per sphere i:</span>
    <span class="tok-comment">//   sphere_geom[i]   = (cx, cy, cz, radius)</span>
    <span class="tok-comment">//   sphere_albedo[i] = (r, g, b, material)  material: 0 lambert,1 metal,2 glass</span>
    <span class="tok-comment">//   sphere_extra[i]  = (param, _, _, _)     param: metal fuzz or dielectric IOR</span>
    sphere_geom: [max_spheres]Vec,
    sphere_albedo: [max_spheres]Vec,
    sphere_extra: [max_spheres]Vec,
};
</code></pre></figure>
<figure class="code src-file" data-path="examples/trivial_vs.zig" data-lines="34"><figcaption><span>examples/trivial_vs.zig</span><span>34 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/trivial_vs.zig - minimal vertex shader for the</span>
<span class="tok-comment">//! wgpu_bringup's Phase D1 validation.  Pass-through: caller pushes</span>
<span class="tok-comment">//! clip-space positions; VS forwards them with w=1.  UV varies to</span>
<span class="tok-comment">//! the FS unchanged.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Schema: `trivial_vs_io.zig`.  No Ubo, no Samplers.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> vec4 = zm.vec4;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"trivial_vs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"trivial_vs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(void);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">comptime</span> {
    _ = shader_io;
}

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;
    out.position = <span class="tok-fn">vec4</span>(
        io_in.vertex_position[<span class="tok-num">0</span>],
        io_in.vertex_position[<span class="tok-num">1</span>],
        <span class="tok-num">0.0</span>,
        <span class="tok-num">1.0</span>,
    );
    out.frag_tex_coord = io_in.vertex_tex_coord;
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}
</code></pre></figure>
<figure class="code src-file" data-path="examples/trivial_vs_io.zig" data-lines="23"><figcaption><span>examples/trivial_vs_io.zig</span><span>23 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/trivial_vs_io.zig - schema for the trivial VS used</span>
<span class="tok-comment">//! by the wgpu_bringup to validate Phase D1 (loadShader) end-to-end.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! No Ubo, no Samplers - purest possible shape.  Vertex positions</span>
<span class="tok-comment">//! arrive already in clip space (-1..+1); the VS passes them through.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> shader = <span class="tok-builtin">@import</span>(<span class="tok-str">"shader_interface"</span>);

<span class="tok-comment">/// Vertex attributes - matches the Vertex2D layout that loadShader</span>
<span class="tok-comment">/// hardcodes: pos: vec2 at location 0, uv: vec2 at location 1.</span>
<span class="tok-comment">/// The color attribute at location 2 is part of the layout (so the</span>
<span class="tok-comment">/// vertex buffer stride matches) but not consumed by this VS.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Attributes = <span class="tok-kw">struct</span> {
    vertex_position: shader.<span class="tok-fn">Attr</span>(.vec2, <span class="tok-num">0</span>),
    vertex_tex_coord: shader.<span class="tok-fn">Attr</span>(.vec2, <span class="tok-num">1</span>),
};

<span class="tok-comment">/// Pass-through outputs.  frag_tex_coord becomes a varying to the FS.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Outputs = <span class="tok-kw">struct</span> {
    frag_tex_coord: Vec2,
};
</code></pre></figure>
