<h1>pipeline_uniforms</h1>
<figure class="code src-file" data-path="examples/pipeline_uniforms/pipeline_uniforms.zig" data-lines="130"><figcaption><span>examples/pipeline_uniforms/pipeline_uniforms.zig</span><span>130 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! pipeline_uniforms - a custom render pipeline driven by a VERTEX-STAGE</span>
<span class="tok-comment">//! uniform buffer. The UBO holds a 4x4 transform the app rewrites every frame,</span>
<span class="tok-comment">//! so the triangle spins and stays aspect-correct (the matrix replaces the</span>
<span class="tok-comment">//! hand vertex-rewrite the basic example used).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! No hand-written WGSL: the shaders are authored in Zig</span>
<span class="tok-comment">//! (`pipeline_uniforms_vs.zig` / `_fs.zig` + typed `_io.zig` schemas) and the</span>
<span class="tok-comment">//! build transpiles them. What's new vs pipeline_basic:</span>
<span class="tok-comment">//!   - a `Ubo` in the VERTEX schema. Because it's vertex-stage, the codegen</span>
<span class="tok-comment">//!     binds it at @group(0) and `z.shader.loadShaderVF` routes it there for</span>
<span class="tok-comment">//!     us - the app just calls `s.shader.pushUbo(...)` each frame.</span>
<span class="tok-comment">//!   - the vertex layout is DERIVED from the schema (`z.shader.vertexLayout`).</span>
<span class="tok-comment">//!   - drawing goes THROUGH the shader handle (`bindForDraw`/`setVertex`/`draw`).</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Still composes with the immediate-mode caption, and still depthless.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Build:  zig build wgpu-pipeline-uniforms</span>
<span class="tok-comment">//! Device: zig build wgpu-pipeline-uniforms-standalone -Dmode=release</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> rotationZ = zm.rotationZ;
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-comment">// Build-generated WGSL artifacts + their typed schemas. The app never writes</span>
<span class="tok-comment">// WGSL - these are machine output of the Zig shader pipeline.</span>
<span class="tok-kw">const</span> vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pipeline_uniforms_vs.wgsl"</span>);
<span class="tok-kw">const</span> fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"pipeline_uniforms_fs.wgsl"</span>);
<span class="tok-kw">const</span> vs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_vs_io.zig"</span>);
<span class="tok-kw">const</span> fs_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_fs_io.zig"</span>);

<span class="tok-kw">const</span> Vertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    x: f32,
    y: f32,
    r: f32,
    g: f32,
    b: f32,
};

<span class="tok-kw">const</span> vertices = [_]Vertex{
    .{ .x = <span class="tok-num">0.0</span>, .y = <span class="tok-num">0.65</span>, .r = <span class="tok-num">1.0</span>, .g = <span class="tok-num">0.2</span>, .b = <span class="tok-num">0.2</span> },
    .{ .x = -<span class="tok-num">0.65</span>, .y = -<span class="tok-num">0.55</span>, .r = <span class="tok-num">0.2</span>, .g = <span class="tok-num">1.0</span>, .b = <span class="tok-num">0.3</span> },
    .{ .x = <span class="tok-num">0.65</span>, .y = -<span class="tok-num">0.55</span>, .r = <span class="tok-num">0.3</span>, .g = <span class="tok-num">0.4</span>, .b = <span class="tok-num">1.0</span> },
};

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io),
    vbo: z.wgpu.BufferHandle,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    s.shader.<span class="tok-fn">deinit</span>();
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
}

<span class="tok-comment">/// transform = scale(sx, sy) * rotateZ(angle), in zm row convention so</span>
<span class="tok-comment">/// `mulMatPoint` in the shader matches WGSL `m * vec4(p, 1)`. Rotating first</span>
<span class="tok-comment">/// then aspect-scaling keeps the triangle equilateral on any window shape.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">transform2d</span>(angle: f32, sx: f32, sy: f32) zm.Mat {
    <span class="tok-kw">return</span> <span class="tok-fn">mulMat</span>(<span class="tok-fn">scaling</span>(sx, sy, <span class="tok-num">1.0</span>), <span class="tok-fn">rotationZ</span>(angle));
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(vertices)),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"tri_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;vertices));

    <span class="tok-comment">// The pipeline, UBO buffer + bind group, and the @group(0) routing are all</span>
    <span class="tok-comment">// derived from the typed schemas - no bind-group boilerplate in the app.</span>
    <span class="tok-kw">const</span> shader: z.shader.<span class="tok-fn">LoadedShader</span>(vs_io) = <span class="tok-kw">try</span> z.shader.<span class="tok-fn">loadShaderVF</span>(vs_io, fs_io, .{
        .f = f.gpu,
        .gpa = gpa,
        .vs_wgsl_source = vs_wgsl,
        .fs_wgsl_source = fs_wgsl,
        .vertex_buffer_layouts = &amp;.{z.shader.<span class="tok-fn">vertexLayout</span>(vs_io)},
        .initial_ubo = .{ .transform = <span class="tok-fn">transform2d</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">1</span>) },
        .label = <span class="tok-str">"pipeline_uniforms"</span>,
    });

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">24</span>),
        .shader = shader,
        .vbo = vbo,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-comment">// Spin over time, aspect-correct so the triangle stays equilateral.</span>
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> aspect: f32 = w / <span class="tok-builtin">@max</span>(h, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> sx: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span> / aspect;
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) aspect <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
    s.shader.<span class="tok-fn">pushUbo</span>(f.gpu.queue, .{ .transform = <span class="tok-fn">transform2d</span>(f.time.time * <span class="tok-num">0.6</span>, sx, sy) });

    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    s.shader.<span class="tok-fn">bindForDraw</span>(ps);
    s.shader.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(vertices)));
    s.shader.<span class="tok-fn">draw</span>(ps, vertices.len, <span class="tok-num">1</span>);

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"pipeline_uniforms: a vertex-stage UBO transform drives a custom pipeline"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - pipeline uniforms"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.039</span>, .g = <span class="tok-num">0.047</span>, .b = <span class="tok-num">0.071</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
</code></pre></figure>

<figure class="code src-file" data-path="examples/pipeline_uniforms_vs.zig" data-lines="32"><figcaption><span>examples/pipeline_uniforms_vs.zig</span><span>32 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/pipeline_uniforms_vs.zig - pipeline_uniforms vertex shader body.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Transforms each 2D vertex by the UBO's 4x4 matrix and passes the colour</span>
<span class="tok-comment">//! through. The matrix (host-supplied) spins the triangle and squashes it</span>
<span class="tok-comment">//! aspect-correct, replacing the CPU vertex-rewrite the basic example used.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec3 = zm.Vec3;
<span class="tok-kw">const</span> mulMatPoint = zm.mulMatPoint;
<span class="tok-kw">const</span> shader_io = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_vs_io.zig"</span>);
<span class="tok-kw">const</span> shader_externs = <span class="tok-builtin">@import</span>(<span class="tok-str">"pipeline_uniforms_vs_externs"</span>);

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Io = shader_externs.<span class="tok-fn">IoT</span>(shader_io.Ubo);
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Out = shader_externs.Out;

<span class="tok-kw">pub</span> <span class="tok-kw">fn</span> <span class="tok-fn">shaderMain</span>(io_in: Io) Out {
    <span class="tok-kw">var</span> out: Out = undefined;

    <span class="tok-comment">// mat4 * vec4(p.xy, 0, 1): treat the 2D vertex as a point on the z=0 plane.</span>
    <span class="tok-kw">const</span> p: Vec3 = .{ io_in.vertex_position[<span class="tok-num">0</span>], io_in.vertex_position[<span class="tok-num">1</span>], <span class="tok-num">0.0</span> };
    out.position = <span class="tok-fn">mulMatPoint</span>(io_in.u.transform, p);

    <span class="tok-kw">const</span> c: Vec3 = io_in.vertex_color;
    out.frag_color = .{ c[<span class="tok-num">0</span>], c[<span class="tok-num">1</span>], c[<span class="tok-num">2</span>], <span class="tok-num">1.0</span> };

    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">comptime</span> {
    _ = shader_io;
    _ = shader_externs.<span class="tok-fn">installSpirvEntry</span>(shaderMain);
}

<figure class="code src-file" data-path="examples/pipeline_uniforms_vs_io.zig" data-lines="33"><figcaption><span>examples/pipeline_uniforms_vs_io.zig</span><span>33 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! examples/pipeline_uniforms_vs_io.zig - typed interface for the</span>
<span class="tok-comment">//! pipeline_uniforms vertex shader. Companion to `pipeline_uniforms_vs.zig`.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Demonstrates a VERTEX-STAGE uniform: the only uniform is a 4x4 transform the</span>
<span class="tok-comment">//! host rewrites every frame, so the triangle spins and stays aspect-correct.</span>
<span class="tok-comment">//! Because the `Ubo` is declared here (the vertex schema), the codegen binds it</span>
<span class="tok-comment">//! at @group(0) and `loadShaderVF` routes it there automatically - the host</span>
<span class="tok-comment">//! never names a group.</span>

<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> shader = <span class="tok-builtin">@import</span>(<span class="tok-str">"shader_interface"</span>);

<span class="tok-comment">/// Vertex attributes: clip-ish position (the matrix finishes the transform) and</span>
<span class="tok-comment">/// a per-vertex colour. Locations match the interleaved vertex buffer; the</span>
<span class="tok-comment">/// layout is DERIVED from these via `z.shader.vertexLayout`.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Attributes = <span class="tok-kw">struct</span> {
    vertex_position: shader.<span class="tok-fn">Attr</span>(.vec2, <span class="tok-num">0</span>),
    vertex_color: shader.<span class="tok-fn">Attr</span>(.vec3, <span class="tok-num">1</span>),
};

<span class="tok-comment">/// Single uniform block (group 0, binding 0): a 4x4 transform.</span>
<span class="tok-comment">/// mat4 == [4]Vec (std140 rows; uploaded raw, read by the shader as</span>
<span class="tok-comment">/// `mulMatPoint`, which matches WGSL `m * vec4(p, 1)`).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Ubo = <span class="tok-kw">struct</span> {
    transform: [<span class="tok-num">4</span>]Vec,
};

<span class="tok-comment">/// Varying to the fragment stage - the interpolated colour (inlined, not shared,</span>
<span class="tok-comment">/// so the vs/fs io files stay in separate modules; the match is structural).</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> Outputs = <span class="tok-kw">struct</span> {
    frag_color: Vec,
};
</code></pre></figure>
