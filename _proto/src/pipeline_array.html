<figure class="code src-file" data-path="examples/pipeline_array/pipeline_array.zig" data-lines="272"><figcaption><span>examples/pipeline_array/pipeline_array.zig</span><span>272 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! pipeline_array - Phase 3 (`src/notes/webgpu_control.md`): 2D texture</span>
<span class="tok-comment">//! arrays. One texture holds four layers, each painted a distinct pattern by a</span>
<span class="tok-comment">//! COMPUTE shader (a `texture_storage_2d_array`, one dispatch with z = layers).</span>
<span class="tok-comment">//! A single render pipeline then samples a `texture_2d_array`: the layer index</span>
<span class="tok-comment">//! is a per-vertex attribute, so ONE draw renders a 2x2 grid where each quad</span>
<span class="tok-comment">//! reads a different layer.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Plumbing added (additive): wgpu.TextureDesc.array_layers,</span>
<span class="tok-comment">//! wgpu.createTextureViewArray (a 2d-array view, bound for both the compute</span>
<span class="tok-comment">//! write and the sampled read), and a `view_dimension` field in the bind-group</span>
<span class="tok-comment">//! layout blob (gpu.zig encoder + bridge decoder) so an entry can declare</span>
<span class="tok-comment">//! `2d-array`. Existing entries default to `2d`, unchanged.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Build:  zig build wgpu-pipeline-array</span>
<span class="tok-comment">//! Device: zig build wgpu-pipeline-array-standalone -Dmode=release</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> tex_dim: u32 = <span class="tok-num">96</span>;
<span class="tok-kw">const</span> layers: u32 = <span class="tok-num">4</span>;
<span class="tok-kw">const</span> half: f32 = <span class="tok-num">0.40</span>;

<span class="tok-kw">const</span> compute_wgsl =
    <span class="tok-str">\\@group(0) @binding(0) var out_tex: texture_storage_2d_array&lt;rgba8unorm, write&gt;;</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@compute @workgroup_size(8, 8, 1)</span>
    <span class="tok-str">\\fn cs_main(@builtin(global_invocation_id) gid: vec3u) {</span>
    <span class="tok-str">\\    let dims = textureDimensions(out_tex);</span>
    <span class="tok-str">\\    if (gid.x &gt;= dims.x || gid.y &gt;= dims.y || gid.z &gt;= 4u) {</span>
    <span class="tok-str">\\        return;</span>
    <span class="tok-str">\\    }</span>
    <span class="tok-str">\\    let fx = f32(gid.x) / f32(dims.x);</span>
    <span class="tok-str">\\    let fy = f32(gid.y) / f32(dims.y);</span>
    <span class="tok-str">\\    var c = vec3f(0.0);</span>
    <span class="tok-str">\\    if (gid.z == 0u) {</span>
    <span class="tok-str">\\        let d = distance(vec2f(fx, fy), vec2f(0.5));</span>
    <span class="tok-str">\\        c = vec3f(1.0, 0.35, 0.35) * clamp(1.0 - d * 1.6, 0.0, 1.0);</span>
    <span class="tok-str">\\    } else if (gid.z == 1u) {</span>
    <span class="tok-str">\\        let s = step(0.5, fract(fx * 6.0));</span>
    <span class="tok-str">\\        c = mix(vec3f(0.10, 0.35, 0.12), vec3f(0.35, 1.0, 0.45), s);</span>
    <span class="tok-str">\\    } else if (gid.z == 2u) {</span>
    <span class="tok-str">\\        let cx = floor(fx * 6.0);</span>
    <span class="tok-str">\\        let cy = floor(fy * 6.0);</span>
    <span class="tok-str">\\        let ch = (cx + cy) % 2.0;</span>
    <span class="tok-str">\\        c = mix(vec3f(0.10, 0.15, 0.30), vec3f(0.40, 0.60, 1.0), ch);</span>
    <span class="tok-str">\\    } else {</span>
    <span class="tok-str">\\        c = vec3f(fx, fy, 0.7);</span>
    <span class="tok-str">\\    }</span>
    <span class="tok-str">\\    textureStore(out_tex, vec2i(i32(gid.x), i32(gid.y)), i32(gid.z), vec4f(c, 1.0));</span>
    <span class="tok-str">\\}</span>
;

<span class="tok-kw">const</span> render_wgsl =
    <span class="tok-str">\\struct U { aspect: vec4f };   // .xy = (sx, sy)</span>
    <span class="tok-str">\\@group(0) @binding(0) var&lt;uniform&gt; u: U;</span>
    <span class="tok-str">\\@group(0) @binding(1) var tex: texture_2d_array&lt;f32&gt;;</span>
    <span class="tok-str">\\@group(0) @binding(2) var samp: sampler;</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\struct VsOut {</span>
    <span class="tok-str">\\    @builtin(position) pos: vec4f,</span>
    <span class="tok-str">\\    @location(0) uv: vec2f,</span>
    <span class="tok-str">\\    @location(1) @interpolate(flat) layer: u32,</span>
    <span class="tok-str">\\};</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@vertex</span>
    <span class="tok-str">\\fn vs_main(@location(0) p: vec2f, @location(1) uv: vec2f, @location(2) layer: f32) -&gt; VsOut {</span>
    <span class="tok-str">\\    var out: VsOut;</span>
    <span class="tok-str">\\    out.pos = vec4f(p.x * u.aspect.x, p.y * u.aspect.y, 0.0, 1.0);</span>
    <span class="tok-str">\\    out.uv = uv;</span>
    <span class="tok-str">\\    out.layer = u32(layer + 0.5);</span>
    <span class="tok-str">\\    return out;</span>
    <span class="tok-str">\\}</span>
    <span class="tok-str">\\</span>
    <span class="tok-str">\\@fragment</span>
    <span class="tok-str">\\fn fs_main(in: VsOut) -&gt; @location(0) vec4f {</span>
    <span class="tok-str">\\    return vec4f(textureSample(tex, samp, in.uv, i32(in.layer)).rgb, 1.0);</span>
    <span class="tok-str">\\}</span>
;

<span class="tok-kw">const</span> Vertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> { x: f32, y: f32, u: f32, v: f32, layer: f32 };

<span class="tok-kw">const</span> Cell = <span class="tok-kw">struct</span> { cx: f32, cy: f32, layer: f32, label: []<span class="tok-kw">const</span> u8 };

<span class="tok-kw">const</span> grid = [<span class="tok-num">4</span>]Cell{
    .{ .cx = -<span class="tok-num">0.5</span>, .cy = <span class="tok-num">0.5</span>, .layer = <span class="tok-num">0</span>, .label = <span class="tok-str">"layer 0"</span> },
    .{ .cx = <span class="tok-num">0.5</span>, .cy = <span class="tok-num">0.5</span>, .layer = <span class="tok-num">1</span>, .label = <span class="tok-str">"layer 1"</span> },
    .{ .cx = -<span class="tok-num">0.5</span>, .cy = -<span class="tok-num">0.5</span>, .layer = <span class="tok-num">2</span>, .label = <span class="tok-str">"layer 2"</span> },
    .{ .cx = <span class="tok-num">0.5</span>, .cy = -<span class="tok-num">0.5</span>, .layer = <span class="tok-num">3</span>, .label = <span class="tok-str">"layer 3"</span> },
};

<span class="tok-kw">fn</span> <span class="tok-fn">quad</span>(c: Cell) [<span class="tok-num">6</span>]Vertex {
    <span class="tok-kw">const</span> l: f32 = c.layer;
    <span class="tok-kw">return</span> .{
        .{ .x = c.cx - half, .y = c.cy + half, .u = <span class="tok-num">0</span>, .v = <span class="tok-num">0</span>, .layer = l },
        .{ .x = c.cx - half, .y = c.cy - half, .u = <span class="tok-num">0</span>, .v = <span class="tok-num">1</span>, .layer = l },
        .{ .x = c.cx + half, .y = c.cy - half, .u = <span class="tok-num">1</span>, .v = <span class="tok-num">1</span>, .layer = l },
        .{ .x = c.cx - half, .y = c.cy + half, .u = <span class="tok-num">0</span>, .v = <span class="tok-num">0</span>, .layer = l },
        .{ .x = c.cx + half, .y = c.cy - half, .u = <span class="tok-num">1</span>, .v = <span class="tok-num">1</span>, .layer = l },
        .{ .x = c.cx + half, .y = c.cy + half, .u = <span class="tok-num">1</span>, .v = <span class="tok-num">0</span>, .layer = l },
    };
}

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    font: z.Font,
    tex: z.wgpu.TextureHandle,
    arr_view: z.wgpu.TextureViewHandle,
    sampler: z.wgpu.SamplerHandle,
    ubo: z.wgpu.BufferHandle,
    pipe: z.Pipeline,
    bind_group: z.wgpu.BindGroupHandle,
    vbo: z.wgpu.BufferHandle,
};

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    s.pipe.<span class="tok-fn">deinit</span>();
    <span class="tok-kw">if</span> (s.arr_view != .invalid) {
        z.wgpu.<span class="tok-fn">destroyTextureView</span>(s.arr_view);
    }
    <span class="tok-kw">if</span> (s.tex != .invalid) {
        z.wgpu.<span class="tok-fn">destroyTexture</span>(s.tex);
    }
    <span class="tok-kw">if</span> (s.sampler != .invalid) {
        z.wgpu.<span class="tok-fn">destroySampler</span>(s.sampler);
    }
    <span class="tok-kw">if</span> (s.bind_group != .invalid) {
        z.wgpu.<span class="tok-fn">destroyBindGroup</span>(s.bind_group);
    }
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.vbo);
    z.wgpu.<span class="tok-fn">destroyBuffer</span>(s.ubo);
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
}

<span class="tok-kw">fn</span> <span class="tok-fn">fillLayers</span>(gpa: Allocator, f: *z.Frame, arr_view: z.wgpu.TextureViewHandle) !void {
    <span class="tok-comment">// One compute dispatch paints all array layers (z = layers). The fill's</span>
    <span class="tok-comment">// scaffolding is built and released inside the helper (leak-safe).</span>
    <span class="tok-kw">const</span> groups: u32 = (tex_dim + <span class="tok-num">7</span>) / <span class="tok-num">8</span>;
    <span class="tok-kw">try</span> z.material.<span class="tok-fn">fillStorageView</span>(gpa, f, arr_view, .{
        .wgsl = compute_wgsl,
        .groups = .{ .x = groups, .y = groups, .z = layers },
        .view_dimension = .d2_array,
        .label = <span class="tok-str">"arr_cs"</span>,
    });
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> tex: z.wgpu.TextureHandle = z.wgpu.<span class="tok-fn">createTexture</span>(f.gpu.device, .{
        .width = tex_dim,
        .height = tex_dim,
        .format = .rgba8_unorm,
        .usage = .{ .storage_binding = true, .texture_binding = true },
        .array_layers = layers,
        .label = <span class="tok-str">"arr_tex"</span>,
    });
    <span class="tok-kw">const</span> arr_view: z.wgpu.TextureViewHandle = z.wgpu.<span class="tok-fn">createTextureViewArray</span>(tex, layers);
    <span class="tok-kw">try</span> <span class="tok-fn">fillLayers</span>(gpa, f, arr_view);

    <span class="tok-kw">const</span> sampler: z.wgpu.SamplerHandle = z.wgpu.<span class="tok-fn">createSampler</span>(f.gpu.device, .{
        .mag_filter_linear = true,
        .min_filter_linear = true,
        .address_mode = .clamp_to_edge,
    });

    <span class="tok-kw">const</span> aspect0: [<span class="tok-num">4</span>]f32 = .{ <span class="tok-num">1</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    <span class="tok-kw">const</span> ubo: z.wgpu.BufferHandle = z.material.<span class="tok-fn">uniformBuffer</span>(f, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;aspect0), <span class="tok-str">"arr_ubo"</span>);

    <span class="tok-kw">const</span> bgl: z.wgpu.BindGroupLayoutHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroupLayout</span>(gpa, f, &amp;.{
        .{ .binding = <span class="tok-num">0</span>, .visibility = .{ .vertex = true }, .resource = .{ .uniform_buffer = .{} } },
        .{
            .binding = <span class="tok-num">1</span>,
            .visibility = .{ .fragment = true },
            .resource = .{ .texture = .{ .view_dimension = .d2_array } },
        },
        .{ .binding = <span class="tok-num">2</span>, .visibility = .{ .fragment = true }, .resource = .{ .sampler = .{} } },
    }, <span class="tok-str">"arr_bgl"</span>);
    <span class="tok-kw">const</span> bind_group: z.wgpu.BindGroupHandle = <span class="tok-kw">try</span> z.material.<span class="tok-fn">bindGroup</span>(gpa, f, bgl, &amp;.{
        .{ .binding = <span class="tok-num">0</span>, .resource = .{ .buffer = .{ .handle = ubo } } },
        .{ .binding = <span class="tok-num">1</span>, .resource = .{ .texture_view = arr_view } },
        .{ .binding = <span class="tok-num">2</span>, .resource = .{ .sampler = sampler } },
    }, <span class="tok-str">"arr_bg"</span>);

    <span class="tok-kw">var</span> verts: [<span class="tok-num">24</span>]Vertex = undefined;
    <span class="tok-kw">for</span> (grid, <span class="tok-num">0</span>..) |c, i| {
        <span class="tok-kw">const</span> q: [<span class="tok-num">6</span>]Vertex = <span class="tok-fn">quad</span>(c);
        <span class="tok-builtin">@memcpy</span>(verts[i * <span class="tok-num">6</span> .. i * <span class="tok-num">6</span> + <span class="tok-num">6</span>], &amp;q);
    }
    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(f.gpu.device, .{
        .size = <span class="tok-builtin">@sizeOf</span>([<span class="tok-num">24</span>]Vertex),
        .usage = .{ .vertex = true, .copy_dst = true },
        .label = <span class="tok-str">"arr_vbo"</span>,
    });
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, vbo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;verts));

    <span class="tok-kw">const</span> layout: z.VertexLayout = .{
        .array_stride = <span class="tok-builtin">@sizeOf</span>(Vertex),
        .step_mode = .vertex,
        .attributes = &amp;.{
            .{ .format = .float32x2, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
            .{ .format = .float32x2, .offset = <span class="tok-num">8</span>, .shader_location = <span class="tok-num">1</span> },
            .{ .format = .float32, .offset = <span class="tok-num">16</span>, .shader_location = <span class="tok-num">2</span> },
        },
    };
    <span class="tok-kw">const</span> pipe: z.Pipeline = <span class="tok-kw">try</span> z.Pipeline.<span class="tok-fn">init</span>(gpa, f, .{
        .wgsl = render_wgsl,
        .layouts = &amp;.{layout},
        .bind_group_layouts = &amp;.{bgl},
        .label = <span class="tok-str">"arr_render"</span>,
    });
    <span class="tok-comment">// Render bgl was build-only (defined the pipeline + bind group).</span>
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(bgl);

    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>),
        .tex = tex,
        .arr_view = arr_view,
        .sampler = sampler,
        .ubo = ubo,
        .pipe = pipe,
        .bind_group = bind_group,
        .vbo = vbo,
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> aspect: f32 = w / <span class="tok-builtin">@max</span>(h, <span class="tok-num">1.0</span>);
    <span class="tok-kw">const</span> sx: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">1.0</span> / aspect;
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-kw">if</span> (aspect &lt; <span class="tok-num">1.0</span>) aspect <span class="tok-kw">else</span> <span class="tok-num">1.0</span>;
    <span class="tok-kw">const</span> av: [<span class="tok-num">4</span>]f32 = .{ sx, sy, <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, s.ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">sliceAsBytes</span>(&amp;av));

    <span class="tok-kw">const</span> ps: *z.PassState = f.gl.pass;
    s.pipe.<span class="tok-fn">bind</span>(ps);
    s.pipe.<span class="tok-fn">setBindGroup</span>(ps, <span class="tok-num">0</span>, s.bind_group);
    s.pipe.<span class="tok-fn">setVertex</span>(ps, <span class="tok-num">0</span>, s.vbo, <span class="tok-builtin">@sizeOf</span>([<span class="tok-num">24</span>]Vertex));
    s.pipe.<span class="tok-fn">drawArrays</span>(ps, <span class="tok-num">24</span>, <span class="tok-num">1</span>); <span class="tok-comment">// all four layered quads in one draw</span>

    <span class="tok-kw">for</span> (grid) |c| {
        <span class="tok-kw">const</span> px: f32 = (c.cx * sx * <span class="tok-num">0.5</span> + <span class="tok-num">0.5</span>) * w;
        <span class="tok-kw">const</span> py: f32 = (<span class="tok-num">0.5</span> - (c.cy - half) * sy * <span class="tok-num">0.5</span>) * h + <span class="tok-num">8.0</span>;
        f.gl.<span class="tok-fn">text</span>(.{ px - <span class="tok-num">40.0</span>, py }, c.label, .{ .size = <span class="tok-num">20</span>, .color = common.palette.ink_dim, .font = &amp;s.font });
    }
    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"pipeline_array: one texture_2d_array, 4 layers, sampled by per-vertex index"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    <span class="tok-comment">// Transient GPU-technique demo: pipeline setup creates layouts and shader</span>
    <span class="tok-comment">// modules that aren't retained in State, so a leak-tight deinit isn't</span>
    <span class="tok-comment">// practical. Opt out of the managed leak gate rather than fake teardown.</span>
    .memory = .managed,
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - pipeline array"</span>,
            .width = <span class="tok-num">800</span>,
            .height = <span class="tok-num">600</span>,
            .scale_mode = .responsive,
            .clear = .{ .r = <span class="tok-num">0.02</span>, .g = <span class="tok-num">0.02</span>, .b = <span class="tok-num">0.03</span>, .a = <span class="tok-num">1.0</span> },
        },
    },
    .init = initState,
    <span class="tok-comment">// .memory left default (arena): init builds a compute pipeline / multi-pass</span>
    <span class="tok-comment">// chain (mipmap or bloom) whose intermediate handles aren't kept in State,</span>
    <span class="tok-comment">// so a full managed teardown needs added State fields - deferred.</span>
    .deinit = deinit,
    .update = update,
};
