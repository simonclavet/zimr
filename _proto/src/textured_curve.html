<span class="tok-comment">//! resources/road.png, so the example is self-contained. rlBegin(QUADS) is</span>

    h ^= h &gt;&gt; <span class="tok-num">15</span>;
    <span class="tok-kw">return</span> <span class="tok-builtin">@intCast</span>(h % <span class="tok-num">17</span>); <span class="tok-comment">// 0..16</span>
}

<span class="tok-comment">/// Build the road bitmap: dark asphalt with speckle, white edge lines, and a</span>
<span class="tok-comment">/// dashed yellow centre line (dashes tile along V).</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildRoad</span>(gpa: Allocator) !z.Image {
    <span class="tok-kw">const</span> base: Color = .{ .r = <span class="tok-num">58</span>, .g = <span class="tok-num">60</span>, .b = <span class="tok-num">66</span>, .a = <span class="tok-num">255</span> };
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> z.<span class="tok-fn">genImageColor</span>(gpa, tex_w, tex_h, base);
    <span class="tok-kw">defer</span> z.<span class="tok-fn">unloadImage</span>(gpa, img);
    <span class="tok-kw">const</span> px: [*]Color = <span class="tok-builtin">@ptrCast</span>(<span class="tok-builtin">@alignCast</span>(img.data.?));

    <span class="tok-kw">const</span> wf: f32 = <span class="tok-fn">float</span>(tex_w);
    <span class="tok-kw">const</span> hf: f32 = <span class="tok-fn">float</span>(tex_h);
    <span class="tok-kw">var</span> y: i32 = <span class="tok-num">0</span>;
    <span class="tok-kw">while</span> (y &lt; tex_h) : (y += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> vy: f32 = <span class="tok-fn">float</span>(y) / hf;
        <span class="tok-kw">var</span> x: i32 = <span class="tok-num">0</span>;
        <span class="tok-kw">while</span> (x &lt; tex_w) : (x += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> ux: f32 = <span class="tok-fn">float</span>(x) / wf;
            <span class="tok-kw">const</span> idx: usize = <span class="tok-builtin">@intCast</span>(y * tex_w + x);
            <span class="tok-comment">// asphalt with speckle</span>
            <span class="tok-kw">const</span> n: i32 = <span class="tok-fn">speckle</span>(x, y) - <span class="tok-num">8</span>;
            <span class="tok-kw">var</span> c: Color = .{
                .r = <span class="tok-builtin">@intCast</span>(<span class="tok-fn">clamp</span>(<span class="tok-builtin">@as</span>(i32, base.r) + n, <span class="tok-num">0</span>, <span class="tok-num">255</span>)),
                .g = <span class="tok-builtin">@intCast</span>(<span class="tok-fn">clamp</span>(<span class="tok-builtin">@as</span>(i32, base.g) + n, <span class="tok-num">0</span>, <span class="tok-num">255</span>)),
                .b = <span class="tok-builtin">@intCast</span>(<span class="tok-fn">clamp</span>(<span class="tok-builtin">@as</span>(i32, base.b) + n, <span class="tok-num">0</span>, <span class="tok-num">255</span>)),
                .a = <span class="tok-num">255</span>,
            };
            <span class="tok-comment">// white edge lines near both rims</span>
            <span class="tok-kw">if</span> ((ux &gt; <span class="tok-num">0.045</span> <span class="tok-kw">and</span> ux &lt; <span class="tok-num">0.085</span>) <span class="tok-kw">or</span> (ux &gt; <span class="tok-num">0.915</span> <span class="tok-kw">and</span> ux &lt; <span class="tok-num">0.955</span>)) {
                c = .{ .r = <span class="tok-num">235</span>, .g = <span class="tok-num">235</span>, .b = <span class="tok-num">230</span>, .a = <span class="tok-num">255</span> };
            }
            <span class="tok-comment">// dashed yellow centre line: on for ~62% of each tile, gap after</span>
            <span class="tok-kw">if</span> (ux &gt; <span class="tok-num">0.470</span> <span class="tok-kw">and</span> ux &lt; <span class="tok-num">0.530</span> <span class="tok-kw">and</span> vy &lt; <span class="tok-num">0.62</span>) {
                c = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">40</span>, .a = <span class="tok-num">255</span> };
            }
            px[idx] = c;
        }
    }
    <span class="tok-kw">return</span> img;
}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> img: z.Image = <span class="tok-kw">try</span> <span class="tok-fn">buildRoad</span>(gpa);
    <span class="tok-kw">const</span> road: z.WgpuTexture = z.<span class="tok-fn">loadTextureFromImage</span>(f.gl, img);
    <span class="tok-comment">// (img is a one-shot init allocation; the GPU texture owns its own copy.)</span>

    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    s.* = .{
        .font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">20</span>),
        .road = road,
        <span class="tok-comment">// raylib's fixed points, expressed as fractions of an 800x450 frame so</span>
        <span class="tok-comment">// the layout adapts to a phone canvas.</span>
        .p_start = .{ <span class="tok-num">0.10</span> * w, <span class="tok-num">0.22</span> * h },
        .t_start = .{ <span class="tok-num">0.125</span> * w, <span class="tok-num">0.667</span> * h },
        .p_end = .{ <span class="tok-num">0.875</span> * w, <span class="tok-num">0.778</span> * h },
        .t_end = .{ <span class="tok-num">0.75</span> * w, <span class="tok-num">0.22</span> * h },
    };
}

<span class="tok-kw">fn</span> <span class="tok-fn">v2</span>(x: f32, y: f32) Vec2 {
    <span class="tok-kw">return</span> .{ x, y };
}
<span class="tok-kw">fn</span> <span class="tok-fn">add</span>(a: Vec2, b: Vec2) Vec2 {
    <span class="tok-kw">return</span> .{ a[<span class="tok-num">0</span>] + b[<span class="tok-num">0</span>], a[<span class="tok-num">1</span>] + b[<span class="tok-num">1</span>] };
}
<span class="tok-kw">fn</span> <span class="tok-fn">scale</span>(a: Vec2, s: f32) Vec2 {
    <span class="tok-kw">return</span> .{ a[<span class="tok-num">0</span>] * s, a[<span class="tok-num">1</span>] * s };
}

<span class="tok-comment">/// The hero: sweep the road texture along the cubic Bezier as a UV ribbon.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawTexturedCurve</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> segs: i32 = <span class="tok-kw">if</span> (s.segments &lt; <span class="tok-num">2</span>) <span class="tok-num">2</span> <span class="tok-kw">else</span> s.segments;
    <span class="tok-kw">const</span> step: f32 = <span class="tok-num">1.0</span> / <span class="tok-fn">float</span>(segs);
    <span class="tok-kw">const</span> road_h: f32 = <span class="tok-fn">float</span>(tex_h);

    <span class="tok-kw">var</span> previous: Vec2 = s.p_start;
    <span class="tok-kw">var</span> previous_tangent: Vec2 = <span class="tok-fn">v2</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">var</span> previous_v: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">var</span> tangent_set: bool = false;

    z.<span class="tok-fn">rlSetTexture</span>(f.gl, s.road);
    z.<span class="tok-fn">rlBegin</span>(f.gl, .triangles);
    z.<span class="tok-fn">rlColor4ub</span>(f.gl, <span class="tok-num">255</span>, <span class="tok-num">255</span>, <span class="tok-num">255</span>, <span class="tok-num">255</span>);

    <span class="tok-kw">var</span> i: i32 = <span class="tok-num">1</span>;
    <span class="tok-kw">while</span> (i &lt;= segs) : (i += <span class="tok-num">1</span>) {
        <span class="tok-kw">const</span> t: f32 = step * <span class="tok-fn">float</span>(i);
        <span class="tok-kw">const</span> omt: f32 = <span class="tok-num">1.0</span> - t;
        <span class="tok-kw">const</span> a: f32 = omt * omt * omt;
        <span class="tok-kw">const</span> b: f32 = <span class="tok-num">3.0</span> * omt * omt * t;
        <span class="tok-kw">const</span> c: f32 = <span class="tok-num">3.0</span> * omt * t * t;
        <span class="tok-kw">const</span> d: f32 = t * t * t;

        <span class="tok-kw">const</span> current: Vec2 = .{
            a * s.p_start[<span class="tok-num">0</span>] + b * s.t_start[<span class="tok-num">0</span>] + c * s.t_end[<span class="tok-num">0</span>] + d * s.p_end[<span class="tok-num">0</span>],
            a * s.p_start[<span class="tok-num">1</span>] + b * s.t_start[<span class="tok-num">1</span>] + c * s.t_end[<span class="tok-num">1</span>] + d * s.p_end[<span class="tok-num">1</span>],
        };

        <span class="tok-kw">const</span> delta: Vec2 = .{ current[<span class="tok-num">0</span>] - previous[<span class="tok-num">0</span>], current[<span class="tok-num">1</span>] - previous[<span class="tok-num">1</span>] };
        <span class="tok-kw">const</span> len: f32 = <span class="tok-fn">length</span>(delta);
        <span class="tok-kw">const</span> inv: f32 = <span class="tok-kw">if</span> (len &gt; <span class="tok-num">0.0001</span>) <span class="tok-num">1.0</span> / len <span class="tok-kw">else</span> <span class="tok-num">0.0</span>;
        <span class="tok-comment">// right-hand normal to delta</span>
        <span class="tok-kw">const</span> normal: Vec2 = .{ -delta[<span class="tok-num">1</span>] * inv, delta[<span class="tok-num">0</span>] * inv };

        <span class="tok-kw">const</span> v: f32 = previous_v + len / (road_h * <span class="tok-num">2.0</span>);

        <span class="tok-kw">if</span> (!tangent_set) {
            previous_tangent = normal;
            tangent_set = true;
        }

        <span class="tok-kw">const</span> prev_pos: Vec2 = <span class="tok-fn">add</span>(previous, <span class="tok-fn">scale</span>(previous_tangent, s.width));
        <span class="tok-kw">const</span> prev_neg: Vec2 = <span class="tok-fn">add</span>(previous, <span class="tok-fn">scale</span>(previous_tangent, -s.width));
        <span class="tok-kw">const</span> cur_pos: Vec2 = <span class="tok-fn">add</span>(current, <span class="tok-fn">scale</span>(normal, s.width));
        <span class="tok-kw">const</span> cur_neg: Vec2 = <span class="tok-fn">add</span>(current, <span class="tok-fn">scale</span>(normal, -s.width));

        <span class="tok-comment">// raylib's RL_QUADS winding (prevNeg, prevPos, curPos, curNeg) as 2 tris.</span>
        <span class="tok-fn">emit</span>(f, <span class="tok-num">0</span>, previous_v, prev_neg);
        <span class="tok-fn">emit</span>(f, <span class="tok-num">1</span>, previous_v, prev_pos);
        <span class="tok-fn">emit</span>(f, <span class="tok-num">1</span>, v, cur_pos);

        <span class="tok-fn">emit</span>(f, <span class="tok-num">0</span>, previous_v, prev_neg);
        <span class="tok-fn">emit</span>(f, <span class="tok-num">1</span>, v, cur_pos);
        <span class="tok-fn">emit</span>(f, <span class="tok-num">0</span>, v, cur_neg);

        previous = current;
        previous_tangent = normal;
        previous_v = v;
    }

    z.<span class="tok-fn">rlEnd</span>(f.gl);
    z.<span class="tok-fn">rlSetTexture</span>(f.gl, .{}); <span class="tok-comment">// back to the white 1x1 so shapes stay solid</span>
}

<span class="tok-kw">fn</span> <span class="tok-fn">emit</span>(f: *z.Frame, u: f32, v: f32, p: Vec2) void {
    z.<span class="tok-fn">rlTexCoord2f</span>(f.gl, u, v);
    z.<span class="tok-fn">rlVertex2f</span>(f.gl, p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>]);
}

<span class="tok-comment">// A cheap horizontal slider: returns the (possibly updated) value.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">slider</span>(
    f: *z.Frame,
    x0: f32,
    x1: f32,
    y: f32,
    val: f32,
    lo: f32,
    hi: f32,
    active: bool,
) f32 {
    f.gl.<span class="tok-fn">rectRoundedXYWH</span>(x0, y - <span class="tok-num">5</span>, x1 - x0, <span class="tok-num">10</span>, <span class="tok-num">1.0</span>, <span class="tok-num">8</span>, .{ .color = surface });
    <span class="tok-kw">var</span> out: f32 = val;
    <span class="tok-kw">if</span> (active) {
        <span class="tok-kw">const</span> m: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
        out = lo + <span class="tok-fn">clamp</span>((m[<span class="tok-num">0</span>] - x0) / (x1 - x0), <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>) * (hi - lo);
    }
    <span class="tok-kw">const</span> kx: f32 = x0 + <span class="tok-fn">clamp</span>((out - lo) / (hi - lo), <span class="tok-num">0.0</span>, <span class="tok-num">1.0</span>) * (x1 - x0);
    f.gl.<span class="tok-fn">circle</span>(.{ kx, y }, <span class="tok-num">10</span>, .{ .color = skyblue, .segments = <span class="tok-num">16</span> });
    f.gl.<span class="tok-fn">circle</span>(.{ kx, y }, <span class="tok-num">10</span>, .{ .color = ink, .outline = <span class="tok-num">1</span> });
    <span class="tok-kw">return</span> out;
}

<span class="tok-kw">fn</span> <span class="tok-fn">hit</span>(m: Vec2, p: Vec2, r: f32) bool {
    <span class="tok-kw">return</span> <span class="tok-fn">distance</span>(m, p) &lt;= r;
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    z.<span class="tok-fn">clearViewport</span>(f, raywhite);

    <span class="tok-kw">const</span> w: f32 = f.window.<span class="tok-fn">widthf</span>();
    <span class="tok-kw">const</span> h: f32 = f.window.<span class="tok-fn">heightf</span>();
    <span class="tok-kw">const</span> m: Vec2 = z.<span class="tok-fn">getMousePosition</span>(f.input);
    <span class="tok-kw">const</span> down: bool = z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left);

    <span class="tok-comment">// control widgets along the bottom</span>
    <span class="tok-kw">const</span> wsx0: f32 = w * <span class="tok-num">0.06</span>;
    <span class="tok-kw">const</span> wsx1: f32 = w * <span class="tok-num">0.44</span>;
    <span class="tok-kw">const</span> ssx0: f32 = w * <span class="tok-num">0.56</span>;
    <span class="tok-kw">const</span> ssx1: f32 = w * <span class="tok-num">0.94</span>;
    <span class="tok-kw">const</span> sy: f32 = h - <span class="tok-num">26.0</span>;
    <span class="tok-kw">const</span> toggle: z.Rectangle = <span class="tok-fn">z_rect</span>(w * <span class="tok-num">0.06</span>, <span class="tok-num">14</span>, <span class="tok-num">150</span>, <span class="tok-num">26</span>);

    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonPressed</span>(f.input, .left)) {
        <span class="tok-kw">if</span> (<span class="tok-fn">hit</span>(m, s.p_start, <span class="tok-num">12</span>)) {
            s.drag = <span class="tok-num">0</span>;
            s.grab_off = .{ s.p_start[<span class="tok-num">0</span>] - m[<span class="tok-num">0</span>], s.p_start[<span class="tok-num">1</span>] - m[<span class="tok-num">1</span>] };
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (<span class="tok-fn">hit</span>(m, s.t_start, <span class="tok-num">12</span>)) {
            s.drag = <span class="tok-num">1</span>;
            s.grab_off = .{ s.t_start[<span class="tok-num">0</span>] - m[<span class="tok-num">0</span>], s.t_start[<span class="tok-num">1</span>] - m[<span class="tok-num">1</span>] };
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (<span class="tok-fn">hit</span>(m, s.p_end, <span class="tok-num">12</span>)) {
            s.drag = <span class="tok-num">2</span>;
            s.grab_off = .{ s.p_end[<span class="tok-num">0</span>] - m[<span class="tok-num">0</span>], s.p_end[<span class="tok-num">1</span>] - m[<span class="tok-num">1</span>] };
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (<span class="tok-fn">hit</span>(m, s.t_end, <span class="tok-num">12</span>)) {
            s.drag = <span class="tok-num">3</span>;
            s.grab_off = .{ s.t_end[<span class="tok-num">0</span>] - m[<span class="tok-num">0</span>], s.t_end[<span class="tok-num">1</span>] - m[<span class="tok-num">1</span>] };
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (m[<span class="tok-num">0</span>] &gt;= wsx0 - <span class="tok-num">14</span> <span class="tok-kw">and</span> m[<span class="tok-num">0</span>] &lt;= wsx1 + <span class="tok-num">14</span> <span class="tok-kw">and</span> m[<span class="tok-num">1</span>] &gt;= sy - <span class="tok-num">20</span> <span class="tok-kw">and</span> m[<span class="tok-num">1</span>] &lt;= sy + <span class="tok-num">20</span>) {
            s.drag = drag_width;
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (m[<span class="tok-num">0</span>] &gt;= ssx0 - <span class="tok-num">14</span> <span class="tok-kw">and</span> m[<span class="tok-num">0</span>] &lt;= ssx1 + <span class="tok-num">14</span> <span class="tok-kw">and</span> m[<span class="tok-num">1</span>] &gt;= sy - <span class="tok-num">20</span> <span class="tok-kw">and</span> m[<span class="tok-num">1</span>] &lt;= sy + <span class="tok-num">20</span>) {
            s.drag = drag_segs;
        } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (<span class="tok-fn">pointInRect</span>(m, toggle)) {
            s.show_curve = !s.show_curve;
            s.drag = drag_none;
        } <span class="tok-kw">else</span> {
            s.drag = drag_none;
        }
    }
    <span class="tok-kw">if</span> (!down) {
        s.drag = drag_none;
    }

    <span class="tok-kw">if</span> (down) {
        <span class="tok-comment">// Position-based drag: point tracks the finger via the grab offset, so</span>
        <span class="tok-comment">// there is no first-frame jump and no coordinate-scale dependence.</span>
        <span class="tok-kw">const</span> target: Vec2 = .{ m[<span class="tok-num">0</span>] + s.grab_off[<span class="tok-num">0</span>], m[<span class="tok-num">1</span>] + s.grab_off[<span class="tok-num">1</span>] };
        <span class="tok-kw">switch</span> (s.drag) {
            <span class="tok-num">0</span> =&gt; s.p_start = target,
            <span class="tok-num">1</span> =&gt; s.t_start = target,
            <span class="tok-num">2</span> =&gt; s.p_end = target,
            <span class="tok-num">3</span> =&gt; s.t_end = target,
            <span class="tok-kw">else</span> =&gt; {},
        }
    }

    <span class="tok-comment">// ---- draw the ribbon first (under the handles) ----</span>
    <span class="tok-fn">drawTexturedCurve</span>(f, s);

    <span class="tok-comment">// optional reference Bezier as a sampled polyline</span>
    <span class="tok-kw">if</span> (s.show_curve) {
        <span class="tok-kw">var</span> prev: Vec2 = s.p_start;
        <span class="tok-kw">var</span> k: i32 = <span class="tok-num">1</span>;
        <span class="tok-kw">while</span> (k &lt;= <span class="tok-num">32</span>) : (k += <span class="tok-num">1</span>) {
            <span class="tok-kw">const</span> t: f32 = <span class="tok-fn">float</span>(k) / <span class="tok-num">32.0</span>;
            <span class="tok-kw">const</span> omt: f32 = <span class="tok-num">1.0</span> - t;
            <span class="tok-kw">const</span> a: f32 = omt * omt * omt;
            <span class="tok-kw">const</span> b: f32 = <span class="tok-num">3</span> * omt * omt * t;
            <span class="tok-kw">const</span> c: f32 = <span class="tok-num">3</span> * omt * t * t;
            <span class="tok-kw">const</span> d: f32 = t * t * t;
            <span class="tok-kw">const</span> cur: Vec2 = .{
                a * s.p_start[<span class="tok-num">0</span>] + b * s.t_start[<span class="tok-num">0</span>] + c * s.t_end[<span class="tok-num">0</span>] + d * s.p_end[<span class="tok-num">0</span>],
                a * s.p_start[<span class="tok-num">1</span>] + b * s.t_start[<span class="tok-num">1</span>] + c * s.t_end[<span class="tok-num">1</span>] + d * s.p_end[<span class="tok-num">1</span>],
            };
            f.gl.<span class="tok-fn">line</span>(prev, cur, .{ .color = blue, .thickness = <span class="tok-num">2</span> });
            prev = cur;
        }
    }

    <span class="tok-comment">// tangent guide lines</span>
    f.gl.<span class="tok-fn">line</span>(s.p_start, s.t_start, .{ .color = skyblue, .thickness = <span class="tok-num">2</span> });
    f.gl.<span class="tok-fn">line</span>(s.t_start, s.t_end, .{ .color = lightgray_fade, .thickness = <span class="tok-num">2</span> });
    f.gl.<span class="tok-fn">line</span>(s.p_end, s.t_end, .{ .color = purple, .thickness = <span class="tok-num">2</span> });

    <span class="tok-comment">// control-point handles (highlight the hovered one)</span>
    <span class="tok-fn">drawHandle</span>(f, m, s.p_start, red);
    <span class="tok-fn">drawHandle</span>(f, m, s.t_start, maroon);
    <span class="tok-fn">drawHandle</span>(f, m, s.p_end, green);
    <span class="tok-fn">drawHandle</span>(f, m, s.t_end, darkgreen);

    <span class="tok-comment">// ---- widgets ----</span>
    s.width = <span class="tok-fn">slider</span>(f, wsx0, wsx1, sy, s.width, <span class="tok-num">2</span>, <span class="tok-num">120</span>, s.drag == drag_width);
    <span class="tok-kw">const</span> seg_f: f32 = <span class="tok-fn">slider</span>(f, ssx0, ssx1, sy, <span class="tok-fn">float</span>(s.segments), <span class="tok-num">2</span>, <span class="tok-num">64</span>, s.drag == drag_segs);
    s.segments = <span class="tok-builtin">@round</span>(seg_f);

    <span class="tok-comment">// toggle box</span>
    f.gl.<span class="tok-fn">rect</span>(toggle, .{ .color = <span class="tok-kw">if</span> (s.show_curve) skyblue <span class="tok-kw">else</span> surface });
    f.gl.<span class="tok-fn">rect</span>(
        .{ .x = toggle.x, .y = toggle.y, .width = toggle.width, .height = toggle.height },
        .{ .color = ink, .outline = <span class="tok-num">1.0</span> },
    );
    f.gl.<span class="tok-fn">text</span>(.{ toggle.x + <span class="tok-num">8</span>, toggle.y + <span class="tok-num">6</span> }, <span class="tok-str">"show base curve"</span>, .{ .size = <span class="tok-num">14</span>, .color = ink, .font = &amp;s.font });

    <span class="tok-kw">var</span> buf: [<span class="tok-num">96</span>]u8 = undefined;
    <span class="tok-kw">const</span> info: []<span class="tok-kw">const</span> u8 = <span class="tok-fn">bufPrint</span>(&amp;buf, <span class="tok-str">"width {d:.0}   segments {d}"</span>, .{ s.width, s.segments }) <span class="tok-kw">catch</span> <span class="tok-str">""</span>;
    f.gl.<span class="tok-fn">text</span>(.{ w * <span class="tok-num">0.06</span>, h - <span class="tok-num">62</span> }, info, .{ .size = <span class="tok-num">16</span>, .color = darkgray, .font = &amp;s.font });

    <span class="tok-comment">// Diagnostic: a small crosshair at the reported pointer position. If it</span>
    <span class="tok-comment">// does not sit under the finger, input and drawing are in different scales.</span>
    <span class="tok-kw">if</span> (down) {
        f.gl.<span class="tok-fn">line</span>(.{ m[<span class="tok-num">0</span>] - <span class="tok-num">12</span>, m[<span class="tok-num">1</span>] }, .{ m[<span class="tok-num">0</span>] + <span class="tok-num">12</span>, m[<span class="tok-num">1</span>] }, .{ .color = red, .thickness = <span class="tok-num">1.5</span> });
        f.gl.<span class="tok-fn">line</span>(.{ m[<span class="tok-num">0</span>], m[<span class="tok-num">1</span>] - <span class="tok-num">12</span> }, .{ m[<span class="tok-num">0</span>], m[<span class="tok-num">1</span>] + <span class="tok-num">12</span> }, .{ .color = red, .thickness = <span class="tok-num">1.5</span> });
    }

    common.<span class="tok-fn">caption</span>(f.gl, s.font, <span class="tok-str">"textured curve - drag the four points; sliders set width &amp; segments"</span>);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawHandle</span>(f: *z.Frame, m: Vec2, p: Vec2, col: Color) void {
    <span class="tok-kw">if</span> (<span class="tok-fn">hit</span>(m, p, <span class="tok-num">8</span>)) {
        f.gl.<span class="tok-fn">circle</span>(p, <span class="tok-num">8</span>, .{ .color = yellow_hi, .segments = <span class="tok-num">16</span> });
    }
    f.gl.<span class="tok-fn">circle</span>(p, <span class="tok-num">5</span>, .{ .color = col, .segments = <span class="tok-num">16</span> });
}

<span class="tok-comment">// small local Rectangle helpers (types.Rectangle via z)</span>
<span class="tok-kw">fn</span> <span class="tok-fn">z_rect</span>(x: f32, y: f32, w: f32, h: f32) z.Rectangle {
    <span class="tok-kw">return</span> .{ .x = x, .y = y, .width = w, .height = h };
}
<span class="tok-kw">fn</span> <span class="tok-fn">pointInRect</span>(m: Vec2, r: z.Rectangle) bool {
    <span class="tok-kw">return</span> m[<span class="tok-num">0</span>] &gt;= r.x <span class="tok-kw">and</span> m[<span class="tok-num">0</span>] &lt;= r.x + r.width <span class="tok-kw">and</span> m[<span class="tok-num">1</span>] &gt;= r.y <span class="tok-kw">and</span> m[<span class="tok-num">1</span>] &lt;= r.y + r.height;
}
