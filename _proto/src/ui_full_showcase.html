<style>
:root{
  /* two surfaces, one ink */
  --bg:#0a0a0a;          /* the page */

  --panel-2:#1b1b1b;     /* a panel on a panel (figcaption, summary) */
  --fg:#e8e8e8;          /* body text */

  --faint:#6b7280;       /* labels, line numbers, table headers */

  /* tokens — the one set, shared by the Zig and WGSL highlighters */
  --tok-comment:#6b7a8c;

  --tok-str:#9ad08a;
  --tok-num:#f5a35e;
  --tok-type:#6fb6ff;
  --tok-builtin:#e9a23b;

}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{

}

p{margin:0 0 1.1em;}
a{color:var(--link);text-decoration:none;border-bottom:1px solid var(--rule);}

pre{

  overflow-x:auto;font-size:13px;line-height:1.6;
}
pre,code,kbd,samp{font-family:var(--mono);}
pre code{background:none;padding:0;border:0;font-size:inherit;color:var(--fg);}
code{background:var(--panel);padding:.1em .35em;border-radius:2px;font-size:.92em;color:#fff;}
.tok-comment{color:var(--tok-comment);font-style:italic;}
.tok-kw{color:var(--tok-kw);}
.tok-fn{color:var(--tok-fn);}
.tok-str{color:var(--tok-str);}
.tok-num{color:var(--tok-num);}
.tok-type{color:var(--tok-type);}

/* a captioned code block: <figure class="code"><figcaption>… */
figure{margin:1.3em 0;}

figure.code figcaption{
  background:var(--panel-2);border:1px solid var(--rule);border-bottom:0;

  display:flex;justify-content:space-between;gap:1em;
}

figure.code pre{margin:0;border-radius:0 0 3px 3px;}
/* folds — pure CSS, no JS. The summary text is just the name; the prose
   comes from ::before, which is zimrnum-tutorial's trick and a good one. */
details{border:1px solid var(--rule);border-radius:3px;margin:.5em 0;background:var(--panel);}
details[open]{background:var(--bg);}
summary{
  cursor:pointer;padding:.4em .8em;color:var(--dim);font-size:.9em;
  list-style:none;user-select:none;
}
summary::-webkit-details-marker{display:none;}
summary::before{content:"\\25b8\\00a0";color:var(--faint);}
details[open]>summary::before{content:"\\25be\\00a0";}
summary:hover{color:var(--fg);}
details>pre{margin:0;border:0;border-top:1px solid var(--rule);border-radius:0;}
.src-fold>summary::after{content:" \\2014 source";color:var(--faint);}
/* callouts — one box, a coloured left rule says which kind */
.note,.warn,.good,.bad{

}
.note{border-left-color:var(--tok-fn);}

table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:13px;}
th,td{border:1px solid var(--rule);padding:.45em .7em;text-align:left;vertical-align:top;}

.split-cpu{background:var(--bg);}

}

.lesson-title{font-weight:700;color:#fff;}

/* page furniture: the landing page and the tutorials' own scaffolding */
.blog-container,.wrap,.max{max-width:var(--maxw);margin:0 auto;}
.title{font-size:1.8rem;margin:0 0 .2em;}
.subtitle,.lede,.sub{

}

.fn{margin:1.1em 0;}

.sketch{color:var(--dim);}
.pane{border:1px solid var(--rule);border-radius:3px;margin:1.1em 0;}

}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);

}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>), <span class="tok-num">22</span>);
    s.* = .{ .font = font, .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, font) };
    <span class="tok-comment">// Seed tables panel with 80 synthetic builds.</span>
    <span class="tok-kw">var</span> rng: std.Random.DefaultPrng = std.Random.DefaultPrng.<span class="tok-fn">init</span>(<span class="tok-num">0xc1c1eaf</span>);
    <span class="tok-kw">const</span> r: std.Random = rng.<span class="tok-fn">random</span>();
    <span class="tok-kw">const</span> branches = [_][]<span class="tok-kw">const</span> u8{
        <span class="tok-str">"main"</span>,
        <span class="tok-str">"feature/x"</span>,
        <span class="tok-str">"bugfix/123"</span>,
        <span class="tok-str">"release-1.4"</span>,
        <span class="tok-str">"deps-bump"</span>,
        <span class="tok-str">"perf-pass"</span>,
        <span class="tok-str">"feature/auth"</span>,
        <span class="tok-str">"hotfix"</span>,
    };
    <span class="tok-kw">for</span> (&amp;s.tables.builds, <span class="tok-num">0</span>..) |*b, i| {
        b.id = <span class="tok-builtin">@intCast</span>(i + <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> br: []<span class="tok-kw">const</span> u8 = branches[i % branches.len];
        <span class="tok-kw">const</span> written: []u8 = <span class="tok-fn">bufPrint</span>(&amp;b.name_buf, <span class="tok-str">"{s}#{d}"</span>, .{ br, b.id }) <span class="tok-kw">catch</span> b.name_buf[<span class="tok-num">0</span>..<span class="tok-num">0</span>];
        b.name_len = written.len;
        <span class="tok-kw">const</span> roll: u8 = r.<span class="tok-fn">intRangeAtMost</span>(u8, <span class="tok-num">0</span>, <span class="tok-num">99</span>);
        b.status = <span class="tok-kw">if</span> (roll &lt; <span class="tok-num">55</span>) .passed <span class="tok-kw">else</span> <span class="tok-kw">if</span> (roll &lt; <span class="tok-num">75</span>) .failed <span class="tok-kw">else</span> <span class="tok-kw">if</span> (roll &lt; <span class="tok-num">90</span>) .running <span class="tok-kw">else</span> .queued;
        b.duration_s = <span class="tok-kw">if</span> (b.status == .queued) <span class="tok-num">0</span> <span class="tok-kw">else</span> r.<span class="tok-fn">intRangeAtMost</span>(i32, <span class="tok-num">15</span>, <span class="tok-num">1800</span>);
    }
    s.tables.initialized = true;

    <span class="tok-comment">// Seed drag-drop chips: 9 work items spread across lanes.</span>
    <span class="tok-kw">const</span> chip_titles = [_]<span class="tok-kw">struct</span> { title: []<span class="tok-kw">const</span> u8, lane: Lane }{
        .{ .title = <span class="tok-str">"Write spec"</span>, .lane = .todo },
        .{ .title = <span class="tok-str">"Pick framework"</span>, .lane = .todo },
        .{ .title = <span class="tok-str">"Draft RFC"</span>, .lane = .todo },
        .{ .title = <span class="tok-str">"Prototype API"</span>, .lane = .doing },
        .{ .title = <span class="tok-str">"Wire tests"</span>, .lane = .doing },
        .{ .title = <span class="tok-str">"Profile hot path"</span>, .lane = .doing },
        .{ .title = <span class="tok-str">"Setup CI"</span>, .lane = .done },
        .{ .title = <span class="tok-str">"Pick logo color"</span>, .lane = .done },
        .{ .title = <span class="tok-str">"File issue"</span>, .lane = .done },
    };
    <span class="tok-kw">for</span> (&amp;s.drag_drop.chips, chip_titles, <span class="tok-num">0</span>..) |*c, t, i| {
        c.id = <span class="tok-builtin">@intCast</span>(i + <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> written: []u8 = <span class="tok-fn">bufPrint</span>(&amp;c.title_buf, <span class="tok-str">"{s}"</span>, .{t.title}) <span class="tok-kw">catch</span> c.title_buf[<span class="tok-num">0</span>..<span class="tok-num">0</span>];
        c.title_len = written.len;
        c.lane = t.lane;
    }
    s.drag_drop.initialized = true;
}

<span class="tok-kw">fn</span> <span class="tok-fn">sortBuilds</span>(
    specs: *<span class="tok-kw">const</span> ui.TableSortSpecs,
    a: Build,
    b: Build,
) bool {
    <span class="tok-kw">for</span> (specs.<span class="tok-fn">items</span>()) |spec| {
        <span class="tok-kw">const</span> ord: i32 = <span class="tok-kw">switch</span> (spec.column_index) {
            <span class="tok-num">0</span> =&gt; <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(a.id)) - <span class="tok-builtin">@as</span>(i32, <span class="tok-builtin">@intCast</span>(b.id)),
            <span class="tok-num">1</span> =&gt; <span class="tok-kw">switch</span> (std.mem.<span class="tok-fn">order</span>(u8, a.<span class="tok-fn">name</span>(), b.<span class="tok-fn">name</span>())) {
                .lt =&gt; -<span class="tok-num">1</span>,
                .gt =&gt; <span class="tok-num">1</span>,
                .eq =&gt; <span class="tok-num">0</span>,
            },
            <span class="tok-num">2</span> =&gt; a.status.<span class="tok-fn">sortRank</span>() - b.status.<span class="tok-fn">sortRank</span>(),
            <span class="tok-num">3</span> =&gt; a.duration_s - b.duration_s,
            <span class="tok-kw">else</span> =&gt; <span class="tok-num">0</span>,
        };
        <span class="tok-kw">if</span> (ord != <span class="tok-num">0</span>) {
            <span class="tok-kw">return</span> <span class="tok-kw">switch</span> (spec.direction) {
                .ascending =&gt; ord &lt; <span class="tok-num">0</span>,
                .descending =&gt; ord &gt; <span class="tok-num">0</span>,
            };
        }
    }
    <span class="tok-kw">return</span> false;
}

<span class="tok-kw">fn</span> <span class="tok-fn">panelTables</span>(u: ui.Ui, s: *TablesState) void {
    u.<span class="tok-fn">text</span>(<span class="tok-str">"Tables: layout + headers + multi-key sort + scroll + sticky header + row tints"</span>, .{});
    u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Click a header to sort.  Shift-click to add a tie-breaker.  Wheel-over to scroll."</span>, .{});

    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"striped"</span>, &amp;s.show_striped);
    u.<span class="tok-fn">sameLine</span>(.{});
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"highlight failures"</span>, &amp;s.show_highlight);
    u.<span class="tok-fn">sameLine</span>(.{});
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"borders"</span>, &amp;s.show_borders);
    _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"table height"</span>, &amp;s.table_height, .{ .min = <span class="tok-num">200</span>, .max = <span class="tok-num">500</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });

    <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTable</span>(<span class="tok-str">"capstone-builds"</span>, <span class="tok-num">4</span>, .{
        .borders = s.show_borders,
        .outer_height = s.table_height,
        .freeze_rows = <span class="tok-num">1</span>,
        .row_bg = s.show_striped,
    })) {
        u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Build"</span>, .{ .sizing = .fixed, .width = <span class="tok-num">70</span> });
        u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Name"</span>, .{ .sizing = .stretch });
        u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Status"</span>, .{ .sizing = .fixed, .width = <span class="tok-num">100</span> });
        u.<span class="tok-fn">tableSetupColumn</span>(<span class="tok-str">"Duration"</span>, .{ .sizing = .fixed, .width = <span class="tok-num">100</span> });

        u.<span class="tok-fn">tableHeadersRow</span>();
        <span class="tok-kw">if</span> (u.<span class="tok-fn">tableGetSortSpecs</span>()) |specs| {
            std.mem.<span class="tok-fn">sort</span>(Build, &amp;s.builds, specs, sortBuilds);
        }

        <span class="tok-kw">for</span> (s.builds) |b| {
            u.<span class="tok-fn">tableNextRow</span>();
            <span class="tok-kw">if</span> (s.show_highlight) {
                <span class="tok-kw">switch</span> (b.status) {
                    .failed =&gt; u.<span class="tok-fn">tableSetRowBgColor</span>(.{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">60</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">50</span> }),
                    .running =&gt; u.<span class="tok-fn">tableSetRowBgColor</span>(.{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">180</span>, .b = <span class="tok-num">40</span>, .a = <span class="tok-num">60</span> }),
                    <span class="tok-kw">else</span> =&gt; {},
                }
            }
            _ = u.<span class="tok-fn">tableNextColumn</span>();
            u.<span class="tok-fn">text</span>(<span class="tok-str">"#{d}"</span>, .{b.id});
            _ = u.<span class="tok-fn">tableNextColumn</span>();
            u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{b.<span class="tok-fn">name</span>()});
            _ = u.<span class="tok-fn">tableNextColumn</span>();
            u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{b.status.<span class="tok-fn">label</span>()});
            _ = u.<span class="tok-fn">tableNextColumn</span>();
            <span class="tok-kw">if</span> (b.duration_s == <span class="tok-num">0</span>) {
                u.<span class="tok-fn">text</span>(<span class="tok-str">"--"</span>, .{});
            } <span class="tok-kw">else</span> {
                <span class="tok-kw">const</span> m: i32 = <span class="tok-builtin">@divTrunc</span>(b.duration_s, <span class="tok-num">60</span>);
                <span class="tok-kw">const</span> sec: i32 = <span class="tok-builtin">@mod</span>(b.duration_s, <span class="tok-num">60</span>);
                u.<span class="tok-fn">text</span>(<span class="tok-str">"{d}m{d:0&gt;2}s"</span>, .{ m, sec });
            }
        }
        u.<span class="tok-fn">endTable</span>();
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">panelPlots</span>(
    u: ui.Ui,
    s: *PlotsState,
    dt: f32,
) void {
    <span class="tok-comment">// Update the live FPS + sine ring buffers.</span>
    <span class="tok-kw">const</span> fps: f32 = <span class="tok-kw">if</span> (dt &gt; <span class="tok-num">0</span>) <span class="tok-num">1.0</span> / dt <span class="tok-kw">else</span> <span class="tok-num">60.0</span>;
    s.fps_hist[s.fps_idx] = fps;
    s.fps_idx = (s.fps_idx + <span class="tok-num">1</span>) % s.fps_hist.len;

    s.sine_phase += dt * <span class="tok-num">1.5</span>;
    s.sine_hist[s.sine_idx] = <span class="tok-fn">sinRad</span>(s.sine_phase) * <span class="tok-num">0.5</span> + <span class="tok-num">0.5</span>;
    s.sine_idx = (s.sine_idx + <span class="tok-num">1</span>) % s.sine_hist.len;

    u.<span class="tok-fn">text</span>(<span class="tok-str">"Sparkline plots - plotLines + plotHistogram"</span>, .{});
    u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Hover any plot for the per-sample readout."</span>, .{});
    u.<span class="tok-fn">separator</span>();

    <span class="tok-kw">var</span> overlay_buf: [<span class="tok-num">32</span>]u8 = undefined;
    <span class="tok-kw">const</span> fps_overlay: []u8 = <span class="tok-fn">bufPrint</span>(&amp;overlay_buf, <span class="tok-str">"FPS {d:.1}"</span>, .{fps}) <span class="tok-kw">catch</span> overlay_buf[<span class="tok-num">0</span>..<span class="tok-num">0</span>];
    u.<span class="tok-fn">plotLines</span>(<span class="tok-str">"Live FPS (last 120 frames)"</span>, &amp;s.fps_hist, .{
        .overlay = fps_overlay,
        .min = <span class="tok-num">0</span>,
        .max = <span class="tok-num">120</span>,
        .height = <span class="tok-num">80</span>,
    });

    u.<span class="tok-fn">plotLines</span>(<span class="tok-str">"Sine wave (animated)"</span>, &amp;s.sine_hist, .{
        .min = <span class="tok-num">0</span>,
        .max = <span class="tok-num">1</span>,
        .height = <span class="tok-num">60</span>,
    });

    u.<span class="tok-fn">plotHistogram</span>(<span class="tok-str">"Static histogram (12 bins)"</span>, &amp;s.histogram_bins, .{
        .height = <span class="tok-num">80</span>,
    });

    u.<span class="tok-fn">separator</span>();

    <span class="tok-comment">// ---- beginTooltip block ----</span>
    u.<span class="tok-fn">text</span>(<span class="tok-str">"beginTooltip block API:"</span>, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Hover for a multi-widget tooltip"</span>, .{})) {}
    <span class="tok-kw">if</span> (u.<span class="tok-fn">isItemHovered</span>(.{})) {
        u.<span class="tok-fn">beginTooltip</span>();
        <span class="tok-kw">defer</span> u.<span class="tok-fn">endTooltip</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"This tooltip uses the BLOCK API."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"(setTooltip is single-line; beginTooltip lets you"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"stack arbitrary widgets - text, swatches, sparklines.)"</span>, .{});
        u.<span class="tok-fn">separator</span>();
        u.<span class="tok-fn">textColored</span>(.{ .r = <span class="tok-num">251</span>, .g = <span class="tok-num">191</span>, .b = <span class="tok-num">36</span>, .a = <span class="tok-num">255</span> }, <span class="tok-str">"Live FPS history:"</span>, .{});
        u.<span class="tok-fn">plotLines</span>(<span class="tok-str">"##tt-fps"</span>, &amp;s.fps_hist, .{ .height = <span class="tok-num">40</span>, .width = <span class="tok-num">200</span> });
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">panelDrawing</span>(u: ui.Ui, s: *DrawingState) void {
    u.<span class="tok-fn">text</span>(<span class="tok-str">"DrawList primitives - every shape op, live tweakable."</span>, .{});
    u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Tweak thickness + segment counts; shapes update live."</span>, .{});

    _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"line thickness"</span>, &amp;s.line_thickness, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">8</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
    _ = u.<span class="tok-fn">drag</span>(<span class="tok-str">"circle segments (0=auto)"</span>, &amp;s.circle_segments, .{ .speed = <span class="tok-num">1</span>, .min = <span class="tok-num">0</span>, .max = <span class="tok-num">64</span>, .fmt = <span class="tok-str">"{d}"</span> });
    _ = u.<span class="tok-fn">drag</span>(<span class="tok-str">"bezier segments (0=auto)"</span>, &amp;s.bezier_segments, .{ .speed = <span class="tok-num">1</span>, .min = <span class="tok-num">0</span>, .max = <span class="tok-num">64</span>, .fmt = <span class="tok-str">"{d}"</span> });

    u.<span class="tok-fn">separator</span>();

    <span class="tok-kw">const</span> dl: *ui.DrawList = u.<span class="tok-fn">getDrawList</span>() <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">const</span> alloc: Allocator = u.<span class="tok-fn">drawListAllocator</span>();
    <span class="tok-kw">const</span> origin: Vec2 = u.<span class="tok-fn">getCursorScreenPos</span>();

    <span class="tok-comment">// Reserve canvas space.  4-column grid, 2 rows.</span>
    <span class="tok-kw">const</span> cell_w: f32 = <span class="tok-num">130</span>;
    <span class="tok-kw">const</span> cell_h: f32 = <span class="tok-num">110</span>;
    <span class="tok-kw">const</span> cols: usize = <span class="tok-num">4</span>;
    <span class="tok-kw">const</span> rows: usize = <span class="tok-num">2</span>;
    <span class="tok-kw">const</span> canvas_w: f32 = cell_w * <span class="tok-fn">float</span>(cols);
    <span class="tok-kw">const</span> canvas_h: f32 = cell_h * <span class="tok-fn">float</span>(rows);
    u.<span class="tok-fn">dummy</span>(.{ canvas_w, canvas_h });

    <span class="tok-comment">// Palette.</span>
    <span class="tok-kw">const</span> red: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">239</span>, .g = <span class="tok-num">68</span>, .b = <span class="tok-num">68</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> sky: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">56</span>, .g = <span class="tok-num">189</span>, .b = <span class="tok-num">248</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> amber: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">245</span>, .g = <span class="tok-num">158</span>, .b = <span class="tok-num">11</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> lime: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">132</span>, .g = <span class="tok-num">204</span>, .b = <span class="tok-num">22</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> violet: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">168</span>, .g = <span class="tok-num">85</span>, .b = <span class="tok-num">247</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> cyan: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">34</span>, .g = <span class="tok-num">211</span>, .b = <span class="tok-num">238</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> pink: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">236</span>, .g = <span class="tok-num">72</span>, .b = <span class="tok-num">153</span>, .a = <span class="tok-num">255</span> });
    <span class="tok-kw">const</span> white: u32 = <span class="tok-fn">pack</span>(.{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">240</span>, .b = <span class="tok-num">240</span>, .a = <span class="tok-num">255</span> });

    <span class="tok-kw">const</span> margin: f32 = <span class="tok-num">10</span>;
    <span class="tok-kw">var</span> idx: usize = <span class="tok-num">0</span>;

    <span class="tok-comment">// Helper for cell-relative coords.</span>
    <span class="tok-kw">const</span> cellAt = <span class="tok-kw">struct</span> {
        <span class="tok-kw">fn</span> <span class="tok-fn">at</span>(o: Vec2, cw: f32, ch: f32, i: usize, ncols: usize) Vec2 {
            <span class="tok-kw">const</span> c: f32 = <span class="tok-fn">float</span>(i % ncols);
            <span class="tok-kw">const</span> r: f32 = <span class="tok-fn">float</span>(i / ncols);
            <span class="tok-kw">return</span> .{ o[<span class="tok-num">0</span>] + c * cw, o[<span class="tok-num">1</span>] + r * ch };
        }
    }.at;

    <span class="tok-comment">// 1. Line</span>
    {
        <span class="tok-kw">const</span> p: Vec2 = <span class="tok-fn">cellAt</span>(origin, cell_w, cell_h, idx, cols);
        dl.<span class="tok-fn">addLine</span>(
            alloc,
            .{ p[<span class="tok-num">0</span>] + margin, p[<span class="tok-num">1</span>] + margin },
            .{ p[<span class="tok-num">0</span>] + cell_w - margin, p[<span class="tok-num">1</span>] + cell_h - margin },
            red,
            s.line_thickness,
        );
        idx += <span class="tok-num">1</span>;
    }
    <span class="tok-comment">// 2. Rect outline</span>
    {
        <span class="tok-kw">const</span> p: Vec2 = <span class="tok-fn">cellAt</span>(origin, cell_w, cell_h, idx, cols);
        dl.<span class="tok-fn">addRectOutline</span>(
            alloc,
            .{ .x = p[<span class="tok-num">0</span>] + margin, .y = p[<span class="tok-num">1</span>] + margin, .width = cell_w - <span class="tok-num">2</span> * margin, .height = cell_h - <span class="tok-num">2</span> * margin },
            sky,
        );
        idx += <span class="tok-num">1</span>;
    }
    <span class="tok-comment">// 3. Rect filled</span>
    {
        <span class="tok-kw">const</span> p: Vec2 = <span class="tok-fn">cellAt</span>(origin, cell_w, cell_h, idx, cols);
        dl.<span class="tok-fn">addRectFilled</span>(
            alloc,
            .{ .x = p[<span class="tok-num">0</span>] + margin, .y = p[<span class="tok-num">1</span>] + margin, .width = cell_w - <span class="tok-num">2</span> * margin, .height = cell_h - <span class="tok-num">2</span> * margin },
            amber,
        );
        idx += <span class="tok-num">1</span>;
    }
    <span class="tok-comment">// 4. Circle (outline)</span>
    {
        <span class="tok-kw">const</span> p: Vec2 = <span class="tok-fn">cellAt</span>(origin, cell_w, cell_h, idx, cols);
        <span class="tok-kw">const</span> segs: u32 = <span class="tok-builtin">@intCast</span>(s.circle_segments);
        dl.<span class="tok-fn">addCircle</span>(
            alloc,
            .{ p[<span class="tok-num">0</span>] + cell_w * <span class="tok-num">0.5</span>, p[<span class="tok-num">1</span>] + cell_h * <span class="tok-num">0.5</span> },
            (cell_h - <span class="tok-num">2</span> * margin) * <span class="tok-num">0.5</span>,
            lime,
            s.line_thickness,
            segs,
        );
        idx += <span class="tok-num">1</span>;
    }
    <span class="tok-comment">// 5. Circle filled</span>
    {
        <span class="tok-kw">const</span> p: Vec2 = <span class="tok-fn">cellAt</span>(origin, cell_w, cell_h, idx, cols);
        <span class="tok-kw">const</span> segs: u32 = <span class="tok-builtin">@intCast</span>(s.circle_segments);
        dl.<span class="tok-fn">addCircleFilled</span>(
            alloc,
            .{ p[<span class="tok-num">0</span>] + cell_w * <span class="tok-num">0.5</span>, p[<span class="tok-num">1</span>] + cell_h * <span class="tok-num">0.5</span> },
            (cell_h - <span class="tok-num">2</span> * margin) * <span class="tok-num">0.5</span>,
            violet,
            segs,
        );
        idx += <span class="tok-num">1</span>;
    }
    <span class="tok-comment">// 6. Triangle filled</span>
    {
        <span class="tok-kw">const</span> p: Vec2 = <span class="tok-fn">cellAt</span>(origin, cell_w, cell_h, idx, cols);
        <span class="tok-kw">const</span> cx: f32 = p[<span class="tok-num">0</span>] + cell_w * <span class="tok-num">0.5</span>;
        <span class="tok-kw">const</span> cy: f32 = p[<span class="tok-num">1</span>] + cell_h * <span class="tok-num">0.5</span>;
        <span class="tok-kw">const</span> r: f32 = (cell_h - <span class="tok-num">2</span> * margin) * <span class="tok-num">0.5</span>;
        dl.<span class="tok-fn">addTriangleFilled</span>(
            alloc,
            .{ cx, cy - r },
            .{ cx + r * <span class="tok-num">0.866</span>, cy + r * <span class="tok-num">0.5</span> },
            .{ cx - r * <span class="tok-num">0.866</span>, cy + r * <span class="tok-num">0.5</span> },
            cyan,
        );
        idx += <span class="tok-num">1</span>;
    }
    <span class="tok-comment">// 7. Polyline (zig-zag)</span>
    {
        <span class="tok-kw">const</span> p: Vec2 = <span class="tok-fn">cellAt</span>(origin, cell_w, cell_h, idx, cols);
        <span class="tok-kw">const</span> pts = [_]Vec2{
            .{ p[<span class="tok-num">0</span>] + margin, p[<span class="tok-num">1</span>] + cell_h - margin },
            .{ p[<span class="tok-num">0</span>] + cell_w * <span class="tok-num">0.3</span>, p[<span class="tok-num">1</span>] + margin },
            .{ p[<span class="tok-num">0</span>] + cell_w * <span class="tok-num">0.5</span>, p[<span class="tok-num">1</span>] + cell_h - margin },
            .{ p[<span class="tok-num">0</span>] + cell_w * <span class="tok-num">0.7</span>, p[<span class="tok-num">1</span>] + margin },
            .{ p[<span class="tok-num">0</span>] + cell_w - margin, p[<span class="tok-num">1</span>] + cell_h - margin },
        };
        dl.<span class="tok-fn">addPolyline</span>(alloc, &amp;pts, pink, s.line_thickness, false);
        idx += <span class="tok-num">1</span>;
    }
    <span class="tok-comment">// 8. Ellipse filled</span>
    {
        <span class="tok-kw">const</span> p: Vec2 = <span class="tok-fn">cellAt</span>(origin, cell_w, cell_h, idx, cols);
        dl.<span class="tok-fn">addEllipseFilled</span>(
            alloc,
            .{ p[<span class="tok-num">0</span>] + cell_w * <span class="tok-num">0.5</span>, p[<span class="tok-num">1</span>] + cell_h * <span class="tok-num">0.5</span> },
            (cell_w - <span class="tok-num">2</span> * margin) * <span class="tok-num">0.5</span>,
            (cell_h - <span class="tok-num">2</span> * margin) * <span class="tok-num">0.35</span>,
            white,
        );
        idx += <span class="tok-num">1</span>;
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">panelDragDrop</span>(u: ui.Ui, s: *DragDropState) void {
    u.<span class="tok-fn">text</span>(<span class="tok-str">"Drag-drop pick-and-place - 3 lanes, 9 chips.  Drag any chip between lanes."</span>, .{});
    u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Visual: dragged chip floats with the cursor; hovered lane gets a highlight ring."</span>, .{});
    u.<span class="tok-fn">separator</span>();

    <span class="tok-comment">// Process any pending move resolved this frame.  We collect the</span>
    <span class="tok-comment">// (chip_id -&gt; new_lane) intent across all targets, then apply.</span>
    <span class="tok-kw">var</span> moved_chip_id: ?u32 = null;
    <span class="tok-kw">var</span> moved_to_lane: Lane = .todo;

    <span class="tok-comment">// Lane layout: three columns side-by-side.</span>
    <span class="tok-kw">const</span> lanes = [_]Lane{ .todo, .doing, .done };
    <span class="tok-kw">const</span> start_x: f32 = u.<span class="tok-fn">getCursorPos</span>()[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> lane_w: f32 = <span class="tok-num">200</span>;
    <span class="tok-kw">const</span> lane_gap: f32 = <span class="tok-num">16</span>;
    <span class="tok-kw">const</span> start_y: f32 = u.<span class="tok-fn">getCursorPos</span>()[<span class="tok-num">1</span>];

    <span class="tok-kw">for</span> (lanes, <span class="tok-num">0</span>..) |lane, li| {
        <span class="tok-comment">// Each lane is a column.  Position the cursor explicitly so</span>
        <span class="tok-comment">// the three sit side-by-side regardless of intervening</span>
        <span class="tok-comment">// newlines from chips submitted above.</span>
        u.<span class="tok-fn">setCursorPos</span>(.{ start_x + <span class="tok-fn">float</span>(li) * (lane_w + lane_gap), start_y });

        <span class="tok-comment">// Lane header.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{lane.<span class="tok-fn">label</span>()});
        <span class="tok-comment">// Chips for this lane.</span>
        <span class="tok-kw">var</span> count: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (s.chips) |c| {
            <span class="tok-kw">if</span> (c.lane != lane) {
                <span class="tok-kw">continue</span>;
            }
            count += <span class="tok-num">1</span>;
            <span class="tok-comment">// Each chip is a draggable button.</span>
            <span class="tok-kw">const</span> payload: ChipPayload = .{ .chip_id = c.id };
            _ = u.<span class="tok-fn">button</span>(c.<span class="tok-fn">title</span>(), .{});
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginDragDropSource</span>(.{})) {
                u.<span class="tok-fn">setDragDropPayload</span>(ChipPayload, &amp;payload);
                u.<span class="tok-fn">text</span>(<span class="tok-str">"→ {s}"</span>, .{c.<span class="tok-fn">title</span>()});
                u.<span class="tok-fn">endDragDropSource</span>();
            }
        }

        <span class="tok-comment">// Lane drop target - a "dummy" widget at the bottom of the</span>
        <span class="tok-comment">// lane acting as the drop zone.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"({d} item{s})"</span>, .{ count, <span class="tok-kw">if</span> (count == <span class="tok-num">1</span>) <span class="tok-str">""</span> <span class="tok-kw">else</span> <span class="tok-str">"s"</span> });
        u.<span class="tok-fn">dummy</span>(.{ lane_w - <span class="tok-num">4</span>, <span class="tok-num">24</span> });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginDragDropTarget</span>(.{})) {
            <span class="tok-kw">if</span> (u.<span class="tok-fn">acceptDragDropPayload</span>(ChipPayload, .{})) |payload| {
                moved_chip_id = payload.chip_id;
                moved_to_lane = lane;
            }
            u.<span class="tok-fn">endDragDropTarget</span>();
        }
    }

    <span class="tok-comment">// Apply the move (after all panels processed to avoid mid-iteration mutation).</span>
    <span class="tok-kw">if</span> (moved_chip_id) |cid| {
        <span class="tok-kw">for</span> (&amp;s.chips) |*c| {
            <span class="tok-kw">if</span> (c.id == cid) {
                c.lane = moved_to_lane;
                <span class="tok-kw">break</span>;
            }
        }
    }

    <span class="tok-comment">// Reset cursor below the widest lane.</span>
    u.<span class="tok-fn">setCursorPos</span>(.{ start_x, start_y + <span class="tok-num">280</span> });
    u.<span class="tok-fn">separator</span>();
    u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Drop targets accept the typed payload only on the mouse-release frame."</span>, .{});
    u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Type tag: @typeName(ChipPayload).  Other types would be rejected at the target."</span>, .{});
}

<span class="tok-kw">fn</span> <span class="tok-fn">panelDocking</span>(u: ui.Ui, s: *DockingState) void {
    u.<span class="tok-fn">text</span>(<span class="tok-str">"Docking - split a region into resizable leaf nodes."</span>, .{});
    u.<span class="tok-fn">separator</span>();

    u.<span class="tok-fn">text</span>(<span class="tok-str">"Concepts shipped (turns 319-334):"</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"dockSpace(id, size) creates a host region."</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"dockBuilderSplitNode(parent, dir, ratio) carves leaves."</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"dockBuilderDockWindow(title, leaf_id) anchors a window."</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"dockBuilderSetCentralNode marks the always-filling leaf."</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"dockBuilderSetSizeRef pins one side at a fixed px size."</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"Drag a title bar onto a dockspace - 5-zone overlay lights up."</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"Drag a title bar AWAY from a dock leaf - smooth tear-out."</span>, .{});

    u.<span class="tok-fn">separator</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"Persistence (turn 334):"</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"Set ctx.persistence_key once - layout serializes to .zon."</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"localStorage round-trip every 60 frames in endFrame."</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"F5 refresh: pending_dock_tree grafts back into beginFrame."</span>, .{});

    u.<span class="tok-fn">separator</span>();
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"Show split visual sketch"</span>, &amp;s.show_split_visual);
    <span class="tok-kw">if</span> (s.show_split_visual) {
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Default 3-pane layout:"</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"  +----------+--------------+----------+"</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"  |  Tools   |   Viewport   |  Notes   |"</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"  |          |  (central)   |          |"</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"  +----------+--------------+----------+"</span>, .{});
    }

    u.<span class="tok-fn">separator</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"Standalone demos:"</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"ui_dock_basic - mechanics + flags + size_ref + reset."</span>, .{});
    u.<span class="tok-fn">bulletText</span>(<span class="tok-str">"ui_dock_persistence - F5-survives layout + clear button."</span>, .{});
}

<span class="tok-kw">fn</span> <span class="tok-fn">panelPolish</span>(u: ui.Ui, s: *PolishState) void {
    u.<span class="tok-fn">text</span>(<span class="tok-str">"Polish helpers - pushStyle, cursor placement, label/text variants."</span>, .{});

    <span class="tok-comment">// ---- labelText readouts ----</span>
    u.<span class="tok-fn">separator</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"labelText - value-first / label-after on the same row:"</span>, .{});
    u.<span class="tok-fn">labelText</span>(<span class="tok-str">"Health"</span>, <span class="tok-str">"{d}%"</span>, .{s.health});
    u.<span class="tok-fn">labelText</span>(<span class="tok-str">"Score"</span>, <span class="tok-str">"{d}"</span>, .{s.score});
    u.<span class="tok-fn">labelText</span>(<span class="tok-str">"Level"</span>, <span class="tok-str">"{d}"</span>, .{s.level});

    <span class="tok-comment">// ---- textDisabled hints ----</span>
    u.<span class="tok-fn">separator</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"textDisabled - dimmed for hints, captions:"</span>, .{});
    u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"(tab to next field, enter to commit)"</span>, .{});

    <span class="tok-comment">// ---- pushStyle chunky button ----</span>
    u.<span class="tok-fn">separator</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"pushStyle('frame_padding', ...) - chunky toggle:"</span>, .{});
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"chunky"</span>, &amp;s.chunky);
    <span class="tok-kw">if</span> (s.chunky) {
        u.<span class="tok-fn">pushStyle</span>(<span class="tok-str">"frame_padding"</span>, Vec2{ <span class="tok-num">14</span>, <span class="tok-num">10</span> });
    } <span class="tok-kw">else</span> {
        u.<span class="tok-fn">pushStyle</span>(<span class="tok-str">"frame_padding"</span>, Vec2{ <span class="tok-num">4</span>, <span class="tok-num">3</span> });
    }
    <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Save"</span>, .{})) {}
    u.<span class="tok-fn">sameLine</span>(.{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Load"</span>, .{})) {}
    u.<span class="tok-fn">sameLine</span>(.{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"Reset"</span>, .{})) {}
    u.<span class="tok-fn">popStyle</span>();

    <span class="tok-comment">// ---- pushStyle accent text ----</span>
    u.<span class="tok-fn">separator</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"pushStyle('text', ...) - accent-colored section:"</span>, .{});
    _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"accent section"</span>, &amp;s.accent_section);
    <span class="tok-kw">const</span> hue_labels = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"amber"</span>, <span class="tok-str">"emerald"</span>, <span class="tok-str">"sky"</span>, <span class="tok-str">"rose"</span> };
    _ = u.<span class="tok-fn">combo</span>(<span class="tok-str">"hue"</span>, &amp;s.accent_hue, &amp;hue_labels, .{});
    <span class="tok-kw">if</span> (s.accent_section) {
        <span class="tok-kw">const</span> hue_color: Color = <span class="tok-kw">switch</span> (s.accent_hue) {
            <span class="tok-num">0</span> =&gt; .{ .r = <span class="tok-num">251</span>, .g = <span class="tok-num">191</span>, .b = <span class="tok-num">36</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// amber-400</span>
            <span class="tok-num">1</span> =&gt; .{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">185</span>, .b = <span class="tok-num">129</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// emerald-500</span>
            <span class="tok-num">2</span> =&gt; .{ .r = <span class="tok-num">56</span>, .g = <span class="tok-num">189</span>, .b = <span class="tok-num">248</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// sky-400</span>
            <span class="tok-kw">else</span> =&gt; .{ .r = <span class="tok-num">244</span>, .g = <span class="tok-num">63</span>, .b = <span class="tok-num">94</span>, .a = <span class="tok-num">255</span> }, <span class="tok-comment">// rose-500</span>
        };
        u.<span class="tok-fn">pushStyle</span>(<span class="tok-str">"text"</span>, hue_color);
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Accent text - this line and the next."</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Use pushStyle around any section that should pop."</span>, .{});
        u.<span class="tok-fn">popStyle</span>();
    } <span class="tok-kw">else</span> {
        u.<span class="tok-fn">text</span>(<span class="tok-str">"(accent off - default text color)"</span>, .{});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"Same content, neutral color."</span>, .{});
    }

    <span class="tok-comment">// ---- setCursorPos corner badge ----</span>
    u.<span class="tok-fn">separator</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"setCursorPos - pixel-precise corner badge:"</span>, .{});
    <span class="tok-kw">const</span> saved: Vec2 = u.<span class="tok-fn">getCursorPos</span>();
    <span class="tok-comment">// Compute the badge position relative to the saved cursor so the</span>
    <span class="tok-comment">// badge lands consistently regardless of where the panel started.</span>
    u.<span class="tok-fn">setCursorPos</span>(.{ saved[<span class="tok-num">0</span>] + <span class="tok-num">980</span>, saved[<span class="tok-num">1</span>] - <span class="tok-num">8</span> });
    u.<span class="tok-fn">pushStyle</span>(<span class="tok-str">"text"</span>, Color{ .r = <span class="tok-num">16</span>, .g = <span class="tok-num">185</span>, .b = <span class="tok-num">129</span>, .a = <span class="tok-num">255</span> });
    u.<span class="tok-fn">text</span>(<span class="tok-str">"v2.7-alpha"</span>, .{});
    u.<span class="tok-fn">popStyle</span>();
    u.<span class="tok-fn">setCursorPos</span>(saved); <span class="tok-comment">// restore for normal flow</span>
    u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"(the badge above is positioned via setCursorPos)"</span>, .{});

    <span class="tok-comment">// ---- indent nesting ----</span>
    u.<span class="tok-fn">separator</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"indent / unindent - manual nesting outside of trees:"</span>, .{});
    u.<span class="tok-fn">indent</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"L1: one indent in"</span>, .{});
    u.<span class="tok-fn">indent</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"L2: two indents in"</span>, .{});
    u.<span class="tok-fn">indent</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"L3: three indents in"</span>, .{});
    u.<span class="tok-fn">unindent</span>();
    u.<span class="tok-fn">unindent</span>();
    u.<span class="tok-fn">unindent</span>();
    u.<span class="tok-fn">text</span>(<span class="tok-str">"Back at the root."</span>, .{});
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);

    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"zimr UI - full capstone"</span>, .{
        .initial_pos = .{ <span class="tok-num">20</span>, <span class="tok-num">20</span> },
        .initial_size = .{ <span class="tok-num">1240</span>, <span class="tok-num">760</span> },
    })) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();

        <span class="tok-comment">// Header strip.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"The complete zimr UI surface - every widget, every pattern, in one tab-navigable doc."</span>, .{});
        u.<span class="tok-fn">textDisabled</span>(<span class="tok-str">"Click a tab to switch panels.  Each panel is self-contained."</span>, .{});
        u.<span class="tok-fn">separator</span>();

        <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabBar</span>(<span class="tok-str">"capstone-tabs"</span>, .{})) {
            <span class="tok-kw">defer</span> u.<span class="tok-fn">endTabBar</span>();

            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Widgets"</span>, null, .{})) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endTabItem</span>();
                <span class="tok-fn">panelWidgets</span>(u, &amp;s.widgets);
                s.active_tab = .widgets;
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Tables"</span>, null, .{})) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endTabItem</span>();
                <span class="tok-fn">panelTables</span>(u, &amp;s.tables);
                s.active_tab = .tables;
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Plots"</span>, null, .{})) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endTabItem</span>();
                <span class="tok-fn">panelPlots</span>(u, &amp;s.plots, f.time.delta_time);
                s.active_tab = .plots;
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Drawing"</span>, null, .{})) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endTabItem</span>();
                <span class="tok-fn">panelDrawing</span>(u, &amp;s.drawing);
                s.active_tab = .drawing;
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Drag-drop"</span>, null, .{})) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endTabItem</span>();
                <span class="tok-fn">panelDragDrop</span>(u, &amp;s.drag_drop);
                s.active_tab = .drag_drop;
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Docking"</span>, null, .{})) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endTabItem</span>();
                <span class="tok-fn">panelDocking</span>(u, &amp;s.docking);
                s.active_tab = .docking;
            }
            <span class="tok-kw">if</span> (u.<span class="tok-fn">beginTabItem</span>(<span class="tok-str">"Polish"</span>, null, .{})) {
                <span class="tok-kw">defer</span> u.<span class="tok-fn">endTabItem</span>();
                <span class="tok-fn">panelPolish</span>(u, &amp;s.polish);
                s.active_tab = .polish;
            }
        }
    }
}
