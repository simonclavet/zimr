<h1>depth_writing</h1>
<figure class="code src-file" data-path="examples/depth_writing/depth_writing.zig" data-lines="495"><figcaption><span>examples/depth_writing/depth_writing.zig</span><span>495 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! depth_writing - raylib's `shaders_depth_writing`, the zimr way.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The material LIES to the depth buffer:</span>
<span class="tok-comment">//! `frag_depth = 1 - shaded.blue` (`depth_write_fs`, raylib's exact</span>
<span class="tok-comment">//! gag).  The purple cube (blue ~ 1) claims depth ~ 0 and pops in</span>
<span class="tok-comment">//! FRONT of everything; the yellow cube (blue = 0) claims depth 1 and</span>
<span class="tok-comment">//! sinks BEHIND everything; the teal cube floats between.  Real</span>
<span class="tok-comment">//! positions say otherwise, and the impossible occlusion holds up as</span>
<span class="tok-comment">//! the camera orbits - that's the whole demo.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! Upgrade over raylib: a "lie to depth" checkbox.  Off, the same</span>
<span class="tok-comment">//! three cubes draw through `fog_fs` at density 0 (an honest Lambert</span>
<span class="tok-comment">//! material on the same shared `gbuffer_vs`), so you can flip between</span>
<span class="tok-comment">//! physical occlusion and the fraud and watch exactly which edges</span>
<span class="tok-comment">//! change.  Drag orbits, pinch zooms.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;
<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);

<span class="tok-kw">const</span> Color = zm.Color;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Vec2 = zm.Vec2;
<span class="tok-kw">const</span> clamp = zm.clamp;
<span class="tok-kw">const</span> lookAtRh = zm.lookAtRh;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> perspectiveFovRh = zm.perspectiveFovRh;
<span class="tok-kw">const</span> rotationY = zm.rotationY;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> vec = zm.vec;

<span class="tok-kw">const</span> mat_vs = z.deferred_shaders.gbuffer_vs; <span class="tok-comment">// the forward-material VS</span>
<span class="tok-kw">const</span> lie_fs = z.depth_write_shader;
<span class="tok-kw">const</span> honest_fs = z.fog_shader; <span class="tok-comment">// density 0 == plain lambert+blinn</span>

<span class="tok-kw">pub</span> <span class="tok-kw">var</span> zimr_app: z.App = .{};

<span class="tok-kw">const</span> gbuffer_vs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"gbuffer_vs.wgsl"</span>);
<span class="tok-kw">const</span> depth_write_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"depth_write_fs.wgsl"</span>);
<span class="tok-kw">const</span> fog_fs_wgsl = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"fog_fs.wgsl"</span>);
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> VsUbo = <span class="tok-builtin">@FieldType</span>(mat_vs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> LieUbo = <span class="tok-builtin">@FieldType</span>(lie_fs.Io, <span class="tok-str">"u"</span>);
<span class="tok-kw">const</span> HonestUbo = <span class="tok-builtin">@FieldType</span>(honest_fs.Io, <span class="tok-str">"u"</span>);

<span class="tok-kw">const</span> bg_clear: Color = .{ .r = <span class="tok-num">26</span>, .g = <span class="tok-num">26</span>, .b = <span class="tok-num">34</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> white: Color = .{ .r = <span class="tok-num">255</span>, .g = <span class="tok-num">255</span>, .b = <span class="tok-num">255</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> sun_dir: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0.4</span>, <span class="tok-num">0.85</span>, <span class="tok-num">0.5</span> };

<span class="tok-comment">// Three cubes staggered along z so their REAL depth order (yellow</span>
<span class="tok-comment">// nearest, purple farthest at the start pose) is the OPPOSITE of what</span>
<span class="tok-comment">// the blue channel claims - maximum fraud visibility.</span>
<span class="tok-kw">const</span> Placement = <span class="tok-kw">struct</span> {
    center: [<span class="tok-num">3</span>]f32,
    half: f32,
    spin_rate: f32,
    color: [<span class="tok-num">4</span>]f32,
};
<span class="tok-kw">const</span> placements = [<span class="tok-num">3</span>]Placement{
    <span class="tok-comment">// purple: blue ~0.95 -&gt; claims FRONT</span>
    .{ .center = .{ <span class="tok-num">0.0</span>, <span class="tok-num">0.6</span>, -<span class="tok-num">1.4</span> }, .half = <span class="tok-num">0.6</span>, .spin_rate = <span class="tok-num">0.3</span>, .color = .{ <span class="tok-num">0.75</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0.95</span>, <span class="tok-num">1</span> } },
    <span class="tok-comment">// teal: mid blue -&gt; floats between</span>
    .{ .center = .{ <span class="tok-num">0.25</span>, <span class="tok-num">0.6</span>, <span class="tok-num">0.0</span> }, .half = <span class="tok-num">0.6</span>, .spin_rate = -<span class="tok-num">0.25</span>, .color = .{ <span class="tok-num">0.2</span>, <span class="tok-num">0.85</span>, <span class="tok-num">0.85</span>, <span class="tok-num">1</span> } },
    <span class="tok-comment">// yellow: blue 0 -&gt; claims BACK</span>
    .{ .center = .{ <span class="tok-num">0.5</span>, <span class="tok-num">0.6</span>, <span class="tok-num">1.4</span> }, .half = <span class="tok-num">0.6</span>, .spin_rate = <span class="tok-num">0.35</span>, .color = .{ <span class="tok-num">0.95</span>, <span class="tok-num">0.85</span>, <span class="tok-num">0.05</span>, <span class="tok-num">1</span> } },
};

<span class="tok-kw">const</span> MeshVertex = <span class="tok-kw">extern</span> <span class="tok-kw">struct</span> {
    position: [<span class="tok-num">3</span>]f32,
    normal: [<span class="tok-num">3</span>]f32,
};

<span class="tok-kw">const</span> up_n: [<span class="tok-num">3</span>]f32 = .{ <span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span> };

<span class="tok-kw">fn</span> <span class="tok-fn">uniformLayout</span>(

<span class="tok-kw">fn</span> <span class="tok-fn">makePipeline</span>(
    gpa: Allocator,
    device: z.wgpu.DeviceHandle,

        .rgba8_unorm,

    <span class="tok-kw">const</span> blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeRenderPipelineDescriptor</span>(gpa, .{
        .vertex_buffer_layouts = &amp;.{.{
            .array_stride = <span class="tok-builtin">@sizeOf</span>(MeshVertex),
            .step_mode = .vertex,
            .attributes = &amp;.{
                .{ .format = .float32x3, .offset = <span class="tok-num">0</span>, .shader_location = <span class="tok-num">0</span> },
                .{ .format = .float32x3, .offset = <span class="tok-num">12</span>, .shader_location = <span class="tok-num">1</span> },
            },
        }},
        .vs_entry_point = <span class="tok-str">"entry"</span>,
        .fs_entry_point = <span class="tok-str">"entry"</span>,
        .state = combo,

    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(blob);

}

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    <span class="tok-kw">const</span> device: z.wgpu.DeviceHandle = f.gpu.device;
    <span class="tok-kw">const</span> queue: z.wgpu.QueueHandle = f.gpu.queue;

    <span class="tok-kw">const</span> vbo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_verts[<span class="tok-num">0</span>..]),
        .{ .vertex = true, .copy_dst = true },
        <span class="tok-str">"dw_vbo"</span>,
    );
    <span class="tok-kw">const</span> ibo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBufferInit</span>(
        device,
        queue,
        std.mem.<span class="tok-fn">sliceAsBytes</span>(cube_indices[<span class="tok-num">0</span>..]),
        .{ .index = true, .copy_dst = true },
        <span class="tok-str">"dw_ibo"</span>,
    );

    <span class="tok-kw">const</span> g0_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(VsUbo), .{ .vertex = true }, <span class="tok-str">"dw_g0"</span>);
    <span class="tok-kw">const</span> lie_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(LieUbo), .{ .fragment = true }, <span class="tok-str">"dw_lie_g2"</span>);
    <span class="tok-kw">const</span> honest_bgl: z.wgpu.BindGroupLayoutHandle =
        <span class="tok-kw">try</span> <span class="tok-fn">uniformLayout</span>(gpa, device, <span class="tok-builtin">@sizeOf</span>(HonestUbo), .{ .fragment = true }, <span class="tok-str">"dw_hon_g2"</span>);
    <span class="tok-kw">const</span> empty_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupLayoutEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_blob);
    <span class="tok-kw">const</span> empty_bgl: z.wgpu.BindGroupLayoutHandle =
        z.wgpu.<span class="tok-fn">createBindGroupLayout</span>(device, empty_blob, <span class="tok-str">"dw_empty"</span>);
    <span class="tok-kw">const</span> empty_bg_blob: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">try</span> z.gpu.<span class="tok-fn">encodeBindGroupEntries</span>(gpa, &amp;.{});
    <span class="tok-kw">defer</span> gpa.<span class="tok-fn">free</span>(empty_bg_blob);
    <span class="tok-kw">const</span> empty_bg: z.wgpu.BindGroupHandle =
        z.wgpu.<span class="tok-fn">createBindGroup</span>(device, empty_bgl, empty_bg_blob, <span class="tok-str">"dw_empty_bg"</span>);

    <span class="tok-kw">const</span> vs_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, gbuffer_vs_wgsl, <span class="tok-str">"gbuffer_vs"</span>);
    <span class="tok-kw">const</span> lie_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, depth_write_fs_wgsl, <span class="tok-str">"depth_write_fs"</span>);
    <span class="tok-kw">const</span> honest_mod: z.wgpu.ShaderModuleHandle =
        z.wgpu.<span class="tok-fn">createShaderModuleWgsl</span>(device, fog_fs_wgsl, <span class="tok-str">"fog_fs"</span>);

    <span class="tok-kw">const</span> lie_pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ g0_bgl, empty_bgl, lie_bgl },
        <span class="tok-str">"dw_lie_pl"</span>,
    );
    <span class="tok-kw">const</span> honest_pl: z.wgpu.PipelineLayoutHandle = z.wgpu.<span class="tok-fn">createPipelineLayout</span>(
        device,
        &amp;.{ g0_bgl, empty_bgl, honest_bgl },
        <span class="tok-str">"dw_hon_pl"</span>,
    );

    <span class="tok-kw">var</span> objs: [<span class="tok-num">3</span>]Obj = undefined;
    <span class="tok-kw">for</span> (&amp;objs) |*obj| {
        <span class="tok-kw">const</span> vs_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = <span class="tok-builtin">@sizeOf</span>(VsUbo),
            .usage = .{ .uniform = true, .copy_dst = true },
        });
        <span class="tok-kw">const</span> lie_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = <span class="tok-builtin">@sizeOf</span>(LieUbo),
            .usage = .{ .uniform = true, .copy_dst = true },
        });
        <span class="tok-kw">const</span> honest_ubo: z.wgpu.BufferHandle = z.wgpu.<span class="tok-fn">createBuffer</span>(device, .{
            .size = <span class="tok-builtin">@sizeOf</span>(HonestUbo),
            .usage = .{ .uniform = true, .copy_dst = true },
        });
        obj.* = .{
            .vs_ubo = vs_ubo,
            .g0_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, g0_bgl, vs_ubo, <span class="tok-builtin">@sizeOf</span>(VsUbo), <span class="tok-str">"dw_g0_bg"</span>),
            .lie_ubo = lie_ubo,
            .lie_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, lie_bgl, lie_ubo, <span class="tok-builtin">@sizeOf</span>(LieUbo), <span class="tok-str">"dw_lie_bg"</span>),
            .honest_ubo = honest_ubo,
            .honest_bg = <span class="tok-kw">try</span> <span class="tok-fn">uniformBindGroup</span>(gpa, device, honest_bgl, honest_ubo, <span class="tok-builtin">@sizeOf</span>(HonestUbo), <span class="tok-str">"dw_hon_bg"</span>),
        };
    }

    <span class="tok-kw">const</span> ui_font: z.Font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.* = .{
        .gpa = gpa,
        .lie_pipeline = <span class="tok-kw">try</span> <span class="tok-fn">makePipeline</span>(gpa, device, lie_pl, vs_mod, lie_mod, <span class="tok-str">"dw_lie"</span>),
        .honest_pipeline = <span class="tok-kw">try</span> <span class="tok-fn">makePipeline</span>(gpa, device, honest_pl, vs_mod, honest_mod, <span class="tok-str">"dw_honest"</span>),
        .empty_bg = empty_bg,
        .vbo = vbo,
        .ibo = ibo,
        .objs = objs,
        .rt = .{},
        .font = ui_font,
        .ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, ui_font),
    };

    <span class="tok-comment">// Build-only intermediates: the pipelines + bind groups have been created</span>
    <span class="tok-comment">// and internalize what they reference, so these locals (never stored in</span>
    <span class="tok-comment">// State) can be released now.</span>
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(vs_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(lie_mod);
    z.wgpu.<span class="tok-fn">destroyShaderModule</span>(honest_mod);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(lie_pl);
    z.wgpu.<span class="tok-fn">destroyPipelineLayout</span>(honest_pl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(g0_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(lie_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(honest_bgl);
    z.wgpu.<span class="tok-fn">destroyBindGroupLayout</span>(empty_bgl);
}

<span class="tok-kw">fn</span> <span class="tok-fn">ensureTargets</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> backing: z.wgpu.SurfaceSize = z.wgpu.<span class="tok-fn">getSurfaceSize</span>(f.gpu.surface);
    <span class="tok-kw">const</span> bw: u32 = <span class="tok-builtin">@max</span>(backing.width, <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> bh: u32 = <span class="tok-builtin">@max</span>(backing.height, <span class="tok-num">1</span>);
    <span class="tok-kw">if</span> (s.rt.color != .invalid <span class="tok-kw">and</span> s.rt.width == bw <span class="tok-kw">and</span> s.rt.height == bh) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (s.rt.color != .invalid) {
        z.<span class="tok-fn">unloadRenderTexture</span>(f.gl, &amp;s.rt);
    }
    s.rt = z.<span class="tok-fn">loadRenderTexture</span>(f.gl, <span class="tok-builtin">@intCast</span>(bw), <span class="tok-builtin">@intCast</span>(bh));
}

<span class="tok-kw">fn</span> <span class="tok-fn">handleInput</span>(f: *z.Frame, s: *State, ui_wants_mouse: bool) void {
    <span class="tok-kw">const</span> touches: i32 = z.<span class="tok-fn">getTouchPointCount</span>(f.input);
    <span class="tok-kw">if</span> (touches &gt;= <span class="tok-num">2</span>) {
        <span class="tok-kw">const</span> a: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">0</span>);
        <span class="tok-kw">const</span> b: Vec2 = z.<span class="tok-fn">getTouchPosition</span>(f.input, <span class="tok-num">1</span>);
        <span class="tok-kw">const</span> dx: f32 = a[<span class="tok-num">0</span>] - b[<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> dy: f32 = a[<span class="tok-num">1</span>] - b[<span class="tok-num">1</span>];
        <span class="tok-kw">const</span> dist: f32 = <span class="tok-builtin">@sqrt</span>(dx * dx + dy * dy);
        <span class="tok-kw">if</span> (s.prev_pinch &gt; <span class="tok-num">0</span>) {
            s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - (dist - s.prev_pinch) * <span class="tok-num">0.02</span>, <span class="tok-num">3.5</span>, <span class="tok-num">14.0</span>);
        }
        s.prev_pinch = dist;
        <span class="tok-kw">return</span>;
    }
    s.prev_pinch = <span class="tok-num">0</span>;
    <span class="tok-kw">if</span> (z.<span class="tok-fn">isMouseButtonDown</span>(f.input, .left) <span class="tok-kw">and</span> !ui_wants_mouse) {
        <span class="tok-kw">if</span> (s.dragging) {
            <span class="tok-kw">const</span> d: Vec2 = z.<span class="tok-fn">getMouseDelta</span>(f.input);
            s.cam_yaw -= d[<span class="tok-num">0</span>] * <span class="tok-num">0.008</span>;
            s.cam_pitch = <span class="tok-fn">clamp</span>(s.cam_pitch + d[<span class="tok-num">1</span>] * <span class="tok-num">0.008</span>, <span class="tok-num">0.05</span>, <span class="tok-num">1.4</span>);
        }
        s.dragging = true;
    } <span class="tok-kw">else</span> {
        s.dragging = false;
    }
    <span class="tok-kw">const</span> wheel: f32 = z.<span class="tok-fn">getMouseWheelMove</span>(f.input);
    <span class="tok-kw">if</span> (wheel != <span class="tok-num">0</span>) {
        s.cam_dist = <span class="tok-fn">clamp</span>(s.cam_dist - wheel * <span class="tok-num">0.5</span>, <span class="tok-num">3.5</span>, <span class="tok-num">14.0</span>);
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-fn">ensureTargets</span>(f, s);
    <span class="tok-kw">const</span> t: f32 = f.time.time;
    <span class="tok-kw">const</span> vw: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">widthf</span>(), <span class="tok-num">1</span>);
    <span class="tok-kw">const</span> vh: f32 = <span class="tok-builtin">@max</span>(f.window.<span class="tok-fn">heightf</span>(), <span class="tok-num">1</span>);
    <span class="tok-comment">// OFFSCREEN FIRST (tile-based-GPU safe; app owns begin/endDrawing; uses</span>
    <span class="tok-comment">// last-frame UI state = 1-frame lag, imperceptible).</span>

    <span class="tok-kw">const</span> cam_target: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0.25</span>, <span class="tok-num">0.6</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> cp: f32 = <span class="tok-builtin">@cos</span>(s.cam_pitch);
    <span class="tok-kw">const</span> sp: f32 = <span class="tok-builtin">@sin</span>(s.cam_pitch);
    <span class="tok-kw">const</span> cy: f32 = <span class="tok-builtin">@cos</span>(s.cam_yaw);
    <span class="tok-kw">const</span> sy: f32 = <span class="tok-builtin">@sin</span>(s.cam_yaw);
    <span class="tok-kw">const</span> cam_eye: Vec = <span class="tok-fn">vec</span>(
        cam_target[<span class="tok-num">0</span>] + s.cam_dist * cp * sy,
        cam_target[<span class="tok-num">1</span>] + s.cam_dist * sp,
        cam_target[<span class="tok-num">2</span>] + s.cam_dist * cp * cy,
    );
    <span class="tok-kw">const</span> cam_view: Mat = <span class="tok-fn">lookAtRh</span>(cam_eye, cam_target, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>));
    <span class="tok-kw">const</span> cam_proj: Mat = <span class="tok-fn">perspectiveFovRh</span>(<span class="tok-num">0.8</span>, vw / vh, <span class="tok-num">0.1</span>, <span class="tok-num">100.0</span>);
    <span class="tok-kw">const</span> cam_vp: Mat = <span class="tok-fn">mulMat</span>(cam_proj, cam_view);

    <span class="tok-kw">for</span> (&amp;s.objs, placements) |*obj, p| {
        <span class="tok-kw">const</span> spin: Mat = <span class="tok-fn">rotationY</span>(p.spin_rate * t);
        <span class="tok-kw">const</span> model: Mat = <span class="tok-fn">mulMat</span>(
            <span class="tok-fn">translation</span>(p.center[<span class="tok-num">0</span>], p.center[<span class="tok-num">1</span>], p.center[<span class="tok-num">2</span>]),
            <span class="tok-fn">mulMat</span>(spin, <span class="tok-fn">scaling</span>(p.half, p.half, p.half)),
        );
        <span class="tok-kw">var</span> vs_io: mat_vs.Io = undefined;
        vs_io.u = .{ .mvp = <span class="tok-fn">mulMat</span>(cam_vp, model), .model = model, .normal_matrix = spin };
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.vs_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;vs_io.u));

        <span class="tok-kw">var</span> lie_io: lie_fs.Io = undefined;
        lie_io.u = .{
            .base_color = p.color,
            .light_dir = .{ sun_dir[<span class="tok-num">0</span>], sun_dir[<span class="tok-num">1</span>], sun_dir[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
        };
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.lie_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;lie_io.u));

        <span class="tok-kw">var</span> hon_io: honest_fs.Io = undefined;
        hon_io.u = .{
            .base_color = p.color,
            .view_pos = .{ cam_eye[<span class="tok-num">0</span>], cam_eye[<span class="tok-num">1</span>], cam_eye[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
            .light_dir = .{ sun_dir[<span class="tok-num">0</span>], sun_dir[<span class="tok-num">1</span>], sun_dir[<span class="tok-num">2</span>], <span class="tok-num">0</span> },
            .fog_color = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span> },
            .params = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span> }, <span class="tok-comment">// density 0: fog_fs degrades to plain lambert+blinn</span>
        };
        z.wgpu.<span class="tok-fn">queueWriteBuffer</span>(f.gpu.queue, obj.honest_ubo, <span class="tok-num">0</span>, std.mem.<span class="tok-fn">asBytes</span>(&amp;hon_io.u));
    }

    <span class="tok-kw">const</span> Backend: type = z.WgpuBackend;
    z.<span class="tok-fn">beginTextureModeRaw</span>(f.gl, s.rt, bg_clear);
    <span class="tok-kw">const</span> pa: *z.PassState = f.gl.pass;
    <span class="tok-kw">const</span> pipe: z.wgpu.RenderPipelineHandle = <span class="tok-kw">if</span> (s.lie) s.lie_pipeline <span class="tok-kw">else</span> s.honest_pipeline;
    Backend.<span class="tok-fn">setPipeline</span>(pa, z.shader.<span class="tok-fn">RenderPipeline</span>(void, void){ .gpu_handle = pipe });
    Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">1</span>, s.empty_bg);
    z.render_pass.<span class="tok-fn">setVertexBuffer</span>(pa.pass, .{
        .slot = <span class="tok-num">0</span>,
        .buffer = s.vbo,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_verts)),
    });
    z.render_pass.<span class="tok-fn">setIndexBuffer</span>(pa.pass, .{
        .buffer = s.ibo,
        .format = .uint32,
        .offset = <span class="tok-num">0</span>,
        .size = <span class="tok-builtin">@sizeOf</span>(<span class="tok-builtin">@TypeOf</span>(cube_indices)),
    });
    <span class="tok-kw">for</span> (&amp;s.objs) |*obj| {
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">0</span>, obj.g0_bg);
        Backend.<span class="tok-fn">setBindGroup</span>(pa, <span class="tok-num">2</span>, <span class="tok-kw">if</span> (s.lie) obj.lie_bg <span class="tok-kw">else</span> obj.honest_bg);
        z.render_pass.<span class="tok-fn">drawIndexed</span>(pa.pass, .{
            .index_count = cube_indices.len,
            .instance_count = <span class="tok-num">1</span>,
            .first_index = <span class="tok-num">0</span>,
            .base_vertex = <span class="tok-num">0</span>,
            .first_instance = <span class="tok-num">0</span>,
        });
    }
    z.<span class="tok-fn">endTextureModeRaw</span>(f.gl);

    <span class="tok-comment">// SCREEN PASS: open once, composite, then UI.</span>
    z.<span class="tok-fn">beginDrawing</span>(f.gl);
    z.<span class="tok-fn">clearViewport</span>(f, bg_clear);
    f.gl.<span class="tok-fn">texture</span>(.{ .x = <span class="tok-num">0</span>, .y = <span class="tok-num">0</span>, .width = vw, .height = vh }, s.rt.<span class="tok-fn">asTexture</span>(), .{ .tint = white });
    <span class="tok-kw">const</span> u: z.ui_real.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-builtin">@min</span>(<span class="tok-num">300</span>, vw - <span class="tok-num">16</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, vh - <span class="tok-num">118</span> }, .{});
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-num">110</span> }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"depth writing"</span>, .{})) |w| {
        <span class="tok-kw">defer</span> w.<span class="tok-fn">close</span>();
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"lie to depth"</span>, &amp;s.lie);
        <span class="tok-kw">const</span> caption: []<span class="tok-kw">const</span> u8 = <span class="tok-kw">if</span> (s.lie)
            <span class="tok-str">"purple claims FRONT, yellow BACK"</span>
        <span class="tok-kw">else</span>
            <span class="tok-str">"honest occlusion"</span>;
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{s}"</span>, .{caption});
    }
    <span class="tok-fn">handleInput</span>(f, s, u.<span class="tok-fn">wantCaptureMouse</span>());
    s.ui_host.<span class="tok-fn">render</span>(f);
    z.<span class="tok-fn">endDrawing</span>(f.gl);
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - fragment depth writing"</span>,
            .width = <span class="tok-num">960</span>,
            .height = <span class="tok-num">540</span>,
            .scale_mode = .responsive,
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
    <span class="tok-comment">// Renders offscreen before the screen opens (tile-based-GPU safe); owns</span>
    <span class="tok-comment">// its own begin/endDrawing.</span>
    .manages_own_frame = true,
};
