        s.data.pos[hip_y] = <span class="tok-fn">clamp</span>(s.data.pos[hip_y] + <span class="tok-fn">clamp</span>(dy, -<span class="tok-num">0.15</span>, <span class="tok-num">0.15</span>), -<span class="tok-num">2.6</span>, <span class="tok-num">0.35</span>);
    }
    <span class="tok-comment">// * THE ARMS GO OUT BY IK, NOT BY ANGLE. The shoulder axes are `2 1 1` and `0 -1 1` - not</span>
    <span class="tok-comment">// orthogonal and not aligned with anything, so "45 degrees" in joint space would mean</span>
    <span class="tok-comment">// whatever those axes made of it. A hand POSITION is unambiguous.</span>
    <span class="tok-kw">const</span> diag: f32 = <span class="tok-num">0.52</span> * <span class="tok-num">0.7071</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">12</span>) |_| {
        _ = (ctl.Ik{ .max_iterations = <span class="tok-num">10</span>, .max_step = <span class="tok-num">0.20</span> }).<span class="tok-fn">solve</span>(
            m,
            &amp;s.data,
            s.arm_act_right,
            .{ .body = hand_right, .offset = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .goal = s.data.body_xpos[arm_r] + <span class="tok-fn">vec</span>(diag, -diag, <span class="tok-num">0</span>) },
            s.ik_scratch,
        );
        _ = (ctl.Ik{ .max_iterations = <span class="tok-num">10</span>, .max_step = <span class="tok-num">0.20</span> }).<span class="tok-fn">solve</span>(
            m,
            &amp;s.data,
            s.arm_act_left,
            .{ .body = hand_left, .offset = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>), .goal = s.data.body_xpos[arm_l] + <span class="tok-fn">vec</span>(diag, diag, <span class="tok-num">0</span>) },
            s.ik_scratch,
        );
    }

    <span class="tok-comment">// * AND ONE MORE PASS, BECAUSE THE ARMS MOVED THE MASS. Reaching shifts roughly 5 kg out</span>
    <span class="tok-comment">// to 0.5 m; measured, that took the centre of mass from 0.6 mm off the foot to 21 mm.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">6</span>) |_| {
        <span class="tok-fn">settleFoot</span>(s, right_foot);
        <span class="tok-kw">const</span> err: [<span class="tok-num">2</span>]f32 = <span class="tok-fn">comOverFoot</span>(s, right_foot);
        <span class="tok-kw">if</span> (<span class="tok-builtin">@sqrt</span>(err[<span class="tok-num">0</span>] * err[<span class="tok-num">0</span>] + err[<span class="tok-num">1</span>] * err[<span class="tok-num">1</span>]) &lt; <span class="tok-num">0.004</span>) {
            <span class="tok-kw">break</span>;
        }
        <span class="tok-kw">var</span> jac: [<span class="tok-num">4</span>]f32 = undefined;
        <span class="tok-kw">const</span> eps: f32 = <span class="tok-num">0.01</span>;
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (.{ hip_x, hip_y }, <span class="tok-num">0</span>..) |q, col| {
            <span class="tok-kw">const</span> keep: f32 = s.data.pos[q];
            s.data.pos[q] = keep + eps;
            <span class="tok-fn">settleFoot</span>(s, right_foot);
            <span class="tok-kw">const</span> moved: [<span class="tok-num">2</span>]f32 = <span class="tok-fn">comOverFoot</span>(s, right_foot);
            jac[<span class="tok-num">0</span> * <span class="tok-num">2</span> + col] = (moved[<span class="tok-num">0</span>] - err[<span class="tok-num">0</span>]) / eps;
            jac[<span class="tok-num">1</span> * <span class="tok-num">2</span> + col] = (moved[<span class="tok-num">1</span>] - err[<span class="tok-num">1</span>]) / eps;
            s.data.pos[q] = keep;
        }
        <span class="tok-kw">const</span> det: f32 = jac[<span class="tok-num">0</span>] * jac[<span class="tok-num">3</span>] - jac[<span class="tok-num">1</span>] * jac[<span class="tok-num">2</span>];
        <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(det) &lt; <span class="tok-num">1.0e-6</span>) {
            <span class="tok-kw">break</span>;
        }
        <span class="tok-kw">const</span> dx: f32 = (-err[<span class="tok-num">0</span>] * jac[<span class="tok-num">3</span>] + err[<span class="tok-num">1</span>] * jac[<span class="tok-num">1</span>]) / det;
        <span class="tok-kw">const</span> dy: f32 = (-jac[<span class="tok-num">0</span>] * err[<span class="tok-num">1</span>] + jac[<span class="tok-num">2</span>] * err[<span class="tok-num">0</span>]) / det;
        s.data.pos[hip_x] = <span class="tok-fn">clamp</span>(s.data.pos[hip_x] + <span class="tok-fn">clamp</span>(dx, -<span class="tok-num">0.15</span>, <span class="tok-num">0.15</span>), -<span class="tok-num">0.52</span>, <span class="tok-num">0.17</span>);
        s.data.pos[hip_y] = <span class="tok-fn">clamp</span>(s.data.pos[hip_y] + <span class="tok-fn">clamp</span>(dy, -<span class="tok-num">0.15</span>, <span class="tok-num">0.15</span>), -<span class="tok-num">2.6</span>, <span class="tok-num">0.35</span>);
    }
    <span class="tok-fn">settleFoot</span>(s, right_foot);
    _ = root;
}

<span class="tok-kw">fn</span> <span class="tok-fn">setJoint</span>(s: *State, name: []<span class="tok-kw">const</span> u8, angle: f32) void {
    <span class="tok-kw">if</span> (<span class="tok-fn">jointIndex</span>(s, name)) |j| {
        s.data.pos[s.imported.model.jnt_qpos_adr[j]] = angle;
    }
}

<span class="tok-comment">/// The model carries no name table; `mjcf.Robot` does, and the joints are built in that order.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">jointIndex</span>(s: *State, want: []<span class="tok-kw">const</span> u8) ?u32 {
    <span class="tok-kw">for</span> (s.robot.joints, <span class="tok-num">0</span>..) |joint, j| {
        <span class="tok-kw">if</span> (std.mem.<span class="tok-fn">eql</span>(u8, joint.name, want)) {
            <span class="tok-kw">return</span> <span class="tok-builtin">@intCast</span>(j);
        }
    }
    <span class="tok-kw">return</span> null;
}

<span class="tok-comment">/// Rotate the WHOLE robot so the support foot's sole lies flat on the ground.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** THE STEP THAT WAS MISSING, AND IT IS A GLOBAL ONE --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Setting joint angles gets every bone right RELATIVE to its parent and says nothing about</span>
<span class="tok-comment">/// where the chain ends up pointing. Bending the support hip rotates the leg against a torso</span>
<span class="tok-comment">/// that stays bolt upright, so the foot meets the ground at whatever angle the chain leaves it.</span>
<span class="tok-comment">/// Measured on the first version: **13.2 degrees**, the sole touching on ONE CORNER with the</span>
<span class="tok-comment">/// other three between 27 and 49 mm in the air.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// **That is not a stance, it is a pose caught mid-fall** - and no controller holds it, because</span>
<span class="tok-comment">/// a foot on a corner has no support polygon to work with at all. Levelling brings the foot's</span>
<span class="tok-comment">/// up-axis to (-0.010, 0.001, 1.000) and puts two sole points on the ground instead of one.</span>
<span class="tok-comment">/// The 5.5 degrees that remain are the foot model's own rake, not an error.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">levelFoot</span>(s: *State, foot: u32) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
    <span class="tok-kw">const</span> up: Vec = zm.<span class="tok-fn">rotate</span>(s.data.body_xrot[foot], <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>));
    <span class="tok-kw">const</span> axis: Vec = <span class="tok-fn">cross</span>(up, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>));
    <span class="tok-kw">const</span> sine: f32 = <span class="tok-fn">length3</span>(axis);
    <span class="tok-kw">if</span> (sine &lt; <span class="tok-num">1.0e-6</span>) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">const</span> angle: f32 = <span class="tok-fn">atan2Rad</span>(sine, <span class="tok-fn">dot3</span>(up, <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">1</span>)));
    <span class="tok-kw">const</span> fix: zm.Quat = zm.<span class="tok-fn">quatFromAxisAngle</span>(axis / <span class="tok-fn">splat</span>(sine), angle);
    <span class="tok-kw">const</span> root: u32 = m.jnt_qpos_adr[<span class="tok-num">0</span>];
    <span class="tok-kw">const</span> current: zm.Quat = .{
        s.data.pos[root + <span class="tok-num">3</span>], s.data.pos[root + <span class="tok-num">4</span>],
        s.data.pos[root + <span class="tok-num">5</span>], s.data.pos[root + <span class="tok-num">6</span>],
    };
    <span class="tok-kw">const</span> fixed: zm.Quat = zm.<span class="tok-fn">qmul</span>(fix, current);
    s.data.pos[root + <span class="tok-num">3</span>] = fixed[<span class="tok-num">0</span>];
    s.data.pos[root + <span class="tok-num">4</span>] = fixed[<span class="tok-num">1</span>];
    s.data.pos[root + <span class="tok-num">5</span>] = fixed[<span class="tok-num">2</span>];
    s.data.pos[root + <span class="tok-num">6</span>] = fixed[<span class="tok-num">3</span>];
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
}

<span class="tok-comment">/// Drop the root until the support foot's lowest point rests on the ground.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">settleFoot</span>(s: *State, foot: u32) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-comment">// * LEVEL BEFORE SETTLING. Rotating the robot changes which point is lowest, so dropping</span>
    <span class="tok-comment">// first and levelling second leaves the foot either buried or floating.</span>
    <span class="tok-fn">levelFoot</span>(s, foot);
    <span class="tok-kw">var</span> lowest: f32 = <span class="tok-num">1.0e9</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.ngeom) |g| {
        <span class="tok-kw">if</span> (m.geom_body[g] != foot) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> half: f32 = <span class="tok-kw">switch</span> (m.geom_shape[g]) {
            .capsule =&gt; |c| c.half_height,
            <span class="tok-kw">else</span> =&gt; <span class="tok-num">0</span>,
        };
        <span class="tok-kw">const</span> radius: f32 = <span class="tok-kw">switch</span> (m.geom_shape[g]) {
            .capsule =&gt; |c| c.radius,
            .sphere =&gt; |sp| sp.radius,
            <span class="tok-kw">else</span> =&gt; <span class="tok-kw">continue</span>,
        };
        <span class="tok-kw">const</span> axis: Vec = zm.<span class="tok-fn">rotate</span>(zm.<span class="tok-fn">qmul</span>(s.data.body_xrot[foot], m.geom_rot[g]), capsule_axis);
        <span class="tok-kw">const</span> centre: Vec = s.data.body_xpos[foot] + zm.<span class="tok-fn">rotate</span>(s.data.body_xrot[foot], m.geom_pos[g]);
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> ([_]f32{ -<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span> }) |end| {
            lowest = <span class="tok-builtin">@min</span>(lowest, (centre + axis * <span class="tok-fn">splat</span>(end * half))[<span class="tok-num">2</span>] - radius);
        }
    }
    s.data.pos[m.jnt_qpos_adr[<span class="tok-num">0</span>] + <span class="tok-num">2</span>] -= lowest;
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);
}

<span class="tok-comment">/// How far the centre of mass sits from the middle of the SOLE - not from the foot body's</span>
<span class="tok-comment">/// origin, which is a different place.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** THE SOLE RUNS FROM -0.07 TO +0.14 IN THE FOOT'S FRAME --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Its middle is therefore **0.035 m forward** of the body origin: a third of the way to the toe</span>
<span class="tok-comment">/// on a 0.21 m foot. Targeting the origin put the mass that far behind the middle of its own</span>
<span class="tok-comment">/// support before the robot had done anything.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * AND A ONE-LEGGED STAND HAS NO MARGIN TO SPEND. The sole can supply about `f_z x 0.105`</span>
<span class="tok-comment">/// ~ 42 N*m of restoring moment against `m*g*h*theta` ~ 360*theta, so a stiff ankle holds it out to</span>
<span class="tok-comment">/// roughly **6.7 degrees** of lean - and 3.5 cm at 0.9 m is 2.2 of those degrees given away for</span>
<span class="tok-comment">/// nothing. That is why it fell forward rather than simply wobbling.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">comOverFoot</span>(s: *State, foot: u32) [<span class="tok-num">2</span>]f32 {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> com: Vec = s.data.subtree_com[rbt.world_body];
    <span class="tok-kw">var</span> total: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">var</span> count: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.ngeom) |g| {
        <span class="tok-kw">if</span> (m.geom_body[g] != foot) {
            <span class="tok-kw">continue</span>;
        }
        <span class="tok-kw">const</span> half: f32 = <span class="tok-kw">switch</span> (m.geom_shape[g]) {
            .capsule =&gt; |c| c.half_height,
            <span class="tok-kw">else</span> =&gt; <span class="tok-kw">continue</span>,
        };
        <span class="tok-kw">const</span> axis: Vec = zm.<span class="tok-fn">rotate</span>(zm.<span class="tok-fn">qmul</span>(s.data.body_xrot[foot], m.geom_rot[g]), capsule_axis);
        <span class="tok-kw">const</span> mid: Vec = s.data.body_xpos[foot] +
            zm.<span class="tok-fn">rotate</span>(s.data.body_xrot[foot], m.geom_pos[g]);
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> ([_]f32{ -<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span> }) |end| {
            total += mid + axis * <span class="tok-fn">splat</span>(end * half);
            count += <span class="tok-num">1</span>;
        }
    }
    <span class="tok-kw">const</span> at: Vec = <span class="tok-kw">if</span> (count &gt; <span class="tok-num">0</span>) total / <span class="tok-fn">splat</span>(count) <span class="tok-kw">else</span> s.data.body_xpos[foot];
    <span class="tok-kw">return</span> .{ com[<span class="tok-num">0</span>] - at[<span class="tok-num">0</span>], com[<span class="tok-num">1</span>] - at[<span class="tok-num">1</span>] };
}

<span class="tok-comment">/// Shove the trunk, at the slider's magnitude and in a random horizontal direction.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** THE MAGNITUDE MATTERS MORE THAN IT LOOKS --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// This used to be hardcoded at 1.2 m/s, which is far outside anything the arms can influence.</span>
<span class="tok-comment">/// Both arms together carry about **7.7 kg*m^2/s** of angular momentum - spin plus orbital - and</span>
<span class="tok-comment">/// `dv = L/(m*h)` makes that worth roughly **0.23 m/s** of arrest. So the flywheel's whole</span>
<span class="tok-comment">/// effect lives between about 0.2 and 0.5 m/s, and a 1.2 m/s shove knocks the robot down</span>
<span class="tok-comment">/// whatever the planner does.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * A SLIDER IS THEREFORE NOT A CONVENIENCE, IT IS THE EXPERIMENT: the difference the arms make</span>
<span class="tok-comment">/// is only visible in the band where they have authority at all.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">shove</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-comment">// A random horizontal direction, so the recovery is not always the same sagittal lean.</span>
    s.shove_seed = s.shove_seed *% <span class="tok-num">1664525</span> +% <span class="tok-num">1013904223</span>;
    <span class="tok-kw">const</span> angle: f32 = <span class="tok-fn">float</span>(s.shove_seed &gt;&gt; <span class="tok-num">8</span>) * (<span class="tok-num">2.0</span> * pi / <span class="tok-num">16777216.0</span>);
    s.shove_dir = .{ <span class="tok-builtin">@cos</span>(angle), <span class="tok-builtin">@sin</span>(angle) };
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.njnt) |j| {
        <span class="tok-kw">if</span> (m.jnt_type[j] == .free) {
            <span class="tok-comment">// The free joint's velocity DOFs are linear first, then angular.</span>
            <span class="tok-kw">const</span> v: u32 = m.jnt_dof_adr[j];
            s.data.vel[v + <span class="tok-num">0</span>] += s.shove_speed * s.shove_dir[<span class="tok-num">0</span>];
            s.data.vel[v + <span class="tok-num">1</span>] += s.shove_speed * s.shove_dir[<span class="tok-num">1</span>];
            s.data.stage = .stale;
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">update</span>(f: *z.Frame, s: *State) void {
    <span class="tok-kw">const</span> gl: *z.WgpuGl = f.gl;

    <span class="tok-comment">// -- * IK RUNS ONCE PER FRAME, NOT PER PHYSICS SUBSTEP --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// It answers "where should the arm be aiming", and that only changes when a slider moves.</span>
    <span class="tok-comment">// Solving it inside the fixed-timestep loop recomputes the same answer for every substep,</span>
    <span class="tok-comment">// and the cost multiplies by however many the accumulator owes - which feeds back, because</span>
    <span class="tok-comment">// a slower frame owes more substeps. The KUKA demo learned this the expensive way.</span>
    <span class="tok-kw">if</span> (s.ik_on) {
        <span class="tok-comment">// The solve is destructive: it writes joint angles straight into `data`. Here that is</span>
        <span class="tok-comment">// exactly what is wanted - the result IS the pose the controller then holds - but the</span>
        <span class="tok-comment">// free joint must be preserved, or IK would decide where the pelvis goes.</span>
        <span class="tok-kw">const</span> result: ctl.BalancedIk.Result = (ctl.BalancedIk{
            .com_goal = s.com_goal,
            .com_gain = <span class="tok-kw">if</span> (s.hold_com) <span class="tok-num">0.5</span> <span class="tok-kw">else</span> <span class="tok-num">0.0</span>,
            .reach = .{ .max_iterations = <span class="tok-num">6</span> },
        }).<span class="tok-fn">solve</span>(&amp;s.imported.model, &amp;s.data, s.actuation, .{
            .body = s.hand,
            .goal = s.ik_goal,
        }, s.ik_scratch);
        s.ik_error = result.reach.error_distance;
        s.com_error = result.com_error;
        <span class="tok-comment">// The solved pose becomes the target the PD controller drives toward, so the arm still</span>
        <span class="tok-comment">// travels there under its torque limits and can be knocked off course.</span>
        <span class="tok-builtin">@memcpy</span>(s.home, s.data.pos);
    }

    s.accumulator += <span class="tok-builtin">@min</span>(f.time.delta_time, <span class="tok-num">0.1</span>);
    <span class="tok-kw">while</span> (s.accumulator &gt;= timestep) : (s.accumulator -= timestep) {
        <span class="tok-comment">// Kinematics, then collision, then solve - all at one `q`. See `robot_physics.sync`</span>
        <span class="tok-comment">// for why the order is not negotiable.</span>
        rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);
        <span class="tok-kw">if</span> (s.physics_on) {
            s.bridge.<span class="tok-fn">sync</span>(&amp;s.world, &amp;s.imported.model, &amp;s.data) <span class="tok-kw">catch</span> |err| {
                zm.<span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"proxy sync failed: {t}"</span>, .{err});
            };
            zp.<span class="tok-fn">step</span>(&amp;s.world, timestep) <span class="tok-kw">catch</span> |err| {
                zm.<span class="tok-fn">assertUnreachable</span>(<span class="tok-builtin">@src</span>(), <span class="tok-str">"world step failed: {t}"</span>, .{err});
            };
            s.bridge.<span class="tok-fn">harvest</span>(&amp;s.data);
        }
        <span class="tok-fn">control</span>(s);
        rbt.<span class="tok-fn">step</span>(&amp;s.imported.model, &amp;s.data);
    }
    rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);

    <span class="tok-comment">// * THE TWITCH AS A NUMBER. The difference between the two solvers on a limp body is a</span>
    <span class="tok-comment">// residual velocity - 2.67 against 0.41, measured - and a viewer cannot eyeball that. A</span>
    <span class="tok-comment">// rolling peak makes it readable, and resets each second so it tracks the present rather</span>
    <span class="tok-comment">// than remembering the landing.</span>
    <span class="tok-kw">var</span> fastest: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.imported.model.nv) |i| {
        fastest = <span class="tok-builtin">@max</span>(fastest, <span class="tok-builtin">@abs</span>(s.data.vel[i]));
    }
    s.recent_peak_speed = <span class="tok-builtin">@max</span>(s.recent_peak_speed, fastest);

    <span class="tok-comment">// * 1/2*v^TMv, THE HONEST TOTAL. `mulM` is the dynamics' own routine, so this uses the model's</span>
    <span class="tok-comment">// real mass matrix rather than a sum over bodies that would ignore the coupling between</span>
    <span class="tok-comment">// them.</span>
    <span class="tok-comment">// ** THE ROBOT'S DOFs ONLY. This summed over the whole model, and the model carries six</span>
    <span class="tok-comment">// throwable balls - so the figure described the balls as much as the humanoid. It is a</span>
    <span class="tok-comment">// readout about the robot; it should read the robot.</span>
    <span class="tok-kw">var</span> momentum: [<span class="tok-num">80</span>]f32 = undefined;
    <span class="tok-kw">const</span> nv: usize = s.imported.model.nv;
    <span class="tok-kw">if</span> (nv &lt;= momentum.len) {
        rbt.<span class="tok-fn">mulM</span>(&amp;s.imported.model, &amp;s.data, s.data.vel, momentum[<span class="tok-num">0</span>..nv]);
        <span class="tok-kw">var</span> energy: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.robot_dof_count) |i| {
            energy += <span class="tok-num">0.5</span> * s.data.vel[i] * momentum[i];
        }
        s.kinetic_energy = energy;
        s.energy_clock += f.time.delta_time;
        <span class="tok-kw">if</span> (s.energy_clock &gt;= <span class="tok-num">0.1</span>) {
            s.energy_clock = <span class="tok-num">0</span>;
            <span class="tok-kw">if</span> (s.energy_len &lt; s.energy_history.len) {
                s.energy_history[s.energy_len] = energy;
                s.energy_len += <span class="tok-num">1</span>;
            } <span class="tok-kw">else</span> {
                std.mem.<span class="tok-fn">copyForwards</span>(
                    f32,
                    s.energy_history[<span class="tok-num">0</span> .. s.energy_history.len - <span class="tok-num">1</span>],
                    s.energy_history[<span class="tok-num">1</span>..],
                );
                s.energy_history[s.energy_history.len - <span class="tok-num">1</span>] = energy;
            }
        }
    }
    s.speed_window += f.time.delta_time;
    <span class="tok-kw">if</span> (s.speed_window &gt;= <span class="tok-num">1.0</span>) {
        s.speed_window = <span class="tok-num">0</span>;
        s.recent_peak_speed = fastest;
    }

    <span class="tok-kw">var</span> force: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.constraint_count) |row| {
        force += s.data.constraint_force[row];
    }
    s.peak_force = <span class="tok-builtin">@max</span>(s.peak_force * <span class="tok-num">0.995</span>, force);

    <span class="tok-comment">// -- ** THE UI IS BUILT EARLY AND RENDERED LAST, AND BOTH HALVES MATTER --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// **Built early**, because the camera has to know whether the mouse belongs to a slider -</span>
    <span class="tok-comment">// otherwise dragging `kp` orbits the view at the same time.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// **Rendered last**, because `clearViewport` wipes whatever has been drawn. Keeping</span>
    <span class="tok-comment">// `begin`/`render` inside the panel function put the deferred `render` at the END OF THAT</span>
    <span class="tok-comment">// FUNCTION - before the clear - so the panel was drawn and then erased, every frame. The</span>
    <span class="tok-comment">// demo showed a robot and no controls at all, and looked like a build problem.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `robot_3d` had it right by accident: its `begin` and its clear live in the same</span>
    <span class="tok-comment">// function, so the defer naturally lands after the 3D pass. Making that structural rather</span>
    <span class="tok-comment">// than incidental is the point of passing `u` in.</span>
    <span class="tok-kw">const</span> u: ui.Ui = s.ui_host.<span class="tok-fn">begin</span>(f);
    <span class="tok-kw">defer</span> s.ui_host.<span class="tok-fn">render</span>(f);
    <span class="tok-kw">const</span> captured: bool = <span class="tok-fn">drawPanel</span>(u, s, f.window.<span class="tok-fn">widthf</span>(), f.window.<span class="tok-fn">heightf</span>());

    z.<span class="tok-fn">clearViewport</span>(f, bg);
    <span class="tok-kw">const</span> cam: Camera3D = s.cam.<span class="tok-fn">update</span>(f, captured, .{
        .min_distance = <span class="tok-num">0.6</span>,
        .max_distance = <span class="tok-num">4.0</span>,
    });
    <span class="tok-comment">// * THE THROW HAPPENS HERE, not in the panel, because it needs the camera - and the</span>
    <span class="tok-comment">// camera is not known until after the panel has said whether the mouse belongs to it.</span>
    <span class="tok-kw">if</span> (s.want_throw) {
        s.want_throw = false;
        <span class="tok-fn">throwBall</span>(s, cam);
    }

    z.<span class="tok-fn">beginMode3D</span>(gl, cam);
    z.<span class="tok-fn">drawGrid</span>(gl, <span class="tok-num">16</span>, <span class="tok-num">0.25</span>);
    <span class="tok-fn">drawRobot</span>(s, gl);
    z.<span class="tok-fn">endMode3D</span>(gl);
}

<span class="tok-comment">/// Draw every collision geom the importer kept.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THESE ARE THE COLLISION SHAPES, not the visual meshes - the Go1's 13 `&lt;mesh&gt;` geoms are</span>
<span class="tok-comment">/// skipped by the converter because their vertices live in an `&lt;asset&gt;` block that is not read</span>
<span class="tok-comment">/// yet. Which turns out to be the better picture for a physics demo: what you see IS what the</span>
<span class="tok-comment">/// solver sees, so a leg that looks like it is touching the ground is touching the ground.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">drawRobot</span>(s: *State, gl: *z.WgpuGl) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> to_y_up: Mat = zm.<span class="tok-fn">zUpToYUp</span>();
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.ngeom) |g| {
        <span class="tok-kw">const</span> body: u32 = m.geom_body[g];
        <span class="tok-comment">// * A GEOM'S WORLD POSE IS ITS BODY'S, COMPOSED WITH ITS OWN OFFSET. The engine</span>
        <span class="tok-comment">// stores the offset (`geom_pos`/`geom_rot`) and the body's world pose separately -</span>
        <span class="tok-comment">// it never needs the product except when something is drawn or collided, so it does</span>
        <span class="tok-comment">// not keep one.</span>
        <span class="tok-kw">const</span> body_rot: zm.Quat = s.data.body_xrot[body];
        <span class="tok-kw">const</span> world_pos: Vec = s.data.body_xpos[body] + zm.<span class="tok-fn">rotate</span>(body_rot, m.geom_pos[g]);
        <span class="tok-kw">const</span> world_rot: Mat = <span class="tok-fn">quatToMat</span>(zm.<span class="tok-fn">qmul</span>(body_rot, m.geom_rot[g]));
        <span class="tok-kw">const</span> place: Mat = <span class="tok-fn">mulMat</span>(<span class="tok-fn">mulMat</span>(to_y_up, <span class="tok-fn">translation</span>(world_pos[<span class="tok-num">0</span>], world_pos[<span class="tok-num">1</span>], world_pos[<span class="tok-num">2</span>])), world_rot);
        <span class="tok-comment">// Feet are the interesting part, so they get a brighter colour.</span>
        <span class="tok-kw">const</span> tint: Color = <span class="tok-kw">if</span> (body == <span class="tok-num">0</span>) trunk_col <span class="tok-kw">else</span> link_col;
        <span class="tok-kw">switch</span> (m.geom_shape[g]) {
            .sphere =&gt; |sph| {
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">scaling</span>(sph.radius, sph.radius, sph.radius));
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, tint);
            },
            .capsule =&gt; |cap| {
                <span class="tok-comment">// -- ** THE MESH ALREADY RUNS ALONG Y. MEASURED, NOT DERIVED. --</span>
                <span class="tok-comment">//</span>
                <span class="tok-comment">//     genMeshCylinder(r=1, h=1) extent:</span>
                <span class="tok-comment">//       x: [-1.000, 1.000]   y: [0.000, 1.000]   z: [-1.000, 1.000]</span>
                <span class="tok-comment">//</span>
                <span class="tok-comment">// `cylinderUv` returns the axis in its third slot, which reads as Z - but</span>
                <span class="tok-comment">// `parametricMesh` REMAPS as it writes (`verts.y = p[2]`), so the finished</span>
                <span class="tok-comment">// mesh extends along zimr's **Y**, spanning [0, h] rather than [-h/2, +h/2].</span>
                <span class="tok-comment">//</span>
                <span class="tok-comment">// That is the same axis `GeomShape.capsule` uses, so no rotation is needed at</span>
                <span class="tok-comment">// all. A previous version read `cylinderUv` and concluded Z, then rotated by</span>
                <span class="tok-comment">// -90 deg to "correct" it; the non-uniform scale then landed across the shape and</span>
                <span class="tok-comment">// flattened every limb into a wide curved ribbon. **Reading the generator was</span>
                <span class="tok-comment">// not enough - the answer was two functions away, and printing the mesh's</span>
                <span class="tok-comment">// bounds took one command.**</span>
                <span class="tok-comment">//</span>
                <span class="tok-comment">// Only the [0, h] span needs correcting, with a half-length shift along Y.</span>
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
                    <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, -cap.half_height, <span class="tok-num">0</span>)),
                    <span class="tok-fn">scaling</span>(cap.radius, <span class="tok-num">2.0</span> * cap.half_height, cap.radius),
                );
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cylinder, &amp;s.transform, tint);
                <span class="tok-kw">inline</span> <span class="tok-kw">for</span> ([_]f32{ -<span class="tok-num">1.0</span>, <span class="tok-num">1.0</span> }) |end| {
                    s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
                        <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, end * cap.half_height, <span class="tok-num">0</span>)),
                        <span class="tok-fn">scaling</span>(cap.radius, cap.radius, cap.radius),
                    );
                    z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, tint);
                }
            },
            .cylinder =&gt; |cyl| {
                <span class="tok-comment">// Same axis and the same [0, h] span as the capsule above.</span>
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
                    <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">translation</span>(<span class="tok-num">0</span>, -cyl.half_height, <span class="tok-num">0</span>)),
                    <span class="tok-fn">scaling</span>(cyl.radius, <span class="tok-num">2.0</span> * cyl.half_height, cyl.radius),
                );
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cylinder, &amp;s.transform, tint);
            },
            .box =&gt; |box| {
                s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(place, <span class="tok-fn">scaling</span>(
                    <span class="tok-num">2.0</span> * box.half_extent[<span class="tok-num">0</span>],
                    <span class="tok-num">2.0</span> * box.half_extent[<span class="tok-num">1</span>],
                    <span class="tok-num">2.0</span> * box.half_extent[<span class="tok-num">2</span>],
                ));
                z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.cube, &amp;s.transform, tint);
            },
            <span class="tok-kw">else</span> =&gt; {},
        }
    }

    <span class="tok-comment">// The projectiles, drawn from the tree like everything else.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..ball_count) |i| {
        <span class="tok-kw">const</span> body: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(ball_names[i]) <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
        <span class="tok-kw">const</span> p: Vec = s.data.body_xpos[body];
        s.transform[<span class="tok-num">0</span>] = <span class="tok-fn">mulMat</span>(
            <span class="tok-fn">mulMat</span>(to_y_up, <span class="tok-fn">translation</span>(p[<span class="tok-num">0</span>], p[<span class="tok-num">1</span>], p[<span class="tok-num">2</span>])),
            <span class="tok-fn">scaling</span>(ball_radius, ball_radius, ball_radius),
        );
        z.<span class="tok-fn">drawMeshInstanced</span>(gl, &amp;s.sphere, &amp;s.transform, ball_col);
    }

    <span class="tok-comment">// * THE REACH TARGET AND A LINE TO IT. The line is the useful part: it shrinks to nothing</span>
    <span class="tok-comment">// when the hand arrives and grows when the goal moves out of reach, which is the same</span>
    <span class="tok-comment">// number the panel prints, where the eye already is.</span>
    <span class="tok-kw">if</span> (s.ik_on) {
        <span class="tok-kw">const</span> goal_y_up: Vec = <span class="tok-fn">vec</span>(s.ik_goal[<span class="tok-num">0</span>], s.ik_goal[<span class="tok-num">2</span>], -s.ik_goal[<span class="tok-num">1</span>]);
        <span class="tok-kw">const</span> hand_at: Vec = s.data.body_xpos[s.hand];
        <span class="tok-kw">const</span> hand_y_up: Vec = <span class="tok-fn">vec</span>(hand_at[<span class="tok-num">0</span>], hand_at[<span class="tok-num">2</span>], -hand_at[<span class="tok-num">1</span>]);
        z.<span class="tok-fn">drawSphere</span>(gl, goal_y_up, .{
            .radius = <span class="tok-num">0.04</span>,
            .rings = <span class="tok-num">8</span>,
            .slices = <span class="tok-num">12</span>,
            .color = <span class="tok-kw">if</span> (s.ik_error &lt; <span class="tok-num">0.02</span>) goal_reached_col <span class="tok-kw">else</span> goal_straining_col,
        });
        z.<span class="tok-fn">drawLine3D</span>(gl, hand_y_up, goal_y_up, goal_straining_col);
    }

    <span class="tok-comment">// Contact points, so "is it actually standing" is answerable by looking.</span>
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.contact_count) |c| {
        <span class="tok-kw">const</span> p: Vec = s.data.contacts[c].position;
        <span class="tok-comment">// Z-up to Y-up is a coordinate swap, and writing it as one is clearer here than</span>
        <span class="tok-comment">// pushing a point through a matrix: (x, y, z) becomes (x, z, -y).</span>
        <span class="tok-kw">const</span> at: Vec = <span class="tok-fn">vec</span>(p[<span class="tok-num">0</span>], p[<span class="tok-num">2</span>], -p[<span class="tok-num">1</span>]);
        z.<span class="tok-fn">drawSphere</span>(gl, at, .{ .radius = <span class="tok-num">0.012</span>, .color = contact_col });
    }
}

<span class="tok-comment">/// Lift the humanoid, tip it over, and let go.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * TIPPED, NOT UPRIGHT. A body dropped on its feet makes three or four contacts and settles</span>
<span class="tok-comment">/// on its own; landing on its side makes fifteen, coupled through every joint, which is the</span>
<span class="tok-comment">/// case the two solvers disagree about.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">dropLimp</span>(s: *State) void {
    _ = rmj.<span class="tok-fn">applyKeyframe</span>(&amp;s.imported.model, &amp;s.data, s.robot.keyframes[<span class="tok-num">0</span>]);
    s.data.pos[<span class="tok-num">2</span>] = <span class="tok-num">1.2</span>;
    <span class="tok-kw">const</span> tipped: zm.Quat = zm.<span class="tok-fn">quatFromAxisAngle</span>(<span class="tok-fn">normalize3</span>(<span class="tok-fn">vec</span>(<span class="tok-num">1</span>, <span class="tok-num">0.3</span>, <span class="tok-num">0</span>)), <span class="tok-num">1.4</span>);
    s.data.pos[<span class="tok-num">3</span>] = tipped[<span class="tok-num">0</span>];
    s.data.pos[<span class="tok-num">4</span>] = tipped[<span class="tok-num">1</span>];
    s.data.pos[<span class="tok-num">5</span>] = tipped[<span class="tok-num">2</span>];
    s.data.pos[<span class="tok-num">6</span>] = tipped[<span class="tok-num">3</span>];
    <span class="tok-builtin">@memset</span>(s.data.vel, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.data.acc, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.data.applied_force, <span class="tok-num">0</span>);
    s.data.<span class="tok-fn">clearContacts</span>();
    <span class="tok-comment">// * AND THE WARM START GOES TOO, or the first solve after the teleport begins from forces</span>
    <span class="tok-comment">// that belonged to a body somewhere else entirely.</span>
    s.data.<span class="tok-fn">forgetWarmStart</span>();
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);
    s.bridge.<span class="tok-fn">teleported</span>();
    s.limp = true;
    s.recent_peak_speed = <span class="tok-num">0</span>;
    s.speed_window = <span class="tok-num">0</span>;
    s.kinetic_energy = <span class="tok-num">0</span>;
    s.energy_len = <span class="tok-num">0</span>;
    s.energy_clock = <span class="tok-num">0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">drawPanel</span>(u: ui.Ui, s: *State, viewport_w: f32, viewport_h: f32) bool {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> captured: bool = u.<span class="tok-fn">wantCaptureMouse</span>();
    <span class="tok-comment">// Sized to the viewport rather than to pixels - see `ui.Ui.scaleToViewport`.</span>
    <span class="tok-kw">const</span> narrow: bool = ui.Ui.<span class="tok-fn">isNarrow</span>(viewport_w);
    <span class="tok-kw">const</span> panel_w: f32 = <span class="tok-kw">if</span> (narrow) viewport_w - <span class="tok-num">16</span> <span class="tok-kw">else</span> <span class="tok-builtin">@min</span>(<span class="tok-num">420.0</span>, viewport_w * <span class="tok-num">0.33</span>);
    <span class="tok-kw">const</span> font_size: f32 = u.<span class="tok-fn">scaleToViewport</span>(panel_w, <span class="tok-kw">if</span> (narrow) <span class="tok-num">32.0</span> <span class="tok-kw">else</span> <span class="tok-num">24.0</span>);
    u.<span class="tok-fn">setNextWindowPos</span>(.{ <span class="tok-num">8</span>, <span class="tok-num">8</span> }, .{});
    <span class="tok-comment">// ** A HEIGHT CAP, BECAUSE AUTO-SIZE IS NOT A LAYOUT. Passing 0 lets the window grow to fit</span>
    <span class="tok-comment">// its content, and this panel's content is 552 px - fine on a desktop and three times the</span>
    <span class="tok-comment">// viewport on a phone with the console drawer open, which is exactly what the engine's own</span>
    <span class="tok-comment">// lint reported: "content (552px) is &gt;3x its viewport (174px)". Capping at 70% of the</span>
    <span class="tok-comment">// viewport gives the window a scrollbar instead of letting it run off the screen.</span>
    u.<span class="tok-fn">setNextWindowSize</span>(.{ panel_w, <span class="tok-builtin">@min</span>(<span class="tok-num">560.0</span>, viewport_h * <span class="tok-num">0.7</span>) }, .{});
    <span class="tok-kw">if</span> (u.<span class="tok-fn">window</span>(<span class="tok-str">"Humanoid, 27 DOF, imported from MJCF"</span>, .{})) |window| {
        <span class="tok-kw">defer</span> window.<span class="tok-fn">close</span>();
        u.<span class="tok-fn">text</span>(<span class="tok-str">"{d} bodies   {d} DOF   {d} collision geoms"</span>, .{ m.nbody - <span class="tok-num">1</span>, m.nv, m.ngeom });
        <span class="tok-comment">// * THE BODY IS CALLED `torso` HERE, NOT `trunk`. Copied from the Go1 demo, where the</span>
        <span class="tok-comment">// name is different, and `bodyIndex` returning null then fell back to body 1 - a</span>
        <span class="tok-comment">// readout that was always plausible and always wrong.</span>
        <span class="tok-kw">const</span> torso: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"torso"</span>) <span class="tok-kw">orelse</span> <span class="tok-num">1</span>;
        u.<span class="tok-fn">text</span>(<span class="tok-str">"torso height {d:.4} m   (standing 1.2820)"</span>, .{s.data.body_xpos[torso][<span class="tok-num">2</span>]});
        <span class="tok-comment">// * WHAT IS BEING HELD, SHOWN. Without it a button press that worked and a button</span>
        <span class="tok-comment">// press that did nothing look identical - which is exactly the ambiguity that made</span>
        <span class="tok-comment">// "poses don't seem to work" hard to pin down.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"holding: {s}"</span>, .{s.pose_label});
        u.<span class="tok-fn">text</span>(<span class="tok-str">"contacts {d}   rows {d}   iters {d}   load {d:.0} N"</span>, .{
            s.data.contact_count,
            s.data.constraint_count,
            s.data.solver_iterations,
            s.peak_force,
        });
        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// * THE TWO NUMBERS WORTH PLAYING WITH. `kp = 100` is the Go1's own, from</span>
        <span class="tok-comment">// `&lt;position kp="100"&gt;` in its MJCF. Drag it down and the legs fold under the robot's</span>
        <span class="tok-comment">// weight; drag it up and it goes rigid and starts to buzz against its force limit.</span>
        <span class="tok-comment">// -- ** THE BAND THAT WORKS IS NARROW, AND BOTH EDGES ARE INSTRUCTIVE --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">//     kp  100  -&gt;  folds under its own weight, torso sinks to 0.24 m</span>
        <span class="tok-comment">//     kp  400  -&gt;  stands, 4.5 mm of drift over ten seconds</span>
        <span class="tok-comment">//     kp 1000  -&gt;  diverges: torso at -201 m</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The stiff end looks like a physics explosion and is a CONTROLLER one - a PD law</span>
        <span class="tok-comment">// outrunning a fixed timestep. Worth being able to reproduce on a slider, because that</span>
        <span class="tok-comment">// failure is so easily blamed on the solver.</span>
        <span class="tok-comment">// -- *** THE `kv` CEILING IS 10, AND IT IS NOT A TASTE --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// A PD's derivative term is an APPLIED torque, integrated explicitly, so it is stable</span>
        <span class="tok-comment">// only while `kv*dt/M &lt; 2`. For a joint carrying this model's armature of 0.01 at</span>
        <span class="tok-comment">// dt = 1/500 that caps `kv` at **10**, and this slider used to run to 40 - four times</span>
        <span class="tok-comment">// the limit. Measured, shoving the robot over four times: `kv` 10 peaks at 32 J and</span>
        <span class="tok-comment">// settles; `kv` 40 peaks at 174 J and stays at 39. **More damping made it worse**,</span>
        <span class="tok-comment">// which is the signature of explicit integration.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// ** AND THE FIX IS THE RANGE, NOT THE UNITS. A first attempt converted these to</span>
        <span class="tok-comment">// frequency units with `scale_by_inertia`, which removes the inertia dependence and is</span>
        <span class="tok-comment">// the right tool for a model whose links differ by orders of magnitude. On THIS robot</span>
        <span class="tok-comment">// it was a large regression: standing still for five seconds, joint motion went from</span>
        <span class="tok-comment">// **0.0000 to 16.88** - from perfectly still to visibly shaking. The old gains were</span>
        <span class="tok-comment">// measured and good; only the slider's upper end was wrong.</span>
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"kp"</span>, &amp;s.kp, .{ .min = <span class="tok-num">20.0</span>, .max = <span class="tok-num">1200.0</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"kv (10 is the stability limit)"</span>, &amp;s.kv, .{ .min = <span class="tok-num">0.0</span>, .max = <span class="tok-num">10.0</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"motor N·m"</span>, &amp;s.max_torque, .{ .min = <span class="tok-num">10.0</span>, .max = <span class="tok-num">600.0</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"physics"</span>, &amp;s.physics_on);

        <span class="tok-comment">// -- ** THE RAGDOLL, AND THE REASON THIS DEMO HAS A SOLVER TOGGLE --</span>
        u.<span class="tok-fn">separator</span>();
        <span class="tok-comment">// * BALANCE MODE: the planner picks where the pressure should be and the ankles put it</span>
        <span class="tok-comment">// there. Turn it off and the ankles go back to holding a fixed angle - which stands, but</span>
        <span class="tok-comment">// has no idea where the mass is.</span>
        <span class="tok-kw">if</span> (s.ankles_ready) {
            _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"MPC balance (EXPERIMENTAL — see notes)"</span>, &amp;s.balance_on);
        }
        <span class="tok-kw">if</span> (s.balance_on) {
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  wants CoP x {d:&gt;7.4}   carrying {d:&gt;6.1} N"</span>, .{ s.want_cop[<span class="tok-num">0</span>], s.carried_load });
            <span class="tok-kw">const</span> com: Vec = s.data.subtree_com[rbt.world_body];
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  CM x {d:&gt;7.4}   lean {d:&gt;7.4} m"</span>, .{ com[<span class="tok-num">0</span>], com[<span class="tok-num">0</span>] - s.data.body_xpos[s.ankle_foot[<span class="tok-num">0</span>]][<span class="tok-num">0</span>] });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"ankle damping"</span>, &amp;s.ankle_damping, .{ .min = <span class="tok-num">1</span>, .max = <span class="tok-num">30</span>, .fmt = <span class="tok-str">"{d:.1}"</span> });
            <span class="tok-comment">// * ZERO IS THE ANKLE STRATEGY ALONE - the pressure shifts inside the foot and</span>
            <span class="tok-comment">// nothing else moves. Raise it and the arms start carrying momentum, which is the</span>
            <span class="tok-comment">// part a reactive controller cannot do.</span>
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"arm authority"</span>, &amp;s.momentum_rate, .{ .min = <span class="tok-num">0</span>, .max = <span class="tok-num">200</span>, .fmt = <span class="tok-str">"{d:.0}"</span> });
            u.<span class="tok-fn">text</span>(<span class="tok-str">"  limb swing {d:&gt;6.3} rad"</span>, .{s.limb_swing});
        }
        u.<span class="tok-fn">separator</span>();
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"limp (ragdoll — no controller)"</span>, &amp;s.limp);

        <span class="tok-comment">// -- ** FLESH: how thick the layer of give around every body is --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Zero is the hard surface this always had. Turn it up and the contact stiffens gradually</span>
        <span class="tok-comment">// across that depth instead of all at once - skin, then fat, then bone - so a dropped limb</span>
        <span class="tok-comment">// sinks in and settles rather than arriving all at the same instant.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * THE SOLVER ALREADY DID THIS; only nothing chose it. `Impedance` ramps a constraint from</span>
        <span class="tok-comment">// `min` to `max` over a width, which is MuJoCo's `solimp`, and it was left at its default</span>
        <span class="tok-comment">// on every contact the bridge made.</span>
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"fat thickness (m)"</span>, &amp;s.bridge.flesh.thickness_m, .{
            .min = <span class="tok-num">0.0</span>,
            .max = <span class="tok-num">0.05</span>,
            .fmt = <span class="tok-str">"{d:.3}"</span>,
        });
        <span class="tok-comment">// * ABOVE 1 THE CONTACT ABSORBS RATHER THAN REBOUNDS, which is most of what separates</span>
        <span class="tok-comment">// flesh from rubber.</span>
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"damping (1 = critical)"</span>, &amp;s.bridge.flesh.damp_ratio, .{
            .min = <span class="tok-num">0.5</span>,
            .max = <span class="tok-num">6.0</span>,
            .fmt = <span class="tok-str">"{d:.1}"</span>,
        });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"drop it"</span>, .{})) {
            <span class="tok-fn">dropLimp</span>(s);
        }
        <span class="tok-kw">var</span> newton: bool = s.imported.model.opt.solver.algorithm == .newton;
        <span class="tok-kw">if</span> (u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"Newton solver (else PGS)"</span>, &amp;newton)) {
            s.imported.model.opt.solver.algorithm = <span class="tok-kw">if</span> (newton) .newton <span class="tok-kw">else</span> .pgs;
        }
        <span class="tok-comment">// * THE NUMBER IS THE POINT. Limp, on the floor, PGS settles to about 2.7 and Newton to</span>
        <span class="tok-comment">// about 0.4 - the same pose either way, so what differs is whether the body stops. Toggle</span>
        <span class="tok-comment">// the solver and watch this figure, not the mesh.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"peak joint speed {d:.2}  ({d} contacts)"</span>, .{ s.recent_peak_speed, s.data.contact_count });

        <span class="tok-comment">// -- *** THE MEASUREMENT THIS DEMO EXISTS TO SHOW --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Drop it limp and watch this fall. On a body that has stopped, it should reach nothing.</span>
        <span class="tok-comment">// MuJoCo on the identical model and drop settles to 0.0003 - 0.0007 J. Ours levels off</span>
        <span class="tok-comment">// around 0.014 - 0.026, roughly forty times higher, and the energy is arriving through the</span>
        <span class="tok-comment">// contact solve - measured, about 1.5 J per two seconds, mostly balanced by joint damping</span>
        <span class="tok-comment">// at an equilibrium that sits too high.</span>
        u.<span class="tok-fn">text</span>(<span class="tok-str">"kinetic energy {d:.5} J   (MuJoCo settles to ~0.0005)"</span>, .{s.kinetic_energy});
        <span class="tok-kw">if</span> (s.energy_len &gt; <span class="tok-num">2</span>) {
            <span class="tok-kw">var</span> peak: f32 = <span class="tok-num">0.001</span>;
            <span class="tok-kw">for</span> (s.energy_history[<span class="tok-num">0</span>..s.energy_len]) |value| {
                peak = <span class="tok-builtin">@max</span>(peak, value);
            }
            u.<span class="tok-fn">plotLines</span>(<span class="tok-str">""</span>, s.energy_history[<span class="tok-num">0</span>..s.energy_len], .{
                .min = <span class="tok-num">0</span>,
                .max = peak,
                .width = panel_w - font_size * <span class="tok-num">2.0</span>,
                .height = font_size * <span class="tok-num">3.5</span>,
                .overlay = <span class="tok-str">"kinetic energy, last ~18 s"</span>,
            });
        }

        <span class="tok-comment">// * AND THE KNOB THAT MOVES IT, WITH THE CAVEAT ATTACHED. Tightening this to 0.2 measured</span>
        <span class="tok-comment">// seven times less energy - 0.0179 J down to 0.0026 - but turning it OFF also helped, which</span>
        <span class="tok-comment">// breaks monotonicity. A landed ragdoll is chaotic, so one run cannot tell signal from</span>
        <span class="tok-comment">// variation, and this is on screen to be PLAYED with rather than as a tuned default.</span>
        <span class="tok-kw">var</span> recovery: f32 = s.imported.model.opt.solver.max_recovery_velocity;
        <span class="tok-kw">if</span> (u.<span class="tok-fn">slider</span>(<span class="tok-str">"penetration recovery cap"</span>, &amp;recovery, .{ .min = <span class="tok-num">0.05</span>, .max = <span class="tok-num">8.0</span>, .fmt = <span class="tok-str">"{d:.2}"</span> })) {
            s.imported.model.opt.solver.max_recovery_velocity = recovery;
        }
        <span class="tok-comment">// * THE ONE-LEG POSE IS BUILT, NOT LOADED - see `buildOneLegPose`. Arms out doubles the</span>
        <span class="tok-comment">// flywheel (15.54 against 7.92 kg*m^2/s) and the mass starts over the foot rather than</span>
        <span class="tok-comment">// 40 mm off it.</span>
        _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"shove m/s"</span>, &amp;s.shove_speed, .{ .min = <span class="tok-num">0.05</span>, .max = <span class="tok-num">1.50</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  arms are worth ~0.23 m/s; try 0.15-0.40"</span>, .{});
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"SHOVE (random direction)"</span>, .{})) {
            <span class="tok-fn">shove</span>(s);
        }
        u.<span class="tok-fn">text</span>(<span class="tok-str">"  last shove ({d:&gt;5.2},{d:&gt;5.2})"</span>, .{ s.shove_dir[<span class="tok-num">0</span>], s.shove_dir[<span class="tok-num">1</span>] });
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"throw ball"</span>, .{})) {
            s.want_throw = true;
        }
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"stand"</span>, .{})) {
            s.one_leg = false;
            <span class="tok-kw">for</span> (s.ankle_roll_dof) |roll| {
                <span class="tok-kw">if</span> (roll &lt; s.imported.model.nv) {
                    s.balance_hold.powered[roll] = true;
                }
            }
            <span class="tok-fn">restorePose</span>(s, null);
        }
        u.<span class="tok-fn">separator</span>();
        <span class="tok-comment">// -- * THE MODEL'S OWN KEYFRAMES, and one of them is meant to fail --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// None of the four is the standing pose, which is why `home` comes from `qpos0`.</span>
        <span class="tok-comment">// Measured, holding each for three seconds at kp 400:</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">//     squat              0.596 -&gt; 0.575   holds</span>
        <span class="tok-comment">//     prone              0.076 -&gt; 0.084   holds</span>
        <span class="tok-comment">//     supine             0.081 -&gt; 0.129   holds</span>
        <span class="tok-comment">//     stand_on_left_leg  1.220 -&gt; 0.150   FALLS</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The one-legged pose is not a bug and not a gains problem: holding it needs the robot</span>
        <span class="tok-comment">// to keep its centre of mass over one foot, which a joint-space PD law has no way to</span>
        <span class="tok-comment">// do - it drives joints toward angles and knows nothing about where the mass is. That</span>
        <span class="tok-comment">// is the job of a balance controller, and it is the honest next thing to build.</span>
        <span class="tok-kw">for</span> (s.robot.keyframes, <span class="tok-num">0</span>..) |key, i| {
            <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(key.name, .{})) {
                <span class="tok-fn">restorePose</span>(s, <span class="tok-builtin">@intCast</span>(i));
            }
        }
        <span class="tok-comment">// *** AND THE BUILT ONE, WHICH IS THE INTERESTING CASE. Unlike the four above it is not</span>
        <span class="tok-comment">// in the file - `buildOneLegPose` lifts the left leg, puts the arms out at 45 degrees by</span>
        <span class="tok-comment">// IK, and runs a 2x2 Newton on the support hip until the mass sits over the foot (0.6 mm,</span>
        <span class="tok-comment">// one step). Arms out is worth **15.54 kg*m^2/s** of angular momentum against 7.92 folded.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * AND IT TURNS THE BALANCE CONTROLLER ON, because a joint-space PD cannot hold a</span>
        <span class="tok-comment">// one-legged stand at any gain - the comment above measures `stand_on_left_leg` falling</span>
        <span class="tok-comment">// from 1.220 to 0.150. Offering the pose with the only controller that could hold it</span>
        <span class="tok-comment">// switched off would be offering a pose that always falls.</span>
        <span class="tok-comment">// ** IT DOES NOT HOLD YET, AND THE MEASUREMENTS SAY WHERE IT STANDS:</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">//     pose servo alone        torso 1.296 -&gt; 0.452, tilt 2.31   falls</span>
        <span class="tok-comment">//     + pitch ankle only      torso        -&gt; 0.480, tilt 2.45   falls</span>
        <span class="tok-comment">//     + BOTH ankles           torso        -&gt; 0.486, tilt 0.16   falls</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// * THE ROLL ANKLE IS MOST OF THE DIFFERENCE. Driving only `ankle_y` left the LATERAL</span>
        <span class="tok-comment">// axis uncontrolled, and on one leg that is the hard direction - the foot is 0.21 m long</span>
        <span class="tok-comment">// and 0.06 m WIDE. With both ankles the tilt drops from 2.45 rad to **0.16**: it no</span>
        <span class="tok-comment">// longer tips over. It SINKS instead, torso to 0.486, which is a different failure and</span>
        <span class="tok-comment">// not a torque ceiling (`max_torque` defaults to 1000 N*m). The support leg is folding</span>
        <span class="tok-comment">// and why is the open question.</span>
        <span class="tok-kw">if</span> (u.<span class="tok-fn">button</span>(<span class="tok-str">"stand on right leg (built)"</span>, .{})) {
            s.one_leg = true;
            <span class="tok-kw">for</span> (s.ankle_roll_dof) |roll| {
                <span class="tok-kw">if</span> (roll &lt; s.imported.model.nv) {
                    s.balance_hold.powered[roll] = false;
                }
            }
            <span class="tok-fn">restorePose</span>(s, null);
            <span class="tok-kw">if</span> (s.ankles_ready) {
                s.balance_on = true;
            }
        }

        u.<span class="tok-fn">separator</span>();

        <span class="tok-comment">// -- ** REACH WITH ONE HAND WHILE THE CENTRE OF MASS STAYS PUT --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Moving an arm moves the CM, and a humanoid whose CM leaves its feet falls over. With</span>
        <span class="tok-comment">// "hold CM" on, the balance correction is projected into the nullspace of the reach -</span>
        <span class="tok-comment">// it uses only the joint motions the hand does not feel, so the robot leans and</span>
        <span class="tok-comment">// counterweights with its spine and free arm while the hand goes where it was sent.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Turn it off and watch `CM drift` grow: measured five times larger without it.</span>
        _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"reach (right hand)"</span>, &amp;s.ik_on);
        <span class="tok-kw">if</span> (s.ik_on) {
            _ = u.<span class="tok-fn">checkbox</span>(<span class="tok-str">"hold CM over the feet"</span>, &amp;s.hold_com);
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"hand x"</span>, &amp;s.ik_goal[<span class="tok-num">0</span>], .{ .min = -<span class="tok-num">0.7</span>, .max = <span class="tok-num">0.7</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"hand y"</span>, &amp;s.ik_goal[<span class="tok-num">1</span>], .{ .min = -<span class="tok-num">0.7</span>, .max = <span class="tok-num">0.7</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            _ = u.<span class="tok-fn">slider</span>(<span class="tok-str">"hand z"</span>, &amp;s.ik_goal[<span class="tok-num">2</span>], .{ .min = <span class="tok-num">0.2</span>, .max = <span class="tok-num">1.9</span>, .fmt = <span class="tok-str">"{d:.2}"</span> });
            u.<span class="tok-fn">text</span>(<span class="tok-str">"   reach err {d:.4} m   CM drift {d:.4} m"</span>, .{ s.ik_error, s.com_error });
        }
    }
    <span class="tok-kw">return</span> captured;
}

<span class="tok-kw">pub</span> <span class="tok-kw">const</span> app: z.<span class="tok-fn">AppSpec</span>(State) = .{
    .config = .{
        .window = .{
            .title = <span class="tok-str">"zimr - WebGPU - humanoid from MJCF"</span>,
            .width = <span class="tok-num">820</span>,
            .height = <span class="tok-num">680</span>,
            .scale_mode = .responsive,
            <span class="tok-comment">// 3D needs a depth buffer or nearer geometry does not occlude farther.</span>
            .depth_format = .depth24_plus,
        },
    },
    .init = initState,
    .memory = .managed,
    .deinit = deinit,
    .update = update,
};
