<h1>humanoid</h1>
<figure class="code src-file" data-path="examples/humanoid/humanoid.zig" data-lines="1702"><figcaption><span>examples/humanoid/humanoid.zig</span><span>1702 lines</span></figcaption><pre><code class="zig"><span class="tok-comment">//! humanoid - MuJoCo's own humanoid, standing on its own two feet.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- * WHY THIS IS THE HARD ONE --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! A quadruped standing is nearly a table. This is an **inverted pendulum on two small feet**:</span>
<span class="tok-comment">//! 1.28 m tall, 40.8 kg, 27 degrees of freedom, held up by ankle torque alone. Every joint has</span>
<span class="tok-comment">//! to be actively driven - there is no pose it simply rests in.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! -- ** THE THING TO TRY: DRAG `kp` --</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The band that works is narrow, and both edges fail in different ways:</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//!   * **too soft** (kp ~100) - it folds under its own weight and sits down;</span>
<span class="tok-comment">//!   * **kp 400** - it stands, drifting 4.5 mm over ten seconds;</span>
<span class="tok-comment">//!   * **too stiff** (kp ~1000) - the controller outruns the timestep and throws the robot.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! The stiff-end failure looks like a physics explosion and is not one: it is a controller</span>
<span class="tok-comment">//! interacting with a fixed timestep, which is worth seeing precisely because it is so easy to</span>
<span class="tok-comment">//! misread.</span>
<span class="tok-comment">//!</span>
<span class="tok-comment">//! **Shove** it, and pick a keyframe - the model ships four, including standing on one leg.</span>

<span class="tok-kw">const</span> std = <span class="tok-builtin">@import</span>(<span class="tok-str">"std"</span>);
<span class="tok-kw">const</span> common = <span class="tok-builtin">@import</span>(<span class="tok-str">"example_common"</span>);

<span class="tok-comment">/// A wasm safety trap is a bare `RuntimeError: unreachable` without this - no message, no line.</span>
<span class="tok-comment">/// See `common.reportPanic`: six turns of debugging went to a panic that named itself in one</span>
<span class="tok-comment">/// build once a handler existed.</span>
<span class="tok-kw">pub</span> <span class="tok-kw">const</span> panic = std.debug.<span class="tok-fn">FullPanic</span>(common.reportPanic);
<span class="tok-kw">const</span> Allocator = std.mem.Allocator;

<span class="tok-kw">const</span> z = <span class="tok-builtin">@import</span>(<span class="tok-str">"zimr"</span>);
<span class="tok-kw">const</span> zm = <span class="tok-builtin">@import</span>(<span class="tok-str">"zm"</span>);
<span class="tok-kw">const</span> rbt = z.robot;
<span class="tok-kw">const</span> zp = z.zimrphysics;
<span class="tok-kw">const</span> mjcf = z.mjcf;
<span class="tok-kw">const</span> rmj = z.robot_mjcf;
<span class="tok-kw">const</span> bridge_mod = z.robot_physics;
<span class="tok-kw">const</span> ctl = z.robot_control;
<span class="tok-kw">const</span> mpc = z.robot_mpc;
<span class="tok-kw">const</span> clamp = zm.clamp;

<span class="tok-comment">/// -- *** A CAPSULE'S SEGMENT RUNS ALONG LOCAL **Y** IN ZIMR, NOT Z --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `GeomShape` says so in one line - "zimr's capsule convention, not MuJoCo's" - and every foot</span>
<span class="tok-comment">/// calculation here used Z. The endpoints were therefore perpendicular to the real sole, which</span>
<span class="tok-comment">/// is why the sole appeared to be raked 5.5 degrees even at `qpos0` (where this robot stands, so</span>
<span class="tok-comment">/// it cannot be), why the built pose looked tilted 13.2 degrees, and why fitting a plane through</span>
<span class="tok-comment">/// those points rotated the body 45 degrees.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// **Three turns of geometry findings were artefacts of this one line.** The tell was sitting in</span>
<span class="tok-comment">/// the very first measurement: a flat-footed robot at its own standing pose reported a 2 cm</span>
<span class="tok-comment">/// spread across its sole, and that is impossible.</span>
<span class="tok-kw">const</span> capsule_axis: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">1</span>, <span class="tok-num">0</span>);
<span class="tok-kw">const</span> atan2Rad = zm.atan2Rad;
<span class="tok-kw">const</span> dot3 = zm.dot3;
<span class="tok-kw">const</span> length3 = zm.length3;
<span class="tok-kw">const</span> cross = zm.cross;
<span class="tok-kw">const</span> pi = zm.pi;
<span class="tok-kw">const</span> Color = zm.Color;

<span class="tok-kw">const</span> Vec = zm.Vec;
<span class="tok-kw">const</span> Mat = zm.Mat;
<span class="tok-kw">const</span> vec = zm.vec;
<span class="tok-kw">const</span> normalize3 = zm.normalize3;
<span class="tok-kw">const</span> splat = zm.splat;
<span class="tok-kw">const</span> float = zm.float;
<span class="tok-kw">const</span> ui = z.ui;
<span class="tok-kw">const</span> Camera3D = zm.Camera3D;
<span class="tok-kw">const</span> mulMat = zm.mulMat;
<span class="tok-kw">const</span> translation = zm.translation;
<span class="tok-kw">const</span> scaling = zm.scaling;
<span class="tok-kw">const</span> quatToMat = zm.quatToMat;
<span class="tok-kw">const</span> identity = zm.identity;

<span class="tok-comment">/// The Go1 runs at 500 Hz in Menagerie, and its contacts want it.</span>
<span class="tok-kw">const</span> atkinson_mono_ttf = <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"atkinson_mono_ttf"</span>);

<span class="tok-kw">const</span> timestep: f32 = <span class="tok-num">1.0</span> / <span class="tok-num">500.0</span>;

<span class="tok-comment">/// How many projectiles the scene carries.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- ** A FIXED POOL, RECYCLED, RATHER THAN SPAWNED ON DEMAND --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// A ball has to be a body in the ROBOT'S OWN TREE to hit it properly (section 4k) - that is the</span>
<span class="tok-comment">/// whole point of the unified tree, and it is what makes the impact push back on the legs</span>
<span class="tok-comment">/// with the right mass. But a tree is built once: adding a body means rebuilding the model,</span>
<span class="tok-comment">/// which throws away the robot's state mid-flight.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// So the balls exist from the start, parked below the floor where nothing can reach them,</span>
<span class="tok-comment">/// and a throw teleports one into place with a velocity. Recycling the oldest means the</span>
<span class="tok-comment">/// scene never grows and a rapid-fire user cannot exhaust it.</span>
<span class="tok-kw">const</span> ball_count: usize = <span class="tok-num">6</span>;
<span class="tok-kw">const</span> ball_radius: f32 = <span class="tok-num">0.045</span>;

<span class="tok-kw">const</span> ball_names = [_][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"ball0"</span>, <span class="tok-str">"ball1"</span>, <span class="tok-str">"ball2"</span>, <span class="tok-str">"ball3"</span>, <span class="tok-str">"ball4"</span>, <span class="tok-str">"ball5"</span> };
<span class="tok-kw">const</span> ball_col: Color = .{ .r = <span class="tok-num">220</span>, .g = <span class="tok-num">110</span>, .b = <span class="tok-num">70</span>, .a = <span class="tok-num">255</span> };

<span class="tok-comment">/// Where an unthrown ball waits: far below the floor, spread out so two never overlap.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THEY ARE STILL SIMULATED DOWN THERE, and that is fine - nothing is near them, so they</span>
<span class="tok-comment">/// contribute no contacts and cost only their six DOFs in the mass matrix. Parking beats</span>
<span class="tok-comment">/// deleting because a tree cannot gain a body without being rebuilt, and rebuilding mid-throw</span>
<span class="tok-comment">/// would discard the robot's state.</span>
<span class="tok-comment">/// Where an unthrown ball waits.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** ON THE FLOOR, NOT UNDER IT --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// This parked them at z = -2.0, below the floor, on the reasoning that nothing could reach</span>
<span class="tok-comment">/// them there. Nothing could - and **they fell forever**, accelerating into empty space and</span>
<span class="tok-comment">/// accumulating kinetic energy without bound. Six balls in permanent free-fall put **17 000 J**</span>
<span class="tok-comment">/// into a readout that was supposed to describe a humanoid lying still, and the number was</span>
<span class="tok-comment">/// identical at every controller gain, which is what gave it away.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * A DEMO MUST NOT CONTAIN ANYTHING ACCELERATING TO INFINITY, however far offscreen. Resting</span>
<span class="tok-comment">/// on the floor costs the same nothing and stays finite.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">parkedBall</span>(i: usize) Vec {
    <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(-<span class="tok-num">3.0</span> - <span class="tok-fn">float</span>(i) * <span class="tok-num">0.3</span>, <span class="tok-num">0</span>, ball_radius);
}

<span class="tok-kw">const</span> bg: Color = .{ .r = <span class="tok-num">18</span>, .g = <span class="tok-num">14</span>, .b = <span class="tok-num">16</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> trunk_col: Color = .{ .r = <span class="tok-num">130</span>, .g = <span class="tok-num">128</span>, .b = <span class="tok-num">132</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> link_col: Color = .{ .r = <span class="tok-num">90</span>, .g = <span class="tok-num">205</span>, .b = <span class="tok-num">190</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> goal_reached_col: Color = .{ .r = <span class="tok-num">120</span>, .g = <span class="tok-num">230</span>, .b = <span class="tok-num">140</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> goal_straining_col: Color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">150</span>, .b = <span class="tok-num">90</span>, .a = <span class="tok-num">255</span> };
<span class="tok-kw">const</span> contact_col: Color = .{ .r = <span class="tok-num">240</span>, .g = <span class="tok-num">200</span>, .b = <span class="tok-num">60</span>, .a = <span class="tok-num">255</span> };

<span class="tok-kw">const</span> State = <span class="tok-kw">struct</span> {
    gpa: Allocator,
    doc: z.codecs.xml.Document,
    robot: mjcf.Robot,
    imported: rmj.Imported,
    data: rbt.Data,
    world: zp.World,
    bridge: bridge_mod.Bridge,
    cam: z.OrbitCamera,
    actuation: ctl.Actuation,
    ik_scratch: []Vec,
    <span class="tok-comment">/// Where the right hand is being sent, and where the CM must stay.</span>
    ik_goal: Vec,
    com_goal: [<span class="tok-num">2</span>]f32,
    ik_on: bool,
    hold_com: bool,
    ik_error: f32,
    com_error: f32,
    hand: u32,
    <span class="tok-comment">/// What the controller is currently asked to hold, for the panel.</span>
    pose_label: []<span class="tok-kw">const</span> u8,
    ui_host: z.UiHost,
    font: z.Font,
    <span class="tok-comment">/// The pose being held - a copy of the `home` keyframe's `qpos`.</span>
    home: []f32,
    <span class="tok-comment">/// Servo gains, live.</span>
    kp: f32,
    kv: f32,
    max_torque: f32,
    <span class="tok-comment">/// Which free body the next throw will use, cycling through `ball_count`.</span>
    next_ball: usize,
    <span class="tok-comment">/// Set by the panel, consumed by `update` once the camera is known.</span>
    want_throw: bool,
    <span class="tok-comment">/// Meshes for the three geom shapes the Go1 actually uses.</span>
    cylinder: z.Mesh,
    sphere: z.Mesh,
    cube: z.Mesh,
    transform: [<span class="tok-num">1</span>]Mat,
    accumulator: f32,
    physics_on: bool,
    <span class="tok-comment">/// Ragdoll: no controller at all, every joint free.</span>
    limp: bool,
    <span class="tok-comment">/// Balance mode: the planner chooses the centre of pressure and the ankles realise it.</span>
    balance_on: bool,
    balance_plan: mpc.BalancePlan,
    <span class="tok-comment">/// The pose servo with the ankles removed - they are driven by the pressure command.</span>
    balance_hold: ctl.Actuation,
    ankle_dof: [<span class="tok-num">2</span>]u32,
    <span class="tok-comment">/// The roll ankle for each foot - `ankle_x`, the second joint the foot carries.</span>
    ankle_roll_dof: [<span class="tok-num">2</span>]u32,
    ankle_foot: [<span class="tok-num">2</span>]u32,
    ankle_damping: f32,
    <span class="tok-comment">/// How much angular momentum per second the planner may spend. Zero is the ankle strategy</span>
    <span class="tok-comment">/// alone - no arms, nothing to watch.</span>
    momentum_rate: f32,
    <span class="tok-comment">/// Which dofs are the flywheel: arms and abdomen.</span>
    limb_dof: []bool,
    mom_lin: []Vec,
    mom_ang: []Vec,
    mom_s1: []Vec,
    mom_s2: []Vec,
    <span class="tok-comment">/// How far the limbs have swung from their held pose. Drawing and readout only.</span>
    limb_swing: f32,
    com_jac: []Vec,
    com_scratch: []Vec,
    want_cop: [<span class="tok-num">2</span>]f32,
    <span class="tok-comment">/// Bodies before the first ball - the robot's own.</span>
    robot_body_count: u32,
    <span class="tok-comment">/// Whether both ankles were located, so the mode can be offered at all.</span>
    ankles_ready: bool,
    <span class="tok-comment">/// How hard the shove button pushes, in m/s of trunk velocity.</span>
    shove_speed: f32,
    <span class="tok-comment">/// The direction of the last shove, and the state for picking the next one.</span>
    shove_dir: [<span class="tok-num">2</span>]f32,
    shove_seed: u32,
    <span class="tok-comment">/// Scratch for `buildOneLegPose`, and the arm chains it drives.</span>
    pose_scratch: []f32,
    arm_act_right: ctl.Actuation,
    arm_act_left: ctl.Actuation,
    one_leg: bool,
    carried_load: f32,
    <span class="tok-comment">/// Peak joint speed over the last second, so the twitch is a NUMBER.</span>
    recent_peak_speed: f32,
    speed_window: f32,
    <span class="tok-comment">/// Total kinetic energy, 1/2*v^TMv, sampled each frame.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// -- ** THE METRIC THAT PEAK VELOCITY WAS NOT --</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// A hand with almost no inertia spinning at 2 rad/s carries nearly no energy, so "the</span>
    <span class="tok-comment">/// joints move ten times faster than MuJoCo's" overstated a real problem by measuring the</span>
    <span class="tok-comment">/// wrong thing. Energy weights each DOF by what moving it actually costs, and on a limp</span>
    <span class="tok-comment">/// body coming to rest it should fall to nothing.</span>
    <span class="tok-comment">///</span>
    <span class="tok-comment">/// * MuJoCo ON THIS SAME DROP settles to 0.0003 - 0.0007 J. Ours sits around 0.014 - 0.026,</span>
    <span class="tok-comment">/// and closing that gap is open work - which is why the figure is on screen rather than in</span>
    <span class="tok-comment">/// a note.</span>
    <span class="tok-comment">/// How many leading DOFs belong to the humanoid rather than to the loose balls. The</span>
    <span class="tok-comment">/// importer lays the robot out first, so this is a prefix.</span>
    robot_dof_count: usize,
    kinetic_energy: f32,
    energy_history: [<span class="tok-num">180</span>]f32,
    energy_len: usize,
    energy_clock: f32,
    peak_force: f32,
};

<span class="tok-kw">fn</span> <span class="tok-fn">initState</span>(gpa: Allocator, f: *z.Frame, s: *State) !void {
    s.gpa = gpa;
    s.doc = <span class="tok-kw">try</span> z.codecs.xml.<span class="tok-fn">parse</span>(gpa, <span class="tok-builtin">@embedFile</span>(<span class="tok-str">"humanoid.xml"</span>), null);
    s.robot = <span class="tok-kw">try</span> mjcf.<span class="tok-fn">readRobot</span>(gpa, &amp;s.doc);
    <span class="tok-comment">// * THE PROJECTILES JOIN THE ROBOT'S TREE, which is what makes them able to hit it.</span>
    <span class="tok-comment">// A ball in zimrphysics alone would be resolved by a different solver treating the robot</span>
    <span class="tok-comment">// as immovable - the exact approximation section 4k removed. In the tree, an impact is one</span>
    <span class="tok-comment">// constraint between two inertias and the legs feel the real mass.</span>
    <span class="tok-kw">var</span> balls: [ball_count]z.robot_scene.FreeBody = undefined;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..ball_count) |i| {
        balls[i] = .{
            .name = ball_names[i],
            .pos = <span class="tok-fn">parkedBall</span>(i),
            .geoms = &amp;.{.{ .shape = .{ .sphere = .{ .radius = ball_radius } }, .mass = <span class="tok-num">0.6</span> }},
        };
    }
    <span class="tok-kw">var</span> options: rbt.Options = .{
        <span class="tok-comment">// * THE SMOKE RUN TRAPS IN `addContactRows` WITH `integerOutOfBounds`, AND IT IS NOT</span>
        <span class="tok-comment">// A CAPACITY PROBLEM - raising this to 384 changed nothing, so a failed `@intCast`</span>
        <span class="tok-comment">// inside the engine is the fault, not the budget. **Pre-existing**: an old snapshot</span>
        <span class="tok-comment">// (zimr1210, from before any of the balance work) traps identically when run unchanged.</span>
        .max_contacts = <span class="tok-num">128</span>,
        .timestep = timestep,
        <span class="tok-comment">// Z-up, to match the model's own frame.</span>
        .gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">9.81</span>),
    };
    <span class="tok-comment">// ** BUILT FOR NEWTON SO THE SOLVER CAN BE SWITCHED LIVE. Its working set - an nv x nv</span>
    <span class="tok-comment">// Hessian and a row of scratch - is sized once at `Data.init` from this option, so a model</span>
    <span class="tok-comment">// built for PGS cannot be switched to Newton later without reallocating. Building the other</span>
    <span class="tok-comment">// way round is free: Newton's buffers simply go unread while PGS is selected, and `robot.zig`</span>
    <span class="tok-comment">// asserts loudly if this is got backwards rather than writing past the end of an empty slice.</span>
    options.solver.algorithm = .newton;
    s.imported = <span class="tok-kw">try</span> rmj.<span class="tok-fn">buildScene</span>(gpa, &amp;s.robot, &amp;balls, options);
    s.data = <span class="tok-kw">try</span> rbt.Data.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);

    <span class="tok-comment">// * THE HUMANOID'S DOFs ARE THE ONES BEFORE THE FIRST BALL. `buildScene` appends the loose</span>
    <span class="tok-comment">// bodies after the robot, so counting up to the first ball's joint gives the prefix - and</span>
    <span class="tok-comment">// reading the model rather than hardcoding 27 keeps it right if the model changes.</span>
    s.robot_dof_count = s.imported.model.nv;
    <span class="tok-kw">if</span> (s.imported.<span class="tok-fn">bodyIndex</span>(ball_names[<span class="tok-num">0</span>])) |first_ball| {
        <span class="tok-kw">const</span> joint: u32 = s.imported.model.body_jnt_adr[first_ball];
        s.robot_dof_count = s.imported.model.jnt_dof_adr[joint];
    }

    s.world = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, <span class="tok-num">128</span>);
    s.world.gravity = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">9.81</span>);
    <span class="tok-kw">const</span> ground: zp.ShapeId = <span class="tok-kw">try</span> s.world.shapes.<span class="tok-fn">add</span>(gpa, .{
        .box = .{ .half_extent = <span class="tok-fn">vec</span>(<span class="tok-num">5</span>, <span class="tok-num">5</span>, <span class="tok-num">0.5</span>), .convex_radius = <span class="tok-num">0.01</span> },
    });
    _ = <span class="tok-kw">try</span> s.world.<span class="tok-fn">createBody</span>(.{
        .shape = ground,
        .position = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, -<span class="tok-num">0.5</span>),
        .motion_type = .static,
    });

    <span class="tok-comment">// * THE DEFAULT POSE IS THE STANDING ONE. Unlike the Go1, whose `home` keyframe is what</span>
    <span class="tok-comment">// stands it up, this model's four keyframes are squat / one-legged / prone / supine - all</span>
    <span class="tok-comment">// interesting and none of them the pose to hold. `qpos0` is upright.</span>
    rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);
    s.bridge = <span class="tok-kw">try</span> .<span class="tok-fn">init</span>(gpa, &amp;s.world, &amp;s.imported.model, &amp;s.data, <span class="tok-num">128</span>);
    s.bridge.<span class="tok-fn">listen</span>(&amp;s.world);

    s.home = <span class="tok-kw">try</span> gpa.<span class="tok-fn">dupe</span>(f32, s.data.pos);
    s.actuation = <span class="tok-kw">try</span> ctl.Actuation.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);

    <span class="tok-comment">// * THE GENERATED CYLINDER SPANS z in [0, height], NOT [-h/2, +h/2]. Its parametric</span>
    <span class="tok-comment">// surface is `(r*sin theta, r*cos theta, height*u)` with `u in [0,1]`, so a unit cylinder sits</span>
    <span class="tok-comment">// entirely ABOVE the origin. Scaling it to a capsule's length therefore offsets every</span>
    <span class="tok-comment">// limb by half its own length - legs that float away from their joints. Generating it</span>
    <span class="tok-comment">// pre-centred is one number here and saves a translate in every draw.</span>
    s.cylinder = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCylinder</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">16</span>, <span class="tok-num">2</span>);
    s.sphere = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshSphere</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">10</span>, <span class="tok-num">8</span>);
    s.cube = <span class="tok-kw">try</span> z.<span class="tok-fn">genMeshCube</span>(gpa, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>);
    s.transform = .{<span class="tok-fn">identity</span>()};
    s.cam = z.OrbitCamera.<span class="tok-fn">init</span>(<span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0.25</span>, <span class="tok-num">0</span>), <span class="tok-num">1.4</span>);
    s.font = <span class="tok-kw">try</span> z.<span class="tok-fn">loadFont</span>(f, gpa, atkinson_mono_ttf, <span class="tok-num">22</span>);
    s.ui_host = z.UiHost.<span class="tok-fn">init</span>(gpa, s.font);
    s.kp = <span class="tok-num">400.0</span>;
    s.kv = <span class="tok-num">10.0</span>;
    s.max_torque = <span class="tok-num">300.0</span>;
    s.ankle_damping = <span class="tok-num">8.0</span>;
    <span class="tok-comment">// * 0.25 m/s BY DEFAULT - just inside what the arms are worth, so the slider opens on the</span>
    <span class="tok-comment">// band where the comparison means something rather than on one that always falls.</span>
    s.shove_speed = <span class="tok-num">0.25</span>;
    s.shove_dir = .{ <span class="tok-num">1</span>, <span class="tok-num">0</span> };
    s.shove_seed = <span class="tok-num">0x2545f491</span>;
    s.one_leg = false;
    s.pose_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(f32, s.imported.model.nq);
    s.arm_act_right = <span class="tok-kw">if</span> (s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"hand_right"</span>)) |h|
        <span class="tok-kw">try</span> ctl.<span class="tok-fn">limbActuation</span>(gpa, &amp;s.imported.model, h)
    <span class="tok-kw">else</span>
        <span class="tok-kw">try</span> ctl.Actuation.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);
    s.arm_act_left = <span class="tok-kw">if</span> (s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"hand_left"</span>)) |h|
        <span class="tok-kw">try</span> ctl.<span class="tok-fn">limbActuation</span>(gpa, &amp;s.imported.model, h)
    <span class="tok-kw">else</span>
        <span class="tok-kw">try</span> ctl.Actuation.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);
    <span class="tok-comment">// * DERIVED, NOT PICKED. Both arms together carry about **7.7 kg*m^2/s** - spin 2.04 plus</span>
    <span class="tok-comment">// orbital 1.80 per arm - and reaching that over a ~0.2 s swing needs a rate near 40. The old</span>
    <span class="tok-comment">// value of 80 let the planner ask for **16.4**, which is 2.1x what the body owns; the</span>
    <span class="tok-comment">// tracker then demanded 55 rad/s of arm velocity, and that is what exploded.</span>
    <span class="tok-comment">// * DERIVED, NOT PICKED. Both arms together carry about **7.68 kg*m^2/s** - spin 2.04 plus</span>
    <span class="tok-comment">// orbital 1.80 each - and reaching that over a ~0.2 s swing needs a rate near 40. The value</span>
    <span class="tok-comment">// of 80 that exploded let the planner ask for **16.4**, which is 2.1x what the body owns;</span>
    <span class="tok-comment">// the tracker then demanded 55 rad/s of arm velocity, and that was the explosion.</span>
    s.momentum_rate = <span class="tok-num">40.0</span>;
    s.limb_swing = <span class="tok-num">0</span>;
    s.mom_lin = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, s.imported.model.nv);
    s.mom_ang = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, s.imported.model.nv);
    s.mom_s1 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, s.imported.model.nv);
    s.mom_s2 = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, s.imported.model.nv);
    s.limb_dof = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(bool, s.imported.model.nv);
    <span class="tok-builtin">@memset</span>(s.limb_dof, false);
    <span class="tok-comment">// * AND THE ARMS LEAVE THE POSE SERVO. Holding a joint at an angle while also commanding it</span>
    <span class="tok-comment">// a velocity is two controllers fighting: at kp 400 the servo wins and nothing swings, and</span>
    <span class="tok-comment">// where it does not, they oscillate. Done further below, once the limb set is known.</span>
    {
        <span class="tok-comment">// * ARMS AND ABDOMEN - what a person actually windmills and banks with, and where the</span>
        <span class="tok-comment">// angular momentum the ground supplies has to GO. If the trunk takes it instead, the</span>
        <span class="tok-comment">// trunk rotates, which is falling over.</span>
        <span class="tok-kw">const</span> model: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
        <span class="tok-comment">// -- *** ARMS ONLY. THE WAIST AND PELVIS ARE NOT A FLYWHEEL --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Measured from the mass matrix, those joints carry inertias of **8.72 and 5.99** - they</span>
        <span class="tok-comment">// are the whole upper body. Driving them to hold momentum moves half the robot's mass,</span>
        <span class="tok-comment">// which moves the centre of mass, which the pressure controller is simultaneously trying</span>
        <span class="tok-comment">// to regulate. Two controllers fighting over one variable.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The arms are 0.14 to 0.19 and sit far out, so they carry momentum without meaningfully</span>
        <span class="tok-comment">// moving the mass. That is exactly what a flywheel is for.</span>
        <span class="tok-kw">const</span> limb_names = [_][]<span class="tok-kw">const</span> u8{
            <span class="tok-str">"upper_arm_right"</span>, <span class="tok-str">"lower_arm_right"</span>, <span class="tok-str">"hand_right"</span>,
            <span class="tok-str">"upper_arm_left"</span>,  <span class="tok-str">"lower_arm_left"</span>,  <span class="tok-str">"hand_left"</span>,
        };
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..model.njnt) |j| {
            <span class="tok-kw">const</span> body: u32 = model.jnt_body[j];
            <span class="tok-kw">var</span> is_limb: bool = false;
            <span class="tok-kw">for</span> (limb_names) |name| {
                <span class="tok-kw">if</span> (s.imported.<span class="tok-fn">bodyIndex</span>(name)) |index| {
                    <span class="tok-kw">if</span> (index == body) {
                        is_limb = true;
                    }
                }
            }
            <span class="tok-kw">if</span> (!is_limb) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..model.jnt_type[j].<span class="tok-fn">dofCount</span>()) |k| {
                <span class="tok-kw">const</span> dof: u32 = model.jnt_dof_adr[j] + <span class="tok-builtin">@as</span>(u32, <span class="tok-builtin">@intCast</span>(k));
                <span class="tok-kw">if</span> (dof &lt; model.nv) {
                    s.limb_dof[dof] = true;
                    <span class="tok-comment">// * OUT OF THE POSE SERVO. A joint cannot be held at an angle and commanded</span>
                    <span class="tok-comment">// a velocity by two controllers at once - at kp 400 the servo wins and</span>
                    <span class="tok-comment">// nothing swings.</span>
                    <span class="tok-comment">// *** NOT HERE. `balance_hold` is not allocated until further down, so this</span>
                    <span class="tok-comment">// wrote through an undefined slice - a wasm trap, `memory access out of</span>
                    <span class="tok-comment">// bounds`, and the fault I spent a turn attributing to the limb tracking.</span>
                    <span class="tok-comment">// The arms are removed from the servo in the pass below instead, after the</span>
                    <span class="tok-comment">// actuation set exists.</span>
                }
            }
        }
    }
    s.want_cop = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    s.carried_load = <span class="tok-num">0</span>;
    s.balance_plan = <span class="tok-kw">try</span> mpc.BalancePlan.<span class="tok-fn">init</span>(gpa, <span class="tok-num">40</span>);
    <span class="tok-builtin">@memset</span>(s.balance_plan.ctrl, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.balance_plan.reference, <span class="tok-num">0</span>);
    s.com_jac = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, s.imported.model.nv);
    s.com_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, s.imported.model.nv);
    s.balance_hold = <span class="tok-kw">try</span> ctl.Actuation.<span class="tok-fn">init</span>(gpa, &amp;s.imported.model);
    {
        <span class="tok-comment">// * INITIALISED BEFORE THE LOOKUP, NOT BY IT. A `continue` on a missing body leaves</span>
        <span class="tok-comment">// these `undefined`, and an undefined dof index is a wasm trap rather than a wrong</span>
        <span class="tok-comment">// answer - which is a much worse way to find out the name changed.</span>
        s.ankle_foot = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
        s.ankle_dof = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
        s.ankle_roll_dof = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
        s.balance_on = false;
        <span class="tok-kw">const</span> model: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
        <span class="tok-kw">const</span> feet = [<span class="tok-num">2</span>][]<span class="tok-kw">const</span> u8{ <span class="tok-str">"foot_left"</span>, <span class="tok-str">"foot_right"</span> };
        <span class="tok-kw">var</span> found: u32 = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (feet, <span class="tok-num">0</span>..) |name, i| {
            <span class="tok-kw">const</span> foot: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(name) <span class="tok-kw">orelse</span> <span class="tok-kw">continue</span>;
            <span class="tok-kw">if</span> (model.body_jnt_num[foot] == <span class="tok-num">0</span>) {
                <span class="tok-kw">continue</span>;
            }
            <span class="tok-kw">const</span> dof: u32 = model.jnt_dof_adr[model.body_jnt_adr[foot]];
            <span class="tok-kw">if</span> (dof &gt;= model.nv) {
                <span class="tok-kw">continue</span>;
            }
            s.ankle_foot[i] = foot;
            s.ankle_dof[i] = dof;
            s.balance_hold.powered[dof] = false;
            <span class="tok-kw">if</span> (model.body_jnt_num[foot] &gt; <span class="tok-num">1</span>) {
                <span class="tok-kw">const</span> roll: u32 = model.jnt_dof_adr[model.body_jnt_adr[foot] + <span class="tok-num">1</span>];
                <span class="tok-kw">if</span> (roll &lt; model.nv) {
                    s.ankle_roll_dof[i] = roll;
                    <span class="tok-comment">// * AND IT STAYS IN THE POSE SERVO. It is only taken out when the one-leg</span>
                    <span class="tok-comment">// pose is selected, below - a joint that is neither servo'd nor commanded is</span>
                    <span class="tok-comment">// limp, and a limp ankle collapses under a standing robot.</span>
                }
            }
            found += <span class="tok-num">1</span>;
        }
        <span class="tok-comment">// * AND THE ARMS COME OUT OF THE SERVO HERE, once `balance_hold` exists. A joint cannot</span>
        <span class="tok-comment">// be held at an angle and commanded a velocity by two controllers at once - at kp 400</span>
        <span class="tok-comment">// the servo wins and nothing swings.</span>
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..model.nv) |v| {
            <span class="tok-kw">if</span> (s.limb_dof[v]) {
                s.balance_hold.powered[v] = false;
            }
        }
        <span class="tok-comment">// Only offer the mode if both ankles were actually found.</span>
        <span class="tok-comment">// *** OFF BY DEFAULT, AND THAT IS NOT TIMIDITY. Enabled, this traps inside</span>
        <span class="tok-comment">// `addContactRows` - the contact rows overflow, which means the robot is flailing hard</span>
        <span class="tok-comment">// enough to pile up contacts. The headless probe with the SAME control law stands and</span>
        <span class="tok-comment">// survives every push (torso 1.2810, drift 0.016 m), so the law is right and something</span>
        <span class="tok-comment">// about this scene is not: the balls share the model, the scene has its own solver</span>
        <span class="tok-comment">// seam, and the example steps `zp` and `rbt` in an order the probe does not.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// Shipping it default-on would mean shipping a demo that crashes. Shipping it off</span>
        <span class="tok-comment">// leaves the example exactly as it was and the work visible.</span>
        s.balance_on = false;
        s.ankles_ready = found == <span class="tok-num">2</span>;
        s.robot_body_count = model.nbody;
        <span class="tok-kw">if</span> (s.imported.<span class="tok-fn">bodyIndex</span>(ball_names[<span class="tok-num">0</span>])) |first_ball| {
            s.robot_body_count = first_ball;
        }
    }
    s.ik_scratch = <span class="tok-kw">try</span> gpa.<span class="tok-fn">alloc</span>(Vec, ctl.BalancedIk.<span class="tok-fn">scratchSize</span>(&amp;s.imported.model));
    s.hand = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"hand_right"</span>) <span class="tok-kw">orelse</span> <span class="tok-num">1</span>;
    <span class="tok-comment">// Start the goal where the hand already is, so switching IK on changes nothing until a</span>
    <span class="tok-comment">// slider moves - a target that snaps the arm on activation reads as a bug.</span>
    s.ik_goal = s.data.body_xpos[s.hand];
    <span class="tok-kw">const</span> rest_com: Vec = s.data.subtree_com[rbt.world_body];
    s.com_goal = .{ rest_com[<span class="tok-num">0</span>], rest_com[<span class="tok-num">1</span>] };
    s.ik_on = false;
    s.hold_com = true;
    s.ik_error = <span class="tok-num">0</span>;
    s.com_error = <span class="tok-num">0</span>;
    s.pose_label = <span class="tok-str">"standing"</span>;
    s.next_ball = <span class="tok-num">0</span>;
    s.want_throw = false;
    s.accumulator = <span class="tok-num">0</span>;
    s.physics_on = true;
    s.limp = false;
    s.recent_peak_speed = <span class="tok-num">0</span>;
    s.speed_window = <span class="tok-num">0</span>;
    s.kinetic_energy = <span class="tok-num">0</span>;
    s.energy_len = <span class="tok-num">0</span>;
    s.energy_clock = <span class="tok-num">0</span>;
    s.peak_force = <span class="tok-num">0</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">deinit</span>(gpa: Allocator, s: *State) void {
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cylinder);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.sphere);
    z.<span class="tok-fn">unloadMesh</span>(gpa, s.cube);
    s.ui_host.<span class="tok-fn">deinit</span>();
    z.<span class="tok-fn">unloadFont</span>(gpa, s.font);
    gpa.<span class="tok-fn">free</span>(s.ik_scratch);
    s.balance_hold.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.com_scratch);
    gpa.<span class="tok-fn">free</span>(s.com_jac);
    s.balance_plan.<span class="tok-fn">deinit</span>();
    s.arm_act_left.<span class="tok-fn">deinit</span>();
    s.arm_act_right.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.pose_scratch);
    gpa.<span class="tok-fn">free</span>(s.limb_dof);
    gpa.<span class="tok-fn">free</span>(s.mom_s2);
    gpa.<span class="tok-fn">free</span>(s.mom_s1);
    gpa.<span class="tok-fn">free</span>(s.mom_ang);
    gpa.<span class="tok-fn">free</span>(s.mom_lin);
    s.actuation.<span class="tok-fn">deinit</span>();
    gpa.<span class="tok-fn">free</span>(s.home);
    s.bridge.<span class="tok-fn">deinit</span>(&amp;s.world);
    s.world.<span class="tok-fn">deinit</span>(gpa);
    s.data.<span class="tok-fn">deinit</span>();
    s.imported.<span class="tok-fn">deinit</span>();
    s.robot.<span class="tok-fn">deinit</span>();
    s.doc.<span class="tok-fn">deinit</span>();
}

<span class="tok-comment">/// Hold the standing pose.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- * THIS IS NOW THREE LINES, AND THAT IS THE POINT --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// Every demo used to paste its own PD loop, and each one had to remember that gravity</span>
<span class="tok-comment">/// compensation belongs only on ACTUATED degrees of freedom - a rule that produced crates</span>
<span class="tok-comment">/// hanging in mid-air and a Go1 rising at a steady 2.4 m/s before it was written down.</span>
<span class="tok-comment">/// `ctl.Actuation` computes that mask once from the model's topology, so the question is</span>
<span class="tok-comment">/// asked in one place instead of at every call site.</span>
<span class="tok-comment">/// Put the robot back, either at its standing pose or at one of the model's keyframes.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * THE HELD TARGET MOVES WITH IT. Teleporting the body while `home` still describes the old</span>
<span class="tok-comment">/// pose would have the controller immediately drag it back - the robot would flick to the</span>
<span class="tok-comment">/// keyframe and snap away again, which reads as the keyframe being broken.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">restorePose</span>(s: *State, keyframe: ?u32) void {
    <span class="tok-comment">// ** PICKING A POSE TURNS REACHING OFF, because otherwise the pose lasts one frame.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// With IK on, `update` recomputes `home` from the solve EVERY frame. A keyframe press</span>
    <span class="tok-comment">// would set `home`, and the next frame would overwrite it - the button appearing to do</span>
    <span class="tok-comment">// nothing at all, with no error and nothing to see. Two things that both own `home` have</span>
    <span class="tok-comment">// to take turns.</span>
    s.ik_on = false;
    <span class="tok-kw">if</span> (keyframe) |k| {
        <span class="tok-comment">// * THE RESULT IS CHECKED. Discarding it is how every pose button came to do nothing</span>
        <span class="tok-comment">// silently: the keyframe was 28 numbers, the model 70 once the projectiles joined the</span>
        <span class="tok-comment">// tree, and `applyKeyframe` refused. The label still said "holding: squat", which is</span>
        <span class="tok-comment">// worse than no feedback at all.</span>
        s.one_leg = false;
        <span class="tok-kw">if</span> (!rmj.<span class="tok-fn">applyKeyframe</span>(&amp;s.imported.model, &amp;s.data, s.robot.keyframes[k])) {
            s.pose_label = <span class="tok-str">"keyframe REFUSED"</span>;
            <span class="tok-kw">return</span>;
        }
    } <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.one_leg) {
        <span class="tok-fn">buildOneLegPose</span>(s);
    } <span class="tok-kw">else</span> {
        <span class="tok-builtin">@memcpy</span>(s.data.pos, s.imported.model.qpos0);
    }
    <span class="tok-builtin">@memset</span>(s.data.vel, <span class="tok-num">0</span>);
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(&amp;s.imported.model, &amp;s.data);
    <span class="tok-builtin">@memcpy</span>(s.home, s.data.pos);
    s.data.<span class="tok-fn">forgetWarmStart</span>();
    s.peak_force = <span class="tok-num">0</span>;

    <span class="tok-comment">// -- *** THE CONTROLLER HAS STATE TOO, AND IT WAS SURVIVING EVERY RESET --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `solveBalance` WARM-STARTS from `plan.ctrl` - that array is the iterate, not an output.</span>
    <span class="tok-comment">// After a fall it holds whatever extreme pressure and momentum commands the planner reached</span>
    <span class="tok-comment">// while going over, and resetting only the POSE left them there. The first tick on the</span>
    <span class="tok-comment">// fresh pose then applied them.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// That is both reported symptoms at once: "reset does not really reset", because the</span>
    <span class="tok-comment">// controller did not; and "it often explodes", because a stale extreme plan met an upright</span>
    <span class="tok-comment">// robot. Everything the controller accumulates is cleared here.</span>
    <span class="tok-builtin">@memset</span>(s.balance_plan.ctrl, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.balance_plan.reference, <span class="tok-num">0</span>);
    <span class="tok-builtin">@memset</span>(s.data.applied_force, <span class="tok-num">0</span>);
    s.want_cop = .{ <span class="tok-num">0</span>, <span class="tok-num">0</span> };
    s.carried_load = <span class="tok-num">0</span>;
    s.limb_swing = <span class="tok-num">0</span>;
    <span class="tok-comment">// * THE BRIDGE MUST BE TOLD. A keyframe write is a teleport, and a swept contact drawn</span>
    <span class="tok-comment">// across the gap finds the floor and fires the robot away - see `Bridge.teleported`.</span>
    s.bridge.<span class="tok-fn">teleported</span>();
    s.pose_label = <span class="tok-kw">if</span> (keyframe) |k| s.robot.keyframes[k].name <span class="tok-kw">else</span> <span class="tok-kw">if</span> (s.one_leg) <span class="tok-str">"right leg (built)"</span> <span class="tok-kw">else</span> <span class="tok-str">"standing"</span>;
}

<span class="tok-kw">fn</span> <span class="tok-fn">control</span>(s: *State) void {
    <span class="tok-kw">const</span> hold: ctl.PoseHold = .{
        .target = s.home,
        .kp = s.kp,
        .kv = s.kv,
        <span class="tok-comment">// * THE CEILING IS WHAT MAKES THE `kp` SLIDER MEAN ANYTHING. Without it a PD law</span>
        <span class="tok-comment">// produces whatever torque the error demands, and every robot is infinitely strong.</span>
        .max_torque = s.max_torque,
    };
    <span class="tok-comment">// * A RAGDOLL IS THE CONTROLLER NOT RUNNING, not a different model. Every joint is free and</span>
    <span class="tok-comment">// the only forces are gravity and contact - which is the hardest thing a contact solver is</span>
    <span class="tok-comment">// routinely asked to do, because nothing is holding any joint against being pushed.</span>
    <span class="tok-kw">if</span> (s.limp) {
        <span class="tok-kw">return</span>;
    }
    <span class="tok-kw">if</span> (!s.balance_on) {
        hold.<span class="tok-fn">apply</span>(&amp;s.imported.model, &amp;s.data, s.actuation);
        <span class="tok-kw">return</span>;
    }

    <span class="tok-comment">// -- *** THE PLANNER DRIVES THE ANKLES; THE POSE SERVO KEEPS EVERY OTHER JOINT --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// A balancing robot's one real actuator is the centre of pressure: the ankle torque decides</span>
    <span class="tok-comment">// where under the foot the ground's push effectively acts, and that is what accelerates the</span>
    <span class="tok-comment">// mass. `solveBalance` chooses that point over a horizon with the foot's limits built in,</span>
    <span class="tok-comment">// and the ankle simply realises it.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THE TORQUE IS `+0.5 * f_z * (p_want - p_ankle)`, AND THE SIGN WAS READ OFF THE</span>
    <span class="tok-comment">// CONTROLLER THAT ALREADY WORKED rather than argued from a cross product. Standing under</span>
    <span class="tok-comment">// plain `PoseHold` the ankle carries **+7.816 N*m**, and the formula gives **+7.29** -</span>
    <span class="tok-comment">// within 7%. Every earlier attempt used the negative and drove the robot over at every</span>
    <span class="tok-comment">// magnitude and every gain.</span>
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    hold.<span class="tok-fn">apply</span>(m, &amp;s.data, s.balance_hold);

    <span class="tok-comment">// -- *** THE ROBOT'S CENTRE OF MASS, NOT THE SCENE'S --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// `buildScene` appends the throwable balls to the SAME model, so `subtree_com[world_body]`</span>
    <span class="tok-comment">// is the centre of mass of the robot AND every ball - including ones lying on the floor</span>
    <span class="tok-comment">// across the room. Feeding that to a balance planner asks it to stand a robot over a point</span>
    <span class="tok-comment">// that has nothing to do with the robot, and the ensuing flailing overflowed the contact</span>
    <span class="tok-comment">// rows outright.</span>
    <span class="tok-kw">var</span> com: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">var</span> com_vel: Vec = <span class="tok-fn">vec</span>(<span class="tok-num">0</span>, <span class="tok-num">0</span>, <span class="tok-num">0</span>);
    <span class="tok-kw">var</span> robot_mass: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">1</span>..s.robot_body_count) |b| {
        <span class="tok-kw">const</span> mass: f32 = m.body_mass[b];
        <span class="tok-kw">if</span> (mass &lt;= <span class="tok-num">0</span>) {
            <span class="tok-kw">continue</span>;
        }
        com += s.data.body_xipos[b] * <span class="tok-fn">splat</span>(mass);
        robot_mass += mass;
    }
    <span class="tok-kw">if</span> (robot_mass &lt;= <span class="tok-num">0</span>) {
        <span class="tok-kw">return</span>;
    }
    com *= <span class="tok-fn">splat</span>(<span class="tok-num">1.0</span> / robot_mass);
    ctl.<span class="tok-fn">comJacobian</span>(m, &amp;s.data, s.com_jac, s.com_scratch);
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.robot_dof_count) |v| {
        com_vel += s.com_jac[v] * <span class="tok-fn">splat</span>(s.data.vel[v]);
    }

    <span class="tok-kw">var</span> x: [mpc.lipm_state_dim]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>);
    x[mpc.lipm_com_offset] = com[<span class="tok-num">0</span>];
    x[mpc.lipm_com_offset + <span class="tok-num">1</span>] = com[<span class="tok-num">1</span>];
    x[mpc.lipm_vel_offset] = com_vel[<span class="tok-num">0</span>];
    x[mpc.lipm_vel_offset + <span class="tok-num">1</span>] = com_vel[<span class="tok-num">1</span>];
    _ = mpc.<span class="tok-fn">solveBalance</span>(
        .{ .mass = robot_mass, .height = <span class="tok-builtin">@max</span>(<span class="tok-num">0.3</span>, com[<span class="tok-num">2</span>]), .gravity = <span class="tok-num">9.81</span> },
        &amp;s.balance_plan,
        &amp;x,
        <span class="tok-fn">balanceWeights</span>(),
        .{ .foot_half = .{ <span class="tok-num">0.09</span>, <span class="tok-num">0.08</span> }, .max_momentum_rate = s.momentum_rate },
        <span class="tok-num">0.02</span>,
        <span class="tok-num">2</span>,
    );
    s.want_cop = .{ <span class="tok-fn">plan_cop</span>(&amp;s.balance_plan, <span class="tok-num">0</span>), <span class="tok-fn">plan_cop</span>(&amp;s.balance_plan, <span class="tok-num">1</span>) };

    <span class="tok-comment">// * THE LOAD IS THE SUM OF ALL FOUR ROWS PER CONTACT. `rows_per_contact` is a pyramid</span>
    <span class="tok-comment">// friction basis, not `[normal, tangent, tangent, ...]` - row 0 alone reads exactly a FIFTH of</span>
    <span class="tok-comment">// the weight, measured, and a command scaled by a fifth cannot hold a robot up.</span>
    <span class="tok-kw">var</span> carried: f32 = <span class="tok-num">0</span>;
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..s.data.contact_count) |c| {
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..rbt.rows_per_contact) |r| {
            carried += s.data.constraint_force[c * rbt.rows_per_contact + r];
        }
    }
    <span class="tok-comment">// -- *** THE LOAD IS BOUNDED BY THE ROBOT'S WEIGHT, NOT BY WHAT THE SOLVER REPORTS --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The ankle torque is `f_z * lever`, so it scales directly with this number. During an</span>
    <span class="tok-comment">// impact the contact solver legitimately reports several times the weight for a few ticks -</span>
    <span class="tok-comment">// and the ankle command then multiplies by that, which drives the joint far harder than</span>
    <span class="tok-comment">// anything standing requires. That is a feedback loop with a spike in it.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Standing, the load IS the weight; anything above about twice it is a transient the</span>
    <span class="tok-comment">// balance controller should not be amplifying.</span>
    carried = <span class="tok-fn">clamp</span>(carried, <span class="tok-num">0.0</span>, <span class="tok-num">2.0</span> * robot_mass * <span class="tok-num">9.81</span>);
    s.carried_load = carried;

    <span class="tok-comment">// -- *** THE MOMENTUM COMMAND, TURNED INTO LIMB MOTION --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The planner asks for an angular momentum; the limbs have to carry it.</span>
    <span class="tok-comment">// `A_G_limbs * q_dot = L` says which limb velocities do, and the least-norm answer is</span>
    <span class="tok-comment">// `q_dot = A^T(A*A^T)^-1*L` - a 3x3 solve.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * VELOCITY, NOT TORQUE, and that distinction is the physics. Internal joint torques cannot</span>
    <span class="tok-comment">// change total angular momentum - Newton's third law, and the conservation test in</span>
    <span class="tok-comment">// `robot_control.zig` proves it. The limbs are a momentum SINK: the GROUND supplies the</span>
    <span class="tok-comment">// momentum through the tangential contact force, and the arms decide whether it lands in</span>
    <span class="tok-comment">// them or in the trunk. Asking them to MOVE at the rate that holds it is the honest</span>
    <span class="tok-comment">// statement of that job.</span>
    <span class="tok-kw">if</span> (s.momentum_rate &gt; <span class="tok-num">0</span>) {
        <span class="tok-comment">// -- *** THE MOMENTUM, NOT THE RATE. THIS WAS A UNITS ERROR --</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// `ctrl[rate_offset]` is `L_dot`, in kg*m^2/s^2. The map `A_G*q_dot = L` wants a MOMENTUM, in</span>
        <span class="tok-comment">// kg*m^2/s. Feeding one into the other is dimensionally wrong and no scale factor</span>
        <span class="tok-comment">// repairs it - the 0.25 that used to sit here was a number picked to make the magnitude</span>
        <span class="tok-comment">// look plausible.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// The plan's STATE carries the momentum it intends to be holding. That is the target.</span>
        <span class="tok-comment">// * AND THE INDEX IS CHECKED. `states` is `(horizon + 1) x state_dim`; reading knot 1</span>
        <span class="tok-comment">// needs at least two knots, which a horizon of 40 has - but an out-of-bounds read here</span>
        <span class="tok-comment">// is a wasm trap, not a wrong number, so it is worth the branch.</span>
        <span class="tok-kw">const</span> next: usize = mpc.lipm_state_dim;
        <span class="tok-kw">if</span> (s.balance_plan.states.len &lt; next + mpc.lipm_state_dim) {
            <span class="tok-kw">return</span>;
        }
        <span class="tok-kw">const</span> want_x: f32 = s.balance_plan.states[next + mpc.lipm_momentum_offset];
        <span class="tok-kw">const</span> want_y: f32 = s.balance_plan.states[next + mpc.lipm_momentum_offset + <span class="tok-num">1</span>];
        ctl.<span class="tok-fn">centroidalMomentum</span>(m, &amp;s.data, s.mom_lin, s.mom_ang, s.mom_s1, s.mom_s2);
        <span class="tok-kw">var</span> gram: [<span class="tok-num">9</span>]f32 = <span class="tok-builtin">@splat</span>(<span class="tok-num">0</span>);
        <span class="tok-comment">// * `inline` BECAUSE A VECTOR INDEX MUST BE COMPTIME. `mom_ang[v]` is a `Vec`, and</span>
        <span class="tok-comment">// indexing it with a runtime loop counter does not compile - the loops over the three</span>
        <span class="tok-comment">// momentum axes have to be unrolled.</span>
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">3</span>) |a| {
            <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">3</span>) |b| {
                <span class="tok-kw">var</span> sum: f32 = <span class="tok-num">0</span>;
                <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.nv) |v| {
                    <span class="tok-kw">if</span> (!s.limb_dof[v]) {
                        <span class="tok-kw">continue</span>;
                    }
                    sum += s.mom_ang[v][a] * s.mom_ang[v][b];
                }
                gram[a * <span class="tok-num">3</span> + b] = sum;
            }
        }
        <span class="tok-kw">const</span> ridge: f32 = <span class="tok-num">1.0e-4</span> * (<span class="tok-builtin">@abs</span>(gram[<span class="tok-num">0</span>]) + <span class="tok-builtin">@abs</span>(gram[<span class="tok-num">4</span>]) + <span class="tok-builtin">@abs</span>(gram[<span class="tok-num">8</span>]) + <span class="tok-num">1.0</span>);
        gram[<span class="tok-num">0</span>] += ridge;
        gram[<span class="tok-num">4</span>] += ridge;
        gram[<span class="tok-num">8</span>] += ridge;
        <span class="tok-kw">var</span> lambda: [<span class="tok-num">3</span>]f32 = .{ want_x, want_y, <span class="tok-num">0</span> };
        <span class="tok-kw">if</span> (ctl.<span class="tok-fn">solve3Pub</span>(&amp;gram, &amp;lambda)) {
            <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.nv) |v| {
                <span class="tok-kw">if</span> (!s.limb_dof[v]) {
                    <span class="tok-kw">continue</span>;
                }
                <span class="tok-comment">// * CLAMPED TO WHAT AN ARM CAN ACTUALLY DO. Eight rad/s is a fast swing; the</span>
                <span class="tok-comment">// unclamped map cheerfully asks for fifty when the plan wants more momentum</span>
                <span class="tok-comment">// than the body owns, and a tracker chasing that is the explosion.</span>
                <span class="tok-kw">const</span> raw: f32 = lambda[<span class="tok-num">0</span>] * s.mom_ang[v][<span class="tok-num">0</span>] +
                    lambda[<span class="tok-num">1</span>] * s.mom_ang[v][<span class="tok-num">1</span>] + lambda[<span class="tok-num">2</span>] * s.mom_ang[v][<span class="tok-num">2</span>];
                <span class="tok-kw">const</span> want_qvel: f32 = <span class="tok-fn">clamp</span>(raw, -<span class="tok-num">8.0</span>, <span class="tok-num">8.0</span>);
                <span class="tok-comment">// * AND THE GAIN IS BOUNDED BY THE JOINT, NOT CHOSEN. Explicit PD needs roughly</span>
                <span class="tok-comment">// `kd*dt/I &lt; 2`; the smallest limb inertia here is **0.068** (forearm), so at</span>
                <span class="tok-comment">// 1/500 the ceiling is 68. Twenty leaves real margin.</span>
                <span class="tok-comment">//</span>
                <span class="tok-comment">// The weak position term stops the arms drifting away for good once the</span>
                <span class="tok-comment">// momentum command returns to zero - without it they keep whatever pose the</span>
                <span class="tok-comment">// last swing left them in.</span>
                <span class="tok-comment">// * NO POSTURE TERM. Mapping a velocity dof back to its position index via</span>
                <span class="tok-comment">// `dof_jnt` reached out of bounds - and the arms do not need it: when the</span>
                <span class="tok-comment">// momentum command returns to zero the velocity target does too, and the</span>
                <span class="tok-comment">// damping brings them to rest. A pose pull is a nicety; correctness is not.</span>
                s.data.applied_force[v] += <span class="tok-fn">clamp</span>(
                    <span class="tok-num">20.0</span> * (want_qvel - s.data.vel[v]),
                    -<span class="tok-num">60.0</span>,
                    <span class="tok-num">60.0</span>,
                );
            }
        }
        <span class="tok-kw">var</span> swing: f32 = <span class="tok-num">0</span>;
        <span class="tok-kw">for</span> (<span class="tok-num">0</span>..m.nq) |q| {
            swing = <span class="tok-builtin">@max</span>(swing, <span class="tok-builtin">@abs</span>(s.data.pos[q] - s.home[q]));
        }
        s.limb_swing = swing;
    }

    <span class="tok-comment">// -- *** BOTH ANKLES. LATERAL IS THE HARD DIRECTION ON ONE LEG --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// The foot is 0.21 m long and **0.06 m wide**, so sideways there is barely any polygon to</span>
    <span class="tok-comment">// move the pressure inside - and only the PITCH ankle was ever driven, leaving that axis</span>
    <span class="tok-comment">// completely uncontrolled. Measured on the built one-leg pose: pitch alone gives a tilt of</span>
    <span class="tok-comment">// 2.45 rad, both ankles **0.16**. It stops tipping over entirely.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THE ROLL SIGN WAS MEASURED, NOT DERIVED: -1 gives 0.156, +1 gives 1.744, zero gives</span>
    <span class="tok-comment">// 1.994. Same technique as the pitch ankle, where reading the working controller's torque</span>
    <span class="tok-comment">// settled in one print what several turns of cross-product argument had not.</span>
    <span class="tok-kw">const</span> share: f32 = <span class="tok-kw">if</span> (s.one_leg) <span class="tok-num">1.0</span> <span class="tok-kw">else</span> <span class="tok-num">0.5</span>;
    <span class="tok-kw">for</span> (s.ankle_dof, s.ankle_roll_dof, s.ankle_foot) |dof, roll_dof, foot| {
        <span class="tok-kw">const</span> lever_x: f32 = s.want_cop[<span class="tok-num">0</span>] - s.data.body_xpos[foot][<span class="tok-num">0</span>];
        <span class="tok-kw">const</span> lever_y: f32 = s.want_cop[<span class="tok-num">1</span>] - s.data.body_xpos[foot][<span class="tok-num">1</span>];
        s.data.applied_force[dof] = share * carried * lever_x - s.ankle_damping * s.data.vel[dof];
        <span class="tok-comment">// *** ROLL ONLY ON ONE LEG. With TWO feet down, the lateral centre of pressure is set by</span>
        <span class="tok-comment">// how the load SPLITS BETWEEN THE FEET - a 0.3 m stance width - not by rolling either</span>
        <span class="tok-comment">// ankle inside its own 0.06 m sole. Commanding roll there fights a stance that was</span>
        <span class="tok-comment">// already fine, and it broke a two-footed stand that had been holding at torso 1.2810</span>
        <span class="tok-comment">// across six pushes.</span>
        <span class="tok-comment">//</span>
        <span class="tok-comment">// On one leg it is the only lateral authority there is, and worth 2.45 rad of tilt.</span>
        <span class="tok-kw">if</span> (s.one_leg <span class="tok-kw">and</span> roll_dof &lt; m.nv) {
            s.data.applied_force[roll_dof] = -share * carried * lever_y -
                s.ankle_damping * s.data.vel[roll_dof];
        }
    }
}

<span class="tok-kw">fn</span> <span class="tok-fn">plan_cop</span>(plan: *<span class="tok-kw">const</span> mpc.BalancePlan, axis: usize) f32 {
    <span class="tok-kw">return</span> plan.ctrl[mpc.lipm_cop_offset + axis];
}

<span class="tok-comment">/// Cost weights for the balancing planner, in state order</span>
<span class="tok-comment">/// `[com_x, com_y, vel_x, vel_y, momentum_x, momentum_y]`.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">balanceWeights</span>() mpc.Weights {
    <span class="tok-comment">// *** THE MOMENTUM WEIGHT IS THE ONLY BRAKE ON HOW MUCH THE PLANNER SPENDS. Excursion is a</span>
    <span class="tok-comment">// STATE limit and `boxQP` bounds controls only, so there is no constraint to write - the</span>
    <span class="tok-comment">// cost is the whole mechanism. At 0.02 the planner treated momentum as nearly free and</span>
    <span class="tok-comment">// planned 16.4 kg*m^2/s, which is 2.1x what two arms can carry. Raising it to 2.0 keeps the</span>
    <span class="tok-comment">// plan inside the body: measured, a 0.3 m/s push then peaks at 0.54.</span>
    <span class="tok-kw">const</span> state_w = [_]f32{ <span class="tok-num">400</span>, <span class="tok-num">400</span>, <span class="tok-num">40</span>, <span class="tok-num">40</span>, <span class="tok-num">2.0</span>, <span class="tok-num">2.0</span> };
    <span class="tok-kw">const</span> control_w = [_]f32{ <span class="tok-num">1.0</span>, <span class="tok-num">1.0</span>, <span class="tok-num">0.002</span>, <span class="tok-num">0.002</span> };
    <span class="tok-kw">const</span> terminal_w = [_]f32{ <span class="tok-num">4000</span>, <span class="tok-num">4000</span>, <span class="tok-num">400</span>, <span class="tok-num">400</span>, <span class="tok-num">20.0</span>, <span class="tok-num">20.0</span> };
    <span class="tok-kw">const</span> holder = <span class="tok-kw">struct</span> {
        <span class="tok-kw">const</span> s = state_w;
        <span class="tok-kw">const</span> c = control_w;
        <span class="tok-kw">const</span> t = terminal_w;
    };
    <span class="tok-kw">return</span> .{ .state = &amp;holder.s, .control = &amp;holder.c, .terminal = &amp;holder.t };
}

<span class="tok-comment">/// Throw a ball at the robot, from wherever the camera is looking from.</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// * AIMED FROM THE CAMERA, so "throw" means what it looks like it means: the ball leaves the</span>
<span class="tok-comment">/// viewer's position and travels toward the robot's centre. A fixed launch direction would be</span>
<span class="tok-comment">/// unusable the moment the view is orbited, which on a phone is immediately.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">throwBall</span>(s: *State, cam: Camera3D) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> body: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(ball_names[s.next_ball]) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    s.next_ball = (s.next_ball + <span class="tok-num">1</span>) % ball_count;

    <span class="tok-comment">// -- ** FROM THE EYE, ALONG THE VIEW - not at a fixed point --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// This aimed at `(0, 0, 0.25)` regardless of where the camera was pointing, so every throw</span>
    <span class="tok-comment">// curved back toward the robot however you had orbited. That is a fine turret and a poor</span>
    <span class="tok-comment">// projectile: you cannot miss with it, and missing is most of what makes throwing things</span>
    <span class="tok-comment">// at a robot informative.</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// * THE CAMERA IS Y-UP AND THE SIMULATION IS Z-UP. The demo draws through</span>
    <span class="tok-comment">// `rotationX(-90 deg)`, which sends sim `(x, y, z)` to display `(x, z, -y)`; going back is</span>
    <span class="tok-comment">// therefore display `(X, Y, Z)` to sim `(X, -Z, Y)`. Both the eye and the direction need</span>
    <span class="tok-comment">// it - converting only the position gives a ball that starts in the right place and flies</span>
    <span class="tok-comment">// somewhere else entirely.</span>
    <span class="tok-kw">const</span> toSim = <span class="tok-kw">struct</span> {
        <span class="tok-kw">fn</span> <span class="tok-fn">go</span>(v: Vec) Vec {
            <span class="tok-kw">return</span> <span class="tok-fn">vec</span>(v[<span class="tok-num">0</span>], -v[<span class="tok-num">2</span>], v[<span class="tok-num">1</span>]);
        }
    }.go;
    <span class="tok-kw">const</span> eye: Vec = <span class="tok-fn">toSim</span>(cam.position);
    <span class="tok-kw">const</span> aim: Vec = <span class="tok-fn">normalize3</span>(<span class="tok-fn">toSim</span>(cam.target) - eye);

    <span class="tok-comment">// * NUDGED FORWARD BY THE BALL'S OWN RADIUS, and no more. Starting exactly at the eye puts</span>
    <span class="tok-comment">// the ball on the near plane where it is clipped, so the throw looks like it produced</span>
    <span class="tok-comment">// nothing until the ball is already halfway to the robot.</span>
    <span class="tok-kw">const</span> from: Vec = eye + aim * <span class="tok-fn">splat</span>(ball_radius);

    <span class="tok-kw">const</span> j: u32 = m.body_jnt_adr[body];
    <span class="tok-kw">const</span> q: u32 = m.jnt_qpos_adr[j];
    <span class="tok-kw">const</span> v: u32 = m.jnt_dof_adr[j];
    s.data.pos[q + <span class="tok-num">0</span>] = from[<span class="tok-num">0</span>];
    s.data.pos[q + <span class="tok-num">1</span>] = from[<span class="tok-num">1</span>];
    s.data.pos[q + <span class="tok-num">2</span>] = from[<span class="tok-num">2</span>];
    s.data.pos[q + <span class="tok-num">3</span>] = <span class="tok-num">0</span>;
    s.data.pos[q + <span class="tok-num">4</span>] = <span class="tok-num">0</span>;
    s.data.pos[q + <span class="tok-num">5</span>] = <span class="tok-num">0</span>;
    s.data.pos[q + <span class="tok-num">6</span>] = <span class="tok-num">1</span>;
    <span class="tok-builtin">@memset</span>(s.data.vel[v..][<span class="tok-num">0</span>..<span class="tok-num">6</span>], <span class="tok-num">0</span>);
    <span class="tok-kw">const</span> speed: f32 = <span class="tok-num">4.5</span>;
    s.data.vel[v + <span class="tok-num">0</span>] = aim[<span class="tok-num">0</span>] * speed;
    s.data.vel[v + <span class="tok-num">1</span>] = aim[<span class="tok-num">1</span>] * speed;
    s.data.vel[v + <span class="tok-num">2</span>] = aim[<span class="tok-num">2</span>] * speed;
    s.data.stage = .stale;
    <span class="tok-comment">// * The warm start describes contacts that no longer exist for this body - see</span>
    <span class="tok-comment">// `Data.forgetWarmStart`. Cheap, and the alternative is an impulse from a different scene.</span>
    s.data.<span class="tok-fn">forgetWarmStart</span>();
}

<span class="tok-comment">/// Build a stand-on-the-right-leg pose: left leg lifted, arms out at 45 degrees, and the centre</span>
<span class="tok-comment">/// of mass placed exactly over the support foot. Writes into `out` (length `nq`).</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// -- *** WHY PROCEDURAL RATHER THAN THE SHIPPED KEYFRAME --</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// `stand_on_left_leg` puts the mass **0.040 m** from its foot, so a balance controller opens by</span>
<span class="tok-comment">/// fighting an offset instead of at equilibrium. And it keeps the arms at the sides, where the</span>
<span class="tok-comment">/// flywheel is worth far less than it could be. Measured on this model:</span>
<span class="tok-comment">///</span>
<span class="tok-comment">///     arms EXTENDED   15.54 kg*m^2/s   -&gt; arrests 0.428 m/s</span>
<span class="tok-comment">///     arms folded      7.92 kg*m^2/s   -&gt; arrests 0.218 m/s</span>
<span class="tok-comment">///</span>
<span class="tok-comment">/// **Nearly double**, because the orbital part of the angular momentum goes as `m*r^2*omega` and</span>
<span class="tok-comment">/// extending the arm takes `r` from about 0.3 m to 0.6. The arms ARE the flywheel, and folded</span>
<span class="tok-comment">/// arms throw most of it away.</span>
<span class="tok-kw">fn</span> <span class="tok-fn">buildOneLegPose</span>(s: *State) void {
    <span class="tok-kw">const</span> m: *<span class="tok-kw">const</span> rbt.Model = &amp;s.imported.model;
    <span class="tok-kw">const</span> right_foot: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"foot_right"</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">const</span> hand_right: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"hand_right"</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">const</span> hand_left: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"hand_left"</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">const</span> arm_r: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"upper_arm_right"</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">const</span> arm_l: u32 = s.imported.<span class="tok-fn">bodyIndex</span>(<span class="tok-str">"upper_arm_left"</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>;
    <span class="tok-kw">const</span> root: u32 = m.jnt_qpos_adr[<span class="tok-num">0</span>];

    <span class="tok-comment">// * LEAVES THE POSE IN `data.pos` RATHER THAN RESTORING. An earlier version saved the</span>
    <span class="tok-comment">// current pose into `pose_scratch` and restored on exit - then the caller passed</span>
    <span class="tok-comment">// `pose_scratch` as the OUTPUT, so the save buffer and the result were the same array. It</span>
    <span class="tok-comment">// happened to work and was one edit away from not. The only caller is `restorePose`, which</span>
    <span class="tok-comment">// wants the pose applied anyway.</span>
    <span class="tok-builtin">@memcpy</span>(s.data.pos, m.qpos0);
    <span class="tok-comment">// Lift the left leg clear.</span>
    <span class="tok-fn">setJoint</span>(s, <span class="tok-str">"hip_y_left"</span>, -<span class="tok-num">0.85</span>);
    <span class="tok-fn">setJoint</span>(s, <span class="tok-str">"knee_left"</span>, -<span class="tok-num">1.30</span>);
    <span class="tok-fn">setJoint</span>(s, <span class="tok-str">"hip_x_left"</span>, -<span class="tok-num">0.10</span>);
    s.data.stage = .stale;
    rbt.<span class="tok-fn">forward</span>(m, &amp;s.data);

    <span class="tok-comment">// -- *** THE STANCE COMES FIRST, THE ARMS LAST --</span>
    <span class="tok-comment">//</span>
    <span class="tok-comment">// Levelling rotates the WHOLE robot, so anything placed in world coordinates before it is</span>
    <span class="tok-comment">// rotated too. Reaching first left the arms visibly lopsided - right hand at z 1.166, left</span>
    <span class="tok-comment">// at 1.677, from a step meant to be symmetric. Settle the stance, then reach: the targets</span>
    <span class="tok-comment">// are relative to the shoulders, so they land right the first time.</span>
    <span class="tok-comment">// * AND A 2x2 NEWTON PUTS THE MASS OVER THE FOOT. Translating the root moves foot and mass</span>
    <span class="tok-comment">// together, so their offset is set by the joints alone - `hip_x` swings it sideways,</span>
    <span class="tok-comment">// `hip_y` fore-and-aft. Measured, this converges in ONE step to 0.6 mm.</span>
    <span class="tok-kw">const</span> hip_x: u32 = m.jnt_qpos_adr[<span class="tok-fn">jointIndex</span>(s, <span class="tok-str">"hip_x_right"</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>];
    <span class="tok-kw">const</span> hip_y: u32 = m.jnt_qpos_adr[<span class="tok-fn">jointIndex</span>(s, <span class="tok-str">"hip_y_right"</span>) <span class="tok-kw">orelse</span> <span class="tok-kw">return</span>];
    <span class="tok-kw">for</span> (<span class="tok-num">0</span>..<span class="tok-num">14</span>) |_| {
        <span class="tok-fn">settleFoot</span>(s, right_foot);
        <span class="tok-kw">const</span> err: [<span class="tok-num">2</span>]f32 = <span class="tok-fn">comOverFoot</span>(s, right_foot);
        <span class="tok-kw">if</span> (<span class="tok-builtin">@sqrt</span>(err[<span class="tok-num">0</span>] * err[<span class="tok-num">0</span>] + err[<span class="tok-num">1</span>] * err[<span class="tok-num">1</span>]) &lt; <span class="tok-num">0.003</span>) {
            <span class="tok-kw">break</span>;
        }
        <span class="tok-kw">var</span> jac: [<span class="tok-num">4</span>]f32 = undefined;
        <span class="tok-kw">const</span> eps: f32 = <span class="tok-num">0.01</span>;
        <span class="tok-kw">inline</span> <span class="tok-kw">for</span> (.{ hip_x, hip_y }, <span class="tok-num">0</span>..) |q, col| {
            <span class="tok-kw">const</span> keep: f32 = s.data.pos[q];
            s.data.pos[q] = keep + eps;
            <span class="tok-fn">settleFoot</span>(s, right_foot);
            <span class="tok-kw">const</span> moved: [<span class="tok-num">2</span>]f32 = <span class="tok-fn">comOverFoot</span>(s, right_foot);
            jac[<span class="tok-num">0</span> * <span class="tok-num">2</span> + col] = (moved[<span class="tok-num">0</span>] - err[<span class="tok-num">0</span>]) / eps;
            jac[<span class="tok-num">1</span> * <span class="tok-num">2</span> + col] = (moved[<span class="tok-num">1</span>] - err[<span class="tok-num">1</span>]) / eps;
            s.data.pos[q] = keep;
        }
        <span class="tok-kw">const</span> det: f32 = jac[<span class="tok-num">0</span>] * jac[<span class="tok-num">3</span>] - jac[<span class="tok-num">1</span>] * jac[<span class="tok-num">2</span>];
        <span class="tok-kw">if</span> (<span class="tok-builtin">@abs</span>(det) &lt; <span class="tok-num">1.0e-6</span>) {
            <span class="tok-kw">break</span>;
        }
        <span class="tok-kw">const</span> dx: f32 = (-err[<span class="tok-num">0</span>] * jac[<span class="tok-num">3</span>] + err[<span class="tok-num">1</span>] * jac[<span class="tok-num">1</span>]) / det;
        <span class="tok-kw">const</span> dy: f32 = (-jac[<span class="tok-num">0</span>] * err[<span class="tok-num">1</span>] + jac[<span class="tok-num">2</span>] * err[<span class="tok-num">0</span>]) / det;
        s.data.pos[hip_x] = <span class="tok-fn">clamp</span>(s.data.pos[hip_x] + <span class="tok-fn">clamp</span>(dx, -<span class="tok-num">0.15</span>, <span class="tok-num">0.15</span>), -<span class="tok-num">0.52</span>, <span class="tok-num">0.17</span>);
